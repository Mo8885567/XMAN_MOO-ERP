  // ═══════════════════════════════════════════════════════════════
  // [PERF-LAZY-LOAD] تحميل مرحلي لباقي موديولات النظام بعد اللوجين
  // ═══════════════════════════════════════════════════════════════
  // المشكلة اللي بيحلّها الكود ده: doGet كان بيحقن ~6.5 ميجا نص
  // (كل ملفات الـ CSS/JS لكل موديولات النظام) في نفس صفحة اللوجين
  // من الأول. بما إن HtmlService مبيعملش streaming، المتصفح ما
  // بيرسمش ولا حاجة (ولا حتى شاشة الـ Splash) لحد ما السيرفر يخلص
  // بناء الصفحة الضخمة دي ويبعتها كاملة — ده كان بيسبب شاشة سودا
  // تفضل لعدة ثواني قبل ما اللوجين يظهر.
  //
  // الحل: Index.html بقى بيحقن بس الملفات الضرورية لشاشة اللوجين
  // والـ Shell الأساسي، وباقي كل الموديولات (المحاسبة/HR/التصنيع/
  // الفواتير/الواتساب...) بتتحمل من هنا (getLazyAppBundle في
  // Code_12_Core.gs) في الخلفية، بمجرد ما الصفحة تترسم — يعني
  // غالبًا وهي المستخدم لسه بيكتب بياناته في شاشة اللوجين، فبيكون
  // التحميل خلص خلاص لما يضغط "دخول".
  //
  // window.__LAZY_READY__ : true بعد ما الحزمة المؤجلة تتحقن بنجاح.
  // window.__LAZY_PENDING_CB__ : طابور callbacks تتنفذ أوتوماتيك
  //   بمجرد ما التحميل يخلص (مستخدمة من renderPage() تحت).
  function _loadLazyAppBundle() {
    if (window.__LAZY_READY__ || window.__LAZY_LOADING__) return;
    window.__LAZY_LOADING__ = true;

    // [FIX-LAZY-TIMEOUT-RETRY-2026-08-02] قبل كده أي فشل (خصوصًا timeout
    // الـ 25 ثانية الافتراضي) كان بيخلي _finish() تعلّم __LAZY_READY__ = true
    // فورًا وكأن التحميل نجح، فالدوال المتوقّع حقنها (زي _renderSidebarBrand)
    // كانت تفضل مش معرّفة والنظام يكسر بـ ReferenceError بعد أول لوجين
    // مباشرة. دلوقتي: لو فشل الطلب، بنعيد المحاولة تلقائيًا (لحد 3 محاولات
    // كلها) قبل ما نستسلم فعليًا؛ غالبًا الفشل بيكون بطء شبكة/سيرفر مؤقت.
    var _lazyAttempt = 0;
    var _lazyMaxAttempts = 3;

    function _finish(errMsg) {
      window.__LAZY_READY__ = true;
      window.__LAZY_LOADING__ = false;
      if (errMsg) console.warn("Lazy bundle load issue:", errMsg);
      var queue = window.__LAZY_PENDING_CB__ || [];
      window.__LAZY_PENDING_CB__ = [];
      queue.forEach(function (cb) {
        try {
          cb();
        } catch (e) {
          console.warn("Lazy pending callback error:", e);
        }
      });
    }

    function _attempt() {
      _lazyAttempt++;
      // [GSR-UNIFY] بقى بيمر عبر _gsr() الموحّدة (31_JS_DataLayer.html، متحمّلة
      // eager قبل هذا الملف مباشرة في Index.html) بدل google.script.run مباشر،
      // عشان يستفيد من retry/timeout/error-handling الموحّد زي كل نداءات النظام.
      try {
        _gsr("getLazyAppBundle", null, {
          label: "getLazyAppBundle (محاولة " + _lazyAttempt + ")",
          onSuccess: function (result) {
            var bundle = result && result.data;
            try {
              if (bundle && bundle.css) {
                var styleEl = document.createElement("style");
                styleEl.setAttribute("data-lazy-bundle", "css");
                styleEl.textContent = bundle.css;
                document.head.appendChild(styleEl);
              }
              // [FIX-AUDIT-2026] بعض الملفات فيها عناصر HTML حقيقية (زي
              // <template id="tpl-upload-modal">) لازم تتحقن كـ DOM فعلي
              // مش كنص جوه سكريبت — لازم تتحقن قبل الـ JS اللي بيدور عليها.
              if (bundle && bundle.html) {
                document.body.insertAdjacentHTML("beforeend", bundle.html);
              }
              if (bundle && bundle.js) {
                var scriptEl = document.createElement("script");
                scriptEl.setAttribute("data-lazy-bundle", "js");
                scriptEl.textContent = bundle.js;
                document.body.appendChild(scriptEl);
              }
              _finish();
            } catch (e) {
              // ✅ حتى لو حصل خطأ جزئي في الحقن، لازم نفك القفل عشان
              // المستخدم يقدر يكمل (بدل ما يفضل عالق على "جاري التجهيز")
              _finish("inject error: " + e.message);
            }
          },
          onError: function (result) {
            if (_lazyAttempt < _lazyMaxAttempts) {
              // إعادة محاولة بعد تأخير بسيط بدل الاستسلام على أول فشل
              setTimeout(_attempt, 1500 * _lazyAttempt);
              return;
            }
            _finish(
              "_gsr error after " +
                _lazyAttempt +
                " attempts: " +
                (result && result.message),
            );
          },
        });
      } catch (e) {
        if (_lazyAttempt < _lazyMaxAttempts) {
          setTimeout(_attempt, 1500 * _lazyAttempt);
          return;
        }
        _finish("exception: " + e.message);
      }
    }

    _attempt();
  }

  // ✅ نبدأ التحميل فورًا مع أول DOMContentLoaded (بالتوازي مع ظهور
  // شاشة اللوجين) — راجع استدعاء _loadLazyAppBundle() في بداية
  // Bootstrap تحت.

  // ✅ [PERF-LAZY-LOAD] بينتظر جاهزية الحزمة المؤجلة قبل تنفيذ أي
  // كود محتاج موديولات لسه متحملتش، وبيعرض overlay التحميل الموجود
  // أصلاً (_showAppLoader) بدل ما يفضل عالق أو يرمي ReferenceError.
  function _whenLazyReady(cb) {
    if (window.__LAZY_READY__) {
      cb();
    } else {
      window.__LAZY_PENDING_CB__ = window.__LAZY_PENDING_CB__ || [];
      window.__LAZY_PENDING_CB__.push(cb);
    }
  }

  /**
   * هل المستخدم الحالي لديه صلاحية لعملية معينة؟
   * @param {string} action - اسم العملية (مثال: "deleteItem")
   * @returns {boolean}
   */
  function canDo(action) {
    if (!APP.currentUser) return false;

    var role = String(APP.currentUser.role || "viewer");

    // ✅ BUG-5 FIX: استخدم effectivePermissions لو متاحة (تشمل overrides من الـ backend)
    // قبل الإصلاح: كان بيعتمد على ROLE_PERMISSIONS الثابتة فقط ويتجاهل extra/denied
    if (
      APP.currentUser.effectivePermissions &&
      Array.isArray(APP.currentUser.effectivePermissions)
    ) {
      if (APP.currentUser.effectivePermissions.indexOf(action) !== -1)
        return true;
      // ✅ [FIX-ADMIN-LOCK] لو الدور admin والصلاحية غير موجودة في effectivePermissions
      // (مثلاً لأن الكاش في الباك إند لسه قديم بعد إضافة صلاحية جديدة، أو القائمة
      // الثابتة ROLE_PERMISSIONS.admin مش متزامنة 100% مع ALL_PERMISSIONS)، الأدمن
      // بحكم تعريفه لازم يكون عنده كل الصلاحيات دايماً ولا يتحجب عن أي شاشة جديدة.
      if (role === "admin") return true;
      return false;
    }

    // fallback للـ ROLE_PERMISSIONS لو effectivePermissions مش موجودة أصلاً
    if (role === "admin") return true; // الأدمن دايماً صاحب كل الصلاحيات
    var perms = ROLE_PERMISSIONS[role] || [];
    return perms.indexOf(action) !== -1;
  }

  /**
   * يخفي/يُظهر عنصر HTML بناءً على صلاحية
   * مثال: hideIfNoPermission("btn-delete-item", "deleteItem")
   */
  function hideIfNoPermission(elId, action) {
    var el = document.getElementById(elId);
    if (!el) return;
    if (!canDo(action)) {
      el.style.display = "none";
    }
  }

  /**
   * يُعيد HTML لعنصر مع إضافة disabled + tooltip لو ما في صلاحية
   * @param {string} html   - الـ HTML الأصلي للزر
   * @param {string} action - اسم العملية
   * @returns {string}
   */
  function withPermission(html, action) {
    if (!canDo(action)) {
      // بدّل btn-primary وbtn-danger بـ btn-ghost + disabled
      return html
        .replace(
          /class="btn([^"]*)"/,
          'class="btn$1" disabled title="' +
            I18N.t("AUTH_TOOLTIP_NO_PERMISSION") +
            '" style="opacity:0.4;cursor:not-allowed"',
        )
        .replace(
          /onclick="[^"]*"/,
          "onclick=\"event.preventDefault();showToast('" +
            I18N.t("AUTH_MSG_NO_PERMISSION_ACTION") +
            "','error')\"",
        );
    }
    return html;
  }

  /**
   * يعرض رسالة خطأ الصلاحيات بدلاً من تنفيذ الدالة
   */
  function requirePermission(action, callback) {
    if (!canDo(action)) {
      showToast(
        I18N.t("AUTH_MSG_NO_PERMISSION_PREFIX") + " " + action,
        "error",
      );
      return false;
    }
    if (callback) callback();
    return true;
  }

  // إخفاء شريط تحذير Google Apps Script تلقائياً

  (function _dismissGoogleBanner() {
    var _observer = new MutationObserver(function () {
      // زرار الإغلاق في الشريط الأصفر من Google
      var btn = document.querySelector(
        "a.dismiss-button, button.dismiss-button, [data-id='dismiss-button']",
      );
      if (btn) {
        btn.click();
        _observer.disconnect();
        return;
      }

      // بحث بالنص أو الـ aria-label (fallback)
      var allBtns = document.querySelectorAll("a, button, div[role='button']");
      for (var i = 0; i < allBtns.length; i++) {
        var el = allBtns[i];
        var txt = (el.textContent || "").trim();
        var lbl = (el.getAttribute("aria-label") || "").toLowerCase();
        if (
          txt === "×" ||
          txt === "Dismiss" ||
          lbl === "dismiss" ||
          lbl === "close"
        ) {
          var par = el.parentElement;
          var isGoogleBanner = false;
          while (par && par !== document.body) {
            var st = par.getAttribute("style") || "";
            if (
              st.indexOf("position: fixed") !== -1 ||
              st.indexOf("position:fixed") !== -1
            ) {
              if (par.id !== "root" && !par.closest("#root")) {
                isGoogleBanner = true;
              }
              break;
            }
            par = par.parentElement;
          }
          if (isGoogleBanner) {
            el.click();
            _observer.disconnect();
            return;
          }
        }
      }
    });
    _observer.observe(document.documentElement, {
      childList: true,
      subtree: true,
    });
    setTimeout(function () {
      _observer.disconnect();
    }, 10000);
  })();

    function _hideSplash() {

    // ممكن يكون null (لسه ملوّجش) — الباك-إند (resolveUserLanguage) بيرجع
    // اللغة الافتراضية للنظام في الحالة دي تلقائيًا.
    if (typeof I18N !== "undefined") {

        APP.currentUser ? APP.currentUser.username : null,

          // _preloadAllAfterLogin() (شوف 02_JS_UI_Shell.html).
          if (SESSION && SESSION.token) {
            _startPrefetch();
          }
        },
      );
    } else {
      render();
      _hideSplash();
      if (SESSION && SESSION.token) {
        _startPrefetch();
      }
    }

  function render(skipDataCheck) {

      // حاجة تستخدمها وتعمل نداء سيرفر كامل من الصفر — شاشة "جاري تحميل
      // البيانات..." الكاملة تظهر في كل تسجيل دخول حتى على نفس الجهاز.
      // الحل: هنا بس بنمسح بيانات الجلسة (التوكن) لأنها فعلاً لازم تتمسح
      // كل ما الشاشة دي تُعرض بدون يوزر — أما كاش البيانات (wms_cache*)
      // فبيتسيب زي ما هو؛ الحماية من تسريب بيانات مستخدم لمستخدم تاني على

      // اللي بتتفحص في loadAllData() قبل ما أي كاش يتطبّق فعليًا.
      try {

    // 🔒 [LEADING-ZERO-FIX] حماية شاملة على مستوى المشروع: أي حقل هاتف/كود/

    autoProtectTextNumberInputs(c);

    if (!APP._fromSilentRefresh) {

  // ─────────────────────────────────────────────────────────────
  // §E  Data Layer — البيانات والكاش

  // ---------- Prefetch (تحميل مسبق أثناء اللوجين) ----------
  var _prefetch = {
    done: false,
    data: null,
    loading: false,
    _onReady: null,
    _fullWaiters: [], // [DATA-LOADING-ENGINE / PHASE-3] قائمة انتظار "البيانات كاملة" (مستويات 2+3)
    // [FIX-STALE-PARTIAL-RENDER-2026-08-07] لو صفحة اتعرضت بسبب انتهاء
    // مهلة ensureLevelData (8 ثواني) قبل ما البيانات الكاملة توصل فعليًا،
    // بتتسجل هنا. لما البيانات الحقيقية توصل بعد كده (سواء نجحت أو فشلت)
    // بنعمل إعادة رسم صامتة (silent) للصفحة الحالية تلقائيًا — بدل ما
    // اليوزر يفضل شايف بيانات ناقصة/فاضية لحد ما يعمل Refresh يدوي أو
    // يتنقل لصفحة تانية ويرجع. شوف _drainFullWaiters() و_markPartialRender().
    _partialRenderPending: false,
  };

  // بتتنادى من جوه ensureLevelData وقت ما الـ timeout الاحتياطي يشتغل
  // (يعني: الصفحة اتعرضت ببيانات لسه مش كاملة). أي إعادة رسم لاحقة —
  // سواء نجحت أو فشلت البيانات المتبقية — لازم "تصحّح" الشاشة الظاهرة
  // للمستخدم دلوقتي بدل ما تسيبها ناقصة للأبد.
  function _markPartialRender() {
    _prefetch._partialRenderPending = true;
  }

  // بتتنادى كل مرة بيانات جديدة (كاملة أو نص فشلانة) توصل من الـ prefetch
  // التدريجي. لو فيه صفحة اتعرضت جزئيًا قبل كده (_markPartialRender)،
  // نعيد رسمها الآن بصمت (بدون فليكر/تمرير سكرول زي silentRefresh) عشان
  // تظهر بياناتها الحقيقية من غير أي تدخل يدوي من المستخدم.
  function _resolvePartialRenderIfNeeded() {
    if (!_prefetch._partialRenderPending) return;
    _prefetch._partialRenderPending = false;
    if (!APP.currentUser || !APP.currentPage) return;
    try {
      APP._fromSilentRefresh = true;
      renderPage(APP.currentPage);
    } finally {
      APP._fromSilentRefresh = false;
    }
  }

  // [DATA-LOADING-ENGINE / PHASE-3] صفحات "المستوى الأول فقط" — لا تحتاج
  // انتظار أي بيانات إضافية (ON_DEMAND/BACKGROUND) لأنها تعتمد فقط على
  // بيانات المستخدم/الشركة/الفرع/الافتراضيات (getAllDataLight). أي صفحة
  // غير مذكورة هنا تُعتبر افتراضيًا معتمدة على بيانات المستوى 2/3 (عملاء،
  // موردين، أصناف، فواتير...) فتنتظرها عبر ensureLevelData قبل الرسم —
  // هذا يغلق فجوة كانت موجودة: صفحات مثل "customers"/"items" كانت تُرسم
  // فورًا من APP.data حتى لو لسه المستوى 2/3 ما وصلش (خصوصًا لو المستخدم
  // نقّل لصفحة بسرعة عقب اللوجين مباشرة)، من غير أي حارس زي اللي كان
  // موجود بالفعل لصفحات المحاسبة/HR فقط (ensureExtendedData).
  var LIGHT_ONLY_PAGES = {
    dashboard: 1,
    shortcuts: 1,
  };

  // [PERF-NAV-FADE-2026-08] الشاشات اللي بتعرض جداول/بيانات كبيرة نسبياً —
  // دي الوحيدة اللي بتاخد fade transition (0.18s) عند التنقل ليها، عشان
  // تغطي أي إعادة رسم DOM ملحوظة. أي صفحة غير مذكورة هنا (نماذج/إعدادات/
  // شاشات صغيرة) بتتبدّل فوراً بدون أي تأخير بصري مقصود.
  var HEAVY_RENDER_PAGES = {
    items: 1,
    groups: 1,
    stock: 1,
    current_stock: 1,
    stocktake: 1,
    transactions: 1,
    tx_in: 1,
    tx_out: 1,
    transfer: 1,
    tx_transfer: 1,
    "sale-invoices": 1,
    "purchase-invoices": 1,
    "sale-returns": 1,
    "purchase-returns": 1,
    "purchase-orders": 1,
    "purchase-requests": 1,
    customers: 1,
    suppliers: 1,
    "journal-entries": 1,
    "receipt-vouchers": 1,
    "payment-vouchers": 1,
    "transfer-vouchers": 1,
    expenses: 1,
    cheques: 1,
    "general-ledger": 1,
    "trial-balance": 1,
    "account-statement": 1,
    employees: 1,
    attendance: 1,
    payroll: 1,
    "monthly-attendance": 1,
    "leave-requests": 1,
    "loan-requests": 1,
    audit_log: 1,
    import_log: 1,
    catalog: 1,
    production: 1,
    dispatch: 1,
    shipping: 1,
    executive_dashboard: 1,
    weekly_reports: 1,

  function _prefetchFullReady() {
    return !!(_prefetch.data && _prefetch.data._prefetch_full);
  }

  // [FIX-CATALOG-WAIT-2026-08] بعض الصفحات بتستنى _prefetchFullReady()
  // (يعني كل المستويات 1-4: فواتير، حركات، شحنات...) رغم إنها فعليًا
  // محتاجة جزء بسيط بس منها. مثال حقيقي: شاشة "catalog" (كتالوج
  // الأصناف) بتحتاج items/stock/groups/warehouses بس (CRITICAL +
  // جزء من ON_DEMAND) — ومع ذلك كانت بتستنى فواتير البيع/الشراء
  // وحركات المخزون والشحنات (BACKGROUND/REFERENCE) قبل ما تُسمح
  // لها بالفتح، فبتفضل على الـ Skeleton وقت أطول من اللازم.
  //
  // PAGE_REQUIRED_FIELDS: تعريف اختياري (opt-in) لكل صفحة — لو الصفحة
  // مش مذكورة هنا، السلوك القديم (انتظار full) فاضل زي ما هو تمامًا،
  // فمفيش أي مخاطرة على أي شاشة تانية غير المذكورة صراحةً.
  var PAGE_REQUIRED_FIELDS = {
    catalog: ["items", "stock", "groups", "warehouses"],
    // [PERF-PAGE-FIELDS-2026-08-02] نفس مبدأ "catalog" اتعمّم على باقي
    // شاشات المخزون الأساسية (زي طلب المستخدم بالظبط: تسريع أول فتح
    // لشاشة الأصناف بعد اللوجين) — كل شاشة هنا محتاجة بس ON_DEMAND
    // (المستوى 2)، ومش لازم تستنى BACKGROUND (حسابات/HR — المستوى 3)
    // اللي بقى بيتحمّل في idle منفصل بعد كده (شوف _prefetchBackgroundIdle
    // فوق). أي شاشة غير مذكورة هنا فضلت بنفس السلوك القديم (تستنى الكل).
    items: ["items", "stock", "groups", "warehouses", "chartOfAccounts"],
    groups: ["groups", "items", "warehouses"],
    stock: ["stock", "items", "groups", "warehouses"],
    current_stock: ["stock", "items", "groups", "warehouses"],
    stocktake: ["stock", "items", "warehouses"],
    tx_in: ["items", "stock", "warehouses", "groups"],
    tx_out: ["items", "stock", "warehouses", "groups"],
    transfer: ["items", "stock", "warehouses", "groups"],
    tx_transfer: ["items", "stock", "warehouses", "groups"],
    transactions: ["transactions", "items", "warehouses"],
  };

  function _pageDataReady(page) {
    var fields = PAGE_REQUIRED_FIELDS[page];
    if (!fields || !_prefetch.data) return false;
    for (var i = 0; i < fields.length; i++) {
      if (_prefetch.data[fields[i]] === undefined) return false;
    }
    return true;
  }

  /**
   * ensureLevelData(cb) — [REBUILD-2026-08-07] بقت "shim" توافقية رفيعة
   * فوق UDE (53_JS_UnifiedDataEngine.html) بدل التنفيذ القديم بالكامل،
   * عشان أي كود قديم (زي 17_JS_ExecutiveDashboard.html) لسه بينادي
   * ensureLevelData() مباشرة يفضل شغال من غير أي تعديل فيه. المنطق
   * الحقيقي (dedup النداءات، retry تلقائي عند الفشل، مفيش "استسلام"
   * بيانات ناقصة) بقى كله في UDE — راجع 53_JS_UnifiedDataEngine.html.
   */
  function ensureLevelData(cb) {
    UDE.ensure([2, 3], {
      onReady: cb,
      onError: cb, // توافقية: القديم مكانش بيميّز فشل عن نجاح لمنادي عام زي ده
    });
  }

  function _drainFullWaiters() {
    // [FIX-STALE-PARTIAL-RENDER-2026-08-07] لازم تتنفذ حتى لو مفيش
    // waiters قيد الانتظار دلوقتي — لأن الـ waiter بتاع الصفحة الحالية
    // ممكن يكون خرج من القائمة بالفعل بسبب الـ timeout فوق (يعني
    // الصفحة اتعرضت جزئيًا) قبل ما الداتا الحقيقية توصل هنا.
    _resolvePartialRenderIfNeeded();
    if (!_prefetch._fullWaiters.length) return;
    var waiters = _prefetch._fullWaiters;
    _prefetch._fullWaiters = [];
    waiters.forEach(function (fn) {
      try {
        fn();
      } catch (e) {}
    });
  }

  // [PERF-FIX / P3-WIRING] كانت هذه الدالة تستدعي getAllData() الكاملة (أثقل
  // نداء في النظام، 45 ثانية timeout) فور نجاح الحزمة الخفيفة — أي أن كل
  // بيانات المستويات 2/3/4 (عملاء، موردين، فواتير، مرفقات..) كانت تُحمَّل
  // فوراً أثناء اللوجين بغض النظر عن حاجة المستخدم لها، بالمخالفة المباشرة
  // لمبدأ "لا تسمح لأي شاشة بانتظار تحميل جميع البيانات". كذلك getAllDataByLevel
  // (Code_53_DataRegistryEngine.js) كانت معرَّفة في الـ backend من قبل ولم
  // تُستدعَ من أي شاشة أبداً (كود ميت).
  //
  // الحل هنا لا يحذف أي وظيفة ولا يغيّر Business Logic: النتيجة النهائية في
  // _prefetch.data تصل بنفس الشكل بالضبط (نفس المفاتيح) التي تعتمد عليها كل
  // الشاشات الحالية عبر APP.data — الفرق الوحيد أن التحميل يصير تدريجياً:
  //   • REFERENCE (4) تُجلب أولاً في وقت فراغ المتصفح (idle) لأنها خفيفة
  //     ونادراً ما تتغيّر.
  //   • ON_DEMAND (2) + BACKGROUND (3) تُجلب بعدها في idle تالٍ، بدون حجب
  //     رسم لوحة التحكم أو تفاعل المستخدم.
  // fallback: لو getAllDataByLevel فشلت لأي سبب، نرجع لنفس السلوك القديم
  // (getAllData الكاملة) حفاظاً على الاستقرار.
  var _ric =
    (typeof requestIdleCallback === "function" && requestIdleCallback) ||
    function (fn) {
      setTimeout(fn, 60);
    };

  function _startPrefetch() {
    if (_prefetch.done || _prefetch.loading) return;
    _prefetch.loading = true;

    function _finishPrefetch(mergedData, isFull) {
      _prefetch.loading = false;
      mergedData._prefetch_full = !!isFull;
      _prefetch.done = true;
      _prefetch.data = mergedData;
      if (typeof _prefetch._onReady === "function") {
        var cb = _prefetch._onReady;
        _prefetch._onReady = null;
        cb(mergedData);
      }
      if (mergedData._prefetch_full) _drainFullWaiters();
    }

    // مسار احتياطي قديم (getAllData الكاملة) — يُستخدم فقط لو التحميل
    // التدريجي بالمستويات فشل، عشان لا ننكسر أبداً
    function _prefetchFullLegacyFallback() {
      DL.Core.getAllData({
        label: "Auth.prefetch.full.fallback",
        onSuccess: function (result) {
          _finishPrefetch(result.data, true);
        },
        onError: function () {
          if (_prefetch.data) {
            _finishPrefetch(_prefetch.data, false);
          } else {
            _prefetch.loading = false;
            _prefetch.done = false;
          }
        },
      });
    }

    // [PERF-EAGER-ONDEMAND-2026-08-02] المرحلة 2-أ: ON_DEMAND فورًا،
    // بدون انتظار أي requestIdleCallback. هذا المستوى بالتحديد (أصناف/
    // مخزون/مجموعات/مخازن/عملاء/موردين/حسابات...) هو اللي كل شاشات
    // النظام تقريبًا بتفتح عليه (شوف PAGE_REQUIRED_FIELDS فوق)، فتأجيله
    // خلف REFERENCE في سلسلة idle-then-idle كان يفتح فجوة زمنية حقيقية:
    // لو المستخدم فتح شاشة "الأصناف" بسرعة بعد اللوجين (خصوصًا لو
    // المتصفح مشغول برسم الداشبورد ولسه مادّاش وقت فراغ لأول idle
    // callback)، الشاشة تقف على Skeleton "جاري تحميل البيانات..." رغم
    // إن الطلب أصلاً ما كانش بدأ لسه. الحل: نطلب ON_DEMAND فورًا (موازي
    // مع REFERENCE بالأسفل، مش بعده)، ونسيب REFERENCE/BACKGROUND بس
    // (الأقل إلحاحًا) على idle. الشكل النهائي لـ _prefetch.data
    // و_prefetch_full === true فضل زي ما هو بالظبط — الفرق الوحيد توقيت
    // الوصول.
    function _prefetchOnDemandEager() {
      DL.Core.getAllDataByLevel([2], {
        label: "Auth.prefetch.onDemand",
        onSuccess: function (result) {
          Object.assign(_prefetch.data, result.data);
          _finishPrefetch(_prefetch.data, false);
          // ⚠️ [SAFE] عمداً بلا _drainFullWaiters() هنا: أي شاشة منتظرة
          // فعليًا عبر ensureLevelData (مش عبر PAGE_REQUIRED_FIELDS)
          // محتاجة full (2+3) بمنطقها الأصلي، فمفيش داعي نفكّها ناقصة.
          // شاشات PAGE_REQUIRED_FIELDS (زي "items") بترسم من غير ما
          // تسجّل نفسها كـ waiter من الأساس — شوف renderPage() فوق:
          // بتتأكد من _pageDataReady(page) قبل ما تنادي ensureLevelData
          // خالص، فأي صفحة حقولها وصلت فعلاً (زي دلوقتي) بترسم فورًا.
          _prefetchBackgroundIdle();
        },
        onError: function () {
          // فشل مسار المستويات بالكامل → ارجع للمسار القديم المضمون
          _prefetchFullLegacyFallback();
        },
      });
    }

    // المرحلة 2-ب: REFERENCE فقط، أثناء وقت فراغ المتصفح (لا يحجب أي
    // شيء) — خفيفة ونادرًا ما تتغيّر، فمفيش داعي تتنافس مع ON_DEMAND
    // على الأولوية. تعمل بالتوازي مع _prefetchOnDemandEager() مش بعدها.
    function _prefetchReferenceIdle() {
      _ric(function () {
        DL.Core.getAllDataByLevel([4], {
          label: "Auth.prefetch.reference",
          onSuccess: function (result) {
            Object.assign(_prefetch.data, result.data);
          },
          onError: function () {
            // best-effort — ON_DEMAND هو المسار الحرج ومعاه fallback

    });
    var out = {

      // بترجع undefined دايمًا → نص فاضي في كل صف وكل عنوان فئة. الحل
      // المركزي هنا: نحسب label/catLabel مرة واحدة وقت تحميل البيانات
      // (بدل تعديل كل ملفات العرض)، مع fallback آمن لو الترجمة ناقصة.
      permissions: (d.permissions || []).map(function (p) {
        // ✅ [FIX-2] لو I18N لسه بيحمّل القاموس (سباق بين bootstrap
        // البيانات و bootstrap الترجمة وقت فتح التطبيق)، I18N.t() كان
        // بيرجع دايمًا "مفقود" ويطبع تحذير في الـ console لكل مفتاح صلاحية

        // لو مش جاهز، نسيب label/catLabel فاضيين مؤقتًا من غير ما ننادي
        // I18N.t() خالص، وبعدين _patchPermissionLabelsWhenI18nReady()
        // (تحت) بتعيد حسابهم أوتوماتيك أول ما القاموس يوصل.
        var i18nReady =

    _dleApplyRegistry(out, d);

    // لأن getAllData() لا تتضمّنها — بدون هذا الحفظ يتمسح cashBoxes/journalEntries
    // بعد كل silentRefresh ويظهر المستخدم شاشة فاضية لما يرجع للخزينة

    // بغض النظر عن قيمة extLoaded
    EXT_FIELDS.forEach(function (f) {
      if (APP.data && Array.isArray(APP.data[f])) {

    });

    if (APP.data && APP.data._extLoadedFromServer) {
      fresh._extLoadedFromServer = true;

    APP.data = fresh;
    APP.companySettings = fresh.companySettings || APP.companySettings || {};
    // [PERF-LAZY-LOAD] دوال من ملفات مؤجلة (08_JS_Users_Branding /
    // 03_JS_Dashboard_Items) — بتتحمل غالبًا خلال ثواني من فتح الصفحة،
    // بس بنحرس النداء احتياطًا لأي تايمنج نادر.
    if (typeof _applyCompanyBranding === "function") _applyCompanyBranding();
    if (typeof _syncColorsFromData === "function") _syncColorsFromData();
    if (
      fresh.roles &&
      fresh.roles.length &&

    ) {
      // [FIX-2026-08-08] PM_STATE معرّفة جوه 08_JS_Users_Branding.html
      // (ملف lazy بيتحمّل عبر getLazyAppBundle) — لو الحزمة المؤجلة فشلت/
      // عملت timeout (زي ما بيحصل لما الباك إند يكون بطيء/عالق) كانت
      // _applyFreshData بتكسر بـ "PM_STATE is not defined" وتوقف كل تحميل

      PM_STATE.roles = fresh.roles;

  // تحديث صامت في الخلفية بعد عرض الكاش
  // [PERF-FIX-SR] نسخة محسّنة: تتحقق من تغيّر البيانات قبل إعادة الرسم
  function _dataFingerprint(data) {
    if (!data) return "";
    try {
      var tx = data.transactions || [];
      var items = data.items || [];
      var stock = data.stock || [];
      var lastTx = tx.length
        ? String(tx[tx.length - 1].id) + "|" + tx[tx.length - 1].date
        : "";
      return [tx.length, items.length, stock.length, lastTx].join(":");
    } catch (e) {
      return "";
    }
  }

  function _silentRefresh() {
    if (_cache.fetching) return;
    _cache.fetching = true;
    _showRefreshBar(true);
    var _fpBefore = _dataFingerprint(APP.data);
    DL.Core.getAllData({
      label: "Auth.silentRefresh",
      onSuccess: function (result) {
        _showRefreshBar(false);
        _cache.fetching = false;
        var d = result.data;
        if (!d || typeof d !== "object") return;
        var fresh = _parseData(d);
        _saveCache(fresh);
        _applyFreshData(fresh);

        // [PERF-FIX-SR] مقارنة البصمة: لو البيانات لم تتغير → لا نعيد الرسم
        var _fpAfter = _dataFingerprint(fresh);
        var _dataChanged = _fpBefore !== _fpAfter;

        // حفظ scroll positions قبل الـ re-render
        var pageEl = document.querySelector(".content");
        var alertsEl = document.querySelector(".alerts-grid");
        var pageScroll = pageEl ? pageEl.scrollTop : 0;
        var alertsScroll = alertsEl ? alertsEl.scrollTop : 0;

        // ✅ لو المستخدم بيكتب في form، متعملش re-render عشان متمسحش المدخلات
        var activeEl = document.activeElement;
        var userTyping =
          activeEl &&
          (activeEl.tagName === "INPUT" ||
            activeEl.tagName === "TEXTAREA" ||
            activeEl.tagName === "SELECT" ||
            activeEl.isContentEditable);

        updateAlertBadge();
        updateNotifBell();

        // [PERF-FIX-SR] أعد الرسم فقط لو البيانات تغيّرت فعلاً والمستخدم مش بيكتب
        // [LOGIN-STABLE] وكمان لو فات 5 ثواني على اللوجين عشان الشاشة تتستقر
        var _sinceLogin = Date.now() - (APP._loginTime || 0);
        // 🎨 [FIX] شاشة "المجموعات" (عرض شجري) عندها حالة UI محلية غنية
        // (توسيع/طي، سحب وإفلات، تمرير داخلي) وبصمة البيانات (_dataFingerprint)
        // مبنية على transactions/items/stock بس — يعني أي حركة/صنف يتغيّر في
        // أي مكان تاني بالنظام كان بيفجّر إعادة بناء كاملة للشجرة (فتش + رسم
        // من الصفر) رغم إن بيانات المجموعات نفسها مالهاش دعوة، فيحس المستخدم
        // إن الشاشة "بترفرش" باستمرار وبيفقد مكان التمرير/التوسيع. بنستثنيها
        // من إعادة الرسم الصامتة؛ أي تعديل فعلي على المجموعات (إضافة/حذف/تعديل)
        // بيحصله رسم فوري من مكانه هو نفسه (مش محتاج الريفريش الصامت أصلاً).
        var _silentRefreshSkipPages = { groups: true };
        if (
          _dataChanged &&
          !userTyping &&
          _sinceLogin > 5000 &&
          !_silentRefreshSkipPages[APP.currentPage]
        ) {
          APP._fromSilentRefresh = true;
          renderPage(APP.currentPage);
          APP._fromSilentRefresh = false;
          // استعادة scroll positions بعد الـ re-render
          setTimeout(function () {
            var pageElNew = document.querySelector(".content");
            var alertsElNew = document.querySelector(".alerts-grid");
            if (pageElNew) pageElNew.scrollTop = pageScroll;
            if (alertsElNew) alertsElNew.scrollTop = alertsScroll;
          }, 0);
        }
      },
      onError: function () {
        _cache.fetching = false;
        _showRefreshBar(false);
      },
    });
  }

  function loadAllData(cb, forceRefresh) {
    if (!forceRefresh) {
      // [PERF-FIX-CACHE-WIPE] كاش البيانات بقى ممكن يفضل من يوزر سابق على
      // نفس الجهاز (شوف render() و_cacheOwnerMatches فوق) — لازم نتأكد إنه
      // بتاع اليوزر الحالي قبل ما نستخدمه، وإلا نتجاهله ونعمل نداء سيرفر
      // طبيعي (نفس سلوك "مفيش كاش" القديم بالظبط، بدون أي تسريب بيانات).
      var cached = _cacheOwnerMatches() ? _loadCache() : null;
      if (cached) {
        _applyFreshData(cached);
        if (typeof cb === "function") cb();
        else if (cb !== null) renderPage(APP.currentPage);
        updateAlertBadge();
        updateNotifBell();
        // لو البيانات الثابتة قديمة أيضاً → silent refresh كامل
        _silentRefresh();
        return;
      }
    }

    APP.loading = true;
    // لا نعرض spinner في page-content — الـ app-loading-overlay شغّال فوق كل شيء
    // var c = document.getElementById("page-content"); -- removed

    DL.Core.getAllData({
      label: "Auth.loadAllData",
      onSuccess: function (result) {
        APP.loading = false;
        var d = result.data;
        if (!d || typeof d !== "object") {
          showToast(I18N.t("AUTH_MSG_INVALID_DATA_RECEIVED"), "error");
          if (typeof _hideAppLoader === "function") _hideAppLoader();
          return;
        }
        var fresh = _parseData(d);
        fresh._loaded = true;
        _saveCache(fresh);
        _applyFreshData(fresh);
        if (typeof _hideAppLoader === "function") _hideAppLoader();
        if (typeof APP._onDataLoaded === "function") {
          var _hook = APP._onDataLoaded;
          APP._onDataLoaded = null;
          _hook();
        }
        if (typeof cb === "function") cb();
        // [LOGIN-STABLE] لو cb=null (silent background load) — لا نعيد الرسم
        else if (cb !== null) renderPage(APP.currentPage);
        updateAlertBadge();
        updateNotifBell();
      },
      onError: function (result) {
        APP.loading = false;
        if (typeof _hideAppLoader === "function") _hideAppLoader();
        showToast(I18N.t("MSG_LOAD_ERROR") + ": " + result.message, "error");
        console.error("loadAllData error:", result.message);
      },
    });
  }

  var EXT_FIELDS = [

  function _saveExtCache(data) {
    try {
      localStorage.setItem(
        EXT_CACHE_KEY,
        JSON.stringify({ data: data, ts: Date.now() }),

    } catch (e) {
      // 🐛 [FIX-QUOTA] نفس فيكس _saveCache — تسجيل مرئي بدل بلع الخطأ بصمت
      console.warn("_saveExtCache: فشل حفظ الكاش الموسّع:", e && e.message);
    }

  function _loadExtCache() {

      if (Date.now() - c.ts > EXT_CACHE_TTL) return null;
      // [FIX-EXT-FLAG] الكاش = بيانات حقيقية سبق تحميلها من السيرفر

  /**
   * ensureExtendedData — يضمن إن بيانات المحاسبة/HR موجودة في APP.data
   * قبل ما الشاشة تعرضها، بدون ما يكرر نداء السيرفر لو كانت محمّلة فعلاً.
   * @param {Function} cb يُستدعى لما البيانات تكون جاهزة
   * @param {boolean} [forceRefresh] لو true يتجاهل الكاش ويجيب نسخة جديدة
   */
  // ─────────────────────────────────────────────────────────────
  // [DATA-UNIFY-2] نقطة الاتصال الوحيدة بالسيرفر لجلب الحزمة الموسعة
  //
  // قبل كده كان فيه 4 نسخ منفصلة بتنادي google.script.run.getAllDataExtended
  // مباشرة (هنا x3 + نسخة رابعة في 11_JS_Accounting.html)، كل نسخة بمنطق
  // cache/retry خاص بيها — وده كان سبب ظهور شاشات "جاري التحميل" عالقة لما
  // نسختين يشتغلوا في نفس الوقت من غير ما يعرفوا ببعض.
  //
  // دلوقتي: نداء واحد فعلي (_gsr → DL.Core.getAllDataExtended)، وكل الدوال
  // التالية (ensureExtendedData / refreshExtendedData / _preloadAllAfterLogin /
  // _silentPrefetchExtended) بقت مجرد "واجهات" حوالين نفس الطابور المشترك
  // _extCallbacks + علم APP.extLoading المشترك.
  // ─────────────────────────────────────────────────────────────
  function _fetchExtendedDataFromServer(_isRetry) {
    APP.extLoading = true;
    // ✅ [REBUILD-ACC-HR-2026] الدالة دي كانت بتعمل 4 نداءات متوازية لأربع
    // endpoints قديمة منفصلة (getAllDataExtendedCore + getAccountingExtendedLazy
    // + getHRExtendedLazy + getFinanceSummaryLight)، كل واحدة بمهلتها
    // الخاصة ومهلة أمان إضافية 35 ثانية فوقهم — تعقيد كبير وسبب متكرر
    // لكروت المحاسبة/HR اللي بتفضل عالقة على "تحميل" (خصوصًا على /dev
    // deployment الأبطأ، زي ما موثّق في تعليقات Code_12e_Dashboard_Reports.js).
    // دلوقتي بقت بتستخدم نفس المحرك الحديث الموحّد اللي باقي الشاشات
    // (الأصناف/المخزون/العملاء...) بتعتمد عليه بالفعل: DL.Core.getAllDataByLevel
    // (Code_53_DataRegistryEngine.js) — نداء واحد بس بمستوى BACKGROUND،
    // معاه كاش سيرفر جاهز ومفتاح صلاحيات مستقل لكل دور، ومهلة واحدة
    // واضحة بدل تعقيد الأربعة نداءات المتوازية والـ safety timer المنفصل.
    //
    // البيانات الراجعة من الـ registry بمفاتيح مسبوقة (accCashBoxes،
    // hrEmployees...) — بنعيد تسميتها هنا لنفس الأسماء المسطّحة اللي كل
    // شاشات المحاسبة/HR القديمة (11_JS_Accounting.html، 12_JS_HR.html،
    // 17_JS_ExecutiveDashboard.html...) لسه بتقرأها من APP.data مباشرة،
    // فمفيش أي كود تاني محتاج يتغيّر غير المصدر هنا.
    var LEVEL3_FIELD_MAP = {
      accCashBoxes: "cashBoxes",
      accBankAccounts: "bankAccounts",
      accJournalEntries: "journalEntries",
      accReceiptVouchers: "receiptVouchers",
      accPaymentVouchers: "paymentVouchers",
      accExpenses: "expenses",
      accTransferVouchers: "transferVouchers",
      accBankReconciliations: "bankReconciliations",
      accCheques: "cheques",
      accFixedAssets: "fixedAssets",
      hrEmployees: "employees",
      hrDepartments: "departments",
      hrJobTitles: "jobTitles",
      hrLeaveTypes: "leaveTypes",
      hrLeaveRequests: "leaveRequests",
      hrLoanRequests: "loanRequests",
      hrPayrollPeriods: "payrollPeriods",
      hrAttendance: "attendance",
      accSettings: "accountingSettings",
      hrSettingsBundle: "hrSettings",
    };

    DL.Core.getAllDataByLevel([3], {
      label: "Auth.ensureExtendedData(level3)",
      timeout: 30000,
      onSuccess: function (result) {
        APP.extLoading = false;
        var raw = (result && result.data) || {};
        var mapped = {};
        Object.keys(LEVEL3_FIELD_MAP).forEach(function (rawKey) {
          var flatKey = LEVEL3_FIELD_MAP[rawKey];
          if (raw[rawKey] !== undefined) mapped[flatKey] = raw[rawKey];
        });
        _applyExtData(mapped);
        _saveExtCache(mapped);
        APP.extLoaded = true;
        var cbs = _extCallbacks.slice();
        _extCallbacks = [];
        cbs.forEach(function (fn) {

      onError: function (errResult) {
        APP.extLoading = false;

          // بنسخة fresh قبل ما نسيب الشاشات فاضية للمستخدم

        // نستخدمها بدل ما نسيب الكروت فاضية تمامًا، ونعرض تنبيه بالخطأ
        var cached = _loadExtCache();

  /**
   * ensureExtendedData — يضمن إن بيانات المحاسبة/HR موجودة في APP.data
   * قبل ما الشاشة تعرضها، بدون ما يكرر نداء السيرفر لو كانت محمّلة فعلاً،
   * ولو في طلب شغال بالفعل (من أي مصدر: prefetch/silent/مرئي) بينضم لنفس الطابور.
   * @param {Function} cb يُستدعى لما البيانات تكون جاهزة
   * @param {boolean} [forceRefresh] لو true يتجاهل الكاش ويجيب نسخة جديدة
   */
  function ensureExtendedData(cb, forceRefresh, _isRetry) {
    cb = cb || function () {};

    // ✅ [FIX-EXT] لو extLoaded=true لكن البيانات اتمسحت بسبب silentRefresh
    // نكتشف ذلك بفحص حقل أساسي — لو فاضي نجبر re-fetch بدل ما نعرض شاشة فارغة
    if (APP.extLoaded && !forceRefresh) {
      // [FIX-EXT-INTACT] الفلاق _extLoadedFromServer وحده كافي للتحقق —
      // فحص محتوى المصفوفات كان بيسبب re-fetch غلط لمستخدمين جدد عندهم
      // بيانات فاضية بشكل طبيعي (مثلاً: مفيش قيود محاسبية بعد).
      var extDataIntact = APP.data && APP.data._extLoadedFromServer === true;
      if (!extDataIntact) {
        // البيانات الموسعة اتمسحت أو جت فاضية — أعد التحميل
        APP.extLoaded = false;
        try {
          localStorage.removeItem(EXT_CACHE_KEY);
        } catch (e) {}
      }
    }

    if (APP.extLoaded && !forceRefresh) {
      cb();
      return;
    }

    if (!forceRefresh) {
      var cached = _loadExtCache();
      if (cached) {
        _applyExtData(cached);
        APP.extLoaded = true;
        cb();
        return;
      }
    }

    // لو في طلب شغال فعلاً (سواء silent prefetch أو طلب مرئي أو preload)
    // اكتفِ بالانتظار عليه بدل تكرار النداء — طابور واحد مشترك للجميع
    if (APP.extLoading) {
      _extCallbacks.push(cb);
      if (typeof showFABMessage === "function") {
        showFABMessage("⏳ جاري تحضير البيانات...", 3000);
      }
      return;
    }

    _extCallbacks.push(cb);
    // [SKELETON] الـ skeleton screen في محتوى الصفحة يكفي كـ visual feedback
    _fetchExtendedDataFromServer(_isRetry);
  }

  /** يُستخدم لزر "تحديث" اليدوي في شاشات المحاسبة/HR، وأيضاً لأي إعادة تحميل
   * إجبارية للحزمة الموسعة (زي `_reloadCashBoxesFromServer` سابقاً في المحاسبة) */
  function refreshExtendedData(cb) {
    try {
      localStorage.removeItem(EXT_CACHE_KEY);
    } catch (e) {}
    APP.extLoaded = false;
    ensureExtendedData(cb, true);
  }

  // ─────────────────────────────────────────────────────────────
  // §E-SILENT-EXT  Background Prefetch للبيانات الموسعة (HR + محاسبة)
  //
  // ─────────────────────────────────────────────────────────────
  // §PRELOAD-ALL  تحميل كل البيانات بعد تسجيل الدخول مباشرةً
  //
  // الهدف: ضمان إن 100% من البيانات (أساسية + موسعة) تكون محملة
  // في الكاش قبل ما المستخدم يفتح أي شاشة — بدون spinner مزعج.
  // يُستدعى من 02_JS_UI_Shell بعد اللوجين مباشرة.
  // ─────────────────────────────────────────────────────────────
  var _preloadDone = false;

  // [DATA-LOADING-ENGINE / المرحلة 2+3] هذه الدالة كانت بتحمّل الحزمة
  // الموسعة كاملة (محاسبة + HR — 19 حقل، EXT_FIELDS فوق) لكل مستخدم فور
  // تسجيل الدخول، حتى لو مادخلش أي شاشة محاسبة/HR طول الجلسة — ده بالتعريف
  // بيانات "المستوى الثاني: On Demand" وكانت بتتحمّل وقت "المستوى الأول:
  // Critical". كل الشاشات اللي محتاجة الحزمة الموسعة (11_JS_Accounting،
  // 12_JS_HR، 27_JS_Manufacturing، 15_JS_Invoices، 07_JS_Shipping...) بتنادي
  // ensureExtendedData() بنفسها أول ما تُفتح، وensureExtendedData أصلاً بتتعامل
  // مع حالة "طلب شغال بالفعل" أو "متخزّن في sessionStorage" فمفيش تكرار —
  // فمفيش داعي لتحميلها مسبقًا لـ 100% من المستخدمين. الفرق الوحيد دلوقتي:
  // أول فتح لشاشة موسعة في الجلسة بيستنى نداء ensureExtendedData العادي
  // (نفس النداء اللي كان بيحصل هنا) بدل ما يلاقيه جاهز من قبل — مفيش أي
  // تغيير في Business Logic أو في العقد بين الشاشة والداتا.
  function _preloadAllAfterLogin() {
    if (_preloadDone) return;
    _preloadDone = true;

    // ── المستوى 1 (Critical) فقط: البيانات الأساسية ──
    // لو لسه مطلوبة (نادراً — عادة بتكون اتحمّلت وقت اللوجين نفسه) اطلبها
    // بدون ما ننتظرها هنا أو نجرّ معاها الحزمة الموسعة.
    var basicReady = APP.data && APP.data._loaded;
    if (!basicReady && !APP.loading) {
      loadAllData(null, true);
    }

    // [REBUILD-2026-08-07 / UDE] بدل موجات setTimeout بتوقيتات ثابتة
    // مخمَّنة (4s/9s/14s/19s) اللي كانت بتحاول تحزر معاد "خلوّ" الشبكة،
    // UDE.warmup() بتجيب مستوى ON_DEMAND (2) فورًا ثم BACKGROUND (3)
    // وREFERENCE (4) في وقت فراغ المتصفح الفعلي (requestIdleCallback) —
    // مش وقت متخيَّل. أي شاشة يفتحها المستخدم قبل ما warmup() يخلص
    // هتضمن بياناتها بنفسها عبر UDE.ensurePage() في renderPage()، فمفيش
    // أي احتمال "شاشة فاضية للأبد" حتى لو حصل تزاحم فعلي في الشبكة.
    UDE.warmup();

    // [EXT-PRELOAD] الحزمة الموسعة (محاسبة/HR/تصنيع/فواتير/شحن —
    // ensureExtendedData/EXT_FIELDS) نظام منفصل عن مستويات UDE
    // (2/3/4)، فلسه محتاج نداءه الخاص. بنسيبه في idle تاني بعد warmup()
    // بدل رقم ثواني مخمَّن، عشان ميتزاحمش مع مستوى ON_DEMAND الحرج.
    (
      (typeof requestIdleCallback === "function" && requestIdleCallback) ||
      function (fn) {
        setTimeout(fn, 2500);
      }
    )(function () {
      _silentPrefetchExtended();
    });

    // [VC-PRELOAD] المحافظ الإلكترونية والحضور — تأثيرهم أخف بكتير من
    // بيانات الشاشات الأساسية، فبنسيبهم خلفية متأخرة بسيطة زي ما كانوا.
    setTimeout(function () {
      if (typeof _vcPreload === "function") _vcPreload();
    }, 6000);
    setTimeout(function () {
      if (typeof _attPreload === "function") _attPreload();
    }, 8000);
  }

  // يُستدعى بعد تسجيل الدخول بثانيتين في الخلفية بدون أي UI/Freeze
  // الهدف: لما المستخدم يفتح أي شاشة HR/محاسبة يلاقي الكاش جاهز
  // لو فشل: يفشل صامتاً — ensureExtendedData ستكمل طبيعي لو احتاج
  // [DATA-UNIFY-2] بقت مجرد نداء صامت لـ ensureExtendedData بدل نسخة
  // مستقلة من منطق الجلب — نفس الطابور، نفس علم extLoading.
  // ─────────────────────────────────────────────────────────────
  function _silentPrefetchExtended() {
    if (APP.extLoaded || APP.extLoading) return;
    ensureExtendedData(function () {});
  }

  var _saveAnim = { el: null, timer: null, hideTimer: null };

  function showSaveAnim(options) {

  // [FIX-UI] _saveAnimSuccess — يغير الـ bubble لرسالة نجاح ناعمة
  function _saveAnimSuccess(msg) {
    if (!msg) {
      _closeSaveAnim(true);

    if (!bubble) return;

    if (_saveAnim.timer) {
      clearTimeout(_saveAnim.timer);
      _saveAnim.timer = null;

    // نُبقي data-freeze="success" حتى يتعرف عليه _closeSaveAnim

      '<span class="fab-bubble-stem"></span>' +

  // [FIX-UI] _closeSaveAnim — يخفي الـ bubble
  function _closeSaveAnim(immediate) {
    if (_saveAnim.timer) clearTimeout(_saveAnim.timer);

    _saveAnim.hideTimer = setTimeout(function () {

  // ─────────────────────────────────────────────────────────────
  // 🚀  reloadAfterMutation v4.2 — Optimistic Update
  //
  // بدلاً من مسح الكاش وجلب كل البيانات من الباكيند بعد كل عملية:
  //   1. نحدّث APP.data محلياً فوراً (Optimistic Update)
  //   2. نعرض الـ UI المحدّث بدون انتظار
  //   3. في الخلفية نجلب getAllData() لمزامنة الحقيقة مع الباكيند
  //
  // @param {Function|null}  cb           - callback بعد تحديث UI
  // @param {Function|null}  unfreeze     - تحرير الـ freeze بعد الانتهاء
  // @param {Object|null}    animOptions  - خيارات أنيميشن الحفظ
  // @param {Object|null}    optimisticPatch - { collection, record, op: 'add'|'update'|'remove', idField }
  //   collection: اسم المصفوفة في APP.data (مثلاً "items", "groups")
  //   record: الكائن الجديد/المعدّل
  //   op: العملية ('add', 'update', 'remove')
  //   idField: اسم حقل الـ id (افتراضي 'id')
  // ─────────────────────────────────────────────────────────────
  function reloadAfterMutation(cb, unfreeze, animOptions, optimisticPatch) {
    // [SOFT-SAVE / SE-BUBBLE-FIX] لو الشاشة بتستخدم SaveEngine.run بالفعل
    // (اللي بيدير فقاعة "جار الحفظ → جار التحديث → تم الحفظ" لوحده)، تمرير
    // animOptions === false هنا يمنع reloadAfterMutation من فتح/تصفير نفس
    // الفقاعة مرة ثانية (كان بيقفلها فجأة ويعيد فتحها بنص افتراضي، وبعدين
    // SaveEngine.LoadingService.hide() كان بيقفلها هي كمان فورًا — فكان
    // المستخدم بيشوف الرسالة "بتختفي" ثم رسالة النجاح "بتظهر" بعد فجوة
    // فاضية بدل انتقال سلس). في الوضع الصامت: نعمل فقط الـ optimistic
    // patch + إعادة الرسم + المزامنة الخلفية، من غير أي فقاعة هنا إطلاقًا.
    var silent = animOptions === false;
    var anim = silent
      ? { done: function () {}, fail: function () {} }
      : showSaveAnim(animOptions);

    // ── Optimistic Update: حدّث الكاش المحلي فوراً ──────────────
    if (optimisticPatch && _cache.data) {
      try {
        var col = optimisticPatch.collection;
        var rec = optimisticPatch.record;
        var op = optimisticPatch.op || "update";
        var idField = optimisticPatch.idField || "id";
        var arr = _cache.data[col] || [];

        if (op === "add") {
          _cache.data[col] = arr.concat([rec]);
        } else if (op === "update") {
          _cache.data[col] = arr.map(function (item) {
            return String(item[idField]) === String(rec[idField]) ? rec : item;
          });
        } else if (op === "remove") {
          _cache.data[col] = arr.filter(function (item) {
            return String(item[idField]) !== String(rec[idField]);
          });
        }

        APP.data = _cache.data;
        // حدّث الكاش الثابت (لأن البيانات الثابتة هي الأكثر تعديلاً)
        _cache.static_ts = Date.now();
        _saveCacheOptimistic({});
      } catch (patchErr) {
        console.warn("optimisticPatch error:", patchErr);
      }
    }

    // ── تحديث UI فوري من الكاش المحلّي ──────────────────────────
    // [PERF-FIX-1] تحديث الـ UI فوراً بدون setTimeout — الـ optimisticPatch
    // حدّث APP.data بالفعل، فلا يوجد سبب للانتظار 800ms قبل رسم الشاشة.
    // نُبقي على requestAnimationFrame بدلاً من setTimeout لضمان رسم نظيف
    if (!silent) {
      var _animMsg =
        animOptions && animOptions.successMsg != null
          ? animOptions.successMsg
          : "تم الحفظ بنجاح ✓";
      if (_animMsg) {
        anim.done(_animMsg);
      } else {
        _closeSaveAnim(true);
      }
    }
    (window.requestAnimationFrame || setTimeout)(function () {
      if (cb) cb();
      else renderPage(APP.currentPage);
      updateAlertBadge();
      if (unfreeze) unfreeze();
    });

    // ── مزامنة خلفية مع الباكيند ─────────────────────────────────
    // [PERF-FIX-2] نبدأ المزامنة مبكراً (300ms بدلاً من 1200ms)
    // الـ UI اتحدّث فعلاً من الـ Optimistic Update، وبقدر نبدأ السيرفر call بسرعة
    // بدون أثر على UX — أسرع تحديث للبيانات الحقيقية
    setTimeout(function () {
      if (_cache.fetching) return;
      _cache.fetching = true;
      // ✅ [FIX] شيلنا استدعاء _saveAnimUpdating() هنا:
      // بما إن addGroup/updateGroup (وكل عمليات الحفظ التانية) بتستدعي
      // _invalidateServerCache() عقب كل نجاح، فأي getAllData() جاي فورًا
      // بعدها هيكون Cache MISS مضمون، وهيضطر يقرا كل الشيتات من جديد —
      // ده بياخد وقت أطول بكتير من الـ Optimistic Update اللي ظهر فورًا
      // في الجدول. فكان المستخدم بيشوف السطر الجديد ظاهر، ومع ذلك رسالة
      // "جار التحديث..." لسه شغالة لثواني كمان — بتوهم إن فيه حاجة عالقة
      // مع إن الحفظ خلص فعليًا. المزامنة الخلفية دلوقتي صامتة بالكامل؛
      // هتفشل أو تنجح من غير ما تفضل معلّقة رسالة على الشاشة.
      DL.Core.getAllData({
        label: "Auth.backgroundSync",
        onSuccess: function (result) {
          _cache.fetching = false;
          _closeSaveAnim(false); // ✅ يقفل بهدوء بعد اكتمال التحديث الحقيقي
          var d = result.data;
          if (!d || typeof d !== "object") return;
          try {
            var fresh = _parseData(d);
            _saveCache(fresh);
            _applyFreshData(fresh);
            // لا تعمل re-render لصفحات الوارد/الصادر/التحويل
            // عشان متمسحش الفورم لو المستخدم شغّال عليه
            var _noRerender = ["tx_in", "tx_out", "tx_transfer"];
            // [PERF-FIX-BGS] تحقق من إن المستخدم مش بيكتب في أي حقل قبل الـ re-render
            var _bgActiveEl = document.activeElement;
            var _bgUserTyping =
              _bgActiveEl &&
              (_bgActiveEl.tagName === "INPUT" ||
                _bgActiveEl.tagName === "TEXTAREA" ||
                _bgActiveEl.tagName === "SELECT" ||
                _bgActiveEl.isContentEditable);
            if (_noRerender.indexOf(APP.currentPage) === -1 && !_bgUserTyping) {
              // [PERF-FIX-BGS] وسّم كـ silent refresh عشان يتجنب الـ fade flicker
              APP._fromSilentRefresh = true;
              renderPage(APP.currentPage);
              APP._fromSilentRefresh = false;
            }
            updateAlertBadge();
            updateNotifBell();
          } catch (e) {
            console.warn("Background sync error:", e);
          }
        },
        onError: function (result) {
          _cache.fetching = false;
          _closeSaveAnim(true); // ✅ يقفل فوراً — الحفظ الأصلي نجح، دي مجرد مزامنة خلفية فشلت
          console.warn("Background sync failed:", result.message);
          // عند الفشل: أعد مسح الكاش ليُجبر المستخدم على refresh حقيقي
          _cache.data = null;
          _cache.ts = 0;
        },
      });
    }, 300); // [PERF-FIX-2] 300ms بدلاً من 1200ms
  }

  // ─────────────────────────────────────────────────────────────
  // reloadAfterMutationFull — للحالات التي نحتاج فيها تحديثاً كاملاً
  // (مثل: استيراد Excel، تعديل الرصيد الافتتاحي، backup)
  // ─────────────────────────────────────────────────────────────
  function reloadAfterMutationFull(cb, unfreeze, animOptions) {
    _cache.data = null;
    _cache.ts = 0;
    try {
      localStorage.removeItem("wms_cache");
      localStorage.removeItem("wms_cache_static");
      localStorage.removeItem("wms_cache_dynamic");
    } catch (e) {}

    var anim = showSaveAnim(animOptions);

    DL.Core.getAllDataFresh({
      label: "Auth.reloadAfterMutationFull",
      onSuccess: function (result) {
        var d = result.data;
        if (!d || typeof d !== "object") {
          anim.fail("البيانات المستلمة غير صحيحة");
          if (unfreeze) setTimeout(unfreeze, 1700);
          return;
        }
        try {
          var fresh = _parseData(d);
          _saveCache(fresh);
          _applyFreshData(fresh);
        } catch (parseErr) {
          anim.fail("خطأ في معالجة البيانات");
          if (unfreeze) setTimeout(unfreeze, 1700);
          return;
        }
        anim.done(
          (animOptions && animOptions.successMsg) || "تم الحفظ بنجاح ✓",
        );
        // [PERF-FIX-3] لا حاجة لـ 1200ms إضافية — البيانات وصلت بالفعل من السيرفر
        // نعرض الـ UI فوراً بعد رسم الـ animation frame
        (window.requestAnimationFrame || setTimeout)(function () {
          if (cb) cb();
          else renderPage(APP.currentPage);
          updateAlertBadge();
          if (unfreeze) unfreeze();
        });
      },
      onError: function (result) {
        anim.fail("خطأ: " + (result.message || "حاول مرة أخرى"));
        setTimeout(function () {
          if (unfreeze) unfreeze();
          loadAllData();
        }, 1700);
      },
    });
  }

  // دمج مجموعات التنقل مع النظام الحالي
  function _initERPNavGroups() {
    if (typeof NAV_GROUPS !== "undefined") {
      var existingGroups = {};
      var existingPages = {};
      NAV_GROUPS.forEach(function (g) {
        existingGroups[g.group] = true;
        (g.items || []).forEach(function (it) {
          existingPages[it.page] = true;
        });
      });

      // إدراج مجموعات المحاسبة وHR بعد Dashboard
      var dashboardIdx = NAV_GROUPS.findIndex(function (g) {
        return (
          g.items &&
          g.items.some(function (i) {
            return i.page === "dashboard";
          })
        );
      });

      ERP_NAV_GROUPS.forEach(function (group, i) {
        var filteredItems = (group.items || []).filter(function (it) {
          return !existingPages[it.page];
        });
        if (!filteredItems.length) return;

        // ⚠️ [FIX] لو القسم موجود مسبقًا في NAV_GROUPS (مثل "الموارد البشرية"
        // المضاف يدويًا في 02_JS_UI_Shell.html)، كان الكود القديم يتجاهل
        // القسم بالكامل ولا يضيف عناصره الجديدة (مثل "مراحل الإنتاج") إطلاقًا،
        // فتختفي الصفحة بصمت من السايد بار رغم أنها مسجّلة وتعمل فعليًا.
        // الحل: لو القسم موجود، ندمج العناصر الناقصة داخله بدل تجاهله بالكامل.
        if (existingGroups[group.group]) {
          var existingGroupObj = NAV_GROUPS.filter(function (g) {
            return g.group === group.group;
          })[0];
          if (existingGroupObj) {
            existingGroupObj.items = (existingGroupObj.items || []).concat(
              filteredItems,
            );
            filteredItems.forEach(function (it) {
              existingPages[it.page] = true;
            });
          }
          return;
        }

        var groupToInsert = Object.assign({}, group, { items: filteredItems });
        var insertIdx =
          dashboardIdx !== -1 ? dashboardIdx + 1 + i : NAV_GROUPS.length;
        NAV_GROUPS.splice(insertIdx, 0, groupToInsert);
        existingGroups[group.group] = true;
        filteredItems.forEach(function (it) {
          existingPages[it.page] = true;
        });
      });
    }
  }

  function _initERPModules() {
    // [FIX] لا ننادي _initERPRoles() مباشرة هنا: عند DOMContentLoaded يكون
    // I18N.bootstrap() لسه مارجعش رد السيرفر (نداء async)، فـ _dict بيبقى
    // فاضي و I18N.t() بيطبع "[I18N] مفتاح ترجمة مفقود" رغم إن المفتاح
    // موجود فعلاً في القاموس. onReady() بيأجّل التنفيذ لحد ما القاموس
    // يوصل فعلاً (أو ينفّذ فورًا لو كان جاهز أصلاً)، فيدّي نفس النتيجة
    // بدون تحذير كاذب.
    if (typeof I18N !== "undefined" && I18N.onReady) {
      I18N.onReady(_initERPRoles);

      _initERPRoles();

  // ⚠️ [FIX] استدعاء التهيئة بعد تحميل كل ملفات الـ JS
  // السبب: NAV_GROUPS معرّف في 02_JS_UI_Shell.html وهو ملف يُضمَّن
  // بعد هذا الملف (01_JS_Core_Auth.html). استدعاء _initERPModules()
  // مباشرة هنا كان يجعل (typeof NAV_GROUPS !== "undefined") = false
  // دائماً، فتفشل عملية دمج مجموعتي "المحاسبة" و"الموارد البشرية"
  // (وكل ما تحتهما، بما فيه شاشة استيراد الحضور من جهاز البصمة) بصمت
  // ولا تظهر أبداً في الـ Sidebar. التأخير لحد DOMContentLoaded
  // يضمن أن كل ملفات JS_*.html نفّذت بالفعل وأن NAV_GROUPS موجود.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", _initERPModules);
  } else {
    _initERPModules();
  }

  // إعادة دمج تسميات الأدوار (ROLE_LABELS) في كل مرة يجهّز/يتغيّر فيها القاموس،
