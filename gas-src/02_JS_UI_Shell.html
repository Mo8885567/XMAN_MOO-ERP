      titleKey: "PAGE_PURCHASE_REQUEST_WORKSPACE",
    },
    purchase_order_workspace: {
      group: "MENU_PURCHASES",
      groupPage: "purchases-dashboard",
      listLabel: "PAGE_PURCHASE_ORDERS",
      listPage: "purchase-orders",
      titleKey: "PAGE_PURCHASE_ORDER_WORKSPACE",
    },
  };

  function _getPageNavMeta(page) {
    var groups = window.NAV_GROUPS || [];
    if (IW_WORKSPACE_BREADCRUMB[page]) {
      var iw = IW_WORKSPACE_BREADCRUMB[page];
      return {
        crumbs: [
          { label: I18N.t(iw.group), page: iw.groupPage },
          { label: I18N.t(iw.listLabel), page: iw.listPage },
        ],
        label: I18N.t(iw.titleKey) || page,
        icon: "",
      };
    }
    // ✅ [SIDEBAR-V3] لوحات تحكم الأقسام (dashboardPage) بقت مش موجودة
    // كـ item عادي جوه items[] — دلوقتي هي خاصية على مستوى المجموعة نفسها
    // (تتفتح بالضغط على اسم القسم في السايد بار). لازم نتأكد منها هنا الأول
    // عشان الـ breadcrumb يرجّع اسم ومجموعة صح لصفحات الداشبورد دي.
    for (var d = 0; d < groups.length; d++) {
      if (groups[d].dashboardPage === page) {
        // ✅ [FIX] لوحة تحكم القسم دي مستوى واحد بس تحت "لوحة التحكم"
        // الرئيسية — من غير ما نكرر اسم القسم مرتين (كرمب نصي + current)
        return {
          crumbs: [],
          label: I18N.t(groups[d].group) || page,
          icon: groups[d].icon || "",
        };
      }
    }
    for (var i = 0; i < groups.length; i++) {
      var items = groups[i].items || [];
      for (var j = 0; j < items.length; j++) {
        if (items[j].page === page) {
          return {
            // [BREADCRUMB-4-LEVEL] "crumbs" مصفوفة تمثّل كل المستويات
            // اللي قبل الصفحة الحالية. البند العادي في NAV_GROUPS بياخد
            // مستوى واحد بس (اسم المجموعة) زي ما كان قبل كده.
            // ✅ [BREADCRUMB-ALL-LINKS] لو المجموعة عندها dashboardPage
            // (زي "المحاسبة" → accounting-dashboard)، بقى كرمب اسم
            // المجموعة نفسه رابط قابل للضغط بيوديك للوحة تحكم القسم —
            // بدل ما يفضل نص عادي زي ما كان الوضع قبل كده. لو المجموعة
            // معندهاش داشبورد أصلاً، بيفضل نص عادي (مفيش حاجة تتربط بيها).
            crumbs: [
              {
                label: groups[i].group ? I18N.t(groups[i].group) : "",
                page: groups[i].dashboardPage || null,
              },
            ],
            label: items[j].label ? I18N.t(items[j].label) : page,
            icon: items[j].icon || "",
          };
        }
      }
    }
    // ✅ [FIX] لو الصفحة مش مسجّلة كـ item مباشر في NAV_GROUPS — غالبًا
    // ده تقرير تفصيلي بيُفتح من جوه أحد الـ Hubs (مثل sales_summary جوه
    // sales_hub) ومسجّل بس في ERP_PAGE_MAP. كان قبل كده الـ breadcrumb
    // بيرجّع page id الخام (مثلاً "sales_summary") لحد ما نوصل هنا.
    // دلوقتي بنحاول نجيب اسمه الحقيقي ومجموعته (اسم الـ Hub الأب) منها.
    if (typeof ERP_PAGE_MAP !== "undefined" && ERP_PAGE_MAP[page]) {
      var info = ERP_PAGE_MAP[page];
      var moduleHubMap = {
        reports: "reports_hub",
        inventory: "inventory_hub",
        sales: "sales_hub",
        customers: "customers_hub",
        suppliers: "suppliers_hub",
        purchases: "purchases_hub",
        production: "production_hub",
        accounting: "accounting_hub",
        hr: "hr_hub",
        banking: "banking_hub",
        shipping: "shipping_hub",
        assets: "assets_hub",
        tax: "tax_hub",
      };
      var hubPage = moduleHubMap[info.module];
      // [BREADCRUMB-4-LEVEL] بدل ما نرجّع مستوى واحد بس، بنبني المسار
      // الكامل: الرئيسية > التقارير > <اسم مركز التقارير> > <التقرير>.
      // كل مستوى فيه "page" يبقى رابط قابل للضغط (navigate)، وده اللي
      // كان ناقص قبل كده (كان بيتعرض كـ نص عادي مش رابط).
      var crumbs = [{ label: I18N.t("MENU_REPORTS"), page: "reports_hub" }];
      if (hubPage && hubPage !== page) {
        var hubMeta = _getPageNavMeta(hubPage);
        crumbs.push({ label: hubMeta.label || "", page: hubPage });
      }
      return { crumbs: crumbs, label: info.title || page, icon: "" };
    }
    // [FIX-BREADCRUMB-EN] كان الفallback هنا بيرجّع page id الخام
    // بالإنجليزي (مثلاً "user-preferences") لأي صفحة مش مسجّلة في
    // NAV_GROUPS ولا ERP_PAGE_MAP، فيظهر شريط التنقل مخلوط عربي/إنجليزي.
    // دلوقتي بنحاول نجيب الاسم العربي من PAGE_TITLES (نفس الخريطة
    // المستخدمة لعنوان الـ top bar) قبل ما نرجع للـ id الخام كملاذ أخير.
    var _fallbackLabel =
      (typeof window.PAGE_TITLES !== "undefined" && window.PAGE_TITLES[page]) ||
      page ||
      "";
    return { crumbs: [{ label: "" }], label: _fallbackLabel, icon: "" };
  }

  function _favoritesKey() {
    var u = APP.currentUser
      ? APP.currentUser.username || APP.currentUser.email || "user"
      : "guest";
    return "wms_favorite_pages_" + u;
  }

  function getFavoritePages() {
    try {
      var raw = localStorage.getItem(_favoritesKey());
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function isFavoritePage(page) {
    return getFavoritePages().indexOf(page) !== -1;
  }

  function toggleFavoritePage(page) {
    page = page || APP.currentPage;
    if (!page) return;
    var arr = getFavoritePages();
    var idx = arr.indexOf(page);
    if (idx === -1) {
      arr.push(page);
      showToast(I18N.t("SHELL_MSG_PAGE_ADDED_FAVORITES"), "success");
    } else {
      arr.splice(idx, 1);
      showToast(I18N.t("SHELL_MSG_PAGE_REMOVED_FAVORITES"), "info");
    }
    try {
      localStorage.setItem(_favoritesKey(), JSON.stringify(arr));
    } catch (e) {}
    renderPageTrail(page);
  }

  /**
   * [BREADCRUMB-4-LEVEL]
   * page: الصفحة الحالية (زي "accounting_hub" أو "general-ledger").
   * extraCrumb (اختياري): { label, backAction } — بيتبعت لما يكون فيه
   * تقرير مفتوح محليًا جوه Report Center (عن طريق _openGroupReport)
   * من غير navigate كامل، عشان نضيف مستوى رابع باسم التقرير نفسه.
   * backAction: كود JS ينفّذ لما تدوس على كرمب الـ Hub (زي
   * "_closeGroupReport('accounting')") بدل navigate كامل.
   */
  function renderPageTrail(page, extraCrumb) {
    var wrap = document.getElementById("page-trail");
    if (!wrap) return;
    var meta = _getPageNavMeta(page);
    var favs = getFavoritePages()
      .map(function (p) {
        var m = _getPageNavMeta(p);
        return (
          '<button class="page-fav-chip" onclick="navigate(\'' +
          esc(p) +
          '\')" title="' +
          esc(m.label) +
          '">' +
          (m.icon || "") +
          "<span>" +
          esc(m.label) +
          "</span></button>"
        );
      })
      .join("");

    function _sep() {
      return '<i class="ti ti-chevron-left bc-sep"></i>';
    }
    function _link(label, onclickJs) {
      return (
        '<button class="bc-link" onclick="' +
        onclickJs +
        '"><span>' +
        esc(label) +
        "</span></button>"
      );
    }
    function _text(label) {
      return '<span class="bc-group">' + esc(label) + "</span>";
    }
    function _current(label, icon) {
      return (
        '<span class="bc-current">' +
        (icon || "") +
        "<span>" +
        esc(label) +
        "</span></span>"
      );
    }

    var trailHtml = "";
    if (page !== "dashboard") {
      (meta.crumbs || []).forEach(function (c) {
        if (!c.label) return;
        trailHtml +=
          _sep() +
          (c.page
            ? _link(c.label, "navigate('" + c.page + "')")
            : _text(c.label));
      });
      if (extraCrumb && extraCrumb.label) {
        // فيه تقرير مفتوح محليًا جوه الـ Hub: نحوّل كرمب الـ Hub لرابط
        // رجوع، ونضيف اسم التقرير كمستوى أخير (رابع) هو الـ current.
        trailHtml +=
          _sep() +
          _link(
            meta.label,
            extraCrumb.backAction || "navigate('" + esc(page) + "')",
          );
        trailHtml += _sep() + _current(extraCrumb.label, "");
      } else {
        trailHtml += _sep() + _current(meta.label, meta.icon);
      }
    }

    wrap.innerHTML =
      '<div class="page-trail-inner">' +
      '<div class="breadcrumbs">' +
      '<button class="bc-link" onclick="navigate(\'dashboard\')"><i class="ti ti-home"></i><span>' +
      I18N.t("MENU_DASHBOARD") +
      "</span></button>" +
      trailHtml +
      "</div>" +
      '<div class="page-trail-actions">' +
      (favs ? '<div class="page-fav-list">' + favs + "</div>" : "") +
      '<button class="page-fav-btn' +

      emoji: "💾",
      subtitle: "يتم نسخ البيانات على Drive",
    });

      APP.currentUser ? APP.currentUser.username : "manual",

            "✅ " +

  function openBackupList() {
    if (!canDo("createBackup")) return;
    openDrawer(
      "<div class='modal-box' style='max-width:520px'>" +
        "<div class='modal-header'><div class='modal-header-left'><div class='modal-icon'><i class='ti ti-history' style='font-size:20px'></i></div><div><h2>النسخ الاحتياطية المحفوظة</h2><div class='modal-header-sub'>اختر نسخة لاستعادة البيانات منها</div></div></div><button class='modal-close' onclick='closeDrawer()'><i class='ti ti-x'></i></button></div>" +
        "<div id='backup-list-body' style='padding:8px 0 4px;min-height:80px;display:flex;align-items:center;justify-content:center'>" +
        _loadingBlock() +
        "</div>" +
        "<div class='modal-actions'>" +
        "<button class='btn btn-outline' onclick='closeDrawer()'>إغلاق</button>" +
        "<button class='btn btn-primary' onclick='doCreateBackup()'>💾 نسخة جديدة الآن</button>" +
        "</div></div>",
    );

    DL.Backup.listFiles({
      onSuccess: function (result) {
        var res = result.data;
        var body = document.getElementById("backup-list-body");
        if (!body) return;
        if (!res.success || !res.files || res.files.length === 0) {
          body.innerHTML =
            "<div style='color:var(--text3);font-size:13px;padding:24px 0;text-align:center'>لا توجد نسخ احتياطية محفوظة بعد</div>";
          return;
        }
        var rows = res.files
          .map(function (f) {
            var dt = "";
            try {
              dt = new Date(f.created_at).toLocaleString("en-US", {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
              });
            } catch (e) {
              dt = f.created_at;
            }
            var sizeMB = f.size
              ? (f.size / 1024 / 1024).toFixed(0) + " MB"
              : "";
            return (
              "<div style='display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;background:var(--surface)'>" +
              "<div style='flex:1;min-width:0'>" +
              "<div style='font-size:13px;font-weight:600;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis' title='" +
              esc(f.name) +
              "'>" +
              esc(f.name) +
              "</div>" +
              "<div style='font-size:11px;color:var(--text3);margin-top:2px'>" +
              dt +
              (sizeMB ? " &nbsp;·&nbsp; " + sizeMB : "") +
              "</div>" +
              "</div>" +
              (canDo("restoreBackup")
                ? "<button onclick=\"doRestoreBackup('" +
                  esc(f.id) +
                  "','" +
                  esc(f.name) +
                  "')\" class='btn btn-primary btn-sm' style='white-space:nowrap;flex-shrink:0'>" +
                  "<i class='ti ti-restore' style='font-size:14px'></i> استعادة" +
                  "</button>"
                : "<span style='font-size:11px;color:var(--text3);white-space:nowrap' title='صلاحية الاستعادة للأدمن فقط'><i class='ti ti-lock'></i> استعادة</span>") +
              "</div>"
            );
          })
          .join("");

        var folderBtn = "";

        body.style.display = "block";
        body.innerHTML =
          "<div style='max-height:340px;overflow-y:auto;padding:0 2px'>" +
          rows +
          "</div>" +
          folderBtn;
      },
      onError: function (result) {
        var body = document.getElementById("backup-list-body");
        if (body)
          body.innerHTML =
            "<div style='color:var(--error);font-size:13px;padding:16px 0;text-align:center'>❌ خطأ: " +
            esc(result.message || "") +
            "</div>";
      },
    });
  }
  function doRestoreBackup(fileId, fileName) {
    if (!fileId) return;
    if (!canDo("restoreBackup")) {
      showToast("⛔ صلاحية الاستعادة للأدمن فقط", "error");

    openModal(
      "<div class='modal-box' style='max-width:420px'>" +
        "<div class='modal-header'><div class='modal-header-left'><div class='modal-icon' style='background:rgba(239,68,68,.15)'><i class='ti ti-alert-triangle' style='font-size:20px;color:var(--error)'></i></div><div><h2>تأكيد الاستعادة</h2><div class='modal-header-sub'>هذه العملية ستستبدل البيانات الحالية</div></div></div><button class='modal-close' onclick='closeModal()'><i class='ti ti-x'></i></button></div>" +
        "<div class='modal-body'>" +
        "<div style='background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:14px 16px;margin-bottom:12px'>" +
        "<p style='margin:0;font-size:13px;color:var(--text1);line-height:1.7'>⚠️ سيتم <strong>استبدال جميع البيانات الحالية</strong> بالبيانات الموجودة في النسخة الاحتياطية:</p>" +
        "<p style='margin:8px 0 0;font-size:12px;font-weight:600;color:var(--text2);word-break:break-all'>" +
        esc(fileName) +
        "</p>" +
        "</div>" +
        "<p style='margin:0;font-size:12px;color:var(--text3)'>تأكد أنك تريد المتابعة. لا يمكن التراجع عن هذه العملية.</p>" +
        "</div>" +
        "<div class='modal-actions'>" +
        "<button class='btn btn-outline' onclick='closeModal()'>إلغاء</button>" +
        "<button id='confirm-restore-btn' class='btn' style='background:var(--error);color:#fff' onclick='_execRestore(\"" +
        esc(fileId) +
        '","' +
        esc(fileName) +
        "\")'>" +
        "<i class='ti ti-restore'></i> نعم، استعادة الآن" +
        "</button>" +
        "</div></div>",
    );
  }

  function _execRestore(fileId, fileName) {
    var btn = document.getElementById("confirm-restore-btn");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML =
        "<i class='ti ti-loader-2' style='animation:spin 1s linear infinite'></i> جاري الاستعادة...";
    }
    DL.Backup.restore(fileId, currentUser && currentUser.name, {
      onSuccess: function (result) {
        var res = result.data;
        closeModal();
        if (res.success) {
          showToast(
            I18N.t("SHELL_MSG_RESTORE_SUCCESS_FROM") + " " + fileName,
            "success",
            5000,
          );
          setTimeout(function () {
            // [INTENTIONAL-RELOAD] إعادة تحميل كاملة مقصودة هنا:
            // استعادة النسخة الاحتياطية تغير البيانات بشكل جذري في السيرفر
            // ولا يمكن تحديث الـ cache المحلي بدون reload كامل لضمان سلامة البيانات
            location.reload();
          }, 2000);
        } else {
          showToast(
            "❌ فشل الاستعادة: " + (res.message || "خطأ غير معروف"),
            "error",
            6000,
          );
        }
      },
      onError: function (result) {
        closeModal();
        showToast(
          I18N.t("SHELL_MSG_ERROR_ICON_PREFIX") + " " + (result.message || ""),
          "error",
          6000,
        );
      },
    });
  }

  function _toggleBackupDayField(freq) {
    var wrap = document.getElementById("backup-day-wrap");
    var label = document.getElementById("backup-day-label");
    var dayEl = document.getElementById("backup-day");
    if (!wrap) return;
    if (freq === "weekly") {
      wrap.style.display = "";
      if (label) label.textContent = "اليوم (من الأسبوع)";
      // خيارات أيام الأسبوع
      if (dayEl)
        dayEl.innerHTML =
          '<option value="1">الاثنين</option><option value="2">الثلاثاء</option>' +
          '<option value="3">الأربعاء</option><option value="4">الخميس</option>' +
          '<option value="5">الجمعة</option><option value="6">السبت</option><option value="7">الأحد</option>';
    } else if (freq === "monthly") {
      wrap.style.display = "";
      if (label) label.textContent = "يوم من الشهر";
      // خيارات 1-28
      if (dayEl) {
        var opts = "";
        for (var i = 1; i <= 28; i++)
          opts += '<option value="' + i + '">' + i + "</option>";
        dayEl.innerHTML = opts;
      }
    } else {
      wrap.style.display = "none";
    }
  }

  function saveBackupSchedule() {
    var freqEl = document.getElementById("backup-frequency");
    var hourEl = document.getElementById("backup-hour");
    var dayEl = document.getElementById("backup-day");
    if (!freqEl || !hourEl) return;

    var schedule = {
      frequency: freqEl.value,
      hour: Number(hourEl.value),
      day: dayEl ? Number(dayEl.value) : 1,
    };

    var anim = showSaveAnim({
      title: "جاري حفظ جدول الباكاب...",
      emoji: "⏰",
      subtitle: "",
    });
    DL.Backup.setupTrigger(schedule, {
      onSuccess: function (result) {
        anim.done("✅ تم حفظ الجدول");
        showToast(result.message, "success");
      },
      onError: function (result) {
        anim.fail(result.message || "فشل الحفظ");
      },
    });
  }

  function bindNav() {
    // ── إضافة زر الباكاب للـ header لو المستخدم أدمن ──
    setTimeout(_addBackupIndicatorToHeader, 100);

    // ── دالة مساعدة: أغلق كل الـ dropdowns وامسح التلوين ──
    // [REFACTOR-P7] _closeAllDropdowns اتنقلت لـ Core_UIManagers.html (Global، بنفس الاسم)

    // ── flat nav items ──
    document.querySelectorAll(".nav-item").forEach(function (el) {
      if (el.classList.contains("nav-dropdown-toggle")) return;
      el.addEventListener("click", function () {
        _closeAllDropdowns();
        closeSidebar();
        renderPage(el.dataset.page);
      });
    });

    // ── دالة مساعدة: اعمل auto-scroll للسايد بار عشان الجروب اللي اتفتح يظهر كامل ──
    // ✅ [FIX] لما المستخدم يفتح جروب جديد من السايد بار، الجروب ممكن يطلع
    // جزء منه برا تحت حدود السايد بار المرئية، فبنستنى انتهاء أنيميشن
    // الفتح (0.32s زي ما محدد في CSS) وبعدين نحسب الفرق ونعمل scroll
    // باللي يلزم بالظبط — مع مراعاة إن عنوان الجروب نفسه يفضل ظاهر فوق.
    function _scrollGroupIntoView(wrapEl) {
      var navEl = document.querySelector(".sidebar-nav");
      if (!navEl || !wrapEl) return;
      setTimeout(function () {
        var navRect = navEl.getBoundingClientRect();
        var wrapRect = wrapEl.getBoundingClientRect();
        var overflowBottom = wrapRect.bottom - navRect.bottom;
        var overflowTop = navRect.top - wrapRect.top;
        if (overflowBottom > 0) {
          // الجروب طالع برا تحت — انزل بالسكرول، بس متخليش رأس الجروب يطلع برا فوق
          var scrollBy = Math.min(
            overflowBottom,
            Math.max(0, wrapRect.top - navRect.top),
          );
          if (scrollBy > 0)
            navEl.scrollBy({ top: scrollBy, behavior: "smooth" });
        } else if (overflowTop > 0) {
          // الجروب طالع جزئيًا فوق — اطلع لفوق بالقد اللازم
          navEl.scrollBy({ top: -overflowTop, behavior: "smooth" });
        }
      }, 340);
    }

    // ── [SIDEBAR-V3] رأس المجموعة بقى منطقتين مستقلتين ──
    //  1) .nav-grp-arrow  → دايمًا بيفتح/يقفل القائمة الفرعية بس (accordion).
    //  2) .nav-grp-label  → لو معاها data-dashboard-page: بتفتح داشبورد
    //     القسم مباشرة (زي أي nav-item عادي) من غير ما تفتح/تقفل القائمة.
    //     لو القسم لسه معندوش داشبورد (data-dashboard-page مش موجودة):
    //     بترجع لنفس سلوك الأول القديم (فتح/قفل القائمة) عشان الأقسام
    //     اللي لسه ملهاش Dashboard (مثلاً "العملاء"، "الموردين"، "الإدارة")
    //     تفضل شغالة عادي لحد ما نبني لها Dashboards في مرحلة لاحقة.
    function _toggleGroupMenu(gId) {
      var toggleEl = document.getElementById(gId + "-toggle");
      var menuEl = document.getElementById(gId + "-menu");
      if (!toggleEl || !menuEl) return;
      var open = menuEl.classList.contains("open");

      // أغلق كل الـ groups الأخرى وامسح تلوينها (بانتقال سلس)
      document
        .querySelectorAll(".nav-grp-toggle")
        .forEach(function (otherToggle) {
          if (otherToggle === toggleEl) return;
          var oId = otherToggle.id.replace("-toggle", "");
          var oMenu = document.getElementById(oId + "-menu");
          if (oMenu) oMenu.classList.remove("open");
          otherToggle.classList.remove("open", "has-active");
          if (oMenu) {
            oMenu
              .querySelectorAll(".nav-sub-item.active")
              .forEach(function (x) {
                x.classList.remove("active");
              });
          }
        });

      // فتح/إغلاق الـ group الحالية
      menuEl.classList.toggle("open", !open);
      toggleEl.classList.toggle("open", !open);
      if (open) {
        // بتقفل — امسح كل التحديد ووقف مؤقت الإغلاق التلقائي
        toggleEl.classList.remove("has-active");
        menuEl.querySelectorAll(".nav-sub-item.active").forEach(function (x) {
          x.classList.remove("active");
        });
      } else {
        // ✅ [FIX] بتفتح — اعمل auto-scroll للسايد بار عشان الجروب يظهر كامل
        var wrapEl = document.getElementById(gId + "-wrap");
        _scrollGroupIntoView(wrapEl);
      }
    }

    // السهم: يفتح/يقفل القائمة الفرعية بس — مفيش navigate خالص هنا
    document.querySelectorAll(".nav-grp-arrow").forEach(function (arrowEl) {
      var gId = arrowEl.id.replace("-arrow", "");
      arrowEl.addEventListener("click", function (e) {
        e.stopPropagation();
        // [FIX-SIDEBAR-SOUND] الـ stopPropagation فوق بيمنع صوت النقر العام
        // (المُفعَّل عبر delegation على document) من الوصول هنا — نشغّله يدوياً
        // عشان السهم يصوّت زي أي زر تاني في السايد بار.
        if (typeof AS !== "undefined") {
          try {
            AS.click();
          } catch (eX) {}
        }
        _toggleGroupMenu(gId);
      });
    });

    // اسم القسم: لو عنده Dashboard → افتحه مباشرة. لو مفيش → افتح/اقفل القائمة (سلوك قديم)
    document.querySelectorAll(".nav-grp-label").forEach(function (labelEl) {
      var wrapEl = labelEl.closest(".nav-dropdown");
      var gId = wrapEl ? wrapEl.id.replace("-wrap", "") : "";
      labelEl.addEventListener("click", function (e) {
        e.stopPropagation();
        // [FIX-SIDEBAR-SOUND] نفس مشكلة السهم — stopPropagation بيمنع صوت
        // النقر العام، فبنشغّله يدوياً هنا.
        if (typeof AS !== "undefined") {
          try {
            AS.click();
          } catch (eX) {}
        }
        var dashPage = labelEl.dataset.dashboardPage;
        if (dashPage) {
          _closeAllDropdowns();
          closeSidebar();
          renderPage(dashPage);
        } else {
          _toggleGroupMenu(gId);
        }
      });
    });

    // ── Sub-items ──
    document.querySelectorAll(".nav-sub-item").forEach(function (el) {
      el.addEventListener("click", function () {
        // امسح active من كل الـ sub-items فقط
        document.querySelectorAll(".nav-sub-item.active").forEach(function (x) {
          x.classList.remove("active");
        });
        el.classList.add("active");

        // حافظ على الـ group الأم مفتوحة وعليها highlight
        var parentMenu = el.closest("[id$='-menu']");
        if (parentMenu) {
          var gId = parentMenu.id.replace("-menu", "");
          var toggleEl = document.getElementById(gId + "-toggle");
          if (toggleEl) toggleEl.classList.add("open", "has-active");
          parentMenu.classList.add("open");
        }

        closeSidebar();

        // ✅ صفحات كشف الحساب لها pages منفصلة — لا حاجة لـ workaround

        renderPage(el.dataset.page);
      });
    });

    // Mobile sidebar toggle
    var toggleBtn = document.getElementById("sidebar-toggle");
    var backdrop = document.getElementById("sidebar-backdrop");
    if (toggleBtn)
      toggleBtn.addEventListener("click", function () {
        var sb = document.getElementById("main-sidebar");
        var bd = document.getElementById("sidebar-backdrop");
        if (!sb) return;
        var isOpen = sb.classList.contains("open");
        if (isOpen) {
          closeSidebar();
        } else {
          openSidebar();
        }
      });
    if (backdrop) backdrop.addEventListener("click", closeSidebar);

    // ✅ [SIDEBAR-COLLAPSE] زرار الطي/الفتح (ديسكتوب) + استرجاع آخر حالة محفوظة
    var collapseBtn = document.getElementById("sidebar-collapse-btn");
    if (collapseBtn)
      collapseBtn.addEventListener("click", toggleSidebarCollapse);
    _initSidebarCollapseState();

    var tog = document.getElementById("theme-toggle");
    if (tog)
      tog.addEventListener("click", function () {
        // ── [إصلاح P3/P4] مصدر الحقيقة الوحيد الآن هو PreferenceService.set().
        // كل ما كان يتكرر يدويًا هنا (data-theme, wms_theme, مزامنة تاب
        // التفضيلات، الـ pill icons) بقى مسؤولية _applyToUI + مشترك واحد
        // مسجَّل مرة واحدة (انظر _wireThemeSubscription أسفل) بدل تكراره
        // في كل نقطة تُغيّر فيها الثيم (toggle هنا + upSetTheme في شاشة
        // التفضيلات). هذا يقفل ثغرة تعدد مصادر الحقيقة الموثّقة في التقرير.
        var next = APP.isDark ? "light" : "dark";
        if (typeof PreferenceService !== "undefined") {
          PreferenceService.set("theme", next);
        } else {
          // fallback نادر لو PreferenceService لم يُحمَّل بعد (قبل اللوجين)
          APP.isDark = next === "dark";
          document.documentElement.setAttribute(
            "data-theme",
            APP.isDark ? "dark" : "",
          );
          localStorage.setItem("wms_theme", APP.isDark ? "dark" : "");
        }
      });
    var logoutBtn = document.getElementById("btn-logout");
    if (logoutBtn) logoutBtn.addEventListener("click", doLogout);
  }

  // 🛠️  المساعدات العامة — Utilities

  // ══════════════════════════════════════════════════════════
  //  🔒 حماية الصفر الأول (Leading Zero Protection) — Frontend
  //  استخدمها مع: رقم الهاتف / الواتساب / الكود / SKU / Barcode / الرقم القومي
  //  ⚠️ ممنوع نهائيًا استخدام Number() أو parseInt() أو parseFloat() أو
  //  العامل + على أي قيمة من هذه الحقول — استخدم preserveTextNumber دايمًا
  // ══════════════════════════════════════════════════════════

  /**
   * preserveTextNumber — يحوّل أي قيمة إلى نص نظيف بدون أي تحويل رقمي
   * نفس الدالة موجودة في الباك إند (Code.js) لتوحيد المنطق بين الطرفين
   * @param {*} value
   * @returns {string}
   */
  function preserveTextNumber(value) {
    if (value === null || value === undefined) return "";
    return String(value).trim();
  }

  /**
   * sanitizeDigitsKeepLeadingZero — يسمح بالأرقام فقط (وعلامة + اختياريًا
   * في البداية للأرقام الدولية) بدون أي تحويل لـ Number — فيحافظ على
   * الصفر الأول والطول الأصلي للرقم كما كتبه المستخدم
   * @param {string} value
   * @param {boolean} [allowPlus]
   * @returns {string}
   */
  function sanitizeDigitsKeepLeadingZero(value, allowPlus) {
    var v = preserveTextNumber(value);
    if (!v) return "";
    var plus = allowPlus && v.charAt(0) === "+" ? "+" : "";
    return plus + v.replace(/\D/g, "");
  }

  /**
   * bindTextNumberInput — يربط حقل <input> برقم/كود نصي فيمنع أي حروف
   * غير رقمية أثناء الكتابة، ويحافظ على الصفر الأول تلقائيًا (بدون أي
   * Number()/parseInt() في أي مكان). يضمن أيضًا إن نوع الحقل text لا number.
   *
   * مثال: bindTextNumberInput('emp-d-phone', { allowPlus: true });
   * @param {string|HTMLElement} inputIdOrEl
   * @param {{allowPlus?: boolean}} [opts]
   */
  function bindTextNumberInput(inputIdOrEl, opts) {
    opts = opts || {};
    var el =
      typeof inputIdOrEl === "string"
        ? document.getElementById(inputIdOrEl)
        : inputIdOrEl;
    if (!el || el._textNumberBound) return;
    if (el.type === "checkbox" || el.type === "radio") return;
    el._textNumberBound = true;
    el.setAttribute("type", "text"); // تأكيد إنه مش input من نوع number
    el.setAttribute("inputmode", "numeric");
    el.addEventListener("input", function () {
      var pos = el.selectionStart;
      var before = el.value;
      el.value = sanitizeDigitsKeepLeadingZero(el.value, opts.allowPlus);
      if (pos != null && el.value.length === before.length) {
        try {
          el.setSelectionRange(pos, pos);
        } catch (e) {}
      }
    });
  }

  /**
   * autoProtectTextNumberInputs — يفحص الصفحة (أو جزء منها) ويربط تلقائيًا
   * كل حقل واضح إنه هاتف/كود برقم باستخدام bindTextNumberInput.
   * نادِها بعد أي render لفورم/مودال فيه حقول هاتف أو كود جديدة، مثال:
   *   openStyledDrawer({...}); autoProtectTextNumberInputs();
   *
   * ⚡ الأداء: الفحص نفسه مؤجَّل بـ setTimeout(0) داخليًا تلقائيًا، بحيث
   * يشتغل بعد ما المتصفح يخلّص رسم الشاشة/حركة الفتح، فمايعملش أي تهنيج
   * (jank) أثناء فتح أي درج/مودال — حتى لو الشاشة فيها مئات الحقول.
   * @param {HTMLElement|Document} [root]
   */
  function autoProtectTextNumberInputs(root) {
    var scope = root || document;
    setTimeout(function () {
      var selector =
        "input[data-text-number]:not([data-allow-alpha]), " +
        'input[id*="phone" i]:not([data-allow-alpha]), input[id*="mobile" i]:not([data-allow-alpha]), ' +
        'input[id*="whatsapp" i]:not([data-allow-alpha]), input[id*="-code"]:not([data-allow-alpha]), ' +
        'input[id*="_code"]:not([data-allow-alpha]), input[id$="code"]:not([data-allow-alpha]), ' +
        'input[id*="barcode" i]:not([data-allow-alpha]), input[id*="sku" i]:not([data-allow-alpha]), ' +
        'input[id*="national" i]:not([data-allow-alpha])';
      try {
        var els = scope.querySelectorAll(selector);
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          var isPhoneLike = /phone|mobile|whatsapp/i.test(el.id || "");
          bindTextNumberInput(el, { allowPlus: isPhoneLike });
        }
      } catch (e) {
        // المتصفح ممكن مايدعمش الـ "i" flag بالـ selector (نادرًا) —
        // جرّب تاني بدونها بأمان
        try {
          var fallbackSel =
            "input[data-text-number]:not([data-allow-alpha]), " +
            'input[id*="phone"]:not([data-allow-alpha]), input[id*="Phone"]:not([data-allow-alpha]), ' +
            'input[id*="mobile"]:not([data-allow-alpha]), input[id*="Mobile"]:not([data-allow-alpha]), ' +
            'input[id*="whatsapp"]:not([data-allow-alpha]), input[id*="Whatsapp"]:not([data-allow-alpha]), ' +
            'input[id*="-code"]:not([data-allow-alpha]), input[id*="_code"]:not([data-allow-alpha]), input[id$="code"]:not([data-allow-alpha]), ' +
            'input[id*="barcode"]:not([data-allow-alpha]), input[id*="Barcode"]:not([data-allow-alpha]), ' +
            'input[id*="sku"]:not([data-allow-alpha]), input[id*="SKU"]:not([data-allow-alpha]), ' +
            'input[id*="national"]:not([data-allow-alpha]), input[id*="National"]:not([data-allow-alpha])';
          var els2 = scope.querySelectorAll(fallbackSel);
          for (var j = 0; j < els2.length; j++) {
            var el2 = els2[j];
            bindTextNumberInput(el2, {
              allowPlus: /phone|mobile|whatsapp/i.test(el2.id || ""),
            });
          }
        } catch (e2) {
          // تجاهل بأمان — لا يوقف باقي الصفحة
        }
      }
    }, 0);
  }

  /* ✅ [FIX-TOAST] الـ bubble يظهر فوق زرار الروبوت مباشرةً بمسافة محترمة */
  function _positionBubble(bubble) {
    var fab = document.getElementById("ai-fab");
    var bW = Math.min(300, window.innerWidth - 32);

    bubble.style.width = bW + "px";
    bubble.style.position = "fixed";

    if (fab) {
      var fr = fab.getBoundingClientRect();
      var fabCX = fr.left + fr.width / 2; // مركز الأيقون أفقياً

      var bH = bubble.offsetHeight || 60;

      // الرسالة تبدأ من يسار الأيقون (بداية الدائرة)
      var bubbleLeft = fr.left;
      bubbleLeft = Math.max(
        8,
        Math.min(bubbleLeft, window.innerWidth - bW - 8),
      );

      // السهم عند مركز الأيقون بالظبط
      var arrowX = fabCX - bubbleLeft;
      arrowX = Math.max(16, Math.min(arrowX, bW - 16));

      // هل في مكان كافي تحت الأيقون؟
      var spaceBelow = window.innerHeight - fr.bottom - 8;
      if (spaceBelow >= bH + 10) {
        // ← كافي: الرسالة تحت الأيقون، السهم فوقها يشير لأعلى
        bubble.style.top = fr.bottom + 10 + "px";
        bubble.style.bottom = "";
        bubble.setAttribute("data-pos", "below");
      } else {
        // ← مش كافي: الرسالة فوق الأيقون، السهم أسفلها يشير لأسفل
        bubble.style.top = fr.top - bH - 10 + "px";
        bubble.style.bottom = "";
        bubble.setAttribute("data-pos", "above");
      }

      bubble.style.left = bubbleLeft + "px";
      bubble.style.right = "";
      bubble.style.setProperty("--fab-arrow-x", arrowX + "px");
    } else {
      bubble.style.left = "10px";
      bubble.style.bottom = "90px";
      bubble.style.top = "";
      bubble.style.right = "";
      bubble.style.setProperty("--fab-arrow-x", "24px");
    }
  }

    function _updateChecklistAndStrength() {
      var np = newInp.value;
      var cp = confirmInp.value;
      var state = VF.checkPasswordRequirements(np, cp);
      Object.keys(REQ_LABELS).forEach(function (key) {
        var li = overlay.querySelector('[data-req="' + key + '"]');
        if (!li) return;
        if (state[key]) {
          li.style.color = "#16a34a";
          li.textContent = "✔ " + REQ_LABELS[key];
        } else {
          li.style.color = "#94a3b8";
          li.textContent = "○ " + REQ_LABELS[key];
        }
      });
      var matchLi = overlay.querySelector('[data-req="match"]');
      if (matchLi) {
        if (cp.length > 0 && state.match) {
          matchLi.style.color = "#16a34a";
          matchLi.textContent = "✔ كلمتا المرور متطابقتان";
        } else if (cp.length > 0) {

          matchLi.style.color = "#94a3b8";

      }

      // مؤشر قوة كلمة المرور (لا يحتسب match)
      var meta = VF.passwordStrengthMeta(state.passCount, np.length);
      strengthBar.style.width = meta.pct + "%";
      strengthBar.style.background = meta.color;
      strengthLabel.textContent = meta.label;
      strengthLabel.style.color = meta.color;

      var allOk = state.allOk;
      submitBtn.disabled = !allOk;
      submitBtn.style.cursor = allOk ? "pointer" : "not-allowed";
      return allOk;
    }

            // ومتعلّم "_prefetch_full = true"، فـ _afterLoginSuccess كانت
            // بتستخدمه كما هو بدل ما تجيب بيانات جديدة — يعني آخر دخول
            // وأي تغييرات حصلت أثناء تغيير كلمة المرور (زي last_login في
            // Users) ما كانتش بتظهر إلا بعد تحديث الصفحة يدويًا. إبطال
            // الـ prefetch هنا يجبر _afterLoginSuccess إنها تعمل
            // loadAllData() حقيقية وتجيب أحدث نسخة من السيرفر.
            _prefetch.done = false;
            _prefetch.data = null;
            _afterLoginSuccess(loginRes);
          },
          onError: function (result) {
            _showErr(
              (result && result.message) ||
                "تعذّر تغيير كلمة المرور — حاول مرة أخرى",
            );
            submitBtn.disabled = false;
            submitBtn.textContent = "تغيير كلمة المرور والمتابعة";
            _updateChecklistAndStrength();
          },
        },
      );
    });

    // ── الخروج بدلاً من تغيير كلمة المرور الآن ────────────────
    // ✅ [FIX-LOGOUT-DUP-CONFIRM] المستخدم دوس على رابط صريح اسمه "تسجيل

    document
      .getElementById("fpw-logout-link")
      .addEventListener("click", function () {

  }

  /**
   * initCustomSelects — [SELECTION-ENGINE] بقت delegator رفيع فوق محرك
   * الاختيار الموحّد AppSelect (راجع 49_JS_SelectionEngine.html +
   * Style_14_AppSelect.html). النظام القديم (cs-wrap المبني هنا بشكل
   * يدوي بالكامل) اتشال نهائيًا — الاسم والتوقيع (initCustomSelects(container))
   * فضلوا زي ما هم عشان مفيش أي حاجة تتعدل في كل الشاشات اللي بتنادي
   * عليها (Core_UIManagers.html وغيره)، لكن التنفيذ الفعلي بقى بيمرّ
   * على AppSelect.upgrade() زي أي select تاني في السيستم.
   *
   * ملحوظة: بنشتغل على كل select داخل الـ container (مش بس select.input
   * زي الأول) عشان أي فورم قديم (HR، المحاسبة، إلخ) بيبني select من غير
   * class="input" برضه يتوحّد تلقائيًا. أي شاشة عايزة تستثني select
   * معيّن من التحويل التلقائي تضيفله data-as-skip.
   */
  function initCustomSelects(container) {
    if (typeof AppSelect === "undefined") return; // fallback أمان لو الملف ما اتحملش لسبب ما
    var scope = container || document;
    var selects = scope.querySelectorAll(
      "select:not([data-as-init]):not([data-as-skip])"
    );
    selects.forEach(function (sel) {
      var inst = AppSelect.upgrade(sel, {});
      if (!inst) return;

      // بديل الـ MutationObserver القديم: أي كود شاشة قديم بيغيّر innerHTML
      // بتاع الـ <select> يدويًا (Cascading Select) يفضل شغال زي ما هو —
      // AppSelect.refresh() بتعيد قراءة الـ <option> وتحدّث القيمة الحالية.
      var observer = new MutationObserver(function () {
        AppSelect.refresh(sel);
      });
      observer.observe(sel, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["value"],
      });
    });
  }

    if (!title) {

  (function _startDrawerOrphanWatcher() {
    setInterval(function () {
      // لو في backdrop بس من غير drawer — يبقى orphan → شيله فوراً
      var bg = document.getElementById("drawer-backdrop");
      var drawer = document.getElementById("edit-drawer");
      if (bg && !drawer) {
        bg.style.pointerEvents = "none";
        bg.style.transition = "opacity .15s";
        bg.style.opacity = "0";
        setTimeout(function () {
          if (bg.parentNode) bg.remove();
        }, 160);
      }
      // لو في drawer بيحاول يتغلق من فترة طويلة (drawer-closing + وقت كافي)
      // شيله كمان
      if (drawer && drawer.classList.contains("drawer-closing")) {
        // هو المفروض يتشال في 200ms — لو لسه بعد 500ms اشيله قسراً
        if (!drawer._forceRemoveTimer) {
          drawer._forceRemoveTimer = setTimeout(function () {
            if (drawer && drawer.parentNode) drawer.remove();
          }, 500);
        }
      }
    }, 1000);
  })();

        "@keyframes confirmBoxIn { from{opacity:0;transform:scale(0.88)} to{opacity:1;transform:scale(1)} }",
        "@keyframes confirmBoxOut { from{opacity:1;transform:scale(1)} to{opacity:0;transform:scale(0.88)} }",
      ].join("\n");
      document.head.appendChild(s);
    }

    document.body.appendChild(bg);

    function closeConfirmModal() {
      var b = document.getElementById("confirm-modal-backdrop");
      if (!b) return;
      var bx = document.getElementById("confirm-modal-box");
      if (bx) bx.style.animation = "confirmBoxOut 0.16s ease forwards";
      b.style.animation = "confirmBgIn 0.16s ease reverse forwards";
      setTimeout(function () {
        if (b && b.parentNode) b.parentNode.removeChild(b);
      }, 160);
    }

    setTimeout(function () {
      var okBtn = document.getElementById("confirm-ok-btn");
      var cnBtn = document.getElementById("confirm-cancel-btn");
      if (okBtn)
        okBtn.addEventListener("click", function () {
          closeConfirmModal();
          _freezeUI(freezeMsg);
          if (opts.onConfirm) opts.onConfirm(_unfreezeUI);
        });
      if (cnBtn)
        cnBtn.addEventListener("click", function () {
          closeConfirmModal();
        });
    }, 50);
  }

  /* ─────────────────────────────────────────────────────────────
     showPromptDialog — نافذة إدخال نصي/رقمي بنفس هوية النظام
     (بديل window.prompt الأصلي الخاص بالمتصفح)
     opts: { title, message, icon, iconColor, inputType, placeholder,
             defaultValue, confirmText, onConfirm(value, unfreeze) }
  ───────────────────────────────────────────────────────────── */
  function showPromptDialog(opts) {
    opts = opts || {};
    closeModal();
    var icon = opts.icon || "ti-pencil";
    var iconColor = opts.iconColor || "#2563eb";
    var title = opts.title || "إدخال";
    var message = opts.message || "";
    var confirmText = opts.confirmText || "حفظ";
    var inputType = opts.inputType || "text";
    var placeholder = opts.placeholder || "";
    var defaultValue =
      opts.defaultValue === undefined || opts.defaultValue === null
        ? ""
        : opts.defaultValue;
    var freezeMsg = opts.freezeMessage || "⏳ جاري الحفظ...";

    var iconBg = iconColor + "22";

    var bg = document.createElement("div");
    bg.id = "prompt-modal-backdrop";
    bg.style.cssText = [
      "position:fixed",
      "top:0",
      "left:0",
      "bottom:0",
      "right:var(--sidebar-w, 0px)", // يتمركز جوه مساحة المحتوى بعيداً عن السايدبار، مش على الشاشة كلها
      "z-index:9600",
      "background:rgba(0,0,0,0.45)",
      "display:flex",
      "align-items:center",
      "justify-content:center",
      "animation:confirmBgIn 0.18s ease",
    ].join(";");
    bg.onclick = function (e) {
      if (e.target === bg) closePromptModal();
    };

    var box = document.createElement("div");
    box.id = "prompt-modal-box";
    box.style.cssText = [
      "background:var(--bg)",
      "border-radius:20px",
      "width:min(420px,92vw)",
      "box-shadow:0 8px 40px rgba(0,0,0,0.18)",
      "display:flex",
      "flex-direction:column",
      "overflow:hidden",
      "animation:confirmBoxIn 0.22s cubic-bezier(0.34,1.56,0.64,1)",
      "pointer-events:all",
    ].join(";");

    box.innerHTML =
      '<div style="padding:32px 32px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0">' +
      '<div style="width:64px;height:64px;border-radius:18px;background:' +
      iconBg +
      ";display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;color:" +
      iconColor +
      '">' +
      '<i class="ti ' +
      icon +
      '"></i>' +
      "</div>" +
      '<div style="font-size:16px;font-weight:800;color:var(--text);margin-bottom:8px">' +
      esc(title) +
      "</div>" +
      (message
        ? '<div style="font-size:13px;color:var(--text2);line-height:1.7;max-width:320px;margin-bottom:14px;white-space:pre-line">' +
          esc(message) +
          "</div>"
        : "") +
      '<input type="' +
      esc(inputType) +
      '" id="prompt-modal-input" class="form-control" placeholder="' +
      esc(placeholder) +
      '" value="' +
      esc(defaultValue) +
      '" style="width:100%;text-align:center" />' +
      "</div>" +
      '<div style="padding:14px 24px 20px;display:flex;gap:10px">' +
      '<button class="btn btn-outline" id="prompt-cancel-btn" style="flex:1">إلغاء</button>' +
      '<button class="btn btn-primary" id="prompt-ok-btn" style="flex:1">' +
      esc(confirmText) +
      "</button>" +
      "</div>";

    bg.appendChild(box);
    document.body.appendChild(bg);

    function closePromptModal() {
      var b = document.getElementById("prompt-modal-backdrop");
      if (!b) return;
      var bx = document.getElementById("prompt-modal-box");
      if (bx) bx.style.animation = "confirmBoxOut 0.16s ease forwards";
      b.style.animation = "confirmBgIn 0.16s ease reverse forwards";
      setTimeout(function () {
        if (b && b.parentNode) b.parentNode.removeChild(b);
      }, 160);
    }

    setTimeout(function () {
      var inputEl = document.getElementById("prompt-modal-input");
      var okBtn = document.getElementById("prompt-ok-btn");
      var cnBtn = document.getElementById("prompt-cancel-btn");
      if (inputEl) {
        inputEl.focus();
        inputEl.select();
        inputEl.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            okBtn && okBtn.click();
          }
        });
      }
      if (okBtn)
        okBtn.addEventListener("click", function () {
          var val = inputEl ? inputEl.value : "";
          closePromptModal();
          if (opts.onConfirm) {
            _freezeUI(freezeMsg);
            opts.onConfirm(val, _unfreezeUI);
          }
        });
      if (cnBtn)
        cnBtn.addEventListener("click", function () {
          closePromptModal();
        });
    }, 50);
  }

  // ─────────────────────────────────────────────────────────────
  // HELPERS
  // ─────────────────────────────────────────────────────────────

  function esc(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // [M-01 FIX] دالة debounce عامة — تُستخدم على معالجات input لحقول البحث/الفلترة
  // لمنع إعادة الفلترة/الرسم الكاملة على كل ضغطة مفتاح في جداول كبيرة
  // الاستخدام: el.addEventListener("input", debounce(function(e){ ... }, 250));
  function debounce(fn, wait) {
    var t = null;
    return function () {
      var args = arguments,
        ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait || 250);
    };
  }

  // [DATE-STD] فورمات التاريخ الموحد للسيستم كله
  // ⚠️ دالة مشتركة واحدة يستخدمها كل موديول (HR، المحاسبة، المخازن...) —
  // أي تغيير في تنسيق التاريخ مطلوب على مستوى النظام كله يتم هنا فقط.
  // ── [إصلاح P2 - تفعيل date_format] ──────────────────────────────────
  // كان الشكل dd/mm/yyyy مفروضًا يدويًا بغض النظر عن تفضيل date_format
  // المخزَّن فعليًا في شاشة التفضيلات (Dead Setting رغم وجود نقطة مركزية
  // واحدة جاهزة بالفعل لربطه — كان ناقصها سطر واحد فقط).
  function fmtDate(d) {
    if (!d) return "—";
    try {
      var dt = d instanceof Date ? d : new Date(d);
      if (isNaN(dt)) return String(d).substring(0, 10);
      var y = dt.getFullYear();
      var m = String(dt.getMonth() + 1).padStart(2, "0");
      var day = String(dt.getDate()).padStart(2, "0");
      var fmt =
        typeof PreferenceService !== "undefined"
          ? PreferenceService.get("date_format", "DD/MM/YYYY")
          : "DD/MM/YYYY";
      switch (fmt) {
        case "MM/DD/YYYY":
          return m + "/" + day + "/" + y;
        case "YYYY-MM-DD":
          return y + "-" + m + "-" + day;
        case "D MMMM YYYY":
          var monthsAr = [
            I18N.t("SHELL_MONTH_1"),
            I18N.t("SHELL_MONTH_2"),
            I18N.t("SHELL_MONTH_3"),
            I18N.t("SHELL_MONTH_4"),
            I18N.t("SHELL_MONTH_5"),
            I18N.t("SHELL_MONTH_6"),
            I18N.t("SHELL_MONTH_7"),
            I18N.t("SHELL_MONTH_8"),
            I18N.t("SHELL_MONTH_9"),
            I18N.t("SHELL_MONTH_10"),
            I18N.t("SHELL_MONTH_11"),
            I18N.t("SHELL_MONTH_12"),
          ];
          return dt.getDate() + " " + monthsAr[dt.getMonth()] + " " + y;
        case "DD/MM/YYYY":
        default:
          return day + "/" + m + "/" + y;
      }
    } catch (e) {
      return String(d).substring(0, 10);
    }
  }

  // يحوّل أي تاريخ قادم من حقل <input type="date"> (yyyy-mm-dd)
  // إلى شكل العرض الموحّد الحالي — لاستخدامه في أي عرض read-only (بطاقات، PDF، طباعة)
  function fmtDateInput(isoStr) {
    if (!isoStr) return "—";
    var parts = String(isoStr).split("-");
    if (parts.length !== 3) return fmtDate(isoStr);
    // نمرّرها لـ fmtDate عشان تُطبّق عليها date_format الحالي بنفس المنطق
    return fmtDate(parts[0] + "-" + parts[1] + "-" + parts[2]);
  }

  // فورمات الوقت — يحترم تفضيل time_format (12h / 24h) بدل افتراض HH:MM دايمًا
  function fmtTime(t) {
    if (!t) return "—";
    try {
      var dt = t instanceof Date ? t : new Date(t);
      var h, mi;
      if (isNaN(dt)) {
        // fallback: لو القيمة نص فيه T (ISO) ناخد الوقت مباشرة منه
        var s = String(t);
        var m2 = s.match(/T(\d{2}):(\d{2})/);
        if (!m2) return s;
        h = Number(m2[1]);
        mi = m2[2];
      } else {
        h = dt.getHours();
        mi = String(dt.getMinutes()).padStart(2, "0");
      }
      var format =
        typeof PreferenceService !== "undefined"
          ? PreferenceService.get("time_format", "12h")
          : "12h";
      if (format === "24h") {
        return String(h).padStart(2, "0") + ":" + mi;
      }
      var period = h >= 12 ? "م" : "ص";
      var h12 = h % 12 || 12;
      return h12 + ":" + mi + " " + period;
    } catch (e) {
      return String(t);
    }
  }

  // ─────────────────────────────────────────────────────────────
  // [DATE-STD-INPUT 2026-07-14] توحيد شكل عرض حقول input[type=date]
  // مع تفضيل date_format الفعلي للمستخدم — بدل الإجبار الثابت السابق
  // على lang="ja" (yyyy/mm/dd) بغض النظر عن اختيار المستخدم في شاشة
  // التفضيلات، وهو ما كان يسبب تعارضًا واضحًا: مثلاً فاتورة بيع تعرض
  // 07/14/2026 (mm/dd/yyyy افتراضي المتصفح لما الحقل يفلت من الوسم)
  // بينما تفضيل النظام المحفوظ فعليًا DD/MM/YYYY.
  //
  // ملاحظة: input[type=date] لا يقبل صياغة عرض حرة (custom pattern) —
  // المتصفح (Chrome/Edge) بيحدد ترتيب الحقول حسب locale الـ lang فقط،
  // فبنمّم أقرب locale متاح لكل خيار من خيارات date_format:
  //   DD/MM/YYYY  → en-GB  → dd/mm/yyyy
  //   MM/DD/YYYY  → en-US  → mm/dd/yyyy
  //   YYYY-MM-DD  → sv     → yyyy-mm-dd (الوحيد اللي بيدي شرطة - مطابق تمامًا)
  //   D MMMM YYYY → لا يوجد شكل أسماء شهور في input[type=date]؛ أقرب تمثيل
  //                 هو dd/mm/yyyy (en-GB) كافتراضي احتياطي.
  //
  // القيمة الفعلية المخزّنة في .value تبقى دايمًا ISO (yyyy-mm-dd) كما
  // يفرضها معيار HTML — التعديل هنا بصري فقط على شكل العرض داخل الحقل.
  // ─────────────────────────────────────────────────────────────
  (function () {
    var DATE_FORMAT_TO_LANG = {
      "DD/MM/YYYY": "en-GB",
      "MM/DD/YYYY": "en-US",
      "YYYY-MM-DD": "sv",
      "D MMMM YYYY": "en-GB",
    };

    function _currentInputLang() {
      var fmt =
        typeof PreferenceService !== "undefined"
          ? PreferenceService.get("date_format", "DD/MM/YYYY")
          : "DD/MM/YYYY";
      return DATE_FORMAT_TO_LANG[fmt] || "en-GB";
    }

    function _tagDateInputs(root, lang) {
      if (!root || !root.querySelectorAll) return;
      var list = root.querySelectorAll('input[type="date"]');
      for (var i = 0; i < list.length; i++) list[i].lang = lang;
    }

    function _retagAll() {
      _tagDateInputs(document, _currentInputLang());
    }

    function _init() {
      _retagAll();
      // [DATE-STD-INPUT] لما المستخدم يغيّر date_format من شاشة التفضيلات،
      // نعيد وسم كل الحقول الحالية فورًا (بدون الحاجة لإعادة تحميل الصفحة).
      if (
        typeof PreferenceService !== "undefined" &&
        typeof PreferenceService.subscribe === "function"
      ) {
        PreferenceService.subscribe("date_format", _retagAll);
      }
      if (typeof MutationObserver === "undefined" || !document.body) return;
      var obs = new MutationObserver(function (mutations) {
        var lang = _currentInputLang();
        for (var i = 0; i < mutations.length; i++) {
          var added = mutations[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            var node = added[j];
            if (node.nodeType !== 1) continue;
            if (node.matches && node.matches('input[type="date"]')) {
              node.lang = lang;
            }
            _tagDateInputs(node, lang);
          }
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", _init);
    } else {
      _init();
    }
  })();

  // §AS — Global Button Click Sound (event delegation)
  // يُشغِّل صوت النقرة عند الضغط على أي زر أو رابط ذو معنى
  document.addEventListener(
    "click",
    function (e) {
      if (typeof AS === "undefined") return;
      var t = e.target;
      // ابحث عن أقرب زر أو رابط قابل للنقر
      var el = t.closest(
        "button, [role='button'], .btn, .nav-item, .nav-sub-item, .sidebar-link, .nav-grp-arrow, .nav-grp-label",
      );
      if (!el) return;
      // استبعد الأزرار التي تُشغِّل أصواتها الخاصة (login/logout/confirm)
      if (
        el.id === "btn-login" ||
        el.closest(".confirm-modal") ||
        el.closest(".audio-test-btn") ||
        el.getAttribute("data-no-sound") === "true"
      )
        return;
      try {
        AS.click();
      } catch (eX) {}
    },
    { passive: true },
  );

  function statCard(icon, label, val, sub, bg) {
    // icon: إما SVG badge HTML جاهز، أو إيموجي legacy
    var iconHtml = icon;
    return (
      '<div class="stat-card">' +
      '<div class="stat-icon-wrap" style="flex-shrink:0">' +
      iconHtml +
      "</div>" +
      '<div class="stat-info"><h3>' +
      label +
      "</h3><h2 style='font-size:28px;line-height:1'>" +
      val +
      "</h2><small>" +
      sub +
      "</small></div></div>"
    );
  }

  // ── Colored Badge Icon Helper ─────────────────────────────
  function iconBadge(tiClass, bg, color) {
    return (
      '<span style="display:inline-flex;align-items:center;justify-content:center;' +
      "background:" +
      bg +
      ';border-radius:10px;padding:8px;flex-shrink:0">' +
      '<i class="ti ' +
      tiClass +
      '" style="font-size:22px;color:' +
      color +
      '" aria-hidden="true"></i>' +
      "</span>"
    );
  }
  function navIcon(tiClass, color) {
    // ── بدون خلفية ملوّنة — أيقونة مسطّحة فقط (نفس أسلوب المحاسبة/الموارد البشرية) ──
    return (
      '<i class="ti ' +
      tiClass +
      '" style="font-size:18px;color:' +
      color +
      '" aria-hidden="true"></i>'
    );
  }
  // ────────────────────────────────────────────────────────────
  function itemOpts(all) {
    return (all || APP.data.items)
      .map(function (i) {
        return (
          '<option value="' +
          esc(i.id) +
          '" data-id="' +
          esc(i.id) +
          '">' +
          esc(i.code || i.id) +
          " — " +
          esc(i.name) +
          "</option>"
        );
      })
      .join("");
  }

  // تحوّل item.code إلى item.id (للإرسال للباكاند)
  function itemCodeToId(code) {
    if (!code) return "";
    var item = APP.data.items.find(function (i) {
      return String(i.code || "") === String(code);
    });
    return item ? item.id : code;
  }

  // تحوّل item.id إلى item.code (للعرض في الـ UI)
  function itemIdToCode(id) {
    if (!id) return "";
    var item = APP.data.items.find(function (i) {
      return String(i.id) === String(id);
    });
    return item && item.code ? item.code : id;
  }
  // ====================== Helper لعرض اسم المجموعة ======================
  function getGroupName(groupIdOrPrefix) {
    if (!groupIdOrPrefix) return "—";

    var group = APP.data.groups.find(function (g) {
      return (
        String(g.id) === String(groupIdOrPrefix) ||
        String(g.prefix) === String(groupIdOrPrefix)
      );
    });

    return group ? esc(group.name) : esc(groupIdOrPrefix);
  }
  // ====================== Helper لإيجاد المخزن من الصنف ======================
  function getWarehouseForItem(itemId) {
    if (!itemId) return null;

    var item = APP.data.items.find(function (i) {
      return String(i.id) === String(itemId);
    });
    if (!item || !item.group) return null;

    var group = APP.data.groups.find(function (g) {
      return String(g.id) === String(item.group);
    });
    if (!group || !group.warehouse_id) return null;

    var wh = APP.data.warehouses.find(function (w) {
      return w.id === group.warehouse_id || w.name === group.warehouse_id;
    });

    return wh ? wh.name : group.warehouse_id;
  }

  // ─────────────────────────────────────────────────────────────

  // ====================== DEBUG: Overflow Detector ======================
  /**
   * يكتشف العناصر التي تتجاوز عرض الشاشة
   * الاستخدام: APP.debugOverflow()
   * أو من Console: debugOverflow()
   */
  function debugOverflow() {
    var offenders = [];
    var pageW = document.documentElement.clientWidth;

    // إزالة marks قديمة
    document.querySelectorAll("[data-overflow]").forEach(function (el) {
      el.removeAttribute("data-overflow");
    });

    document.querySelectorAll("*").forEach(function (el) {
      var rect = el.getBoundingClientRect();
      if (rect.right > pageW + 2 || rect.left < -2) {
        el.setAttribute("data-overflow", "true");
        offenders.push({
          element: el,
          tag: el.tagName,
          id: el.id || "",
          classes:
            el.className && typeof el.className === "string"
              ? el.className.split(" ").slice(0, 3).join(".")
              : "",
          width: Math.round(rect.width),
          left: Math.round(rect.left),
          right: Math.round(rect.right),
          pageWidth: pageW,
        });
      }
    });

    if (offenders.length === 0) {
      console.log("%c✅ No overflow detected!", "color:green;font-weight:bold");
      return [];
    }

    console.group(
      "%c🔴 Overflow Elements (" + offenders.length + ")",
      "color:red;font-weight:bold",
    );
    offenders.forEach(function (o) {
      console.log(
        o.tag + (o.id ? "#" + o.id : "") + (o.classes ? "." + o.classes : ""),
        "| width:",
        o.width + "px",
        "| left:",
        o.left + "px",
        "| right:",
        o.right + "px",
        "| overflow by:",
        Math.round(o.right - o.pageWidth) + "px",
      );
      console.log(o.element);
    });
    console.groupEnd();

    return offenders;
  }

  // تصدير للـ console
  window.debugOverflow = debugOverflow;

  // إضافة للـ APP object
  if (typeof APP !== "undefined") {
    APP.debugOverflow = debugOverflow;
  }
  // ─────────────────────────────────────────────────────────────
</script>
