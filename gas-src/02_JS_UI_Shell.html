<script>
  // ───────────────────────────────────────────────────────────────
  // JS_UI_Shell.html — جزء 2/10 من JavaScript.html الأصلي
  // النطاق الأصلي: سطر 1633–4832 | واجهة عامة (Layout/Nav) + Toast/Modal + إشعارات + باكاب + Utilities
  // ───────────────────────────────────────────────────────────────

  // ─────────────────────────────────────────────────────────────
  // 🛡️  شبكة أمان عامة للأخطاء — GLOBAL ERROR SAFETY NET
  //
  // الهدف: أي خطأ غير متوقع في أي مكان في السيستم (استثناء JS لم
  // يُعالَج، أو Promise مرفوض من غير .catch) لازم يظهر للمستخدم
  // برسالة واضحة بدل ما يفضل صامت (أو صوت بس من غير رسالة تشرح السبب).
  // ده مش بديل عن معالجة الأخطاء الصحيحة في كل شاشة (SaveEngine/
  // withFailureHandler) — ده خط دفاع أخير بس لأي حاجة فلتت منهم.
  // ─────────────────────────────────────────────────────────────
  (function () {
    var _lastGlobalErrAt = 0;
    function _notifyGlobalError(message) {
      // منع إغراق المستخدم بعشرات الرسايل لو نفس الخطأ بيتكرر كل فريم
      var now = Date.now();
      if (now - _lastGlobalErrAt < 1200) return;
      _lastGlobalErrAt = now;
      if (typeof showToast === "function") {
        showToast(
          I18N.t("SHELL_MSG_ERROR_ICON_PREFIX") + " " + message,
          "error",
        );
      }
      if (typeof _unfreezeUI === "function") {
        try {
          _unfreezeUI();
        } catch (e) {}
      }
    }

    window.addEventListener("error", function (e) {
      var msg = (e && (e.message || (e.error && e.error.message))) || "";
      _notifyGlobalError(msg || I18N.t("SHELL_ERR_UNEXPECTED_PAGE"));
    });

    window.addEventListener("unhandledrejection", function (e) {
      var reason = e && e.reason;
      var msg =
        (reason && (reason.message || String(reason))) ||
        I18N.t("SHELL_ERR_UNEXPECTED_REQUEST");
      _notifyGlobalError(msg);
    });
  })();

  // ─────────────────────────────────────────────────────────────
  // 🔊  صوت زر تسجيل الدخول — مستقل عن AudioService (21_JS_AudioService.html)
  //
  // السبب: AudioService بيتحمّل Lazy (بعد نجاح الدخول ضمن حزمة الشاشة
  // الكاملة)، يعني هيكون undefined وقت أول ضغطة فعلية على "دخول" في
  // صفحة اللوجين نفسها. عشان الصوت يشتغل من أول محاولة دخول بدون ما
  // ننتظر تحميل الحزمة الكاملة، الدالة دي مستقلة بالكامل (Web Audio API
  // مباشرة، بدون أي اعتماد خارجي) وبتستخدم نفس نغمة "system.login"
  // الموجودة في AudioService (392→523→659→784Hz، sine صاعد هادي) عشان
  // يفضل الإحساس الصوتي متسق مع باقي النظام بعد الدخول.
  // ─────────────────────────────────────────────────────────────
  var _loginAudioCtx = null;
  function _playLoginChime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!_loginAudioCtx) _loginAudioCtx = new Ctx();
      var ctx = _loginAudioCtx;
      if (ctx.state === "suspended" && typeof ctx.resume === "function") {
        ctx.resume();
      }
      var notes = [
        { f: 392, t: 0, d: 0.1, v: 0.16 },
        { f: 523, t: 0.09, d: 0.1, v: 0.18 },
        { f: 659, t: 0.18, d: 0.1, v: 0.2 },
        { f: 784, t: 0.27, d: 0.18, v: 0.22 },
      ];
      notes.forEach(function (n) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = n.f;
        var startAt = ctx.currentTime + n.t;
        var endAt = startAt + n.d;
        gain.gain.setValueAtTime(0, startAt);
        gain.gain.linearRampToValueAtTime(n.v, startAt + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, endAt);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startAt);
        osc.stop(endAt + 0.02);
      });
    } catch (eAudio) {
      /* الصوت اختياري بالكامل — أي فشل فيه (مثلاً متصفح مش داعم) ميوقفش تسجيل الدخول */
    }
  }

  // ---------- Auth ----------

  function bindLogin() {
    // ⛔ [FIX-CONSOLE-NOISE] اتشال استدعاء _startPrefetch() اللي كان هنا:
    // render() بيمسح SESSION.token دايمًا قبل ما ينده bindLogin() في حالة
    // عدم وجود مستخدم مسجّل دخول، فالاستدعاء ده كان بيفشل 100% من المرات
    // بـ "session required" ومكانش بيعمل حاجة غير إنه يملا الـ console
    // بتحذيرات (Auth.prefetch.light / Auth.prefetch.full). البيانات
    // بتتحمّل عادي وبسرعة بعد نجاح تسجيل الدخول فعليًا (عبر
    // _preloadAllAfterLogin()).

    var btn = document.getElementById("btn-login");
    var pass = document.getElementById("l-pass");
    var user = document.getElementById("l-user");
    btn.addEventListener("click", doLogin);

    // [FIX-VERSION-DYNAMIC] رقم الإصدار بيتجاب دايمًا لايف من ابب سكريبت
    // (ping()) مش من القيمة المحقونة وقت الـ build الثابت — عشان يفضل
    // مطابق لحظيًا لآخر تحديث فعلي على السيرفر حتى لو حد نسي يعمل rebuild
    // لنسخة Vercel بعد ما غيّر APP_VERSION. القيمة المحقونة وقت البناء
    // (لو موجودة) بتفضل تظهر فورًا كـ placeholder سريع لحد ما رد ping()
    // يوصل ويستبدلها بالرقم الحقيقي — مفيش شاشة فاضية أو تأخير محسوس.
    var verEl = document.querySelector(".login-ver");
    if (verEl && typeof _gsr === "function") {
      _gsr("ping", [], {
        onSuccess: function (res) {
          var v = res && res.data && res.data.version;
          if (v) verEl.textContent = "v" + v;
        },
        onError: function () {}, // صامت — مجرد تحسين تجميلي، مش حرج
      });
    }

    // ✅ ربط زر "نسيت كلمة المرور؟" بشاشة الاستعادة (39_JS_ForgotPassword.html)
    if (typeof bindForgotPasswordLink === "function") bindForgotPasswordLink();
    pass.addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });
    user.addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });

    // ── تأثير التركيز على الحقول (يلوّن الـ label عند الكتابة) ──
    [
      ["fld-user", "l-user"],
      ["fld-pass", "l-pass"],
    ].forEach(function (pair) {
      var fieldEl = document.getElementById(pair[0]);
      var inputEl = document.getElementById(pair[1]);
      if (!fieldEl || !inputEl) return;
      inputEl.addEventListener("focus", function () {
        fieldEl.classList.add("focused");
      });
      inputEl.addEventListener("blur", function () {
        fieldEl.classList.remove("focused");
      });
    });

    // ── إظهار/إخفاء كلمة المرور ──────────────────────────────
    var eyeBtn = document.getElementById("l-pass-toggle");
    if (eyeBtn) {
      eyeBtn.addEventListener("click", function () {
        var icon = document.getElementById("l-pass-eye-icon");
        if (pass.type === "password") {
          pass.type = "text";
          if (icon) {
            icon.classList.remove("eye-state-open");
            icon.classList.add("eye-state-closed");
          }
        } else {
          pass.type = "password";
          if (icon) {
            icon.classList.remove("eye-state-closed");
            icon.classList.add("eye-state-open");
          }
        }
        pass.focus();
      });
    }

    // ── تأثير Ripple عند الضغط على زر الدخول ─────────────────
    btn.addEventListener("click", function (e) {
      var rect = btn.getBoundingClientRect();
      var size = 220;
      var r = document.createElement("span");
      r.className = "login-ripple";
      r.style.width = size + "px";
      r.style.height = size + "px";
      r.style.left = e.clientX - rect.left - size / 2 + "px";
      r.style.top = e.clientY - rect.top - size / 2 + "px";
      btn.appendChild(r);
      setTimeout(function () {
        r.remove();
      }, 600);
    });

    _loginPrefillRemember();
    _setLoginGreeting();
    _initLoginSlideshow();
  }

  // ── رسالة ترحيب حسب وقت اليوم ───────────────────────────────
  function _setLoginGreeting() {
    var el = document.getElementById("login-greet");
    if (!el) return;
    var h = new Date().getHours();
    var g =
      h >= 5 && h < 12
        ? I18N.t("SHELL_GREETING_MORNING")
        : h >= 12 && h < 17
          ? I18N.t("SHELL_GREETING_AFTERNOON")
          : h >= 17 && h < 21
            ? I18N.t("SHELL_GREETING_EVENING")
            : I18N.t("SHELL_GREETING_DEFAULT");
    el.textContent = g;
  }

  // ── تذكّر اسم المستخدم (Frontend فقط — لا علاقة له بالأمان) ──
  function _loginPrefillRemember() {
    try {
      var saved = localStorage.getItem("wms_remember_user");
      var u = document.getElementById("l-user");
      var rc = document.getElementById("l-remember");
      if (saved && u && rc) {
        u.value = saved;
        rc.checked = true;
      }
    } catch (e) {}
  }
  function _loginSaveRemember(username) {
    try {
      var rc = document.getElementById("l-remember");
      if (rc && rc.checked) {
        localStorage.setItem("wms_remember_user", username);
      } else {
        localStorage.removeItem("wms_remember_user");
      }
    } catch (e) {}
  }

  // ── HTML الداخلي لزر الدخول (مستخدَم لإعادة الزر لحالته الطبيعية) ──
  function _loginBtnHTML(text, locked) {
    if (locked) {
      return '<span style="font-size:15px">🔒</span><span>' + text + "</span>";
    }
    return (
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>' +
      "<span>" +
      text +
      "</span>" +
      '<span class="login-btn-glow"></span>'
    );
  }

  // ── العرض المتحرك (Slideshow) لموديولات النظام — شاشة الدخول ──
  // ينقل تلقائياً كل 5 ثوانٍ بين الشرائح، مع إمكانية الانتقال اليدوي
  // بالضغط على إحدى النقاط (dots). يتوقف تلقائياً لو الـ stage اتشال
  // من الصفحة (تسجيل دخول ناجح / إعادة render).
  var _loginSlideTimer = null;
  function _initLoginSlideshow() {
    var stage = document.getElementById("show-stage");
    var nav = document.getElementById("show-nav");
    if (!stage || !nav) return;

    var slides = Array.prototype.slice.call(stage.querySelectorAll(".slide"));
    var dots = Array.prototype.slice.call(nav.querySelectorAll(".show-dot"));
    var total = slides.length;
    if (!total) return;

    var current = slides.findIndex(function (s) {
      return s.classList.contains("active");
    });
    if (current < 0) current = 0;

    if (_loginSlideTimer) {
      clearTimeout(_loginSlideTimer);
      _loginSlideTimer = null;
    }

    function goTo(i) {
      if (!document.body.contains(stage)) return; // الصفحة اتغيّرت
      slides[current].classList.remove("active");
      if (dots[current]) {
        dots[current].classList.remove("current");
        dots[current].classList.add("done");
      }
      current = i;
      dots.forEach(function (d, idx) {
        d.classList.remove("current");
        if (idx < current) d.classList.add("done");
        else d.classList.remove("done");
      });
      slides[current].classList.add("active");
      if (dots[current]) dots[current].classList.add("current");
      restart();
    }

    function next() {
      goTo((current + 1) % total);
    }

    function restart() {
      clearTimeout(_loginSlideTimer);
      // ✅ توقّف تلقائي لو شاشة الدخول اتشالت (دخول ناجح/تغيير صفحة)
      _loginSlideTimer = setTimeout(function () {
        if (!document.body.contains(stage)) return;
        next();
      }, 5000);
    }

    dots.forEach(function (d, idx) {
      d.addEventListener("click", function () {
        goTo(idx);
      });
    });

    restart();
  }

  // ─────────────────────────────────────────────────────────────
  // §SEC-A  Session Manager — إدارة الجلسة في الـ Frontend
  // ─────────────────────────────────────────────────────────────

  var SESSION = {
    token: null,
    expiresAt: null,
    idleTimeout: 60,
    _idleTimer: null,
    _countdownTimer: null,
    _warningShown: false,
    WARN_BEFORE_MIN: 5,
  };

  function _initSession(loginResponse) {
    if (!loginResponse || !loginResponse.sessionToken) return;
    SESSION.token = loginResponse.sessionToken;
    SESSION.expiresAt = loginResponse.sessionExpiresAt;
    SESSION.idleTimeout = loginResponse.idleTimeoutMinutes || 60;
    try {
      // [FIX-MULTITAB-LOGOUT] localStorage بدل sessionStorage: التوكن بقى
      // مشترك بين كل تابات نفس المتصفح بدل ما كل تاب يعمل جلسة منفصلة —
      // ده كان بيسبب تسجيل خروج تلقائي لأي تاب قديم بمجرد ما عدد التابات
      // المفتوحة (كل واحد جلسة مستقلة) يتخطى SESSION_CONFIG.MAX_SESSIONS_PER_USER.
      localStorage.setItem("wms_session_token", SESSION.token);
      localStorage.setItem("wms_session_expires", String(SESSION.expiresAt));
      localStorage.setItem("wms_session_idle_min", String(SESSION.idleTimeout));
    } catch (e) {}
    _startIdleWatcher();
    _startSessionCountdown();
  }

  function _restoreSession() {
    try {
      var token = localStorage.getItem("wms_session_token");
      var expires = parseInt(
        localStorage.getItem("wms_session_expires") || "0",
      );
      var idle = parseInt(localStorage.getItem("wms_session_idle_min") || "60");
      if (token && expires && Date.now() < expires) {
        SESSION.token = token;
        SESSION.expiresAt = expires;
        SESSION.idleTimeout = idle;
        return true;
      }
    } catch (e) {}
    return false;
  }

  // ─────────────────────────────────────────────────────────────
  // [SESSION-POLL-FIX] الحل الجذري لتكرار أخطاء "جلسة غير صالحة" في
  // الكونسول بعد انتهاء/بطلان الجلسة:
  //
  // المشكلة: النظام فيه أكتر من مؤقت خلفي مستقل (إشعارات، فيدباك التحديثات
  // UM.refreshFeed، فودافون كاش، واتساب...) كل واحد بيعمل setInterval خاص
  // بيه ويفضل شغال حتى بعد ما _handleSessionExpired تعمل تسجيل خروج نظيف
  // وترجّع شاشة الدخول — لأن _clearSession كانت بتوقف بس مؤقت الخمول
  // ومؤقت العد التنازلي، وتسيب باقي المؤقتات الخلفية شغالة، فكل واحد فيهم
  // يفضل يضرب السيرفر كل بضع ثوانٍ/دقائق ويطلع نفس خطأ الجلسة من جديد —
  // تكرار لا نهائي في الكونسول لحد ما المستخدم يعمل refresh يدوي للصفحة.
  //
  // الحل: أي مؤقت polling خلفي (مش مؤقتات الواجهة قصيرة العمر زي العد
  // التنازلي لقفل تسجيل الدخول) لازم يتسجل هنا عبر _registerPollTimer
  // بدل ما يُستخدَم setInterval مباشرة. _clearSession (اللي بتتنادى من
  // تسجيل الخروج اليدوي وكمان من _handleSessionExpired) بقت توقفهم كلهم
  // دفعة واحدة تلقائيًا.
  // ─────────────────────────────────────────────────────────────
  APP._activePollTimers = APP._activePollTimers || [];
  function _registerPollTimer(id) {
    APP._activePollTimers.push(id);
    return id;
  }
  function _clearAllPollTimers() {
    (APP._activePollTimers || []).forEach(function (id) {
      try {
        clearInterval(id);
      } catch (e) {}
    });
    APP._activePollTimers = [];
    // إعادة تعيين علامة "بدأ التشغيل" الخاصة بمؤقت مركز الإشعارات
    // (UM.checkOnLogin) عشان يُعاد تشغيله بشكل صحيح بعد أي دخول تالٍ
    if (typeof UM !== "undefined" && UM) UM._feedTimerStarted = false;
  }

  function _clearSession() {
    SESSION.token = null;
    SESSION.expiresAt = null;
    SESSION._warningShown = false;
    _stopIdleWatcher();
    _stopSessionCountdown();
    _clearAllPollTimers();
    var _banner = document.getElementById("__session-warning");
    if (_banner) _banner.remove();
    try {
      localStorage.removeItem("wms_session_token");
      localStorage.removeItem("wms_session_expires");
      localStorage.removeItem("wms_session_idle_min");
    } catch (e) {}
  }

  // ─────────────────────────────────────────────────────────────
  // [FIX-MULTITAB-LOGOUT] مزامنة تسجيل الخروج بين تابات نفس المتصفح.
  // بما إن توكن الجلسة بقى في localStorage (مشترك)، أي تاب يعمل تسجيل
  // خروج (أو ينتهي جلسته) يمسح المفتاح، فبتوصل event "storage" لكل
  // التابات التانية المفتوحة على نفس الأصل فورًا — فبنسجّل خروج التاب ده
  // كمان محليًا (من غير ما نبعت طلب logout تاني للسيرفر، لأنه اتبعت
  // بالفعل من التاب اللي عمل الخروج الأصلي).
  // ─────────────────────────────────────────────────────────────
  window.addEventListener("storage", function (e) {
    if (e.key !== "wms_session_token") return;
    if (e.newValue || !APP.currentUser) return; // لسه فيه توكن، أو التاب ده أصلاً مش مسجّل دخول
    _clearSession();
    APP.currentUser = null;
    APP.currentPage = "dashboard";
    try {
      _preloadDone = false;
    } catch (err) {}
    APP.extLoaded = false;
    APP.extLoading = false;
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML = renderLogin();
      bindLogin();
    }
    setTimeout(function () {
      var errEl = document.getElementById("login-err");
      if (errEl) {
        errEl.style.display = "block";
        errEl.style.background = "var(--warning-soft,#fef3c7)";
        errEl.style.color = "var(--warning-dark,#92400e)";
        errEl.textContent = "🔒 تم تسجيل الخروج من تاب آخر لنفس الحساب";
      }
    }, 100);
  });

  // ── Idle Watcher ──────────────────────────────────────────
  var _idleLastActivity = Date.now();
  var _idleDebounceTimer = null; // v4.2: Debounce لتقليل العبء

  function _resetIdleTimer() {
    // Debounce: نحدّث فقط كل 300ms بدل كل حدث
    if (_idleDebounceTimer) return;
    _idleDebounceTimer = setTimeout(function () {
      _idleDebounceTimer = null;
      _idleLastActivity = Date.now();
      SESSION._warningShown = false;
      var banner = document.getElementById("__session-warning");
      if (banner) banner.remove();
    }, 300);
  }

  function _startIdleWatcher() {
    _stopIdleWatcher();
    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(
      function (ev) {
        document.addEventListener(ev, _resetIdleTimer, { passive: true });
      },
    );
    SESSION._idleTimer = setInterval(function () {
      if (!SESSION.token || !APP.currentUser) return;
      var idleSec = (Date.now() - _idleLastActivity) / 1000;
      var idleLimit = SESSION.idleTimeout * 60;
      var warnAt = idleLimit - SESSION.WARN_BEFORE_MIN * 60;
      if (idleSec >= idleLimit) {
        _handleSessionExpired("timeout");
      } else if (idleSec >= warnAt && !SESSION._warningShown) {
        SESSION._warningShown = true;
        _showIdleWarning(Math.ceil((idleLimit - idleSec) / 60));
      }
    }, 30000);
  }

  function _stopIdleWatcher() {
    if (SESSION._idleTimer) {
      clearInterval(SESSION._idleTimer);
      SESSION._idleTimer = null;
    }
    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(
      function (ev) {
        document.removeEventListener(ev, _resetIdleTimer);
      },
    );
  }

  function _startSessionCountdown() {
    _stopSessionCountdown();
    SESSION._countdownTimer = setInterval(function () {
      if (!SESSION.token || !APP.currentUser) return;
      var remaining = SESSION.expiresAt - Date.now();
      if (remaining <= 0) {
        _handleSessionExpired("expired");
        return;
      }
      if (remaining < 10 * 60 * 1000 && !SESSION._warningShown) {
        SESSION._warningShown = true;
        _showIdleWarning(Math.ceil(remaining / 60000));
      }
    }, 60000);
  }

  function _stopSessionCountdown() {
    if (SESSION._countdownTimer) {
      clearInterval(SESSION._countdownTimer);
      SESSION._countdownTimer = null;
    }
  }

  // ── Session Warning Banner ─────────────────────────────────
  function _showIdleWarning(remainingMinutes) {
    var existing = document.getElementById("__session-warning");
    if (existing) existing.remove();

    if (!document.getElementById("__session-banner-style")) {
      var st = document.createElement("style");
      st.id = "__session-banner-style";
      st.textContent =
        "@keyframes __bannerSlide{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}";
      document.head.appendChild(st);
    }

    var countdownId = "__sc-" + Date.now();
    var banner = document.createElement("div");
    banner.id = "__session-warning";
    banner.style.cssText =
      "position:fixed;top:0;left:0;right:0;z-index:999999;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--font-arabic,sans-serif);direction:rtl;box-shadow:0 4px 20px rgba(0,0,0,0.25);animation:__bannerSlide 0.4s cubic-bezier(0.34,1.4,0.64,1) forwards";
    banner.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;flex:1">' +
      '<span style="font-size:20px">⏰</span>' +
      "<div>" +
      '<div style="font-size:13px;font-weight:800">تنبيه: ستنتهي جلستك قريباً</div>' +
      '<div style="font-size:12px;opacity:0.9">ستنتهي الجلسة بعد <strong id="' +
      countdownId +
      '">' +
      remainingMinutes +
      "</strong> دقيقة بسبب عدم النشاط</div>" +
      "</div>" +
      "</div>" +
      '<div style="display:flex;gap:8px;flex-shrink:0">' +
      '<button onclick="_extendSession()" style="background:rgba(255,255,255,0.2);color:#fff;border:1.5px solid rgba(255,255,255,0.5);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-arabic,sans-serif)">🔄 متابعة الجلسة</button>' +
      // [SESSION-LIFECYCLE-P1] خيار صريح لتسجيل الخروج فورًا بدل ما يستنى
      // المستخدم انتهاء العدّاد — بينفّذ نفس مسار الخروج المنظّم (تنظيف
      // واجهة + حفظ مسودة لو فيه تعديلات) بدل قطع مفاجئ.
      '<button onclick="typeof SessionLifecycle !== \'undefined\' ? SessionLifecycle.beginGracefulShutdown(\'manual\') : _handleSessionExpired(\'manual\')" style="background:rgba(0,0,0,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.35);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-arabic,sans-serif)">🚪 تسجيل الخروج الآن</button>' +
      '<button onclick="document.getElementById(\'__session-warning\').remove();SESSION._warningShown=false" style="background:transparent;color:rgba(255,255,255,0.7);border:none;padding:6px;font-size:16px;cursor:pointer">✕</button>' +
      "</div>";
    document.body.appendChild(banner);

    var cd = remainingMinutes;
    var cdTimer = setInterval(function () {
      cd--;
      var el = document.getElementById(countdownId);
      if (el) el.textContent = cd;
      if (cd <= 0) clearInterval(cdTimer);
    }, 60000);
  }

  function _extendSession() {
    if (!SESSION.token) return;
    DL.Users.refreshSession(SESSION.token, {
      label: "Shell.extendSession",
      onSuccess: function (result) {
        var res = result.data;
        if (res && res.valid) {
          _resetIdleTimer();
          var banner = document.getElementById("__session-warning");
          if (banner) {
            banner.style.background = "linear-gradient(135deg,#10b981,#059669)";
            var title = banner.querySelector("div div div:first-child");
            if (title) title.textContent = "✅ تم تمديد الجلسة بنجاح";
            setTimeout(function () {
              if (banner.parentNode) banner.remove();
            }, 2000);
          }
          showToast(I18N.t("SHELL_MSG_SESSION_EXTEND_SUCCESS"), "success");
        } else {
          _handleSessionExpired("expired");
        }
      },
      onError: function () {
        showToast(I18N.t("SHELL_MSG_SESSION_EXTEND_FAIL"), "warning");
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // §SEC-A2  [SESSION-FIX] كشف مركزي لأخطاء الجلسة القادمة من السيرفر
  //
  // المشكلة: 281+ نقطة استدعاء في الباك إند كانت ترفض الطلب برسالة "جلسة غير
  // صالحة" (عبر _checkPermission وغيرها)، لكن الواجهة كانت تعرض الرسالة كـ
  // toast عادي في مكان الشاشة فقط (NotificationService.error / showToast)
  // بدون أي ربط بدورة حياة الجلسة الفعلية — فيظهر الخطأ في أي مكان بدون أي
  // تفسير أو إجراء تالٍ، والمستخدم يفضل عالق على نفس الشاشة المعطوبة.
  // بينما _handleSessionExpired (اللي بيعمل logout نظيف + يرجّع شاشة الدخول
  // مع رسالة واضحة) كان موصول فقط بمؤقت الخمول الجانب-عميل، مش بردود
  // السيرفر الفعلية.
  //
  // الحل: أي دالة backend ترفض بسبب جلسة الآن ترجع code:"SESSION_INVALID"
  // (راجع errResponse في Code_12_Core.gs). هذه الدالة تفحص الـ code أولاً
  // (الاعتماد الأساسي)، مع fallback لمطابقة نص الرسالة للدوال القديمة التي
  // لم تُحدَّث بعد. تُستدعى من _gsr (31_JS_DataLayer.html) و SaveEngine
  // (32_JS_SaveEngine.html) في نقطة واحدة موحّدة.
  // ─────────────────────────────────────────────────────────────
  function _isSessionErrorResponse(raw) {
    if (!raw || typeof raw !== "object") return false;
    if (raw.code === "SESSION_INVALID") return true;
    var msg = String(raw.message || "");
    // [SESSION-FIX-2] شيلنا "خطأ في التحقق من الهوية" من الـ pattern عمداً:
    // الرسالة دي بتطلع لما يوزرنيم مُستنتَج (من دالة سيرفر عندها باج، أو
    // من بيانات مُرسَلة غلط) مايطابقش صاحب التوكن الفعلي — الجلسة/التوكن
    // نفسه لسه سليم 100%. تسجيل خروج المستخدم في الحالة دي كان بيبان
    // "بيخرجني من النظام لما تحصل أي مشكلة"، رغم إن جلسته أصلاً سليمة.
    // الحالات الحقيقية لجلسة منتهية/باطلة كلها بترجع code:"SESSION_INVALID"
    // أعلى، فمتغطّاش بردو من غير الـ regex ده.
    return /جلسة غير صالحة|جلستك انتهت|جلسة.*منتهية/.test(msg);
  }

  // [SESSION-LIFECYCLE-P1] بدل ما تقفل الجلسة فورًا وتقطع أي شاشة/مودال/
  // درور مفتوح، بتنادي أولاً محرك الخروج المنظّم (48_JS_SessionLifecycleEngine.html)
  // اللي بيفحص العمليات الجارية وعناصر الواجهة المفتوحة، يقفلها بالترتيب،
  // يحفظ أي تعديلات غير محفوظة كمسودة، وبعدين هو نفسه بينادي منطق إنهاء
  // الجلسة الفعلي. لو المحرك مش متحمّل لأي سبب (تحميل جزئي/خطأ)، نرجع
  // لنفس السلوك القديم المباشر كـ fallback.
  function _handleSessionExpired(reason) {
    if (
      typeof SessionLifecycle !== "undefined" &&
      !SessionLifecycle.isShuttingDown()
    ) {
      SessionLifecycle.beginGracefulShutdown(reason);
      return;
    }
    if (typeof SessionLifecycle !== "undefined") return; // إنهاء شغّال بالفعل

    var token = SESSION.token;
    var username = APP.currentUser ? APP.currentUser.username : null;
    _clearSession();
    if (token) {
      try {
        DL.Users.logout(token, username, {
          onSuccess: function () {},
          onError: function () {},
        });
      } catch (e) {}
    }
    APP.currentUser = null;
    APP.currentPage = "dashboard";
    // [PRELOAD-RESET] إعادة تعيين علامة الـ preload عند اللوج اوت
    try {
      _preloadDone = false;
    } catch (e) {}
    APP.extLoaded = false;
    APP.extLoading = false;
    try {
      sessionStorage.clear();
    } catch (e) {}
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML = renderLogin();
      bindLogin();
    }
    var msgs = {
      timeout: "⏰ انتهت جلستك بسبب عدم النشاط — يرجى تسجيل الدخول مجدداً",
      expired: "🔒 انتهت صلاحية الجلسة — يرجى تسجيل الدخول مجدداً",
      invalid: "⛔ جلستك غير صالحة أو انتهت — يرجى تسجيل الدخول مجدداً",
    };
    setTimeout(function () {
      var errEl = document.getElementById("login-err");
      if (errEl) {
        errEl.style.display = "block";
        errEl.style.background = "var(--warning-soft,#fef3c7)";
        errEl.style.color = "var(--warning-dark,#92400e)";
        errEl.textContent = msgs[reason] || msgs.expired;
      }
    }, 100);
  }

  // ─────────────────────────────────────────────────────────────
  // §SEC-B  Rate Limit UI v4.2 — عداد الحظر (مُزامَن مع Backend)
  //
  // التغييرات عن v4.1:
  //  [1] _startLockCountdown تقبل lockedUntil (timestamp مطلق)
  //      بدل seconds نسبية — يضمن استمرار العداد بعد Refresh
  //  [2] _showAttemptsWarning — شريط تحذير المحاولات المتبقية
  //  [3] _handleLoginResponse — معالج موحَّد لردود البنكند
  //  [4] حُذفت _handleRateLimitError (كانت تُشغّل عداداً جديداً
  //      من الصفر بدل استئناف الوقت المتبقي الحقيقي)
  // ─────────────────────────────────────────────────────────────

  var _loginLockTimer = null;
  var _loginLockEnds = null; // timestamp مطلق (ms) مُزامَن مع Backend

  // ─────────────────────────────────────────────────────────────
  // [SEC-LOGIN-CAPTCHA] تحدي بشري بسيط (كابتشا رياضية داخلية) —
  // طبقة احتكاك إضافية أمام السكربتات الآلية، تظهر بعد محاولتين
  // فاشلتين (remainingAttempts <= 3 من أصل MAX_ATTEMPTS=5).
  // ⚠️ هذه ليست بديلاً عن الحماية الحقيقية — الحماية الفعلية تظل
  // بالكامل في الباك اند (_checkRateLimit / _recordFailedAttempt في
  // Code_12_Core.gs)؛ هذه فقط تُبطئ محاولات السكربتات الآلية البسيطة
  // من الفرونت قبل ما تتحرك أصلاً، ومفيش أي تحقق منها في السيرفر.
  // ─────────────────────────────────────────────────────────────
  var _loginCaptchaRequired = false;
  var _loginCaptchaAnswer = null;

  function _renderLoginCaptcha() {
    var existing = document.getElementById("__login-captcha");
    if (existing) existing.remove();

    var a = 1 + Math.floor(Math.random() * 9);
    var b = 1 + Math.floor(Math.random() * 9);
    _loginCaptchaAnswer = a + b;
    _loginCaptchaRequired = true;

    var box = document.createElement("div");
    box.id = "__login-captcha";
    box.className = "login-captcha-box";
    box.innerHTML =
      '<div class="login-captcha-row">' +
      '<span class="login-captcha-q">' +
      a +
      " + " +
      b +
      " = ؟</span>" +
      '<input type="text" inputmode="numeric" maxlength="3" id="__captcha-input" class="input" placeholder="' +
      esc(I18N.t("SHELL_CAPTCHA_PLACEHOLDER")) +
      '">' +
      '<span id="__captcha-ok" style="display:none" class="login-captcha-ok">✔</span>' +
      "</div>" +
      '<div style="font-size:10.5px;color:var(--palette-slate-500,#94a3b8);margin-top:6px">' +
      esc(I18N.t("SHELL_CAPTCHA_HINT")) +
      "</div>";

    var errEl = document.getElementById("login-err");
    if (errEl && errEl.parentNode)
      errEl.parentNode.insertBefore(box, errEl.nextSibling);

    var input = document.getElementById("__captcha-input");
    var okMark = document.getElementById("__captcha-ok");
    input.addEventListener("input", function () {
      if (parseInt(input.value, 10) === _loginCaptchaAnswer) {
        _loginCaptchaRequired = false;
        okMark.style.display = "inline";
        input.disabled = true;
        input.style.borderColor = "#22c55e";
      } else {
        okMark.style.display = "none";
      }
    });
  }

  function _removeLoginCaptcha() {
    _loginCaptchaRequired = false;
    _loginCaptchaAnswer = null;
    var box = document.getElementById("__login-captcha");
    if (box) box.remove();
  }

  /**
   * _startLockCountdown — يبدأ عداد الحظر المرئي (v4.2)
   *
   * @param {number} lockedUntil — timestamp مطلق (ms) من Backend
   *
   * ⚠️ الفرق عن v4.1: كانت تأخذ "seconds" وتحسب النهاية في الفرونت.
   * الآن تأخذ timestamp مطلقاً من البنكند مباشرة، فعند Refresh
   * يُعاد نفس الـ lockedUntil من البنكند والعداد يستأنف بدقة.
   */
  function _startLockCountdown(lockedUntil) {
    _loginLockEnds = lockedUntil;
    var remaining = Math.ceil((lockedUntil - Date.now()) / 1000);
    if (remaining <= 0) {
      _removeLockBanner();
      _enableLoginForm();
      return;
    }
    _renderLockBanner(remaining);
    if (_loginLockTimer) clearInterval(_loginLockTimer);
    _loginLockTimer = setInterval(function () {
      var rem = Math.ceil((_loginLockEnds - Date.now()) / 1000);
      if (rem <= 0) {
        clearInterval(_loginLockTimer);
        _loginLockTimer = null;
        _loginLockEnds = null;
        _removeLockBanner();
        _enableLoginForm();
        return;
      }
      _updateLockBanner(rem);
    }, 1000);
    _disableLoginForm();
  }

  /**
   * _showAttemptsWarning — شريط تحذير المحاولات المتبقية (جديد v4.2)
   * يظهر أسفل رسالة الخطأ بلون برتقالي قبل الوصول للقفل
   */
  function _showAttemptsWarning(remaining) {
    var existing = document.getElementById("__attempts-warn");
    if (existing) existing.remove();
    if (remaining === 1) return; // مش هنحذر — سيُغلق الحساب في المحاولة الجاية مباشرة
    var text = "";
    if (remaining === 2) text = "⚠️ تبقَّت محاولتان قبل إغلاق الحساب";
    else text = "⚠️ تبقَّت " + remaining + " محاولات قبل إغلاق الحساب";
    var warn = document.createElement("div");
    warn.id = "__attempts-warn";
    warn.style.cssText =
      "background:var(--warning-soft,#fef3c7);border:1.5px solid var(--warning,#f59e0b);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13px;font-weight:600;color:var(--warning-dark,#92400e);direction:rtl;text-align:center;animation:__fadeIn 0.3s ease";
    warn.textContent = text;
    var errEl = document.getElementById("login-err");
    if (errEl && errEl.parentNode)
      errEl.parentNode.insertBefore(warn, errEl.nextSibling);

    // [SEC-LOGIN-CAPTCHA] بعد محاولتين فاشلتين (باقي 3 من 5) — فعّل
    // التحدي البشري كطبقة احتكاك إضافية قبل القفل الكامل من الباك اند
    if (remaining <= 3) _renderLoginCaptcha();
  }

  function _fmtCountdown(s) {
    var m = Math.floor(s / 60),
      sc = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (sc < 10 ? "0" : "") + sc;
  }

  function _renderLockBanner(seconds) {
    var existing = document.getElementById("__lock-banner");
    if (existing) existing.remove();
    if (!document.getElementById("__lock-style")) {
      var st = document.createElement("style");
      st.id = "__lock-style";
      st.textContent =
        "@keyframes __fadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}";
      document.head.appendChild(st);
    }
    var banner = document.createElement("div");
    banner.id = "__lock-banner";
    banner.style.cssText =
      "background:var(--danger-soft,#fee2e2);border:2px solid var(--danger,#ef4444);border-radius:12px;padding:16px 20px;margin:12px 0;direction:rtl;text-align:center;animation:__fadeIn 0.3s ease forwards";
    banner.innerHTML =
      '<div style="font-size:28px;margin-bottom:8px">🔒</div>' +
      '<div style="font-size:14px;font-weight:800;color:var(--danger,#ef4444);margin-bottom:6px">تم تأمين الحساب مؤقتاً</div>' +
      '<div style="font-size:12px;color:var(--text2,#475569);margin-bottom:12px">بسبب محاولات دخول متكررة — يمكنك المحاولة مجدداً بعد:</div>' +
      '<div id="__lock-countdown" style="font-size:36px;font-weight:900;font-family:var(--font-mono,monospace);color:var(--danger,#ef4444);letter-spacing:4px;background:var(--surface,#fff);border-radius:8px;padding:8px 20px;display:inline-block;border:2px solid var(--danger,#ef4444)">' +
      _fmtCountdown(seconds) +
      "</div>" +
      '<div style="font-size:11px;color:var(--text3,#94a3b8);margin-top:10px">🛡️ هذا الإجراء يحمي حسابك من الاختراق</div>' +
      '<div style="font-size:10px;color:var(--text3,#94a3b8);margin-top:4px">القفل يُطبَّق من الخادم — لا يمكن تجاوزه بإعادة تحميل الصفحة</div>';
    var errEl = document.getElementById("login-err");
    if (errEl && errEl.parentNode)
      errEl.parentNode.insertBefore(banner, errEl.nextSibling);
  }

  function _updateLockBanner(remaining) {
    var el = document.getElementById("__lock-countdown");
    if (el) el.textContent = _fmtCountdown(remaining);
  }
  function _removeLockBanner() {
    var b = document.getElementById("__lock-banner");
    if (b) b.remove();
    var w = document.getElementById("__attempts-warn");
    if (w) w.remove();
  }
  function _disableLoginForm() {
    var btn = document.getElementById("btn-login"),
      u = document.getElementById("l-user"),
      p = document.getElementById("l-pass");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = _loginBtnHTML(
        I18N.t("SHELL_MSG_ACCOUNT_LOCKED_SHORT"),
        true,
      );
    }
    if (u) u.disabled = true;
    if (p) p.disabled = true;
  }
  function _enableLoginForm() {
    var btn = document.getElementById("btn-login"),
      u = document.getElementById("l-user"),
      p = document.getElementById("l-pass");
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = _loginBtnHTML(I18N.t("SHELL_BTN_LOGIN"));
    }
    if (u) {
      u.disabled = false;
      u.value = "";
    }
    if (p) {
      p.disabled = false;
      p.value = "";
    }
    var err = document.getElementById("login-err");
    if (err) err.style.display = "none";
    _removeLoginCaptcha();
    showToast(I18N.t("SHELL_MSG_LOGIN_RETRY_ALLOWED"), "success");
  }

  // ─────────────────────────────────────────────────────────────
  // §G  Auth UI — doLogin · doLogout (نسخ مُحسَّنة)
  // ─────────────────────────────────────────────────────────────

  function doLogin() {
    // ── حراسة Frontend (ليست الأساسية — Backend هو الحارس) ───
    if (_loginLockEnds && Date.now() < _loginLockEnds) {
      showToast(I18N.t("SHELL_MSG_ACCOUNT_LOCKED_WAIT"), "error");
      return;
    }
    // [SEC-LOGIN-CAPTCHA] لازم يحل التحدي البشري الأول لو ظاهر
    if (_loginCaptchaRequired) {
      showToast(I18N.t("SHELL_CAPTCHA_REQUIRED"), "error");
      var capInp = document.getElementById("__captcha-input");
      if (capInp) capInp.focus();
      return;
    }
    var u = document.getElementById("l-user").value.trim();
    var p = document.getElementById("l-pass").value;
    var btn = document.getElementById("btn-login");
    var uInp = document.getElementById("l-user");
    var pInp = document.getElementById("l-pass");
    if (!u || !p) {
      showLoginErr(I18N.t("SHELL_MSG_FILL_ALL_FIELDS"));
      return;
    }

    // ── تذكّر اسم المستخدم لو العلامة مفعّلة ─────────────────
    _loginSaveRemember(u);

    btn.disabled = true;
    uInp.disabled = true;
    pInp.disabled = true;
    btn.innerHTML =
      '<span style="display:inline-flex;align-items:center;gap:8px">' +
      '<span style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;animation:spin 0.6s linear infinite;display:inline-block"></span>' +
      I18N.t("SHELL_MSG_LOGGING_IN") +
      "</span>";

    // ✅ double-rAF: يضمن أن المتصفح يرسم الـ Spinner قبل إرسال الطلب
    // الـ rAF الأول يدخل الـ frame الحالي، والثاني ينتظر بعد انتهاء الرسم
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        // [DATA-UNIFY] loginWithData بترجع success:false في حالات عمل عادية
        // (كلمة مرور خطأ / حساب مقفول) مش خطأ اتصال — فالمعالج ده بيستقبل
        // النتيجتين (عن طريق rawResponse:true في الـ Data Layer) ويميّز بينهم
        // داخلياً؛ onError الحقيقي بيتفعّل بس لو مفيش رد خالص من السيرفر.
        function _handleLoginResult(result) {
          var res = result.data;
          if (res === null || res === undefined) {
            btn.disabled = false;
            uInp.disabled = false;
            pInp.disabled = false;
            btn.innerHTML = _loginBtnHTML(I18N.t("SHELL_BTN_LOGIN"));
            showLoginErr(
              I18N.t("SHELL_MSG_CONNECTION_ERROR_PREFIX") +
                " " +
                result.message,
            );
            return;
          }
          {
            btn.disabled = false;
            uInp.disabled = false;
            pInp.disabled = false;
            btn.innerHTML = _loginBtnHTML(I18N.t("SHELL_BTN_LOGIN"));

            // ── ✅ دخول ناجح ─────────────────────────────────────
            if (res && res.success) {

              _whenLazyReady(_applyPmState);
            }
          }
          if (typeof _hideAppLoader === "function") _hideAppLoader();
          APP._loginTime = Date.now();
          renderPage(APP.currentPage);
          if (typeof SessionLifecycle !== "undefined") SessionLifecycle.restoreAfterLogin();
          updateAlertBadge();
          updateNotifBell();
          if (typeof _preloadAllAfterLogin === "function") {
            // [FIX-SESSION-RACE] تأجيل بسيط عشان نضمن إن الجلسة الجديدة
            // اتخزنت واستقرت فعليًا على السيرفر (CacheService/PropertiesService)
            // قبل ما نطلق نداءات محمية بصلاحيات (getAllDataExtendedCore/Lazy)
            // بالتوازي — نداء بروتكتد جوا أول لحظات بعد اللوجين مباشرة كان
            // بيرجع أحيانًا SESSION_INVALID زائف (الجلسة لسه بتتخزن) وده كان
            // بيرجّع المستخدم لشاشة اللوجين فجأة رغم إن تسجيل الدخول نجح فعلاً.
            setTimeout(_preloadAllAfterLogin, 400); // [PERF-EARLIER-PRELOAD-2026-08-02] قللنا التأجيل من 1200 لـ 400ms — يفضل هامش أمان كافي لاستقرار الجلسة، بس بيدي تحميل بيانات الشاشات فرصة أطول تخلص قبل ما المستخدم يدخل شاشة تانية.
          }
          // [PERF-EARLIER-SCREENS-DATA-2026-08-05] البيانات الكاملة صامتًا في
          // الخلفية — قللنا التأجيل من 1500ms لـ 400ms (نفس هامش الأمان
          // المستخدم في _preloadAllAfterLogin فوق، عشان getAllData برضه نداء
          // محمي بصلاحيات ومعرّض لنفس مشكلة SESSION_INVALID الزائفة لو
          // اتنودى قبل ما الجلسة تستقر) بدل ما المستخدم يستنى وهو فاتح شاشة.
          setTimeout(function () {
            loadAllData(null, true);
          }, 400);
        },
        onError: function () {
          clearTimeout(_liteSlowNotice);
          // لو فشلت الخفيفة برضه، ارجع للمسار العادي الكامل كخطة بديلة
          loadAllData();
        },
      });
    }
  }

  function showLoginErr(msg) {
    var el = document.getElementById("login-err");
    if (!el) return;
    el.style.display = "block";
    el.setAttribute("role", "alert");
    el.setAttribute("aria-live", "assertive");
    el.setAttribute("data-testid", "login-error");
    el.textContent = msg;
  }

  // ✅ [FIX-LOGOUT-DUP-CONFIRM] الخطوات الفعلية لإنهاء الجلسة — اتفصلت هنا
  // عشان تتنادى مباشرة من أماكن اختار فيها المستخدم "تسجيل الخروج" بشكل
  // صريح ولا محتاجة تأكيد إضافي (زي رابط "تسجيل الخروج بدلاً من ذلك" في
  // شاشة إجبار تغيير كلمة المرور) — قبل كده كانت بتنادي doLogout() اللي
  // بتفتح modal "هل تريد تسجيل الخروج؟" فوق شاشة كانت أصلاً بتعرض
  // شاشة الدخول (لأن #root كان لسه شاشة اللوجين القديمة تحت الـ overlay)،
  // فيبان وكأن نافذة التأكيد ظهرت "بعد" الخروج مش قبله.
  function _performLogout() {
    var token = SESSION.token;
    var username = APP.currentUser ? APP.currentUser.username : null;
    if (token) {
      DL.Users.logout(token, username, {
        onSuccess: function () {},
        onError: function () {},
      });
    }
    // ── أغلق أي شاشة منسدلة (drawer) وأي قائمة منسدلة من الشمال قبل إنهاء الجلسة ──
    if (typeof closeDrawer === "function") closeDrawer(true);
    if (typeof _closeAllDropdowns === "function") _closeAllDropdowns();
    _clearSession();
    APP.currentUser = null;
    // ── [USER-PREFS] مسح الكاش عند تسجيل الخروج ──
    if (typeof PreferenceService !== "undefined") PreferenceService.clear();
    APP.currentPage = "dashboard";
    try {
      sessionStorage.clear();
    } catch (e) {}
    // ── إزالة المساعد الذكي عند الخروج (لإعادة تهيئته بشكل سليم عند الدخول التالي) ──
    var fabRoot = document.getElementById("ai-float-root");
    if (fabRoot) fabRoot.remove();
    // §AS — صوت تسجيل الخروج
    if (typeof AS !== "undefined") {
      try {
        AS.logout();
      } catch (e) {}
    }
    render();
  }

  function doLogout() {
    showConfirm({
      icon: "ti-logout",
      iconColor: "#475569",
      title: I18N.t("SHELL_MSG_LOGOUT_TITLE"),
      message: I18N.t("SHELL_MSG_LOGOUT_CONFIRM"),
      confirmText: I18N.t("SHELL_BTN_LOGOUT"),
      confirmClass: "btn-danger",
      onConfirm: function (unfreeze) {
        unfreeze();
        _performLogout();
      },
    });
  }

  // ── Dismissed Alerts Helpers ──
  function _getDismissedAlerts() {
    try {
      return JSON.parse(localStorage.getItem("dismissedAlerts") || "[]");
    } catch (e) {
      return [];
    }
  }
  function _dismissAlert(key) {
    var list = _getDismissedAlerts();
    if (list.indexOf(key) === -1) list.push(key);
    localStorage.setItem("dismissedAlerts", JSON.stringify(list));
  }
  function _alertKey(item, colorName) {
    return item.id + "__" + (colorName || "__nocolor__");
  }

  function alertCount() {
    // ✅ [FIX-LAZY-LAYOUT] دفاع إضافي: لو اتنادت قبل ما 03_JS_Dashboard_Items
    // (اللي فيها getItemColors) تتحمّل، رجّع صفر بدل ما ترمي ReferenceError.
    if (typeof getItemColors !== "function") return 0;
    var dismissed = _getDismissedAlerts();
    var count = 0;
    APP.data.items.forEach(function (item) {
      var itemMinQ = Number(item.min_qty || 0);
      var colors = getItemColors(item.id);
      if (colors.length > 0) {
        colors.forEach(function (c) {
          var colorMinQ = Number(c.min_qty || 0);
          if (colorMinQ <= 0) colorMinQ = itemMinQ;
          if (colorMinQ <= 0) return;
          var colorQty = getColorQty(item.id, c.name);
          if (
            colorQty < colorMinQ &&
            dismissed.indexOf(_alertKey(item, c.name)) === -1
          )
            count++;
        });
      } else {
        if (itemMinQ <= 0) return;
        var currentQty = APP.data.stock
          .filter(function (s) {
            return s.item_id === item.id;
          })
          .reduce(function (a, s) {
            return a + Number(s.quantity || 0);
          }, 0);
        var totalQty = currentQty + getOpeningQty(item.id);
        if (
          totalQty < itemMinQ &&
          dismissed.indexOf(_alertKey(item, null)) === -1
        )
          count++;
      }
    });
    return count;
  }
  // ── تحديث عداد التنبيهات في الشريط الجانبي ──
  function updateAlertBadge() {
    // ✅ v4.2: المصدر الموحّد — غير المقروء فقط يظهر في الـ badge
    // لو الكل مقروء → الـ badge يختفي تماماً (السلوك المتوقع)
    var notifs = _buildNotifications();
    var readIds = _getReadIds();
    var count = notifs.filter(function (n) {
      return n.source === "engine" ? !n.read : readIds.indexOf(n.id) === -1;
    }).length;
    var navItem = document.querySelector('.nav-item[data-page="alerts"]');
    if (!navItem) return;
    var old = navItem.querySelector(".nav-badge");
    if (old) old.remove();
    if (count > 0) {
      var badge = document.createElement("span");
      badge.className = "nav-badge";
      badge.textContent = count > 99 ? "99+" : count;
      navItem.appendChild(badge);
    }
  }
  function dismissAlert(key) {
    _dismissAlert(key);
    // أخفي البطاقة بأنيميشن
    var card = document.querySelector('[data-alert-key="' + key + '"]');
    if (card) {
      card.style.opacity = "0";
      card.style.transform = "translateX(20px)";
      card.style.transition = "opacity .3s,transform .3s";
      setTimeout(function () {
        card.remove();
        // حدّث الـ badges والإحصائيات
        updateAlertBadge();
        _refreshAlertStats();
      }, 300);
    }
  }

  function _refreshAlertStats() {

    if (APP.currentPage === "alerts") {
      renderPage("alerts");
    }
  }

  /** فلتر التبويبات في صفحة التنبيهات */
  function notifPageFilter(tab) {
    // تحديث أزرار التبويب
    ["all", "unread", "stock", "other"].forEach(function (t) {
      var btn = document.getElementById("ntab-" + t);
      if (btn) btn.classList.toggle("active", t === tab);
    });

    var items = document.querySelectorAll(".notif-full-item");
    var readIds = _getReadIds();

    items.forEach(function (el) {
      var nid = el.getAttribute("data-notif-id");
      var page = el.getAttribute("data-page");
      var isEngine = el.getAttribute("data-source") === "engine";
      var isUnread = isEngine
        ? el.classList.contains("unread")
        : readIds.indexOf(nid) === -1;
      var isStock = page === "alerts";

      var show = false;
      if (tab === "all") show = true;
      if (tab === "unread") show = isUnread;
      if (tab === "stock") show = isStock;
      if (tab === "other") show = !isStock;

      el.style.display = show ? "" : "none";
    });

    // عرض حالة فارغة لو لا يوجد نتائج
    var list = document.getElementById("notif-page-list");
    if (list) {
      var visible = Array.from(items).filter(function (el) {
        return el.style.display !== "none";
      });
      var existing = list.querySelector(".notif-full-empty");
      if (!visible.length && !existing) {
        var empty = document.createElement("div");
        empty.className = "notif-full-empty _filter-empty";
        empty.innerHTML =
          '<span class="empty-icon">✅</span><p style="font-weight:700;color:var(--text)">لا توجد تنبيهات في هذا التصنيف</p>';
        list.appendChild(empty);
      } else if (visible.length) {
        var fe = list.querySelector("._filter-empty");
        if (fe) fe.remove();
      }
    }
  }

  /** عند الضغط على إشعار في الصفحة الكاملة */
  function notifPageItemClick(el) {
    var nid = el.getAttribute("data-notif-id");
    var page = el.getAttribute("data-page");
    var isEngine = el.getAttribute("data-source") === "engine";
    if (!nid) return;

    // [UNIFY-NOTIF] بند من NotificationEngine — نفس نقطة الفتح الموحّدة
    // اللي بيستخدمها التوست والجرس بالظبط (mark read + navigate + صلاحية)
    if (isEngine) {
      if (typeof NotificationEngine !== "undefined") {
        NotificationEngine.openEntry(nid);
      }
      renderPage("alerts"); // إعادة رسم الصفحة عشان الحالة تتحدّث فورًا
      return;
    }

    // سجّل كمقروء
    var ids = _getReadIds();
    if (ids.indexOf(nid) === -1) {
      ids.push(nid);
      _saveReadIds(ids);
    }

    // تحديث مظهر العنصر فوراً
    el.classList.remove("unread");
    var strip = el.querySelector(".notif-full-unread-strip");
    if (strip) strip.remove();
    var ubadge = el.querySelector(".unread-badge");
    if (ubadge) {
      ubadge.classList.remove("unread-badge");
      ubadge.classList.add("read-badge");
      ubadge.textContent = "✓ مقروء";
    }
    var markBtn = el.querySelector(".notif-full-item-btn");
    if (markBtn) markBtn.remove();

    // تحديث الـ bell
    updateNotifBell();
    updateAlertBadge();

    // انتقل للصفحة المرتبطة
    if (page && page !== "alerts") navigate(page);
  }

  /** تحديد إشعار واحد كمقروء من زر ✓ */
  function notifPageMarkOneRead(nid) {
    var el = document.querySelector(
      '.notif-full-item[data-notif-id="' + nid + '"]',
    );
    var isEngine = el && el.getAttribute("data-source") === "engine";
    if (isEngine) {
      // [UNIFY-NOTIF] هنا فقط "تحديد كمقروء" بدون تنقّل — بنستخدم
      // markRead مباشرة (مش openEntry اللي بينقل الصفحة كمان)
      if (typeof NotificationEngine !== "undefined") {
        NotificationEngine.markRead(nid);
      }
    } else {
      var ids = _getReadIds();
      if (ids.indexOf(nid) === -1) {
        ids.push(nid);
        _saveReadIds(ids);
      }
    }
    // تحديث UI بدون إعادة رسم كاملة
    if (el) {
      el.classList.remove("unread");
      var strip = el.querySelector(".notif-full-unread-strip");
      if (strip) strip.remove();
      var ubadge = el.querySelector(".unread-badge");
      if (ubadge) {
        ubadge.classList.remove("unread-badge");
        ubadge.classList.add("read-badge");
        ubadge.textContent = "✓ مقروء";
      }
      var markBtn = el.querySelector(".notif-full-item-btn");
      if (markBtn) markBtn.remove();
    }
    updateNotifBell();
    updateAlertBadge();
    // تحديث شريط الأكشن (زر "تحديد الكل كمقروء")
    var actBar = document.querySelector(".notif-actions-bar");
    if (actBar) {
      var _rIds1 = _getReadIds();
      var remaining = _buildNotifications().filter(function (n) {
        return n.source === "engine" ? !n.read : _rIds1.indexOf(n.id) === -1;
      }).length;
      if (!remaining) {
        var btn = actBar.querySelector("button");
        if (btn && btn.textContent.indexOf("تحديد الكل") !== -1) btn.remove();
      }
    }
    // تحديث badge التبويبات
    var unreadTab = document.getElementById("ntab-unread");
    if (unreadTab) {
      var _rIds2 = _getReadIds();
      var remaining2 = _buildNotifications().filter(function (n) {
        return n.source === "engine" ? !n.read : _rIds2.indexOf(n.id) === -1;
      }).length;
      var badge = unreadTab.querySelector(".tab-badge");
      if (remaining2 > 0) {
        if (badge) badge.textContent = remaining2;
        else
          unreadTab.innerHTML =
            "غير مقروء <span class='tab-badge'>" + remaining2 + "</span>";
      } else {
        if (badge) badge.remove();
      }
    }
  }

  /** تحديد الكل كمقروء من صفحة التنبيهات */
  function notifPageMarkAllRead() {
    var notifs = _buildNotifications();
    var ids = notifs
      .filter(function (n) {
        return n.source !== "engine";
      })
      .map(function (n) {

    if (typeof NotificationEngine !== "undefined") {

    var actBar = document.querySelector(".notif-actions-bar");
    if (actBar) {
      var btn = actBar.querySelector("button");
      if (btn && btn.textContent.indexOf("تحديد الكل") !== -1) {

    ["ntab-unread"].forEach(function (id) {

  function onRenameInput(input) {
    var val = input.value.trim();
    var btn = document.getElementById("rename-save-btn");
    var warning = document.getElementById("rename-warning");

    if (warning) warning.classList.toggle("show", val.length > 0);

  function saveRenameUser(username) {
    var newName = (document.getElementById("rename-new-name") || {}).value;
    if (!newName || !newName.trim()) {
      showToast(I18N.t("SHELL_MSG_NEW_NAME_REQUIRED"), "error");
      return;
    }
    newName = newName.trim();

    var u = APP.data.users.find(function (x) {
      return x.username === username;
    });
    if (u && u.full_name === newName) {
      showToast(I18N.t("SHELL_MSG_NEW_NAME_SAME"), "warning");
      return;
    }

    var btn = document.getElementById("rename-save-btn");
    if (btn) {
      btn.disabled = true;
      btn.textContent = SAVE_MESSAGES.SAVING;
    }

    // ✅ UX: إغلاق فوري + مؤشر خلفي بدل انتظار الـ Modal
    closeModal();
    _freezeUI(SAVE_MESSAGES.SAVING);

    DL.Users.renameUser(
      {
        username: username,
        new_name: newName,
        callerUser: APP.currentUser ? APP.currentUser.username : "",
      },
      {
        onSuccess: function (result) {
          _unfreezeUI();
          var r = result.data;
          showToast(
            result.message || I18N.t("SHELL_MSG_NAME_CHANGE_SUCCESS"),
            "success",
          );
          // ── تحديث فوري في APP.data بدون إعادة تحميل كاملة ──
          var userInData = APP.data.users.find(function (x) {
            return x.username === username;
          });
          if (userInData) userInData.full_name = (r && r.new_name) || newName;

          // لو كان هو المستخدم الحالي → حدّث currentUser أيضاً
          if (APP.currentUser && APP.currentUser.username === username) {
            APP.currentUser.full_name = (r && r.new_name) || newName;
            // تحديث الـ top bar avatar إذا وُجد
            var avatarEl = document.getElementById("user-avatar-label");
            if (avatarEl)
              avatarEl.textContent = ((r && r.new_name) || newName)[0] || "م";
            var nameEl = document.getElementById("user-display-name");
            if (nameEl) nameEl.textContent = (r && r.new_name) || newName;
          }

          // تحديث الصفحة الحالية لو كانت users أو alerts
          reloadAfterMutation(function () {
            if (APP.currentPage === "users" || APP.currentPage === "alerts")
              renderPage(APP.currentPage);
          });
        },
        onError: function (result) {
          _unfreezeUI();
          showToast(
            result.message || I18N.t("SHELL_MSG_NAME_CHANGE_ERROR"),
            "error",
          );
        },
      },
    );
  }

  function _buildNotifications() {

    // اللي متحمّلة "كسول" (lazy) عن طريق ensureExtendedData ومش بالضرورة
    // موجودة في APP.data أول ما المستخدم يسجّل دخول لو لسه مازار شاشة

    // ── 1. مخزون منخفض / نافد ── [PREFS-WIRING] gated by notif_inventory ──
    if (_allowInventory)

        var colors = getItemColors(item.id);
        if (colors.length > 0) {
          colors.forEach(function (c) {
            var colorMinQ = Number(c.min_qty || 0) || Number(item.min_qty || 0);
            if (colorMinQ <= 0) return;

                : "الرصيد " + colorQty + " — الحد الأدنى " + colorMinQ,
              page: "alerts",
              ts: now,
            });
          });
        } else {
          var itemMinQ = Number(item.min_qty || 0);
          if (itemMinQ <= 0) return;
          var currentQty = (d.stock || [])
            .filter(function (s) {

            .reduce(function (a, s) {

          var totalQty = currentQty + getOpeningQty(item.id);

    if (_allowSystem)

    if (_allowSystem)

    // ── 4. فواتير بيع مستحقة / متأخرة السداد ───────────────────
    var _todayStr0 = new Date().toISOString().slice(0, 10);
    // [PREFS-WIRING] gated by notif_customers
    if (_allowCustomers)
      (d.saleInvoices || []).forEach(function (inv) {

        if (inv.payment_status === "paid") return;
        if (!inv.due_date) return;
        if (String(inv.due_date).slice(0, 10) > _todayStr0) return;
        notifs.push({
          id: "si_due_" + inv.id,
          type: "danger",
          icon: "🧾",
          iconBg: "var(--danger-soft)",
          title: "فاتورة بيع مستحقة",

          page: "sale-invoices",

        });
      });

    // ── 5. فواتير شراء متأخرة السداد ── [PREFS-WIRING] gated by notif_suppliers ──
    if (_allowSuppliers)
      (d.purchaseInvoices || []).forEach(function (inv) {
        if (inv.status === "cancelled") return;
        if (inv.payment_status === "paid") return;
        if (!inv.due_date) return;
        if (String(inv.due_date).slice(0, 10) > _todayStr0) return;
        notifs.push({
          id: "pi_due_" + inv.id,
          type: "warning",
          icon: "🧾",
          iconBg: "var(--warning-soft)",
          title: "فاتورة شراء متأخرة السداد",

    // ── 6. [AUDIT-FIX 2.1] شيكات مستحقة عبر سندات القبض/الصرف — اتشالت —
    // كانت بتعتمد على check_number/due_date الحرّين اللي بقوا deprecated
    // (المصدر الوحيد للحقيقة دلوقتي هو Cheques عبر cheque_id). البند 6b
    // تحت بيغطي كل الشيكات فعليًا من جدول Cheques نفسه، فمفيش داعي لمساره
    // القديم المنفصل هنا.

    // ── 6b. شيكات موديول البنوك المستحقة/المتأخرة ────────────────
    // [BANKING-INTEGRATION — المرحلة 11] نفس منطق "شيكات مستحقة خلال 7 أيام"
    // المستخدم في لوحة تحكم البنوك (bindBankingDashboard) — مصدر مختلف عن
    // بند 6 فوق: هنا من جدول الشيكات المخصوص لموديول البنوك (APP.data.cheques)

    var _soonStr0 = new Date(Date.now() + 7 * 86400000)

    if (_allowFinancial)

    // [BANKING-INTEGRATION — المرحلة 11] نفس منطق بطاقة "مطابقات معتمدة

    if (_allowApprovals)
      (d.leaveRequests || []).forEach(function (lr) {

    // ── 7. [UNIFY-NOTIF] إشعارات الأحداث من NotificationEngine (نفس مصدر
    // الـ Toast) اللي معاها "page" — يعني إشعار حقيقي له وجهة تستحق تظهر
    // في مركز الإشعارات، مش مجرد "تم الحفظ" عابرة (دي بتفضل في تبويب
    // المساعد الذكي بس عشان منغرقش الجرس بمئات رسائل النجاح العادية).
    // هي *نفس* الكائن اللي أطلق التوست — مش نسخة مستقلة — فالفقاعة
    // بتختفي والإشعار يفضل هنا بالظبط زي ما هو مطلوب.
    if (typeof NotificationEngine !== "undefined") {
      NotificationEngine.getHistory().forEach(function (n) {
        if (!n.page) return; // بدون وجهة = عرضها في تبويب المساعد فقط
        if (n.perm && typeof canDo === "function" && !canDo(n.perm)) return; // [PERMISSION-AWARE] احترام صلاحيات المستخدم
        var visualIcon = { error: "🔴", warning: "🟡", success: "🟢", info: "🔵" };
        var visualBg = {
          error: "var(--danger-soft)",
          warning: "var(--warning-soft)",
          success: "var(--success-soft, var(--accent-soft))",
          info: "var(--accent-soft)",
        };
        var noteType = n.type === "error" ? "danger" : n.type === "warning" ? "warning" : "info";
        notifs.push({
          id: n.id,
          type: noteType,
          icon: visualIcon[n.type] || "🔵",
          iconBg: visualBg[n.type] || "var(--accent-soft)",
          title: n.message,
          desc: n.screen || "",
          page: n.page,
          ts: n.at.getTime(),
          source: "engine", // [UNIFY-NOTIF] فرّق حالة القراءة عن نظام localStorage القديم
          read: n.read,
        });
      });
    }

    // رتّب: danger أولاً ثم warning ثم info
    var order = { danger: 0, warning: 1, info: 2 };
    notifs.sort(function (a, b) {
      return (order[a.type] || 3) - (order[b.type] || 3);
    });
    return notifs;
  }

  /** اقرأ قائمة الـ IDs المقروءة من localStorage */
  function _getReadIds() {
    try {
      return JSON.parse(localStorage.getItem(NOTIF_READ_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  /** احفظ قائمة الـ IDs المقروءة */
  function _saveReadIds(ids) {
    try {
      localStorage.setItem(NOTIF_READ_KEY, JSON.stringify(ids));
    } catch (e) {}
  }

  /** عدد الإشعارات غير المقروءة — [UNIFY-NOTIF] بنود NotificationEngine
   * (source:"engine") بتحمل حالة القراءة الخاصة بيها (n.read)، والبنود
   * المحسوبة القديمة (مخزون/فواتير...) لسه بتعتمد على readIds بالـ localStorage */
  function _unreadCount(notifs, readIds) {
    return notifs.filter(function (n) {
      if (n.source === "engine") return !n.read;
      return readIds.indexOf(n.id) === -1;
    }).length;
  }

  /** تحديث الـ bell badge بعدد الإشعارات غير المقروءة */
  function updateNotifBell() {
    var notifs = _buildNotifications();
    var readIds = _getReadIds();
    var unread = _unreadCount(notifs, readIds);

    var bubble = document.getElementById("notif-count-bubble");
    if (!bubble) return;

    if (unread > 0) {
      bubble.textContent = unread > 99 ? "99+" : unread;
      bubble.classList.add("show");
    } else {
      bubble.classList.remove("show");
    }

    // لو فيه إشعارات جديدة أكثر من المرة السابقة → نبّه بـ toast خفيف
    if (_notifLastCount >= 0 && unread > _notifLastCount) {
      var diff = unread - _notifLastCount;
      showToast(
        I18N.t(
          diff > 1
            ? "SHELL_MSG_NEW_ALERT_PLURAL"
            : "SHELL_MSG_NEW_ALERT_SINGULAR",
          { count: diff },
        ),
        "warning",
      );
    }
    _notifLastCount = unread;

    // ✅ v4.2: لو صفحة التنبيهات مفتوحة → حدّث badges التبويبات فوراً
    if (APP.currentPage === "alerts") {
      var unreadTabBadge = document.getElementById("ntab-unread");
      if (unreadTabBadge) {
        var b = unreadTabBadge.querySelector(".tab-badge");
        if (unread > 0) {
          if (b) b.textContent = unread;
          else
            unreadTabBadge.innerHTML =
              "غير مقروء <span class='tab-badge'>" + unread + "</span>";
        } else {
          if (b) b.remove();
        }
      }
      var allTabBadge = document.getElementById("ntab-all");
      if (allTabBadge) {
        var notifTotal = _buildNotifications().length;
        var ab = allTabBadge.querySelector(".tab-badge");
        if (notifTotal > 0) {
          if (ab) ab.textContent = notifTotal;
        } else {
          if (ab) ab.remove();
        }
      }
    }
  }

  /** ارسم قائمة الإشعارات داخل الـ dropdown */
  function _renderNotifList() {
    var body = document.getElementById("notif-list-body");
    if (!body) return;
    var notifs = _buildNotifications();
    var readIds = _getReadIds();

    if (!notifs.length) {
      body.innerHTML =
        '<div class="notif-empty"><div>✅</div>لا توجد إشعارات جديدة<br><small>كل شيء على ما يرام</small></div>';
      return;
    }

    body.innerHTML = notifs
      .map(function (n) {
        var isUnread = n.source === "engine" ? !n.read : readIds.indexOf(n.id) === -1;
        return (
          '<div class="notif-item' +
          (isUnread ? " unread" : "") +
          '" data-page="' +
          n.page +
          '" data-id="' +
          n.id +
          '" data-source="' +
          (n.source === "engine" ? "engine" : "computed") +
          '">' +
          (isUnread ? '<span class="notif-unread-dot"></span>' : "") +
          '<div class="notif-icon-wrap" style="background:' +
          n.iconBg +
          '">' +
          n.icon +
          "</div>" +
          '<div class="notif-body">' +
          '<div class="notif-title">' +
          n.title +
          "</div>" +
          '<div class="notif-desc">' +
          n.desc +
          "</div>" +
          "</div>" +
          "</div>"
        );
      })
      .join("");

    // click على item → انتقل للصفحة وحدّده كمقروء
    body.querySelectorAll(".notif-item").forEach(function (el) {
      el.addEventListener("click", function () {
        var nid = el.getAttribute("data-id");
        var page = el.getAttribute("data-page");
        var isEngine = el.getAttribute("data-source") === "engine";

        if (isEngine) {
          // [UNIFY-NOTIF] بند من NotificationEngine — نقطة واحدة موحّدة
          // للـ mark-read + التنقّل + احترام الصلاحيات، نفس اللي التوست
          // بيستخدمها بالظبط لحظة الضغط عليه.
          closeNotifDropdown();
          if (typeof NotificationEngine !== "undefined") {
            NotificationEngine.openEntry(nid);
          }
          updateNotifBell();
          updateAlertBadge();
          return;
        }

        var ids = _getReadIds();
        if (ids.indexOf(nid) === -1) {
          ids.push(nid);
          _saveReadIds(ids);
        }
        // ✅ v4.2: لو صفحة التنبيهات مفتوحة → حدّث UI فوراً (مصدر موحّد)
        if (APP.currentPage === "alerts") {
          var pageItem = document.querySelector(
            '.notif-full-item[data-notif-id="' + nid + '"]',
          );
          if (pageItem) {
            pageItem.classList.remove("unread");
            var strip = pageItem.querySelector(".notif-full-unread-strip");
            if (strip) strip.remove();
            var ubadge = pageItem.querySelector(".unread-badge");
            if (ubadge) {
              ubadge.classList.remove("unread-badge");
              ubadge.classList.add("read-badge");
              ubadge.textContent = "✓ مقروء";
            }
            var markBtn = pageItem.querySelector(".notif-full-item-btn");
            if (markBtn) markBtn.remove();
          }
        }
        updateNotifBell();
        updateAlertBadge();
        closeNotifDropdown();
        navigate(page);
      });
    });
  }

  /** افتح / أغلق الـ dropdown */
  // [REFACTOR-P7] toggleNotifDropdown اتنقلت لـ Core_UIManagers.html (Global، بنفس الاسم)

  // [REFACTOR-P7] closeNotifDropdown اتنقلت لـ Core_UIManagers.html (Global، بنفس الاسم)

  /** ربط أحداث الـ top bar (يُستدعى بعد renderLayout) */
  function bindTopBar() {
    // Bell button
    var bell = document.getElementById("notif-bell-btn");
    if (bell)
      bell.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleNotifDropdown();
      });

    // Backdrop
    var bd = document.getElementById("notif-backdrop");
    if (bd) bd.addEventListener("click", closeNotifDropdown);

    // Mark all as read
    var markAll = document.getElementById("notif-mark-all-btn");
    if (markAll)
      markAll.addEventListener("click", function () {
        var notifs = _buildNotifications();
        var ids = notifs
          .filter(function (n) {
            return n.source !== "engine";
          })
          .map(function (n) {
            return n.id;
          });
        _saveReadIds(ids);
        // [UNIFY-NOTIF] نفس زر "تحديد الكل كمقروء" لازم يغطي بنود
        // NotificationEngine كمان — مصدر موحّد واحد، مش نصف الجرس بس
        if (typeof NotificationEngine !== "undefined") {
          NotificationEngine.markAllRead();
        }
        _renderNotifList();
        updateNotifBell();
        updateAlertBadge();
        // ✅ v4.2: لو صفحة التنبيهات مفتوحة → حدّث مباشرة (مصدر موحّد)
        if (APP.currentPage === "alerts") {
          if (typeof notifPageMarkAllRead === "function")
            notifPageMarkAllRead();
        }
      });

    // Go to alerts page
    var goAlerts = document.getElementById("notif-go-alerts-btn");
    if (goAlerts)
      goAlerts.addEventListener("click", function () {
        closeNotifDropdown();
        navigate("alerts");
      });

    // [UNIFY-NOTIF] اشترك مرة واحدة بس في تغييرات NotificationEngine —
    // بيندى مباشرة (حتى لو الجرس مقفول) عشان الـ badge يتحدّث فورًا لحظة
    // أي إشعار جديد بدل ما يستنى الـ polling كل 5 دقايق. bindTopBar بتتنادى
    // مع كل renderLayout()، فبنحمي بـ flag من تكديس نفس الاشتراك أكتر من مرة.
    if (!_engineNotifSubscribed && typeof NotificationEngine !== "undefined") {
      _engineNotifSubscribed = true;
      NotificationEngine.onChange(function () {
        updateNotifBell();
        if (APP.currentPage === "alerts" && typeof _renderNotifList === "function") {
          _renderNotifList();
        }
      });
    }

    // polling كل 5 دقائق
    if (_notifPollTimer) clearInterval(_notifPollTimer);
    _notifPollTimer = _registerPollTimer(
      setInterval(
        function () {
          // نحدّث البيانات بصمت ثم نحدث الـ bell
          if (typeof _silentRefresh === "function") _silentRefresh();
          else updateNotifBell();
        },
        5 * 60 * 1000,
      ),
    );

    // تحديث فوري
    updateNotifBell();

    // ── ربط زر تبديل اللغة (AR/EN) ──
    var langBtn = document.getElementById("lang-switch-btn");
    if (langBtn) {
      langBtn.addEventListener("click", function () {
        if (langBtn.disabled) return;
        var next = I18N.getLang() === "ar" ? "en" : "ar";
        var icon = langBtn.querySelector(".lang-switch-icon");
        langBtn.disabled = true;
        if (icon) {
          icon.className = "ti ti-loader-2 lang-switch-icon";
          icon.style.animation = "spin 1s linear infinite";
        }
        I18N.switchLanguage(
          APP.currentUser && APP.currentUser.username,
          SESSION ? SESSION.token : null,
          next,
          function () {
            langBtn.disabled = false;
            if (icon) {
              icon.className = "ti ti-language lang-switch-icon";
              icon.style.animation = "";
            }
            var label = document.getElementById("lang-switch-label");
            if (label)
              label.textContent = I18N.getLang() === "ar" ? "EN" : "AR";
          },
          function (err) {
            langBtn.disabled = false;
            if (icon) {
              icon.className = "ti ti-language lang-switch-icon";
              icon.style.animation = "";
            }
            if (typeof showToast === "function") {
              showToast((err && err.message) || "تعذر تغيير اللغة", "error");
            }
          },
        );
      });
    }

    // ── ربط زر واتساب في Top Bar ──
    var waBtn = document.getElementById("wa-topbar-btn");
    if (waBtn) {
      waBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (typeof WA_HUB !== "undefined" && WA_HUB.toggleDropdown) {
          WA_HUB.toggleDropdown();
        }
      });
    }
    // إغلاق قائمة WA عند الضغط خارجها
    document.addEventListener("click", function (e) {
      var dd = document.getElementById("wa-topbar-dropdown");
      var wrap = document.getElementById("wa-topbar-wrap");
      if (
        dd &&
        dd.style.display !== "none" &&
        wrap &&
        !wrap.contains(e.target)
      ) {
        dd.style.display = "none";
      }
    });
  }

    if (el) el.textContent = title || "";

  // [BREADCRUMB-IW] شاشات الفاتورة/المرتجع (صفحة كاملة، مش مودال) —
  // مش مسجّلة كـ item عادي في NAV_GROUPS (بتتفتح بدالة JS مباشرة
  // زي openSaleInvoiceWorkspace)، فبدونها كانت بترجع بريدكرمب ناقص
  // (لوحة التحكم > فاتورة بيع جديدة بس). هنا بنعرّف تبعيتها الصحيحة:
  // المجموعة (المبيعات/المشتريات) ← صفحة القائمة (فواتير البيع...) ← الحالية.
  var IW_WORKSPACE_BREADCRUMB = {
    sale_invoice_workspace: {
      group: "MENU_SALES",
      groupPage: "sales-dashboard",
      listLabel: "MENU_SALES_INVOICES",
      listPage: "sale-invoices",
      titleKey: "PAGE_SALE_INVOICE_WORKSPACE",
    },
    purchase_invoice_workspace: {
      group: "MENU_PURCHASES",
      groupPage: "purchases-dashboard",
      listLabel: "MENU_PURCHASE_INVOICES",
      listPage: "purchase-invoices",
      titleKey: "PAGE_PURCHASE_INVOICE_WORKSPACE",
    },
    sale_return_workspace: {
      group: "MENU_SALES",
      groupPage: "sales-dashboard",
      listLabel: "MENU_SALES_RETURN",
      listPage: "sale-returns",
      titleKey: "PAGE_SALE_RETURN_WORKSPACE",
    },
    purchase_return_workspace: {
