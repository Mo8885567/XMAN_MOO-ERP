  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  /**

   * من xdRerenderAll() لما تكون إعادة رسم داخلية للوحة التحكم التنفيذية
   * (مش أول فتح حقيقي للصفحة) — راجع initExecutiveDashboard للتفاصيل.
   */
  function bindDashboard(isReRender) {
    // تحديث صامت في الخلفية عند فتح لوحة التحكم للتأكد من حداثة البيانات
    // APP._fromSilentRefresh يمنع اللوبة: silentRefresh → renderPage → bindDashboard → silentRefresh
    if (!APP._fromSilentRefresh && !isReRender) _silentRefresh();

    // [Executive Dashboard Upgrade] تهيئة الويدجتس اللي تحتاج بيانات إضافية
    if (typeof initExecutiveDashboard === "function")
      initExecutiveDashboard(isReRender);
    // ── إظهار حالة الباكاب في لوحة التحكم ──
    var backupBanner = document.getElementById("backup-status-banner");
    if (backupBanner && APP.data.last_backup) {
      var lastBk = new Date(APP.data.last_backup);
      var hoursAgo = Math.round((Date.now() - lastBk.getTime()) / 3600000);
      backupBanner.innerHTML =
        "<span style='font-size:12px;color:var(--text3)'> آخر باكاب: " +
        (hoursAgo < 24 ? "منذ " + hoursAgo + " ساعة" : fmtDate(lastBk)) +
        "</span>" +
        (canDo("createBackup")
          ? "<button onclick='openBackupPanel()' class='btn btn-ghost btn-xs' style='margin-right:8px'>إدارة الباكاب</button>"
          : "");
      backupBanner.style.display = "";
    }

    var btnRefreshDash = document.getElementById("btn-refresh-dashboard");
    if (btnRefreshDash) {
      btnRefreshDash.addEventListener("click", function () {
        reloadAfterMutationFull(null, null, {
          title: "جاري تحديث البيانات...",
          emoji: "",
          successMsg: " تم تحديث البيانات",
        });
      });
    }

    // ── زر التحديث العام (top-bar — موجود في كل الشاشات) ──────────
    var globalRefreshBtn = document.getElementById("global-refresh-btn");
    if (globalRefreshBtn && !globalRefreshBtn._bound) {
      globalRefreshBtn._bound = true; // guard ضد التربيط المزدوج عند كل renderPage
      globalRefreshBtn.addEventListener("click", function () {
        // أنيميشن دوران على الأيقونة
        var icon = document.getElementById("global-refresh-icon");
        if (icon) {
          icon.style.transition = "transform 0.6s ease";
          icon.style.transform = "rotate(360deg)";
          setTimeout(function () {
            icon.style.transition = "none";
            icon.style.transform = "rotate(0deg)";
          }, 650);
        }
        reloadAfterMutationFull(null, null, {
          title: "جاري تحديث البيانات...",
          emoji: "",
          successMsg: " تم تحديث البيانات",
        });
      });
    }
  }

  /**
   * توحيد اسم اللون: يشيل الهمزات والتشكيل ويعمل lowercase
   * لضمان مطابقة "أسود" == "اسود"
   */
  function _normalizeColor(name) {
    return String(name || "")
      .trim()
      .toLowerCase()
      .replace(/[\u0623\u0625\u0622]/g, "\u0627") // أ إ آ → ا
      .replace(/\u0629/g, "\u0647") // ة → ه
      .replace(/\u0649/g, "\u064A") // ى → ي
      .replace(/[\u064B-\u065F]/g, ""); // حذف التشكيل
  }

  // ─────────────────────────────────────────────────────────────
  // نظام تحليل الألوان الذكي (Client-Side)
  // ─────────────────────────────────────────────────────────────

  // كاش الألوان اللي اتحلت (يتحمّل من localStorage ومن server)
  var _colorHexCache = {};
  var _colorResolutionQueue = [];
  var _colorResolutionTimer = null;
  var _colorResolutionInProgress = false;

  /** تحميل الكاش من localStorage عند البداية */
  function _loadColorHexCache() {
    try {
      var stored = localStorage.getItem("_wahid_color_cache");
      if (stored) {
        var parsed = JSON.parse(stored);
        Object.assign(_colorHexCache, parsed);
        // ادمج في CSS_COLOR_MAP عشان colorNameToHex تشتغل فوراً
        if (typeof CSS_COLOR_MAP !== "undefined") {
          Object.assign(CSS_COLOR_MAP, parsed);
        }
      }
    } catch (e) {}
  }

  /**
   * مزامنة ألوان الشيت (APP.data.colors) مع CSS_COLOR_MAP والكاش
   * بتضمن إن كل لون محفوظ في الشيت يظهر بلونه الصح فوراً
   */
  function _syncColorsFromData() {
    if (!APP.data || !APP.data.colors || !APP.data.colors.length) return;
    APP.data.colors.forEach(function (c) {
      if (!c || !c.hex || !c.name) return;
      var hex = c.hex.trim();
      if (!/^#[0-9a-fA-F]{3,6}$/.test(hex)) return;
      var name = c.name.trim();
      if (typeof CSS_COLOR_MAP !== "undefined") {
        CSS_COLOR_MAP[name] = hex;
        CSS_COLOR_MAP[name.toLowerCase()] = hex;
        if (typeof _normalizeColor === "function") {
          CSS_COLOR_MAP[_normalizeColor(name)] = hex;
        }
      }
      if (typeof _saveColorToCache === "function") {
        _saveColorToCache(name, hex);
      }
    });
  }

  /** حفظ لون جديد في الكاش وفي CSS_COLOR_MAP */
  function _saveColorToCache(name, hex) {
    if (!name || !hex) return;
    var key = _normalizeColor(name);
    _colorHexCache[key] = hex;
    _colorHexCache[name.trim().toLowerCase()] = hex;
    // أضفه للـ CSS_COLOR_MAP عشان colorNameToHex تلاقيه فوراً
    if (typeof CSS_COLOR_MAP !== "undefined") {
      CSS_COLOR_MAP[name.trim()] = hex;
      CSS_COLOR_MAP[name.trim().toLowerCase()] = hex;
      CSS_COLOR_MAP[key] = hex;
    }
    try {
      localStorage.setItem(
        "_wahid_color_cache",
        JSON.stringify(_colorHexCache),
      );
    } catch (e) {}
  }

  /** ابحث عن لون في الكاش — رجّع null لو مش موجود */
  function _getColorFromCache(name) {
    if (!name) return null;
    var key = _normalizeColor(name);
    return (
      _colorHexCache[key] || _colorHexCache[name.trim().toLowerCase()] || null
    );
  }

  /** اضف لون للقائمة المنتظرة وابعتها للسيرفر دفعة واحدة */
  function _queueColorResolution(colorName) {
    if (!colorName || !colorName.trim()) return;
    var name = colorName.trim();
    // متحطش لو موجود في الكاش أو في الـ queue أو في CSS_COLOR_MAP
    if (_getColorFromCache(name)) return;
    if (
      typeof CSS_COLOR_MAP !== "undefined" &&
      (CSS_COLOR_MAP[name] || CSS_COLOR_MAP[name.toLowerCase()])
    )
      return;
    if (_colorResolutionQueue.indexOf(name) !== -1) return;

    _colorResolutionQueue.push(name);

    // debounce — بعد 800ms من آخر إضافة يبعت الكل دفعة
    if (_colorResolutionTimer) clearTimeout(_colorResolutionTimer);
    _colorResolutionTimer = setTimeout(_flushColorQueue, 800);
  }

  /** بعت القائمة للسيرفر دفعة واحدة */
  function _flushColorQueue() {
    if (_colorResolutionInProgress || !_colorResolutionQueue.length) return;
    _colorResolutionInProgress = true;

    var batch = _colorResolutionQueue.splice(0, 15); // max 15 لون في المرة
    _showColorResolvingToast(batch);

    _gsr("resolveColorsBatch", [batch], {
      onSuccess: function (r) {
        _colorResolutionInProgress = false;
        var result = r.data;
        var updated = false;
        if (result && typeof result === "object") {
          Object.keys(result).forEach(function (name) {
            var info = result[name];
            if (info && info.hex && /^#[0-9a-fA-F]{3,6}$/.test(info.hex)) {
              _saveColorToCache(name, info.hex);
              updated = true;
              console.info(
                " لون جديد: " +
                  name +
                  " → " +
                  info.hex +
                  " (" +
                  info.source +
                  ")",
              );
            }
          });
        }
        if (updated) _refreshColorDisplay();
        // لو في باقي في الـ queue
        if (_colorResolutionQueue.length) {
          _colorResolutionTimer = setTimeout(_flushColorQueue, 500);
        }
      },
      onError: function (r) {
        _colorResolutionInProgress = false;
        console.warn("Color resolution failed:", r.message);
        if (_colorResolutionQueue.length) {
          _colorResolutionTimer = setTimeout(_flushColorQueue, 3000);
        }
      },
    });
  }

  /** إعادة رسم الأجزاء اللي فيها ألوان بعد ما الـ hex اتحل */
  function _refreshColorDisplay() {
    // لو في صفحة المخزن الحالي — أعد بناء المحتوى
    var csContent = document.getElementById("cs-content");
    if (csContent && typeof _csApplyFilters === "function") {
      _csApplyFilters();
      return;
    }
    // لو في صفحة الأصناف — أعد رسم الـ swatches فقط
    // [COLUMN-ENGINE] كان بيدوّر على #items-table (الجدول القديم)،
    // دلوقتي الحاوية بقت #items-ce-container.
    var itemsTable = document.getElementById("items-ce-container");
    if (itemsTable && typeof renderPage === "function") {
      // [PERF-FIX-CLR] تحديث صامت بدون fade للوان في الخلفية
      APP._fromSilentRefresh = true;
      renderPage(APP.currentPage);
      APP._fromSilentRefresh = false;
    }
  }

  /** إشعار خفيف بيظهر إن في ألوان بتتحل — موحّد عبر طابور الإشعارات */
  function _showColorResolvingToast(batch) {
    if (!batch || !batch.length) return;
    var preview =
      batch.slice(0, 3).join("، ") + (batch.length > 3 ? "..." : "");
    NotificationEngine.info(" جاري تحليل " + batch.length + " لون: " + preview, {
      duration: 4000
    });
  }

  // ── تحميل الكاش فور فتح الصفحة ──────────────────────────────
  _loadColorHexCache();

  function getItemColors(itemId) {
    var item = (APP.data.items || []).find(function (i) {
      return String(i.id) === String(itemId);
    });
    if (!item || !item.colors_json) return [];
    try {
      var arr =
        typeof item.colors_json === "string"
          ? JSON.parse(item.colors_json)
          : item.colors_json;
      if (!Array.isArray(arr)) return [];
      return arr
        .filter(Boolean)
        .map(function (c) {
          if (typeof c === "object" && c !== null && c.name)
            return {
              name: String(c.name).trim(),
              code: String(c.code || "").trim(),
              hex: String(c.hex || "").trim(),
              image: String(c.image || "").trim(),
            };
          return { name: String(c).trim(), code: "", hex: "", image: "" };
        })
        .filter(function (c) {
          return c.name;
        });
    } catch (e) {
      return [];
    }
  }

  /**
   * يملأ <select id=elId> بألوان الصنف مع رصيد كل لون في المخزن المختار
   * @param {string} elId       - id الـ select
   * @param {string} itemId     - id الصنف
   * @param {string} warehouseId - id أو اسم المخزن (للرصيد) — اختياري
   * @param {string} [selected] - قيمة محددة مسبقاً
   */
  // ── Generic Custom Color Dropdown (CCD) ─────────────────────────────────────
  // يُستخدم في جميع شاشات اختيار اللون (وارد/صادر/تحويل/حركة)
  // ─────────────────────────────────────────────────────────────────────────────

  function _ccdHTML(uid, colors, selected, placeholder, disabledReason) {
    var listItems = "";
    if (!colors || !colors.length) {
      var msg =
        disabledReason === "noitem"
          ? "اختر الصنف أولاً"
          : disabledReason === "nocolor"
            ? "لا توجد ألوان لهذا الصنف"
            : "لا توجد ألوان";
      listItems = '<div class="os-cd-item os-cd-disabled"> ' + msg + "</div>";
    } else {
      colors.forEach(function (c) {
        var origName =
          c._origName || (typeof c === "object" ? c.name : String(c));
        var hex = colorNameToHex(origName) || "#e2e8f0";
        var code = typeof c === "object" && c.code ? c.code : "";
        // استخرج الرصيد من الاسم إن كان مضمناً مثل "أزرق (رصيد: 5)"
        var rawDisplayName = typeof c === "object" ? c.name : String(c);
        var qtyMatch = rawDisplayName.match(/\(رصيد:\s*(\d+)\)/);
        var displayName = qtyMatch
          ? rawDisplayName.replace(/\s*\(رصيد:\s*\d+\)/, "").trim()
          : rawDisplayName;
        var qtyVal = qtyMatch ? qtyMatch[1] : null;
        listItems +=
          '<div class="os-cd-item" data-value="' +
          esc(origName) +
          '">' +
          '<span class="os-cd-dot" style="background:' +
          esc(hex) +
          '"></span>' +
          (code ? '<span class="os-cd-code">(' + esc(code) + ")</span>" : "") +
          '<span class="os-cd-label">' +
          esc(displayName) +
          "</span>" +
          (qtyVal !== null
            ? '<span class="os-cd-qty">رصيد: ' + esc(qtyVal) + "</span>"
            : "") +
          "</div>";
      });
    }

    var isDisabled = !!disabledReason;
    var selHex = selected && !isDisabled ? colorNameToHex(selected) : null;
    var displayInner =
      selected && !isDisabled
        ? '<span style="width:14px;height:14px;border-radius:50%;background:' +
          esc(selHex || "#e2e8f0") +
          ';border:1.5px solid rgba(0,0,0,.13);flex-shrink:0;display:inline-block"></span>' +
          '<span style="color:var(--text)">' +
          esc(selected) +
          "</span>"
        : '<span style="color:var(--text3)">' +
          esc(placeholder || "— اختر اللون *") +
          "</span>";

    var triggerStyle = isDisabled
      ? "opacity:0.5;cursor:not-allowed;pointer-events:none"
      : "cursor:pointer";

    return (
      '<input type="hidden" id="' +
      uid +
      '" value="' +
      esc(selected || "") +
      '">' +
      '<div class="os-color-dropdown" id="' +
      uid +
      '-ccd">' +
      '<div class="os-cd-trigger input" id="' +
      uid +
      '-ccd-trigger" tabindex="' +
      (isDisabled ? -1 : 0) +
      '" style="' +
      triggerStyle +
      '">' +
      '<span id="' +
      uid +
      '-ccd-disp" style="flex:1;display:flex;align-items:center;gap:8px">' +
      displayInner +
      "</span>" +
      '<span style="color:var(--text3);font-size:11px;flex-shrink:0">▾</span>' +
      "</div>" +
      '<div class="os-cd-list" id="' +
      uid +
      '-ccd-list">' +
      listItems +
      "</div>" +
      "</div>"
    );
  }

  var _ccdCloseHandlers = {};

  function _initCCD(uid, onChange) {
    var trigger = document.getElementById(uid + "-ccd-trigger");
    var list = document.getElementById(uid + "-ccd-list");
    if (!trigger || !list) return;

    // فصل المستمعات القديمة بإستبدال العنصر بنسخة منه
    var newTrigger = trigger.cloneNode(true);
    trigger.parentNode.replaceChild(newTrigger, trigger);
    trigger = newTrigger;

    function positionList() {
      var rect = trigger.getBoundingClientRect();
      var minW = Math.max(rect.width, 200);
      // RTL: نحسب من اليمين — نثبّت الحافة اليمنى مع عرض كافي للمحتوى
      var rightEdge = window.innerWidth - rect.right;
      // لو القائمة هتخرج من الشاشة على اليسار → نضبط
      var availableLeft = rect.right - minW;
      if (availableLeft < 8) rightEdge = window.innerWidth - minW - 8;
      list.style.top = rect.bottom + 4 + "px";
      list.style.right = rightEdge + "px";
      list.style.left = "auto";
      list.style.width = "auto";
      list.style.minWidth = minW + "px";
      list.style.maxWidth = "320px";
    }

    trigger.addEventListener("click", function () {
      var isOpen = list.classList.toggle("os-cd-open");
      trigger.classList.toggle("os-cd-active", isOpen);
      if (isOpen) positionList();
    });

    list.addEventListener("mousedown", function (e) {
      var item = e.target.closest(".os-cd-item");
      if (!item || item.classList.contains("os-cd-disabled")) return;
      e.preventDefault();
      var val = item.dataset.value;
      _setCCDValue(uid, val);
      list.classList.remove("os-cd-open");
      trigger.classList.remove("os-cd-active");
      if (typeof onChange === "function") onChange(val);
    });

    // إغلاق عند النقر خارج القائمة
    if (_ccdCloseHandlers[uid]) {
      document.removeEventListener("click", _ccdCloseHandlers[uid]);
    }
    var _ccdScrollTicking = false;
    var _ccdScrollHandler = function () {
      if (!list.classList.contains("os-cd-open")) return;
      if (_ccdScrollTicking) return;
      _ccdScrollTicking = true;
      requestAnimationFrame(function () {
        positionList();
        _ccdScrollTicking = false;
      });
    };
    window.addEventListener("scroll", _ccdScrollHandler, {
      capture: true,
      passive: true,
    });
    window.addEventListener("resize", _ccdScrollHandler, { passive: true });
    _ccdCloseHandlers[uid] = function (e) {
      var ccd = document.getElementById(uid + "-ccd");
      if (!ccd) {
        document.removeEventListener("click", _ccdCloseHandlers[uid]);
        window.removeEventListener("scroll", _ccdScrollHandler, {
          capture: true,
          passive: true,
        });
        window.removeEventListener("resize", _ccdScrollHandler, {
          passive: true,
        });
        delete _ccdCloseHandlers[uid];
        return;
      }
      if (!ccd.contains(e.target) && !list.contains(e.target)) {
        list.classList.remove("os-cd-open");
        trigger.classList.remove("os-cd-active");
      }
    };
    document.addEventListener("click", _ccdCloseHandlers[uid]);
  }

  function _setCCDValue(uid, colorName) {
    var hidden = document.getElementById(uid);
    var disp = document.getElementById(uid + "-ccd-disp");
    var colorVal = colorName || "";
    if (hidden) hidden.value = colorVal;
    if (disp) {
      if (colorVal) {
        var hex = colorNameToHex(colorVal) || "#e2e8f0";
        disp.innerHTML =
          '<span style="width:14px;height:14px;border-radius:50%;background:' +
          esc(hex) +
          ';border:1.5px solid rgba(0,0,0,.13);flex-shrink:0;display:inline-block"></span>' +
          '<span style="color:var(--text)">' +
          esc(colorVal) +
          "</span>";
      } else {
        disp.innerHTML =
          '<span style="color:var(--text3)">— اختر اللون *</span>';
      }
    }
  }

  function _resetCCD(uid) {
    _setCCDValue(uid, "");
  }

  // ─────────────────────────────────────────────────────────────────────────────

  function _colorSelect(elId, itemId, warehouseId, selected) {
    // البحث عن الـ wrapper المخصص للـ CCD
    var outer = document.getElementById(elId + "-ccd-outer");
    if (!outer) {
      // Fallback: استبدل الـ <select> القديم إن وُجد
      var existing = document.getElementById(elId);
      if (!existing) return;
      outer = document.createElement("div");
      outer.id = elId + "-ccd-outer";
      existing.parentNode.insertBefore(outer, existing);
      existing.parentNode.removeChild(existing);
    }

    var colors = getItemColors(itemId);
    if (!colors.length) {
      outer.innerHTML = _ccdHTML(
        elId,
        [],
        null,
        "— لا توجد ألوان —",
        "nocolor",
      );
      return;
    }
    outer.setAttribute("data-color-required", "1");

    var whName = (function () {
      if (!warehouseId) return "";
      var wh = (APP.data.warehouses || []).find(function (w) {
        return w.id === warehouseId || w.name === warehouseId;
      });
      return wh ? wh.name : warehouseId;
    })();

    var colorsForDD = colors.map(function (c) {
      var name = typeof c === "object" && c !== null ? c.name : String(c);
      var qty = getColorQtyFiltered(itemId, name, whName);
      return {
        name: name + (whName ? " (رصيد: " + qty + ")" : ""),
        _origName: name,
        code: typeof c === "object" && c.code ? c.code : "",
      };
    });

    outer.innerHTML = _ccdHTML(
      elId,
      colorsForDD,
      selected,
      "— اختر اللون *",
      false,
    );
    _initCCD(elId, null);
    if (selected) _setCCDValue(elId, selected);
  }

  /**
   * يُعيد بناء dropdown الألوان ويُظهر/يُخفي الـ wrapper
   * @param {string} elId      - id الـ <select> للألوان
   * @param {string} itemSelId - id الـ <select> للصنف
   * @param {string} whSelId   - id الـ <select> للمخزن
   */
  function _rebuildColorSelect(elId, itemSelId, whSelId) {
    var itemId = (document.getElementById(itemSelId) || {}).value || "";
    var whId = (document.getElementById(whSelId) || {}).value || "";
    var wrapper = document.getElementById(elId + "-wrap");
    var colors = itemId ? getItemColors(itemId) : [];

    // إظهار/إخفاء الـ wrapper + badge مطلوب
    if (wrapper) {
      var alwaysVisible =
        wrapper.style.display !== "none" && !wrapper.dataset.autoHide;
      if (!alwaysVisible) {
        wrapper.style.display = itemId ? "" : "none";
      }
      var lbl = wrapper.querySelector("label");
      if (lbl) {
        var oldBadge = lbl.querySelector(".color-req-badge");
        if (oldBadge) oldBadge.remove();
        if (itemId && colors.length) {
          var badge = document.createElement("span");
          badge.className = "color-req-badge";
          badge.style.cssText =
            "margin-right:6px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;vertical-align:middle";
          badge.textContent = "مطلوب";
          lbl.appendChild(badge);
        }
      }
    }

    // البحث عن الـ CCD outer wrapper أو استبدال <select> قديم
    var outer = document.getElementById(elId + "-ccd-outer");
    if (!outer) {
      var sel = document.getElementById(elId);
      if (sel && sel.tagName === "SELECT") {
        outer = document.createElement("div");
        outer.id = elId + "-ccd-outer";
        sel.parentNode.insertBefore(outer, sel);
        sel.parentNode.removeChild(sel);
      }
    }
    if (!outer) return;

    if (!itemId) {
      outer.innerHTML = _ccdHTML(
        elId,
        [],
        null,
        "— اختر الصنف أولاً —",
        "noitem",
      );
    } else if (!colors.length) {
      outer.innerHTML = _ccdHTML(
        elId,
        [],
        null,
        "— لا توجد ألوان لهذا الصنف —",
        "nocolor",
      );
    } else {
      _colorSelect(elId, itemId, whId, "");
    }
  }

  // ══════════════════════════════════════════════════════════════
  //  ITEM CUSTOM DROPDOWN — مشابه للـ CCD لكن للأصناف مع بحث
  //  _buildItemDropdownWidget(uid, items, placeholder, onChange)
  //  items: [{ id, name, code }]
  //  يبني الـ widget داخل div#uid-idd-outer إن وُجد
  // ══════════════════════════════════════════════════════════════
  var _iddCloseHandlers = {};

  function _buildItemDropdownWidget(uid, items, placeholder, onChange) {
    var outer = document.getElementById(uid + "-idd-outer");
    if (!outer) return;

    placeholder = placeholder || "— اختر الصنف —";

    // بناء الـ HTML
    var optHTML = "";
    if (!items || !items.length) {
      optHTML =
        '<div class="os-id-no-results"> لا توجد أصناف مرتبطة بهذا المخزن</div>';
    } else {
      items.forEach(function (i) {
        optHTML +=
          '<div class="os-id-opt" data-id="' +
          esc(i.id) +
          '" data-name="' +
          esc(i.name) +
          '" data-code="' +
          esc(i.code || "") +
          '">' +
          '<span class="os-id-opt-name">' +
          esc(i.name) +
          "</span>" +
          (i.code
            ? '<span class="os-id-opt-code">' + esc(i.code) + "</span>"
            : "") +
          "</div>";
      });
    }

    outer.innerHTML =
      '<input type="hidden" id="' +
      uid +
      '" value="">' +
      '<div class="os-item-dropdown" id="' +
      uid +
      '-idd">' +
      '<div class="os-id-trigger" id="' +
      uid +
      '-idd-trigger" tabindex="0">' +
      '<span class="os-id-arrow">▼</span>' +
      '<span class="os-id-placeholder" id="' +
      uid +
      '-idd-disp">' +
      esc(placeholder) +
      "</span>" +
      "</div>" +
      '<div class="os-id-panel" id="' +
      uid +
      '-idd-panel">' +
      '<div class="os-id-search-bar">' +
      '<input type="text" id="' +
      uid +
      '-idd-search" placeholder=" ابحث بالاسم أو الكود..." autocomplete="off">' +
      "</div>" +
      '<div id="' +
      uid +
      '-idd-list">' +
      optHTML +
      "</div>" +
      "</div>" +
      "</div>";

    _initItemDropdownWidget(uid, onChange);
  }

  function _initItemDropdownWidget(uid, onChange) {
    var trigger = document.getElementById(uid + "-idd-trigger");
    var panel = document.getElementById(uid + "-idd-panel");
    var list = document.getElementById(uid + "-idd-list");
    var search = document.getElementById(uid + "-idd-search");
    var hidden = document.getElementById(uid);
    var disp = document.getElementById(uid + "-idd-disp");
    if (!trigger || !panel) return;

    // استبدل العنصر لفصل المستمعات القديمة
    var newTrigger = trigger.cloneNode(true);
    trigger.parentNode.replaceChild(newTrigger, trigger);
    trigger = newTrigger;
    disp = document.getElementById(uid + "-idd-disp");

    function openPanel() {
      // منع الفتح لو المخزن لم يُختار بعد
      var whEl =
        document.getElementById("disp-wh") || document.getElementById("fr-wh");
      if (whEl && !whEl.value) {
        // أظهر رسالة تنبيه خفيفة على الـ trigger
        trigger.style.borderColor = "var(--danger)";
        trigger.style.boxShadow =
          "0 0 0 3px color-mix(in srgb, var(--danger) 15%, transparent)";
        setTimeout(function () {
          trigger.style.borderColor = "";
          trigger.style.boxShadow = "";
        }, 1200);
        if (typeof showToast === "function")
          NotificationEngine.warning("اختر المخزن أولاً");
        return;
      }
      // حساب موضع الـ trigger لتحديد مكان الـ panel كـ fixed
      var rect = trigger.getBoundingClientRect();
      panel.style.top = rect.bottom + "px";
      panel.style.left = rect.left + "px";
      panel.style.right = "auto";
      panel.style.width = rect.width + "px";
      panel.classList.add("os-id-open");
      trigger.classList.add("os-id-active");
      var s = document.getElementById(uid + "-idd-search");
      if (s) {
        s.value = "";
        filterOpts("");
        setTimeout(function () {
          s.focus();
        }, 50);
      }
    }
    function closePanel() {
      panel.classList.remove("os-id-open");
      trigger.classList.remove("os-id-active");
    }

    trigger.addEventListener("click", function () {
      panel.classList.contains("os-id-open") ? closePanel() : openPanel();
    });
    trigger.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openPanel();
      }
    });

    function filterOpts(q) {
      var opts = list ? list.querySelectorAll(".os-id-opt") : [];
      var lower = q.toLowerCase();
      var anyVisible = false;
      opts.forEach(function (o) {
        var name = (o.dataset.name || "").toLowerCase();
        var code = (o.dataset.code || "").toLowerCase();
        var show =
          !q || name.indexOf(lower) !== -1 || code.indexOf(lower) !== -1;
        o.style.display = show ? "" : "none";
        if (show) anyVisible = true;
      });
      var noRes = list ? list.querySelector(".os-id-no-results") : null;
      if (!noRes && list && !anyVisible && q) {
        noRes = document.createElement("div");
        noRes.className = "os-id-no-results _dyn-no-res";
        noRes.textContent = "لا نتائج";
        list.appendChild(noRes);
      } else if (noRes && noRes.classList.contains("_dyn-no-res")) {
        noRes.style.display = anyVisible || !q ? "none" : "";
      }
    }

    var searchEl = document.getElementById(uid + "-idd-search");
    if (searchEl) {
      searchEl.addEventListener("input", function () {
        filterOpts(this.value);
      });
      searchEl.addEventListener("click", function (e) {
        e.stopPropagation();
      });
    }

    if (list) {
      list.addEventListener("mousedown", function (e) {
        var opt = e.target.closest(".os-id-opt");
        if (!opt) return;
        e.preventDefault();
        var id = opt.dataset.id;
        var name = opt.dataset.name;
        var code = opt.dataset.code;
        if (hidden) hidden.value = id;
        if (disp) {
          disp.className = "os-id-selected-wrap";
          disp.innerHTML =
            '<span class="os-id-sel-name">' +
            esc(name) +
            "</span>" +
            (code
              ? '<span class="os-id-sel-code">' + esc(code) + "</span>"
              : "");
        }
        list.querySelectorAll(".os-id-opt").forEach(function (o) {
          o.classList.toggle("os-id-selected", o.dataset.id === id);
        });
        closePanel();
        if (typeof onChange === "function") onChange(id);
      });
    }

    // إغلاق عند الضغط خارج
    if (_iddCloseHandlers[uid]) {
      document.removeEventListener("click", _iddCloseHandlers[uid]);
    }
    // إعادة حساب الموضع عند التمرير أو تغيير حجم النافذة — مع rAF throttle لمنع layout thrashing
    var _iddScrollTicking = false;
    var _iddScrollHandler = function () {
      if (!panel.classList.contains("os-id-open")) return;
      if (_iddScrollTicking) return;
      _iddScrollTicking = true;
      requestAnimationFrame(function () {
        var r = trigger.getBoundingClientRect();
        panel.style.top = r.bottom + "px";
        panel.style.left = r.left + "px";
        panel.style.right = "auto";
        panel.style.width = r.width + "px";
        _iddScrollTicking = false;
      });
    };
    window.addEventListener("scroll", _iddScrollHandler, {
      capture: true,
      passive: true,
    });
    window.addEventListener("resize", _iddScrollHandler, { passive: true });
    _iddCloseHandlers[uid] = function (e) {
      var idd = document.getElementById(uid + "-idd");
      if (!idd) {
        document.removeEventListener("click", _iddCloseHandlers[uid]);
        window.removeEventListener("scroll", _iddScrollHandler, {
          capture: true,
          passive: true,
        });
        window.removeEventListener("resize", _iddScrollHandler, {
          passive: true,
        });
        delete _iddCloseHandlers[uid];
        return;
      }
      if (!idd.contains(e.target) && !panel.contains(e.target)) {
        closePanel();
      }
    };
    document.addEventListener("click", _iddCloseHandlers[uid]);
  }

    var hidden = document.getElementById(uid);

  // ═══════════════════════════════════════════════════════════════
  // §INV-DASH  لوحة تحكم المخزون
  // ═══════════════════════════════════════════════════════════════
  function bindInventoryDashboard() {
    ensureExtendedData(function () {
      var items = APP.data.items || [];
      var warehouses = APP.data.warehouses || [];
      var groups = APP.data.groups || [];
      var stock = APP.data.currentStock || [];

      // KPI cards
      var _set = function (id, val) {
        var el = document.getElementById(id);
        if (el) el.textContent = val;
      };
      _set("invd-stat-items", items.length);
      _set("invd-stat-warehouses", warehouses.length);
      _set("invd-stat-groups", groups.length);

      // Low stock (qty <= min_qty)
      var lowCount = items.filter(function (i) {
        var qty = parseFloat(i.current_qty || i.qty || 0);
        var min = parseFloat(i.min_qty || 0);
        return min > 0 && qty <= min;
      }).length;
      _set("invd-stat-lowstock", lowCount);

      // Dormant: items with no transactions in last 30 days — approximate using zero qty
      var dormantCount = items.filter(function (i) {
        return parseFloat(i.current_qty || i.qty || 0) === 0;
      }).length;
      _set("invd-stat-dormant", dormantCount);

      // Estimated stock value
      var totalValue = items.reduce(function (sum, i) {
        return (
          sum +
          parseFloat(i.current_qty || i.qty || 0) *
            parseFloat(i.cost_price || i.unit_price || 0)
        );
      }, 0);
      _set(
        "invd-stat-value",
        formatMoney(totalValue, { decimals: 0, withSymbol: false }),
      );

      // Top items by qty
      var topItems = items
        .slice()
        .sort(function (a, b) {
          return (
            parseFloat(b.current_qty || b.qty || 0) -
            parseFloat(a.current_qty || a.qty || 0)
          );
        })
        .slice(0, 8);

      var tbody = document.getElementById("invd-top-items");
      if (tbody) {
        if (!topItems.length) {
          tbody.innerHTML =
            '<tr><td colspan="4" style="text-align:center;padding:16px;color:var(--text3)">لا توجد أصناف</td></tr>';
        } else {
          tbody.innerHTML = topItems
            .map(function (i) {
              var qty = parseFloat(i.current_qty || i.qty || 0);
              return (
                "<tr><td>" +
                esc(i.name || i.item_name || "") +
                "</td><td>" +
                esc(i.group_name || i.group || "") +
                "</td><td style='text-align:center;font-weight:700;color:var(--primary)'>" +
                qty.toLocaleString() +
                "</td><td>" +
                esc(i.unit || "") +
                "</td></tr>"
              );
            })
            .join("");
        }
      }
    });
  }

  // يضيف حقول محسوبة (إجمالي المخزون/توزيع المخازن) غير موجودة خامًا في
  // الـ item نفسه — نفس فكرة _catPrepareRowsForCE في ملف الكتالوج.
  function _itemsPrepareRowsForCE(items) {
    return items.map(function (it) {
      var whRows =
        typeof getCatalogItemStockByWarehouse === "function"
          ? getCatalogItemStockByWarehouse(it.id)
          : [];
      var stockQty = whRows.reduce(function (s, r) {
        return s + Number(r.qty || 0);
      }, 0);
      return Object.assign({}, it, {
        stock_qty: stockQty,
        warehouses_text: whRows
          .map(function (r) {
            return r.name + ":" + r.qty;
          })
          .join(" | "),
      });
    });
  }
