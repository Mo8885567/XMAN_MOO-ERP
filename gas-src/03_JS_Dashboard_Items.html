      ".qe-cell{cursor:pointer;border-radius:6px;padding:2px 0;transition:background .15s}",
      ".qe-cell:hover{background:var(--surface2)}",
      ".qe-input{outline:none;-moz-appearance:textfield}",
      ".qe-input::-webkit-outer-spin-button,.qe-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}",
    ].join("");
    document.head.appendChild(s);
  }

  // ============================================================
  // [QUICK-EDIT] تعديل سريع Inline لأعمدة (الحد الأدنى / سعر
  // التكلفة / سعر البيع) مباشرة جوه جدول الأصناف — من غير فتح شاشة
  // التعديل الكاملة. الضغط على الخانة يحوّلها لحقل رقمي، Enter أو
  // الخروج من الحقل (blur) يحفظ عبر saveItemWithColorSync (نفس مسار
  // الحفظ المستخدم في نافذة التعديل الكاملة)، وEscape يلغي التعديل.
  // ============================================================
  var _qeFieldsMeta = {
    min_qty: { type: "int", min: 0, step: 1 },
    cost_price: { type: "float", min: 0, step: 0.01 },
    selling_price: { type: "float", min: 0, step: 0.01 },
  };

  function _qeBind() {
    var container = document.getElementById("items-ce-container");
    if (!container || container._qeWired) return;
    container._qeWired = true;

    container.addEventListener("click", function (e) {
      var cell = e.target.closest(".qe-cell");
      if (!cell || !container.contains(cell)) return;
      if (cell.querySelector("input.qe-input")) return; // تعديل شغال بالفعل
      e.stopPropagation();
      _qeStartEdit(cell);
    });
  }

  function _qeStartEdit(cell) {
    var field = cell.getAttribute("data-qe-field");
    var meta = _qeFieldsMeta[field];
    if (!meta) return;
    var rowEl = cell.closest(".ce-body-row");
    var itemId = rowEl ? rowEl.getAttribute("data-id") : null;
    if (!itemId) return;

    // لو الأسعار مخفية عن المستخدم الحالي (data-hide-prices) امنع
    // التعديل السريع لحقلي التكلفة/البيع عشان الرقم الحالي مش ظاهر أصلاً
    if (
      field !== "min_qty" &&
      document.documentElement.hasAttribute("data-hide-prices")
    ) {
      NotificationEngine.error("مفيش صلاحية لتعديل الأسعار");
      return;
    }

    var rawVal = cell.getAttribute("data-qe-raw") || "0";
    var originalHtml = cell.innerHTML;

    var input = document.createElement("input");
    input.type = "number";
    input.className = "qe-input";
    input.value = rawVal;
    input.step = meta.step;
    if (meta.min !== undefined) input.min = meta.min;
    input.style.cssText =
      "width:100%;text-align:center;font-family:var(--font-mono);" +
      "font-weight:700;border:1.5px solid var(--accent);border-radius:6px;" +
      "padding:3px 4px;background:var(--surface);color:var(--text)";

    cell.innerHTML = "";
    cell.appendChild(input);
    input.focus();
    input.select();

    var finished = false;
    function commit() {
      if (finished) return;
      finished = true;
      var newVal =
        meta.type === "int"
          ? parseInt(input.value, 10)
          : parseFloat(input.value);
      if (isNaN(newVal) || newVal < 0) {
        NotificationEngine.error("قيمة غير صحيحة");
        cell.innerHTML = originalHtml;
        return;
      }
      if (String(newVal) === String(Number(rawVal))) {
        cell.innerHTML = originalHtml; // مفيش تغيير فعلي
        return;
      }
      _qeSave(itemId, field, newVal, cell, originalHtml);
    }
    function cancel() {
      if (finished) return;
      finished = true;
      cell.innerHTML = originalHtml;
    }

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        commit();
      } else if (e.key === "Escape") {
        e.preventDefault();
        cancel();
      }
    });
    input.addEventListener("blur", function () {
      setTimeout(commit, 0); // تأخير بسيط تفاديًا لازدواج commit مع Enter
    });
  }

  function _qeFormatCell(field, v) {
    if (field === "min_qty") {
      var n = Number(v || 0);
      return (
        '<span style="display:block;text-align:center;font-family:var(--font-mono);font-weight:700;color:' +
        (n > 0 ? "#2563eb" : "#94a3b8") +
        '">' +
        n +
        "</span>"
      );
    }
    return (
      '<span class="sensitive-price" style="display:block;text-align:center;font-family:var(--font-mono);color:' +
      (field === "selling_price" ? "var(--accent)" : "inherit") +
      '">' +
      formatMoney(v || 0, { decimals: 0 }) +
      "</span>"
    );
  }

  function _qeSave(itemId, field, newVal, cell, originalHtml) {
    var item = (APP.data.items || []).find(function (i) {
      return String(i.id) === String(itemId);
    });
    if (!item) {
      NotificationEngine.error("لم يتم إيجاد الصنف");
      cell.innerHTML = originalHtml;
      return;
    }

    cell.innerHTML =
      '<span style="display:block;text-align:center;opacity:.6">⏳</span>';

    // نبعت الصنف كامل (مع الحقل المعدَّل) لنفس دالة الحفظ المستخدمة في
    // نافذة التعديل الكاملة — لأن updateItem في الباك إند بيعيد كتابة
    // الصف كله، فمينفعش نبعت الحقل المعدَّل بمفرده.
    var data = {
      id: item.id,
      code: item.code || "",
      name: item.name || "",
      description: item.description || "",
      unit: item.unit || "",
      min_qty: item.min_qty || 0,
      cost_price: item.cost_price || 0,
      selling_price: item.selling_price || 0,
      group: item.group || "",
      image_url: item.image_url || "",
      colors: getItemColors(item.id),
      user: APP.currentUser ? APP.currentUser.username : "SYSTEM",
      sessionToken: SESSION ? SESSION.token : null, // FIX: نفس مشكلة نافذة التعديل الكاملة — بدونه الحفظ السريع يرفض دايمًا
      _isEdit: true,
    };
    data[field] = newVal;

    NotificationEngine.loading("جاري حفظ التعديل...");
    _gsr("saveItemWithColorSync", [data], {
      onSuccess: function (r) {
        // ── تحديث محلي فوري (Optimistic) من غير إعادة رسم الجدول كله ──
        item[field] = newVal;
        if (_cache && _cache.data && Array.isArray(_cache.data.items)) {
          var cached = _cache.data.items.find(function (i) {
            return String(i.id) === String(itemId);
          });
          if (cached) cached[field] = newVal;
        }
        cell.setAttribute("data-qe-raw", String(newVal));
        cell.innerHTML = _qeFormatCell(field, newVal);
        finishLoadingToast(" تم الحفظ", "success");
      },
      onError: function (r) {
        finishLoadingToast(r.message || "حدث خطأ", "error");
        cell.innerHTML = originalHtml;
      },
    });
  }

  function _renderItemsTableCE(container, items) {
    if (!container) return;
    _itemsInjectThumbStyles();
    _qeInjectStyles();
    _itemsRegisterColumns();
    ColumnEngine.renderTable(
      "items",
      container,
      _itemsPrepareRowsForCE(items),
      {
        // [ROW-CLICK-DISABLED] الضغط على الصف بالكامل ما بيفتحش شاشة تعديل
        // الصنف بعد كده. التعديل يبقى فقط عبر قائمة الزر اليمين (CTX)، أو
        // خانات التعديل السريع (qe-cell) للحقول المحددة. راجع أيضاً
        // _wireRowClicks في 34_JS_ColumnEngine.html، اللي بيعطّل onRowClick
        // على مستوى المحرك كله — الحذف هنا احتياط إضافي حتى لو اتغيّر
        // سلوك المحرك مستقبلاً.
      },
    );
  }

  function bindItems() {
    var btn = document.getElementById("btn-add-item");
    if (btn)
      btn.addEventListener("click", function () {
        openItemModal(null);
      });

    var btnImport = document.getElementById("btn-import-excel");
    if (btnImport) btnImport.addEventListener("click", openExcelImportModal);

    var btnRefreshItems = document.getElementById("btn-refresh-items");
    if (btnRefreshItems) {
      btnRefreshItems.addEventListener("click", function () {
        reloadAfterMutationFull(null, null, {
          title: "جاري تحديث الأصناف...",
          emoji: "",
          successMsg: " تم تحديث الأصناف",
        });
      });
    }

    // الإجراءات عبر CTX right-click (تسجيل تلقائي عبر contextMenuType
    // في ColumnEngine.register أعلى الملف — لا حاجة لربط يدوي هنا)

    // ── عرض الجدول عبر ColumnEngine (أول تحميل — بدون فلاتر) ──
    // [PERF-PROGRESSIVE-LOAD-2026-08] بدل ما نجهّز كل الأصناف مرة واحدة
    // (كل صنف بياخد lookup لرصيده في كل المخازن — تقيل على آلاف الأصناف
    // ويجمّد الشاشة قبل أول ظهور)، بنعرض أول 20 صنف فوراً، وبعدين نجهّز
    // الباقي على دفعات في الخلفية (runChunked) ونضيفهم للجدول تباعاً عن
    // طريق ColumnEngine.appendRows بدون ما نعيد بناء الجدول من الصفر.
    var _allItemsForFirstPaint = APP.data.items || [];
    var _firstChunkSize = 20;
    _renderItemsTableCE(
      document.getElementById("items-ce-container"),
      _allItemsForFirstPaint.slice(0, _firstChunkSize),
    );
    if (_allItemsForFirstPaint.length > _firstChunkSize) {
      runChunked(
        _allItemsForFirstPaint.slice(_firstChunkSize),
        200,
        function (chunkRaw) {
          return _itemsPrepareRowsForCE(chunkRaw);
        },
        function (preparedChunk) {
          ColumnEngine.appendRows("items", preparedChunk);
        },
      );
    }
    _qeBind(); // ربط التعديل السريع Inline (مرة واحدة فقط بفضل _qeWired)

    // زر الفلتر المتقدم
    var advToggle = document.getElementById("item-adv-toggle");
    if (advToggle) {
      advToggle.addEventListener("click", function () {
        var panel = document.getElementById("item-adv-panel");
        var open = panel.style.display === "block";
        panel.style.display = open ? "none" : "block";
        advToggle.textContent = open ? " فلتر متقدم" : " إغلاق المتقدم";
      });
    }

    // زر مسح الفلاتر
    var clearBtn = document.getElementById("item-clear-filters");
    if (clearBtn) {
      clearBtn.addEventListener("click", function () {
        [
          "item-search",
          "item-filter-wh",
          "item-filter-unit",
          "item-cost-min",
          "item-cost-max",
          "item-sell-min",
          "item-sell-max",
          "item-color-q",
          "item-sort",
        ].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.value = "";
        });
        _applyItemFilters();
      });
    }

    // ربط كل عناصر الفلترة
    [
      "item-search",
      "item-filter-wh",
      "item-filter-unit",
      "item-cost-min",
      "item-cost-max",
      "item-sell-min",
      "item-sell-max",
      "item-color-q",
      "item-sort",
    ].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", _applyItemFilters);
      if (el.tagName === "SELECT")
        el.addEventListener("change", _applyItemFilters);
    });

    if (window.SplitSelect) {
      SplitSelect.init("item-filter-wh", {
        label: "المخزن",
        icon: "ti-building-warehouse",
        searchable: true,
      });
    }

    // [FIX-SelectionEngine] باقي فلاتر شاشة الأصناف كانت لسه select خام
    if (window.AppSelect) {
      AppSelect.upgrade("item-filter-unit", {
        icon: "ti-ruler-2",
        placeholder: "كل الوحدات",
      });
      AppSelect.upgrade("item-sort", {
        icon: "ti-arrows-sort",
        placeholder: "↕ ترتيب",
      });
    }
  }

  function _applyItemFilters() {
    var q = (document.getElementById("item-search").value || "")
      .toLowerCase()
      .trim();
    var whId = document.getElementById("item-filter-wh").value || "";
    var unit = document.getElementById("item-filter-unit").value || "";
    var costMin = document.getElementById("item-cost-min").value;
    var costMax = document.getElementById("item-cost-max").value;
    var sellMin = document.getElementById("item-sell-min").value;
    var sellMax = document.getElementById("item-sell-max").value;
    var colorQ = (document.getElementById("item-color-q").value || "")
      .toLowerCase()
      .trim();
    var sortBy = document.getElementById("item-sort").value || "";

    // الفلترة بالمخزن: نجيب ids المجموعات المرتبطة بالمخزن
    var whGroupIds = [];
    if (whId) {
      var wh = (APP.data.warehouses || []).find(function (w) {
        return w.id === whId;
      });
      if (wh) {
        whGroupIds = (APP.data.groups || [])
          .filter(function (g) {
            return g.warehouse_id === wh.id || g.warehouse_id === wh.name;
          })
          .map(function (g) {
            return String(g.id);
          });
      }
    }

    var anyActive = !!(
      q ||
      whId ||
      unit ||
      costMin ||
      costMax ||
      sellMin ||
      sellMax ||
      colorQ
    );

    // [COLUMN-ENGINE] الفلترة بقت على مصفوفة APP.data.items مباشرة (بدل
    // إخفاء/إظهار <tr> يدويًا) — الناتج يتمرر لـ ColumnEngine.renderTable.
    var filtered = (APP.data.items || []).filter(function (item) {
      var name = (item.name || "").toLowerCase();
      var idStr = String(item.id || "").toLowerCase();
      var codeStr = String(item.code || "").toLowerCase();
      var grp = item.group || "";
      var u = item.unit || "";
      var cost = Number(item.cost_price || 0);
      var sell = Number(item.selling_price || 0);

      if (q && !name.includes(q) && !idStr.includes(q) && !codeStr.includes(q))
        return false;
      if (whId && whGroupIds.length && !whGroupIds.includes(String(grp)))
        return false;
      if (whId && !whGroupIds.length) return false;
      if (unit && u !== unit) return false;
      if (costMin && cost < parseFloat(costMin)) return false;
      if (costMax && cost > parseFloat(costMax)) return false;
      if (sellMin && sell < parseFloat(sellMin)) return false;
      if (sellMax && sell > parseFloat(sellMax)) return false;
      if (colorQ) {
        // نفس فكرة الفلتر القديم (بحث في نص الصف كله) لكن مبني على
        // البيانات الخام بدل نص الـ DOM: اسم/وصف/مجموعة/وحدة/ألوان.
        var haystack = (
          name +
          " " +
          (item.description || "") +
          " " +
          (getGroupName(grp) || "") +
          " " +
          u +
          " " +
          getItemColors(item.id)
            .map(function (c) {
              return typeof c === "object" && c !== null ? c.name : c;
            })
            .join(" ")
        ).toLowerCase();
        if (!haystack.includes(colorQ)) return false;
      }
      return true;
    });

    // الترتيب
    filtered = filtered.slice();
    if (sortBy) {
      filtered.sort(function (a, b) {
        if (sortBy === "name_asc")
          return (a.name || "").localeCompare(b.name || "", "ar");
        if (sortBy === "name_desc")
          return (b.name || "").localeCompare(a.name || "", "ar");
        if (sortBy === "id_asc")
          return String(a.id || "").localeCompare(
            String(b.id || ""),
            undefined,
            {
              numeric: true,
            },
          );
        if (sortBy === "id_desc")
          return String(b.id || "").localeCompare(
            String(a.id || ""),
            undefined,
            {
              numeric: true,
            },
          );
        if (sortBy === "group_asc")
          return (getGroupName(a.group || "") || "").localeCompare(
            getGroupName(b.group || "") || "",
            "ar",
          );
        if (sortBy === "group_desc")
          return (getGroupName(b.group || "") || "").localeCompare(
            getGroupName(a.group || "") || "",
            "ar",
          );
        return 0;
      });
    } else {
      // نفس الترتيب الافتراضي القديم لـ renderItems (حسب اسم المجموعة)
      filtered.sort(function (a, b) {
        var ga = getGroupName(a.group || "") || "";
        var gb = getGroupName(b.group || "") || "";
        if (ga < gb) return -1;
        if (ga > gb) return 1;
        return 0;
      });
    }

    _renderItemsTableCE(
      document.getElementById("items-ce-container"),
      filtered,
    );

    // تحديث العداد
    var countEl = document.getElementById("item-count");
    if (countEl) countEl.textContent = filtered.length + " صنف";

    var clearBtn = document.getElementById("item-clear-filters");
    if (clearBtn) clearBtn.style.display = anyActive ? "inline-block" : "none";
  }

  // [ITEM-WAREHOUSES-LINK] وحدة عرض/تحكم مستقلة لقائمة checkboxes المخازن
  // المتعددة الخاصة بشاشة الصنف — لا تلمس أي منطق حفظ آخر، وتُقرأ فقط عبر
  // getSelectedIds() وقت الحفظ (نفس فلسفة _colorSelect/SplitSelect: عنصر
  // واجهة صغير له حالة داخلية بسيطة).
  var ItemWarehousesPicker = (function () {
    var _containerId = null;
    var _onChange = null;
    var _instance = null; // instance AppSelect الحالية (multiple)
    var _pendingWarehouses = []; // بيانات المخازن الخام (id/name) قبل الربط
    var _pendingSelectedIds = []; // الاختيار الابتدائي قبل الربط

    // [ITEM-WAREHOUSE-MULTI-2026-08-04] بدل الـ checkboxes الحرة القديمة،
    // بقينا بنستخدم AppSelect الموحّد (49_JS_SelectionEngine.html) في وضع
    // multiple: نفس شكل "select واحد بيفتح panel فيه checkboxes" المطلوب
    // (متسق مع باقي النظام بدل عنصر واجهة خاص بشاشة الصنف بس). buildHtml
    // بترجع container فاضي بس (mount point) — الـ AppSelect نفسه لازم
    // يتبني بـ JS (Instance) مش نص HTML خام، فالبناء الفعلي بيحصل في
    // attach() بعد ما الـ container يتلحق بالـ DOM فعليًا.
    function _buildHtml(warehouses, selectedIds) {
      _pendingWarehouses = warehouses || [];
      _pendingSelectedIds = (selectedIds || []).map(String);
      return '<div class="iwh-as-mount"></div>';
    }

    // بناء/إعادة بناء instance الـ AppSelect جوه الـ container. بيتنفذ
    // كل مرة يتفتح فيها المودال (زي القديم بالظبط) — بنقفل أي instance
    // سابقة الأول عشان منسيبش panel معلق في body.
    function _wire(containerId, onChange) {
      _containerId = containerId;
      _onChange = onChange || null;
      var container = document.getElementById(containerId);
      if (!container) return;
      var mount = container.querySelector(".iwh-as-mount");
      if (!mount) return;
      if (_instance) {
        try {
          _instance.destroy();
        } catch (e) {}
        _instance = null;
      }
      if (!window.AppSelect) return; // أمان: لو المحرك مش محمّل لأي سبب

      _instance = AppSelect.create(mount, {
        data: _pendingWarehouses,
        valueField: "id",
        textField: "name",
        multiple: true,
        icon: "ti-building-warehouse",
        placeholder: "اختر المخزن (يمكن أكثر من مخزن)",
        value: _pendingSelectedIds,
        onChange: function (value) {
          if (_onChange) _onChange((value || []).slice());
        },
      });
    }

    return {
      // بناء mount point بس (بدون لمس DOM) — يُستخدم وقت بناء نص الفورم.
      buildHtml: _buildHtml,
      // مسار توافق قديم: لو حد نادى init() على container فاضي فعلاً
      // (مش مبني بـ buildHtml مسبقًا) — يبني الـ mount ويربط AppSelect
      // في نفس الوقت.
      init: function (containerId, warehouses, selectedIds, onChange) {
        var container = document.getElementById(containerId);
        if (container) container.innerHTML = _buildHtml(warehouses, selectedIds);
        _wire(containerId, onChange);
      },
      // المسار الجديد: الـ mount اتبنى مسبقًا (buildHtml) وبقى موجود في
      // الـ DOM فعليًا وقت ما الفورم اتحط — هنا بنبني instance الـ
      // AppSelect فعليًا (لازم DOM حقيقي، عكس checkboxes النص القديمة).
      attach: function (containerId, onChange) {
        _wire(containerId, onChange);
      },
      // يُستدعى بعد تحميل الروابط الفعلية من السيرفر (شاشة التعديل)
      setSelectedIds: function (selectedIds) {
        var ids = (selectedIds || []).map(String);
        _pendingSelectedIds = ids;
        if (_instance) _instance.setValue(ids);
      },
      // القيمة الفعلية المُرسلة للسيرفر وقت الحفظ — أبداً لا تحتوي "كل
      // المخازن" كنص، فقط ids المخازن الفعلية المحددة.
      getSelectedIds: function () {
        if (_instance) return (_instance.getValue() || []).slice();
        return _pendingSelectedIds.slice();
      },
    };
  })();
  window.ItemWarehousesPicker = ItemWarehousesPicker;

  function editItem(id) {
    // String() لتفادي مشكلة مقارنة رقم بنص (مثلاً 123 !== "123")
    var item = APP.data.items.find(function (i) {
      return String(i.id) === String(id);
    });
    if (item) openItemModal(item);
    else NotificationEngine.error("لم يتم إيجاد الصنف");
  }

  function deleteItemConfirm(id) {
    showConfirm({
      icon: "ti-package",
      iconColor: "#9333ea",
      title: "حذف الصنف",
      message: "هل أنت متأكد من حذف هذا الصنف؟",
      confirmText: "حذف",
      confirmClass: "btn-danger",
      onConfirm: function (unfreeze) {
        // نبحث عن الـ id الأصلي من البيانات لضمان الصحة
        var item = APP.data.items.find(function (i) {
          return String(i.id) === String(id);
        });
        var realId = item ? item.id : id;
        _gsr(
          "deleteItem",
          [realId, APP.currentUser.username, SESSION ? SESSION.token : null],
          {
            onSuccess: function (r) {
              NotificationEngine.success(r.message);
              reloadAfterMutation(
                null,
                unfreeze,
                { emoji: "", successMsg: "تم حذف الصنف " },
                {
                  collection: "items",
                  record: { id: String(realId) },
                  op: "remove",
                  idField: "id",
                },
              );
            },
            onError: function (r) {
              unfreeze();
              NotificationEngine.error(r.message || "خطأ");
            },
          },
        );
      },
    });
  }

  // [ITEM-MASTER-P0] تعريف تبويبات شاشة الصنف الـ11 حسب خطة إعادة البناء.
  // كل التبويبات الآن مبنية بمحتوى كامل (P1..P6) — عام، الوحدات والمقاسات،
  // المخزون، المشتريات، المبيعات، الحسابات، التصنيع، الجودة، المتجر
  // الإلكتروني، المستندات، سجل النشاط. _imSoonPanel() تحت باقية كـ fallback
  // فقط لأي تبويب مستقبلي يُضاف قبل ما يكتمل بناؤه.
  // [TABS-REORG-2026-07-27] ترتيب التابات: عام → المخزون → الوحدات →
  // المشتريات → المبيعات → الحسابات → التصنيع → الجودة → المتجر → المستندات
  // → سجل النشاط (بناءً على طلب المستخدم).
  var ITEM_MASTER_TABS = [
    { id: "general", label: "عام", icon: "ti-id", ready: true },
    { id: "units", label: "المقاسات والألوان", icon: "ti-ruler-2" },
    { id: "purchasing", label: "المشتريات", icon: "ti-shopping-cart" },
    { id: "sales", label: "المبيعات", icon: "ti-receipt" },
    { id: "accounting", label: "الحسابات", icon: "ti-report-money" },
    // [BUNDLE-COMPONENTS-TAB-2026-08-05] تاب جديد، بيظهر بس للأصناف نوع
    // "مجموعة" — التحكم في الإظهار في _imApplyTypeVisibility.
    { id: "components", label: "مكونات المجموعة", icon: "ti-box-multiple" },
    { id: "documents", label: "المستندات", icon: "ti-paperclip" },
  ];

  function _imSoonPanel(tabId) {
    return (
      '<div class="im-tab-panel" data-im-panel="' +
      tabId +
      '"><div class="im-soon"><i class="ti ti-hourglass-low"></i>' +
      "<div>هذا التبويب قيد التطوير — سيتوفر في مرحلة لاحقة من خطة إعادة بناء شاشة الصنف</div>" +
      "</div></div>"
    );
  }

  // [ITEM-MASTER-P2] بناء تبويب "الوحدات والمقاسات" — وحدات إضافية بمعامل
  // تحويل، أبعاد/وزن، حدود بيع/شراء، ومقاسات + معاينة مصفوفة Variants.
  function _imUnitsPanelHtml(item, isEdit) {
    var extraUnits = [];
    if (isEdit && item.extra_units_json) {
      try {
        extraUnits = JSON.parse(item.extra_units_json) || [];
      } catch (e) {
        extraUnits = [];
      }
    }
    var sizes = [];
    if (isEdit && item.sizes_json) {
      try {
        sizes = JSON.parse(item.sizes_json) || [];
      } catch (e) {
        sizes = [];
      }
    }

    // [EXTRA-UNITS-PICKER-2026-08-07] كان اسم الوحدة الإضافية حقل نصي حر —
    // غير متسق مع شاشة "تعريف الوحدات" (احتمال يكتب اسم مكرر بصياغة مختلفة
    // عن وحدة معرّفة بالفعل). اتحول لـ select من نفس مصدر APP.data.units
    // اللي بيتغذى منه دروب داون "الوحدة" الأساسي في تاب عام (نفس نمط
    // buildUnitOptions هناك). لو الصنف قديم ومخزن فيه اسم وحدة مش موجود
    // في الجدول الحالي، بنسيبه ظاهر كـ option إضافي عشان منفقدش بيانات
    // قديمة (مش بنجبر تعديلها).
    function extraUnitOptionsHtml(selectedUnit) {
      var allUnits = APP.data.units || [];
      var seenSelected = false;
      var html = '<option value="">— اختر وحدة —</option>' +
        allUnits
          .map(function (u) {
            var selected = selectedUnit && u.name === selectedUnit;
            if (selected) seenSelected = true;
            return (
              '<option value="' + esc(u.name) + '"' +
              (selected ? " selected" : "") +
              ">" + esc(u.name) + "</option>"
            );
          })
          .join("");
      if (selectedUnit && !seenSelected) {
        html += '<option value="' + esc(selectedUnit) + '" selected>' + esc(selectedUnit) + "</option>";
      }
      return html;
    }

    // [HINTS-DECLUTTER-2026-08-07] كان في التاب ده جمل شرح طويلة ظاهرة
    // تحت كل حقل بشكل دائم (المقاسات/الألوان/الوحدات) — بتتقرا كل مرة
    // حتى بعد ما المستخدم يتعودها، وبتزوّد طول الشاشة من غير داعي.
    // اتحولت لأيقونة "ⓘ" صغيرة جنب كل عنوان، النص الكامل بيظهر كـ
    // tooltip (title) عند الـ hover بس — الاسم قصير وواضح افتراضيًا،
    // والشرح التفصيلي موجود لمن يحتاجه فقط.
    function _imHint(text) {
      return (
        '<span title="' + esc(text) + '" style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--border);color:var(--text3);font-size:10px;cursor:help;margin-right:5px;flex-shrink:0">?</span>'
      );
    }

    function unitRowHtml(u) {
      return (
        '<div class="im-unit-row" style="display:flex;gap:8px;margin-bottom:6px;align-items:center">' +
        '<select class="input im-unit-name" style="flex:2">' +
        extraUnitOptionsHtml(u.unit || "") +
        "</select>" +
        '<input class="input im-unit-factor" type="number" step="0.0001" placeholder="معامل التحويل" value="' +
        (u.factor || "") +
        '" style="flex:1">' +
        '<button type="button" class="btn btn-outline btn-sm im-unit-remove" style="flex-shrink:0"><i class="ti ti-x"></i></button>' +
        "</div>"
      );
    }

    return (
      '<div class="im-tab-panel" data-im-panel="units">' +
      '<div class="form-grid">' +
      // [TABS-REORG-2026-07-27] "الحد الأدنى للبيع/الشراء" اتنقلوا لتابي
      // المبيعات والمشتريات بناءً على طلب المستخدم.
      // [TABS-REORG-2026-07-28] حقول الطول/العرض/الارتفاع/الوزن اتشالت من
      // هذا التاب بناءً على طلب المستخدم.
      // [SIZES-PICKER-2026-08-07] كان فيه حقل نصي حر (S,M,L,XL) المستخدم
      // يكتب فيه يدوي — غير متسق مع شاشة "تعريف المقاسات" (ممكن يكتب اسم
      // مش متطابق حرفيًا مع مقاس معرّف فيبقى فيه تكرار/اختلاف). اتحول
      // لقائمة اختيار (checkboxes) من نفس المقاسات المعرّفة فعليًا في
      // APP.data.sizes بس — مفيش كتابة يدوية خالص. "مجموعة مقاسات جاهزة"
      // اتسابت كاختصار بيحدد كل مقاسات المجموعة دفعة واحدة بدل ما يلزم
      // تحديدهم واحد واحد. القيمة النهائية بتتخزن في hidden input
      // id="im-sizes" بنفس الفورمات القديم (أسماء مفصولة بفاصلة) عشان
      // منطق الحفظ ومعاينة الـ Variants (sizes_text/_refreshVariantsPreview)
      // ما يتغيّرش.
      '<div class="field full"><label>المقاسات ' +
      _imHint('اختر من المقاسات المعرّفة في شاشة "تعريف المقاسات" — لإضافة مقاس جديد اذهب لتلك الشاشة أولًا') +
      "</label>" +
      ((APP.data.sizeGroups || []).length
        ? '<div style="display:flex;gap:8px;margin-bottom:8px">' +
          '<select class="input" id="im-size-group" style="flex:1">' +
          '<option value="">— اختر مجموعة مقاسات —</option>' +
          (APP.data.sizeGroups || [])
            .map(function (g) {
              return (
                '<option value="' + esc(g.id) + '">' + esc(g.name) + "</option>"
              );
            })
            .join("") +
          "</select>" +
          "</div>"
        : "") +
      ((APP.data.sizes || []).length
        ? '<div id="im-sizes-list" style="display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px solid var(--border);border-radius:10px">' +
          (APP.data.sizes || [])
            .map(function (s) {
              var checked = sizes.indexOf(s.name) !== -1;
              return (
                '<label style="display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px">' +
                '<input type="checkbox" class="im-size-item" value="' + esc(s.name) + '"' + (checked ? " checked" : "") + '">' +
                esc(s.name) +
                "</label>"
              );
            })
            .join("") +
          "</div>"
        : '<div style="padding:10px;border:1px dashed var(--border);border-radius:10px;font-size:12px;color:var(--text3)">لا توجد مقاسات معرّفة بعد — عرّفها أولًا من شاشة "تعريف المقاسات" في المخزون</div>') +
      '<input type="hidden" id="im-sizes" value="' +
      esc(sizes.join(",")) +
      '"></div>' +
        // ── إدارة الألوان (dropdown من الألوان العامة) ─────────
        '<div class="field full">' +
        '<label> الألوان ' +
        _imHint("اختار من الألوان المحفوظة، أو أضف لونًا جديدًا بزرار + جنب المنسدل") +
        "</label>" +
        '<div style="display:flex;gap:8px;margin-bottom:8px;align-items:flex-end;flex-wrap:wrap">' +
        '<div style="flex:2;min-width:160px"><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:3px">اختار من الألوان المحفوظة</label>' +
        '<select class="input" id="i-color-select" data-as-skip>' +
        '<option value="">— اختار لون —</option>' +
        (APP.data.colors || [])
          .map(function (c) {
            var val = esc(c.code || c.name);
            return (
              '<option value="' +
              val +
              '" data-name="' +
              esc(c.name) +
              '" data-code="' +
              esc(c.code || "") +
              '" data-hex="' +
              esc(c.hex || "") +
              '">' +
              esc(c.name) +
              (c.code ? " (" + esc(c.code) + ")" : "") +
              "</option>"
            );
          })
          .join("") +
        "</select></div>" +
        // ── حقل صورة اللون ──
        '<div style="flex:2;min-width:180px"><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:3px"> صورة هذا اللون (اختياري)</label>' +
        '<div style="display:flex;align-items:center;gap:6px">' +
        '<input class="input" id="i-color-img" type="url" placeholder="https://... رابط صورة اللون" style="flex:1" ' +
        "oninput=\"(function(){var v=this.value.trim();var p=document.getElementById('i-color-img-preview');if(!p)return;if(v){p.src=v;p.style.display='inline-block';}else{p.src='';p.style.display='none';}}).call(this)\">" +
        '<img id="i-color-img-preview" src="" alt="" style="display:none;width:36px;height:36px;object-fit:cover;border-radius:6px;border:1.5px solid var(--border);flex-shrink:0" ' +
        "onerror=\"this.style.display='none'\">" +
        "</div></div>" +
        '<button class="btn btn-outline btn-sm" id="i-color-add" type="button" style="align-self:flex-end;height:40px">+ إضافة</button>' +
        "</div>" +
        '<div id="i-color-tags" style="display:flex;flex-wrap:wrap;gap:6px;min-height:30px;padding:4px 0">' +
        '<span id="i-color-placeholder" style="color:var(--text3);font-size:12px">لم يتم إضافة ألوان بعد</span>' +
        "</div>" +
        "</div>" +
      '<div class="field full"><label>وحدات إضافية ومعاملات التحويل ' +
      _imHint('الأسماء من شاشة "تعريف الوحدات" — لإضافة وحدة جديدة اذهب لتلك الشاشة أولًا') +
      "</label>" +
      '<div id="im-units-list">' +
      (extraUnits.length ? extraUnits.map(unitRowHtml).join("") : "") +
      "</div>" +
      '<button type="button" class="btn btn-outline btn-sm" id="im-unit-add">+ إضافة وحدة</button>' +
      "</div>" +
      '<div class="field full">' +
      "<label>معاينة مصفوفة الألوان × المقاسات (Variants)</label>" +
      '<div id="im-variants-preview" style="font-size:12px;color:var(--text3)">أضف ألوان ومقاسات فوق لعرض المصفوفة</div>' +
      "</div>" +
      "</div>" +
      "</div>"
    );
  }

  // يبني/يحدّث معاينة المصفوفة اعتمادًا على الألوان الحالية في i-color-tags
  // ومحتوى im-sizes — تشتغل client-side فقط للعرض؛ التوليد الفعلي في
  // ItemVariants يحصل في Backend عند الحفظ (_syncItemVariants).
  function _refreshVariantsPreview() {
    var preview = document.getElementById("im-variants-preview");
    if (!preview) return;
    var colorTagsEl = document.getElementById("i-color-tags");
    var colorNames = colorTagsEl
      ? Array.from(
          colorTagsEl.querySelectorAll("span[data-color-tag='1']"),
        )
          .filter(function (s) {
            return s.style.display !== "none";
          })
          .map(function (s) {
            return s.getAttribute("data-color-name") || "";
          })
          .filter(Boolean)
      : [];
    var sizesInput = document.getElementById("im-sizes");
    var sizes = sizesInput
      ? sizesInput.value
          .split(",")
          .map(function (s) {
            return s.trim();
          })
          .filter(Boolean)
      : [];

    if (!colorNames.length || !sizes.length) {
      preview.innerHTML = "أضف ألوان ومقاسات فوق لعرض المصفوفة";
      return;
    }
    var html =
      '<table style="width:100%;border-collapse:collapse;font-size:12px">' +
      "<tr><th></th>" +
      sizes
        .map(function (sz) {
          return (
            '<th style="padding:4px 6px;border:1px solid var(--border)">' +
            esc(sz) +
            "</th>"
          );
        })
        .join("") +
      "</tr>" +
      colorNames
        .map(function (c) {
          return (
            "<tr><td style=\"padding:4px 6px;border:1px solid var(--border);font-weight:600\">" +
            esc(c) +
            "</td>" +
            sizes
              .map(function () {
                return '<td style="padding:4px 6px;border:1px solid var(--border);text-align:center;color:var(--accent,#0ea5a5)"><i class="ti ti-check"></i></td>';
              })
              .join("") +
            "</tr>"
          );
        })
        .join("") +
      "</table>";
    preview.innerHTML = html;
  }

  // [ITEM-MASTER-P3] بناء تبويب "المخزون" — سياسة تتبع (Serial/Batch)،
  // تقييم مخزون، مخزن افتراضي، وموقع تخزين (Shelf/Bin/Rack).
  // لا علاقة لهذا التبويب بإدخال أرقام السيريال/الدفعات الفعلية — ده بيحصل
  // من شاشات الحركات، مش من هنا (حسب خطة الفصل بين تعريف الصنف وحركاته).
  // [INVENTORY-TAB-MERGED-2026-08-07] تاب "المخزون" اتشال بالكامل بناءً
  // على طلب المستخدم — حقوله (مدة الصلاحية، الحد الأدنى/الأقصى، Safety
  // Stock، Lead Time) اتدمجوا في تاب "عام" بنفس الـ id's بالظبط
  // (شوف _imGeneralPanelHtml / بناء الفورم تحت)، فمنطق الحفظ ما اتغيرش
  // خالص. دالة _imInventoryPanelHtml القديمة اتشالت معاها.

  // [ITEM-MASTER-P4] تبويب "المشتريات" — المورد الافتراضي (نُقل هنا من عمود
  // قديم في General لأنه منطقيًا مكانه هنا)، MOQ، العملة، سياسة الطلب،
  // كود الصنف عند المورد، رقم الكتالوج. "آخر سعر شراء" بيتعرض هنا كقراءة
  // فقط من سعر التكلفة الحالي (مفيش شيت أسعار موردين متعدد حاليًا).
  function _imPurchasingPanelHtml(item, isEdit, suppliers) {
    // [DATA-LOADING-FIX-2026-07-29] لو APP.data.suppliers لسه مش متحمّلة
    // (الموردين مصنّفين ON_DEMAND في DATA_REGISTRY — بيتحمّلوا بس لما
    // المستخدم يفتح شاشة الموردين نفسها)، القائمة هنا كانت بتطلع فاضية
    // بصمت لو المستخدم فتح شاشة الأصناف مباشرة من غير ما يمر على شاشة
    // الموردين قبلها. _imInitPurchasingPanel تحت بتجيب الموردين lazy
    // أول ما التاب ده يتفتح فعليًا لو مش محمّلين، بنفس منطق تحميل
    // حسابات الافتراضي في _imInitAccountingPanel.
    var haveSuppliers = Array.isArray(suppliers) && suppliers.length > 0;
    var supplierOptions = (suppliers || [])
      .map(function (s) {
        return (
          '<option value="' +
          esc(s.name) +
          '"' +
          (isEdit && item.default_supplier === s.name ? " selected" : "") +
          ">" +
          esc(s.name) +
          "</option>"
        );
      })
      .join("");
    return (
      '<div class="im-tab-panel" data-im-panel="purchasing">' +
      '<div class="form-grid">' +
      '<div class="field"><label>المورد الافتراضي</label><select class="input" id="im-default-supplier" data-supplier-current="' +
      (isEdit ? esc(item.default_supplier || "") : "") +
      '"><option value="">' +
      (haveSuppliers ? "— اختر مورد —" : "— جاري تحميل الموردين... —") +
      "</option>" +
      supplierOptions +
      "</select></div>" +
      '<div class="field"><label>كود الصنف عند المورد</label><input class="input" id="im-supplier-item-code" value="' +
      (isEdit ? esc(item.supplier_item_code || "") : "") +
      '"></div>' +
      '<div class="field"><label>رقم الكتالوج</label><input class="input" id="im-catalog-number" value="' +
      (isEdit ? esc(item.catalog_number || "") : "") +
      '"></div>' +
      // [DUPLICATE-FIELD-FIX-2026-07-27] "MOQ" و"الحد الأدنى للشراء" كانا
      // حقلين منفصلين بنفس المعنى بالضبط (الكمية الأدنى المسموح طلبها من
      // المورد) بيتحفظوا في عمودين مختلفين (moq / min_purchase_qty) من غير
      // أي استخدام فعلي تاني لأي منهم في أي منطق بالنظام. تم دمجهم في حقل
      // واحد. القيمة المعروضة عند التعديل = أكبر قيمة بين القديمين، لحماية
      // بيانات الأصناف الموجودة قبل تشغيل migration مركّزة (راجع
      // mergeMoqAndMinPurchaseQty في Code_21b_Migrations.js).
      '<div class="field"><label>الحد الأدنى للطلب من المورد (MOQ)</label><input class="input" type="number" id="im-moq" value="' +
      (isEdit
        ? Math.max(Number(item.moq || 0), Number(item.min_purchase_qty || 0))
        : 0) +
      '" min="0"></div>' +
      '<div class="field"><label>سياسة الطلب</label><select class="input" id="im-order-policy">' +
      [
        { v: "reorder_point", l: "حسب حد إعادة الطلب" },
        { v: "fixed", l: "كمية ثابتة" },
        { v: "mto", l: "عند الطلب (MTO)" },
      ]
        .map(function (o) {
          return (
            '<option value="' +
            o.v +
            '"' +
            ((isEdit ? item.order_policy || "reorder_point" : "reorder_point") ===
            o.v
              ? " selected"
              : "") +
            ">" +
            o.l +
            "</option>"
          );
        })
        .join("") +
      "</select></div>" +
      "</div>" +
      "</div>"
    );
  }

  // [ITEM-MASTER-P4] تبويب "المبيعات" — سعر البيع الأساسي يُدار من General
  // (نفس الحقل)، وهنا سياسات التسعير: الضريبة، الهامش الأدنى، الخصم الأقصى،
  // العمولة. "قوائم الأسعار المتعددة" تحتاج شيت PriceLists مستقل — خارج
  // نطاق هذه المرحلة.
  function _imSalesPanelHtml(item, isEdit) {
    return (
      '<div class="im-tab-panel" data-im-panel="sales">' +
      '<div class="form-grid">' +
      // [TABS-REORG-2026-07-28] سعر التكلفة وسعر البيع اتنقلوا هنا من تاب
      // "عام" (بنفس الـ id's i-cost/i-sell) بدل المرآة المعطّلة (disabled)
      // اللي كانت بس بتعرض القيمة للقراءة — دلوقتي التعديل الفعلي من هنا.
      '<div class="field"><label>سعر التكلفة</label><input class="input" type="number" id="i-cost" value="' +
      (isEdit ? item.cost_price || 0 : "0.00") +
      '" step="0.01"></div>' +
      '<div class="field"><label>سعر البيع الأساسي</label><input class="input" type="number" id="i-sell" value="' +
      (isEdit ? item.selling_price || 0 : "0.00") +
      '" step="0.01"></div>' +
      // [TABS-REORG-2026-07-27] منقول من تاب "الوحدات"
      '<div class="field"><label>الحد الأدنى للبيع</label><input class="input" type="number" id="im-min-sale" value="' +
      (isEdit ? Number(item.min_sale_qty || 0) : 0) +
      '"></div>' +
      '<div class="field" style="display:flex;align-items:center;gap:8px;padding-top:22px">' +
      '<input type="checkbox" id="im-price-incl-tax"' +
      (isEdit && (item.price_includes_tax === true || item.price_includes_tax === "true")
        ? " checked"
        : "") +
      '><label for="im-price-incl-tax" style="margin:0">السعر شامل الضريبة</label>' +
      "</div>" +
      // [FIELD-PAIR-REORG] نسبة الضريبة % جنب نسبة العمولة % (بدل ما
      // كانت نسبة الضريبة جنب الحد الأدنى للبيع، والعمولة جنب الخصم الأقصى)
      '<div class="field"><label>نسبة الضريبة %</label><input class="input" type="number" step="0.01" id="im-tax-rate" value="' +
      (isEdit ? Number(item.tax_rate || 0) : 0) +
      '" min="0"></div>' +
      '<div class="field"><label>نسبة العمولة %</label><input class="input" type="number" step="0.01" id="im-commission" value="' +
      (isEdit ? Number(item.commission_percent || 0) : 0) +
      '" min="0"></div>' +
      // [FIELD-PAIR-REORG] أقل هامش ربح مسموح % جنب أقصى خصم مسموح %
      // (كانا في صفين منفصلين — دلوقتي جنب بعض زي ما اتطلب)
      '<div class="field"><label>أقل هامش ربح مسموح %</label><input class="input" type="number" step="0.01" id="im-min-margin" value="' +
      (isEdit ? Number(item.min_margin_percent || 0) : 0) +
      '" min="0"></div>' +
      '<div class="field"><label>أقصى خصم مسموح %</label><input class="input" type="number" step="0.01" id="im-max-discount" value="' +
      (isEdit ? Number(item.max_discount_percent || 0) : 0) +
      '" min="0" max="100"></div>' +
      '<div style="grid-column:1/-1;font-size:11px;color:var(--text3)">' +
      
      "</div>" +
      "</div>" +
      "</div>"
    );
  }

  // [ITEM-MASTER-P4] تبويب "الحسابات" — ربط الصنف بشجرة الحسابات، مع
  // "وراثة قابلة للتعديل": ترك الحقل فارغاً = استخدام الحساب الافتراضي من
  // إعدادات الترحيل (PostingConfig)، واختيار حساب صراحة = Override خاص
  // بهذا الصنف فقط.
  function _imAccountingPanelHtml(item, isEdit, chartOfAccounts, costCenters) {
    // [ACC-FIELD-REALSELECT-2026-07-27] كان الخيار الفاضي بيقول "— وراثة
    // من الإعداد الافتراضي —" وبيفضل يتخزن فاضي فعليًا (وراثة ديناميكية:
    // أي تغيير لاحق في إعدادات الترحيل بينعكس تلقائيًا). بناءً على طلب
    // المستخدم، الحقل بقى select فعلي عادي: بمجرد ما الحساب الافتراضي
    // الحالي يتحمّل (_imInitAccountingPanel تحت)، بيتحدد كقيمة حقيقية
    // مختارة في الـ select (مش نص وصفي فاضي). المستخدم لسه ممكن يغيّره
    // لحساب تاني (Override)، بس دلوقتي مفيش "وراثة" مبهمة — الاختيار
    // المعروض هو نفسه اللي هيتحفظ.
    // [ACC-FIELD-FILTER-2026-08-08] كان الـ select ده بيعرض كل صفوف
    // ChartOfAccounts خام من غير أي فلترة — يعني المستخدم يقدر يختار حساب
    // "أب" (Parent/Group، زي "3 — المصروفات" أو "4 — الإيرادات") مش
    // مسموح يترحّل عليه قيود أصلاً، أو حساب من نوع محاسبي غلط تمامًا
    // للحقل ده (مثلاً حساب إيراد في خانة حساب المخزون). نفس الفلترة دي
    // موجودة فعلاً في searchAccountsLookup (Code_02) بس الشاشة دي ما
    // كانتش بتستخدمها. بنطبّق نفس المنطق هنا: استبعاد is_parent، واستبعاد
    // أي نوع غير متوقع لو expectedType موجود لهذا الحقل.
    function _accIsUsable(a, expectedType) {
      if (!a) return false;
      if (a.deleted_at) return false;
      if (a.is_active === false || a.is_active === "FALSE") return false;
      if (a.is_parent === true || a.is_parent === "TRUE") return false;
      if (expectedType && a.type && a.type !== expectedType) return false;
      return true;
    }
    function accOptions(fieldVal, expectedType) {
      var all = chartOfAccounts || [];
      var usable = all.filter(function (a) {
        return _accIsUsable(a, expectedType);
      });
      var html = '<option value="">— اختر حساب —</option>';
      // [ACC-FIELD-FILTER-2026-08-08] لو القيمة المحفوظة فعلاً (تعديل صنف
      // قديم) بقت مش صالحة دلوقتي (حساب أب / محذوف / موقوف / نوع غلط) —
      // منعرضهاش كأنها اختفت بصمت، ده هيوهم المستخدم إن الحقل فاضي. بدل
      // كده بنضيفها كخيار محدد ومعلّم بتحذير، عشان يلاحظ ويصلّحها بنفسه.
      if (isEdit && fieldVal) {
        var savedAcc = all.find(function (a) {
          return a.id === fieldVal;
        });
        var savedUsable = savedAcc && _accIsUsable(savedAcc, expectedType);
        if (savedAcc && !savedUsable) {
          html +=
            '<option value="' +
            esc(savedAcc.id) +
            '" selected>⚠️ ' +
            esc(savedAcc.code ? savedAcc.code + " — " + savedAcc.name : savedAcc.name) +
            " (حساب غير صالح للترحيل — راجعه)</option>";
        }
      }
      html += usable
        .map(function (a) {
          return (
            '<option value="' +
            esc(a.id) +
            '"' +
            (isEdit && fieldVal === a.id ? " selected" : "") +
            ">" +
            esc(a.code ? a.code + " — " + a.name : a.name) +
            "</option>"
          );
        })
        .join("");
      return html;
    }
    function ccOptions(fieldVal) {
      return (
        '<option value="">— بدون —</option>' +
        (costCenters || [])
          .map(function (c) {
            return (
              '<option value="' +
              esc(c.id) +
              '"' +
              (isEdit && fieldVal === c.id ? " selected" : "") +
              ">" +
              esc(c.code ? c.code + " — " + c.name : c.name) +
              "</option>"
            );
          })
          .join("")
      );
    }
    // [ITEM-ACC-DEFAULTS-2026-07-27] المفتاح الرابع في كل صف (لو موجود)
    // هو مفتاح إعدادات الترحيل المقابل — بيستخدم بعد التحميل لتحديث نص
    // خيار "وراثة" بالحساب الافتراضي الفعلي. الحقلين اللي معندهمش مفتاح
    // ترحيل مقابل (مردودات المشتريات / فروقات السعر) بيفضلوا بالنص العام.
    // [ACC-FIELD-FILTER-2026-08-08] المفتاح الخامس هو النوع المحاسبي
    // المتوقع لهذا الحقل (يطابق POSTING_CONFIG_KEYS في Code_19)، بيُستخدم
    // لفلترة الـ select. مردودات المشتريات وفروقات السعر معندهمش مفتاح
    // ترحيل عام مقابل، لكن طبيعتهم المحاسبية معروفة برضه (مصروف/تكلفة
    // مضادة)، فحطينا EXPENSE ليهم بنفس منطق حساب المشتريات/COGS.
    var accFields = [
      ["inventory_account_id", "im-acc-inventory", "حساب المخزون", "inventory_account", "ASSET"],
      ["cogs_account_id", "im-acc-cogs", "حساب تكلفة البضاعة المباعة (COGS)", "cogs_account", "EXPENSE"],
      ["sales_account_id", "im-acc-sales", "حساب إيرادات المبيعات", "revenue_account", "REVENUE"],
      ["purchase_account_id", "im-acc-purchase", "حساب المشتريات", "purchase_account", "EXPENSE"],
      ["sales_return_account_id", "im-acc-sales-return", "حساب مردودات المبيعات", "sales_return_account", "REVENUE"],
      ["purchase_return_account_id", "im-acc-purchase-return", "حساب مردودات المشتريات", null, "EXPENSE"],
      ["inventory_adjustment_account_id", "im-acc-inv-adj", "حساب تسوية/فروقات المخزون", "inventory_variance_account", "EXPENSE"],
      ["price_difference_account_id", "im-acc-price-diff", "حساب فروقات السعر", null, "EXPENSE"],
    ];
    return (
      '<div class="im-tab-panel" data-im-panel="accounting">' +
      '<div style="font-size:11px;color:var(--text3);margin-bottom:10px">' +
      "الحساب المحدد بيبقى الافتراضي الحالي من إعدادات الترحيل — غيّره لو الصنف ده محتاج حساب مختلف." +
      "</div>" +
      // [CONSIGNMENT-ACCOUNTING-2026-08-05] بانر بيظهر بس لنوع "بضاعة
      // أمانة" — البضاعة دي مش مملوكة لك، فحسابات المخزون/التكلفة/الشراء
      // العادية مش المفروض تترحّل عليها. الحقول المتأثرة بتتخفي (مش
      // بتتمسح، القيمة القديمة لو موجودة بتفضل محفوظة في القاعدة لو
      // النوع اتغيّر تاني) — شوف _imApplyConsignmentAccountingUI.
      // ⚠️ ده تنبيه واجهة بس — لازم تأكيد من محاسب قبل الاعتماد عليه في
      // الترحيل الفعلي، وأهم حاجة: الباك إند (منطق الترحيل وقت البيع)
      // لازم يتأكد بردو إنه بيتحقق من item_type ومش بيرحّل قيمة مخزون/
      // COGS عادية لصنف "بضاعة أمانة"، وإلا التنبيه ده هيبقى شكلي بس.
      '<div id="im-acc-consignment-note" style="display:none;background:#fff8e1;border:1px solid #f0c419;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#7a5c00">' +
      "⚠️ نوع الصنف \"بضاعة أمانة\" — البضاعة دي مش مملوكة لك، فحسابات المخزون/التكلفة/الشراء العادية اتخفت لأنها مش بتنطبق. لو محتاج ترحيل مخصص (زي حساب التزامات أمانة)، راجع المحاسب قبل ما تفعّل أي حساب هنا يدويًا." +
      "</div>" +
      '<div class="form-grid" id="im-acc-fields-grid">' +
      accFields
        .map(function (f) {
          return (
            '<div class="field" data-acc-field="' +
            f[0] +
            '"><label>' +
            f[2] +
            '</label><select class="input" id="' +
            f[1] +
            '"' +
            (f[3] ? ' data-posting-key="' + f[3] + '"' : "") +
            (f[4] ? ' data-expected-type="' + f[4] + '"' : "") +
            '>' +
            accOptions(isEdit ? item[f[0]] || "" : "", f[4]) +
            "</select></div>"
          );
        })
        .join("") +
      '<div class="field"><label>مركز التكلفة</label><select class="input" id="im-cost-center">' +
      ccOptions(isEdit ? item.cost_center_id || "" : "") +
      "</select></div>" +
      '<div class="field"><label>مركز الربحية</label><select class="input" id="im-profit-center">' +
      ccOptions(isEdit ? item.profit_center_id || "" : "") +
      "</select></div>" +
      "</div>" +
      "</div>"
    );
  }
  // [CONSIGNMENT-ACCOUNTING-2026-08-05] الحقول المحاسبية اللي بتتخفي لصنف
  // "بضاعة أمانة" — مخزون/تكلفة/شراء/تسوية مخزون/فروقات سعر/مردودات شراء.
  // حساب المبيعات ومردودات المبيعات اتسابوا ظاهرين لأن البضاعة برضه بتتباع
  // (الإيراد بيتسجل حتى لو المخزون مش ملكك) — القرار ده محتاج تأكيد محاسبي
  // زي ما موضّح في البانر فوق.
  var IM_ACC_CONSIGNMENT_HIDDEN_FIELDS = [
    "inventory_account_id",
    "cogs_account_id",
    "purchase_account_id",
    "purchase_return_account_id",
    "inventory_adjustment_account_id",
    "price_difference_account_id",
  ];
  function _imApplyConsignmentAccountingUI(typeVal) {
    var t = _imGetTypeMetaByValue(typeVal);
    var isConsignment = !!(t && t.rules && t.rules.isConsignment);
    var note = document.getElementById("im-acc-consignment-note");
    if (note) note.style.display = isConsignment ? "" : "none";
    IM_ACC_CONSIGNMENT_HIDDEN_FIELDS.forEach(function (fieldKey) {
      var wrapper = document.querySelector('[data-acc-field="' + fieldKey + '"]');
      if (wrapper) wrapper.style.display = isConsignment ? "none" : "";
    });
  }

  // [ITEM-MASTER-P6] تبويب "المستندات" — مرفقات/كتالوجات/Datasheets
  // (اسم + رابط + نوع). نفس نمط القوائم القابلة للإضافة/الحذف.
  function _imDocumentsPanelHtml(item, isEdit) {
    var docs = [];
    if (isEdit && item.documents_json) {
      try {
        docs = JSON.parse(item.documents_json) || [];
      } catch (e) {
        docs = [];
      }
    }
    function docRowHtml(d) {
      d = d || {};
      return (
        '<div class="im-doc-row" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;align-items:center">' +
        '<input class="input im-doc-name" placeholder="اسم المستند" value="' +
        esc(d.name || "") +
        '" style="flex:1.2 1 140px;min-width:0">' +
        '<input class="input im-doc-url" placeholder="رابط الملف (https://...)" value="' +
        esc(d.url || "") +
        '" style="flex:2 1 180px;min-width:0">' +
        '<select class="input im-doc-type" style="flex:0.8 1 90px;min-width:0">' +
        [
          ["pdf", "PDF"],
          ["image", "صورة"],
          ["catalog", "كتالوج"],
          ["datasheet", "Datasheet"],
          ["other", "أخرى"],
        ]
          .map(function (o) {
            return (
              '<option value="' +
              o[0] +
              '"' +
              (d.type === o[0] ? " selected" : "") +
              ">" +
              o[1] +
              "</option>"
            );
          })
          .join("") +
        "</select>" +
        '<input type="file" class="im-doc-file" style="display:none">' +
        '<button type="button" class="btn btn-outline btn-sm im-doc-upload" style="flex:0 0 auto"><i class="ti ti-upload"></i></button>' +
        '<button type="button" class="btn btn-outline btn-sm im-doc-remove" style="flex:0 0 auto"><i class="ti ti-x"></i></button>' +
        "</div>"
      );
    }
    return (
      '<div class="im-tab-panel" data-im-panel="documents">' +
      '<div id="im-doc-list">' +
      (docs.length ? docs.map(docRowHtml).join("") : docRowHtml({})) +
      "</div>" +
      '<button type="button" class="btn btn-outline btn-sm" id="im-doc-add"><i class="ti ti-plus"></i> إضافة مستند</button>' +
      '<div style="font-size:11px;color:var(--text3);margin-top:10px">' +
      "دوس زر الرفع (📤) لرفع الملف فعليًا على Drive، أو الصق رابط جاهز يدويًا." +
      "</div>" +
      "</div>"
    );
  }


  // [ITEM-MASTER-P7] بناء بيانات ملخص الصنف الكاملة للـ Sidebar — بيحسب من
  // البيانات المحمّلة أصلاً على العميل (لا يحتاج نداء سيرفر إضافي):
  // المتاح، المُباع/المُشترى (من Transactions)، آخر حركة، هامش الربح، وعدد
  // المخازن اللي للصنف رصيد فيها.
  function _imBuildSidebarSummary(item, isEdit) {
    if (!isEdit || !item || !item.id) {
      return [
        ["المتاح", "—"],
        ["المُباع (كل الوقت)", "—"],
        ["المُشترى (كل الوقت)", "—"],
        ["آخر حركة", "—"],
        ["هامش الربح", "—"],
        ["عدد المخازن", "—"],
      ];
    }
    var itemId = item.id;
    var txs = (APP.data.transactions || []).filter(function (t) {
      return String(t.item_id) === String(itemId);
    });
    var soldQty = txs
      .filter(function (t) {
        return t.type === "OUT";
      })
      .reduce(function (s, t) {
        return s + Number(t.quantity || 0);
      }, 0);
    var purchasedQty = txs
      .filter(function (t) {
        return t.type === "IN";
      })
      .reduce(function (s, t) {
        return s + Number(t.quantity || 0);
      }, 0);
    var lastTxDate = txs.length
      ? txs
          .map(function (t) {
            return t.date;
          })
          .sort()
          .slice(-1)[0]
      : null;
    var warehouseCount = new Set(
      (APP.data.stock || [])
        .filter(function (s) {
          return (
            String(s.item_id) === String(itemId) &&
            Number(s.quantity || 0) !== 0
          );
        })
        .map(function (s) {
          return s.warehouse;
        }),
    ).size;
    var cost = Number(item.cost_price || 0);
    var price = Number(item.selling_price || 0);
    var marginTxt = "—";
    if (cost > 0 && price > 0) {
      var marginPct = (((price - cost) / price) * 100).toFixed(1);
      marginTxt = marginPct + "%";
    }
    return [
      ["المتاح", getItemStockInfo(itemId).replace(/<[^>]+>/g, "")],
      ["المُباع (كل الوقت)", soldQty + " " + (item.unit || "")],
      ["المُشترى (كل الوقت)", purchasedQty + " " + (item.unit || "")],
      ["آخر حركة", lastTxDate ? fmtDate(lastTxDate) : "لا يوجد"],
      ["هامش الربح", marginTxt],
      ["عدد المخازن", warehouseCount],
    ];
  }

  // [ITEM-TYPE-META-2026-07-28] مصدر واحد لبيانات "نوع الصنف" — نفس الـ 7
  // أنواع الموجودة فعليًا بالنظام (قيمها ما اتغيرتش خالص)، بس دلوقتي كل
  // نوع معاه أيقونة + وصف قصير (بيظهر تحت الاسم في القائمة نفسها بدل
  // Tooltip منفصل، عشان النص يفضل واضح وظاهر من غير ما المستخدم يحتاج
  // يمرر بالماوس) + مؤشرات سلوك (تتبع مخزون/شراء/بيع/تقارير مخزون/تأثير
  // محاسبي). دي بيانات وصفية للعرض بس — مفيش أي منطق في النظام حاليًا
  // بيفرّق فعليًا بين الأنواع دي (اتأكدنا إن item_type مش بيتفحص في أي
  // مكان تاني غير الحفظ والعرض)، فالبطاقة بتوضّح للمستخدم "الفكرة
  // المقصودة" من كل نوع من غير ما تلمس أو تدّعي منطق أعمال غير موجود.
  // [ITEM-TYPE-REDESIGN-2026-08-05] القائمة الجديدة (٧ أنواع) بناءً على طلب
  // المستخدم — كل نوع بقى معاه، غير الـ flags (اللي بتتحكم في التابات
  // الظاهرة عبر _imApplyTypeVisibility)، كائن "rules" بيوصف قواعد إلزامية
  // فعلية بتتفحص وقت الحفظ (_imValidateTypeRules) ووقت فتح تاب المخزون
  // (_imApplyTypeRules) — يعني مش بس وصف، ده سلوك حقيقي زي الأنظمة
  // الاحترافية (SAP/Odoo بيفرقوا فعليًا بين نوع وتاني، مش بس شكل).
  //
  // ⚠️ ملحوظة توافقية: القائمة القديمة كانت فيها (goods/raw/semi/asset)
  // ومش موجودين في القائمة الجديدة. أي صنف قديم متخزن بأحد القيم دي هيفضل
  // شغال (القيمة مش هتتمسح تلقائيًا) لكن الـ dropdown مش هيعرضها كخيار،

          var manualUrlInput = document.getElementById("i-img-url-manual");
          var urlInput2 = document.getElementById("i-img");
          var previewImg2 = document.getElementById("i-img-preview");
          var placeholder2 = document.getElementById("i-img-placeholder");
          if (!linkBtn || !urlRow || !manualUrlInput || !urlInput2) return;

          linkBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation(); // منع فتح نافذة اختيار الملف (فعل المربع نفسه)

            urlRow.style.display = showing ? "none" : "block";

          manualUrlInput.addEventListener("click", function (e) {

          manualUrlInput.addEventListener("keydown", function (e) {

          // ── [SIZE-GROUP-LINK-2026-07-27 / SIZES-PICKER-2026-08-07] ربط

          function _imSyncSizesHidden() {

          // [SIZES-PICKER-2026-08-07] im-sizes بقى hidden input بيتحدّث

        // ── [ITEM-MASTER-P6] المستندات: إضافة/حذف صف ─────────────────
        // [ITEM-MASTER-P8] اتحول لدالة — تاب "المستندات" بيتبني Lazy
        function _imInitDocumentsPanel() {
          var _docList = document.getElementById("im-doc-list");
          function _bindDocRemove(row) {
            var btn = row.querySelector(".im-doc-remove");
            if (btn)
              btn.addEventListener("click", function () {
                row.remove();
              });
          }
          // [DOC-ENGINE] رفع مستند صنف فعليًا على Drive — docType: "document"
          // بيوجّه الملف لفولدر "المستندات" الخاص بالصنف (مش "الصور"). لو
          // حقل "اسم المستند" فاضي، بيتملى تلقائيًا باسم الملف بعد الرفع.
          function _bindDocUpload(row) {
            var uploadBtn = row.querySelector(".im-doc-upload");
            var fileInput = row.querySelector(".im-doc-file");
            var urlInput = row.querySelector(".im-doc-url");
            var nameInput = row.querySelector(".im-doc-name");
            if (!uploadBtn || !fileInput || !urlInput) return;
            uploadBtn.addEventListener("click", function () {
              fileInput.click();
            });
            fileInput.addEventListener("change", function () {
              var file = fileInput.files && fileInput.files[0];
              if (!file) return;
              if (file.size > 10 * 1024 * 1024) {
                NotificationEngine.error("حجم الملف يتجاوز 10MB");
                return;
              }
              var reader = new FileReader();
              reader.onload = function (ev) {
                var base64 = String(ev.target.result).split(",")[1];
                if (!base64) {
                  NotificationEngine.error("تعذّر قراءة الملف");
                  return;
                }
                uploadBtn.disabled = true;
                NotificationEngine.loading("⏳ جاري رفع المستند على Drive...");
                var codeEl = document.getElementById("i-code");
                var nameEl =
                  document.getElementById("i-name") ||
                  document.getElementById("i-item-name");
                _gsr(
                  "uploadItemImage",
                  [
                    base64,
                    file.name,
                    file.type,
                    isEdit ? item.id : "",
                    {
                      callerUser: APP.currentUser ? APP.currentUser.username : "admin",
                      sessionToken: SESSION ? SESSION.token : "",
                      code: codeEl ? codeEl.value.trim() : "",
                      name: nameEl ? nameEl.value.trim() : "",
                      docType: "document",
                    },
                  ],
                  {
                    onSuccess: function (result) {
                      uploadBtn.disabled = false;
                      var resultStr = result.data;
                      var res =
                        typeof resultStr === "string"
                          ? JSON.parse(resultStr)
                          : resultStr;
                      if (!res || !res.success || !res.viewUrl) {
                        finishLoadingToast(
                          (res && res.error) || "فشل رفع المستند",
                          "error",
                        );
                        return;
                      }
                      urlInput.value = res.viewUrl;
                      if (nameInput && !nameInput.value.trim())
                        nameInput.value = file.name;
                      finishLoadingToast("تم رفع المستند بنجاح", "success");
                    },
                    onError: function (result) {
                      uploadBtn.disabled = false;
                      finishLoadingToast(
                        "فشل الاتصال بالسيرفر: " + (result.message || ""),
                        "error",
                      );
                    },
                  },
                );
              };
              reader.readAsDataURL(file);
            });
          }
          if (_docList) {
            _docList.querySelectorAll(".im-doc-row").forEach(function (row) {
              _bindDocRemove(row);
              _bindDocUpload(row);
            });
          }
          var _docAddBtn = document.getElementById("im-doc-add");
          if (_docAddBtn && _docList) {
            _docAddBtn.addEventListener("click", function () {
              var div = document.createElement("div");
              div.innerHTML =

                '<select class="input im-doc-type" style="flex:0.8 1 90px;min-width:0">' +

                '<option value="image">صورة</option>' +
                '<option value="catalog">كتالوج</option>' +
                '<option value="datasheet">Datasheet</option>' +
                '<option value="other">أخرى</option>' +
                "</select>" +

                '<button type="button" class="btn btn-outline btn-sm im-doc-upload" style="flex:0 0 auto"><i class="ti ti-upload"></i></button>' +
                '<button type="button" class="btn btn-outline btn-sm im-doc-remove" style="flex:0 0 auto"><i class="ti ti-x"></i></button>' +
                "</div>";
              var row = div.firstChild;
              _docList.appendChild(row);
              _bindDocRemove(row);
              _bindDocUpload(row);
            });
          }
        }
        // ── [ITEM-ACC-DEFAULTS-2026-07-27] تاب الحسابات: تحديث نص خيار
        // "وراثة من الإعداد الافتراضي" باسم الحساب الافتراضي الفعلي —
        // القيمة المخزّنة بتفضل فاضية (وراثة حقيقية)، ده عرض بصري بس.
        // ── [ITEM-ACC-DEFAULTS-2026-07-27] تاب الحسابات: تحديد الحساب
        // الافتراضي الحالي كقيمة فعلية مختارة في كل select (مش نص وصفي
        // فاضي زي قبل كده) — الحقل بقى select فعلي عادي. بيتطبّق بس على
        // الحقول اللي لسه على "— اختر حساب —" (يعني ماحددلهاش المستخدم
        // Override صريح)، فمينفعش يبوّظ اختيار محفوظ سابقاً عند التعديل.
        var _imAccDefaultsLoaded = false;
        function _imInitAccountingPanel() {
          if (_imAccDefaultsLoaded) return;
          if (typeof _gsr !== "function") return;
          _imAccDefaultsLoaded = true;
          _gsr("getItemAccountingDefaults", [], {
            label: "getItemAccountingDefaults",
            onSuccess: function (result) {
              var res = result && result.data;
              if (!res) return;
              document
                .querySelectorAll('.im-tab-panel[data-im-panel="accounting"] select[data-posting-key]')
                .forEach(function (sel) {
                  var key = sel.getAttribute("data-posting-key");
                  var def = res[key];
                  if (!def || !def.id || sel.value) return; // عنده Override محفوظ بالفعل — سيبه
                  var opt = sel.querySelector('option[value="' + def.id + '"]');
                  if (opt) sel.value = def.id;
                  if (window.SplitSelect) SplitSelect.refresh(sel.id);
                });
            },
            onError: function () {
              // فشل التحميل: الحقل يفضل على "— اختر حساب —" — مش خطأ حرج.
            },
          });
        }
        // [DATA-LOADING-FIX-2026-07-29] تحميل الموردين lazy أول ما تاب
        // "المشتريات" يتفتح فعليًا، بنفس فلسفة _imInitAccountingPanel —
        // بدون أي تغيير في منطق getSuppliers نفسه أو صلاحياته. لو
        // APP.data.suppliers محمّلة بالفعل (المستخدم زار شاشة الموردين
        // قبل كده في نفس الجلسة) منعمل حاجة، ونستخدمها زي ما هي (Cache).
        var _imSuppliersLoadRequested = false;
        function _imInitPurchasingPanel() {
          var sel = document.getElementById("im-default-supplier");
          if (!sel) return;
          if (Array.isArray(APP.data.suppliers) && APP.data.suppliers.length) return; // متحمّلة بالفعل
          if (_imSuppliersLoadRequested) return;
          _imSuppliersLoadRequested = true;
          if (!window.DL || !DL.Parties || typeof DL.Parties.getSuppliers !== "function") return;
          DL.Parties.getSuppliers(
            {
              callerUser: APP.currentUser && APP.currentUser.username,
              sessionToken:
                (APP.currentUser && APP.currentUser.sessionToken) ||
                (typeof SESSION !== "undefined" && SESSION && SESSION.token),
            },
            {
              label: "Items.purchasingTab.getSuppliers",
              onSuccess: function (res) {
                var list = (res && res.data) || [];
                APP.data.suppliers = list;
                var current = sel.getAttribute("data-supplier-current") || "";
                var opts = ['<option value="">— اختر مورد —</option>'];
                list.forEach(function (s) {
                  opts.push(
                    '<option value="' +

                      "</option>",

                sel.innerHTML = opts.join("");

              onError: function () {

        // لسه في تاب "عام" الجاهز فورًا.
        function _imInitColorsPanel() {
        // ── ربط دروب داون الألوان المحفوظة (SplitSelect/AppSelect،
        // نفس مبدأ i-group/i-unit في تاب عام) ──────────────
        var _colorSelect = document.getElementById("i-color-select");

        if (_colorSelect && window.SplitSelect) {
          // [INLINE-ADD-2026-08-07] نفس نمط i-group / i-unit بالحرف: زرار
          // "+" جوه صندوق الـ select بيفتح overlay إضافة لون جديد
          // (openQuickAddColor)، وبعد الإضافة بنضيفه كـ option ونختاره
          // مباشرة. مصدر الخيارات APP.data.colors (شاشة "تعريف الألوان").
          SplitSelect.init("i-color-select", {
            label: "اختار لون",
            icon: "ti-palette",
            searchable: true,
            addAction: {
              icon: "ti-plus",
              title: "إضافة لون جديد",
              onClick: function () {
                openQuickAddColor({
                  onCreated: function (newColor) {
                    var colorSel = document.getElementById("i-color-select");
                    if (!colorSel) return;
                    var opt = document.createElement("option");
                    opt.value = newColor.code || newColor.name;
                    opt.textContent =
                      newColor.name +
                      (newColor.code ? " (" + newColor.code + ")" : "");
                    opt.dataset.name = newColor.name;
                    opt.dataset.code = newColor.code || "";
                    opt.dataset.hex = newColor.hex || "";
                    colorSel.appendChild(opt);
                    colorSel.value = opt.value;
                    if (window.SplitSelect) SplitSelect.refresh("i-color-select");
                    colorSel.dispatchEvent(new Event("change"));
                  },
                });
              },
            },
          });
        }

        // [WAREHOUSE-UNIFY-2026-07-28] تحديث عرض "مخزن افتراضي" (للقراءة
        // فقط) في تاب المخزون كل ما المستخدم يغيّر المخزن في تاب عام —
        // العرض ده بس، القيمة الفعلية بتتاخد من i-warehouse وقت الحفظ.
        function _imSyncWarehouseDisplay(whId) {
          var disp = document.getElementById("im-default-wh-display");
          if (!disp) return; // تاب المخزون لسه ما اتفتحش
          var wh = (warehouses || []).find(function (w) {
            return w.id === whId;
          });
          disp.textContent = wh ? wh.name : "— يُحدَّد من حقل «المخزن» في تاب عام —";
        }

        // ── فلترة المجموعات عند تغيير المخزن ───────────────────
        document
          .getElementById("i-warehouse")
          .addEventListener("change", function () {
            var whId = this.value;
            document.getElementById("i-group").innerHTML =
              buildGroupOptions(whId);
            if (window.SplitSelect) SplitSelect.refresh("i-group");
            _imSyncWarehouseDisplay(whId);
          });

        // ── اختيار المخزن تلقائياً عند تغيير المجموعة ───────────
        document
          .getElementById("i-group")
          .addEventListener("change", function () {
            var groupVal = this.value;
            if (!groupVal) return;
            var grp = allGroups.find(function (g) {
              return (
                (g.id || g.prefix) === groupVal ||
                g.id === groupVal ||
                g.prefix === groupVal
              );
            });
            if (!grp || !grp.warehouse_id) return;
            var whSel = document.getElementById("i-warehouse");
            if (!whSel) return;
            // اختار المخزن المناسب
            whSel.value = grp.warehouse_id;
            // لو القيمة ما اتغيرتش (warehouse_id مش موجود في الـ select) → جرب عبر اسم المخزن
            if (!whSel.value || whSel.value !== grp.warehouse_id) {
              var wh = (APP.data.warehouses || []).find(function (w) {
                return w.id === grp.warehouse_id || w.name === grp.warehouse_id;
              });
              if (wh) whSel.value = wh.id;
            }
            // تحديث قائمة المجموعات بدون إعادة اختيار (عشان نحافظ على الاختيار الحالي)
            var currentGroupVal = this.value;
            document.getElementById("i-group").innerHTML = buildGroupOptions(
              whSel.value,
            );
            document.getElementById("i-group").value = currentGroupVal;

  /**
   * hierGroupOptionsHtml — [GROUP-HIERARCHY P6] دالة عامة موحّدة تبني
   * <option> لعنصر <select> بترتيب هرمي (مرتّبة بالمسار الكامل + مسنّنة
   * بمسافات حسب المستوى) بدل قائمة مسطحة. تُستخدم في كل شاشة بتختار
   * مجموعة (الأصناف، كشف الصنف، الفلاتر، التقارير...).
   *
   * @param {Array}  groups        - مصفوفة المجموعات (APP.data.groups أو مفلترة)
   * @param {Object} [opts]
   * @param {String} [opts.selectedId]   - المعرّف المختار حاليًا (id أو prefix)
   * @param {Boolean}[opts.includeEmpty] - يضيف خيار "— اختر المجموعة —" في الأول (افتراضي true)
   * @param {String} [opts.emptyLabel]   - نص خيار الفراغ
   * @param {Boolean}[opts.allOption]    - يضيف خيار "كل المجموعات" (للفلاتر) بدل خيار الفراغ العادي
   * @returns {String} HTML لعناصر <option>
   */
  function hierGroupOptionsHtml(groups, opts) {
    opts = opts || {};
    var selectedId = opts.selectedId != null ? String(opts.selectedId) : "";
    var list = (groups || []).slice().sort(function (a, b) {
      return String(a.full_path || a.name || "").localeCompare(
        String(b.full_path || b.name || ""),
        "ar",
      );
    });
    var head = "";
    if (opts.allOption) {
      head =
        '<option value="">' +
        esc(opts.emptyLabel || "كل المجموعات") +
        "</option>";
    } else if (opts.includeEmpty !== false) {
      head =
        '<option value="">' +
        esc(opts.emptyLabel || "— اختر المجموعة —") +
        "</option>";
    }
    return (
      head +
      list
        .map(function (g) {
          var indent = "\u2007\u2007".repeat(Number(g.level) || 0);
          // [FIX] كان الرمز "└" بيظهر بصريًا كحرف L لاتيني في أغلب
          // الخطوط (شكله الحقيقي مطابق تمامًا لحرف L) — استبدلناه بـ
          // "›" وهو رمز فرعي واضح ومش قابل للالتباس مع أي حرف.
          var mark = Number(g.level) > 0 ? "› " : "";
          var val = esc(g.id || g.prefix);
          var isSel =
            selectedId &&
            (selectedId === String(g.id) || selectedId === String(g.prefix));
          return (
            '<option value="' +
            val +
            '"' +
            (isSel ? " selected" : "") +
            ">" +
            indent +
            mark +
            esc(g.name) +
            " (" +
            esc(g.prefix || "") +
            ")</option>"
          );
        })
        .join("")
    );
  }

  /** تجهيز صفوف المجموعات (اسم المخزن + الأب + عدد الأصناف/الفرعيات) قبل تمريرها لـ ColumnEngine */
  function _groupsPrepareRowsForCE(flatTree) {
    var warehouses = APP.data.warehouses || [];
    var byId = {};
    (flatTree || []).forEach(function (g) {
      byId[g.id] = g;
    });
    return (flatTree || [])
      .slice()
      .sort(function (a, b) {
        return String(a.full_path || "").localeCompare(
          String(b.full_path || ""),
          "ar",
        );
      })
      .map(function (g) {
        var whId = g.warehouse_id || "";
        var wh = warehouses.find(function (w) {
          return w.id === whId || w.name === whId;
        });
        var row = Object.assign({}, g);
        row.warehouse_name = wh ? wh.name : whId || "غير محدد";
        row.parent_name =
          g.parent_id && byId[g.parent_id] ? byId[g.parent_id].name : "";
        row.children_count = (g.children || []).length;
        return row;
      });
  }

  // ── العرض الشجري (Tree View) — GROUP-HIERARCHY P3 ──────────────
  // Lazy rendering بسيط: العقد المطوية (collapsed) ما بتُبنى عناصر
  // أبنائها في الـ DOM أصلًا إلا وقت التوسيع، فمهما كبر عدد المجموعات
  // الشجرة بتفضل خفيفة عند فتح الشاشة أول مرة (كل الجذور مطوية افتراضيًا
  // لو عدد العقد الكلي كبير).
  function _groupMatchesSearch(node, q) {
    if (!q) return true;
    q = q.toLowerCase();
    return (
      String(node.name || "")
        .toLowerCase()
        .indexOf(q) !== -1 ||
      String(node.full_path || "")
        .toLowerCase()
        .indexOf(q) !== -1 ||
      String(node.prefix || "")
        .toLowerCase()
        .indexOf(q) !== -1
    );
  }

  function _groupSubtreeMatchesSearch(node, q) {
    if (_groupMatchesSearch(node, q)) return true;
    return (node.children || []).some(function (c) {
      return _groupSubtreeMatchesSearch(c, q);
    });
  }

  // أعمدة العرض الشجري — عرض ثابت لكل عمود عشان يفضل محاذي مع الهيدر
  // في كل المستويات (العمود الأول بس بيتحرك بالـ indent حسب العمق)

    if (!whId) return "—";
    var wh = (APP.data.warehouses || []).find(function (w) {
      return w.id === whId || w.name === whId;
    });
    return wh ? wh.name : whId;
  }

  function _renderGroupTreeNode(node, depth) {
    var q = _groupsSearchQuery;
    if (q && !_groupSubtreeMatchesSearch(node, q)) return "";

    var hasChildren = (node.children || []).length > 0;
    var expanded = q ? true : !!_groupsExpanded[node.id];
    var icon = hasChildren
      ? expanded
        ? "ti-folder-open"
        : "ti-folder"
      : "ti-folder-symlink";

    var childrenHtml = "";
    if (hasChildren && expanded) {
      childrenHtml =
        '<div class="grp-tree-children" style="display:block">' +
        node.children
          .map(function (c) {
            return _renderGroupTreeNode(c, depth + 1);
          })
          .join("") +
        "</div>";
    }

    var whName = _grpTreeWarehouseName(node.warehouse_id);

    return (
      '<div class="grp-tree-node" data-id="' +
      esc(node.id) +
      '">' +
      '<div class="grp-tree-row" data-id="' +
      esc(node.id) +
      '" style="display:flex;align-items:center;gap:0;padding:7px 10px;border-radius:8px;cursor:pointer;min-width:max-content" ' +
      "onmouseover=\"this.style.background='var(--hover,#f3f4f6)'\" onmouseout=\"this.style.background=''\">" +

      depth * 22 +
      'px">' +
      (hasChildren
        ? '<i class="ti ti-chevron-' +
          (expanded ? "down" : "left") +
          ' grp-tree-toggle" data-id="' +
          esc(node.id) +
          '" style="font-size:14px;color:var(--text3);cursor:pointer;width:16px;flex-shrink:0"></i>'
        : '<span style="width:16px;display:inline-block;flex-shrink:0"></span>') +
      '<i class="ti ' +
      icon +
      '" style="font-size:17px;color:#7c3aed;flex-shrink:0"></i>' +
      '<b style="font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' +
      esc(node.full_path || node.name) +
      '">' +
      esc(node.name) +
      "</b>" +
      "</div>" +
      // ── عمود الكود ──
      '<div class="mono" style="width:' +
      GRP_TREE_COLS[0].width +
      'px;flex-shrink:0;text-align:center;font-size:12.5px;font-weight:700;color:var(--text2,var(--text))">' +
      esc(node.prefix || "—") +
      "</div>" +
      // ── عمود المخزن ──
      '<div style="width:' +
      GRP_TREE_COLS[1].width +
      'px;flex-shrink:0;text-align:center;font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' +
      esc(whName) +
      '">' +
      esc(whName) +
      "</div>" +
      // ── عمود المستوى ──
      '<div style="width:' +
      GRP_TREE_COLS[2].width +
      'px;flex-shrink:0;text-align:center;font-size:12px;color:var(--text3)">' +
      depth +
      "</div>" +

  function _renderGroupsTreeView(container, tree) {
    if (!container) return;
    if (!tree || !tree.length) {
      container.innerHTML =
        '<div style="padding:40px;text-align:center;color:var(--text3)">لا توجد مجموعات بعد — ابدأ بإضافة مجموعة رئيسية</div>';

    }
    container.innerHTML =
      '<div class="grp-tree-toolbar" style="display:flex;gap:8px;padding:8px 4px 14px;border-bottom:1px solid var(--border);margin-bottom:8px">' +
