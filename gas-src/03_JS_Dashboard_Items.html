    // ── تفويض الأحداث (Event Delegation) ──
    container.querySelectorAll(".grp-tree-toggle").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = this.getAttribute("data-id");
        _groupsExpanded[id] = !_groupsExpanded[id];
        _renderGroupsTreeView(container, _groupsTreeData.tree);
      });
    });
    container.querySelectorAll(".grp-tree-row").forEach(function (el) {
      // [FIX] الضغط على الصف بقى مايفتحش شاشة التعديل تلقائي (كان
      // بيسبب فتح المودال بالغلط لمجرد الضغط للتصفح/التوسيع). التعديل
      // بقى حصري عن طريق الزر الأيمن (قائمة سياقية) أو زر "تعديل" الصريح.
      // قائمة سياقية بالزر الأيمن — نفس نوع "groups" المستخدم في الجدول
      el.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var id = this.getAttribute("data-id");
        var node = _findGroupInFlat(id);
        if (node && window.CTX) CTX.open("groups", node, e.clientX, e.clientY);
      });

      // ── Drag & Drop حقيقي — GROUP-HIERARCHY P5 ──────────────────
      el.setAttribute("draggable", "true");
      el.addEventListener("dragstart", function (e) {
        e.stopPropagation();
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", this.getAttribute("data-id"));
        this.style.opacity = "0.4";
      });
      el.addEventListener("dragend", function () {
        this.style.opacity = "";
        container.querySelectorAll(".grp-tree-row").forEach(function (r) {
          r.style.outline = "";
          r.style.background = "";
        });
      });
      el.addEventListener("dragover", function (e) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = "move";
        this.style.outline = "2px dashed #7c3aed";
        this.style.background = "#f5f3ff";
      });
      el.addEventListener("dragleave", function () {
        this.style.outline = "";
        this.style.background = "";
      });
      el.addEventListener("drop", function (e) {
        e.preventDefault();
        e.stopPropagation();
        this.style.outline = "";
        this.style.background = "";
        var draggedId = e.dataTransfer.getData("text/plain");
        var targetId = this.getAttribute("data-id");
        if (!draggedId || draggedId === targetId) return;
        _moveGroupViaDragDrop(draggedId, targetId);
      });
    });

    // إفلات فوق منطقة فاضية بالشجرة (خارج أي عقدة) = ترقية لمجموعة رئيسية
    var treeBody = document.getElementById("grp-tree-body");
    if (treeBody) {
      treeBody.addEventListener("dragover", function (e) {
        if (e.target === treeBody) e.preventDefault();
      });
      treeBody.addEventListener("drop", function (e) {
        if (e.target !== treeBody) return;
        e.preventDefault();
        var draggedId = e.dataTransfer.getData("text/plain");
        if (draggedId) _moveGroupViaDragDrop(draggedId, "");
      });
    }
    var expandAllBtn = document.getElementById("grp-expand-all");
    if (expandAllBtn)
      expandAllBtn.addEventListener("click", function () {
        (_groupsTreeData.flat || []).forEach(function (g) {
          _groupsExpanded[g.id] = true;
        });
        _renderGroupsTreeView(container, _groupsTreeData.tree);
      });
    var collapseAllBtn = document.getElementById("grp-collapse-all");
    if (collapseAllBtn)
      collapseAllBtn.addEventListener("click", function () {
        _groupsExpanded = {};
        _renderGroupsTreeView(container, _groupsTreeData.tree);
      });
  }

  /**
   * _moveGroupViaDragDrop — [GROUP-HIERARCHY P5] ينفّذ نقل مجموعة (Drag & Drop)
   * فوق مجموعة تانية (targetId) أو لمنطقة فاضية (targetId = "" = تترقّى لجذر).
   * بيتحقق أولًا محليًا (بدون Round-trip) إن النقل مش هيكوّن حلقة دائرية،
   * والباك إند بيعيد نفس التحقق كخط دفاع تاني (updateGroup).
   */
  function _isDescendantGroupClient(flat, groupId, candidateId) {
    if (!candidateId) return false;
    if (String(candidateId) === String(groupId)) return true;
    var byId = {};
    (flat || []).forEach(function (g) {
      byId[g.id] = g;
    });
    var cur = byId[candidateId];
    var guard = 0;
    while (cur && cur.parent_id && guard < 500) {
      if (String(cur.parent_id) === String(groupId)) return true;
      cur = byId[cur.parent_id];
      guard++;
    }
    return false;
  }

  function _moveGroupViaDragDrop(draggedId, targetId) {
    var group = _findGroupInFlat(draggedId);
    if (!group) return;
    if (String(draggedId) === String(targetId)) return;
    if (
      targetId &&
      _isDescendantGroupClient(_groupsTreeData.flat, draggedId, targetId)
    ) {
      NotificationEngine.error(" علاقة دائرية: لا يمكن نقل المجموعة داخل أحد أبنائها");
      return;
    }
    if (String(group.parent_id || "") === String(targetId || "")) return; // مفيش تغيير فعلي

    var data = {
      id: group.id,
      name: group.name,
      prefix: group.prefix,
      warehouse_id: group.warehouse_id,
      notes: group.notes || "",
      parent_id: targetId || "",
      user: APP.currentUser ? APP.currentUser.username : "SYSTEM",
      sessionToken: SESSION ? SESSION.token : null,
    };
    _freezeUI("⏳ جاري نقل المجموعة...");
    _gsr("updateGroup", [data], {
      onSuccess: function (r) {
        _unfreezeUI();
        NotificationEngine.success(r.message);
        // [FIX] نفس مشكلة moveGroupPrompt — كان ناقص optimisticPatch
        // فالسحب والإفلات كان بينقل فعليًا لكن الشجرة ما كانتش بترجع
        // ترسم فورًا بالمكان الجديد.

  /**
   * [FIX] _buildGroupsTreeLocal — بنفس منطق getGroupsTree() في الباك إند
   * بالظبط، لكن محليًا من APP.data.groups/APP.data.items اللي أصلاً محمّلة
   * في الذاكرة من أول تحميل التطبيق (وبتتحدّث فورًا مع كل عملية عن طريق
   * الـ optimisticPatch في reloadAfterMutation). كده شاشة المجموعات بترسم
   * فورًا زي باقي الشاشات، من غير ما تستنى رحلة سيرفر (getGroupsTree)
   * في كل مرة بتدخل عليها.
   */
  function _buildGroupsTreeLocal() {
    var all = (APP.data && APP.data.groups) || [];
    var items = (APP.data && APP.data.items) || [];
    var itemCountByGroup = {};
    items.forEach(function (it) {
      if (!it.group) return;
      itemCountByGroup[it.group] = (itemCountByGroup[it.group] || 0) + 1;
    });

    var byId = {};
    all.forEach(function (g) {
      byId[g.id] = {
        id: g.id,
        name: g.name,
        prefix: g.prefix,
        warehouse_id: g.warehouse_id,
        notes: g.notes,
        parent_id: g.parent_id || "",
        level: Number(g.level) || 0,
        full_path: g.full_path || g.name,
        sort_order: Number(g.sort_order) || 0,
        has_children: !!g.has_children,
        item_count: itemCountByGroup[g.id] || 0,
        children: [],
      };
    });

    var roots = [];
    all.forEach(function (g) {
      var node = byId[g.id];
      if (g.parent_id && byId[g.parent_id]) {
        byId[g.parent_id].children.push(node);
      } else {
        roots.push(node);
      }
    });

    function sortChildren(list) {
      list.sort(function (a, b) {
        return (
          a.sort_order - b.sort_order ||
          String(a.name || "").localeCompare(String(b.name || ""), "ar")
        );
      });
      list.forEach(function (n) {
        if (n.children.length) sortChildren(n.children);
      });
    }
    sortChildren(roots);

    return { tree: roots, flat: Object.values(byId) };
  }

  /** يجلب شجرة المجموعات من الباك إند (getGroupsTree) ويخزّنها في _groupsTreeData */
  function _loadGroupsTree(cb) {
    _gsr("getGroupsTree", null, {
      onSuccess: function (res) {
        var r = res.data;
        _groupsTreeData = { tree: r.tree || [], flat: r.flat || [] };
        cb && cb();
      },
      onError: function (r) {
        _groupsTreeData = { tree: [], flat: [] };
        NotificationEngine.error("خطأ في تحميل شجرة المجموعات: " + (r.message || ""));
        cb && cb();
      },
    });
  }

  // نافذة اختيار مجموعة أم بشكل هرمي (بحث + توسيع/طي) بدل قائمة منسدلة
  // مسطحة. تُستخدم في: حقل "المجموعة الأم" بمودال المجموعة، وأمر
  // "نقل إلى مجموعة أخرى" من القائمة السياقية للشجرة.
  function openGroupTreeSelect(opts) {
    opts = opts || {};
    var excludeId = opts.excludeId || null; // امنع اختيار المجموعة نفسها أو أحد أبنائها
    var onSelect = opts.onSelect || function () {};
    var tree = (_groupsTreeData && _groupsTreeData.tree) || [];

    function isExcludedSubtree(node) {
      if (!excludeId) return false;
      if (String(node.id) === String(excludeId)) return true;
      return (node.children || []).some(isExcludedSubtree);
    }

    function renderPickerNode(node, depth) {
      if (isExcludedSubtree(node)) return "";
      var hasChildren = (node.children || []).length > 0;
      return (
        '<div style="margin-right:' +
        depth * 18 +
        'px">' +
        '<div class="grp-pick-row" data-id="' +
        esc(node.id) +
        '" data-path="' +
        esc(node.full_path || node.name) +
        '" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer">' +
        '<i class="ti ti-folder" style="font-size:15px;color:#7c3aed"></i>' +
        "<span>" +
        esc(node.name) +
        "</span>" +
        '<span class="mono" style="font-size:10px;color:var(--text3)">' +
        esc(node.prefix || "") +
        "</span>" +
        "</div>" +
        (hasChildren
          ? node.children.map((c) => renderPickerNode(c, depth + 1)).join("")
          : "") +
        "</div>"
      );
    }

    var bodyHtml =
      '<div class="modal-body" style="min-width:0">' +
      '<input class="input" id="grp-pick-search" placeholder="ابحث بالاسم أو المسار..." style="margin-bottom:10px;width:100%">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;background:var(--hover,#f3f4f6);margin-bottom:6px" id="grp-pick-root">' +

      "</div>" +
      '<div id="grp-pick-list" style="max-height:min(60vh,520px);overflow-y:auto;overflow-x:hidden">' +
      tree.map((n) => renderPickerNode(n, 0)).join("") +

      "</div>";

    // [FIX-NESTED-DRAWER] كان بيتفتح كـ openStyledDrawer عادي، وده كان بيقفل
    // (يدمر) أي drawer شغال قبله (مودال إضافة/تعديل المجموعة) لأن كلاهما
    // بيستخدم نفس عنصر #edit-drawer. النتيجة: بعد اختيار المجموعة الأم كانت

    // مكنش بيتحفظ. الحل: نافذة مستقلة (overlay) فوق أي drawer شغال من

      "display:flex;flex-direction:column;overflow:hidden";

      "<h2>اختيار المجموعة الأم</h2>" +

  // [COLOR-INLINE-ADD-2026-08-07] إضافة لون عام سريع من جوه فورم الصنف —

  // addColor في شيت الألوان العامة "تعريف الألوان" (مش خاص بالصنف).
  // opts = { onCreated: function(newColor) }
  function openQuickAddColor(opts) {
    opts = opts || {};
    var onCreated = opts.onCreated || function () {};

    closeQuickAddColorOverlay();

    var backdrop = document.createElement("div");
    backdrop.id = "qac-backdrop";
    backdrop.style.cssText =
      "position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9800;animation:drawerBgIn .18s ease";
    backdrop.addEventListener("click", function () {
      closeQuickAddColorOverlay();
    });
    document.body.appendChild(backdrop);

    var panel = document.createElement("div");
    panel.id = "qac-panel";
    panel.style.cssText =
      "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);" +
      "width:min(420px,92vw);z-index:9801;" +
      "background:var(--bg);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);" +
      "display:flex;flex-direction:column;overflow:hidden";
    panel.innerHTML =
      '<div class="sd-header" style="background:linear-gradient(135deg,#0f766e,#5eead4)">' +
      '<div class="sd-header-icon"><i class="ti ti-palette"></i></div>' +
      '<div class="sd-header-text">' +
      "<h2>لون جديد</h2>" +
      "<p>إضافة سريعة بدون مغادرة شاشة الصنف</p>" +
      "</div>" +
      '<div class="sd-close" id="qac-close"><i class="ti ti-x"></i></div>' +
      "</div>" +
      '<div class="sd-body"><div class="modal-body"><div class="form-grid">' +
      '<div class="field full">' +
      "<label>اسم اللون *</label>" +
      '<input class="input" id="qac-name" placeholder="مثال: أحمر">' +
      "</div>" +
      '<div class="field">' +
      "<label>الكود *</label>" +
      '<input class="input" id="qac-code" data-allow-alpha="true" placeholder="مثال: RED" style="font-family:var(--font-mono);text-transform:uppercase">' +
      "</div>" +
      '<div class="field">' +
      "<label>اللون (اختياري)</label>" +
      '<div style="position:relative;display:flex;align-items:center">' +
      '<input class="input" id="qac-hex" placeholder="#RRGGBB" style="padding-left:36px;font-family:var(--font-mono)">' +
      '<span id="qac-preview" style="position:absolute;left:10px;width:16px;height:16px;border-radius:50%;background:#e2e8f0;border:1.5px solid rgba(0,0,0,.2);cursor:pointer;flex-shrink:0" title="اختر لوناً" onclick="document.getElementById(\'qac-picker\').click()"></span>' +
      '<input type="color" id="qac-picker" style="position:absolute;left:0;opacity:0;width:0;height:0;pointer-events:none">' +
      "</div></div>" +
      "</div></div></div>" +
      '<div class="sd-footer">' +
      '<button class="btn btn-outline" id="qac-cancel">إلغاء</button>' +
      '<button class="btn btn-primary" id="qac-save"><i class="ti ti-palette"></i> إضافة</button>' +
      "</div>";
    document.body.appendChild(panel);

    function escHandler(e) {
      if (e.key === "Escape") closeQuickAddColorOverlay();
    }
    panel._escHandler = escHandler;
    document.addEventListener("keydown", escHandler, true);

    function closeQuickAddColorOverlay() {
      var bd = document.getElementById("qac-backdrop");
      var pn = document.getElementById("qac-panel");
      if (pn && pn._escHandler)
        document.removeEventListener("keydown", pn._escHandler, true);
      if (bd && bd.parentNode) bd.remove();
      if (pn && pn.parentNode) pn.remove();
    }

    document
      .getElementById("qac-close")
      .addEventListener("click", closeQuickAddColorOverlay);
    document
      .getElementById("qac-cancel")
      .addEventListener("click", closeQuickAddColorOverlay);

    var nameEl = document.getElementById("qac-name");
    var codeEl = document.getElementById("qac-code");
    var hexEl = document.getElementById("qac-hex");
    var pickerEl = document.getElementById("qac-picker");
    var previewEl = document.getElementById("qac-preview");

    // [COLOR-INLINE-ADD-AUTOFILL-2026-08-08] نفس منطق شاشة "تعريف الألوان"
    // بالحرف: خريطة كود سريعة محلية + colorNameToHex فوري + تأكيد/تحسين
    // من السيرفر (resolveColorsBatch: بحث إنترنت للإنجليزي / AI للعربي).
    var QAC_CODE_MAP = {
      أحمر: "RED", احمر: "RED", red: "RED",
      أسود: "BLK", اسود: "BLK", black: "BLK",
      أبيض: "WHT", ابيض: "WHT", white: "WHT",
      أزرق: "BLU", ازرق: "BLU", blue: "BLU",
      أخضر: "GRN", اخضر: "GRN", green: "GRN",
      أصفر: "YEL", اصفر: "YEL", yellow: "YEL",
      بني: "BRN", بنى: "BRN", brown: "BRN",
      بيج: "BEI", beige: "BEI",
      رمادي: "GRY", رمادى: "GRY", grey: "GRY", gray: "GRY",
      كحلي: "NVY", كحلى: "NVY", navy: "NVY",
      زيتي: "OLV", زيتى: "OLV", olive: "OLV",
      بنفسجي: "PRP", بنفسجى: "PRP", purple: "PRP",
      وردي: "PNK", وردى: "PNK", ورده: "PNK", pink: "PNK",
      برتقالي: "ORG", برتقالى: "ORG", orange: "ORG",
      ذهبي: "GLD", ذهبى: "GLD", gold: "GLD",
      فضي: "SLV", فضى: "SLV", silver: "SLV",
      تركوازي: "TRQ", تركواز: "TRQ", turquoise: "TRQ",
      نبيتي: "WNE", نبيذي: "WNE", wine: "WNE",
      كريمي: "CRM", كريمى: "CRM", cream: "CRM",
      سلموني: "SAL", salmon: "SAL",
      تيل: "TEL", teal: "TEL",
      خمري: "MAR", خمرى: "MAR", maroon: "MAR",
      نيلي: "IND", نيلى: "IND", indigo: "IND",
      فيروزي: "CYN", فيروزى: "CYN", cyan: "CYN",
    };
    function _qacNormArabic(s) {
      return (s || "").trim().toLowerCase()
        .replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");
    }
    function _qacLookupQuickCode(nameVal) {
      var trimmed = (nameVal || "").trim();
      if (!trimmed) return null;
      if (QAC_CODE_MAP[trimmed]) return QAC_CODE_MAP[trimmed];
      if (QAC_CODE_MAP[trimmed.toLowerCase()]) return QAC_CODE_MAP[trimmed.toLowerCase()];
      var norm = _qacNormArabic(trimmed);
      for (var k in QAC_CODE_MAP) {
        if (_qacNormArabic(k) === norm) return QAC_CODE_MAP[k];
      }
      return null;
    }

    var codeManuallyEdited = false;
    var hexManuallyEdited = false;
    var qacAiTimer = null;
    var qacAiLastName = "";

    function _qacApplyHex(hex) {
      if (!hex || !/^#[0-9a-fA-F]{6}$/i.test(hex)) return;
      if (previewEl) previewEl.style.background = hex;
      if (pickerEl) pickerEl.value = hex;
      if (!hexManuallyEdited) hexEl.value = hex;
    }
    function _qacApplyCode(code) {
      if (!code) return;
      if (!codeManuallyEdited) codeEl.value = code.toUpperCase();
    }
    function _qacRequestServerSuggestion(name) {
      if (!name || name.length < 2) return;
      qacAiLastName = name;
      _gsr("resolveColorsBatch", [[name]], {
        onSuccess: function (result) {
          if ((nameEl.value || "").trim() !== qacAiLastName) return;
          var info = result && result[qacAiLastName];
          if (info && info.hex) {
            _qacApplyHex(info.hex);
            _qacApplyCode(info.code);
          }
        },
        onError: function () {},
      });
    }

    if (nameEl) {
      nameEl.focus();
      nameEl.addEventListener("input", function () {
        var n = this.value;
        var nameNow = n.trim();

        // 1) كود فوري من الخريطة المحلية
        if (!codeManuallyEdited) {
          var quickCode = _qacLookupQuickCode(n);
          if (quickCode) codeEl.value = quickCode;
        }

        // 2) hex فوري من colorNameToHex العامة (نفس دالة باقي النظام)
        if (typeof colorNameToHex === "function") {
          var autoHex = colorNameToHex(n);
          if (autoHex && /^#[0-9a-fA-F]{6}$/i.test(autoHex)) {
            if (previewEl) previewEl.style.background = autoHex;
            if (!hexManuallyEdited) hexEl.value = autoHex;
            if (pickerEl) pickerEl.value = autoHex;
          }
        }

        // 3) بعد وقفة كتابة قصيرة، اطلب تأكيد/تحسين من السيرفر
        if (qacAiTimer) clearTimeout(qacAiTimer);
        if (nameNow.length < 2) return;
        qacAiTimer = setTimeout(function () {
          _qacRequestServerSuggestion(nameNow);
        }, 500);
      });
      nameEl.addEventListener("blur", function () {
        var n = this.value.trim();
        if (!codeEl.value.trim() && !codeManuallyEdited) {
          codeEl.value =
            _qacLookupQuickCode(n) ||
            n.replace(/\s+/g, "").substring(0, 3).toUpperCase();
        }
        if (!hexEl.value.trim() && !hexManuallyEdited) {
          var autoHex = typeof colorNameToHex === "function" ? colorNameToHex(n) : null;
          if (autoHex && /^#[0-9a-fA-F]{6}$/i.test(autoHex)) _qacApplyHex(autoHex);
        }
      });
    }
    if (codeEl) {
      codeEl.addEventListener("input", function () {
        codeManuallyEdited = this.value.trim() !== "";
        this.value = this.value.toUpperCase();
      });
    }
    if (pickerEl) {
      pickerEl.addEventListener("input", function () {
        hexManuallyEdited = true;
        if (hexEl) hexEl.value = this.value;
        if (previewEl) previewEl.style.background = this.value;
      });
    }
    if (hexEl) {
      hexEl.addEventListener("input", function () {
        hexManuallyEdited = true;
        var v = this.value.trim();
        if (/^#[0-9a-fA-F]{6}$/.test(v)) {
          if (previewEl) previewEl.style.background = v;
          if (pickerEl) pickerEl.value = v;
        }
      });
    }

    document
      .getElementById("qac-save")
      .addEventListener("click", function (evt) {
        var btnEl = evt.currentTarget;
        if (btnEl.disabled) return;

        var data = {
          name: (nameEl.value || "").trim(),
          code: (codeEl.value || "").trim().toUpperCase(),
          hex: (hexEl.value || "").trim(),
          notes: "",
          user: APP.currentUser ? APP.currentUser.username : "SYSTEM",
          sessionToken: SESSION ? SESSION.token : null,
        };
        // لو الـ HEX لسه فاضي وقت الحفظ → احسبه أوتوماتيك من الاسم
        if (!data.hex && data.name && typeof colorNameToHex === "function") {
          var fallbackHex = colorNameToHex(data.name);
          if (fallbackHex && /^#[0-9a-fA-F]{6}$/i.test(fallbackHex)) {
            data.hex = fallbackHex;
          }
        }
        if (!data.name) return NotificationEngine.error("اسم اللون مطلوب");
        if (!data.code) return NotificationEngine.error("كود اللون مطلوب");

        btnEl.disabled = true;
        _gsr("addColor", [data], {
          onSuccess: function (r) {
            btnEl.disabled = false;
            NotificationEngine.success((r && r.message) || "تم إضافة اللون");
            var newColor = Object.assign({}, data, {
              id: (r && r.id) || data.code,
            });
            APP.data.colors = APP.data.colors || [];
            APP.data.colors.push(newColor);
            closeQuickAddColorOverlay();
            onCreated(newColor);
          },
          onError: function (r) {
            btnEl.disabled = false;
            NotificationEngine.error((r && r.message) || "فشل إضافة اللون");
          },
        });
      });
  }

        if (clearBtn)
          clearBtn.addEventListener("click", function () {
            refreshParentUI({ id: "", full_path: "" });
          });

        document
          .getElementById("save-group-btn")
          .addEventListener("click", function (evt) {
            // [FIX] منع الضغط المزدوج السريع على زرار الحفظ من إرسال طلبين
            // addGroup في نفس اللحظة (كان بيسبب تكرار المجموعة في الشيت رغم
            // فحص تكرار الرمز، لأن الطلبين بيقروا البيانات قبل ما أي منهم يكتب)
            var btnEl = evt.currentTarget;
            if (btnEl.disabled) return;
            btnEl.disabled = true;

            var data = {
              id: isEdit ? group.id : null,
              name: document.getElementById("group-name").value.trim(),
              prefix: document.getElementById("group-prefix").value.trim(),
              warehouse_id: document.getElementById("group-warehouse").value,
              notes: document.getElementById("group-notes").value.trim(),
              parent_id: document
                .getElementById("group-parent-id")
                .value.trim(),
              user: APP.currentUser ? APP.currentUser.username : "SYSTEM", // FIX
              sessionToken: SESSION ? SESSION.token : null, // FIX: بدونه الباك إند يرفض الحفظ دايمًا
            };

            if (!data.name) {
              btnEl.disabled = false;
              return NotificationEngine.error("اسم المجموعة مطلوب");
            }
            if (!data.prefix) {
              btnEl.disabled = false;
              return NotificationEngine.error("رمز المجموعة (Prefix) مطلوب");
            }
            if (!data.warehouse_id) {
              btnEl.disabled = false;
              return NotificationEngine.error("يجب اختيار المخزن");
            }
            if (isEdit && data.parent_id === group.id) {
              btnEl.disabled = false;
              return NotificationEngine.error("لا يمكن أن تكون المجموعة أبًا لنفسها");
            }

            var fn = isEdit ? "updateGroup" : "addGroup";
            // [FIX] كان بايباس يدوي كامل (_gsr مباشرة + _freezeUI يدوي) بدون
            // خط الدفاع الموحّد لمنع الضغط المزدوج ولا تسجيل مركزي (SaveLogger).
            // اتحوّل لـ SaveEngine.run بنفس الـpayload، مع الحفاظ على نفس الـ
            // Soft-Save UX (إغلاق المودال فورًا + freeze) عبر closeFn.
            SaveEngine.run({
              screen: "Groups",
              entity: "group",
              recordId: isEdit ? group.id : null,
              data: data,
              closeFn: function () {
                closeModal();
                _freezeUI(
                  isEdit
                    ? "⏳ جاري حفظ المجموعة..."
                    : "⏳ جاري إضافة المجموعة...",
                );
              },
              fn: fn,
              params: function (d) {
                return [d];
              },
              onSuccess: function (r) {
                _unfreezeUI();
                NotificationEngine.success(r.message);
                var patchedGroup = Object.assign({}, data, {
                  id: isEdit ? group.id : r.id || data.prefix,
                });
                // [FIX] مفيش داعي لرحلة سيرفر تانية (getGroupsTree) —
                // bindGroups هترسم الشجرة فورًا من APP.data بعد الـ optimisticPatch
                reloadAfterMutation(
                  function () {
                    renderPage("groups");
                  },
                  null,
                  {
                    emoji: "",
                    successMsg: isEdit
                      ? "تم حفظ المجموعة "
                      : "تم إضافة المجموعة ",
                  },
                  {
                    collection: "groups",
                    record: patchedGroup,
                    op: isEdit ? "update" : "add",
                    idField: "id",
                  },
                );
              },
              onError: function (r) {
                _unfreezeUI();
                NotificationEngine.error(r.message);
              },
            });
          });
      },
    });
  }

  // ── تعديل وإضافة فرعية ونقل وحذف المجموعات ──────────────────
  function editGroup(id) {
    var group =
      _findGroupInFlat(id) || APP.data.groups.find((g) => g.id === id);
    if (group) openGroupModal(group);
  }

  /** إضافة مجموعة فرعية جديدة تحت مجموعة معيّنة مباشرة (من القائمة السياقية) */
  function addSubGroup(parentId) {
    var parent = _findGroupInFlat(parentId);
    openGroupModal(null);
    // نملأ الأب بعد فتح المودال مباشرة (أسهل من تمرير باراميتر إضافي لكل الدالة)
    setTimeout(function () {
      var idEl = document.getElementById("group-parent-id");
      var dispEl = document.getElementById("group-parent-display");
      var whEl = document.getElementById("group-warehouse");
      if (idEl && parent) {
        idEl.value = parent.id;
        dispEl.value = parent.full_path || parent.name;
        if (whEl && parent.warehouse_id) whEl.value = parent.warehouse_id;
      }
    }, 60);
  }

  /** نقل مجموعة إلى أب جديد (Drag & Drop المبسّط عبر القائمة السياقية) */
  function moveGroupPrompt(id) {
    var group = _findGroupInFlat(id);
    if (!group) return;
    openGroupTreeSelect({
      excludeId: id,
      onSelect: function (parent) {
        if (String(parent.id || "") === String(group.parent_id || "")) return; // مفيش تغيير
        var data = {
          id: group.id,
          name: group.name,
          prefix: group.prefix,
          warehouse_id: group.warehouse_id,
          notes: group.notes || "",
          parent_id: parent.id || "",
          user: APP.currentUser ? APP.currentUser.username : "SYSTEM",
          sessionToken: SESSION ? SESSION.token : null,
        };
        _freezeUI("⏳ جاري نقل المجموعة...");
        _gsr("updateGroup", [data], {
          onSuccess: function (r) {
            _unfreezeUI();
            NotificationEngine.success(r.message);
            // [FIX] كان ناقص optimisticPatch هنا، فالشاشة كانت بتفضل
            // عارضة المكان القديم للمجموعة (البيانات المحلية APP.data
            // ما اتحدّتش) لحد ما تجي مزامنة الخلفية بعد شوية. دلوقتي
            // بنحدّث الكاش المحلي فورًا زي أي عملية تعديل تانية للمجموعات.
            var patchedGroup = Object.assign({}, group, {
              parent_id: data.parent_id,
            });
            reloadAfterMutation(
              function () {
                renderPage("groups");
              },
              null,
              { emoji: "", successMsg: "تم نقل المجموعة " },
              {
                collection: "groups",
                record: patchedGroup,
                op: "update",
                idField: "id",
              },
            );
          },
          onError: function (r) {
            _unfreezeUI();
            NotificationEngine.error(r.message);
          },
        });
      },
    });
  }

  function deleteGroupConfirm(id) {
    var node = _findGroupInFlat(id);
    var childrenCount = node ? (node.children || []).length : 0;
    var itemCount = node ? Number(node.item_count || 0) : 0;

    // ── حالة بسيطة: مفيش فرعيات ولا أصناف → تأكيد عادي وحذف مباشر ──
    if (!childrenCount && !itemCount) {
      showConfirm({
        icon: "ti-folders",
        iconColor: "#0891b2",
        title: "حذف مجموعة",
        message: "هل أنت متأكد من حذف هذه المجموعة؟",
        confirmText: "حذف",
        confirmClass: "btn-danger",
        onConfirm: function (unfreeze) {
          _gsr(
            "deleteGroup",
            [
              id,
              APP.currentUser ? APP.currentUser.username : "",
              SESSION ? SESSION.token : null, // [FIX] كان ناقص فيسبب رفض دائم من _checkPermission
            ],
            {
              onSuccess: function (r) {
                NotificationEngine.success(r.message);
                // [FIX] مفيش داعي لرحلة سيرفر تانية (getGroupsTree)
                reloadAfterMutation(
                  function () {
                    renderPage("groups");
                  },
                  unfreeze,
                  { emoji: "", successMsg: "تم حذف المجموعة " },
                  {
                    collection: "groups",
                    record: { id: String(id) },
                    op: "remove",
                    idField: "id",
                  },
                );
              },
              onError: function (r) {
                unfreeze();
                NotificationEngine.error(r.message || "خطأ");
              },
            },
          );
        },
      });
      return;
    }

    // ── حالة فيها تبعيات (فرعيات و/أو أصناف) — [GROUP-HIERARCHY P7] ──
    // اعرض شاشة اختيار وجهة بديلة للفرعيات والأصناف قبل السماح بالحذف.
    var moveChildrenTo = "";
    var moveItemsTo = "";

    openStyledDrawer({
      title: "حذف مجموعة: " + (node ? node.name : ""),
      subtitle: "المجموعة دي عندها تبعيات — لازم تحدد وجهة بديلة قبل الحذف",
      icon: "ti-alert-triangle",
      color: "red",
      width: 560,
      body:
        '<div class="modal-body">' +
        (childrenCount
          ? '<div class="field full" style="margin-bottom:14px">' +
            "<label>نقل " +
            childrenCount +
            " مجموعة فرعية إلى:</label>" +
            '<div style="display:flex;gap:8px;align-items:center">' +
            '<input class="input" id="del-children-target-display" readonly value="— مجموعات رئيسية (بدون أب) —" style="flex:1;cursor:pointer;background:var(--card,#fafafa)">' +
            '<button type="button" class="btn btn-outline btn-sm" id="del-children-target-pick"><i class="ti ti-sitemap"></i> اختيار</button>' +
            "</div></div>"
          : "") +
        (itemCount
          ? '<div class="field full">' +
            "<label>نقل " +
            itemCount +
            ' صنف مرتبط إلى مجموعة <span style="color:#ef4444">*</span>:</label>' +
            '<select class="input" id="del-items-target">' +
            hierGroupOptionsHtml(_groupsTreeData ? _groupsTreeData.flat : [], {
              selectedId: "",
            }) +
            "</select></div>"
          : "") +
        "</div>",
      footer:
        '<button class="btn btn-outline" onclick="closeStyledDrawer()">إلغاء</button>' +
        '<button class="btn btn-danger" id="del-cascade-btn"><i class="ti ti-trash"></i> حذف ونقل التبعيات</button>',
      onReady: function () {
        var pickBtn = document.getElementById("del-children-target-pick");
        if (pickBtn)
          pickBtn.addEventListener("click", function () {
            openGroupTreeSelect({
              excludeId: id,
              onSelect: function (parent) {
                moveChildrenTo = parent.id || "";
                document.getElementById("del-children-target-display").value =
                  parent.full_path || "— مجموعات رئيسية (بدون أب) —";
              },
            });
          });

        document
          .getElementById("del-cascade-btn")
          .addEventListener("click", function () {
            var itemsTargetEl = document.getElementById("del-items-target");
            moveItemsTo = itemsTargetEl ? itemsTargetEl.value : "";
            if (itemCount && !moveItemsTo)
              return NotificationEngine.error("لازم تختار مجموعة بديلة لنقل الأصناف المرتبطة");

            closeModal();
            _freezeUI("⏳ جاري حذف المجموعة ونقل التبعيات...");
            _gsr(
              "deleteGroupCascade",
              [
                {
                  id: id,
                  moveChildrenTo: moveChildrenTo,
                  moveItemsTo: moveItemsTo,
                  user: APP.currentUser ? APP.currentUser.username : "SYSTEM",
                  sessionToken: SESSION ? SESSION.token : null,
                },
              ],
              {
                onSuccess: function (r) {
                  _unfreezeUI();
                  NotificationEngine.success(r.message);
                  // [FIX] الحذف مع نقل التبعيات بيغيّر سجلات كتير (فرعيات +
                  // أصناف) دفعة واحدة على السيرفر، فمينفعش optimisticPatch
                  // بسيط — هنا فعلاً محتاجين مزامنة كاملة حقيقية بدل الـ
                  // getGroupsTree المنفصلة اللي كانت بتتنادى قبل كده.
                  reloadAfterMutationFull(
                    function () {
                      renderPage("groups");
                    },
                    null,
                    { successMsg: "تم حذف المجموعة ونقل التبعيات " },
                  );
                },
                onError: function (r) {
                  _unfreezeUI();
                  NotificationEngine.error(r.message || "خطأ");
                },
              },
            );
          });
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // المخزون — Stock
  // ─────────────────────────────────────────────────────────────

  // وضع عرض التقرير: "summary" = موديل ككل | "detail" = تفصيل بالألوان
  var _stockViewMode = "summary";

  function bindStock() {
    var searchEl = document.getElementById("stock-search");
    var groupEl = document.getElementById("stock-group-filter");

    function filterRows() {
      var q = searchEl ? searchEl.value.toLowerCase() : "";
      var g = groupEl ? groupEl.value : "";
      document
        .querySelectorAll("#stock-tbody tr:not(.color-expand-row)")
        .forEach(function (tr) {
          var matchText = tr.textContent.toLowerCase().includes(q);
          var matchGroup = !g || tr.getAttribute("data-group") === g;
          var visible = matchText && matchGroup;
          tr.style.display = visible ? "" : "none";
          var itemId = tr.querySelector(".mono")
            ? tr.querySelector(".mono").textContent.trim()
            : "";
          if (itemId) {
            var colorRow = document.getElementById("crow-" + itemId);
            if (colorRow && !visible) colorRow.style.display = "none";
          }
        });
    }

    if (searchEl) searchEl.addEventListener("input", filterRows);
    if (groupEl) groupEl.addEventListener("change", filterRows);

    if (window.SplitSelect) {
      SplitSelect.init("stock-group-filter", {
        label: "المجموعة",
        icon: "ti-folder",
        searchable: true,
      });
    }

    // زر تبديل وضع العرض
    var toggleBtn = document.getElementById("stock-view-toggle");
    if (toggleBtn) {
      toggleBtn.addEventListener("click", function () {
        _stockViewMode = _stockViewMode === "summary" ? "detail" : "summary";
        this.textContent =
          _stockViewMode === "summary" ? " تفصيل بالألوان" : " موديل ككل";
        this.className =
          _stockViewMode === "summary"
            ? "btn btn-outline btn-sm"
            : "btn btn-primary btn-sm";
        _renderStockRows(_stockViewMode);
      });
    }

    // تصدير
    var exportBtn = document.getElementById("stock-export-btn");
    if (exportBtn) {
      exportBtn.addEventListener("click", function () {
        _exportStockCSV(_stockViewMode);
      });
    }
  }

  function _renderStockRows(mode) {
    var tbody = document.getElementById("stock-tbody");
    if (!tbody) return;
    var items = APP.data.items;
    var stockArr = APP.data.stock;
    var stockMap = {};
    stockArr.forEach(function (s) {
      stockMap[s.item_id] =
        (stockMap[s.item_id] || 0) + Number(s.quantity || 0);
    });

    if (mode === "detail") {
      var rows = [];
      items.forEach(function (item) {
        var colors = getItemColors(item.id);
        var minQ = Number(item.min_qty || 0);
        if (!colors.length) {
          var qty = (stockMap[item.id] || 0) + getOpeningQty(item.id);
          var badge =
            qty <= 0
              ? '<span class="badge badge-danger">نفد </span>'
              : minQ > 0 && qty <= minQ
                ? '<span class="badge badge-warning">منخفض </span>'
                : '<span class="badge badge-success">طبيعي </span>';
          rows.push(
            '<tr data-group="' +
              esc(item.group || "") +
              '">' +
              '<td><span class="mono" style="font-weight:700;color:var(--accent)">' +
              esc(item.code || item.id) +
              "</span></td>" +
              '<td style="font-weight:500">' +
              esc(item.name || "—") +
              "</td>" +
              '<td style="color:var(--text3)">—</td>' +
              '<td style="color:var(--text3);font-family:var(--font-mono)">—</td>' +
              '<td style="text-align:center"><b>' +
              qty +
              "</b></td>" +
              '<td style="text-align:center">' +
              badge +
              "</td></tr>",
          );
          return;
        }
        colors.forEach(function (c) {
          var colorName = c.name || "";
          var colorCode =
            c.code && c.code.trim()
              ? c.code.trim().toUpperCase()
              : colorName.replace(/\s+/g, "").substring(0, 3).toUpperCase();
          var subCode = (item.code || item.id) + "-" + colorCode;
          // رصيد اللون من Transactions + OpeningStock (Stock مفيهوش color)
          var colorQty = getColorQty(item.id, colorName);
          var badge =
            colorQty <= 0
              ? '<span class="badge badge-danger">نفد </span>'
              : minQ > 0 && colorQty <= minQ
                ? '<span class="badge badge-warning">منخفض </span>'
                : '<span class="badge badge-success">طبيعي </span>';
          rows.push(
            '<tr data-group="' +
              esc(item.group || "") +
              '">' +
              '<td><span class="mono" style="font-weight:700;color:var(--accent)">' +
              esc(item.code || item.id) +
              "</span></td>" +
              '<td style="font-weight:500">' +
              esc(item.name || "—") +
              "</td>" +
              '<td><span style="background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:10px;font-size:12px">' +
              esc(colorName) +
              "</span></td>" +
              '<td><span style="font-family:var(--font-mono);font-size:12px;background:var(--bg2);padding:2px 8px;border-radius:6px">' +
              esc(subCode) +
              "</span></td>" +
              '<td style="text-align:center"><b>' +
              colorQty +
              "</b></td>" +
              '<td style="text-align:center">' +
              badge +
              "</td></tr>",
          );
        });
      });
      tbody.innerHTML =
        rows.join("") ||
        '<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">لا توجد بيانات</td></tr>';
      // تحديث رأس الجدول
      var thead = tbody.closest("table")
        ? tbody.closest("table").querySelector("thead tr")
        : null;
      if (thead) {
        thead.innerHTML =
          "<th>الكود</th><th>الاسم</th><th>اللون</th>" +
          '<th style="font-family:var(--font-mono);font-size:12px">الكود الفرعي</th>' +
          '<th style="text-align:center">الرصيد</th>' +
          '<th style="text-align:center">الحالة</th>';
      }
    } else {
      // رجوع لوضع الملخص = أعد رندر الصفحة كلها
      var c = document.getElementById("main-content");
      if (c) {
        c.innerHTML = renderStock();
        bindStock();
        _stockViewMode = "summary";
      }
    }
  }

  function _exportStockCSV(mode) {
    var items = APP.data.items;
    var stockArr = APP.data.stock;
    var stockMap = {};
    stockArr.forEach(function (s) {
      stockMap[s.item_id] =
        (stockMap[s.item_id] || 0) + Number(s.quantity || 0);
    });
    var csv, filename;

    if (mode === "detail") {
      csv =
        "\uFEFF" + "الكود الأساسي,اسم الصنف,اللون,الكود الفرعي,الرصيد,الحالة\n";
      items.forEach(function (item) {
        var colors = getItemColors(item.id);
        var minQ = Number(item.min_qty || 0);
        if (!colors.length) {
          var qty = (stockMap[item.id] || 0) + getOpeningQty(item.id);
          var status =
            qty <= 0 ? "نفد" : minQ > 0 && qty <= minQ ? "منخفض" : "طبيعي";
          csv +=
            [item.id, item.name, "—", item.id, qty, status]
              .map(function (v) {
                return '"' + String(v || "").replace(/"/g, '""') + '"';
              })
              .join(",") + "\n";
          return;
        }
        colors.forEach(function (c) {
          var colorName = c.name || "";
          var colorCode =
            c.code && c.code.trim()
              ? c.code.trim().toUpperCase()
              : colorName.replace(/\s+/g, "").substring(0, 3).toUpperCase();
          var subCode = (item.code || item.id) + "-" + colorCode;
          // رصيد اللون من Transactions + OpeningStock (Stock مفيهوش color)
          var colorQty = getColorQty(item.id, colorName);
          var status =
            colorQty <= 0
              ? "نفد"
              : minQ > 0 && colorQty <= minQ
                ? "منخفض"
                : "طبيعي";
          csv +=
            [item.id, item.name, colorName, subCode, colorQty, status]
              .map(function (v) {
                return '"' + String(v || "").replace(/"/g, '""') + '"';
              })
              .join(",") + "\n";
        });
      });
      filename =
        "تقرير_الرصيد_تفصيلي_" +
        fmtDate(new Date()).replace(/\//g, "-") +
        ".csv";
    } else {
      csv =
        "\uFEFF" +
        "الكود,الاسم,الوحدة,رصيد أول المدة,الرصيد,الحد الأدنى,التكلفة الإجمالية,الحالة\n";
      items.forEach(function (item) {
        var currentQty = stockMap[item.id] || 0;
        var openingQty = getOpeningQty(item.id);
        var totalQty = currentQty + openingQty;
        var minQ = Number(item.min_qty || 0);
        var cost = Number(item.cost_price || 0);
        var totalCost = totalQty * cost;
        var status =
          totalQty <= 0
            ? "نفد"
            : minQ > 0 && totalQty <= minQ
              ? "منخفض"
              : "طبيعي";
        csv +=
          [
            item.id,
            item.name,
            item.unit,
            openingQty,
            totalQty,
            minQ,
            totalCost,
            status,
          ]
            .map(function (v) {
              return '"' + String(v || "").replace(/"/g, '""') + '"';
            })
            .join(",") + "\n";
      });
      filename =
        "تقرير_الرصيد_" + fmtDate(new Date()).replace(/\//g, "-") + ".csv";
    }

    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── تبديل عرض/إخفاء صف الألوان ──────────────────────────────
  function toggleColorRow(itemId) {
    var row = document.getElementById("crow-" + itemId);
    var btn = document.getElementById("cbtn-" + itemId);
    if (!row) return;
    var isOpen = row.style.display !== "none";
    row.style.display = isOpen ? "none" : "";
    if (btn) {
      btn.textContent = isOpen ? "+" : "−";
      btn.style.background = isOpen ? "var(--accent)" : "var(--success)";
      btn.style.transform = isOpen ? "" : "rotate(0deg)";
    }
  }

  // ─────────────────────────────────────────────────────────────
</script>
