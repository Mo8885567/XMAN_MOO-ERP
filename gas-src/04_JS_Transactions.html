  function _renderStatementResult(id) {
    var item = (APP.data.items || []).find(function (i) {
      return i.id === id;
    });
    var openingQty = getOpeningQty(id);

    // حركات الصنف مرتبة تصاعدياً
    var txs = (APP.data.transactions || [])
      .filter(function (t) {
        return t.item_id === id;
      })
      .slice()
      .sort(function (a, b) {
        return new Date(a.date) - new Date(b.date);
      });

    var stock = (APP.data.stock || []).filter(function (s) {
      return s.item_id === id;
    });
    var totalQty = stock.reduce(function (a, s) {
      return a + Number(s.quantity || 0);
    }, 0);
    var totalInQty = txs
      .filter(function (t) {
        return t.type === "IN";
      })
      .reduce(function (a, t) {
        return a + Number(t.quantity || 0);
      }, 0);
    var totalOutQty = txs
      .filter(function (t) {
        return t.type === "OUT";
      })
      .reduce(function (a, t) {
        return a + Number(t.quantity || 0);
      }, 0);

    // إحصاء لكل مستودع
    var whMap = {};
    stock.forEach(function (s) {
      if (!s.warehouse) return;
      whMap[s.warehouse] = (whMap[s.warehouse] || 0) + Number(s.quantity || 0);
    });
    var whChips = Object.keys(whMap)
      .map(function (wh) {
        return (
          '<span style="display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 12px;font-size:12px;font-weight:600">' +
          '<i class="ti ti-building-warehouse" style="font-size:12px;color:#2563eb"></i>' +
          esc(wh) +
          '<b style="color:var(--text1)">' +
          whMap[wh] +
          "</b>" +
          "</span>"
        );
      })
      .join("");

    // بناء صفوف الجدول مع رصيد جاري
    var running = openingQty;

    var rows = txs.map(function (t) {
      var qty = Number(t.quantity || 0);
      if (t.type === "IN" || t.type === "FG_IN") running += qty;
      else if (
        t.type === "OUT" ||
        t.type === "DISPATCH" ||
        t.type === "WASTE" ||
        t.type === "FACTORY_RETURN"
      )
        running -= qty;
      return {
        id: t.id,
        date: t.date,
        type: t.type,
        quantity: qty,
        from_warehouse: t.from_warehouse || "",
        to_warehouse: t.to_warehouse || "",
        running: running,
        notes: t.notes || "",
      };
    });

    var resultEl = document.getElementById("stmt-result");
    if (!resultEl) return;

    resultEl.innerHTML =
      // ── بطاقات الإحصاء ──────────────────────────────────────
      '<div class="stat-grid" style="margin-bottom:16px">' +
      // اسم الصنف
      '<div class="stat-card" style="display:flex;align-items:center;gap:14px;padding:16px 20px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;background:#EFF6FF;border-radius:10px;padding:10px;flex-shrink:0">' +
      '<i class="ti ti-package" style="font-size:22px;color:#2563eb" aria-hidden="true"></i>' +
      "</span>" +
      '<div style="min-width:0">' +
      '<div style="font-size:11px;color:var(--text3);font-weight:600;margin-bottom:2px">الصنف</div>' +
      '<div style="font-size:15px;font-weight:800;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
      esc(item ? item.name : id) +
      "</div>" +
      (item && item.code
        ? '<div style="font-size:11px;color:var(--text3)">' +
          esc(item.code) +
          "</div>"
        : "") +
      "</div>" +
      "</div>" +
      // رصيد أول المدة
      '<div class="stat-card" style="display:flex;align-items:center;gap:14px;padding:16px 20px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;background:#FFF7ED;border-radius:10px;padding:10px;flex-shrink:0">' +
      '<i class="ti ti-calendar-stats" style="font-size:22px;color:#f97316" aria-hidden="true"></i>' +
      "</span>" +
      "<div>" +
      '<div style="font-size:11px;color:var(--text3);font-weight:600;margin-bottom:2px">رصيد أول المدة</div>' +
      '<div style="font-size:22px;font-weight:900;color:var(--text1)">' +
      openingQty +
      ' <span style="font-size:12px;font-weight:500;color:var(--text3)">' +
      esc((item || {}).unit || "وحدة") +
      "</span></div>" +
      "</div>" +
      "</div>" +
      // إجمالي وارد
      '<div class="stat-card" style="display:flex;align-items:center;gap:14px;padding:16px 20px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;background:#F0FDF4;border-radius:10px;padding:10px;flex-shrink:0">' +
      '<i class="ti ti-arrow-bar-down" style="font-size:22px;color:#10b981" aria-hidden="true"></i>' +
      "</span>" +
      "<div>" +
      '<div style="font-size:11px;color:var(--text3);font-weight:600;margin-bottom:2px">إجمالي الوارد</div>' +
      '<div style="font-size:22px;font-weight:900;color:#10b981">+' +

      "</span></div>" +

      '<span style="display:inline-flex;align-items:center;justify-content:center;background:#FFF1F2;border-radius:10px;padding:10px;flex-shrink:0">' +
      '<i class="ti ti-arrow-bar-up" style="font-size:22px;color:#ef4444" aria-hidden="true"></i>' +
      "</span>" +
      "<div>" +
      '<div style="font-size:11px;color:var(--text3);font-weight:600;margin-bottom:2px">إجمالي الصادر</div>' +
      '<div style="font-size:22px;font-weight:900;color:#ef4444">-' +
      totalOutQty +
      ' <span style="font-size:12px;font-weight:500;color:var(--text3)">' +
      esc((item || {}).unit || "وحدة") +
      "</span></div>" +
      "</div>" +
      "</div>" +
      // الرصيد الحالي
      '<div class="stat-card" style="display:flex;align-items:center;gap:14px;padding:16px 20px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;background:#EFF6FF;border-radius:10px;padding:10px;flex-shrink:0">' +
      '<i class="ti ti-clipboard-list" style="font-size:22px;color:#2563eb" aria-hidden="true"></i>' +
      "</span>" +
      "<div>" +
      '<div style="font-size:11px;color:var(--text3);font-weight:600;margin-bottom:2px">الرصيد الحالي</div>' +
      '<div style="font-size:22px;font-weight:900;color:' +
      (totalQty > 0 ? "var(--success-dark)" : "var(--danger)") +
      '">' +
      totalQty +
      ' <span style="font-size:12px;font-weight:500;color:var(--text3)">' +
      esc((item || {}).unit || "وحدة") +
      "</span></div>" +
      "</div>" +
      "</div>" +
      // عدد الحركات
      '<div class="stat-card" style="display:flex;align-items:center;gap:14px;padding:16px 20px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;background:#F5F3FF;border-radius:10px;padding:10px;flex-shrink:0">' +
      '<i class="ti ti-history" style="font-size:22px;color:#8b5cf6" aria-hidden="true"></i>' +
      "</span>" +
      "<div>" +
      '<div style="font-size:11px;color:var(--text3);font-weight:600;margin-bottom:2px">عدد الحركات</div>' +
      '<div style="font-size:22px;font-weight:900;color:var(--text1)">' +
      txs.length +
      ' <span style="font-size:12px;font-weight:500;color:var(--text3)">حركة</span></div>' +
      "</div>" +
      "</div>" +
      "</div>" +
      // ── توزيع المستودعات ─────────────────────────────────────
      (Object.keys(whMap).length > 0
        ? '<div class="card" style="margin-bottom:16px;padding:14px 20px">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">' +
          '<span style="display:inline-flex;align-items:center;justify-content:center;background:#EFF6FF;border-radius:7px;padding:5px;flex-shrink:0">' +
          '<i class="ti ti-building-warehouse" style="font-size:14px;color:#2563eb" aria-hidden="true"></i>' +
          "</span>" +

          "</div>" +
          '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
          whChips +
          "</div>" +
          "</div>"
        : "") +
      // ── رصيد أول المدة strip ─────────────────────────────────
      (openingQty > 0
        ? '<div class="card" style="margin-bottom:12px;border-right:4px solid var(--warning);padding:12px 20px;display:flex;align-items:center;gap:10px">' +
          '<i class="ti ti-calendar-stats" style="font-size:18px;color:var(--warning)" aria-hidden="true"></i>' +
          '<span style="font-weight:700;color:var(--warning)">رصيد أول المدة: </span>' +
          '<span style="font-size:18px;font-weight:900">' +

          esc((item || {}).unit || "وحدة") +

      // ── جدول الحركات — عبر ColumnEngine (Dynamic Columns) ─────

    if (rows.length) {

        ColumnEngine.renderTable("item_statement", stmtContainer, rows, {});

  // ── تعديل وحذف الحركات ──────────────────────────────────────
  // تعديل حركة — يفتح نفس شاشة السند ويملأ البيانات القديمة
  function editTransaction(id) {
    var tx = (APP.data.transactions || []).find(function (t) {
      return t.id === id;
    });
    if (!tx) {
      NotificationEngine.error("الحركة غير موجودة");
      return;
    }

    var pageMap = {
      IN: "tx_in",
      OUT: "tx_out",
      TRANSFER: "tx_transfer",
      DISPATCH: "tx_out",
      FG_IN: "tx_in",
      FACTORY_RETURN: "factory_return",
      WASTE: "tx_out", // [WASTE-FEATURE-2026-08-07] بتستخدم نفس شاشة الصرف
    };
    var targetPage = pageMap[tx.type] || "tx_in";

    // ── فتح Drawer جانبي بشاشة الإذن ─────────────────────────
    _openEditDrawer(tx, targetPage);
  }

  function _openEditDrawer(tx, targetPage) {
    var TYPE_LABELS = {
      IN: "إذن وارد",
      OUT: "إذن صادر",
      TRANSFER: "تحويل بين المخازن",
      DISPATCH: "صرف للمصنع",
      FG_IN: "استلام منتج تام",
      FACTORY_RETURN: "مرتجع من المصنع",
      WASTE: "هالك مخزون", // [WASTE-FEATURE-2026-08-07]
    };
    var TYPE_COLORS = {
      IN: "#10b981",
      OUT: "#ef4444",
      TRANSFER: "#7c3aed",
      DISPATCH: "#f59e0b",
      FG_IN: "#0d9488",
      FACTORY_RETURN: "#f97316",
      WASTE: "#374151", // [WASTE-FEATURE-2026-08-07]
    };
    var TYPE_ICONS = {
      IN: "ti-arrow-bar-down",
      OUT: "ti-arrow-bar-up",
      TRANSFER: "ti-arrows-exchange",
      DISPATCH: "ti-building-factory-2",
      FG_IN: "ti-circle-check",
      FACTORY_RETURN: "ti-rotate-clockwise-2",
    };
    var txColor = TYPE_COLORS[tx.type] || "var(--accent)";
    var txIcon = TYPE_ICONS[tx.type] || "ti-edit";
    var txLabel = TYPE_LABELS[tx.type] || tx.type;

    var subtitle =
      '<span style="font-family:var(--font-mono)">' +
      esc(tx.id) +
      "</span>&nbsp;&nbsp;" +
      '<span style="background:' +
      txColor +
      "1a;color:" +
      txColor +
      ";border:1px solid " +
      txColor +
      '44;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px">' +
      '<i class="ti ti-edit" style="font-size:10px"></i>وضع التعديل</span>';

    // محتوى الـ drawer بيتملي بعدين بإعادة استخدام renderPage على
    // عنصر placeholder (نفس تقنية النظام في باقي الموديولات)
    var html = renderModalBox({
      title: "تعديل " + txLabel,
      subtitle: subtitle,
      icon: txIcon,
      iconStyle: "background:" + txColor + "22;color:" + txColor,
      body: '<div id="__edit-tx-content"></div>',
      closeFn: "_closeEditDrawer()",
    });

    openStyledDrawer({
      title: "تعديل " + txLabel,
      subtitle: subtitle,
      icon: txIcon,
      color: "blue",
      width: 860,
      body: '<div id="__edit-tx-content"></div>',
      onReady: function () {
        var content = document.getElementById("__edit-tx-content");
        if (!content) return;

        // ── render الصفحة جوّا الـ drawer ─────────────────────────
        APP._editingTx = tx;

        var realPageContent = document.getElementById("page-content");
        var savedPage = APP.currentPage;

        if (realPageContent) realPageContent.id = "__page-content-hidden";
        content.id = "page-content";

        renderPage(targetPage);

        content.id = "__edit-tx-content";
        if (realPageContent) realPageContent.id = "page-content";
        APP.currentPage = savedPage;

        // [FIX] إرجاع تلوين السايد بار للصفحة الأصلية
        document.querySelectorAll(".nav-item").forEach(function (el) {
          el.classList.toggle("active", el.dataset.page === savedPage);
        });
        document.querySelectorAll(".nav-sub-item").forEach(function (el) {
          var isActive = el.dataset.page === savedPage;
          el.classList.toggle("active", isActive);
          if (isActive) {
            var parentMenu = el.closest("[id$='-menu']");
            if (parentMenu) {
              var gId = parentMenu.id.replace("-menu", "");
              var toggleEl = document.getElementById(gId + "-toggle");
              var arrowEl = document.getElementById(gId + "-arrow");
              if (toggleEl) toggleEl.classList.add("open", "has-active");
              if (arrowEl) arrowEl.style.transform = "rotate(180deg)";
              parentMenu.style.display = "";
            }
          }
        });

        APP.__editDrawerActive = true;
      },
    });
  }

  function _closeEditDrawer() {
    APP.__editDrawerActive = false;
    closeDrawer();
  }
  window._closeEditDrawer = _closeEditDrawer;

  /**
   * تملأ شاشة السند ببيانات الحركة القديمة وتحوّل زر الحفظ لـ updateTransaction
   * يُستدعى من داخل bindTxIn / bindTxOut / bindTxTransfer
   */
  function _prefillEditTx() {
    var tx = APP._editingTx;
    if (!tx) return;
    APP._editingTx = null;

    var type = tx.type;

    // الـ banner اتنقل لـ header الـ drawer — مش محتاجين بانر هنا

    if (type === "IN" || type === "FG_IN" || type === "FACTORY_RETURN") {
      _prefillIn(tx);
    } else if (type === "OUT" || type === "DISPATCH" || type === "WASTE") {
      _prefillOut(tx);
    } else if (type === "TRANSFER") {
      _prefillTransfer(tx);
    }
  }

  // عرض المرفق الموجود عند التعديل
  function _prefillAttachment(prefix, url) {
    if (!url) return;
    var previewEl = document.getElementById(prefix + "-attach-preview");
    var areaEl = document.getElementById(prefix + "-attach-area");
    if (!previewEl) return;

    var isPdf =
      url.toLowerCase().indexOf(".pdf") !== -1 ||
      url.toLowerCase().indexOf("pdf") !== -1;

    previewEl.innerHTML = isPdf
      ? '<div style="display:flex;flex-direction:column;align-items:center;gap:6px">' +
        '<div style="font-size:28px"></div>' +
        '<div style="font-size:11px;color:var(--text2);text-align:center">مرفق موجود</div>' +
        '<a href="' +
        url +
        '" target="_blank" onclick="event.stopPropagation()" ' +
        'style="font-size:11px;color:var(--accent);text-decoration:underline"> عرض المرفق الحالي</a>' +
        '<div style="font-size:10px;color:var(--text3)">(اضغط للتغيير)</div>' +
        "</div>"
      : '<div style="display:flex;flex-direction:column;align-items:center;gap:6px">' +
        '<img src="' +
        url +
        '" style="max-height:120px;max-width:100%;border-radius:8px;object-fit:cover" ' +
        "onclick=\"event.preventDefault();event.stopPropagation();window.open('" +
        url +
        "','_blank')\" " +
        'style="cursor:pointer">' +
        '<div style="font-size:11px;color:var(--text2);margin-top:4px;text-align:center">مرفق موجود — اضغط للتكبير</div>' +
        '<div style="font-size:10px;color:var(--text3)">(اضغط المنطقة للتغيير)</div>' +
        "</div>";

    if (areaEl) {
      areaEl.style.borderColor = "var(--accent)";
      areaEl.style.background = "var(--accent-bg, #eff6ff)";
    }

    // احتفظ بالـ URL القديم كـ fallback لو المستخدم ما غيّرش المرفق
    window["_existingAttachment_" + prefix] = url;
  }

  // ملء شاشة الوارد (IN / FG_IN)
  function _prefillIn(tx) {
    // [FIX] استرجاع رقم الإذن الأصلي بدل الـ ID الجديد التلقائي
    var permitDiv = document.getElementById("in-permit-id");
    if (permitDiv && tx.permit_id) {
      permitDiv.textContent = tx.permit_id;
    }
    var permitHero = permitDiv ? permitDiv.closest(".tx-in-permit-hero") : null;
    if (permitHero) {
      var badge = permitHero.querySelector(".tx-in-hero-badge");
      if (badge) badge.textContent = " وضع التعديل";
    }

    var refEl = document.getElementById("in-ref");
    var partyEl = document.getElementById("in-party");
    var notesEl = document.getElementById("in-notes");
    if (refEl) refEl.value = tx.ref || "";
    if (partyEl) {
      var _inPartyRecord = (APP.data.suppliers || [])
        .concat(APP.data.customers || [])
        .find(function (p) {
          return p.id === tx.party;
        });
      partyEl.value = _inPartyRecord ? _inPartyRecord.name : tx.party || "";
      var _inPartyHidden = document.getElementById("in-party-id");
      if (_inPartyHidden) _inPartyHidden.value = tx.party || "";
    }
    if (notesEl) notesEl.value = tx.notes || "";
    _prefillAttachment("in", tx.attachment_url);

    var toSel = document.getElementById("in-to");

    if (toSel) {
      toSel.value = tx.to_warehouse || "";
      toSel.dispatchEvent(new Event("change"));
    }

    // [FIX] دعم تعدد الأصناف — loop على tx.items لو موجودة
    var itemsList =
      tx.items && tx.items.length > 0
        ? tx.items
        : [{ item_id: tx.item_id, color: tx.color, quantity: tx.quantity }];

    var _addInItemSequential = function (idx) {
      if (idx >= itemsList.length) {
        _switchBtnToUpdate("btn-in", tx, tx.type);
        return;
      }
      var it = itemsList[idx];
      var itemSel = document.getElementById("in-item");
      var qtyEl = document.getElementById("in-qty");
      if (itemSel) {
        itemSel.value = it.item_id || "";
        itemSel.dispatchEvent(new Event("change"));
      }
      setTimeout(function () {
        if (it.color) _setCCDValue("in-color", it.color);
        if (qtyEl) qtyEl.value = it.quantity || 1;
        var addBtn = document.getElementById("btn-add-in-item");
        if (addBtn) addBtn.click();
        // انتظر الـ DOM يتحدث ثم كمّل الصنف التالي
        setTimeout(function () {
          _addInItemSequential(idx + 1);
        }, 150);
      }, 200);
    };
    setTimeout(function () {
      _addInItemSequential(0);
    }, 100);
  }

  // ملء شاشة الصادر (OUT / DISPATCH)
  function _prefillOut(tx) {
    // [FIX] استرجاع رقم الإذن الأصلي بدل الـ ID الجديد التلقائي
    var permitDiv = document.getElementById("out-permit-id");
    if (permitDiv && tx.permit_id) {
      permitDiv.textContent = tx.permit_id;
    }
    var permitHero = permitDiv
      ? permitDiv.closest(".tx-out-permit-hero")
      : null;
    if (permitHero) {
      var badge = permitHero.querySelector(".tx-out-hero-badge");
      if (badge) badge.textContent = " وضع التعديل";
    }

    var refEl = document.getElementById("out-ref");
    var partyEl = document.getElementById("out-party");
    var notesEl = document.getElementById("out-notes");
    if (refEl) refEl.value = tx.ref || "";
    if (partyEl) {
      var _outPartyRecord = (APP.data.customers || [])
        .concat(APP.data.suppliers || [])
        .find(function (p) {
          return p.id === tx.party;
        });
      partyEl.value = _outPartyRecord ? _outPartyRecord.name : tx.party || "";
      var _outPartyHidden = document.getElementById("out-party-id");
      if (_outPartyHidden) _outPartyHidden.value = tx.party || "";
    }
    if (notesEl) notesEl.value = tx.notes || "";
    _prefillAttachment("out", tx.attachment_url);

    var fromSel = document.getElementById("out-from");

    if (fromSel) {
      fromSel.value = tx.from_warehouse || "";
      fromSel.dispatchEvent(new Event("change"));
    }

    // [FIX] دعم تعدد الأصناف — loop على tx.items لو موجودة
    var outItemsList =
      tx.items && tx.items.length > 0
        ? tx.items
        : [{ item_id: tx.item_id, color: tx.color, quantity: tx.quantity }];

    var _addOutItemSequential = function (idx) {
      if (idx >= outItemsList.length) {
        _switchBtnToUpdate("btn-out", tx, tx.type);
        return;
      }
      var it = outItemsList[idx];
      var itemSel = document.getElementById("out-item");
      var qtyEl = document.getElementById("out-qty");
      if (itemSel) {
        itemSel.value = it.item_id || "";
        itemSel.dispatchEvent(new Event("change"));
      }
      setTimeout(function () {
        if (it.color) _setCCDValue("out-color", it.color);
        if (qtyEl) qtyEl.value = it.quantity || 1;
        var addBtn = document.getElementById("btn-add-out-item");
        if (addBtn) addBtn.click();
        setTimeout(function () {
          _addOutItemSequential(idx + 1);
        }, 150);
      }, 200);
    };
    setTimeout(function () {
      _addOutItemSequential(0);
    }, 100);
  }

  // ملء شاشة التحويل (TRANSFER)
  function _prefillTransfer(tx) {
    var itemSel = document.getElementById("tr-item");
    var fromSel = document.getElementById("tr-from");
    var toSel = document.getElementById("tr-to");
    var colorSel = document.getElementById("tr-color");
    var qtyEl = document.getElementById("tr-qty");
    var notesEl = document.getElementById("tr-notes");

    if (itemSel) {
      itemSel.value = tx.item_id || "";
      itemSel.dispatchEvent(new Event("change"));
    }
    if (notesEl) notesEl.value = tx.notes || "";

    setTimeout(function () {
      if (fromSel) fromSel.value = tx.from_warehouse || "";
      if (toSel) toSel.value = tx.to_warehouse || "";
      // إصلاح: مطابقة اللون عبر CCD
      if (tx.color) _setCCDValue("tr-color", tx.color);
      if (qtyEl) qtyEl.value = tx.quantity || 1;
      _switchBtnToUpdate("btn-tr", tx, "TRANSFER");
    }, 200);
  }

  // تحويل زر التسجيل إلى زر حفظ التعديل
  function _switchBtnToUpdate(btnId, tx, type) {
    var btn = document.getElementById(btnId);
    if (!btn) return;

    btn.textContent = " حفظ التعديلات";
    btn.style.background = "var(--warning, #f59e0b)";
    btn.style.color = "#fff";

    // استبدل الزر بنسخة جديدة لإزالة الـ listener القديم
    var newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);

    newBtn.addEventListener("click", function () {
      var updated = {
        id: tx.id,
        type: type,
        user: tx.user || (APP.currentUser ? APP.currentUser.username : ""),
        permit_id: tx.permit_id || "", // [FIX] احتفظ بـ permit_id الأصلي
      };

      if (type === "TRANSFER") {
        updated.item_id =
          (document.getElementById("tr-item") || {}).value || tx.item_id;
        updated.quantity = Number(
          (document.getElementById("tr-qty") || {}).value || tx.quantity,
        );
        updated.from_warehouse =
          (document.getElementById("tr-from") || {}).value || tx.from_warehouse;
        updated.to_warehouse =
          (document.getElementById("tr-to") || {}).value || tx.to_warehouse;
        updated.color =
          (document.getElementById("tr-color") || {}).value || tx.color || "";
        updated.notes = (
          (document.getElementById("tr-notes") || {}).value || ""
        ).trim();
      } else {
        // وارد أو صادر — خد من جدول الأصناف
        var storeKey =
          type === "IN" || type === "FG_IN" || type === "FACTORY_RETURN"
            ? "IN"
            : "OUT";
        var items = (_txItemsStore[storeKey] || []).filter(Boolean);

        if (!items.length) {
          NotificationEngine.error("أضف الصنف في الجدول ثم اضغط حفظ");
          return;
        }

        var prefix =
          type === "IN" || type === "FG_IN" || type === "FACTORY_RETURN"
            ? "in"
            : "out";
        var first = items[0];

        updated.item_id = first.item_id;
        updated.quantity = first.quantity;
        updated.from_warehouse =
          type === "OUT" || type === "DISPATCH" || type === "WASTE"
            ? first.warehouse
            : tx.from_warehouse || "";
        updated.to_warehouse =
          type === "IN" || type === "FG_IN" || type === "FACTORY_RETURN"
            ? first.warehouse
            : tx.to_warehouse || "";
        updated.color = first.color || "";
        // [FIX] لو الـ input فاضي — احتفظ بالقيمة القديمة من tx
        updated.ref =
          (
            (document.getElementById(prefix + "-ref") || {}).value || ""
          ).trim() ||
          tx.ref ||
          "";
        updated.party =
          (
            (document.getElementById(prefix + "-party") || {}).value || ""
          ).trim() ||
          tx.party ||
          "";
        updated.notes = [
          first.notes || "",
          (
            (document.getElementById(prefix + "-notes") || {}).value || ""
          ).trim(),
        ]
          .filter(Boolean)
          .join(" | ");
      }

      if (!updated.item_id) {
        NotificationEngine.error("اختر الصنف");
        return;
      }
      if (!updated.quantity || updated.quantity <= 0) {
        NotificationEngine.error("الكمية يجب أن تكون أكبر من صفر");
        return;
      }

      // [FIX] احتفظ بالـ attachment القديم كـ fallback
      // لو المستخدم مارفعش صورة جديدة، نبعت الـ URL القديم
      updated.attachment_url = tx.attachment_url || "";

      // [FIX] لو فيه ملف جديد اتار — ارفعه الأول
      var _editFilePrefix =
        type === "IN" || type === "FG_IN" || type === "FACTORY_RETURN"
          ? "in"
          : type === "OUT" || type === "DISPATCH" || type === "WASTE"
            ? "out"
            : null;
      var _editNewFile =
        _editFilePrefix && _txFiles ? _txFiles[_editFilePrefix] : null;

      function _doUpdateTx(finalUpdated) {
        newBtn.disabled = true;
        newBtn.textContent = "⏳ جاري الحفظ...";
        // [SE-ROLLOUT] عبر SaveEngine.run بدل google.script.run/_gsr المباشر
        SaveEngine.run({
          screen: "Transactions",
          entity: "transaction",
          recordId: finalUpdated && finalUpdated.id,
          fn: "updateTransaction",
          data: finalUpdated,
          params: function (data) {
            return [data];
          },
          savingLabel: "جاري حفظ التعديلات...",
          onSuccess: function () {
            newBtn.disabled = false;
            newBtn.textContent = " حفظ التعديلات";
            reloadAfterMutation(
              function () {
                if (APP.__editDrawerActive) {
                  _closeEditDrawer();
                  if (typeof window._applyTxFilter === "function")
                    window._applyTxFilter();
                } else {
                  renderPage("transactions");
                }
              },
              null,
              { emoji: "", successMsg: "تم حفظ التعديلات " },
              // [PERF-FIX-7] Optimistic Update للحركة المعدّلة
              {
                collection: "transactions",
                record: Object.assign({}, finalUpdated),
                op: "update",
                idField: "id",
              },
            );
          },
          onError: function () {
            newBtn.disabled = false;
            newBtn.textContent = " حفظ التعديلات";
          },
        });
      }

      if (_editNewFile) {
        // فيه ملف جديد — ارفعه الأول
        var _editStatusEl = _editFilePrefix
          ? document.getElementById(_editFilePrefix + "-upload-status")
          : null;
        if (_editStatusEl) {
          _editStatusEl.style.display = "flex";
          _editStatusEl.innerHTML =
            '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> جاري رفع المرفق...';
        }
        newBtn.disabled = true;
        newBtn.textContent = " جاري رفع الملف...";
        NotificationEngine.loading("جاري رفع المرفق...");

        var _editReader = new FileReader();
        _editReader.onload = function (ev) {
          var base64 = ev.target.result.split(",")[1];
          _gsr(
            "uploadFile",
            [
              base64,
              _editNewFile.name,
              _editNewFile.type,
              {
                userName: APP.currentUser
                  ? APP.currentUser.full_name ||
                    APP.currentUser.username ||
                    "مستخدم"
                  : "مستخدم",
                moduleName: type === "IN" ? "إذن وارد" : "إذن صادر",
              },
            ],
            {
              label: "uploadFile:editTx",
              rawResponse: true,
              onSuccess: function (r) {
                var res = r && r.data;
                var result;
                try {
                  result = JSON.parse(res);
                } catch (ex) {
                  result = { success: false, error: ex.message };
                }
                if (result.success) {
                  if (_editStatusEl)
                    _editStatusEl.innerHTML = " تم رفع المرفق بنجاح";
                  updated.attachment_url = result.viewUrl;
                  if (_txFiles) _txFiles[_editFilePrefix] = null;
                  dismissLoadingToast(); // هيبدأ لودينج تاني في _doUpdateTx
                  _doUpdateTx(updated);
                } else {
                  if (_editStatusEl)
                    _editStatusEl.innerHTML =
                      " فشل رفع الملف: " + esc(result.error || "");
                  newBtn.disabled = false;
                  newBtn.textContent = " حفظ التعديلات";
                  finishLoadingToast(
                    " فشل رفع الملف — " + (result.error || ""),
                    "error",
                  );
                }
              },
              onError: function (r) {
                if (_editStatusEl) _editStatusEl.innerHTML = " خطأ في الرفع";
                newBtn.disabled = false;
                newBtn.textContent = " حفظ التعديلات";
                finishLoadingToast(" خطأ: " + (r.message || r), "error");
              },
            },
          );
        };
        _editReader.readAsDataURL(_editNewFile);
      } else {
        // مفيش ملف جديد — حفظ مباشرة مع الـ URL القديم
        _doUpdateTx(updated);
      }
    });
  }

  // حذف حركة
  function deleteTransactionConfirm(id) {
    showConfirm({
      icon: "ti-trash",
      iconColor: "#dc2626",
      title: "حذف الحركة",
      message: "هل أنت متأكد من حذف هذه الحركة؟\nسيتم تعديل الرصيد تلقائيًا.",
      confirmText: "حذف",
      confirmClass: "btn-danger",
      onConfirm: function (unfreeze) {
        // [SE-ROLLOUT] عبر SaveEngine.run بدل google.script.run/_gsr المباشر
        SaveEngine.run({
          screen: "Transactions",
          entity: "transaction",
          recordId: id,
          fn: "deleteTransaction",
          data: { id: id },
          params: function () {
            // [FIX-DELTX-2026-08] كان بيبعت [id, username] بس، من غير
            // sessionToken. الـ backend deleteTransaction(id, user,
            // sessionToken) بيستدعي _checkPermission اللي fail-closed
            // من غير sessionToken (بترجع "جلسة غير صالحة" دايمًا)،
            // يعني حذف أي حركة مخزون كان معطوب 100%.
            return [
              id,
              APP.currentUser ? APP.currentUser.username : null,
              SESSION.token,
            ];
          },
          savingLabel: "جاري حذف الحركة...",
          successMessage: "تم حذف الحركة",
          onSuccess: function () {
            // حذف الحركة يؤثر على الرصيد (stock) — نحتاج full refresh للرصيد
            // لكن نحدّث transactions محلياً فوراً
            reloadAfterMutation(
              function () {
                // بعد المزامنة الخلفية، أعد تطبيق الفلتر
                if (typeof window._applyTxFilter === "function")
                  window._applyTxFilter();
              },
              unfreeze,
              { emoji: "", successMsg: "تم حذف الحركة " },
              {
                collection: "transactions",
                record: { id: String(id) },
                op: "remove",
                idField: "id",
              },
            );
          },
          onError: function () {
            unfreeze();
          },
        });
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
</script>
