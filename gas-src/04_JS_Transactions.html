<script>
  // ───────────────────────────────────────────────────────────────
  // JS_Transactions.html — جزء 4/10 من JavaScript.html الأصلي
  // النطاق الأصلي: سطر 7663–11608 | الحركات (وارد/صادر/تحويل) + Multi-item helpers + Party autocomplete
  // ───────────────────────────────────────────────────────────────

  // الحركات — Transactions
  // ─────────────────────────────────────────────────────────────

  // ── أدوات مشتركة للحركات ──────────────────────────────────
  function _txWarehouseOpts() {
    return APP.data.warehouses
      .map(function (wh) {
        var label = wh.code
          ? esc(wh.name || wh.id) + " (" + esc(wh.code) + ")"
          : esc(wh.name || wh.id);
        return (
          '<option value="' + esc(wh.name || wh.id) + '">' + label + "</option>"
        );
      })
      .join("");
  }

  // ─────────────────────────────────────────────────────────────
  // [FIX-SelectionEngine] كان Custom Picker مستقل بمنطقه الخاص (نظام
  // موازٍ لـ AppSelect) — تحوّل لـ delegator رفيع فوق AppSelect.upgrade
  // بنفس الاسم والتوقيع، فمفيش أي نقطة استدعاء (in-to/out-from/tr-from/
  // tr-to/disp-wh/fr-wh) احتاجت تعديل.
  // ─────────────────────────────────────────────────────────────
  function _upgradeWhSelect(selectId) {
    var sel = document.getElementById(selectId);
    if (!sel || sel._whUpgraded) return;
    sel._whUpgraded = true;
    if (window.AppSelect) {
      AppSelect.upgrade(selectId, {
        icon: "ti-building-warehouse",
        searchable: true,
        placeholder: "— اختر المخزن —",
      });
    }
  }

  function _submitTx(tx, page, btnEl) {
    if (!tx.item_id) return NotificationEngine.error("اختر الصنف");
    if (!tx.quantity || tx.quantity <= 0)
      return NotificationEngine.error("أدخل كمية صحيحة");
    btnEl.disabled = true;
    // [SE-ROLLOUT] عبر SaveEngine.run بدل google.script.run/_gsr المباشر
    SaveEngine.run({
      screen: "Transactions",
      entity: "transaction",
      fn: "addTransaction",
      data: tx,
      params: function (data) {
        return [data];
      },
      savingLabel: "جاري حفظ الحركة...",
      onSuccess: function () {
        btnEl.disabled = false;
        reloadAfterMutation(function () {
          renderPage(page);
        });
      },
      onError: function () {
        btnEl.disabled = false;
      },
    });
  }
  function _autoSelectWarehouse(itemId, selectId, badgeId) {
    var wh = getWarehouseForItem(itemId);
    var sel = document.getElementById(selectId);
    var badge = badgeId ? document.getElementById(badgeId) : null;
    if (!sel) return;

    if (wh) {
      // حاول تطابق بالاسم أو الـ ID
      var matched = false;
      for (var i = 0; i < sel.options.length; i++) {
        var v = sel.options[i].value;
        if (v === wh || v.toLowerCase() === wh.toLowerCase()) {
          sel.selectedIndex = i;
          matched = true;
          break;
        }
      }
      // أظهر badge التحديث التلقائي
      if (badge) {
        badge.textContent = matched ? " تم التحديد تلقائياً" : "";
        badge.style.display = matched ? "inline" : "none";
      }
    } else {
      sel.selectedIndex = 0;
      if (badge) badge.style.display = "none";
    }
  }

  // ── نموذج التسجيل العام (Legacy) ────────────────────────────
  // ─────────────────────────────────────────────────────────────
  // TRANSFER (تسجيل حركة)
  // ─────────────────────────────────────────────────────────────

  // تحديث ظهور حقول المستودع حسب نوع الحركة
  function onTxTypeChange() {
    var type = document.getElementById("tx-type").value;
    var fromWrap = document.getElementById("tx-from-wrap");
    var toWrap = document.getElementById("tx-to-wrap");

    if (type === "IN") {
      // وارد: إلى مستودع فقط
      fromWrap.style.display = "none";
      toWrap.style.display = "";
      document.getElementById("tx-from").value = "";
    } else if (type === "OUT") {
      // صادر: من مستودع فقط
      fromWrap.style.display = "";
      toWrap.style.display = "none";
      document.getElementById("tx-to").value = "";
    } else {
      // تحويل: الاثنين معاً
      fromWrap.style.display = "";
      toWrap.style.display = "";
    }

    // إعادة ملء المستودعات تلقائياً بعد تغيير النوع
    autoFillWarehouse();
  }
  // ملء المستودعات تلقائيًا بناءً على نوع الحركة والصنف
  function autoFillWarehouse() {
    var itemId = document.getElementById("tx-item").value;
    var type = document.getElementById("tx-type").value;

    if (!itemId) return;

    var warehouse = getWarehouseForItem(itemId);

    if (!warehouse) warehouse = "الرئيسي";

    if (type === "OUT") {
      document.getElementById("tx-from").value = warehouse;
    } else if (type === "IN") {
      document.getElementById("tx-to").value = warehouse;
    } else if (type === "TRANSFER") {
      document.getElementById("tx-from").value = warehouse;
      document.getElementById("tx-to").value = "";
    }
  }

  function toggleTransferFields() {
    var type = document.getElementById("tx-type").value;
    var fromWrap = document.getElementById("tx-from-wrap");
    var toLbl = document.getElementById("tx-to-label");
    if (fromWrap) fromWrap.style.display = type === "TRANSFER" ? "" : "none";
    if (toLbl)
      toLbl.textContent =
        type === "IN"
          ? "إلى مستودع *"
          : type === "OUT"
            ? "من مستودع *"
            : "إلى مستودع *";
  }

  function bindTransfer() {
    // تطبيق حالة الحقول حسب النوع الافتراضي عند فتح الشاشة
    onTxTypeChange();
    // تهيئة CCD اللون بحالة placeholder ابتداءً
    _rebuildColorSelect("tx-color", "tx-item", "tx-to");

    var btn = document.getElementById("btn-save-tx");
    if (!btn) return;

    // ربط تغيير الصنف لتحديث اللون
    var txItemSel = document.getElementById("tx-item");
    if (txItemSel) {
      txItemSel.addEventListener("change", function () {
        _rebuildColorSelect("tx-color", "tx-item", "tx-to");
      });
    }

    btn.addEventListener("click", function () {
      var type = document.getElementById("tx-type").value;
      var fromEl = document.getElementById("tx-from");
      var toEl = document.getElementById("tx-to");
      var colorEl = document.getElementById("tx-color");

      var tx = {
        type: type,
        item_id: document.getElementById("tx-item").value,
        quantity: Number(document.getElementById("tx-qty").value),
        from_warehouse:
          fromEl &&
          document.getElementById("tx-from-wrap").style.display !== "none"
            ? fromEl.value.trim()
            : "",
        to_warehouse:
          toEl && document.getElementById("tx-to-wrap").style.display !== "none"
            ? toEl.value.trim()
            : "",
        color: colorEl ? colorEl.value : "",
        notes: document.getElementById("tx-notes").value.trim(),
        user: APP.currentUser.username || "", // BUG-6 FIX: username لـ _checkPermission,
      };

      if (!tx.item_id) return NotificationEngine.error("اختر الصنف");
      if (!tx.quantity || tx.quantity <= 0)
        return NotificationEngine.error("أدخل كمية صحيحة");
      if (type === "IN" && !tx.to_warehouse)
        return NotificationEngine.error("أدخل المستودع المستلم");
      if (type === "OUT" && !tx.from_warehouse)
        return NotificationEngine.error("أدخل المستودع المُصدر منه");
      if (type === "TRANSFER" && (!tx.from_warehouse || !tx.to_warehouse))
        return NotificationEngine.error("أدخل المستودعين (من / إلى)");

      btn.disabled = true;
      // [SE-ROLLOUT] عبر SaveEngine.run بدل google.script.run/_gsr المباشر
      SaveEngine.run({
        screen: "Transactions",
        entity: "transaction",
        fn: "addTransaction",
        data: tx,
        params: function (data) {
          return [data];
        },
        savingLabel: "جاري حفظ الحركة...",
        onSuccess: function () {
          btn.disabled = false;
          reloadAfterMutation(function () {
            renderPage("transfer");
          });
        },
        onError: function () {
          btn.disabled = false;
        },
      });
    });
  }

  // ── وارد ─────────────────────────────────────────────────────
  // ---- وارد ----

  // ── رفع مرفق إذن الوارد/الصادر ──────────────────────────────

  var _txFiles = { in: null, out: null, tr: null }; // يخزن الملف المختار لكل نوع

  function handleTxFileSelect(input, prefix) {
    var file = input.files[0];
    if (!file) return;
    _txFiles[prefix] = file;

    var previewEl = document.getElementById(prefix + "-attach-preview");
    var areaEl = document.getElementById(prefix + "-attach-area");
    var statusEl = document.getElementById(prefix + "-upload-status");

    // زرار مسح مشترك
    var clearBtn =
      '<button type="button" onclick="clearTxFile(\'' +
      prefix +
      "')\" " +
      'style="margin-top:8px;background:none;border:1px solid var(--danger);color:var(--danger);' +
      'border-radius:6px;padding:3px 12px;cursor:pointer;font-size:12px"> إزالة الملف</button>';

    if (file.type.startsWith("image/")) {
      var reader = new FileReader();
      reader.onload = function (e) {
        previewEl.innerHTML =
          '<img src="' +
          e.target.result +
          '" style="max-height:120px;max-width:100%;border-radius:8px;object-fit:cover">' +
          '<div style="font-size:12px;color:var(--success);margin-top:6px;font-weight:600"> ' +
          esc(file.name) +
          "</div>" +
          clearBtn;
      };
      reader.readAsDataURL(file);
    } else {
      previewEl.innerHTML =
        '<div style="font-size:32px"></div>' +
        '<div style="font-size:12px;color:var(--success);margin-top:6px;font-weight:600"> ' +
        esc(file.name) +
        "</div>" +
        clearBtn;
    }

    areaEl.style.borderColor = "var(--success)";
    areaEl.style.background = "var(--success-soft)";
    // أخفِ شريط الحالة القديم عند اختيار ملف جديد
    if (statusEl) {
      statusEl.style.display = "none";
      statusEl.innerHTML = "";
    }
  }

  function clearTxFile(prefix) {
    _txFiles[prefix] = null;
    // أعد ضبط الـ input
    var fileInput = document.getElementById(prefix + "-file");
    if (fileInput) fileInput.value = "";
    // أعد الـ preview للحالة الابتدائية
    var previewEl = document.getElementById(prefix + "-attach-preview");
    if (previewEl)
      previewEl.innerHTML =
        '<div style="font-size:28px"></div>' +
        '<div style="font-size:13px;color:var(--text3);margin-top:4px">اضغط لاختيار صورة أو PDF من التلفون أو الجهاز</div>';
    // أعد لون منطقة الرفع
    var areaEl = document.getElementById(prefix + "-attach-area");
    if (areaEl) {
      areaEl.style.borderColor = "var(--border)";
      areaEl.style.background = "var(--surface2)";
    }
    // أخفِ شريط الحالة
    var statusEl = document.getElementById(prefix + "-upload-status");
    if (statusEl) {
      statusEl.style.display = "none";
      statusEl.innerHTML = "";
    }
  }

  // رفع الملف وبعدين تسجيل الإذن
  function _uploadThenSubmit(tx, page, btn) {
    var prefix = tx.type === "IN" ? "in" : "out";
    var file = _txFiles[prefix];

    // لو مفيش ملف — سجّل مباشرةً
    if (!file) {
      _doSubmitTx(tx, page, btn);
      return;
    }

    // فيه ملف — ارفعه الأول
    var statusEl = document.getElementById(prefix + "-upload-status");
    if (statusEl) {
      statusEl.style.display = "flex";
      statusEl.innerHTML =
        '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> جاري رفع المرفق...';
    }
    btn.disabled = true;
    btn.textContent = " جاري رفع الملف...";
    NotificationEngine.loading("جاري رفع المرفق...");

    var reader = new FileReader();
    reader.onload = function (e) {
      var base64 = e.target.result.split(",")[1];
      _gsr(
        "uploadFile",
        [
          base64,
          file.name,
          file.type,
          {
            userName: APP.currentUser
              ? APP.currentUser.full_name ||
                APP.currentUser.username ||
                "مستخدم"
              : "مستخدم",
            moduleName: tx.type === "IN" ? "إذن وارد" : "إذن صادر",
          },
        ],
        {
          label: "uploadFile",
          rawResponse: true,
          onSuccess: function (r) {
            var res = r && r.data;
            var result;
            try {
              result = JSON.parse(res);
            } catch (ex) {
              result = { success: false, error: ex.message };
            }

            if (result.success) {
              if (statusEl) statusEl.innerHTML = " تم رفع المرفق بنجاح";
              tx.attachment_url = result.viewUrl;
              _txFiles[prefix] = null; // نظّف بعد الرفع
              dismissLoadingToast(); // هيبدأ لودينج تاني في _doSubmitTx
              _doSubmitTx(tx, page, btn);
            } else {
              if (statusEl)
                statusEl.innerHTML =
                  " فشل رفع الملف: " + esc(result.error || "");
              btn.disabled = false;
              btn.textContent =
                tx.type === "IN" ? " تسجيل الوارد" : " تسجيل الصادر";
              finishLoadingToast(
                " فشل رفع الملف — " + (result.error || ""),
                "error",
              );
            }
          },
          onError: function (r) {
            if (statusEl) statusEl.innerHTML = " خطأ في الرفع";
            btn.disabled = false;
            btn.textContent =
              tx.type === "IN" ? " تسجيل الوارد" : " تسجيل الصادر";
            finishLoadingToast(" خطأ: " + (r.message || r), "error");
          },
        },
      );
    };
    reader.readAsDataURL(file);
  }

  // تسجيل الحركة الفعلي (بعد الرفع أو بدونه)
  function _doSubmitTx(tx, page, btn) {
    btn.disabled = true;
    btn.textContent = "⏳ جاري التسجيل...";
    // [SE-ROLLOUT] عبر SaveEngine.run بدل google.script.run/_gsr المباشر
    SaveEngine.run({
      screen: "Transactions",
      entity: "transaction",
      fn: "addTransaction",
      data: tx,
      params: function (data) {
        return [data];
      },
      savingLabel: "جاري تسجيل الحركة...",
      onSuccess: function () {
        btn.disabled = false;
        btn.textContent =
          tx.type === "IN" ? " تسجيل الوارد" : " تسجيل الصادر";
        _txFiles[tx.type === "IN" ? "in" : "out"] = null;
        reloadAfterMutation(function () {
          renderPage(page);
        });
      },
      onError: function () {
        btn.disabled = false;
        btn.textContent =
          tx.type === "IN" ? " تسجيل الوارد" : " تسجيل الصادر";
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // Multi-Item TX Helpers
  // ─────────────────────────────────────────────────────────────

  // مصفوفة الأصناف المضافة للإذن (IN أو OUT)
  var _txItemsStore = { IN: [], OUT: [] };

  // تصفير الأصناف عند فتح الصفحة
  function _resetTxItems(type) {
    _txItemsStore[type] = [];
    var prefix = type === "IN" ? "in" : "out";
    var tbody = document.getElementById(prefix + "-items-tbody");
    var colspan = type === "IN" ? "6" : "6";
    var emptyMsg =
      type === "IN"
        ? '<div style="font-size:36px;margin-bottom:10px"></div>لم تُضَف أصناف بعد — استخدم الأداة أعلاه لإضافة أصناف'
        : " لم تُضَف أصناف بعد";
    var emptyClass =
      type === "IN"
        ? ' class="tx-in-empty-state"'
        : ' style="text-align:center;color:var(--text3);padding:20px;font-size:13px"';
    if (tbody)
      tbody.innerHTML =
        '<tr id="' +
        prefix +
        '-empty-row"><td colspan="' +
        colspan +
        '"' +
        emptyClass +
        ">" +
        emptyMsg +
        "</td></tr>";
    _updateTxSummary(type);
  }

  // إضافة صف صنف جديد من حقول الـ tfoot
  function _addTxItemRow(type) {
    var prefix = type === "IN" ? "in" : "out";
    var whKey = type === "IN" ? "in-to" : "out-from";
    var itemSel = document.getElementById(prefix + "-item");
    var whSel = document.getElementById(whKey);
    var colorSel = document.getElementById(prefix + "-color");
    var qtyEl = document.getElementById(prefix + "-qty");
    var notesEl = document.getElementById(prefix + "-row-notes");
    // [TRACKING-FIELDS-2026-08-08]
    var batchNoEl = document.getElementById(prefix + "-batch-no");
    var expiryEl = document.getElementById(prefix + "-expiry-date");
    var serialNoEl = document.getElementById(prefix + "-serial-no");

    var itemId = itemSel ? itemSel.value.trim() : "";
    var wh = whSel ? whSel.value.trim() : "";
    var color = colorSel ? colorSel.value.trim() : "";
    var qty = Number(qtyEl ? qtyEl.value : 0);
    var notes = notesEl ? notesEl.value.trim() : "";
    var batchNo = batchNoEl ? batchNoEl.value.trim() : "";
    var expiryDate = expiryEl ? expiryEl.value.trim() : "";
    var serialNo = serialNoEl ? serialNoEl.value.trim() : "";

    if (!itemId) return NotificationEngine.error("اختر الصنف أولاً");
    if (!wh)
      return NotificationEngine.error(type === "IN" ? "اختر مخزن الاستلام" : "اختر مخزن الصرف");
    if (qty <= 0) return NotificationEngine.error("أدخل كمية أكبر من صفر");

    // [TRACKING-FIELDS-2026-08-08] تنبيه فوري للمستخدم — الفحص الملزم الحقيقي
    // في addTransaction/addBatchTransaction (Backend)، هنا بس لتحسين التجربة.
    var _selItemForCheck = (APP.data.items || []).find(function (it) {
      return it.id === itemId;
    });
    var _trackingTypeCheck = _selItemForCheck ? _selItemForCheck.tracking_type || "normal" : "normal";
    if (_trackingTypeCheck === "batch" && !batchNo)
      return NotificationEngine.error(" هذا الصنف يتطلب رقم دفعة (Batch)");
    if (_trackingTypeCheck === "serial") {
      if (!serialNo) return NotificationEngine.error(" هذا الصنف يتطلب رقم تسلسلي (Serial)");
      if (qty !== 1) return NotificationEngine.error(" الأصناف ذات الرقم التسلسلي يجب أن تكون كميتها 1 بالضبط");
    }

    // [FIX-STAGE2] اللون مطلوب عند الصرف (OUT) إذا كان الصنف له ألوان معرفة —
    // هذا الفحص كان موجودًا في نسخة قديمة معطّلة (Templates_02.html) وفُقد أثناء
    // إعادة الكتابة هنا. الباك اند (addBatchTransaction) يرفض العملية أصلاً في
    // هذه الحالة لو نوعها OUT/TRANSFER — هذا الفحص هنا فقط لإخبار المستخدم فورًا
    // بدل انتظار رفض السيرفر بعد إرسال الإذن كاملاً.
    if (type === "OUT") {
      var itemColorsCheck = getItemColors(itemId);
      if (itemColorsCheck.length && !color)
        return NotificationEngine.error(" يجب اختيار اللون — هذا الصنف له ألوان معرفة");
    }

    // اسم الصنف للعرض
    var itemObj = (APP.data.items || []).find(function (it) {
      return it.id === itemId;
    });
    var itemName = itemObj ? itemObj.name || itemId : itemId;

    // إضافة للمصفوفة
    var rowData = {
      item_id: itemId,
      item_name: itemName,
      warehouse: wh,
      color: color,
      quantity: qty,
      notes: notes,
      batch_no: batchNo,
      serial_no: serialNo,
      expiry_date: expiryDate,
    };
    _txItemsStore[type].push(rowData);

    // إضافة صف في الـ tbody
    var tbody = document.getElementById(prefix + "-items-tbody");
    var emptyRow = document.getElementById(prefix + "-empty-row");
    if (emptyRow) emptyRow.remove();

    var idx = _txItemsStore[type].length - 1;
    var colorBadge = color
      ? '<span style="background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:20px;font-size:12px">' +
        esc(color) +
        "</span>"
      : '<span style="color:var(--text3);font-size:11px">—</span>';
    // [TRACKING-FIELDS-2026-08-08] badge صغير لرقم الدفعة/الصلاحية أو السيريال — إضافي بجانب الكود، من غير ما نضيف عمود جديد للجدول
    var trackingBadge = "";
    if (batchNo)
      trackingBadge +=
        ' <span style="font-size:10px;background:var(--palette-amber-100,#fef3c7);color:var(--palette-amber-800,#92400e);padding:1px 6px;border-radius:5px">دفعة: ' +
        esc(batchNo) +
        (expiryDate ? " | صلاحية: " + esc(expiryDate) : "") +
        "</span>";
    if (serialNo)
      trackingBadge +=
        ' <span style="font-size:10px;background:var(--palette-blue-100,#dbeafe);color:var(--palette-blue-800,#1e40af);padding:1px 6px;border-radius:5px">SN: ' +
        esc(serialNo) +
        "</span>";

    var tr = document.createElement("tr");
    tr.id = prefix + "-row-" + idx;

    // استخدام الكلاسات الجديدة للـ IN، وإبقاء الـ OUT كما هو
    if (type === "IN") {
      var hue = function (s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
        return Math.abs(h) % 360;
      };
      var cDotHex =
        typeof colorNameToHex === "function"
          ? colorNameToHex(color)
          : "hsl(" + hue(color) + ",55%,58%)";
      var cHtml = color
        ? '<span class="tx-in-color-pill"><span class="tx-in-color-dot" style="background:' +
          cDotHex +
          '"></span>' +
          esc(color) +
          "</span>"
        : '<span style="color:var(--text3)">—</span>';

      // اسم الوحدة من بيانات الصنف
      var unitName = itemObj ? itemObj.unit || "قطعة" : "قطعة";

      tr.innerHTML =
        '<td style="text-align:center"><span class="tx-in-row-num">' +
        (idx + 1) +
        "</span></td>" +
        '<td><b style="margin-left:6px">' +
        esc(itemName) +
        '</b><span class="mono" style="font-size:11px;color:var(--accent);font-weight:700;background:var(--accent-soft);padding:1px 6px;border-radius:5px">' +
        esc(itemObj ? itemObj.code || itemId : itemId) +
        "</span>" +
        trackingBadge +
        "</td>" +
        "<td>" +
        cHtml +
        "</td>" +
        '<td style="text-align:center"><span class="tx-in-qty-badge">' +
        qty +
        "</span></td>" +
        '<td style="text-align:center"><span class="tx-in-unit-pill">' +
        esc(unitName) +
        "</span></td>" +
        '<td style="text-align:center;display:flex;gap:4px;justify-content:center;align-items:center">' +

        type +
        "'," +

        ')" title="تعديل"><i class="ti ti-pencil"></i></button>' +

        "'," +
        idx +
        ')" title="حذف"></button>' +
        "</td>";
    } else {
      // OUT — نفس بنية IN بكلاسات tx-out-*
      var hue2 = function (s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
        return Math.abs(h) % 360;
      };
      var cDot2Hex =
        typeof colorNameToHex === "function"
          ? colorNameToHex(color)
          : "hsl(" + hue2(color) + ",55%,58%)";
      var cHtml2 = color
        ? '<span class="tx-out-color-pill"><span class="tx-out-color-dot" style="background:' +
          cDot2Hex +
          '"></span>' +
          esc(color) +
          "</span>"
        : '<span style="color:var(--text3)">—</span>';

      var unitName2 = itemObj ? itemObj.unit || "قطعة" : "قطعة";

      tr.innerHTML =
        '<td style="text-align:center"><span class="tx-out-row-num">' +
        (idx + 1) +
        "</span></td>" +
        '<td><b style="margin-left:6px">' +
        esc(itemName) +
        '</b><span class="mono" style="font-size:11px;color:var(--accent);font-weight:700;background:var(--accent-soft);padding:1px 6px;border-radius:5px">' +
        esc(itemObj ? itemObj.code || itemId : itemId) +

        trackingBadge +
        "</td>" +
        "<td>" +
        cHtml2 +
        "</td>" +
        '<td style="text-align:center"><span class="tx-out-qty-badge">' +
        qty +
        "</span></td>" +
        '<td style="text-align:center"><span class="tx-out-unit-pill">' +
        esc(unitName2) +
        "</span></td>" +
        '<td style="text-align:center;display:flex;gap:4px;justify-content:center;align-items:center">' +
        '<button class="tx-out-btn-edit" onclick="_editTxItemRow(\'' +
        type +
        "'," +
        idx +
        ')" title="تعديل"><i class="ti ti-pencil"></i></button>' +
        '<button class="tx-out-btn-delete" onclick="_removeTxItemRow(\'' +
        type +
        "'," +
        idx +
        ')" title="حذف"></button>' +
        "</td>";
    }
    tbody.appendChild(tr);

    // تصفير حقول الإضافة
    if (qtyEl) qtyEl.value = "";
    if (notesEl) notesEl.value = "";
    if (colorSel) _resetCCD(prefix + "-color");
    if (batchNoEl) batchNoEl.value = "";
    if (expiryEl) expiryEl.value = "";
    if (serialNoEl) serialNoEl.value = "";

    _updateTxSummary(type);
  }

  // تعديل صف — يرجع البيانات لحقول الإضافة ويحذف الصف
  function _editTxItemRow(type, idx) {
    var row = _txItemsStore[type][idx];
    if (!row) return;
    var prefix = type === "IN" ? "in" : "out";
    var whKey = type === "IN" ? "in-to" : "out-from";

    // ملء حقل الصنف
    var itemSel = document.getElementById(prefix + "-item");
    if (itemSel) {
      itemSel.value = row.item_id;
      // trigger change لتحميل الألوان
      itemSel.dispatchEvent(new Event("change"));
    }

    // ملء المخزن
    var whSel = document.getElementById(whKey);
    if (whSel) whSel.value = row.warehouse;

    // ملء الكمية
    var qtyEl = document.getElementById(prefix + "-qty");
    if (qtyEl) qtyEl.value = row.quantity;

    // ملء اللون بعد تأخير بسيط (ريثما تُحمَّل قائمة الألوان)
    setTimeout(function () {
      var colorSel = document.getElementById(prefix + "-color");
      if (colorSel && row.color) colorSel.value = row.color;
    }, 150);

    // ملء الملاحظات
    var notesEl = document.getElementById(prefix + "-row-notes");
    if (notesEl) notesEl.value = row.notes || "";

    // [TRACKING-FIELDS-2026-08-08] ملء رقم الدفعة/الصلاحية/السيريال بعد تأخير بسيط
    // (ريثما يظهر الـ handler الحقول المناسبة حسب نوع الصنف)
    setTimeout(function () {
      var batchNoEl = document.getElementById(prefix + "-batch-no");
      var expiryEl = document.getElementById(prefix + "-expiry-date");
      var serialNoEl = document.getElementById(prefix + "-serial-no");
      if (batchNoEl) batchNoEl.value = row.batch_no || "";
      if (expiryEl) expiryEl.value = row.expiry_date || "";
      if (serialNoEl) serialNoEl.value = row.serial_no || "";
    }, 150);

    // حذف الصف من الـ store والجدول
    _removeTxItemRow(type, idx);

    // تمرير للأعلى نحو حقول الإضافة
    var inputZone =
      document.getElementById(prefix + "-input-zone") ||
      document.getElementById(prefix + "-item");
    if (inputZone)
      inputZone.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  // حذف صف من الجدول
  function _removeTxItemRow(type, idx) {
    var prefix = type === "IN" ? "in" : "out";
    _txItemsStore[type][idx] = null; // إبقاء الـ index ثابت
    var row = document.getElementById(prefix + "-row-" + idx);
    if (row) row.remove();
    // لو مفيش أصناف باقية أضف رسالة فاضي
    var remaining = _txItemsStore[type].filter(Boolean);
    if (!remaining.length) {
      var tbody = document.getElementById(prefix + "-items-tbody");
      var colspan = type === "IN" ? "6" : "6";
      var emptyMsg =
        type === "IN"
          ? '<div style="font-size:36px;margin-bottom:10px"></div>لم تُضَف أصناف بعد — استخدم الأداة أعلاه لإضافة أصناف'
          : '<div style="font-size:36px;margin-bottom:10px"></div>لم تُضَف أصناف بعد — استخدم الأداة أعلاه لإضافة أصناف';
      var emptyClass =
        type === "IN"
          ? ' class="tx-in-empty-state"'
          : ' class="tx-out-empty-state"';
      if (tbody)
        tbody.innerHTML =
          '<tr id="' +
          prefix +
          '-empty-row"><td colspan="' +
          colspan +
          '"' +
          emptyClass +
          ">" +
          emptyMsg +
          "</td></tr>";
    }
    _updateTxSummary(type);
  }

  // تحديث ملخص الأصناف والكميات
  function _updateTxSummary(type) {
    var prefix = type === "IN" ? "in" : "out";
    var items = (_txItemsStore[type] || []).filter(Boolean);
    var totalQty = items.reduce(function (s, it) {
      return s + (it.quantity || 0);
    }, 0);
    var count = items.length;

    var summaryEl = document.getElementById(prefix + "-summary");
    var summaryMini = document.getElementById(prefix + "-summary-mini");
    var countBadge = document.getElementById(prefix + "-items-count");

    var txt = count
      ? count + " نوع — إجمالي الكميات: " + totalQty + " وحدة"
      : "لا توجد أصناف مضافة بعد";

    if (summaryMini) summaryMini.textContent = count + " صنف";
    if (countBadge) {
      countBadge.textContent = count + " صنف";
      countBadge.style.display = count ? "inline-flex" : "none";
    }
    // تحديث خاص للـ IN: summary bar الجديدة
    if (type === "IN") {
      if (summaryEl) {
        summaryEl.style.display = count ? "flex" : "none";
        var totalEl = document.getElementById("summary-total");
        if (totalEl)
          totalEl.textContent = count + " صنف — " + totalQty + " وحدة إجمالية";
      }
      var step2 = document.getElementById("step2");
      var step3 = document.getElementById("step3");
      if (step2)
        step2.className = count ? "tx-in-step tx-in-step-active" : "tx-in-step";
      if (step3)
        step3.className = count ? "tx-in-step tx-in-step-active" : "tx-in-step";
    } else {
      // OUT — نفس منطق IN
      if (summaryEl) {
        summaryEl.style.display = count ? "flex" : "none";
        var outTotalEl = document.getElementById("out-summary-total");
        if (outTotalEl)
          outTotalEl.textContent =
            count + " صنف — " + totalQty + " وحدة إجمالية";
      }
      var outStep2 = document.getElementById("out-step2");
      var outStep3 = document.getElementById("out-step3");
      if (outStep2)
        outStep2.className = count
          ? "tx-out-step tx-out-step-active"
          : "tx-out-step";
      if (outStep3)
        outStep3.className = count
          ? "tx-out-step tx-out-step-active"
          : "tx-out-step";
    }
  }

  // تسجيل الإذن كاملاً (Batch)
  function _submitMultiTx(type, btn) {
    var prefix = type === "IN" ? "in" : "out";
    var items = (_txItemsStore[type] || []).filter(Boolean);

    if (!items.length) return NotificationEngine.error("أضف صنفاً واحداً على الأقل");

    // ── [VF] التحقق الموحّد على حقول الإذن ────────────────────────────
    if (typeof VF !== "undefined") {
      var _txVfCfg =
        prefix === "out"
          ? [
              {
                fieldId: "out-from",
                rules: VF.RULES.requiredText("المخزن المُصدر"),
              },
            ]
          : [
              {
                fieldId: "in-to",
                rules: VF.RULES.requiredSelect("المخزن المستلم"),
              },
            ];
      if (!VF.quickSave(_txVfCfg)) return;
    }
    // ────────────────────────────────────────────────────────────────────

    // بناء الـ batch object
    var refEl = document.getElementById(prefix + "-ref");
    var partyEl = document.getElementById(prefix + "-party");
    var notesEl = document.getElementById(prefix + "-notes");

    var batchItems = items.map(function (it) {
      return {
        item_id: it.item_id,
        quantity: it.quantity,
        from_warehouse: type === "OUT" ? it.warehouse : "",
        to_warehouse: type === "IN" ? it.warehouse : "",
        color: it.color || "",
        notes: it.notes || "",
      };
    });

    var permitEl = document.getElementById(prefix + "-permit-id");
    var permitId = permitEl
      ? (permitEl.value != null
          ? String(permitEl.value)
          : String(permitEl.textContent || "")
        ).trim()
      : "";

    var batch = {
      type: type,
      items: batchItems,
      permit_id: permitId,
      ref: refEl && refEl.value != null ? String(refEl.value).trim() : "",
      party: (function () {
        var hiddenEl = document.getElementById(prefix + "-party-id");
        var hiddenVal = hiddenEl ? String(hiddenEl.value || "").trim() : "";
        // لو الـ hidden فاضي (بيانات قديمة أو كتب يدوي) — ارجع للـ input value
        if (hiddenVal) return hiddenVal;
        return partyEl && partyEl.value != null
          ? String(partyEl.value).trim()
          : "";
      })(),
      notes:
        notesEl && notesEl.value != null ? String(notesEl.value).trim() : "",
      user: APP.currentUser ? APP.currentUser.username || "" : "",
      // ── v4.2: بيانات الشحن ──
      needs_shipping: (function () {
        if (type !== "OUT") return false;
        var chk = document.getElementById("out-needs-shipping");
        return chk ? chk.checked : false;
      })(),
      shipping_driver: (function () {
        var el = document.getElementById("out-shipping-driver");
        return el ? el.value.trim() : "";
      })(),
      shipping_company: (function () {
        var el = document.getElementById("out-shipping-company");
        return el ? el.value.trim() : "";
      })(),
      shipping_expected_date: (function () {
        var el = document.getElementById("out-shipping-expected-date");
        return el ? el.value : "";
      })(),
    };

    // لو فيه ملف مرفق — ارفعه الأول ثم سجّل
    var file = _txFiles[prefix];
    if (file) {
      var statusEl = document.getElementById(prefix + "-upload-status");
      if (statusEl) {
        statusEl.style.display = "flex";
        statusEl.innerHTML =
          '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> جاري رفع المرفق...';
      }
      btn.disabled = true;
      btn.textContent = " جاري رفع الملف...";
      NotificationEngine.loading("جاري رفع المرفق...");

      var reader = new FileReader();
      reader.onload = function (e) {
        var base64 = e.target.result.split(",")[1];
        _gsr(
          "uploadFile",
          [
            base64,
            file.name,
            file.type,
            {
              userName: APP.currentUser
                ? APP.currentUser.full_name ||
                  APP.currentUser.username ||
                  "مستخدم"
                : "مستخدم",
              moduleName: type === "IN" ? "إذن وارد" : "إذن صادر",
            },
          ],
          {
            label: "uploadFile:batch",
            rawResponse: true,
            onSuccess: function (r) {
              var res = r && r.data;
              var result;
              try {
                result = JSON.parse(res);
              } catch (ex) {
                result = { success: false, error: ex.message };
              }
              if (result.success) {
                if (statusEl) statusEl.innerHTML = " تم رفع المرفق";
                batch.attachment_url = result.viewUrl;
                _txFiles[prefix] = null;
                dismissLoadingToast(); // هيبدأ لودينج تاني في _doSubmitBatch
                _doSubmitBatch(batch, type, btn);
              } else {
                if (statusEl) statusEl.innerHTML = " فشل رفع الملف";
                btn.disabled = false;
                btn.textContent =
                  type === "IN" ? " تسجيل إذن الوارد" : " تسجيل إذن الصادر";
                finishLoadingToast(
                  " فشل رفع الملف — " + (result.error || ""),
                  "error",
                );
              }
            },
            onError: function (r) {
              if (statusEl) statusEl.innerHTML = " خطأ في الرفع";
              btn.disabled = false;
              btn.textContent =
                type === "IN" ? " تسجيل إذن الوارد" : " تسجيل إذن الصادر";
              finishLoadingToast(" خطأ: " + (r.message || r), "error");
            },
          },
        );
      };
      reader.readAsDataURL(file);
    } else {
      _doSubmitBatch(batch, type, btn);
    }
  }

  // الاستدعاء الفعلي للـ backend بعد الرفع أو بدونه
  function _doSubmitBatch(batch, type, btn) {
    var prefix = type === "IN" ? "in" : "out";
    btn.disabled = true;
    btn.textContent = "⏳ جاري التسجيل...";

    // [SE-ROLLOUT] عبر SaveEngine.run بدل google.script.run/_gsr المباشر
    SaveEngine.run({
      screen: "Transactions",
      entity: "transaction_batch",
      fn: "addBatchTransaction",
      data: batch,
      params: function (data) {
        return [data];
      },
      savingLabel: "جاري تسجيل الإذن...",
      onSuccess: function (r) {
        btn.disabled = false;
        btn.textContent =
          type === "IN" ? " تسجيل إذن الوارد" : " تسجيل إذن الصادر";
        {
          var permitId =
            r.data && r.data.permitId ? r.data.permitId : batch.permit_id || "";
          var countTxt =
            r.data && r.data.count
              ? r.data.count + (r.data.count === 1 ? " صنف" : " أصناف")
              : "";
          // v4.2: رسالة إضافية لو needs_shipping (النجاح نفسه بيبقى معروض
          // بالفعل عبر LoadingService داخل SaveEngine)
          if (batch.needs_shipping) {
            NotificationEngine.info(" تم إنشاء طلب شحن تلقائياً — راجع شاشة الشحن", {
              duration: 5000
            });
          }
          _txFiles[prefix] = null;
          _txItemsStore[type] = [];

          var currentPage = type === "IN" ? "tx_in" : "tx_out";

          // Optimistic: أضف الحركات الجديدة محلياً فوراً
          var now = new Date().toISOString();
          var optimisticTxs = batch.items.map(function (it, idx) {
            return {
              id: permitId + "_" + idx,
              permit_id: permitId,
              type: type,
              item_id: it.item_id,
              quantity: it.quantity,
              from_warehouse: it.from_warehouse || "",
              to_warehouse: it.to_warehouse || "",
              color: it.color || "",
              notes: it.notes || batch.notes || "",
              user: batch.user || "",
              date: now,
              ref: batch.ref || "",
              party: batch.party || "",
              needs_shipping: batch.needs_shipping ? "TRUE" : "", // v4.2
            };
          });

          if (_cache.data) {
            _cache.data.transactions = (_cache.data.transactions || []).concat(
              optimisticTxs,
            );
            APP.data.transactions = _cache.data.transactions;
            _cache.dynamic_ts = Date.now();
            // FIX: حدّث sessionStorage عشان reloadAfterMutation يشوف الحركات الجديدة
            try {
              var dynamicPart = {
                transactions: _cache.data.transactions,
                stock: _cache.data.stock,
                productionOrders: _cache.data.productionOrders,
                openingStock: _cache.data.openingStock,
                shipments: _cache.data.shipments,
                ts: _cache.dynamic_ts,
              };
              sessionStorage.setItem(
                "wms_cache_dynamic",
                JSON.stringify(dynamicPart),
              );
            } catch (e) {
              /* sessionStorage ممتلئ — مش مشكلة */
            }
          } else {
            // لو _cache.data مش موجود — ابني الـ data من الـ optimistic فقط
            APP.data.transactions = (APP.data.transactions || []).concat(
              optimisticTxs,
            );
          }

          // FIX: لما يفتح سجل الحركات يظهر السند الجديد مباشرةً
          APP._pendingTxFilter = permitId;
          window._txNeedsRefresh = true;

          // تحديث الـ pagination لو صفحة الحركات مفتوحة أو لما تُفتح
          if (
            APP.currentPage === "transactions" &&
            typeof window._applyTxFilter === "function"
          ) {
            window._applyTxFilter();
          }

          reloadAfterMutation(
            function () {
              renderPage(currentPage);
            },
            null,
            { title: "جاري التحديث...", emoji: "", successMsg: "" }, // لا رسالة ثانية — الـ toast فوق كافي
            null, // لا optimisticPatch إضافي لأننا عملناه يدوياً فوق
          );
        }
      },
      onError: function () {
        btn.disabled = false;
        btn.textContent =
          type === "IN" ? " تسجيل إذن الوارد" : " تسجيل إذن الصادر";
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // Party Autocomplete — ربط حقل المورد/العميل بالبيانات
  // inputId   : id الـ input (مثلاً "in-party")
  // dataKey   : "suppliers" | "customers"
  // ─────────────────────────────────────────────────────────────
  function _bindPartyAutocomplete(inputId, dataKey) {
    var inp = document.getElementById(inputId);
    if (!inp) return;

    // عنصر القائمة المنسدلة
    var listId = inputId + "-ac-list";
    // تأكد مش موجود من قبل
    var existing = document.getElementById(listId);
    if (existing) existing.remove();

    var list = document.createElement("div");
    list.id = listId;
    list.className = "party-ac-list";
    list.style.cssText =
      "position:absolute;z-index:9999;background:var(--surface);" +
      "border:1px solid var(--border);border-radius:var(--radius-sm);" +
      "box-shadow:0 4px 16px rgba(0,0,0,0.12);max-height:200px;overflow-y:auto;" +
      "min-width:220px;width:100%;" +
      "visibility:hidden;opacity:0;transform:translateY(-4px);pointer-events:none;" +
      "transition:opacity 0.13s ease,transform 0.13s ease,visibility 0s linear 0.13s;";

    // ضع القائمة كـ sibling بعد الـ input مباشرةً
    inp.parentNode.style.position = "relative";
    inp.parentNode.insertBefore(list, inp.nextSibling);

    var _acTimer = null;
    var _acMouseDown = false;
    var _acJustSelected = false;

    function getRecords() {
      return (APP.data[dataKey] || []).filter(function (r) {
        return !r.deleted_at && String(r.name || "").trim();
      });
    }

    function buildList(q) {
      q = (q || "").trim().toLowerCase();
      var records = getRecords();
      var filtered = q
        ? records.filter(function (r) {
            return (
              String(r.name || "")
                .toLowerCase()
                .indexOf(q) !== -1 ||
              String(r.phone || "")
                .toLowerCase()
                .indexOf(q) !== -1
            );
          })
        : records.slice(0, 12);

      if (!filtered.length) {
        list.innerHTML =
          '<div style="padding:10px 14px;color:var(--text3);font-size:13px">لا توجد نتائج</div>';
      } else {
        list.innerHTML = filtered
          .slice(0, 20)
          .map(function (r) {
            var phone = r.phone
              ? '<span style="font-size:11px;color:var(--text3);margin-right:8px">' +
                esc(r.phone) +
                "</span>"
              : "";
            return (
              '<div class="party-ac-item" data-name="' +
              esc(r.name) +
              '" data-id="' +
              esc(r.id) +
              '" style="padding:9px 14px;cursor:pointer;display:flex;align-items:center;' +
              'justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid var(--border-light, rgba(0,0,0,0.06))">' +
              '<span style="font-weight:600;color:var(--text1)">' +
              esc(r.name) +
              "</span>" +
              phone +
              "</div>"
            );
          })
          .join("");
      }
      showList();
    }

    function showList() {
      list.style.visibility = "visible";
      list.style.opacity = "1";
      list.style.transform = "translateY(0)";
      list.style.pointerEvents = "auto";
      list.style.transition = "opacity 0.13s ease,transform 0.13s ease";
    }

    function hideList() {
      list.style.visibility = "hidden";
      list.style.opacity = "0";
      list.style.transform = "translateY(-4px)";
      list.style.pointerEvents = "none";
      list.style.transition =
        "opacity 0.13s ease,transform 0.13s ease,visibility 0s linear 0.13s";
    }

    // حفظ الـ ID في الـ hidden field المقابل
    function _setPartyId(id) {
      var hiddenId = inputId + "-id";
      var hiddenEl = document.getElementById(hiddenId);
      if (hiddenEl) hiddenEl.value = id || "";
    }

    // أحداث الـ input
    inp.addEventListener("input", function () {
      // لو المستخدم بيكتب يدوياً — امسح الـ ID المحفوظ
      _setPartyId("");
      clearTimeout(_acTimer);
      _acTimer = setTimeout(function () {
        buildList(inp.value);
      }, 120);
    });

    inp.addEventListener("focus", function () {
      if (_acJustSelected) {
        _acJustSelected = false;
        return;
      }
      if (getRecords().length) buildList(inp.value);
    });

    inp.addEventListener("blur", function () {
      if (_acMouseDown) return;
      hideList();

      // [FIX-PARTY-LOCK] التحقق عند مغادرة الحقل
      // لو المستخدم كتب نص لكن ما اختارش من القائمة → امسح الحقل
      if (!_acJustSelected) {
        var hiddenEl = document.getElementById(inputId + "-id");
        var hasValidId = hiddenEl && String(hiddenEl.value || "").trim();
        var hasText = String(inp.value || "").trim();

        if (hasText && !hasValidId) {
          // حاول تطابق تلقائي بالاسم (لو في سجل بنفس الاسم بالظبط)
          var records = getRecords();
          var exact = records.find(function (r) {
            return (
              String(r.name || "")
                .trim()
                .toLowerCase() ===
              String(inp.value || "")
                .trim()
                .toLowerCase()
            );
          });

          if (exact) {
            // مطابقة تامة — اقبلها وحفظ الـ ID
            inp.value = exact.name;
            _setPartyId(exact.id);
          } else {
            // لا توجد مطابقة — امسح الحقل وأظهر تحذير
            inp.value = "";
            _setPartyId("");
            inp.classList.add("input-error");
            inp.placeholder = " اختر من القائمة فقط";
            setTimeout(function () {
              inp.classList.remove("input-error");
              inp.placeholder = inp.getAttribute("data-placeholder") || "";
            }, 2500);
          }
        }
      }
      _acJustSelected = false;
    });

    inp.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        hideList();
        inp.blur();
      }
      if (e.key === "ArrowDown") {
        var items = list.querySelectorAll(".party-ac-item");
        if (items.length) {
          e.preventDefault();
          items[0].focus();
        }
      }
    });

    // أحداث الـ list (keyboard navigation)
    list.addEventListener("keydown", function (e) {
      var items = Array.from(list.querySelectorAll(".party-ac-item"));
      var idx = items.indexOf(document.activeElement);
      if (e.key === "ArrowDown" && idx < items.length - 1) {
        e.preventDefault();
        items[idx + 1].focus();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (idx > 0) items[idx - 1].focus();
        else inp.focus();
      } else if (e.key === "Enter" && idx !== -1) {
        e.preventDefault();
        _acJustSelected = true;
        inp.value = items[idx].dataset.name;
        _setPartyId(items[idx].dataset.id);
        hideList();
        inp.focus();
      } else if (e.key === "Escape") {
        hideList();
        inp.focus();
      }
    });

    // click على عنصر
    list.addEventListener("mousedown", function () {
      _acMouseDown = true;
    });
    list.addEventListener("mouseup", function () {
      _acMouseDown = false;
    });
    list.addEventListener("click", function (e) {
      var item = e.target.closest(".party-ac-item");
      if (item) {
        _acJustSelected = true;
        inp.value = item.dataset.name;
        _setPartyId(item.dataset.id);
        hideList();
        inp.blur();
      }
    });

    // hover highlight
    list.addEventListener("mouseover", function (e) {
      var item = e.target.closest(".party-ac-item");
      if (item) item.style.background = "var(--accent-soft, #EFF6FF)";
    });
    list.addEventListener("mouseout", function (e) {
      var item = e.target.closest(".party-ac-item");
      if (item) item.style.background = "";
    });
  }

  // ─────────────────────────────────────────────────────────────
  // Search Dropdown للأصناف — مساعد مشترك
  // ─────────────────────────────────────────────────────────────
  function _bindItemSearch(prefix, onSelect) {
    var searchEl = document.getElementById(prefix + "-search");
    var hiddenSel = document.getElementById(prefix);
    var listEl = document.getElementById(prefix + "-list");
    var groupFilterEl = document.getElementById(prefix + "-group-filter");
    if (!searchEl || !hiddenSel || !listEl) return;

    if (window.SplitSelect && groupFilterEl) {
      SplitSelect.init(prefix + "-group-filter", {
        label: "المجموعة",
        icon: "ti-folder",
        searchable: true,
      });
    }

    // ── بناء قائمة الـ Dropdown ──────────────────────────────
    function buildList(q) {
      q = (q || "").trim().toLowerCase();
      var selectedGroup = groupFilterEl ? groupFilterEl.value : "";

      // استخراج group من item بناءً على option value
      var allItems = APP.data.items || [];

      var opts = Array.from(hiddenSel.options).filter(function (o) {
        return o.value;
      });

      // فلترة حسب المجموعة
      if (selectedGroup) {
        opts = opts.filter(function (o) {
          var item = allItems.find(function (it) {
            return String(it.id) === String(o.value);
          });
          return (
            item &&
            (String(item.group || "") === selectedGroup ||
              String(item.group_id || "") === selectedGroup)
          );
        });
      }

      // فلترة حسب البحث النصي
      var filtered = q
        ? opts.filter(function (o) {
            return o.text.toLowerCase().indexOf(q) !== -1;
          })
        : opts;

      if (!filtered.length) {
        listEl.innerHTML =
          '<div class="item-srch-empty"> لا توجد نتائج مطابقة</div>';
      } else {
        listEl.innerHTML = filtered
          .slice()
          .reverse()
          .slice(0, 80)
          .map(function (o) {
            var parts = o.text.split(" — ");
            // الصيغة الجديدة: اسم — كود
            var name = esc(parts[0] || o.text);
            var code = esc(parts.slice(1).join(" — ") || "");
            // الاسم على اليمين، الكود على الشمال
            return (
              '<div class="item-srch-item" data-val="' +
              esc(o.value) +
              '" data-label="' +
              esc(o.text) +
              '">' +
              '<span class="isrch-name">' +
              name +
              "</span>" +
              '<span class="isrch-code">' +
              code +
              "</span>" +
              "</div>"
            );
          })
          .join("");
      }
      listEl.classList.add("item-srch-open");
    }

    function _hideItemList() {
      listEl.classList.remove("item-srch-open");
    }

    // ── أحداث فلتر المجموعة ──────────────────────────────────
    if (groupFilterEl) {
      groupFilterEl.addEventListener("change", function () {
        // مسح الصنف المختار عند تغيير المجموعة
        hiddenSel.value = "";
        searchEl.value = "";
        hiddenSel.dispatchEvent(new Event("change"));
        buildList("");
      });
    }

    // ── أحداث حقل البحث ──────────────────────────────────────
    searchEl.addEventListener("input", function () {
      buildList(this.value);
    });

    searchEl.addEventListener("focus", function () {
      buildList(this.value);
    });

    searchEl.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        _hideItemList();
      }
    });

    // ── اختيار عنصر من القائمة ──────────────────────────────
    listEl.addEventListener("mousedown", function (e) {
      var item = e.target.closest(".item-srch-item");
      if (!item || !item.dataset.val) return;
      e.preventDefault(); // يمنع blur قبل الاختيار

      hiddenSel.value = item.dataset.val;
      searchEl.value = item.dataset.label || item.textContent.trim();
      _hideItemList();

      // أطلق change event على الـ hidden select
      hiddenSel.dispatchEvent(new Event("change"));

      if (typeof onSelect === "function") onSelect(item.dataset.val);
    });

    // ── إخفاء القائمة عند الضغط خارجها ─────────────────────
    document.addEventListener("click", function (e) {
      if (!searchEl.contains(e.target) && !listEl.contains(e.target)) {
        _hideItemList();
      }
    });

    // ── دالة مساعدة: تحديث نص الـ search من الخارج ─────────
    searchEl._syncFromSelect = function () {
      var val = hiddenSel.value;
      if (!val) {
        searchEl.value = "";
        return;
      }
      var opt = Array.from(hiddenSel.options).find(function (o) {
        return o.value === val;
      });
      if (opt) searchEl.value = opt.text;
    };
  }
  // ─────────────────────────────────────────────────────────────
  // §TX-DASH  لوحة تحكم الحركات
  // ─────────────────────────────────────────────────────────────
  function bindTransactionsDashboard() {
    var _set = function (id, val) {
      var el = document.getElementById(id);
      if (el) el.textContent = val;
    };
    var txAll = APP.data.transactions || [];
    var today = (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().slice(0, 10));
    var todayTx = txAll.filter(function (t) {
      return (t.date || "").slice(0, 10) === today;
    });
    _set(
      "txd-stat-in",
      todayTx.filter(function (t) {
        return t.type === "IN";
      }).length,
    );
    _set(
      "txd-stat-out",
      todayTx.filter(function (t) {
        return t.type === "OUT";
      }).length,
    );
    _set(
      "txd-stat-transfer",
      todayTx.filter(function (t) {
        return t.type === "TRANSFER";
      }).length,
    );
    _set("txd-stat-total", txAll.length);
    _set(
      "txd-stat-shipping",
      (APP.data.shipments || []).filter(function (s) {
        return s.status !== "DELIVERED";
      }).length,
    );
    _set(
      "txd-stat-stocktake",
      todayTx.filter(function (t) {
        return t.type === "STOCKTAKE";
      }).length,
    );

    // Recent transactions table
    var tbody = document.getElementById("txd-recent-tx");
    if (tbody) {
      var recent = txAll.slice(-10).reverse();
      var typeLabels = {
        IN: { l: "وارد", c: "#10b981" },
        OUT: { l: "صادر", c: "#ef4444" },
        TRANSFER: { l: "تحويل", c: "#6366f1" },
        STOCKTAKE: { l: "جرد", c: "#f59e0b" },
      };
      tbody.innerHTML = !recent.length
        ? '<tr><td colspan="5" style="text-align:center;padding:16px;color:var(--text3)">لا توجد حركات</td></tr>'
        : recent
            .map(function (t) {
              var tl = typeLabels[t.type] || { l: t.type, c: "#6b7280" };
              return (
                "<tr><td><span style='color:" +
                tl.c +
                ";font-weight:600'>" +
                tl.l +
                "</span></td>" +
                "<td>" +
                esc(t.item_name || t.item || "") +
                "</td>" +
                "<td>" +
                esc(t.warehouse_name || t.warehouse || "") +
                "</td>" +
                "<td style='text-align:center;font-weight:700'>" +
                parseFloat(t.qty || 0).toLocaleString() +
                "</td>" +
                "<td style='color:var(--text3);font-size:12px'>" +
                (t.date || "").slice(0, 10) +
                "</td></tr>"
              );
            })
            .join("");
    }
  }

      var returnChk = document.getElementById("out-is-return");
      if (!shippingChk || !driverFields) return;

      function applyShippingMode(on) {
        driverFields.style.display = on ? "block" : "none";
        if (shippingWrap) {
          shippingWrap.classList.toggle("needs-shipping-active", on);
        }
      }

      // لو "مرتجع مورد" شغّال — أخفي الشحن تلقائياً
      function syncWithReturnMode() {
        var isReturn = returnChk && returnChk.checked;
        if (isReturn) {
          if (shippingChk) shippingChk.checked = false;
          applyShippingMode(false);
          if (shippingWrap) shippingWrap.style.opacity = "0.4";
          if (shippingWrap) shippingWrap.style.pointerEvents = "none";
        } else {
          if (shippingWrap) shippingWrap.style.opacity = "1";
          if (shippingWrap) shippingWrap.style.pointerEvents = "";
        }
      }

      shippingChk.addEventListener("change", function () {
        applyShippingMode(this.checked);
      });

      // اربطه مع toggle row كلها
      var toggleRow = document.getElementById("out-shipping-toggle-row");
      if (toggleRow) {
        toggleRow.addEventListener("click", function (e) {
          if (e.target === shippingChk) return;
          if (shippingWrap && shippingWrap.style.pointerEvents === "none")
            return;
          shippingChk.checked = !shippingChk.checked;
          applyShippingMode(shippingChk.checked);
        });
      }

      if (returnChk) {
        returnChk.addEventListener("change", syncWithReturnMode);
      }

      // تهيئة أولية
      applyShippingMode(false);
    })();
    // ── نهاية v4.2 ────────────────────────────────────────────

    btn.addEventListener("click", function () {
      _submitMultiTx("OUT", btn);
    });
  }

    var batch = {

      ref: refEl ? String(refEl.value || "").trim() : "",

      }
      btn.disabled = true;
      btn.textContent = " جاري رفع الملف...";
      NotificationEngine.loading("جاري رفع المرفق...");
      var reader = new FileReader();
      reader.onload = function (e) {
        var base64 = e.target.result.split(",")[1];
        _gsr(
          "uploadFile",
          [
            base64,
            file.name,
            file.type,
            {
              userName: APP.currentUser
                ? APP.currentUser.full_name ||
                  APP.currentUser.username ||
                  "مستخدم"
                : "مستخدم",
              moduleName: "أمر تحويل",
            },
          ],
          {
            label: "uploadFile:transfer",
            rawResponse: true,
            onSuccess: function (r) {
              var res = r && r.data;
              var result;
              try {
                result = JSON.parse(res);
              } catch (ex) {
                result = { success: false, error: ex.message };
              }
              if (result.success) {
                if (statusEl) statusEl.innerHTML = " تم رفع المرفق";
                batch.attachment_url = result.viewUrl;
                _txFiles["tr"] = null;
                dismissLoadingToast(); // هيبدأ لودينج تاني في _doSubmitBatchTr
                _doSubmitBatchTr(batch, btn);
              } else {
                if (statusEl) statusEl.innerHTML = " فشل رفع الملف";
                btn.disabled = false;
                btn.innerHTML =
                  '<span style="display:inline-flex;align-items:center;gap:5px"><i class="ti ti-circle-check" style="font-size:15px"></i> تسجيل أمر التحويل</span>';
                finishLoadingToast(
                  " فشل رفع الملف — " + (result.error || ""),
                  "error",
                );
              }
            },
            onError: function (r) {
              if (statusEl) statusEl.innerHTML = " خطأ في الرفع";
              btn.disabled = false;
              btn.innerHTML =
                '<span style="display:inline-flex;align-items:center;gap:5px"><i class="ti ti-circle-check" style="font-size:15px"></i> تسجيل أمر التحويل</span>';
              finishLoadingToast(" خطأ: " + (r.message || r), "error");
            },
          },
        );
      };
      reader.readAsDataURL(file);
    } else {
      _doSubmitBatchTr(batch, btn);
    }
  }

  // ── نفس منطق _getPermitId في السيرفر (client-side) ──────────
  // DISPATCH-260610-8047-1 → DISPATCH-260610-8047
  function _clientGetPermitId(rawId) {
    if (!rawId) return rawId;
    var str = String(rawId).trim();
    // شيل الـ suffix الرقمي من الآخر لو كان 1-99
    // DISPATCH-10-366-00-2 → DISPATCH-10-366-00
    // DISPATCH-260610-8047-1 → DISPATCH-260610-8047
    var match = str.match(/^(.+)-(\d{1,2})$/);
    if (match) return match[1];
    return str;
  }

  function _buildTxRows(txs) {
    var typeMap = {
      IN: "وارد",
      OUT: "صادر",
      TRANSFER: "تحويل",
      DISPATCH: "صرف مصنع",
      FG_IN: "استلام تام",
      FACTORY_RETURN: "مرتجع مصنع",
      WASTE: "هالك", // [WASTE-FEATURE-2026-08-07]
    };
    var typeIconMap = {
      IN: "ti-arrow-bar-down",
      OUT: "ti-arrow-bar-up",
      TRANSFER: "ti-arrows-exchange",
      DISPATCH: "ti-building-factory-2",
      FG_IN: "ti-circle-check",
      FACTORY_RETURN: "ti-rotate-clockwise-2",
      WASTE: "ti-trash", // [WASTE-FEATURE-2026-08-07]
    };
    var typeColorMap = {
      IN: "success",
      OUT: "danger",
      TRANSFER: "purple",
      DISPATCH: "warning",
      FG_IN: "teal",
      FACTORY_RETURN: "orange",
      WASTE: "dark", // [WASTE-FEATURE-2026-08-07]
    };

    // ── Step 1: جمع الحركات في مجموعات بالـ permit_id ──────────
    // الحركات بدون permit_id كل واحدة مجموعة لوحدها (مفتاحها id)

    var groups = [];
    var permitMap = {}; // permit_id → index in groups

    txs.forEach(function (tx) {
      var raw =
        tx.permit_id && tx.permit_id.trim() ? tx.permit_id.trim() : null;
      var key = raw ? _clientGetPermitId(raw) : null;
      if (key) {
        if (permitMap.hasOwnProperty(key)) {
          groups[permitMap[key]].items.push(tx);
        } else {
          permitMap[key] = groups.length;
          groups.push({ key: key, isPermit: true, items: [tx] });
        }
      } else {
        // حركة فردية (بدون سند)
        groups.push({ key: tx.id, isPermit: false, items: [tx] });
      }
    });

    // ── Step 2: بناء HTML لكل مجموعة ───────────────────────────
    return groups
      .map(function (grp) {
        var firstTx = grp.items[0];
        var isMulti = grp.items.length > 1;

        // التاريخ والوقت من أول حركة
        var dateObj = firstTx.date ? new Date(firstTx.date) : null;
        var dateStr = dateObj ? fmtDate(dateObj) : "—";
        var timeStr = dateObj ? fmtTime(dateObj) : "—";

        // النوع
        var typeLabel = typeMap[firstTx.type] || firstTx.type;
        var typeColor = typeColorMap[firstTx.type] || "primary";
        var typeIcon = typeIconMap[firstTx.type] || "ti-activity";

        // المخزن
        var warehouse =
          firstTx.type === "IN" ||
          firstTx.type === "FG_IN" ||
          firstTx.type === "FACTORY_RETURN"
            ? firstTx.to_warehouse || "—"
            : firstTx.type === "OUT" || firstTx.type === "DISPATCH" || firstTx.type === "WASTE"
              ? firstTx.from_warehouse || "—"
              : (firstTx.from_warehouse || "—") +
                (firstTx.to_warehouse ? " ← " + firstTx.to_warehouse : "");

        // المستخدم
        var userObj = (APP.data.users || []).find(function (u) {
          return u.username === firstTx.user;
        });
        var displayName = userObj
          ? userObj.full_name || firstTx.user
          : firstTx.user || "—";

        // إجمالي الكمية
        var totalQty = grp.items.reduce(function (s, t) {
          return s + Number(t.quantity || 0);
        }, 0);

        // ── helper: جلب كود الصنف ─────────────────────────────────
        function getItemCode(item_id) {
          var obj = (APP.data.items || []).find(function (i) {
            return i.id === item_id;
          });
          return obj ? obj.code || obj.id : item_id || "—";
        }
        function getItemDisplayName(item_id) {
          var obj = (APP.data.items || []).find(function (i) {
            return i.id === item_id;
          });
          return obj ? obj.name || "" : "";
        }

        // ── عمود "الأصناف": أكواد مميزة مدمجة بدون تكرار ──────────
        var _uniqueCodes = [];
        var _seenCodes = {};
        grp.items.forEach(function (t) {
          var c = getItemCode(t.item_id);
          if (!_seenCodes[c]) {
            _seenCodes[c] = true;
            _uniqueCodes.push(c);
          }
        });
        var itemsPreview =
          "<div style='display:flex;flex-wrap:wrap;gap:4px;align-items:center'>" +
          _uniqueCodes
            .map(function (c) {
              return (
                "<span style='" +
                "display:inline-block;" +
                "background:#EFF6FF;" +
                "color:#1D4ED8;" +
                "border:1px solid #BFDBFE;" +
                "border-radius:5px;" +
                "padding:2px 8px;" +
                "font-size:12px;" +
                "font-weight:700;" +
                "font-family:var(--font-mono);" +
                "white-space:nowrap;" +
                "letter-spacing:0.3px'>" +
                esc(c) +
                "</span>"
              );
            })
            .join("") +
          "</div>";

        // ── رقم السند ─────────────────────────────────────────────
        var permitCell;
        if (grp.isPermit) {
          permitCell =
            "<div style='display:flex;flex-direction:column;gap:4px'>" +
            "<span class='mono' style='color:var(--success);font-weight:700;font-size:13px'>" +
            esc(grp.key) +
            "</span>" +
            (isMulti
              ? "<button id='expand-btn-" +
                esc(grp.key).replace(/[^a-zA-Z0-9]/g, "_") +
                "' onclick=\"_toggleTxExpand('" +
                esc(grp.key) +
                "')\" title='عرض الأصناف'" +
                " style='" +
                "display:inline-flex;align-items:center;gap:5px;" +
                "background:linear-gradient(135deg,#EFF6FF,#DBEAFE);" +
                "color:#1D4ED8;" +
                "border:1px solid #BFDBFE;" +
                "border-radius:20px;" +
                "padding:2px 8px 2px 6px;" +
                "font-size:11px;font-weight:700;" +
                "cursor:pointer;" +
                "transition:all .15s ease;" +
                "box-shadow:0 1px 3px rgba(37,99,235,.12);" +
                "white-space:nowrap'>" +
                "<span style='background:#2563EB;color:#fff;border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0'>" +
                grp.items.length +
                "</span>" +
                "<span>صنف</span>" +
                "<i class='ti ti-chevron-down' style='font-size:10px;transition:transform .2s'></i>" +
                "</button>"
              : "") +
            "</div>";
        } else {
          permitCell =
            "<span class='mono' style='color:var(--text3);font-size:11px'>" +
            esc(firstTx.id || "—") +
            "</span>";
        }

        // ── زرار expand انتقل لعمود الأصناف (itemsPreview) ─────────

        // ── السطر الرئيسي ─────────────────────────────────────────
        var mainRow =
          "<tr data-permit='" +
          esc(grp.key) +
          "' data-txid='" +
          esc(firstTx.id || "") +
          "' " +
          "" +
          ">" +
          "<td>" +
          permitCell +
          "</td>" +
          "<td style='font-size:13px;font-weight:600;color:var(--text1)'>" +
          dateStr +
          "</td>" +
          '<td><span class="tx-badge tx-badge-' +
          typeColor +
          '" style="display:inline-flex;align-items:center;gap:4px">' +
          '<i class="ti ' +

  // حالة Pagination للحركات
  // [إصلاح P2] كانت pageSize ثابتة يدويًا (50) بدون أي علاقة بتفضيل
  // items_per_page المخزَّن فعليًا — رغم وجوده كإعداد في شاشة التفضيلات.
  // الآن نقرأه من PreferenceService عند التوفر، ونشترك في تغييره لاحقًا.
  var _txPagination = {
    page: 1,
    pageSize:
      typeof PreferenceService !== "undefined"
        ? PreferenceService.get("items_per_page", 50)
        : 50,
    filtered: [],
  };

  // إذا غيّر المستخدم "عدد الصفوف الافتراضي" من شاشة التفضيلات وشاشة
  // الحركات مفتوحة بالفعل، نطبّق القيمة الجديدة فورًا بدون Refresh
  if (typeof PreferenceService !== "undefined") {
    PreferenceService.subscribe("items_per_page", function (newVal) {
      var n = Number(newVal);
      if (!n || n < 1) return;
      _txPagination.pageSize = n;
      if (document.getElementById("tx-tbody")) _renderTxPage(1);
    });
  }

  /** يعرض صفحة معينة من الحركات المفلترة */
  function _renderTxPage(page) {
    _txPagination.page = page;
    var tbody = document.getElementById("tx-tbody");
    if (!tbody) return;

    var total = _txPagination.filtered.length;
    var pages = Math.ceil(total / _txPagination.pageSize) || 1;
    page = Math.max(1, Math.min(page, pages));
    _txPagination.page = page;

    var start = (page - 1) * _txPagination.pageSize;
    var slice = _txPagination.filtered.slice(
      start,
      start + _txPagination.pageSize,
    );

    tbody.innerHTML = slice.length
      ? _buildTxRows(slice)
      : '<tr><td colspan="9" class="empty-state">لا توجد حركات مطابقة</td></tr>';

    // تحديث شريط الـ pagination
    _renderTxPaginationBar(page, pages, total);
  }

  /** يرسم شريط الصفحات */
  function _renderTxPaginationBar(page, pages, total) {
    var bar = document.getElementById("tx-pagination-bar");
    if (!bar) return;
    if (pages <= 1) {
      bar.innerHTML = "";
      return;
    }

    var start = (page - 1) * _txPagination.pageSize + 1;
    var end = Math.min(page * _txPagination.pageSize, total);

    var btns = "";
    // زرار السابق
    btns +=
      '<button class="btn btn-xs" ' +
      (page <= 1 ? "disabled" : 'onclick="_renderTxPage(' + (page - 1) + ')"') +
      ' style="min-width:32px">‹</button>';

    // أرقام الصفحات (نعرض ±2 من الصفحة الحالية)
    var from = Math.max(1, page - 2);
    var to = Math.min(pages, page + 2);
    if (from > 1)
      btns +=
        '<button class="btn btn-xs" onclick="_renderTxPage(1)">1</button>';
    if (from > 2)
      btns += '<span style="padding:0 4px;color:var(--text3)">…</span>';
    for (var p = from; p <= to; p++) {
      btns +=
        '<button class="btn btn-xs' +
        (p === page ? " btn-primary" : "") +
        '" onclick="_renderTxPage(' +
        p +
        ')">' +
        p +
        "</button>";
    }
    if (to < pages - 1)
      btns += '<span style="padding:0 4px;color:var(--text3)">…</span>';
    if (to < pages)
      btns +=
        '<button class="btn btn-xs" onclick="_renderTxPage(' +
        pages +
        ')">' +
        pages +
        "</button>";

    // زرار التالي
    btns +=
      '<button class="btn btn-xs" ' +
      (page >= pages
        ? "disabled"
        : 'onclick="_renderTxPage(' + (page + 1) + ')"') +
      ' style="min-width:32px">›</button>';

    bar.innerHTML =
      '<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">' +
      '<span style="font-size:11px;color:var(--text3);margin-left:8px">' +
      start +
      "–" +
      end +
      " من " +
      total +
      " سند" +
      "</span>" +
      btns +
      "</div>";
  }

  function bindTransactions() {
    // جلب المستخدمين لو مش محملين عشان يتعرض الاسم الكامل
    if (!APP.data.users || APP.data.users.length === 0) {
      _gsr("getUsers", [APP.currentUser.username, SESSION.token], {
        label: "getUsers:transactions",
        onSuccess: function (r) {
          APP.data.users = r.data && r.data.users;
          // أعد تطبيق الفلتر بعد تحميل المستخدمين
          _applyTxFilter();
        },
        onError: function (r) {
          console.warn("تعذّر تحميل قائمة المستخدمين:", r && r.message);
        },
      });
    }

    // لو فيه فلتر معلّق بعد إضافة إذن — طبّقه فوراً
    if (APP._pendingTxFilter) {
      var filterVal = APP._pendingTxFilter;
      APP._pendingTxFilter = null;
      var searchInput = document.getElementById("tx-search");
      if (searchInput) {
        searchInput.value = filterVal;
        searchInput.style.borderColor = "var(--accent)";
        searchInput.style.boxShadow = "0 0 0 3px var(--accent-soft)";
        setTimeout(function () {
          searchInput.style.borderColor = "";
          searchInput.style.boxShadow = "";
        }, 2000);
      }
    }

    var TYPE_AR = {
      IN: "وارد",
      OUT: "صادر",
      TRANSFER: "تحويل",
      DISPATCH: "صرف للمصنع",
      FG_IN: "استلام تام",
      FACTORY_RETURN: "مرتجع من المصنع",
    };

    // v4.2: دالة الفلترة تبني _txPagination.filtered ثم ترسم أول صفحة
    function _applyTxFilter() {
      var q = (document.getElementById("tx-search").value || "")
        .toLowerCase()
        .trim();
      var type = document.getElementById("tx-filter-type").value;
      var txs = (APP.data.transactions || []).slice().reverse();

      // نبني groups أولاً (نفس منطق _buildTxRows) عشان نفلتر على مستوى السند
      var groups = [];
      var permitMap = {};
      txs.forEach(function (tx) {
        var _raw =
          tx.permit_id && tx.permit_id.trim() ? tx.permit_id.trim() : null;
        var key = _raw ? _clientGetPermitId(_raw) : null;
        if (key) {
          if (permitMap.hasOwnProperty(key)) {
            groups[permitMap[key]].items.push(tx);
          } else {
            permitMap[key] = groups.length;
            groups.push({ key: key, isPermit: true, items: [tx] });
          }
        } else {
          groups.push({ key: tx.id, isPermit: false, items: [tx] });
        }
      });

      // فلترة بالبحث والنوع
      var filtered = groups.filter(function (grp) {
        var firstTx = grp.items[0];
        var typeLabel = TYPE_AR[firstTx.type] || firstTx.type || "";
        if (type && firstTx.type !== type) return false;
        if (!q) return true;
        // بحث في permit_id, ids, item_ids, notes, user
        var searchStr = [
          grp.key,
          grp.items
            .map(function (t) {
              return t.id || "";
            })
            .join(" "),
          grp.items
            .map(function (t) {
              return t.item_id || "";
            })
            .join(" "),
          firstTx.user || "",
          firstTx.notes || "",
          typeLabel,
          firstTx.from_warehouse || "",
          firstTx.to_warehouse || "",
        ]
          .join(" ")
          .toLowerCase();
        return searchStr.indexOf(q) !== -1;
      });

      // نحوّل groups مرة تانية لـ flat tx array للـ _buildTxRows
      // (كل group هو object { key, isPermit, items } والـ _buildTxRows بيشتغل على txs عادية)
      // الحل: نمرر الـ groups مباشرة — نعدّل _buildTxRows لاستقبال groups OR نبني من txs
      // هنا نبني من txs المفلترة (أبسط وأأمن)
      var filteredTxIds = {};
      filtered.forEach(function (grp) {
        grp.items.forEach(function (t) {
          filteredTxIds[t.id] = true;
        });
      });
      var filteredTxs = txs.filter(function (t) {
        return filteredTxIds[t.id];
      });

      _txPagination.filtered = filteredTxs;
      _txPagination.page = 1;

      // تحديث العداد
      var badge = document.getElementById("tx-count-badge");
      if (badge) badge.textContent = filtered.length + " سند";

      // رسم الصفحة الأولى
      _renderTxPage(1);
    }

    // اجعل _applyTxFilter متاحة خارج bindTransactions
    window._applyTxFilter = _applyTxFilter;

    var s = document.getElementById("tx-search");
    if (s) s.addEventListener("input", debounce(_applyTxFilter, 250));
    var f = document.getElementById("tx-filter-type");
    if (f) f.addEventListener("change", _applyTxFilter);

    // ── أزرار الفلتر الجديدة (tx-type-filter-btn) ─────────────
    document.querySelectorAll(".tx-type-filter-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".tx-type-filter-btn").forEach(function (b) {
          b.style.background = "transparent";
          b.style.color = "var(--text2)";
        });
        btn.style.background = "var(--accent)";
        btn.style.color = "#fff";
        var fSel = document.getElementById("tx-filter-type");
        if (fSel) {
          fSel.value = btn.getAttribute("data-type") || "";
          fSel.dispatchEvent(new Event("change"));
        }
      });
    });

    // ── كروت الإحصاء السريع ────────────────────────────────────
    function _updateTxStats() {
      var txs = APP.data.transactions || [];
      var stats = {
        IN: 0,
        OUT: 0,
        TRANSFER: 0,
        DISPATCH: 0,
        FG_IN: 0,
        FACTORY_RETURN: 0,
      };
      txs.forEach(function (t) {
        if (stats[t.type] !== undefined) stats[t.type]++;
      });
      var inEl = document.getElementById("tx-stat-in");
      var outEl = document.getElementById("tx-stat-out");
      var trEl = document.getElementById("tx-stat-transfer");
      var faEl = document.getElementById("tx-stat-factory");
      if (inEl) inEl.textContent = stats.IN;
      if (outEl) outEl.textContent = stats.OUT;
      if (trEl) trEl.textContent = stats.TRANSFER;
      if (faEl)
        faEl.textContent = stats.DISPATCH + stats.FG_IN + stats.FACTORY_RETURN;
    }
    _updateTxStats();

    // تطبيق الفلتر الأول
    _applyTxFilter();

    // إضافة حاوية الـ pagination إن لم تكن موجودة
    var tableWrap = document.getElementById("tx-tbody");
    if (tableWrap) {
      var existingBar = document.getElementById("tx-pagination-bar");
      if (!existingBar) {
        var bar = document.createElement("tr");
        bar.id = "tx-pagination-bar-row";
        bar.innerHTML =
          '<td colspan="9" id="tx-pagination-bar" style="padding:10px 14px;background:var(--surface2);border-top:1px solid var(--border)"></td>';
        tableWrap.parentNode.appendChild(bar);
      }
    }

    // تصدير متعدد الصيغ — ExportUtil
    var exportBtn = document.getElementById("tx-export-btn");
    if (exportBtn && window.ExportUtil) {
      var _getTxData = function () {
        var txs = (APP.data.transactions || []).slice().reverse();
        var typeAr = {
          IN: "وارد",
          OUT: "صادر",
          TRANSFER: "تحويل",
          DISPATCH: "صرف للمصنع",
          FG_IN: "استلام تام",
          FACTORY_RETURN: "مرتجع من المصنع",
        };
        var headers = [
          "رقم الحركة",
          "التاريخ",
          "الوقت",
          "النوع",
          "الصنف",
          "الكمية",
          "من مخزن",
          "إلى مخزن",
          "المستخدم",
          "ملاحظات",
        ];
        var rows = txs.map(function (tx) {
          var d = tx.date ? new Date(tx.date) : null;
          var userObj = (APP.data.users || []).find(function (u) {
            return u.username === tx.user;
          });
          return [
            tx.id || "",
            d ? fmtDate(d) : "",
            d ? fmtTime(d) : "",
            typeAr[tx.type] || tx.type || "",
            tx.item_id || "",
            tx.quantity || 0,
            tx.from_warehouse || "",
            tx.to_warehouse || "",
            userObj ? userObj.full_name || tx.user : tx.user || "",
            tx.notes || "",
          ];
        });
        return { headers: headers, rows: rows };
      };
      var dd = ExportUtil.createDropdown({
        getData: _getTxData,
        filename: "سجل_الحركات",
        title: "سجل حركات المخازن",
        subtitle: "تاريخ التقرير: " + fmtDate(new Date()),
        sheetName: "الحركات",
      });
      exportBtn.parentNode.replaceChild(dd, exportBtn);
    }
  }
