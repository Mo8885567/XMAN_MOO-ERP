<script>
  // ───────────────────────────────────────────────────────────────
  // JS_Production.html — جزء 5/10 من JavaScript.html الأصلي
  // النطاق الأصلي: سطر 11609–15050 | تقارير وتنبيهات + أوامر التشغيل + الصرف للمصنع
  // ───────────────────────────────────────────────────────────────

  // التقارير والتنبيهات — Reports & Alerts
  // ─────────────────────────────────────────────────────────────

  // ── تحديث حالة أمر الإنتاج ─────────────────────────────────
  function updatePOStatus(id, newStatus) {
    if (!id || !newStatus) return;

    var order = (APP.data.productionOrders || []).find(function (o) {
      return o.id === id;
    });

    if (!order) {
      NotificationEngine.error("أمر الإنتاج غير موجود");
      return;
    }

    var confirmMsg = "";
    if (newStatus === "done") {
      confirmMsg = "هل تريد إغلاق هذا الأمر وتسجيل تاريخ الإغلاق الآن؟";
    } else if (newStatus === "cancelled") {
      confirmMsg = "هل تريد إلغاء أمر الإنتاج؟";
    } else if (newStatus === "inprogress") {
      confirmMsg = "هل تريد بدء تنفيذ هذا الأمر؟";
    }

    showConfirm({
      icon: "ti-refresh",
      iconColor: "#2563eb",
      title: "تأكيد تغيير الحالة",
      message: confirmMsg,
      confirmText: newStatus === "done" ? "نعم، أغلق الأمر" : "تأكيد",
      confirmClass: newStatus === "done" ? "btn-success" : "btn-primary",
      freezeMessage:
        newStatus === "cancelled"
          ? "⏳ جاري الإلغاء..."
          : newStatus === "done"
            ? "⏳ جاري الإغلاق..."
            : "⏳ جاري التحديث...",
      onConfirm: function (unfreezeUI) {
        var btns = document.querySelectorAll(
          "button[onclick*=\"updatePOStatus('" + id + '"]',
        );
        if (btns.length)
          btns.forEach(function (b) {
            b.disabled = true;
          });

        _gsr("updateProductionOrderStatus", [id, newStatus], {
          label: "updateProductionOrderStatus",
          onSuccess: function (res) {
            if (typeof unfreezeUI === "function") unfreezeUI();
            if (btns.length)
              btns.forEach(function (b) {
                b.disabled = false;
              });
            NotificationEngine.success(res.message || " تم تحديث الحالة بنجاح");
            reloadAfterMutation(function () {
              renderPage("production");
            });
          },
          onError: function (res) {
            if (typeof unfreezeUI === "function") unfreezeUI();
            if (btns.length)
              btns.forEach(function (b) {
                b.disabled = false;
              });
            NotificationEngine.error("خطأ في الاتصال: " + (res.message || res));
          },
        });
      },
    });
  }

  // المستخدمون — Users
  // ============================================================
  // [REFACTOR] نُقلت دوال editUser / delUser / openUserModal إلى 08_JS_Users_Branding.html
  // لا تضف كود هنا — راجع ملف المستخدمين

  // ─────────────────────────────────────────────────────────────
  // §PROD-DASH  لوحة تحكم الإنتاج
  // ─────────────────────────────────────────────────────────────
  function bindProductionDashboard() {
    ensureExtendedData(function () {
      var _set = function (id, val) {
        var el = document.getElementById(id);
        if (el) el.textContent = val;
      };
      var orders =
        APP.data.productionOrders || APP.data.production_orders || [];
      var dispatches = APP.data.dispatches || [];
      var fgRecv = APP.data.fgReceive || APP.data.fg_receive || [];
      var cutting =
        APP.data.cuttingStatements || APP.data.cutting_statements || [];

      var statusCounts = { inprogress: 0, done: 0 };
      orders.forEach(function (o) {
        var st = (o.status || "").toUpperCase();
        if (st === "IN_PROGRESS" || st === "INPROGRESS" || st === "قيد التنفيذ")
          statusCounts.inprogress++;
        if (
          st === "DONE" ||
          st === "COMPLETED" ||
          st === "منتهي" ||
          st === "مكتمل"
        )
          statusCounts.done++;
      });

      _set("prd-stat-orders", orders.length);
      _set("prd-stat-inprogress", statusCounts.inprogress);
      _set("prd-stat-done", statusCounts.done);
      _set("prd-stat-dispatch", dispatches.length);
      _set("prd-stat-fgrecv", fgRecv.length);
      _set("prd-stat-cutting", cutting.length);

      // Recent orders
      var tbody = document.getElementById("prd-recent-orders");
      if (tbody) {
        var recent = orders.slice(-8).reverse();
        var stColor = function (st) {
          st = (st || "").toUpperCase();
          if (st === "DONE" || st === "COMPLETED") return "#10b981";
          if (st === "IN_PROGRESS" || st === "INPROGRESS") return "#f59e0b";
          if (st === "CANCELLED" || st === "ملغي") return "#ef4444";
          return "#6b7280";
        };
        tbody.innerHTML = !recent.length
          ? '<tr><td colspan="5" style="text-align:center;padding:16px;color:var(--text3)">لا توجد أوامر</td></tr>'
          : recent
              .map(function (o) {
                return (
                  "<tr><td style='font-weight:700;color:var(--primary)'>" +
                  esc(o.ref || o.code || o.id || "") +
                  "</td>" +
                  "<td>" +
                  esc(o.item_name || o.item || "") +
                  "</td>" +
                  "<td style='text-align:center;font-weight:700'>" +
                  parseFloat(o.qty || 0).toLocaleString() +
                  "</td>" +
                  "<td><span style='color:" +
                  stColor(o.status) +
                  ";font-weight:600'>" +
                  esc(o.status || "") +
                  "</span></td>" +
                  "<td style='color:var(--text3);font-size:12px'>" +
                  (o.date || o.created_at || "").slice(0, 10) +
                  "</td></tr>"
                );
              })
              .join("");
      }
    });
  }

  var PO_STATUS_BADGE = {
    pending: "badge-warning",
    inprogress: "badge-blue",
    done: "badge-success",
    cancelled: "badge-danger",
  };
  var PO_STATUS_LABEL = {
    pending: "معلق",
    inprogress: "قيد التصنيع",
    done: "مكتمل",
    cancelled: "ملغي",
  };
  function _poItemName(productId) {
    var item = (APP.data.items || []).find(function (i) {
      return i.id === productId;
    });
    return item ? item.name : productId;
  }
  function _poItemCode(productId) {
    var item = (APP.data.items || []).find(function (i) {
      return i.id === productId;
    });
    return item ? item.code || item.id : productId;
  }

  // [COLUMN-ENGINE] تعريف أعمدة جدول أوامر الإنتاج — مرة واحدة فقط.
  // القائمة السياقية (production_orders) كانت جاهزة بالفعل (كانت
  // مربوطة يدويًا بـ CTX.register على #po-table tbody)، فقط استبدلناها
  // بـ contextMenuType التلقائي الموحّد مع باقي الشاشات.
  var _prodColumnsRegistered = false;
  function _prodRegisterColumns() {
    if (_prodColumnsRegistered) return;
    _prodColumnsRegistered = true;
    ColumnEngine.register(
      "production_orders",
      [
        {
          key: "id",
          label: "رقم الأمر",
          type: "text",
          width: 150,
          frozen: "right",
          format: function (v) {
            return (
              '<span class="mono" style="color:var(--accent);font-weight:700">' +
              esc(v || "") +
              "</span>"
            );
          },
        },
        {
          key: "product_id",
          label: "المنتج",
          type: "text",
          width: 240,
          format: function (v) {
            return (
              '<div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap">' +
              '<span style="font-weight:600;color:var(--text1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">' +
              esc(_poItemName(v || "")) +
              "</span>" +
              '<span style="display:inline-block;background:var(--accent-soft,rgba(37,99,235,.1));color:var(--accent);font-family:monospace;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.4px;border:1px solid rgba(37,99,235,.2);white-space:nowrap;flex-shrink:0">' +
              esc(_poItemCode(v || "")) +
              "</span></div>"
            );
          },
        },
        {
          key: "patron_number",
          label: "الباترون",
          type: "text",
          width: 100,
          align: "center",
          format: function (v) {
            return (
              '<span style="font-weight:700;color:var(--accent)">' +
              esc(v || "—") +
              "</span>"
            );
          },
        },
        {
          key: "quantity",
          label: "الكمية المستهدفة",
          type: "number",
          width: 130,
          align: "center",
          format: function (v) {
            return "<b>" + Number(v || 0) + "</b>";
          },
        },
        {
          key: "date",
          label: "تاريخ الفتح",
          type: "date",
          width: 120,
        },
        {
          key: "status",
          label: "الحالة",
          type: "badge",
          width: 100,
          format: function (v) {
            return (
              '<span class="badge ' +
              (PO_STATUS_BADGE[v] || "badge-blue") +
              '">' +
              (PO_STATUS_LABEL[v] || esc(v)) +
              "</span>"
            );
          },
        },
        // [COLUMN-ENGINE-FULL-FIELDS] حقول موجودة في صف أمر الإنتاج فعليًا
        // (_buildPORow في Code_17b_ProductionOrders.gs) لكنها لم تكن معروضة
        // كأعمدة اختيارية. sizes_json (ألوان/مقاسات) بيانات متداخلة معقدة
        // مش عمود مسطّح مناسب — تُعرض من تفاصيل الأمر نفسه.
        {
          key: "user",
          label: "أنشئ بواسطة",
          category: "حقول إضافية",
          defaultVisible: false,
        },
        {
          key: "fabric_meters",
          label: "أمتار القماش",
          type: "number",
          category: "حقول إضافية",
          defaultVisible: false,
        },
        {
          key: "lining_meters",
          label: "أمتار البطانة",
          type: "number",
          category: "حقول إضافية",
          defaultVisible: false,
        },
        {
          key: "closed_at",
          label: "تاريخ الإغلاق",
          type: "date",
          category: "حقول إضافية",
          defaultVisible: false,
        },
        {
          key: "notes",
          label: "ملاحظات",
          category: "حقول إضافية",
          defaultVisible: false,
        },
      ],
      {
        rowKey: "id",
        title: "أوامر الإنتاج",
        contextMenuType: "production_orders",
      },
    );
  }

  function _renderProductionOrdersTableCE(rows) {
    var container = document.getElementById("po-ce-container");
    if (!container) return;
    _prodRegisterColumns();
    ColumnEngine.renderTable("production_orders", container, rows || []);
  }

  function bindProduction() {
    // فلترة حسب الحالة — بتعيد رسم الجدول عبر ColumnEngine ببيانات
    // مفلترة فقط؛ البحث النصي بقى مدمج داخل شريط أدوات المحرك نفسه.
    function applyFilter() {
      var st = document.getElementById("po-filter")
        ? document.getElementById("po-filter").value
        : "";
      var orders = (APP.data.productionOrders || []).slice().reverse();
      var rows = st
        ? orders.filter(function (o) {
            return o.status === st;
          })
        : orders;
      _renderProductionOrdersTableCE(rows);
    }
    applyFilter();
    var filterEl = document.getElementById("po-filter");
    if (filterEl) filterEl.addEventListener("change", applyFilter);
    if (window.AppSelect) {
      AppSelect.upgrade("po-filter", {
        icon: "ti-filter",
        placeholder: "كل الحالات",
      });
    }

    // ── New Order Button → Modal ─────────────────────────────
    var btn = document.getElementById("btn-add-po");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var today = (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]);

      // فلتر فوري من APP.data بدون call للباك إند
      var warehouses = APP.data.warehouses || [];
      var groups = APP.data.groups || [];
      var items = APP.data.items || [];

      // المجموعات المرتبطة بمخازن من نوع "تام"
      var fgGroupIds = groups
        .filter(function (g) {
          return warehouses.some(function (w) {
            return (
              String(w.type || "")
                .trim()
                .startsWith("تام") &&
              (String(g.warehouse_id) === String(w.id) ||
                String(g.warehouse_id) === String(w.name))
            );
          });
        })
        .map(function (g) {
          return String(g.id);
        });

      // الأصناف المرتبطة بالمجموعات دي
      var fgItems = items.filter(function (i) {
        return fgGroupIds.indexOf(String(i.group)) !== -1;
      });

      _openPOModal(today, fgItems);
    });
  }

  // ── Size Preset Button Style Helper (global scope) ──────
  function _sizePresetBtnStyle(variant) {
    var base =
      "cursor:pointer;border-radius:20px;font-size:11px;font-weight:700;padding:4px 12px;transition:all .15s;font-family:var(--font-main);";
    if (variant === "outline") {
      return (
        base +
        "background:transparent;border:1.5px dashed var(--border);color:var(--text2);"
      );
    }
    return (
      base +
      "background:var(--surface3);border:1.5px solid var(--border);color:var(--text2);"
    );
  }

  // ── _openPOModal — يُستدعى بعد رجوع البيانات من الباك إند ──
  function _openPOModal(today, fgItems) {
    // توليد رقم أمر تلقائي
    var existingOrders = APP.data.productionOrders || [];
    var nowDate = new Date();
    var yy = String(nowDate.getFullYear()).slice(-2);
    var mm = String(nowDate.getMonth() + 1).padStart(2, "0");
    var nextSeq = String(existingOrders.length + 1).padStart(3, "0");
    var autoOrderNum = "PO-" + yy + "-" + mm + "-" + nextSeq;

    var itemSelectOpts = fgItems.length
      ? itemOpts(fgItems)
      : "<option disabled>لا توجد أصناف في مخازن المنتجات التامة</option>";

    // ── دالة بناء صف لون ──────────────────────────────────────
    function colorRowHtml(code, name, qty) {
      code = code || "";
      name = name || "";
      qty = qty || 0;
      return (
        "<tr>" +
        '<td style="padding:5px 8px;width:44px;text-align:center">' +
        '<input class="input po-color-code" type="text" value="' +
        code +
        '" placeholder="#HEX أو كود" ' +
        'style="width:80px;padding:3px 6px;font-size:12px;font-family:monospace;text-align:center">' +
        "</td>" +
        '<td style="padding:5px 8px">' +
        '<input class="input po-color-name" type="text" value="' +
        name +
        '" placeholder="اسم اللون" ' +
        'style="width:100%;padding:3px 8px;font-size:13px">' +
        "</td>" +
        '<td style="padding:5px 8px;width:90px">' +
        '<input class="input po-color-qty" type="number" min="0" value="' +
        qty +
        '" ' +
        'style="width:75px;padding:3px 8px;text-align:center;font-size:13px">' +
        "</td>" +
        '<td style="padding:5px 8px;width:36px;text-align:center">' +
        '<button type="button" onclick="removePOColorRow(this)" ' +
        'style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:16px;line-height:1"></button>' +
        "</td>" +
        "</tr>"
      );
    }

    // ── بناء Custom Dropdown للمنتج التام (نفس شكل رصيد أول المدة) ──
    function _groupFGItems(items) {
      var groups = {};
      var order = [];
      items.forEach(function (i) {
        var code = String(i.code || i.id || "");
        var prefix = code.replace(/\d+.*$/, "").trim() || "أخرى";
        if (!groups[prefix]) {
          groups[prefix] = [];
          order.push(prefix);
        }
        groups[prefix].push(i);
      });
      return { groups: groups, order: order };
    }

    function buildPOItemDropdown() {
      var grouped = _groupFGItems(fgItems);
      var optHtml = grouped.order
        .map(function (prefix) {
          var rows = grouped.groups[prefix]
            .map(function (i) {
              return (
                '<div class="os-id-opt" data-id="' +
                esc(i.id) +
                '" data-code="' +
                esc(i.code || i.id) +
                '" data-name="' +
                esc(i.name) +
                '">' +
                '<span class="os-id-opt-name">' +
                esc(i.name) +
                "</span>" +
                '<span class="os-id-opt-code">' +
                esc(i.code || i.id) +
                "</span>" +
                "</div>"
              );
            })
            .join("");
          return (
            '<div class="os-id-group">' +
            '<div class="os-id-group-label">' +
            esc(prefix) +
            "</div>" +
            rows +
            '<div class="os-id-divider"></div>' +
            "</div>"
          );
        })
        .join("");
      if (!fgItems.length)
        optHtml =
          '<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px">لا توجد أصناف في مخازن المنتجات التامة</div>';
      return (
        '<div class="os-item-dropdown" id="po-item-wrap">' +
        '<input type="hidden" id="po-item" value="">' +
        '<div class="os-id-trigger" id="po-id-trigger" tabindex="0">' +
        '<span class="os-id-arrow">▼</span>' +
        '<span class="os-id-placeholder">— اختر المنتج —</span>' +
        "</div>" +
        '<div class="os-id-panel" id="po-id-panel">' +
        '<div class="os-id-search-bar"><input type="text" id="po-id-search" placeholder=" بحث..."></div>' +
        '<div id="po-id-list">' +
        optHtml +
        "</div>" +
        "</div></div>"
      );
    }

    function bindPOItemDropdown() {
      var trigger = document.getElementById("po-id-trigger");
      var panel = document.getElementById("po-id-panel");
      var hidden = document.getElementById("po-item");
      var listWrap = document.getElementById("po-id-list");
      var searchEl = document.getElementById("po-id-search");
      if (!trigger || !panel || !hidden) return;

      // [ARCH-AUDIT-2026-07-17] موحّد عبر Core_UIManagers.initSearchableIdPanel
      var _panelApi = initSearchableIdPanel(trigger, panel, searchEl);
      var openPanel = _panelApi.openPanel;
      var closePanel = _panelApi.closePanel;

      trigger.addEventListener("click", function (e) {
        e.stopPropagation();
        panel.classList.contains("os-id-open") ? closePanel() : openPanel();
      });
      trigger.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          panel.classList.contains("os-id-open") ? closePanel() : openPanel();
        }
        if (e.key === "Escape") closePanel();
      });
      if (searchEl) {
        searchEl.addEventListener("input", function () {
          var q = searchEl.value.trim().toLowerCase();
          var opts = listWrap.querySelectorAll(".os-id-opt");
          opts.forEach(function (opt) {
            var name = (opt.dataset.name || "").toLowerCase();
            var code = (opt.dataset.code || "").toLowerCase();
            opt.style.display =
              !q || name.includes(q) || code.includes(q) ? "" : "none";
          });
          listWrap.querySelectorAll(".os-id-group").forEach(function (g) {
            var visible = Array.from(g.querySelectorAll(".os-id-opt")).some(
              function (o) {
                return o.style.display !== "none";
              },
            );
            g.style.display = visible ? "" : "none";
          });
        });
      }
      listWrap.addEventListener("click", function (e) {
        var opt = e.target.closest(".os-id-opt");
        if (!opt) return;
        var code = opt.dataset.code;
        var name = opt.dataset.name;
        var selectedId = opt.dataset.id; // ← id الصنف لجلب الألوان
        hidden.value = code;
        var tw = trigger.querySelector(
          ".os-id-selected-wrap, .os-id-placeholder",
        );
        if (tw)
          tw.outerHTML =
            '<div class="os-id-selected-wrap"><span class="os-id-sel-name">' +
            esc(name) +
            '</span><span class="os-id-sel-code">' +
            esc(code) +
            "</span></div>";
        listWrap.querySelectorAll(".os-id-opt").forEach(function (o) {
          o.classList.remove("os-id-selected");
        });
        opt.classList.add("os-id-selected");
        closePanel();

        // ── تعبئة ألوان الصنف تلقائياً في جدول الألوان والكميات ──
        if (selectedId) {
          var itemColors = getItemColors(selectedId);
          if (itemColors && itemColors.length) {
            // مسح الجدول الحالي
            var tbody = document.getElementById("po-colors-tbody");
            if (tbody) {
              tbody.innerHTML = "";
              // إضافة ألوان الصنف
              itemColors.forEach(function (c) {
                window.addPOColorRow(c.code || "", c.name, 0);
              });
              // تحديث إجمالي الكميات
              var disp = document.getElementById("po-total-qty-display");
              if (disp) disp.textContent = "0";
              // إعادة بناء جدول المقاسات بالألوان الجديدة تلقائياً
              setTimeout(function () {
                if (currentPresetSizes) {
                  buildSizesTableFromPreset(currentPresetSizes);
                }
              }, 80);
            }
          }
        }
        // ──────────────────────────────────────────────────────────────
      });
      document.addEventListener("click", function (e) {
        if (!e.target.closest("#po-item-wrap")) closePanel();
      });
    }

    openStyledDrawer({
      title: "إنشاء أمر إنتاج جديد",
      subtitle: "تشغيل وتتبع أوامر التصنيع",
      icon: "ti-settings",
      color: "purple",
      width: 860,
      body:
        '<div style="padding:24px 28px">' +
        // ══ القسم 1: البيانات الأولية ══════════════════════════
        '<div style="background:var(--surface2);border-radius:12px;padding:16px;margin-bottom:14px">' +
        '<div style="font-weight:700;color:var(--text1);margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);padding-bottom:10px">' +
        '<span style="font-size:15px"></span> البيانات الأولية لأمر الإنتاج' +
        "</div>" +
        // Row 1: رقم الأمر + تاريخ الفتح + رقم الباترون

            var targetQty =
              parseInt(document.getElementById("po-target-qty").value) || 0;
            var orderNum = document.getElementById("po-order-num").value.trim();
            var responsible = APP.currentUser
              ? APP.currentUser.full_name || APP.currentUser.username || ""
              : "";
            var status = "قيد التصنيع";

            // جمع بيانات جدول المقاسات
            var sizeLabels =
              currentPresetSizes && currentPresetSizes.length
                ? currentPresetSizes
                : Array.from(document.querySelectorAll(".po-size-label")).map(
                    function (inp) {
                      return inp.value.trim();
                    },
                  );
            var sizesTable = [];
            document
              .querySelectorAll("#po-sizes-table-wrap tbody tr")
              .forEach(function (row) {
                var colorCell = row.querySelector("td:first-child");
                var colorName = colorCell ? colorCell.textContent.trim() : "";
                var qtys = {};
                row.querySelectorAll(".po-size-qty").forEach(function (inp) {
                  var idx = parseInt(inp.dataset.sizeIdx);
                  qtys[sizeLabels[idx] || "مقاس " + (idx + 1)] =
                    Number(inp.value) || 0;
                });
                var rowTotal = Object.values(qtys).reduce(function (a, b) {
                  return a + b;
                }, 0);
                if (rowTotal > 0)
                  sizesTable.push({
                    color: colorName,
                    sizes: qtys,
                    total: rowTotal,
                  });
              });

            var colors = [];
            var rows = document.querySelectorAll(
              "#po-colors-tbody tr.po-color-row",
            );
            rows.forEach(function (tr) {
              var code = tr.querySelector(".po-color-code").value.trim();
              var name = tr.querySelector(".po-color-name").value.trim();
              var qty = Number(tr.querySelector(".po-color-qty").value) || 0;
              // نضيف كل الألوان (حتى qty=0) عشان نحتفظ بقائمة الألوان كاملة
              if (code || name)
                colors.push({
                  size: code || name,
                  color_code: code,
                  color_name: name,
                  qty: qty,
                });
            });
            var totalQty = colors.reduce(function (s, r) {
              return s + r.qty;
            }, 0);
            // لو مفيش ألوان بكمية → خذ من حقل الكمية المطلوبة
            if (!totalQty) totalQty = targetQty;

            if (!productId) {
              NotificationEngine.error("اختر المنتج");
              return;
            }
            if (!patronNum) {
              NotificationEngine.error("أدخل رقم الباترون");
              return;
            }
            var order = {
              order_number: orderNum,
              product_id: productId,
              quantity: totalQty,
              target_quantity: targetQty,
              patron_number: patronNum,
              fabric_meters: fabricM,
              lining_meters: liningM,
              sizes: colors,
              sizes_table: sizesTable,
              sizes_labels: sizeLabels,
              notes: notes,
              status: status,
              responsible: responsible,
              user: APP.currentUser.username || "", // BUG-6 FIX: username لـ _checkPermission,
              sessionToken: SESSION.token,
            };

            // [SE-ROLLOUT] عبر SaveEngine.run بدل _freezeUI/_gsr اليدوي.
            SaveEngine.run({
              screen: "Production.Order",
              entity: "production_order",
              buttonId: "save-po-btn",
              closeFn: closeModal,
              data: order,
              fn: "addProductionOrder",
              params: [order],
              onSuccess: function (r) {
                NotificationEngine.success(r.message);
                reloadAfterMutation(function () {
                  renderPage("production");
                });
              },
            });
          });
      },
    });
  }

  // ── تعديل أمر إنتاج ─────────────────────────────────────────
  function editPO(id) {
    var order = (APP.data.productionOrders || []).find(function (o) {
      return o.id === id;
    });
    if (!order) {
      NotificationEngine.error("أمر الإنتاج غير موجود");
      return;
    }

    var today = (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]);
    var warehouses = APP.data.warehouses || [];
    var groups = APP.data.groups || [];
    var items = APP.data.items || [];

    var fgGroupIds = groups
      .filter(function (g) {
        return warehouses.some(function (w) {
          return (
            String(w.type || "")
              .trim()
              .startsWith("تام") &&
            (String(g.warehouse_id) === String(w.id) ||
              String(g.warehouse_id) === String(w.name))
          );
        });
      })
      .map(function (g) {
        return String(g.id);
      });

    var fgItems = items.filter(function (i) {
      return fgGroupIds.indexOf(String(i.group)) !== -1;
    });

    // إذا الصنف الحالي مش في fgItems أضفه
    if (
      !fgItems.find(function (i) {
        return i.id === order.product_id;
      })
    ) {
      var cur = items.find(function (i) {
        return i.id === order.product_id;
      });
      if (cur) fgItems = [cur].concat(fgItems);
    }

    // استخراج الألوان والبيانات الحالية
    var currentColors = [];
    var oldSizesData = {};
    var oldSizesLabels = [];
    try {
      var sizesRaw = order.sizes_json ? JSON.parse(order.sizes_json) : [];
      if (sizesRaw && !Array.isArray(sizesRaw) && sizesRaw.colors) {
        currentColors = sizesRaw.colors || [];
        oldSizesData = sizesRaw;
        oldSizesLabels = sizesRaw.sizes_labels || [];
      } else if (Array.isArray(sizesRaw)) {
        currentColors = sizesRaw;
      }
    } catch (e) {
      currentColors = [];
    }

    // ── helpers ─────────────────────────────────────────────────────
    function updateTotalDisplay() {
      var inputs = document.querySelectorAll(".po-color-qty");
      var total = 0;
      inputs.forEach(function (inp) {
        total += Number(inp.value) || 0;
      });
      var disp = document.getElementById("po-total-qty-display");
      if (disp) disp.textContent = total;
    }

    // ── دوال chips ──────────────────────────────────────────────────
    function renderColorChips() {
      var chipsWrap = document.getElementById("po-colors-chips");
      var emptyMsg = document.getElementById("po-colors-empty-msg");
      var rows = document.querySelectorAll("#po-colors-tbody tr.po-color-row");
      if (!chipsWrap) return;
      Array.from(chipsWrap.children).forEach(function (el) {
        if (el.id !== "po-colors-empty-msg") el.remove();
      });
      if (!rows.length) {
        if (emptyMsg) emptyMsg.style.display = "";
        return;
      }
      if (emptyMsg) emptyMsg.style.display = "none";
      rows.forEach(function (tr) {
        var code = (tr.querySelector(".po-color-code") || {}).value || "";
        var name = (tr.querySelector(".po-color-name") || {}).value || "لون";
        var hex = "";
        if (CSS_COLOR_MAP) {
          hex = CSS_COLOR_MAP[name] || CSS_COLOR_MAP[name.toLowerCase()] || "";
        }
        if (!hex && typeof colorNameToHex === "function") {
          hex = colorNameToHex(name) || "";
        }
        if (
          !hex &&
          code &&
          (code.startsWith("#") || /^[0-9A-Fa-f]{6}$/.test(code))
        ) {
          hex = code.startsWith("#") ? code : "#" + code;
        }
        var dotBg = hex || "var(--border)";
        var chip = document.createElement("div");
        chip.style.cssText =
          "display:inline-flex;align-items:center;gap:7px;background:var(--surface3);border:1.5px solid var(--border);border-radius:20px;padding:5px 12px 5px 7px;cursor:default";
        chip.classList.add("po-chip");
        chip.innerHTML =
          '<span style="width:22px;height:22px;border-radius:50%;flex-shrink:0;background:' +
          esc(dotBg) +
          ';border:2px solid rgba(0,0,0,.15);box-shadow:0 1px 3px rgba(0,0,0,.12);display:inline-block"></span>' +
          '<span style="font-size:13px;font-weight:600;color:var(--text1)">' +
          esc(name) +
          "</span>";
        chipsWrap.appendChild(chip);
      });
    }

    // ── ربط الـ custom dropdown للمنتج التام ────────────────────────
    (function bindPOItemDropdownEdit() {
      var trigger = document.getElementById("po-id-trigger");
      var panel = document.getElementById("po-id-panel");
      var hidden = document.getElementById("po-item");
      var listWrap = document.getElementById("po-id-list");
      var searchEl = document.getElementById("po-id-search");
      if (!trigger || !panel || !hidden) return;

      // [ARCH-AUDIT-2026-07-17] موحّد عبر Core_UIManagers.initSearchableIdPanel
      var _panelApiEdit = initSearchableIdPanel(trigger, panel, searchEl);
      var openPanel = _panelApiEdit.openPanel;
      var closePanel = _panelApiEdit.closePanel;
      trigger.addEventListener("click", function (e) {
        e.stopPropagation();
        panel.classList.contains("os-id-open") ? closePanel() : openPanel();
      });
      trigger.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          panel.classList.contains("os-id-open") ? closePanel() : openPanel();
        }
        if (e.key === "Escape") closePanel();
      });
      if (searchEl) {
        searchEl.addEventListener("input", function () {
          var q = searchEl.value.trim().toLowerCase();
          listWrap.querySelectorAll(".os-id-opt").forEach(function (opt) {
            opt.style.display =
              !q ||
              (opt.dataset.name || "").toLowerCase().includes(q) ||
              (opt.dataset.code || "").toLowerCase().includes(q)
                ? ""
                : "none";
          });
          listWrap.querySelectorAll(".os-id-group").forEach(function (g) {
            g.style.display = Array.from(g.querySelectorAll(".os-id-opt")).some(
              function (o) {
                return o.style.display !== "none";
              },
            )
              ? ""
              : "none";
          });
        });
      }
      listWrap.addEventListener("click", function (e) {
        var opt = e.target.closest(".os-id-opt");
        if (!opt) return;
        var code = opt.dataset.code;
        var name = opt.dataset.name;
        var selectedId = opt.dataset.id;
        hidden.value = code;
        var tw = trigger.querySelector(
          ".os-id-selected-wrap, .os-id-placeholder",
        );
        if (tw)
          tw.outerHTML =
            '<div class="os-id-selected-wrap"><span class="os-id-sel-name">' +
            esc(name) +
            '</span><span class="os-id-sel-code">' +
            esc(code) +
            "</span></div>";
        listWrap.querySelectorAll(".os-id-opt").forEach(function (o) {
          o.classList.remove("os-id-selected");
        });
        opt.classList.add("os-id-selected");
        closePanel();
        // تعبئة ألوان الصنف الجديد تلقائياً
        if (selectedId) {
          var itemColors = getItemColors(selectedId);
          if (itemColors && itemColors.length) {
            var tbody = document.getElementById("po-colors-tbody");
            if (tbody) {
              tbody.innerHTML = "";
              itemColors.forEach(function (c) {
                window.addPOColorRow(c.code || "", c.name, 0);
              });
              renderColorChips();
              if (currentPresetSizes)
                buildSizesTableFromPreset(currentPresetSizes);
            }
          }
        }
      });
      document.addEventListener("click", function (e) {
        if (!e.target.closest("#po-item-wrap")) closePanel();
      });
    })();

    // ── جدول المقاسات ───────────────────────────────────────────────
    var currentPresetSizes = oldSizesLabels.length ? oldSizesLabels : null;

    function buildSizesTableFromPreset(sizesArr) {
      var colorRows = [];
      document
        .querySelectorAll("#po-colors-tbody tr.po-color-row")
        .forEach(function (tr) {
          var code = (tr.querySelector(".po-color-code") || {}).value || "";
          var name = (tr.querySelector(".po-color-name") || {}).value || "";
          if (code || name) colorRows.push({ code: code, name: name });
        });
      if (!colorRows.length) colorRows = [{ code: "", name: "لون 1" }];

      var headerCells =
        '<th style="padding:6px 8px;font-size:11px;font-weight:600;color:var(--text2);text-align:right;min-width:90px">اللون \\ المقاس</th>' +
        sizesArr
          .map(function (s) {
            return (
              '<th style="padding:6px 10px;text-align:center;min-width:70px;background:var(--accent-soft,rgba(37,99,235,.1));color:var(--accent);font-size:12px;font-weight:700">' +
              '<span style="display:block;padding:3px 6px;background:var(--accent);color:#fff;border-radius:8px;font-size:11px">' +
              esc(s) +
              "</span></th>"
            );
          })
          .join("");

      var bodyRows = colorRows
        .map(function (clr) {
          var hex = "";
          if (CSS_COLOR_MAP) {
            hex =
              CSS_COLOR_MAP[clr.name] ||
              CSS_COLOR_MAP[(clr.name || "").toLowerCase()] ||
              "";
          }
          if (
            !hex &&
            clr.code &&
            (clr.code.startsWith("#") || /^[0-9A-Fa-f]{6}$/.test(clr.code))
          ) {
            hex = clr.code.startsWith("#") ? clr.code : "#" + clr.code;
          }
          var colorDot = hex
            ? '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' +
              esc(hex) +
              ';border:1.5px solid rgba(0,0,0,.18);margin-left:6px;vertical-align:middle;flex-shrink:0"></span>'
            : '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--border);border:1.5px solid rgba(0,0,0,.1);margin-left:6px;vertical-align:middle;flex-shrink:0"></span>';
          var cells = sizesArr
            .map(function () {
              return (
                '<td style="padding:6px 4px;text-align:center">' +
                '<div style="width:60px;height:28px;margin:auto;background:var(--surface3);border:1.5px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center">' +
                '<span style="font-size:11px;color:var(--text3)">—</span></div></td>'
              );
            })
            .join("");
          return (
            '<tr style="border-bottom:1px solid var(--border)">' +
            '<td style="padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap">' +
            '<div style="display:flex;align-items:center">' +
            colorDot +
            '<span style="color:var(--text1)">' +
            esc(clr.name || "") +
            "</span></div></td>" +
            cells +
            "</tr>"
          );
        })
        .join("");

      var wrap = document.getElementById("po-sizes-table-wrap");
      if (!wrap) return;
      wrap.innerHTML =
        '<div style="font-size:11px;color:var(--text3);margin-bottom:6px;padding:6px 8px;background:var(--surface3);border-radius:6px;display:flex;align-items:center;gap:6px">' +
        "<span>ℹ️</span><span>هذا الجدول مرجع بصري للمقاسات والألوان — الكميات تُدخل في مرحلة الإنتاج الفعلي</span></div>" +
        '<table style="width:100%;border-collapse:collapse;font-family:var(--font-main)">' +
        '<thead><tr style="background:var(--surface3)">' +
        headerCells +
        "</tr></thead>" +
        "<tbody>" +
        bodyRows +
        "</tbody></table>";
    }

    function applyPreset(sizesArr) {
      currentPresetSizes = sizesArr;
      var bar = document.getElementById("po-selected-preset-bar");
      var labelsEl = document.getElementById("po-selected-preset-labels");
      if (bar && labelsEl) {
        labelsEl.textContent = sizesArr.join(" | ");
        bar.style.display = "flex";
      }
      buildSizesTableFromPreset(sizesArr);
    }

    // أزرار presets
    document.querySelectorAll(".po-preset-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sizesArr = (this.dataset.sizes || "").split(",").map(function (s) {
          return s.trim();
        });
        document.querySelectorAll(".po-preset-btn").forEach(function (b) {
          b.style.background = "var(--surface3)";
          b.style.borderColor = "var(--border)";
          b.style.color = "var(--text2)";
        });
        this.style.background = "var(--accent)";
        this.style.borderColor = "var(--accent)";
        this.style.color = "#fff";
        applyPreset(sizesArr);
      });
    });

    // زر إلغاء الاختيار
    var clearPresetBtn = document.getElementById("po-clear-preset-btn");
    if (clearPresetBtn) {
      clearPresetBtn.addEventListener("click", function () {
        currentPresetSizes = null;
        var bar = document.getElementById("po-selected-preset-bar");
        if (bar) bar.style.display = "none";
        document.querySelectorAll(".po-preset-btn").forEach(function (b) {
          b.style.background = "var(--surface3)";
          b.style.borderColor = "var(--border)";
          b.style.color = "var(--text2)";
        });
        var wrap = document.getElementById("po-sizes-table-wrap");
        if (wrap)
          wrap.innerHTML =
            '<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px">اختر جدول مقاسات من الأعلى لبناء الجدول</div>';
      });
    }

    // ── addPOColorRow / removePOColorRow ────────────────────────────
    window.addPOColorRow = function (code, name, qty) {
      var tbody = document.getElementById("po-colors-tbody");
      var tr = document.createElement("tr");
      tr.className = "po-color-row";
      tr.style.display = "none";
      code = code || "";
      name = name || "";
      qty = qty || 0;
      tr.innerHTML =
        '<td><input class="po-color-code" type="text" value="' +
        esc(code) +
        '"></td>' +
        '<td><input class="po-color-name" type="text" value="' +
        esc(name) +
        '"></td>' +
        '<td><input class="po-color-qty" type="number" min="0" value="' +
        qty +
        '"></td>';
      tbody.appendChild(tr);
      renderColorChips();
      updateTotalDisplay();
      if (currentPresetSizes) {
        setTimeout(function () {
          buildSizesTableFromPreset(currentPresetSizes);
        }, 80);
      }
    };

    window.removePOColorRow = function (chipOrBtn) {
      var chip =
        chipOrBtn &&
        chipOrBtn.classList &&
        chipOrBtn.classList.contains("po-chip")
          ? chipOrBtn
          : chipOrBtn
            ? chipOrBtn.closest(".po-chip")
            : null;
      if (!chip) return;
      var idx = parseInt(chip.dataset.idx);
      var rows = document.querySelectorAll("#po-colors-tbody tr.po-color-row");
      if (!isNaN(idx) && rows[idx]) rows[idx].remove();
      renderColorChips();
      updateTotalDisplay();
      if (currentPresetSizes)
        setTimeout(function () {
          buildSizesTableFromPreset(currentPresetSizes);
        }, 80);
    };

    // ── تحميل الألوان الحالية من الأمر ─────────────────────────────
    currentColors.forEach(function (c) {
      window.addPOColorRow(
        c.color_code || c.size || "",
        c.color_name || c.size || "",
        c.qty || 0,
      );
    });

    // لو فيه مقاسات محفوظة → استعادتها وعرض الـ preset bar
    if (currentPresetSizes && currentPresetSizes.length) {
      var bar = document.getElementById("po-selected-preset-bar");
      var labelsEl = document.getElementById("po-selected-preset-labels");
      if (bar && labelsEl) {
        labelsEl.textContent = currentPresetSizes.join(" | ");
        bar.style.display = "flex";
      }
      buildSizesTableFromPreset(currentPresetSizes);
    } else {
      var wrap = document.getElementById("po-sizes-table-wrap");
      if (wrap)
        wrap.innerHTML =
          '<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px"> اختر جدول مقاسات من الأعلى لبناء الجدول</div>';
    }

    // ── Save ────────────────────────────────────────────────────────
    document
      .getElementById("save-po-btn")
      .addEventListener("click", function () {
        var productId = itemCodeToId(document.getElementById("po-item").value);
        var patronNum = document.getElementById("po-patron").value.trim();
        var notes = document.getElementById("po-notes").value;
        var targetQty =
          parseInt(document.getElementById("po-target-qty").value) || 0;

        // جمع بيانات جدول المقاسات
        var sizeLabels =
          currentPresetSizes && currentPresetSizes.length
            ? currentPresetSizes
            : Array.from(document.querySelectorAll(".po-size-label")).map(
                function (inp) {
                  return inp.value.trim();
                },
              );
        var sizesTable = [];
        document
          .querySelectorAll("#po-sizes-table-wrap tbody tr")
          .forEach(function (row) {
            var colorCell = row.querySelector("td:first-child");
            var colorName = colorCell ? colorCell.textContent.trim() : "";
            var qtys = {};
            row.querySelectorAll(".po-size-qty").forEach(function (inp) {
              var idx = parseInt(inp.dataset.sizeIdx);
              qtys[sizeLabels[idx] || "مقاس " + (idx + 1)] =
                Number(inp.value) || 0;
            });
            var rowTotal = Object.values(qtys).reduce(function (a, b) {
              return a + b;
            }, 0);
            if (rowTotal > 0)
              sizesTable.push({
                color: colorName,
                sizes: qtys,
                total: rowTotal,
              });
          });

        var colors = [];
        document
          .querySelectorAll("#po-colors-tbody tr.po-color-row")
          .forEach(function (tr) {
            var code = tr.querySelector(".po-color-code").value.trim();
            var name = tr.querySelector(".po-color-name").value.trim();
            var qty = Number(tr.querySelector(".po-color-qty").value) || 0;
            if (code || name)
              colors.push({
                size: code || name,
                color_code: code,
                color_name: name,
                qty: qty,
              });
          });
        var totalQty = colors.reduce(function (s, r) {
          return s + r.qty;
        }, 0);
        if (!totalQty) totalQty = targetQty || Number(order.quantity || 0);

        if (!productId) {
          NotificationEngine.error("اختر المنتج");
          return;
        }
        if (!patronNum) {
          NotificationEngine.error("أدخل رقم الباترون");
          return;
        }

        // [SE-ROLLOUT] عبر SaveEngine.run بدل _freezeUI/_gsr اليدوي.
        var _updateData = {
          product_id: productId,
          quantity: totalQty,
          target_quantity: targetQty,
          patron_number: patronNum,
          fabric_meters: order.fabric_meters || 0,
          lining_meters: order.lining_meters || 0,
          sizes: colors,
          sizes_table: sizesTable.length
            ? sizesTable
            : oldSizesData.sizes_table || [],
          sizes_labels: sizeLabels.length
            ? sizeLabels
            : oldSizesData.sizes_labels || [],
          notes: notes,
          user: APP.currentUser ? APP.currentUser.username : "",
          sessionToken: SESSION.token,
        };
        SaveEngine.run({
          screen: "Production.Order",
          entity: "production_order",
          recordId: id,
          buttonId: "save-po-btn",
          closeFn: closeModal,
          data: _updateData,
          fn: "updateProductionOrder",
          params: [id, _updateData],
          onSuccess: function (r) {
            NotificationEngine.success(r.message);
            reloadAfterMutation(function () {
              renderPage("production");
            });
          },
        });
      });
  }

  // ─────────────────────────────────────────────────────────────
  // DISPATCH (صرف للمصنع)
  // ─────────────────────────────────────────────────────────────

  // ── اختيار أمر الإنتاج في شاشة الصرف ─────────────────────────
  window.selectDispatchPO = function (poId) {
    // تحديث الـ hidden input
    var hidden = document.getElementById("disp-po");
    if (hidden) hidden.value = poId;

    // تحديث مظهر البطاقات
    document.querySelectorAll(".po-card").forEach(function (card) {
      var isSelected = card.dataset.poId === poId;
      card.style.borderColor = isSelected ? "var(--accent)" : "var(--border)";
      card.style.background = isSelected
        ? "var(--accent-soft,rgba(37,99,235,.07))"
        : "var(--surface2)";
      card.style.boxShadow = isSelected
        ? "0 0 0 3px rgba(37,99,235,.15)"
        : "none";
    });

    // [إزالة] تم إلغاء بانر "أمر الإنتاج المختار" بناءً على طلب المستخدم
    // لتجنب تكرار عرض الأمر تحت البطاقات
  };

  // ════════════════════════════════════════════════════════════════
  // بيان القص — اختيار أمر الإنتاج (بطاقة click)
  // ════════════════════════════════════════════════════════════════
  window.selectCuttingPO = function (poId) {
    var hidden = document.getElementById("cs-po");
    if (hidden) hidden.value = poId;

    // تحديث مظهر البطاقات
    document
      .querySelectorAll("#cs-po-cards-wrap .po-card")
      .forEach(function (card) {
        var isSelected = card.dataset.poId === poId;
        card.style.borderColor = isSelected
          ? "var(--danger-soft,#BE123C)"
          : "var(--border)";
        card.style.background = isSelected
          ? "rgba(159,18,57,.06)"
          : "var(--surface2)";
        card.style.boxShadow = isSelected
          ? "0 0 0 3px rgba(159,18,57,.15)"
          : "none";
      });

    // إظهار المحتوى وتحميل البيانات
    var content = document.getElementById("cs-content");
    if (!content) return;
    content.style.display = "block";

    var order = (APP.data.productionOrders || []).find(function (o) {
      return o.id === poId;
    });
    if (!order) return;

    // معلومات الهيدر
    var it = (APP.data.items || []).find(function (i) {
      return i.id === order.product_id;
    });
    var setEl = function (id, val) {
      var e = document.getElementById(id);
      if (e) e.textContent = val || "—";
    };
    setEl("cs-product-name", it ? it.name : order.product_id);
    setEl("cs-barcode", it ? it.code || it.id : order.product_id);
    setEl("cs-patron", order.patron_number || "—");
    setEl(
      "cs-order-date",
      typeof fmtDate === "function" ? fmtDate(order.date) : order.date || "—",
    );

    // تشغيل حدث change على cs-po لاستكمال باقي المنطق في bindCuttingStatement
    var evt = new Event("change");
    var poEl = document.getElementById("cs-po");
    if (poEl) poEl.dispatchEvent(evt);
  };

  // ══════════════════════════════════════════════════════════════════════
  // صرف للمصنع — Row Engine (Dispatch)
  //  [FIX] كانت bindDispatch و dispAddRow مفقودتين — سبب الـ ReferenceError
  // ══════════════════════════════════════════════════════════════════════

  var _dispRowCounter = 0;

  // ── dispAddRow — إضافة صف صنف جديد في جدول الصرف ───────────────────────
  window.dispAddRow = function () {
    var whVal = (document.getElementById("disp-wh") || {}).value || "";
    var tbody = document.getElementById("disp-rows");
    if (!tbody) return;

    _dispRowCounter++;
    var rid = "disprow-" + _dispRowCounter;
    var iddUid = "disp-row-item-" + _dispRowCounter;
    var ccdUid = "disp-row-color-" + _dispRowCounter;

    var filteredItems = [];
    if (whVal) {
      var wh = (APP.data.warehouses || []).find(function (w) {
        return w.id === whVal;
      });
      var whName = wh ? wh.name : whVal;
      filteredItems = (APP.data.items || []).filter(function (item) {
        if (!item.group) return false;
        var group = (APP.data.groups || []).find(function (g) {
          return (
            String(g.id) === String(item.group) ||
            String(g.prefix) === String(item.group)
          );
        });
        if (!group || !group.warehouse_id) return false;
        return group.warehouse_id === whVal || group.warehouse_id === whName;
      });
    } else {
      filteredItems = APP.data.items || [];
    }

    var tr = document.createElement("tr");
    tr.id = rid;
    tr.dataset.iddUid = iddUid;
    tr.dataset.ccdUid = ccdUid;
    tr.style.borderBottom = "1px solid var(--border)";
    tr.innerHTML =
      '<td style="padding:6px 4px;text-align:center;vertical-align:middle">' +
      '<span class="disp-row-serial" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--accent);color:#fff;border-radius:50%;font-size:11px;font-weight:700">' +
      _dispRowCounter +
      "</span></td>" +
      '<td style="padding:6px 8px;vertical-align:middle"><div id="' +
      iddUid +
      '-idd-outer"></div></td>' +
      '<td style="padding:6px 8px;vertical-align:middle"><div id="' +
      ccdUid +
      '-ccd-outer"></div></td>' +
      '<td style="padding:6px 8px;text-align:center;vertical-align:middle">' +
      '<input type="number" class="input disp-row-qty" min="1" value="1" style="width:100%;text-align:center;font-weight:700;font-size:15px;color:var(--accent)" oninput="dispUpdateSummary()"></td>' +
      '<td style="padding:6px 4px;text-align:center;vertical-align:middle">' +
      '<div style="display:flex;align-items:center;justify-content:center;gap:2px">' +
      '<button type="button" onclick="dispDuplicateRow(\'' +
      rid +
      '\')" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;color:var(--accent);opacity:.7;transition:opacity .15s" title="تكرار" onmouseover="this.style.opacity=\'1\'" onmouseout="this.style.opacity=\'.7\'"><i class="ti ti-copy" style="font-size:15px"></i></button>' +
      '<button type="button" onclick="dispRemoveRow(\'' +
      rid +
      '\')" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;color:var(--danger)" title="حذف"><i class="ti ti-trash" style="font-size:16px"></i></button>' +
      "</div></td>";

    tbody.appendChild(tr);
    _dispUpdateScrollLimit();

    _buildItemDropdownWidget(
      iddUid,
      filteredItems,
      "— اختر الصنف —",
      function (itemId) {
        _dispRebuildRowColor(ccdUid, itemId, whVal);
        dispUpdateSummary();
      },
    );
    _dispRebuildRowColor(ccdUid, null, whVal);
    dispUpdateSummary();
  };

  function _dispRebuildRowColor(ccdUid, itemId, whVal) {
    var outer = document.getElementById(ccdUid + "-ccd-outer");
    if (!outer) return;
    if (!itemId) {
      outer.innerHTML = _ccdHTML(
        ccdUid,
        [],
        null,
        "— اختر الصنف أولاً —",
        "noitem",
      );
      return;
    }
    var colors = getItemColors(itemId);
    if (!colors.length) {
      outer.innerHTML = _ccdHTML(ccdUid, [], null, "— لا ألوان —", "nocolor");
      return;
    }
    var whName = (function () {
      if (!whVal) return "";
      var wh = (APP.data.warehouses || []).find(function (w) {
        return w.id === whVal || w.name === whVal;
      });
      return wh ? wh.name : whVal;
    })();
    var colorsForDD = colors.map(function (c) {
      var name = typeof c === "object" ? c.name : String(c);
      var code = typeof c === "object" && c.code ? c.code : "";
      var qty = getColorQtyFiltered(itemId, name, whName);
      return {
        name: name + " (رصيد: " + qty + ")",
        _origName: name,
        code: code,
      };
    });
    outer.innerHTML = _ccdHTML(
      ccdUid,
      colorsForDD,
      null,
      "— اختر اللون —",
      false,
    );
    _initCCD(ccdUid, null);
  }

  function _getDispRowValues(tr) {
    var iddUid = tr.dataset.iddUid;
    var ccdUid = tr.dataset.ccdUid;
    var itemId = iddUid ? _getItemDropdownValue(iddUid) : "";
    var color = ccdUid
      ? (function () {
          var h = document.getElementById(ccdUid);
          return h ? h.value : "";
        })()
      : "";
    var qty = Number((tr.querySelector(".disp-row-qty") || {}).value || 0);
    return { itemId: itemId, color: color, qty: qty };
  }

  window.dispRemoveRow = function (rid) {
    var tr = document.getElementById(rid);
    if (tr) tr.remove();
    document.querySelectorAll("#disp-rows tr").forEach(function (r, i) {
      var span = r.querySelector(".disp-row-serial");
      if (span) span.textContent = i + 1;
    });
    _dispUpdateScrollLimit();
    dispUpdateSummary();
  };

  window.dispDuplicateRow = function (rid) {
    var srcTr = document.getElementById(rid);
    if (!srcTr) return;
    var srcIddUid = srcTr.dataset.iddUid;
    var srcCcdUid = srcTr.dataset.ccdUid;
    var srcItemId = _getItemDropdownValue(srcIddUid);
    var srcColor = (function () {
      var h = document.getElementById(srcCcdUid);
      return h ? h.value : "";
    })();
    var srcQty = (function () {
      var inp = srcTr.querySelector(".disp-row-qty");
      return inp ? inp.value : "1";
    })();
    var whVal = (document.getElementById("disp-wh") || {}).value || "";
    dispAddRow();
    var tbody = document.getElementById("disp-rows");
    if (!tbody) return;
    var newTr = tbody.lastElementChild;
    if (!newTr) return;
    var newIddUid = newTr.dataset.iddUid;
    var newCcdUid = newTr.dataset.ccdUid;
    var qtyInp = newTr.querySelector(".disp-row-qty");
    if (qtyInp) qtyInp.value = srcQty;
    if (srcItemId) {
      var hiddenItem = document.getElementById(newIddUid);
      if (hiddenItem) hiddenItem.value = srcItemId;
      var srcItem = (APP.data.items || []).find(function (i) {
        return i.id === srcItemId;
      });
      var dispEl = document.getElementById(newIddUid + "-idd-disp");
      if (dispEl && srcItem) {
        dispEl.className = "os-id-selected-wrap";
        dispEl.innerHTML =
          '<span class="os-id-sel-name">' +
          esc(srcItem.name) +
          "</span>" +
          (srcItem.code
            ? '<span class="os-id-sel-code">' + esc(srcItem.code) + "</span>"
            : "");
      }
      _dispRebuildRowColor(newCcdUid, srcItemId, whVal);
      if (srcColor) {
        var hiddenColor = document.getElementById(newCcdUid);
        if (hiddenColor) hiddenColor.value = srcColor;
        var ccdDisp = document.getElementById(newCcdUid + "-ccd-disp");
        if (ccdDisp) {
          var hex = colorNameToHex(srcColor) || "#e2e8f0";
          ccdDisp.innerHTML =
            '<span style="width:14px;height:14px;border-radius:50%;background:' +

          String(g.prefix) === String(item.group)

  // ── bindDispatch — الربط الكامل لصفحة صرف المصنع ───────────────────────
  function bindDispatch() {
    _upgradeWhSelect("disp-wh");
    _dispRowCounter = 0;

    var _dispImgBase64 = null;
    var _dispImgName = null;

    var imgInput = document.getElementById("disp-img-input");
    if (imgInput) {
      imgInput.addEventListener("change", function () {
        var file = this.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) {
          NotificationEngine.error("حجم الصورة أكبر من 8 ميجا");
          return;
        }
        _dispImgName = file.name;
        var reader = new FileReader();
        reader.onload = function (e) {
          _dispImgBase64 = e.target.result.split(",")[1];
          var thumb = document.getElementById("disp-img-thumb");
          if (thumb) thumb.src = e.target.result;
          var preview = document.getElementById("disp-img-preview");
          if (preview) preview.style.display = "";
          var zone = document.getElementById("disp-img-zone");
          if (zone) zone.style.display = "none";
          var status = document.getElementById("disp-img-upload-status");
          if (status) status.textContent = " جاهز للرفع مع الحفظ";
        };
        reader.readAsDataURL(file);
      });
    }

    window.dispClearImage = function () {
      _dispImgBase64 = null;
      _dispImgName = null;
      var preview = document.getElementById("disp-img-preview");
      if (preview) preview.style.display = "none";
      var zone = document.getElementById("disp-img-zone");
      if (zone) zone.style.display = "";
      var inp = document.getElementById("disp-img-input");
      if (inp) inp.value = "";
    };

    function resolveWhName(whIdOrName) {
      var wh = (APP.data.warehouses || []).find(function (w) {
        return w.id === whIdOrName || w.name === whIdOrName;
      });
      return wh ? wh.name : whIdOrName || "";
    }

    var whSel = document.getElementById("disp-wh");
    if (whSel) {
      whSel.addEventListener("change", function () {
        dispRebuildAllRows();
      });
    }

    dispAddRow();

    var btn = document.getElementById("btn-disp");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var poVal = (document.getElementById("disp-po") || {}).value || "";
      var whVal = (document.getElementById("disp-wh") || {}).value || "";
      var refVal = (document.getElementById("disp-ref") || {}).value || "";
      var notesVal = (document.getElementById("disp-notes") || {}).value || "";

      if (!poVal) {
        NotificationEngine.error("يجب اختيار أمر الإنتاج");
        return;
      }
      if (!whVal) {
        NotificationEngine.error("يجب اختيار مخزن الصرف");
        return;
      }

      var rows = document.querySelectorAll("#disp-rows tr");
      if (!rows.length) {
        NotificationEngine.error("أضف صنفاً واحداً على الأقل");
        return;
      }

      var items = [];
      var hasError = false;
      rows.forEach(function (r, idx) {
        var vals = _getDispRowValues(r);
        var rowNum = idx + 1;
        if (!vals.itemId) {
          NotificationEngine.error("الصف " + rowNum + ": يجب اختيار الصنف");
          hasError = true;
          return;
        }
        if (!vals.qty || vals.qty < 1) {
          NotificationEngine.error("الصف " + rowNum + ": الكمية غير صحيحة");
          hasError = true;
          return;
        }
        var itemColors = getItemColors(vals.itemId);
        if (itemColors.length && !vals.color) {
          NotificationEngine.error("الصف " + rowNum + ": يجب اختيار اللون لهذا الصنف");
          hasError = true;
          return;
        }
        items.push({
          item_id: vals.itemId,
          quantity: vals.qty,
          color: vals.color,
        });
      });
      if (hasError) return;

      var batch = {
        type: "DISPATCH",
        from_warehouse: resolveWhName(whVal),
        notes:
          (notesVal ? notesVal + " | " : "") +
          "صرف للمصنع — أمر إنتاج: " +
          poVal,
        user: APP.currentUser.username || "",
        ref: refVal || poVal,
        production_order_id: poVal,
        items: items,
      };

      typeof closeModal === "function" && closeModal();

      function doSave(imageUrl) {
        if (imageUrl) batch.image_url = imageUrl;
        // [SE-ROLLOUT] عبر SaveEngine.run بدل _freezeUI/_gsr اليدوي.
        SaveEngine.run({
          screen: "Production.Dispatch",
          entity: "batch_transaction",
          buttonId: "btn-disp",
          data: batch,
          fn: "addBatchTransaction",
          params: [batch],
          onSuccess: function (r) {
            NotificationEngine.success(r.message);
            reloadAfterMutation(function () {
              renderPage("dispatch");
            });
          },
        });
      }

      if (_dispImgBase64 && _dispImgName) {
        var status = document.getElementById("disp-img-upload-status");
        if (status) status.textContent = "⏳ جاري رفع الصورة...";
        _gsr(
          "uploadImageToDrive",
          [
            _dispImgBase64,
            _dispImgName,
            "dispatch",
            { enabled: true, provider: "tinypng" },
          ],
          {
          label: "uploadImageToDrive:dispatch",
          rawResponse: true,
          onSuccess: function (r) {
            var url = r && r.data;
            if (status) status.textContent = url ? " تم الرفع" : " فشل الرفع";
            doSave(url || "");
          },
          onError: function () {
            if (status) status.textContent = " فشل رفع الصورة";
            doSave("");
          },
        });
      } else {
        doSave("");
      }
    });
  }

  function _frRebuildRowColor(ccdUid, itemId, whVal) {
    var outer = document.getElementById(ccdUid + "-ccd-outer");
    if (!outer) return;
    if (!itemId) {
      outer.innerHTML = _ccdHTML(
        ccdUid,
        [],
        null,
        "— اختر الصنف أولاً —",
        "noitem",
      );
      return;
    }
    var colors = getItemColors(itemId);
    if (!colors.length) {
      outer.innerHTML = _ccdHTML(ccdUid, [], null, "— لا ألوان —", "nocolor");
      return;
    }
    var whName = (function () {
      if (!whVal) return "";
      var wh = (APP.data.warehouses || []).find(function (w) {
        return w.id === whVal || w.name === whVal;
      });
      return wh ? wh.name : whVal;
    })();
    var colorsForDD = colors.map(function (c) {
      var name = typeof c === "object" ? c.name : String(c);
      var code = typeof c === "object" && c.code ? c.code : "";
      var qty = getColorQtyFiltered(itemId, name, whName);
      return {
        name: name + " (رصيد: " + qty + ")",
        _origName: name,
        code: code,
      };
    });
    outer.innerHTML = _ccdHTML(
      ccdUid,
      colorsForDD,
      null,
      "— اختر اللون —",
      false,
    );

          return h ? h.value : "";
