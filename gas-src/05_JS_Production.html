    };

    function resolveWhName(whIdOrName) {
      var wh = APP.data.warehouses.find(function (w) {
        return w.id === whIdOrName || w.name === whIdOrName;
      });
      return wh ? wh.name : whIdOrName || "";
    }

    // حدث تغيير المخزن
    var whSel = document.getElementById("fr-wh");
    if (whSel) {
      whSel.addEventListener("change", function () {
        frRebuildAllRows();
      });
    }

    // أضف أول صف
    frAddRow();

    // ── زر التسجيل ───────────────────────────────────────────────────
    var btn = document.getElementById("btn-fr");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var poVal = (document.getElementById("fr-po") || {}).value || "";
      var whVal = (document.getElementById("fr-wh") || {}).value || "";
      var refVal = (document.getElementById("fr-ref") || {}).value || "";
      var notesVal = (document.getElementById("fr-notes") || {}).value || "";

      if (!poVal) {
        NotificationEngine.error("يجب اختيار أمر الإنتاج");
        return;
      }
      if (!whVal) {
        NotificationEngine.error("يجب اختيار المخزن المستهدف");
        return;
      }

      var rows = document.querySelectorAll("#fr-rows tr");
      if (!rows.length) {
        NotificationEngine.error("أضف صنفاً واحداً على الأقل");
        return;
      }

      var items = [];
      var hasError = false;
      rows.forEach(function (r, idx) {
        var vals = _getFrRowValues(r);
        var rowNum = idx + 1;
        if (!vals.itemId) {
          NotificationEngine.error("الصف " + rowNum + ": يجب اختيار الصنف");
          hasError = true;
          return;
        }
        if (!vals.qty || vals.qty < 1) {
          NotificationEngine.error("الصف " + rowNum + ": الكمية غير صحيحة");
          hasError = true;
          return;
        }
        var itemColors = getItemColors(vals.itemId);
        if (itemColors.length && !vals.color) {
          NotificationEngine.error("الصف " + rowNum + ": يجب اختيار اللون لهذا الصنف");
          hasError = true;
          return;
        }
        items.push({
          item_id: vals.itemId,
          quantity: vals.qty,
          color: vals.color,
        });
      });
      if (hasError) return;

      var batch = {
        type: "FACTORY_RETURN",
        to_warehouse: resolveWhName(whVal),
        notes:
          (notesVal ? notesVal + " | " : "") +
          "مرتجع من مصنع — أمر إنتاج: " +
          poVal,
        user: APP.currentUser.username || "",
        ref: refVal || poVal,
        items: items,
      };

      closeModal && closeModal();

      function doSave(imageUrl) {
        if (imageUrl) batch.image_url = imageUrl;
        // [SE-ROLLOUT] عبر SaveEngine.run بدل _freezeUI/_gsr اليدوي.
        SaveEngine.run({
          screen: "Production.FactoryReturn",
          entity: "batch_transaction",
          buttonId: "btn-fr",
          data: batch,
          fn: "addBatchTransaction",
          params: [batch],
          onSuccess: function (r) {
            NotificationEngine.success(r.message);
            reloadAfterMutation(function () {
              renderPage("factory_return");
            });
          },
        });
      }

      if (_frImgBase64 && _frImgName) {
        var status = document.getElementById("fr-img-upload-status");
        if (status) status.textContent = "⏳ جاري رفع الصورة...";
        _gsr(
          "uploadImageToDrive",
          [
            _frImgBase64,
            _frImgName,
            "factory_return",
            { enabled: true, provider: "tinypng" },
          ],
          {
            label: "uploadImageToDrive:factoryReturn",
            rawResponse: true,
            onSuccess: function (r) {
              var url = r && r.data;
              if (status)
                status.textContent = url ? " تم الرفع" : " فشل الرفع";
              doSave(url || "");
            },
            onError: function () {
              if (status) status.textContent = " فشل رفع الصورة";
              doSave("");
            },
          },
        );
      } else {
        doSave("");
      }
    });
  }

  // ══════════════════════════════════════════════════════════════════════
  // استلام منتج تام — Row Engine (مثل Dispatch)
  // ══════════════════════════════════════════════════════════════════════

  var _fgRowCounter = 0;

  window.fgAddRow = function () {
    var toWh = (document.getElementById("fg-to") || {}).value || "";
    var tbody = document.getElementById("fg-rows");
    if (!tbody) return;

    _fgRowCounter++;
    var rid = "fgrow-" + _fgRowCounter;
    var iddUid = "fg-row-item-" + _fgRowCounter;
    var ccdUid = "fg-row-color-" + _fgRowCounter;

    // المنتجات التامة فقط — أصناف مخزن التام
    var fgItems = (APP.data.items || []).filter(function (item) {
      if (!item.group) return false;
      var group = (APP.data.groups || []).find(function (g) {
        return (
          String(g.id) === String(item.group) ||
          String(g.prefix) === String(item.group)
        );
      });
      if (!group || !group.warehouse_id) return false;
      var wh = (APP.data.warehouses || []).find(function (w) {
        return w.id === group.warehouse_id || w.name === group.warehouse_id;
      });
      return (
        wh &&
        String(wh.type || "")
          .trim()
          .startsWith("تام")
      );
    });
    if (!fgItems.length) fgItems = APP.data.items; // fallback

    var tr = document.createElement("tr");
    tr.id = rid;
    tr.dataset.iddUid = iddUid;
    tr.dataset.ccdUid = ccdUid;
    tr.style.borderBottom = "1px solid var(--border)";
    tr.innerHTML =
      '<td style="padding:6px 4px;text-align:center;vertical-align:middle">' +
      '<span class="fg-row-serial" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:#047857;color:#fff;border-radius:50%;font-size:11px;font-weight:700">' +
      _fgRowCounter +
      "</span></td>" +
      '<td style="padding:6px 8px;vertical-align:middle">' +
      '<div id="' +
      iddUid +
      '-idd-outer"></div></td>' +
      '<td style="padding:6px 8px;vertical-align:middle">' +
      '<div id="' +
      ccdUid +
      '-ccd-outer"></div></td>' +
      '<td style="padding:6px 8px;text-align:center;vertical-align:middle">' +
      '<input type="number" class="input fg-row-qty" min="1" value="1" style="width:100%;text-align:center;font-weight:700;font-size:15px;color:#047857" oninput="fgUpdateSummary()"></td>' +
      '<td style="padding:6px 4px;text-align:center;vertical-align:middle">' +
      '<div style="display:flex;align-items:center;justify-content:center;gap:2px">' +
      '<button type="button" onclick="fgDuplicateRow(\'' +
      rid +
      '\')" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;color:#047857;opacity:.7;transition:opacity .15s" title="تكرار" onmouseover="this.style.opacity=\'1\'" onmouseout="this.style.opacity=\'.7\'">' +
      '<i class="ti ti-copy" style="font-size:15px"></i></button>' +
      '<button type="button" onclick="fgRemoveRow(\'' +
      rid +
      '\')" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;color:var(--danger)" title="حذف">' +
      '<i class="ti ti-trash" style="font-size:16px"></i></button>' +
      "</div></td>";

    tbody.appendChild(tr);
    _fgUpdateScrollLimit();

    _buildItemDropdownWidget(
      iddUid,
      fgItems,
      "— اختر المنتج —",
      function (itemId) {
        _fgRebuildRowColor(ccdUid, itemId, toWh);
        fgUpdateSummary();
      },
    );
    _fgRebuildRowColor(ccdUid, null, toWh);
    fgUpdateSummary();
  };

  function _fgRebuildRowColor(ccdUid, itemId, whVal) {
    var outer = document.getElementById(ccdUid + "-ccd-outer");
    if (!outer) return;
    if (!itemId) {
      outer.innerHTML = _ccdHTML(
        ccdUid,
        [],
        null,
        "— اختر المنتج أولاً —",
        "noitem",
      );
      return;
    }
    var colors = getItemColors(itemId);
    if (!colors.length) {
      outer.innerHTML = _ccdHTML(ccdUid, [], null, "— لا ألوان —", "nocolor");
      return;
    }
    var whName = (function () {
      if (!whVal) return "";
      var wh = (APP.data.warehouses || []).find(function (w) {
        return w.id === whVal || w.name === whVal;
      });
      return wh ? wh.name : whVal;
    })();
    var colorsForDD = colors.map(function (c) {
      var name = typeof c === "object" ? c.name : String(c);
      var code = typeof c === "object" && c.code ? c.code : "";
      var qty = getColorQtyFiltered(itemId, name, whName);
      return {
        name: name + " (رصيد: " + qty + ")",
        _origName: name,
        code: code,
      };
    });
    outer.innerHTML = _ccdHTML(
      ccdUid,
      colorsForDD,
      null,
      "— اختر اللون —",
      false,
    );
    _initCCD(ccdUid, null);
  }

  function _getFgRowValues(tr) {
    var iddUid = tr.dataset.iddUid;
    var ccdUid = tr.dataset.ccdUid;
    var itemId = iddUid ? _getItemDropdownValue(iddUid) : "";
    var color = ccdUid
      ? (function () {
          var h = document.getElementById(ccdUid);
          return h ? h.value : "";
        })()
      : "";
    var qty = Number((tr.querySelector(".fg-row-qty") || {}).value || 0);
    return { itemId: itemId, color: color, qty: qty };
  }

  window.fgRemoveRow = function (rid) {
    var tr = document.getElementById(rid);
    if (tr) tr.remove();
    document.querySelectorAll("#fg-rows tr").forEach(function (r, i) {
      var span = r.querySelector(".fg-row-serial");
      if (span) span.textContent = i + 1;
    });
    _fgUpdateScrollLimit();
    fgUpdateSummary();
  };

  window.fgDuplicateRow = function (rid) {
    var srcTr = document.getElementById(rid);
    if (!srcTr) return;
    var srcIddUid = srcTr.dataset.iddUid;
    var srcCcdUid = srcTr.dataset.ccdUid;
    var srcItemId = _getItemDropdownValue(srcIddUid);
    var srcColor = (function () {
      var h = document.getElementById(srcCcdUid);
      return h ? h.value : "";
    })();
    var srcQty = (function () {
      var inp = srcTr.querySelector(".fg-row-qty");
      return inp ? inp.value : "1";
    })();
    var toWh = (document.getElementById("fg-to") || {}).value || "";

    fgAddRow();

    var tbody = document.getElementById("fg-rows");
    if (!tbody) return;
    var newTr = tbody.lastElementChild;
    if (!newTr) return;
    var newIddUid = newTr.dataset.iddUid;
    var newCcdUid = newTr.dataset.ccdUid;

    var qtyInp = newTr.querySelector(".fg-row-qty");
    if (qtyInp) qtyInp.value = srcQty;

    if (srcItemId) {
      var hiddenItem = document.getElementById(newIddUid);
      if (hiddenItem) hiddenItem.value = srcItemId;
      var srcItem = APP.data.items.find(function (i) {
        return i.id === srcItemId;
      });
      var dispEl = document.getElementById(newIddUid + "-idd-disp");
      if (dispEl && srcItem) {
        dispEl.className = "os-id-selected-wrap";
        dispEl.innerHTML =
          '<span class="os-id-sel-name">' +
          esc(srcItem.name) +
          "</span>" +
          (srcItem.code
            ? '<span class="os-id-sel-code">' + esc(srcItem.code) + "</span>"
            : "");
      }
      _fgRebuildRowColor(newCcdUid, srcItemId, toWh);
      if (srcColor) {
        var hiddenColor = document.getElementById(newCcdUid);
        if (hiddenColor) hiddenColor.value = srcColor;
        var ccdDisp = document.getElementById(newCcdUid + "-ccd-disp");
        if (ccdDisp) {
          var hex = colorNameToHex(srcColor) || "#e2e8f0";
          ccdDisp.innerHTML =
            '<span style="width:14px;height:14px;border-radius:50%;background:' +
            esc(hex) +
            ';border:1.5px solid rgba(0,0,0,.13);flex-shrink:0;display:inline-block"></span>' +
            '<span style="color:var(--text)">' +
            esc(srcColor) +
            "</span>";
        }
      }
    }
    fgUpdateSummary();
  };

  function _fgUpdateScrollLimit() {
    var table = document.getElementById("fg-items-table");
    if (!table) return;
    var wrap = table.parentElement;
    if (!wrap) return;
    var rows = document.querySelectorAll("#fg-rows tr");
    if (rows.length > 4) {
      wrap.style.maxHeight = 38 + 54 * 4 + "px";
      wrap.style.overflowY = "auto";
    } else {
      wrap.style.maxHeight = "none";
      wrap.style.overflowY = "visible";
    }
    if (rows.length > 4) wrap.scrollTop = wrap.scrollHeight;
  }

  window.fgUpdateSummary = function () {
    var rows = document.querySelectorAll("#fg-rows tr");
    var totalQty = 0;
    rows.forEach(function (r) {
      totalQty += Number((r.querySelector(".fg-row-qty") || {}).value || 0);
    });
    var elI = document.getElementById("fg-total-items");
    var elQ = document.getElementById("fg-total-qty");
    if (elI) elI.textContent = rows.length;
    if (elQ) elQ.textContent = totalQty;
  };

  // ── selectFgPO — تحديث بانر المعلومات + تعبئة تلقائية ───────────────
  window.selectFgPO = function (poId) {
    var hidden = document.getElementById("fg-po-ref");
    if (hidden) hidden.value = poId;

    document.querySelectorAll(".fg-po-card").forEach(function (card) {
      var isSelected = card.dataset.poId === poId;
      card.style.borderColor = isSelected ? "#22c55e" : "var(--border)";
      card.style.background = isSelected
        ? "rgba(34,197,94,.06)"
        : "var(--surface2)";
      card.style.boxShadow = isSelected
        ? "0 0 0 3px rgba(34,197,94,.15)"
        : "none";
    });

    var po = (APP.data.productionOrders || []).find(function (o) {
      return o.id === poId;
    });
    // [إزالة] تم إلغاء بانر "أمر الإنتاج المختار" بناءً على طلب المستخدم

    // تحديث المرجع تلقائياً
    var refInp = document.getElementById("fg-ref");
    if (refInp && !refInp.value.trim()) refInp.value = poId;

    // لو في صف واحد فارغ — تعبئ الصنف منه تلقائياً
    if (po && po.product_id) {
      var rows = document.querySelectorAll("#fg-rows tr");
      if (rows.length === 1) {
        var firstTr = rows[0];
        var iddUid = firstTr.dataset.iddUid;
        var ccdUid = firstTr.dataset.ccdUid;
        if (iddUid && !_getItemDropdownValue(iddUid)) {
          var preItem = APP.data.items.find(function (i) {
            return i.id === po.product_id;
          });
          if (preItem) {
            var hiddenEl = document.getElementById(iddUid);
            if (hiddenEl) hiddenEl.value = po.product_id;
            var dispEl = document.getElementById(iddUid + "-idd-disp");
            if (dispEl) {
              dispEl.className = "os-id-selected-wrap";
              dispEl.innerHTML =
                '<span class="os-id-sel-name">' +
                esc(preItem.name) +
                "</span>" +
                (preItem.code
                  ? '<span class="os-id-sel-code">' +
                    esc(preItem.code) +
                    "</span>"
                  : "");
            }
            var toWh = (document.getElementById("fg-to") || {}).value || "";
            _fgRebuildRowColor(ccdUid, po.product_id, toWh);
          }
        }
      }
    }
  };

  // ── bindFgReceive — الربط الكامل ─────────────────────────────────────
  function bindFgReceive() {
    _fgRowCounter = 0;

    if (window.AppSelect) {
      AppSelect.upgrade("fg-to", { icon: "ti-building-warehouse" });
    }

    // رفع الصورة
    var _fgImgBase64 = null;
    var _fgImgName = null;

    var imgInput = document.getElementById("fg-img-input");
    if (imgInput) {
      imgInput.addEventListener("change", function () {
        var file = this.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) {
          NotificationEngine.error("حجم الصورة أكبر من 8 ميجا");
          return;
        }
        _fgImgName = file.name;
        var reader = new FileReader();
        reader.onload = function (e) {
          _fgImgBase64 = e.target.result.split(",")[1];
          var thumb = document.getElementById("fg-img-thumb");
          if (thumb) thumb.src = e.target.result;
          var preview = document.getElementById("fg-img-preview");
          if (preview) preview.style.display = "";
          var zone = document.getElementById("fg-img-zone");
          if (zone) zone.style.display = "none";
          var status = document.getElementById("fg-img-upload-status");
          if (status) status.textContent = " جاهز للرفع مع الحفظ";
        };
        reader.readAsDataURL(file);
      });
    }

    window.fgClearImage = function () {
      _fgImgBase64 = null;
      _fgImgName = null;
      var preview = document.getElementById("fg-img-preview");
      if (preview) preview.style.display = "none";
      var zone = document.getElementById("fg-img-zone");
      if (zone) zone.style.display = "";
      var inp = document.getElementById("fg-img-input");
      if (inp) inp.value = "";
    };

    // أضف أول صف
    fgAddRow();

    // ── زر الاستلام ─────────────────────────────────────────────────
    var btn = document.getElementById("btn-fg");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var poVal = (document.getElementById("fg-po-ref") || {}).value || "";
      var toWh =
        (document.getElementById("fg-to") || {}).value || "المنتجات التامة";
      var refVal = (document.getElementById("fg-ref") || {}).value || "";
      var notesVal = (document.getElementById("fg-notes") || {}).value || "";

      var rows = document.querySelectorAll("#fg-rows tr");
      if (!rows.length) {
        NotificationEngine.error("أضف صنفاً واحداً على الأقل");
        return;
      }

      var items = [];
      var hasError = false;
      rows.forEach(function (r, idx) {
        var vals = _getFgRowValues(r);
        var rowNum = idx + 1;
        if (!vals.itemId) {
          NotificationEngine.error("الصف " + rowNum + ": يجب اختيار المنتج");
          hasError = true;
          return;
        }
        if (!vals.qty || vals.qty < 1) {
          NotificationEngine.error("الصف " + rowNum + ": الكمية غير صحيحة");
          hasError = true;
          return;
        }
        var itemColors = getItemColors(vals.itemId);
        if (itemColors.length && !vals.color) {
          NotificationEngine.error("الصف " + rowNum + ": يجب اختيار اللون لهذا الصنف");
          hasError = true;
          return;
        }
        items.push({
          item_id: vals.itemId,
          quantity: vals.qty,
          color: vals.color,
        });
      });
      if (hasError) return;

      var batch = {
        type: "FG_IN",
        to_warehouse: toWh,
        notes: notesVal,
        user: APP.currentUser.username || "",
        ref: refVal || poVal || "",
        items: items,
      };

      closeModal && closeModal();

      function doSave(imageUrl) {
        if (imageUrl) batch.image_url = imageUrl;
        // [SE-ROLLOUT] عبر SaveEngine.run بدل _freezeUI/_gsr اليدوي.
        SaveEngine.run({
          screen: "Production.FGReceive",
          entity: "batch_transaction",
          buttonId: "btn-fg",
          data: batch,
          fn: "addBatchTransaction",
          params: [batch],
          onSuccess: function (r) {
            NotificationEngine.success(r.message);
            reloadAfterMutation(function () {
              renderPage("fg_receive");
            });
          },
        });
      }

      if (_fgImgBase64 && _fgImgName) {
        var status = document.getElementById("fg-img-upload-status");
        if (status) status.textContent = "⏳ جاري رفع الصورة...";
        _gsr(
          "uploadImageToDrive",
          [
            _fgImgBase64,
            _fgImgName,
            "fg_receive",
            { enabled: true, provider: "tinypng" },
          ],
          {
          label: "uploadImageToDrive:fgReceive",
          rawResponse: true,
          onSuccess: function (r) {
            var url = r && r.data;
            if (status) status.textContent = url ? " تم الرفع" : " فشل الرفع";
            doSave(url || "");
          },
          onError: function () {
            if (status) status.textContent = " فشل رفع الصورة";
            doSave("");
          },
        });
      } else {
        doSave("");
      }
    });
  }

  window.ctx_editProductionOrder = function (id) {
    editPO(id);

  window.ctx_viewProductionOrder = function (id) {
    editPO(id);
  };

    _ctxChangePOStatus(id, "inprogress", "بدء التصنيع");
  };
  window.ctx_completeProduction = function (id) {
    _ctxChangePOStatus(id, "done", "إغلاق الأمر كمكتمل");
  };
  window.ctx_deleteProductionOrder = function (id) {
    var order = (APP.data.productionOrders || []).find(function (o) {
      return o.id === id;
    });
    if (!order) return NotificationEngine.error("الأمر غير موجود");
    confirmDelete(
      "حذف أمر الإنتاج",
      "حذف أمر الإنتاج " + id + "؟ لا يمكن التراجع.",
      function () {
        showLoading && showLoading();
        _gsr("deleteProductionOrder", [id, APP.currentUser.username], {
          label: "deleteProductionOrder",
          onSuccess: function (res) {
            hideLoading && hideLoading();
            APP.data.productionOrders = (
              APP.data.productionOrders || []
            ).filter(function (o) {
              return o.id !== id;
            });
            NotificationEngine.success("تم حذف الأمر");
            renderPage(APP.currentPage);
          },
          onError: function (res) {
            hideLoading && hideLoading();
            NotificationEngine.error((res && res.message) || "فشل الحذف");
          },
        });
      },
    );
  };
  function _ctxChangePOStatus(id, newStatus, label) {
    var order = (APP.data.productionOrders || []).find(function (o) {
      return o.id === id;
    });
    if (!order) return NotificationEngine.error("الأمر غير موجود");
    showConfirm({
      title: label,
      message: label + " للأمر " + id + "؟",
      icon: "ti-tools",
      iconColor: "#2563eb",
      confirmText: label,
      confirmClass: "btn-primary",
      onConfirm: function () {
        showLoading && showLoading();
        _gsr("updateProductionOrderStatus", [id, newStatus], {
          label: "updateProductionOrderStatus:ctx",
          onSuccess: function (res) {
            hideLoading && hideLoading();
            order.status = newStatus;
            NotificationEngine.success("تم " + label);
            renderPage(APP.currentPage);
          },
          onError: function (res) {
            hideLoading && hideLoading();
            NotificationEngine.error((res && res.message) || "فشل تغيير الحالة");
          },
        });
      },
    });
  }

  // ═══════════════════════════════════════════════════════════════
  // §HR-PROD-STAGES [MOVED FROM 12_JS_HR.html] — شاشة مراحل الإنتاج
  // ─────────────────────────────────────────────────────────────
  // نُقلت هنا لأن الـ backend بتاعها (Code_17b_ProductionOrders.js)
  // كان اتنقل من قبل من Code_16_Inventory.js، وده الفرونت إند اللي
  // بيتماشى معاه منطقيًا — نفس الكود حرفيًا من غير أي تغيير في المنطق.
  // ═══════════════════════════════════════════════════════════════

  // §HR-PROD-STAGES  مراحل الإنتاج — Production Stages
  // ═══════════════════════════════════════════════════════════════

  // ── حالة الصفحة ──
  // [إصلاح P2] كانت perPage ثابتة يدويًا (8) بدون أي علاقة بتفضيل
  // items_per_page المخزَّن فعليًا — نفس النمط المُطبَّق في 04_JS_Transactions.html.
  var _PS = {
    all: [], // كل السجلات المحمّلة
    filtered: [], // بعد الفلترة
    page: 1,
    perPage:
      typeof PreferenceService !== "undefined"
        ? PreferenceService.get("items_per_page", 8)
        : 8,
    sortCol: "code",
    sortDir: 1,
    detailId: null, // المرحلة المفتوحة في Drawer التفاصيل
    depts: [], // قائمة الأقسام من APP.data
  };

  // لو المستخدم غيّر "عدد الصفوف الافتراضي" وشاشة مراحل الإنتاج مفتوحة
  // بالفعل، نطبّق القيمة الجديدة فورًا بدون Refresh
  if (typeof PreferenceService !== "undefined") {
    PreferenceService.subscribe("items_per_page", function (newVal) {
      var n = Number(newVal);
      if (!n || n < 1) return;
      _PS.perPage = n;
      _PS.page = 1;
      if (document.getElementById("ps-table-body")) {
        _psRenderTable();
        _psRenderPagination();
      }
    });
  }

  // ── Bootstrap ──
  function bindProductionStages() {
    _psLoadDepts();
    _psLoadData();
    _psBindControls();
  }

  // ── تحميل الأقسام من APP.data ──
  function _psLoadDepts() {
    var depts = [];
    try {
      depts = (APP.data.departments || []).map(function (d) {
        return { id: d.id, name: d.name };
      });
    } catch (e) {}
    _PS.depts = depts;

    // ملء قوائم الأقسام — القيمة الفعلية هي معرّف القسم (department_id)
    var opts = depts
      .map(function (d) {
        return '<option value="' + esc(d.id) + '">' + esc(d.name) + "</option>";
      })
      .join("");

    ["ps-filter-dept", "ps-f-dept"].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var base =
        id === "ps-filter-dept"
          ? '<option value="">' + I18N.t("HR_ALL_DEPARTMENTS") + "</option>"
          : '<option value="">' + I18N.t("LBL_CHOOSE_DASH") + "</option>";
      el.innerHTML = base + opts;
    });
  }

  // ── تحميل البيانات من الباك إند ──
  function _psLoadData() {
    showLoading("جاري تحميل مراحل الإنتاج...");
    _gsr("getProductionStages", _authArgs(), {
      label: "HR.getProductionStages",
      onSuccess: function (result) {
        hideLoading();
        _PS.all = result.data || [];
        _psApplyFilters();
        _psRenderStats();
      },
      onError: function (result) {
        hideLoading();
        NotificationEngine.error(result.message || "خطأ في تحميل مراحل الإنتاج");
      },
    });
  }

  // ── ربط الأحداث ──
  function _psBindControls() {
    _psOn("ps-btn-add", "click", function () {
      openPSFormDrawer(null);
    });
    _psOn("ps-btn-clear-filters", "click", _psClearFilters);
    _psOn("ps-btn-export-excel", "click", function () {
      if (!window.ExportUtil) {
        NotificationEngine.error("ExportUtil غير محملة");
        return;
      }
      var data = _PS.filtered || _PS.all || [];
      if (!data.length) {
        NotificationEngine.warning("لا توجد بيانات للتصدير");
        return;
      }
      var headers = [
        "كود الموظف",
        "الاسم",
        "القسم",
        "الوحدة",
        "الراتب الأساسي",
        "الحوافز",
        "الخصومات",
        "الحالة",
      ];
      var rows = data.map(function (s) {
        return [
          s.code || "",
          s.name || "",
          s.department || "",
          s.unit || "",
          s.basic_salary || 0,
          s.incentives || 0,
          s.deductions || 0,
          s.status || "",
        ];
      });
      ExportUtil.toExcel(
        rows,
        headers,
        "مراحل_الإنتاج_" + new Date().toISOString().slice(0, 10),
        "البيانات",
      );
    });
    _psOn("ps-btn-export-pdf", "click", function () {
      if (!window.ExportUtil) {
        NotificationEngine.error("ExportUtil غير محملة");
        return;
      }
      var data = _PS.filtered || _PS.all || [];
      if (!data.length) {
        NotificationEngine.warning("لا توجد بيانات للتصدير");
        return;
      }
      var headers = [
        "كود الموظف",
        "الاسم",
        "القسم",
        "الوحدة",
        "الراتب الأساسي",
        "الحوافز",
        "الخصومات",
        "الحالة",
      ];
      var rows = data.map(function (s) {
        return [
          s.code || "",
          s.name || "",
          s.department || "",
          s.unit || "",
          s.basic_salary || 0,
          s.incentives || 0,
          s.deductions || 0,
          s.status || "",
        ];
      });
      ExportUtil.toPrint(
        rows,
        headers,
        "تقرير مراحل الإنتاج",
        "تاريخ: " + fmtDate(new Date()),
      );
    });
    _psOn("ps-search", "input", _psApplyFilters);
    _psOn("ps-filter-dept", "change", _psApplyFilters);
    _psOn("ps-filter-status", "change", _psApplyFilters);
    _psOn("ps-filter-unit", "change", _psApplyFilters);

    if (window.AppSelect) {
      AppSelect.upgrade("ps-filter-dept", {
        icon: "ti-building",
        searchable: true,
      });
      AppSelect.upgrade("ps-filter-status", { icon: "ti-list-check" });
      AppSelect.upgrade("ps-filter-unit", { icon: "ti-category" });
    }

    // ضغطة Escape تغلق أي Drawer مفتوح
    document.addEventListener("keydown", _psEscHandler);
  }

  function _psOn(id, ev, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener(ev, fn);
  }

  function _psEscHandler(e) {
    if (e.key !== "Escape") return;
    closePSDetailDrawer();
  }

  // ── إحصائيات ──
  function _psRenderStats() {
    var data = _PS.all;
    var active = data.filter(function (s) {
      return s.status === "active";
    }).length;
    var exec = data.reduce(function (a, s) {
      return a + (s.executions || 0);
    }, 0);
    var cost = data.reduce(function (a, s) {
      return a + (s.price || 0) * (s.total_qty || 0);
    }, 0);

    _psSetText("ps-stat-total", data.length);
    _psSetText("ps-stat-active", active);
    _psSetText(
      "ps-stat-exec",
      NumberEngine.decimal(exec, 0),
    );
    _psSetText(
      "ps-stat-cost",
      formatMoney(Math.round(cost), { decimals: 0, withSymbol: false }),
    );
  }

  // ── فلترة وترتيب ──
  function _psApplyFilters() {
    var q = (_psVal("ps-search") || "").toLowerCase();
    var dept = _psVal("ps-filter-dept");
    var status = _psVal("ps-filter-status");
    var unit = _psVal("ps-filter-unit");

    _PS.filtered = _PS.all.filter(function (s) {
      if (
        q &&
        !(
          (s.name || "").toLowerCase().includes(q) ||
          (s.code || "").toLowerCase().includes(q) ||
          (s.department || "").toLowerCase().includes(q)
        )
      )
        return false;
      if (dept && String(s.department_id) !== String(dept)) return false;
      if (status && s.status !== status) return false;
      if (unit && s.unit !== unit) return false;
      return true;
    });

    _PS.filtered.sort(function (a, b) {
      var av = a[_PS.sortCol],
        bv = b[_PS.sortCol];
      if (typeof av === "number") return _PS.sortDir * (av - bv);
      return (
        _PS.sortDir * String(av || "").localeCompare(String(bv || ""), "ar")
      );
    });

    _PS.page = 1;
    _psRenderTable();
    _psRenderPagination();
  }

  function _psClearFilters() {
    [
      "ps-search",
      "ps-filter-dept",
      "ps-filter-status",
      "ps-filter-unit",
    ].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = "";
    });
    _psApplyFilters();
  }

  // ── رسم الجدول ──
  function _psRenderTable() {
    var tbody = document.getElementById("ps-table-body");
    if (!tbody) return;

    var start = (_PS.page - 1) * _PS.perPage;
    var rows = _PS.filtered.slice(start, start + _PS.perPage);

    if (!rows.length) {
      tbody.innerHTML =
        '<tr><td colspan="9" style="text-align:center;padding:48px;color:var(--text3)">' +
        '<div style="font-size:32px;margin-bottom:8px;opacity:.3"><i class="ti ti-mood-empty"></i></div>' +
        "<p>' + I18N.t('HR_NO_STAGES_MATCH_SEARCH') + '</p></td></tr>";
      return;
    }

    tbody.innerHTML = rows
      .map(function (s) {
        var badge =
          s.status === "active"
            ? '<span class="badge badge-success" style="font-size:11px"><i class="ti ti-circle-filled" style="font-size:8px"></i> ' +
              I18N.t("HR_ACTIVE_F") +
              "</span>"
            : '<span class="badge badge-danger"  style="font-size:11px"><i class="ti ti-circle-filled" style="font-size:8px"></i> ' +
              I18N.t("HR_SUSPENDED_F") +
              "</span>";

        return (
          "<tr>" +
          '<td><span class="mono" style="font-size:11px;color:#0F766E">' +
          esc(s.code) +
          "</span></td>" +
          "<td><strong style='font-weight:500'>" +
          esc(s.name) +
          "</strong>" +
          (s.description
            ? '<br><span style="font-size:11px;color:var(--text3)">' +
              esc(s.description.substring(0, 45)) +
              (s.description.length > 45 ? "…" : "") +
              "</span>"
            : "") +
          "</td>" +
          '<td><span class="badge" style="background:#CCFBF1;color:#0F766E;font-size:11px">' +
          esc(s.department) +
          "</span></td>" +
          '<td style="color:var(--text2)">' +
          esc(s.unit) +
          "</td>" +
          '<td class="sensitive-price" style="font-weight:700;color:#1D4ED8">' +
          formatMoney(s.price, { decimals: 0 }) +
          "</td>" +
          '<td style="text-align:center;color:var(--text2)">' +
          NumberEngine.decimal((s.executions || 0), 0) +
          "</td>" +
          "<td>" +
          badge +
          "</td>" +
          '<td style="font-size:11.5px;color:var(--text3)">' +
          (s.created_at || "—") +
          "</td>" +
          "</tr>"
        );
      })
      .join("");
  }

  // ── Pagination ──
  function _psRenderPagination() {
    var total = _PS.filtered.length;
    var pages = Math.ceil(total / _PS.perPage) || 1;
    var start = (_PS.page - 1) * _PS.perPage + 1;
    var end = Math.min(_PS.page * _PS.perPage, total);

    _psSetText(
      "ps-pagination-info",
      "عرض " + start + " - " + end + " من " + total + " مرحلة",
    );

    var btns = document.getElementById("ps-pagination-btns");
    if (!btns) return;

    var html =
      '<button class="btn btn-outline btn-xs" onclick="_psGoPage(' +
      Math.max(1, _PS.page - 1) +
      ')" ' +
      (_PS.page === 1 ? "disabled" : "") +
      '><i class="ti ti-chevron-right"></i></button>';
    for (var i = 1; i <= pages; i++) {
      html +=
        '<button class="btn btn-xs ' +
        (i === _PS.page ? "btn-primary" : "btn-outline") +
        '" onclick="_psGoPage(' +
        i +
        ')">' +
        i +
        "</button>";
    }
    html +=
      '<button class="btn btn-outline btn-xs" onclick="_psGoPage(' +
      Math.min(pages, _PS.page + 1) +
      ')" ' +
      (_PS.page === pages ? "disabled" : "") +
      '><i class="ti ti-chevron-left"></i></button>';
    btns.innerHTML = html;
  }

  function _psGoPage(p) {
    _PS.page = p;
    _psRenderTable();
    _psRenderPagination();
  }

  // ═══════════════════════════════════════════════════════════════
  // §HR-PS-FORM  Drawer الإضافة / التعديل
  // ═══════════════════════════════════════════════════════════════

  function openPSFormDrawer(id) {

          return String(x.id) === String(id);
        })
      : null;
    var isEdit = !!s;

    var deptOptions =
      '<option value="">' + I18N.t("LBL_CHOOSE_DASH") + "</option>";
    (_PS.depts || []).forEach(function (d) {

        esc(d.id) +
        '"' +
        (s && String(s.department_id) === String(d.id) ? " selected" : "") +
        ">" +

        "</option>";
    });

      return s ? esc(s[field] || "") : fallback || "";
    };

    var body =

      '<div class="hr-field"><label>' +

      '" placeholder="' +

      '"></div>' +
      '<div class="hr-field"><label>' +
      I18N.t("HR_STAGE_NAME_REQ") +
      '</label><input type="text" id="ps-f-name" value="' +
      V("name") +
      '" placeholder="' +
      I18N.t("HR_PH_STAGE_EXAMPLE") +
      '"></div>' +

      '<div class="hr-form-row">' +
      '<div class="hr-field"><label>' +
      I18N.t("HR_STAGE_DESCRIPTION") +
      '</label><textarea id="ps-f-desc" rows="2" placeholder="' +
      I18N.t("HR_PH_DETAILED_DESC") +
      '">' +
      V("description") +
      "</textarea></div>" +
      "</div>" +
      "</div>" +
      '<div class="hr-section">' +
      '<div class="hr-section-title">' +
      I18N.t("HR_CLASSIFICATION_PRICING") +
      "</div>" +
      '<div class="hr-form-row cols-3">' +
      '<div class="hr-field"><label>' +
      I18N.t("HR_DEPARTMENT_REQ") +
      '</label><select id="ps-f-dept">' +

      "</select></div>" +

      (!s || s.unit === "قطعة" ? " selected" : "") +
      ">' + I18N.t('LBL_ITEM') + '</option>" +
      '<option value="كيلو"' +
      (s && s.unit === "كيلو" ? " selected" : "") +
      ">' + I18N.t('HR_UNIT_KG') + '</option>" +
      '<option value="متر"' +
      (s && s.unit === "متر" ? " selected" : "") +
      ">' + I18N.t('HR_UNIT_METER') + '</option>" +
      '<option value="عبوة"' +
      (s && s.unit === "عبوة" ? " selected" : "") +
      ">' + I18N.t('HR_UNIT_PACK') + '</option>" +
      "</select></div>" +
      '<div class="hr-field"><label>' +
      I18N.t("HR_PRICE_PER_UNIT_REQ") +
      '</label><input type="number" id="ps-f-price" value="' +
      (s ? Number(s.price || 0) : "") +
      '" min="0" step="0.01" placeholder="0.00"></div>' +
      "</div>" +
      '<div class="hr-form-row cols-2">' +
      '<div class="hr-field"><label>' +

      (!s || s.status === "active" ? " selected" : "") +

      (s && s.status === "inactive" ? " selected" : "") +
      ">' + I18N.t('HR_SUSPENDED_F') + '</option>" +

      _hrFooter(

    openHRDrawer({
      title: isEdit ? "تعديل: " + s.name : "مرحلة إنتاج جديدة",
      subtitle: isEdit ? "كود: " + s.code : "أضف مرحلة وحدد سعرها لكل وحدة",
      icon: isEdit ? "ti-edit" : "ti-tools",
      color: "teal",

      body: body,
    });

    document
      .getElementById("ps-form-save-btn")
      .addEventListener("click", savePSForm);

    setTimeout(function () {
      var el = document.getElementById("ps-f-name");

  function closePSFormDrawer() {
    _hrCloseAll();
  }

  function savePSForm() {
    var id = _psVal("ps-form-id");
    var isEdit = !!id;
    var fn = isEdit ? "updateProductionStage" : "addProductionStage";

    SaveEngine.run({
      screen: "HR.ProductionStage",
      entity: "production_stage",
      recordId: id || null,
      buttonId: "ps-form-save-btn",
      rules: [
        { field: "ps-f-name", required: true, label: "اسم المرحلة" },
        { field: "ps-f-dept", required: true, label: "القسم" },
        {
          test: function () {
            var p = parseFloat(_psVal("ps-f-price"));
            return !!p && p > 0;
          },
          message: "يرجى إدخال سعر صحيح",
        },
      ],
      collect: function () {
        return {
          code: _psVal("ps-f-code") || "",
          name: (_psVal("ps-f-name") || "").trim(),
          description: _psVal("ps-f-desc") || "",
          department_id: _psVal("ps-f-dept"),
          unit: _psVal("ps-f-unit") || "قطعة",
          price: parseFloat(_psVal("ps-f-price")),
          status: _psVal("ps-f-status") || "active",
          notes: _psVal("ps-f-notes") || "",
        };
      },
      fn: fn,
      params: function (data) {
        return isEdit ? [id, _authPayload(data)] : [_authPayload(data)];
      },
      onSuccess: function () {
        closePSFormDrawer();
        _psLoadData();
      },
    });
  }

  // §HR-PS-DETAIL  Drawer التفاصيل
  // ═══════════════════════════════════════════════════════════════

    var s = _PS.all.find(function (x) {
      return String(x.id) === String(id);
    });
    if (!s) return;
    _PS.detailId = id;

    _psSetText("ps-detail-title", s.name);
    _psSetText("ps-detail-code", s.code + " · " + s.department);

    var totalCost = NumberEngine.currency(s.price * (s.total_qty || 0));

    // بطاقات الإحصائيات
    var statsHtml =
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px">' +
      _psInfoCard(
        NumberEngine.decimal((s.executions || 0), 0),
        "عدد التنفيذات",
        "#1D4ED8",
      ) +
      _psInfoCard(
        NumberEngine.decimal((s.total_qty || 0), 0),
        "إجمالي الكميات (" + s.unit + ")",
        "#0F766E",
      ) +
      _psInfoCard(
        formatMoney(Number(totalCost), { decimals: 0, withSymbol: false }),
        "إجمالي التكلفة (ج.م)",
        "#5B21B6",
        true,
      ) +
      "</div>";

      s.status === "active"
        ? '<span class="badge badge-success">' +

        : '<span class="badge badge-danger">' +
          I18N.t("HR_SUSPENDED_F") +
          "</span>";

    var infoHtml =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">' +
      _psDetailItem(
        "كود المرحلة",
        '<span class="mono" style="color:#0F766E">' + esc(s.code) + "</span>",
      ) +
      _psDetailItem("القسم", esc(s.department)) +
      _psDetailItem("وحدة القياس", esc(s.unit)) +
      _psDetailItem(
        "السعر / وحدة",
        '<strong class="sensitive-price" style="color:#1D4ED8">' +
          NumberEngine.currency(Number(s.price)) +
          "</strong>",

      _psDetailItem("الحالة", badge) +
      _psDetailItem("آخر تعديل", esc(s.updated_at || "—")) +

      (s.description
        ? '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:500;color:var(--text3);margin-bottom:5px">' +
          I18N.t("LBL_DESCRIPTION") +
          "</div>" +
          '<div style="font-size:13px;color:var(--text2);line-height:1.6;padding:10px 12px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">' +
          esc(s.description) +
          "</div></div>"
        : "") +
      (s.notes
        ? '<div style="margin-bottom:16px"><div style="font-size:11px;font-weight:500;color:var(--text3);margin-bottom:5px">' +
          I18N.t("LBL_NOTES") +
          "</div>" +
          '<div style="font-size:13px;color:#92400E;padding:8px 12px;background:#FEF3C7;border-radius:8px;border:1px solid #FDE68A"><i class="ti ti-alert-triangle"></i> ' +
          esc(s.notes) +
          "</div></div>"
        : "");

    // الموظفون المرتبطون
    var emps = s.linked_employees || [];
    var empsHtml = "";
    if (emps.length) {
      var empTotal = emps.reduce(function (a, e) {
        return a + e.qty;
      }, 0);
      empsHtml =
        emps
          .map(function (e) {
            var earned = NumberEngine.currency(e.qty * s.price);
            return (
              '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">' +
              '<div style="width:32px;height:32px;border-radius:50%;background:#CCFBF1;color:#0F766E;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">' +
              esc(e.initials) +
              "</div>" +
              '<div style="flex:1"><div style="font-size:13px;font-weight:500">' +
              esc(e.name) +
              "</div>" +
              '<div style="font-size:11px;color:var(--text3)">' +
              esc(e.dept) +
              "</div></div>" +
              '<div class="sensitive-balance" style="text-align:left;font-size:12px;color:var(--text2)">' +
              "<div>" +
              NumberEngine.decimal(e.qty, 0) +
              " " +
              esc(s.unit) +
              " × " +
              formatMoney(s.price, { decimals: 0 }) +
              "</div>" +
              '<div style="font-weight:700;color:#059669">' +
              formatMoney(earned, { decimals: 0 }) +
              "</div></div>" +
              "</div>"
            );
          })
          .join("") +
        '<div style="display:flex;justify-content:space-between;padding-top:10px;font-size:12.5px;color:var(--text2)">' +
        "<span>' + I18N.t('HR_TOTAL_EMP_DUES') + '</span>" +
        '<strong class="sensitive-balance" style="color:#059669">' +
        formatMoney(Number(totalCost), { decimals: 0 }) +
        "</strong></div>";
    } else {
      empsHtml =
        '<p style="text-align:center;padding:24px;color:var(--text3);font-size:13px">' +
        I18N.t("HR_NO_EMPLOYEES_LINKED_TO_STAGE") +
        "</p>";
    }

    // تبويبات
    var tabsHtml =
      '<div style="display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px">' +
      '<div class="ps-tab ps-tab-active" id="ps-tab-info" onclick="_psSwitchTab(\'info\')" style="padding:7px 14px;font-size:12.5px;font-weight:500;color:#0F766E;border-bottom:2px solid #0F766E;margin-bottom:-1px;cursor:pointer;border-radius:6px 6px 0 0;background:#CCFBF1"><i class="ti ti-info-circle"></i> ' +
      I18N.t("HR_STAGE_DATA") +
      "</div>" +
      '<div class="ps-tab" id="ps-tab-emps" onclick="_psSwitchTab(\'emps\')" style="padding:7px 14px;font-size:12.5px;font-weight:500;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;border-radius:6px 6px 0 0"><i class="ti ti-users"></i> الموظفون المرتبطون (' +
      emps.length +
      ")</div>" +
      "</div>" +
      '<div id="ps-panel-info">' +
      infoHtml +
      "</div>" +
      '<div id="ps-panel-emps" style="display:none">' +
      empsHtml +
      "</div>";

    var body = document.getElementById("ps-detail-body");
    if (body) body.innerHTML = statsHtml + tabsHtml;

    // زر تعديل في footer
    var editBtn = document.getElementById("ps-detail-edit-btn");
    if (editBtn) {
      editBtn.onclick = function () {
        closePSDetailDrawer();
        openPSFormDrawer(id);
      };
    }

    _psShowDrawer("ps-detail-drawer");
  }

  function _psSwitchTab(tab) {
    var isInfo = tab === "info";
    var tInfo = document.getElementById("ps-tab-info");
    var tEmps = document.getElementById("ps-tab-emps");
    var pInfo = document.getElementById("ps-panel-info");
    var pEmps = document.getElementById("ps-panel-emps");
    if (!tInfo) return;

    tInfo.style.color = isInfo ? "#0F766E" : "var(--text3)";
    tInfo.style.borderBottom = isInfo
      ? "2px solid #0F766E"
      : "2px solid transparent";
    tInfo.style.background = isInfo ? "#CCFBF1" : "transparent";
    tEmps.style.color = !isInfo ? "#0F766E" : "var(--text3)";
    tEmps.style.borderBottom = !isInfo
      ? "2px solid #0F766E"
      : "2px solid transparent";
    tEmps.style.background = !isInfo ? "#CCFBF1" : "transparent";

    if (pInfo) pInfo.style.display = isInfo ? "" : "none";
    if (pEmps) pEmps.style.display = !isInfo ? "" : "none";
  }

  function closePSDetailDrawer() {
    _psHideDrawer("ps-detail-drawer");
  }

  // ═══════════════════════════════════════════════════════════════
  // §HR-PS-DELETE  تأكيد الحذف
  // ═══════════════════════════════════════════════════════════════

  function confirmDeletePS(id) {
    var s = _PS.all.find(function (x) {
      return String(x.id) === String(id);
    });
    if (!s) return;

    if (s.executions > 0) {
      openHRDrawer({
        title: "لا يمكن حذف هذه المرحلة",
        subtitle: "المرحلة مرتبطة بتنفيذات مسجلة",
        icon: "ti-alert-triangle",
        color: "amber",
        body:
          '<div style="padding:8px 0">' +
          '<p style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px">' +
          I18N.t("HR_STAGE") +
          " <strong>" +
          esc(s.name) +
          "</strong> ' + I18N.t('HR_LINKED_TO') + ' <strong>" +
          NumberEngine.decimal((s.executions || 0), 0) +
          "</strong> عملية تنفيذ." +
          "<br>' + I18N.t('HR_CANNOT_DELETE_DATA_INTEGRITY') + ' <strong>' + I18N.t('HR_SUSPENDED_F') + '</strong> ' + I18N.t('HR_INSTEAD_OF_THAT') + '</p>" +
          '<div style="display:flex;gap:8px">' +
          '<button class="btn btn-primary" onclick="_closeHRDrawer();openPSFormDrawer(\'' +
          id +
          '\')"><i class="ti ti-edit"></i> ' +
          I18N.t("HR_EDIT_STATUS") +
          "</button>" +
          '<button class="btn btn-outline" onclick="_closeHRDrawer()">' +
          I18N.t("BTN_CLOSE") +
          "</button></div>" +
          "</div>",
      });
      return;
    }

    openHRDrawer({
      title: "تأكيد الحذف",
      subtitle: "هل أنت متأكد من حذف هذه المرحلة؟",
      icon: "ti-trash",
      color: "rose",
      body:
        '<div style="padding:8px 0">' +
        '<p style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px">' +
        I18N.t("HR_STAGE_WILL_BE_DELETED") +
        " <strong>" +
        esc(s.name) +
        "</strong> ' + I18N.t('HR_PERMANENTLY_NO_UNDO') + '</p>" +
        '<div style="display:flex;gap:8px">' +
        '<button class="btn" style="background:#ef4444;color:#fff;border-color:#ef4444" onclick="_psDoDelete(\'' +
        id +
        '\')"><i class="ti ti-trash"></i> ' +
        I18N.t("HR_YES_DELETE") +
        "</button>" +
        '<button class="btn btn-outline" onclick="_closeHRDrawer()">' +
        I18N.t("BTN_CANCEL") +
        "</button></div>" +
        "</div>",
    });
  }

  function _psDoDelete(id) {
    _gsr("deleteProductionStage", [id, _authArgs()[0], _authArgs()[1]], {
      label: "HR.deleteProductionStage",
      onSuccess: function (result) {
        _closeHRDrawer();
        NotificationEngine.success(result.message || "تم الحذف بنجاح");
        _psLoadData();
      },
      onError: function (result) {
        _closeHRDrawer();
        NotificationEngine.error(result.message || "حدث خطأ");
      },
    });
  }

  // ═══════════════════════════════════════════════════════════════
  // §HR-PS-HELPERS  مساعدات داخلية
  // ═══════════════════════════════════════════════════════════════

  function _psShowDrawer(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.display = "block";
    requestAnimationFrame(function () {
      var drawer = el.querySelector(".hr-drawer");
      if (drawer) {
        drawer.style.transition = "transform .25s ease";
        drawer.style.transform = "translateX(0)";
      }
    });
  }

  function _psHideDrawer(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.display = "none";
  }

  function _psInfoCard(num, label, color, sensitive) {
    return (
      '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">' +
      '<div class="' +
      (sensitive ? "sensitive-balance" : "") +
      '" style="font-size:20px;font-weight:700;color:' +
      color +
      '">' +
      num +
      "</div>" +
      '<div style="font-size:11px;color:var(--text3);margin-top:3px">' +
      label +
      "</div></div>"
    );
  }

  function _psDetailItem(label, val) {
    return (
      '<div><div style="font-size:11px;font-weight:500;color:var(--text3);margin-bottom:3px">' +
      label +
      "</div>" +
      '<div style="font-size:13.5px;font-weight:500;color:var(--text)">' +
      val +
      "</div></div>"
    );
  }

  function _psVal(id) {
    var el = document.getElementById(id);
    return el ? el.value : "";
  }
  function _psSetVal(id, v) {
    var el = document.getElementById(id);
    if (el) el.value = v || "";
  }
  function _psSetText(id, v) {
    var el = document.getElementById(id);
    if (el) el.textContent = v || "";
  }

  // ── CSS إضافي لشاشة مراحل الإنتاج ──
  (function () {
    if (document.getElementById("ps-extra-css")) return;
    var s = document.createElement("style");
    s.id = "ps-extra-css";
    s.textContent = [
      ".form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}",
      ".form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}",
      "@media(max-width:600px){.form-row-2,.form-row-3{grid-template-columns:1fr}}",
    ].join("");
    document.head.appendChild(s);
  })();

</script>
