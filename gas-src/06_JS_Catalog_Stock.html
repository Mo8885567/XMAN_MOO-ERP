<script>
  // ───────────────────────────────────────────────────────────────
  // JS_Catalog_Stock.html — جزء 6/10 من JavaScript.html الأصلي
  // النطاق الأصلي: سطر 15051–18438 | بيان القص + دليل الأكواد + المخزن الحالي + أرصدة أول المدة + المخازن
  // ───────────────────────────────────────────────────────────────

  // بيان القص — Cutting Statement Logic
  // ─────────────────────────────────────────────────────────────

  function bindCuttingStatement() {
    // ── مساعد: بناء صف لون في الجدول ─────────────────────────
    function csColorRow(idx, colorName, theri, kasr, devo) {
      colorName = colorName || "";
      theri = theri || 0;
      kasr = kasr || 0;
      devo = devo || 0;
      var net = Math.max(0, Number(theri) + Number(kasr) - Number(devo));
      return (
        "<tr>" +
        '<td style="text-align:center;padding:5px 6px;font-size:12px;color:var(--text3);font-weight:600">' +
        idx +
        "</td>" +
        '<td style="padding:5px 6px">' +
        '<input class="input cs-color-name" type="text" value="' +
        esc(colorName) +
        '" placeholder="اسم اللون" style="width:100%;padding:4px 8px;font-size:13px"></td>' +
        '<td style="padding:5px 6px;width:88px">' +
        '<input class="input cs-theri" type="number" min="0" step="0.5" value="' +
        theri +
        '" style="width:75px;padding:4px 8px;text-align:center;font-size:13px"></td>' +
        '<td style="padding:5px 6px;width:88px">' +
        '<input class="input cs-kasr" type="number" min="0" step="0.5" value="' +
        kasr +
        '" style="width:75px;padding:4px 8px;text-align:center;font-size:13px"></td>' +
        '<td style="padding:5px 6px;width:88px">' +
        '<input class="input cs-devo" type="number" min="0" step="0.1" value="' +
        devo +
        '" style="width:75px;padding:4px 8px;text-align:center;font-size:13px"></td>' +
        '<td style="padding:5px 6px;width:80px;text-align:center">' +
        '<span class="cs-row-net" style="font-weight:700;font-size:14px;color:var(--success)">' +
        NumberEngine.decimal(net, net % 1 ? 2 : 0) +
        "</span></td>" +
        '<td style="padding:5px 6px;width:36px;text-align:center">' +
        '<button type="button" onclick="window._csDel(this)" ' +
        'style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:16px"></button>' +
        "</td></tr>"
      );
    }

    // ── إعادة حساب الإجماليات ────────────────────────────────
    function recalcCS() {
      var totTheri = 0,
        totKasr = 0,
        totDevo = 0,
        totNet = 0;
      var idx = 1;
      document
        .querySelectorAll("#cs-colors-tbody tr:not(#cs-colors-empty)")
        .forEach(function (tr) {
          var t = parseFloat(tr.querySelector(".cs-theri").value) || 0;
          var k = parseFloat(tr.querySelector(".cs-kasr").value) || 0;
          var d = parseFloat(tr.querySelector(".cs-devo").value) || 0;
          var net = Math.max(0, t + k - d);
          totTheri += t;
          totKasr += k;
          totDevo += d;
          totNet += net;
          var netEl = tr.querySelector(".cs-row-net");
          if (netEl) netEl.textContent = net % 1 ? net.toFixed(0) : net;
          // رقم الصف
          var numEl = tr.querySelector("td:first-child");
          if (numEl) numEl.textContent = idx++;
        });

      // Footer totals
      var fmt = function (v) {
        return v % 1 ? v.toFixed(0) : v;
      };
      var el = function (id) {
        return document.getElementById(id);
      };
      if (el("cs-total-theri"))
        el("cs-total-theri").textContent = fmt(totTheri);
      if (el("cs-total-kasr")) el("cs-total-kasr").textContent = fmt(totKasr);
      if (el("cs-total-devo")) el("cs-total-devo").textContent = fmt(totDevo);
      if (el("cs-total-all")) el("cs-total-all").textContent = fmt(totNet);

      // Summary cards
      var totCut = totTheri + totKasr;
      if (el("cs-sum-cut")) el("cs-sum-cut").textContent = fmt(totCut);
      if (el("cs-sum-devo")) el("cs-sum-devo").textContent = fmt(totDevo);
      if (el("cs-sum-net")) el("cs-sum-net").textContent = fmt(totNet);
    }

    // ── إعادة حساب المتراج ──────────────────────────────────
    function recalcMeters() {
      var total =
        (parseFloat(document.getElementById("cs-m-leather").value) || 0) +
        (parseFloat(document.getElementById("cs-m-lining").value) || 0) +
        (parseFloat(document.getElementById("cs-m-interlining").value) || 0) +
        (parseFloat(document.getElementById("cs-m-sleeve").value) || 0);
      var el = document.getElementById("cs-meters-total");
      if (el) el.textContent = NumberEngine.decimal(total, 0) + " م";
    }

    // ── ربط أحداث جدول الألوان (تفويض) ─────────────────────
    var tbody = document.getElementById("cs-colors-tbody");
    if (tbody) {
      tbody.addEventListener("input", function (e) {
        if (
          e.target.classList.contains("cs-theri") ||
          e.target.classList.contains("cs-kasr") ||
          e.target.classList.contains("cs-devo")
        ) {
          recalcCS();
        }
      });
    }

    // ── أحداث المتراج ────────────────────────────────────────
    document.querySelectorAll(".cs-meter-input").forEach(function (inp) {
      inp.addEventListener("input", recalcMeters);
    });

    // ── زر إضافة لون ────────────────────────────────────────
    var addBtn = document.getElementById("cs-add-color-btn");
    if (addBtn) {
      addBtn.addEventListener("click", function () {
        var tb = document.getElementById("cs-colors-tbody");
        var empty = document.getElementById("cs-colors-empty");
        if (empty) empty.remove();
        var rows = tb.querySelectorAll("tr:not(#cs-colors-empty)");
        var tr = document.createElement("tr");
        tr.innerHTML = csColorRow(rows.length + 1, "", 0, 0, 0).replace(
          "<tr>",
          "",
        );
        // csColorRow returns full <tr>...</tr> — insert as inner
        var tmp = document.createElement("tbody");
        tmp.innerHTML = csColorRow(rows.length + 1, "", 0, 0, 0);
        tb.appendChild(tmp.firstChild);
        recalcCS();
        var inp = tb.lastChild && tb.lastChild.querySelector(".cs-color-name");
        if (inp) inp.focus();
      });
    }

    // ── دالة حذف صف (عالمية) ────────────────────────────────
    window._csDel = function (btn) {
      var tb = document.getElementById("cs-colors-tbody");
      btn.closest("tr").remove();
      if (!tb.querySelector("tr:not(#cs-colors-empty)")) {
        var empty = document.createElement("tr");
        empty.id = "cs-colors-empty";
        empty.innerHTML =
          '<td colspan="7" style="text-align:center;padding:24px;color:var(--text3)">لا توجد ألوان — اضغط "+ إضافة لون"</td>';
        tb.appendChild(empty);
      }
      recalcCS();
    };

    // ── بناء جدول توزيع الكميات الفعلية (لون × مقاس) ───────────
    function buildCsQtyTable(colorRows, sizesArr, savedQty) {
      // colorRows: [{name, hex}]  sizesArr: ['L','XL',...]
      // savedQty: { "colorName": { "size": qty } }
      var wrap = document.getElementById("cs-qty-table-wrap");
      if (!wrap) return;

      if (!sizesArr || !sizesArr.length || !colorRows || !colorRows.length) {
        wrap.innerHTML =
          '<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">' +
          '<i class="ti ti-info-circle" style="margin-left:4px"></i>لا توجد مقاسات محددة لهذا الأمر</div>';
        return;
      }

      // رأس الجدول — نفس شكل شاشة إنشاء الأمر
      var headerCells =
        '<th style="padding:8px 10px;font-size:11px;font-weight:600;color:var(--text2);text-align:right;min-width:100px">اللون \\ المقاس</th>' +
        sizesArr
          .map(function (s) {
            return (
              '<th style="padding:6px 10px;text-align:center;min-width:72px;background:var(--accent-soft,rgba(37,99,235,.1));color:var(--accent);font-size:12px;font-weight:700">' +
              '<span style="display:block;padding:3px 8px;background:var(--accent);color:#fff;border-radius:8px;font-size:11px">' +
              esc(s) +
              "</span></th>"
            );
          })
          .join("") +
        '<th style="padding:6px 10px;text-align:center;min-width:64px;font-size:11px;font-weight:600;color:var(--text3)">المجموع</th>';

      // صفوف الألوان مع inputs
      var bodyRows = colorRows
        .map(function (clr) {
          var colorDot = clr.hex
            ? '<span style="display:inline-block;width:13px;height:13px;border-radius:50%;background:' +
              esc(clr.hex) +
              ';border:1.5px solid rgba(0,0,0,.18);margin-left:6px;flex-shrink:0;vertical-align:middle"></span>'
            : '<span style="display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--border);border:1.5px solid rgba(0,0,0,.1);margin-left:6px;flex-shrink:0;vertical-align:middle"></span>';

          var cells = sizesArr
            .map(function (sz) {
              var saved =
                savedQty && savedQty[clr.name]
                  ? parseInt(savedQty[clr.name][sz]) || 0
                  : 0;
              return (
                '<td style="padding:5px 4px;text-align:center">' +
                '<input type="number" min="0" step="1" value="' +
                saved +
                '" ' +
                'class="input cs-qty-input" ' +
                'data-color="' +
                esc(clr.name) +
                '" data-size="' +
                esc(sz) +
                '" ' +
                'style="width:64px;padding:5px 6px;text-align:center;font-size:13px;font-weight:600;border-radius:6px">' +
                "</td>"
              );
            })
            .join("");

          return (
            '<tr style="border-bottom:1px solid var(--border)">' +
            '<td style="padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap">' +
            '<div style="display:flex;align-items:center">' +
            colorDot +
            '<span style="color:var(--text1)">' +
            esc(clr.name) +
            "</span></div></td>" +
            cells +
            '<td id="cs-qty-row-' +
            esc(clr.name) +
            '" style="padding:7px 10px;text-align:center;font-weight:700;font-size:14px;color:var(--success)">0</td>' +
            "</tr>"
          );
        })
        .join("");

      // footer إجماليات الأعمدة
      var footCells = sizesArr
        .map(function (sz) {
          return (
            '<td id="cs-qty-col-' +
            esc(sz) +
            '" style="padding:8px 6px;text-align:center;font-weight:700;font-size:13px;color:var(--accent)">0</td>'
          );
        })
        .join("");

      wrap.innerHTML =
        '<div style="font-size:11px;color:var(--text3);margin-bottom:8px;padding:7px 10px;background:var(--surface3);border-radius:7px;display:flex;align-items:center;gap:6px">' +
        '<i class="ti ti-pencil" style="color:var(--accent)"></i>' +
        "<span>أدخل الكميات الفعلية المُقصَّة لكل لون ومقاس</span></div>" +
        '<div style="border-radius:10px;border:1px solid var(--border);overflow:auto">' +
        '<table style="width:100%;border-collapse:collapse;font-family:var(--font-main)">' +
        '<thead><tr style="background:var(--surface3);border-bottom:2px solid var(--border)">' +
        headerCells +
        "</tr></thead>" +
        "<tbody>" +
        bodyRows +
        "</tbody>" +
        '<tfoot><tr style="background:var(--surface3);border-top:2px solid var(--border)">' +
        '<td style="padding:8px 12px;font-size:12px;font-weight:700;color:var(--text2)">الإجمالي</td>' +
        footCells +
        '<td id="cs-qty-grand" style="padding:8px 10px;text-align:center;font-weight:800;font-size:15px;color:var(--success)">0</td>' +
        "</tr></tfoot>" +
        "</table></div>";

      recalcCsQty();

      // ربط الأحداث
      wrap.addEventListener("input", function (e) {
        if (e.target.classList.contains("cs-qty-input")) recalcCsQty();
      });
    }

    function recalcCsQty() {
      var rowTotals = {},
        colTotals = {},
        grand = 0;
      document.querySelectorAll(".cs-qty-input").forEach(function (inp) {
        var c = inp.dataset.color,
          s = inp.dataset.size;
        var v = parseInt(inp.value) || 0;
        rowTotals[c] = (rowTotals[c] || 0) + v;
        colTotals[s] = (colTotals[s] || 0) + v;
        grand += v;
      });
      Object.keys(rowTotals).forEach(function (c) {
        var el = document.getElementById("cs-qty-row-" + c);
        if (el) el.textContent = rowTotals[c];
      });
      Object.keys(colTotals).forEach(function (s) {
        var el = document.getElementById("cs-qty-col-" + s);
        if (el) el.textContent = colTotals[s];
      });
      var grandEl = document.getElementById("cs-qty-grand");
      if (grandEl) grandEl.textContent = grand;
    }

    // ── اختيار أمر الإنتاج: تحميل بياناته (يُستدعى من selectCuttingPO) ──
    var poSel = document.getElementById("cs-po");
    if (poSel) {
      poSel.addEventListener("change", function () {
        var poId = this.value;
        var content = document.getElementById("cs-content");
        if (!poId || !content) {
          if (content) content.style.display = "none";
          return;
        }
        var order = (APP.data.productionOrders || []).find(function (o) {
          return o.id === poId;
        });
        if (!order) return;
        content.style.display = "block";

        // ── معلومات الهيدر (تُملأ أيضاً من selectCuttingPO لكن نكررها للأمان) ──
        var it = (APP.data.items || []).find(function (i) {
          return i.id === order.product_id;
        });
        var setEl = function (id, val) {
          var e = document.getElementById(id);
          if (e) e.textContent = val || "—";
        };
        setEl("cs-product-name", it ? it.name : order.product_id);
        setEl("cs-barcode", it ? it.code || it.id : order.product_id);
        setEl("cs-patron", order.patron_number || "—");
        setEl("cs-order-date", fmtDate(order.date));

        // ── تحميل الألوان من sizes_json ─────────────────────
        var tb = document.getElementById("cs-colors-tbody");
        if (!tb) return;
        tb.innerHTML = "";

        var colors = [];
        try {
          var sizesRaw = order.sizes_json ? JSON.parse(order.sizes_json) : [];
          if (Array.isArray(sizesRaw)) {
            // صيغة قديمة: مصفوفة مباشرة
            colors = sizesRaw;
          } else if (sizesRaw && sizesRaw.colors) {
            // صيغة جديدة: { colors: [...], sizes_table: [...], sizes_labels: [...] }
            colors = sizesRaw.colors;
          }
        } catch (e) {
          colors = [];
        }

        // هل في بيانات قص محفوظة من قبل في notes؟
        var savedCut = null;
        try {
          var notesStr = String(order.notes || "").trim();
          if (notesStr.startsWith("{")) {
            savedCut = JSON.parse(notesStr);
          }
        } catch (e) {
          savedCut = null;
        }

        var savedColorsMap = {};
        if (savedCut && savedCut.colors && savedCut.colors.length) {
          savedCut.colors.forEach(function (sc) {
            savedColorsMap[sc.color] = sc;
          });
        }

        if (colors.length) {
          colors.forEach(function (c, idx) {
            var colorKey =
              c.color_name || c.color_code || c.color || c.size || "";
            var saved = savedColorsMap[colorKey] || {};
            var tmp2 = document.createElement("tbody");
            tmp2.innerHTML = csColorRow(
              idx + 1,
              colorKey,
              saved.theri || 0,
              saved.kasr || 0,
              saved.devo || 0,
            );
            tb.appendChild(tmp2.firstChild);
          });
        } else {
          // لو مفيش ألوان، صف واحد فاضي
          var tmp3 = document.createElement("tbody");
          tmp3.innerHTML = csColorRow(1, "", 0, 0, 0);
          tb.appendChild(tmp3.firstChild);
        }

        // ── المقاسات (sizes distribution table) ─────────────
        var sizesWrap = document.getElementById("cs-sizes-content");
        if (sizesWrap) {
          if (colors.length && colors[0].sizes) {
            // جمع كل المقاسات الممكنة
            var allSizes = [];
            colors.forEach(function (c) {
              if (c.sizes) {
                Object.keys(c.sizes).forEach(function (sz) {
                  if (allSizes.indexOf(sz) === -1) allSizes.push(sz);
                });
              }
            });

            var sizeTh = allSizes
              .map(function (sz) {
                return (
                  '<th style="text-align:center;min-width:50px">' +
                  esc(sz) +
                  "</th>"
                );
              })
              .join("");

            var sizeRows = colors
              .map(function (c) {
                var colorKey =
                  c.color_name || c.color_code || c.color || c.size || "—";
                var tds = allSizes
                  .map(function (sz) {
                    var qty = c.sizes ? c.sizes[sz] || 0 : 0;
                    return (
                      '<td style="text-align:center;padding:6px 8px">' +
                      (qty > 0
                        ? '<span style="font-weight:600;color:var(--accent)">' +
                          qty +
                          "</span>"
                        : '<span style="color:var(--text3)">—</span>') +
                      "</td>"
                    );
                  })
                  .join("");
                var rowTotal = allSizes.reduce(function (s, sz) {
                  return s + (c.sizes ? c.sizes[sz] || 0 : 0);
                }, 0);
                return (
                  "<tr>" +
                  '<td style="padding:6px 10px;font-weight:600">' +
                  esc(colorKey) +
                  "</td>" +
                  tds +
                  '<td style="text-align:center;padding:6px 8px;font-weight:700;color:var(--success)">' +
                  rowTotal +
                  "</td>" +
                  "</tr>"
                );
              })
              .join("");

            // صف الإجماليات
            var sizeTotals = allSizes
              .map(function (sz) {
                var t = colors.reduce(function (s, c) {
                  return s + (c.sizes ? c.sizes[sz] || 0 : 0);
                }, 0);
                return (
                  '<td style="text-align:center;padding:8px;font-weight:700">' +
                  t +
                  "</td>"
                );
              })
              .join("");
            var grandTotal = colors.reduce(function (s, c) {
              return (
                s +
                (c.sizes
                  ? Object.values(c.sizes).reduce(function (a, b) {
                      return a + b;
                    }, 0)
                  : 0)
              );
            }, 0);

            sizesWrap.innerHTML =
              '<table style="width:100%;border-collapse:collapse">' +
              "<thead>" +
              '<tr style="background:var(--bg2)">' +
              '<th style="text-align:right;padding:8px 10px;min-width:100px">اللون</th>' +
              sizeTh +
              '<th style="text-align:center;min-width:60px">المجموع</th>' +
              "</tr>" +
              "</thead>" +
              "<tbody>" +
              sizeRows +
              "</tbody>" +
              '<tfoot><tr style="background:var(--bg2);font-weight:700;border-top:2px solid var(--border)">' +
              '<td style="padding:8px 10px">الإجمالي</td>' +
              sizeTotals +
              '<td style="text-align:center;padding:8px;color:var(--success)">' +
              grandTotal +
              "</td>" +
              "</tr></tfoot>" +
              "</table>";
          } else {
            sizesWrap.textContent = "لا توجد بيانات مقاسات لهذا الأمر";
          }
        }

        // ── بناء جدول الكميات الفعلية (لون × مقاس) ────────────
        var qtyAllSizes = [];
        var qtyColorRows = [];
        if (colors.length && colors[0].sizes) {
          colors.forEach(function (c) {
            if (c.sizes)
              Object.keys(c.sizes).forEach(function (sz) {
                if (qtyAllSizes.indexOf(sz) === -1) qtyAllSizes.push(sz);
              });
          });
        }
        // جمع الألوان مع hex
        colors.forEach(function (c) {
          var colorKey =
            c.color_name || c.color_code || c.color || c.size || "";
          if (!colorKey) return;
          var hex = "";
          if (typeof CSS_COLOR_MAP !== "undefined") {
            hex =
              CSS_COLOR_MAP[colorKey] ||
              CSS_COLOR_MAP[colorKey.toLowerCase()] ||
              "";
          }
          if (
            !hex &&
            colorKey &&
            (colorKey.startsWith("#") || /^[0-9A-Fa-f]{6}$/.test(colorKey))
          ) {
            hex = colorKey.startsWith("#") ? colorKey : "#" + colorKey;
          }
          qtyColorRows.push({ name: colorKey, hex: hex });
        });
        // محاولة من colors tbody لو مفيش ألوان من sizes_json
        if (!qtyColorRows.length) {
          document
            .querySelectorAll("#cs-colors-tbody tr:not(#cs-colors-empty)")
            .forEach(function (tr) {
              var name = (tr.querySelector(".cs-color-name") || {}).value || "";
              if (name) {
                var hex =
                  typeof CSS_COLOR_MAP !== "undefined"
                    ? CSS_COLOR_MAP[name] ||
                      CSS_COLOR_MAP[name.toLowerCase()] ||
                      ""
                    : "";
                qtyColorRows.push({ name: name, hex: hex });
              }
            });
        }
        var savedQty =
          savedCut && savedCut.qty_distribution
            ? savedCut.qty_distribution
            : null;
        buildCsQtyTable(qtyColorRows, qtyAllSizes, savedQty);

        // ── تعبئة المتراج من الأمر أو من البيانات المحفوظة ──
        var getVal = function (id, val) {
          var el = document.getElementById(id);
          if (el && val > 0) el.value = Number(val).toFixed(0);
        };
        if (savedCut) {
          getVal(
            "cs-m-leather",
            savedCut.leather_actual || savedCut.fabric_actual || 0,
          );
          getVal("cs-m-lining", savedCut.lining_actual || 0);
          getVal("cs-m-interlining", savedCut.interlining_actual || 0);
          getVal("cs-m-sleeve", savedCut.sleeve_actual || 0);
          // ملاحظات
          var notesEl = document.getElementById("cs-notes");
          if (notesEl && savedCut.notes) notesEl.value = savedCut.notes;
        } else {
          getVal("cs-m-lining", order.lining_meters || 0);
          // fabric_meters → leather
          getVal("cs-m-leather", order.fabric_meters || 0);
        }

        recalcCS();
        recalcMeters();
      });
    }

    // ── زر الحفظ ─────────────────────────────────────────────
    var saveBtn = document.getElementById("cs-save-btn");
    if (saveBtn) {
      saveBtn.addEventListener("click", function () {
        var poId = document.getElementById("cs-po").value;
        if (!poId) {
          NotificationEngine.error("اختر أمر الإنتاج أولاً");
          return;
        }

        var colors = [];
        document
          .querySelectorAll("#cs-colors-tbody tr:not(#cs-colors-empty)")
          .forEach(function (tr) {
            var name = tr.querySelector(".cs-color-name").value.trim();
            var theri = parseFloat(tr.querySelector(".cs-theri").value) || 0;
            var kasr = parseFloat(tr.querySelector(".cs-kasr").value) || 0;
            var devo = parseFloat(tr.querySelector(".cs-devo").value) || 0;
            var net = Math.max(0, theri + kasr - devo);
            if (name || theri || kasr)
              colors.push({
                color: name,
                theri: theri,
                kasr: kasr,
                devo: devo,
                total: theri + kasr,
                net: net,
              });
          });

        if (!colors.length) {
          NotificationEngine.error("أضف بيانات القص لصنف واحد على الأقل");
          return;
        }

        // جمع توزيع الكميات الفعلية من جدول المقاسات
        var qtyDistribution = {};
        document.querySelectorAll(".cs-qty-input").forEach(function (inp) {
          var c = inp.dataset.color,
            s = inp.dataset.size;
          var v = parseInt(inp.value) || 0;
          if (v > 0) {
            if (!qtyDistribution[c]) qtyDistribution[c] = {};
            qtyDistribution[c][s] = v;
          }
        });

        var cuttingData = {
          type: "cutting_statement",
          colors: colors,
          total_theri: colors.reduce(function (s, c) {
            return s + c.theri;
          }, 0),
          total_kasr: colors.reduce(function (s, c) {
            return s + c.kasr;
          }, 0),
          total_devo: colors.reduce(function (s, c) {
            return s + c.devo;
          }, 0),
          total_pieces: colors.reduce(function (s, c) {
            return s + c.total;
          }, 0),
          total_net: colors.reduce(function (s, c) {
            return s + c.net;
          }, 0),
          leather_actual:
            parseFloat(document.getElementById("cs-m-leather").value) || 0,
          lining_actual:
            parseFloat(document.getElementById("cs-m-lining").value) || 0,
          interlining_actual:
            parseFloat(document.getElementById("cs-m-interlining").value) || 0,
          sleeve_actual:
            parseFloat(document.getElementById("cs-m-sleeve").value) || 0,
          notes: document.getElementById("cs-notes").value.trim(),
          qty_distribution: qtyDistribution,
          saved_at: new Date().toISOString(),
          saved_by: APP.currentUser.full_name || APP.currentUser.username || "",
        };

        // [SE-ROLLOUT] عبر SaveEngine.run بدل showSaveAnim/_gsr اليدوي —
        // نفس رسائل النجاح/الفشل بالظبط اللي كانت بترجع قبل كده.
        SaveEngine.run({
          screen: "cutting_statement",
          entity: "cutting_statement",
          recordId: poId,
          buttonId: "cs-save-btn",
          data: cuttingData,
          fn: "saveCuttingData",
          // [FIX-CUTTING-SAVE-2026-08] كان بيبعت [poId, cuttingData] بس.
          // الـ backend saveCuttingData(poId, cuttingData, callerUser,
          // sessionToken) بيعمل _checkPermission(callerUser, ..., sessionToken)
          // كأول خطوة، وهي fail-closed: من غير username بترجع "يجب تسجيل
          // الدخول أولاً" دايمًا. يعني حفظ بيان القص كان معطوب 100% —
          // كل محاولة حفظ كانت بترجع رسالة "يجب تسجيل الدخول" بغض النظر
          // عن حالة تسجيل الدخول الفعلية.
          params: [
            poId,
            cuttingData,
            APP.currentUser ? APP.currentUser.username : null,
            SESSION.token,
          ],
          savingLabel: "جاري حفظ بيان القص...",
          successMessage: " تم حفظ بيان القص بنجاح",
          onSuccess: function () {
            reloadAfterMutation(function () {
              renderPage("cutting_statement");
            });
          },
        });
      });
    }

    // ── زر الطباعة ───────────────────────────────────────────
    // [PRINT-BUG-FIX] كانت window.print() بتطبع الجزء الظاهر بس من
    // الشاشة (الجدولين هنا جوه wrapper بـ overflow:auto)، فأي صفوف
    // خارج حدود الـ Scroll كانت بتتقص من الطباعة. الحل: نقرأ الجدولين
    // كاملين من الـ DOM (مش مرتبط بالـ Scroll) ونطبعهما عبر محرك
    // الطباعة الموحّد متعدد الصفحات — كل جدول في نافذة طباعة مستقلة
    // بترتيب متتابع.
    var printBtn = document.getElementById("cs-print-btn");
    if (printBtn) {
      printBtn.addEventListener("click", function () {
        var colorsTbody = document.getElementById("cs-colors-tbody");
        var colorsTable = colorsTbody && colorsTbody.closest("table");
        var qtyWrap = document.getElementById("cs-qty-table-wrap");
        var qtyTable = qtyWrap && qtyWrap.querySelector("table");
        var printedAny = false;
        if (colorsTable) {
          ExportUtil.printElementTable(
            colorsTable,
            "بيان القص",
            "تاريخ: " + fmtDate(new Date()),
          );
          printedAny = true;
        }
        if (qtyTable) {
          setTimeout(function () {
            ExportUtil.printElementTable(
              qtyTable,
              "توزيع الكميات الفعلية (لون × مقاس)",
              "تاريخ: " + fmtDate(new Date()),
            );
          }, 200);
          printedAny = true;
        }
        if (!printedAny) {
          typeof showToast === "function" &&
            NotificationEngine.warning("لا توجد بيانات لطباعتها");
        }
      });
    }
  }

  // ─────────────────────────────────────────────────────────────
  // دليل الأكواد — Catalog
  // ─────────────────────────────────────────────────────────────

  var CATALOG_CATEGORIES = {
    M: " خامات (Materials)",
    A: " اكسسوارات (Accessories)",
    FG: " منتجات تامة (Finished Goods)",
  };

  // ── helpers ──────────────────────────────────────────────────

  function getCatalogItemStock(itemId) {
    var stock = (APP.data.stock || [])
      .filter(function (s) {
        return String(s.item_id) === String(itemId);
      })
      .reduce(function (a, s) {
        return a + Number(s.quantity || 0);
      }, 0);
    return stock + getOpeningQty(itemId);
  }

  /** كل المخازن التي يوجد فيها رصيد للصنف */
  function getCatalogItemStockByWarehouse(itemId) {
    return (APP.data.stock || [])
      .filter(function (s) {
        return (
          String(s.item_id) === String(itemId) && Number(s.quantity || 0) > 0
        );
      })
      .map(function (s) {
        var wh = (APP.data.warehouses || []).find(function (w) {
          return w.id === s.warehouse;
        });
        return {
          name: wh ? wh.name : s.warehouse,
          qty: Number(s.quantity || 0),
        };
      });
  }

  function stockStatusBadge(item) {
    var qty = getCatalogItemStock(item.id);
    var minQ = Number(item.min_qty || 0);
    if (qty <= 0)
      return {
        badge: '<span class="badge badge-danger">نفد</span>',
        cls: "out",
        qty: qty,
      };
    if (minQ > 0 && qty <= minQ)
      return {
        badge: '<span class="badge badge-warning">منخفض</span>',
        cls: "low",
        qty: qty,
      };
    return {
      badge: '<span class="badge badge-success">متاح</span>',
      cls: "available",
      qty: qty,
    };
  }

  function getItemPrefix(id) {
    if (!id) return "?";
    if (id.toUpperCase().startsWith("FG")) return "FG";
    return id[0].toUpperCase();
  }

  function getGroupLabel(groupId) {
    var g = (APP.data.groups || []).find(function (x) {
      return x.id === groupId;
    });
    return g ? g.name : groupId || "—";
  }

  // ── شريط إحصائيات ────────────────────────────────────────────

  function buildCatalogStats(items) {
    var total = items.length,
      available = 0,
      low = 0,
      out = 0;
    items.forEach(function (it) {
      var c = stockStatusBadge(it).cls;
      if (c === "available") available++;
      else if (c === "low") low++;
      else out++;
    });

    return (
      '<div class="stat-grid" style="margin-bottom:0">' +
      statCard(
        iconBadge("ti-package", "var(--accent-soft)", "var(--primary)"),
        "إجمالي",
        total,
        "صنف",
        "",
      ) +
      statCard(
        iconBadge("ti-circle-check", "var(--success-soft)", "var(--success)"),
        "متاح",
        available,
        "صنف",
        "",
      ) +
      statCard(
        iconBadge("ti-alert-triangle", "var(--warning-soft)", "var(--warning)"),
        "منخفض",
        low,
        "صنف",
        "",
      ) +
      statCard(
        iconBadge("ti-circle-x", "var(--danger-soft)", "var(--danger)"),
        "نفد",
        out,
        "صنف",
        "",
      ) +
      "</div>"
    );
  }

  // ── mini warehouse pills داخل الكرت/الصف ────────────────────

  function buildWhPills(itemId, unit) {
    var rows = getCatalogItemStockByWarehouse(itemId);
    if (!rows.length)
      return '<span style="font-size:11px;color:var(--text3)">—</span>';
    return rows
      .map(function (r) {
        return (
          '<span style="display:inline-flex;align-items:center;gap:3px;background:var(--accent-soft);' +
          'color:var(--accent);border-radius:50px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap">' +
          esc(r.name) +
          ' <b style="color:var(--text)">' +
          r.qty +
          '</b><span style="font-weight:400;color:var(--text3)">' +
          esc(unit || "") +
          "</span>" +
          "</span>"
        );
      })
      .join(" ");
  }

  // ── عرض الجدول عبر ColumnEngine ─────────────────────────────────────
  // [COLUMN-ENGINE] ثاني شاشة تُطبَّق عليها Dynamic Columns بعد أوامر
  // الشراء (22_JS_PurchaseOrders.html). راجع
  // COLUMN_ENGINE_MIGRATION.md لتفاصيل القرارات والتقدّم.
  //
  // ملاحظة تصميم: buildCatalogTable القديمة كانت تعرض جدول منفصل لكل
  // مجموعة (Category) بعنوان وعدّاد خاص بها. ColumnEngine.renderTable
  // يبني جدولاً واحدًا مسطّحًا (Toolbar/تخصيص واحد للشاشة كلها، مش لكل
  // مجموعة) — فالمجموعة أصبحت عمودًا عاديًا قابلاً للفرز والبحث بدل
  // التقسيم البصري لصناديق منفصلة. هذا الفارق مذكور في ملف التوثيق
  // كنقطة تحتاج موافقتك.

    if (_catalogColumnsRegistered) return;
    _catalogColumnsRegistered = true;
    ColumnEngine.register(
      "catalog_items",
      [
        {
          key: "id",
          label: "الكود",
          type: "text",
          width: 100,
          frozen: "right",
          format: function (v) {
            return (
              '<span class="mono" style="font-weight:700;color:var(--accent);font-size:13px">' +
              esc(v || "") +
              "</span>"
            );
          },
        },
        {
          key: "image_url",
          label: "",
          type: "custom",
          width: 58,
          sortable: false,
          filterable: false,
          searchable: false,
          exportable: false,
          printable: false,
          format: function (v, row) {
            return v
              ? '<div class="cat-thumb-wrap" onclick="event.stopPropagation();openImageLightbox(\'' +
                  esc(v) +
                  "','" +
                  esc(row.name || "") +
                  '\')"><img src="' +
                  esc(v) +
                  '" class="cat-thumb" onerror="this.parentElement.innerHTML=\'<div class=cat-thumb-ph></div>\'">' +
                  '<div class="cat-thumb-overlay"></div></div>'
              : '<div class="cat-thumb-ph"></div>';
          },
        },
        {
          key: "name",
          label: "الاسم",
          type: "text",
          width: 240,
          format: function (v, row) {
            return (
              '<div style="font-weight:600;font-size:13px">' +
              esc(v || "") +
              "</div>" +
              (row.description
                ? '<div style="font-size:11px;color:var(--text3);margin-top:1px">' +
                  esc(row.description) +
                  "</div>"
                : "")
            );
          },
        },
        {
          key: "group",
          label: "المجموعة",
          type: "text",
          width: 130,
          format: function (v) {
            return esc(getGroupLabel(v));
          },
        },
        {
          key: "unit",
          label: "الوحدة",
          type: "text",
          width: 80,
          align: "center",
          format: function (v) {
            return (
              '<span style="display:block;text-align:center">' +
              esc(v || "—") +
              "</span>"
            );
          },
        },
        {
          key: "stock_qty",
          label: "إجمالي المخزون",
          type: "number",
          width: 140,
          format: function (v, row) {
            var qty = Number(v || 0);
            var minQ = Number(row.min_qty || 0);
            var barPct = minQ
              ? Math.min(100, Math.round((qty / minQ) * 100))
              : qty > 0
                ? 100
                : 0;
            var barColor =
              row.stock_cls === "out"
                ? "var(--danger)"
                : row.stock_cls === "low"
                  ? "var(--warning)"
                  : "var(--success)";
            return (
              '<div style="display:flex;align-items:center;gap:6px">' +
              '<b style="font-size:13px;min-width:28px;text-align:left">' +
              qty +
              "</b>" +
              '<div style="flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;min-width:40px">' +
              '<div style="height:100%;width:' +
              barPct +
              "%;background:" +
              barColor +
              ';border-radius:3px"></div>' +
              "</div></div>"
            );
          },
        },
        {
          key: "warehouses_text",
          label: "توزيع المخازن",
          type: "text",
          width: 220,
          format: function (v, row) {
            return (
              '<div style="display:flex;flex-wrap:wrap;gap:3px">' +
              buildWhPills(row.id, row.unit) +
              "</div>"
            );
          },
          exportValue: function (row) {
            return row.warehouses_text || "";
          },
        },
        {
          key: "min_qty",
          label: "الحد الأدنى",
          type: "number",
          width: 100,
          align: "center",
          format: function (v) {
            return (
              '<span style="display:block;text-align:center;color:var(--text3)">' +
              (v || "—") +
              "</span>"
            );
          },
        },
        {
          key: "stock_status_label",
          label: "الحالة",
          type: "badge",
          width: 100,
          format: function (v, row) {
            return stockStatusBadge(row).badge;
          },
          exportValue: function (row) {
            return row.stock_status_label || "";
          },

        {

          type: "currency",

          format: function (v) {
            return v
              ? '<span class="sensitive-price" style="font-size:12px">' +
                  formatMoney(v, { decimals: 0 }) +
                  "</span>"
              : "—";
          },
        },
        // ── أعمدة ذكية: مخفية افتراضيًا (بند "Smart Columns") ──
        {
          key: "selling_price",
          label: "سعر البيع",
          type: "currency",
          category: "حقول إضافية",
          defaultVisible: false,
          format: function (v) {
            return v
              ? '<span class="sensitive-price">' +
                  formatMoney(v, { decimals: 0 }) +
                  "</span>"
              : "—";
          },

        {
          key: "code",
          label: "كود إضافي (SKU)",
          type: "text",
          category: "حقول إضافية",
          defaultVisible: false,
        },
        {
          key: "description",
          label: "الوصف",
          type: "text",
          width: 220,
          category: "حقول إضافية",
          defaultVisible: false,
        },
        {
          key: "created_at",
          label: "تاريخ الإنشاء",
          type: "date",
          width: 110,
          category: "حقول إضافية",
          defaultVisible: false,

      {

  // يضيف للحقول المحسوبة (المخزون/الحالة/توزيع المخازن) لأن هذه القيم
  // مش أعمدة خام في الـ item نفسه — لازم تُحسب مرة واحدة قبل ما تتبعت
  // لـ ColumnEngine، عشان الفرز/البحث/التصدير كلهم بيشتغلوا على
  // row[key] مباشرة (مش عبر format).
  function _catPrepareRowsForCE(items) {
    return items.map(function (it) {
      var ss = stockStatusBadge(it);
      var whRows = getCatalogItemStockByWarehouse(it.id);
      return Object.assign({}, it, {
        stock_qty: ss.qty,
        stock_cls: ss.cls,
        stock_status_label:
          ss.cls === "out" ? "نفد" : ss.cls === "low" ? "منخفض" : "متاح",
        warehouses_text: whRows
          .map(function (r) {
            return r.name + ":" + r.qty;
          })
          .join(" | "),
      });
    });
  }

  function _catRenderTableCE(container, items) {
    _catalogRegisterColumns();
    ColumnEngine.renderTable(
      "catalog_items",
      container,
      _catPrepareRowsForCE(items),
      {
        onRowClick: function (row) {
          openCatalogItemModal(row.id);
        },
      },
    );
  }

  // ── عرض الكروت (محسّن) ───────────────────────────────────────

  function buildCatalogCards(items) {
    if (!items.length)
      return '<div class="card"><div class="empty-state"><div class="empty-icon"></div><p>لا توجد نتائج</p></div></div>';

    var cards = items
      .map(function (it) {
        var ss = stockStatusBadge(it);
        var barPct = it.min_qty
          ? Math.min(100, Math.round((ss.qty / Number(it.min_qty)) * 100))
          : ss.qty > 0
            ? 100
            : 0;
        var barColor =
          ss.cls === "out"
            ? "var(--danger)"
            : ss.cls === "low"
              ? "var(--warning)"
              : "var(--success)";
        var whRows = getCatalogItemStockByWarehouse(it.id);

        // صورة الكرت مع زر عرض بالكامل
        var imgHtml = it.image_url
          ? '<div class="cat-card-img-wrap">' +
            '<img src="' +
            esc(it.image_url) +
            '" class="cat-card-img" onerror="this.parentElement.innerHTML=\'<div class=cat-card-img-ph></div>\'">' +
            '<button class="cat-card-img-zoom" onclick="event.stopPropagation();openImageLightbox(\'' +
            esc(it.image_url) +
            "','" +
            esc(it.name || "") +
            '\')" title="عرض الصورة بالكامل"> عرض</button>' +
            "</div>"
          : '<div class="cat-card-img-ph"></div>';

        // أعمدة المخازن داخل الكرت
        var whHtml = whRows.length
          ? '<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px">' +
            whRows
              .map(function (r) {
                return (
                  '<span style="background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:10px;color:var(--text2)">' +
                  '<b style="color:var(--accent)">' +
                  r.qty +
                  "</b> " +
                  esc(it.unit || "") +
                  " · " +
                  esc(r.name) +
                  "</span>"
                );
              })
              .join("") +
            "</div>"
          : "";

        return (
          '<div class="catalog-card cat-card" onclick="openCatalogItemModal(\'' +
          esc(it.id) +
          "')\">" +
          imgHtml +
          '<div class="cat-card-body">' +
          // كود + حالة
          '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin-bottom:4px">' +
          '<span class="mono" style="font-size:11px;font-weight:700;color:var(--accent)">' +
          esc(it.id || "") +
          "</span>" +
          ss.badge +
          "</div>" +
          // اسم
          '<div style="font-weight:700;font-size:13px;line-height:1.35;margin-bottom:3px">' +
          esc(it.name || "") +
          "</div>" +
          // مجموعة + وحدة
          '<div style="font-size:11px;color:var(--text3);margin-bottom:8px">' +
          esc(getGroupLabel(it.group)) +
          " · " +
          esc(it.unit || "") +
          "</div>" +
          // إجمالي المخزون + بار
          '<div style="margin-bottom:4px">' +
          '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">' +
          '<span style="color:var(--text3)">إجمالي المخزون</span>' +
          '<span style="font-weight:800;color:var(--text)">' +
          ss.qty +
          "</span>" +
          "</div>" +
          '<div style="height:5px;background:var(--surface3);border-radius:3px;overflow:hidden">' +
          '<div style="height:100%;width:' +
          barPct +
          "%;background:" +
          barColor +
          ';border-radius:3px;transition:width .8s ease"></div>' +
          "</div>" +
          "</div>" +
          // توزيع المخازن
          whHtml +
          "</div>" +
          "</div>"
        );
      })
      .join("");

    return '<div class="cat-grid">' + cards + "</div>";
  }

  // ── Lightbox (عرض الصورة بالكامل) ────────────────────────────

  function openImageLightbox(url, title) {
    openModal(
      '<div class="modal-box" style="width:600px;max-width:92vw;background:transparent;box-shadow:none;padding:0;overflow:visible">' +
        '<div style="position:relative;width:100%;height:500px;max-height:80vh;background:#111;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-xl)">' +

            it.id || "",
            it.name || "",
            getGroupLabel(it.group),
            it.unit || "",
            ss.qty,
            whList,
            it.min_qty || 0,
            status,
            it.cost_price || 0,
            it.selling_price || 0,
            totalCost.toFixed(0),
            it.description || "",
          ];
        });
        return { headers: headers, rows: rows };
      };
      var csDD = ExportUtil.createDropdown({
        getData: _getCsData,
        filename: "مخزون_حالي_" + new Date().toISOString().slice(0, 10),
        title: "تقرير المخزون الحالي",
        subtitle: "تاريخ التقرير: " + fmtDate(new Date()),
        sheetName: "المخزون",
      });
      csExportWrap.appendChild(csDD);
    }
  }

  // ── فلترة الأصناف ────────────────────────────────────────────
  function _csGetFiltered() {
    var q = ((document.getElementById("cs-search") || {}).value || "")
      .toLowerCase()
      .trim();
    var gId = (document.getElementById("cs-filter-group") || {}).value || "";
    var stock = (document.getElementById("cs-filter-stock") || {}).value || "";
    var color = (document.getElementById("cs-filter-color") || {}).value || "";
    var whId =
      (document.getElementById("cs-filter-warehouse") || {}).value || "";
    return (APP.data.items || []).filter(function (it) {
      var matchQ =
        !q ||
        (it.id || "").toLowerCase().includes(q) ||
        (it.name || "").toLowerCase().includes(q) ||
        (it.description || "").toLowerCase().includes(q) ||
        getGroupLabel(it.group).toLowerCase().includes(q);
      var matchG = !gId || it.group === gId;
      var matchS = !stock || stockStatusBadge(it).cls === stock;
      var matchC =
        !color ||
        (function () {
          var clrs = getItemColors(it.id);
          return clrs.some(function (c) {
            return (typeof c === "object" ? c.name || "" : String(c)) === color;
          });
        })();
      var matchWH =
        !whId ||
        (function () {
          // أولاً: هل مجموعة الصنف مرتبطة بهذا المخزن؟ (السلوك الأصلي)
          var grp = (APP.data.groups || []).find(function (g) {
            return g.id === it.group;
          });
          if (grp && String(grp.warehouse_id) === String(whId)) return true;

          // ثانياً: هل للصنف رصيد فعلي في هذا المخزن؟ (يظهر بعد التحويل)
          var wh = (APP.data.warehouses || []).find(function (w) {
            return w.id === whId;
          });
          if (!wh) return false;
          return (APP.data.stock || []).some(function (s) {
            return (
              String(s.item_id) === String(it.id) &&
              s.warehouse === wh.name &&
              Number(s.quantity || 0) > 0
            );
          });
        })();
      return matchQ && matchG && matchS && matchC && matchWH;
    });
  }

  // ── تحديث الإحصائيات ─────────────────────────────────────────
  function _csUpdateStats(items) {
    // pills شريط
    var statsBar = document.getElementById("cs-stats-bar");
    if (statsBar) statsBar.innerHTML = buildCatalogStats(items);

    // بطاقات كبيرة
    var cardsEl = document.getElementById("cs-stat-cards");
    if (!cardsEl) return;
    var total = items.length,
      avail = 0,
      low = 0,
      out = 0,
      totalCost = 0;
    items.forEach(function (it) {
      var ss = stockStatusBadge(it);
      if (ss.cls === "available") avail++;
      else if (ss.cls === "low") low++;
      else out++;
      totalCost += ss.qty * Number(it.cost_price || 0);
    });
    cardsEl.innerHTML =
      statCard("", "مخزون طبيعي", avail, "صنف", "var(--success-soft)") +
      statCard(
        "",
        "تحت الحد الأدنى",
        low + out,
        "صنف",
        "var(--warning-soft,#fff7e6)",
      ) +
      statCard(
        "",
        "قيمة المخزون",
        '<span class="sensitive-balance">' +
          formatMoney(totalCost, { decimals: 0, withSymbol: false }) +
          "</span>",
        "جنيه",
        "var(--accent-soft)",
      ) +
      statCard(
        "",
        "إجمالي الأصناف",
        total,
        "صنف",
        "var(--teal-soft,#e0f7f4)",

  // ── pills توزيع الألوان لكل صنف ──────────────────────────────
  function _csColorPills(item) {
    var colors = getItemColors(item.id);
    if (!colors.length) {
      return '<span style="font-size:11px;color:var(--text3)">بدون ألوان</span>';
    }
    var minQ = Number(item.min_qty || 0);
    return (
      '<div style="display:flex;flex-wrap:wrap;gap:4px">' +
      colors
        .map(function (c) {
          var colorName = typeof c === "object" ? c.name || "" : String(c);
          var colorCode =
            typeof c === "object" && c.code && c.code.trim()
              ? c.code.trim().toUpperCase()
              : colorName.replace(/\s+/g, "").substring(0, 3).toUpperCase();
          var qty = getColorQty(item.id, colorName);
          var bg =
            qty <= 0
              ? "var(--danger-soft,#ffeaea)"
              : minQ > 0 && qty <= minQ
                ? "var(--warning-soft,#fff7e0)"
                : "var(--success-soft,#e6f9ee)";
          var clr =
            qty <= 0
              ? "var(--danger)"
              : minQ > 0 && qty <= minQ
                ? "var(--orange,#f97316)"
                : "var(--success)";
          // ── لون الدائرة ──
          var dotHex = (function () {
            if (typeof c === "object" && c.hex && c.hex.trim())
              return c.hex.trim();
            if (CSS_COLOR_MAP[colorName]) return CSS_COLOR_MAP[colorName];
            if (CSS_COLOR_MAP[(colorName || "").toLowerCase()])
              return CSS_COLOR_MAP[(colorName || "").toLowerCase()];
            var norm = _normalizeColor(colorName);
            var keys = Object.keys(CSS_COLOR_MAP);
            for (var _ki = 0; _ki < keys.length; _ki++) {
              if (_normalizeColor(keys[_ki]) === norm)
                return CSS_COLOR_MAP[keys[_ki]];
            }
            return "#94a3b8";
          })();
          var lightColors = [
            "#ffffff",
            "#f8fafc",
            "#f5f5f5",
            "#f5f0e8",
            "#fffdd0",
            "#e6e6fa",
            "#fce7f3",
            "#f9a8d4",
            "#f7e7ce",
          ];
          var dotBorder =
            lightColors.indexOf(dotHex.toLowerCase()) !== -1
              ? "#9ca3af"
              : dotHex;
          return (
            '<span style="display:inline-flex;align-items:center;gap:5px;background:' +
            bg +
            ";" +
            "border:1px solid " +
            clr +
            ';border-radius:50px;padding:2px 7px;font-size:11px;white-space:nowrap">' +
            '<span style="width:7px;height:7px;border-radius:50%;background:' +
            dotHex +
            ";border:1.5px solid " +
            dotBorder +
            ';display:inline-block;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.2)"></span>' +
            '<span style="font-weight:600;color:var(--text2)">' +
            esc(colorCode) +
            "</span>" +
            '<span style="color:var(--text3)">·</span>' +
            '<b style="color:' +
            clr +
            '">' +
            qty +
            "</b>" +
            "</span>"
          );
        })
        .join("") +
      "</div>"
    );
  }

  // ── الجدول الموسّع عبر ColumnEngine (دمج catalog + stock) ────────
  // [COLUMN-ENGINE] ثالث شاشة (بعد أوامر الشراء وكتالوج الأصناف).
  // ملاحظة تصميم مهمة: الجدول القديم (_csBuildMergedTable تحت) كان
  // فيه صف تفصيلي قابل للطي (Expand/Collapse) يعرض رصيد كل لون في كل
  // مخزن. ColumnEngine (زي أي جدول ERP قياسي) بيعرض صف واحد لكل عنصر
  // مش صف Expand مضمّن. القرار: عمود "توزيع الألوان والأرصدة" بقى ملخّص
  // (Pills) بنفس شكل العرض القديم، والتفاصيل الكاملة (رصيد كل لون في كل
  // مخزن + رصيد أول مدة) لسه موجودة بالكامل — بس في Modal الصنف
  // (openCatalogItemModal) اللي أصلاً بيفتح بنفس الضغطة على الصف
  // (onRowClick) وكان بيحتوي على نفس التفاصيل بالظبط. مفيش أي بيانات
  // اتفقدت، بس التفصيل بقى في نافذة بدل صف موسّع.
  // ── دعم "المخزن النشط" (Active Warehouse Filter) داخل ColumnEngine ──
  // [COLUMN-ENGINE] نُقلت هذه الدوال من 07_JS_Shipping_Colors_Excel.html
  // (كانت override منفصل لدوال قديمة اتشالت من مسار العرض الفعلي).
  // القرار المعماري: عمود "توزيع الألوان والأرصدة" والحالة والرصيد في
  // تعريف stock_current الواحد بقوا حساسين لسياق المخزن المختار من
  // فلتر cs-filter-warehouse، بدل تكرار تعريف الجدول كامل في ملف تاني.
  function _csGetActiveWarehouseName() {
    var whId =
      (document.getElementById("cs-filter-warehouse") || {}).value || "";
    if (!whId) return "";
    var wh = (APP.data.warehouses || []).find(function (w) {
      return w.id === whId;
    });
    return wh ? wh.name : "";
  }

  /**
   * إجمالي رصيد صنف في مخزن محدد (من شيت Stock فقط)
   * لو whName فارغ → يرجع الرصيد الكلي من كل المخازن (getCatalogItemStock)
   */
  function getCatalogItemStockFiltered(itemId, whName) {
    if (!whName) return getCatalogItemStock(itemId);
    return (APP.data.stock || [])
      .filter(function (s) {
        return (
          String(s.item_id) === String(itemId) &&
          String(s.warehouse || "").trim() === whName.trim()
        );
      })
      .reduce(function (a, s) {
        return a + Number(s.quantity || 0);
      }, 0);
  }

  /**
   * رصيد لون محدد داخل مخزن محدد (رصيد أول مدة + حركات المخزن ده بس)
   * لو whName فارغ → يرجع رصيد اللون من كل المخازن (getColorQty)
   */
  function getColorQtyFiltered(itemId, colorName, whName) {
    if (!whName) return getColorQty(itemId, colorName);
    var idStr = String(itemId || "").trim();
    var clrStr = _normalizeColor(colorName);

    var opening = (APP.data.openingStock || [])
      .filter(function (r) {
        return (
          String(r.item_id || "").trim() === idStr &&
          _normalizeColor(r.color) === clrStr &&
          (!whName || String(r.warehouse || "").trim() === whName.trim())
        );
      })
      .reduce(function (sum, r) {
        return sum + Number(r.quantity || 0);
      }, 0);

    var txQty = (APP.data.transactions || [])
      .filter(function (t) {
        return (
          String(t.item_id || "").trim() === idStr &&
          _normalizeColor(t.color) === clrStr
        );
      })
      .reduce(function (sum, t) {
        var type = String(t.type || "").toUpperCase();
        var qty = Number(t.quantity || 0);
        var toWh = String(t.to_warehouse || "").trim();
        var fromWh = String(t.from_warehouse || "").trim();
        var wh = whName.trim();
        if (type === "IN" || type === "FG_IN" || type === "FACTORY_RETURN") {
          return toWh === wh ? sum + qty : sum;
        }
        if (type === "OUT" || type === "DISPATCH") {
          return fromWh === wh ? sum - qty : sum;
        }
        if (type === "TRANSFER") {
          if (fromWh === wh) return sum - qty;
          if (toWh === wh) return sum + qty;
        }
        return sum;
      }, 0);

    return Math.max(0, opening + txQty);
  }

  /**
   * stockStatusBadge مع دعم المخزن المُفلتر — لو whName ممرر يحسب
   * الرصيد من المخزن ده بس، غير كده بيرجع stockStatusBadge العادية
   */
  function stockStatusBadgeFiltered(item, whName) {
    if (!whName) return stockStatusBadge(item);
    var qty = getCatalogItemStockFiltered(item.id, whName);
    var minQ = Number(item.min_qty || 0);
    if (qty <= 0)
      return {
        badge: '<span class="badge badge-danger">نفد</span>',
        cls: "out",
        qty: qty,
      };
    if (minQ > 0 && qty <= minQ)
      return {
        badge: '<span class="badge badge-warning">منخفض</span>',
        cls: "low",
        qty: qty,
      };
    return {
      badge: '<span class="badge badge-success">متاح</span>',
      cls: "available",
      qty: qty,
    };
  }

  /**
   * pills الألوان — بالرصيد الفعلي للمخزن المُفلتر لو whName ممرر،
   * غير كده نفس _csColorPills العادية (كل المخازن)
   */
  function _csColorPillsFiltered(item, whName) {
    if (!whName) return _csColorPills(item);

            typeof c === "object" && c.code && c.code.trim()
              ? c.code.trim().toUpperCase()
              : colorName.replace(/\s+/g, "").substring(0, 3).toUpperCase();
          var qty = getColorQtyFiltered(item.id, colorName, whName);
          var bg =
            qty <= 0
              ? "var(--danger-soft,#ffeaea)"
              : minQ > 0 && qty <= minQ
                ? "var(--warning-soft,#fff7e0)"
                : "var(--success-soft,#e6f9ee)";
          var clr =
            qty <= 0
              ? "var(--danger)"
              : minQ > 0 && qty <= minQ
                ? "var(--orange,#f97316)"
                : "var(--success)";
          return (
            '<span style="display:inline-flex;align-items:center;gap:4px;background:' +
            bg +
            ";border:1px solid " +
            clr +
            ';border-radius:50px;padding:2px 8px;font-size:10px;white-space:nowrap">' +
            '<span style="font-weight:600;color:var(--text2)">' +
            esc(colorCode) +
            "</span>" +
            '<span style="color:var(--text3)">·</span>' +
            '<b style="color:' +
            clr +
            '">' +
            qty +
            "</b>" +
            "</span>"
          );
        })
        .join("") +
      "</div>"
    );
  }

  function _csPrepareStockRowsForCE(items, whName) {
    return items.map(function (it) {
      var ss = stockStatusBadgeFiltered(it, whName);
      var itemColors = getItemColors(it.id);
      var colorsTextParts = itemColors.map(function (c) {
        var name = typeof c === "object" ? c.name || "" : String(c);
        return name + ":" + getColorQtyFiltered(it.id, name, whName);
      });
      return Object.assign({}, it, {
        display_code: it.code || it.id,
        stock_qty: ss.qty,
        stock_cls: ss.cls,
        stock_status_label:
          ss.cls === "out" ? "نفد" : ss.cls === "low" ? "منخفض" : "متاح",
        colors_text: colorsTextParts.join(" | "),
        colors_count: itemColors.length,
        _whName: whName || "", // يُستخدَم داخل format الأعمدة (الحالة/الألوان) في نفس الصف
      });
    });
  }

  function _csdPrepareRows(items, whName) {
    var out = [];
    items.forEach(function (item) {
      var colors = getItemColors(item.id);
      var minQ = Number(item.min_qty || 0);
      if (!colors.length) {
        var qty = getCatalogItemStockFiltered(item.id, whName);
        out.push({
          row_id: String(item.id),
          _itemId: item.id,
          code: item.code || item.id,
          name: item.name || "—",
          color_name: null,
          sub_code: null,
          qty: qty,
          stock_cls: qty <= 0 ? "out" : minQ > 0 && qty <= minQ ? "low" : "ok",
          group: item.group,
        });
        return;
      }
      colors.forEach(function (c) {
        var colorName = typeof c === "object" ? c.name || "" : String(c);
        var colorCode =
          typeof c === "object" && c.code && c.code.trim()
            ? c.code.trim().toUpperCase()
            : colorName.replace(/\s+/g, "").substring(0, 3).toUpperCase();
        var subCode = (item.code || item.id) + "-" + colorCode;
        var colorQty = getColorQtyFiltered(item.id, colorName, whName);
        out.push({
          row_id: String(item.id) + "__" + colorName,
          _itemId: item.id,
          code: item.code || item.id,
          name: item.name || "—",
          color_name: colorName,
          sub_code: subCode,
          qty: colorQty,
          stock_cls:
            colorQty <= 0 ? "out" : minQ > 0 && colorQty <= minQ ? "low" : "ok",
          group: item.group,
        });
      });
    });
    return out;
  }

    _csdRegisterColumns();
    var whName = _csGetActiveWarehouseName();
    ColumnEngine.renderTable(
      "stock_color_detail",

      _csdPrepareRows(items, whName),
      {
        onRowClick: function (row) {
          openCatalogItemModal(row._itemId);
        },
      },
    );

                    esc(it.unit || "") +

  function copyCode(id) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(id).then(function () {
        NotificationEngine.success("تم نسخ: " + id);

      // [UNIFY-NOTIF] كان بينادي showToast(id, "") — نوع فارغ وبدون رسالة
      // واضحة (قيمة id بس). استبدلته بـ NotificationEngine.info برسالة صريحة.
      NotificationEngine.info("الكود: " + id);
    }
  }

  function getOpeningQty(item_id) {
    // يجمع كل الألوان للصنف الواحد
    return (APP.data.openingStock || [])
      .filter(function (r) {
        return String(r.item_id) === String(item_id);
      })
      .reduce(function (sum, r) {
        return sum + Number(r.quantity || 0);
      }, 0);
  }

  /**
   * رصيد صنف بلون محدد = OpeningStock لهذا اللون + حركات IN - حركات OUT
   * شيت Stock مفيهوش عمود color، فالرصيد بالألوان يتحسب من Transactions فقط
   */
  function getColorQty(item_id, colorName) {
    var idStr = String(item_id || "").trim();
    // إصلاح: normalize يحل مشكلة أسود/اسود/ASWAD
    var clrStr = _normalizeColor(colorName);

    var opening = (APP.data.openingStock || [])
      .filter(function (r) {
        return (
          String(r.item_id || "").trim() === idStr &&
          _normalizeColor(r.color) === clrStr
        );
      })
      .reduce(function (sum, r) {
        return sum + Number(r.quantity || 0);
      }, 0);

    var txQty = (APP.data.transactions || [])
      .filter(function (t) {
        return (
          String(t.item_id || "").trim() === idStr &&
          _normalizeColor(t.color) === clrStr
        );
      })
      .reduce(function (sum, t) {
        var type = String(t.type || "").toUpperCase();
        var qty = Number(t.quantity || 0);
        if (type === "IN" || type === "FG_IN" || type === "FACTORY_RETURN")
          return sum + qty;
        if (type === "OUT" || type === "DISPATCH") return sum - qty;
        return sum;
      }, 0);

    return Math.max(0, opening + txQty);
  }

  // (Metadata-Driven) — سجل واحد لكل صنف/لون بدل رأس مجموعة قابل للطي

  // (بند "التوافق"). إجراءات التعديل/الحذف بقت بالكامل عبر قائمة

  function _osPrepareRowsForCE(rows) {
    var itemMap = {};
    (APP.data.items || []).forEach(function (it) {
      itemMap[String(it.id)] = it;
    });
    return rows.map(function (r) {
      var item = itemMap[String(r.item_id)];
      return {
        _key: String(r.item_id || "") + "|" + (r.color || ""),
        item_id: r.item_id || "",
        item_code: item ? item.code || item.id : r.item_id || "",
        item_name: item ? item.name : "—",
        color: r.color || "",
        quantity: Number(r.quantity || 0),
        notes: r.notes || "",
        date: r.date || "",
      };
    });
  }

  function _osRenderTableCE(container, rows) {
    if (!container) return;
    _osRegisterColumns();
    ColumnEngine.renderTable(
      "opening_stock",
      container,
      _osPrepareRowsForCE(rows),
      { rowKey: "_key" },
    );
  }
