        '<span style="color:var(--text3);font-size:11px">مثال: ITM-22-059-K8 | أزرق | 55</span>' +
        "</div>" +
        '<div class="field">' +
        "<label>اختر ملف Excel أو CSV</label>" +
        '<input type="file" id="os-import-file" accept=".xlsx,.xls,.csv" class="input" style="padding:10px">' +
        "</div>" +
        '<div id="os-import-preview" style="display:none;margin-top:12px"></div>' +
        "</div>",
      footer:
        '<button class="btn btn-outline" onclick="closeStyledDrawer()">إلغاء</button>' +
        '<button class="btn btn-outline" id="os-btn-parse" style="color:var(--accent)"><i class="ti ti-search"></i> معاينة البيانات</button>' +
        '<button class="btn btn-primary" id="os-btn-confirm-import" style="display:none"><i class="ti ti-check"></i> تأكيد الاستيراد</button>',
      onReady: function () {
        var _parsedRows = [];

        document
          .getElementById("os-btn-parse")
          .addEventListener("click", function () {
            var fileInput = document.getElementById("os-import-file");
            if (!fileInput || !fileInput.files.length)
              return NotificationEngine.error("اختر ملف أولاً");
            var file = fileInput.files[0];
            var reader = new FileReader();

            reader.onload = function (e) {
              try {
                var lines = [];
                var name = file.name.toLowerCase();

                if (name.endsWith(".csv")) {
                  // CSV
                  var text = e.target.result;
                  lines = text.split(/\r?\n/).filter(function (l) {
                    return l.trim();
                  });
                  // تخطى رأس الجدول لو فيه نص
                  if (
                    lines.length &&
                    /[a-zA-Z\u0600-\u06FF]/.test(lines[0].split(",")[0]) &&
                    isNaN(Number(lines[0].split(",")[2]))
                  ) {
                    lines = lines.slice(1);
                  }
                  _parsedRows = lines
                    .map(function (l) {
                      var parts = l.split(",");
                      return {
                        code: (parts[0] || "").trim().replace(/"/g, ""),
                        color: (parts[1] || "").trim().replace(/"/g, ""),
                        qty: Number((parts[2] || "0").trim().replace(/"/g, "")),
                        notes: (parts[3] || "").trim().replace(/"/g, ""),
                      };
                    })
                    .filter(function (r) {
                      return r.code && !isNaN(r.qty);
                    });
                } else {
                  // Excel — نستخدم SheetJS
                  var data = new Uint8Array(e.target.result);
                  var workbook = XLSX.read(data, { type: "array" });
                  var sheet = workbook.Sheets[workbook.SheetNames[0]];
                  var jsonData = XLSX.utils.sheet_to_json(sheet, {
                    header: 1,
                    defval: "",
                  });
                  // تخطى رأس لو أول خلية مش كود
                  var startIdx = 0;
                  if (
                    jsonData.length &&
                    isNaN(Number(String(jsonData[0][2] || "")))
                  )
                    startIdx = 1;
                  _parsedRows = jsonData
                    .slice(startIdx)
                    .filter(function (r) {
                      return r[0];
                    })
                    .map(function (r) {
                      return {
                        code: String(r[0] || "").trim(),
                        color: String(r[1] || "").trim(),
                        qty: Number(r[2] || 0),
                        notes: String(r[3] || "").trim(),
                      };
                    })
                    .filter(function (r) {
                      return r.code && !isNaN(r.qty);
                    });
                }

                if (!_parsedRows.length)
                  return NotificationEngine.error("لم يتم العثور على بيانات صالحة في الملف");

                // معاينة
                var previewHtml =
                  '<div style="font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text2)">معاينة (' +
                  _parsedRows.length +
                  " صف):</div>" +
                  '<div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">' +
                  '<table style="width:100%;border-collapse:collapse;font-size:12px">' +
                  '<thead style="background:var(--surface2)"><tr>' +
                  '<th style="padding:6px 10px;text-align:right">كود الصنف</th>' +
                  '<th style="padding:6px 10px;text-align:right">اللون</th>' +
                  '<th style="padding:6px 10px;text-align:center">الكمية</th>' +
                  '<th style="padding:6px 10px;text-align:right">ملاحظات</th>' +
                  "</tr></thead><tbody>" +
                  _parsedRows
                    .slice(0, 20)
                    .map(function (r) {
                      var item = APP.data.items.find(function (i) {
                        return (
                          (i.code || "") === r.code || String(i.id) === r.code
                        );
                      });
                      var valid = !!item;
                      return (
                        '<tr style="border-top:1px solid var(--border);' +
                        (valid ? "" : "background:#fff0f0") +
                        '">' +
                        '<td style="padding:5px 10px"><span style="color:' +
                        (valid ? "var(--accent)" : "var(--danger)") +
                        ';font-weight:700">' +
                        esc(r.code) +
                        "</span>" +
                        (valid
                          ? ""
                          : ' <span style="color:var(--danger);font-size:10px">غير موجود</span>') +
                        "</td>" +
                        '<td style="padding:5px 10px">' +
                        esc(r.color || "—") +
                        "</td>" +
                        '<td style="padding:5px 10px;text-align:center"><b>' +
                        r.qty +
                        "</b></td>" +
                        '<td style="padding:5px 10px;font-size:11px;color:var(--text3)">' +
                        esc(r.notes || "—") +
                        "</td>" +
                        "</tr>"
                      );
                    })
                    .join("") +
                  (_parsedRows.length > 20
                    ? '<tr><td colspan="4" style="padding:6px 10px;color:var(--text3);font-size:11px;text-align:center">... و ' +
                      (_parsedRows.length - 20) +
                      " صف آخر</td></tr>"
                    : "") +
                  "</tbody></table></div>";

                var previewEl = document.getElementById("os-import-preview");
                previewEl.innerHTML = previewHtml;
                previewEl.style.display = "block";
                document.getElementById("os-btn-confirm-import").style.display =
                  "";
                NotificationEngine.success("تم تحليل " + _parsedRows.length + " صف");
              } catch (err) {
                NotificationEngine.error("خطأ في قراءة الملف: " + err.message);
              }
            };

            if (file.name.toLowerCase().endsWith(".csv")) {
              reader.readAsText(file, "UTF-8");
            } else {
              reader.readAsArrayBuffer(file);
            }
          });

        document
          .getElementById("os-btn-confirm-import")
          .addEventListener("click", function () {
            if (!_parsedRows.length) return;

            // [VALIDATION-FIX] قبل كده: لو الصنف مش موجود كان بيتبعت
            // item_id = كود الصف نفسه (نص وهمي)، فيعدّي الفلتر ويوصل
            // للباك إند وكأنه معرّف حقيقي. دلوقتي بنستبعد الصفوف دي
            // فعلياً ونعرض تحذير واضح بيها قبل الاستيراد.
            var rows = [];
            var rejected = [];
            _parsedRows.forEach(function (r) {
              var item = APP.data.items.find(function (i) {
                return (i.code || "") === r.code || String(i.id) === r.code;
              });
              if (!item) {
                rejected.push(r.code + " — الصنف غير موجود");
                return;
              }
              if (isNaN(r.qty) || r.qty < 0) {
                rejected.push(r.code + " — كمية غير صالحة (" + r.qty + ")");
                return;
              }
              rows.push({
                item_id: item.id,
                color: r.color,
                qty: r.qty,
                notes: r.notes,
              });
            });

            if (!rows.length)
              return NotificationEngine.error(
                "لا توجد أصناف صالحة للاستيراد — كل الصفوف بها أكواد غير معروفة أو كميات غير صالحة"
              );

            // [DIALOG-FIX] استبدال confirm() الخام بـ showConfirm() الموحّد
            // (نفس نظام الحوارات المستخدم في باقي الشاشات).
            function _proceedOpeningStockImport() {
              closeStyledDrawer();

              // [SE-ROLLOUT] عبر SaveEngine.run بدل showSaveAnim/_gsr اليدوي.
              SaveEngine.run({
                screen: "opening_stock_import",
                entity: "opening_stock",
                data: rows,
                fn: "importOpeningStockBulk",
                // [FIX-IMPORT-OB-2026-08] كان بيبعت [rows] بس، من غير
                // callerUser/sessionToken. الـ backend
                // importOpeningStockBulk(rows, callerUser, sessionToken)
                // بيعمل _checkPermission كأول خطوة — fail-closed دايمًا من
                // غيرهم، يعني استيراد رصيد أول المدة بالجملة كان معطوب 100%.
                params: [
                  rows,
                  APP.currentUser ? APP.currentUser.username : null,
                  SESSION.token,
                ],
                savingLabel: "جاري الاستيراد... (" + rows.length + " صف)",
                successMessage: " تم استيراد " + rows.length + " صف بنجاح",
                onSuccess: function (result) {
                  var r = result.data || {};
                  if (r.errors && r.errors.length) {
                    console.warn("أخطاء استيراد الرصيد الافتتاحي:", r.errors);
                  }
                  reloadAfterMutation(function () {
                    renderPage("opening_stock");
                  });
                },
              });
            }

            if (rejected.length) {
              showConfirm({
                title: "تأكيد الاستيراد الجزئي",
                message:
                  " " +
                  rejected.length +
                  " صف هيتم تجاهله (أكواد غير معروفة/كمية غير صالحة):\n" +
                  rejected.slice(0, 15).join("\n") +
                  (rejected.length > 15
                    ? "\n...و" + (rejected.length - 15) + " صف آخر"
                    : "") +
                  "\n\nهل تريد المتابعة باستيراد الـ " +
                  rows.length +
                  " صف الصالحة فقط؟",
                icon: "ti-alert-triangle",
                iconColor: "#f59e0b",
                confirmText: "متابعة الاستيراد",
                confirmClass: "btn-warning",
                onConfirm: _proceedOpeningStockImport,
              });
              return;
            }

            _proceedOpeningStockImport();
          });
      },
    });
  }

  function openOpeningStockModal(item_id, color, defaultItemId) {
    var isEdit = !!item_id;
    color = color !== undefined ? color : "";
    var rec = isEdit
      ? (APP.data.openingStock || []).find(function (r) {
          return (
            String(r.item_id) === String(item_id) &&
            String(r.color || "").trim() === String(color || "").trim()
          );
        })
      : null;

    // ── Custom Color Dropdown helpers ────────────────────────
    function _resolveHex(name, code) {
      var n = (name || "").trim();
      var c = (code || "").trim();
      // 1. hex مباشر في الـ colors_json
      if (c && c.startsWith("#")) return c;
      // 2. hex من شيت Colors عبر APP.data.colors
      var globalClr = (APP.data.colors || []).find(function (cl) {
        return (
          String(cl.name || "")
            .trim()
            .toLowerCase() === n.toLowerCase() ||
          String(cl.code || "")
            .trim()
            .toUpperCase() === c.toUpperCase()
        );
      });
      if (globalClr && globalClr.hex && globalClr.hex.startsWith("#"))
        return globalClr.hex;
      // 3. CSS_COLOR_MAP
      return CSS_COLOR_MAP[n] || CSS_COLOR_MAP[n.toLowerCase()] || "#cccccc";
    }

    // ══════════════════════════════════════════════
    // ITEM CUSTOM DROPDOWN  (os-item-dropdown)
    // ══════════════════════════════════════════════

    function _groupItems(items) {
      var groups = {};
      var order = [];
      items.forEach(function (i) {
        var code = String(i.code || i.id || "");
        var prefix = code.replace(/\d+.*$/, "").trim() || "أخرى";
        if (!groups[prefix]) {
          groups[prefix] = [];
          order.push(prefix);
        }
        groups[prefix].push(i);
      });
      return { groups: groups, order: order };
    }

    // ── فلترة الأصناف بناءً على المخزن المختار ─────────────────
    // (نفس منطق شاشة "المخزون الحالي": مجموعة الصنف مرتبطة بالمخزن،
    // أو للصنف رصيد فعلي فيه)
    function _osItemMatchesWarehouse(item, whId) {
      if (!whId) return true;
      var grp = (APP.data.groups || []).find(function (g) {
        return g.id === item.group;
      });
      if (grp && String(grp.warehouse_id) === String(whId)) return true;

      var wh = (APP.data.warehouses || []).find(function (w) {
        return String(w.id) === String(whId);
      });
      if (!wh) return false;
      return (APP.data.stock || []).some(function (s) {
        return (
          String(s.item_id) === String(item.id) &&
          s.warehouse === wh.name &&
          Number(s.quantity || 0) > 0
        );
      });
    }

    function buildItemDropdown(selectedId, whId) {
      // [OS-WH-REQUIRED] لو مفيش مخزن مختار لسه، الدروب داون يفضل مقفول
      var whLocked = !whId;
      var items = APP.data.items.filter(function (i) {
        return _osItemMatchesWarehouse(i, whId);
      });
      var grouped = _groupItems(items);

      var optHtml = grouped.order
        .map(function (prefix) {
          var rows = grouped.groups[prefix]
            .map(function (i) {
              var isSel = i.id === selectedId ? " os-id-selected" : "";
              return (
                '<div class="os-id-opt' +
                isSel +
                '" data-id="' +
                esc(i.id) +
                '" data-code="' +
                esc(i.code || i.id) +
                '" data-name="' +
                esc(i.name) +
                '">' +
                '<span class="os-id-opt-name">' +
                esc(i.name) +
                "</span>" +
                '<span class="os-id-opt-code">' +
                esc(i.code || i.id) +
                "</span>" +
                "</div>"
              );
            })
            .join("");
          return (
            '<div class="os-id-group">' +
            '<div class="os-id-group-label">' +
            esc(prefix) +
            "</div>" +
            rows +
            '<div class="os-id-divider"></div>' +
            "</div>"
          );
        })
        .join("");

      var selItem = selectedId
        ? items.find(function (i) {
            return i.id === selectedId;
          })
        : null;
      var triggerInner = selItem
        ? '<div class="os-id-selected-wrap"><span class="os-id-sel-name">' +
          esc(selItem.name) +
          '</span><span class="os-id-sel-code">' +
          esc(selItem.code || selItem.id) +
          "</span></div>"
        : whLocked
          ? '<span class="os-id-placeholder">اختر المخزن أولاً</span>'
          : '<span class="os-id-placeholder">— اختر الصنف —</span>';

      return (
        '<div class="os-item-dropdown" id="os-item-wrap"' +
        (whLocked ? ' data-wh-locked="1"' : "") +
        ">" +
        '<input type="hidden" id="os-item" value="' +
        esc(selectedId || "") +
        '">' +
        '<div class="os-id-trigger' +
        (whLocked ? " os-id-locked" : "") +
        '" id="os-id-trigger" tabindex="0"' +
        (whLocked
          ? ' style="opacity:.55;cursor:not-allowed;background:var(--surface2)"'
          : "") +
        ">" +
        '<span class="os-id-arrow">▼</span>' +
        triggerInner +
        "</div>" +
        '<div class="os-id-panel" id="os-id-panel">' +
        '<div class="os-id-search-bar"><input type="text" id="os-id-search" placeholder=" بحث..."></div>' +
        '<div id="os-id-list">' +
        optHtml +
        "</div>" +
        "</div></div>"
      );
    }

    // إعادة بناء dropdown الصنف عند تغيير المخزن المختار
    function refreshItemDropdown(whId) {
      var wrap = document.getElementById("os-item-wrap");
      if (!wrap) return;
      wrap.outerHTML = buildItemDropdown("", whId);
      bindItemDropdown();
      // مسح اللون المختار سابقًا لأن الصنف اتغيّر
      refreshColorDropdown("");
    }

    function bindItemDropdown() {
      var wrap = document.getElementById("os-item-wrap");
      var trigger = document.getElementById("os-id-trigger");
      var panel = document.getElementById("os-id-panel");
      var hidden = document.getElementById("os-item");
      var listWrap = document.getElementById("os-id-list");
      var searchEl = document.getElementById("os-id-search");
      var itemNameDiv = document.getElementById("os-item-name");
      if (!trigger || !panel || !hidden) return;

      // [OS-WH-REQUIRED] لو الدروب داون لسه مقفول (مفيش مخزن مختار)
      var whLocked = wrap && wrap.getAttribute("data-wh-locked") === "1";

      // [ARCH-AUDIT-2026-07-17] موحّد عبر Core_UIManagers.initSearchableIdPanel
      var _panelApi = initSearchableIdPanel(trigger, panel, searchEl);
      var openPanel = _panelApi.openPanel;
      var closePanel = _panelApi.closePanel;

      trigger.addEventListener("click", function (e) {
        e.stopPropagation();
        if (whLocked) {
          NotificationEngine.error("اختر المخزن أولاً");
          return;
        }
        panel.classList.contains("os-id-open") ? closePanel() : openPanel();
      });

      trigger.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (whLocked) {
            NotificationEngine.error("اختر المخزن أولاً");
            return;
          }
          panel.classList.contains("os-id-open") ? closePanel() : openPanel();
        }
        if (e.key === "Escape") closePanel();
      });

      if (searchEl) {
        searchEl.addEventListener("input", function () {
          var q = searchEl.value.trim().toLowerCase();
          var opts = listWrap.querySelectorAll(".os-id-opt");
          opts.forEach(function (opt) {
            var name = (opt.dataset.name || "").toLowerCase();
            var code = (opt.dataset.code || "").toLowerCase();
            opt.style.display =
              !q || name.includes(q) || code.includes(q) ? "" : "none";
          });
          listWrap.querySelectorAll(".os-id-group").forEach(function (g) {
            var visible = Array.from(g.querySelectorAll(".os-id-opt")).some(
              function (o) {
                return o.style.display !== "none";
              },
            );
            g.style.display = visible ? "" : "none";
          });
        });
      }

      listWrap.addEventListener("click", function (e) {
        var opt = e.target.closest(".os-id-opt");
        if (!opt) return;
        var code = opt.dataset.code;
        var name = opt.dataset.name;

        hidden.value = code;
        var tw = trigger.querySelector(
          ".os-id-selected-wrap, .os-id-placeholder",
        );
        if (tw)
          tw.outerHTML =
            '<div class="os-id-selected-wrap"><span class="os-id-sel-name">' +
            esc(name) +
            '</span><span class="os-id-sel-code">' +
            esc(code) +
            "</span></div>";

        listWrap.querySelectorAll(".os-id-opt").forEach(function (o) {
          o.classList.remove("os-id-selected");
        });
        opt.classList.add("os-id-selected");

        if (itemNameDiv) {
          itemNameDiv.style.display = "none";
        }

        closePanel();
        refreshColorDropdown(itemCodeToId(code));
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest("#os-item-wrap")) closePanel();
      });
    }

    // يبني HTML الـ custom dropdown للألوان
    function buildColorDropdown(itemId) {
      var it = APP.data.items.find(function (i) {
        return i.id === itemId;
      });
      var colors = it ? getItemColors(it.id) : [];
      var noColors = colors.length === 0 && itemId;

      var items = noColors
        ? '<div class="os-cd-item os-cd-disabled"> لا توجد ألوان مُعرَّفة</div>'
        : colors
            .map(function (c) {
              var hex = _resolveHex(c.name, c.code);
              return (
                '<div class="os-cd-item" data-value="' +
                esc(c.name) +
                '">' +
                '<span class="os-cd-dot" style="background:' +
                hex +
                '"></span>' +
                '<span class="os-cd-label">' +
                esc(c.name) +
                (c.code
                  ? ' <span class="os-cd-code">(' + esc(c.code) + ")</span>"
                  : "") +
                "</span></div>"
              );
            })
            .join("");

      return (
        '<div class="os-color-dropdown" id="os-color-wrap">' +
        '<input type="hidden" id="os-color" value="">' +
        '<div class="os-cd-trigger input" id="os-cd-trigger" tabindex="0">' +
        '<span id="os-cd-display" style="color:var(--text3)">— اختر اللون *</span>' +
        '<span style="margin-right:auto;font-size:11px;opacity:.6">▼</span>' +
        "</div>" +
        '<div class="os-cd-list" id="os-cd-list">' +
        items +
        "</div>" +
        "</div>"
      );
    }

    // يربط أحداث الـ custom dropdown بعد الـ render
    function bindColorDropdown() {
      var trigger = document.getElementById("os-cd-trigger");
      var list = document.getElementById("os-cd-list");
      var hidden = document.getElementById("os-color");
      var display = document.getElementById("os-cd-display");
      if (!trigger || !list || !hidden) return;

      trigger.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = list.classList.toggle("os-cd-open");
        trigger.classList.toggle("os-cd-active", open);
      });

      list.addEventListener("click", function (e) {
        var item = e.target.closest(".os-cd-item");
        if (!item || item.classList.contains("os-cd-disabled")) return;
        var val = item.dataset.value;
        hidden.value = val;
        // عرض الدائرة + الاسم في الـ trigger
        var dot = item.querySelector(".os-cd-dot");
        var hex = dot ? dot.style.background : "#ccc";
        display.innerHTML =
          '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' +
          hex +
          ';border:1.5px solid #00000022;vertical-align:middle;margin-left:6px"></span>' +
          esc(val);
        display.style.color = "var(--text)";
        list.classList.remove("os-cd-open");
        trigger.classList.remove("os-cd-active");
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest("#os-color-wrap")) {
          list.classList.remove("os-cd-open");
          trigger.classList.remove("os-cd-active");
        }
      });
    }

    // بناء dropdown الألوان للصنف المختار (وضع إضافة)
    function refreshColorDropdown(itemId) {
      var wrap = document.getElementById("os-color-wrap");
      if (!wrap) return;
      wrap.outerHTML = buildColorDropdown(itemId);
      bindColorDropdown();
    }

    // حقل اللون حسب الوضع

    if (isEdit) {

            // [SE-ROLLOUT] عبر SaveEngine.run بدل _freezeUI/_gsr اليدوي.
            SaveEngine.run({
              screen: "opening_stock",

              fn: "saveOpeningStock",

              onSuccess: function () {
                // [AUTO-OB-JOURNAL] كان في السابق زرار يدوي منفصل "ترحيل
                // القيد المحاسبي" لازم المستخدم يدوسه بنفسه بعد إضافة كل
                // رصيد افتتاحي. دلوقتي بيترحّل تلقائيًا في الخلفية فورًا بعد
                // كل حفظ ناجح — postOpeningStockJournal بقت Idempotent
                // (بتلغي القيد القديم وترحّل قيد جديد بالإجمالي المحدّث)،
                // فمفيش داعي لأي تدخل يدوي أو تأكيد من المستخدم هنا.
                _gsr(
                  "postOpeningStockJournal",
                  [new Date().toISOString().split("T")[0], SESSION.token],
                  {
                    // [FIX-REFERR] _invalidateServerCache دالة سيرفر فقط
                    // (Code_12_Core.js) ومش موجودة في سكوب المتصفح — استدعاؤها
                    // هنا مباشرة كان بيطلّع ReferenceError. مفيش داعي لها من
                    // العميل أصلًا لأن postOpeningStockJournal بتعمل الـ
                    // invalidate بنفسها سيرفر-سايد جوه تنفيذها.
                    onSuccess: function () {},
                    onError: function (r) {
                      // ما بنوقفش المستخدم أو نفشّل الحفظ بسبب فشل الترحيل
                      // التلقائي (زي مثلاً عدم وجود صلاحية addJournalEntry،
                      // أو عدم تسعير صنف) — نسجّل فقط في الكونسول، وفيه
                      // زرار " ترحيل القيد المحاسبي" لسه موجود للمدير
                      // لو حابب يرحّل يدويًا في أي وقت.
                      console.warn(
                        "[AUTO-OB-JOURNAL] تعذّر الترحيل التلقائي: " +
                          (r && r.message),
                      );
                    },
                  },
                );

                // [PERF-FIX] الحفظ خلص فعلاً فوق (saveOpeningStock) في السيرفر.
                // قبل كده كنا بنستنى reloadAfterMutationFull() اللي بتمسح كل
                // الكاش وتعيد قراءة كل شيتات النظام (فواتير/حركات/عملاء...)
                // مش بس OpeningStock — فكان الصف الجديد يتأخر في الظهور لحد
                // ما الرحلة الكاملة دي تخلص. دلوقتي: تحديث محلي فوري لمصفوفة
                // openingStock في APP.data (Optimistic Update) + رسم الجدول
                // على طول، ومزامنة خفيفة في الخلفية (reloadAfterMutation) بس
                // للتأكد من مطابقة السيرفر — بدون ما تنتظرها.
                var _osRow = {
                  item_id: selId,
                  color: selColor,
                  quantity: qty,
                  notes: notes,
                  date: new Date().toISOString(),
                  unit_cost: unitCost,
                };
                if (APP.data && Array.isArray(APP.data.openingStock)) {
                  var _osIdx = APP.data.openingStock.findIndex(function (r) {
                    return (
                      String(r.item_id) === String(selId) &&
                      String(r.color || "").trim() ===
                        String(selColor).trim()
                    );
                  });
                  if (_osIdx > -1) APP.data.openingStock[_osIdx] = _osRow;
                  else APP.data.openingStock.push(_osRow);
                  if (typeof _cache !== "undefined" && _cache.data) {
                    _cache.data.openingStock = APP.data.openingStock;
                  }
                }
                reloadAfterMutation(
                  function () {
                    renderPage("opening_stock");
                  },
                  null,
                  {
                    title: "⏳ جار التحديث...",
                    emoji: "",
                    successMsg: " تم تحديث البيانات",
                  },
                );
              },
            });
          });
      },
    });
  }

  // ─────────────────────────────────────────────────────────────

  // [PHASE-CE/Inventory] جدول الجرد بقى معتمد على ColumnEngine بالكامل
  // (Metadata-Driven) — نفس نمط _catRegisterColumns/_csRegisterStockColumns.
  // التعديل الوحيد الخاص بالشاشة دي: عمود "الرصيد الفعلي" قابل للتعديل
  // (input) وعمود "الفرق" محسوب لحظيًا، فالقيم دي بتتحسب في
  // _stkPrepareRowsForCE() قبل ما توصل للمحرك، وأي تعديل بيتخزن في
  // state.edits (مش بس في الـ DOM) عشان القيمة تفضل محفوظة حتى لو
  // اختفى الصف بالفلترة ورجع تاني — ده بيصلّح مشكلة كانت موجودة في
  // النسخة القديمة (renderRows) اللي كانت بترجّع كل القيم المُدخلة
  // للرصيد الدفتري بمجرد أي تغيير في البحث/الفلتر.
  var _stkColumnsRegistered = false;

  function _stkDiffHtml(diff) {
    diff = Number(diff || 0);
    var color =
      diff < 0 ? "var(--danger)" : diff > 0 ? "var(--success)" : "var(--text3)";
    return (
      '<span class="mono" style="font-weight:' +
      (diff !== 0 ? "900" : "600") +
      ";color:" +
      color +
      '">' +
      diff +
      "</span>"
    );
  }

  function _stkRegisterColumns() {
    if (_stkColumnsRegistered) return;
    _stkColumnsRegistered = true;
    ColumnEngine.register(
      "stocktake",
      [
        {
          key: "item_id",
          label: "الكود",
          type: "text",
          width: 100,
          frozen: "right",
          format: function (v) {
            return (
              '<span class="mono" style="font-weight:700;color:var(--accent);font-size:13px">' +
              esc(v || "") +
              "</span>"
            );
          },
        },
        { key: "item_name", label: "الصنف", type: "text", width: 200 },
        { key: "warehouse", label: "المخزن", type: "text", width: 140 },
        {
          key: "color",
          label: "اللون",
          type: "text",
          width: 120,
          format: function (v) {
            return v ? esc(v) : "—";
          },
        },
        {
          key: "system_qty",
          label: "الرصيد الدفتري",
          type: "number",
          width: 120,
          align: "center",
        },
        {
          key: "actual_qty",
          label: "الرصيد الفعلي",
          type: "number",
          width: 130,
          align: "center",
          format: function (v, row) {
            return (
              '<input class="input input-sm stk-actual-input" type="number" step="0.01" min="0" data-key="' +
              esc(row._key) +
              '" value="' +
              (v === undefined || v === null ? row.system_qty : v) +
              '" style="width:110px;text-align:center" onclick="event.stopPropagation()">'
            );
          },
          exportValue: function (row) {
            return row.actual_qty;
          },
        },
        {
          key: "diff",
          label: "الفرق",
          type: "number",
          width: 100,
          align: "center",
          searchable: false,
          format: function (v) {
            return _stkDiffHtml(v);
          },
          exportValue: function (row) {
            return row.diff;
          },
        },
      ],
      {
        title: "جرد المخزون",
        rowKey: "_key",
      },
    );
  }

  // يحسب "الرصيد الفعلي" و"الفرق" لكل صف بناءً على آخر تعديل محفوظ في
  // state.edits (لو موجود) وإلا الرصيد الدفتري — لازم يتحسبوا كحقول
  // خام قبل ما يوصلوا لـ ColumnEngine عشان الفرز يشتغل عليهم صح.
  function _stkPrepareRowsForCE(rows, edits) {
    return rows.map(function (r) {
      var actual = edits[r._key] !== undefined ? edits[r._key] : r.system_qty;
      return Object.assign({}, r, {
        actual_qty: actual,
        diff: actual - r.system_qty,
      });
    });
  }

  function _stkRenderTableCE(container, rows) {
    if (!container) return;
    _stkRegisterColumns();
    ColumnEngine.renderTable("stocktake", container, rows, { rowKey: "_key" });
  }

  function _stkBuildRows() {
    var itemMap = {};
    (APP.data.items || []).forEach(function (it) {
      itemMap[String(it.id)] = it;
    });
    return (APP.data.stock || [])
      .filter(function (s) {
        return Number(s.quantity || 0) !== 0;
      })
      .map(function (s) {
        var item = itemMap[String(s.item_id)] || {};
        var warehouse = s.warehouse || "";
        var color = s.color || "";
        return {
          _key: String(s.item_id || "") + "|" + warehouse + "|" + color,
          item_id: String(s.item_id || ""),
          item_name: item.name || s.item_id || "",
          warehouse: warehouse,
          color: color,
          system_qty: Number(s.quantity || 0),
        };
      })
      .sort(function (a, b) {
        return (a.item_name + a.color).localeCompare(
          b.item_name + b.color,
          "ar",
        );
      });
  }

  function bindStocktake() {
    var state = {
      allRows: _stkBuildRows(),
      edits: {}, // _key -> الكمية الفعلية اللي دخلها المستخدم
    };
    var container = document.getElementById("stk-ce-container");

    function computeFilteredRows() {
      var q = ((document.getElementById("stk-search") || {}).value || "")
        .toLowerCase()
        .trim();
      var wh = (document.getElementById("stk-warehouse") || {}).value || "";
      var diffFilter =
        (document.getElementById("stk-diff-filter") || {}).value || "";
      var prepared = _stkPrepareRowsForCE(state.allRows, state.edits);
      return prepared.filter(function (r) {
        var matchQ =
          !q ||
          r.item_id.toLowerCase().indexOf(q) !== -1 ||
          r.item_name.toLowerCase().indexOf(q) !== -1 ||
          String(r.color || "")
            .toLowerCase()
            .indexOf(q) !== -1;
        var matchWh = !wh || r.warehouse === wh;
        var matchDiff =
          !diffFilter ||
          (diffFilter === "changed" && r.diff !== 0) ||
          (diffFilter === "short" && r.diff < 0) ||
          (diffFilter === "extra" && r.diff > 0);
        return matchQ && matchWh && matchDiff;
      });
    }

    function updateSummary() {
      var diffCount = 0;
      state.allRows.forEach(function (r) {
        var edited = state.edits[r._key];
        if (edited !== undefined && edited !== r.system_qty) diffCount++;
      });
      var summary = document.getElementById("stk-summary");
      if (summary)
        summary.textContent = diffCount
          ? diffCount + " فرق جاهز للترحيل"
          : "لا توجد فروق";
    }

    function refresh() {
      _stkRenderTableCE(container, computeFilteredRows());
      updateSummary();
    }

    // ── تعديل الرصيد الفعلي: تفويض الحدث على الحاوية نفسها (تفضل ثابتة
    // عبر إعادة renderTable المتكررة) — بيحدّث state.edits وخانة الفرق
    // في نفس الصف مباشرة من غير ما يعيد رسم الجدول كله (أداء + تركيز
    // الكتابة يفضل في مكانه).
    if (container && !container._stkWired) {
      container._stkWired = true;
      container.addEventListener("input", function (e) {
        var inp = e.target.closest(".stk-actual-input");
        if (!inp) return;
        var key = inp.getAttribute("data-key");
        var row = state.allRows.find(function (r) {
          return r._key === key;
        });
        if (!row) return;
        var val = inp.value === "" ? row.system_qty : Number(inp.value);
        state.edits[key] = val;
        var rowEl = inp.closest(".ce-body-row");
        var diffCell = rowEl && rowEl.querySelector('[data-col="diff"]');
        if (diffCell) diffCell.innerHTML = _stkDiffHtml(val - row.system_qty);
        updateSummary();
      });
    }

    function collectDiffs() {
      var rows = [];
      state.allRows.forEach(function (r) {
        var edited = state.edits[r._key];
        if (edited !== undefined && edited !== r.system_qty) {
          rows.push({
            item_id: r.item_id,
            warehouse: r.warehouse,
            color: r.color,
            system_qty: r.system_qty,
            actual_qty: edited,
          });
        }
      });
      return rows;
    }

    ["stk-search", "stk-warehouse", "stk-diff-filter"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el)
        el.addEventListener(
          id === "stk-search" ? "input" : "change",
          id === "stk-search" ? debounce(refresh, 250) : refresh,
        );
    });

    if (window.AppSelect) {
      AppSelect.upgrade("stk-warehouse", {
        icon: "ti-building-warehouse",
        placeholder: "اختر المخزن",
        searchable: true,
      });
      AppSelect.upgrade("stk-diff-filter", { icon: "ti-filter" });
    }

    var refreshBtn = document.getElementById("stk-refresh-btn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", function () {
        loadAllData(function () {
          state.allRows = _stkBuildRows();
          state.edits = {};
          refresh();
        }, true);
      });
    }

    var postBtn = document.getElementById("stk-post-btn");
    if (postBtn) {
      postBtn.addEventListener("click", function () {
        var rows = collectDiffs();
        if (!rows.length) {
          NotificationEngine.info("لا توجد فروق لترحيلها");
          return;
        }
        showConfirm({
          title: "ترحيل فروق الجرد",
          message:
            "سيتم ترحيل " + rows.length + " فرق جرد كحركات مخزون. متابعة؟",
          icon: "ti-transfer",
          iconColor: "#2563eb",
          confirmText: "ترحيل",
          confirmClass: "btn-primary",
          onConfirm: function () {
            // [SE-ROLLOUT] عبر SaveEngine.run بدل _gsr المباشر + تحكم يدوي بالزر.
            SaveEngine.run({
              screen: "stocktake",
              entity: "stocktake_session",
              buttonId: "stk-post-btn",
              fn: "postStocktakeSession",
              params: [
                {
                  rows: rows,
                  notes: (
                    (document.getElementById("stk-notes") || {}).value || ""
                  ).trim(),
                  user: APP.currentUser ? APP.currentUser.username : "",
                },
                SESSION.token,
              ],
              savingLabel: "جارٍ الترحيل...",
              successMessage: "تم ترحيل فروق الجرد بنجاح",
              onSuccess: function (result) {
                var d = result.data;
                if (d && d.movements) {
                  APP.data.transactions = (APP.data.transactions || []).concat(
                    d.movements,
                  );
                }
                loadAllData(function () {
                  renderPage("stocktake");
                }, true);
              },
            });
          },
        });
      });
    }

    // ── تطبيق فلتر المخزن المُمرَّر من context menu ──────────
    if (APP._pendingWarehouseName) {
      var whSel = document.getElementById("stk-warehouse");
      if (whSel) {
        whSel.value = String(APP._pendingWarehouseName);
        if (window.AppSelect) AppSelect.refresh("stk-warehouse");
      }
      APP._pendingWarehouseName = null;
    }

    refresh();
  }
</script>
