<script>
  // ───────────────────────────────────────────────────────────────
  // JS_Shipping_Colors_Excel.html — جزء 7/10 من JavaScript.html الأصلي
  // النطاق الأصلي: سطر 18439–21882 | الشحن + الألوان العامة + استيراد إكسيل + إرسال كتالوج
  // ───────────────────────────────────────────────────────────────

  // ─────────────────────────────────────────────────────────────
  // §SHIP-DASH  لوحة تحكم الشحن
  // ─────────────────────────────────────────────────────────────
  function bindShippingDashboard() {
    ensureExtendedData(function () {
      var _set = function (id, val) {
        var el = document.getElementById(id);
        if (el) el.textContent = val;
      };
      var shipments = APP.data.shipments || [];

      var statusCounts = { pending: 0, delivered: 0, returned: 0 };
      var totalFees = 0;
      var zones = {};
      shipments.forEach(function (s) {
        var st = (s.status || s.shipping_status || "").toUpperCase();
        if (st === "PENDING" || st === "معلقة" || st === "قيد التوصيل")
          statusCounts.pending++;
        if (st === "DELIVERED" || st === "مُسلَّمة" || st === "مسلمة")
          statusCounts.delivered++;
        if (st === "RETURNED" || st === "مُرتجعة" || st === "مرتجعة")
          statusCounts.returned++;
        totalFees += parseFloat(s.shipping_fee || s.fee || 0);
        if (s.zone || s.area || s.city)
          zones[s.zone || s.area || s.city] = true;
      });

      _set("shpd-stat-total", shipments.length);
      _set("shpd-stat-pending", statusCounts.pending);
      _set("shpd-stat-delivered", statusCounts.delivered);
      _set("shpd-stat-returned", statusCounts.returned);
      _set("shpd-stat-zones", Object.keys(zones).length || "—");
      _set("shpd-stat-fees", formatMoney(totalFees, { decimals: 0 }));

      // Recent shipments
      var tbody = document.getElementById("shpd-recent");
      if (tbody) {
        var recent = shipments.slice(-8).reverse();
        var stStyle = function (st) {
          st = (st || "").toUpperCase();
          if (st === "DELIVERED" || st === "مسلمة")
            return "color:#10b981;font-weight:600";
          if (st === "PENDING" || st === "معلقة")
            return "color:#f59e0b;font-weight:600";
          if (st === "RETURNED" || st === "مرتجعة")
            return "color:#ef4444;font-weight:600";
          return "color:#6b7280";
        };
        tbody.innerHTML = !recent.length
          ? '<tr><td colspan="5" style="text-align:center;padding:16px;color:var(--text3)">لا توجد شحنات</td></tr>'
          : recent
              .map(function (s) {
                return (
                  "<tr><td style='font-weight:700;color:var(--primary)'>" +
                  esc(s.ref || s.id || "") +
                  "</td>" +
                  "<td>" +
                  esc(s.customer_name || s.customer || "") +
                  "</td>" +
                  "<td>" +
                  esc(s.zone || s.area || s.city || "—") +
                  "</td>" +
                  "<td style='text-align:center'><span style='" +
                  stStyle(s.status || s.shipping_status) +
                  "'>" +
                  esc(s.status || s.shipping_status || "") +
                  "</span></td>" +
                  "<td style='color:var(--text3);font-size:12px'>" +
                  (s.date || s.created_at || "").slice(0, 10) +
                  "</td></tr>"
                );
              })
              .join("");
      }
    });
  }

  // إدارة المخازن — Warehouses
  // ─────────────────────────────────────────────────────────────

  // ── جدول المخازن عبر ColumnEngine ───────────────────────────────
  // [COLUMN-ENGINE] شاشة "المخازن" (سايد بار → المخزون → المخازن،
  // page:"warehouses"). كانت آخر جدول متبقي بأعمدة Hardcoded داخل
  // renderWarehouses() في Templates_04.html — نفس نمط شاشتي "الأصناف"
  // و"المجموعات" تمامًا.
  var _warehousesColumnsRegistered = false;
  var _warehousesTypeLabels = {
    خامات: " خامات",
    اكسسوار: " اكسسوار",
    تام: " تام",
    مختلط: " مختلط",
  };

  function _warehousesRegisterColumns() {
    if (_warehousesColumnsRegistered) return;
    _warehousesColumnsRegistered = true;
    ColumnEngine.register(
      "warehouses",
      [
        {
          key: "name",
          label: "الاسم",
          type: "text",
          width: 200,
          frozen: "right",
          format: function (v) {
            return "<b>" + esc(v || "—") + "</b>";
          },
        },
        { key: "code", label: "الكود", type: "text", width: 100 },
        {
          key: "type",
          label: "النوع",
          type: "text",
          width: 110,
          format: function (v) {
            return _warehousesTypeLabels[v] || esc(v || "—");
          },
        },
        { key: "manager", label: "المسؤول", type: "text", width: 140 },
        { key: "location", label: "الموقع", type: "text", width: 160 },
        {
          key: "status",
          label: "الحالة",
          type: "text",
          width: 100,
          format: function (v) {
            var status = (v || "").toString().trim();
            return status.includes("نشط")
              ? '<span class="badge badge-success">نشط</span>'
              : '<span class="badge badge-danger">موقوف</span>';
          },
        },
        {
          key: "item_count",
          label: "عدد الأصناف",
          type: "number",
          width: 110,
          align: "center",
          format: function (v) {
            var n = Number(v || 0);
            return n > 0
              ? '<span style="font-weight:700;color:var(--accent)">' +
                  n +
                  "</span>"
              : '<span style="color:var(--text3)">—</span>';
          },
        },
        {
          key: "notes",
          label: "ملاحظات",
          type: "text",
          format: function (v) {
            return esc(v || "—");
          },
        },
      ],
      {
        rowKey: "id",
        title: "قائمة المخازن",
        contextMenuType: "warehouses",
      },
    );
  }

  /** تجهيز صفوف المخازن (عدد الأصناف المرتبطة بكل مخزن) قبل تمريرها لـ ColumnEngine */
  function _warehousesPrepareRowsForCE(warehouses) {
    var groups = APP.data.groups || [];
    var items = APP.data.items || [];

    // خريطة: warehouse_id → Set(item_ids) — بنفس منطق النسخة القديمة
    var whItemIds = {};
    groups.forEach(function (g) {
      if (!g.warehouse_id) return;
      var whId = String(g.warehouse_id);
      if (!whItemIds[whId]) whItemIds[whId] = {};
      items.forEach(function (it) {
        if (String(it.group) === String(g.id)) {
          whItemIds[whId][String(it.id || it.item_id || "")] = true;
        }
      });
    });

    return (warehouses || []).map(function (wh) {
      var row = Object.assign({}, wh);
      row.item_count = whItemIds[String(wh.id)]
        ? Object.keys(whItemIds[String(wh.id)]).length
        : 0;
      return row;
    });
  }

  function _renderWarehousesTableCE(container, warehouses) {
    if (!container) return;
    _warehousesRegisterColumns();
    // [FIX] الضغط على صف المخزن بقى مايفتحش شاشة التعديل تلقائي —
    // التعديل بقى حصري عن طريق القائمة السياقية (زر يمين).
    ColumnEngine.renderTable(
      "warehouses",
      container,
      _warehousesPrepareRowsForCE(warehouses),
    );
  }

  function bindWarehouses() {
    var btnAddWh = document.getElementById("btn-add-wh");
    if (btnAddWh)
      btnAddWh.addEventListener("click", () =>
        requirePermission("addWarehouse", () => openWarehouseModal(null)),
      );

    _renderWarehousesTableCE(
      document.getElementById("warehouses-ce-container"),
      APP.data.warehouses || [],
    );
  }

  function editWarehouse(id) {
    requirePermission("updateWarehouse", () => {
      var wh = APP.data.warehouses.find((w) => w.id === id);
      if (wh) openWarehouseModal(wh);
    });
  }

  function delWarehouse(id) {
    if (!requirePermission("deleteWarehouse")) return;
    showConfirm({
      icon: "ti-building-warehouse",
      iconColor: "#0369a1",
      title: "حذف مخزن",
      message: "هل أنت متأكد من حذف هذا المخزن؟",
      confirmText: "حذف",
      confirmClass: "btn-danger",
      onConfirm: (unfreeze) => {
        _gsr(
          "deleteWarehouse",
          [id, APP.currentUser ? APP.currentUser.username : "", SESSION.token],
          {
            label: "deleteWarehouse",
            onSuccess: (r) => {
              NotificationEngine.success(r.message);
              reloadAfterMutation(
                null,
                unfreeze,
                { emoji: "", successMsg: "تم حذف المخزن " },
                {
                  collection: "warehouses",
                  record: { id: String(id) },
                  op: "remove",
                  idField: "id",
                },
              );
            },
            onError: (r) => {
              unfreeze();
              NotificationEngine.error(r.message || "خطأ في الحذف");
            },
          },
        );
      },
    });
  }

  function openWarehouseModal(wh) {
    var isEdit = !!wh;

    var typeOptions = ["خامات", "اكسسوار", "تام", "مختلط"]
      .map(function (t) {
        return (
          '<option value="' +
          t +
          '"' +
          (isEdit && wh.type === t
            ? " selected"
            : !isEdit && t === "خامات"
              ? " selected"
              : "") +
          ">" +
          t +
          "</option>"
        );
      })
      .join("");

    openStyledDrawer({
      title: isEdit ? "تعديل مخزن" : "مخزن جديد",
      subtitle: isEdit ? "تعديل بيانات المخزن" : "إضافة مخزن جديد للنظام",
      icon: isEdit ? "ti-building-store" : "ti-building-warehouse",
      color: "blue",
      width: 860,
      fromLeft: true,
      body: `<div class="modal-body"><div class="form-grid">
                <div class="field">
                  <label>اسم المخزن <span style="color:#ef4444">*</span></label>
                  <input class="input" id="wh-name" data-testid="wh-name" value="${isEdit ? esc(wh.name) : ""}"
                         placeholder="مثال: مخزن الخامات الرئيسي">
                </div>

                <div class="field">
                  <label>كود المخزن</label>
                  <input class="input" id="wh-code" data-testid="wh-code" data-allow-alpha="true" value="${isEdit ? esc(wh.code || "") : ""}"
                         placeholder="مثال: RAW">
                </div>

                <div class="field">
                  <label>نوع المخزن <span style="color:#ef4444">*</span></label>
                  <select class="input" id="wh-type" data-testid="wh-type">${typeOptions}</select>
                </div>

                <div class="field">
                  <label>المسؤول عن المخزن</label>
                  <input class="input" id="wh-manager" data-testid="wh-manager" value="${isEdit ? esc(wh.manager || "") : ""}"
                         placeholder="اسم المسؤول">
                </div>

                <div class="field">
                  <label>الموقع / العنوان</label>
                  <input class="input" id="wh-location" data-testid="wh-location" value="${isEdit ? esc(wh.location || "") : ""}"
                         placeholder="مثال: الدور الأول — المبنى A">
                </div>

                <div class="field">
                  <label>حالة المخزن</label>
                  <select class="input" id="wh-status" data-testid="wh-status">
                    <option value="نشط" ${isEdit && wh.status === "نشط" ? "selected" : !isEdit ? "selected" : ""}> نشط</option>
                    <option value="موقوف" ${isEdit && wh.status === "موقوف" ? "selected" : ""}> موقوف</option>
                  </select>
                </div>

                <div class="field full">
                  <label>ملاحظات</label>
                  <textarea class="input" id="wh-notes" rows="3" placeholder="">${isEdit ? esc(wh.notes || "") : ""}</textarea>
                </div>
              </div>
              </div>`,
      footer: `<button class="btn btn-outline" data-testid="btn-cancel-warehouse" onclick="closeStyledDrawer()">إلغاء</button>
                <button class="btn btn-primary" id="save-wh-btn" data-testid="btn-save-warehouse">
                  <i class="ti ${isEdit ? "ti-device-floppy" : "ti-building-warehouse"}"></i>
                  ${isEdit ? "حفظ التعديلات" : "إضافة المخزن"}
                </button>`,
      onReady: function () {
        if (typeof VF !== "undefined") {
          VF.bind("wh-name", VF.RULES.requiredText("اسم المخزن"));
        }
        // [AUTO-CODE] لمخزن جديد: اجلب معاينة الكود التسلسلي التالي من
        // السيرفر (بدون استهلاكه — يظل قابلاً للتعديل بالكامل، والتحقق
        // الملزم من عدم التكرار يتم في addWarehouse وقت الحفظ الفعلي).
        if (!isEdit) {
          var whCodeEl = document.getElementById("wh-code");
          if (whCodeEl && typeof google !== "undefined") {
            _gsr("getNextWarehouseCode", [], {
              onSuccess: function (res) {
                if (whCodeEl && !whCodeEl.value) {
                  whCodeEl.value = (res && res.data) || "";
                }
              },
              onError: function () {},
            });
          }
        }
        document
          .getElementById("save-wh-btn")
          .addEventListener("click", function () {
            var data = {
              id: isEdit ? wh.id : null,
              name: document.getElementById("wh-name").value.trim(),
              code: document.getElementById("wh-code").value.trim(),
              type: document.getElementById("wh-type").value,
              manager: document.getElementById("wh-manager").value.trim(),
              status: document.getElementById("wh-status").value,
              location: document.getElementById("wh-location").value.trim(),
              notes: document.getElementById("wh-notes").value.trim(),
              user: APP.currentUser ? APP.currentUser.username : "SYSTEM",
              sessionToken: SESSION.token,
            };

            // [SAVE-ENGINE] موحّد عبر 32_JS_SaveEngine.html — لا تعيد كتابة منطق حفظ يدوي هنا
            SaveEngine.run({
              screen: "Warehouse",
              entity: "warehouse",
              recordId: data.id,
              rules: [
                {
                  test: function () {
                    return (
                      typeof VF === "undefined" ||
                      VF.validateForm([
                        {
                          fieldId: "wh-name",
                          rules: VF.RULES.requiredText("اسم المخزن"),
                        },
                      ])
                    );
                  },
                  message: " راجع الحقول المظللة بالأحمر",
                },
                {
                  test: function () {
                    return !!data.name;
                  },
                  message: " اسم المخزن مطلوب",
                },
              ],
              data: data,
              fn: isEdit ? "updateWarehouse" : "addWarehouse",
              // [SOFT-SAVE] اقفل الدرج فوراً قبل نداء السيرفر — نفس نمط
              // شاشات الأصناف/المجموعات — بعدها تظهر فقاعة "⏳ جاري الحفظ..."
              closeFn: function () {
                closeStyledDrawer();
              },
              successMessage: isEdit
                ? "تم تعديل المخزن "
                : "تم إضافة المخزن ",
              onSuccess: function (res) {
                // الدرج اتقفل بالفعل قبل نداء السيرفر (closeFn فوق)
                // Optimistic patch: أضف/حدّث المخزن في الكاش فوراً
                var patchedRecord = Object.assign({}, data, {
                  id: isEdit
                    ? wh.id
                    : (res.data && res.data.id) ||
                      data.code ||
                      "wh_" + Date.now(),
                });
                reloadAfterMutation(
                  function () {
                    renderPage("warehouses");
                  },
                  null,
                  // [SE-BUBBLE-FIX] false = وضع صامت — SaveEngine.run فوق
                  // بيدير فقاعة "جار الحفظ → جار التحديث → تم الحفظ" لوحده
                  // بالفعل (successMessage فوق)، فمفيش داعي reloadAfterMutation
                  // تفتح فقاعتها الخاصة وتقفلها فجأة — كان ده سبب الفجوة
                  // الفاضية بين اختفاء "جار الحفظ" وظهور "تم الحفظ".
                  false,
                  {
                    collection: "warehouses",
                    record: patchedRecord,
                    op: isEdit ? "update" : "add",
                    idField: "id",
                  },
                );
              },
            });
          });
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // الشحن والتسليم — Shipping
  // ─────────────────────────────────────────────────────────────

  // ── حالات الشحن ─────────────────────────────────────────────
  var SHIP_STATUSES = {
    "بانتظار الشحن": { color: "#0369a1", bg: "#e0f2fe", icon: "" }, // v4.2 — من إذن الصادر
    معلق: { color: "var(--warning)", bg: "var(--warning-soft)", icon: "⏳" },
    "جاهز للشحن": {
      color: "#7c3aed",
      bg: "#ede9fe",
      icon: "ti-package",
      iconColor: "#9333ea",
    }, // v4.2
    "في الطريق": {
      color: "var(--accent2)",
      bg: "var(--teal-soft)",
      icon: "ti-truck-off",
      iconColor: "#dc2626",
    },
    "تم التسليم": {
      color: "var(--success)",
      bg: "var(--success-soft)",
      icon: "",
    },
    ملغي: { color: "var(--danger)", bg: "var(--danger-soft)", icon: "" },
  };

  function shipStatusBadge(status) {
    var s = SHIP_STATUSES[status] || {
      color: "var(--text3)",
      bg: "var(--surface2)",
      icon: "•",
    };
    return (
      '<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:' +
      s.bg +
      ";color:" +
      s.color +
      '">' +
      s.icon +
      " " +
      esc(status) +
      "</span>"
    );
  }

  // ── الصفحة الرئيسية ──────────────────────────────────────────

  // ─────────────────────────────────────────────────────────────
  // §SHIP-COMPANIES  شركات الشحن (المرحلة 1 من موديول الشحن)
  // ─────────────────────────────────────────────────────────────
  // [COLUMN-ENGINE] تعريف أعمدة جدول شركات الشحن — العرض/التعديل/الحذف
  // بقوا حصريًا عبر القائمة السياقية (contextMenuType: "shipping_companies"
  // — راجع 20_JS_ContextMenu.html) بدل عمود الإجراءات الثابت القديم.
  var _shippingCompaniesColumnsRegistered = false;
  function _shippingCompaniesRegisterColumns() {
    if (_shippingCompaniesColumnsRegistered) return;
    _shippingCompaniesColumnsRegistered = true;
    ColumnEngine.register(
      "shipping_companies",
      [
        {
          key: "code",
          label: "الكود",
          type: "text",
          width: 100,
          frozen: "right",
          format: function (v) {
            return (
              '<span class="mono" style="font-size:11px;color:#9A3412">' +
              esc(v || "—") +
              "</span>"
            );
          },
        },
        {
          key: "name",
          label: "اسم الشركة",
          type: "text",
          width: 220,
          format: function (v, row) {
            return (
              '<div style="display:flex;align-items:center;gap:8px">' +
              (row.logo_url
                ? '<img src="' +
                  esc(row.logo_url) +
                  '" style="width:28px;height:28px;border-radius:8px;object-fit:cover;flex-shrink:0">'
                : iconBadge(
                    "ti-truck",
                    "var(--orange-soft)",
                    "var(--orange)",
                  )) +
              "<b>" +
              esc(v || "—") +
              "</b></div>"
            );
          },
        },
        {
          key: "shipping_type",
          label: "النوع",
          type: "badge",
          width: 100,
          format: function (v) {
            var typeMeta =
              SHIPPING_TYPE_LABELS[v] || SHIPPING_TYPE_LABELS.external;
            return (
              '<span class="badge" style="background:' +
              typeMeta.bg +
              ";color:" +
              typeMeta.color +
              '">' +
              typeMeta.label +
              "</span>"
            );
          },
        },
        {
          key: "phone",
          label: "الهاتف",
          type: "text",
          width: 140,
          format: function (v) {
            return v
              ? '<a href="tel:' +
                  esc(v) +
                  '" style="color:var(--accent)">' +
                  esc(v) +
                  "</a>"
              : "—";
          },
        },
        {
          key: "contact_person",
          label: "الشخص المسؤول",
          type: "text",
          width: 150,
        },
        {
          key: "costing_method",
          label: "طريقة التسعير",
          type: "text",
          width: 140,
          format: function (v) {
            return esc(SHIPPING_COSTING_LABELS[v] || "—");
          },
        },
        {
          key: "active",
          label: "الحالة",
          type: "badge",
          width: 100,
          format: function (v) {
            var isActive = v !== false && v !== "false" && v !== "FALSE";
            return isActive
              ? '<span class="badge" style="background:var(--success-soft);color:#10B981">نشط</span>'
              : '<span class="badge" style="background:var(--danger-soft);color:#EF4444">موقوف</span>';
          },
        },
      ],
      {
        rowKey: "id",
        title: "قائمة شركات الشحن",
        contextMenuType: "shipping_companies",
      },
    );
  }

  function _renderShippingCompaniesTableCE() {
    var container = document.getElementById("shipping-companies-ce-container");
    if (!container) return;
    _shippingCompaniesRegisterColumns();
    var companies = (APP.data.shippingCompanies || []).slice().reverse();
    ColumnEngine.renderTable("shipping_companies", container, companies);
  }

  function bindShippingCompanies() {
    var btnNew = document.getElementById("btn-new-shipping-company");
    if (btnNew) {
      btnNew.addEventListener("click", function () {
        requirePermission("addShippingCompany", function () {
          ensureExtendedData(function () {
            openDrawer(renderShippingCompanyModal(null), 640);
            setTimeout(function () {
              initFinancialAccountSearcher("app-drawer");
              // [AUTO-CODE] معاينة الكود التسلسلي التالي (اقتراح قابل
              // للتعديل — الكود يفضل اختياريًا وحرًّا كما كان).
              var shcoCodeEl = document.getElementById("shco-modal-code");
              if (shcoCodeEl && !shcoCodeEl.value) {
                _gsr("getNextShippingCompanyCode", [], {
                  onSuccess: function (res) {
                    if (shcoCodeEl && !shcoCodeEl.value) {
                      shcoCodeEl.value = (res && res.data) || "";
                    }
                  },
                  onError: function () {
                    // [FIX] معاينة الكود اختيارية فقط — الكود يفضل حر
                    // للمستخدم يكتبه يدويًا، فمفيش داعي لتوست هنا، لكن
                    // لازم نضمن الحقل يفضل فاضي وقابل للكتابة بدل ما
                    // يفضل معلّق من غير رد.
                    if (shcoCodeEl && !shcoCodeEl.value) shcoCodeEl.value = "";
                  },
                });
              }
              if (typeof VF !== "undefined") {
                VF.bind(
                  "shco-modal-name",

              }

    } else {
      _renderShippingCompaniesTableCE();
    }

          APP.data.shippingCompanies = res.data || [];

          NotificationEngine.error((res && res.message) || "خطأ في تحميل شركات الشحن");

      onError: function (e) {

      NotificationEngine.error("شركة الشحن غير موجودة");

        return x.id === id;

      if (!c) {
        NotificationEngine.error("شركة الشحن غير موجودة");

    var c = (APP.data.shippingCompanies || []).find(function (x) {
      return x.id === id;
    });

      title: "حذف شركة الشحن",

      confirmText: "حذف",
      confirmClass: "btn-danger",
      icon: "ti-trash",
      iconColor: "#dc2626",
      freezeMessage: "⏳ جاري الحذف...",

        _gsr("deleteShippingCompany", [_authPayload({ id: id })], {
          onSuccess: function (res) {
            unfreezeUI();
            if (!res.success) {
              NotificationEngine.error(res.message);

            APP.data.shippingCompanies = (
              APP.data.shippingCompanies || []
            ).filter(function (x) {

  function _toggleShippingCostingFields() {
    var sel = document.getElementById("shco-modal-costing-method");

    if (!sel || !wrap) return;

  function _addShippingTierRow() {
    var list = document.getElementById("shco-tiers-list");
    if (!list) return;
    var idx = list.querySelectorAll(".shco-tier-row").length;
    list.insertAdjacentHTML("beforeend", _shippingTierRowHtml(idx, "", "", ""));
  }

  function _removeShippingTierRow(btn) {
    var row = btn.closest(".shco-tier-row");
    var list = document.getElementById("shco-tiers-list");
    if (row && list && list.querySelectorAll(".shco-tier-row").length > 1) {
      row.remove();
    } else if (row) {
      // آخر صف — نفضّيه بدل حذفه
      row.querySelectorAll("input").forEach(function (i) {
        i.value = "";
      });
    }
  }

  function _collectShippingTiers() {
    var rows = document.querySelectorAll("#shco-tiers-list .shco-tier-row");
    var tiers = [];
    rows.forEach(function (row) {
      var from = row.querySelector(".shco-tier-from");
      var to = row.querySelector(".shco-tier-to");
      var cost = row.querySelector(".shco-tier-cost");
      if (!from || !to || !cost) return;
      if (from.value === "" && to.value === "" && cost.value === "") return;
      tiers.push({
        from: parseFloat(from.value || 0),
        to: parseFloat(to.value || 0),
        cost: parseFloat(cost.value || 0),
      });
    });
    return tiers;
  }

  function _collectShippingGovernorates() {
    var boxes = document.querySelectorAll(".shco-gov-cb:checked");
    var areas = [];
    boxes.forEach(function (b) {
      areas.push(b.value);
    });
    return areas;
  }

  function bindShipping() {
    var btn = document.getElementById("btn-new-shipment");
    if (btn)
      btn.addEventListener("click", function () {
        openShipmentModal(null);
      });

    // بحث وفلترة
    var search = document.getElementById("ship-search");
    var filterStatus = document.getElementById("ship-filter-status");

    function applyShipFilter() {
      var q = (search ? search.value : "").toLowerCase().trim();
      var st = filterStatus ? filterStatus.value : "";
      var rows = document.querySelectorAll("#ship-table tbody tr[data-id]");
      rows.forEach(function (row) {
        var customer = row.dataset.customer || "";
        var driver = row.dataset.driver || "";
        var id = (row.dataset.id || "").toLowerCase();
        var permit = (row.dataset.permit || "").toLowerCase(); // v4.2
        var status = row.dataset.status || "";
        var matchQ =
          !q ||
          customer.includes(q) ||
          driver.includes(q) ||
          id.includes(q) ||
          permit.includes(q);
        var matchSt = !st || status === st;
        row.style.display = matchQ && matchSt ? "" : "none";
      });
    }

    if (search) search.addEventListener("input", applyShipFilter);
    if (filterStatus) filterStatus.addEventListener("change", applyShipFilter);

    if (window.AppSelect) {
      AppSelect.upgrade("ship-filter-status", {
        icon: "ti-truck",
        placeholder: "كل الحالات",
      });
    }
  }

  var _shipItems = []; // قائمة الأصناف في الشحنة الحالية

  function openShipmentModal(shipmentId) {
    var isEdit = !!shipmentId;
    // ── فحص الصلاحية قبل فتح النموذج ──────────────────────────
    if (!isEdit && !canDo("addShipment")) {
      NotificationEngine.error(" ليس لديك صلاحية لإنشاء شحنات");
      return;

      ? (APP.data.shipments || []).find(function (s) {

        '<div class="modal-body">' +

        '<div class="form-grid">' +
        '<div class="field full"><label> اسم العميل *</label>' +
        '<input class="input" id="ship-customer" placeholder="مثال: شركة الأمل للتجارة" value="' +
        (ship ? esc(ship.customer || "") : "") +
        '"></div>' +
        '<div class="field"><label> السائق / المندوب</label>' +
        '<input class="input" id="ship-driver" placeholder="مثال: محمد علي" value="' +
        (ship ? esc(ship.driver || "") : "") +
        '"></div>' +
        '<div class="field"><label> شركة الشحن</label>' +
        (function () {
          var cos = APP.data.shippingCompanies || [];
          var activecos = cos.filter(function (c) {
            return c.active !== false && c.active !== "FALSE";
          });
          if (activecos.length) {
            var opts =
              '<option value="">— اختر شركة الشحن —</option>' +
              activecos
                .map(function (c) {
                  var sel =
                    ship &&
                    (ship.company_id === c.id ||
                      (!ship.company_id && ship.company === c.name))
                      ? " selected"
                      : "";
                  return (
                    '<option value="' +
                    esc(c.id) +
                    '"' +
                    sel +
                    ">" +
                    esc(c.name) +
                    "</option>"
                  );
                })
                .join("");
            return (
              '<select class="input" id="ship-company-id">' +
              opts +
              "</select></div>" +
              '<div class="field"><label> رقم التتبع</label>' +
              '<input class="input" id="ship-tracking" placeholder="اختياري" value="' +
              (ship ? esc(ship.tracking_number || "") : "") +
              '">'
            );
          } else {
            return (
              '<input class="input" id="ship-company" placeholder="مثال: أرامكس" value="' +
              (ship ? esc(ship.company || "") : "") +
              '">'

          }
        })() +
        "</div>" +
        '<div class="field"><label> تاريخ الشحن</label>' +
        '<input class="input" type="date" id="ship-date" value="' +

        '"></div>' +
        '<div class="field"><label> موعد التسليم المتوقع</label>' +
        '<input class="input" type="date" id="ship-exp-date" value="' +
        (ship ? esc(ship.expected_date || "") : "") +
        '"></div>' +
        '<div class="field"><label> حالة الشحنة</label>' +
        '<select class="input" id="ship-status">' +
        statusOpts +
        "</select></div>" +
        '<div class="field full"><label> ملاحظات</label>' +
        '<input class="input" id="ship-notes" placeholder="أي ملاحظات خاصة بالشحنة" value="' +
        (ship ? esc(ship.notes || "") : "") +

        '<input class="input" id="ship-receipt" placeholder="ارفع الصورة على Google Drive وضع الرابط هنا" value="' +
        (ship ? esc(ship.receipt_url || "") : "") +

        '<div class="field"><label> رابط التتبع</label>' +

        '<select class="input" id="ship-cost-on">' +
        '<option value="company"' +

        "</div>" +

      {
        onSuccess: function (res) {
          var sel = document.getElementById("ship-invoice-id");
          if (!sel) return;
          var currentVal = ship ? ship.invoice_id || "" : "";

              !res.data.find(function (i) {

                esc(currentVal) +

        var existing = _shipItems.find(function (i) {
          return i.item_id === itemId;

      .getElementById("save-ship-btn")
      .addEventListener("click", function () {
        var customer = document.getElementById("ship-customer").value.trim();
        if (!customer) {
          NotificationEngine.error("اسم العميل مطلوب");
          return;
        }
        if (!_shipItems.length) {
          NotificationEngine.error("أضف صنف واحد على الأقل");
          return;
        }

        var data = {
          id: isEdit ? ship.id : null,
          customer: customer,
          driver: document.getElementById("ship-driver").value.trim(),
          company: (function () {
            var selEl = document.getElementById("ship-company-id");
            if (selEl) {
              var opt = selEl.options[selEl.selectedIndex];
              return opt && opt.value ? opt.text : "";
            }
            var inp = document.getElementById("ship-company");
            return inp ? inp.value.trim() : "";
          })(),
          company_id: (function () {
            var el = document.getElementById("ship-company-id");
            return el ? el.value.trim() : "";
          })(),
          tracking_number: (function () {
            var el = document.getElementById("ship-tracking");
            return el ? el.value.trim() : "";
          })(),
          tracking_url: (function () {
            var el = document.getElementById("ship-tracking-url");
            return el ? el.value.trim() : "";
          })(),
          shipping_cost: (function () {
            var el = document.getElementById("ship-cost");
            return el ? Number(el.value) || 0 : 0;
          })(),
          shipping_cost_on: (function () {
            var el = document.getElementById("ship-cost-on");
            return el ? el.value : "company";
          })(),
          expected_date: document.getElementById("ship-exp-date").value,
          status: document.getElementById("ship-status").value,
          notes: document.getElementById("ship-notes").value.trim(),
          receipt_url: document.getElementById("ship-receipt").value.trim(),
          items: _shipItems,
          user: APP.currentUser.username || "", // BUG-6 FIX: username لـ _checkPermission
          // [SESSION-FIX] addShipment/updateShipment تقرأ data.sessionToken
          // مباشرةً (نفس نمط addUser/updateUser في شاشة المستخدمين) — بدونه
          // ترفض _checkPermission الحفظ دائمًا برسالة "جلسة غير صالحة" حتى
          // لو كانت جلسة المستخدم سليمة تمامًا.
          sessionToken: SESSION ? SESSION.token : null,
          dispatch_permit_id: isEdit ? ship.dispatch_permit_id || "" : "", // v4.2 — محافظة على الربط عند التعديل
          invoice_id: (function () {
            var el = document.getElementById("ship-invoice-id");
            return el ? el.value.trim() : "";
          })(),
        };

        var btn = document.getElementById("save-ship-btn");
        btn.disabled = true;

        var fn = isEdit ? "updateShipment" : "addShipment";
        // UX: إغلاق فوري + مؤشر خلفي
        closeModal();
        _freezeUI(isEdit ? "⏳ جاري حفظ الشحنة..." : "⏳ جاري إضافة الشحنة...");
        _gsr(fn, [data], {
          onSuccess: function (r) {
            _unfreezeUI();
            NotificationEngine[r.success ? "success" : "error"](r.message); // [UNIFY-NOTIF]
            if (r.success) {
              // ── ربط الشحنة بالفاتورة إن اختار المستخدم فاتورة (المرحلة 3) ──
              var newShipId = r.data && r.data.id ? r.data.id : data.id;
              var selInvId = data.invoice_id;
              if (selInvId && newShipId && !isEdit) {
                _gsr(
                  "linkShipmentToInvoice",
                  [
                    APP.currentUser.username,
                    newShipId,
                    selInvId,
                    0,
                    "company",
                    SESSION.token,
                  ],
                  {
                    onSuccess: function (lr) {
                      if (lr && lr.success) {
                        NotificationEngine.success(" تم الربط بالفاتورة " + selInvId);
                      }
                    },
                    onError: function () {},
                  },
                );
              }
              // ── قيد محاسبي تلقائي عند إنشاء شحنة بتكلفة (مرحلة 4) ──
              if (!isEdit && data.shipping_cost > 0) {
                var journalPayload = {
                  shipmentId: newShipId,
                  shippingCost: data.shipping_cost,
                  shippingCostOn: data.shipping_cost_on || "company",
                  companyId: data.company_id || null,
                  customerId: data.customer || "",
                  callerUser: APP.currentUser.username,
                  date: data.date || (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
                };
                _gsr("autoJournalFromShipment", [journalPayload], {
                  onSuccess: function (jr) {
                    if (jr && jr.success)
                      NotificationEngine.info(" تم إنشاء القيد المحاسبي للشحنة");
                    else if (jr && jr.message)
                      NotificationEngine.warning(" القيد: " + jr.message);
                  },
                  onError: function () {},
                });
              }
              reloadAfterMutation(function () {
                renderPage("shipping");
              });
            }
          },
          onError: function (e) {
            _unfreezeUI();
            NotificationEngine.error(e.message || "حدث خطأ");
          },
        });
      });
  }

  function buildShipItemsList() {
    if (!_shipItems.length) {
      return '<p style="text-align:center;color:var(--text3);font-size:13px;padding:12px">لم تتم إضافة أصناف بعد</p>';
    }
    return _shipItems
      .map(function (it, idx) {
        return (
          '<div style="display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:6px 8px;background:var(--surface);border-radius:var(--radius-xs);margin-bottom:6px">' +
          '<span><b style="color:var(--accent)">' +
          esc(it.item_id) +
          "</b> — " +
          esc(it.name || "") +
          "</span>" +
          '<span style="font-weight:700">' +
          it.qty +
          "</span>" +
          '<span style="color:var(--text3);font-size:12px">' +
          esc(it.unit || "") +
          "</span>" +
          '<button class="btn btn-delete btn-xs" onclick="_removeShipItem(' +
          idx +
          ')"></button>' +
          "</div>"
        );
      })
      .join("");
  }

  function _removeShipItem(idx) {
    _shipItems.splice(idx, 1);
    var el = document.getElementById("ship-items-list");
    if (el) el.innerHTML = buildShipItemsList();
  }

  // ── عرض تفاصيل الشحنة ────────────────────────────────────────

      ? '<table style="width:100%;border-collapse:collapse;margin-top:8px">' +

        '<th style="padding:6px 8px;text-align:right;font-size:12px">الكود</th>' +
        '<th style="padding:6px 8px;text-align:right;font-size:12px">الاسم</th>' +

        '<th style="padding:6px 8px;text-align:right;font-size:12px">الوحدة</th>' +
        "</tr></thead><tbody>" +
        items

            return (
              "<tr>" +
              '<td style="padding:6px 8px;border-bottom:1px solid var(--border)"><span class="mono" style="color:var(--accent)">' +
              esc(it.item_id || "") +
              "</span></td>" +
              '<td style="padding:6px 8px;border-bottom:1px solid var(--border)">' +
              esc(it.name || "—") +
              "</td>" +
              '<td style="padding:6px 8px;border-bottom:1px solid var(--border)"><b>' +
              (it.qty || 0) +
              "</b></td>" +
              '<td style="padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text3)">' +
              esc(it.unit || "—") +
              "</td>" +

    var date = ship.date ? fmtDate(ship.date) : "—";

    openDrawer(

        "</div>" +
        '<button class="modal-close" onclick="closeDrawer()"><i class="ti ti-x"></i></button>' +
        "</div>" +
        '<div class="modal-body">' +
        // رأس الشحنة
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 0 16px">' +
        infoRow(
          "رقم الشحنة",
          '<span class="mono" style="color:var(--accent)">' +
            esc(ship.id) +
            "</span>",
        ) +
        // v4.2: إذن الصادر المرتبط
        (ship.dispatch_permit_id
          ? infoRow(
              "إذن الصادر",
              '<span class="ship-permit-link" onclick="closeDrawer();APP._pendingTxFilter=\'' +
                esc(ship.dispatch_permit_id) +
                "';navigateTo('transactions')\">" +
                '<i class="ti ti-arrow-bar-up" style="font-size:12px"></i> ' +
                '<span class="mono">' +
                esc(ship.dispatch_permit_id) +
                "</span>" +
                "</span>",
            )
          : "") +
        infoRow("الحالة", shipStatusBadge(ship.status || "معلق")) +
        infoRow("العميل", "<b>" + esc(ship.customer || "—") + "</b>") +
        infoRow("السائق / المندوب", esc(ship.driver || "—")) +
        infoRow("شركة الشحن", esc(ship.company || "—")) +
        (ship.shipping_cost
          ? infoRow(
              "تكلفة الشحن",
              "<b>" +
                formatMoney(ship.shipping_cost, {
                  decimals: 0,
                  withSymbol: false,
                }) +
                "</b> جنيه" +
                (ship.shipping_cost_on
                  ? ' <span style="font-size:11px;padding:2px 7px;border-radius:10px;background:' +
                    (ship.shipping_cost_on === "customer"

                      : "على الشركة") +

            )
          : "") +
        // ── الفاتورة المرتبطة (المرحلة 3) ──
        (ship.invoice_id
          ? infoRow(
              "الفاتورة المرتبطة",
              '<span class="mono" style="color:var(--accent);cursor:pointer" onclick="closeDrawer();navigateTo(\'invoices\')" title="فتح الفواتير">' +
                esc(ship.invoice_id) +

        infoRow("تاريخ الشحن", date) +

          ? infoRow("تاريخ التسليم الفعلي", fmtDate(ship.actual_delivery_date))

        infoRow("بواسطة", esc(ship.user || "—")) +

          ? '<div style="padding:10px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:12px;font-size:13px"><b>ملاحظات:</b> ' +
            esc(ship.notes) +

            '<i class="ti ti-map-pin" style="color:var(--accent)"></i>' +
            '<b>رقم التتبع:</b> <span class="mono">' +
            esc(ship.tracking_number) +

            (ship.tracking_url
              ? ' <a href="' +

              : "") +
            "</div>"
          : "") +
        '<div style="font-weight:700;margin-bottom:8px"> الأصناف المشحونة</div>' +
        itemsTable +
        receiptSection +
        // Timeline section
        (function () {
          var tl = [];

            tl =
              typeof ship.timeline_json === "string"
                ? JSON.parse(ship.timeline_json)
                : ship.timeline || ship.timeline_json || [];
          } catch (e) {}
          if (!tl || !tl.length) return "";
          var tlHtml = tl
            .slice()
            .reverse()
            .map(function (ev) {
              var st = SHIP_STATUSES[ev.status] || {
                icon: "•",
                color: "var(--text3)",
                bg: "var(--surface2)",
              };
              var dt = ev.at ? fmtDateTime(ev.at) : "";
              return (
                '<div style="display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--border)">' +
                '<div style="width:32px;height:32px;border-radius:50%;background:' +
                st.bg +
                ";color:" +
                st.color +
                ';display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">' +
                st.icon +
                "</div>" +
                "<div>" +
                '<div style="font-size:12px;font-weight:700;color:' +
                st.color +
                '">' +
                esc(ev.status) +
                "</div>" +
                (ev.from
                  ? '<div style="font-size:11px;color:var(--text3)">من: ' +
                    esc(ev.from) +
                    "</div>"
                  : "") +
                (ev.note
                  ? '<div style="font-size:12px;color:var(--text2);margin-top:2px">' +
                    esc(ev.note) +
                    "</div>"
                  : "") +
                '<div style="font-size:11px;color:var(--text3);margin-top:2px">' +
                dt +
                " — " +
                esc(ev.by || "النظام") +
                "</div>" +
                "</div></div>"
              );
            })
            .join("");
          return (
            '<div style="margin-top:20px">' +
            '<div style="font-weight:700;margin-bottom:10px"> سجل الحالات (Timeline)</div>' +
            '<div style="max-height:220px;overflow-y:auto;padding:4px 0">' +
            tlHtml +
            "</div>" +
            "</div>"
          );
        })() +
        "</div>" +
        '<div class="modal-actions">' +
        '<button class="btn btn-outline" onclick="closeDrawer()">إغلاق</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="closeDrawer();sendShipmentNotifManual(' +
        "'" +
        esc(ship.id) +
        "'" +
        ')"><i class="ti ti-brand-whatsapp" style="color:#25D366"></i> واتساب</button>' +
        '<button class="btn btn-primary btn-sm" onclick="closeDrawer();openShipStatusModal(' +
        "'" +
        esc(ship.id) +
        "'" +
        ')"><i class="ti ti-refresh"></i> تحديث الحالة</button>' +
        "</div></div>",
    );
  }

  // ── إرسال إشعار واتساب يدوي ──────────────────────────────────
  function sendShipmentNotifManual(id) {
    _freezeUI("⏳ جاري إرسال الإشعار...");
    _gsr("sendShipmentNotification", [APP.currentUser.username, id], {
      onSuccess: function (r) {
        _unfreezeUI();
        if (!r.success) {
          NotificationEngine.warning(r.message || "تعذّر تجهيز الإشعار");
          return;
        }
        NotificationEngine.success(" تم تجهيز الرسالة — سيفتح واتساب تلقائياً");
        if (r.data && r.data.whatsapp_url) {
          setTimeout(function () {
            window.open(r.data.whatsapp_url, "_blank");
          }, 400);
        }
      },
      onError: function (e) {
        _unfreezeUI();
        NotificationEngine.error(e.message || "حدث خطأ");
      },
    });
  }

  function infoRow(label, value) {
    return (
      '<div><div style="font-size:11px;color:var(--text3);margin-bottom:2px">' +
      label +
      '</div><div style="font-size:13px">' +
      value +
      "</div></div>"
    );
  }

  // ── تحديث الحالة سريع ────────────────────────────────────────
  function openShipStatusModal(id) {
    var ship = (APP.data.shipments || []).find(function (s) {
      return s.id === id;
    });
    if (!ship) return;

    var statusOpts = Object.keys(SHIP_STATUSES)
      .map(function (k) {
        return (
          '<option value="' +
          k +
          '"' +
          (ship.status === k ? " selected" : "") +
          ">" +
          SHIP_STATUSES[k].icon +
          " " +
          k +
          "</option>"
        );
      })
      .join("");

    openDrawer(
      '<div class="modal-box" style="max-width:420px">' +
        '<div class="modal-header">' +
        '<div class="modal-header-left">' +
        '<div class="modal-icon icon-warning"><i class="ti ti-refresh" style="font-size:20px"></i></div>' +
        '<div><h2>تحديث حالة الشحنة</h2><div class="modal-header-sub">تغيير حالة التسليم</div></div>' +
        "</div>" +
        '<button class="modal-close" onclick="closeDrawer()"><i class="ti ti-x"></i></button>' +
        "</div>" +
        '<div class="modal-body"><div class="form-grid">' +
        '<div class="field full"><label>رقم الشحنة</label>' +
        '<input class="input" value="' +
        esc(ship.id) +
        '" readonly style="background:var(--surface2)"></div>' +
        '<div class="field full"><label>العميل</label>' +
        '<input class="input" value="' +
        esc(ship.customer || "") +
        '" readonly style="background:var(--surface2)"></div>' +
        '<div class="field full"><label>الحالة الجديدة *</label>' +
        '<select class="input" id="status-update-sel">' +
        statusOpts +
        "</select></div>" +
        '<div class="field full"><label>ملاحظة (اختياري)</label>' +
        '<input class="input" id="status-update-notes" placeholder="مثال: تم التسليم للعميل الساعة 3م"></div>' +
        // ── خيارات المرحلة 4+5 ──
        '<div class="field full" style="background:var(--surface2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px">' +
        '<div style="font-weight:600;font-size:12px;color:var(--text2);margin-bottom:2px"><i class="ti ti-settings" style="font-size:11px"></i> خيارات متقدمة</div>' +
        '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">' +
        '<input type="checkbox" id="chk-post-journal" checked style="accent-color:var(--primary);width:16px;height:16px"> إنشاء قيد محاسبي تلقائي</label>' +
        '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">' +
        '<input type="checkbox" id="chk-send-notif" checked style="accent-color:var(--primary);width:16px;height:16px"> إرسال إشعار واتساب للعميل</label>' +
        "</div>" +
        "</div>" +
        "</div>" +
        '<div class="modal-actions">' +
        '<button class="btn btn-outline" onclick="closeDrawer()">إلغاء</button>' +
        '<button class="btn btn-primary" id="btn-save-status"><i class="ti ti-check"></i> حفظ الحالة</button>' +
        "</div></div>",
    );

    document
      .getElementById("btn-save-status")
      .addEventListener("click", function () {
        var newStatus = document.getElementById("status-update-sel").value;
        var notes = document.getElementById("status-update-notes").value.trim();
        var doJournal = document.getElementById("chk-post-journal").checked;
        var doNotif = document.getElementById("chk-send-notif").checked;
        var btn = document.getElementById("btn-save-status");
        btn.disabled = true;
        closeDrawer();
        _freezeUI("⏳ جاري تحديث حالة الشحنة...");
        _gsr(
          "updateShipmentStatusWithAccounting",
          [
            APP.currentUser.username,
            id,
            newStatus,
            notes,
            { postJournal: doJournal, sendNotif: doNotif },
          ],
          {
            onSuccess: function (r) {
              _unfreezeUI();
              if (!r.success) {
                NotificationEngine.error(r.message || "حدث خطأ");
                return;
              }
              NotificationEngine.success(r.message || " تم تحديث الحالة");
              if (r.data && r.data.journal) {
                var jr = r.data.journal;
                if (jr.success) NotificationEngine.info(" تم إنشاء القيد المحاسبي");
                else if (jr.message)
                  NotificationEngine.warning(" القيد: " + jr.message);
              }
              if (
                r.data &&
                r.data.notification &&
                r.data.notification.success
              ) {
                var notif = r.data.notification;
                NotificationEngine.info(" تم تجهيز إشعار واتساب للعميل");
                if (notif.data && notif.data.whatsapp_url) {
                  setTimeout(function () {
                    window.open(notif.data.whatsapp_url, "_blank");
                  }, 600);
                }
              }
              // [WF-EXEC-2026] المرحلة 3 — تشغيل Workflows "تم الشحن"/"تم
              // التسليم". بنعتمد على رقم هاتف العميل الراجع من الباك إند مع
              // الإشعار (r.data.notification.data.phone) لأنه محلول فعليًا
              // من شيت Parties — لو checkbox "إرسال إشعار واتساب" متلغي،
              // مفيش رقم هاتف موثوق متاح فمش هنطلق الـ workflow في الحالة دي.
              if (
                typeof WA_WORKFLOW_ENGINE !== "undefined" &&
                r.data &&
                r.data.notification &&
                r.data.notification.success &&
                r.data.notification.data &&
                r.data.notification.data.phone
              ) {
                var _wfShipTrigger =
                  newStatus === "في الطريق"
                    ? "order_shipped"
                    : newStatus === "تم التسليم"
                      ? "order_delivered"
                      : null;
                if (_wfShipTrigger) {
                  WA_WORKFLOW_ENGINE.trigger(_wfShipTrigger, {
                    customer_name: r.data.notification.data.customer || "",
                    phone: r.data.notification.data.phone,
                    shipment_id: id,
                  });
                }
              }
              reloadAfterMutation(function () {
                renderPage("shipping");
              });
            },
            onError: function (e) {
              _unfreezeUI();

  function previewFile(input) {
    const file = input.files[0];
    if (!file) return;
    document.getElementById("uploadText").textContent = file.name;
    if (file.type.startsWith("image/")) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = document.getElementById("previewImg");
        img.src = e.target.result;
        img.style.display = "block";
      };
      reader.readAsDataURL(file);
    }
  }

  function submitUpload() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) {
      NotificationEngine.error(" اختر ملف أولاً");
      return;
    }

    document.getElementById("uploadProgress").style.display = "flex";

    const reader = new FileReader();
    reader.onload = function (e) {
      const base64 = e.target.result.split(",")[1];

      // حماية قوية
      const context = {
        userName:
          APP.currentUser &&
          (APP.currentUser.full_name || APP.currentUser.username)
            ? APP.currentUser.full_name || APP.currentUser.username
            : "مستخدم",
        moduleName: "إيصال شحن",
      };

      _gsr("uploadFile", [base64, file.name, file.type, context], {
        onSuccess: (res) => {
          document.getElementById("uploadProgress").style.display = "none";
          const result = typeof res === "string" ? JSON.parse(res) : res;

          if (result.success) {
            NotificationEngine.success(` تم رفع الملف: ${result.fileName}`);

            // ملء حقل الرابط
            const receiptInput = document.getElementById("ship-receipt");
            if (receiptInput) receiptInput.value = result.viewUrl;

            closeUploadModal();
          } else {
            NotificationEngine.error(" " + (result.error || "فشل الرفع"));
          }
        },
        onError: (err) => {
          document.getElementById("uploadProgress").style.display = "none";
          NotificationEngine.error("خطأ في الرفع: " + (err.message || err));
        },
      });
    };

    reader.readAsDataURL(file);
  }

  function openColorDefModal(color) {
    var isEdit = !!color;
    var hexVal = isEdit ? color.hex || "" : "";

    // ── خريطة كود سريعة محلية (احتياطية قبل رد السيرفر) ──────────────
    var COLOR_CODE_MAP = {
      أحمر: "RED", احمر: "RED", red: "RED",
      أسود: "BLK", اسود: "BLK", black: "BLK",
      أبيض: "WHT", ابيض: "WHT", white: "WHT",
      أزرق: "BLU", ازرق: "BLU", blue: "BLU",
      أخضر: "GRN", اخضر: "GRN", green: "GRN",
      أصفر: "YEL", اصفر: "YEL", yellow: "YEL",
      بني: "BRN", بنى: "BRN", brown: "BRN",
      بيج: "BEI", beige: "BEI",
      رمادي: "GRY", رمادى: "GRY", grey: "GRY", gray: "GRY",
      كحلي: "NVY", كحلى: "NVY", navy: "NVY",
      زيتي: "OLV", زيتى: "OLV", olive: "OLV",
      بنفسجي: "PRP", بنفسجى: "PRP", purple: "PRP",
      وردي: "PNK", وردى: "PNK", ورده: "PNK", pink: "PNK",
      برتقالي: "ORG", برتقالى: "ORG", orange: "ORG",
      ذهبي: "GLD", ذهبى: "GLD", gold: "GLD",
      فضي: "SLV", فضى: "SLV", silver: "SLV",
      تركوازي: "TRQ", تركواز: "TRQ", turquoise: "TRQ",
      نبيتي: "WNE", نبيذي: "WNE", wine: "WNE",
      كريمي: "CRM", كريمى: "CRM", cream: "CRM",
      سلموني: "SAL", salmon: "SAL",
      تيل: "TEL", teal: "TEL",
      خمري: "MAR", خمرى: "MAR", maroon: "MAR",
      نيلي: "IND", نيلى: "IND", indigo: "IND",
      فيروزي: "CYN", فيروزى: "CYN", cyan: "CYN",
    };

    // ── تطبيع الحروف العربية (أ/إ/آ → ا) عشان المطابقة تنجح دايمًا ────
    function normArabic(s) {
      return (s || "").trim().toLowerCase()
        .replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");
    }
    function lookupQuickCode(nameVal) {
      var trimmed = (nameVal || "").trim();
      if (!trimmed) return null;
      if (COLOR_CODE_MAP[trimmed]) return COLOR_CODE_MAP[trimmed];
      if (COLOR_CODE_MAP[trimmed.toLowerCase()])
        return COLOR_CODE_MAP[trimmed.toLowerCase()];
      var norm = normArabic(trimmed);
      for (var k in COLOR_CODE_MAP) {
        if (normArabic(k) === norm) return COLOR_CODE_MAP[k];
      }
      return null;
    }

    openStyledDrawer({
      title: isEdit ? "تعديل لون" : "إضافة لون جديد",
      subtitle: "إدارة الألوان المستخدمة في الأصناف",
      icon: "ti-palette",
      color: "rose",
      width: 860,
      body: `<div class="modal-body"><div class="form-grid">
                <div class="field">
                  <label>الكود <span style="color:#ef4444">*</span></label>
                  <input class="input" id="clr-code" data-testid="color-code" data-allow-alpha="true" value="${isEdit ? esc(color.code) : ""}"
                         placeholder="مثال: RED" style="font-family:var(--font-mono);text-transform:uppercase">
                </div>

                <div class="field">
                  <label>اسم اللون <span style="color:#ef4444">*</span></label>
                  <div style="position:relative;display:flex;align-items:center">
                    <input class="input" id="clr-name" data-testid="color-name" value="${isEdit ? esc(color.name) : ""}"
                           placeholder="مثال: أحمر" style="padding-left:44px" autocomplete="off">
                    <div id="clr-preview" style="position:absolute;left:10px;width:24px;height:24px;border-radius:6px;background:${hexVal || "#e2e8f0"};border:2px solid rgba(0,0,0,.15);cursor:pointer;flex-shrink:0"
                         onclick="document.getElementById('clr-picker').click()" title="اختر لوناً"></div>
                    <input type="color" id="clr-picker" value="${hexVal || "#3b82f6"}"
                           style="position:absolute;left:0;opacity:0;width:0;height:0">
                  </div>
                  <div id="clr-ai-hint" style="font-size:11px;color:var(--text3);margin-top:4px;min-height:14px"></div>
                </div>

                <div class="field">
                  <label>ملاحظات <span style="font-size:11px;color:var(--text3)">(اختياري)</span></label>
                  <input class="input" id="clr-notes" data-testid="color-notes" value="${isEdit ? esc(color.notes || "") : ""}"
                         placeholder="وصف اختياري">
                </div>

                <div class="field">
                  <label>لون HEX <span style="font-size:11px;color:var(--text3)">(اختياري)</span></label>
                  <input class="input" id="clr-hex" data-testid="color-hex" value="${esc(hexVal)}"
                         placeholder="#ef4444" style="font-family:var(--font-mono)">
                </div>
              </div>
              ${isEdit ? '<input type="hidden" id="clr-id" value="' + esc(color.id) + '">' : ""}
              </div>`,
      footer: `<button class="btn btn-outline" onclick="closeStyledDrawer()">إلغاء</button>
                <button class="btn btn-primary" id="save-color-def-btn" data-testid="btn-save-color">
                  <i class="ti ${isEdit ? "ti-device-floppy" : "ti-palette"}"></i>
                  ${isEdit ? "حفظ التعديلات" : "إضافة اللون"}
                </button>`,

      // الإصلاح الجوهري: onReady بينفّذ بعد ما الحقول تتحط فعليًا
      // في الـ DOM (openStyledDrawer بيحط الـ body جوه requestAnimationFrame).
      // أي كود بيدور على document.getElementById('clr-name') قبل كده هيلاقيه null.
      onReady: function () {
        var picker = document.getElementById("clr-picker");
        var preview = document.getElementById("clr-preview");
        var hexInput = document.getElementById("clr-hex");
        var nameInput = document.getElementById("clr-name");
        var codeInput = document.getElementById("clr-code");
        var aiHint = document.getElementById("clr-ai-hint");

        // لو لأي سبب الحقول لسه مش موجودة، ما نكملش (حماية إضافية)
        if (!nameInput || !codeInput || !hexInput) {
          console.warn("openColorDefModal: عناصر الفورم مش موجودة بعد onReady");
          return;
        }

        var hexManuallyEdited = isEdit && !!hexVal;
        var codeManuallyEdited = isEdit;
        var aiRequestTimer = null;
        var aiLastRequestedName = "";

        function setAIHint(text) {
          if (aiHint) aiHint.textContent = text || "";
        }

        function applyHexResult(hex) {
          if (!hex || !/^#[0-9a-fA-F]{6}$/i.test(hex)) return;
          if (preview) preview.style.background = hex;
          if (picker) picker.value = hex;
          if (!hexManuallyEdited) hexInput.value = hex;
        }

        function applyCodeResult(code) {
          if (!code) return;
          if (!codeManuallyEdited) codeInput.value = code.toUpperCase();
        }

        // ── طلب اقتراح كامل (Hex + كود) من السيرفر: بحث إنترنت حقيقي
        // للأسماء الإنجليزية أو ذكاء اصطناعي (Groq) للعربي/العامي ─────
        function requestServerSuggestion(name) {
          if (!name || name.length < 2) return;
          aiLastRequestedName = name;
          setAIHint(" جاري البحث عن اللون تلقائياً...");
          _gsr("resolveColorsBatch", [[name]], {
            onSuccess: function (result) {
              if (nameInput.value.trim() !== aiLastRequestedName) return;
              var info = result && result[aiLastRequestedName];
              if (info && info.hex) {
                applyHexResult(info.hex);
                applyCodeResult(info.code);
                var srcLabel =
                  info.source === "web" ? " تم جلب اللون من الإنترنت" :
                  info.source === "ai" ? " تم اقتراح اللون بالذكاء الاصطناعي" :
                  info.source === "map" || info.source === "cache" ? " تم التعرف على اللون" : "";
                setAIHint(hexManuallyEdited && codeManuallyEdited ? "" : srcLabel);
              } else {
                setAIHint("");
              }
            },
            onError: function () {
              if (nameInput.value.trim() === aiLastRequestedName) setAIHint("");
            },
          });
        }

        if (picker) {
          picker.addEventListener("input", function () {
            if (preview) preview.style.background = this.value;
            hexInput.value = this.value;
            hexManuallyEdited = true;
          });
        }

        hexInput.addEventListener("input", function () {
          hexManuallyEdited = true;
          var v = this.value.trim();
          if (/^#[0-9a-fA-F]{6}$/.test(v)) {
            if (preview) preview.style.background = v;
            if (picker) picker.value = v;
          }
        });

        nameInput.addEventListener("input", function () {
          var n = this.value;
          var nameNow = n.trim();

          // 1) auto-fill فوري ومضمون للكود من الخريطة المحلية (بدون انتظار)
          if (!codeManuallyEdited) {
            var quickCode = lookupQuickCode(n);
            if (quickCode) codeInput.value = quickCode;
          }

          // 2) auto-fill فوري لمعاينة اللون من دالة colorNameToHex لو موجودة
          if (typeof colorNameToHex === "function") {
            var autoHex = colorNameToHex(n);
            if (autoHex && /^#[0-9a-fA-F]{6}$/i.test(autoHex)) {
              if (preview) preview.style.background = autoHex;
              if (!hexManuallyEdited) hexInput.value = autoHex;
              if (picker) picker.value = autoHex;
            }
          }

          // 3) بعد وقفة كتابة قصيرة، اطلب من السيرفر تأكيد/تحسين النتيجة
          if (aiRequestTimer) clearTimeout(aiRequestTimer);
          if (nameNow.length < 2) {
            setAIHint("");
            return;
          }
          aiRequestTimer = setTimeout(function () {
            requestServerSuggestion(nameNow);
          }, 500);
        });

        nameInput.addEventListener("blur", function () {
          var n = this.value.trim();
          if (!codeInput.value.trim() && !codeManuallyEdited) {
            var code = lookupQuickCode(n) || n.replace(/\s+/g, "").substring(0, 3).toUpperCase();
            codeInput.value = code;
          }
          if (!hexInput.value.trim() && !hexManuallyEdited) {
            var autoHex = typeof colorNameToHex === "function" ? colorNameToHex(n) : null;
            if (autoHex && /^#[0-9a-fA-F]{6}$/i.test(autoHex)) {
              hexInput.value = autoHex;
              if (preview) preview.style.background = autoHex;
              if (picker) picker.value = autoHex;
            }
          }
        });

        codeInput.addEventListener("input", function () {
          codeManuallyEdited = true;
          this.value = this.value.toUpperCase();
        });

        // إذا كان تعديل لون موجود — حدّث معاينة اللون الأولية
        if (isEdit && color.name && preview) {
          var initHex = hexVal ||
            (typeof colorNameToHex === "function" ? colorNameToHex(color.name) : "#e2e8f0");
          preview.style.background = initHex;
        }

        var saveBtn = document.getElementById("save-color-def-btn");
        if (saveBtn) {
          if (typeof VF !== "undefined") {
            VF.bind("clr-name", VF.RULES.requiredText("اسم اللون"));
            VF.bind("clr-code", VF.RULES.requiredText("كود اللون"));
          }
          saveBtn.addEventListener("click", function () {
            var name = (nameInput.value || "").trim();
            var code = (codeInput.value || "").trim().toUpperCase();
            var hex = (hexInput.value || "").trim();
            var notesEl = document.getElementById("clr-notes");
            var notes = notesEl ? (notesEl.value || "").trim() : "";
            var idEl = document.getElementById("clr-id");
            var id = isEdit ? (idEl ? idEl.value : "") : null;

            // لو HEX فاضي → احسبه أوتوماتيك من الاسم
            if (!hex && name) {
              var autoHex = typeof colorNameToHex === "function" ? colorNameToHex(name) : null;
              if (autoHex && /^#[0-9a-fA-F]{6}$/i.test(autoHex)) {
                hex = autoHex;
                hexInput.value = hex;
                if (preview) preview.style.background = hex;
                if (picker) picker.value = hex;
              }
            }

            var payload = {
              name: name,
              code: code,
              hex: hex,
              notes: notes,
              user: APP.currentUser ? APP.currentUser.username : "SYSTEM",
              sessionToken: SESSION.token,
            };
            if (isEdit) payload.id = id;

            var fnName = isEdit ? "updateColor" : "addColor";

            // [SAVE-ENGINE] موحّد عبر 32_JS_SaveEngine.html — لا تعيد كتابة منطق حفظ يدوي هنا
            SaveEngine.run({
              screen: "ColorDefinition",
              entity: "color",
              recordId: id,
              buttonId: "save-color-def-btn",
              rules: [
                {
                  test: function () {
                    return (
                      typeof VF === "undefined" ||
                      VF.validateForm([
                        {
                          fieldId: "clr-name",
                          rules: VF.RULES.requiredText("اسم اللون"),
                        },
                        {
                          fieldId: "clr-code",
                          rules: VF.RULES.requiredText("كود اللون"),
                        },
                      ])
                    );
                  },
                  message: " راجع الحقول المظللة بالأحمر",
                },
                {
                  test: function () {
                    return !!payload.name;
                  },
                  message: " اسم اللون مطلوب",
                },
                {
                  test: function () {
                    return !!payload.code;
                  },
                  message: " كود اللون مطلوب",
                },
              ],
              data: payload,
              fn: fnName,
              // [SOFT-SAVE] اقفل المودال فوراً قبل نداء السيرفر — نفس نمط
              // شاشات الأصناف/المجموعات/المخازن.
              closeFn: function () {
                closeModal();
              },
              successMessage: isEdit
                ? "تم تعديل اللون "
                : "تم إضافة اللون ",
              onSuccess: function (res) {
                // المودال اتقفل بالفعل قبل نداء السيرفر (closeFn فوق)
                // [PERF-FIX] نفس مبدأ إصلاح "أرصدة أول المدة": الحفظ خلص
                // فعلاً في السيرفر، لكن reloadAfterMutation (بدون
                // optimisticPatch) بترسم الجدول فورًا من APP.data القديم،
                // وبعدها بـ 300ms بس مزامنة الخلفية بتجيب النسخة الصح —
                // فكان الصف الجديد بيتأخر شكليًا في الظهور رغم إن الحفظ تم.
                // هنا بنحدّث APP.data.colors محليًا فورًا (Optimistic Update)
                // فيظهر الصف على طول، والمزامنة الخلفية تفضل شغالة للتأكيد.
                var _newId = isEdit ? id : res && res.data && res.data.id;
                if (_newId && Array.isArray(APP.data.colors)) {
                  var _colorRow = {
                    id: _newId,
                    name: payload.name,
                    code: payload.code,
                    hex: payload.hex,
                    notes: payload.notes,
                  };
                  var _cIdx = APP.data.colors.findIndex(function (c) {
                    return String(c.id) === String(_newId);
                  });
                  if (_cIdx > -1) APP.data.colors[_cIdx] = _colorRow;
                  else APP.data.colors.push(_colorRow);
                  if (typeof _cache !== "undefined" && _cache.data) {
                    _cache.data.colors = APP.data.colors;
                  }
                }
                reloadAfterMutation(function () {
                  renderPage("color_definitions");
                });
              },
            });
          });
        }
      },
    });
  }

  function editColorDef(id) {
    requirePermission("updateColor", function () {
      var color = (APP.data.colors || []).find(function (c) {
        return c.id === id;
      });
      if (color) openColorDefModal(color);
      else NotificationEngine.error("اللون غير موجود");
    });
  }

  function deleteColorDefConfirm(id, name) {
    if (!requirePermission("deleteColor")) return;
    showConfirm({
      icon: "ti-palette-off",
      iconColor: "#dc2626",
      title: "حذف اللون",
      message: 'هل أنت متأكد من حذف اللون "' + name + '"؟',
      confirmText: "حذف",
      confirmClass: "btn-danger",
      onConfirm: function (unfreeze) {
        _gsr(
          "deleteColor",
          [id, APP.currentUser ? APP.currentUser.username : "", SESSION.token],

  /* تحميل مكتبة SheetJS — [CONSOLE-FIX] بقت مضمّنة داخلياً ومحمّلة
     Lazy عبر getLazyAppBundle (SheetJS_Embedded.html) بدل التحميل من
     CDN خارجي. عادةً بتكون خلصت تحميل قبل ما المستخدم يوصل لشاشة
     الاستيراد أصلاً (اتحملت في الخلفية من أول فتح الصفحة). لو لسه
     بتتحمّل لأي سبب (مثلاً المستخدم فتح شاشة الاستيراد بسرعة جداً)،
     ننتظر _loadLazyAppBundle تخلص (نفس الآلية المستخدمة لباقي
     الموديولات المؤجلة) بدل ما نحقن <script> تاني من مصدر خارجي. */
  function _loadSheetJS(cb) {
    if (_xlsxLoaded || typeof XLSX !== "undefined") {
      _xlsxLoaded = true;
      cb();
      return;
    }
    if (typeof _loadLazyAppBundle === "function") {
      var _tries = 0;
      var _wait = setInterval(function () {
        _tries++;
        if (typeof XLSX !== "undefined") {
          clearInterval(_wait);
          _xlsxLoaded = true;
          cb();
        } else if (_tries > 100) {
          // ~10 ثواني — لو لسه مش موجودة، فيه مشكلة فعلية في الحزمة المؤجلة
          clearInterval(_wait);
          NotificationEngine.error(" تعذّر تحميل مكتبة قراءة الإكسيل — أعد تحميل الصفحة");
        }
      }, 100);
      _loadLazyAppBundle();
      return;
    }
    NotificationEngine.error(" تعذّر تحميل مكتبة قراءة الإكسيل — أعد تحميل الصفحة");
  }

  /* تحميل نموذج إكسيل جاهز بالأعمدة الصح */
  function _downloadExcelTemplate() {

        "الحد الأدنى",
        "سعر التكلفة",
        "سعر البيع",
        "الألوان",
        "رابط الصورة",
        "الوصف",
      ];
      var example = [
        "B1",
        "بابل أحمر",
        "قمصان",
        "قطعة",
        "10",
        "50",
        "100",
        "أحمر، أسود، أبيض",
        "https://i.imgur.com/example.jpg",
        "وصف اختياري",
      ];

      var ws = XLSX.utils.aoa_to_sheet([headers, example]);

      // عرض الأعمدة
      ws["!cols"] = headers.map(function (h) {
        return { wch: h === "رابط الصورة" || h === "الوصف" ? 35 : 16 };
      });

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "الأصناف");

    });

  // كانوا هنا كـ override لدوال _csBuildMergedTable/_csBuildColorDetail
  // القديمة اللي بقت DEPRECATED ومش في مسار العرض الفعلي، فاتشالت.

  // ── override: الإحصائيات العلوية ────────────────────────────
  _csUpdateStats = function (items) {
    var whName = _csGetActiveWarehouseName();

    // pills شريط
    var statsBar = document.getElementById("cs-stats-bar");
    if (statsBar) {
      if (!whName) {
        statsBar.innerHTML = buildCatalogStats(items);
      } else {
        // أعد بناء pills بالرصيد الفعلي للمخزن المختار
        var total = items.length,
          available = 0,
          low = 0,
          out = 0;
        items.forEach(function (it) {
          var c = stockStatusBadgeFiltered(it, whName).cls;
          if (c === "available") available++;
          else if (c === "low") low++;
          else out++;
        });
        // نفس buildCatalogStats لكن بالأرقام المحسوبة
        function pill(icon, label, val, color) {
          return (
            '<div style="display:flex;align-items:center;gap:7px;background:var(--surface);' +
            'border:1px solid var(--border);border-radius:50px;padding:6px 14px;box-shadow:var(--shadow-xs)">' +
            '<span style="font-size:15px">' +
            icon +
            "</span>" +
            '<span style="font-size:12px;color:var(--text3)">' +
            label +
            "</span>" +
            '<span style="font-weight:800;font-size:14px;color:' +
            color +
            '">' +
            val +
            "</span></div>"
          );
        }
        statsBar.innerHTML =
          '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
          pill("", "إجمالي", total, "var(--text1)") +
          pill("", "متاح", available, "var(--success)") +
          pill("", "منخفض", low, "var(--warning,#f59e0b)") +
          pill("", "نفد", out, "var(--danger)") +
          pill("", "المخزن المعروض", esc(whName), "var(--accent)") +
          "</div>";
      }
    }

    // بطاقات كبيرة
    var cardsEl = document.getElementById("cs-stat-cards");
    if (!cardsEl) return;
    var total2 = items.length,
      avail = 0,
      low2 = 0,
      out2 = 0,
      totalCost = 0;
    items.forEach(function (it) {
      var ss = whName
        ? stockStatusBadgeFiltered(it, whName)
        : stockStatusBadge(it);
      if (ss.cls === "available") avail++;
      else if (ss.cls === "low") low2++;
      else out2++;
      totalCost += ss.qty * Number(it.cost_price || 0);
    });
    cardsEl.innerHTML =
      statCard("", "مخزون طبيعي", avail, "صنف", "var(--success-soft)") +
      statCard(
        "",
        "تحت الحد الأدنى",
        low2 + out2,
        "صنف",
        "var(--warning-soft,#fff7e6)",
      ) +
      statCard(
        "",
        "قيمة المخزون",
        formatMoney(totalCost, { decimals: 0, withSymbol: false }),
        "جنيه",
        "var(--accent-soft)",
      ) +
      statCard(
        "",
        "إجمالي الأصناف",
        total2,
        "صنف",
        "var(--teal-soft,#e0f7f4)",
      );
  };

      typeof WA_PHONE !== "undefined"

      return NotificationEngine.error("رقم الواتساب غير صحيح — أدخل رقم دولي مثل 201001234567");

    if (!editUsername && !apikey)
      return NotificationEngine.error("API Key مطلوب — راجع تعليمات CallMeBot أعلاه");

    if (editUsername && !apikey) cfg.apikey = "****keep";

    showSaveAnim({ title: SAVE_MESSAGES.SAVING, emoji: "" });

    _gsr(
      "saveWeeklyReportConfig",
      [cfg, APP.currentUser.username, SESSION.token],
