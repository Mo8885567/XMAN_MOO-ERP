  // ─────────────────────────────────────────────────────────────
  // إرسال كتالوج مخصص لعميل — مُعاد كتابته بالكامل
  // ─────────────────────────────────────────────────────────────

  var _CS = {
    selWarehouses: [], // IDs المخازن المختارة
    selGroups: [], // IDs المجموعات المختارة
    showPrices: true,
    showZero: false, // عرض الأصناف رصيدها صفر
    noQty: false, // إخفاء الرصيد والحالة عن العميل
    excludeCodes: [], // أكواد الأصناف المستثناة من الكتالوج
    clientName: "",
    baseUrl: "",
  };

  // ── دالة مساعدة: كل أصناف المخزن المختار ──────────────────
  function _csItemsInWarehouses(whIds) {
    var items = APP.data.items || [];
    var stock = APP.data.stock || [];
    var warehouses = APP.data.warehouses || [];

    if (!whIds.length) return items; // الكل مختار

    // حوّل IDs → أسماء (لأن stock.warehouse مخزون كاسم)
    var whNames = whIds.map(function (wid) {
      var w = warehouses.find(function (x) {
        return String(x.id) === String(wid);
      });
      return w ? String(w.name).trim() : String(wid).trim();
    });

    // اجمع item_ids التي لها مخزون > 0 في أي من المخازن
    var validIds = {};
    stock.forEach(function (s) {
      if (
        Number(s.quantity) > 0 &&
        whNames.indexOf(String(s.warehouse || "").trim()) !== -1
      ) {
        validIds[String(s.item_id)] = true;
      }
    });

    // Fallback: لو stock فاضي، استخدم pub_qty
    if (!Object.keys(validIds).length) {
      items.forEach(function (it) {
        validIds[String(it.id)] = true;
      });
    }

    return items.filter(function (it) {
      return validIds[String(it.id)];
    });
  }

  // ── المجموعات المتاحة حسب المخازن المختارة ────────────────
  function _csAvailableGroups() {
    var allGroups = APP.data.groups || [];
    var warehouses = APP.data.warehouses || [];

    // لو "الكل" مختار → رجع كل المجموعات
    if (!_CS.selWarehouses.length) return allGroups;

    // ابحث عن أسماء المخازن المختارة (warehouse_id ممكن يكون ID أو اسم)
    var selWhIds = _CS.selWarehouses;
    var selWhNames = selWhIds.map(function (wid) {
      var w = warehouses.find(function (x) {
        return String(x.id) === String(wid);
      });
      return w ? String(w.name).trim() : String(wid).trim();
    });

    // فلتر المجموعات بناءً على warehouse_id مباشرةً
    return allGroups.filter(function (g) {
      var gwid = String(g.warehouse_id || "").trim();
      if (!gwid) return false;
      return selWhIds.indexOf(gwid) !== -1 || selWhNames.indexOf(gwid) !== -1;
    });
  }

  // ── عدد الأصناف التي ستظهر في الكتالوج ────────────────────
  function _csCountItems() {
    var pool = _csItemsInWarehouses(_CS.selWarehouses);
    // فلتر الأصناف المستثناة بالكود
    if (_CS.excludeCodes.length) {
      pool = pool.filter(function (it) {
        var code = String(it.code || it.id || "")
          .trim()
          .toLowerCase();
        return _CS.excludeCodes.indexOf(code) === -1;
      });
    }
    // لو في مجموعات محددة → فلتر بيها
    if (_CS.selGroups.length) {
      pool = pool.filter(function (it) {
        return _CS.selGroups.indexOf(String(it.group)) !== -1;
      });
    } else if (_CS.selWarehouses.length) {
      // لو مخزن مختار بدون تحديد مجموعة → فلتر بالمجموعات المتاحة للمخزن ده
      var available = _csAvailableGroups();
      if (available.length) {
        var availIds = available.map(function (g) {
          return String(g.id);
        });
        pool = pool.filter(function (it) {
          return availIds.indexOf(String(it.group)) !== -1;
        });
      }
    }
    return pool.length;
  }

  // ── إعادة رسم chips المجموعات ──────────────────────────────
  function _csRebuildGroupChips() {
    var container = document.getElementById("cs-grp-chips");
    var hint = document.getElementById("cs-grp-hint");
    var connLine = document.getElementById("cs-conn-line");
    if (!container) return;

    var available = _csAvailableGroups();
    var groups = APP.data.groups || [];
    var items = APP.data.items || [];

    // احسب عدد الأصناف لكل مجموعة
    function countItemsInGroup(gid) {
      return items.filter(function (it) {
        return String(it.group) === String(gid);
      }).length;
    }

    // امسح الاختيارات غير المتاحة
    _CS.selGroups = _CS.selGroups.filter(function (gid) {
      return available.some(function (g) {
        return String(g.id) === gid;
      });
    });

    var allActive = _CS.selGroups.length === 0;

    // خط الربط
    if (connLine) {
      if (_CS.selWarehouses.length && available.length) {
        connLine.classList.add("visible");
      } else {
        connLine.classList.remove("visible");
      }
    }

    var html =
      '<button class="cs-grp-chip' +
      (allActive ? " active" : "") +
      '" data-gid="__all__" style="animation-delay:0ms">الكل</button>';

    available.forEach(function (g, i) {
      var isActive = _CS.selGroups.indexOf(String(g.id)) !== -1;
      var cnt = countItemsInGroup(g.id);
      var delay = i * 35 + "ms";
      html +=
        '<button class="cs-grp-chip' +
        (isActive ? " active" : "") +
        '" data-gid="' +
        esc(String(g.id)) +
        '" style="animation-delay:' +
        delay +
        '">' +
        esc(g.name) +
        (cnt ? '<span class="cs-chip-count">' + cnt + "</span>" : "") +
        "</button>";
    });

    if (!available.length) {
      html =
        '<span style="color:var(--text3);font-size:13px;padding:4px 0"> لا توجد مجموعات في هذا المخزن</span>';
    }

    container.innerHTML = html;

    if (hint) {
      hint.textContent = _CS.selWarehouses.length
        ? available.length
          ? "هتظهر فقط المجموعات الموجودة في المخازن المختارة (" +
            available.length +
            " مجموعة)"
          : "هذا المخزن ليس لديه مجموعات"
        : "اختر المجموعات — لو مش اخترت حاجة هيظهر كل شيء";
    }
  }
  // ── بناء الـ URL ────────────────────────────────────────────
  function _csBuildUrl() {
    if (!_CS.baseUrl) return "";
    // [VERCEL-MIGRATION] لو الصفحة شغالة standalone (برة الـ iframe
    // اللي HtmlService بتاع GAS بيغلّف بيه أي صفحة دايمًا — window.top
    // بيبقى !== window.self جوه GAS حتى لو فتحت رابط الـ exec مباشرة)،
    // يبقى ده نشر Vercel: المسار الصحيح للكتالوج هو /catalog (زي ما
    // معرّف في vercel.json rewrites)، مش ?page=catalog القديمة اللي
    // كانت بتتفهم بس من doGet(e) بتاع Apps Script.
    var isStandalone = window.top === window.self;
    var params = isStandalone ? [] : ["page=catalog"];

    // تحديد المجموعات الفعلية للـ URL
    var effectiveGroups = _CS.selGroups.slice();
    if (!effectiveGroups.length && _CS.selWarehouses.length) {
      // مخزن مختار بدون تحديد مجموعة → ابعت مجموعات المخزن ده فقط
      var available = _csAvailableGroups();
      effectiveGroups = available.map(function (g) {
        return String(g.id);
      });
    }
    if (effectiveGroups.length)
      params.push("groups=" + encodeURIComponent(effectiveGroups.join(",")));

    if (_CS.selWarehouses.length)
      params.push("wh=" + encodeURIComponent(_CS.selWarehouses.join(",")));
    if (!_CS.showPrices) params.push("noprices=1");
    if (_CS.showZero) params.push("showzero=1");
    if (_CS.noQty) params.push("noqty=1");
    if (_CS.excludeCodes.length)
      params.push("exclude=" + encodeURIComponent(_CS.excludeCodes.join(",")));
    if (_CS.clientName)
      params.push("client=" + encodeURIComponent(_CS.clientName));

    var qs = params.length ? "?" + params.join("&") : "";
    if (isStandalone) {
      return _CS.baseUrl.replace(/\/$/, "") + "/catalog" + qs;
    }
    return _CS.baseUrl + qs;
  }

  // ── تحديث المعاينة (اللينك + العداد + الملخص) ─────────────
  function _csUpdatePreview() {
    var linkEl = document.getElementById("cs-link-preview");
    var countEl = document.getElementById("cs-item-count");
    var subEl = document.getElementById("cs-count-sub");
    var summaryEl = document.getElementById("cs-summary");

    var url = _csBuildUrl();
    if (linkEl) linkEl.textContent = url || "—";

    var count = _csCountItems();
    if (countEl) countEl.textContent = count + " صنف سيظهر في الكتالوج";
    if (subEl) {
      var subLines = [];
      if (!_CS.showPrices) subLines.push("الأسعار مخفية");
      if (_CS.showZero) subLines.push("عرض الأصناف المنتهية");
      if (_CS.noQty) subLines.push("الرصيد مخفي");
      subEl.textContent = subLines.join(" · ");
    }

    // ملخص
    if (summaryEl) {
      var warehouses = APP.data.warehouses || [];
      var groups = APP.data.groups || [];
      var lines = [];

      if (_CS.selWarehouses.length) {
        var whNames = _CS.selWarehouses.map(function (wid) {
          var w = warehouses.find(function (x) {
            return String(x.id) === String(wid);
          });
          return w ? w.name : wid;
        });
        lines.push("<b> المخازن:</b> " + whNames.join("، "));
      }
      if (_CS.selGroups.length) {
        var grpNames = _CS.selGroups.map(function (gid) {
          var g = groups.find(function (x) {
            return String(x.id) === String(gid);
          });
          return g ? g.name : gid;
        });
        lines.push("<b> المجموعات:</b> " + grpNames.join("، "));
      }
      if (!_CS.showPrices)
        lines.push(
          '<span style="color:var(--warning)"> الأسعار مخفية</span>',
        );
      if (_CS.showZero)
        lines.push(
          '<span style="color:var(--text2)"> عرض الأصناف المنتهية</span>',
        );
      if (_CS.noQty)
        lines.push(
          '<span style="color:var(--text2)"> الرصيد مخفي عن العميل</span>',
        );
      if (_CS.excludeCodes.length)
        lines.push(
          '<span style="color:#991b1b"> مستثنى: ' +
            _CS.excludeCodes
              .map(function (c) {
                return c.toUpperCase();
              })
              .join("، ") +
            "</span>",
        );

      summaryEl.innerHTML = lines.length
        ? '<div style="background:var(--surface2);border-radius:8px;padding:10px 12px;' +
          'font-size:11px;color:var(--text2);display:flex;flex-direction:column;gap:5px">' +
          lines
            .map(function (l) {
              return "<div>" + l + "</div>";
            })
            .join("") +
          "</div>"
        : "";

      // tags معاينة
      var tagsEl = document.getElementById("cs-preview-tags");
      if (tagsEl) {
        var tagHtml = "";
        if (_CS.selWarehouses.length) {
          _CS.selWarehouses.forEach(function (wid) {
            var w = (APP.data.warehouses || []).find(function (x) {
              return String(x.id) === wid;
            });
            if (w)
              tagHtml +=
                '<span class="cs-preview-tag" style="border-color:#93c5fd;background:var(--primary-soft);color:var(--accent)"> ' +
                esc(w.name) +
                "</span>";
          });
        }
        if (_CS.selGroups.length) {
          _CS.selGroups.forEach(function (gid) {
            var g = (APP.data.groups || []).find(function (x) {
              return String(x.id) === gid;
            });
            if (g)
              tagHtml +=
                '<span class="cs-preview-tag" style="border-color:#86efac;color:#15803d"> ' +
                esc(g.name) +
                "</span>";
          });
        }
        tagsEl.innerHTML = tagHtml;
      }
    }
  }

  // ── الدالة الرئيسية للربط ──────────────────────────────────
  function bindCatalogSend() {
    // reset
    _CS.selWarehouses = [];
    _CS.selGroups = [];
    _CS.showPrices = true;
    _CS.showZero = false;
    _CS.noQty = false;
    _CS.excludeCodes = [];
    _CS.clientName = "";
    _CS.baseUrl = "";

    // جلب الـ base URL
    // [VERCEL-MIGRATION] لو standalone (برة GAS iframe)، الدومين
    // الصحيح هو window.location.origin نفسه (دومين Vercel) — نداء
    // الباك اند getScriptUrl() هيرجّع رابط الـ /exec القديم بالغلط،
    // فمش محتاجينه أصلًا في الحالة دي (وبنوفر رحلة شبكة كمان).
    if (window.top === window.self) {
      _CS.baseUrl = window.location.origin;
      _csUpdatePreview();
    } else {
      _gsr("getScriptUrl", [], {
        onSuccess: function (url) {
          _CS.baseUrl = url || "";
          _csUpdatePreview();
        },
        onError: function () {
          _CS.baseUrl = window.location.href.split("?")[0];
          _csUpdatePreview();
        },
      });
    }

    // ابن chips المجموعات الأولية (كل المجموعات)
    _csRebuildGroupChips();

    // ── اسم العميل
    var nameEl = document.getElementById("cs-client-name");
    if (nameEl)
      nameEl.addEventListener("input", function () {
        _CS.clientName = this.value.trim();
      });

    // ── chips المخازن — بطاقات تفاعلية
    var whWrap = document.getElementById("cs-wh-chips");
    var whAllBtn = document.getElementById("cs-wh-all");

    if (whAllBtn) {
      whAllBtn.addEventListener("click", function () {
        _CS.selWarehouses = [];
        if (whWrap)
          whWrap.querySelectorAll(".cs-wh-card").forEach(function (c) {
            c.classList.remove("active");
          });
        whAllBtn.classList.add("active");
        _csRebuildGroupChips();
        _csUpdatePreview();
      });
    }

    if (whWrap) {
      whWrap.addEventListener("click", function (e) {
        var card = e.target.closest(".cs-wh-card");
        if (!card) return;
        var wid = card.dataset.wid;
        if (whAllBtn) whAllBtn.classList.remove("active");

        var idx = _CS.selWarehouses.indexOf(wid);
        if (idx === -1) {
          _CS.selWarehouses.push(wid);
          card.classList.add("active");
        } else {
          _CS.selWarehouses.splice(idx, 1);
          card.classList.remove("active");
        }

        if (!_CS.selWarehouses.length && whAllBtn)
          whAllBtn.classList.add("active");

        _csRebuildGroupChips();
        _csUpdatePreview();
      });
    }

    // ── chips المجموعات (event delegation — بتتبنى ديناميكياً)
    var grpWrap = document.getElementById("cs-grp-chips");
    if (grpWrap) {
      grpWrap.addEventListener("click", function (e) {
        var chip = e.target.closest(".cs-grp-chip");
        if (!chip) return;
        var gid = chip.dataset.gid;

        if (gid === "__all__") {
          _CS.selGroups = [];
          grpWrap.querySelectorAll(".cs-grp-chip").forEach(function (c) {
            c.classList.toggle("active", c.dataset.gid === "__all__");
          });
        } else {
          var allBtn = grpWrap.querySelector('[data-gid="__all__"]');
          if (allBtn) allBtn.classList.remove("active");

          var idx = _CS.selGroups.indexOf(gid);
          if (idx === -1) {
            _CS.selGroups.push(gid);
            chip.classList.add("active");
          } else {
            _CS.selGroups.splice(idx, 1);
            chip.classList.remove("active");
          }

          if (!_CS.selGroups.length) {
            if (allBtn) allBtn.classList.add("active");
          }
        }
        _csUpdatePreview();
      });
    }

    // ── toggle الأسعار
    var priceChk = document.getElementById("cs-show-prices");
    if (priceChk)
      priceChk.addEventListener("change", function () {
        _CS.showPrices = this.checked;
        _csUpdatePreview();
      });

    // ── عرض الأصناف رصيدها صفر
    var showZeroChk = document.getElementById("cs-show-zero");
    if (showZeroChk)
      showZeroChk.addEventListener("change", function () {
        _CS.showZero = this.checked;
        _csUpdatePreview();
      });

    // ── إخفاء الرصيد عن العميل
    var noQtyChk = document.getElementById("cs-no-qty");
    if (noQtyChk)
      noQtyChk.addEventListener("change", function () {
        _CS.noQty = this.checked;
        _csUpdatePreview();
      });

    // ── نسخ اللينك
    var copyBtn = document.getElementById("cs-copy-btn");
    if (copyBtn)
      copyBtn.addEventListener("click", function () {
        var url =
          (document.getElementById("cs-link-preview") || {}).textContent || "";
        if (!url || url === "—") {
          NotificationEngine.warning("لا يوجد لينك للنسخ");
          return;
        }
        navigator.clipboard
          .writeText(url)
          .then(function () {
            NotificationEngine.success(" تم نسخ اللينك");
          })
          .catch(function () {
            NotificationEngine.error("تعذّر النسخ");
          });
      });

    // ── إرسال واتساب (موحّد عبر موديول الواتساب المركزي — قوالب + تسجيل) ──
    var waBtn = document.getElementById("cs-wa-btn");
    if (waBtn)
      waBtn.addEventListener("click", function () {
        var url =
          (document.getElementById("cs-link-preview") || {}).textContent || "";
        if (!url || url === "—") {
          NotificationEngine.warning("اختر مخزن أو مجموعة أولاً");
          return;
        }
        var name = _CS.clientName || "العميل";
        if (typeof sendCatalogShareLink === "function") {
          sendCatalogShareLink(name, url, "");
        } else {
          // مسار احتياطي فقط في حال عدم تحميل موديول الواتساب لأي سبب
          var msg =
            "أهلاً " +
            name +
            " \n\n" +
            "تفضل كتالوج المنتجات المخصص لك:\n\n" +
            url +
            "\n\nنتشرف بخدمتك ";
          window.open(
            "https://wa.me/?text=" + encodeURIComponent(msg),
            "_blank",
          );
        }
      });

    // ── استثناء أصناف بالكود ──────────────────────────────────
    (function () {
      var tagWrap = document.getElementById("cs-exclude-tags");
      var inputEl = document.getElementById("cs-exclude-input");
      var addBtn = document.getElementById("cs-exclude-add");
      var dropEl = document.getElementById("cs-exclude-dropdown");
      if (!inputEl || !tagWrap || !addBtn) return;

      function _parseCode(raw) {
        return raw.trim().toLowerCase();
      }

      function _renderTags() {
        tagWrap.innerHTML = _CS.excludeCodes
          .map(function (code) {
            return (
              '<span class="cs-excl-tag">' +
              esc(code.toUpperCase()) +
              '<button class="cs-excl-rm" data-code="' +
              esc(code) +
              '" title="إزالة">×</button>' +
              "</span>"
            );
          })
          .join("");
        _csUpdatePreview();
      }

      // ── بناء الـ dropdown من البحث ──────────────────────────
      function _buildDropdown(q) {
        if (!dropEl) return;
        q = (q || "").trim().toLowerCase();
        if (!q) {
          dropEl.style.display = "none";
          return;
        }

        var allItems = APP.data.items || [];
        var filtered = allItems
          .filter(function (it) {
            var name = String(it.name || "").toLowerCase();
            var code = String(it.code || it.id || "").toLowerCase();
            return name.includes(q) || code.includes(q);
          })
          .slice(0, 30);

        if (!filtered.length) {
          dropEl.innerHTML =
            '<div style="padding:10px 14px;font-size:12px;color:var(--text3)">لا توجد نتائج</div>';
          dropEl.style.display = "block";
          return;
        }

        dropEl.innerHTML = filtered
          .map(function (it) {
            var code = String(it.code || it.id || "");
            var alreadyAdded =
              _CS.excludeCodes.indexOf(code.toLowerCase()) !== -1;
            return (
              '<div class="cs-excl-opt" data-code="' +
              esc(code.toLowerCase()) +
              '" ' +
              'style="display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;' +
              "font-size:13px;border-bottom:1px solid var(--border);gap:10px;" +
              (alreadyAdded ? "opacity:.45;pointer-events:none;" : "") +
              '">' +
              '<span style="font-weight:600;color:var(--text1)">' +
              esc(it.name) +
              "</span>" +
              '<span style="font-size:11px;color:var(--text3);font-family:monospace;flex-shrink:0">' +
              esc(code) +
              "</span>" +
              "</div>"
            );
          })
          .join("");
        dropEl.style.display = "block";
      }

      function _addByCode(code) {
        code = _parseCode(code);
        if (!code) return;
        var found = (APP.data.items || []).find(function (it) {
          return (
            String(it.code || it.id || "")
              .trim()
              .toLowerCase() === code
          );
        });
        if (!found) {
          NotificationEngine.warning(" الكود " + code.toUpperCase() + " غير موجود");
          return;
        }
        if (_CS.excludeCodes.indexOf(code) === -1) {
          _CS.excludeCodes.push(code);
        }
        inputEl.value = "";
        dropEl.style.display = "none";
        _renderTags();
      }

      function _addCode(raw) {
        var codes = raw
          .split(/[,،\s]+/)
          .map(_parseCode)
          .filter(Boolean);
        codes.forEach(function (c) {
          _addByCode(c);
        });
      }

      // input → فلتر dropdown
      inputEl.addEventListener("input", function () {
        _buildDropdown(this.value);
      });

      inputEl.addEventListener("focus", function () {
        if (this.value.trim()) _buildDropdown(this.value);
      });

      // اختيار من الـ dropdown
      dropEl.addEventListener("mousedown", function (e) {
        var opt = e.target.closest(".cs-excl-opt");
        if (!opt) return;
        e.preventDefault();
        _addByCode(opt.dataset.code);
      });

      // إغلاق الـ dropdown لما يضغط برا
      document.addEventListener("click", function (e) {
        if (!inputEl.contains(e.target) && !dropEl.contains(e.target)) {
          dropEl.style.display = "none";
        }
      });

      addBtn.addEventListener("click", function () {
        _addCode(inputEl.value);
      });

      inputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === ",") {
          e.preventDefault();
          _addCode(inputEl.value);
        }
        if (e.key === "Escape") {
          dropEl.style.display = "none";
        }
      });

      tagWrap.addEventListener("click", function (e) {
        var btn = e.target.closest(".cs-excl-rm");
        if (!btn) return;
        var code = btn.dataset.code;
        _CS.excludeCodes = _CS.excludeCodes.filter(function (c) {
          return c !== code;
        });
        _renderTags();
      });
    })();

    _csUpdatePreview();
  }

  var AUDIT_STATE = {
    data: [], // البيانات المحمّلة
    filtered: [], // البيانات بعد الفلترة
    page: 1,
    // [إصلاح — ربط items_per_page] كانت 50 قيمة ثابتة يدويًا بدون أي علاقة
    // بتفضيل المستخدم. تُقرأ الآن من PreferenceService عند توفره (نفس نمط
    // الربط في 04_JS_Transactions.html و12_JS_HR.html).
    pageSize:
      typeof PreferenceService !== "undefined"
        ? PreferenceService.get("items_per_page", 50)
        : 50,
    loading: false,
    lastLoaded: 0, // FIX: وقت آخر تحميل (ms) للـ cache
    CACHE_TTL: 30000, // FIX: 30 ثانية كاش
  };

  // اشتراك: أي تغيير لاحق في items_per_page يعيد رسم الصفحة الحالية فورًا
  // لو شاشة سجل الأحداث مفتوحة وقت التغيير، بدون طلب جديد من السيرفر.
  if (typeof PreferenceService !== "undefined") {
    PreferenceService.subscribe("items_per_page", function (val) {
      AUDIT_STATE.pageSize = val || 50;
      AUDIT_STATE.page = 1;
      if (AUDIT_STATE.filtered && AUDIT_STATE.filtered.length) {
        _renderAuditTable(AUDIT_STATE.filtered);
      }
    });
  }
