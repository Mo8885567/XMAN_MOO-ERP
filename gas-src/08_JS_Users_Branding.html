<script>
  // ───────────────────────────────────────────────────────────────
  // JS_Users_Branding.html — جزء 8/10 من JavaScript.html الأصلي
  // النطاق الأصلي: سطر 21883–23877 | المستخدمين وسجل العمليات + الصلاحيات (PM) + العلامة التجارية
  // ───────────────────────────────────────────────────────────────

  //  [TAB-ENGINE / المرحلة 7: Lazy Tabs] التبديل بين تابات شاشة
  //  المستخدمين (المستخدمون / سجل العمليات / الصلاحيات / التخزين)
  // ─────────────────────────────────────────────────────────────
  //  قبل كده كل تاب كان بيتحمّل بمنطق يدوي مكرر (فحص state.length،
  //  استدعاء loader، إلخ) داخل switchUsersTab نفسها. دلوقتي TabEngine
  //  هو المسؤول عن: "لا تحمّل أي تاب غير المفتوح فعليًا، ولا تعيد تحميل
  //  تاب اتحمّل قبل كده" — واحنا سايبين بس منطق العرض (الألوان/الإظهار)
  //  ومنطق التحميل الفعلي (loadAuditLog/bindPermissionsPage/loadStorageStats)
  //  زي ما هو، لأنه أصلاً عنده كاش داخلي بالـ TTL — TabEngine بيمنع
  //  تكرار *نداء* هذه الدوال، مش بديل عن الكاش الداخلي بتاعها.
  //  _usersTabEngine بيتبنى مرة واحدة من bindUsers() تحت.
  // ─────────────────────────────────────────────────────────────
  var _usersTabEngine = null;

  function _usersTabVisuals(tab) {
    // تحديث أزرار التبويب (الألوان/الحدود) — التصميم الحالي inline style
    // مش class-based، فسايبينها هنا بدل ما نعتمد على activeClass بتاع
    // TabEngine (اللي بيضيف/يشيل class فقط)
    document.querySelectorAll(".users-tab").forEach(function (btn) {
      var isActive = btn.dataset.tab === tab;
      btn.style.color = isActive ? "var(--accent)" : "var(--text2)";
      btn.style.borderBottom = isActive
        ? "2.5px solid var(--accent)"
        : "2.5px solid transparent";
    });

    // إظهار/إخفاء زر إضافة مستخدم حسب التبويب النشط
    var addBtn = document.getElementById("btn-add-user");
    if (addBtn) addBtn.style.display = tab === "users" ? "" : "none";

    // تحديث لوحات المحتوى
    ["users", "audit", "permissions", "storage"].forEach(function (t) {
      var pane = document.getElementById("users-tab-" + t);
      if (pane) pane.style.display = t === tab ? "" : "none";
    });

    // ربط فلاتر المستخدمين عند فتح تبويبهم (بيتنفذ في كل مرة، مش تحميل بيانات)
    if (tab === "users") {
      _bindUsersFilters();
    }
  }

  // للتوافق الرجعي لو فيه أي استدعاء قديم لـ switchUsersTab من مكان تاني
  function switchUsersTab(tab) {
    var btn = document.querySelector(
      '.users-tab[data-tab="' + tab + '"]',
    );
    if (btn) btn.click();
  }

  // ─────────────────────────────────────────────────────────────
  //  bindUsers — تُستدعى بعد render للصفحة
  // ─────────────────────────────────────────────────────────────
  function bindUsers() {
    // [COLUMN-ENGINE] عرض جدول المستخدمين عبر ColumnEngine (كان جدولًا ثابتًا)
    _renderUsersTable(APP.data.users || []);

    // زر تحديث البيانات
    var refreshBtn = document.getElementById("btn-refresh-users");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", function () {
        reloadAfterMutationFull(null, null, {
          title: "جاري تحديث البيانات...",
          emoji: "",
          successMsg: " تم تحديث البيانات",
        });
      });
    }

    // زر إضافة مستخدم
    var addBtn = document.getElementById("btn-add-user");
    if (addBtn)
      addBtn.addEventListener("click", function () {
        openUserModal(null);
      });

    // فلاتر المستخدمين
    _bindUsersFilters();

    // [TAB-ENGINE / المرحلة 7] تفعيل التابات — لازم destroy للـ instance
    // القديمة الأول لو الشاشة اتعاد رسمها (منع تسريب Listeners)
    if (_usersTabEngine) {
      _usersTabEngine.destroy();
      _usersTabEngine = null;
    }
    _usersTabEngine = TabEngine.init({
      tabSelector: ".users-tab",
      panelPrefix: "users-tab-",
      activeClass: "active",
      recordId: "users-branding-screen", // شاشة واحدة ثابتة، مفيش سجلات متعددة
      defaultTab: "users",
      loaders: {
        audit: function (recordId, done) {
          loadAuditLog();
          done();
        },
        permissions: function (recordId, done) {
          bindPermissionsPage();
          done();
        },
        storage: function (recordId, done) {
          loadStorageStats();
          done();
        },
      },
      onSwitch: _usersTabVisuals,
    });
    // نداء أول مرة عشان نظبط شكل التاب الافتراضي (المستخدمون) فور الرسم
    _usersTabVisuals("users");

    // [FIX-SelectionEngine] فلاتر سجل العمليات موجودة في نفس الصفحة
    // (مخفية حتى فتح تبويب "سجل العمليات") — ترقيتها هنا مرة واحدة كفاية
    if (window.AppSelect) {
      AppSelect.upgrade("audit-user-filter", {
        icon: "ti-user",
        placeholder: "كل المستخدمين",
      });
      AppSelect.upgrade("audit-action-filter", {
        icon: "ti-list-details",
        placeholder: "كل العمليات",
      });
    }
  }

  function _bindUsersFilters() {
    var searchEl = document.getElementById("users-search");
    var roleEl = document.getElementById("users-role-filter");
    if (searchEl) searchEl.addEventListener("input", _filterUsersTable);
    if (roleEl) roleEl.addEventListener("change", _filterUsersTable);

    if (window.AppSelect) {
      AppSelect.upgrade("users-role-filter", {
        icon: "ti-shield",
        placeholder: "كل الأدوار",
      });
    }
  }

  // [COLUMN-ENGINE] الفلترة أصبحت على مستوى البيانات (بدل إخفاء صفوف DOM
  // يدويًا) ثم إعادة عرضها عبر _renderUsersTable — نفس أسلوب الموظفين في
  // 12_JS_HR.html. ملاحظة: خانة البحث هنا فلتر إضافي (اسم/يوزر فقط)؛
  // ColumnEngine نفسه عنده صندوق بحث عام داخل شريط أدوات الجدول.
  function _filterUsersTable() {
    var q = (
      (document.getElementById("users-search") || {}).value || ""
    ).toLowerCase();
    var role = (document.getElementById("users-role-filter") || {}).value || "";
    var rows = (APP.data.users || []).filter(function (u) {
      var matchQ =
        !q ||
        (u.full_name || "").toLowerCase().indexOf(q) !== -1 ||
        (u.username || "").toLowerCase().indexOf(q) !== -1;
      var matchR = !role || u.role === role;
      return matchQ && matchR;
    });
    _renderUsersTable(rows);
  }

  // ─────────────────────────────────────────────────────────────
  //  loadAuditLog — تحميل البيانات من الباك إند
  // ─────────────────────────────────────────────────────────────
  function loadAuditLog(forceRefresh) {
    if (!canDo("viewAuditLog")) return;

    // FIX: كاش 30 ثانية — لو البيانات موجودة وحديثة وما في فلتر نشط → اعرض مباشرة بدون طلب
    var filters = _getAuditFilters();
    var hasActiveFilter =
      filters.user ||
      filters.action ||
      filters.table ||
      filters.dateFrom ||
      filters.dateTo ||
      filters.search;
    var cacheAge = Date.now() - AUDIT_STATE.lastLoaded;
    if (
      !forceRefresh &&
      !hasActiveFilter &&
      AUDIT_STATE.data.length > 0 &&
      cacheAge < AUDIT_STATE.CACHE_TTL
    ) {
      _renderAuditTable(AUDIT_STATE.data);
      return;
    }

    if (AUDIT_STATE.loading) return; // FIX: امنع طلبين متزامنين
    AUDIT_STATE.loading = true;

    var refreshBtn = document.getElementById("audit-refresh-btn");
    if (refreshBtn) {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "⏳ جاري التحميل...";
    }

    _gsr("getAuditLog", [100, filters], {
      label: "getAuditLog",
      rawResponse: true,
      onSuccess: function (r) {
        var res = r && r.data;
        AUDIT_STATE.loading = false;
        AUDIT_STATE.lastLoaded = Date.now(); // FIX: سجّل وقت التحميل
        if (refreshBtn) {
          refreshBtn.disabled = false;
          refreshBtn.textContent = " تحديث";
        }
        AUDIT_STATE.data = res.data || [];
        AUDIT_STATE.filtered = AUDIT_STATE.data;
        AUDIT_STATE.page = 1;
        _updateAuditStats(res.stats || {}, res.total || 0);
        _renderAuditTable(AUDIT_STATE.data);
      },
      onError: function (r) {
        AUDIT_STATE.loading = false;
        if (refreshBtn) {
          refreshBtn.disabled = false;
          refreshBtn.textContent = " تحديث";
        }
        NotificationEngine.error("فشل تحميل السجل: " + r.message);
      },
    }); // FIX: قلّل من 300 → 100 سجل في كل طلب
  }

  // ─────────────────────────────────────────────────────────────
  // [PHASE-5] لوحة إحصائيات مساحة التخزين — تستدعي
  // getDocumentEngineStorageStats() (DocumentEngine.getStorageStats)
  // وتعرض النتيجة في تبويب "مساحة التخزين". كاش 60 ثانية زي سجل
  // العمليات، مع زر تحديث يدوي يتجاوز الكاش.
  // ─────────────────────────────────────────────────────────────
  var STORAGE_STATS_STATE = { data: null, loading: false, lastLoaded: 0, CACHE_TTL: 60000 };

  var STORAGE_MODULE_LABELS = {
    customer: "العملاء",
    supplier: "الموردون",
    party: "أطراف (قديم)",
    item: "الأصناف",
    production: "الإنتاج",
  };

  function loadStorageStats(forceRefresh) {
    var content = document.getElementById("storage-stats-content");
    if (!content) return;

    var cacheAge = Date.now() - STORAGE_STATS_STATE.lastLoaded;
    if (!forceRefresh && STORAGE_STATS_STATE.data && cacheAge < STORAGE_STATS_STATE.CACHE_TTL) {
      _renderStorageStats(STORAGE_STATS_STATE.data);
      return;
    }
    if (STORAGE_STATS_STATE.loading) return;
    STORAGE_STATS_STATE.loading = true;

    if (!forceRefresh || !STORAGE_STATS_STATE.data) {
      content.innerHTML =
        '<div style="text-align:center;padding:40px;color:var(--text2)">' +
        "<i class='ti ti-loader-2' style='font-size:22px'></i> جاري تحميل إحصائيات المساحة..." +
        "</div>";
    }

    _gsr("getDocumentEngineStorageStats", [], {
      label: "getDocumentEngineStorageStats",
      rawResponse: true,
      onSuccess: function (r) {
        STORAGE_STATS_STATE.loading = false;
        var res = r && r.data;
        if (!res || !res.success) {
          content.innerHTML =
            '<div style="text-align:center;padding:30px;color:var(--danger)">' +
            "تعذّر تحميل إحصائيات المساحة" +
            (res && res.error ? ": " + res.error : "") +
            "</div>";
          return;
        }
        STORAGE_STATS_STATE.data = res;
        STORAGE_STATS_STATE.lastLoaded = Date.now();
        _renderStorageStats(res);
      },
      onError: function (r) {
        STORAGE_STATS_STATE.loading = false;
        content.innerHTML =
          '<div style="text-align:center;padding:30px;color:var(--danger)">' +
          "فشل تحميل إحصائيات المساحة: " +
          r.message +
          "</div>";
      },
    });
  }

  function _storageBreakdownTable(title, byGroup, labelMap) {
    var keys = Object.keys(byGroup || {}).sort(function (a, b) {
      return byGroup[b].bytes - byGroup[a].bytes;
    });
    if (!keys.length) return "";
    var rows = keys
      .map(function (k) {
        var g = byGroup[k];
        var label = (labelMap && labelMap[k]) || k;
        var mb = Math.round((g.bytes / (1024 * 1024)) * 100) / 100;
        return (
          "<tr>" +
          '<td style="padding:8px 10px;border-bottom:1px solid var(--border)">' + label + "</td>" +
          '<td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center">' + g.count + "</td>" +
          '<td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center">' + mb + " MB</td>" +
          "</tr>"
        );
      })
      .join("");
    return (
      '<div style="margin-top:18px">' +
      '<h4 style="margin:0 0 8px;font-size:13px;color:var(--text2)">' + title + "</h4>" +
      '<table style="width:100%;border-collapse:collapse;font-size:12.5px">' +
      '<thead><tr style="background:var(--bg2)">' +
      '<th style="padding:8px 10px;text-align:right">التصنيف</th>' +
      '<th style="padding:8px 10px;text-align:center">عدد الملفات</th>' +
      '<th style="padding:8px 10px;text-align:center">الحجم</th>' +
      "</tr></thead><tbody>" +
      rows +
      "</tbody></table></div>"
    );
  }

  function _renderStorageStats(res) {
    var content = document.getElementById("storage-stats-content");
    if (!content) return;

    var cards =
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:10px">' +
      _auditStatCard("ti-files", "إجمالي الملفات", res.totalFiles, "#6366f1") +
      _auditStatCard("ti-database", "إجمالي المساحة", res.totalMB + " MB", "#10b981") +
      _auditStatCard("ti-archive", "ملفات مؤرشفة", res.archivedFiles, "#f59e0b") +
      _auditStatCard("ti-photo-cog", "ملفات مضغوطة", res.compressedFiles, "#0ea5e9") +
      "</div>";

    var refreshBtn =
      '<div style="text-align:left;margin-bottom:6px">' +
      '<button class="btn btn-secondary btn-sm" onclick="loadStorageStats(true)" id="storage-refresh-btn">' +
      "<i class='ti ti-refresh' style='font-size:14px'></i> تحديث</button></div>";

    var byModule = _storageBreakdownTable(
      "حسب الوحدة",
      res.byModule,
      STORAGE_MODULE_LABELS,
    );
    var byDocType = _storageBreakdownTable("حسب نوع المستند", res.byDocType, null);

    content.innerHTML = refreshBtn + cards + byModule + byDocType;
  }

  // ─── جمع قيم الفلاتر ──────────────────────────────────────────
  function _getAuditFilters() {
    var search = (document.getElementById("audit-search") || {}).value || "";
    var user = (document.getElementById("audit-user-filter") || {}).value || "";
    var action =
      (document.getElementById("audit-action-filter") || {}).value || "";
    var table =
      (document.getElementById("audit-table-filter") || {}).value || "";
    var dateFrom =
      (document.getElementById("audit-date-from") || {}).value || "";
    var dateTo = (document.getElementById("audit-date-to") || {}).value || "";
    return {
      search: search,
      user: user,
      action: action,
      table: table,
      dateFrom: dateFrom,
      dateTo: dateTo,
    };
  }

  // ─── تطبيق الفلاتر (يُعيد fetch من السيرفر) ─────────────────
  function applyAuditFilters() {
    AUDIT_STATE.data = [];
    AUDIT_STATE.lastLoaded = 0; // FIX: إعادة تعيين الكاش عند تطبيق فلتر
    loadAuditLog(true);
  }

  // ─── إعادة تعيين الفلاتر ─────────────────────────────────────
  function resetAuditFilters() {
    [
      "audit-search",
      "audit-user-filter",
      "audit-action-filter",
      "audit-table-filter",
      "audit-date-from",
      "audit-date-to",
    ].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = "";
    });
    AUDIT_STATE.lastLoaded = 0; // FIX: إعادة تعيين الكاش عند إعادة التعيين
    loadAuditLog(true);
  }

  // ─────────────────────────────────────────────────────────────
  //  _updateAuditStats — تحديث بطاقات الإحصاء
  // ─────────────────────────────────────────────────────────────
  function _updateAuditStats(stats, total) {
    var statsRow = document.getElementById("audit-stats-row");
    if (!statsRow) return;

    var byAction = stats.byAction || {};
    var addCount = 0,
      updateCount = 0,
      deleteCount = 0;
    Object.keys(byAction).forEach(function (key) {
      if (key === "ADD") addCount = byAction[key];
      else if (key === "UPDATE") updateCount = byAction[key];
      else if (key === "DELETE") deleteCount = byAction[key];
    });

    statsRow.innerHTML =
      _auditStatCard("", "إجمالي العمليات", total, "#6366f1") +
      _auditStatCard("", "إضافات", addCount, "#10b981") +
      _auditStatCard("", "تعديلات", updateCount, "#f59e0b") +
      _auditStatCard("", "حذف", deleteCount, "#ef4444");
  }

  function _auditStatCard(icon, label, value, color) {
    return (
      '<div style="background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;' +
      "display:flex;align-items:center;gap:10px;border-top:3px solid " +
      color +
      '">' +
      '<div style="width:38px;height:38px;border-radius:10px;background:' +
      color +
      "22;" +
      'display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">' +
      icon +
      "</div>" +
      "<div>" +
      '<div style="font-size:20px;font-weight:800;color:' +
      color +
      '">' +
      value +
      "</div>" +
      '<div style="font-size:11px;color:var(--text3);font-weight:500">' +
      label +
      "</div>" +
      "</div></div>"
    );
  }

  // ─────────────────────────────────────────────────────────────
  //  _renderAuditTable — عرض جدول السجل
  // ─────────────────────────────────────────────────────────────
  // FIX: تحوّل username → full_name للعرض في جدول السجل (للسجلات القديمة)
  function _getAuditDisplayName(username) {
    if (!username || username === "SYSTEM" || username === "SCHEDULED_TRIGGER")
      return username || "—";
    var users = (APP.data && APP.data.users) || [];
    var found = users.find(function (u) {
      return (
        String(u.username || "").toLowerCase() ===
        String(username).toLowerCase()
      );
    });
    return found && found.full_name && found.full_name.trim()
      ? found.full_name.trim()
      : username;
  }

  // [COLUMN-ENGINE] جدول سجل الأحداث بقى معتمد على ColumnEngine (نفس نمط
  // المخازن/الأصناف/المقاسات) بدل جدول HTML ثابت. الـ Pagination بتاعت
  // الشاشة (AUDIT_STATE.page/pageSize) اتسابت زي ما هي — بنعمل slice
  // للصفحة الحالية قبل ما نمررها لـ ColumnEngine.renderTable، ونرسم
  // شريط التنقّل تحت الجدول بنفس الطريقة القديمة.
  var _auditColumnsRegistered = false;

  function _auditRegisterColumns() {
    if (_auditColumnsRegistered) return;
    _auditColumnsRegistered = true;
    ColumnEngine.register(
      "audit_log",
      [
        {
          key: "timestamp",
          label: "الوقت",
          type: "text",
          width: 150,
          format: function (v) {
            return (
              '<span class="mono" style="font-size:11px;color:var(--text3);white-space:nowrap">' +
              fmtDate(v) +
              "</span>"
            );
          },
        },
        {
          key: "user",
          label: "المستخدم",
          type: "text",
          width: 140,
          format: function (v, row) {
            var displayUser = _getAuditDisplayName(row.user);
            return (
              '<div style="display:inline-flex;align-items:center;gap:7px;justify-content:center">' +
              '<div style="width:26px;height:26px;border-radius:50%;background:' +
              _userAvatarColor(String(displayUser || "?")) +
              ';color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">' +
              (String(displayUser || "?")[0] || "?").toUpperCase() +
              "</div>" +
              '<span style="font-size:12px;font-weight:600;color:var(--text)" title="' +
              esc(row.user || "") +
              '">' +
              esc(displayUser || "—") +
              "</span></div>"
            );
          },
        },
        {
          key: "action",
          label: "العملية",
          type: "text",
          width: 200,
          format: function (v) {
            var rawAction = String(v || "");
            var actionKey = rawAction.split("_")[0].split(":")[0].toUpperCase();
            var meta = AUDIT_ACTION_MAP[actionKey] || {
              icon: "",
              label: rawAction,
              color: "#64748b",
              bg: "#f8fafc",
            };
            return (
              '<div style="display:inline-flex;align-items:center;gap:5px;background:' +
              meta.bg +
              ";color:" +
              meta.color +
              ";padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid " +
              meta.color +
              "33" +
              '">' +
              meta.icon +
              " " +
              esc(rawAction) +
              "</div>"
            );
          },
        },
        {
          key: "table",
          label: "الجدول",
          type: "text",
          width: 140,
          format: function (v) {
            return AUDIT_TABLE_LABELS[String(v || "")] || esc(v || "—");
          },
        },
        {
          key: "record_id",
          label: "المعرف",
          type: "text",
          width: 120,
          format: function (v) {
            return (
              '<span class="mono" style="font-size:11px;color:var(--accent)">' +
              esc(v || "—") +
              "</span>"
            );
          },
        },
        {
          key: "details",
          label: "التفاصيل",
          type: "text",
          format: function (v) {
            var details = String(v || "—");
            return details.length > 50
              ? '<span title="' +
                  esc(details) +
                  '" style="cursor:help">' +
                  esc(details.substring(0, 50)) +
                  "…</span>"
              : esc(details);
          },
        },
        // [COLUMN-ENGINE-FULL-FIELDS] حقول موجودة فعليًا في AUDIT_HEADERS
        // (Code_12_Core.gs) ولم تكن معروضة كأعمدة اختيارية.
        {
          key: "ip",
          label: "عنوان IP",

  function _renderAuditTable(data) {
    var el = document.getElementById("audit-log-content");
    if (!el) return;

    AUDIT_STATE.filtered = data || [];

    if (!data || !data.length) {
      el.innerHTML =
        '<div class="empty-state" style="padding:50px;text-align:center">' +
        '<div class="empty-icon" style="font-size:52px;color:var(--text3)"><i class="ti ti-clipboard-list" style="font-size:52px"></i></div>' +
        "<p>لا توجد عمليات تطابق البحث</p>" +
        "</div>";
      return;
    }

    var pageSize = AUDIT_STATE.pageSize || 50;
    var totalPages = Math.max(1, Math.ceil(data.length / pageSize));
    if (AUDIT_STATE.page > totalPages) AUDIT_STATE.page = totalPages;
    if (AUDIT_STATE.page < 1) AUDIT_STATE.page = 1;
    var startIdx = (AUDIT_STATE.page - 1) * pageSize;
    var pageData = data.slice(startIdx, startIdx + pageSize);
    var total = data.length;

    el.innerHTML = '<div id="audit-log-ce-container"></div>';
    _auditRegisterColumns();
    ColumnEngine.renderTable(
      "audit_log",
      document.getElementById("audit-log-ce-container"),
      pageData,
    );

    var footer = document.createElement("div");
    footer.style.cssText =
      "display:flex;justify-content:space-between;align-items:center;padding:12px 4px 0;flex-wrap:wrap;gap:8px";
    footer.innerHTML =
      '<span style="font-size:11px;color:var(--text3)">يعرض <b>' +
      pageData.length +
      "</b> من أصل <b>" +
      total +
      "</b> عملية</span>" +
      _auditPaginationHtml(AUDIT_STATE.page, totalPages) +
      '<span style="font-size:11px;color:var(--text3)">آخر تحديث: ' +
      fmtDate(new Date().toISOString()) +
      "</span>";
    el.appendChild(footer);
  }

  // ─── أزرار التنقل بين صفحات سجل الأحداث ─────────────────────
  function _auditPaginationHtml(page, totalPages) {
    if (totalPages <= 1) return "";
    return (
      '<div style="display:flex;align-items:center;gap:8px">' +
      '<button type="button" class="btn btn-sm" ' +
      (page <= 1 ? "disabled" : "") +
      ' onclick="_goAuditPage(-1)" style="padding:4px 10px;font-size:11px">‹ السابق</button>' +
      '<span style="font-size:11px;color:var(--text3)">صفحة ' +
      page +
      " من " +
      totalPages +
      "</span>" +
      '<button type="button" class="btn btn-sm" ' +
      (page >= totalPages ? "disabled" : "") +
      ' onclick="_goAuditPage(1)" style="padding:4px 10px;font-size:11px">التالي ›</button>' +
      "</div>"
    );
  }

  // ─── الانتقال لصفحة تالية/سابقة بدون إعادة طلب من السيرفر ───
  function _goAuditPage(delta) {
    AUDIT_STATE.page = (AUDIT_STATE.page || 1) + delta;
    _renderAuditTable(AUDIT_STATE.filtered || AUDIT_STATE.data);
  }

  // ─────────────────────────────────────────────────────────────
  //  exportAuditLogData — تصدير CSV
  // ─────────────────────────────────────────────────────────────
  function exportAuditLogData() {
    if (!canDo("viewAuditLog")) {
      NotificationEngine.error(" ليس لديك صلاحية");
      return;
    }
    NotificationEngine.loading("⏳ جاري تجهيز الملف...");

    _gsr(
      "exportAuditLogCSV",
      [APP.currentUser ? APP.currentUser.username : "", SESSION.token],
      {
        label: "exportAuditLogCSV",
        rawResponse: true,
        onSuccess: function (r) {
          var res = r && r.data;
          if (!res || !res.csv) {
            finishLoadingToast("خطأ في التصدير", "error");
            return;
          }
          // تنزيل مباشر
          var blob = new Blob(["\uFEFF" + res.csv], {
            type: "text/csv;charset=utf-8;",
          });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download =
            "audit_log_" + new Date().toISOString().slice(0, 10) + ".csv";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          finishLoadingToast(" تم تصدير السجل بنجاح", "success");
        },
        onError: function (r) {
          finishLoadingToast("فشل التصدير: " + r.message, "error");
        },
      },
    );
  }

  function bindBarcode() {
    var selectedItems = {};

    function g(id) {
      return document.getElementById(id);
    }

    function getSettings() {
      return {
        size: (g("bcp-label-size") || { value: "small" }).value,
        type: (g("bcp-type") || { value: "CODE128" }).value,
        cols: parseInt((g("bcp-cols") || { value: "3" }).value, 10) || 3,
        showName: (g("bcp-show-name") || { checked: true }).checked,
        showCode: (g("bcp-show-code") || { checked: true }).checked,
        showPrice: (g("bcp-show-price") || { checked: false }).checked,
        showBrand: (g("bcp-show-brand") || { checked: true }).checked,
        brand: (g("bcp-brand-name") || { value: "MOO.ERP" }).value.trim(),
        customW: parseFloat((g("bcp-custom-w") || { value: "58" }).value) || 58,
        customH: parseFloat((g("bcp-custom-h") || { value: "40" }).value) || 40,
      };
    }

    function getLabelDims(s) {
      var map = {
        small: { w: 38, h: 25 },
        medium: { w: 58, h: 40 },
        large: { w: 100, h: 60 },
      };
      return map[s.size] || { w: s.customW, h: s.customH };
    }

    function getItemData(id) {
      return (APP.data.items || []).find(function (it) {
        return String(it.id) === String(id);
      });
    }

    var activeStockFilter = "all";

    function filterItems() {
      var q = ((g("bcp-search") || {}).value || "").toLowerCase().trim();
      var gid = (g("bcp-group-filter") || {}).value || "";
      var wid = (g("bcp-warehouse-filter") || {}).value || "";
      var rows = document.querySelectorAll(".bcp-row");
      var visible = 0;
      rows.forEach(function (row) {
        var whList = (row.dataset.warehouses || "").split(",").filter(Boolean);
        var whMatch = !wid || whList.indexOf(wid) !== -1;
        var stock = parseInt(row.dataset.stock || "0", 10);
        var stockMatch =
          activeStockFilter === "all" ||
          (activeStockFilter === "has" && stock > 0) ||
          (activeStockFilter === "zero" && stock <= 0);
        var nameMatch =
          !q ||
          (row.dataset.name || "").toLowerCase().indexOf(q) !== -1 ||
          (row.dataset.code || "").toLowerCase().indexOf(q) !== -1;
        var grpMatch = !gid || row.dataset.group === gid;
        var show = nameMatch && grpMatch && whMatch && stockMatch;
        row.style.display = show ? "" : "none";
        if (show) visible++;
      });
    }

    function updateCount() {
      var totalQty = Object.keys(selectedItems).reduce(function (s, id) {
        return s + (selectedItems[id] || 0);
      }, 0);
      var selCount = Object.keys(selectedItems).filter(function (id) {
        return selectedItems[id] > 0;
      }).length;

      var printBtn = g("bcp-print-btn");
      var printMain = g("bcp-print-main");
      var pdfBtn = g("bcp-pdf-btn");
      var expPdf = g("bcp-export-pdf");
      var countBadge = g("bcp-print-count");

      if (countBadge) countBadge.textContent = totalQty;
      if (printBtn) printBtn.disabled = totalQty === 0;
      if (printMain) printMain.disabled = totalQty === 0;
      if (pdfBtn) pdfBtn.disabled = totalQty === 0;
      if (expPdf) expPdf.disabled = totalQty === 0;

      if (g("bcp-kpi-selected")) g("bcp-kpi-selected").textContent = selCount;
      if (g("bcp-kpi-labels")) g("bcp-kpi-labels").textContent = totalQty;
      if (g("bcp-sum-items")) g("bcp-sum-items").textContent = selCount;
      if (g("bcp-sum-labels")) g("bcp-sum-labels").textContent = totalQty;

      var bulkBar = g("bcp-bulk-bar");
      var bulkText = g("bcp-bulk-text");
      if (bulkBar) bulkBar.classList.toggle("hidden", selCount === 0);
      if (bulkText)
        bulkText.textContent =
          selCount + " أصناف محددة — " + totalQty + " ملصق";

      document.querySelectorAll(".bcp-row").forEach(function (row) {
        var id = row.dataset.id;
        var sel = !!(selectedItems[id] && selectedItems[id] > 0);
        row.classList.toggle("bcp-row-selected", sel);
        var cb = row.querySelector(".bcp-item-check");
        if (cb) cb.checked = sel;
      });
    }

    /* ── SVG generators (identical to original) ───────────────── */
    function generateCode128SVG(text) {
      var CODE128B =
        " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~\x7f".split(
          "",
        );
      var PATTERNS = [
        "11011001100",
        "11001101100",
        "11001100110",
        "10010011000",
        "10010001100",
        "10001001100",
        "10011001000",
        "10011000100",
        "10001100100",
        "11001001000",
        "11001000100",
        "11000100100",
        "10110011100",
        "10011011100",
        "10011001110",
        "10111001100",
        "10011101100",
        "10011100110",
        "11001110010",
        "11001011100",
        "11001001110",
        "11011100100",
        "11001110100",
        "11101101110",
        "11101001100",
        "11100101100",
        "11100100110",
        "11101100100",
        "11100110100",
        "11100110010",
        "11011011000",
        "11011000110",
        "11000110110",
        "10100011000",
        "10001011000",
        "10001000110",
        "10110001000",
        "10001101000",
        "10001100010",
        "11010001000",
        "11000101000",
        "11000100010",
        "10110111000",
        "10110001110",
        "10001101110",

        "11101110110",

        "11011100010",
        "11011101110",
        "11101011000",
        "11101000110",
        "11100010110",
        "11101101000",
        "11101100010",
        "11100011010",
        "11101111010",
        "11001000010",
        "11110001010",
        "10100110000",
        "10100001100",
        "10010110000",
        "10010000110",
        "10000101100",
        "10000100110",
        "10110010000",
        "10110000100",
        "10011010000",
        "10011000010",
        "10000110100",
        "10000110010",
        "11000010010",
        "11001010000",
        "11110111010",
        "11000010100",
        "10001111010",
        "10100111100",
        "10010111100",
        "10010011110",
        "10111100100",
        "10011110100",
        "10011110010",
        "11110100100",
        "11110010100",
        "11110010010",
        "11011011110",

        "10100011110",

        "10111100010",
        "11110101000",

        "10111011110",
        "10111101110",
        "11101011110",
        "11110101110",
        "11010000100",
        "11010010000",
        "11010011100",
        "11000111010",
      ];
      var START_B = 104,
        STOP = "1100011101011";
      var chars = [];
      for (var i = 0; i < text.length; i++) {
        var idx = CODE128B.indexOf(text[i]);
        if (idx === -1) idx = CODE128B.indexOf("?");
        chars.push(idx);
      }
      var cs = START_B;
      chars.forEach(function (c, i) {
        cs += c * (i + 1);
      });
      cs = cs % 103;
      var bars = PATTERNS[START_B];
      chars.forEach(function (c) {
        bars += PATTERNS[c];
      });
      bars += PATTERNS[cs] + STOP + "11";
      var W = bars.length * 2,
        H = 60;
      var svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' +
        W +
        '" height="' +
        H +
        '" viewBox="0 0 ' +
        W +
        " " +
        H +
        '">';
      var x = 0;
      for (var b = 0; b < bars.length; b++) {
        if (bars[b] === "1")
          svg +=
            '<rect x="' +
            x +
            '" y="0" width="2" height="' +
            H +
            '" fill="#000"/>';
        x += 2;
      }
      return svg + "</svg>";
    }

    function generateQRPlaceholder(text) {
      var size = 21,
        cells = [],
        seed = 0;
      for (var i = 0; i < text.length; i++)
        seed = (seed * 31 + text.charCodeAt(i)) & 0xffff;
      for (var r = 0; r < size; r++) {
        cells[r] = [];
        for (var c = 0; c < size; c++) {
          if (
            (r < 7 && c < 7) ||
            (r < 7 && c >= size - 7) ||
            (r >= size - 7 && c < 7)
          ) {
            var fr = r % 7,
              fc = c % 7;
            cells[r][c] =
              fr === 0 ||
              fr === 6 ||
              fc === 0 ||
              fc === 6 ||
              (fr >= 2 && fr <= 4 && fc >= 2 && fc <= 4)
                ? 1
                : 0;
          } else {
            seed = (seed * 1664525 + 1013904223) & 0xffffffff;
            cells[r][c] = (seed >>> 16) & 1;
          }
        }
      }
      var cell = 4,
        W = size * cell;
      var svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' +
        W +
        '" height="' +
        W +
        '" viewBox="0 0 ' +
        W +
        " " +
        W +
        '">';
      svg += '<rect width="' + W + '" height="' + W + '" fill="white"/>';
      for (var rr = 0; rr < size; rr++)
        for (var cc = 0; cc < size; cc++)
          if (cells[rr][cc])
            svg +=
              '<rect x="' +
              cc * cell +
              '" y="' +
              rr * cell +
              '" width="' +
              cell +
              '" height="' +
              cell +
              '" fill="black"/>';
      return svg + "</svg>";
    }

    function generateBarcodeSVG(text, type) {
      return type === "QR"
        ? generateQRPlaceholder(text)
        : generateCode128SVG(text);
    }

    function buildLabel(item, s, dims) {
      var code = item.code || item.id,
        isQR = s.type === "QR";
      var svg = generateBarcodeSVG(code, s.type);
      var lw = dims.w + "mm",
        lh = dims.h + "mm";
      var html =
        '<div class="bc-label" style="width:' +
        lw +
        ";height:" +
        lh +
        ";min-height:" +
        lh +
        '">';
      if (s.showBrand && s.brand)
        html += '<div class="bc-label-brand">' + esc(s.brand) + "</div>";
      if (s.showName)
        html += '<div class="bc-label-name">' + esc(item.name) + "</div>";
      html +=
        '<div class="bc-label-barcode' +
        (isQR ? " bc-label-qr" : "") +
        '">' +
        svg +
        "</div>";
      var footer = "";
      if (s.showCode)
        footer += '<span class="bc-lf-code">' + esc(code) + "</span>";
      if (s.showPrice && item.selling_price)
        footer +=
          '<span class="bc-lf-price">' +
          formatMoney(Number(item.selling_price), { decimals: 0 }) +
          "</span>";
      if (footer) html += '<div class="bc-label-footer">' + footer + "</div>";
      return html + "</div>";
    }

    function updatePreview() {
      var stage = g("bcp-preview-stage");
      if (!stage) return;
      var s = getSettings(),
        dims = getLabelDims(s);
      var dimBadge = g("bcp-dim-badge");
      if (dimBadge) dimBadge.textContent = dims.w + " × " + dims.h + " مم";
      var ids = Object.keys(selectedItems).filter(function (id) {
        return selectedItems[id] > 0;
      });
      if (!ids.length) {
        stage.innerHTML =
          '<div class="bcp-preview-placeholder"><i class="ti ti-tag" style="font-size:40px;opacity:.2"></i><p>اختر صنفاً<br>لرؤية الملصق</p></div>';
        return;
      }
      var item = getItemData(ids[0]);
      if (!item) return;
      var mmToPx = 3.78,
        labelW = dims.w * mmToPx,
        maxW = 220;
      var scale = labelW > maxW ? maxW / labelW : 1;
      stage.innerHTML =
        '<div class="bcp-preview-label-wrap"><div style="transform:scale(' +
        scale +
        ');transform-origin:center top">' +
        buildLabel(item, s, dims) +
        "</div></div>" +
        '<p class="bcp-preview-hint">' +
        dims.w +
        " × " +
        dims.h +
        " مم</p>";
    }

    function doPrint() {
      var s = getSettings(),
        dims = getLabelDims(s);
      var ids = Object.keys(selectedItems).filter(function (id) {
        return selectedItems[id] > 0;

      if (!ids.length) return;

      ids.forEach(function (id) {

    var searchEl = g("bcp-search");

        updatePreview();
      });

    var checkAll = g("bcp-check-all");
    if (checkAll)
      checkAll.addEventListener("change", function () {
        var checked = checkAll.checked;
        document.querySelectorAll(".bcp-row").forEach(function (row) {
          if (row.style.display === "none") return;
          var id = row.dataset.id;
          var inp = row.querySelector(".bcp-qty-input");
          var qty = parseInt((inp || { value: "1" }).value || 1, 10) || 1;
          if (checked) selectedItems[id] = qty;
          else delete selectedItems[id];
        });
        updateCount();
        updatePreview();
      });

    var tbody = g("bcp-tbody");
    if (tbody) {
      tbody.addEventListener("change", function (e) {
        var cb = e.target.closest(".bcp-item-check");
        if (!cb) return;
        var row = e.target.closest(".bcp-row");
        if (!row) return;
        var id = row.dataset.id;
        var inp = row.querySelector(".bcp-qty-input");
        var qty = parseInt((inp || { value: "1" }).value || 1, 10) || 1;
        if (cb.checked) selectedItems[id] = qty;
        else delete selectedItems[id];
        updateCount();
        updatePreview();
      });
      tbody.addEventListener("click", function (e) {
        if (e.target.closest(".bcp-qty-wrap")) return;
        if (e.target.closest(".bcp-item-check")) return;
        var row = e.target.closest(".bcp-row");
        if (!row) return;
        var id = row.dataset.id;
        var cb = row.querySelector(".bcp-item-check");
        var inp = row.querySelector(".bcp-qty-input");
        var qty = parseInt((inp || { value: "1" }).value || 1, 10) || 1;
        if (selectedItems[id]) {
          delete selectedItems[id];
          if (cb) cb.checked = false;
        } else {
          selectedItems[id] = qty;
          if (cb) cb.checked = true;
        }
        updateCount();
        updatePreview();
      });
      tbody.addEventListener("click", function (e) {
        var btn = e.target.closest(".bcp-qty-btn");
        if (!btn) return;
        var id = btn.dataset.id;
        var inp = document.querySelector(
          '.bcp-qty-input[data-id="' + id + '"]',
        );
        if (!inp) return;
        var val = parseInt(inp.value, 10) || 1;
        if (btn.classList.contains("bcp-qty-plus"))
          val = Math.min(9999, val + 1);
        if (btn.classList.contains("bcp-qty-minus")) val = Math.max(1, val - 1);
        inp.value = val;
        if (selectedItems[id] !== undefined) {
          selectedItems[id] = val;
          updateCount();
          updatePreview();
        }
        e.stopPropagation();
      });
      tbody.addEventListener("input", function (e) {
        if (!e.target.classList.contains("bcp-qty-input")) return;
        var id = e.target.dataset.id;
        var val = parseInt(e.target.value, 10) || 1;
        if (selectedItems[id] !== undefined) {
          selectedItems[id] = val;
          updateCount();
          updatePreview();
        }
      });
    }

    [
      "bcp-show-name",
      "bcp-show-code",
      "bcp-show-price",
      "bcp-show-brand",
      "bcp-brand-name",
      "bcp-custom-w",
      "bcp-custom-h",
    ].forEach(function (id) {

        el.type === "checkbox" ? "change" : "input",

          }
          updatePreview();
        },
      );
    });

    document.querySelectorAll(".bcp-size-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".bcp-size-btn").forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        var sl = g("bcp-label-size");
        if (sl) sl.value = btn.dataset.size;
        var cw = g("bcp-custom-wrap");
        if (cw) cw.style.display = btn.dataset.size === "custom" ? "" : "none";
        updatePreview();
      });
    });

    document.querySelectorAll(".bcp-type-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".bcp-type-btn").forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        var th = g("bcp-type");
        if (th) th.value = btn.dataset.type;
        updatePreview();
      });
    });

    document.querySelectorAll(".bcp-col-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".bcp-col-btn").forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        var ch = g("bcp-cols");
        if (ch) ch.value = btn.dataset.cols;
      });
    });

    [
      g("bcp-print-btn"),
      g("bcp-print-main"),
      g("bcp-pdf-btn"),
      g("bcp-export-pdf"),
    ].forEach(function (btn) {
      if (btn) btn.addEventListener("click", doPrint);
    });

    var saveTpl = g("bcp-save-template");
    if (saveTpl)
      saveTpl.addEventListener("click", function () {
        if (typeof showToast === "function")
          NotificationEngine.success("تم حفظ القالب ");
      });

    /* ── Drawer behavior for Settings/Preview on narrow screens ─── */
    (function initDrawers() {
      var backdrop = g("bcp-drawer-backdrop");
      var settingsPanel = g("bcp-settings-panel");
      var previewPanel = g("bcp-preview-panel");

      function closeDrawers() {
        if (settingsPanel) settingsPanel.classList.remove("bcp-drawer-open");
        if (previewPanel) previewPanel.classList.remove("bcp-drawer-open");
        if (backdrop) backdrop.classList.remove("bcp-drawer-open");
      }
      function openDrawer(panel) {
        closeDrawers();
        if (panel) panel.classList.add("bcp-drawer-open");
        if (backdrop) backdrop.classList.add("bcp-drawer-open");
      }

      var openSettingsBtn = g("bcp-open-settings");
      var openPreviewBtn = g("bcp-open-preview");
      var closeSettingsBtn = g("bcp-close-settings");
      var closePreviewBtn = g("bcp-close-preview");

      if (openSettingsBtn)
        openSettingsBtn.addEventListener("click", function () {
          openDrawer(settingsPanel);
        });
      if (openPreviewBtn)
        openPreviewBtn.addEventListener("click", function () {
          openDrawer(previewPanel);
        });
      if (closeSettingsBtn)
        closeSettingsBtn.addEventListener("click", closeDrawers);
      if (closePreviewBtn) closePreviewBtn.addEventListener("click", closeDrawers);
      if (backdrop) backdrop.addEventListener("click", closeDrawers);
    })();

    updatePreview();
  }

  function _applyCompanyBranding() {
    var s = APP.companySettings || {};
    var root = document.documentElement;

    // ── اللون الرئيسي → --primary + --accent ──
    if (s.primary_color && /^#[0-9a-fA-F]{6}$/.test(s.primary_color)) {
      root.style.setProperty("--primary", s.primary_color);
      root.style.setProperty("--accent", s.primary_color);
      // accent-soft = نسخة شفافة 10%
      var r1 = parseInt(s.primary_color.slice(1, 3), 16);
      var g1 = parseInt(s.primary_color.slice(3, 5), 16);
      var b1 = parseInt(s.primary_color.slice(5, 7), 16);
      root.style.setProperty(
        "--accent-soft",
        "rgba(" + r1 + "," + g1 + "," + b1 + ",0.1)",
      );
    }

    // ── اللون الثانوي → --primary-dark + --accent2 ──
    if (s.secondary_color && /^#[0-9a-fA-F]{6}$/.test(s.secondary_color)) {
      root.style.setProperty("--primary-dark", s.secondary_color);
      root.style.setProperty("--accent2", s.secondary_color);
    }

    // ── لون التمييز → --primary-light ──
    if (s.accent_color && /^#[0-9a-fA-F]{6}$/.test(s.accent_color)) {
      root.style.setProperty("--primary-light", s.accent_color);
    }

    // ── تحديث gradients الـ brand-icon والسايدبار ديناميكياً ──
    var primary = s.primary_color || "#2563eb";
    var secondary = s.secondary_color || "#0d1f4e";
    var accent = s.accent_color || "#0ea5e9";

    // brand-icon gradient
    var brandIcons = document.querySelectorAll(".brand-icon");
    brandIcons.forEach(function (el) {
      el.style.background =
        "linear-gradient(135deg, " + primary + " 0%, " + accent + " 100%)";
      el.style.boxShadow =
        "0 6px 20px rgba(" +
        parseInt(primary.slice(1, 3), 16) +
        "," +
        parseInt(primary.slice(3, 5), 16) +
        "," +
        parseInt(primary.slice(5, 7), 16) +
        ",0.35), inset 0 1px 0 rgba(255,255,255,0.25)";
    });

    // sidebar-head gradient
    var sidebarHead = document.querySelector(".sidebar-head");
    if (sidebarHead) {
      var r2 = parseInt(accent.slice(1, 3), 16);
      var g2 = parseInt(accent.slice(3, 5), 16);
      var b2 = parseInt(accent.slice(5, 7), 16);
      sidebarHead.style.background =
        "linear-gradient(160deg, rgba(" +
        r2 +
        "," +
        g2 +
        "," +
        b2 +
        ",0.12) 0%, var(--surface) 100%)";
    }

    // ── عنوان المتصفح (التاسك بار) — ثابت دايمًا "MOO-ERP" ──
    // [FIX-FIXED-BRAND-TITLE] كان بيتغيّر تلقائيًا حسب اسم الشركة الداخلي
    // (company_name/name) اللي المستخدم بيدخله في إعدادات الشركة، فيبقى
    // عنوان التاب مختلف من شركة لتانية. بناءً على طلب إن اسم النظام في
    // هيدر المتصفح يفضل ثابت "MOO-ERP" دايمًا وميتأثرش بأي اسم/شعار
    // داخلي، بقى العنوان قيمة ثابتة صريحة بدل ما يتبني من s.company_name.
    document.title = "MOO-ERP";

    // ── تحديث السايدبار لو كان مرسوماً ──
    var brandWrap = document.querySelector(".sidebar-brand");
    if (brandWrap) brandWrap.innerHTML = _renderSidebarBrand();
    // ── company-preview-card بيستخدم --preview-secondary مش --primary-dark ──
    root.style.setProperty("--preview-secondary", s.secondary_color);
    root.style.setProperty("--preview-primary", s.primary_color);
  }
  // ============================================================
  // §PM Permissions Manager — State & Logic
  // ============================================================

  var PM_STATE = {
    roles: [], // كل الأدوار
    permissions: [], // ALL_PERMISSIONS
    userOverrides: {}, // { username: { extra, denied } }
    users: [], // بيانات المستخدمين
    loaded: false,
  };

  // ── تحديث ROLE_PERMISSIONS بعد تغيير الأدوار ────────────────
  function _syncRolePermissions() {
    ROLE_PERMISSIONS = {};
    PM_STATE.roles.forEach(function (r) {
      ROLE_PERMISSIONS[r.name] = r.permissions || [];
    });
  }

  // ============================================================
  //  تبديل التبويبات
  // ============================================================
  function switchPermTab(btn, tab) {
    document.querySelectorAll(".pm-tab").forEach(function (t) {
      t.classList.remove("active");
    });
    btn.classList.add("active");

    document.querySelectorAll(".pm-pane").forEach(function (p) {
      p.classList.remove("active");
    });
    var pane = document.getElementById("pm-pane-" + tab);
    if (pane) pane.classList.add("active");

    // lazy load
    if (!PM_STATE.loaded) {
      loadPermissionMatrix();
    } else {
      if (tab === "roles") _renderRolesGrid();
      if (tab === "matrix") _renderMatrix();
      if (tab === "overrides") _renderOverrides();
    }
  }

  // ============================================================
  //  تحميل البيانات من الباك إند
  // ============================================================
  function loadPermissionMatrix() {
    var user = APP.currentUser;
    if (!user) return;

    // Skeleton
    ["pm-roles-grid", "pm-matrix-wrap", "pm-overrides-list"].forEach(
      function (id) {
        var el = document.getElementById(id);
        if (el) el.innerHTML = _loadingBlock();
      },
    );

    _gsr("getPermissionMatrix", [user.username, SESSION.token], {
      label: "getPermissionMatrix",
      rawResponse: true,
      onSuccess: function (r) {
        var res = r && r.data;
        PM_STATE.roles = res.roles || [];
        // [FIX] نفس إصلاح _parseData في 01_JS_Core_Auth.html — لكن هنا
        // البيانات جاية من نداء سيرفر منفصل (getPermissionMatrix) بيرجّع
        // ALL_PERMISSIONS الخام (labelKey/catLabelKey فقط، بدون label/
        // catLabel نصي)، فكان بيتخطى الإصلاح المركزي تمامًا — وده اللي
        // كان بيسبب فراغ الأسماء في تبويب "مصفوفة الصلاحيات" تحديدًا.
        PM_STATE.permissions = (res.permissions || []).map(function (p) {
          var _t =
            typeof I18N !== "undefined" && I18N.t
              ? I18N.t
              : function (k) {
                  return k;
                };
          return Object.assign({}, p, {
            label: p.label || (p.labelKey ? _t(p.labelKey) : "") || p.key,
            catLabel:
              p.catLabel || (p.catLabelKey ? _t(p.catLabelKey) : "") || p.cat,
          });
        });
        PM_STATE.userOverrides = res.userOverrides || {};
        PM_STATE.users = res.users || [];
        PM_STATE.loaded = true;
        _syncRolePermissions();

        // عرض التبويب النشط
        var activeTab = document.querySelector(".pm-tab.active");
        var tab = activeTab ? activeTab.dataset.tab : "roles";
        if (tab === "roles") _renderRolesGrid();
        if (tab === "matrix") _renderMatrix();
        if (tab === "overrides") _renderOverrides();
      },
      onError: function (r) {
        NotificationEngine.error("فشل تحميل بيانات الصلاحيات: " + r.message);
      },
    });
  }

  // ============================================================
  //  عرض الأدوار (تبويب 1)
  // ============================================================
  function _renderRolesGrid() {
    var el = document.getElementById("pm-roles-grid");
    if (!el) return;

    if (!PM_STATE.roles.length) {
      el.innerHTML =
        '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text3)">لا توجد أدوار</div>';
      return;
    }

    el.innerHTML = PM_STATE.roles
      .map(function (role, idx) {
        var count = (role.permissions || []).length;
        var total = PM_STATE.permissions.length;
        var pct = total ? Math.round((count / total) * 100) : 0;
        var bg = role.color + "22";

        return (
          '<div class="role-card">' +
          // Header
          '<div class="role-card-header">' +
          '<div class="role-dot" style="background:' +
          role.color +
          '"></div>' +
          '<div><div class="role-card-title">' +
          esc(role.label) +
          "</div>" +
          '<div class="role-card-sub">@' +
          esc(role.name) +
          (role.is_builtin ? " · أساسي" : "") +
          "</div></div>" +
          (role.is_builtin
            ? '<span class="builtin-badge"> ثابت</span>'
            : "") +
          "</div>" +
          // شريط التقدم
          '<div style="background:var(--surface2);border-radius:10px;height:6px;margin-bottom:8px">' +
          '<div style="width:' +
          pct +
          "%;background:" +
          role.color +
          ';height:6px;border-radius:10px;transition:width .4s"></div>' +
          "</div>" +
          '<div style="font-size:11px;color:var(--text3);margin-bottom:12px">' +
          count +
          " من " +
          total +
          " صلاحية (" +
          pct +
          "%)</div>" +
          // مثال الصلاحيات
          '<div style="display:flex;flex-wrap:wrap;gap:4px">' +
          (role.permissions || [])
            .slice(0, 4)
            .map(function (pk) {
              var p = PM_STATE.permissions.find(function (x) {
                return x.key === pk;
              });
              return p
                ? '<span style="font-size:10px;padding:2px 7px;border-radius:10px;background:' +
                    bg +
                    ";color:" +
                    role.color +
                    ";border:1px solid " +
                    role.color +
                    '33">' +
                    esc(p.label) +
                    "</span>"
                : "";
            })
            .join("") +
          (count > 4
            ? '<span style="font-size:10px;padding:2px 7px;border-radius:10px;background:var(--surface2);color:var(--text3)">+' +
              (count - 4) +
              " أخرى</span>"
            : "") +
          "</div>" +
          // أزرار
          '<div class="role-actions">' +
          '<button onclick="_openRoleModalByIdx(' +
          idx +
          ')" class="btn btn-outline" style="flex:1;font-size:12px;padding:6px">' +
          (role.is_builtin ? " عرض" : " تعديل") +
          "</button>" +
          (!role.is_builtin
            ? '<button onclick="_confirmDeleteRoleByIdx(' +
              idx +
              ')" class="btn" style="color:var(--danger);border-color:var(--danger);font-size:12px;padding:6px 12px"></button>'
            : "") +
          "</div>" +
          "</div>"
        );
      })
      .join("");
  }

  // ============================================================
  //  عرض مصفوفة الصلاحيات (تبويب 2)
  // ============================================================
  function _renderMatrix() {
    var wrap = document.getElementById("pm-matrix-wrap");
    if (!wrap) return;

    var roles = PM_STATE.roles;
    var perms = PM_STATE.permissions;

    if (!roles.length || !perms.length) {
      wrap.innerHTML =
        '<div style="padding:30px;text-align:center;color:var(--text3)">لا توجد بيانات</div>';
      return;
    }

    // تجميع الصلاحيات في فئات
    var cats = {};
    var catOrder = [];
    perms.forEach(function (p) {
      if (!cats[p.cat]) {
        cats[p.cat] = { label: p.catLabel, perms: [] };
        catOrder.push(p.cat);
      }
      cats[p.cat].perms.push(p);
    });

    // Header row
    var headerCells = roles
      .map(function (r) {
        return (
          '<th style="min-width:90px">' +
          '<div style="display:flex;flex-direction:column;align-items:center;gap:4px">' +
          '<div style="width:10px;height:10px;border-radius:50%;background:' +
          r.color +
          '"></div>' +
          '<span style="font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
          esc(r.label) +
          "</span>" +
          "</div></th>"
        );
      })
      .join("");

    // Body rows
    var bodyRows = catOrder
      .map(function (catKey) {
        var cat = cats[catKey];
        // صف التصنيف
        var catRow =
          '<tr class="cat-separator"><td class="cat-row" colspan="' +
          (roles.length + 1) +
          '"> ' +
          esc(cat.label) +
          "</td></tr>";

        var permRows = cat.perms
          .map(function (p) {
            var cells = roles
              .map(function (r) {
                var hasRolePerm = (r.permissions || []).indexOf(p.key) !== -1;
                var cls, icon;
                if (hasRolePerm) {
                  cls = "granted";
                  icon = "";
                } else {
                  cls = "empty";
                  icon = "—";
                }

                return (
                  '<td><div class="perm-check ' +
                  cls +
                  '">' +
                  icon +
                  "</div></td>"
                );
              })
              .join("");

            return (
              "<tr>" +
              '<td class="perm-label">' +
              esc(p.label) +
              "</td>" +
              cells +
              "</tr>"
            );
          })
          .join("");

        return catRow + permRows;
      })
      .join("");

    wrap.innerHTML =
      '<table class="pm-matrix">' +
      "<thead><tr>" +
      '<th class="perm-name">الصلاحية</th>' +
      headerCells +
      "</tr></thead>" +
      "<tbody>" +
      bodyRows +
      "</tbody>" +
      "</table>";
  }

        var deniedCount = (ov.denied || []).length;

        return (
          '<div class="user-perm-row">' +
          // Avatar + info
          '<div style="display:flex;align-items:center;gap:10px;flex:1">' +

  function _roleCheckAll(state) {
    // يدعم التصميم الجديد (perm-checkbox-custom) والقديم (perm-cb)
    document
      .querySelectorAll(".perm-checkbox-custom:not(.disabled)")
      .forEach(function (cb) {
        if (state) cb.classList.add("checked");
        else cb.classList.remove("checked");
      });
    document
      .querySelectorAll(".perm-cb:not([disabled])")
      .forEach(function (cb) {
        cb.checked = state;
      });
    // تحديث شريط التقدم
    var list = document.getElementById("role-perm-list");
    if (!list) return;
    var total = list.querySelectorAll(".perm-checkbox-custom").length;
    var active = list.querySelectorAll(".perm-checkbox-custom.checked").length;
    var pct = total > 0 ? Math.round((active / total) * 100) : 0;
    var bar = document.getElementById("role-perm-bar");
    var badge = document.getElementById("role-perm-badge");
    if (bar) bar.style.width = pct + "%";
    if (badge) badge.textContent = active + " من " + total;
  }

  function saveRoleFromModal() {
    var id = (document.getElementById("role-id") || {}).value || "";
    var name = (
      (document.getElementById("role-name") || {}).value || ""
    ).trim();
    var label = (
      (document.getElementById("role-label") || {}).value || ""
    ).trim();
    var color =
      (document.getElementById("role-color") || {}).value || "#6b7280";

    if (!name) {
      NotificationEngine.error("اسم الدور مطلوب");
      return;
    }

    // قراءة الصلاحيات من التصميم الجديد أولاً، ثم القديم كـ fallback
    var permissions = [];
    var newCbs = document.querySelectorAll(
      "#role-perm-list .perm-checkbox-custom.checked",
    );
    if (newCbs.length > 0) {
      newCbs.forEach(function (cb) {
        if (cb.dataset.key) permissions.push(cb.dataset.key);
      });
    } else {
      document.querySelectorAll(".perm-cb:checked").forEach(function (cb) {
        permissions.push(cb.dataset.key);
      });
    }

    var role = {
      id: id || null,
      name: name,
      label: label || name,
      color: color,
      permissions: permissions,
    };

    // UX: إغلاق فوري + مؤشر خلفي بدل _freezeUI التقليدي
    closeDrawer();
    _freezeUI(SAVE_MESSAGES.SAVING);
    _gsr("saveRole", [role, APP.currentUser.username, SESSION.token], {
      label: "saveRole",
      onSuccess: function (res) {
        _unfreezeUI();
        NotificationEngine.success(res.message);
        PM_STATE.loaded = false;
        loadPermissionMatrix();
      },
      onError: function (res) {
        _unfreezeUI();
        NotificationEngine.error("خطأ: " + res.message);
      },
    });
  }

  function openUserOverrideModal(userObj) {
    var allPerms = PM_STATE.permissions;
    var ov = PM_STATE.userOverrides[userObj.username] || {
      extra: [],
      denied: [],
    };
    var rolePerms = _getRolePermsLocal(userObj.role);
    openDrawer(
      '<div class="modal-box">' +
        renderUserOverrideModal(userObj, allPerms, ov, rolePerms) +
        "</div>",
    );
  }

  function _getRolePermsLocal(roleName) {
    var role = PM_STATE.roles.find(function (r) {
      return r.name === roleName;
    });
    return role ? role.permissions || [] : [];
  }

  function saveUserOverrideFromModal() {
    var username = (document.getElementById("ov-username") || {}).value || "";
    var rolePerms = JSON.parse(
      (document.getElementById("ov-role-perms") || {}).value || "[]",
    );
    if (!username) return;

    var extra = [];
    var denied = [];

    // ── التصميم الجديد: perm-checkbox-custom ──
    document
      .querySelectorAll(
        ".perm-list-wrap .perm-checkbox-custom.checked:not(.disabled)",
      )
      .forEach(function (cb) {
        if (rolePerms.indexOf(cb.dataset.key) === -1)
          extra.push(cb.dataset.key);
      });

    // ── التصميم القديم fallback: ov-grant-cb ──
    if (extra.length === 0) {
      document
        .querySelectorAll(".ov-grant-cb:checked:not([disabled])")
        .forEach(function (cb) {
          if (rolePerms.indexOf(cb.dataset.key) === -1)
            extra.push(cb.dataset.key);
        });
    }

    // ── deny checkboxes (مشترك بين التصميمين) ──
    document.querySelectorAll(".ov-deny-cb:checked").forEach(function (cb) {
      denied.push(cb.dataset.key);
    });

    // UX: إغلاق فوري + مؤشر خلفي
    closeDrawer();
    _freezeUI(SAVE_MESSAGES.SAVING);
    _gsr(
      "saveUserPermissionOverrides",
      [username, extra, denied, APP.currentUser.username, SESSION.token],
      {
        label: "saveUserPermissionOverrides",
        onSuccess: function (res) {
          _unfreezeUI();
          NotificationEngine.success(res.message);
          PM_STATE.userOverrides[username] = { extra: extra, denied: denied };
          _renderOverrides();
        },
        onError: function (res) {
          _unfreezeUI();
          NotificationEngine.error("خطأ: " + res.message);
        },
      },
    );
  }

  function _pmAvatarColor(username) {
    var colors = [
      "#3b82f6",
      "#10b981",
      "#f59e0b",
      "#ef4444",
      "#8b5cf6",
      "#ec4899",
      "#14b8a6",
      "#f97316",
    ];
    var hash = 0;
    for (var i = 0; i < username.length; i++) hash += username.charCodeAt(i);
    return colors[hash % colors.length];
  }

            // callerUser, sessionToken) بدون المعامل الثالث كانت ترفض الحذف
            // دائمًا برسالة "جلسة غير صالحة" مهما كانت الجلسة سليمة.
            onSuccess: function (r) {
              NotificationEngine.success(r.message);
              // 🎯 [FIX] نفس فيكس إضافة/تعديل المستخدم — بدون optimisticPatch
              // كان الجدول بيترسم فورًا من الكاش القديم اللي لسه فيه
              // المستخدم المحذوف، ومكانش بيختفي إلا بعد اكتمال المزامنة

              reloadAfterMutation(null, null, undefined, {
                collection: "users",
                idField: "username",

                record: { username: username },

            if (obj.password) {
              var pwErr = _checkPasswordPolicy(obj.password);
              if (pwErr) {
                NotificationEngine.error(pwErr);
                return;
              }
            }
            var fn = isEdit ? "updateUser" : "addUser";
            // [SELF-RENAME] لو المستخدم بيغيّر اسم المستخدم (username) بتاعه
            // هو نفسه وهو شغال بنفس الجلسة الحالية — الباك-إند (updateUser →
            // _propagateUserRename → _destroyAllUserSessions) بيقفل كل جلساته
            // القديمة فورًا، فلازم الفرونت يعمل logout فوري بعد نجاح الحفظ
            // بدل ما يفضل شغال بجلسة اتقفلت ويطلع له خطأ "جلسة غير صالحة"
            // فجأة في أول عملية بعدها.
            var _isSelfRename =
              isEdit &&
              user &&

              obj.username &&
              obj.username !== user.username;
            // UX: إغلاق فوري + مؤشر خلفي

            _freezeUI(
              isEdit
                ? "⏳ جاري حفظ بيانات المستخدم..."
                : "⏳ جاري إضافة المستخدم...",
            );
            _gsr(
              fn,
              [obj, APP.currentUser.username, SESSION ? SESSION.token : null],
              {
                label: fn,
                // [SESSION-FIX] addUser(user, callerUser, sessionToken) تقرأ
                // sessionToken كمعامل ثالث منفصل (بعكس updateUser التي تقرأه من
                // داخل الكائن نفسه) — لازم يُمرَّر صراحةً هنا وإلا فشلت إضافة
                // مستخدم جديد بنفس خطأ "جلسة غير صالحة".
                onSuccess: function (r) {
                  _unfreezeUI();
                  NotificationEngine.success(r.message);
                  // [SELF-RENAME] لو المستخدم غيّر اسمه هو نفسه، منعملش
                  // reload/renderPage عادي — جلسته اتقفلت من الباك-إند فعلاً،
                  // فبنعمل logout فوري (بدون نافذة تأكيد) ونطلب منه يسجّل
                  // دخول تاني باسمه الجديد.
                  if (_isSelfRename) {
                    NotificationEngine.info(
                      "🔒 تم تغيير اسم المستخدم — سجّل الدخول من جديد باسمك الجديد",
                    );
                    setTimeout(function () {
                      if (typeof _performLogout === "function") {
                        _performLogout();
                      } else {
                        location.reload();
                      }
                    }, 1200);
                    return;
                  }
                  // 🎯 [FIX] بدون optimisticPatch هنا، renderPage("users")
                  // كانت بترسم من الكاش القديم فورًا (قبل ما تتحدّث)، وكان
                  // المستخدم الجديد بيظهر بس بعد اكتمال المزامنة الخلفية
                  // (DL.Core.getAllData بعد ~300ms+ فوق زمن الشبكة الفعلي) —
                  // يعني التوست بيخلص قبل ما البيانات فعلاً تتحدّث والمستخدم
                  // الجديد يظهر في الجدول.
                  reloadAfterMutation(
                    function () {
                      renderPage("users");
                    },
                    null,
                    undefined,
                    {
                      collection: "users",
                      idField: "username",
                      op: isEdit ? "update" : "add",
                      record: {
                        username: obj.username,
                        full_name: obj.full_name,
                        role: obj.role,
                        email: obj.email,
                        active: obj.active,
                        last_login: isEdit
                          ? (user && user.last_login) || ""
                          : "",
                      },
                    },
                  );
                },
                onError: function (r) {
                  _unfreezeUI();
                  NotificationEngine.error(r.message);
                },
              },
            );
          });
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // الإنتاج — Production
  // ─────────────────────────────────────────────────────────────

  // ─────────────────────────────────────────────────────────────
  // §SEC  Password strength — مؤشر قوة كلمة المرور [SEC-FIX-UI]
  // ─────────────────────────────────────────────────────────────

  /**
   * _checkPasswordPolicy — [PW-UNIFY] بيفوّض بالكامل لـ VF.checkPasswordRequirements
   * (VF_JS_Validation.html)، نفس قواعد الباكيند (PASSWORD_POLICY في Code_12_Core.js)
   * بما فيها شرط الحرف الصغير وقائمة الكلمات الممنوعة (كانا ناقصين هنا سابقًا).
   * @param {string} pw
   * @returns {string|null} رسالة الخطأ أو null إذا كانت قوية
   */
  function _checkPasswordPolicy(pw) {
    var s = VF.checkPasswordRequirements(pw);
    if (!s.len)
      return (
        "كلمة المرور يجب أن تكون " +
        VF.passwordPolicy.MIN_LENGTH +
        " أحرف على الأقل"
      );
    if (!s.num) return "كلمة المرور يجب أن تحتوي على رقم واحد على الأقل";
    if (!s.upper)
      return "كلمة المرور يجب أن تحتوي على حرف كبير (A-Z) واحد على الأقل";
    if (!s.lower)
      return "كلمة المرور يجب أن تحتوي على حرف صغير (a-z) واحد على الأقل";
    if (!s.special)
      return "كلمة المرور يجب أن تحتوي على رمز خاص (!@#$...) واحد على الأقل";
    if (s.banned) return "كلمة المرور ضعيفة جداً — اختر كلمة مرور أقوى";
    return null;
  }

  /**
   * _evalPasswordStrength — يحدّث مؤشر القوة أثناء الكتابة
   * [PW-UNIFY] العدّ ولون/تسمية الشريط بيجيوا دلوقتي من VF.checkPasswordRequirements
   * و VF.passwordStrengthMeta، بدل حساب score محلي منفصل.
   * @param {string} pw
   */
  function _evalPasswordStrength(pw) {
    var bar = document.getElementById("u-pass-bar");
    var msg = document.getElementById("u-pass-msg");
    var wrap = document.getElementById("u-pass-strength");
    if (!bar || !msg || !wrap) return;

    if (!pw) {
      wrap.style.display = "none";
      return;
    }
    wrap.style.display = "block";

    var s = VF.checkPasswordRequirements(pw);
    var meta = VF.passwordStrengthMeta(s.passCount, pw.length);
    bar.style.width = meta.pct + "%";
    bar.style.background = meta.color;
    msg.textContent = meta.label;
    msg.style.color = meta.color;
  }

  /**
   * _togglePassVis — إظهار/إخفاء كلمة المرور
   */
  function _togglePassVis() {
    var inp = document.getElementById("u-pass");
    var eye = document.getElementById("u-pass-eye");
    if (!inp) return;
    var hidden = inp.type === "password";
    inp.type = hidden ? "text" : "password";
    if (eye) {
      eye.className = hidden ? "ti ti-eye-off" : "ti ti-eye";
    }
  }

  // ═══════════════════════════════════════════════════════════════════
  // §AD-BIND  لوحة الإدارة — bind/refresh/help/search (Dashboard Framework)
  // ═══════════════════════════════════════════════════════════════════
  function bindAdminDashboard() {
    if (typeof NavigationService !== "undefined") {
      NavigationService.trackVisit("admin-dashboard", {
        label: "الإدارة",
        icon: '<i class="ti ti-settings-2"></i>',
      });
    }
    // سجل العمليات مش جزء من getAllData الأساسية — بيتجاب بشكل منفصل
    // وبيتعمل له re-render صامت للوحة بمجرد وصوله (نفس فلسفة ensureExtendedData)
    if (APP._adminAuditLoaded) return;
    _gsr("getAuditLog", [50, {}], {
      label: "getAuditLog:adminDashboard",
      onSuccess: function (r) {
        APP._adminAuditLoaded = true;
        APP.data = APP.data || {};
        APP.data.auditLog = r.data || [];
        if (APP.currentPage === "admin-dashboard") {
          APP._fromSilentRefresh = true;
          renderPage("admin-dashboard");
          APP._fromSilentRefresh = false;
        }
      },
      onError: function () {
        APP._adminAuditLoaded = true; // منع إعادة المحاولة اللانهائية
      },
    });
  }

  function refreshAdminDashboard() {
    APP._adminAuditLoaded = false;
    if (typeof DashboardService !== "undefined")
      DashboardService.invalidateByPrefix("admin");
    renderPage(APP.currentPage);
  }

  function showAdminDashboardHelp() {
    if (typeof showToast === "function") {
      NotificationEngine.info(
        "اضغط اسم القسم بالقائمة الجانبية للعودة لهذه اللوحة، والسهم بجانبه لفتح/قفل باقي شاشات الإدارة."
      );
    }
  }

  function adminDashboardSearch(value) {
    var box = document.getElementById("adm-search-results");
    if (!box) return;
    var q = (value || "").trim();
    if (!q) {
      box.innerHTML = "";
      return;
    }
    var list = (APP.data && APP.data.users) || [];
    var qLower = q.toLowerCase();
    var matches = list
      .filter(function (u) {
        return (
          (u.full_name && u.full_name.toLowerCase().indexOf(qLower) !== -1) ||
          (u.username && u.username.toLowerCase().indexOf(qLower) !== -1)
        );
      })
      .slice(0, 8);
    if (!matches.length) {
      box.innerHTML =
        "<div class='dw-list-item' style='cursor:default'><span class='dw-list-text'>لا توجد نتائج مطابقة</span></div>";
      return;
    }
    box.innerHTML = matches
      .map(function (u) {
        return (
          "<div class='dw-list-item' style='cursor:pointer' onclick=\"navigate('users')\">" +
          "<span class='dw-list-icon'><i class='ti ti-user'></i></span>" +
          "<span class='dw-list-text'>" +
          esc(u.full_name || u.username || "") +
          "</span>" +
          "</div>"
        );
      })
      .join("");
  }
</script>
