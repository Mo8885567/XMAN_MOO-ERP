  function savePartyAddress(prefix) {
    var wrap = document.getElementById(prefix + "-addr-wrap");
    if (!wrap) return;
    var partyId = wrap.getAttribute("data-party-id");
    var partyType = wrap.getAttribute("data-party-type");
    var addressId = (document.getElementById(prefix + "-addr-f-id") || {})
      .value;

    var val = function (id) {
      return (
        (document.getElementById(prefix + "-addr-f-" + id) || {}).value || ""
      ).trim();
    };

    var data = {
      party_id: partyId,
      party_type: partyType,
      name: val("name"),
      address_type: val("type"),
      country: val("country"),
      governorate: val("governorate"),
      city: val("city"),
      district: val("district"),
      street: val("street"),
      building: val("building"),
      floor: val("floor"),
      postal_code: val("postal_code"),
      maps_url: val("maps_url"),
      notes: val("notes"),
      is_default: !!(document.getElementById(prefix + "-addr-f-default") || {})
        .checked,
    };

    if (
      !requirePermission(
        partyType === "supplier" ? "updateSupplier" : "updateCustomer",
      )
    )
      return;

    // [NO-SAVE-FIRST] سجل جديد لسه ما اتحفظش — نحفظ العنوان في الـ pending
    // array المحلي بدل ما نضرب السيرفر؛ هيتبعت فعليًا مع باقي البيانات
    // فور نجاح حفظ العميل/المورد (_flushPendingPartyExtras)
    if (!partyId) {
      var pendingList = _partyPendingAddr[prefix] || (_partyPendingAddr[prefix] = []);
      if (addressId) {
        var existingIdx = pendingList.findIndex(function (a) {
          return a.id === addressId;
        });
        if (existingIdx !== -1) {
          data.id = addressId;
          pendingList[existingIdx] = data;
        }
      } else {
        data.id = _tmpPartyExtraId();
        pendingList.push(data);
      }
      NotificationEngine.success("تم حفظ العنوان مؤقتًا — هيتحفظ فعليًا مع الحفظ النهائي");
      closePartyAddressForm(prefix);
      loadPartyAddressesList(prefix, partyId, partyType);
      return;
    }

    var action = addressId ? "updatePartyAddress" : "addPartyAddress";
    // [SE-ROLLOUT] عبر SaveEngine.run بدل _freezeUI/_gsr اليدوي.
    SaveEngine.run({
      screen: "Parties.Address",
      entity: "party_address",
      recordId: addressId || null,
      data: data,
      fn: action,
      params: addressId
        ? [APP.currentUser.username, addressId, data]
        : [APP.currentUser.username, data],
      onSuccess: function (res) {
        NotificationEngine.success(res.message);
        closePartyAddressForm(prefix);
        loadPartyAddressesList(prefix, partyId, partyType);
      },
      onError: function (res) {
        NotificationEngine.error((res && res.message) || "تعذّر حفظ العنوان");
      },
    });
  }

  function deletePartyAddressConfirm(prefix, addressId, label) {
    var wrap = document.getElementById(prefix + "-addr-wrap");
    if (!wrap) return;
    var partyId = wrap.getAttribute("data-party-id");
    var partyType = wrap.getAttribute("data-party-type");

    confirmDelete(
      "حذف العنوان",
      "هل أنت متأكد من حذف العنوان «" + (label || "") + "»؟",
      function () {
        // [NO-SAVE-FIRST] سجل جديد لسه ما اتحفظش — حذف محلي فقط
        if (!partyId) {
          var pendingList = _partyPendingAddr[prefix] || [];
          var idx = pendingList.findIndex(function (a) {
            return a.id === addressId;
          });
          if (idx !== -1) pendingList.splice(idx, 1);
          NotificationEngine.success("تم الحذف");
          loadPartyAddressesList(prefix, partyId, partyType);
          return;
        }
        _freezeUI("⏳ جاري الحذف...");
        // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
        _gsr(
          "deletePartyAddress",
          [APP.currentUser.username, addressId, partyType],
          {
            onSuccess: function (res) {
              _unfreezeUI();
              NotificationEngine.success(res.message);
              loadPartyAddressesList(prefix, partyId, partyType);
            },
            onError: function (res) {
              _unfreezeUI();
              NotificationEngine.error((res && res.message) || "تعذّر الحذف");
            },
          },
        );
      },
    );
  }

  function setDefaultPartyAddress(prefix, addressId) {
    var wrap = document.getElementById(prefix + "-addr-wrap");
    if (!wrap) return;
    var partyId = wrap.getAttribute("data-party-id");
    var partyType = wrap.getAttribute("data-party-type");
    var state = _partyAddrCache[prefix] || { items: [] };
    var addr = (state.items || []).find(function (a) {
      return a.id === addressId;
    });
    if (!addr) return;

    // [NO-SAVE-FIRST] سجل جديد لسه ما اتحفظش — تحديث محلي فقط: نلغي
    // is_default من باقي عناوين نفس النوع ونفعّله على المختار
    if (!partyId) {
      (state.items || []).forEach(function (a) {
        a.is_default = a.address_type === addr.address_type && a.id === addressId;
      });
      NotificationEngine.success("تم التعيين");
      _renderPartyAddressesList(prefix);
      return;
    }

    // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
    _gsr(
      "setDefaultPartyAddress",
      [
        APP.currentUser.username,
        addressId,
        partyId,
        partyType,
        addr.address_type,
      ],
      {
        onSuccess: function (res) {
          NotificationEngine.success(res.message);
          loadPartyAddressesList(prefix, partyId, partyType);
        },
        onError: function (res) {
          NotificationEngine.error((res && res.message) || "تعذّر التعيين");
        },
      },
    );
  }

  var PARTY_DOC_TYPES = [
    "سجل تجاري",
    "بطاقة ضريبية",
    "هوية/بطاقة",
    "عقد",
    "آخر",
  ];
  // [DOC-ENGINE] تحويل التسمية العربية الظاهرة للمستخدم إلى مفتاح التوجيه
  // الذكي المستخدم في DocumentEngine.DOC_TYPE_ROUTING (Code_50)، عشان كل
  // مستند يترفع في الفولدر الصحيح تلقائيًا بدل ما المستخدم يختار المكان.
  function _partyDocTypeKey(arabicLabel) {
    var map = {
      "سجل تجاري": "commercial_register",
      "بطاقة ضريبية": "tax_card",
      "هوية/بطاقة": "national_id",
      عقد: "contract",
      آخر: "attachment",
    };
    return map[arabicLabel] || "attachment";
  }
  var _partyDocCache = {}; // { [prefix]: { partyId, partyType, items: [...] } }

  function _partyDocIcon(fileName) {
    var ext = String(fileName || "")
      .split(".")
      .pop()
      .toLowerCase();
    if (["jpg", "jpeg", "png", "gif", "webp"].indexOf(ext) !== -1)
      return "ti-photo";
    if (ext === "pdf") return "ti-file-type-pdf";
    if (["xlsx", "xls"].indexOf(ext) !== -1) return "ti-file-spreadsheet";
    return "ti-file";
  }

  // تحميل قائمة مستندات الطرف (Lazy — تُستدعى عند فتح تبويب "مستندات" أول مرة)
  function loadPartyDocumentsList(prefix, partyId, partyType) {
    var listEl = document.getElementById(prefix + "-doc-list");
    if (!listEl) return;
    // [NO-SAVE-FIRST] سجل جديد لسه ما اتحفظش — نعرض من الـ pending array
    // المحلي (نفس reference عشان الإضافة/الحذف اللاحق يعكس فورًا)
    if (!partyId) {
      if (!_partyPendingDocs[prefix]) _partyPendingDocs[prefix] = [];
      _partyDocCache[prefix] = {
        partyId: "",
        partyType: partyType,
        items: _partyPendingDocs[prefix],
      };
      _renderPartyDocumentsList(prefix);
      return;
    }
    // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
    _gsr("getPartyDocuments", [APP.currentUser.username, partyId, partyType], {
      onSuccess: function (res) {
        _partyDocCache[prefix] = {
          partyId: partyId,
          partyType: partyType,
          items: res.data || [],
        };
        _renderPartyDocumentsList(prefix);
      },
      onError: function (res) {
        if (listEl)
          listEl.innerHTML =
            '<div style="text-align:center;padding:16px;color:var(--danger);font-size:12px">' +
            esc((res && res.message) || "تعذّر تحميل المستندات") +
            "</div>";
      },
    });
  }

  function _handlePartyDocFile(e, prefix) {

  function _processPartyDocFile(file, prefix) {
    var wrap = document.getElementById(prefix + "-doc-wrap");
    if (!wrap) return;
    var partyId = wrap.getAttribute("data-party-id");
    var partyType = wrap.getAttribute("data-party-type");
    var partyCode = wrap.getAttribute("data-party-code") || "";
    var partyName = wrap.getAttribute("data-party-name") || "";

    if (file.size > 10 * 1024 * 1024) {
      NotificationEngine.error("حجم الملف يتجاوز 10MB");
      return;
    }

    var docTypeEl = document.getElementById(prefix + "-doc-f-type");
    var notesEl = document.getElementById(prefix + "-doc-f-notes");
    var docType = docTypeEl ? docTypeEl.value : "آخر";
    var notes = notesEl ? notesEl.value.trim() : "";

    var reader = new FileReader();
    reader.onload = function (ev) {
      var dataUrl = ev.target.result;
      var base64 = dataUrl.split(",")[1];
      if (!base64) {
        NotificationEngine.error("تعذّر قراءة الملف");
        return;
      }

      // [NO-SAVE-FIRST] سجل جديد لسه ما اتحفظش — نخزّن الملف محليًا (base64)
      // بدل ما نرفعه على Drive دلوقتي؛ هيترفع فعليًا فور نجاح حفظ
      // العميل/المورد (_flushPendingPartyExtras)
      if (!partyId) {
        if (!_partyPendingDocs[prefix]) _partyPendingDocs[prefix] = [];
        _partyPendingDocs[prefix].push({
          id: _tmpPartyExtraId(),
          _pending: true,
          file_name: file.name,
          mime_type: file.type,
          base64: base64,
          doc_type: docType,
          notes: notes,
        });
        NotificationEngine.success("تم إرفاق الملف — هيترفع تلقائيًا بعد حفظ " +
          (partyType === "supplier" ? "المورد" : "العميل"));
        closePartyDocumentForm(prefix);
        loadPartyDocumentsList(prefix, partyId, partyType);
        return;
      }

      var dropZone = document.getElementById(prefix + "-doc-drop-zone");
      if (dropZone) {
        dropZone.style.opacity = "0.6";
        dropZone.style.pointerEvents = "none";
      }
      NotificationEngine.loading("⏳ جاري رفع المستند على Drive...");

      // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
      _gsr(
        "uploadPartyDocument",
        [
          base64,
          file.name,
          file.type,
          partyId,
          {
            callerUser: APP.currentUser ? APP.currentUser.username : "admin",
            sessionToken: SESSION ? SESSION.token : "",
            partyType: partyType,
            code: partyCode,
            name: partyName,
            docType: _partyDocTypeKey(docType),
          },
        ],
        {
          onSuccess: function (result) {
            try {
              var resultStr = result.data;
              var res =
                typeof resultStr === "string"
                  ? JSON.parse(resultStr)
                  : resultStr;
              if (!res || !res.success || !res.viewUrl) {
                if (dropZone) {
                  dropZone.style.opacity = "";
                  dropZone.style.pointerEvents = "";
                }
                finishLoadingToast(
                  " فشل رفع المستند: " +
                    ((res && res.error) || "خطأ غير معروف"),
                  "error",
                );
                return;
              }
              // ── نجح الرفع على Drive — دلوقتي نسجل الميتاداتا في الشيت ──
              _gsr(
                "addPartyDocument",
                [
                  APP.currentUser.username,
                  {
                    party_id: partyId,
                    party_type: partyType,
                    doc_type: docType,
                    file_name: res.fileName || file.name,
                    file_url: res.viewUrl,
                    notes: notes,
                  },
                ],
                {
                  onSuccess: function (addResult) {
                    if (dropZone) {
                      dropZone.style.opacity = "";
                      dropZone.style.pointerEvents = "";
                    }
                    finishLoadingToast(addResult.message, "success");
                    closePartyDocumentForm(prefix);
                    loadPartyDocumentsList(prefix, partyId, partyType);
                  },
                  onError: function (addResult) {
                    if (dropZone) {
                      dropZone.style.opacity = "";
                      dropZone.style.pointerEvents = "";
                    }
                    finishLoadingToast(
                      (addResult && addResult.message) ||
                        "تعذّر حفظ بيانات المستند",
                      "error",
                    );
                  },
                },
              );
            } catch (e) {
              if (dropZone) {
                dropZone.style.opacity = "";
                dropZone.style.pointerEvents = "";
              }
              finishLoadingToast("خطأ في معالجة استجابة الرفع", "error");
            }
          },
          onError: function (result) {
            if (dropZone) {
              dropZone.style.opacity = "";
              dropZone.style.pointerEvents = "";
            }
            finishLoadingToast(
              " فشل الاتصال بالسيرفر: " + (result.message || ""),
              "error",
            );
          },
        },
      );
    };
    reader.readAsDataURL(file);
  }

        _gsr(

  // ── [NO-SAVE-FIRST] _flushPendingPartyExtras ────────────────────────────
  // بتتنادى فور نجاح إضافة عميل/مورد جديد. بترفع/تحفظ أي عناوين أو مستندات
  // اتضافت محليًا (pending) وهي لسه بتملأ النموذج، وترتبطهم بالـ id الحقيقي
  // اللي رجع من السيرفر — من غير ما المستخدم يحتاج يفتح شاشة التعديل تاني.
  function _flushPendingPartyExtras(prefix, newPartyId, partyType, partyCode, partyName) {
    var pendingAddr = (_partyPendingAddr[prefix] || []).slice();
    var pendingDocs = (_partyPendingDocs[prefix] || []).slice();
    _partyPendingAddr[prefix] = [];
    _partyPendingDocs[prefix] = [];
    if (!pendingAddr.length && !pendingDocs.length) return;
    if (!newPartyId) return;

    var addrDone = 0,
      addrFailed = 0,
      docDone = 0,
      docFailed = 0;
    var totalOps = pendingAddr.length + pendingDocs.length;
    var completedOps = 0;

    function checkAllDone() {
      completedOps++;
      if (completedOps < totalOps) return;
      var parts = [];
      if (pendingAddr.length)
        parts.push(addrDone + "/" + pendingAddr.length + " عنوان");
      if (pendingDocs.length)
        parts.push(docDone + "/" + pendingDocs.length + " مستند");
      var hadFailure = addrFailed > 0 || docFailed > 0;
      NotificationEngine[hadFailure ? "error" : "success"](
        (hadFailure ? " " : " ") +
          "تم حفظ " +
          parts.join(" و") +
          (hadFailure ? " (فشل جزء منها — راجع الشاشة)" : "") +
          " المرفقة أثناء إضافة " +
          (partyType === "supplier" ? "المورد" : "العميل"),
      ); // [UNIFY-NOTIF]
    }

    pendingAddr.forEach(function (addr) {
      var data = Object.assign({}, addr, {
        party_id: newPartyId,
        party_type: partyType,
      });
      delete data.id; // id المؤقت — السيرفر هيولّد id حقيقي
      _gsr("addPartyAddress", [APP.currentUser.username, data], {
        onSuccess: function () {
          addrDone++;
          checkAllDone();
        },
        onError: function () {
          addrFailed++;
          checkAllDone();
        },
      });
    });

    pendingDocs.forEach(function (doc) {
      _gsr(
        "uploadPartyDocument",
        [
          doc.base64,
          doc.file_name,
          doc.mime_type,
          newPartyId,
          {
            callerUser: APP.currentUser ? APP.currentUser.username : "admin",
            sessionToken: SESSION ? SESSION.token : "",
            partyType: partyType,
            code: partyCode || "",
            name: partyName || "",
            docType: _partyDocTypeKey(doc.doc_type),
          },
        ],
        {
          onSuccess: function (result) {
            try {
              var resultStr = result.data;
              var res =
                typeof resultStr === "string"
                  ? JSON.parse(resultStr)
                  : resultStr;
              if (!res || !res.success || !res.viewUrl) {
                docFailed++;
                checkAllDone();
                return;
              }
              _gsr(
                "addPartyDocument",
                [
                  APP.currentUser.username,
                  {
                    party_id: newPartyId,
                    party_type: partyType,
                    doc_type: doc.doc_type,
                    file_name: res.fileName || doc.file_name,
                    file_url: res.viewUrl,
                    notes: doc.notes,
                  },
                ],
                {
                  onSuccess: function () {
                    docDone++;
                    checkAllDone();
                  },
                  onError: function () {
                    docFailed++;
                    checkAllDone();
                  },
                },
              );
            } catch (e) {
              docFailed++;
              checkAllDone();
            }
          },
          onError: function () {
            docFailed++;
            checkAllDone();
          },
        },
      );
    });
  }

  function bindSuppliers() {
    var btnNew = document.getElementById("btn-new-supplier");
    if (btnNew) {
      btnNew.addEventListener("click", function () {
        requirePermission("addSupplier", function () {
          _resetPendingPartyExtras("sup");
          // [ACC-LOOKUP-FIX] نفس إصلاح العميل — دليل الحسابات لازم
          // يتحمّل قبل بناء المودال (راجع الشرح في bindCustomers أعلاه).
          ensureExtendedData(function () {
            ensurePartyCategoriesLoaded("supplier", function () {
              openDrawer(renderSupplierModal(null), 900);
              setTimeout(function () {
                _initPartyModalExtras("sup");
                initFinancialAccountSearcher("app-drawer");
                _applyDefaultPartyAccount("sup");
                // [AUTO-CODE] نفس منطق العميل بالظبط — الكود تسلسلي تلقائي
                // (1، 2، 3...) مستقل عن تسلسل العملاء.
                var supCodeEl = document.getElementById("sup-modal-code");
                if (supCodeEl) {
                  supCodeEl.value = "…";
                  // [EDITABLE-CODE] نفس إصلاح العميل — الكود قابل للتعديل.
                  supCodeEl.readOnly = false;
                  // [CODE-HANG-FIX] google.script.run بيصف نداءاته في طابور
                  // واحد بالتتابع — لو فيه نداء تقيل/معلّق شغال قبله (مثال:
                  // getSuppliers بطيء أو Stuck)، نداء الكود ده بيقعد ينتظر
                  // في الطابور من غير أي رد، فيفضل حقل الكود عالق على "…"
                  // بلا أي فيدباك للمستخدم. الحل: مؤقت Timeout صريح — لو
                  // معدّى 8 ثواني بلا رد، نوقف الانتظار ونسيب المستخدم يكتب
                  // الكود يدويًا بدل ما يفضل شايف "…" للأبد.
                  // [SE-ROLLOUT][CODE-HANG-FIX] عبر _gsr بدل google.script.run
                  // المباشر — نفس منطق العميل بالظبط، بنستخدم opts.timeout
                  // المدمج في _gsr (watchdog جاهز) بدل setTimeout يدوي منفصل.
                  if (typeof _gsr === "function") {
                    _gsr("getNextSupplierCode", [], {
                      timeout: 8000,
                      label: "getNextSupplierCode",
                      onSuccess: function (res) {
                        if (supCodeEl) supCodeEl.value = (res && res.data) || "";
                      },
                      onError: function (err) {
                        if (supCodeEl) {
                          supCodeEl.value = "";
                          supCodeEl.placeholder =
                            "تعذّر توليد الكود تلقائيًا — يرجى كتابته يدويًا";
                        }
                        console.error(
                          "[getNextSupplierCode] فشل توليد الكود:",
                          err,
                        );
                      },
                    });
                  }
                }
                // ── [VF] ربط أحداث التحقق على حقول المورد ───────────────
                if (typeof VF !== "undefined") {
                  VF.bind("sup-modal-name", VF.RULES.requiredText("اسم المورد"));
                  // [PARITY-CUST] الكود إلزامي وأساسي (فريد) لكل مورد
                  VF.bind("sup-modal-code", VF.RULES.requiredText("كود المورد"));
                  VF.bind("sup-modal-phone", VF.RULES.phone(false));
                  VF.bind("sup-modal-email", VF.RULES.email(false));
                  // [ACC-REQUIRED] حساب الذمم الدائنة بقى إلزامي
                  VF.bind(
                    "sup-modal-account-id",
                    VF.RULES.requiredSelect("حساب الذمم الدائنة الخاص بالمورد"),
                  );
                  // [PARTY-VALIDATION] باقي الحقول الموسّعة (بدون حد ائتمان — لا يوجد للموردين)
                  _bindPartyExtraValidation("sup", { hasCreditLimit: false });
                  _bindPartyCodeDuplicateCheck("sup", "");
                }
              }, 100);
            });
          });
        });
      });
    }

    // [DATA-UNIFY] الموردون أصبحوا جزءاً من الحزمة الأساسية أيضاً —
    // [PERF-SUPPLIERS-FIRST-PAINT] نفس إصلاح العملاء: الجدول يتعرض
    // فورًا من APP.data.suppliers (الجاهزة غالبًا من getAllData عند فتح
    // التطبيق) من غير ما يستنى تحميل شجرة تصنيفات الموردين، اللي كانت
    // بتأخّر أول ظهور للجدول برحلة إضافية للسيرفر (ensurePartyCategoriesLoaded
    // → _catLoad) حتى لو بيانات الموردين نفسها موجودة أصلاً.
    // [FIX-FIRST-VISIT-EMPTY] نفس إصلاح العملاء — [] الافتراضية كانت
    // بتتفسّر غلط كـ"محمّلة بالفعل" فيفضل الجدول فاضي أول زيارة بعد اللوجين.
    if (Array.isArray(APP.data.suppliers) && APP.data.suppliers.length > 0) {
      filterSuppliersTable();
    } else {
      _loadSuppliers();
    }

    // §CAT-P1 — فلتر التصنيفات الهرمية في أعلى قائمة الموردين، بيتحمّل
    // بالتوازي وبيتفعّل تلقائيًا لما يخلص (من غير ما يعطّل رسم الجدول)
    ensurePartyCategoriesLoaded("supplier", function () {
      populatePartyCategoryFilterSelect(
        "supplier",
        document.getElementById("sup-category-filter"),
      );
      if (Array.isArray(APP.data.suppliers)) filterSuppliersTable();
    });
  }

  function _loadSuppliers() {
    // [SE-ROLLOUT] عبر DL.Parties.getSuppliers بدل google.script.run المباشر — Rule 9/10
    // [SESSION-FIX] لازم نبعت username + sessionToken معًا (object) مش username
    // كنص فاضي، لأن _requirePermission لو استقبلت string بس تعتبر التوكن ""
    // وترفض العملية دايمًا برسالة "جلسة غير صالحة" حتى لو الجلسة سليمة فعليًا.
    DL.Parties.getSuppliers(
      {
        callerUser: APP.currentUser.username,
        sessionToken: APP.currentUser.sessionToken || (SESSION && SESSION.token),
      },
      {
      onSuccess: function (res) {

        if (document.getElementById("suppliers-ce-container")) {
          filterSuppliersTable();

      },
      onError: function (res) {
        NotificationEngine.error((res && res.message) || "خطأ في تحميل الموردين");
      },
    });

  // ColumnEngine ببيانات مفلترة فقط؛ البحث النصي بقى داخل شريط أدوات
  // المحرك نفسه.
  var _filterSuppliersTimer = null;
  function filterSuppliersTable() {
    clearTimeout(_filterSuppliersTimer);
    _filterSuppliersTimer = setTimeout(function () {
      var catFilterEl = document.getElementById("sup-category-filter");
      var catFilter = catFilterEl ? catFilterEl.value : "";
      var allowedCatIds = catFilter
        ? getPartyCategoryDescendantIdsClient("supplier", catFilter)
        : null;
      var suppliers = (APP.data.suppliers || []).slice().reverse();
      var rows = allowedCatIds
        ? suppliers.filter(function (s) {
            return allowedCatIds.indexOf(String(s.category_id || "")) !== -1;
          })
        : suppliers;
      _renderSuppliersTableCE(rows);
    }, 200);
  }

                    obRes.message);
                },

        },
      });

  // — _filterItemsByWarehouse
  function _filterItemsByWarehouse(selectId, whName, type) {
    var sel = document.getElementById(selectId);
    if (!sel) return;

    var prevVal = sel.value; // احتفظ بالاختيار السابق لو لازم
    var items = APP.data.items || [];

    var filtered;
    if (!whName) {
      // مفيش مخزن مختار → كل الأصناف
      filtered = items;
    } else if (type === "OUT") {
      // صادر → الأصناف اللي عندها رصيد في المخزن ده
      // FIX: يشمل OpeningStock (بدون warehouse) + Stock
      filtered = items.filter(function (item) {
        var idStr = String(item.id);

        // رصيد من Stock للمخزن المحدد
        var stockQty = (APP.data.stock || [])
          .filter(function (s) {
            return String(s.item_id) === idStr && s.warehouse === whName;
          })
          .reduce(function (a, s) {
            return a + Number(s.quantity || 0);
          }, 0);

        // رصيد افتتاحي (OpeningStock بدون warehouse — يُحسب دائماً)
        var openingQty = (APP.data.openingStock || [])
          .filter(function (o) {
            return String(o.item_id) === idStr;
          })
          .reduce(function (a, o) {
            return a + Number(o.quantity || 0);
          }, 0);

        return stockQty + openingQty > 0;
      });
    } else {
      // وارد → الأصناف اللي مجموعتها مرتبطة بالمخزن ده
      var wh = (APP.data.warehouses || []).find(function (w) {
        return w.name === whName || w.id === whName;
      });
      var whId = wh ? wh.id : whName;
      var whNm = wh ? wh.name : whName;
      var grpIds = (APP.data.groups || [])
        .filter(function (g) {
          return g.warehouse_id === whId || g.warehouse_id === whNm;
        })
        .map(function (g) {
          return String(g.id);
        });
      filtered = grpIds.length
        ? items.filter(function (i) {
            return grpIds.indexOf(String(i.group)) !== -1;
          })
        : items;
    }

    var html = '<option value="">— اختر الصنف —</option>';
    filtered.forEach(function (i) {
      // للصادر: أظهر الرصيد جنب الاسم عشان يسهّل الاختيار
      var label = esc(i.name) + " — " + esc(i.code || i.id);
      if (type === "OUT" && whName) {
        var qty = (APP.data.stock || [])
          .filter(function (s) {
            return String(s.item_id) === String(i.id) && s.warehouse === whName;
          })
          .reduce(function (a, s) {
            return a + Number(s.quantity || 0);
          }, 0);
      }
      html +=
        '<option value="' +
        esc(i.id) +
        '"' +
        (i.id === prevVal ? " selected" : "") +
        ">" +
        label +
        "</option>";
    });

    sel.innerHTML = html;

    // لو الاختيار القديم مش موجود في الفلتر الجديد → صفّر
    if (
      prevVal &&
      !filtered.find(function (i) {
        return String(i.id) === String(prevVal);
      })
    ) {
      sel.value = "";
      // صفّر معلومات الرصيد
      var infoId = selectId.replace("-item", "-stock-info");
      var infoEl = document.getElementById(infoId);
      if (infoEl) infoEl.innerHTML = "";
    }
  }

  // — _getItemStockInWh
  // FIX: يشمل OpeningStock (بدون warehouse) + Stock (بالمخزن)
  function _getItemStockInWh(itemId, whName) {
    if (!itemId) return 0;
    var idStr = String(itemId);

    // رصيد من Stock (حركات مخزنية مرتبطة بمخزن محدد)
    var stockQty = (APP.data.stock || [])
      .filter(function (s) {
        return (
          String(s.item_id) === idStr && (!whName || s.warehouse === whName)
        );
      })
      .reduce(function (a, s) {
        return a + Number(s.quantity || 0);
      }, 0);

    // رصيد افتتاحي (OpeningStock بدون warehouse — يُحسب دائماً)
    var openingQty = (APP.data.openingStock || [])
      .filter(function (o) {
        return String(o.item_id) === idStr;
      })
      .reduce(function (a, o) {
        return a + Number(o.quantity || 0);
      }, 0);

    return stockQty + openingQty;
  }

  // — _updateInStockInfo
  function _updateInStockInfo(itemId, whName) {
    var el = document.getElementById("in-stock-info");
    if (!el) return;
    if (!itemId) {
      el.innerHTML = "";
      return;
    }
    var wh = whName || (document.getElementById("in-to") || {}).value || "";
    var qty = _getItemStockInWh(itemId, wh);
    var item = (APP.data.items || []).find(function (i) {
      return String(i.id) === String(itemId);
    });
    var unit = item ? item.unit || "" : "";
    el.innerHTML =
      '<span style="color:var(--text3)">الرصيد الحالي: </span>' +
      '<b style="color:var(--success)">' +
      qty +
      " " +
      esc(unit) +
      "</b>" +
      (wh
        ? ' <span style="color:var(--text3);font-size:11px">في ' +
          esc(wh) +
          "</span>"
        : "");
  }

  // — _updateOutStockInfo
  function _updateOutStockInfo(itemId, whName) {
    var el = document.getElementById("out-stock-info");
    if (!el) return;
    if (!itemId) {
      el.innerHTML = "";
      return;
    }
    var wh = whName || (document.getElementById("out-from") || {}).value || "";
    var qty = _getItemStockInWh(itemId, wh);
    var item = (APP.data.items || []).find(function (i) {
      return String(i.id) === String(itemId);
    });
    var unit = item ? item.unit || "" : "";
    var minQty = item ? Number(item.min_qty || 0) : 0;
    var color =
      qty <= 0
        ? "var(--danger)"
        : minQty > 0 && qty <= minQty
          ? "var(--warning)"
          : "var(--success)";
    var warn =
      qty <= 0
        ? " نفد المخزون!"
        : minQty > 0 && qty <= minQty
          ? " رصيد منخفض"
          : "";
    el.innerHTML =
      '<span style="color:var(--text3)">الرصيد المتاح: </span>' +
      '<b style="color:' +
      color +
      '">' +
      qty +
      " " +
      esc(unit) +
      warn +
      "</b>" +
      (wh
        ? ' <span style="color:var(--text3);font-size:11px">في ' +
          esc(wh) +
          "</span>"
        : "");
  }

    ];
    var hash = 0;
    for (var i = 0; i < username.length; i++) hash += username.charCodeAt(i);
    return colors[hash % colors.length];
  }

  // — colorNameToHex
  function colorNameToHex(name) {
    if (!name) return "#e2e8f5";
    var n = name.trim().toLowerCase();
    var norm =
      typeof _normalizeColor === "function" ? _normalizeColor(name) : n;

    // 0. أهم خطوة: ابحث في ألوان الشيت (APP.data.colors) أولاً
    if (typeof APP !== "undefined" && APP.data && APP.data.colors) {
      var savedColors = APP.data.colors;
      for (var sci = 0; sci < savedColors.length; sci++) {
        var sc = savedColors[sci];
        if (!sc || !sc.hex) continue;
        var scName = (sc.name || "").trim();
        var scNorm =
          typeof _normalizeColor === "function"
            ? _normalizeColor(scName)
            : scName.toLowerCase();
        if (
          scName === name.trim() ||
          scName.toLowerCase() === n ||
          scNorm === norm ||
          (sc.code &&
            sc.code.trim().toUpperCase() === name.trim().toUpperCase())
        ) {
          if (typeof _saveColorToCache === "function")
            _saveColorToCache(name, sc.hex);
          return sc.hex;
        }
      }
    }

    // 1. خريطة الألوان المدمجة الكبيرة (CSS_COLOR_MAP)
    if (typeof CSS_COLOR_MAP !== "undefined") {
      if (CSS_COLOR_MAP[name.trim()]) return CSS_COLOR_MAP[name.trim()];
      if (CSS_COLOR_MAP[n]) return CSS_COLOR_MAP[n];
      var keys = Object.keys(CSS_COLOR_MAP);
      for (var ki = 0; ki < keys.length; ki++) {
        var kn =
          typeof _normalizeColor === "function"
            ? _normalizeColor(keys[ki])
            : keys[ki].toLowerCase();
        if (kn === norm) return CSS_COLOR_MAP[keys[ki]];
      }
    }

    // 2. كاش الألوان المحلوله ذكياً
    if (typeof _getColorFromCache === "function") {
      var cached = _getColorFromCache(name);
      if (cached) return cached;
    }

    // 3. CSS built-in (للأسماء الإنجليزية الموحدة)
    try {
      var el = document.createElement("div");
      el.style.color = n;
      if (el.style.color) {
        document.body.appendChild(el);
        var comp = window.getComputedStyle(el).color;
        document.body.removeChild(el);
        var m = comp.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
        if (m) {
          var hex =
            "#" +
            [m[1], m[2], m[3]]
              .map(function (x) {
                var h = parseInt(x).toString(16);
                return h.length < 2 ? "0" + h : h;
              })
              .join("");
          if (typeof _saveColorToCache === "function")
            _saveColorToCache(name, hex);
          return hex;
        }
      }
    } catch (e) {}

    // 4. طلب تحليل ذكي من السيرفر (async — مش بيوقف الرسم)
    if (typeof _queueColorResolution === "function") {
      _queueColorResolution(name);
    }

    // 5. Fallback: رمادي محايد بدل HSL عشوائي
    return "#94a3b8";
  }

  // ── Permissions: Toggle Logic ──

  // — _roleTogglePerm
  function _roleTogglePerm(el, key) {
    var cb = el.classList.contains("perm-checkbox-custom")
      ? el
      : el.closest(".perm-row-pro").querySelector(".perm-checkbox-custom");
    if (!cb || cb.classList.contains("disabled")) return;
    cb.classList.toggle("checked");
    // تحديث شريط التقدم
    var list = document.getElementById("role-perm-list");
    if (!list) return;
    var total = list.querySelectorAll(".perm-checkbox-custom").length;
    var active = list.querySelectorAll(".perm-checkbox-custom.checked").length;
    var pct = total > 0 ? Math.round((active / total) * 100) : 0;
    var bar = document.getElementById("role-perm-bar");
    var badge = document.getElementById("role-perm-badge");
    if (bar) bar.style.width = pct + "%";
    if (badge) badge.textContent = active + " من " + total;
  }

  // — _ovToggleGrant
  function _ovToggleGrant(cb, key) {
    if (cb.classList.contains("disabled")) return;
    cb.classList.toggle("checked");
    var row = cb.closest(".perm-row-pro");
    if (!row) return;
    if (cb.classList.contains("checked")) {
      row.classList.remove("state-denied");
      row.classList.add("state-extra");
      var denyCb = row.querySelector(".ov-deny-cb");
      if (denyCb) denyCb.checked = false;
    } else {
      row.classList.remove("state-extra");
    }
  }

  // — _ovToggleDeny
  function _ovToggleDeny(inp, key) {
    var row = inp.closest(".perm-row-pro");
    if (!row) return;
    if (inp.checked) {
      row.classList.add("state-denied");
      row.classList.remove("state-extra");
      var grantCb = row.querySelector(".perm-checkbox-custom:not(.disabled)");
      if (grantCb) grantCb.classList.remove("checked");
    } else {
      row.classList.remove("state-denied");
    }
  }

  function custDashboardSearch(value) {
    var box = document.getElementById("cd-search-results");
    if (!box) return;
    var q = (value || "").trim();
    if (!q) {
      box.innerHTML = "";
      return;
    }
    var list = (APP.data && APP.data.customers) || [];
    var qLower = q.toLowerCase();
    var matches = list
      .filter(function (c) {
        return (
          (c.name && c.name.toLowerCase().indexOf(qLower) !== -1) ||
          (c.phone && String(c.phone).toLowerCase().indexOf(qLower) !== -1)
        );
      })
      .slice(0, 8);
    if (!matches.length) {
      box.innerHTML =
        "<div class='dw-list-item' style='cursor:default'><span class='dw-list-text'>لا توجد نتائج مطابقة</span></div>";
      return;
    }
    box.innerHTML = matches
      .map(function (c) {
        return (
          "<div class='dw-list-item' style='cursor:pointer' onclick=\"navigate('customers')\">" +
          "<span class='dw-list-icon'><i class='ti ti-user'></i></span>" +
          "<span class='dw-list-text'>" +
          esc(c.name || "") +
          "</span>" +
          "</div>"
        );
      })
      .join("");
  }

  function bindPartyAutocomplete() {
    var partyInputs = document.querySelectorAll("[data-party-autocomplete]");
    partyInputs.forEach(function (inp) {
      inp.addEventListener("input", function () {
        var val = this.value.toLowerCase().trim();
        var type = this.dataset.partyType || "customer";
        var list =
          APP.data[type === "customer" ? "customers" : "suppliers"] || [];
        var matches = list
          .filter(function (p) {
            return (p.name || "").toLowerCase().includes(val);
          })
          .slice(0, 8);
        // يعبأ datalist لو موجود
        var listId = this.getAttribute("list");
        var dl = listId && document.getElementById(listId);
        if (dl) {
          dl.innerHTML = matches
            .map(function (p) {
              return (
                "<option value='" + esc(p.id) + "'>" + esc(p.name) + "</option>"
              );
            })
            .join("");
        }
      });
    });
