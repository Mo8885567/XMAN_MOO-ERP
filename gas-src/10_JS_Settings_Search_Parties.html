<script>
  // ───────────────────────────────────────────────────────────────
  // JS_Settings_Search_Parties.html — جزء 10/10 من JavaScript.html الأصلي
  // النطاق الأصلي: سطر 25915–28887 | إعدادات النظام + البحث الشامل + العملاء والموردين + كشف الحركات
  // ───────────────────────────────────────────────────────────────

  // §AG  System Settings — إعدادات النظام
  // ─────────────────────────────────────────────────────────────

  /** حالة الإعدادات الأصلية للمقارنة عند الإلغاء */
  var _originalSettings = {};

  /** تحديث شريط مؤشر المخزون البصري */
  function _opsUpdateStockBar(v) {
    var pct = Math.min(100, Math.max(0, parseInt(v) || 0));
    var fill = document.getElementById("ops-stock-fill");
    var val = document.getElementById("ops-stock-val");
    if (fill) {
      fill.style.width = pct + "%";
      if (pct <= 10) fill.style.background = "#ef4444";
      else if (pct <= 25) fill.style.background = "#f59e0b";
      else fill.style.background = "#22c55e";
    }
    if (val) val.textContent = pct + "%";
    _markSettingsDirty("operations");
  }

  // ── اختبار صوت مباشر من شاشة الإعدادات ──
  function _asTest(soundId) {
    if (typeof AS === "undefined") {
      NotificationEngine.warning("خدمة الأصوات غير محملة");
      return;
    }
    // تجاوز الـ debounce للاختبار
    if (AS._lastPlay) AS._lastPlay[soundId] = 0;
    AS.play(soundId);
  }

  function bindSystemSettings() {
    // §AS — تهيئة لوحة إعدادات الأصوات تحدث فقط عند فتح القسم من _switchSettingsSection
    // حفظ نسخة أصلية
    _originalSettings = JSON.parse(JSON.stringify(APP.companySettings || {}));

    // ── ربط حقول التحديث الفوري للـ Preview ──
    var previewFields = {
      "sf-company_name": "preview-company-name",
      "sf-tagline": "preview-tagline",
      "sf-phone": "preview-phone",
      "sf-email": "preview-email",
      "sf-address": "preview-address",
    };

    Object.keys(previewFields).forEach(function (inputId) {
      var el = document.getElementById(inputId);
      if (!el) return;
      el.addEventListener("input", function () {
        var prev = document.getElementById(previewFields[inputId]);
        if (prev) prev.textContent = el.value;
        _markSettingsDirty("company");
      });
    });

    // ── ربط حقل اللوجو URL ──
    var logoUrlEl = document.getElementById("sf-logo_url");
    if (logoUrlEl) {
      logoUrlEl.addEventListener("input", function () {
        _markSettingsDirty("branding");
      });
    }

    // ── ربط الـ toggles ──
    var toggleIds = [
      "sf-allow_negative_stock",
      "sf-require_notes_on_tx",
      "sf-auto_backup",
      "sf-show_cost_price",
      "sf-enable_production",
    ];
    toggleIds.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener("change", function () {
          _markSettingsDirty("operations");
        });
      }
    });

    // ── ربط باقي الحقول للـ dirty detection ──
    var allFields = document.querySelectorAll('[id^="sf-"]');
    allFields.forEach(function (el) {
      var ev = el.tagName === "TEXTAREA" ? "input" : "input";
      el.addEventListener(ev, function () {
        // تحديد القسم من الـ section الأب
        var section = el.closest(".settings-section");
        if (section) {
          var sectionId = section.id.replace("settings-section-", "");
          _markSettingsDirty(sectionId);
        }
      });
    });
  }

  // ── التنقل بين الأقسام ──
  function _switchSettingsSection(id) {
    document.querySelectorAll(".settings-section").forEach(function (s) {
      s.classList.remove("active");
    });
    document.querySelectorAll(".settings-nav-item").forEach(function (n) {
      n.classList.remove("active");
    });
    var sec = document.getElementById("settings-section-" + id);
    if (sec) sec.classList.add("active");
    var nav = document.getElementById("snav-" + id);
    if (nav) nav.classList.add("active");

    // ── تهيئة شريط المخزون عند فتح قسم التشغيل ──
    if (id === "operations") {
      var pctEl = document.getElementById("sf-min_stock_alert_pct");
      if (pctEl) _opsUpdateStockBar(pctEl.value);
    }

    // ── تهيئة صفحة صوت المساعد ──
    if (id === "ai_voice") {
      setTimeout(_initVoiceSettingsUI, 50);
    }

    // ── تهيئة أصوات النظام ──
    if (id === "audio") {
      setTimeout(function () {
        // مزامنة الـ toggles مع الإعدادات المحفوظة من AS
        if (typeof AS !== "undefined" && typeof AS.getSettings === "function") {
          var s = AS.getSettings();
          // مستوى الصوت
          var volSlider = document.getElementById("as_volume_slider");
          var volPct = document.getElementById("as_vol_pct");
          if (volSlider) {
            volSlider.value = Math.round((s.volume || 0.55) * 100);
          }
          if (volPct) {
            volPct.textContent = Math.round((s.volume || 0.55) * 100) + "%";
          }
          // الـ toggles
          var map = {
            as_enabled: "enabled",
            as_muted: "muted",
            as_enableButtons: "enableButtons",
            as_enableSuccess: "enableSuccess",
            as_enableError: "enableError",
            as_enableWarning: "enableWarning",
            as_enableNotif: "enableNotif",
            as_enableSystem: "enableSystem",
          };
          Object.keys(map).forEach(function (domId) {
            var el = document.getElementById(domId);
            if (!el) return;
            var val = s[map[domId]];
            // دعم كلا نوعي العناصر: checkbox عادي أو toggle custom
            if (el.type === "checkbox") {
              el.checked = !!val;
            } else {
              el.classList.toggle("checked", !!val);
            }
          });
          // ربط التغييرات
          Object.keys(map).forEach(function (domId) {
            var el = document.getElementById(domId);
            if (!el) return;
            el.onchange = function () {
              var patch = {};
              patch[map[domId]] =
                el.type === "checkbox"
                  ? el.checked
                  : el.classList.contains("checked");
              AS.setSettings(patch);
            };
          });

          // ── [VARIANTS] بناء منتقي نغمة كل تصنيف ──
          _buildVariantPicker();
        }
      }, 150);
    }

    // ── [VARIANTS] بناء واجهة اختيار نغمة كل نوع تنبيه ──
    var VARIANT_CATS = [
      { cat: "success", icon: "", label: "عمليات ناجحة" },
      { cat: "error", icon: "", label: "أخطاء" },
      { cat: "warning", icon: "", label: "تحذيرات" },
      { cat: "notification", icon: "", label: "إشعارات" },
      { cat: "system", icon: "", label: "نظام (دخول/خروج)" },
    ];

    function _buildVariantPicker() {
      var host = document.getElementById("as-variant-picker");
      if (!host || typeof AS === "undefined") return;

      host.innerHTML = VARIANT_CATS.map(function (c) {
        var variants = AS.getVariants(c.cat) || [];
        var current = AS.getSoundChoice(c.cat);
        var options = variants
          .map(function (v) {
            return (
              '<option value="' +
              v.id +
              '"' +
              (v.id === current ? " selected" : "") +
              ">" +
              v.label +
              "</option>"
            );
          })
          .join("");

        return (
          '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-radius:10px">' +
          '<span style="font-size:16px">' +
          c.icon +
          "</span>" +
          '<span style="flex:1;font-size:13px;font-weight:600;color:var(--text2)">' +
          c.label +
          "</span>" +
          '<select data-variant-cat="' +
          c.cat +
          '" style="min-width:140px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text1);font-size:13px">' +
          options +
          "</select>" +
          '<button type="button" data-variant-preview="' +
          c.cat +
          '" class="btn btn-secondary btn-sm">▶ تجربة</button>' +
          "</div>"
        );
      }).join("");

      // اختيار نغمة جديدة → حفظ فوري + تجربة سريعة
      host.querySelectorAll("[data-variant-cat]").forEach(function (sel) {
        sel.addEventListener("change", function () {
          var cat = sel.getAttribute("data-variant-cat");
          AS.setSoundChoice(cat, sel.value);
          AS.previewVariant(cat, sel.value);
        });
      });

      // زر التجربة → يشغّل النغمة المختارة حالياً في القائمة (محفوظة أو لا)
      host.querySelectorAll("[data-variant-preview]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cat = btn.getAttribute("data-variant-preview");
          var sel = host.querySelector('[data-variant-cat="' + cat + '"]');
          AS.previewVariant(cat, sel ? sel.value : AS.getSoundChoice(cat));
        });
      });
    }

    // ── تهيئة إعدادات الواتساب (lazy render) ──
    if (id === "whatsapp") {
      setTimeout(function () {
        var container = document.getElementById("whatsapp-settings-container");
        if (!container) return;
        var html = "";
        if (canDo("sendWhatsapp") || canDo("manageWhatsappTemplates")) {
          if (typeof renderWhatsappSettingsSection === "function") {
            try {
              html = renderWhatsappSettingsSection();
            } catch (e) {
              html =
                '<div class="settings-card"><div class="settings-card-body">' +
                '<div style="padding:20px;color:var(--danger)"> خطأ في تحميل إعدادات واتساب: ' +
                (e.message || e) +
                "</div>" +
                "</div></div>";
            }
          } else {
            html =
              '<div class="settings-card"><div class="settings-card-header">' +
              '<div class="settings-card-header-icon" style="background:rgba(37,211,102,.12)">' +
              '<svg width="22" height="22" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.556 4.12 1.523 5.847L0 24l6.332-1.494A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.793 9.793 0 01-5.023-1.378l-.36-.213-3.727.879.936-3.606-.235-.37A9.793 9.793 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>' +
              "</div><div><h3>إعدادات واتساب</h3><p>وحدة الواتساب غير محملة</p></div></div></div>";
          }
        } else {
          html =
            '<div class="settings-card"><div class="settings-card-header">' +
            '<div class="settings-card-header-icon" style="background:rgba(37,211,102,.12)">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.556 4.12 1.523 5.847L0 24l6.332-1.494A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.793 9.793 0 01-5.023-1.378l-.36-.213-3.727.879.936-3.606-.235-.37A9.793 9.793 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>' +
            "</div><div><h3>إعدادات واتساب</h3><p>إعدادات الاتصال وإدارة القوالب</p></div></div>" +
            '<div class="settings-card-body"><div style="display:flex;align-items:center;gap:12px;padding:20px;background:var(--bg2,#f8fafc);border-radius:10px;border:1px dashed var(--border,#e2e8f0)">' +
            '<i class="ti ti-lock" style="font-size:28px;color:#94a3b8"></i>' +
            '<div><div style="font-weight:600;color:var(--text1,#1e293b);margin-bottom:4px">ليس لديك صلاحية لعرض إعدادات واتساب</div>' +
            '<div style="font-size:0.85em;color:var(--text2,#64748b)">تواصل مع مدير النظام لمنح الصلاحيات اللازمة</div></div></div></div></div>';
        }
        container.innerHTML = html;
      }, 80);
    }

    // ── تحميل بيانات الباكاب عند فتح القسم ──
    if (id === "backup") {
      // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
      _gsr("getBackupStatus", null, {
        onSuccess: function (res) {
          var d = res.data || {};
          var lastEl = document.getElementById("backup-last-info");
          var countEl = document.getElementById("backup-count-info");
          if (lastEl)
            lastEl.innerHTML = d.last_backup
              ? fmtDateTime(d.last_backup.time)
              : "<span style='color:var(--text3)'>لم يتم إنشاء أي باكاب بعد</span>";
          if (countEl)
            countEl.textContent =
              "عدد النسخ المحفوظة: " + (d.backup_count || 0);
          // ── تعبئة إعدادات الجدول ──
          if (d.schedule) {
            var freqEl = document.getElementById("backup-frequency");
            var hourEl = document.getElementById("backup-hour");
            var dayEl = document.getElementById("backup-day");
            if (freqEl) freqEl.value = d.schedule.frequency || "daily";
            if (hourEl) hourEl.value = String(d.schedule.hour || 3);
            if (dayEl) dayEl.value = String(d.schedule.day || 1);
            _toggleBackupDayField(d.schedule.frequency || "daily");
          }
        },
        onError: function () {
          var lastEl = document.getElementById("backup-last-info");
          if (lastEl) lastEl.textContent = "تعذّر تحميل البيانات";
        },
      });

      // ── إظهار/إخفاء حقل اليوم عند تغيير التكرار ──
      var freqSel = document.getElementById("backup-frequency");
      if (freqSel) {
        freqSel.addEventListener("change", function () {
          _toggleBackupDayField(this.value);
        });
      }
    }
  }
  // ── تعليم القسم كـ dirty ──
  function _markSettingsDirty(section) {
    var hint = document.getElementById("save-hint-" + section);
    if (hint) {
      hint.textContent = " يوجد تغييرات غير محفوظة";
      hint.classList.add("dirty");
    }
  }

  // ── إلغاء التغييرات وإعادة القيم الأصلية ──
  function _resetSettingsSection(section) {
    APP.companySettings = JSON.parse(JSON.stringify(_originalSettings));
    renderPage("system_settings");
    NotificationEngine.info("تم إلغاء التغييرات");
  }

  // ── اللوجو Tab ──
  function _switchLogoTab(tab) {
    document.querySelectorAll(".logo-tab").forEach(function (t) {
      t.classList.remove("active");
    });
    document.querySelectorAll(".logo-tab-panel").forEach(function (p) {
      p.classList.remove("active");
    });
    var t = document.getElementById("logo-tab-" + tab);
    var p = document.getElementById("logo-panel-" + tab);
    if (t) t.classList.add("active");
    if (p) p.classList.add("active");
  }

  function _previewLogoFromUrl() {
    var urlEl = document.getElementById("sf-logo_url");
    if (!urlEl || !urlEl.value.trim()) {
      NotificationEngine.warning("أدخل رابط صورة أولاً");
      return;
    }
    var url = urlEl.value.trim();

    // معاينة في الـ preview card
    var prevWrap = document.getElementById("preview-logo-wrap");
    if (prevWrap)
      prevWrap.innerHTML =
        '<img src="' +
        url +
        '" alt="لوجو" onerror="this.parentElement.innerHTML=\'<span class=logo-placeholder></span>\'">';

    // معاينة في الـ upload preview
    var upPrev = document.getElementById("logo-upload-preview");
    if (upPrev) upPrev.innerHTML = '<img src="' + url + '" alt="لوجو">';

    NotificationEngine.success("تم تحديث معاينة اللوجو");
  }

  function _clearLogo() {
    var urlEl = document.getElementById("sf-logo_url");
    if (urlEl) urlEl.value = "";
    var prevWrap = document.getElementById("preview-logo-wrap");
    if (prevWrap)
      prevWrap.innerHTML = '<span class="preview-logo-placeholder"></span>';
    var upPrev = document.getElementById("logo-upload-preview");
    if (upPrev) upPrev.innerHTML = '<span class="logo-placeholder"></span>';
    _markSettingsDirty("branding");
    NotificationEngine.info("تم إزالة اللوجو");
  }

  // ── Drag & Drop اللوجو ──
  function _logoDragOver(e) {
    e.preventDefault();
    var zone = document.getElementById("logo-drop-zone");
    if (zone) zone.classList.add("drag-over");
  }

  function _logoDragLeave(e) {
    var zone = document.getElementById("logo-drop-zone");
    if (zone) zone.classList.remove("drag-over");
  }

  function _logoDrop(e) {
    e.preventDefault();
    var zone = document.getElementById("logo-drop-zone");
    if (zone) zone.classList.remove("drag-over");
    var file =
      e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) _processLogoFile(file);
  }

  function _handleLogoFile(e) {
    var file = e.target.files && e.target.files[0];
    if (file) _processLogoFile(file);
  }

  function _processLogoFile(file) {
    if (!file.type.startsWith("image/")) {
      NotificationEngine.error("يرجى اختيار ملف صورة صالح");
      return;
    }
    if (file.size > 2 * 1024 * 1024) {
      NotificationEngine.error("حجم الصورة يتجاوز 2MB");
      return;
    }

    var reader = new FileReader();
    reader.onload = function (ev) {
      var dataUrl = ev.target.result;

      // ── عرض معاينة فورية بالـ base64 ──
      var upPrev = document.getElementById("logo-upload-preview");
      if (upPrev) upPrev.innerHTML = '<img src="' + dataUrl + '" alt="لوجو">';
      var prevWrap = document.getElementById("preview-logo-wrap");
      if (prevWrap)
        prevWrap.innerHTML = '<img src="' + dataUrl + '" alt="لوجو">';

      // ── رفع على Google Drive ──
      var base64 = dataUrl.split(",")[1];
      if (!base64) {
        NotificationEngine.error("تعذّر قراءة الصورة");
        return;
      }

      var dropZone = document.getElementById("logo-drop-zone");
      if (dropZone) {
        dropZone.style.opacity = "0.6";
        dropZone.style.pointerEvents = "none";
      }
      NotificationEngine.loading("⏳ جاري رفع اللوجو على Drive...");

      // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
      _gsr(
        "uploadFile",
        [
          base64,
          file.name,
          file.type,
          {
            callerUser: APP.currentUser ? APP.currentUser.username : "admin",
            userName: APP.currentUser
              ? APP.currentUser.full_name || APP.currentUser.username
              : "admin",
            moduleName: "لوجو الشركة",
            sessionToken: SESSION ? SESSION.token : "",
          },
        ],
        {
          onSuccess: function (result) {
            if (dropZone) {
              dropZone.style.opacity = "";
              dropZone.style.pointerEvents = "";
            }
            try {
              var resultStr = result.data;
              var res =
                typeof resultStr === "string"
                  ? JSON.parse(resultStr)
                  : resultStr;
              if (res && res.success && res.thumbUrl) {
                var urlEl = document.getElementById("sf-logo_url");
                if (urlEl) urlEl.value = res.thumbUrl;
                var img = '<img src="' + res.thumbUrl + '" alt="لوجو">';
                if (upPrev) upPrev.innerHTML = img;
                if (prevWrap) prevWrap.innerHTML = img;
                _markSettingsDirty("branding");
                finishLoadingToast(
                  " تم رفع اللوجو على Drive — اضغط حفظ لتطبيقه",
                  "success",
                );
              } else {
                finishLoadingToast(
                  " فشل رفع اللوجو: " +
                    ((res && res.error) || "خطأ غير معروف"),
                  "error",
                );
                // fallback: خزّن الـ dataUrl مؤقتاً
                var urlElFb = document.getElementById("sf-logo_url");
                if (urlElFb) urlElFb.value = dataUrl;
                _markSettingsDirty("branding");
              }
            } catch (e) {
              finishLoadingToast("خطأ في معالجة استجابة الرفع", "error");
            }
          },
          onError: function (result) {
            if (dropZone) {
              dropZone.style.opacity = "";
              dropZone.style.pointerEvents = "";
            }
            finishLoadingToast(
              " فشل الاتصال بالسيرفر: " + (result.message || ""),
              "error",
            );
            // fallback: خزّن الـ dataUrl مؤقتاً
            var urlElFb = document.getElementById("sf-logo_url");
            if (urlElFb) urlElFb.value = dataUrl;
            _markSettingsDirty("branding");
          },
        },
      );
    };
    reader.readAsDataURL(file);
  }

  // ── Color Picker ──
  function _onColorPickerInput(id, val) {
    var swatch = document.getElementById("cs-" + id);
    var hexInput = document.getElementById("sf-" + id);
    var previewEl = document.getElementById(

  function _updatePreviewCardColor(id, val) {
    var card = document.getElementById("settings-preview-card");
    var root = document.documentElement;

    if (id === "primary_color") {
      if (card) card.style.setProperty("--preview-primary", val);
      root.style.setProperty("--primary", val);
      root.style.setProperty("--accent", val);
      var r = parseInt(val.slice(1, 3), 16),
        g = parseInt(val.slice(3, 5), 16),
        b = parseInt(val.slice(5, 7), 16);
      root.style.setProperty(
        "--accent-soft",
        "rgba(" + r + "," + g + "," + b + ",0.1)",
      );
      // تحديث brand-icon gradient
      var accentVal =
        (document.getElementById("sf-accent_color") || {}).value || "#0ea5e9";
      document.querySelectorAll(".brand-icon").forEach(function (el) {
        el.style.background =
          "linear-gradient(135deg, " + val + " 0%, " + accentVal + " 100%)";
      });
    }

    if (id === "secondary_color") {
      // ← preview card: gradient من primary إلى secondary
      if (card) card.style.setProperty("--preview-secondary", val);
      root.style.setProperty("--primary-dark", val);
      root.style.setProperty("--accent2", val);
      // ← sidebar-head: يظهر اللون الثانوي فيه
      var sidebarHead = document.querySelector(".sidebar-head");
      if (sidebarHead) {
        var r2 = parseInt(val.slice(1, 3), 16),
          g2 = parseInt(val.slice(3, 5), 16),
          b2 = parseInt(val.slice(5, 7), 16);
        sidebarHead.style.background =
          "linear-gradient(160deg, rgba(" +
          r2 +
          "," +
          g2 +
          "," +
          b2 +
          ",0.18) 0%, var(--surface) 100%)";
      }
    }

    if (id === "accent_color") {
      root.style.setProperty("--primary-light", val);
      // ← brand-icon: gradient ينتهي بلون التمييز
      var primaryVal =
        (document.getElementById("sf-primary_color") || {}).value || "#2563eb";
      document.querySelectorAll(".brand-icon").forEach(function (el) {
        el.style.background =
          "linear-gradient(135deg, " + primaryVal + " 0%, " + val + " 100%)";
        el.style.boxShadow =
          "0 6px 20px rgba(" +
          parseInt(val.slice(1, 3), 16) +
          "," +
          parseInt(val.slice(3, 5), 16) +
          "," +
          parseInt(val.slice(5, 7), 16) +
          ",0.4), inset 0 1px 0 rgba(255,255,255,0.25)";
      });
      // ← preview card: نضيف luster border بلون التمييز
      if (card) card.style.setProperty("--preview-accent", val);
      // ← topbar أو أي عنصر تاني بيستخدم accent2
      root.style.setProperty("--accent2", val);
    }
  }

  function _previewVoice(voiceId) {
    var previewText = "مرحباً، أنا مساعدك في MOO.ERP.";
    var wasVoice = AI_CHAT.geminiVoice;
    var wasEnabled = AI_CHAT.ttsEnabled;

    // نحدد الصوت مؤقتاً
    AI_CHAT.geminiVoice = voiceId;
    AI_CHAT.ttsEnabled = true;
    _ttsSpeaking = true;
    _updateTTSBtn();

    // 1) جرّب Gemini
    _speakGemini(previewText, function () {
      // Gemini فشل → جرّب ElevenLabs
      if (ELEVENLABS_KEY) {
        fetch(
          "https://api.elevenlabs.io/v1/text-to-speech/" + ELEVENLABS_VOICE,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "xi-api-key": ELEVENLABS_KEY,
            },
            body: JSON.stringify({
              text: previewText,
              model_id: "eleven_multilingual_v2",
              voice_settings: { stability: 0.5, similarity_boost: 0.75 },
            }),
          },
        )
          .then(function (r) {
            if (!r.ok) throw new Error("ElevenLabs HTTP " + r.status);
            return r.blob();
          })
          .then(function (blob) {
            if (!blob || blob.type.indexOf("audio") === -1) {
              throw new Error("ElevenLabs: استجابة غير صوتية");
            }
            var url = URL.createObjectURL(blob);
            _ttsAudio = new Audio(url);
            _ttsAudio.play();
            _ttsAudio.onended = function () {
              URL.revokeObjectURL(url);
              _ttsSpeaking = false;
              _ttsAudio = null;
              _updateTTSBtn();
            };
            _ttsAudio.onerror = function () {
              _ttsSpeaking = false;
              _ttsAudio = null;
              _updateTTSBtn();
              _speakWebSpeech(previewText);
            };
          })
          .catch(function () {
            // ElevenLabs فشل → Web Speech
            _ttsSpeaking = false;
            _updateTTSBtn();
            _speakWebSpeech(previewText);
          });
      } else {
        // مفيش ElevenLabs Key → Web Speech
        _ttsSpeaking = false;
        _updateTTSBtn();
        _speakWebSpeech(previewText);
      }
    });

    // نرجع المتغيرات لحالتها الأصلية بعد بدء الطلب
    AI_CHAT.geminiVoice = wasVoice;
    AI_CHAT.ttsEnabled = wasEnabled;
  }

  function _previewCurrentVoice() {
    _previewVoice(AI_CHAT.geminiVoice || "Kore");
  }

  function saveAiVoiceSetting() {
    var voice = AI_CHAT.geminiVoice || "Kore";
    // [FIX-AUDIT #4] كان يُحفظ فقط في localStorage (لا يتزامن بين الأجهزة
    // ويُفقد عند مسح الكاش). الآن يُحفظ كتفضيل مستخدم حقيقي على السيرفر عبر
    // PreferenceService (نفس آلية بقية تفضيلات المستخدم)، مع إبقاء نسخة
    // localStorage كـ fast-path فقط لقراءة أولية قبل جاهزية PreferenceService.
    try {
      localStorage.setItem("ai_voice", voice); // fast-path محلي، ليس المصدر الرئيسي بعد الآن
    } catch (e) {}
    if (typeof PreferenceService !== "undefined") {
      PreferenceService.set("ai_voice", voice);
    }
    var hint = document.getElementById("save-hint-ai_voice");
    if (hint) {
      hint.textContent = " تم حفظ الصوت بنجاح";
      hint.classList.remove("dirty");
    }
    NotificationEngine.success(" تم حفظ صوت المساعد: " + voice);
  }

  function saveSettingsSection(section) {
    if (!canDo("addItem")) {
      // صلاحية Admin مطلوبة
      NotificationEngine.error(" ليس لديك صلاحية تعديل الإعدادات");
      return;
    }

    var payload = {};

    if (section === "company") {
      var fields = [
        "company_name",
        "tagline",
        "phone",
        "email",
        "website",
        "tax_id",
        "commercial_reg",
        "currency",
        "address",
        "notes",
      ];
      fields.forEach(function (f) {
        var el = document.getElementById("sf-" + f);
        if (el) payload[f] = el.value.trim();
      });
    }

    // [SEC-ALERT-UI] قسم "تنبيهات الأمان" — إيميل/واتساب الأدمن اللي
    // بيتبعتلهم تنبيه فوري عند حظر حساب بسبب محاولات دخول متكررة
    // (نفس الحقول اللي كانت موجودة بالباك اند من غير واجهة أصلاً:
    // admin_alert_email في Code_12_Core.gs، + admin_alert_phone الجديد)
    if (section === "security") {
      var secFields = ["admin_alert_email", "admin_alert_phone"];
      secFields.forEach(function (f) {
        var el = document.getElementById("sf-" + f);
        if (el) payload[f] = el.value.trim();
      });
      // تنضيف رقم الواتساب من أي رموز غير رقمية قبل الحفظ (نفس منطق
      // setAdminAlertPhone بالباك اند — نكررها هنا لعرض فوري صحيح)
      if (payload.admin_alert_phone) {
        payload.admin_alert_phone = payload.admin_alert_phone.replace(
          /[^0-9]/g,
          "",
        );
      }
    }

    if (section === "branding") {
      var bFields = [
        "logo_url",
        "primary_color",
        "secondary_color",
        "accent_color",
      ];
      bFields.forEach(function (f) {
        var el = document.getElementById("sf-" + f);
        if (el) payload[f] = el.value.trim();
      });
    }

    if (section === "operations") {
      var oFields = [
        "min_stock_alert_pct",
        "default_warehouse",
        "fiscal_year_start",
        "timezone",
      ];
      oFields.forEach(function (f) {
        var el = document.getElementById("sf-" + f);
        if (el) payload[f] = el.value.trim();
      });
      var toggles = [
        "allow_negative_stock",
        "require_notes_on_tx",
        "auto_backup",
        "show_cost_price",
        "enable_production",
      ];
      toggles.forEach(function (f) {
        var el = document.getElementById("sf-" + f);
        if (el) payload[f] = el.checked;
      });
    }

    var anim = showSaveAnim({ title: SAVE_MESSAGES.SAVING, emoji: "" });

    // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
    _gsr(
      "saveCompanySettings",
      [payload, APP.currentUser ? APP.currentUser.username : "", SESSION.token],
      {
        onSuccess: function (res) {
          // دمج مع APP.companySettings
          Object.assign(APP.companySettings, payload);
          _originalSettings = JSON.parse(JSON.stringify(APP.companySettings));
          anim.done(" تم حفظ الإعدادات");
          // تحديث الـ hint
          var hint = document.getElementById("save-hint-" + section);
          if (hint) {
            hint.textContent = "ℹ️ تم الحفظ بنجاح";
            hint.classList.remove("dirty");
          }
          // تطبيق الـ branding فوراً لو غيّرنا ألوان/لوجو
          if (
            (section === "branding" || section === "company") &&
            typeof _applyCompanyBranding === "function"
          ) {
            _applyCompanyBranding();
          }
        },
        onError: function (res) {
          anim.fail((res && res.message) || "فشل الحفظ");
        },
      },
    );
  }

  function _gsSaveHistory(query, type, label) {
    if (!query || query.length < 2) return;
    // أزل تكرار
    _gsHistory = _gsHistory.filter(function (h) {
      return h.q !== query;
    });
    _gsHistory.unshift({
      q: query,
      type: type || "search",
      label: label || query,
    });
    _gsHistory = _gsHistory.slice(0, 8);
    try {
      localStorage.setItem("moo_gs_history", JSON.stringify(_gsHistory));
    } catch (e) {}
  }

  // Alt+S يفتح البحث
  document.addEventListener("keydown", function (e) {
    if (e.altKey && (e.key === "s" || e.key === "S" || e.key === "س")) {
      e.preventDefault();
      var inp = document.getElementById("global-search-input");
      if (inp) {
        inp.focus();
        inp.select();
      }
    }
    var dd = document.getElementById("gs-dropdown");
    if (!dd || dd.style.display === "none") return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      _gsMoveSelection(1);
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      _gsMoveSelection(-1);
    }
    if (e.key === "Enter") {
      e.preventDefault();
      _gsConfirmSelection();
    }
    if (e.key === "Escape") {
      _gsClear();
    }
  });

  function _gsOnFocus() {
    var inp = document.getElementById("global-search-input");
    if (inp && inp.value.trim()) _gsShowResults(inp.value.trim());
    else _gsShowQuickNav();
  }

  function _gsOnBlur() {
    setTimeout(function () {
      var dd = document.getElementById("gs-dropdown");
      if (dd) dd.style.display = "none";
    }, 300);
  }

  function _gsOnInput(val) {
    var clearBtn = document.getElementById("gs-clear");
    var kbd = document.getElementById("gs-kbd");
    if (clearBtn) clearBtn.style.display = val ? "flex" : "none";
    if (kbd) kbd.style.display = val ? "none" : "";
    // إظهار/إخفاء فلاتر النوع
    var filterBar = document.getElementById("gs-filter-bar");
    if (filterBar) filterBar.style.display = val ? "flex" : "none";
    clearTimeout(_gsDebounceTimer);
    var delay = val.length <= 2 ? 0 : 80; // بحث فوري للحرفين الأولين
    _gsDebounceTimer = setTimeout(function () {
      if (!val.trim()) {
        _gsActiveFilter = "all";
        _gsUpdateFilterUI();
        _gsShowQuickNav();
        return;
      }
      _gsShowResults(val.trim());
    }, delay);
  }

  function _gsClear() {
    var inp = document.getElementById("global-search-input");
    if (inp) {
      inp.value = "";
      inp.focus();
    }
    var clearBtn = document.getElementById("gs-clear");
    if (clearBtn) clearBtn.style.display = "none";
    var kbd = document.getElementById("gs-kbd");
    if (kbd) kbd.style.display = "";
    var dd = document.getElementById("gs-dropdown");
    if (dd) dd.style.display = "none";
    var filterBar = document.getElementById("gs-filter-bar");
    if (filterBar) filterBar.style.display = "none";
    _gsSelectedIdx = -1;
    _gsMode = "quicknav";
    _gsActiveFilter = "all";

  function _gsSuggestions(q) {
    // اقتراحات بسيطة بناءً على طول الكلمة
    var tips = [];
    if (q.length < 3) tips.push("ابحث بأكثر من حرفين");
    tips.push("جرّب الكود بدل الاسم");
    tips.push("ابحث بالرقم أو رقم الهاتف");
    return tips
      .map(function (t) {
        return '<span class="gs-suggestion-chip">' + t + "</span>";
      })
      .join("");
  }

  function _gsUpdateFilterCounts(counts, total) {
    var allBtn = document.querySelector('.gs-filter-btn[data-filter="all"]');
    if (allBtn) {
      var badge = allBtn.querySelector(".gs-filter-count");
      if (badge) badge.textContent = total;
    }
    var FILTER_TYPES = [
      "item",
      "sale_invoice",
      "purchase_invoice",
      "purchase_order",
      "sale_return",
      "purchase_return",
      "shipment",
      "production_order",
      "transaction",
      "party",
      "employee",
      "account",
      "page",
    ];
    FILTER_TYPES.forEach(function (type) {
      var btn = document.querySelector(
        '.gs-filter-btn[data-filter="' + type + '"]',
      );
      if (btn) {
        var badge = btn.querySelector(".gs-filter-count");
        if (badge) {
          badge.textContent = counts[type] || 0;
          badge.style.display = counts[type] ? "" : "none";
        }
      }
    });
  }

  // ── محرك البحث الشامل ──
  function _gsSearch(q) {
    var q2 = q.toLowerCase().trim();
    var results = [];
    var d = APP.data;

    // ── الأصناف ──
    (d.items || []).forEach(function (it) {
      var name = String(it.name || "").toLowerCase();
      var code = String(it.code || "").toLowerCase();
      var desc = String(it.description || "").toLowerCase();
      var grpName = _gsGroupName(it.group);
      if (
        name.includes(q2) ||
        code.includes(q2) ||
        desc.includes(q2) ||
        grpName.toLowerCase().includes(q2)
      ) {
        var qty = (d.stock || [])
          .filter(function (s) {
            return String(s.item_id) === String(it.id);
          })
          .reduce(function (a, s) {
            return a + Number(s.quantity || 0);
          }, 0);
        var isLow = false;
        if (it.min_qty && qty < Number(it.min_qty)) isLow = true;
        results.push({
          type: "item",
          id: it.id,
          title: it.name,
          sub: [
            it.code ? "كود: " + it.code : "",
            grpName ? "مجموعة: " + grpName : "",
            it.unit ? it.unit : "",
          ]
            .filter(Boolean)
            .join(" · "),
          badge: qty + " " + (it.unit || "وحدة"),
          badgeStyle: isLow
            ? "background:#fee2e2;color:#991b1b"
            : "background:var(--success-soft,#dcfce7);color:#166534",
          _price: it.sell_price
            ? formatMoney(it.sell_price, { decimals: 0 })
            : null,
        });
      }
    });

    // ── الحركات (آخر 1000) ──
    var TX_LABELS = {
      IN: "وارد",
      OUT: "صادر",
      TRANSFER: "تحويل",
      DISPATCH: "صرف للمصنع",
      FACTORY_RETURN: "مرتجع مصنع",
      FG_IN: "منتج تام",
    };
    var TX_COLORS = {
      IN: { bg: "#dcfce7", color: "#166534" },
      OUT: { bg: "#dbeafe", color: "#1d4ed8" },
      TRANSFER: { bg: "#ede9fe", color: "#5b21b6" },
      DISPATCH: { bg: "#dbeafe", color: "#1e40af" },
      FACTORY_RETURN: { bg: "#ffedd5", color: "#9a3412" },
      FG_IN: { bg: "#ccfbf1", color: "#0f766e" },
    };
    (d.transactions || [])
      .slice(-1000)
      .reverse()
      .forEach(function (t) {
        var id = String(t.id || "").toLowerCase();
        var notes = String(t.notes || "").toLowerCase();
        var party = String(t.party || "").toLowerCase();
        var itemName = "";
        // محاولة إيجاد اسم الصنف
        if (t.item_id) {
          var it = (d.items || []).find(function (x) {
            return String(x.id) === String(t.item_id);
          });
          if (it) itemName = String(it.name || "").toLowerCase();
        }
        if (
          id.includes(q2) ||
          notes.includes(q2) ||
          party.includes(q2) ||
          itemName.includes(q2)
        ) {
          var typeLabel = TX_LABELS[t.type] || t.type;
          var clr = TX_COLORS[t.type] || { bg: "#f3f4f6", color: "#374151" };
          var subParts = [typeLabel];
          if (t.party) subParts.push(t.party);
          if (t.date) subParts.push(t.date);
          if (t.notes) subParts.push(t.notes);
          results.push({
            type: "transaction",
            id: t.id,
            title: String(t.id || ""),
            sub: subParts.join(" · "),
            badge: typeLabel,
            badgeStyle: "background:" + clr.bg + ";color:" + clr.color,
          });
        }
      });

    // ── العملاء والموردين ──
    var allParties = (d.customers || [])
      .map(function (c) {
        return { _rec: c, _type: "customer" };

      .concat(

  // ── التنقل بالكيبورد ──
  function _gsMoveSelection(dir) {
    var selector = _gsMode === "quicknav" ? ".gs-qn-item" : ".gs-item";
    var items = document.querySelectorAll(selector);
    if (!items.length) return;
    if (_gsSelectedIdx >= 0 && items[_gsSelectedIdx]) {
      items[_gsSelectedIdx].classList.remove("gs-selected");
    }
    _gsSelectedIdx = Math.max(
      0,
      Math.min(items.length - 1, _gsSelectedIdx + dir),
    );
    items[_gsSelectedIdx].classList.add("gs-selected");
    items[_gsSelectedIdx].scrollIntoView({ block: "nearest" });
  }

  function _gsConfirmSelection() {
    var selector =
      _gsMode === "quicknav"
        ? ".gs-qn-item.gs-selected"
        : ".gs-item.gs-selected";
    var selected = document.querySelector(selector);
    if (selected)
      selected.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
  }

  // ── التنقل للنتيجة ──
  function _gsNavigate(type, id) {
    // حفظ البحث الحالي في السجل قبل التنقل
    if (_gsLastQuery) _gsSaveHistory(_gsLastQuery, type);
    _gsClear();
    if (type === "page") {
      renderPage(id);
      return;
    }
    if (type === "item") {
      APP._gsPreselectedItem = id;
      renderPage("items");
      // بعد render، حاول تمييز الصنف
      setTimeout(function () {
        var row = document.querySelector('tr[data-item-id="' + id + '"]');
        if (row) {
          row.scrollIntoView({ block: "center", behavior: "smooth" });
          row.style.transition = "background 0.3s";
          row.style.background = "rgba(37,99,235,0.1)";
          setTimeout(function () {
            row.style.background = "";
          }, 1500);
        }
      }, 400);
      return;
    }
    if (type === "transaction") {
      renderPage("transactions");
      return;
    }
    if (type === "warehouse") {
      renderPage("warehouses");
      return;
    }
    if (type === "user") {
      renderPage("users");
      return;
    }
    if (type === "group") {
      renderPage("groups");
      return;
    }
    if (type === "sale_invoice") {
      renderPage("sale-invoices");
      return;
    }
    if (type === "purchase_invoice") {
      renderPage("purchase-invoices");
      return;
    }
    if (type === "purchase_order") {
      renderPage("purchase-orders");
      return;
    }
    if (type === "sale_return") {
      renderPage("sale-returns");
      return;
    }
    if (type === "purchase_return") {
      renderPage("purchase-returns");
      return;
    }
    if (type === "shipment") {
      renderPage("shipping");
      return;
    }
    if (type === "production_order") {
      renderPage("production");
      return;
    }
    if (type === "employee") {
      renderPage("employees");
      return;
    }
    if (type === "account") {
      renderPage("chart-of-accounts");
      return;
    }
    if (type === "party") {
      // حدد إذا عميل أو مورد من النتيجة
      var results = _gsSearch(_gsLastQuery);
      var r = results.find(function (x) {
        return x.type === "party" && String(x.id) === String(id);
      });
      renderPage(r && r._partyType === "supplier" ? "suppliers" : "customers");
      return;
    }
  }

  // ── تمييز النص ──
  function _gsHighlight(text, q) {
    if (!q || !text) return esc(text || "");
    var escaped = esc(text);
    var escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return escaped.replace(
      new RegExp("(" + escapedQ + ")", "gi"),
      "<mark>$1</mark>",
    );
  }

  function _gsGroupName(groupId) {
    if (!groupId) return "";
    var g = (APP.data.groups || []).find(function (x) {
      return String(x.id) === String(groupId);
    });
    return g ? g.name : "";
  }

  function _toggleFullscreen() {
    var icon = document.getElementById("fs-icon");
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
      if (icon) {
        icon.classList.remove("ti-maximize");
        icon.classList.add("ti-minimize");
      }
    } else {
      document.exitFullscreen();
      if (icon) {
        icon.classList.remove("ti-minimize");
        icon.classList.add("ti-maximize");
      }
    }
  }

  // تحديث الأيقونة لو المستخدم خرج بـ Escape
  document.addEventListener("fullscreenchange", function () {
    var icon = document.getElementById("fs-icon");
    if (!icon) return;
    if (!document.fullscreenElement) {
      icon.classList.remove("ti-minimize");
      icon.classList.add("ti-maximize");
    } else {
      icon.classList.remove("ti-maximize");
      icon.classList.add("ti-minimize");
    }
  });

  // العرض/الحذف بقوا حصريًا عبر القائمة السياقية (زر يمين) اللي بتقرأ
  // بيانات الصف تلقائيًا من APP.data.customers (راجع _extractDataFromRow

  var _customersColumnsRegistered = false;
  /** اسم ولون تصنيف طرف (عميل/مورد) — يقرأ من حزمة customerCategories/
   * supplierCategories الموجودة أصلاً في APP.data (نفس مصدر شجرة
   * التصنيفات في 35_JS_PartyCategories.html)، من غير أي نداء سيرفر إضافي. */
  function _partyCategoryMeta(partyType, categoryId) {
    if (!categoryId) return null;
    var key =
      partyType === "supplier" ? "supplierCategories" : "customerCategories";
    var list = (APP.data && APP.data[key]) || [];
    var cat = list.find(function (x) {
      return String(x.id) === String(categoryId);
    });
    if (!cat) return null;
    return { name: cat.name || "—", color: cat.color || "#64748B" };
  }

  function _partyCategoryBadgeHtml(partyType, categoryId) {
    var meta = _partyCategoryMeta(partyType, categoryId);
    if (!meta) return '<span style="color:var(--text3)">—</span>';
    return (
      '<span class="badge" style="background:' +
      meta.color +
      "1c;color:" +
      meta.color +
      '">' +
      esc(meta.name) +
      "</span>"
    );
  }

  /** خلية الرصيد الموحّدة لجداول العملاء/الموردين — نفس منطق formatMoney +
   * الألوان المستخدمة في مودالات العرض (renderViewCustomerModal/
   * renderViewSupplierModal)، وتحترم تفضيل إخفاء الأرصدة (sensitive-balance). */
  function _partyBalanceCellHtml(rawBalance) {
    var balance = Number(rawBalance || 0);
    var color =
      balance > 0
        ? "var(--success)"
        : balance < 0
          ? "var(--danger)"
          : "var(--text3)";
    var text =
      typeof formatMoney === "function"
        ? formatMoney(balance, { decimals: 0 })
        : NumberEngine.currency(balance);
    return (
      '<span class="sensitive-balance" style="font-weight:700;color:' +
      color +
      '">' +
      text +
      "</span>"
    );
  }

  // ══════════════════════════════════════════════════════════════════════
  // [PARTY-VALIDATION] نظام التحقق الموحّد لمودالات العملاء والموردين —
  // مبني فوق VF v2 (VF_JS_Validation.html). دوال مشتركة تُستخدم في الأربعة
  // أماكن (عميل جديد/تعديل، مورد جديد/تعديل) بدل تكرار كل سطر ربط أربع
  // مرات. لا تُضاف هنا أي regex/منطق تحقق جديد — كل شيء عبر VF.RULES.*
  // (والتي بدورها تفوّض كل التحقق فعليًا لمحرك ValidationEngine على
  // السيرفر، Code_36). التحقق النهائي والملزم يبقى دائمًا على السيرفر عبر
  // BusinessRulesEngine.validateBeforeSave — هذا فقط تحسين UX فوري.
  // ══════════════════════════════════════════════════════════════════════

  /**
   * _partyNationalIdRule — الرقم القومي/السجل التجاري نوعه يعتمد على "نوع
   * الكيان" (فرد → رقم قومي مصري 14 خانة | شركة → سجل تجاري) بدل نوع تحقق
   * واحد ثابت لحقل يخدم غرضين مختلفين فعليًا.
   */
  function _partyNationalIdRule(prefix) {
    var entityEl = document.getElementById(prefix + "-modal-entity-type");
    var isCompany = entityEl && entityEl.value === "شركة";
    return isCompany
      ? VF.RULES.commercialRegistration(false)
      : VF.RULES.nationalId(false);
  }

  /**
   * _applyDefaultPartyAccount — [ACC-REQUIRED] حقل "حساب الذمم المدينة/
   * الدائنة الخاص بالعميل/المورد" بقى إلزامي — عشان المستخدم ما يستوقفش
   * أول ما يفتح المودال، بنملأه مبدئيًا بالحساب الافتراضي العام
   * (ar_account للعملاء / ap_account للموردين) عبر getDefaultPartyAccount
   * (Code_02_Accounting_ChartOfAccounts.gs) لو كان فاضي (سجل جديد أو سجل
   * قديم بدون حساب خاص). لو الحساب ده أول مرة يُستخدم، الدالة بتلاقيه
   * بالاسم (ذمم مدينة/عملاء...) وتثبّته تلقائيًا في AccountingSettings —
   * يعني ما يحتاجش المستخدم يضبطه يدويًا من الإعدادات قبل كده. المستخدم
   * قادر يغيّره لحساب خاص بالطرف ده أي وقت — هي بس قيمة مبدئية مش قفل.
   * @param {String} prefix - "cust" أو "sup"
   */
  function _applyDefaultPartyAccount(prefix) {
    var sel = document.getElementById(prefix + "-modal-account-id");
    if (!sel || (sel.value || "").trim()) return; // فيه قيمة محفوظة أصلاً — ما نلمسها
    var partyType = prefix === "sup" ? "supplier" : "customer";
    // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
    if (typeof _gsr !== "function") return;
    _gsr("getDefaultPartyAccount", [partyType], {
      label: "_applyDefaultPartyAccount",
      onSuccess: function (res) {
        var accountId = res && res.success && res.account_id;
        if (!accountId) return;
        // [PERF-FIX] بعد التحويل لوضع Lazy (renderFinancialAccountSelector
        // lazy:true)، القائمة قد لا تحتوي على أي حسابات إطلاقًا سوى الحساب
        // المحفوظ سابقًا (لو تعديل). لو الحساب الافتراضي غير موجود كـ
        // option، ننشئه بأنفسنا من code/name المُرجَعين من السيرفر بدل
        // تجاهل الاختيار التلقائي بالكامل كما كان يحدث سابقًا مع القائمة
        // الكاملة (غير Lazy) لو الحساب مفلتَر خارج النوع المتوقع.
        var opt = sel.querySelector('option[value="' + accountId + '"]');
        if (!opt) {
          opt = document.createElement("option");
          opt.value = accountId;
          opt.text =
            (res.code ? "[" + res.code + "] " : "") + (res.name || accountId);
          sel.appendChild(opt);
        }
        sel.value = accountId;
        var clearBtn = sel.parentElement
          ? sel.parentElement.querySelector("button")
          : null;
        if (clearBtn) clearBtn.style.display = "";
        if (typeof _updatePartyCompletion === "function")
          _updatePartyCompletion(prefix);
      },
      onError: function () {
        // فشل جلب/تحديد الحساب الافتراضي (نادر) — نسيب الحقل فاضي،
        // المستخدم هيختار بنفسه (الحقل إلزامي فمينفعش يحفظ من غير اختيار).
      },
    });
  }

  /**
   * _bindPartyExtraValidation — يربط التحقق الفوري (blur/input) على الحقول
   * الموسّعة المشتركة بين العميل والمورد التي لم تكن مُحقَّقة إطلاقًا قبل
   * هذا (رقم ضريبي/رقم قومي أو سجل تجاري/موقع إلكتروني/هاتف إضافي/نسبة
   * خصم/مهلة سداد/حد ائتمان للعملاء فقط). يُستدعى مرة واحدة بعد فتح
   * المودال (نفس مكان استدعاء VF.bind الأساسية لـ name/phone/email
   * الموجودة أصلاً).
   * @param {String} prefix - "cust" أو "sup"
   * @param {Object} opts - { hasCreditLimit: Boolean }
   */
  function _bindPartyExtraValidation(prefix, opts) {
    if (typeof VF === "undefined") return;
    opts = opts || {};

    VF.bind(prefix + "-modal-tax", VF.RULES.taxNumber(false));
    VF.bind(prefix + "-modal-website", VF.RULES.url(false));
    VF.bind(prefix + "-modal-phone2", VF.RULES.phone(false));
    VF.bind(
      prefix + "-modal-discount-percent",
      VF.RULES.percentage("نسبة الخصم %", false),
    );
    VF.bind(prefix + "-modal-payment-terms", {
      required: false,
      type: "number",
      min: 0,
      max: 3650,
      label: "مهلة السداد (أيام)",
    });
    if (opts.hasCreditLimit) {
      VF.bind(
        prefix + "-modal-credit-limit",
        VF.RULES.currency("حد الائتمان", false),
      );
    }

    // الرقم القومي/السجل التجاري — نوع التحقق ديناميكي حسب "نوع الكيان"،
    // فبيتم التحقق يدويًا (بدل VF.bind الثابت) + إعادة الفحص كل ما يتغيّر
    // "نوع الكيان" حتى لا تفضل رسالة خطأ قديمة من النوع الغلط ظاهرة.
    var natField = document.getElementById(prefix + "-modal-national-id");
    var entityField = document.getElementById(prefix + "-modal-entity-type");
    if (natField && !natField._vfNatBound) {
      natField._vfNatBound = true;
      natField.addEventListener("blur", function () {
        if ((natField.value || "").trim()) {
          VF.validate(prefix + "-modal-national-id", _partyNationalIdRule(prefix));
        }
      });
    }
    if (entityField && !entityField._vfEntityBound) {
      entityField._vfEntityBound = true;
      entityField.addEventListener("change", function () {
        VF.clear(prefix + "-modal-national-id");
        if (natField && (natField.value || "").trim()) {
          VF.validate(prefix + "-modal-national-id", _partyNationalIdRule(prefix));
        }
      });
    }
  }

  /**
   * _bindPartyCodeDuplicateCheck — تحقق فوري (Debounced) من تكرار كود
   * العميل أثناء الكتابة عبر VF.checkDuplicate + isCustomerCodeDuplicate
   * (Code_20_Sales.gs) — العملاء فقط (الموردين مالهمش عمود code).
   * الفحص الملزم النهائي وقت الحفظ يبقى عبر BusinessRulesEngine كما هو.
   * @param {String} excludeId - معرف العميل الحالي عند التعديل (فارغ عند الإضافة)
   */
  // [PARITY-CUST] بقت عامة (تشتغل للعميل والمورد) — كود المورد بقى
  // إلزاميًا وفريدًا بنفس مبدأ كود العميل تمامًا.
  function _bindPartyCodeDuplicateCheck(prefix, excludeId) {
    if (typeof VF === "undefined") return;
    var isSup = prefix === "sup";
    VF.checkDuplicate(prefix + "-modal-code", {
      label: isSup ? "كود المورد" : "كود العميل",
      checkFnName: isSup ? "isSupplierCodeDuplicate" : "isCustomerCodeDuplicate",
      buildArgs: function (value) {
        return [value, excludeId || ""];
      },
    });
  }

  function bindCustomers() {
    // زر إضافة عميل جديد
    var btnNew = document.getElementById("btn-new-customer");
    if (btnNew) {
      btnNew.addEventListener("click", function () {
        requirePermission("addCustomer", function () {
          _resetPendingPartyExtras("cust");
          // [ACC-LOOKUP-FIX] لازم دليل الحسابات (chartOfAccounts) يتحمّل
          // قبل بناء المودال — من غير كده renderFinancialAccountSelector
          // بيتبني بمصفوفة فاضية (APP.data.chartOfAccounts لسه ما
          // اتحمّلش لأنه جزء من الحزمة الموسّعة Lazy)، فالقائمة تبان فاضية
          // وحتى الحساب الافتراضي بيرجع من السيرفر مبيتلاقيش كـ option
          // فيفشل الاختيار التلقائي في _applyDefaultPartyAccount.
          ensureExtendedData(function () {
            ensurePartyCategoriesLoaded("customer", function () {
              openDrawer(renderCustomerModal(null), 900);
              setTimeout(function () {
                _initPartyModalExtras("cust");
                initFinancialAccountSearcher("app-drawer");
                _applyDefaultPartyAccount("cust");
                // [AUTO-CODE] الكود بقى تسلسليًا تلقائيًا (1، 2، 3...) —
                // نعرضه فورًا كمعاينة ونقفل الحقل، القيمة الملزمة الفعلية
                // بتتولّد تاني وقت الحفظ في السيرفر (_partyCreateCodeCheck).
                var custCodeEl = document.getElementById("cust-modal-code");
                if (custCodeEl) {
                  custCodeEl.value = "…";
                  // [EDITABLE-CODE] الكود بيتقترح تلقائيًا لكن يفضل قابل
                  // للتعديل — المستخدم يقدر يغيّره لو حاب، والتحقق من
                  // التكرار هيشتغل عليه عادي (_bindPartyCodeDuplicateCheck).
                  custCodeEl.readOnly = false;
                  // [CODE-HANG-FIX] نفس إصلاح المورد — Timeout صريح بدل ما
                  // يفضل الحقل عالق على "…" للأبد لو نداء google.script.run
                  // اتأخر أو علق في الطابور خلف نداء تقيل تاني.
                  // [SE-ROLLOUT][CODE-HANG-FIX] عبر _gsr بدل google.script.run
                  // المباشر — بنستخدم opts.timeout المدمج في _gsr نفسها
                  // (watchdog جاهز) بدل تكرار نفس فكرة الـ timeout بـ setTimeout
                  // يدوي منفصل هنا.
                  if (typeof _gsr === "function") {
                    _gsr("getNextCustomerCode", [], {
                      timeout: 8000,
                      label: "getNextCustomerCode",
                      onSuccess: function (res) {
                        if (custCodeEl) custCodeEl.value = (res && res.data) || "";
                      },
                      onError: function (err) {
                        if (custCodeEl) {
                          custCodeEl.value = "";
                          custCodeEl.placeholder =
                            "تعذّر توليد الكود تلقائيًا — يرجى كتابته يدويًا";
                        }
                        console.error(
                          "[getNextCustomerCode] فشل توليد الكود:",
                          err,
                        );
                      },
                    });
                  }
                }
                // ── [VF] ربط أحداث التحقق التلقائي على حقول العميل ──────
                if (typeof VF !== "undefined") {
                  VF.bind("cust-modal-name", VF.RULES.requiredText("اسم العميل"));
                  // [CODE-REQUIRED] الكود إلزامي وأساسي (فريد) لكل عميل
                  VF.bind("cust-modal-code", VF.RULES.requiredText("كود العميل"));
                  VF.bind("cust-modal-phone", VF.RULES.phone(false));
                  VF.bind("cust-modal-email", VF.RULES.email(false));
                  // [ACC-REQUIRED] حساب الذمم المدينة بقى إلزامي
                  VF.bind(
                    "cust-modal-account-id",
                    VF.RULES.requiredSelect("حساب الذمم المدينة الخاص بالعميل"),
                  );
                  // [PARTY-VALIDATION] باقي الحقول الموسّعة + تحقق تكرار الكود
                  _bindPartyExtraValidation("cust", { hasCreditLimit: true });
                  _bindPartyCodeDuplicateCheck("cust", "");
                }
              }, 100);
            });
          });
        });
      });
    }

    // Event delegation لأزرار واتساب في قائمة العملاء
    var pmpList = document.getElementById("pmp-party-list");
    if (pmpList && !pmpList._waListenerAttached) {
      pmpList._waListenerAttached = true;
      pmpList.addEventListener("click", function (e) {
        var btn = e.target.closest(".wa-party-btn");
        if (!btn) return;
        e.stopPropagation();
        var name = btn.getAttribute("data-wa-name") || "";
        var phone = btn.getAttribute("data-wa-phone") || "";
        var id = btn.getAttribute("data-wa-id") || "";
        if (typeof WA_MODAL !== "undefined") {
          WA_MODAL.open({
            category: "general_message",
            customer_name: name,
            phone: phone,
            customer_id: id,
            source_type: "customer",
            source_id: id,
            context_data: { customer_name: name },
          });
        }
      });
    }

    // [DATA-UNIFY] العملاء أصبحوا جزءاً من getAllData الأساسية —
    // التحميل بيحصل تلقائياً عند فتح التطبيق. هنا فقط fallback احتياطي
    // لو لسبب ما (جلسة قديمة/كاش) ملف العملاء غير موجود أصلاً.
    // §CAT-P1 — فلتر التصنيفات الهرمية في أعلى قائمة العملاء
    // [PERF-CUSTOMERS-FIRST-PAINT] الجدول بقى بيتعرض فورًا من
    // APP.data.customers (اللي غالبًا جاهزة بالفعل من getAllData عند فتح
    // التطبيق) من غير ما يستنى تحميل شجرة التصنيفات، اللي كانت بتأخّر أول
    // ظهور للجدول برحلتين متتاليتين للسيرفر. فلتر التصنيفات بيتعبّى لوحده
    // بالتوازي، وبيتفعّل تلقائيًا لما يخلص.
    // [FIX-FIRST-VISIT-EMPTY] كان الفحص `Array.isArray(...)` بس — بما إن
    // APP.data.customers بيتحط [] فاضية افتراضيًا (قبل ما بيانات اللوجين
    // الحقيقية توصل)، الفحص كان بيعتبرها "محمّلة بالفعل" ويوريّ جدول فاضي
    // بدل ما يجيب البيانات الحقيقية — فأول زيارة لتاب العملاء فورًا بعد
    // اللوجين كانت بتفضل فاضية لحد ما المستخدم يعمل ريفريش يدوي. دلوقتي
    // بنتأكد إن فيه صفوف فعلية قبل ما نكتفي بالكاش.
    if (Array.isArray(APP.data.customers) && APP.data.customers.length > 0) {
      filterCustomersTable();
    } else {
      _loadCustomers();
    }

    ensurePartyCategoriesLoaded("customer", function () {
      populatePartyCategoryFilterSelect(
        "customer",
        document.getElementById("cust-category-filter"),
      );
    });
  }

  // تحميل العملاء من السيرفر
  function _loadCustomers() {
    // [SE-ROLLOUT] عبر DL.Parties.getCustomers بدل google.script.run المباشر — Rule 9/10
    // [SESSION-FIX] نفس إصلاح getSuppliers — لازم نبعت object فيه
    // callerUser + sessionToken، لأن getCustomers(callerUser) بتمرر القيمة
    // لـ _requirePermission اللي بترفض دايمًا برسالة "جلسة غير صالحة" لو
    // استقبلت اسم المستخدم بس بدون توكن.
    DL.Parties.getCustomers(
      {
        callerUser: APP.currentUser.username,
        sessionToken: APP.currentUser.sessionToken || (SESSION && SESSION.token),
      },
      {
      onSuccess: function (res) {
        APP.data.customers = res.data || [];
        if (document.getElementById("customers-ce-container")) {
          filterCustomersTable();
        }
      },
      onError: function (res) {
        NotificationEngine.error((res && res.message) || "خطأ في تحميل العملاء");
      },
    });
  }

  // فلترة جدول العملاء حسب التصنيف المختار — يعيد رسم الجدول عبر
  // ColumnEngine ببيانات مفلترة فقط؛ البحث النصي بقى داخل شريط أدوات
  // المحرك نفسه (لا حاجة لمنطق بحث منفصل هنا).
  var _filterCustomersTimer = null;
  function filterCustomersTable() {
    clearTimeout(_filterCustomersTimer);
    _filterCustomersTimer = setTimeout(function () {
      var catFilterEl = document.getElementById("cust-category-filter");
      var catFilter = catFilterEl ? catFilterEl.value : "";
      var allowedCatIds = catFilter
        ? getPartyCategoryDescendantIdsClient("customer", catFilter)
        : null;
      var customers = (APP.data.customers || []).slice().reverse();
      var rows = allowedCatIds
        ? customers.filter(function (c) {
            return allowedCatIds.indexOf(String(c.category_id || "")) !== -1;
          })
        : customers;
      _renderCustomersTableCE(rows);
    }, 200);
  }

  // بناء قائمة الأطراف في الـ sidebar
  function _pmpRenderPartyList(type, filter) {
    var listEl = document.getElementById("pmp-party-list");
    if (!listEl) return;

    var list =
      type === "customer" ? APP.data.customers || [] : APP.data.suppliers || [];

    // تصفية بالبحث
    if (filter && filter.trim()) {
      var q = filter.trim().toLowerCase();
      list = list.filter(function (p) {
        return (
          (p.name || "").toLowerCase().indexOf(q) !== -1 ||
          (p.phone || "").indexOf(q) !== -1
        );
      });
    }

    // تحديث عداد التبويب
    var countId = type === "customer" ? "pmp-cus-count" : "pmp-sup-count";
    var countEl = document.getElementById(countId);
    var totalList =
      type === "customer"
        ? (APP.data.customers || []).length
        : (APP.data.suppliers || []).length;
    if (countEl) countEl.textContent = totalList || "";

    if (!list.length) {
      listEl.innerHTML =
        '<div class="pmp-list-empty">' +
        '<i class="ti ti-search-off" style="font-size:22px;color:var(--text3);opacity:.5"></i>' +
        "<span>" +
        (filter ? "لا نتائج" : "لا يوجد بيانات") +
        "</span>" +
        "</div>";
      return;
    }

    var isSupplier = type === "supplier";
    listEl.innerHTML = list
      .map(function (p) {
        var initial = (p.name || "?")[0];
        var isActive = _pmState.partyId === p.id && _pmState.partyType === type;
        return (
          '<div class="pmp-party-item' +
          (isActive ? " active" : "") +
          '" ' +
          "onclick=\"pmpLoadParty('" +
          esc(p.id) +
          "','" +
          type +
          "')\" " +
          'data-id="' +
          esc(p.id) +
          '">' +
          '<div class="pmp-party-avatar ' +
          (isSupplier ? "sup" : "cus") +
          '">' +
          esc(initial) +
          "</div>" +
          '<div class="pmp-party-info">' +
          '<div class="pmp-party-name">' +
          esc(p.name || p.id) +
          "</div>" +
          (p.phone
            ? '<div class="pmp-party-phone">' + esc(p.phone) + "</div>"
            : "") +
          "</div>" +
          (!isSupplier &&
          typeof WA_CONFIG !== "undefined" &&
          WA_CONFIG.isEnabled() &&
          typeof canDo === "function" &&
          canDo("sendWhatsapp") &&
          p.phone
            ? '<button class="wa-icon-btn wa-party-btn"' +
              ' data-wa-name="' +
              esc(p.name || p.id || "") +
              '"' +
              ' data-wa-phone="' +
              esc(p.phone || "") +
              '"' +
              ' data-wa-id="' +

  /** تطبيق الفلترة على الصفوف */
  function _pmApplyFilters() {
    var tbody = document.getElementById("pm-tbody");
    if (!tbody) return;

    var type = _pmState.activeType;
    var search = _pmState.activeSearch;
    var visibleCount = 0;

    // الصفوف الرئيسية فقط (data-pmkey)
    var rows = tbody.querySelectorAll("tr[data-pmkey]");
    rows.forEach(function (row) {
      var rowType = row.getAttribute("data-pmtype") || "";
      var rowSearch = row.getAttribute("data-pmsearch") || "";
      var expandId =
        "pm-expand-" +
        (row.getAttribute("data-pmkey") || "").replace(/[^a-zA-Z0-9]/g, "_");
      var expandRow = document.getElementById(expandId);

      var matchType = !type || rowType === type;
      var matchSearch = !search || rowSearch.indexOf(search) !== -1;
      var visible = matchType && matchSearch;

      row.style.display = visible ? "" : "none";
      if (expandRow) expandRow.style.display = "none"; // إخفاء expand عند الفلترة
      if (visible) visibleCount++;
    });

    // تحديث عداد
    var badge = document.getElementById("pm-count-badge");
    if (badge) badge.textContent = visibleCount + " حركة";
  }

  /** فتح/إغلاق صف التوسع */
  function _pmToggleExpand(key) {
    var safeKey = (key || "").replace(/[^a-zA-Z0-9]/g, "_");
    var row = document.getElementById("pm-expand-" + safeKey);
    var btn = document.getElementById("pm-expand-btn-" + safeKey);
    if (!row) return;
    var isOpen = row.style.display !== "none";
    row.style.display = isOpen ? "none" : "";
    if (btn) {
      var icon = btn.querySelector(".ti");
      if (icon) {
        icon.style.transform = isOpen ? "" : "rotate(180deg)";
      }
    }
  }

  /** تصدير CSV للحركات الحالية */
  function exportPartyMovements() {
    var mvs = _pmState.movements || [];
    if (!mvs.length) {
      NotificationEngine.warning("لا توجد حركات للتصدير");
      return;
    }

    var typeLabels = {
      IN: "وارد",
      OUT: "صادر",
      TRANSFER: "تحويل",
      DISPATCH: "صرف مصنع",
      FG_IN: "استلام تام",
      FACTORY_RETURN: "مرتجع مصنع",
    };

    var rows = [
      [
        "المعرّف",
        "التاريخ",
        "النوع",
        "كود الصنف",
        "اسم الصنف",
        "الكمية",
        "اللون",
        "المخزن (من)",
        "المخزن (إلى)",
        "المستخدم",
        "الملاحظات",
      ],
    ];
    mvs.forEach(function (tx) {
      var item =
        (APP.data.items || []).find(function (i) {
          return i.id === tx.item_id;
        }) || {};
      var date = tx.date ? fmtDate(tx.date) : "";
      rows.push([
        tx.id || "",
        date,
        typeLabels[tx.type] || tx.type || "",
        item.code || tx.item_id || "",
        item.name || "",
        tx.quantity || "",
        tx.color || "",
        tx.from_warehouse || "",
        tx.to_warehouse || "",
        tx.user || "",
        tx.notes || "",
      ]);
    });

    var csv = rows
      .map(function (r) {
        return r
          .map(function (c) {
            return '"' + String(c).replace(/"/g, '""') + '"';
          })
          .join(",");
      })
      .join("\n");

    // إضافة BOM لدعم Excel Arabic
    var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "party_movements_" + (_pmState.partyId || "export") + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    NotificationEngine.success(" تم تصدير " + mvs.length + " حركة");
  }

  function linkPartyDualRoleNow(prefix, id) {
    if (!id) {
      NotificationEngine.error("احفظ السجل أولاً قبل الربط");
      return;
    }
    var type = prefix === "sup" ? "supplier" : "customer";
    _freezeUI("جارِ الربط...");
    _gsr(
      "linkPartyDualRole",
      [APP.currentUser.username, type, id, SESSION ? SESSION.token : ""],
      {
        onSuccess: function (res) {
          _unfreezeUI();
          NotificationEngine.success(res.message || "تم الربط بنجاح");
          var linkedId = res.data && res.data.linkedId;
          var listKey = type === "customer" ? "customers" : "suppliers";
          var list = APP.data[listKey] || [];
          var rec = list.find(function (x) {
            return x.id === id;
          });
          if (rec && linkedId) {
            rec.is_dual_party = true;
            rec.dual_party_id = linkedId;
          }
          if (_cache.data) _cache.data[listKey] = APP.data[listKey];
          // إعادة فتح النموذج بعد التحديث لعرض الربط الجديد
          if (type === "customer") editCustomer(id);
          else editSupplier(id);
        },
        onError: function (res) {
          _unfreezeUI();
          NotificationEngine.error(res.message || "فشل الربط");
        },
      },
    );
  }

    var isEdit = !!id;

    // [SE-ROLLOUT] عبر SaveEngine.run بدل _freezeUI/_gsr اليدوي — نفس منطق
    // العمل جوه onSuccess/onError بالظبط (كاش محلي، رصيد افتتاحي...)، الفرق
    // إن الإغلاق/الـspinner/الرسائل بقوا من نقطة الدخول الموحّدة.

        screen: "Parties.Customer",

        params: [APP.currentUser.username, id, customer],
        onSuccess: function (res) {
          // تحديث محلي فوري
          var idx = (APP.data.customers || []).findIndex(function (c) {
            return c.id === id;
          });
          if (idx !== -1) Object.assign(APP.data.customers[idx], customer);

          if (_cache.data) _cache.data.customers = APP.data.customers;
          NotificationEngine.success(res.message);
          // [PERF-FIX-CUST] تحديث UI مباشرة (الـ cache حُدِّث بالفعل أعلاه)
          // الـ _silentRefresh تعمل تلقائياً من notification polling — لا حاجة لاستدعاء يدوي
          APP._fromSilentRefresh = true;

      var _openingBalanceDate = (
        (document.getElementById("cust-modal-opening-balance-date") || {})
          .value || ""

        screen: "Parties.Customer",
        entity: "customer",

        fn: "addCustomer",
        params: [APP.currentUser.username, customer],
        onSuccess: function (res) {
          // إضافة محلية فورية
          customer.id =
            res.data && res.data.id ? res.data.id : "CUS-" + Date.now();
          customer.created_at = new Date().toISOString();
          if (!APP.data.customers) APP.data.customers = [];
          APP.data.customers.push(customer);
          // [PERF-FIX-5] مزامنة الكاش بعد إضافة العميل
          if (_cache.data) _cache.data.customers = APP.data.customers;
          NotificationEngine.success(res.message);
          // [PERF-FIX-CUST] تحديث UI بدون fade (الـ cache حُدِّث بالفعل)
          APP._fromSilentRefresh = true;
          renderPage("customers");
          APP._fromSilentRefresh = false;
          // [NO-SAVE-FIRST] حفظ أي عناوين/مستندات أُضيفت للعميل وهو لسه
          // مش محفوظ — بترتبط بالـ id الحقيقي دلوقتي تلقائيًا
          _flushPendingPartyExtras("cust", customer.id, "customer", customer.code, customer.name);
          // [OPENING-BALANCE] لو المستخدم دخل رصيد افتتاحي غير صفري، يترحّل
          // فورًا كقيد رصيد افتتاحي في الأستاذ العام بالتاريخ المُختار من
          // الحقل المجاور (أو تاريخ اليوم لو الحقل فاضي —
          // postPartyOpeningBalance بتستخدم تاريخ اليوم افتراضيًا لو date
          // مش مُرسَل). [FIX-ISSUE-OB-1] كان الشرط "> 0" يمنع إرسال أي رصيد
          // افتتاحي سالب (رصيد دائن للعميل) حتى لو المستخدم أدخله فعلاً.
          if (_openingBalanceVal !== 0) {
            _gsr(
              "postPartyOpeningBalance",
              [
                {
                  party_type: "customer",
                  party_id: customer.id,
                  amount: _openingBalanceVal,
                  date: _openingBalanceDate,
                },
                SESSION ? SESSION.token : "",
              ],
              {
                onSuccess: function () {
                  NotificationEngine.success(" تم تسجيل الرصيد الافتتاحي بتاريخ " +
                    (_openingBalanceDate ||
                      (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0])));
                  // [BALANCE-COLUMN-FIX] القيد اتترحّل فعلاً، لكن نسخة العميل
                  // المحلية (APP.data.customers) لسه فيها balance = 0 لإنها
                  // اتحطت قبل ما نعرف الرصيد الفعلي. نعيد تحميل العملاء من
                  // السيرفر (اللي بقى بيرجّع balance محسوبة فعليًا) عشان
                  // الجدول يعرض الرصيد الصحيح فورًا بدل ما يستنى ريفريش كامل.
                  _loadCustomers();
                },
                onError: function (obRes) {
                  NotificationEngine.error("تم إضافة العميل، لكن فشل ترحيل الرصيد الافتتاحي: " +
                    obRes.message);
                },
              },
            );
          }
        },
        onError: function (res) {
          NotificationEngine.error(res.message);
        },
      });
    }
  }

  // تأكيد حذف عميل
  function deleteCustomerConfirm(id) {
    if (!requirePermission("deleteCustomer")) return;
    var c = (APP.data.customers || []).find(function (x) {
      return x.id === id;
    });
    if (!c) return;

    showConfirm({
      title: "حذف العميل",
      message: "هل أنت متأكد من حذف العميل «<b>" + esc(c.name) + "</b>»؟",
      confirmText: "حذف",
      confirmClass: "btn-danger",
      icon: "ti-trash",
      iconColor: "#dc2626",
      freezeMessage: "⏳ جاري الحذف...",
      onConfirm: function (unfreezeUI) {
        // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
        // [SESSION-FIX] كان الاستدعاء ناقص sessionToken تمامًا، فكانت
        // _checkPermission (fail-closed) بترفض كل محاولة حذف عميل برسالة
        // "جلسة غير صالحة" مهما كانت الجلسة سليمة فعليًا.
        _gsr(
          "deleteCustomer",
          [APP.currentUser.username, id, SESSION ? SESSION.token : null],
          {
            onSuccess: function (res) {
              unfreezeUI();
              APP.data.customers = (APP.data.customers || []).filter(
                function (x) {
                  return x.id !== id;
                },
              );
              NotificationEngine.success(res.message);
              renderPage("customers");
            },
            onError: function (res) {
              unfreezeUI();
              NotificationEngine.error(res.message);
            },
          },
        );
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // §BP-P3  عناوين متعددة للأطراف — منطق مشترك (عميل/مورد)
  // prefix: "cust" | "sup" — يُستخدم لتمييز عناصر DOM وربطها بالطرف الصحيح
  // ─────────────────────────────────────────────────────────────

  var PARTY_ADDR_TYPES = ["رئيسي", "شحن", "فواتير", "آخر"];
  var _partyAddrCache = {}; // { [prefix]: { partyId, partyType, items: [...] } }

  // ── [NO-SAVE-FIRST] عناوين/مستندات "معلّقة" لسجل عميل/مورد لسه ما اتحفظش ──
  // بتتخزّن هنا محليًا في المتصفح لحد ما العميل/المورد يتحفظ فعليًا، وبعدين
  // بتتبعت للسيرفر تلقائيًا (شوف _flushPendingPartyExtras بالأسفل).
  var _partyPendingAddr = {}; // { [prefix]: [ {id: "tmp-...", ...addressFields} ] }
  var _partyPendingDocs = {}; // { [prefix]: [ {id: "tmp-...", file_name, base64, mimeType, doc_type, notes} ] }

  function _tmpPartyExtraId() {
    return "tmp-" + Date.now() + "-" + Math.floor(Math.random() * 100000);
  }

  // بيُنادى لما يتفتح مودال "إضافة جديد" — يمسح أي بواقي معلّقة من محاولة
  // سابقة اتلغت من غير حفظ، عشان محاولة الإضافة الجديدة تبدأ نضيفة
  function _resetPendingPartyExtras(prefix) {
    _partyPendingAddr[prefix] = [];
    _partyPendingDocs[prefix] = [];
  }

  // تحميل قائمة عناوين الطرف (Lazy — تُستدعى عند فتح تبويب "العناوين" أول مرة)
  function loadPartyAddressesList(prefix, partyId, partyType) {
    var listEl = document.getElementById(prefix + "-addr-list");
    if (!listEl) return;
    // [NO-SAVE-FIRST] سجل جديد لسه ما اتحفظش — نعرض مباشرة من الـ pending
    // array المحلي (نفس الـ reference عشان أي إضافة/حذف لاحق يعكس هنا فورًا)
    if (!partyId) {
      if (!_partyPendingAddr[prefix]) _partyPendingAddr[prefix] = [];
      _partyAddrCache[prefix] = {
        partyId: "",
        partyType: partyType,
        items: _partyPendingAddr[prefix],
      };
      _renderPartyAddressesList(prefix);
      return;
    }
    // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
    _gsr("getPartyAddresses", [APP.currentUser.username, partyId, partyType], {
      onSuccess: function (res) {
        _partyAddrCache[prefix] = {
          partyId: partyId,
          partyType: partyType,
          items: res.data || [],
        };
        _renderPartyAddressesList(prefix);
      },
      onError: function (res) {
        if (listEl)
          listEl.innerHTML =
            '<div style="text-align:center;padding:16px;color:var(--danger);font-size:12px">' +
            esc((res && res.message) || "تعذّر تحميل العناوين") +
            "</div>";
      },
    });
  }

  function _renderPartyAddressesList(prefix) {
    var listEl = document.getElementById(prefix + "-addr-list");
    if (!listEl) return;
    var state = _partyAddrCache[prefix] || { items: [] };
    var items = state.items || [];
    var accentColor = prefix === "sup" ? "#C2410C" : "#2563EB";

    if (!items.length) {
      listEl.innerHTML =
        '<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px">لا توجد عناوين مضافة بعد</div>';
      return;
    }

    listEl.innerHTML = items
      .map(function (a) {
        var addrLine = [a.governorate, a.city, a.district, a.street]
          .filter(function (v) {
            return v;
          })
          .join(" - ");
        return (
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px;margin-bottom:8px;border:1px solid var(--border);border-radius:10px;background:var(--bg)">' +
          '<div style="flex:1;min-width:0">' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap">' +
          '<span style="font-size:12px;font-weight:700;color:var(--text)">' +
          esc(a.name || a.address_type || "عنوان") +
          "</span>" +

  function closePartyAddressForm(prefix) {
    var formEl = document.getElementById(prefix + "-addr-form");
    if (formEl) {
      formEl.style.display = "none";
      formEl.innerHTML = "";
    }
