                        ? formatMoney(Number(l.debit), { decimals: 0, withSymbol: false })
                        : "—") +

                      (Number(l.credit) > 0
                        ? formatMoney(Number(l.credit), { decimals: 0, withSymbol: false })

  // ─────────────────────────────────────────────────────────────
  // §F  Voucher Helpers — مساعدات مشتركة للسندات
  // ─────────────────────────────────────────────────────────────
  /** تحويل page name لـ prefix الـ template IDs */
  function _voucherPrefix(page) {
    var MAP = {
      "receipt-vouchers": "rv",
      "payment-vouchers": "pv",
      expenses: "exp",
      "transfer-vouchers": "tv",
    };
    return MAP[page] || page;
  }

  /** صف واحد في جدول السند */
  function _renderVoucherRow(v, canEdit, canDelete) {
    var STATUS_MAP = {
      approved: {
        color: "var(--success)",
        bg: "var(--success-soft)",
        label: "معتمد",
      },
      pending: {
        color: "var(--warning)",
        bg: "var(--warning-soft)",
        label: "معلق",
      },
      rejected: {
        color: "var(--danger)",
        bg: "var(--danger-soft)",
        label: "مرفوض",
      },
    };
    var status = v.status || "pending";
    var st = STATUS_MAP[status] || {
      color: "var(--text3)",
      bg: "var(--surface2)",
      label: status,
    };
    // [P7] سندات التحويل مفيش لها "party" أصلاً — نعرض "من → إلى" بدالها
    // باستخدام from_name/to_name المُثراة من getTransferVouchers.
    var partyCell =
      v.from_type && v.to_type
        ? esc((v.from_name || v.from_type) + " ← " + (v.to_name || v.to_type))
        : esc(v.party || v.party_name || "—");
    return (
      "<tr data-row data-id='" +
      esc(v.id || "") +
      "' data-name='" +
      esc(v.ref || v.id || "") +
      "'>" +
      "<td data-col='ref'><code>" +
      esc(v.ref || v.id || "") +
      "</code></td>" +
      "<td data-col='date'>" +
      _fmtDate(v.date) +
      "</td>" +
      "<td data-col='party'>" +
      partyCell +
      "</td>" +
      "<td data-col='amount' style='direction:ltr;text-align:center;font-weight:600'>" +
      formatMoney(parseFloat(v.amount) || 0, {
        decimals: 0,
        withSymbol: false,
      }) +
      "</td>" +
      "<td>" +
      (v.from_type && v.to_type
        ? Number(v.fee_amount || 0) > 0
          ? "عمولة: " +
            formatMoney(Number(v.fee_amount), {
              decimals: 0,
              withSymbol: false,
            })
          : "بدون عمولة"
        : esc(v.method || v.payment_method || "نقدي")) +
      "</td>" +
      "<td><span class='vch-status-badge' style='background:" +
      st.bg +
      ";color:" +
      st.color +
      ";border:1px solid " +
      st.color +
      "22'>" +
      st.label +
      "</span></td>" +
      "<td></td>" +
      "</tr>"
    );
  }

  // ── _bindTableFilters: يربط فلاتر الحالة + الفترة لأي جدول ──
  function _bindTableFilters(prefix, dataKey, renderRowsFn) {
    var RANGES = {
      today: [
        (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
        (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
      ],
      "7days": [
        (function () {
          var d = new Date();
          d.setDate(d.getDate() - 6);
          return d.toISOString().split("T")[0];
        })(),
        (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
      ],
      month: [
        (function () {
          var d = new Date();
          return new Date(d.getFullYear(), d.getMonth(), 1)
            .toISOString()
            .split("T")[0];
        })(),
        (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
      ],
      "30days": [
        (function () {
          var d = new Date();
          d.setDate(d.getDate() - 29);
          return d.toISOString().split("T")[0];
        })(),
        (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
      ],
      year: [
        (function () {
          var d = new Date();
          return new Date(d.getFullYear(), 0, 1).toISOString().split("T")[0];
        })(),
        (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
      ],
      all: [null, null],
    };

    var sfRoot = document.getElementById(prefix + "-sf-root");
    var sfTrigger = document.getElementById(prefix + "-sf-trigger");
    var sfMenu = document.getElementById(prefix + "-sf-menu");
    var sfLabel = document.getElementById(prefix + "-sf-label");
    var sfHidden = document.getElementById(prefix + "-filter-status");
    var drpRoot = document.getElementById(prefix + "-drp-root");
    var drpTrig = document.getElementById(prefix + "-drp-trigger");
    var drpPop = document.getElementById(prefix + "-drp-popover");
    var drpLabel = document.getElementById(prefix + "-drp-label");
    var drpInfo = document.getElementById(prefix + "-drp-info");
    var fromEl = document.getElementById(prefix + "-filter-from");
    var toEl = document.getElementById(prefix + "-filter-to");
    var clearBtn = document.getElementById(prefix + "-drp-clear");
    var applyBtn = document.getElementById(prefix + "-drp-apply");
    var tbody = document.getElementById(prefix + "-table-body");

    if (!sfRoot && !drpRoot) return;

    function _applyFilters() {
      var from = fromEl ? fromEl.value : "";
      var to = toEl ? toEl.value : "";
      var status = sfHidden ? sfHidden.value : "";
      var all = APP.data[dataKey] || [];
      var filtered = all.filter(function (r) {
        var rDate = String(r.date || "").split("T")[0];
        if (from && rDate < from) return false;
        if (to && rDate > to) return false;
        if (status && r.status !== status) return false;
        return true;
      });
      if (tbody) tbody.innerHTML = renderRowsFn(filtered);
    }

    // ── Status dropdown ──
    if (sfTrigger && sfMenu) {
      sfTrigger.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = sfMenu.classList.contains("je-sf-show");
        sfMenu.classList.toggle("je-sf-show", !open);
        sfTrigger.classList.toggle("je-sf-open", !open);
      });
      sfMenu.addEventListener("click", function (e) {
        var item = e.target.closest(".je-sf-item");
        if (!item) return;
        var val = item.getAttribute("data-sf-status");
        if (sfHidden) sfHidden.value = val;
        sfMenu.querySelectorAll(".je-sf-item").forEach(function (b) {
          b.classList.remove("je-sf-active");
        });
        item.classList.add("je-sf-active");
        if (sfLabel)
          sfLabel.textContent =
            item.querySelector(".je-sf-item-label").textContent;
        if (sfTrigger) sfTrigger.classList.toggle("je-sf-has-filter", !!val);
        sfMenu.classList.remove("je-sf-show");
        sfTrigger.classList.remove("je-sf-open");
        _applyFilters();
      });
      document.addEventListener("click", function (e) {
        if (sfRoot && !sfRoot.contains(e.target)) {
          sfMenu.classList.remove("je-sf-show");
          sfTrigger.classList.remove("je-sf-open");
        }
      });
    }

    // ── Date Range Picker ──
    if (drpTrig && drpPop) {
      drpTrig.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = drpPop.classList.contains("je-drp-show");
        drpPop.classList.toggle("je-drp-show", !open);
        drpTrig.classList.toggle("je-drp-open", !open);
      });
      document.addEventListener("click", function (e) {
        if (drpRoot && !drpRoot.contains(e.target)) {
          drpPop.classList.remove("je-drp-show");
          drpTrig.classList.remove("je-drp-open");
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          drpPop.classList.remove("je-drp-show");
          drpTrig.classList.remove("je-drp-open");
        }
      });
      // Quick range buttons
      drpPop.querySelectorAll(".je-drp-qb").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var key = btn.getAttribute("data-range");
          var r = RANGES[key];
          if (!r) return;
          if (fromEl) fromEl.value = r[0] || "";
          if (toEl) toEl.value = r[1] || "";
          drpPop.querySelectorAll(".je-drp-qb").forEach(function (b) {
            b.classList.remove("je-active");
          });
          btn.classList.add("je-active");
          if (drpInfo)
            drpInfo.textContent = r[0] ? r[0] + " — " + r[1] : "كل الفترات";
        });
      });
      if (clearBtn) {
        clearBtn.addEventListener("click", function () {
          if (fromEl) fromEl.value = "";
          if (toEl) toEl.value = "";
          drpPop.querySelectorAll(".je-drp-qb").forEach(function (b) {
            b.classList.remove("je-active");
          });
          if (drpLabel) drpLabel.textContent = "كل الفترات";
          if (drpTrig) drpTrig.classList.remove("je-drp-has-filter");
          if (drpInfo) drpInfo.textContent = "لم يتم اختيار نطاق بعد";
          drpPop.classList.remove("je-drp-show");
          drpTrig.classList.remove("je-drp-open");
          _applyFilters();
          NotificationEngine.info("تم مسح الفلتر");
        });
      }
      if (applyBtn) {
        applyBtn.addEventListener("click", function () {
          var from = fromEl ? fromEl.value : "";
          var to = toEl ? toEl.value : "";
          if (from && to && from > to) {
            NotificationEngine.error("تاريخ النهاية يجب أن يكون بعد البداية");
            return;
          }
          if (drpLabel)
            drpLabel.textContent =
              from || to ? (from || "—") + " — " + (to || "—") : "كل الفترات";
          if (drpTrig)
            drpTrig.classList.toggle("je-drp-has-filter", !!(from || to));
          drpPop.classList.remove("je-drp-show");
          drpTrig.classList.remove("je-drp-open");
          _applyFilters();
          NotificationEngine.success("تم تطبيق الفلتر");
        });
      }
    }
  }

  function _bindVoucherPage(
    page,
    dataKey,
    backendAdd,
    backendDelete,
    permAdd,
    permDelete,
  ) {
    ensureExtendedData(function () {
      var prefix = _voucherPrefix(page);
      var tbodyId = prefix + "-table-body";
      var addBtnId = prefix + "-btn-add";

      // ملي الجدول من APP.data
      var records = APP.data[dataKey] || [];
      var canEdit = canDo(permAdd);
      var canDel = canDo(permDelete);
      var tbody = document.getElementById(tbodyId);
      var colCount = page === "transfer-vouchers" ? 6 : 7;

      if (tbody) {
        if (!records.length) {
          tbody.innerHTML =
            "<tr><td colspan='" +
            colCount +
            "' style='text-align:center;padding:24px;color:var(--text3)'>لا توجد سجلات بعد</td></tr>";
        } else {
          tbody.innerHTML = records
            .map(function (v) {
              return _renderVoucherRow(v, canEdit, canDel);
            })
            .join("");
        }
        // [CTX-REFACTOR] تسجيل ContextMenu بدلاً من أزرار inline
        var ctxType =
          page === "receipt-vouchers"
            ? "receipt_vouchers"
            : page === "payment-vouchers"
              ? "payment_vouchers"
              : page === "expenses"
                ? "expenses"
                : page === "transfer-vouchers"
                  ? "transfer_vouchers"
                  : null;
        if (window.CTX && ctxType) CTX.register(tbody, ctxType);
      }

      // ── ربط فلاتر الحالة والتاريخ ──
      _bindTableFilters(prefix, dataKey, function (filtered) {
        if (!filtered.length)
          return (
            "<tr><td colspan='" +
            colCount +
            "' style='text-align:center;padding:24px;color:var(--text3)'>لا توجد سجلات مطابقة</td></tr>"
          );
        return filtered
          .map(function (v) {
            return _renderVoucherRow(v, canEdit, canDel);
          })
          .join("");
      });

      var addBtn = document.getElementById(addBtnId);
      if (addBtn) {
        addBtn.addEventListener("click", function () {
          if (!canDo(permAdd)) return NotificationEngine.error(" ليس لديك صلاحية");
          _openVoucherModal(null, page, dataKey, backendAdd);
        });
      }
    });
  }

  function _openVoucherModal(id, page, dataKey, backendFn) {
    // [P5-D FIX] كانت هذه الدالة تستخدم نموذجاً عاماً واحداً (حقل "الطرف" و"الحساب"
    // كنص حر فقط) وترسل {user, token, party, account, notes} — لا تطابق أياً من
    // الحقول الفعلية التي تتوقعها addReceiptVoucher/addPaymentVoucher/
    // addTransferVoucher/addExpense (التي تتطلب callerUser/sessionToken، وحقولاً
    // منفصلة مثل party_id/cash_box_id/bank_account_id/payment_method/account_id).
    // النتيجة: زر "سند جديد" في كل شاشات السندات والمصروفات كان يفشل دائماً
    // برسالة "يجب تسجيل الدخول"، وحتى لو أُصلح فقط user→callerUser كانت
    // البيانات المحفوظة ستبقى ناقصة (بدون خزينة/بنك فعلي مرتبط) فيفشل القيد
    // التلقائي لاحقاً. تم استبدالها بنموذج مخصص لكل نوع سند يطابق الـ backend.
    var records = APP.data[dataKey] || [];
    var rec = id
      ? records.find(function (r) {
          return String(r.id) === String(id);
        })
      : null;
    var boxes = APP.data.cashBoxes || [];
    var banks = APP.data.bankAccounts || [];
    var accounts = APP.data.chartOfAccounts || [];
    var customers = APP.data.customers || [];
    var suppliers = APP.data.suppliers || [];
    var cashOpts = boxes.map(function (b) {
      return { value: b.id, label: "خزينة — " + b.name };
    });
    var bankOpts = banks.map(function (b) {
      var _kindPrefix =
        b.account_kind === "VISA"
          ? "فيزا — "
          : b.account_kind === "WALLET"
            ? "محفظة — "
            : "بنك — ";
      return { value: b.id, label: _kindPrefix + (b.name || b.bank_name) };
    });
    var allCashOpts = cashOpts.concat(bankOpts);

    var isReceipt = page === "receipt-vouchers";
    var isPayment = page === "payment-vouchers";
    var isTransfer = page === "transfer-vouchers";
    var isExpense = page === "expenses";

    var fields = [
      {
        id: "v-date",
        label: "التاريخ",
        type: "date",
        value: rec ? rec.date : (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
      },
      {
        id: "v-amount",
        label: "المبلغ",
        type: "number",
        value: rec ? rec.amount : "",
      },
    ];

    if (isReceipt || isPayment) {
      var parties = customers.concat(suppliers);
      fields.push({
        id: "v-party",
        label: isReceipt ? "المستلم منه" : "المدفوع له",
        type: "datalist",
        value: rec ? rec.from_party || rec.to_party || "" : "",
        options: parties.map(function (p) {
          return p.name;
        }),
      });
      fields.push({
        id: "v-method",
        label: "طريقة الدفع",
        type: "select",
        value: rec ? rec.payment_method || "CASH" : "CASH",
        // [PAYMENT-METHODS-MASTER-1] بدل القايمة الثابتة المحلية
        options: PAYMENT_METHODS.map(function (m) {
          return { value: m.value, label: m.label };
        }),
      });
      fields.push({
        id: "v-cashbox",
        label: "الخزينة / البنك / فيزا / المحفظة",
        type: "select",
        value: rec ? rec.cash_box_id || rec.bank_account_id || "" : "",
        options: allCashOpts,
      });
    } else if (isTransfer) {
      fields.push({
        id: "v-from",
        label: "من",
        type: "select",
        value: rec ? rec.from_id || "" : "",
        options: allCashOpts,
      });
      fields.push({
        id: "v-to",
        label: "إلى",
        type: "select",
        value: rec ? rec.to_id || "" : "",
        options: allCashOpts,
      });
      // [P7] عمولة التحويل البنكي + الرقم المرجعي — اختياريين، مفيدين بالذات
      // في تحويل بنك↔بنك (رسوم تحويل/RTGS ورقم العملية من كشف الحساب).
      fields.push({
        id: "v-fee",
        label: "عمولة التحويل (اختياري)",
        type: "number",
        placeholder: "0.00",
        value: rec ? rec.fee_amount || "" : "",
      });
      fields.push({
        id: "v-bank-ref",
        label: "الرقم المرجعي البنكي (اختياري)",
        type: "text",
        value: rec ? rec.bank_reference || "" : "",
      });
    } else if (isExpense) {
      fields.push({
        id: "v-account",
        label: "حساب المصروف",
        type: "select",
        value: rec ? rec.account_id || "" : "",
        options: accounts.map(function (a) {
          return { value: a.id, label: a.name };
        }),
      });
      fields.push({
        id: "v-method",
        label: "طريقة الدفع",
        type: "select",
        value: rec ? rec.payment_method || "CASH" : "CASH",
        // [PAYMENT-METHODS-MASTER-1] بدل القايمة الثابتة المحلية
        options: PAYMENT_METHODS.map(function (m) {
          return { value: m.value, label: m.label };
        }),
      });
      fields.push({
        id: "v-cashbox",
        label: "الخزينة / البنك / فيزا / المحفظة",
        type: "select",
        value: rec ? rec.cash_box_id || rec.bank_account_id || "" : "",
        options: allCashOpts,
      });
    }

    fields.push({
      id: "v-description",
      label: "البيان",
      type: "textarea",
      rows: 2,
      value: rec ? rec.description || "" : "",
    });

    openStyledDrawer({
      title: rec ? "تعديل السند" : "سند جديد",
      icon: "ti-receipt",
      fields: fields,
      onSave: function (vals) {
        var amount = parseFloat(vals["v-amount"]);
        if (!amount || amount <= 0)
          return NotificationEngine.error("أدخل مبلغاً صحيحاً");

        var payload = {
          date: vals["v-date"],
          amount: amount,
          description: vals["v-description"],
          callerUser: APP.currentUser.username,
          sessionToken: SESSION.token,
        };

        if (isReceipt || isPayment) {
          var method = vals["v-method"] || "CASH";
          var boxOrBank = vals["v-cashbox"] || "";
          var isBox = boxes.some(function (b) {
            return b.id === boxOrBank;
          });
          if (!boxOrBank) return NotificationEngine.error("اختر الخزينة أو البنك");
          var partyName = vals["v-party"] || "";
          var matchedCustomer = customers.find(function (c) {
            return c.name === partyName;
          });
          var matchedSupplier = suppliers.find(function (s) {
            return s.name === partyName;
          });
          var partyType = "OTHER";
          var partyId = "";
          if (isReceipt && matchedCustomer) {
            partyType = "CUSTOMER";
            partyId = matchedCustomer.id;
          } else if (isPayment && matchedSupplier) {
            partyType = "SUPPLIER";
            partyId = matchedSupplier.id;
          }
          payload.payment_method = method;
          payload.cash_box_id = method === "CASH" && isBox ? boxOrBank : "";
          payload.bank_account_id =
            ["BANK", "VISA", "WALLET"].indexOf(method) !== -1 && !isBox
              ? boxOrBank
              : "";
          payload.party_type = partyType;
          payload.party_id = partyId;
          if (isReceipt) payload.from_party = partyName;
          else payload.to_party = partyName;
        } else if (isTransfer) {
          var fromId = vals["v-from"] || "";
          var toId = vals["v-to"] || "";
          if (!fromId || !toId)
            return NotificationEngine.error("يجب تحديد المصدر والهدف");
          if (fromId === toId)
            return NotificationEngine.error("لا يمكن التحويل لنفس الحساب");
          payload.from_type = boxes.some(function (b) {
            return b.id === fromId;
          })
            ? "CASHBOX"
            : "BANK";
          payload.from_id = fromId;
          payload.to_type = boxes.some(function (b) {
            return b.id === toId;
          })
            ? "CASHBOX"
            : "BANK";
          payload.to_id = toId;
          var feeVal = parseFloat(vals["v-fee"]);
          payload.fee_amount = feeVal > 0 ? feeVal : 0;
          payload.bank_reference = vals["v-bank-ref"] || "";
        } else if (isExpense) {
          var expMethod = vals["v-method"] || "CASH";
          var expBoxOrBank = vals["v-cashbox"] || "";
          var expIsBox = boxes.some(function (b) {
            return b.id === expBoxOrBank;
          });
          if (!vals["v-account"])
            return NotificationEngine.error("اختر حساب المصروف");
          payload.account_id = vals["v-account"];
          payload.payment_method = expMethod;
          payload.cash_box_id =
            expMethod === "CASH" && expIsBox ? expBoxOrBank : "";
          payload.bank_account_id =
            ["BANK", "VISA", "WALLET"].indexOf(expMethod) !== -1 && !expIsBox
              ? expBoxOrBank
              : "";
        }

        if (rec) payload.id = rec.id;
        _gsr(backendFn, payload, {
          label: "Accounting." + backendFn,
          onSuccess: function (r) {
            NotificationEngine.success(r.message);
            // [WF-EXEC-2026] المرحلة 3 — تشغيل Workflows المرتبطة بحدث
            // "استلام دفعة" (سند قبض من عميل فقط — مش سند صرف لمورد).
            if (
              isReceipt &&
              typeof WA_WORKFLOW_ENGINE !== "undefined" &&
              matchedCustomer
            ) {
              WA_WORKFLOW_ENGINE.trigger("payment_received", {
                customer_id: matchedCustomer.id,
                customer_name: matchedCustomer.name,
                phone: matchedCustomer.phone || matchedCustomer.mobile || "",
                amount: amount,
                voucher_id: r.data && r.data.id,
              });
            }
            _reloadExtAndRender(page);
          },
          onError: function (r) {
            NotificationEngine.error(r.message || "خطأ");
          },
        });
      },
    });
  }

          onError: function (r) {
            NotificationEngine.error(r.message || "خطأ");
          },
        });
      },
    });
  }

    _gsr(
      "printVoucher",
      [id, dataKey, APP.currentUser.username, SESSION.token],
      {
        label: "Accounting.printVoucher",

        onSuccess: function (r) {
          var res = r.data || {};

            dismissLoadingToast();

          } else finishLoadingToast(res.message || "فشل تحضير الطباعة", "error");

        onError: function (r) {
          finishLoadingToast(r.message || "فشل تحضير الطباعة", "error");
        },
      },
    );
  }

  // ─────────────────────────────────────────────────────────────
  // §G2  المطابقة البنكية — Bank Reconciliation (Banking Module Phase 8)
  // ─────────────────────────────────────────────────────────────
  // فلسفة الشاشة: قائمة جلسات (شبيهة بباقي شاشات السندات) + درج تفاصيل واحد
  // (single drawer) لكل جلسة بيتعاد رسمه بالكامل بعد أي عملية (مطابقة/إلغاء
  // مطابقة/إضافة بند/اعتماد...) — نفس فلسفة chq-timeline: نداء سيرفر، رسم،
  // وإعادة الرسم عند أي تغيير، بدل إدارة state معقدة في الفرونت.
  var _brdCurrentDetail = null; // آخر تفاصيل جلسة مطابقة محمّلة — للمطابقة السريعة client-side

  var BANK_RECON_TX_TYPE_LABELS_FE = {
    CHEQUE: "شيك",
    TRANSFER: "تحويل بنكي",
    RECEIPT: "سند قبض",
    PAYMENT: "سند صرف",
    EXPENSE: "مصروف",
  };

  function bindBankReconciliation() {
    ensureExtendedData(function () {
      // المطابقة البنكية تعتمد على كشف حساب بنكي فعلي — لا تنطبق على فيزا/المحافظ الإلكترونية
      var banks = (APP.data.bankAccounts || []).filter(function (b) {
        return !b.account_kind || b.account_kind === "BANK";
      });
      var sel = document.getElementById("br-filter-bank");
      if (sel) {
        sel.innerHTML =
          "<option value=''>— كل الحسابات البنكية —</option>" +
          banks
            .map(function (b) {
              return (
                "<option value='" +
                esc(b.id) +
                "'>" +
                esc(b.name || b.code) +
                "</option>"
              );
            })
            .join("");
        sel.addEventListener("change", _loadBankReconciliationsList);
      }
      var statusSel = document.getElementById("br-filter-status");
      if (statusSel)
        statusSel.addEventListener("change", _loadBankReconciliationsList);

      // [FIX-SelectionEngine] الترقية بعد تعبية خيارات البنوك مباشرة
      if (window.AppSelect) {
        AppSelect.upgrade("br-filter-bank", { icon: "ti-building-bank" });
        AppSelect.upgrade("br-filter-status", { icon: "ti-list-check" });
      }

      var addBtn = document.getElementById("br-btn-add");
      if (addBtn) {
        addBtn.addEventListener("click", function () {
          if (!canDo("addBankReconciliation"))
            return NotificationEngine.error(" ليس لديك صلاحية");
          _openAddBankReconModal();
        });
      }

      _loadBankReconciliationsList();
    });
  }

  function _loadBankReconciliationsList() {
    var tbody = document.getElementById("br-table-body");
    if (!tbody) return;
    var bankId = (document.getElementById("br-filter-bank") || {}).value || "";
    var status =
      (document.getElementById("br-filter-status") || {}).value || "";
    tbody.innerHTML = _loadingRow(7);

    DL.Accounting.getBankReconciliations(
      { bank_account_id: bankId, status: status },
      {
        onSuccess: function (r) {
          if (!tbody || !document.body.contains(tbody)) return;
          var rows = r.data || [];
          if (!rows.length) {
            tbody.innerHTML =
              "<tr><td colspan='7' style='text-align:center;padding:24px;color:var(--text3)'>لا توجد جلسات مطابقة بعد</td></tr>";
            return;
          }
          tbody.innerHTML = rows.map(_renderBankReconRow).join("");
          Array.prototype.forEach.call(
            tbody.querySelectorAll("[data-br-open]"),
            function (btn) {
              btn.addEventListener("click", function () {
                _openBankReconDetail(btn.getAttribute("data-br-open"));
              });
            },
          );
        },
        onError: function (r) {
          if (tbody)
            tbody.innerHTML =
              "<tr><td colspan='7' style='text-align:center;padding:24px;color:var(--text3)'>خطأ: " +
              esc(r.message) +
              "</td></tr>";
        },
      },
    );
  }

  function _renderBankReconRow(r) {
    var statusBadge =
      r.status === "COMPLETED"
        ? '<span class="badge badge-success">معتمدة</span>'
        : '<span class="badge badge-warning">تحت العمل</span>';
    var diff = Number(r.difference || 0);
    var diffHtml =
      r.status === "COMPLETED"
        ? '<span style="color:' +
          (Math.abs(diff) < 0.01
            ? "var(--success-dark)"
            : "var(--danger-dark)") +
          '">' +
          formatMoney(diff, { decimals: 0, withSymbol: false }) +
          "</span>"
        : '<span style="color:var(--text3)">—</span>';
    return (
      "<tr>" +
      "<td>" +
      esc(r.code || r.id) +
      "</td>" +
      "<td>" +
      esc(r.bank_account_name || "") +
      "</td>" +
      "<td>" +
      esc(fmtDateInput(r.statement_date)) +
      "</td>" +
      "<td style='text-align:center'>" +
      formatMoney(Number(r.statement_closing_balance || 0), {
        decimals: 0,
        withSymbol: false,
      }) +
      "</td>" +
      "<td style='text-align:center'>" +
      diffHtml +
      "</td>" +
      "<td>" +
      statusBadge +
      "</td>" +

      esc(r.id) +
      "'><i class='ti ti-arrow-left'></i> فتح</button></td>" +
      "</tr>"
    );
  }

  function _loadBankReconDetail(id) {
    var root = document.getElementById("brd-root");
    if (!root) return;
    _gsr("getBankReconciliationDetail", id, {
      label: "Accounting.getBankReconciliationDetail",
      onSuccess: function (r) {
        var root2 = document.getElementById("brd-root");
        if (!root2 || !document.body.contains(root2)) return; // الدرج اتقفل قبل ما الرد يوصل
        _brdCurrentDetail = r.data;
        root2.innerHTML = _renderBankReconDetailBody(r.data);
        _bindBankReconDetailHandlers(r.data.reconciliation.id);

        if (root3)
          root3.innerHTML =
            "<div style='padding:24px;text-align:center;color:var(--text3)'>خطأ: " +

  function _renderBankReconDetailBody(detail) {
    var recon = detail.reconciliation;
    var isDraft = recon.status === "DRAFT";
    var html = "";

    // ── شريط معلومات الجلسة ──
    html +=
      "<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px'>";
    html +=
      "<div><b style='font-size:15px'>" +
      esc(recon.code || recon.id) +
      "</b> — " +
      esc(detail.bank_account_name || "") +
      "<div style='color:var(--text3);font-size:12px'>تاريخ كشف الحساب: " +
      esc(fmtDateInput(recon.statement_date)) +
      "</div></div>";
    html += isDraft
      ? '<span class="badge badge-warning">تحت العمل</span>'
      : '<span class="badge badge-success">معتمدة بتاريخ ' +
        esc(fmtDate(recon.completed_at)) +
        "</span>";
    html += "</div>";

    // ── ملخص الأرقام ──
    var matchedTotal = detail.matched_total || 0;
    var statementTotal = detail.statement_lines_total || 0;
    var difference = isDraft
      ? Number(recon.statement_closing_balance || 0) -
        Number(detail.current_book_balance || 0)
      : Number(recon.difference || 0);
    html += "<div class='stat-grid' style='margin-bottom:16px'>";
    html += _brdStatCard("رصيد الكشف الختامي", recon.statement_closing_balance);
    html += _brdStatCard("الرصيد الدفتري الحالي", detail.current_book_balance);
    html += _brdStatCard("إجمالي البنود المطابقة", matchedTotal);
    html += _brdStatCard(
      "الفرق",
      difference,
      Math.abs(difference) < 0.01 ? "success" : "danger",
    );
    html += "</div>";

    // ── شريط الإجراءات ──
    if (isDraft) {
      html +=
        "<div style='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px'>" +
        '<button class="btn btn-outline btn-sm" data-action="auto-match"><i class="ti ti-wand"></i> مطابقة تلقائية</button>' +
        '<button class="btn btn-outline btn-sm" data-action="toggle-add-line"><i class="ti ti-plus"></i> بند يدوي</button>' +
        '<button class="btn btn-outline btn-sm" data-action="toggle-bulk-paste"><i class="ti ti-clipboard-text"></i> لصق دفعة بنود</button>' +
        '<span style="flex:1"></span>' +
        '<button class="btn btn-success btn-sm" data-action="complete"><i class="ti ti-check"></i> اعتماد المطابقة</button>' +
        '<button class="btn btn-danger btn-sm" data-action="delete-session"><i class="ti ti-trash"></i> حذف الجلسة</button>' +
        "</div>";
    } else {
      html +=
        "<div style='margin-bottom:16px'>" +
        '<button class="btn btn-outline btn-sm" data-action="reopen"><i class="ti ti-lock-open"></i> إعادة فتح للمراجعة</button>' +
        "</div>";
    }

    // ── لوحة إضافة بند يدوي (مخفية افتراضياً) ──
    html +=
      "<div id='brd-add-line-panel' style='display:none;background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:16px'>";
    html += "<div class='form-grid'>";
    html +=
      "<div class='field'><label>التاريخ</label><input class='input' type='date' id='brd-nl-date' value='" +
      esc(recon.statement_date || "") +
      "'></div>";
    html +=
      "<div class='field'><label>البيان</label><input class='input' type='text' id='brd-nl-desc'></div>";
    html +=
      "<div class='field'><label>رقم العملية (مرجع)</label><input class='input' type='text' id='brd-nl-ref'></div>";
    html +=
      "<div class='field'><label>مدين (سحب)</label><input class='input' type='number' id='brd-nl-debit' placeholder='0.00'></div>";
    html +=
      "<div class='field'><label>دائن (إيداع)</label><input class='input' type='number' id='brd-nl-credit' placeholder='0.00'></div>";
    html += "</div>";
    html +=
      '<button class="btn btn-primary btn-sm" data-action="save-line" style="margin-top:10px"><i class="ti ti-device-floppy"></i> إضافة البند</button>';
    html += "</div>";

    // ── لوحة لصق دفعة بنود (مخفية افتراضياً) ──
    html +=
      "<div id='brd-bulk-panel' style='display:none;background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:16px'>";
    html +=
      "<p style='color:var(--text3);font-size:12px;margin-bottom:8px'>" +
      "الصق كل بند في سطر، والقيم مفصولة بـ Tab أو فاصلة (,) بالترتيب: " +
      "التاريخ (yyyy-mm-dd)، البيان، المرجع، مدين، دائن. اترك مدين أو دائن فاضي حسب نوع الحركة." +
      "</p>";
    html +=
      "<textarea class='input' id='brd-bulk-text' rows='6' placeholder='2026-06-01\tتحويل وارد\tREF123\t\t5000'></textarea>";
    html +=
      '<button class="btn btn-primary btn-sm" data-action="save-bulk" style="margin-top:10px"><i class="ti ti-device-floppy"></i> إضافة البنود</button>';
    html += "</div>";

    // ── جدول بنود كشف الحساب ──
    html += "<div class='table-wrap'>";
    html +=
      "<table class='table'><thead><tr>" +
      "<th>التاريخ</th><th>البيان</th><th>المرجع</th>" +
      "<th style='text-align:center'>مدين</th><th style='text-align:center'>دائن</th>" +
      "<th>الحالة</th>" +
      (isDraft ? "<th></th>" : "") +
      "</tr></thead><tbody>";

    var lines = detail.lines || [];
    if (!lines.length) {
      html +=
        "<tr><td colspan='7' style='text-align:center;padding:20px;color:var(--text3)'>لا توجد بنود كشف حساب بعد — أضف بند يدوي أو الصق دفعة</td></tr>";
    } else {
      lines.forEach(function (l) {
        html += _renderBrdLineRow(
          l,
          isDraft,
          detail.unmatched_transactions || [],
        );
      });
    }
    html += "</tbody></table></div>";

    return html;
  }

  function _brdStatCard(label, value, tone) {
    var color =
      tone === "success"
        ? "var(--success-dark)"
        : tone === "danger"
          ? "var(--danger-dark)"
          : "var(--text)";
    return (
      "<div style='background:var(--surface1);border:1px solid var(--border);border-radius:10px;padding:14px;flex:1;min-width:160px'>" +
      "<div style='color:var(--text3);font-size:12px;margin-bottom:6px'>" +
      esc(label) +
      "</div>" +
      "<div style='font-size:18px;font-weight:700;color:" +
      color +
      "'>" +
      formatMoney(Number(value || 0), { decimals: 0, withSymbol: false }) +
      "</div></div>"
    );
  }

  function _renderBrdLineRow(l, isDraft, unmatchedTx) {
    var netAmount = Number(l.credit || 0) - Number(l.debit || 0);
    var row =
      "<tr>" +
      "<td>" +
      esc(fmtDateInput(l.line_date)) +
      "</td><td>" +
      esc(l.description || "") +
      "</td><td>" +
      esc(l.reference || "") +
      "</td><td style='text-align:center'>" +
      (Number(l.debit || 0)
        ? formatMoney(Number(l.debit), { decimals: 0, withSymbol: false })
        : "—") +
      "</td><td style='text-align:center'>" +
      (Number(l.credit || 0)
        ? formatMoney(Number(l.credit), { decimals: 0, withSymbol: false })
        : "—") +
      "</td><td>";

    if (l.status === "MATCHED") {
      row +=
        '<span class="badge badge-success">مطابق</span>' +
        "<div style='font-size:11px;color:var(--text3);margin-top:2px'>" +
        esc(
          BANK_RECON_TX_TYPE_LABELS_FE[l.matched_type] || l.matched_type || "",
        ) +
        (l.matched_description ? " — " + esc(l.matched_description) : "") +
        "</div>";
    } else {
      row += '<span class="badge badge-warning">غير مطابق</span>';
    }
    row += "</td>";

    if (isDraft) {
      row += "<td style='white-space:nowrap'>";
      if (l.status === "MATCHED") {
        row +=
          '<button class="btn btn-outline btn-sm" data-action="unmatch" data-line-id="' +
          esc(l.id) +
          '">إلغاء المطابقة</button>';
      } else {
        row +=
          '<button class="btn btn-outline btn-sm" data-action="toggle-match" data-line-id="' +
          esc(l.id) +
          '">طابق</button> ' +
          '<button class="btn btn-outline btn-sm" data-action="delete-line" data-line-id="' +
          esc(l.id) +
          '"><i class="ti ti-trash"></i></button>';
      }
      row += "</td>";
    }
    row += "</tr>";

    // صف فرعي مخفي بقائمة المرشّحين للمطابقة — يظهر عند الضغط على "طابق"
    if (isDraft && l.status !== "MATCHED") {
      var candidates = unmatchedTx
        .slice()
        .sort(function (a, b) {
          return (
            Math.abs(a.amount - netAmount) - Math.abs(b.amount - netAmount)
          );
        })
        .slice(0, 8);
      row +=
        "<tr id='brd-match-panel-" +
        esc(l.id) +
        "' style='display:none'><td colspan='7' style='background:var(--surface2);padding:10px 14px'>";
      if (!candidates.length) {
        row +=
          "<div style='color:var(--text3);font-size:12px'>لا توجد حركات غير مطابقة على هذا الحساب حالياً</div>";
      } else {
        row +=
          "<div style='font-size:12px;color:var(--text3);margin-bottom:8px'>اختر الحركة المطابقة لهذا البند (مرتّبة بالأقرب في المبلغ):</div>";
        row += "<div style='display:flex;flex-direction:column;gap:6px'>";
        candidates.forEach(function (t) {
          var amountMatch = Math.abs(t.amount - netAmount) < 0.01;
          row +=
            "<div style='display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface1);border:1px solid var(--border);border-radius:8px;padding:8px 10px'>" +
            "<div><span style='font-weight:600'>" +
            esc(BANK_RECON_TX_TYPE_LABELS_FE[t.type] || t.type) +
            "</span> — " +
            esc(t.description || "") +
            "<div style='font-size:11px;color:var(--text3)'>" +
            esc(fmtDateInput(t.date)) +
            (t.reference ? " — مرجع: " + esc(t.reference) : "") +
            "</div></div>" +
            "<div style='display:flex;align-items:center;gap:8px'>" +
            "<span style='font-weight:700;color:" +
            (amountMatch ? "var(--success-dark)" : "var(--text)") +
            "'>" +
            formatMoney(Number(t.amount), { decimals: 0, withSymbol: false }) +
            "</span>" +
            '<button class="btn btn-primary btn-sm" data-action="pick-tx" data-line-id="' +
            esc(l.id) +
            '" data-tx-type="' +
            esc(t.type) +
            '" data-tx-id="' +
            esc(t.id) +
            '">اختيار</button>' +
            "</div></div>";
        });
        row += "</div>";
      }
      row += "</td></tr>";
    }

    return row;
  }

  function _bindBankReconDetailHandlers(reconciliationId) {
    var root = document.getElementById("brd-root");
    if (!root) return;
    // [GUARD] الجذر (#brd-root) بيتعمله innerHTML re-render مش استبدال كامل،
    // فلو ربطنا event listener تاني في كل مرة هيتكرر التنفيذ. نربط مرة واحدة بس.
    if (root._brdBound) return;
    root._brdBound = true;

    root.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-action]");
      if (!btn) return;
      var action = btn.getAttribute("data-action");

      if (action === "toggle-add-line") {
        var p = document.getElementById("brd-add-line-panel");
        if (p) p.style.display = p.style.display === "none" ? "block" : "none";
        return;
      }
      if (action === "toggle-bulk-paste") {
        var p2 = document.getElementById("brd-bulk-panel");
        if (p2)
          p2.style.display = p2.style.display === "none" ? "block" : "none";
        return;
      }
      if (action === "toggle-match") {
        var lineId = btn.getAttribute("data-line-id");
        var panel = document.getElementById("brd-match-panel-" + lineId);
        if (panel)
          panel.style.display =
            panel.style.display === "none" ? "table-row" : "none";
        return;
      }

      if (action === "save-line") {
        var debit =
          parseFloat(document.getElementById("brd-nl-debit").value) || 0;
        var credit =
          parseFloat(document.getElementById("brd-nl-credit").value) || 0;
        if (!debit && !credit)
          return NotificationEngine.error("أدخل مبلغ مدين أو دائن");
        var payload = {
          reconciliation_id: reconciliationId,
          line_date: document.getElementById("brd-nl-date").value,
          description: document.getElementById("brd-nl-desc").value,
          reference: document.getElementById("brd-nl-ref").value,
          debit: debit,
          credit: credit,
          callerUser: APP.currentUser.username,
          sessionToken: SESSION.token,
        };
        if (!payload.line_date) return NotificationEngine.error("أدخل تاريخ البند");
        // [SE-ROLLOUT] عبر SaveEngine.run بدل _gsr اليدوي المباشر.
        SaveEngine.run({
          screen: "Accounting.BankReconciliation.Line",
          entity: "bank_statement_line",
          data: payload,
          fn: "addBankStatementLine",
          onSuccess: function () {
            _loadBankReconDetail(reconciliationId);
          },
        });
        return;
      }

      if (action === "save-bulk") {
        var raw = (document.getElementById("brd-bulk-text").value || "").trim();
        if (!raw) return NotificationEngine.error("الصق بنود الكشف أولاً");
        var rows = raw.split("\n").filter(function (l) {
          return l.trim();
        });
        var lines = rows
          .map(function (line) {
            var parts =
              line.indexOf("\t") !== -1 ? line.split("\t") : line.split(",");
            return {
              line_date: (parts[0] || "").trim(),
              description: (parts[1] || "").trim(),
              reference: (parts[2] || "").trim(),
              debit: parseFloat(parts[3]) || 0,
              credit: parseFloat(parts[4]) || 0,
            };
          })
          .filter(function (l) {
            return l.line_date && (l.debit || l.credit);
          });
        if (!lines.length)
          return NotificationEngine.error("لم يتم التعرف على أي بند صحيح في النص الملصق");
        // [SE-ROLLOUT] عبر SaveEngine.run بدل _gsr اليدوي المباشر.
        SaveEngine.run({
          screen: "Accounting.BankReconciliation.BulkLines",
          entity: "bank_statement_line",
          data: {
            reconciliation_id: reconciliationId,
            lines: lines,
            callerUser: APP.currentUser.username,
            sessionToken: SESSION.token,
          },
          fn: "addBankStatementLinesBulk",
          onSuccess: function () {
            _loadBankReconDetail(reconciliationId);
          },
        });
        return;
      }

      if (action === "delete-line") {
        var delId = btn.getAttribute("data-line-id");
        showConfirm({
          title: "حذف البند",
          message: "هل تريد حذف هذا البند من كشف الحساب؟",
          confirmText: "حذف",
          confirmClass: "btn-danger",
          onConfirm: function () {
            _gsr(
              "deleteBankStatementLine",
              [delId, APP.currentUser.username, SESSION.token],
              {
                label: "Accounting.deleteBankStatementLine",
                onSuccess: function (r) {
                  NotificationEngine.success(r.message);
                  _loadBankReconDetail(reconciliationId);
                },
                onError: function (r) {
                  NotificationEngine.error(r.message || "خطأ");
                },
              },
            );
          },
        });
        return;
      }

      if (action === "pick-tx") {
        var pLineId = btn.getAttribute("data-line-id");
        var txType = btn.getAttribute("data-tx-type");
        var txId = btn.getAttribute("data-tx-id");
        _gsr(
          "matchStatementLine",
          {
            statement_line_id: pLineId,
            transaction_type: txType,
            transaction_id: txId,
            callerUser: APP.currentUser.username,
            sessionToken: SESSION.token,
          },
          {
            label: "Accounting.matchStatementLine",
            onSuccess: function (r) {
              NotificationEngine.success(r.message);
              _loadBankReconDetail(reconciliationId);
            },
            onError: function (r) {
              NotificationEngine.error(r.message || "خطأ");
            },
          },
        );
        return;
      }

      if (action === "unmatch") {
        var unId = btn.getAttribute("data-line-id");
        _gsr(
          "unmatchStatementLine",
          [unId, APP.currentUser.username, SESSION.token],
          {
            label: "Accounting.unmatchStatementLine",
            onSuccess: function (r) {
              NotificationEngine.success(r.message);
              _loadBankReconDetail(reconciliationId);
            },
            onError: function (r) {
              NotificationEngine.error(r.message || "خطأ");
            },
          },
        );
        return;
      }

      if (action === "auto-match") {
        _gsr(
          "autoMatchBankReconciliation",
          [reconciliationId, APP.currentUser.username, SESSION.token],
          {
            label: "Accounting.autoMatchBankReconciliation",
            onSuccess: function (r) {
              NotificationEngine.success(r.message);
              _loadBankReconDetail(reconciliationId);
            },
            onError: function (r) {
              NotificationEngine.error(r.message || "خطأ");
            },
          },
        );
        return;
      }

      if (action === "complete") {
        showConfirm({
          title: "اعتماد جلسة المطابقة",
          message:
            "بعد الاعتماد لن يمكن تعديل المطابقة إلا بإعادة فتح الجلسة. متابعة؟",
          confirmText: "اعتماد",
          confirmClass: "btn-success",
          onConfirm: function () {
            _gsr(
              "completeBankReconciliation",
              [reconciliationId, APP.currentUser.username, SESSION.token],
              {
                label: "Accounting.completeBankReconciliation",
                onSuccess: function (r) {
                  NotificationEngine.success(r.message);
                  _loadBankReconDetail(reconciliationId);
                  _loadBankReconciliationsList();
                },
                onError: function (r) {
                  NotificationEngine.error(r.message || "خطأ");
                },
              },
            );
          },
        });
        return;
      }

      if (action === "reopen") {
        _gsr(
          "reopenBankReconciliation",
          [reconciliationId, APP.currentUser.username, SESSION.token],
          {
            label: "Accounting.reopenBankReconciliation",
            onSuccess: function (r) {
              NotificationEngine.success(r.message);
              _loadBankReconDetail(reconciliationId);
              _loadBankReconciliationsList();
            },
            onError: function (r) {
              NotificationEngine.error(r.message || "خطأ");
            },
          },
        );
        return;
      }

      if (action === "delete-session") {
        showConfirm({
          title: "حذف جلسة المطابقة",
          message: "هل تريد حذف جلسة المطابقة دي بكل بنودها؟",
          confirmText: "حذف",
          confirmClass: "btn-danger",
          onConfirm: function () {
            _gsr(
              "deleteBankReconciliation",
              [reconciliationId, APP.currentUser.username, SESSION.token],
              {
                label: "Accounting.deleteBankReconciliation",
                onSuccess: function (r) {
                  NotificationEngine.success(r.message);
                  closeStyledDrawer();
                  _loadBankReconciliationsList();
                },
                onError: function (r) {
                  NotificationEngine.error(r.message || "خطأ");
                },
              },
            );
          },
        });
        return;
      }
    });
  }

  function bindGeneralLedger() {
    ensureExtendedData(function () {
      var sel = document.getElementById("gl-account-select");
      var fromEl = document.getElementById("gl-from-date");
      var toEl = document.getElementById("gl-to-date");
      var btn = document.getElementById("gl-btn-load");

      // عبّئ قائمة الحسابات
      if (sel) {
        var accounts = APP.data.chartOfAccounts || [];
        sel.innerHTML =
          "<option value=''>— كل الحسابات —</option>" +
          accounts
            .map(function (a) {
              return (
                "<option value='" +
                esc(a.id) +
                "'>" +
                esc(a.name + " (" + a.code + ")") +
                "</option>"
              );
            })
            .join("");
      }

      if (btn) {
        btn.addEventListener("click", function () {
          var accountId = sel && sel.value;
          var from = fromEl && fromEl.value;
          var to = toEl && toEl.value;
          if (!accountId) return NotificationEngine.warning("اختر حساباً");

          btn.disabled = true;
          var resultDiv = document.getElementById("gl-results");
          if (resultDiv)
            resultDiv.innerHTML =
              "<div style='padding:40px;text-align:center'><div class='spinner'></div></div>";

          _gsr(
            "getGeneralLedger",
            [accountId, from, to, APP.currentUser.username, SESSION.token],
            {
              label: "Accounting.getGeneralLedger",
              onSuccess: function (r) {
                btn.disabled = false;
                // [P6-B FIX] getGeneralLedger تُعيد مصفوفة من كائنات
                // {account, opening_balance, entries, closing_balance} لكل حساب —
                // وليس مصفوفة حركات مباشرة. كان الكود القديم يمرر r.data مباشرة
                // لدالة الرسم التي تتوقع صفوف حركة فردية (date/debit/credit)،
                // فيظهر تقرير الأستاذ العام فارغاً أو بأرقام خاطئة دائماً.
                var accLedger = (r.data && r.data[0]) || null;
                var entries = accLedger ? accLedger.entries : [];
                if (resultDiv) {
                  if (!entries || !entries.length) {
                    resultDiv.innerHTML =
                      "<div style='padding:40px;text-align:center;color:var(--text3)'>لا توجد حركات في هذه الفترة</div>";
                  } else {
                    _renderLedgerTable(
                      resultDiv,
                      entries,
                      accLedger ? accLedger.opening_balance : 0,
                    );
                  }
                }
              },
              onError: function (r) {
                btn.disabled = false;
                NotificationEngine.error(r.message || "فشل تحميل الأستاذ");
              },
            },
          );
        });
      }
    });
  }

  function _renderTrialBalanceInPlace(rows, container) {
    if (!container) return;
    if (!rows.length) {
      container.innerHTML =
        "<div style='text-align:center;padding:24px;color:var(--text3)'>لا توجد بيانات</div>";
      return;
    }
    var totDr = 0,
      totCr = 0;
    rows.forEach(function (r) {
      totDr += parseFloat(r.debit) || 0;
      totCr += parseFloat(r.credit) || 0;
    });
    var diff = totDr - totCr;
    _tbRegisterColumns();
    ColumnEngine.renderTable("trial_balance", container, rows, {
      bottomRow: {
        label: "الإجمالي",
        values: {
          debit: formatMoney(totDr, { decimals: 0, withSymbol: false }),
          credit: formatMoney(totCr, { decimals: 0, withSymbol: false }),
          balance:
            "<span style='color:" +
            (Math.abs(diff) < 0.01
              ? "var(--success,#22c55e)"
              : "var(--error,#ef4444)") +
            "'>" +
            (Math.abs(diff) < 0.01
              ? " متوازن"
              : " فرق: " +
                formatMoney(Math.abs(diff), {
                  decimals: 0,
                  withSymbol: false,
                })) +
            "</span>",
        },
      },
    });

      formatMoney(totCr, { decimals: 0, withSymbol: false }) +
      "</td></tr></tfoot></table>"

    var d = _isLastData;
    var headers = ["البند", "الكود", "المبلغ"];

    data.push(["الإيرادات", "", formatMoney(d.totalRev, { decimals: 0 })]);

      rowClasses.push(undefined);
    });
    data.push(["المصروفات", "", formatMoney(d.totalExp, { decimals: 0 })]);

      data.push([acc.name || "", acc.code || "", formatMoney(acc.amount || 0, { decimals: 0 })]);

      formatMoney(Math.abs(d.net), { decimals: 0 }),

  function bindIncomeStatement() {

                  var revenues = Array.isArray(d.revenues) ? d.revenues : [];
                  var expenses = Array.isArray(d.expenses_list)
                    ? d.expenses_list

                  // عبر المحرك الموحّد بدل window.print() على الشاشة

                  html +=

                  html += "</div>";

                  // إجمالي الإيرادات
                  html += "<div style='margin-bottom:20px'>";
                  html +=
                    "<div style='display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid var(--success,#22c55e)'>";
                  html +=
                    "<span style='font-size:15px;font-weight:700;color:var(--success,#22c55e)'><i class='ti ti-trending-up' style='margin-left:6px'></i>الإيرادات</span>";
                  html +=
                    "<b style='color:var(--success,#22c55e);font-size:16px'>" +
                    formatMoney(totalRev, { decimals: 0 }) +
                    "</b>";
                  html += "</div>";
                  if (revenues.length > 0) {
                    revenues.forEach(function (acc) {
                      html +=
                        "<div style='display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)'>";
                      html +=
                        "<span>" +
                        esc(acc.name || "") +
                        "<span style='color:var(--text3);margin-right:6px;font-size:11px'>" +
                        esc(acc.code || "") +
                        "</span></span>";
                      html +=
                        "<span style='color:var(--success,#22c55e)'>" +
                        formatMoney(acc.amount || 0, { decimals: 0 }) +
                        "</span>";
                      html += "</div>";
                    });
                  }
                  html += "</div>";

                  // إجمالي المصروفات
                  html += "<div style='margin-bottom:20px'>";
                  html +=
                    "<div style='display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid var(--danger,#ef4444)'>";
                  html +=
                    "<span style='font-size:15px;font-weight:700;color:var(--danger,#ef4444)'><i class='ti ti-trending-down' style='margin-left:6px'></i>المصروفات</span>";
                  html +=
                    "<b style='color:var(--danger,#ef4444);font-size:16px'>" +
                    formatMoney(totalExp, { decimals: 0 }) +
                    "</b>";
                  html += "</div>";
                  if (expenses.length > 0) {
                    expenses.forEach(function (acc) {
                      html +=
                        "<div style='display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)'>";
                      html +=
                        "<span>" +
                        esc(acc.name || "") +
                        "<span style='color:var(--text3);margin-right:6px;font-size:11px'>" +
                        esc(acc.code || "") +
                        "</span></span>";
                      html +=
                        "<span style='color:var(--danger,#ef4444)'>" +
                        formatMoney(acc.amount || 0, { decimals: 0 }) +
                        "</span>";
                      html += "</div>";
                    });
                  }
                  html += "</div>";

                  // صافي الربح / الخسارة
                  html +=
                    "<div style='display:flex;justify-content:space-between;align-items:center;padding:16px;background:" +
                    (net >= 0 ? "#D1FAE522" : "#FEE2E222") +
                    ";border-radius:10px;border:1px solid " +

              onError: function (r) {

              },
