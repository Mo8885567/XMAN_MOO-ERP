  function bindCheques() {
    ensureExtendedData(function () {
      var _activeFilter = "ALL";

      var _searchQuery = "";

      // [BANKING-INTEGRATION — المرحلة 11] استهلاك فلتر الطرف (لو الشاشة
      // اتفتحت من زر "شيكات هذا الطرف" في كشف حساب عميل/مورد) — يُقرأ

      // فلتر الطرف فوق: يُقرأ مرة واحدة بس ثم يُمسح من window.
      var _dashPreset = window._chqDashboardPreset || null;

      function _renderPartyChip() {
        var chip = document.getElementById("chq-party-filter-chip");
        if (!chip) return;
        if (!_partyFilter) {
          chip.style.display = "none";
          chip.innerHTML = "";
          return;
        }
        chip.style.display = "inline-flex";
        chip.style.alignItems = "center";
        chip.style.gap = "6px";
        chip.style.marginRight = "6px";
        chip.innerHTML =
          "<span class='badge badge-primary' style='display:inline-flex;align-items:center;gap:6px'>" +
          "<i class='ti ti-filter' style='font-size:12px'></i>" +
          esc(_partyFilter.name || _partyFilter.id) +
          " <i class='ti ti-x' id='chq-party-filter-clear' style='cursor:pointer;font-size:12px' title='إلغاء الفلتر'></i>" +
          "</span>";

        if (clearBtn) {

            _partyFilter = null;

          });

      function _renderRows() {
        var list = APP.data.cheques || [];
        if (_activeFilter === "INCOMING" || _activeFilter === "OUTGOING") {
          list = list.filter(function (c) {
            return c.type === _activeFilter;
          });

        if (_partyFilter) {
          list = list.filter(function (c) {
            return (
              String(c.party_id) === String(_partyFilter.id) &&
              (!_partyFilter.type || c.party_type === _partyFilter.type)
            );
          });
        }
        if (_presetStatus) {
          // [CHQ-WORKFLOW-V2 — Phase 2] _presetStatus ممكن تبقى نص واحد
          // (زي ما كانت — نداءات KPI القديمة) أو مصفوفة حالات (نداءات
          // عُقد الرسمة الجديدة اللي بتدمج حالة قديمة+جديدة مع بعض،
          // زي RECEIVED اللي بتشمل PENDING القديمة كمان).
          var _presetList = Array.isArray(_presetStatus)
            ? _presetStatus
            : [_presetStatus];
          list = list.filter(function (c) {
            return _presetList.indexOf(c.status || "PENDING") !== -1;
          });
        }
        if (_searchQuery) {
          var q = _searchQuery.trim().toLowerCase();
          list = list.filter(function (c) {

              String(c.cheque_number || "")

                .toLowerCase()
                .indexOf(q) !== -1

        var tbody = document.getElementById("chq-table-body");
        if (!tbody) return;
        tbody.innerHTML = !list.length
          ? "<tr><td colspan='7' style='text-align:center;padding:24px;color:var(--text3)'>" +
            (_partyFilter
              ? "لا توجد شيكات لهذا الطرف"

                ? "لا توجد شيكات مطابقة لهذا الفلتر"
                : "لا توجد شيكات بعد") +
            "</td></tr>"
          : list
              .map(function (c) {
                var status = c.status || "PENDING";
                return (
                  "<tr data-row data-id='" +
                  esc(c.id) +
                  "' style='cursor:pointer'>" +
                  "<td><span class='badge " +
                  (c.type === "INCOMING" ? "badge-blue" : "badge-purple") +
                  "'>" +
                  (_CHQ_TYPE_LABELS[c.type] || c.type) +
                  "</span></td>" +
                  "<td dir='ltr' style='text-align:left'>" +
                  esc(c.cheque_number || "") +
                  "</td>" +
                  "<td>" +
                  esc(c.party_name || "") +
                  (c.party_type
                    ? " <span style='color:var(--text3);font-size:11px'>(" +
                      (_CHQ_PARTY_LABELS[c.party_type] || c.party_type) +
                      ")</span>"
                    : "") +
                  "</td>" +
                  "<td><b>" +
                  esc(c.bank_account_name || "") +
                  "</b>" +
                  (c.bank_name
                    ? " <span style='color:var(--text3);font-size:11px'>(" +
                      esc(c.bank_name) +
                      ")</span>"
                    : "") +
                  "</td>" +
                  "<td style='text-align:center;font-weight:600'>" +
                  formatMoney(Number(c.amount || 0), {
                    decimals: 0,
                    withSymbol: false,
                  }) +
                  "</td>" +
                  "<td>" +
                  esc(c.due_date || "—") +
                  "</td>" +
                  "<td><span class='badge " +
                  (_CHQ_STATUS_BADGE[status] || "badge-secondary") +
                  "'>" +
                  (_CHQ_STATUS_LABELS[status] || status) +
                  "</span></td>" +
                  "</tr>"
                );
              })
              .join("");
      }

      // ─────────────────────────────────────────────────────────────
      // [CHQ-WORKFLOW] لوحة العمليات التفاعلية — واجهة فقط، بتعتمد
      // بالكامل على نفس APP.data.cheques والحالات الموجودة أصلاً
      // (_CHQ_STATUS_LABELS/_CHQ_STATUS_BADGE) بدون أي منطق محاسبي جديد.
      // ─────────────────────────────────────────────────────────────
      function _chqBaseListForWorkflow() {
        var list = APP.data.cheques || [];
        if (_activeFilter === "INCOMING" || _activeFilter === "OUTGOING") {
          list = list.filter(function (c) {
            return c.type === _activeFilter;
          });
        }
        if (_partyFilter) {
          list = list.filter(function (c) {
            return (
              String(c.party_id) === String(_partyFilter.id) &&
              (!_partyFilter.type || c.party_type === _partyFilter.type)
            );
          });
        }
        return list;
      }

      // ─────────────────────────────────────────────────────────────
      // [CHQ-WORKFLOW-V2 — Phase 2] رسمة التدفق المتفرعة — بتحسب عدد
      // الشيكات لكل عقدة من CHQ_FLOW_LANES (بما فيها الحالات القديمة
      // المدموجة عبر legacyKeys)، بترسم الخطوط الموصّلة بين العُقد،
      // وبتلوّن العقدة/chip النشطة حسب الفلتر الحالي.
      // ─────────────────────────────────────────────────────────────
      function _chqStatusesForNode(node) {
        return [node.key].concat(node.legacyKeys || []);
      }

      function _chqNodeMatchesPreset(statuses) {
        if (!_presetStatus) return false;
        var presetList = Array.isArray(_presetStatus)
          ? _presetStatus
          : [_presetStatus];
        // active لو نفس مجموعة الحالات بالظبط (منعاً لتفعيل عقدة بالخطأ
        // لمجرد تقاطع جزئي مع فلتر تاني)
        if (presetList.length !== statuses.length) return false;
        return presetList.every(function (s) {
          return statuses.indexOf(s) !== -1;
        });
      }

      function _chqDrawFlowConnectors(laneKey, lane) {
        var body = document.getElementById("chq-flow-body-" + laneKey);
        var svg = document.getElementById("chq-flow-svg-" + laneKey);
        if (!body || !svg) return;
        var containerRect = body.getBoundingClientRect();
        var nodeRects = {};
        lane.nodes.forEach(function (n) {
          var el = document.getElementById(
            "chq-flow-node-" + laneKey + "-" + n.key,
          );
          if (el) nodeRects[n.key] = el.getBoundingClientRect();
        });
        var svgHtml =
          '<defs><marker id="chq-arrow-' +
          laneKey +
          '" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">' +
          '<path d="M0,0 L8,4 L0,8 Z" fill="var(--text3)"></path></marker></defs>';
        lane.edges.forEach(function (edge) {
          var a = nodeRects[edge[0]];
          var b = nodeRects[edge[1]];
          if (!a || !b) return;
          // اتجاه التدفق الطبيعي (RTL): من اليمين للشمال — يعني العقدة
          // "من" أعرض/أبعد يمين. لو العكس (زي RETURNED_OUT→DRAFTED
          // إعادة التحرير) بيترسم بخط متقطع يعكس الاتجاه.
          var forward = a.left > b.left;
          var ax = (forward ? a.left : a.right) - containerRect.left;
          var ay = a.top - containerRect.top + a.height / 2;
          var bx = (forward ? b.right : b.left) - containerRect.left;
          var by = b.top - containerRect.top + b.height / 2;
          var midX = (ax + bx) / 2;
          svgHtml +=
            '<path d="M' +
            ax +
            "," +
            ay +
            " C" +
            midX +
            "," +
            ay +
            " " +
            midX +
            "," +
            by +
            " " +
            bx +
            "," +
            by +
            '" fill="none" stroke="var(--text3)" stroke-width="1.6"' +
            (forward ? "" : ' stroke-dasharray="4,3"') +
            ' marker-end="url(#chq-arrow-' +
            laneKey +
            ')"></path>';
        });
        svg.innerHTML = svgHtml;
      }

      function _renderWorkflow() {
        // ── مقصود: عدّادات اللينين بتفضل صحيحة لكل نوع مستقل عن فلتر
        // النوع الحالي (_activeFilter) في شريط الفلاتر — كل لين أصلاً
        // بيمثّل نوع واحد بالكامل، فمفيش داعي لتضييقه أكتر. فلتر الطرف
        // (لو موجود) لسه بيتحترم عادي لأنه بيعبر النوعين. ──
        var list = APP.data.cheques || [];
        if (_partyFilter) {
          list = list.filter(function (c) {
            return (
              String(c.party_id) === String(_partyFilter.id) &&
              (!_partyFilter.type || c.party_type === _partyFilter.type)
            );
          });
        }
        Object.keys(CHQ_FLOW_LANES).forEach(function (laneKey) {
          var lane = CHQ_FLOW_LANES[laneKey];
          var laneList = list.filter(function (c) {
            return c.type === laneKey;
          });
          lane.nodes.forEach(function (n) {
            var statuses = _chqStatusesForNode(n);
            var nodeList = laneList.filter(function (c) {
              return statuses.indexOf(c.status || "PENDING") !== -1;
            });
            var countEl = document.getElementById(
              "chq-flow-count-" + laneKey + "-" + n.key,
            );
            if (countEl) {
              countEl.textContent = nodeList.length;
              countEl.classList.toggle(
                "chq-flow-count-zero",
                nodeList.length === 0,
              );
            }
            var nodeEl = document.getElementById(
              "chq-flow-node-" + laneKey + "-" + n.key,
            );
            if (nodeEl)
              nodeEl.classList.toggle(
                "chq-flow-node-active",
                _chqNodeMatchesPreset(statuses),
              );
          });
          lane.extraStatuses.forEach(function (statusKey) {
            var chipList = laneList.filter(function (c) {
              return (c.status || "PENDING") === statusKey;
            });
            var chipCountEl = document.getElementById(
              "chq-flow-extra-count-" + laneKey + "-" + statusKey,
            );
            if (chipCountEl) chipCountEl.textContent = chipList.length;
            var chipEl = document.getElementById(
              "chq-flow-extra-" + laneKey + "-" + statusKey,
            );
            if (chipEl)
              chipEl.classList.toggle(
                "chq-flow-extra-active",
                _chqNodeMatchesPreset([statusKey]),
              );
          });
          _chqDrawFlowConnectors(laneKey, lane);
        });
      }

      function _chqLatestInStage(statuses) {
        var statusList = Array.isArray(statuses) ? statuses : [statuses];
        var list = _chqBaseListForWorkflow().filter(function (c) {
          return statusList.indexOf(c.status || "PENDING") !== -1;
        });
        if (!list.length) return null;
        list.sort(function (a, b) {
          return String(b.updated_at || "").localeCompare(
            String(a.updated_at || ""),
          );
        });
        return list[0];
      }

      // دالة عامة (تُستخدم من onclick داخل kpiCard الجاهزة) — بتطبّق
      // فلتر جاهز على نفس شاشة الشيكات المفتوحة حالياً من غير navigate.
      window._chqQuickFilter = function (type, status, label) {
        if (type) {
          _activeFilter = type;
          document.querySelectorAll(".chq-filter-btn").forEach(function (b) {
            b.classList.toggle("active", b.dataset.filter === type);
          });
        }
        _presetStatus = status || null;
        _presetLabel = label || status || "";
        _renderStatusChip();
        _renderRows();
        _renderWorkflow();
      };

      function _renderKpis() {
        if (typeof DashboardWidgets === "undefined") return;
        var list = APP.data.cheques || [];
        var todayStr = (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]);
        var soonStr = new Date(Date.now() + 3 * 86400000)
          .toISOString()
          .split("T")[0];
        var incoming = list.filter(function (c) {
          return c.type === "INCOMING";
        });
        var outgoing = list.filter(function (c) {
          return c.type === "OUTGOING";
        });
        var byStatus = function (arr, s) {
          return arr.filter(function (c) {
            return (c.status || "PENDING") === s;
          }).length;
        };
        // [CHQ-WORKFLOW-V2 — التبديل النهائي] "بانتظار التحصيل"/"تم
        // التحصيل"/"تم الصرف" بقت مجموعات حالات type-aware (تشمل الحالة
        // الجديدة + PENDING/COLLECTED الإرث مع بعض) بدل ما تفضل بتعد بس
        // PENDING/COLLECTED الحرفية وتفضل ناقصة أي شيك جديد من دلوقتي.
        // (توسيع كروت الوصول السريع لتشمل كل عُقد الرسمة بالكامل — مثل
        // إيداع للتحصيل/تظهير/ارتجاع — لسه بند مستقل مؤجل).
        var byStatusAny = function (arr, list) {
          return arr.filter(function (c) {
            return list.indexOf(c.status || "PENDING") !== -1;
          }).length;
        };
        var IN_PENDING_GROUP = ["RECEIVED", "PENDING"];
        var IN_COLLECTED_GROUP = ["CASHED", "COLLECTED"];
        var OUT_PENDING_GROUP = ["DRAFTED", "PENDING"];
        var OUT_COLLECTED_GROUP = ["PAID", "COLLECTED"];
        var inGrid = document.getElementById("chq-kpi-incoming-grid");
        if (inGrid) {
          inGrid.innerHTML = DashboardWidgets.kpiGrid([
            DashboardWidgets.kpiCard({
              label: "إجمالي المستلمة",
              value: incoming.length,
              icon: {
                tiClass: "ti-inbox-in",
                bg: "var(--info-soft,#eff6ff)",
                color: "var(--info,#0ea5e9)",
              },
              onClick: "_chqQuickFilter('INCOMING', null, '')",
            }),
            DashboardWidgets.kpiCard({
              label: "بانتظار التحصيل",
              value: byStatusAny(incoming, IN_PENDING_GROUP),
              icon: {
                tiClass: "ti-clock",
                bg: "var(--warning-soft)",
                color: "var(--warning)",
              },
              onClick:
                "_chqQuickFilter('INCOMING',['RECEIVED','PENDING'],'واردة — بانتظار التحصيل')",
            }),
            DashboardWidgets.kpiCard({
              label: "تم تحصيلها",
              value: byStatusAny(incoming, IN_COLLECTED_GROUP),
              icon: {
                tiClass: "ti-circle-check",
                bg: "var(--success-soft)",
                color: "var(--success-dark)",
              },
              onClick:
                "_chqQuickFilter('INCOMING',['CASHED','COLLECTED'],'واردة — تم التحصيل')",
            }),
            DashboardWidgets.kpiCard({
              label: "مرتجعة من البنك",
              value: byStatus(incoming, "BOUNCED"),
              icon: {
                tiClass: "ti-alert-triangle",
                bg: "var(--danger-soft)",
                color: "var(--danger)",
              },
              onClick: "_chqQuickFilter('INCOMING','BOUNCED','واردة — مرتدة')",
            }),
          ]);
        }
        var outGrid = document.getElementById("chq-kpi-outgoing-grid");
        if (outGrid) {
          var pendingOut = outgoing.filter(function (c) {
            return OUT_PENDING_GROUP.indexOf(c.status || "PENDING") !== -1;
          });
          var dueSoon = pendingOut.filter(function (c) {
            return (
              c.due_date && c.due_date >= todayStr && c.due_date <= soonStr
            );
          });
          var dueToday = pendingOut.filter(function (c) {
            return c.due_date === todayStr;
          });
          outGrid.innerHTML = DashboardWidgets.kpiGrid([
            DashboardWidgets.kpiCard({
              label: "إجمالي المحررة",
              value: outgoing.length,
              icon: {
                tiClass: "ti-file-invoice",
                bg: "var(--purple-soft)",
                color: "var(--purple)",
              },
              onClick: "_chqQuickFilter('OUTGOING', null, '')",
            }),
            DashboardWidgets.kpiCard({
              label: "تم صرفها",
              value: byStatusAny(outgoing, OUT_COLLECTED_GROUP),
              icon: {
                tiClass: "ti-circle-check",
                bg: "var(--success-soft)",
                color: "var(--success-dark)",
              },
              onClick:
                "_chqQuickFilter('OUTGOING',['PAID','COLLECTED'],'صادرة — تم الصرف')",
            }),
            DashboardWidgets.kpiCard({
              label: "مرتجعة",
              value: byStatus(outgoing, "BOUNCED"),
              icon: {
                tiClass: "ti-alert-triangle",
                bg: "var(--danger-soft)",
                color: "var(--danger)",
              },
              onClick: "_chqQuickFilter('OUTGOING','BOUNCED','صادرة — مرتدة')",
            }),
            DashboardWidgets.kpiCard({
              label: "مستحقة قريباً (٣ أيام)",
              value: dueSoon.length,
              icon: {
                tiClass: "ti-hourglass",
                bg: "var(--warning-soft)",
                color: "var(--warning)",
              },
              onClick:
                "_chqQuickFilter('OUTGOING',['DRAFTED','PENDING'],'صادرة — مستحقة قريباً')",
            }),
            DashboardWidgets.kpiCard({
              label: "مستحقة اليوم",
              value: dueToday.length,
              icon: {
                tiClass: "ti-calendar-event",
                bg: "var(--danger-soft)",
                color: "var(--danger)",
              },
              onClick:
                "_chqQuickFilter('OUTGOING',['DRAFTED','PENDING'],'صادرة — مستحقة اليوم')",
            }),
          ]);
        }
      }

      function _chqTimeAgo(iso) {
        if (!iso) return "";
        var d = new Date(iso).getTime();
        if (isNaN(d)) return "";
        var diff = Math.max(0, Date.now() - d);
        var mins = Math.floor(diff / 60000);
        if (mins < 1) return "الآن";
        if (mins < 60) return "منذ " + mins + " د";
        var hrs = Math.floor(mins / 60);
        if (hrs < 24) return "منذ " + hrs + " س";
        var days = Math.floor(hrs / 24);
        if (days < 30) return "منذ " + days + " يوم";
        return String(iso).split("T")[0];
      }

      function _chqTimelineActionLabel(c) {
        var num = c.cheque_number || "";
        switch (c.status) {
          case "COLLECTED":
            return c.type === "INCOMING"
              ? "تم تحصيل شيك رقم " + num
              : "تم صرف شيك رقم " + num;
          case "BOUNCED":
            return "تم إرجاع شيك رقم " + num + " من البنك";
          case "CANCELLED":
            return "تم إلغاء شيك رقم " + num;
          case "REPLACED":
            return "تم استبدال شيك رقم " + num;
          // ── [CHQ-WORKFLOW-V2 — التبديل النهائي] عُقد جديدة، نفس أسلوب
          // الرسائل القديمة بالظبط (بدل ما تفضل واقعة تحت default العامة) ──
          case "RECEIVED":
            return "تم استلام شيك رقم " + num;
          case "DEPOSITED_FOR_COLLECTION":
            return "تم إيداع شيك رقم " + num + " للتحصيل";
          case "ENDORSED":
            return "تم تظهير شيك رقم " + num + " لطرف آخر";
          case "CASHED":
            return "تم صرف شيك رقم " + num;
          case "RETURNED":
            return "تم تسجيل ارتجاع شيك رقم " + num;
          case "RETURNED_TO_OWNER":
            return "تم رد شيك رقم " + num + " لمالكه";
          case "DRAFTED":
            return "تم تحرير شيك رقم " + num;
          case "PAID":
            return "تم صرف شيك رقم " + num;
          case "RETURNED_OUT":
            return "تم تسجيل ارتجاع شيك رقم " + num;
          default:
            return c.created_at === c.updated_at
              ? (c.type === "INCOMING"
                  ? "تم استلام شيك رقم "
                  : "تم تحرير شيك رقم ") + num
              : "تم تحديث شيك رقم " + num;
        }
      }

      function _renderTimeline() {
        var host = document.getElementById("chq-timeline-widget");
        if (!host || typeof DashboardWidgets === "undefined") return;
        var list = (APP.data.cheques || [])
          .slice()
          .sort(function (a, b) {
            return String(b.updated_at || "").localeCompare(
              String(a.updated_at || ""),
            );
          })
          .slice(0, 15);
        host.innerHTML = DashboardWidgets.activityWidget({
          title: "آخر عمليات الشيكات",
          icon: "ti-history",
          id: "chq-timeline-list",
          emptyMessage: "لا توجد عمليات على الشيكات بعد",
          items: list.map(function (c) {
            var st = c.status || "PENDING";
            var meta =
              CHQ_WORKFLOW_STAGES.find(function (s) {
                return s.key === st;
              }) || {};
            return {
              icon: meta.icon || "ti-point",
              iconColor: meta.color || "var(--primary)",
              title: _chqTimelineActionLabel(c),
              subtitle:
                (c.party_name || "") +
                " — " +
                (c.updated_by || c.created_by || ""),
              time: _chqTimeAgo(c.updated_at || c.created_at),
              onClick: "_openChequeModal('" + String(c.id) + "')",
            };
          }),
        });
      }

      // ── قائمة سريعة بالزر الأيمن على أي بطاقة مرحلة ──
      function _closeChqCtxMenu() {
        var m = document.getElementById("chq-ctx-menu");
        if (m) m.remove();
        document.removeEventListener("click", _closeChqCtxMenu);
      }
      // [CHQ-WORKFLOW-V2 — Phase 2 بند 1] قائمة كليك-يمين مختصرة من نفس
      // عقدة الرسمة مباشرة: لو فيه عملية في هذه العقدة، بتعرض إجراءات
      // "الخطوة التالية" المتاحة لآخر عملية فيها وتنفّذها فورًا عبر نفس
      // درج التأكيد المستخدم من داخل مودال الشيك (_openChequeLifecycleDrawer)
      // — من غير ما يفتح المودال الكامل الأول. لو مفيش أزرار متاحة (حالة
      // نهائية/مفيش صلاحية) بيرجع لقائمة الاختصارات العامة بس.
      function _openChqCtxMenu(e, stageKey, laneKey, node) {
        e.preventDefault();
        _closeChqCtxMenu();
        var items = [];
        var quickItems = [];

        if (laneKey && node && canDo("changeChequeStatus")) {
          var chequeType = laneKey === "OUTGOING" ? "OUTGOING" : "INCOMING";
          var statuses = _chqStatusesForNode(node);
          var latest = _chqLatestInStage(statuses);
          if (latest) {
            var nextStatuses =
              _chqTransitionsFor(chequeType)[latest.status] || [];
            nextStatuses.forEach(function (st) {
              var meta = _CHQ_ACTION_META[st] || {
                label: st,
                icon: "ti-arrow-right",
              };
              quickItems.push({
                icon: meta.icon,
                label: meta.label + " — شيك " + (latest.cheque_number || ""),
                action: function () {
                  _openChequeLifecycleDrawer(latest, st);
                },
              });
            });
          }
        }

        if (quickItems.length) {
          items = items.concat(quickItems);
          items.push({ separator: true });
        }

        if (canDo("addCheque"))
          items.push({
            icon: "ti-plus",
            label: "إنشاء عملية جديدة",
            action: function () {
              _openChequeModal(null);
            },
          });
        items.push({
          icon: "ti-list",
          label: "عرض جميع العمليات",
          action: function () {
            window._chqQuickFilter(null, null, "");
            document.querySelectorAll(".chq-filter-btn").forEach(function (b) {
              b.classList.toggle("active", b.dataset.filter === "ALL");
            });
            _activeFilter = "ALL";
            _renderRows();
            _renderWorkflow();
          },
        });
        items.push({
          icon: "ti-search",
          label: "بحث",
          action: function () {
            var inp = document.getElementById("chq-search-input");
            if (inp) inp.focus();
          },
        });
        if (canDo("viewCheques"))
          items.push({
            icon: "ti-report",
            label: "التقارير",
            action: function () {
              navigate("cheques_report");
            },
          });
        var menu = document.createElement("div");
        menu.id = "chq-ctx-menu";
        menu.style.cssText =
          "position:fixed;z-index:9999;background:var(--surface);border:1px solid var(--border);" +
          "border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px;min-width:190px;" +
          "left:" +
          e.clientX +
          "px;top:" +
          e.clientY +
          "px;";
        menu.innerHTML = items
          .map(function (it, i) {
            if (it.separator)
              return '<div style="height:1px;background:var(--border);margin:4px 2px"></div>';
            return (
              '<div class="chq-ctx-item" data-i="' +
              i +
              '" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap">' +
              '<i class="ti ' +
              it.icon +
              '" style="color:var(--text3)"></i>' +
              esc(it.label) +
              "</div>"
            );
          })
          .join("");
        document.body.appendChild(menu);
        // لو القائمة طلعت خارج حدود الشاشة (على اليمين/تحت) اعكس موضعها
        var mRect = menu.getBoundingClientRect();
        if (mRect.right > window.innerWidth)
          menu.style.left = Math.max(4, e.clientX - mRect.width) + "px";
        if (mRect.bottom > window.innerHeight)
          menu.style.top = Math.max(4, e.clientY - mRect.height) + "px";
        menu.querySelectorAll(".chq-ctx-item").forEach(function (el) {
          el.addEventListener("mouseenter", function () {
            el.style.background = "var(--surface2)";
          });
          el.addEventListener("mouseleave", function () {
            el.style.background = "";
          });
          el.addEventListener("click", function () {
            items[Number(el.dataset.i)].action();
            _closeChqCtxMenu();
          });
        });
        setTimeout(function () {
          document.addEventListener("click", _closeChqCtxMenu);
        }, 0);
      }

      // [CHQ-WORKFLOW-V2 — Phase 2] ربط عُقد الرسمة المتفرعة (كل عقدة
      // بتفلتر بمجموعة حالاتها — بما فيها الحالة القديمة المدموجة لو
      // موجودة عبر legacyKeys) + ربط chips الحالات الاستثنائية.
      Object.keys(CHQ_FLOW_LANES).forEach(function (laneKey) {
        var lane = CHQ_FLOW_LANES[laneKey];
        lane.nodes.forEach(function (n) {
          var statuses = _chqStatusesForNode(n);
          var nodeEl = document.getElementById(
            "chq-flow-node-" + laneKey + "-" + n.key,
          );
          if (!nodeEl) return;
          nodeEl.addEventListener("click", function () {
            _activeFilter = laneKey;
            document.querySelectorAll(".chq-filter-btn").forEach(function (b) {
              b.classList.toggle("active", b.dataset.filter === laneKey);
            });
            window._chqQuickFilter(
              null,
              statuses,
              lane.title + " — " + n.label,
            );
          });
          nodeEl.addEventListener("dblclick", function () {
            var last = _chqLatestInStage(statuses);
            if (last) _openChequeModal(last.id);
            else NotificationEngine.info("لا توجد عمليات في هذه العقدة");
          });
          nodeEl.addEventListener("contextmenu", function (e) {
            _openChqCtxMenu(e, n.key, laneKey, n);
          });
        });
        lane.extraStatuses.forEach(function (statusKey) {
          var chipEl = document.getElementById(
            "chq-flow-extra-" + laneKey + "-" + statusKey,
          );
          if (!chipEl) return;
          var chipLabel =
            (
              CHQ_WORKFLOW_STAGES.find(function (s) {
                return s.key === statusKey;
              }) || {}
            ).label || statusKey;
          chipEl.addEventListener("click", function () {
            _activeFilter = laneKey;
            document.querySelectorAll(".chq-filter-btn").forEach(function (b) {
              b.classList.toggle("active", b.dataset.filter === laneKey);
            });
            window._chqQuickFilter(
              null,
              statusKey,
              lane.title + " — " + chipLabel,
            );
          });
          chipEl.addEventListener("dblclick", function () {
            var last = _chqLatestInStage(statusKey);
            if (last) _openChequeModal(last.id);
            else NotificationEngine.info("لا توجد عمليات بهذه الحالة");
          });
          chipEl.addEventListener("contextmenu", function (e) {
            _openChqCtxMenu(e, statusKey, laneKey, { key: statusKey });
          });
        });
      });

      // إعادة رسم الخطوط الموصّلة لو حجم النافذة اتغيّر (الشبكة بتاخد
      // عرض متجاوب فبيتغير موضع العُقد فعلياً على الشاشة).
      window.addEventListener("resize", function () {
        Object.keys(CHQ_FLOW_LANES).forEach(function (laneKey) {
          _chqDrawFlowConnectors(laneKey, CHQ_FLOW_LANES[laneKey]);
        });
      });

      var _searchInput = document.getElementById("chq-search-input");
      if (_searchInput) {
        _searchInput.addEventListener("input", function () {
          _searchQuery = _searchInput.value || "";
          _renderRows();
        });
      }

      _renderWorkflow();
      _renderKpis();
      _renderTimeline();

      // الاستماع للنقر يُضاف مرة واحدة بس على tbody (خارج _renderRows)
      // عشان مايتكررش مع كل إعادة رسم/فلترة.
      var _tbody = document.getElementById("chq-table-body");
      if (_tbody) {
        _tbody.addEventListener("click", function (e) {
          var row = e.target.closest("tr[data-id]");
          if (
            row &&
            (canDo("updateCheque") ||
              canDo("changeChequeStatus") ||
              canDo("viewCheques"))
          )
            _openChequeModal(row.dataset.id);
        });
      }

      // [BANKING-DASHBOARD] لو جاي فلتر type من لوحة تحكم البنوك، فعّل
      // زر الفلتر المطابق بصرياً بدل ما يفضل زر "الكل" هو الشكل الفعّال.
      if (_dashPreset && _dashPreset.type) {
        document.querySelectorAll(".chq-filter-btn").forEach(function (b) {
          b.classList.toggle("active", b.dataset.filter === _activeFilter);
        });
      }

      _renderPartyChip();
      _renderStatusChip();
      _renderRows();

      document.querySelectorAll(".chq-filter-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".chq-filter-btn").forEach(function (b) {
            b.classList.remove("active");
          });
          btn.classList.add("active");
          _activeFilter = btn.dataset.filter;
          // اختيار فلتر يدوي من المستخدم يلغي أي فلتر حالة جاي من لوحة التحكم
          if (_presetStatus) {
            _presetStatus = null;
            _renderStatusChip();
          }
          _renderRows();
          _renderWorkflow();
        });
      });

      var addBtn = document.getElementById("chq-btn-add");
      if (addBtn)
        addBtn.addEventListener("click", function () {
          _openChequeModal(null);
        });
    });
  }

  function _openChequeModal(id) {
    var cheques = APP.data.cheques || [];
    var cheque = id
      ? cheques.find(function (c) {
          return String(c.id) === String(id);
        })
      : null;
    // دفاتر/عمليات الشيكات تخص الحسابات البنكية العادية فقط
    var bankAccounts = (APP.data.bankAccounts || []).filter(function (a) {
      return !a.account_kind || a.account_kind === "BANK";
    });
    var banks = APP.data.banks || [];
    var chequeBooks = (APP.data.chequeBooks || []).filter(function (b) {
      return b.status === "ACTIVE" && Number(b.remaining_count) > 0;
    });
    // [P5] جداول العملاء/الموردين — للبحث وربط party_id بدل النص الحر
    var chqCustomers = APP.data.customers || [];
    var chqSuppliers = APP.data.suppliers || [];
    var type = cheque ? cheque.type : "INCOMING";
    // [CHQ-WORKFLOW-V2 — التبديل النهائي] نفس isLocked في editCheque بالضبط —
    // type-aware (RECEIVED/DRAFTED) بدل PENDING بس.
    var isLocked = cheque && !_chqIsInitialStatus(type, cheque.status);

    var bankAccOpts = bankAccounts
      .map(function (a) {
        return (
          '<option value="' +
          esc(a.id) +
          '"' +
          (cheque && String(cheque.bank_account_id) === String(a.id)
            ? " selected"
            : "") +
          ">" +
          esc(a.name + (a.bank_name ? " — " + a.bank_name : "")) +
          "</option>"
        );
      })

      onReady: function () {
        var typeSelect = document.getElementById("chq-type");

        var partyTypeSelect = document.getElementById("chq-party-type");

        var partyIdHidden = document.getElementById("chq-party-id");
        var partyDatalist = document.getElementById("chq-party-datalist");

        // [P5] تحديث قائمة الاقتراحات (datalist) حسب نوع الطرف المختار،
        // وتفريغ party_id المخزّن لو الاسم اتغيّر يدوياً عن آخر اختيار متطابق
        // (نفس فلسفة P5-C FIX المطبّقة على سندات القبض/الصرف).
        function _partyListForType() {
          if (!partyTypeSelect) return [];
          if (partyTypeSelect.value === "CUSTOMER") return chqCustomers;
          if (partyTypeSelect.value === "SUPPLIER") return chqSuppliers;
          return [];
        }
        function _refreshPartyDatalist() {
          if (!partyDatalist) return;
          var list = _partyListForType();
          partyDatalist.innerHTML = list
            .map(function (p) {
              return '<option value="' + esc(p.name) + '">';
            })
            .join("");
        }
        function _resolvePartyIdFromInput() {
          if (!partyIdHidden) return;
          var list = _partyListForType();
          var typed = String((partyNameInput || {}).value || "")
            .trim()
            .toLowerCase();
          var match = list.find(function (p) {
            return (
              String(p.name || "")
                .trim()
                .toLowerCase() === typed
            );
          });
          partyIdHidden.value = match ? match.id : "";
        }
        if (partyTypeSelect) {
          partyTypeSelect.addEventListener("change", function () {
            _refreshPartyDatalist();
            _resolvePartyIdFromInput();
          });
        }
        if (partyNameInput) {
          partyNameInput.addEventListener("input", _resolvePartyIdFromInput);
        }
        _refreshPartyDatalist();
        // [P5] منعمدش نعيد مطابقة party_id لحظة الفتح — لو الشيك موجود
        // بالفعل ومرتبط بطرف، نسيبه زي ما هو حتى لو الاسم اختلف شوية عن
        // نسخة جدول العملاء/الموردين الحالية. المطابقة بتحصل بس لما
        // المستخدم يغيّر النوع أو يعدّل الاسم فعلياً.

        function _toggleTypeFields() {

            .querySelectorAll(".chq-outgoing-only")

            .querySelectorAll(".chq-incoming-only")

        function _toggleBookFields() {

          var bankAccField = document.getElementById("chq-bank-account");
          var numberField = document.getElementById("chq-number");
          var useBook = !!bookSelect.value;
          if (bankAccField) bankAccField.disabled = useBook || !!cheque;
          if (numberField) numberField.readOnly = useBook || !!cheque;
          if (useBook && numberField) numberField.value = "(يتولد تلقائياً)";
        }
        if (typeSelect)
          typeSelect.addEventListener("change", _toggleTypeFields);
        if (bookSelect)
          bookSelect.addEventListener("change", _toggleBookFields);

        document
          .getElementById("save-chq-btn")

            var t = (document.getElementById("chq-type") || {}).value;
            var partyName = (document.getElementById("chq-party-name") || {})

            var amount = (document.getElementById("chq-amount") || {}).value;
            var dueDate = (document.getElementById("chq-due-date") || {}).value;

              return NotificationEngine.error("اسم الطرف مطلوب");
            if (!amount || Number(amount) <= 0)
              return NotificationEngine.error("قيمة الشيك مطلوبة");
            if (!dueDate) return NotificationEngine.error("تاريخ الاستحقاق مطلوب");

            // [P5] تأكيد ربط party_id قبل الإرسال (لو الاسم بيطابق سجل
            // موجود فعلاً في جدول العملاء/الموردين حسب النوع المختار).
            _resolvePartyIdFromInput();

                (document.getElementById("chq-issue-date") || {}).value || "",
              due_date: dueDate,
              notes: (document.getElementById("chq-notes") || {}).value || "",
              callerUser: APP.currentUser.username,
              sessionToken: SESSION.token,

              var bookId = (document.getElementById("chq-book") || {}).value;
              if (t === "OUTGOING" && bookId) {
                payload.cheque_book_id = bookId;
              } else {
                payload.bank_account_id = (
                  document.getElementById("chq-bank-account") || {}
                ).value;
                payload.cheque_number = (
                  document.getElementById("chq-number") || {}
                ).value;
                if (t === "OUTGOING" && !payload.bank_account_id)
                  return NotificationEngine.error("يجب اختيار الحساب البنكي أو دفتر شيكات");
                if (!payload.cheque_number)
                  return NotificationEngine.error("رقم الشيك مطلوب");
              }
              if (t === "INCOMING")
                payload.bank_id =
                  (document.getElementById("chq-bank") || {}).value || "";
            } else {
              payload.bank_id =
                (document.getElementById("chq-bank") || {}).value || "";
            }

            var fn = cheque ? "updateCheque" : "addCheque";
            var args = cheque ? [cheque.id, payload] : payload;
            _gsr(fn, args, {
              label: "Accounting." + fn,
              onSuccess: function (r) {
                NotificationEngine.success(r.message);
                closeStyledDrawer();
                _reloadExtAndRender("cheques");
              },
              onError: function (r) {
                NotificationEngine.error(r.message || "خطأ");
              },
            });
          });
      },
      footer:

          : "") +
        '<button class="btn btn-outline" onclick="closeStyledDrawer()">إغلاق</button>' +
        (!cheque || !isLocked
          ? '<button class="btn btn-primary" id="save-chq-btn"><i class="ti ' +

            "</button>"
          : ""),
    });
    if (cheque) {
      setTimeout(function () {

  // ── Phase 4: أزرار إجراءات دورة الحياة المتاحة حسب الحالة الحالية ──
  function _renderChequeLifecycleActions(cheque) {
    var box = document.getElementById("chq-lifecycle-box");
    var wrap = document.getElementById("chq-lifecycle-actions");
    if (!box || !wrap) return;
    var nextStatuses = _chqTransitionsFor(cheque.type)[cheque.status] || [];
    if (!nextStatuses.length || !canDo("changeChequeStatus")) {
      box.style.display = "none";
      return;
    }
    box.style.display = "block";
    wrap.innerHTML = nextStatuses
      .map(function (st) {
        var meta = _CHQ_ACTION_META[st] || {
          label: st,
          icon: "ti-arrow-right",
          cls: "btn-outline",
        };
        return (
          '<button type="button" class="btn ' +
          meta.cls +
          ' chq-lifecycle-btn" data-status="' +
          st +
          '" style="font-size:12.5px;padding:7px 12px"><i class="ti ' +
          meta.icon +
          '"></i> ' +
          esc(meta.label) +
          "</button>"
        );
      })
      .join("");
    wrap.querySelectorAll(".chq-lifecycle-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        _openChequeLifecycleDrawer(cheque, btn.dataset.status);
      });
    });
  }

  // ── Phase 4: درج مخصص لتنفيذ إجراء دورة حياة (تحصيل/ارتداد/إلغاء/إعادة إيداع/استبدال) ──
  function _openChequeLifecycleDrawer(cheque, newStatus) {
    var meta = _CHQ_ACTION_META[newStatus] || {
      label: newStatus,
      icon: "ti-arrow-right",
      iconColor: "#2563eb",
    };
    var isReplace = newStatus === "REPLACED";
    var chequeBooks = (APP.data.chequeBooks || []).filter(function (b) {
      return b.status === "ACTIVE" && Number(b.remaining_count) > 0;
    });
    // دفاتر/عمليات الشيكات تخص الحسابات البنكية العادية فقط
    var bankAccounts = (APP.data.bankAccounts || []).filter(function (a) {
      return !a.account_kind || a.account_kind === "BANK";
    });
    var banks = APP.data.banks || [];

    var reasonLabel =
      newStatus === "BOUNCED"
        ? "سبب الارتداد"
        : newStatus === "CANCELLED"
          ? "سبب الإلغاء"
          : "ملاحظات (اختياري)";

    var replacementFields = "";
    if (isReplace) {
      var bookOpts = chequeBooks
        .map(function (b) {
          return (
            '<option value="' +
            esc(b.id) +
            '">' +
            esc(
              (b.bank_account_name || "") +
                " — " +
                b.code +
                " (متبقي " +
                b.remaining_count +

        .join("");

        .map(function (a) {

            '<option value="' + esc(a.id) + '">' + esc(a.name) + "</option>"
          );
        })
        .join("");
      var bankOpts = banks
        .map(function (b) {
          return (
            '<option value="' + esc(b.id) + '">' + esc(b.name) + "</option>"
          );

        .join("");

          : '<div class="field full"><label>رقم الشيك البديل <span style="color:var(--danger)">*</span></label>' +
            '<input class="input" id="chq-repl-number" dir="ltr"></div>' +
            '<div class="field full"><label>البنك المُصدر</label>' +
            '<select class="input" id="chq-repl-bank"><option value="">— غير محدد —</option>' +
            bankOpts +
            "</select></div>");
    }

    openStyledDrawer({
      title: meta.label + " — شيك " + (cheque.cheque_number || ""),

        '<div class="modal-body"><div class="form-grid">' +
        '<div class="field full" style="font-size:12.5px;color:var(--text2)">' +
        esc(cheque.party_name || "") +
        " — " +
        formatMoney(Number(cheque.amount || 0), {
          decimals: 0,
          withSymbol: false,

        " " +
        esc(cheque.currency || "EGP") +
        "</div>" +

        '<div class="field full"><label>' +
        reasonLabel +
        "</label>" +
        '<textarea class="input" id="chq-lifecycle-reason" rows="2"></textarea></div>' +

        '<button class="btn ' +
        meta.cls +
        '" id="confirm-chq-lifecycle-btn"><i class="ti ' +
        meta.icon +
        '"></i> ' +
        esc(meta.label) +
        "</button>",
      onReady: function () {
        var backBtn = document.getElementById("chq-lifecycle-back-btn");
        if (backBtn)
          backBtn.addEventListener("click", function () {
            _openChequeModal(cheque.id);

          .getElementById("confirm-chq-lifecycle-btn")
          .addEventListener("click", function () {

                  document.getElementById("chq-repl-number") || {}

                  (document.getElementById("chq-repl-bank") || {}).value || "";

                label: "Accounting.changeChequeStatus",
                onSuccess: function (r) {
                  NotificationEngine.success(r.message);
                  closeStyledDrawer();
                  _reloadExtAndRender("cheques");

                onError: function (r) {
                  NotificationEngine.error(r.message || "خطأ");
                },
              });
            };

            showConfirm({
              title: meta.label,
              message:
                "هل أنت متأكد من تنفيذ هذا الإجراء؟ لا يمكن التراجع عنه.",
              confirmText: meta.label,
              confirmClass:
                newStatus === "BOUNCED" ||
                newStatus === "CANCELLED" ||
                newStatus === "RETURNED" ||
                newStatus === "RETURNED_OUT"
                  ? "btn-danger"
                  : "btn-primary",
              onConfirm: doSubmit,
            });
          });
      },
    });
  }

  // ── Phase 4: تحميل وعرض سجل العمليات (Timeline) لشيك معيّن من AuditLog ──
  function _loadChequeTimeline(chequeId) {
    var box = document.getElementById("chq-timeline");
    if (!box) return;
    _gsr(
      "getChequeTimeline",
      [chequeId, APP.currentUser.username, SESSION.token],
      {
        label: "Accounting.getChequeTimeline",
        onSuccess: function (r) {
          if (!box || !document.body.contains(box)) return; // الدرج اتقفل قبل ما الرد يوصل
          var entries = r.data || [];
          if (!entries.length) {
            box.innerHTML =
              '<div style="color:var(--text3)">لا يوجد سجل عمليات بعد</div>';
            return;
          }
          box.innerHTML =
            '<div style="display:flex;flex-direction:column;gap:8px">' +
            entries
              .map(function (e) {
                var d = e.timestamp ? e.timestamp : null;
                // [DATE-UNIFY] بدل toLocaleString("en-US", {dateStyle,timeStyle})
                // المُجاوِز لتفضيل date_format، نستخدم fmtDateTime المركزية
                // التي تحترم date_format/time_format للمستخدم.
                var dateStr = d ? fmtDateTime(d) : "";
                return (
                  '<div style="border-right:3px solid var(--border);padding-right:10px">' +
                  '<div style="display:flex;justify-content:space-between;gap:8px">' +
                  '<b style="color:var(--text)">' +
                  esc(e.user || "") +
                  "</b>" +
                  '<span style="color:var(--text3);font-size:11px">' +
                  esc(dateStr) +
                  "</span></div>" +
                  "<div>" +
                  esc(e.details || e.action || "") +
                  "</div></div>"
                );
              })
              .join("") +
            "</div>";
        },
        onError: function () {
          if (box)
            box.innerHTML =
              '<div style="color:var(--text3)">تعذّر تحميل السجل</div>';
        },
      },
    );
  }

          },

    });
  }

  // ─────────────────────────────────────────────────────────────
  // §E  bindJournalEntries — القيود اليومية
  // ─────────────────────────────────────────────────────────────
  function bindJournalEntries() {
    ensureExtendedData(function () {
      var _STATUS_LABELS = {
        DRAFT: "مسودة",
        POSTED: "معتمد",
        CANCELLED: "ملغي",
      };
      var _STATUS_COLORS = {
        DRAFT: "#F59E0B",
        POSTED: "#10B981",
        CANCELLED: "#EF4444",
      };

      function _buildJERows(list) {
        if (!list.length)
          return "<tr><td colspan='7' style='text-align:center;padding:24px;color:var(--text3)'>لا توجد قيود بعد</td></tr>";
        return list
          .map(function (e) {
            var sc = _STATUS_COLORS[e.status] || "var(--text3)";
            var sl = _STATUS_LABELS[e.status] || e.status || "—";
            return (
              "<tr data-row data-id='" +
              esc(e.id || "") +
              "' data-name='" +
              esc(e.ref || e.id || "") +
              "'>" +
              "<td data-col='ref'><code>" +
              esc(e.ref || e.id || "") +
              "</code></td>" +
              "<td data-col='date'>" +
              _fmtDate(e.date) +
              "</td>" +
              "<td data-col='description'>" +
              esc(e.description || "") +
              "</td>" +
              "<td style='direction:ltr;text-align:center'>" +
              formatMoney(parseFloat(e.total_debit) || 0, {
                decimals: 0,
                withSymbol: false,
              }) +
              "</td>" +
              "<td style='direction:ltr;text-align:center'>" +
              formatMoney(parseFloat(e.total_credit) || 0, {
                decimals: 0,
                withSymbol: false,
              }) +
              "</td>" +
              "<td><span style='background:" +
              sc +
              "22;color:" +
              sc +
              ";padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600'>" +
              sl +
              "</span></td>" +
              "<td></td>" +
              "</tr>"
            );
          })
          .join("");
      }

      var tbody = document.getElementById("je-table-body");
      var entries = APP.data.journalEntries || [];
      if (tbody) {
        tbody.innerHTML = _buildJERows(entries);
        // [CTX-REFACTOR] كليك عادي يفتح التفاصيل — كليك يمين يفتح القائمة
        tbody.addEventListener("click", function (e) {
          var row = e.target.closest("tr[data-id]");
          if (row) _viewJournalEntry(row.dataset.id);
        });
        if (window.CTX) CTX.register(tbody, "journal");
      }

      // ── Date Range Picker bind ──────────────────────────────
      (function () {
        var fromEl = document.getElementById("je-filter-from");
        var toEl = document.getElementById("je-filter-to");
        var infoEl = document.getElementById("je-drp-info");
        var clearBtn = document.getElementById("je-drp-clear");
        var triggerBtn = document.getElementById("je-drp-trigger");
        var triggerLabel = document.getElementById("je-drp-trigger-label");
        var popoverEl = document.getElementById("je-drp-popover");
        var statusEl = document.getElementById("je-filter-status");

        if (!fromEl || !toEl) return;

        // popover open/close
        function _onOutsideClick(e) {
          if (!popoverEl || !triggerBtn) return;
          if (popoverEl.contains(e.target) || triggerBtn.contains(e.target))
            return;
          _closePopover();
        }
        function _onEscKey(e) {
          if (e.key === "Escape") _closePopover();
        }
        function _openPopover() {
          if (!popoverEl || !triggerBtn) return;
          popoverEl.classList.add("je-drp-show");
          triggerBtn.classList.add("je-drp-open");
          document.addEventListener("mousedown", _onOutsideClick);
          document.addEventListener("keydown", _onEscKey);
        }
        function _closePopover() {
          if (!popoverEl || !triggerBtn) return;
          popoverEl.classList.remove("je-drp-show");
          triggerBtn.classList.remove("je-drp-open");
          document.removeEventListener("mousedown", _onOutsideClick);
          document.removeEventListener("keydown", _onEscKey);
        }
        if (triggerBtn) {
          triggerBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (popoverEl && popoverEl.classList.contains("je-drp-show"))
              _closePopover();
            else _openPopover();
          });
        }
        function _setTriggerLabel(text, hasFilter) {
          if (triggerLabel) triggerLabel.textContent = text;
          if (triggerBtn)
            triggerBtn.classList.toggle("je-drp-has-filter", !!hasFilter);
        }

        // helpers
        // [DATE-UNIFY 2026-07-22] كانت هذه الدوال بتعيد بناء yyyy-mm-dd يدويًا
        // (تكرار لنفس المنطق الموجود في DateEngine) — بدّلناها لتفويض
        // الحساب والتحويل بالكامل لـ DateEngine كمصدر واحد.
        function _today() {
          return DateEngine.toISO(DateEngine.today());
        }
        function _daysAgo(n) {
          return DateEngine.toISO(DateEngine.addDays(DateEngine.today(), -n));
        }
        function _monthStart() {
          var d = DateEngine.today();
          return DateEngine.toISO(new Date(d.getFullYear(), d.getMonth(), 1));
        }
        function _monthsAgo(n) {
          return DateEngine.toISO(
            DateEngine.addMonths(DateEngine.today(), -n),
          );
        }
        function _yearStart() {
          return DateEngine.toISO(
            new Date(DateEngine.today().getFullYear(), 0, 1),
          );
        }

        // [DATE-UNIFY 2026-07-22] كانت هذه الدالة تبني dd/mm/yyyy يدويًا
        // بغض النظر عن تفضيل date_format الفعلي — بدّلناها لتفويض التنسيق
        // بالكامل لـ fmtDate() (المصدر الرسمي الوحيد)، عشان نص "من ... إلى"
        // في فلتر القيود يحترم تفضيل المستخدم مثل باقي الشاشة.
        function _toISO(ddmmyyyy) {
          if (!ddmmyyyy || ddmmyyyy.length < 10) return "";
          var p = ddmmyyyy.split("/");
          return p.length === 3 ? p[2] + "-" + p[1] + "-" + p[0] : "";
        }
        function _fromISO(iso) {
          if (!iso) return "";
          return typeof fmtDate === "function" ? fmtDate(iso) : iso;
        }

        function _updateInfo() {
          if (!infoEl) return;
          var f = _fromISO(fromEl.value),
            t = _fromISO(toEl.value);
          if (!f && !t) {
            infoEl.textContent = "لم يتم اختيار نطاق بعد";
            return;
          }
          if (f && t) {
            infoEl.textContent = "من " + f + " إلى " + t;
          } else if (f) {
            infoEl.textContent = "من " + f;
          } else {
            infoEl.textContent = "حتى " + t;
          }
        }
        function _clearActive() {
          document.querySelectorAll(".je-drp-qb").forEach(function (b) {
            b.classList.remove("je-active");
          });
        }

        function _setRange(from, to) {
          fromEl.value = from || "";
          toEl.value = to || "";
          fromEl.classList.toggle("has-val", !!fromEl.value);
          toEl.classList.toggle("has-val", !!toEl.value);
          _updateInfo();
        }

        // [FIX-DATEPICKER] فتح الكالندر الأصلي عند الضغط على الحقل أو الأيقونة
        function _openNativePicker(el) {
          try {
            if (el.showPicker) el.showPicker();
          } catch (err) {}
        }
        [fromEl, toEl].forEach(function (el) {
          el.addEventListener("click", function () {
            _openNativePicker(el);
          });
          el.addEventListener("input", function () {
            el.classList.toggle("has-val", !!el.value);
            _updateInfo();
            _clearActive();
          });
        });

        // Quick ranges
        var RANGES = {
          all: [null, null],
          today: [_today(), _today()],
          "7days": [_daysAgo(6), _today()],
          month: [_monthStart(), _today()],
          "30days": [_daysAgo(29), _today()],
          "3months": [_monthsAgo(3), _today()],
          year: [_yearStart(), _today()],
        };

        document.querySelectorAll(".je-drp-qb").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var key = btn.dataset.jeRange;
            var r = RANGES[key];
            if (!r) return;
            _clearActive();
            btn.classList.add("je-active");
            _setRange(r[0], r[1]);
          });
        });

        function _applyFilters(opts) {
          opts = opts || {};
          var from = fromEl.value || "";
          var to = toEl.value || "";
          var status = statusEl ? statusEl.value : "";

          if (from && to && from > to) {
            toEl.style.borderColor = "#ef4444";
            setTimeout(function () {
              toEl.style.borderColor = "";
            }, 1500);
            NotificationEngine.error("تاريخ النهاية يجب أن يكون بعد البداية");
            return;
          }

          var all = APP.data.journalEntries || [];
          var filtered = all.filter(function (e) {
            var eDate = String(e.date || "").split("T")[0];
            if (from && eDate < from) return false;
            if (to && eDate > to) return false;
            if (status && e.status !== status) return false;
            return true;
          });
          if (tbody) tbody.innerHTML = _buildJERows(filtered);

          var activeBtn = document.querySelector(".je-drp-qb.je-active");
          var label = activeBtn
            ? activeBtn.textContent.trim()
            : from || to
              ? (_fromISO(from) || "—") + " — " + (_fromISO(to) || "—")
              : "كل الفترات";
          _setTriggerLabel(label, !!(from || to));
          if (opts.toast) NotificationEngine.success(opts.toast);
          if (opts.closePopover) _closePopover();
        }

        // Clear button
        if (clearBtn) {
          clearBtn.addEventListener("click", function () {
            _setRange(null, null);
            _clearActive();
            _setTriggerLabel("كل الفترات", false);
            _applyFilters({ closePopover: true });
            NotificationEngine.info("تم مسح الفلتر");
          });
        }

        // Apply (je-btn-filter)
        var filterBtn = document.getElementById("je-btn-filter");
        if (filterBtn) {
          filterBtn.addEventListener("click", function () {
            _applyFilters({ toast: "", closePopover: true });
            var activeBtn = document.querySelector(".je-drp-qb.je-active");
            var label = activeBtn
              ? activeBtn.textContent.trim()
              : "تم تطبيق الفلتر";
            NotificationEngine.success(label);
          });
        }

        // ── Custom Status Dropdown ──────────────────────────────
        (function () {
          var sfRoot = document.getElementById("je-sf-root");
          var sfTrigger = document.getElementById("je-sf-trigger");
          var sfMenu = document.getElementById("je-sf-menu");
          var sfLabel = document.getElementById("je-sf-label");
          if (!sfRoot || !sfTrigger || !sfMenu) return;

          function _closeSF() {
            sfMenu.classList.remove("je-sf-show");
            sfTrigger.classList.remove("je-sf-open");
          }
          function _openSF() {
            sfMenu.classList.add("je-sf-show");
            sfTrigger.classList.add("je-sf-open");
          }

          sfTrigger.addEventListener("click", function (e) {
            e.stopPropagation();
            sfMenu.classList.contains("je-sf-show") ? _closeSF() : _openSF();
          });

          sfMenu.addEventListener("click", function (e) {
            var item = e.target.closest(".je-sf-item");
            if (!item) return;
            var val = item.getAttribute("data-je-status");
            // update hidden input
            if (statusEl) statusEl.value = val;
            // update UI
            sfMenu.querySelectorAll(".je-sf-item").forEach(function (b) {
              b.classList.remove("je-sf-active");
            });
            item.classList.add("je-sf-active");
            sfLabel.textContent =
              item.querySelector(".je-sf-item-label").textContent;
            sfTrigger.classList.toggle("je-sf-has-filter", !!val);
            _closeSF();
            _applyFilters({});
          });

          document.addEventListener("click", function (e) {
            if (!sfRoot.contains(e.target)) _closeSF();
          });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") _closeSF();
          });
        })();

        _updateInfo();
      })();

      var addBtn = document.getElementById("je-btn-add");
      if (addBtn)
        addBtn.addEventListener("click", function () {
          _openJournalModal(null);
        });
    });
  }

  // ─────────────────────────────────────────────────────────────
  // [FEATURE-JE-MANUAL-ENTRY] فورم القيد اليومي اليدوي — إضافة/تعديل
  // ─────────────────────────────────────────────────────────────
  // الـ backend (addJournalEntry/updateJournalEntry/saveJournalEntry في
  // Code_04_Accounting_JournalEntries.js + Code_12g_SaveDispatchers.js)
  // وربط DataLayer (Accounting.saveJournalEntry) كانوا جاهزين بالفعل؛
  // الفورم الفعلي في الواجهة كان مفقوداً بالكامل (مجرد رسالة "قيد المطور").
  function _openJournalModal(id) {
    var entries = APP.data.journalEntries || [];
    var rec = id
      ? entries.find(function (e) {
          return String(e.id) === String(id);
        })
      : null;

    // قيد معتمد/ملغي لا يجوز تعديله مباشرة — الأداة الصحيحة هي "عكس القيد"
    // (ctx_reverseJournal) اللي بتنشئ قيد عكسي بدل تعديل قيد مُرحَّل فعلاً.
    if (rec && rec.status !== "DRAFT") {
      return NotificationEngine.warning(
        'لا يمكن تعديل قيد "' +
          (rec.status === "POSTED" ? "معتمد" : "ملغي") +
          '" — استخدم خيار "عكس القيد" من القائمة بدل التعديل المباشر',
      );
    }

    var allAccounts = APP.data.chartOfAccounts || [];
    // حسابات قابلة للترحيل فقط: غير محذوفة، نشطة، وليست حسابات تجميعية
    // (نفس الشرط اللي بيرفضه الـ backend في _validateJournalAccountLines —
    // بنستبعدها هنا مسبقاً بدل ما اليوزر يختارها ويرجع له خطأ من السيرفر).
    var postableAccounts = allAccounts
      .filter(function (a) {
        return (
          !a.deleted_at &&
          a.is_active !== false &&
          a.is_active !== "FALSE" &&
          !(
            a.is_parent === true ||
            a.is_parent === "TRUE" ||
            a.is_parent === "true"
          )
        );
      })
      .sort(function (a, b) {
        return String(a.code || "").localeCompare(String(b.code || ""));
      });
    var accountOptionsHtml = postableAccounts
      .map(function (a) {
        return (
          "<option value='" +
          esc(a.id) +
          "'>" +
          esc((a.code ? a.code + " — " : "") + (a.name || "")) +
          "</option>"
        );
      })
      .join("");

    var customers = APP.data.customers || [];
    var suppliers = APP.data.suppliers || [];

    var _jmSeq = 0;
    function _jmNewRow(l) {
      _jmSeq++;
      return {
        _rid: "jmr" + _jmSeq,
        account_id: (l && l.account_id) || "",
        debit: l ? Number(l.debit || 0) : 0,
        credit: l ? Number(l.credit || 0) : 0,
        party_type: (l && l.party_type) || "NONE",
        party_id: (l && l.party_id) || "",
        notes: (l && l.notes) || "",
      };
    }
    // بيانات السطور الحالية — تبدأ بسطرين فاضيين لقيد جديد، أو بمؤشر
    // تحميل لقيد موجود (لحد ما تفاصيله توصل من getJournalEntryLines).
    var _jmLines = rec ? [] : [_jmNewRow(), _jmNewRow()];
    var _jmLoadingLines = !!rec;

    function _jmPartyOptionsHtml(row) {
      var parties =
        row.party_type === "CUSTOMER"
          ? customers
          : row.party_type === "SUPPLIER"
            ? suppliers
            : [];
      return parties
        .map(function (p) {
          return (
            "<option value='" +
            esc(p.id) +
            "'" +
            (String(p.id) === String(row.party_id) ? " selected" : "") +
            ">" +
            esc(p.name) +
            "</option>"
          );
        })
        .join("");
    }

    function _jmRowHtml(row) {
      return (
        "<tr data-jm-row='" +
        row._rid +
        "'>" +
        "<td style='min-width:210px'><select class='input jm-f' data-f='account_id'>" +
        "<option value=''>— اختر حساب —</option>" +
        accountOptionsHtml.replace(
          "value='" + esc(row.account_id) + "'",
          "value='" + esc(row.account_id) + "' selected",
        ) +
        "</select></td>" +
        "<td style='min-width:100px'><input class='input jm-f' data-f='debit' type='number' min='0' step='0.01' placeholder='0.00' value='" +
        (row.debit ? row.debit : "") +
        "'></td>" +
        "<td style='min-width:100px'><input class='input jm-f' data-f='credit' type='number' min='0' step='0.01' placeholder='0.00' value='" +
        (row.credit ? row.credit : "") +
        "'></td>" +
        "<td style='min-width:100px'><select class='input jm-f jm-party-type' data-f='party_type'>" +
        "<option value='NONE'" +
        (row.party_type === "NONE" ? " selected" : "") +
        ">—</option>" +
        "<option value='CUSTOMER'" +
        (row.party_type === "CUSTOMER" ? " selected" : "") +
        ">عميل</option>" +
        "<option value='SUPPLIER'" +
        (row.party_type === "SUPPLIER" ? " selected" : "") +
        ">مورد</option>" +
        "</select></td>" +
        "<td style='min-width:140px'><select class='input jm-f jm-party' data-f='party_id'" +
        (row.party_type === "NONE" ? " disabled" : "") +
        "><option value=''>— اختر —</option>" +
        _jmPartyOptionsHtml(row) +
        "</select></td>" +
        "<td style='min-width:130px'><input class='input jm-f' data-f='notes' type='text' placeholder='ملاحظة (اختياري)' value='" +
        esc(row.notes) +
        "'></td>" +
        "<td style='width:36px;text-align:center'><button type='button' class='jm-remove-row' title='حذف السطر' style='background:transparent;border:none;cursor:pointer;padding:4px'><i class='ti ti-trash' style='color:var(--danger)'></i></button></td>" +
        "</tr>"
      );
    }

    function _jmTotals() {
      var td = 0,
        tc = 0;
      _jmLines.forEach(function (r) {
        td += Number(r.debit || 0);
        tc += Number(r.credit || 0);
      });
      return { debit: td, credit: tc };
    }

    function _jmRenderBody() {
      var tbody = document.getElementById("jm-lines-body");
      if (!tbody) return;
      if (_jmLoadingLines) {
        tbody.innerHTML =
          "<tr><td colspan='7' style='text-align:center;padding:20px;color:var(--text3)'>" +
          "<i class='ti ti-loader-2' style='animation:spin 0.8s linear infinite'></i> جاري تحميل سطور القيد...</td></tr>";
      } else if (!_jmLines.length) {
        tbody.innerHTML =
          "<tr><td colspan='7' style='text-align:center;padding:20px;color:var(--text3)'>لا توجد سطور — اضغط \"إضافة سطر\"</td></tr>";
      } else {
        tbody.innerHTML = _jmLines.map(_jmRowHtml).join("");
      }
      var totals = _jmTotals();
      var dEl = document.getElementById("jm-total-debit");
      var cEl = document.getElementById("jm-total-credit");
      var flagEl = document.getElementById("jm-balance-flag");
      if (dEl) dEl.textContent = totals.debit.toFixed(2);
      if (cEl) cEl.textContent = totals.credit.toFixed(2);
      if (flagEl) {
        var diff = Math.abs(totals.debit - totals.credit);
        if (diff > 0.001) {
          flagEl.innerHTML =
            "<span style='color:var(--danger)'><i class='ti ti-alert-triangle'></i> غير متوازن (فرق " +
            diff.toFixed(2) +
            ")</span>";
        } else if (totals.debit > 0) {
          flagEl.innerHTML =
            "<span style='color:var(--success)'><i class='ti ti-check'></i> متوازن</span>";
        } else {
          flagEl.innerHTML = "";
        }
      }
    }

    openStyledDrawer({
      title: rec ? "تعديل القيد اليومي" : "قيد يومية جديد",
      icon: "ti-book-2",
      color: "purple",
      width: 920,
      body:
        "<div class='modal-body' style='padding:20px'>" +
        "<div class='form-grid'>" +
        "<div class='field'><label>التاريخ *</label><input class='input' id='jm-date' type='date' value='" +
        esc(
          rec
            ? rec.date
            : typeof DateEngine !== "undefined"
              ? DateEngine.forPicker(new Date())
              : new Date().toISOString().split("T")[0],
        ) +
        "'></div>" +
        "<div class='field'><label>المرجع (اختياري)</label><input class='input' id='jm-ref' type='text' value='" +
        esc(rec ? rec.reference || rec.ref || "" : "") +
        "'></div>" +
        "<div class='field full'><label>الوصف</label><input class='input' id='jm-desc' type='text' placeholder='بيان القيد' value='" +
        esc(rec ? rec.description || "" : "") +
        "'></div>" +
        "</div>" +
        "<div style='margin-top:16px;overflow-x:auto'>" +
        "<table class='table' style='width:100%'>" +
        "<thead><tr><th>الحساب</th><th>مدين</th><th>دائن</th><th>نوع الطرف</th><th>الطرف</th><th>ملاحظة</th><th></th></tr></thead>" +
        "<tbody id='jm-lines-body'></tbody>" +
        "</table>" +
        "<button type='button' class='btn btn-outline' id='jm-add-row' style='margin-top:10px'><i class='ti ti-plus'></i> إضافة سطر</button>" +
        "</div>" +
        "<div id='jm-balance-flag' style='margin-top:10px;font-weight:600'></div>" +
        "<div style='margin-top:4px;display:flex;gap:20px;font-weight:600;color:var(--text2)'>" +
        "<span>إجمالي المدين: <span id='jm-total-debit' style='direction:ltr'>0.00</span></span>" +
        "<span>إجمالي الدائن: <span id='jm-total-credit' style='direction:ltr'>0.00</span></span>" +
        "</div>" +
        "<div class='field full' style='margin-top:14px'><label>ملاحظات عامة (اختياري)</label><textarea class='input' id='jm-notes' rows='2'>" +
        esc(rec ? rec.notes || "" : "") +
        "</textarea></div>" +
        "</div>",
      footer:
        '<button class="btn btn-outline" onclick="closeStyledDrawer()">' +
        I18N.t("BTN_CANCEL") +
        "</button>" +
        '<button class="btn btn-primary" id="jm-save-btn"><i class="ti ti-device-floppy"></i> حفظ كمسودة</button>',
      onReady: function (inner) {
        var tbody = inner.querySelector("#jm-lines-body");
        var addBtn = inner.querySelector("#jm-add-row");
        var saveBtn = inner.querySelector("#jm-save-btn");

        _jmRenderBody();

        if (rec) {
          _gsr("getJournalEntryLines", rec.id, {
            label: "Accounting.getJournalEntryLines",
            onSuccess: function (r) {
              var rows = (r && r.data) || [];
              _jmLoadingLines = false;
              _jmLines = rows.length
                ? rows.map(function (l) {
                    return _jmNewRow({
                      account_id: l.account_id,
                      debit: l.debit,
                      credit: l.credit,
                      party_type: l.party_type,
                      party_id: l.party_id,
                      notes: l.notes,
                    });
                  })
                : [_jmNewRow(), _jmNewRow()];
              _jmRenderBody();
            },
            onError: function () {
              _jmLoadingLines = false;
              _jmLines = [_jmNewRow(), _jmNewRow()];
              _jmRenderBody();
              NotificationEngine.error("تعذّر تحميل سطور القيد — ابدأ بسطور جديدة أو أعد المحاولة");
            },
          });
        }

        // تحديث بيانات سطر واحد من الـ DOM بدون إعادة رسم الجدول كله
        // (بيحافظ على تركيز المستخدم وهو بيكتب في الحقول)
        function _jmSyncRow(rid) {
          var tr = tbody.querySelector("tr[data-jm-row='" + rid + "']");
          if (!tr) return;
          var row = _jmLines.find(function (r) {
            return r._rid === rid;
          });
          if (!row) return;
          tr.querySelectorAll(".jm-f").forEach(function (el) {
            var f = el.dataset.f;
            if (f === "debit" || f === "credit") row[f] = parseFloat(el.value) || 0;
            else row[f] = el.value || "";
          });
        }

        tbody.addEventListener("input", function (e) {
          var tr = e.target.closest("tr[data-jm-row]");
          if (!tr) return;
          _jmSyncRow(tr.dataset.jmRow);
          if (e.target.dataset.f === "debit" || e.target.dataset.f === "credit") {
            var totals = _jmTotals();
            var dEl = document.getElementById("jm-total-debit");
            var cEl = document.getElementById("jm-total-credit");
            if (dEl) dEl.textContent = totals.debit.toFixed(2);
            if (cEl) cEl.textContent = totals.credit.toFixed(2);
            var flagEl = document.getElementById("jm-balance-flag");
            if (flagEl) {
              var diff = Math.abs(totals.debit - totals.credit);
              flagEl.innerHTML =
                diff > 0.001
                  ? "<span style='color:var(--danger)'><i class='ti ti-alert-triangle'></i> غير متوازن (فرق " +
                    diff.toFixed(2) +
                    ")</span>"
                  : totals.debit > 0
                    ? "<span style='color:var(--success)'><i class='ti ti-check'></i> متوازن</span>"
                    : "";
            }
          }
        });

        tbody.addEventListener("change", function (e) {
          var tr = e.target.closest("tr[data-jm-row]");
          if (!tr) return;
          _jmSyncRow(tr.dataset.jmRow);
          if (e.target.classList.contains("jm-party-type")) {
            // تغيير نوع الطرف → إعادة بناء قائمة الطرف نفسها + تفعيل/تعطيلها
            var row = _jmLines.find(function (r) {
              return r._rid === tr.dataset.jmRow;
            });
            row.party_id = "";
            var partySel = tr.querySelector(".jm-party");
            if (partySel) {
              partySel.disabled = row.party_type === "NONE";
              partySel.innerHTML =
                "<option value=''>— اختر —</option>" + _jmPartyOptionsHtml(row);
            }
          }
        });

        tbody.addEventListener("click", function (e) {
          var btn = e.target.closest(".jm-remove-row");
          if (!btn) return;
          var tr = btn.closest("tr[data-jm-row]");
          if (!tr) return;
          _jmLines = _jmLines.filter(function (r) {
            return r._rid !== tr.dataset.jmRow;
          });
          _jmRenderBody();
        });

        if (addBtn)
          addBtn.addEventListener("click", function () {
            _jmLines.push(_jmNewRow());
            _jmRenderBody();
          });

        if (saveBtn)
          saveBtn.addEventListener("click", function () {
            var dateVal = document.getElementById("jm-date").value;
            if (!dateVal) return NotificationEngine.error("التاريخ مطلوب");
            var linesPayload = _jmLines
              .filter(function (r) {
                return r.account_id && (Number(r.debit) > 0 || Number(r.credit) > 0);
              })
              .map(function (r) {
                return {
                  account_id: r.account_id,
                  debit: Number(r.debit) || 0,
                  credit: Number(r.credit) || 0,
                  party_type: r.party_type !== "NONE" ? r.party_type : "",
                  party_id: r.party_type !== "NONE" ? r.party_id : "",
                  notes: r.notes || "",
                };
              });
            if (linesPayload.length < 2)
              return NotificationEngine.error(
                "القيد يجب أن يحتوي على سطرين على الأقل، كل سطر بحساب ومبلغ",
              );
            var totals = _jmTotals();
            if (Math.abs(totals.debit - totals.credit) > 0.001)
              return NotificationEngine.error(
                "القيد غير متوازن — إجمالي المدين يجب أن يساوي إجمالي الدائن",
              );
            if (totals.debit <= 0)
              return NotificationEngine.error("لا يجوز حفظ قيد صفري");

            var payload = {
              date: dateVal,
              reference: document.getElementById("jm-ref").value || "",
              description: document.getElementById("jm-desc").value || "",
              notes: document.getElementById("jm-notes").value || "",
              lines: linesPayload,
              callerUser: APP.currentUser.username,
              sessionToken: SESSION.token,
            };
            if (rec) payload.id = rec.id;

            saveBtn.disabled = true;
            saveBtn.innerHTML = "<i class='ti ti-loader-2' style='animation:spin 0.8s linear infinite'></i> جاري الحفظ...";
            _gsr("saveJournalEntry", payload, {
              label: "Accounting.saveJournalEntry",
              onSuccess: function (r) {
                NotificationEngine.success(r.message || "تم حفظ القيد بنجاح");
                closeStyledDrawer();
                _reloadExtAndRender("journal-entries");
              },
              onError: function (r) {
                saveBtn.disabled = false;
                saveBtn.innerHTML = "<i class='ti ti-device-floppy'></i> حفظ كمسودة";
                NotificationEngine.error(r.message || "فشل حفظ القيد");
              },
            });
          });
      },
    });
  }

  function _viewJournalEntry(id) {
    var entries = APP.data.journalEntries || [];
    var entry = entries.find(function (e) {
      return String(e.id) === String(id);
    });
    if (!entry) return NotificationEngine.error("القيد غير موجود");
    var accounts = APP.data.chartOfAccounts || [];
    function _accLabel(accId) {
      var a = accounts.find(function (x) {
        return x.id === accId;
      });
      return a ? (a.code ? a.code + " — " : "") + a.name : accId || "—";
    }
    var _STATUS_LABELS_V = { DRAFT: "مسودة", POSTED: "معتمد", CANCELLED: "ملغي" };

    // [FEATURE-JE-MANUAL-ENTRY] عرض التفاصيل بقى بيشمل سطور القيد الفعلية
    // (كانت الشاشة قبل كده بتعرض الإجماليات بس بدون تفاصيل الحسابات)،
    // مع زر "تعديل" لو القيد لسه مسودة.
    openStyledDrawer({
      title: "تفاصيل القيد — " + (entry.ref || entry.id),
      icon: "ti-book-2",
      color: "purple",
      width: 780,
      body:
        "<div class='modal-body' style='padding:20px'>" +
        "<div class='form-grid'>" +
        "<div class='field'><label>التاريخ</label><div>" + _fmtDate(entry.date) + "</div></div>" +
        "<div class='field'><label>الحالة</label><div>" +
        (_STATUS_LABELS_V[entry.status] || entry.status || "—") +
        "</div></div>" +
        "<div class='field full'><label>الوصف</label><div>" + esc(entry.description || "—") + "</div></div>" +
        "</div>" +
        "<div style='margin-top:16px;overflow-x:auto'>" +
        "<table class='table' style='width:100%'>" +
        "<thead><tr><th>الحساب</th><th>مدين</th><th>دائن</th><th>ملاحظة</th></tr></thead>" +
        "<tbody id='jv-lines-body'><tr><td colspan='4' style='text-align:center;padding:16px;color:var(--text3)'>" +
        "<i class='ti ti-loader-2' style='animation:spin 0.8s linear infinite'></i> جاري تحميل السطور...</td></tr></tbody>" +
        "<tfoot><tr style='font-weight:700'><td>الإجمالي</td>" +
        "<td style='direction:ltr'>" + formatMoney(parseFloat(entry.total_debit) || 0, { decimals: 0, withSymbol: false }) + "</td>" +
        "<td style='direction:ltr'>" + formatMoney(parseFloat(entry.total_credit) || 0, { decimals: 0, withSymbol: false }) + "</td>" +
        "<td></td></tr></tfoot>" +
        "</table></div>" +
        "</div>",
      footer:
        (entry.status === "DRAFT"
          ? '<button class="btn btn-primary" onclick="closeStyledDrawer();_openJournalModal(\'' +
            entry.id +
            "')\"><i class='ti ti-edit'></i> تعديل القيد</button>"
          : "") +
        '<button class="btn btn-outline" onclick="closeStyledDrawer()">إغلاق</button>',
      onReady: function () {
        _gsr("getJournalEntryLines", entry.id, {
          label: "Accounting.getJournalEntryLines",
          onSuccess: function (r) {
            var rows = (r && r.data) || [];
            var tbody = document.getElementById("jv-lines-body");

              ? rows

                      "<tr><td>" +
