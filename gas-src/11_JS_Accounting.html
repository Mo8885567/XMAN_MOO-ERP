  // ─────────────────────────────────────────────────────────────────────────
  // §H2  bindBalanceSheet — الميزانية العمومية (شجرة تفاعلية قابلة للطي)
  // ─────────────────────────────────────────────────────────────────────────

  /**
   * _bsFmt — تنسيق الأرقام المالية بالعملة المحلية (جنيه / ريال / إلخ)
   */
  var _bsLastData = null; // [PRINT-BUG-FIX] آخر بيانات ميزانية محمّلة — يستخدمها زر الطباعة
  function _bsFmt(n) {
    var num = Number(n || 0);
    return formatMoney(num, { decimals: 0, withSymbol: false });
  }

  /**
   * _bsBuildTree — يبني شجرة هرمية من مصفوحة حسابات مسطّحة (نفس منطق _coaBuildForest)
   * الإضافة: يحسب الرصيد التراكمي لكل مجموعة تلقائياً من أبنائها
   */
  function _bsBuildTree(items) {
    // items: [{id, code, name, balance}, ...]
    var byId = {};
    items.forEach(function (a) {
      byId[String(a.id || a.code)] = a;
    });

    var childMap = {};
    items.forEach(function (a) {
      var pid =
        a.parent_id != null && a.parent_id !== "" ? String(a.parent_id) : "";
      if (pid && byId[pid]) {
        if (!childMap[pid]) childMap[pid] = [];
        childMap[pid].push(a);
      }
    });

    function buildNode(a) {
      var kids = (childMap[String(a.id || a.code)] || []).map(buildNode);
      // الرصيد التراكمي للمجموعة = مجموع أبنائها إن لم يكن لها رصيد مباشر
      var bal = Number(a.balance || 0);
      if (kids.length && bal === 0) {
        bal = kids.reduce(function (s, k) {
          return s + k.totalBalance;
        }, 0);
      }
      return { acc: a, children: kids, totalBalance: bal };
    }

    return items
      .filter(function (a) {
        var pid =
          a.parent_id != null && a.parent_id !== "" ? String(a.parent_id) : "";
        return !pid || !byId[pid];
      })
      .map(buildNode);
  }

  /**
   * [PRINT-BUG-FIX] يحوّل شجرة حسابات (نفس مخرجات _bsBuildTree) لصفوف
   * مسطّحة (اسم مُزاح حسب المستوى / كود / رصيد) جاهزة لمحرك الطباعة
   * الموحّد — بدل الاعتماد على طباعة العناصر القابلة للطي كما هي.
   */
  function _bsFlattenForPrint(nodes, depth, out, rowClasses) {
    (nodes || []).forEach(function (n) {
      var a = n.acc;
      var indent = new Array((depth || 0) + 1).join("    "); // إزاحة بصرية بالمسافات
      out.push([
        indent + (a.code ? a.code + " — " : "") + (a.name || ""),
        n.children.length ? "" : a.code || "",
        _bsFmt(n.totalBalance),
      ]);
      rowClasses.push(n.children.length ? "total" : undefined);
      if (n.children.length)
        _bsFlattenForPrint(n.children, (depth || 0) + 1, out, rowClasses);
    });
  }

  /**
   * _bsRenderNodes — يرسم عقد الشجرة بشكل تكراري
   * depth يتحكم في الـ padding الداخلي
   */
  function _bsRenderNodes(nodes, depth) {
    var html = "";
    var indent = (depth || 0) * 20;

    nodes.forEach(function (n) {
      var a = n.acc;
      var bal = n.totalBalance;
      var balFmt = _bsFmt(bal);
      var isNeg = bal < 0;

      if (n.children.length) {
        // ── صف مجموعة قابلة للطي ──
        var gid = "bs-grp-" + esc(String(a.id || a.code));
        html +=
          "<div class='bs-grp-row' data-bs-toggle='" +
          gid +
          "' style='padding-right:" +
          (16 + indent) +
          "px'>" +
          "<i class='ti ti-folder' style='opacity:.5;font-size:14px'></i>" +
          "<span style='flex:1'>" +
          esc(a.code ? a.code + " — " : "") +
          esc(a.name || "") +
          "</span>" +
          "<span class='bs-grp-total sensitive-balance" +
          (isNeg ? " bs-neg" : "") +
          "'>" +
          balFmt +
          "</span>" +
          "<i class='ti ti-chevron-down bs-grp-toggle'></i>" +
          "</div>" +
          "<div class='bs-grp-body' id='" +
          gid +
          "'>" +
          _bsRenderNodes(n.children, (depth || 0) + 1) +
          "</div>";
      } else {
        // ── صف حساب ورقي (Leaf) ──
        html +=
          "<div class='bs-leaf-row' style='padding-right:" +
          (16 + indent) +
          "px'>" +
          "<span class='bs-leaf-dot'></span>" +
          "<span class='bs-leaf-code'>" +
          esc(a.code || "") +
          "</span>" +
          "<span class='bs-leaf-name'>" +
          esc(a.name || "") +
          "</span>" +
          "<span class='bs-leaf-balance sensitive-balance" +
          (isNeg ? " bs-neg" : "") +
          "'>" +
          balFmt +
          "</span>" +
          "</div>";
      }
    });
    return html;
  }

  /**
   * _bsRenderSection — يبني قسماً كاملاً (أصول / خصوم / ملكية) بهيدر ملوّن وشجرة داخلية
   */
  function _bsRenderSection(sectionClass, icon, label, items, total) {
    var forest = _bsBuildTree(items);
    var sid = "bs-sec-" + sectionClass;
    var isNeg = total < 0;

    var html =
      "<div class='bs-section " +
      sectionClass +
      "'>" +
      "<div class='bs-section-head' data-bs-sec='" +
      sid +
      "'>" +
      "<i class='ti " +
      icon +
      "' style='font-size:18px'></i>" +
      "<span>" +
      label +
      "</span>" +
      "<span class='bs-section-total sensitive-balance" +
      (isNeg ? " bs-neg" : "") +
      "'>" +
      _bsFmt(total) +
      "</span>" +
      "<i class='ti ti-chevron-down bs-section-toggle'></i>" +
      "</div>" +
      "<div class='bs-section-body' id='" +
      sid +
      "'>" +
      (forest.length
        ? _bsRenderNodes(forest, 0)
        : "<div style='padding:16px;color:var(--text3);font-size:13px'>لا توجد حسابات</div>") +
      "</div>" +
      "</div>";
    return html;
  }

  /**
   * _bsRender — يرسم كامل الميزانية العمومية في #bs-results
   * d = { assets:{items,total}, liabilities:{items,total}, equity:{items,total}, total_liabilities_equity, as_of_date }
   */
  function _bsRender(d) {
    _bsLastData = d; // [PRINT-BUG-FIX] نحتفظ بآخر بيانات محمّلة عشان زر الطباعة يقدر يبنى منها تقرير كامل بدل طباعة الشاشة كما هي
    var totalAssets = d.assets.total || 0;
    var totalLiab = d.liabilities.total || 0;
    var totalEquity = d.equity.total || 0;
    var totalLE = d.total_liabilities_equity || totalLiab + totalEquity;
    var balanced = Math.abs(totalAssets - totalLE) < 0.01;

    // ── تحديث بطاقات الملخص ──
    var sumCards = document.getElementById("bs-summary-cards");
    if (sumCards) {
      sumCards.style.display = "grid";
      var el;
      el = document.getElementById("bs-total-assets");
      if (el) el.textContent = _bsFmt(totalAssets);
      el = document.getElementById("bs-total-liabilities");
      if (el) el.textContent = _bsFmt(totalLiab);
      el = document.getElementById("bs-total-equity");
      if (el) el.textContent = _bsFmt(totalEquity);
    }

    // ── مؤشر التوازن ──
    var ind = document.getElementById("bs-balance-indicator");
    if (ind) {
      ind.style.display = "";
      if (balanced) {
        ind.innerHTML =
          "<div class='bs-balance-ok'><i class='ti ti-circle-check'></i> الميزانية متوازنة — الأصول تساوي الخصوم + حقوق الملكية</div>";
      } else {
        var diff = Math.abs(totalAssets - totalLE);
        ind.innerHTML =
          "<div class='bs-balance-err'><i class='ti ti-alert-triangle'></i> تحذير: الميزانية غير متوازنة — الفارق " +
          _bsFmt(diff) +
          "</div>";
      }
    }

    // ── أزرار التوسيع / الطي / الطباعة ──
    ["bs-btn-expand-all", "bs-btn-collapse-all", "bs-btn-print"].forEach(
      function (id) {
        var b = document.getElementById(id);
        if (b) b.style.display = "";
      },
    );

    // ── بناء HTML الشجرة ──
    var html = "";
    html += _bsRenderSection(
      "bs-section-assets",
      "ti-building-bank",
      "الأصول",
      d.assets.items,
      totalAssets,
    );
    html += _bsRenderSection(
      "bs-section-liabs",
      "ti-credit-card",
      "الخصوم",
      d.liabilities.items,
      totalLiab,
    );
    html += _bsRenderSection(
      "bs-section-equity",
      "ti-chart-pie",
      "حقوق الملكية",
      d.equity.items,
      totalEquity,
    );

    // ── صف الإجمالي الكلي ──
    html +=
      "<div class='bs-grand-total'>" +
      "<span>إجمالي الخصوم + حقوق الملكية</span>" +
      "<span class='bs-grand-amount'>" +
      _bsFmt(totalLE) +
      "</span>" +
      "</div>";

    var container = document.getElementById("bs-results");
    if (container) container.innerHTML = html;

    // ── ربط أحداث الطي والتوسيع ──
    _bsBindToggle(container);
  }

  /**
   * _bsBindToggle — يربط click على هيدرات الأقسام والمجموعات
   */
  function _bsBindToggle(container) {
    if (!container) return;

    // أقسام رئيسية
    container.querySelectorAll("[data-bs-sec]").forEach(function (head) {
      head.addEventListener("click", function () {
        var body = document.getElementById(head.dataset.bsSec);
        var arrow = head.querySelector(".bs-section-toggle");
        if (!body) return;
        body.classList.toggle("bs-collapsed");
        if (arrow)
          arrow.style.transform = body.classList.contains("bs-collapsed")
            ? "rotate(-90deg)"
            : "";
      });
    });

    // مجموعات فرعية (تفويض)
    container.addEventListener("click", function (e) {
      var grpRow = e.target.closest("[data-bs-toggle]");
      if (!grpRow) return;
      var body = document.getElementById(grpRow.dataset.bsToggle);
      var arrow = grpRow.querySelector(".bs-grp-toggle");
      if (!body) return;
      body.classList.toggle("bs-collapsed");
      if (arrow)
        arrow.style.transform = body.classList.contains("bs-collapsed")
          ? "rotate(-90deg)"
          : "";
    });
  }

  function bindBalanceSheet() {
    ensureExtendedData(function () {
      var btnLoad = document.getElementById("bs-btn-load");
      var btnExpandAll = document.getElementById("bs-btn-expand-all");
      var btnCollapseAll = document.getElementById("bs-btn-collapse-all");
      var btnPrint = document.getElementById("bs-btn-print");

      // ── زر عرض الميزانية ──
      if (btnLoad) {
        btnLoad.addEventListener("click", function () {
          var date =
            document.getElementById("bs-date") &&
            document.getElementById("bs-date").value;
          if (!date) return NotificationEngine.warning("اختر تاريخاً أولاً");

          btnLoad.disabled = true;
          btnLoad.innerHTML =
            "<div class='spinner' style='width:16px;height:16px'></div>";

          var resultsEl = document.getElementById("bs-results");
          if (resultsEl)
            resultsEl.innerHTML =
              "<div style='padding:48px;text-align:center'><div class='spinner'></div><p style='margin-top:12px;color:var(--text3)'>جاري تحميل الميزانية...</p></div>";

          _gsr(
            "getBalanceSheet",
            [date, APP.currentUser.username, SESSION.token],
            {
              label: "Accounting.getBalanceSheet",
              onSuccess: function (r) {
                btnLoad.disabled = false;
                btnLoad.innerHTML =
                  "<i class='ti ti-search'></i> عرض الميزانية";
                if (r.data) _bsRender(r.data);
              },
              onError: function (r) {
                btnLoad.disabled = false;
                btnLoad.innerHTML =
                  "<i class='ti ti-search'></i> عرض الميزانية";
                NotificationEngine.error(r.message || "فشل تحميل الميزانية");
              },
            },
          );
        });
      }

      // ── توسيع الكل ──
      if (btnExpandAll) {
        btnExpandAll.addEventListener("click", function () {
          document
            .querySelectorAll(".bs-section-body, .bs-grp-body")
            .forEach(function (b) {
              b.classList.remove("bs-collapsed");
            });
          document
            .querySelectorAll(".bs-section-toggle, .bs-grp-toggle")
            .forEach(function (a) {
              a.style.transform = "";
            });
        });
      }

      // ── طي الكل ──
      if (btnCollapseAll) {
        btnCollapseAll.addEventListener("click", function () {
          document.querySelectorAll(".bs-grp-body").forEach(function (b) {
            b.classList.add("bs-collapsed");
          });
          document.querySelectorAll(".bs-grp-toggle").forEach(function (a) {
            a.style.transform = "rotate(-90deg)";
          });
        });
      }

      // ── طباعة ──
      // [PRINT-BUG-FIX] كانت window.print() بتطبع الشجرة كما هي على
      // الشاشة (بما فيها أي أقسام مطوية/غير ظاهرة). الحل: نسطّح الشجرة
      // كاملة (كل الحسابات، مطوية أو لا) ونطبعها عبر المحرك الموحّد.
      if (btnPrint) {
        btnPrint.addEventListener("click", function () {
          if (!_bsLastData) {
            return NotificationEngine.warning("اعرض الميزانية أولاً قبل الطباعة");
          }
          var d = _bsLastData;
          var headers = ["الحساب", "الكود", "الرصيد"];
          var data = [];
          var rowClasses = [];
          function addSection(label, items, total) {
            data.push([label, "", _bsFmt(total)]);
            rowClasses.push("section");
            _bsFlattenForPrint(_bsBuildTree(items), 0, data, rowClasses);
          }
          addSection("الأصول", d.assets.items, d.assets.total || 0);
          addSection("الخصوم", d.liabilities.items, d.liabilities.total || 0);
          addSection("حقوق الملكية", d.equity.items, d.equity.total || 0);
          data.push([
            "إجمالي الخصوم + حقوق الملكية",
            "",
            _bsFmt(
              d.total_liabilities_equity ||
                (d.liabilities.total || 0) + (d.equity.total || 0),
            ),
          ]);
          rowClasses.push("total");
          ExportUtil.toPrint(data, headers, "الميزانية العمومية", "كما في: " + _fmtDate(d.as_of_date), {
            rowClasses: rowClasses,
          });
        });
      }
    });
  }

  // ─────────────────────────────────────────────────────────────────────────
  // §H3  bindCashFlowStatement — قائمة التدفقات النقدية
  // ─────────────────────────────────────────────────────────────────────────
  var _cfLastData = null; // [PRINT-BUG-FIX] آخر بيانات تدفق نقدي محمّلة — يستخدمها زر الطباعة
  window._cfPrint = function () {
    if (!_cfLastData)
      return NotificationEngine.warning("اعرض قائمة التدفقات أولاً قبل الطباعة");
    var d = _cfLastData.d;
    var headers = ["البند", "الكود", "المبلغ"];
    var data = [];
    var rowClasses = [];
    function addSection(label, items, net) {
      data.push([label, "", formatMoney(net || 0, { decimals: 0 })]);
      rowClasses.push("section");
      (items || []).forEach(function (item) {
        data.push([
          item.name || "",
          item.code || "",
          formatMoney(Number(item.amount || 0), { decimals: 0 }),
        ]);
        rowClasses.push(undefined);
      });
    }
    addSection("أنشطة التشغيل", d.operating, d.operating_net);
    addSection("أنشطة الاستثمار", d.investing, d.investing_net);
    addSection("أنشطة التمويل", d.financing, d.financing_net);
    data.push(["صافي التدفق النقدي", "", formatMoney(Math.abs(d.total_net || 0), { decimals: 0 })]);
    rowClasses.push("total");
    ExportUtil.toPrint(data, headers, "قائمة التدفقات النقدية", _cfLastData.period, {
      rowClasses: rowClasses,
    });
  };

  function bindCashFlowStatement() {
    ensureExtendedData(function () {
      var btn = document.getElementById("cf-btn-load");
      var btnPrint = document.getElementById("cf-btn-print");
      if (!btn) return;

      btn.addEventListener("click", function () {
        var from =
          document.getElementById("cf-from-date") &&
          document.getElementById("cf-from-date").value;
        var to =
          document.getElementById("cf-to-date") &&
          document.getElementById("cf-to-date").value;
        btn.disabled = true;
        var el = document.getElementById("cf-results");
        if (el)
          el.innerHTML =
            "<div style='padding:40px;text-align:center'><div class='spinner'></div></div>";
        _gsr(
          "getCashFlowStatement",
          [from, to, APP.currentUser.username, SESSION.token],
          {
            label: "Accounting.getCashFlowStatement",
            onSuccess: function (r) {
              btn.disabled = false;
              el = document.getElementById("cf-results");
              if (!el || !r.data) return;
              var d = r.data;
              if (btnPrint) btnPrint.style.display = "inline-flex";
              // [PRINT-BUG-FIX] نخزّن البيانات لاستخدامها في الطباعة الموحّدة
              _cfLastData = { d: d, period: "من " + (from || "—") + " إلى " + (to || "—") };

              var fmt = function (n) {
                var num = Number(n || 0);
                var color =
                  num >= 0 ? "var(--success,#22c55e)" : "var(--danger,#ef4444)";
                return (
                  "<b style='color:" +
                  color +
                  "'>" +
                  formatMoney(num, { decimals: 0 }) +
                  "</b>"
                );
              };

              var renderSection = function (title, icon, color, items, net) {
                var h = "<div style='margin-bottom:20px'>";
                h +=
                  "<div style='display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid " +
                  color +
                  ";margin-bottom:4px'>";
                h +=
                  "<span style='font-weight:700;font-size:14px;color:" +
                  color +
                  "'><i class='ti " +
                  icon +
                  "' style='margin-left:6px'></i>" +
                  title +
                  "</span>";
                h += fmt(net) + "</div>";
                if (items && items.length > 0) {
                  items.forEach(function (item) {
                    h +=
                      "<div style='display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)'>";
                    h +=
                      "<span>" +
                      esc(item.name || "") +
                      "<span style='color:var(--text3);margin-right:6px;font-size:11px'>" +
                      esc(item.code || "") +
                      "</span></span>";
                    h +=
                      "<span style='color:" +
                      (Number(item.amount) >= 0
                        ? "var(--success,#22c55e)"
                        : "var(--danger,#ef4444)") +
                      "'>" +
                      formatMoney(Number(item.amount || 0), { decimals: 0 }) +
                      "</span>";
                    h += "</div>";
                  });
                } else {
                  h +=
                    "<div style='padding:8px 12px;color:var(--text3);font-size:13px'>لا توجد حركات</div>";
                }
                h += "</div>";
                return h;
              };

              var html = "<div style='padding:16px'>";
              html +=
                "<div style='display:flex;justify-content:flex-end;margin-bottom:16px'>";
              html +=
                "<button class='btn btn-ghost' onclick='window._cfPrint()'><i class='ti ti-printer'></i> طباعة</button>";
              html += "</div>";

              html += renderSection(
                "أنشطة التشغيل",
                "ti-settings",
                "#0891B2",
                d.operating || [],
                d.operating_net || 0,
              );
              html += renderSection(
                "أنشطة الاستثمار",
                "ti-building-factory",
                "#7C3AED",
                d.investing || [],
                d.investing_net || 0,
              );
              html += renderSection(
                "أنشطة التمويل",
                "ti-coins",
                "#D97706",
                d.financing || [],
                d.financing_net || 0,
              );

              // صافي التدفق
              var total = d.total_net || 0;
              html +=
                "<div style='display:flex;justify-content:space-between;align-items:center;padding:16px;background:" +
                (total >= 0 ? "#D1FAE522" : "#FEE2E222") +
                ";border-radius:10px;border:1px solid " +
                (total >= 0
                  ? "var(--success,#22c55e)"
                  : "var(--danger,#ef4444)") +
                ";margin-top:8px'>";
              html +=
                "<span style='font-size:17px;font-weight:700'>صافي التدفق النقدي</span>";
              html +=
                "<b style='color:" +
                (total >= 0
                  ? "var(--success,#22c55e)"
                  : "var(--danger,#ef4444)") +
                ";font-size:20px;font-weight:800'>" +
                formatMoney(Math.abs(total), { decimals: 0 }) +
                "</b>";
              html += "</div>";
              html += "</div>";

              el.innerHTML = html;
            },
            onError: function (r) {
              btn.disabled = false;
              NotificationEngine.error(r.message || "فشل");
            },
          },
        );
      });

      if (btnPrint) {
        btnPrint.addEventListener("click", window._cfPrint);
      }
    });
  }

  function bindAccountStatement() {
    ensureExtendedData(function () {
      var btn = document.getElementById("stmt-btn-load");
      var sel = document.getElementById("stmt-account-select");

      if (sel) {
        var accounts = APP.data.chartOfAccounts || [];
        sel.innerHTML =
          "<option value=''>— اختر الحساب —</option>" +
          accounts
            .map(function (a) {
              return (
                "<option value='" +
                esc(a.id) +
                "'>" +
                esc(a.name + " (" + a.code + ")") +
                "</option>"
              );
            })
            .join("");
      }

      if (btn)
        btn.addEventListener("click", function () {
          if (!sel || !sel.value) return NotificationEngine.warning("اختر الحساب");
          btn.disabled = true;
          var resultDiv = document.getElementById("stmt-results");
          if (resultDiv)
            resultDiv.innerHTML =
              "<div style='padding:40px;text-align:center'><div class='spinner'></div></div>";
          _gsr(
            "getAccountStatement",
            [
              sel.value,
              document.getElementById("stmt-from-date") &&
                document.getElementById("stmt-from-date").value,
              document.getElementById("stmt-to-date") &&
                document.getElementById("stmt-to-date").value,
              APP.currentUser.username,
              SESSION.token,
            ],
            {
              label: "Accounting.getAccountStatement",
              onSuccess: function (r) {
                btn.disabled = false;
                // [COLUMN-ENGINE] نفس باج getGeneralLedger القديم (كان بيتم
                // إصلاحه هناك فقط) — getAccountStatement بترجع كائن واحد
                // {account, opening_balance, entries, closing_balance} مش
                // مصفوفة حركات مباشرة.
                var acc = r.data || null;
                var entries = acc ? acc.entries : [];
                if (resultDiv) {
                  if (!entries || !entries.length) {
                    resultDiv.innerHTML =
                      "<div style='padding:40px;text-align:center;color:var(--text3)'>لا توجد حركات في هذه الفترة</div>";
                  } else {
                    _renderLedgerTable(
                      resultDiv,
                      entries,
                      acc ? acc.opening_balance : 0,
                      "account_statement",
                    );
                  }
                }
              },
              onError: function (r) {
                btn.disabled = false;
                NotificationEngine.error(r.message || "فشل");
              },
            },
          );
        });
    });
  }

  // ─────────────────────────────────────────────────────────────
  // §P  bindFloatingEvents — أحداث المساعد الذكي العائم
  //     (يُستدعى من 09_AIAssistant بعد إنشاء العنصر في DOM)
  // ─────────────────────────────────────────────────────────────
  function bindFloatingEvents() {
    if (typeof _bindFloatingEvents === "function") {
      _bindFloatingEvents();
    }
  }
</script>
