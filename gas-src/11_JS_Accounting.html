<script>
  // ═══════════════════════════════════════════════════════════════════
  // 11_JS_Accounting.html — وحدات المحاسبة والموارد البشرية والمبيعات
  //
  // هذا الملف يحتوي على دوال bind* لجميع شاشات:
  //   • المحاسبة (Accounting)
  //   • الموارد البشرية (HR)
  //   • فواتير البيع / الشراء / المرتجعات
  //   • فودافون كاش
  //   • Production Stages
  //
  // نمط عمل كل bind*:
  //   1. استدعاء ensureExtendedData لضمان تحميل البيانات
  //   2. ربط أحداث الشاشة (بحث، فلتر، حفظ، تعديل، حذف)
  //   3. استدعاء reloadAfterMutation بعد أي تعديل
  // ═══════════════════════════════════════════════════════════════════

  // ─────────────────────────────────────────────────────────────
  // § Shared Helpers — مساعدات مشتركة
  // ─────────────────────────────────────────────────────────────

  // [REFACTOR-P2] _fmtDate اتنقلت لـ Core_Utilities.html (Global، بنفس الاسم والمنطق)

  /**
   * _jeDateMask — mask لحقول فلتر التاريخ (yyyy/mm/dd)
   * بيضيف "/" تلقائياً بعد السنة والشهر
   */
  window._jeDateMask = function (input) {
    var v = input.value.replace(/[^\d]/g, "");
    if (v.length > 4) v = v.slice(0, 4) + "/" + v.slice(4);
    if (v.length > 7) v = v.slice(0, 7) + "/" + v.slice(7);
    input.value = v.slice(0, 10);
  };

  /**
   * _jeParseDate — يحول yyyy/mm/dd إلى yyyy-mm-dd للمقارنة
   */
  function _jeParseDate(str) {
    if (!str || str.length < 10) return "";
    return str.replace(/\//g, "-");
  }

  // ─────────────────────────────────────────────────────────────
  // [DATA-LAYER] نمط الاستدعاء الموصى به لأي كود جديد في هذا الملف:
  //
  //   DL.Accounting.saveJournalEntry(payload, {
  //     onSuccess: function(r) { showToast(r.message, "success"); ... },
  //     onError:   function(r) { showToast(r.message, "error"); }
  //   });
  //
  // [DATA-UNIFY] هذا الملف بقى خالياً 100% من google.script.run المباشر —
  // كل النداءات بتمر عبر _gsr()/DL.* الموحدة في 00_JS_DataLayer.html.
  // قبل إضافة أي استدعاء جديد: أضف method في DL.Accounting (00_JS_DataLayer.html)
  // لو الفنكشن هتتنادى من أكتر من مكان، وإلا استخدم _gsr() مباشرة لو نداء واحد.
  // ─────────────────────────────────────────────────────────────

  /** يربط حدث input للبحث داخل جدول */
  function _bindTableSearch(inputId, tableBodyId, colsToSearch) {
    var inp = document.getElementById(inputId);
    var tbody = document.getElementById(tableBodyId);
    if (!inp || !tbody) return;
    inp.addEventListener("input", function () {
      var q = this.value.toLowerCase().trim();
      var rows = tbody.querySelectorAll("tr[data-row]");
      rows.forEach(function (row) {
        var text = "";
        colsToSearch.forEach(function (col) {
          var el = row.querySelector("[data-col='" + col + "']");
          if (el) text += " " + el.textContent.toLowerCase();
        });
        row.style.display = q === "" || text.includes(q) ? "" : "none";
      });
    });
  }

  /** يربط زر إعادة التحميل بشاشات المحاسبة */
  function _bindRefreshBtn(btnId) {
    var btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener("click", function () {
      APP.extLoaded = false;
      try {
        sessionStorage.removeItem("wms_ext_cache");
      } catch (e) {}
      renderPage(APP.currentPage);
    });
  }

  /**
   * [DATA-UNIFY] _reloadExtAndRender(page)
   * النمط الموحّد لإعادة التحميل بعد أي mutation في شاشات المحاسبة / HR.
   *
   * المشكلة القديمة:
   *   reloadAfterMutationFull() كانت تستدعي getAllDataFresh() التي لا تشمل
   *   البيانات الموسّعة (Extended: chartOfAccounts, employees, cashBoxes...).
   *   النتيجة: بعد الحفظ تُمسح بيانات المحاسبة/HR من APP.data وتظهر الشاشة فارغة.
   *
   * الحل:
   *   1. مسح كاش Extended (sessionStorage + APP.extLoaded)
   *   2. reloadAfterMutationFull لتحديث البيانات الأساسية (items/stock/...)
   *   3. داخل الـ callback: ensureExtendedData(forceRefresh=true) لإعادة تحميل
   *      بيانات المحاسبة/HR ثم renderPage — نفس نمط باقي السيستم.
   *
   * @param {string} page - اسم الصفحة المراد عرضها بعد التحديث
   */
  function _reloadExtAndRender(page) {
    APP.extLoaded = false;
    APP.extLoading = false;
    try {
      sessionStorage.removeItem("wms_ext_cache_v1");
      sessionStorage.removeItem("wms_ext_cache");
    } catch (e) {}
    reloadAfterMutationFull(function () {
      ensureExtendedData(function () {
        renderPage(page);
      }, true);
    });
  }

  /**
   * [FIX] _reloadCashBoxesFromServer
   * بتمسح الكاش الـ Extended كاملاً وتجيب البيانات من السيرفر مباشرة
   * ثم تنفّذ الـ callback — تُستخدم بعد إضافة/تعديل/حذف الخزائن
   *
   * [DATA-UNIFY-2] كانت دي نسخة رابعة مستقلة بتنادي google.script.run.getAllDataExtended
   * بمنطقها الخاص (منفصلة عن الثلاث نسخ في 01_JS_Core_Auth.html) — دلوقتي
   * بقت مجرد استدعاء لـ refreshExtendedData الموحّدة (Core_Auth) اللي
   * بتمر حصرياً عبر _gsr/DL.Core.getAllDataExtended.
   */
  function _reloadCashBoxesFromServer(cb) {
    refreshExtendedData(function () {
      if (cb) cb();
    });
  }

  // ─────────────────────────────────────────────────────────────
  // §A  bindAccountingDashboard — لوحة المحاسبة (Phase 3 — Dashboard Framework)
  // ─────────────────────────────────────────────────────────────
  // [PHASE-3] renderAccountingDashboard() (Templates.html) بقى بيحسب ويرسم
  // كل حاجة (KPIs/Charts/Widgets) مباشرة من APP.data باستخدام DashboardWidgets،
  // فمفيش داعي هنا لأي DOM-filling يدوي زي قبل كده. الدالة دي بقت مسؤولة بس
  // عن تسجيل الزيارة لـ NavigationService (لظهورها في "زُرت مؤخرًا") — باقي
  // الـ wiring (روابط الإجراءات السريعة والقوائم) جاهز جوه الـ HTML نفسه
  // (onclick="navigate(...)" مولّدة من الـ widgets مباشرة).
  function bindAccountingDashboard() {
    ensureExtendedData(function () {
      if (typeof NavigationService !== "undefined") {
        NavigationService.trackVisit("accounting-dashboard", {
          label: "المحاسبة",
          icon: '<i class="ti ti-calculator"></i>',
        });
      }
    });
  }

  /** onRefresh لهيدر لوحة المحاسبة — نفس نمط _bindRefreshBtn بس كنداء مباشر */
  function refreshAccountingDashboard() {
    APP.extLoaded = false;
    try {
      sessionStorage.removeItem("wms_ext_cache");
    } catch (e) {}
    if (typeof DashboardService !== "undefined")
      DashboardService.invalidateByPrefix("accounting");
    renderPage(APP.currentPage);
  }

  /** onHelp لهيدر لوحة المحاسبة */
  function showAccountingDashboardHelp() {
    if (typeof showToast === "function") {
      NotificationEngine.info(
        "اضغط اسم القسم بالقائمة الجانبية للعودة لهذه اللوحة، والسهم بجانبه لفتح/قفل باقي شاشات المحاسبة."
      );
    }
  }

  /** onSearchFn لـ searchWidget بلوحة المحاسبة — بحث في دليل الحسابات */
  function accDashboardSearch(value) {
    var box = document.getElementById("ad-search-results");
    if (!box) return;
    var q = (value || "").trim();
    if (!q) {
      box.innerHTML = "";
      return;
    }
    var accs = (APP.data && APP.data.chartOfAccounts) || [];
    var qLower = q.toLowerCase();
    var matches = accs
      .filter(function (a) {
        return (
          (a.name && a.name.toLowerCase().indexOf(qLower) !== -1) ||
          (a.code && String(a.code).toLowerCase().indexOf(qLower) !== -1)
        );
      })
      .slice(0, 8);
    if (!matches.length) {
      box.innerHTML =
        "<div class='dw-list-item' style='cursor:default'><span class='dw-list-text'>لا توجد نتائج مطابقة</span></div>";
      return;
    }
    box.innerHTML = matches
      .map(function (a) {
        return (
          "<div class='dw-list-item' style='cursor:pointer' onclick=\"navigate('chart-of-accounts')\">" +
          "<span class='dw-list-icon'><i class='ti ti-list-tree'></i></span>" +
          "<div class='dw-list-text'><div class='dw-list-title'>" +
          esc(a.name || "") +
          "</div><div class='dw-list-subtitle'>كود: " +
          esc(a.code || "—") +
          "</div></div></div>"
        );
      })
      .join("");
  }

  // ─────────────────────────────────────────────────────────────
  // §A2  bindBankingDashboard — لوحة تحكم البنوك (Banking Module Phase 10)
  // ─────────────────────────────────────────────────────────────
  function bindBankingDashboard() {
    ensureExtendedData(function () {
      _bindRefreshBtn("bd-refresh-btn");

      document.querySelectorAll("[data-acc-nav]").forEach(function (el) {
        el.addEventListener("click", function () {
          navigate(this.dataset.accNav);
        });
      });

      var _bankAccs = APP.data.bankAccounts || [];
      var _cheques = (APP.data.cheques || []).filter(function (c) {
        return c.status !== "DELETED";
      });
      var _transfers = APP.data.transferVouchers || [];
      var _recons = APP.data.bankReconciliations || [];
      var todayStr = (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]);
      var soonStr = new Date(Date.now() + 7 * 86400000)
        .toISOString()
        .split("T")[0];
      var monthStr = todayStr.substring(0, 7);

      // ── بطاقات إحصائية ──
      var totalBalance = _bankAccs.reduce(function (s, a) {
        return s + (parseFloat(a.current_balance) || 0);
      }, 0);
      // [CHQ-WORKFLOW-V2 — التبديل النهائي] "الشيكات المعلّقة" (لأغراض تتبع
      // الاستحقاق: متأخرة/مستحقة قريباً) بقت تشمل أي شيك لسه في مرحلة ما قبل
      // التحصيل/الصرف النهائي — أي شيك RECEIVED/DRAFTED (الحالة الجديدة) أو
      // PENDING (إرث) — بدل PENDING الحرفية بس اللي كانت هتفضل ناقصة أي شيك
      // جديد اتعمل بعد تفعيل الحالات الجديدة.
      var pendingCheques = _cheques.filter(function (c) {
        return _chqIsInitialStatus(c.type, c.status);
      });
      var overdueCheques = pendingCheques.filter(function (c) {
        return c.due_date && c.due_date < todayStr;
      });
      var dueSoonCheques = pendingCheques.filter(function (c) {
        return c.due_date && c.due_date >= todayStr && c.due_date <= soonStr;
      });
      var transfersThisMonth = _transfers.filter(function (t) {
        if (t.status !== "APPROVED") return false;
        var d = (t.approved_at || t.date || "").toString().split("T")[0];
        return d.substring(0, 7) === monthStr;
      });
      var reconsWithDiff = _recons.filter(function (r) {
        return (
          r.status === "COMPLETED" &&
          Math.abs(parseFloat(r.difference || 0)) >= 0.01
        );
      });

      var _set = function (id, val) {
        var el = document.getElementById(id);
        if (el) el.textContent = val;
      };
      _set(
        "bd-stat-total-balance",
        formatMoney(totalBalance, { decimals: 0, withSymbol: false }),
      );
      _set("bd-stat-pending-cheques", pendingCheques.length);
      _set("bd-stat-overdue-cheques", overdueCheques.length);
      _set("bd-stat-due-soon-cheques", dueSoonCheques.length);
      _set("bd-stat-transfers-month", transfersThisMonth.length);
      _set("bd-stat-recon-diff", reconsWithDiff.length);

      // ── حركة الأوراق الواردة/الصادرة — دورة حياة الأوراق المالية ──
      var _incoming = _cheques.filter(function (c) {
        return c.type === "INCOMING";
      });
      var _outgoing = _cheques.filter(function (c) {
        return c.type === "OUTGOING";
      });
      var _countBy = function (list, status) {
        return list.filter(function (c) {
          return (c.status || "PENDING") === status;
        }).length;
      };
      // [CHQ-WORKFLOW-V2 — التبديل النهائي] عدّاد "بانتظار التحصيل/الصرف" هنا
      // بقى type-aware (RECEIVED/DRAFTED + PENDING الإرث) بدل PENDING بس —
      // نفس منطق IN_PENDING_GROUP/OUT_PENDING_GROUP في bindCheques._renderKpis.
      var _countByAny = function (list, statuses) {
        return list.filter(function (c) {
          return statuses.indexOf(c.status || "PENDING") !== -1;
        }).length;
      };
      _set("bd-in-received", _incoming.length);
      _set("bd-in-pending", _countByAny(_incoming, ["RECEIVED", "PENDING"]));
      _set("bd-in-collected", _countByAny(_incoming, ["CASHED", "COLLECTED"]));
      _set("bd-in-bounced", _countBy(_incoming, "BOUNCED"));
      _set("bd-in-cancelled", _countBy(_incoming, "CANCELLED"));
      _set("bd-in-replaced", _countBy(_incoming, "REPLACED"));

      _set("bd-out-issued", _outgoing.length);
      _set("bd-out-pending", _countByAny(_outgoing, ["DRAFTED", "PENDING"]));
      _set("bd-out-collected", _countByAny(_outgoing, ["PAID", "COLLECTED"]));
      _set("bd-out-bounced", _countBy(_outgoing, "BOUNCED"));
      _set("bd-out-cancelled", _countBy(_outgoing, "CANCELLED"));
      _set("bd-out-replaced", _countBy(_outgoing, "REPLACED"));

      // ── الوصول السريع + البطاقات المصغّرة: فتح شاشة "الشيكات" بفلتر جاهز ──
      document.querySelectorAll("[data-chq-nav]").forEach(function (el) {
        el.addEventListener("click", function () {
          window._chqDashboardPreset = {
            type: this.dataset.type || null,
            status: this.dataset.status || null,
            label: this.dataset.label || "",
          };
          navigate("cheques");
        });
      });

      // ── جدول حالة الحسابات البنكية (آخر مطابقة معتمدة لكل حساب) ──
      var accountsTableEl = document.getElementById("bd-accounts-table");
      if (accountsTableEl) {
        if (!_bankAccs.length) {
          accountsTableEl.innerHTML =
            "<p style='color:var(--text3)'>لا توجد حسابات بنكية بعد</p>";
        } else {
          // آخر جلسة معتمدة لكل حساب (أحدث statement_date)
          var lastReconByAccount = {};
          _recons
            .filter(function (r) {
              return r.status === "COMPLETED";
            })
            .forEach(function (r) {
              var cur = lastReconByAccount[r.bank_account_id];
              if (
                !cur ||
                String(r.statement_date) > String(cur.statement_date)
              ) {
                lastReconByAccount[r.bank_account_id] = r;
              }
            });

          var rows = _bankAccs
            .map(function (a) {
              var lastRecon = lastReconByAccount[a.id];
              var reconBadge;
              if (!lastRecon) {
                reconBadge =
                  "<span style='color:var(--text3);font-size:12px'>لم تتم مطابقة بعد</span>";
              } else {
                var diff = parseFloat(lastRecon.difference || 0);
                var ok = Math.abs(diff) < 0.01;
                reconBadge =
                  "<span style='font-size:12px;color:" +
                  (ok ? "var(--success-dark)" : "var(--danger)") +
                  "'>" +
                  (ok ? "مطابقة (" : "فرق ") +
                  fmtDateInput(lastRecon.statement_date) +
                  (ok
                    ? ")"
                    : " — " +
                      formatMoney(diff, { decimals: 0, withSymbol: false })) +
                  "</span>";
              }
              return (
                "<tr>" +
                "<td>" +
                esc(a.name || a.code || "") +
                "</td><td style='text-align:center' class='sensitive-balance'>" +
                formatMoney(parseFloat(a.current_balance) || 0, {
                  decimals: 0,
                  withSymbol: false,
                }) +
                "</td><td>" +
                reconBadge +
                "</td></tr>"
              );
            })
            .join("");
          accountsTableEl.innerHTML =
            "<div class='table-wrap'><table class='table'><thead><tr>" +
            "<th>الحساب البنكي</th><th style='text-align:center'>الرصيد الحالي</th><th>آخر مطابقة معتمدة</th>" +
            "</tr></thead><tbody>" +
            rows +
            "</tbody></table></div>";
        }
      }

      // ── شيكات مستحقة قريباً (متأخرة + خلال 7 أيام)، الأقرب استحقاقاً أولاً ──
      var dueEl = document.getElementById("bd-due-cheques");
      if (dueEl) {
        var upcoming = overdueCheques
          .concat(dueSoonCheques)
          .sort(function (a, b) {
            return String(a.due_date).localeCompare(String(b.due_date));
          })
          .slice(0, 6);
        dueEl.innerHTML = !upcoming.length
          ? "<p style='color:var(--text3)'>لا توجد شيكات مستحقة قريباً</p>"
          : upcoming
              .map(function (c) {
                var overdue = c.due_date < todayStr;
                return (
                  "<div style='display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px'>" +
                  "<div><span style='font-weight:600'>" +
                  esc(c.cheque_number || "") +
                  "</span> — " +
                  esc(c.party_name || "") +
                  "<div style='font-size:11px;color:" +
                  (overdue ? "var(--danger)" : "var(--text3)") +
                  "'>" +
                  (overdue ? "متأخر — " : "") +
                  fmtDateInput(c.due_date) +
                  "</div></div>" +
                  "<b>" +
                  formatMoney(parseFloat(c.amount) || 0, {
                    decimals: 0,
                    withSymbol: false,
                  }) +
                  "</b></div>"
                );
              })
              .join("");
      }

      // ── آخر التحويلات البنكية المعتمدة ──
      var transfersEl = document.getElementById("bd-recent-transfers");
      if (transfersEl) {
        var lastTransfers = _transfers
          .filter(function (t) {
            return t.status === "APPROVED";
          })
          .sort(function (a, b) {
            return String(b.approved_at || b.date || "").localeCompare(
              String(a.approved_at || a.date || ""),
            );
          })
          .slice(0, 6);
        transfersEl.innerHTML = !lastTransfers.length
          ? "<p style='color:var(--text3)'>لا توجد تحويلات معتمدة بعد</p>"
          : lastTransfers
              .map(function (t) {
                return (
                  "<div style='display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px'>" +
                  "<div>" +
                  esc(t.from_name || "") +
                  " ← " +
                  esc(t.to_name || "") +
                  "<div style='font-size:11px;color:var(--text3)'>" +
                  fmtDateInput(t.date) +
                  "</div></div>" +
                  "<b>" +
                  formatMoney(parseFloat(t.amount) || 0, {
                    decimals: 0,
                    withSymbol: false,
                  }) +
                  "</b></div>"
                );
              })
              .join("");
      }
    });
  }

  /** يبني شجرة (forest) من حسابات نوع واحد بناءً على parent_id — بأي عدد مستويات */
  function _coaBuildForest(typeAccounts) {
    var byId = {};
    typeAccounts.forEach(function (a) {
      byId[String(a.id)] = a;
    });
    var childrenMap = {};
    typeAccounts.forEach(function (a) {
      var pid =
        a.parent_id != null && a.parent_id !== "" ? String(a.parent_id) : "";
      if (pid && byId[pid]) {
        if (!childrenMap[pid]) childrenMap[pid] = [];
        childrenMap[pid].push(a);
      }
    });
    function buildNode(a) {
      var kids = (childrenMap[String(a.id)] || []).map(buildNode);
      return { acc: a, children: kids };
    }
    return typeAccounts
      .filter(function (a) {
        var pid =
          a.parent_id != null && a.parent_id !== "" ? String(a.parent_id) : "";
        return !pid || !byId[pid];
      })
      .map(buildNode);
  }

  /** يفلتر شجرة بحسب نص بحث — يبقي أي فرع فيه تطابق، ويشيل الباقي */
  function _coaFilterTree(nodes, q) {
    var out = [];
    nodes.forEach(function (n) {
      var kids = _coaFilterTree(n.children, q);
      var a = n.acc;
      var selfMatch =
        (a.code && String(a.code).toLowerCase().indexOf(q) > -1) ||
        (a.name && String(a.name).toLowerCase().indexOf(q) > -1) ||
        (a.name_en && String(a.name_en).toLowerCase().indexOf(q) > -1);
      if (selfMatch || kids.length) out.push({ acc: a, children: kids });
    });
    return out;
  }

  function _coaActionBtns(a) {
    // [CTX-REFACTOR] الإجراءات انتقلت للـ ContextMenu (كليك يمين)
    return "";
  }

  /** يرسم عقد الشجرة بشكل تكراري — أي عمق */
  function _coaRenderNodes(nodes, depth, tc) {
    var html = "";
    var indent = depth * 22;
    var fmt = function (v) {
      return v
        ? formatMoney(Number(v), { decimals: 0, withSymbol: false })
        : "—";
    };
    nodes.forEach(function (n) {
      var a = n.acc;
      if (n.children.length) {
        // حساب إجمالي مدين/دائن المجموعة من الأبناء
        var grpDebit = 0,
          grpCredit = 0;
        (function sumChildren(children) {
          children.forEach(function (c) {
            grpDebit += Number(c.acc.total_debit || 0);
            grpCredit += Number(c.acc.total_credit || 0);
            if (c.children.length) sumChildren(c.children);
          });
        })(n.children);
        var isDebitNature = ["ASSET", "EXPENSE"].indexOf(a.type) !== -1;
        var opening = Number(a.opening_balance || 0);
        var grpBal = isDebitNature
          ? opening + grpDebit - grpCredit
          : opening - grpDebit + grpCredit;
        var gid = "coa-grp-" + esc(a.id);
        html +=
          "<div class='coa-row coa-grouprow' data-id='" +
          esc(a.id) +
          "' data-name='" +
          esc(a.name || "") +
          "' data-code='" +
          esc(a.code || "") +
          "' style='padding-right:" +
          (16 + indent) +
          "px'>" +
          "<button type='button' class='coa-toggle' data-toggle='" +
          gid +
          "' aria-label='طي/فتح المجموعة'><i class='ti ti-chevron-down'></i></button>" +
          "<span class='coa-code' style='color:" +
          tc.color +
          ";background:" +
          tc.bg +
          "'>" +
          esc(a.code || "") +
          "</span>" +
          "<span class='coa-name coa-name-strong'>" +
          esc(a.name || "") +
          "</span>" +
          "<span class='coa-sub-count'>" +
          n.children.length +
          " فرعي</span>" +
          "<span class='coa-col-debit coa-group-num'>" +
          (grpDebit ? fmt(grpDebit) : "—") +
          "</span>" +
          "<span class='coa-col-credit coa-group-num'>" +
          (grpCredit ? fmt(grpCredit) : "—") +
          "</span>" +
          "<span class='coa-col-balance coa-group-num sensitive-balance" +
          (grpBal < 0 ? " coa-balance-neg" : "") +
          "'>" +
          fmt(Math.abs(grpBal)) +
          "<span class='coa-bal-nature'>" +
          (grpBal >= 0
            ? isDebitNature
              ? "م"
              : "د"
            : isDebitNature
              ? "د"
              : "م") +
          "</span>" +
          "</span>" +
          _coaActionBtns(a) +
          "</div>";
        html +=
          "<div class='coa-grpbody' id='" +
          gid +
          "'>" +
          _coaRenderNodes(n.children, depth + 1, tc) +
          "</div>";
      } else {
        var bal = Number(a.current_balance || 0);
        var dr = Number(a.total_debit || 0);
        var cr = Number(a.total_credit || 0);
        var isDb = a.balance_nature === "DEBIT";
        var balLbl =
          bal === 0 ? "" : isDb ? (bal >= 0 ? "م" : "د") : bal >= 0 ? "د" : "م";
        html +=
          "<div class='coa-row coa-leafrow' data-id='" +
          esc(a.id) +
          "' data-name='" +
          esc(a.name || "") +
          "' data-code='" +
          esc(a.code || "") +
          "' style='padding-right:" +
          (16 + indent) +
          "px'>" +
          "<span class='coa-leaf-dot'></span>" +
          "<span class='coa-code coa-code-ghost'>" +
          esc(a.code || "") +
          "</span>" +
          "<span class='coa-name'>" +
          esc(a.name || "") +
          "</span>" +
          "<span class='coa-col-debit'>" +
          (dr ? fmt(dr) : "—") +
          "</span>" +
          "<span class='coa-col-credit'>" +
          (cr ? fmt(cr) : "—") +
          "</span>" +
          "<span class='coa-col-balance sensitive-balance" +
          (bal < 0 ? " coa-balance-neg" : "") +
          "'>" +
          fmt(Math.abs(bal)) +
          (balLbl ? "<span class='coa-bal-nature'>" + balLbl + "</span>" : "") +
          "</span>" +
          _coaActionBtns(a) +
          "</div>";
      }
    });
    return html;
  }

  /**
   * _renderCoaTree(accounts, filterType, searchQ)
   * يرسم شجرة دليل الحسابات في #coa-tree-container ويحدّث عدّادات الشرائح
   */
  function _renderCoaTree(accounts, filterType, searchQ) {
    var container = document.getElementById("coa-tree-container");
    if (!container) return;

    // تحديث عدّادات الشرائح الإحصائية
    var countAll = document.getElementById("coa-chip-count-ALL");
    if (countAll) countAll.textContent = accounts.length;
    COA_TYPE_LIST.forEach(function (t) {
      var el = document.getElementById("coa-chip-count-" + t);
      if (el)
        el.textContent = accounts.filter(function (a) {
          return a.type === t;
        }).length;
    });

    var q = (searchQ || "").toLowerCase().trim();
    // مجموعات العرض بالترتيب المطلوب: 1 الأصول، 2 الخصوم وحقوق الملكية (مدمجين)، 3 المصروفات، 4 الإيرادات
    var groupsToShow =
      filterType && filterType !== "ALL"
        ? [{ types: [filterType], metaType: filterType, label: null }]
        : [
            { types: ["ASSET"], metaType: "ASSET", label: null },
            {
              types: ["LIABILITY", "EQUITY"],
              metaType: "LIABILITY",
              label: "الخصوم وحقوق الملكية",
            },
            { types: ["EXPENSE"], metaType: "EXPENSE", label: null },
            { types: ["REVENUE"], metaType: "REVENUE", label: null },
          ];

    var html = "";
    var anyRendered = false;

    groupsToShow.forEach(function (grp) {
      var typeAccounts = accounts.filter(function (a) {
        return grp.types.indexOf(a.type) !== -1;
      });
      if (!typeAccounts.length) return;
      var tc = COA_TYPE_COLORS[grp.metaType] || {
        bg: "var(--surface3)",
        color: "var(--text2)",
        label: grp.metaType,
        icon: "ti-folder",
      };
      // رقم الهيدر — أقصر كود بين حسابات المجموعة (يمثّل الحساب الجذري)
      var headCode = typeAccounts.reduce(function (min, a) {
        var c = String(a.code || "");
        if (!c) return min;
        if (!min || c.length < min.length || (c.length === min.length && c < min))
          return c;
        return min;
      }, "");
      var headLabel = grp.label || tc.label;

      var forest = _coaBuildForest(typeAccounts);
      // لو الفرع الجذري واحد بس (التصنيف الرئيسي) — اعرض أبناءه مباشرة بدل تكرار اسم النوع
      if (forest.length === 1 && forest[0].children.length)
        forest = forest[0].children;
      if (q) forest = _coaFilterTree(forest, q);
      if (!forest.length) return;

      anyRendered = true;
      var leafCount = typeAccounts.filter(function (a) {
        return !(a.is_parent === true || a.is_parent === "TRUE");
      }).length;

      html += "<div class='coa-typegroup'>";
      html +=
        "<div class='coa-typehead' style='background:" +
        tc.bg +
        ";color:" +
        tc.color +
        "'><i class='ti " +
        tc.icon +
        "'></i><span class='coa-typehead-label'>" +
        (headCode ? "<span class='coa-typehead-code'>" + esc(headCode) + "</span> - " : "") +
        headLabel +
        "</span><span class='coa-typehead-count'>" +
        leafCount +
        " حساب</span></div>";
      html +=
        "<div class='coa-typebody'>" +
        "<div class='coa-col-header'>" +
        "<span class='coa-col-header-name'>اسم الحساب</span>" +
        "<span class='coa-col-header-debit'>مدين</span>" +
        "<span class='coa-col-header-credit'>دائن</span>" +
        "<span class='coa-col-header-balance'>الرصيد</span>" +
        "</div>" +
        _coaRenderNodes(forest, 0, tc) +
        "</div>";
      html += "</div>";
    });

    if (!anyRendered) {
      container.innerHTML =
        "<div class='coa-empty'><i class='ti ti-search'></i><p>لا توجد حسابات مطابقة</p></div>";
      return;
    }

    container.innerHTML = html;
  }

  function bindChartOfAccounts() {
    ensureExtendedData(function () {
      var activeType = "ALL";

      function _refresh() {
        var accs = APP.data.chartOfAccounts || [];
        var searchInput = document.getElementById("coa-search");
        var q = searchInput ? searchInput.value.trim() : "";
        _renderCoaTree(accs, activeType, q);
      }

      // أول عرض للشجرة
      _refresh();

      // زر إضافة حساب جديد
      var addBtn = document.getElementById("coa-btn-add");
      if (addBtn) {
        addBtn.addEventListener("click", function () {
          _openAccountModal(null);
        });
      }

      // البحث
      var searchInput = document.getElementById("coa-search");
      if (searchInput) searchInput.addEventListener("input", _refresh);

      // شرائح الفلترة بالنوع
      var chipsWrap = document.getElementById("coa-chips");
      if (chipsWrap) {
        chipsWrap.addEventListener("click", function (e) {
          var chip = e.target.closest(".coa-chip");
          if (!chip) return;
          activeType = chip.dataset.type;
          chipsWrap.querySelectorAll(".coa-chip").forEach(function (c) {
            c.classList.toggle("coa-chip-active", c === chip);
          });
          _refresh();
        });
      }

      // طي/فتح المجموعات — مستمع واحد مفوّض (مربوط مرة واحدة فقط)
      var container = document.getElementById("coa-tree-container");
      if (container && !container.dataset.coaBound) {
        container.dataset.coaBound = "1";
        // [CTX-REFACTOR] الإجراءات (تعديل/حذف) انتقلت للـ ContextMenu
        container.addEventListener("click", function (e) {
          var toggleBtn = e.target.closest(".coa-toggle");
          if (toggleBtn) {
            var body = document.getElementById(toggleBtn.dataset.toggle);
            if (body) body.classList.toggle("coa-collapsed");
            toggleBtn.classList.toggle("coa-toggle-collapsed");
          }
        });
        if (window.CTX) CTX.register(container, "chart_of_accounts");
      }
    });
  }

  function _openAccountModal(id) {
    if (!canDo("addChartAccount") && !id)
      return NotificationEngine.error(" ليس لديك صلاحية");
    if (!canDo("updateChartAccount") && id)
      return NotificationEngine.error(" ليس لديك صلاحية");
    var accounts = APP.data.chartOfAccounts || [];
    var acc = id
      ? accounts.find(function (a) {
          return String(a.id) === String(id);
        })
      : null;
    openStyledDrawer({
      title: acc ? "تعديل الحساب" : "إضافة حساب جديد",
      icon: "ti-book",
      fields: [
        { id: "acc-code", label: "كود الحساب", value: acc ? acc.code : "" },
        { id: "acc-name", label: "اسم الحساب", value: acc ? acc.name : "" },
        {
          id: "acc-type",
          label: "النوع",
          type: "select",
          value: acc ? acc.type : "",
          // [P2-FIX] addChartAccount/updateChartAccount في الخادم تتحقق من
          // data.type ضمن قائمة إنجليزية ثابتة (ASSET/LIABILITY/EQUITY/
          // REVENUE/EXPENSE). كانت options هنا مصفوفة نصوص عربية خام، فكان
          // <option value="..."> يحمل النص العربي نفسه كقيمة، فيصل للخادم
          // type="أصول" مثلاً، وهو غير موجود في validTypes → رفض دائم
          // ("نوع الحساب غير صالح") لكل عملية إضافة أو تعديل حساب.
          options: [
            { value: "ASSET", label: "أصول" },
            { value: "LIABILITY", label: "خصوم" },
            { value: "EQUITY", label: "حقوق ملكية" },
            { value: "REVENUE", label: "إيرادات" },
            { value: "EXPENSE", label: "مصروفات" },
          ],
        },
        // [ITEM-POSTING-WIRE-GAP-FIX-2026-08-08] حقل جديد — بديل بنيوي
        // لمطابقة الاسم النصية اللي كانت مستخدمة في getCashFlowStatement
        // لتصنيف الأصول الثابتة (البند 6). يظهر فقط لو النوع أصول.
        {
          id: "acc-subtype",
          label: "تصنيف فرعي — للأصول الثابتة فقط (يُستخدم في قائمة التدفقات النقدية)",
          type: "select",
          value: acc ? acc.subtype || "" : "",
          options: [
            { value: "", label: "أصل متداول / غير منطبق (افتراضي)" },
            { value: "FIXED", label: "أصل ثابت" },
            { value: "NON_CURRENT", label: "أصل غير متداول آخر" },
          ],
        },
      ],
      onSave: function (vals) {
        // ── [VF] التحقق الموحّد ────────────────────────────────────
        if (typeof VF !== "undefined") {
          if (
            !VF.quickSave([
              { fieldId: "acc-code", rules: VF.RULES.code("كود الحساب") },
              {
                fieldId: "acc-name",
                rules: VF.RULES.requiredText("اسم الحساب"),
              },
              {
                fieldId: "acc-type",
                rules: VF.RULES.requiredSelect("نوع الحساب"),
              },
            ])
          )
            return;
        } else if (!vals["acc-code"] || !vals["acc-name"]) {
          return NotificationEngine.error("أدخل الكود والاسم");
        }
        // [SE-ROLLOUT] عبر SaveEngine.run بدل _gsr اليدوي المباشر —
        // نفس الـ payload بالظبط (نفس تنسيق callerUser/sessionToken ونفس
        // شكل updateChartAccount(id, data) المنفصل)، الفرق الوحيد إن
        // الحفظ بقى بيمر من نقطة الدخول الموحّدة (spinner على زر الحفظ +
        // رسائل موحّدة + منع الضغط المزدوج + retry logic لو احتجناها).
        SaveEngine.run({
          screen: "Accounting.ChartOfAccounts",
          entity: "chart_account",
          recordId: acc ? acc.id : null,
          buttonId: "__sd-fields-save-btn",
          collect: function () {
            return {
              code: vals["acc-code"],
              name: vals["acc-name"],
              type: vals["acc-type"],
              subtype: vals["acc-subtype"] || "",
              callerUser: APP.currentUser.username,
              sessionToken: SESSION.token,
            };
          },
          fn: acc ? "updateChartAccount" : "addChartAccount",
          params: function (data) {
            if (acc) data.id = acc.id;
            return acc ? [acc.id, data] : [data];
          },
          onSuccess: function () {
            _reloadExtAndRender("chart-of-accounts");
          },
        });
      },
    });
  }

  function _deleteAccount(id) {
    if (!canDo("deleteChartAccount"))
      return NotificationEngine.error(" ليس لديك صلاحية");
    showConfirm({
      title: "حذف الحساب",
      message: "هل تريد حذف هذا الحساب؟",
      confirmText: "حذف",
      confirmClass: "btn-danger",
      onConfirm: function () {
        _gsr(
          "deleteChartAccount",
          [id, APP.currentUser.username, SESSION.token],
          {
            label: "Accounting.deleteChartAccount",
            onSuccess: function (result) {
              NotificationEngine.success(result.message);
              _reloadExtAndRender("chart-of-accounts");
            },
            onError: function (result) {
              NotificationEngine.error(result.message || "خطأ");
            },
          },
        );
      },
    });
  }

    openStyledDrawer({

      onReady: function () {
        // [AUTO-CODE] لخزينة جديدة: اجلب معاينة الكود التسلسلي التالي من
        // السيرفر (بدون استهلاكه — التوليد الملزم الفعلي وقت الحفظ).
        if (!box) {
          var cbCodeEl = document.getElementById("cb-code");
          if (cbCodeEl) {
            _gsr("getNextCashBoxCode", [], {
              label: "Accounting.getNextCashBoxCode",
              onSuccess: function (res) {
                if (cbCodeEl) cbCodeEl.value = (res && res.data) || "";
              },
              onError: function () {
                if (cbCodeEl) cbCodeEl.value = "";
              },
            });
          }
        }
        // toggle label live
        var activeChk = document.getElementById("cb-active");
        var activeLabel = document.getElementById("cb-active-label");
        if (activeChk && activeLabel) {
          activeChk.addEventListener("change", function () {
            activeLabel.textContent = activeChk.checked ? "نشطة" : "معطلة";
          });
        }

        document
          .getElementById("save-cb-btn")
          .addEventListener("click", function () {
            var nameVal =
              (document.getElementById("cb-name") || {}).value || "";
            var codeVal =
              (document.getElementById("cb-code") || {}).value || "";

            if (typeof VF !== "undefined") {
              if (
                !VF.quickSave([
                  {
                    fieldId: "cb-name",
                    rules: VF.RULES.requiredText("اسم الخزينة"),
                  },
                  {
                    fieldId: "cb-code",
                    rules: VF.RULES.requiredText("كود الخزينة"),
                  },
                ])
              )
                return;
            } else {
              if (!nameVal.trim())
                return NotificationEngine.error("اسم الخزينة مطلوب");
              if (!codeVal.trim())
                return NotificationEngine.error("كود الخزينة مطلوب");
            }

            var saveBtn = document.getElementById("save-cb-btn");
            if (saveBtn) {
              saveBtn.disabled = true;
              saveBtn.innerHTML =
                '<i class="ti ti-loader-2" style="animation:spin 0.8s linear infinite"></i> جاري الحفظ...';
            }

            var payload = {
              name: nameVal.trim(),
              code: box ? box.code || codeVal.trim() : codeVal.trim(),
              branch: (
                (document.getElementById("cb-branch") || {}).value || ""
              ).trim(),
              currency:
                (document.getElementById("cb-currency") || {}).value || "EGP",
              opening_balance: box
                ? undefined
                : parseFloat(
                    (document.getElementById("cb-balance") || {}).value,
                  ) || 0,
              responsible: (
                (document.getElementById("cb-responsible") || {}).value || ""
              ).trim(),
              is_active: !!(document.getElementById("cb-active") || {}).checked,
              notes: (
                (document.getElementById("cb-notes") || {}).value || ""
              ).trim(),
              callerUser: APP.currentUser.username,
              sessionToken: SESSION.token,
            };
            // نشيل opening_balance من update payload عشان البيكاند مش بيقبله
            if (box) delete payload.opening_balance;

            function _resetBtn() {
              if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.innerHTML =
                  '<i class="ti ' +
                  (box ? "ti-device-floppy" : "ti-cash") +
                  '"></i>' +
                  (box ? "حفظ التعديلات" : "إضافة الخزينة");
              }
            }

            var _cbFn = box ? "updateCashBox" : "addCashBox";
            var _cbArgs = box ? [box.id, payload] : [payload];
            _gsr(_cbFn, _cbArgs, {
              label: "Accounting." + _cbFn,
              onSuccess: function (result) {
                var r = result.data;
                // ① أغلق الـ drawer بشكل ناعم فوراً
                closeStyledDrawer();
                // ② حدّث الجدول بـ fade ناعم بعد ما الـ drawer يختفي
                setTimeout(function () {
                  var tbody = document.getElementById("cb-table-body");
                  if (tbody) {
                    tbody.style.transition = "opacity 0.2s ease";
                    tbody.style.opacity = "0.3";
                  }
                  _reloadCashBoxesFromServer(function () {
                    // أعد رسم الصفوف مباشرة بدون renderPage كامل
                    var boxes = (APP.data.cashBoxes || []).filter(function (b) {
                      return b.is_active !== false && b.is_active !== "FALSE";
                    });
                    if (tbody) {
                      tbody.innerHTML = !boxes.length
                        ? "<tr><td colspan='7' style='text-align:center;padding:24px;color:var(--text3)'>لا توجد خزائن بعد</td></tr>"
                        : boxes
                            .map(function (b) {
                              var bal = parseFloat(
                                b.current_balance || b.opening_balance || 0,
                              );
                              return (
                                "<tr data-row data-id='" +
                                esc(b.id) +
                                "' data-name='" +
                                esc(b.name || "") +
                                "' style='cursor:context-menu'>" +
                                "<td>" +
                                esc(b.code || b.id || "") +
                                "</td>" +
                                "<td><b>" +
                                esc(b.name || "") +
                                "</b></td>" +
                                "<td>" +
                                esc(b.branch || "—") +
                                "</td>" +
                                "<td>" +
                                esc(b.currency || "EGP") +
                                "</td>" +
                                "<td style='direction:ltr;text-align:center;font-weight:600;color:" +
                                (bal < 0
                                  ? "var(--error,#ef4444)"
                                  : "var(--success,#22c55e)") +
                                "'>" +
                                formatMoney(bal, {
                                  decimals: 0,
                                  withSymbol: false,
                                }) +
                                "</td>" +
                                "<td>" +
                                esc(b.manager || b.responsible || "—") +
                                "</td>" +
                                "</tr>"
                              );
                            })
                            .join("");
                      // إعادة تفعيل context menu
                      if (window.CTX) CTX.register(tbody, "cash_boxes");
                      // fade in ناعم
                      requestAnimationFrame(function () {
                        tbody.style.opacity = "1";
                        setTimeout(function () {
                          tbody.style.transition = "";
                          tbody.style.opacity = "";
                        }, 220);
                      });
                    }
                    NotificationEngine.success(result.message || "تمت إضافة الخزينة بنجاح");
                  });
                }, 180); // بعد انتهاء animation إغلاق الـ drawer (0.18s)
              },
              onError: function (result) {
                NotificationEngine.error(result.message || "فشلت العملية، يرجى المحاولة مجدداً");
                _resetBtn();
              },
            });
          });
      },
      footer:
        '<button class="btn btn-outline" onclick="closeStyledDrawer()">إلغاء</button>' +
        '<button class="btn btn-primary" id="save-cb-btn"><i class="ti ' +
        (box ? "ti-device-floppy" : "ti-cash") +
        '"></i>' +
        (box ? "حفظ التعديلات" : "إضافة الخزينة") +
        "</button>",

    SALE: { page: "sale-invoices", open: "viewSaleInvoice" },
    COGS: { page: "sale-invoices", open: "viewSaleInvoice" },
    SALE_RETURN: { page: "sale-invoices", open: "viewSaleInvoice" },
    SALE_RETURN_COGS: { page: "sale-invoices", open: "viewSaleInvoice" },
    PURCHASE: { page: "purchase-invoices", open: "viewPurchaseInvoice" },
    PURCHASE_INVOICE: { page: "purchase-invoices", open: "viewPurchaseInvoice" },
    PURCHASE_RETURN: { page: "purchase-invoices", open: "viewPurchaseInvoice" },
    PURCHASE_RETURN_INVENTORY: {
      page: "purchase-invoices",
      open: "viewPurchaseInvoice",
    },
    RECEIPT: { page: "receipt-vouchers", open: "_ctxOpenVoucher" },
    PAYMENT: { page: "payment-vouchers", open: "_ctxOpenVoucher" },
    EXPENSE: { page: "expenses", open: "_ctxOpenVoucher" },
    TRANSFER: { page: "transfer-vouchers", open: "_ctxOpenVoucher" },
  };

  function _ctxOpenVoucher(refId, page) {
    var dataKeyMap = {
      "receipt-vouchers": "receiptVouchers",
      "payment-vouchers": "paymentVouchers",
      expenses: "expenses",
      "transfer-vouchers": "transferVouchers",
    };
    var backendFnMap = {
      "receipt-vouchers": "getReceiptVouchers",
      "payment-vouchers": "getPaymentVouchers",
      expenses: "getExpenses",
      "transfer-vouchers": "getTransferVouchers",
    };
    var dataKey = dataKeyMap[page];
    var list = (dataKey && APP.data[dataKey]) || [];
    var doc = list.find(function (v) {
      return (
        String(v.id) === String(refId) ||
        String(v.voucher_number) === String(refId)
      );
    });
    if (!doc) {
      NotificationEngine.warning("المستند المرتبط غير موجود ضمن السندات المحمّلة حالياً");
      return;
    }
    if (typeof _openVoucherModal === "function") {
      _openVoucherModal(doc.id, page, dataKey, backendFnMap[page]);
    }
  }

  window.ctx_viewLinkedDoc = function (id) {
    var entries = APP.data.journalEntries || [];
    var entry = entries.find(function (e) {
      return String(e.id) === String(id);
    });
    if (!entry) return NotificationEngine.error("القيد غير موجود");
    if (!entry.reference) {
      NotificationEngine.warning("لا يوجد مرجع مرتبط بهذا القيد");
      return;
    }
    var map = JOURNAL_SOURCE_LINK_MAP[entry.source_type];
    if (!map) {
      NotificationEngine.info("لا يوجد مستند قابل للعرض لهذا النوع من القيود (" +
        (entry.source_type || "-") +
        ")");
      return;
    }
    NotificationEngine.loading("جاري فتح المستند المرتبط...");
    navigate(map.page);
    setTimeout(function () {
      if (map.open === "_ctxOpenVoucher") {
        _ctxOpenVoucher(entry.reference, map.page);
        dismissLoadingToast();
      } else if (typeof window[map.open] === "function") {
        window[map.open](entry.reference);
        dismissLoadingToast();
      } else {
        finishLoadingToast("تعذّر فتح المستند المرتبط", "error");
      }
    }, 350);
  };

  // drawer سند قبض/صرف مع pre-fill الخزينة
  function _openVoucherDrawerWithBox(page, dataKey, backendFn, cashBoxId, box) {
    var accounts = APP.data.chartOfAccounts || [];
    var parties = (APP.data.customers || []).concat(APP.data.suppliers || []);
    var boxes = APP.data.cashBoxes || [];
    var banks = APP.data.bankAccounts || [];

    // خيارات الخزائن والبنوك/فيزا/المحافظ الإلكترونية كـ "حساب النقدية"
    var cashOpts = boxes.map(function (b) {
      return { value: b.id, label: "خزينة — " + b.name };
    });
    var bankOpts = banks.map(function (b) {
      var _kindPrefix =
        b.account_kind === "VISA"
          ? "فيزا — "
          : b.account_kind === "WALLET"
            ? "محفظة — "
            : "بنك — ";
      return { value: b.id, label: _kindPrefix + (b.name || b.bank_name) };
    });
    var allCashOpts = cashOpts.concat(bankOpts);

    var isReceipt = page === "receipt-vouchers";
    var title = isReceipt ? "سند قبض" : "سند صرف";
    if (box) title += " — " + box.name;

    openStyledDrawer({
      title: title,
      icon: isReceipt ? "ti-cash" : "ti-cash-banknote",
      size: "md",
      fields: [
        {
          id: "vb-date",
          label: "التاريخ",
          type: "date",
          value: (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
        },
        {
          id: "vb-amount",
          label: "المبلغ",
          type: "number",
          placeholder: "0.00",
        },
        {
          id: "vb-party",
          label: isReceipt ? "المستلم منه" : "المدفوع له",
          type: "datalist",
          value: "",
          options: parties.map(function (p) {
            return p.name;
          }),
        },
        {
          id: "vb-method",
          label: "طريقة الدفع",
          type: "select",
          value: "CASH",
          // [PAYMENT-METHODS-MASTER-1] بدل القايمة الثابتة المحلية —
          // نفس PAYMENT_METHODS المشتركة (31_JS_DataLayer.html) اللي
          // بتتحدّث من كيان PaymentMethods (Master Data).
          options: PAYMENT_METHODS.map(function (m) {
            return { value: m.value, label: m.label };
          }),
        },
        {
          id: "vb-cashbox",
          label: "الخزينة",
          type: "select",
          value: cashBoxId || (boxes[0] && boxes[0].id) || "",
          options: allCashOpts,
        },
        {
          id: "vb-description",
          label: "البيان",
          type: "textarea",
          rows: 2,
          value: "",
        },
        {
          id: "vb-ref",
          label: "المرجع",
          value: "",
        },
      ],
      onSave: function (vals) {
        var amount = parseFloat(vals["vb-amount"]);
        if (!amount || amount <= 0)
          return NotificationEngine.error("أدخل مبلغاً صحيحاً");
        var method = vals["vb-method"] || "CASH";
        var boxOrBank = vals["vb-cashbox"] || "";
        var isBox = boxes.some(function (b) {
          return b.id === boxOrBank;
        });
        // [P5-C FIX] كان party_type يُرسَل دائماً "OTHER" مهما كان الطرف عميلاً
        // أو مورداً فعلياً، فيُسجَّل التحصيل دائماً كـ "إيراد متنوع" بدل تخفيض
        // فعلي لحساب الذمم المدينة/الدائنة الخاص بالعميل/المورد — نحدد النوع
        // والمعرّف الفعليين بمطابقة الاسم المُدخل مع قوائم العملاء/الموردين.
        var partyName = vals["vb-party"] || "";
        var matchedCustomer = (APP.data.customers || []).find(function (c) {
          return c.name === partyName;
        });
        var matchedSupplier = (APP.data.suppliers || []).find(function (s) {
          return s.name === partyName;
        });
        var partyType = "OTHER";
        var partyId = "";
        if (isReceipt && matchedCustomer) {
          partyType = "CUSTOMER";
          partyId = matchedCustomer.id;
        } else if (!isReceipt && matchedSupplier) {
          partyType = "SUPPLIER";
          partyId = matchedSupplier.id;
        }
        var payload = {
          date: vals["vb-date"],
          amount: amount,
          from_party: vals["vb-party"],
          to_party: vals["vb-party"],
          party_type: partyType,
          party_id: partyId,
          payment_method: method,
          cash_box_id: method === "CASH" && isBox ? boxOrBank : "",
          bank_account_id:
            ["BANK", "VISA", "WALLET"].indexOf(method) !== -1 && !isBox
              ? boxOrBank
              : "",
          description: vals["vb-description"],
          ref: vals["vb-ref"],
          callerUser: APP.currentUser.username,
          sessionToken: SESSION.token,
        };
        _gsr(backendFn, payload, {
          label: "Accounting." + backendFn,
          onSuccess: function (r) {
            NotificationEngine.success(r.message);
            closeStyledDrawer();
            _reloadExtAndRender(page);
          },
          onError: function (r) {
            NotificationEngine.error(r.message || "خطأ");
          },
        });
      },
    });
  }

  // drawer تحويل بين خزائن مع pre-fill خزينة المصدر
  function _openTransferDrawerFromBox(cashBoxId, box) {
    var boxes = APP.data.cashBoxes || [];
    var banks = APP.data.bankAccounts || [];
    var fromOpts = boxes
      .map(function (b) {
        return { value: "CASHBOX:" + b.id, label: "خزينة — " + b.name };
      })
      .concat(
        banks.map(function (b) {
          var _kindPrefix =
            b.account_kind === "VISA"
              ? "فيزا — "
              : b.account_kind === "WALLET"
                ? "محفظة — "
                : "بنك — ";
          return {
            value: "BANK:" + b.id,
            label: _kindPrefix + (b.name || b.bank_name),
          };
        }),
      );
    var toOpts = fromOpts.slice(); // نفس القائمة

    openStyledDrawer({
      title: "تحويل بين الخزائن" + (box ? " — من " + box.name : ""),
      icon: "ti-arrows-exchange",
      size: "md",
      fields: [
        {
          id: "tr-date",
          label: "التاريخ",
          type: "date",
          value: (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
        },
        {
          id: "tr-from",
          label: "من (المصدر)",
          type: "select",
          value: cashBoxId
            ? "CASHBOX:" + cashBoxId
            : (fromOpts[0] && fromOpts[0].value) || "",
          options: fromOpts,
        },
        {
          id: "tr-to",
          label: "إلى (الوجهة)",
          type: "select",
          value: "",
          options: toOpts,
        },
        {
          id: "tr-amount",
          label: "المبلغ",
          type: "number",
          placeholder: "0.00",
        },
        {
          id: "tr-fee",
          label: "عمولة التحويل (اختياري)",
          type: "number",
          placeholder: "0.00",
        },
        {
          id: "tr-bank-ref",
          label: "الرقم المرجعي البنكي (اختياري)",
          type: "text",
          value: "",
        },
        {
          id: "tr-desc",
          label: "البيان",
          type: "textarea",
          rows: 2,
          value: "",
        },
      ],
      onSave: function (vals) {
        var amount = parseFloat(vals["tr-amount"]);
        if (!amount || amount <= 0)
          return NotificationEngine.error("أدخل مبلغاً صحيحاً");
        var fromParts = (vals["tr-from"] || "").split(":");
        var toParts = (vals["tr-to"] || "").split(":");
        if (!fromParts[1] || !toParts[1])
          return NotificationEngine.error("حدد المصدر والوجهة");
        if (vals["tr-from"] === vals["tr-to"])
          return NotificationEngine.error("لا يمكن التحويل لنفس الحساب");
        var feeVal = parseFloat(vals["tr-fee"]);
        // [SE-ROLLOUT] عبر SaveEngine.run بدل _gsr اليدوي المباشر — نفس
        // الـ payload بالظبط، مع الاستفادة من soft-close/spinner/رسائل موحّدة.
        SaveEngine.run({
          screen: "Accounting.TransferVouchers",
          entity: "transfer_voucher",
          buttonId: "__sd-fields-save-btn",
          closeFn: closeStyledDrawer,
          collect: function () {
            return {
              date: vals["tr-date"],
              amount: amount,
              from_type: fromParts[0],
              from_id: fromParts[1],
              to_type: toParts[0],
              to_id: toParts[1],
              fee_amount: feeVal > 0 ? feeVal : 0,
              bank_reference: vals["tr-bank-ref"] || "",
              description: vals["tr-desc"],
              callerUser: APP.currentUser.username,
              sessionToken: SESSION.token,
            };
          },
          fn: "addTransferVoucher",
          onSuccess: function () {
            _reloadExtAndRender("transfer-vouchers");
          },
        });
      },
    });
  }

  function _deleteCashBox(id) {
    showConfirm({
      title: "حذف الخزينة",
      message: "هل تريد حذف هذه الخزينة؟",
      confirmText: "حذف",
      confirmClass: "btn-danger",
      onConfirm: function (unfreeze) {
        _gsr("deleteCashBox", [id, APP.currentUser.username, SESSION.token], {
          label: "Accounting.deleteCashBox",
          onSuccess: function (r) {
            NotificationEngine.success(r.message);
            // ① Optimistic UI — حذف الصف فوراً من DOM
            var deletedRow = document.querySelector("tr[data-id='" + id + "']");
            if (deletedRow) deletedRow.remove();
            // ② تحديث APP.data محلياً فوراً
            if (APP.data && APP.data.cashBoxes) {
              APP.data.cashBoxes = APP.data.cashBoxes.filter(function (b) {
                return String(b.id) !== String(id);
              });
            }
            if (unfreeze) unfreeze();
            // ③ Background sync صامت — بدون render أو skeleton
            APP.extLoaded = false;
            APP.extLoading = false;
            try {
              sessionStorage.removeItem("wms_ext_cache_v1");
              sessionStorage.removeItem("wms_ext_cache");
            } catch (e) {}
            _reloadCashBoxesFromServer(null); // تحديث APP.data في الخلفية بدون callback
          },
          onError: function (r) {
            if (unfreeze) unfreeze();
            NotificationEngine.error(r.message || "خطأ");
          },
        });
      },
    });
  }

    var chartAccounts = APP.data.chartOfAccounts || [];
    var banksList = (APP.data.banks || []).filter(function (b) {

    });
    var accOpts = chartAccounts
      .filter(function (a) {
        return (
          a.is_active !== false &&
          a.is_active !== "FALSE" &&
          a.is_active !== "false"
        );
      })
      .map(function (a) {
        var isParent =
          a.is_parent === true ||
          a.is_parent === "TRUE" ||
          a.is_parent === "true";
        var lvl = parseInt(a.level || 1, 10);
        var indent = "";
        for (var i = 1; i < lvl; i++) indent += "\u00a0\u00a0\u00a0";
        return (
          '<option value="' +
          esc(a.id) +
          '"' +
          (String(a.id) === String(acc && acc.account_id ? acc.account_id : "")
            ? " selected"
            : "") +
          (isParent ? " disabled" : "") +
          ">" +
          esc(indent + (a.code ? "[" + a.code + "] " : "") + a.name) +
          "</option>"
        );
      })
      .join("");
    var bankOpts = banksList
      .map(function (b) {
        return (
          '<option value="' +
          esc(b.id) +
          '"' +
          (String(b.id) === String(acc && acc.bank_id ? acc.bank_id : "")
            ? " selected"
            : "") +
          ">" +
          esc(b.name + (b.city ? " — " + b.city : "")) +
          "</option>"
        );
      })
      .join("");

    openStyledDrawer({
      title: acc ? "تعديل الحساب البنكي" : "إضافة حساب بنكي",
      icon: "ti-building-bank",
      body:
        '<div class="modal-body"><div class="form-grid">' +
        '<div class="field full"><label>اسم الحساب <span style="color:var(--danger)">*</span></label>' +
        '<input class="input" id="bank-name" value="' +
        esc(acc ? acc.name : "") +
        '" placeholder="مثال: حساب البنك التجاري"></div>' +
        '<div class="field"><label>كود الحساب <span style="color:var(--danger)">*</span></label>' +
        '<input class="input" id="bank-code" data-allow-alpha="true" value="' +
        esc(acc ? acc.code || "" : "") +
        '" placeholder="مثال: BNK-001"' +
        (acc
          ? ' style="background:var(--surface2);color:var(--text3)" readonly title="لا يمكن تعديل الكود بعد الإنشاء"'
          : "") +
        "></div>" +
        '<div class="field full"><label>نوع الحساب <span style="color:var(--danger)">*</span></label>' +
        '<select class="input" id="bank-account-kind">' +
        '<option value="BANK"' +
        ((acc ? acc.account_kind || "BANK" : "BANK") === "BANK" ? " selected" : "") +
        ">حساب بنكي عادي</option>" +
        '<option value="VISA"' +
        ((acc ? acc.account_kind : "") === "VISA" ? " selected" : "") +
        ">فيزا (شبكة دفع إلكتروني)</option>" +
        '<option value="WALLET"' +
        ((acc ? acc.account_kind : "") === "WALLET" ? " selected" : "") +
        ">محفظة إلكترونية (فودافون كاش / إنستاباي...)</option>" +
        "</select>" +
        '<div style="font-size:11px;color:var(--text3);margin-top:4px"><i class="ti ti-info-circle" style="font-size:10px"></i> فيزا/محفظة إلكترونية لهما نفس شاشة الحسابات لكن يظهران بقائمة منفصلة في طريقة الدفع بالسندات</div>' +
        "</div>" +
        '<div class="field full" id="bank-bank-id-wrap"><label>البنك <span style="color:var(--danger)">*</span></label>' +
        '<select class="input" id="bank-bank-id">' +
        '<option value="">— اختر البنك —</option>' +
        bankOpts +
        "</select>" +
        (banksList.length
          ? ""
          : '<div style="font-size:11px;color:var(--warning,#b45309);margin-top:4px"><i class="ti ti-alert-triangle"></i> لا توجد بنوك مُضافة بعد — أضف بنكاً أولاً من شاشة "البنوك"</div>') +
        "</div>" +
        '<div class="field"><label id="bank-account-no-label">رقم الحساب</label>' +
        '<input class="input" id="bank-account-no" value="' +
        esc(acc ? acc.account_number || "" : "") +
        '" placeholder="XXXXXXXXXXXXXXXX" dir="ltr"></div>' +
        '<div class="field"><label>IBAN</label>' +
        '<input class="input" id="bank-iban" value="' +
        esc(acc ? acc.iban || "" : "") +
        '" placeholder="EG..." dir="ltr"></div>' +
        '<div class="field"><label>SWIFT/BIC</label>' +
        '<input class="input" id="bank-swift" value="' +
        esc(acc ? acc.swift || "" : "") +
        '" placeholder="XXXXXXXX" dir="ltr"></div>' +
        '<div class="field"><label>تاريخ فتح الحساب</label>' +
        '<input class="input" id="bank-opening-date" type="date" value="' +
        esc(
          acc ? acc.opening_date || "" : (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
        ) +
        '"></div>' +
        '<div class="field"><label>الرصيد الافتتاحي</label>' +
        '<input class="input" id="bank-balance" type="number" value="' +
        esc(acc ? String(acc.opening_balance || 0) : "0") +
        '" placeholder="0"' +
        (acc
          ? ' readonly title="لا يمكن تعديل الرصيد الافتتاحي بعد الإنشاء"'
          : "") +
        "></div>" +
        '<div class="field"><label>مركز التكلفة الافتراضي' +
        ' <span style="font-weight:400;color:var(--text2);font-size:11px">(ملاحظة مرجعية فقط — لا يُطبَّق تلقائيًا على ترحيل القيود حاليًا)</span></label>' +
        '<input class="input" id="bank-cost-center" value="' +
        esc(acc ? acc.default_cost_center || "" : "") +
        '" placeholder="اختياري — للتوثيق فقط، غير مربوط بمنطق الترحيل بعد" title="هذا الحقل تذكيري فقط ولا يُقرأ عند إنشاء القيود المحاسبية"></div>' +
        '<div class="field full">' +
        '<label style="font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:6px">' +
        '<i class="ti ti-book-2" style="font-size:11px;margin-left:4px"></i>' +
        'الحساب المرتبط في دليل الحسابات <span style="color:var(--danger)">*</span></label>' +
        '<input class="input" id="bank-acc-search" placeholder=" ابحث في الحسابات..." style="height:32px;border-radius:8px;font-size:12px;margin-bottom:4px">' +
        '<select class="input" id="bank-account-id" style="height:40px;border-radius:10px;font-size:13px;direction:rtl">' +
        '<option value="">— اختر حساب البنك في دليل الحسابات —</option>' +
        accOpts +
        "</select>" +
        '<div style="font-size:11px;color:var(--text3);margin-top:4px"><i class="ti ti-info-circle" style="font-size:10px"></i> يُستخدم هذا الحساب في كل التحويلات والقيود المرتبطة بهذا البنك</div>' +
        "</div></div></div>",
      onReady: function () {
        // [AUTO-CODE] لحساب بنكي جديد: اجلب معاينة الكود التسلسلي التالي من
        // السيرفر (كان كود مؤقت مبني على الوقت عرضة للتصادم) — يظل قابلاً
        // للتعديل بالكامل، والتحقق الملزم من عدم التكرار في addBankAccount
        // وقت الحفظ الفعلي.
        if (!acc) {
          var bankCodeEl = document.getElementById("bank-code");
          if (bankCodeEl) {
            _gsr("getNextBankAccountCode", [], {
              label: "Accounting.getNextBankAccountCode",
              onSuccess: function (res) {
                if (bankCodeEl && !bankCodeEl.value) {
                  bankCodeEl.value = (res && res.data) || "";
                }
              },
              onError: function () {},
            });
          }
        }
        var kindEl = document.getElementById("bank-account-kind");
        var bankWrap = document.getElementById("bank-bank-id-wrap");
        var accNoLabel = document.getElementById("bank-account-no-label");
        function _syncKindUI() {
          var k = kindEl.value;
          var isBank = k === "BANK";
          bankWrap.style.display = isBank ? "" : "none";
          accNoLabel.textContent =
            k === "VISA"
              ? "رقم الطرفية / التاجر (اختياري)"
              : k === "WALLET"
                ? "رقم المحفظة / الهاتف (اختياري)"
                : "رقم الحساب";
        }
        if (kindEl) {
          kindEl.addEventListener("change", _syncKindUI);
          _syncKindUI();
        }
        var searchEl = document.getElementById("bank-acc-search");
        var selectEl = document.getElementById("bank-account-id");
        if (searchEl && selectEl) {
          var allOpts = Array.from(selectEl.options).map(function (o) {
            return { v: o.value, t: o.text, d: o.disabled };
          });
          searchEl.addEventListener("input", function () {
            var q = searchEl.value.toLowerCase();
            selectEl.innerHTML = "";
            allOpts.forEach(function (o) {
              if (!q || o.t.toLowerCase().includes(q)) {
                var opt = document.createElement("option");
                opt.value = o.v;
                opt.text = o.t;
                opt.disabled = o.d;
                selectEl.appendChild(opt);
              }
            });
          });
        }
        document
          .getElementById("save-bank-btn")
          .addEventListener("click", function () {
            var name = (document.getElementById("bank-name") || {}).value;
            var code = (document.getElementById("bank-code") || {}).value;
            var accountKind =
              (document.getElementById("bank-account-kind") || {}).value ||
              "BANK";
            var isBankKind = accountKind === "BANK";
            var bankId = (document.getElementById("bank-bank-id") || {}).value;
            var accountId = (document.getElementById("bank-account-id") || {})
              .value;
            // ── [VF] التحقق الموحّد ──────────────────────────────────
            if (typeof VF !== "undefined") {
              var _vfRules = [
                {
                  fieldId: "bank-name",
                  rules: VF.RULES.requiredText("اسم الحساب"),
                },
                {
                  fieldId: "bank-code",
                  rules: VF.RULES.requiredText("كود الحساب"),
                },
                {
                  fieldId: "bank-account-id",
                  rules: VF.RULES.requiredSelect("الحساب المرتبط"),
                },
              ];
              if (isBankKind)
                _vfRules.push({
                  fieldId: "bank-bank-id",
                  rules: VF.RULES.requiredSelect("البنك"),
                });
              if (!VF.quickSave(_vfRules)) return;
            } else {
              if (!name || !name.trim())
                return NotificationEngine.error("اسم الحساب مطلوب");
              if (!code || !code.trim())
                return NotificationEngine.error("كود الحساب مطلوب");
              if (isBankKind && !bankId)
                return NotificationEngine.error("يجب اختيار البنك");
              if (!accountId)
                return NotificationEngine.error("يجب اختيار الحساب المرتبط من دليل الحسابات");
            }
            // ──────────────────────────────────────────────────────────
            var payload = {
              name: name.trim(),
              code: code.trim(),
              account_kind: accountKind,
              bank_id: isBankKind ? bankId : "",
              account_number:
                (document.getElementById("bank-account-no") || {}).value || "",
              iban: (document.getElementById("bank-iban") || {}).value || "",
              swift: (document.getElementById("bank-swift") || {}).value || "",
              opening_date:
                (document.getElementById("bank-opening-date") || {}).value ||
                "",
              opening_balance:
                parseFloat(
                  (document.getElementById("bank-balance") || {}).value,
                ) || 0,
              default_cost_center:
                (document.getElementById("bank-cost-center") || {}).value || "",
              account_id: accountId,
              callerUser: APP.currentUser.username,
              sessionToken: SESSION.token,
            };
            if (acc) payload.id = acc.id;
            var fn = acc ? "updateBankAccount" : "addBankAccount";
            _gsr(fn, payload, {
              label: "Accounting." + fn,
              onSuccess: function (r) {
                NotificationEngine.success(r.message);
                _reloadExtAndRender("bank-accounts");
              },
              onError: function (r) {
                NotificationEngine.error(r.message || "خطأ");
              },
            });
          });
      },
      footer:
        '<button class="btn btn-outline" onclick="closeStyledDrawer()">إلغاء</button>' +
        '<button class="btn btn-primary" id="save-bank-btn"><i class="ti ' +
        (acc ? "ti-device-floppy" : "ti-building-bank") +
        '"></i>' +
        (acc ? "حفظ التعديلات" : "إضافة الحساب البنكي") +
        "</button>",
    });
  }

  function _deleteBank(id) {
    showConfirm({
      title: "حذف الحساب البنكي",
      message: "هل تريد حذف هذا الحساب؟",
      confirmText: "حذف",
      confirmClass: "btn-danger",
      onConfirm: function () {
        _gsr(
          "deleteBankAccount",
          [id, APP.currentUser.username, SESSION.token],
          {
            label: "Accounting.deleteBankAccount",
            onSuccess: function (r) {
              NotificationEngine.success(r.message);
              _reloadExtAndRender("bank-accounts");
            },
            onError: function (r) {
              NotificationEngine.error(r.message || "خطأ");
            },
          },
        );
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // §D2  bindChequeBooks — دفاتر الشيكات (Banking Module Phase 2)
  // ─────────────────────────────────────────────────────────────
  var _CHB_STATUS_LABELS = {
    ACTIVE: "نشط",
    FINISHED: "منتهي",
    CANCELLED: "ملغي",
  };
  var _CHB_STATUS_BADGE = {
    ACTIVE: "badge-success",
    FINISHED: "badge-secondary",
    CANCELLED: "badge-danger",
  };

  function bindChequeBooks() {
    ensureExtendedData(function () {
      var books = APP.data.chequeBooks || [];
      var tbody = document.getElementById("chb-table-body");
      if (tbody) {
        tbody.innerHTML = !books.length
          ? "<tr><td colspan='8' style='text-align:center;padding:24px;color:var(--text3)'>لا توجد دفاتر شيكات بعد</td></tr>"
          : books
              .map(function (b) {
                var status = b.status || "ACTIVE";
                return (
                  "<tr data-row data-id='" +
                  esc(b.id) +
                  "' style='cursor:pointer'>" +
                  "<td>" +
                  esc(b.code || "") +
                  "</td>" +
                  "<td><b>" +
                  esc(b.bank_account_name || "") +
                  "</b>" +
                  (b.bank_name
                    ? " <span style='color:var(--text3);font-size:11px'>(" +
                      esc(b.bank_name) +
                      ")</span>"
                    : "") +
                  "</td>" +
                  "<td>" +
                  esc(b.issue_date || "—") +
                  "</td>" +
                  "<td dir='ltr' style='text-align:left'>" +
                  esc(b.first_number) +
                  " — " +
                  esc(b.last_number) +
                  "</td>" +
                  "<td style='text-align:center'>" +
                  esc(b.total_count || 0) +
                  "</td>" +
                  "<td style='text-align:center'>" +
                  esc(b.used_count || 0) +
                  "</td>" +
                  "<td style='text-align:center;font-weight:600;color:" +
                  (Number(b.remaining_count) > 0
                    ? "var(--success,#22c55e)"
                    : "var(--text3)") +
                  "'>" +
                  esc(b.remaining_count || 0) +
                  "</td>" +
                  "<td><span class='badge " +
                  (_CHB_STATUS_BADGE[status] || "badge-secondary") +
                  "'>" +
                  (_CHB_STATUS_LABELS[status] || status) +
                  "</span></td>" +
                  "</tr>"
                );
              })
              .join("");
        tbody.addEventListener("click", function (e) {
          var row = e.target.closest("tr[data-id]");
          if (row && canDo("updateChequeBook"))
            _openChequeBookModal(row.dataset.id);
        });
      }
      var addBtn = document.getElementById("chb-btn-add");
      if (addBtn)
        addBtn.addEventListener("click", function () {
          _openChequeBookModal(null);
        });
    });
  }

  function _openChequeBookModal(id) {
    var books = APP.data.chequeBooks || [];
    var book = id
      ? books.find(function (b) {
          return String(b.id) === String(id);
        })
      : null;
    // دفاتر/عمليات الشيكات تخص الحسابات البنكية العادية فقط
    var bankAccounts = (APP.data.bankAccounts || []).filter(function (a) {
      return !a.account_kind || a.account_kind === "BANK";
    });
    var hasUsed = book && Number(book.used_count || 0) > 0;

    var accOpts = bankAccounts
      .map(function (a) {
        return (
          '<option value="' +
          esc(a.id) +
          '"' +
          (book && String(book.bank_account_id) === String(a.id)
            ? " selected"
            : "") +
          ">" +
          esc(a.name + (a.bank_name ? " — " + a.bank_name : "")) +
          "</option>"
        );
      })
      .join("");

    openStyledDrawer({
      title: book ? "تعديل دفتر الشيكات" : "دفتر شيكات جديد",
      icon: "ti-file-invoice",
      body:
        '<div class="modal-body"><div class="form-grid">' +
        '<div class="field full"><label>الحساب البنكي <span style="color:var(--danger)">*</span></label>' +
        '<select class="input" id="chb-bank-account"' +
        (book ? " disabled" : "") +
        ">" +
        '<option value="">— اختر الحساب البنكي —</option>' +
        accOpts +
        "</select>" +
        (bankAccounts.length
          ? ""
          : '<div style="font-size:11px;color:var(--warning,#b45309);margin-top:4px"><i class="ti ti-alert-triangle"></i> لا توجد حسابات بنكية بعد — أضف حساباً أولاً</div>') +
        "</div>" +
        '<div class="field"><label>تاريخ الإصدار</label>' +
        '<input class="input" id="chb-issue-date" type="date" value="' +
        esc(
          book ? book.issue_date || "" : (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().split("T")[0]),
        ) +
        '"></div>' +
        '<div class="field"><label>كود الدفتر</label>' +
        '<input class="input" id="chb-code" data-allow-alpha="true" value="' +
        esc(book ? book.code || "" : "") +
        '" placeholder="يتولّد تلقائياً لو تُرك فارغاً"></div>' +
        '<div class="field"><label>أول رقم شيك <span style="color:var(--danger)">*</span></label>' +
        '<input class="input" id="chb-first" type="number" dir="ltr" value="' +
        esc(book ? book.first_number || "" : "") +
        '" placeholder="1"' +
        (hasUsed
          ? ' readonly title="لا يمكن تعديل النطاق بعد استخدام شيكات من الدفتر"'
          : "") +
        "></div>" +
        '<div class="field"><label>آخر رقم شيك <span style="color:var(--danger)">*</span></label>' +
        '<input class="input" id="chb-last" type="number" dir="ltr" value="' +
        esc(book ? book.last_number || "" : "") +
        '" placeholder="50"' +
        (hasUsed
          ? ' readonly title="لا يمكن تعديل النطاق بعد استخدام شيكات من الدفتر"'
          : "") +
        "></div>" +
        (book
          ? '<div class="field"><label>الحالة</label>' +
            '<select class="input" id="chb-status">' +
            '<option value="ACTIVE"' +
            (book.status === "ACTIVE" ? " selected" : "") +
            ">نشط</option>" +
            '<option value="FINISHED"' +
            (book.status === "FINISHED" ? " selected" : "") +
            ">منتهي</option>" +
            '<option value="CANCELLED"' +
            (book.status === "CANCELLED" ? " selected" : "") +
            (hasUsed ? " disabled" : "") +
            ">ملغي</option>" +
            "</select></div>"
          : "") +
        '<div class="field full"><label>ملاحظات</label>' +
        '<textarea class="input" id="chb-notes" rows="2">' +
        esc(book ? book.notes || "" : "") +
        "</textarea></div>" +
        (book
          ? '<div class="field full" style="font-size:12px;color:var(--text3)">عدد الشيكات: ' +
            esc(book.total_count || 0) +
            " — مستخدم: " +
            esc(book.used_count || 0) +
            " — متبقي: " +
            esc(book.remaining_count || 0) +
            "</div>"
          : "") +
        "</div></div>",
      onReady: function () {
        document
          .getElementById("save-chb-btn")
          .addEventListener("click", function () {
            var bankAccountId = (
              document.getElementById("chb-bank-account") || {}
            ).value;
            var first = (document.getElementById("chb-first") || {}).value;
            var last = (document.getElementById("chb-last") || {}).value;
            if (!book && !bankAccountId)
              return NotificationEngine.error("يجب اختيار الحساب البنكي");
            if (!first || !last)
              return NotificationEngine.error("أول وآخر رقم شيك مطلوبان");
            if (parseInt(last, 10) < parseInt(first, 10))
              return NotificationEngine.error("آخر رقم شيك يجب أن يكون أكبر من أو يساوي أول رقم");
            var payload = {
              bank_account_id: bankAccountId,
              issue_date:
                (document.getElementById("chb-issue-date") || {}).value || "",
              code: (document.getElementById("chb-code") || {}).value || "",
              first_number: parseInt(first, 10),
              last_number: parseInt(last, 10),
              notes: (document.getElementById("chb-notes") || {}).value || "",
              callerUser: APP.currentUser.username,
              sessionToken: SESSION.token,
            };
            if (book) {
              payload.status = (
                document.getElementById("chb-status") || {}
              ).value;
              // لا نرسل النطاق لو كان مقفول (شيكات مستخدمة)
              if (hasUsed) {
                delete payload.first_number;
                delete payload.last_number;
              }
            }
            var fn = book ? "updateChequeBook" : "addChequeBook";
            var args = book ? [book.id, payload] : payload;
            _gsr(fn, args, {
              label: "Accounting." + fn,
              onSuccess: function (r) {
                NotificationEngine.success(r.message);
                closeStyledDrawer();
                _reloadExtAndRender("cheque-books");
              },
              onError: function (r) {
                NotificationEngine.error(r.message || "خطأ");
              },
            });
          });
      },
      footer:
        (book && canDo("deleteChequeBook") && !hasUsed
          ? '<button class="btn btn-outline" id="delete-chb-btn" style="color:var(--danger);border-color:var(--danger)"><i class="ti ti-trash"></i> حذف</button>'
          : "") +
        '<button class="btn btn-outline" onclick="closeStyledDrawer()">إلغاء</button>' +
        '<button class="btn btn-primary" id="save-chb-btn"><i class="ti ' +
        (book ? "ti-device-floppy" : "ti-plus") +
