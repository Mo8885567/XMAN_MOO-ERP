  // ═══════════════════════════════════════════════════════════════
  // §HR-11  [NEW] Monthly Attendance Report — تقرير الغياب الشهري
  // ═══════════════════════════════════════════════════════════════

  function bindMonthlyAttendance() {
    var now = new Date();
    var yearEl = document.getElementById("matt-year");
    var monthEl = document.getElementById("matt-month");
    if (yearEl && !yearEl.value) yearEl.value = now.getFullYear();
    if (monthEl && !monthEl.value) monthEl.value = now.getMonth() + 1;

    var btnLoad = document.getElementById("matt-btn-load");
    if (btnLoad)
      btnLoad.addEventListener("click", function () {
        _loadMonthlyAttendance();
      });

    var empFilter = document.getElementById("matt-emp-filter");
    if (empFilter) {
      var opts = '<option value="">' + I18N.t("HR_ALL_EMPLOYEES") + "</option>";
      (APP.data.employees || []).forEach(function (e) {
        if (e.status === "ACTIVE")
          opts +=
            '<option value="' + e.id + '">' + esc(e.full_name) + "</option>";
      });
      empFilter.innerHTML = opts;
      if (window.AppSelect) {
        AppSelect.upgrade("matt-emp-filter", {
          icon: "ti-user",
          searchable: true,
        });
      }
    }
  }

  function _loadMonthlyAttendance() {
    var year =
      parseInt(document.getElementById("matt-year").value) ||
      DateEngine.currentYear();
    var month =
      parseInt(document.getElementById("matt-month").value) ||
      new Date().getMonth() + 1;
    var empId = document.getElementById("matt-emp-filter")
      ? document.getElementById("matt-emp-filter").value
      : "";

    showLoading("جاري تحميل تقرير الحضور...");
    _gsr(
      "getMonthlyAttendanceReport",
      { year: year, month: month, employee_id: empId },
      {
        label: "HR.getMonthlyAttendanceReport",
        onSuccess: function (result) {
          hideLoading();
          _renderMonthlyAttendanceReport(result.data, year, month);
        },
        onError: function (result) {
          hideLoading();
          NotificationEngine.error(result.message || "خطأ في تحميل البيانات");
        },
      },
    );
  }

  function _renderMonthlyAttendanceReport(data, year, month) {
    var container = document.getElementById("matt-results");
    if (!container || !data || !data.length) {
      if (container)
        container.innerHTML =
          '<div class="empty-state"><div class="empty-icon"></div><p>' +
          I18N.t("HR_NO_DATA_FOR_PERIOD") +
          "</p></div>";
      return;
    }

    // Summary cards
    var totalPresent = 0,
      totalAbsent = 0,
      totalLate = 0,
      totalOvertime = 0;
    data.forEach(function (emp) {
      totalPresent += emp.present_days || 0;
      totalAbsent += emp.absent_days || 0;
      totalLate += emp.late_days || 0;
      totalOvertime += emp.overtime_days || 0;
    });

    var monthName = DateEngine.monthName(new Date(year, month - 1, 1), true);

    var html =
      '<div style="margin-bottom:20px">' +
      '<h3 style="margin:0 0 16px;color:var(--text)">تقرير الحضور — ' +
      monthName +
      "</h3>" +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">' +
      _attSummaryCard("حضور", totalPresent, "#d1fae5", "#065f46", "ti-check") +
      _attSummaryCard("غياب", totalAbsent, "#fee2e2", "#991b1b", "ti-x") +
      _attSummaryCard(
        "تأخير",
        totalLate,
        "#fef3c7",
        "#92400e",
        "ti-clock-exclamation",
      ) +
      _attSummaryCard("إضافي", totalOvertime, "#ede9fe", "#5b21b6", "ti-star") +
      "</div>" +
      "</div>" +
      '<div class="table-wrap">' +
      '<table class="table"><thead><tr>' +
      "<th>' + I18N.t('HR_EMPLOYEE') + '</th><th>' + I18N.t('HR_WORKING_DAYS') + '</th>" +
      '<th style="color:#059669">' +
      I18N.t("HR_ATTENDANCE_CHECK") +
      "</th>" +
      '<th style="color:#dc2626">' +
      I18N.t("HR_ABSENT_CROSS") +
      "</th>" +
      '<th style="color:#d97706">' +
      I18N.t("HR_LATE_ICON") +
      "</th>" +
      '<th style="color:#7c3aed">' +
      I18N.t("HR_OVERTIME_STAR") +
      "</th>" +
      "<th>' + I18N.t('HR_OVERTIME_HOURS') + '</th>" +
      "<th>' + I18N.t('HR_ATTENDANCE_RATE') + '</th>" +
      "</tr></thead><tbody>";

    data.forEach(function (emp) {
      var total = (emp.present_days || 0) + (emp.absent_days || 0);
      var pct =
        total > 0 ? Math.round(((emp.present_days || 0) / total) * 100) : 0;
      var pctColor =
        pct >= 90
          ? "var(--success)"
          : pct >= 75
            ? "var(--warning)"
            : "var(--danger)";
      html +=
        "<tr>" +
        "<td><strong>" +
        esc(emp.employee_name || "") +
        "</strong><br><small class='mono' style='color:var(--text3)'>" +
        esc(emp.employee_number || "") +
        "</small></td>" +
        "<td>" +
        (emp.working_days || 0) +
        "</td>" +
        "<td><strong style='color:#059669'>" +
        (emp.present_days || 0) +
        "</strong></td>" +
        "<td><strong style='color:#dc2626'>" +
        (emp.absent_days || 0) +
        "</strong></td>" +
        "<td><strong style='color:#d97706'>" +
        (emp.late_days || 0) +
        "</strong></td>" +
        "<td><strong style='color:#7c3aed'>" +
        (emp.overtime_days || 0) +
        "</strong></td>" +
        "<td>" +
        (emp.overtime_hours || 0) +
        " ساعة</td>" +
        "<td><div style='display:flex;align-items:center;gap:8px'>" +
        "<div style='flex:1;height:6px;background:var(--border);border-radius:3px'><div style='width:" +
        pct +
        "%;height:100%;background:" +
        pctColor +
        ";border-radius:3px'></div></div>" +
        "<span style='font-weight:700;color:" +
        pctColor +
        ";font-size:12px'>" +
        pct +
        "%</span>" +
        "</div></td>" +
        "</tr>";
    });

    html += "</tbody></table></div>";
    container.innerHTML = html;
  }

  function _attSummaryCard(label, value, bg, color, icon) {
    return (
      '<div style="background:' +
      bg +
      ';border-radius:12px;padding:14px;text-align:center">' +
      '<i class="ti ' +
      icon +
      '" style="font-size:20px;color:' +
      color +
      '"></i>' +
      '<div style="font-size:22px;font-weight:800;color:' +
      color +
      ';margin:4px 0">' +
      value +
      "</div>" +
      '<div style="font-size:11px;color:' +
      color +
      ';opacity:.7">' +
      label +
      "</div>" +
      "</div>"
    );
  }

  // ═══════════════════════════════════════════════════════════════
  // §HR-12  [NEW] Leave Balance — رصيد الإجازات
  // ═══════════════════════════════════════════════════════════════

  function bindLeaveBalance() {
    var empSelect = document.getElementById("lbal-emp-select");
    if (empSelect) {
      var opts =
        '<option value="">' + I18N.t("HR_CHOOSE_EMPLOYEE") + "</option>";
      (APP.data.employees || []).forEach(function (e) {
        if (e.status === "ACTIVE")
          opts +=
            '<option value="' + e.id + '">' + esc(e.full_name) + "</option>";
      });
      empSelect.innerHTML = opts;
      empSelect.addEventListener("change", function () {
        if (this.value) _loadLeaveBalance(this.value);
      });
      if (window.AppSelect) {
        AppSelect.upgrade("lbal-emp-select", {
          icon: "ti-user",
          searchable: true,
        });
      }
    }
  }

  function _loadLeaveBalance(empId) {
    var container = document.getElementById("lbal-results");
    if (container)
      container.innerHTML =
        '<p style="color:var(--text3);text-align:center">' +
        I18N.t("MSG_LOADING_ELLIPSIS") +
        "</p>";
    _gsr("getEmployeeLeaveBalance", [empId].concat(_authArgs()), {
      label: "HR.getEmployeeLeaveBalance",
      onSuccess: function (result) {
        _renderLeaveBalance(result.data);
      },
      onError: function (result) {
        NotificationEngine.error(result.message || "خطأ في تحميل البيانات");
      },
    });
  }

  function _renderLeaveBalance(data) {
    var container = document.getElementById("lbal-results");
    if (!container || !data) return;

    var emp = data.employee;
    var balances = data.balances || [];

    var html =
      // رأس بطاقة الموظف
      '<div style="display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;margin-bottom:20px">' +
      '<div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px">' +
      (emp.full_name ? emp.full_name[0] : "?") +
      "</div>" +
      '<div><strong style="display:block">' +
      esc(emp.full_name || "") +
      '</strong><small style="color:var(--text3)">' +
      esc(emp.department_name || "") +
      " | " +
      esc(emp.job_title_name || "") +
      "</small></div>" +
      "</div>";

    if (!balances.length) {
      html +=
        '<div class="empty-state"><p>' +
        I18N.t("HR_NO_LEAVE_DATA") +
        "</p></div>";
    } else {
      html +=
        '<div style="margin-bottom:8px"><strong style="font-size:13px;color:var(--text2)">رصيد الإجازات السنوي ' +
        DateEngine.currentYear() +
        "</strong></div>";
      balances.forEach(function (b) {
        var used = b.used_days || 0;
        var maxDays = b.max_days || 0;
        var remain = Math.max(0, maxDays - used);
        var pct = maxDays > 0 ? Math.min(100, (used / maxDays) * 100) : 0;
        var barColor =
          pct >= 90 ? "#ef4444" : pct >= 70 ? "#f59e0b" : "#10b981";
        html +=
          '<div class="leave-balance-item">' +
          '<div style="min-width:120px">' +
          '<div style="font-size:13px;font-weight:700;color:var(--text)">' +
          esc(b.leave_type_name) +
          "</div>" +
          '<div style="font-size:11px;color:var(--text3)">' +
          (b.is_paid === "TRUE" ? "مدفوعة" : "بدون راتب") +
          "</div>" +
          "</div>" +
          '<div class="leave-balance-bar">' +
          '<div class="leave-balance-bar-fill" style="width:' +
          pct +
          "%;background:" +
          barColor +
          '"></div>' +
          "</div>" +
          '<div class="leave-balance-numbers">' +
          '<span style="color:' +
          barColor +
          '">' +
          used +
          "</span>" +
          " / " +
          maxDays +
          " يوم" +
          '<br><small style="color:var(--text3)">متبقي: ' +
          remain +
          "</small>" +
          "</div>" +
          "</div>";
      });
    }

    container.innerHTML = html;
  }

  };
  window.ctx_terminateEmployee = function (id) {

  function _changeEmployeeStatus(id, newStatus) {
    var emp = (APP.data.employees || []).find(function (e) {
      return e.id === id;
    });
    if (!emp) return NotificationEngine.error("الموظف غير موجود");
    var labels = {
      ACTIVE: "نشط",
      SUSPENDED: "موقوف",
      TERMINATED: "منتهي الخدمة",
    };
    if (emp.status === newStatus)
      return NotificationEngine.info("الحالة هي " + labels[newStatus] + " بالفعل");
    showConfirm({
      title: "تغيير حالة الموظف",
      message:
        "تغيير حالة " +
        (emp.full_name || emp.name) +
        " إلى " +
        labels[newStatus] +
        "؟",
      icon: "ti-user-check",
      iconColor: "#2563eb",
      confirmText: "تغيير",
      confirmClass: "btn-primary",
      onConfirm: function () {
        showLoading && showLoading();
        _gsr(
          "updateEmployee",
          [{ id: id, status: newStatus }, APP.currentUser.username],
          {
            label: "HR.changeEmployeeStatus",
            onSuccess: function (result) {
              hideLoading && hideLoading();
              emp.status = newStatus;
              NotificationEngine.success("تم تغيير الحالة إلى " + labels[newStatus]);
              if (typeof renderPage === "function") renderPage(APP.currentPage);
            },
            onError: function (result) {
              hideLoading && hideLoading();
              NotificationEngine.error(result.message || "فشل تغيير الحالة");
            },
          },
        );
      },
    });
  }
