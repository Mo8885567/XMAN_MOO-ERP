<script>

  // (00_JS_DataLayer.html). مفيش أي google.script.run مباشر متبقي هنا.

  // HR Module Frontend Logic v2 (Drawer Edition)
  // ─────────────────────────────────────────────────────────────────
  // التغييرات في هذا الإصدار:
  //  1. كل openModal() في HR → openHRDrawer() (انبثاق من اليسار)
  //  2. تصميم HR Drawer مميز مع header ملوّن وأقسام
  //  3. [BUG FIX] _openLeaveTypeModal: إضافة var isEdit = !!editId
  //  4. [NEW] §HR-11 تقرير الغياب الشهري

  // ═══════════════════════════════════════════════════════════════
  // §HR-DRAWER  نظام الـ Drawer الخاص بـ HR
  // ═══════════════════════════════════════════════════════════════

  /**
   * HR Drawer — نافذة منبثقة من اليسار بتصميم مميز لـ HR
   * @param {object} opts
   *   opts.title      — عنوان الـ drawer
   *   opts.subtitle   — وصف ثانوي (اختياري)
   *   opts.icon       — كلاس أيقونة tabler (مثل "ti-user-plus")
   *   opts.color      — لون الـ header ("blue"|"green"|"amber"|"purple"|"rose"|"teal")
   *   opts.body       — HTML المحتوى
   *   opts.width      — عرض اختياري بالـ px (default 600)
   */
  var HR_COLORS = {
    blue: {
      bg: "#1d4ed8",
      soft: "#dbeafe",
      icon: "#1d4ed8",
      grad: "linear-gradient(135deg,#1d4ed8,#0ea5e9)",
    },
    green: {
      bg: "#065f46",
      soft: "#d1fae5",
      icon: "#059669",
      grad: "linear-gradient(135deg,#065f46,#10b981)",
    },
    amber: {
      bg: "#92400e",
      soft: "#fef3c7",
      icon: "#d97706",
      grad: "linear-gradient(135deg,#92400e,#f59e0b)",
    },
    purple: {
      bg: "#5b21b6",
      soft: "#ede9fe",
      icon: "#7c3aed",
      grad: "linear-gradient(135deg,#5b21b6,#a78bfa)",
    },
    rose: {
      bg: "#9f1239",
      soft: "#ffe4e6",
      icon: "#e11d48",
      grad: "linear-gradient(135deg,#9f1239,#f43f5e)",
    },
    teal: {
      bg: "#0f766e",
      soft: "#ccfbf1",
      icon: "#0d9488",
      grad: "linear-gradient(135deg,#0f766e,#2dd4bf)",
    },
  };

  function openHRDrawer(opts) {
    opts = opts || {};
    var color = HR_COLORS[opts.color] || HR_COLORS.blue;
    var width = opts.width || 600;

    // إغلاق أي drawer مفتوح
    closeDrawer(true);
    var ov = document.getElementById("modal-overlay");
    if (ov) ov.remove();

    // إخفاء FAB
    var fab = document.getElementById("ai-fab");
    if (fab) fab.style.display = "none";

    // Backdrop
    var bg = document.createElement("div");
    bg.id = "drawer-backdrop";
    bg.className = "drawer-backdrop";
    bg.onclick = function () {
      _closeHRDrawer();
    };
    document.body.appendChild(bg);

    // Drawer wrapper
    var drawer = document.createElement("div");
    drawer.id = "edit-drawer";
    drawer.className = "edit-drawer";
    drawer.style.cssText =
      "width:min(calc(var(--sidebar-w) + " + width + "px),100vw)";

    // Spacer (sidebar area)
    var spacer = document.createElement("div");
    spacer.style.cssText = "flex:0 1 var(--sidebar-w);min-width:0;height:100%";
    drawer.appendChild(spacer);

    // Inner panel
    var inner = document.createElement("div");
    inner.className = "edit-drawer-inner hr-drawer-inner";
    inner.style.cssText = "max-width:" + width + "px";

    // [FIX-STICKY-FOOTER] لو الـ body فيه <div class="hr-drawer-footer">
    // في آخره (زي ما بترجعها _hrFooter()) نفصله عن المحتوى القابل
    // للـ scroll ونحطه كعنصر شقيق مستقل بعد hr-drawer-body، عشان يفضل
    // ثابت تحت في الأسفل بدل ما يتحرك مع باقي الفورم عند الـ scroll.
    // (نفس الأسلوب المتبع فعلاً في openACDrawer بملف 16_JS_VodafoneCash.html)
    var bodyHtml = opts.body || "";
    var footerHtml = "";
    var footerMatch = bodyHtml.match(
      /<div class="hr-drawer-footer">[\s\S]*?<\/div>\s*$/,
    );
    if (footerMatch) {
      footerHtml = footerMatch[0];
      bodyHtml = bodyHtml.slice(0, footerMatch.index);
    }

    inner.innerHTML =
      // Header مميز
      '<div class="hr-drawer-header" style="background:' +
      color.grad +
      '">' +
      '<div class="hr-drawer-header-icon">' +
      '<i class="ti ' +
      (opts.icon || "ti-user") +
      '"></i>' +
      "</div>" +
      '<div class="hr-drawer-header-text">' +
      "<h2>" +
      (opts.title || "") +
      "</h2>" +
      (opts.subtitle ? "<p>" + opts.subtitle + "</p>" : "") +
      "</div>" +
      '<button class="hr-drawer-close" onclick="_closeHRDrawer()" title="' +
      I18N.t("BTN_CLOSE") +
      '">' +
      '<i class="ti ti-x"></i>' +
      "</button>" +
      "</div>" +
      // Body (قابل للـ scroll فقط)
      '<div class="hr-drawer-body">' +
      bodyHtml +
      "</div>" +
      // Footer ثابت في الأسفل (خارج المنطقة القابلة للـ scroll)
      footerHtml;

    drawer.appendChild(inner);
    document.body.appendChild(drawer);

    // حماية تلقائية لحقول الهاتف/الكود (مثل emp-d-phone) من فقدان الصفر الأول
    autoProtectTextNumberInputs(inner);

    // [SELECTION-ENGINE] openHRDrawer نظام منفصل عن openStyledDrawer
    // (Core_UIManagers.html) فمكانش بيستفيد من initCustomSelects تلقائيًا
    // زي باقي الشاشات — بنستدعيها هنا صراحة عشان كل select في فورمات HR
    // (الموظف/القسم/الوظيفة...) يتوحّد على نفس محرك AppSelect.
    if (typeof initCustomSelects === "function") initCustomSelects(inner);

    // ESC to close
    drawer._escHandler = function (e) {
      if (e.key === "Escape") _closeHRDrawer();
    };
    document.addEventListener("keydown", drawer._escHandler);
  }

  function _closeHRDrawer() {
    var fab = document.getElementById("ai-fab");
    if (fab) fab.style.display = "";
    var drawer = document.getElementById("edit-drawer");
    var bg = document.getElementById("drawer-backdrop");
    if (drawer) {
      if (drawer._escHandler)
        document.removeEventListener("keydown", drawer._escHandler);
      drawer.classList.add("drawer-closing");
      setTimeout(function () {
        if (drawer) drawer.remove();
      }, 240);
    }
    if (bg) {
      bg.style.transition = "opacity .22s";
      bg.style.opacity = "0";
      setTimeout(function () {
        if (bg) bg.remove();
      }, 220);
    }
  }

  // نعيد توجيه closeModal داخل HR للـ drawer أيضاً
  // (الدوال التانية في النظام تستخدم closeModal عادةً)
  function _hrCloseAll() {
    _closeHRDrawer();
    closeDrawer(true);
    var ov = document.getElementById("modal-overlay");
    if (ov) ov.remove();
  }

    var s = document.createElement("style");
    s.id = "hr-drawer-styles";
    s.textContent = [
      /* ── HR Drawer inner ── */
      ".hr-drawer-inner { background: var(--bg); display:flex; flex-direction:column; height:100%; overflow:hidden; pointer-events:all; }",

      /* ── Header ── */

      ".hr-drawer-header-icon { width:48px; height:48px; border-radius:14px; background:rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; flex-shrink:0; box-shadow:0 2px 12px rgba(0,0,0,0.15); }",

      ".hr-drawer-close:hover { background:rgba(255,255,255,0.32); }",

      /* ── Body ── */
      ".hr-drawer-body { flex:1; overflow-y:auto; padding:24px; }",
      ".hr-drawer-body::-webkit-scrollbar { width:5px; }",
      ".hr-drawer-body::-webkit-scrollbar-track { background:transparent; }",
      ".hr-drawer-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }",

      /* ── HR Section titles ── */
      ".hr-section { margin-bottom:24px; }",
      ".hr-section-title { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.8px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); }",

      /* ── HR Field rows ── */
      ".hr-form-row { display:grid; gap:14px; margin-bottom:14px; }",
      ".hr-form-row.cols-2 { grid-template-columns:1fr 1fr; }",
      ".hr-form-row.cols-3 { grid-template-columns:1fr 1fr 1fr; }",
      ".hr-field label { display:block; font-size:11.5px; font-weight:600; color:var(--text2); margin-bottom:5px; }",
      ".hr-field input, .hr-field textarea { width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text); font-size:13.5px; transition:border-color .15s; box-sizing:border-box; }",
      /* [DROPDOWN-UNIFY] نفس recipe الـ select.form-control الموحّد في
         Style.html (appearance:none + سهم SVG مخصص) — كان select هنا شكله
         Native افتراضي من المتصفح بدون أي تنسيق. أي select جديد بالنظام

      ".hr-field select { width:100%; padding:9px 12px 9px 30px; border:1.5px solid var(--border); border-radius:10px; background-color:var(--surface); color:var(--text); font-size:13.5px; transition:border-color .15s; box-sizing:border-box; cursor:pointer; appearance:none; -webkit-appearance:none; background-image:url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23a0aec0%27 stroke-width=%272.5%27%3E%3Cpolyline points=%276 9 12 15 18 9%27%3E%3C/polyline%3E%3C/svg%3E'); background-repeat:no-repeat; background-position:left 10px center; }",
      /* [SELECT-ARROW-FIX-HR / 2026-07-27] هذه recipe قديمة سابقة على

      ".att-day-card.absent  { background:#fee2e2; border-color:#fca5a5; color:#991b1b; }",
      ".att-day-card.late    { background:#fef3c7; border-color:#fde68a; color:#92400e; }",
      ".att-day-card.overtime{ background:#ede9fe; border-color:#ddd6fe; color:#5b21b6; }",
      ".att-day-card.holiday { background:var(--surface2); color:var(--text3); }",

      ".leave-balance-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }",
      ".leave-balance-item:last-child { border-bottom:none; }",

  // §HR-01  HR Dashboard
  // ═══════════════════════════════════════════════════════════════

  // ─────────────────────────────────────────────────────────────
  // [PERF-HR-DASH] Background Prefetch لإحصائيات لوحة HR
  //
  // السبب الجذري للتأخير: bindHRDashboard() كان بينادي
  // getHRDashboardStats() مباشرة من الـ Backend في كل مرة تُفتح
  // الشاشة (مرتبط بالضغط على الـ sidebar)، والدالة كانت تقرا 4 شيتات
  // كاملة من جديد كل مرة. الحل: تحميل في الخلفية بعد تسجيل الدخول
  // (بنفس توقيت _silentPrefetchExtended) + كاش جلسة 90 ثانية على
  // العميل + كاش Server-side 90 ثانية (HR_DASH_CACHE_KEY في Code.js)
  // يُسقَط تلقائياً مع أي تعديل حضور/إجازة/سلفة عبر _invalidateExtCache.
  // ─────────────────────────────────────────────────────────────
  var HR_DASH_SESSION_KEY = "wms_hrdash_cache_v1";
  var HR_DASH_SESSION_TTL = 90000; // 90 ثانية — يطابق مدة كاش الـ Server

  function _loadHRDashCache() {
    try {
      var raw = sessionStorage.getItem(HR_DASH_SESSION_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (Date.now() - obj.ts > HR_DASH_SESSION_TTL) return null;
      return obj.data;
    } catch (e) {
      return null;
    }
  }

  function _saveHRDashCache(data) {
    try {
      sessionStorage.setItem(
        HR_DASH_SESSION_KEY,
        JSON.stringify({ data: data, ts: Date.now() }),
      );
    } catch (e) {}
  }

  /** يُستدعى من doLogin بعد تسجيل الدخول بثوانٍ قليلة — تحميل صامت بدون UI */
  function _silentPrefetchHRDash() {
    if (APP._hrDashLoading) return;
    APP._hrDashLoading = true;
    DL.HR.getDashboardStats({
      onSuccess: function (result) {
        APP._hrDashLoading = false;
        _saveHRDashCache(result.data);
      },
      onError: function () {
        APP._hrDashLoading = false;
      },
    });
  }

  function bindHRDashboard() {
    // [PERF-HR-DASH] لو فيه كاش طري — اعرضه فوراً بدون أي وميض/تحميل،
    // ثم حدّث في الخلفية بصمت بدون لمس الـ UI لو الأرقام لسه نفسها.
    var cached = _loadHRDashCache();
    if (cached) {
      _renderHRDashboard(cached);
      DL.HR.getDashboardStats({
        onSuccess: function (result) {
          _saveHRDashCache(result.data);
          _renderHRDashboard(result.data);
        },
        onError: function () {},
      });
      return;
    }
    // [FIX-HR-DASHBOARD] إضافة loading state + معالجة صريحة لـ success=false
    var statIds = [
      "hr-stat-total",
      "hr-stat-active",
      "hr-stat-present",
      "hr-stat-absent",
      "hr-stat-pending-leaves",
      "hr-stat-pending-loans",
    ];
    statIds.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        el.textContent = "...";
        el.style.opacity = "0.4";
      }
    });
    DL.HR.getDashboardStats({
      onSuccess: function (result) {
        statIds.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.style.opacity = "1";
        });
        _saveHRDashCache(result.data);
        _renderHRDashboard(result.data);
      },
      onError: function (result) {
        statIds.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) {
            el.style.opacity = "1";
            el.textContent = "—";
          }
        });
        NotificationEngine.error("خطأ في تحميل إحصائيات HR: " + (result.message || "خطأ"));
      },
    });
  }

  function _renderHRDashboard(stats) {
    var ids = {
      "hr-stat-total": stats.total_employees || 0,
      "hr-stat-active": stats.active_employees || 0,
      "hr-stat-present": stats.present_today || 0,
      "hr-stat-absent": stats.absent_today || 0,
      "hr-stat-pending-leaves": stats.pending_leaves || 0,
      "hr-stat-pending-loans": stats.pending_loans || 0,
    };
    Object.keys(ids).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = ids[id];
    });
    var el = document.getElementById("hr-stat-avg-salary");
    if (el)
      el.textContent = formatMoney(stats.avg_basic_salary || 0, {
        decimals: 0,
      });

    // ── ملء جدول الحضور اليوم ──
    var tbody = document.getElementById("hr-today-attendance");
    if (!tbody) return;
    var rows = stats.today_attendance || [];
    if (!rows.length) {
      tbody.innerHTML =
        '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text3)">' +
        '<i class="ti ti-calendar-off" style="font-size:24px;display:block;margin-bottom:6px"></i>' +
        "لا توجد سجلات حضور اليوم" +
        "</td></tr>";
      return;
    }
    var statusLabels = {
      PRESENT: { label: "حاضر", color: "#10b981", bg: "rgba(16,185,129,.1)" },
      LATE: { label: "متأخر", color: "#f59e0b", bg: "rgba(245,158,11,.1)" },
      ABSENT: { label: "غائب", color: "#ef4444", bg: "rgba(239,68,68,.1)" },
      LEAVE: { label: "إجازة", color: "#6366f1", bg: "rgba(99,102,241,.1)" },
      HOLIDAY: { label: "عطلة", color: "#8b5cf6", bg: "rgba(139,92,246,.1)" },
    };
    tbody.innerHTML = rows
      .map(function (r) {
        var st = statusLabels[r.status] || {
          label: r.status,
          color: "#6b7280",
          bg: "rgba(107,114,128,.1)",
        };
        return (
          "<tr data-id='" +
          esc(e.id) +
          "'>" +
          "<td>" +
          esc(r.employee_name) +
          "</td>" +
          "<td>" +
          (r.check_in
            ? '<span style="color:var(--success);font-weight:600">' +
              fmtTime(r.check_in) +
              "</span>"
            : '<span style="color:var(--text3)">—</span>') +
          "</td>" +
          "<td>" +
          (r.check_out
            ? '<span style="color:var(--text2)">' +
              fmtTime(r.check_out) +
              "</span>"
            : '<span style="color:var(--text3)">—</span>') +
          "</td>" +
          '<td><span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;color:' +
          st.color +
          ";background:" +
          st.bg +
          '">' +
          st.label +
          "</span></td>" +
          "</tr>"
        );
      })
      .join("");
  }

  function _authPayload(payload) {
    if (!payload) payload = {};
    payload.callerUser = APP.currentUser ? APP.currentUser.username : null;
    payload.sessionToken = SESSION ? SESSION.token : null;
    return payload;
  }
  function _authArgs() {
    return [
      APP.currentUser ? APP.currentUser.username : null,
      SESSION ? SESSION.token : null,
    ];
  }

  function _renderDepartmentsTable(departments) {
    var wrap = document.getElementById("dept-table-wrap");
    if (!wrap) return;
    if (!departments || !departments.length) {
      wrap.innerHTML =
        '<div class="empty-state"><div class="empty-icon"></div><p>' +
        I18N.t("HR_NO_DEPARTMENTS") +
        "</p></div>";
      return;
    }
    var deptMap = {};
    departments.forEach(function (d) {
      deptMap[d.id] = d;
    });
    var rows = departments.map(function (d) {
      return Object.assign({}, d, {
        parent_name:
          d.parent_id && deptMap[d.parent_id] ? deptMap[d.parent_id].name : "—",
      });
    });
    _registerDepartmentColumns();
    ColumnEngine.renderTable("departments", wrap, rows, {});
  }

  function _openDepartmentDrawer(editId) {
    var isEdit = !!editId;
    var dept = isEdit
      ? (APP.data.departments || []).find(function (d) {
          return d.id === editId;
        })
      : null;

    var parentOptions =
      '<option value="">' + I18N.t("HR_NO_PARENT") + "</option>";
    (APP.data.departments || []).forEach(function (d) {
      if (d.id !== editId)
        parentOptions +=
          '<option value="' +
          d.id +
          '"' +
          (dept && dept.parent_id === d.id ? " selected" : "") +
          ">" +
          esc(d.name) +
          "</option>";
    });

    var body =
      '<div class="hr-section">' +
      '<div class="hr-section-title">' +
      I18N.t("HR_DEPARTMENT_DATA") +
      "</div>" +
      '<div class="hr-form-row cols-2">' +
      '<div class="hr-field"><label>' +
      I18N.t("HR_CODE_REQ") +
      '</label><input type="text" id="dept-d-code" data-allow-alpha="true" value="' +
      (dept ? esc(dept.code) : "") +
      '"></div>' +
      '<div class="hr-field"><label>' +
      I18N.t("LBL_NAME_REQ") +
      '</label><input type="text" id="dept-d-name" value="' +
      (dept ? esc(dept.name) : "") +
      '"></div>' +
      "</div>" +
      '<div class="hr-form-row cols-2">' +
      '<div class="hr-field"><label>' +
      I18N.t("HR_PARENT_DEPARTMENT") +
      '</label><select id="dept-d-parent">' +
      parentOptions +
      "</select></div>" +
      '<div class="hr-field"><label>' +
      I18N.t("HR_BRANCH") +
      '</label><input type="text" id="dept-d-branch" value="' +
      (dept ? esc(dept.branch || "") : "") +
      '"></div>' +
      "</div>" +
      '<div class="hr-form-row">' +
      '<div class="hr-field"><label>' +
      I18N.t("LBL_NOTES") +
      '</label><textarea id="dept-d-notes">' +
      (dept ? esc(dept.notes || "") : "") +
      "</textarea></div>" +
      "</div>" +
      "</div>" +
      _hrFooter("dept-d-save", isEdit ? "تحديث القسم" : "إضافة القسم");

    openHRDrawer({
      title: isEdit ? "تعديل قسم" : "قسم جديد",
      subtitle: isEdit ? "تعديل بيانات القسم الحالي" : "إضافة قسم تنظيمي جديد",
      icon: "ti-building",
      color: "blue",
      width: 860,
      body: body,
    });

    // [AUTO-CODE] كود القسم تسلسلي تلقائي (1، 2، 3...) لقسم جديد.
    if (!isEdit) {
      var deptCodeEl = document.getElementById("dept-d-code");
      if (deptCodeEl) {
        deptCodeEl.value = "…";
        deptCodeEl.readOnly = true;
        // [SE-ROLLOUT] عبر _gsr بدل google.script.run المباشر — Rule 9/10
        if (typeof _gsr === "function") {
          _gsr("getNextDepartmentCode", [], {
            label: "getNextDepartmentCode",
            onSuccess: function (res) {
              if (deptCodeEl) deptCodeEl.value = (res && res.data) || "";
            },
            onError: function () {
              if (deptCodeEl) deptCodeEl.value = "";
            },
          });
        }
      }
    }

    document
      .getElementById("dept-d-save")
      .addEventListener("click", function () {
        var fn = isEdit ? "updateDepartment" : "addDepartment";
        SaveEngine.run({
          screen: "HR.Department",
          entity: "department",
          recordId: editId || null,
          buttonId: "dept-d-save",
          rules: [
            { field: "dept-d-code", required: true, label: "الكود" },
            { field: "dept-d-name", required: true, label: "الاسم" },
          ],
          collect: function () {
            return {
              code: document.getElementById("dept-d-code").value.trim(),
              name: document.getElementById("dept-d-name").value.trim(),
              parent_id: document.getElementById("dept-d-parent").value,
              branch: document.getElementById("dept-d-branch").value.trim(),
              notes: document.getElementById("dept-d-notes").value.trim(),
            };
          },
          fn: fn,
          params: function (data) {
            return isEdit ? [editId, _authPayload(data)] : [_authPayload(data)];
          },
          onSuccess: function () {
            _hrCloseAll();
            _loadDepartments();
          },
        });
      });
  }

  function bindEmployees() {
    // [DATA-LOADING-ENGINE] الجدول لسه فاضي وقت أول فتح للشاشة (لحد ما
    // ensureExtendedData يخلّص) — نعرض skeleton بدل الفراغ/الفلاش المفاجئ،
    // نفس النمط المستخدم في 18_JS_Reports.html._loadingSpinner
    if (typeof ScreenLoader !== "undefined" && !(APP.data.employees && APP.data.employees.length)) {
      var wrapEl = document.getElementById("emp-table-wrap");
      if (wrapEl) ScreenLoader.renderSkeleton(wrapEl, "table");
    }
    ensureExtendedData(function () {
      _renderEmployeesTable(APP.data.employees || []);
    });
    var btnAdd = document.getElementById("emp-btn-add");
    if (btnAdd)
      btnAdd.addEventListener("click", function () {
        _openEmployeeDrawer();
      });
    var btnImport = document.getElementById("emp-btn-import");
    if (btnImport)
      btnImport.addEventListener("click", function () {
        _empImpOpen();
      });

    var search = document.getElementById("emp-search");
    var filter = document.getElementById("emp-filter-status");
    function doFilter() {
      var q = search ? search.value.toLowerCase() : "";
      var st = filter ? filter.value : "";
      var rows = (APP.data.employees || []).filter(function (e) {
        return (
          (!q ||
            (e.full_name || "").toLowerCase().includes(q) ||
            (e.employee_number || "").toLowerCase().includes(q)) &&
          (!st || e.status === st)
        );
      });
      _renderEmployeesTable(rows);
    }
    if (search) search.addEventListener("input", doFilter);
    if (filter) filter.addEventListener("change", doFilter);

    if (window.AppSelect) {
      AppSelect.upgrade("emp-filter-status", { icon: "ti-user-check" });
    }
  }

  function _empImpProcessFile(file) {
    var ext = file.name.split(".").pop().toLowerCase();
    if (["csv", "xlsx", "xls"].indexOf(ext) === -1) {
      NotificationEngine.error("صيغة الملف غير مدعومة. يقبل فقط: CSV, XLSX, XLS");
      return;
    }
    EMPIMP.file = file;
    EMPIMP.fileType = ext;
    document.getElementById("empimp-file-name").textContent = file.name;
    document.getElementById("empimp-file-meta").textContent =
      _fmtFileSize(file.size) + " · " + ext.toUpperCase();
    document.getElementById("empimp-file-info").style.display = "flex";
    document.getElementById("empimp-drop").style.display = "none";
    document.getElementById("empimp-btn-next1").disabled = false;
  }

    EMPIMP.file = null;
    EMPIMP.fileType = null;
    document.getElementById("empimp-file-info").style.display = "none";
    document.getElementById("empimp-drop").style.display = "";
    document.getElementById("empimp-file-input").value = "";
    document.getElementById("empimp-btn-next1").disabled = true;
  }

  /** قراءة الملف المختار (CSV أو Excel) إلى مصفوفة مصفوفات */
  function _empImpReadFile(callback) {
    var ext = EMPIMP.fileType;
    var reader = new FileReader();
    if (ext === "csv") {
      reader.onload = function (e) {
        callback(null, _parseCSVText(e.target.result));
      };
      reader.onerror = function () {
        callback("خطأ في قراءة الملف");
      };
      reader.readAsText(EMPIMP.file, "UTF-8");
    } else {
      reader.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, { type: "array" });
          var ws = wb.Sheets[wb.SheetNames[0]];
          var json = XLSX.utils.sheet_to_json(ws, {
            header: 1,
            raw: false,
            dateNF: "YYYY-MM-DD",
          });
          callback(null, json);
        } catch (err) {
          callback("خطأ في قراءة ملف Excel: " + err.message);
        }
      };
      reader.onerror = function () {
        callback("خطأ في قراءة الملف");
      };
      reader.readAsArrayBuffer(EMPIMP.file);
    }
  }

  function _empImpGuessMapping() {
    var mapping = {};
    EMPIMP.rawHeaders.forEach(function (h, colIdx) {
      var hLower = String(h || "")
        .trim()
        .toLowerCase();
      if (!hLower) return;
      EMPIMP.FIELDS.forEach(function (f) {
        if (mapping[f.key] !== undefined) return;
        var candidates = EMPIMP.GUESS[f.key] || [];
        var matched = candidates.some(function (c) {
          return hLower.indexOf(c.toLowerCase()) !== -1;
        });
        if (matched) mapping[f.key] = String(colIdx);
      });
    });
    return mapping;
  }

  function _empImpGoMapping() {
    showLoading("جاري قراءة الملف...");
    _empImpReadFile(function (err, rows) {
      hideLoading();
      if (err) {
        NotificationEngine.error(err);
        return;
      }
      if (!rows || rows.length < 2) {
        NotificationEngine.error("الملف فارغ أو لا يحتوي بيانات كافية");
        return;
      }
      EMPIMP.rawHeaders = rows[0];
      EMPIMP.rawRows = rows.slice(1).filter(function (r) {
        return r.some(function (c) {
          return String(c || "").trim();
        });
      });
      EMPIMP.mapping = _empImpGuessMapping();
      EMPIMP.step = 2;
      _empImpRenderMapping();
    });
  }

  function _empImpRenderMapping() {
    var colOptions =
      '<option value="">' + I18N.t("HR_IGNORE_DASH") + "</option>";
    EMPIMP.rawHeaders.forEach(function (h, i) {
      colOptions +=
        '<option value="' +
        i +
        '">' +
        esc(h || "عمود " + (i + 1)) +
        "</option>";
    });

    var fieldsHtml = EMPIMP.FIELDS.map(function (f) {
      var sel = EMPIMP.mapping[f.key];
      var opts = colOptions.replace(
        'value="' + sel + '"',
        'value="' + sel + '" selected',
      );
      return (
        '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2)">' +
        '<div style="flex:1;font-weight:600">' +
        esc(f.label) +
        (f.required ? ' <span style="color:var(--danger)">*</span>' : "") +
        "</div>" +
        '<select class="form-select empimp-map-select" data-field="' +
        f.key +
        '" style="flex:1">' +
        opts +
        "</select>" +
        "</div>"
      );
    }).join("");

    var html =
      '<div id="empimp-step2">' +
      '<p style="color:var(--text3);margin-bottom:10px">حدد العمود المناسب لكل حقل (' +
      EMPIMP.rawRows.length +
      " صف تم العثور عليها)</p>" +
      fieldsHtml +
      '<div style="margin-top:20px;display:flex;justify-content:space-between;gap:10px">' +
      '<button class="btn btn-secondary" onclick="_empImpBackToStep1()"><i class="ti ti-arrow-right"></i> ' +
      I18N.t("HR_PREVIOUS") +
      "</button>" +
      '<button class="btn btn-primary" onclick="_empImpGoPreview()">' +
      I18N.t("HR_NEXT_PREVIEW") +
      ' <i class="ti ti-arrow-left"></i></button>' +
      "</div>" +
      "</div>";

    var body = document.querySelector(".hr-drawer-body");
    if (body) body.innerHTML = html;

    document.querySelectorAll(".empimp-map-select").forEach(function (sel) {
      sel.addEventListener("change", function () {
        EMPIMP.mapping[sel.dataset.field] = sel.value;
      });
    });
  }

  function _empImpBackToStep1() {
    var body = document.querySelector(".hr-drawer-body");
    if (body) body.innerHTML = _empImpRenderStep1();
    document.getElementById("empimp-file-name").textContent = EMPIMP.file
      ? EMPIMP.file.name
      : "";
    if (EMPIMP.file) {
      document.getElementById("empimp-file-meta").textContent =
        _fmtFileSize(EMPIMP.file.size) + " · " + EMPIMP.fileType.toUpperCase();
      document.getElementById("empimp-file-info").style.display = "flex";
      document.getElementById("empimp-drop").style.display = "none";
      document.getElementById("empimp-btn-next1").disabled = false;
    }

  // [VALIDATION-FIX] نفس قواعد التحقق الموجودة في الباك إند
  // (importEmployeesBulk) بالظبط — عشان المستخدم يشوف الخطأ فوراً في
  // المعاينة بدل ما يستنى رحلة كاملة للسيرفر ويرجعله مرفوض
  // [VALID-UNIFY] استخدام VF.isValidEmail الموحّد بدل regex محلي مكرر —
  // نفس صيغة ValidationEngine.EMAIL_RX في الباك اند بالظبط.
  function _empImpValidDate(val) {
    if (!val) return true;
    var d = new Date(val);
    return !isNaN(d.getTime());
  }
  function _empImpValidEnum(val, allowed) {
    if (!val) return true;
    return allowed.indexOf(String(val).trim().toUpperCase()) !== -1;
  }
  var _empImpSeenNumbers = {};

  function _empImpGoPreview() {
    if (!EMPIMP.mapping.employee_number || !EMPIMP.mapping.full_name) {
      NotificationEngine.error("يجب ربط حقلي رقم الموظف والاسم على الأقل");
      return;
    }
    var mapped = [];
    var invalid = [];
    _empImpSeenNumbers = {};
    EMPIMP.rawRows.forEach(function (row, idx) {
      var obj = {};
      EMPIMP.FIELDS.forEach(function (f) {
        var colIdx = EMPIMP.mapping[f.key];
        obj[f.key] =
          colIdx !== undefined && colIdx !== ""
            ? String(row[colIdx] || "").trim()
            : "";
      });

      var rowNum = idx + 1;
      var reason = "";
      if (!obj.employee_number || !obj.full_name) {
        reason = "رقم الموظف أو الاسم مفقود";
      } else if (_empImpSeenNumbers[obj.employee_number]) {
        reason = "رقم الموظف (" + obj.employee_number + ") مكرر داخل الملف";
      } else if (obj.email && !VF.isValidEmail(obj.email)) {
        reason = "البريد الإلكتروني غير صحيح (" + obj.email + ")";
      } else if (!_empImpValidDate(obj.hire_date)) {
        reason = "تاريخ التعيين غير صحيح (" + obj.hire_date + ")";
      } else if (!_empImpValidDate(obj.birth_date)) {
        reason = "تاريخ الميلاد غير صحيح (" + obj.birth_date + ")";
      } else if (
        obj.basic_salary &&
        (isNaN(Number(obj.basic_salary)) || Number(obj.basic_salary) < 0)
      ) {
        reason = "الراتب الأساسي غير صحيح (" + obj.basic_salary + ")";
      } else if (!_empImpValidEnum(obj.gender, ["MALE", "FEMALE"])) {
        reason = "النوع غير صحيح (MALE أو FEMALE)";
      } else if (
        !_empImpValidEnum(obj.payment_method, [
          "CASH",
          "BANK",
          "VISA",
          "WALLET",
        ])
      ) {
        reason = "طريقة الدفع غير صحيحة (CASH/BANK/VISA/WALLET)";
      }

      if (reason) {
        invalid.push({ row: rowNum, reason: reason });
      } else {
        _empImpSeenNumbers[obj.employee_number] = true;
        mapped.push(obj);
      }
    });
    EMPIMP.mappedRows = mapped;
    EMPIMP.invalidRows = invalid;
    EMPIMP.step = 3;
    _empImpRenderPreview();
  }

                .getElementById("emp-d-bank-branch")

  function _loadEmpDocumentsTab(employeeId) {
    _gsr("getEmployeeDocuments", [employeeId], {
      label: "HR.getEmployeeDocuments",
      onSuccess: function (result) {
        var wrap = document.getElementById("emp-documents-list-wrap");
        if (!wrap) return;
        var docs = result.data || [];
        var html =
          '<div class="hr-section">' +
          '<div class="hr-section-title">' +
          I18N.t("HR_UPLOAD_NEW_DOCUMENT") +
          "</div>" +
          '<div class="hr-form-row cols-2">' +
          '<div class="hr-field"><label>' +
          I18N.t("HR_DOCUMENT_TYPE") +
          '</label><select id="emp-doc-type">' +
          Object.keys(DOC_TYPE_LABELS)
            .map(function (k) {
              return (
                '<option value="' + k + '">' + DOC_TYPE_LABELS[k] + "</option>"
              );
            })
            .join("") +
          "</select></div>" +
          '<div class="hr-field"><label>' +
          I18N.t("HR_TITLE_DESC") +
          '</label><input type="text" id="emp-doc-title"></div>' +
          "</div>" +
          '<div class="hr-form-row">' +
          '<div class="hr-field" style="flex:1"><label>' +
          I18N.t("HR_FILE") +
          '</label><input type="file" id="emp-doc-file" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.xlsx,.xls"></div>' +
          "</div>" +
          '<button class="btn btn-primary btn-sm" id="emp-doc-upload-btn" style="margin-top:6px"><i class="ti ti-upload"></i> ' +
          I18N.t("HR_UPLOAD") +
          "</button>" +
          "</div>" +
          '<div class="hr-section"><div class="hr-section-title">المستندات المرفوعة (' +
          docs.length +
          ")</div>" +
          (docs.length
            ? '<table class="table table-sm"><thead><tr><th>' +
              I18N.t("LBL_TYPE") +
              "</th><th>" +
              I18N.t("HR_TITLE_ADDR") +
              "</th><th>" +
              I18N.t("HR_FILE") +
              "</th><th></th></tr></thead><tbody>" +
              docs
                .map(function (d) {
                  // [ATTACHMENT-ENGINE-INTEGRATION] لو المرفق صورة (بالامتداد)،
                  // اعرض Thumbnail حقيقي (Placeholder→Thumbnail→Original عبر
                  // ImageEngine) بدل رابط نصي مجرد — بدون أي نداء سيرفر إضافي،
                  // فقط استغلال لرابط الملف الموجود أصلاً في d.file_url.
                  var _isImg = /\.(jpe?g|png|gif|webp)$/i.test(d.file_name || d.file_url || "");
                  var _thumbCell =
                    _isImg && typeof ImageEngine !== "undefined" && ImageEngine.thumbHtml
                      ? ImageEngine.thumbHtml(d.file_url, { size: 32 })
                      : "";
                  return (
                    "<tr><td>" +
                    (DOC_TYPE_LABELS[d.doc_type] || esc(d.doc_type)) +
                    "</td><td>" +
                    esc(d.title || "—") +
                    '</td><td style="display:flex;align-items:center;gap:6px">' +
                    _thumbCell +
                    '<a href="' +
                    esc(d.file_url) +
                    '" target="_blank">' +
                    esc(d.file_name || "فتح") +
                    "</a></td><td>" +
                    '<button class="btn btn-ghost btn-sm" onclick="_deleteEmpDocument(\'' +
                    d.id +
                    "', '" +
                    employeeId +
                    '\')"><i class="ti ti-trash"></i></button>' +
                    "</td></tr>"
                  );
                })
                .join("") +
              "</tbody></table>"
            : '<p style="color:var(--text3);font-size:13px">' +
              I18N.t("HR_NO_DOCUMENTS_YET") +
              "</p>") +
          "</div>";
        wrap.innerHTML = html;

        var uploadBtn = document.getElementById("emp-doc-upload-btn");
        if (uploadBtn)
          uploadBtn.addEventListener("click", function () {
            var fileInput = document.getElementById("emp-doc-file");
            var file = fileInput.files[0];
            if (!file) {
              NotificationEngine.error("اختر ملفًا أولاً");
              return;
            }
            var docType = document.getElementById("emp-doc-type").value;
            var title = document.getElementById("emp-doc-title").value.trim();
            var reader = new FileReader();
            uploadBtn.disabled = true;
            reader.onload = function () {
              var base64 = reader.result.split(",")[1];
              // [UNIFY-DATALAYER] استُبدل google.script.run المباشر بـ _gsr
              // مع rawResponse:true (uploadFile بترجع شكل رد مختلف عن
              // envelope الموحّد {success,data,message} — فيه viewUrl/fileName
              // على مستوى الجذر) — نفس منطق success/failure بالحرف.
              _gsr(
                "uploadFile",
                [
                  base64,
                  file.name,
                  file.type,
                  {
                    callerUser: APP.currentUser
                      ? APP.currentUser.username
                      : "admin",
                    userName: APP.currentUser
                      ? APP.currentUser.full_name || APP.currentUser.username
                      : "admin",
                    moduleName: "مستندات الموظفين",
                    sessionToken: SESSION ? SESSION.token : "",
                  },
                ],
                {
                  label: "HR.uploadFile",
                  rawResponse: true,
                  onSuccess: function (result) {
                    var resultStr = result.data;
                    var res =
                      typeof resultStr === "string"
                        ? JSON.parse(resultStr)
                        : resultStr;
                    if (res && res.success && res.viewUrl) {
                      _gsr(
                        "uploadEmployeeDocument",
                        [
                          _authPayload({
                            employee_id: employeeId,
                            doc_type: docType,
                            title: title,
                            file_url: res.viewUrl,
                            file_name: res.fileName || file.name,
                          }),
                        ],
                        {
                          label: "HR.uploadEmployeeDocument",
                          onSuccess: function () {
                            NotificationEngine.success("تم رفع المستند بنجاح");
                            _loadEmpDocumentsTab(employeeId);
                          },
                          onError: function (r) {
                            uploadBtn.disabled = false;
                            NotificationEngine.error(r.message || "خطأ");
                          },
                        },
                      );
                    } else {
                      uploadBtn.disabled = false;
                      NotificationEngine.error("فشل رفع الملف: " + ((res && res.error) || ""));
                    }
                  },
                  onError: function (err) {
                    uploadBtn.disabled = false;
                    NotificationEngine.error("فشل الاتصال: " + (err.message || err));
                  },
                },
              );
            };
            reader.readAsDataURL(file);
          });
      },
      onError: function (result) {
        NotificationEngine.error(result.message || "خطأ في تحميل المستندات");
      },
    });
  }

  // ═══════════════════════════════════════════════════════════════
  // [SALARY-COMPONENTS-P1] Tab: البدلات والخصومات الخاصة بالموظف
  // ═══════════════════════════════════════════════════════════════
  function _loadEmpAllowancesDeductionsTab(employeeId) {
    var wrap = document.getElementById("emp-allowances-deductions-wrap");
    if (!wrap) return;

    function _renderWith(components, allowances, deductions) {
      var allowanceComps = components.filter(function (c) {
        return c.component_group === "ALLOWANCE";
      });
      var deductionComps = components.filter(function (c) {
        return c.component_group === "DEDUCTION";
      });

      function _compOptions(list) {
        if (!list.length)
          return (
            '<option value="">' +
            I18N.t("HR_ADD_ITEM_FROM_SETTINGS_FIRST") +
            "</option>"
          );
        return list
          .map(function (c) {
            return '<option value="' + c.id + '">' + esc(c.name) + "</option>";
          })
          .join("");
      }

      function _rowsHtml(list, kind) {
        if (!list.length)
          return (
            '<p style="color:var(--text3);font-size:13px">لا توجد ' +
            (kind === "ALLOWANCE" ? "بدلات" : "خصومات") +
            " مسجّلة.</p>"
          );
        return (
          '<table class="table table-sm"><thead><tr><th>' +
          I18N.t("LBL_TYPE") +
          "</th><th>" +
          I18N.t("HR_VALUE") +
          "</th><th></th></tr></thead><tbody>" +
          list
            .map(function (r) {
              var typeLabel =
                kind === "ALLOWANCE" ? r.allowance_type : r.deduction_type;
              var valueLabel =
                r.is_percentage === "TRUE"
                  ? Number(
                      kind === "ALLOWANCE" ? r.percentage_value : r.amount,
                    ) + "%"
                  : formatMoney(r.amount || 0, { decimals: 0 });
              return (
                "<tr><td>" +
                esc(typeLabel) +
                "</td><td class='sensitive-balance'>" +
                valueLabel +
                "</td><td>" +
                '<button class="btn btn-ghost btn-sm" onclick="_deleteEmpSalaryItem(\'' +
                kind +
                "', '" +
                r.id +
                "', '" +
                employeeId +
                '\')"><i class="ti ti-trash"></i></button>' +
                "</td></tr>"
              );
            })
            .join("") +
          "</tbody></table>"
        );
      }

      var html =
        '<div class="hr-section">' +
        '<div class="hr-section-title">' +
        I18N.t("HR_ADD_ALLOWANCE") +
        "</div>" +
        '<div class="hr-form-row cols-2">' +
        '<div class="hr-field"><label>' +
        I18N.t("HR_ITEM") +
        '</label><select id="emp-alw-component">' +
        _compOptions(allowanceComps) +
        "</select></div>" +
        '<div class="hr-field"><label>' +
        I18N.t("LBL_TYPE") +
        '</label><select id="emp-alw-is-pct"><option value="FALSE">' +
        I18N.t("HR_FIXED_AMOUNT") +
        '</option><option value="TRUE">' +
        I18N.t("HR_PERCENT_OF_BASIC") +
        "</option></select></div>" +
        "</div>" +
        '<div class="hr-form-row cols-2">' +
        '<div class="hr-field"><label>' +
        I18N.t("HR_VALUE_REQ") +
        '</label><input type="number" id="emp-alw-value" step="0.01" placeholder="' +
        I18N.t("HR_PH_AMOUNT_OR_PERCENT") +
        '"></div>' +
        '<div class="hr-field"><label>' +
        I18N.t("HR_EFFECTIVE_DATE") +
        '</label><input type="date" id="emp-alw-date"></div>' +
        "</div>" +
        '<button class="btn btn-primary btn-sm" id="emp-alw-add-btn" style="margin-top:6px"' +
        (allowanceComps.length ? "" : " disabled") +
        '><i class="ti ti-plus"></i> ' +
        I18N.t("HR_ADD_ALLOWANCE") +
        "</button>" +
        "</div>" +
        '<div class="hr-section"><div class="hr-section-title">البدلات المسجّلة (' +
        allowances.length +
        ")</div>" +
        _rowsHtml(allowances, "ALLOWANCE") +
        "</div>" +
        '<div class="hr-section">' +
        '<div class="hr-section-title">' +
        I18N.t("HR_ADD_DEDUCTION") +
        "</div>" +
        '<div class="hr-form-row cols-2">' +
        '<div class="hr-field"><label>' +
        I18N.t("HR_ITEM") +
        '</label><select id="emp-ded-component">' +
        _compOptions(deductionComps) +
        "</select></div>" +
        '<div class="hr-field"><label>' +
        I18N.t("LBL_TYPE") +
        '</label><select id="emp-ded-is-pct"><option value="FALSE">' +
        I18N.t("HR_FIXED_AMOUNT") +
        '</option><option value="TRUE">' +
        I18N.t("HR_PERCENT_OF_BASIC") +
        "</option></select></div>" +
        "</div>" +
        '<div class="hr-form-row cols-2">' +
        '<div class="hr-field"><label>' +
        I18N.t("HR_VALUE_REQ") +
        '</label><input type="number" id="emp-ded-value" step="0.01" placeholder="' +
        I18N.t("HR_PH_AMOUNT_OR_PERCENT") +
        '"></div>' +
        '<div class="hr-field"><label>' +
        I18N.t("HR_EFFECTIVE_DATE") +
        '</label><input type="date" id="emp-ded-date"></div>' +
        "</div>" +
        '<button class="btn btn-primary btn-sm" id="emp-ded-add-btn" style="margin-top:6px"' +
        (deductionComps.length ? "" : " disabled") +
        '><i class="ti ti-plus"></i> ' +
        I18N.t("HR_ADD_DEDUCTION") +
        "</button>" +
        "</div>" +
        '<div class="hr-section"><div class="hr-section-title">الخصومات المسجّلة (' +
        deductions.length +
        ")</div>" +
        _rowsHtml(deductions, "DEDUCTION") +
        "</div>";

      wrap.innerHTML = html;

      var alwBtn = document.getElementById("emp-alw-add-btn");
      if (alwBtn)
        alwBtn.addEventListener("click", function () {
          SaveEngine.run({
            screen: "HR.EmployeeAllowance",
            entity: "employee_allowance",
            buttonId: "emp-alw-add-btn",
            rules: [
              { field: "emp-alw-component", required: true, label: "البند" },
              {
                test: function () {
                  return (
                    (parseFloat(
                      document.getElementById("emp-alw-value").value,
                    ) || 0) > 0
                  );
                },
                message: "البند والقيمة مطلوبان",
              },
            ],
            collect: function () {
              var componentId = document.getElementById("emp-alw-component")
                .value;
              var isPct =
                document.getElementById("emp-alw-is-pct").value === "TRUE";
              var value =
                parseFloat(document.getElementById("emp-alw-value").value) ||
                0;
              return {
                employee_id: employeeId,
                component_id: componentId,
                is_percentage: isPct,
                amount: isPct ? 0 : value,
                percentage_value: isPct ? value : 0,
                effective_date: document.getElementById("emp-alw-date")
                  .value,
              };
            },
            fn: "addEmployeeAllowance",
            params: function (data) {
              return [_authPayload(data)];
            },
            successMessage: "تمت إضافة البدل بنجاح",
            onSuccess: function () {
              _loadEmpAllowancesDeductionsTab(employeeId);
            },
          });
        });

      var dedBtn = document.getElementById("emp-ded-add-btn");
      if (dedBtn)
        dedBtn.addEventListener("click", function () {
          SaveEngine.run({
            screen: "HR.EmployeeDeduction",
            entity: "employee_deduction",
            buttonId: "emp-ded-add-btn",
            rules: [
              { field: "emp-ded-component", required: true, label: "البند" },
              {
                test: function () {
                  return (
                    (parseFloat(
                      document.getElementById("emp-ded-value").value,
                    ) || 0) > 0
                  );
                },
                message: "البند والقيمة مطلوبان",
              },
            ],
            collect: function () {
              return {
                employee_id: employeeId,
                component_id: document.getElementById("emp-ded-component")
                  .value,
                is_percentage:
                  document.getElementById("emp-ded-is-pct").value === "TRUE",
                // للخصومات: amount يمثّل النسبة أو المبلغ حسب is_percentage
                amount:
                  parseFloat(document.getElementById("emp-ded-value").value) ||
                  0,
                effective_date: document.getElementById("emp-ded-date")
                  .value,
              };
            },
            fn: "addEmployeeDeduction",
            params: function (data) {
              return [_authPayload(data)];
            },
            successMessage: "تمت إضافة الخصم بنجاح",
            onSuccess: function () {
              _loadEmpAllowancesDeductionsTab(employeeId);
            },
          });
        });
    }

    function _fetchAllowancesAndDeductions(components) {
      _gsr("getEmployeeAllowances", [employeeId], {
        label: "HR.getEmployeeAllowances",
        onSuccess: function (allowResult) {
          _gsr("getEmployeeDeductions", [employeeId], {
            label: "HR.getEmployeeDeductions",
            onSuccess: function (dedResult) {
              _renderWith(
                components,
                allowResult.data || [],
                dedResult.data || [],
              );
            },
            onError: function (r) {
              NotificationEngine.error(r.message || "خطأ في تحميل الخصومات");
            },
          });
        },
        onError: function (r) {
          NotificationEngine.error(r.message || "خطأ في تحميل البدلات");
        },
      });
    }

    if (APP.data.salaryComponents) {
      _fetchAllowancesAndDeductions(APP.data.salaryComponents);
    } else {
      _gsr("getSalaryComponents", [null], {
        label: "HR.getSalaryComponents",
        onSuccess: function (result) {
          APP.data.salaryComponents = result.data || [];
          _fetchAllowancesAndDeductions(APP.data.salaryComponents);
        },
        onError: function (r) {
          NotificationEngine.error(r.message || "خطأ في تحميل بنود الرواتب");
        },
      });
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // §HR-05  Attendance — الحضور والانصراف
  // ═══════════════════════════════════════════════════════════════

  // ── [ATT-CACHE] كاش بيانات الحضور في sessionStorage (3 دقائق) ──
  var _attCacheKey = "wms_att_cache_v1";
  var _attCacheTTL = 180000; // 3 دقائق

  function _attSaveCache(opts, data) {
    // نخزن فقط لو الـ opts فاضية (بدون فلاتر تاريخ)
    if (opts && (opts.from_date || opts.to_date)) return;
    try {
      sessionStorage.setItem(
        _attCacheKey,
        JSON.stringify({ data: data, ts: Date.now() }),
      );
    } catch (e) {}
  }

  function _attLoadCache() {
    try {
      var raw = sessionStorage.getItem(_attCacheKey);
      if (!raw) return null;
      var c = JSON.parse(raw);
      if (Date.now() - c.ts > _attCacheTTL) return null;
      return c.data;
    } catch (e) {
      return null;
    }
  }

  // [ATT-PRELOAD] يُستدعى بعد اللوجين لتحميل بيانات الحضور في الخلفية
  var _attPreloading = false;
  function _attPreload() {
    if (_attPreloading) return;
    var cached = _attLoadCache();
    if (cached) return; // كاش موجود — لا حاجة لطلب جديد
    _attPreloading = true;
    _gsr(
      "getAttendance",
      {},
      {
        label: "HR.attPreload",
        onSuccess: function (result) {
          _attPreloading = false;
          _attSaveCache({}, result.data);
        },
        onError: function () {
          _attPreloading = false;
        },
      },
    );
  }

  function bindAttendance() {
    // [ATT-CACHE] شيك الكاش أولاً فوراً بدون انتظار ensureExtendedData
    var cached = _attLoadCache();
    if (cached) {
      _renderAttendanceTable(cached);
      // حمّل ensureExtendedData + تحديث صامت في الخلفية
      ensureExtendedData(function () {
        setTimeout(function () {
          _loadAttendance({}, true);
        }, 400);
      });
    } else {
      // مفيش كاش — استنى ensureExtendedData ثم اجلب البيانات
      ensureExtendedData(function () {
        _loadAttendance({});
      });
    }

    var btnFilter = document.getElementById("att-btn-filter");
    if (btnFilter)
      btnFilter.addEventListener("click", function () {
        var from = document.getElementById("att-date-from");
        var to = document.getElementById("att-date-to");
        var opts = {};
        if (from && from.value) opts.from_date = from.value;
        if (to && to.value) opts.to_date = to.value;
        _loadAttendance(opts);
      });

    var btnAdd = document.getElementById("att-btn-add");
    if (btnAdd)
      btnAdd.addEventListener("click", function () {
        _openAttendanceDrawer();
      });

    // [DEAD-BTN-FIX] كان الزر ده موجود في الشاشة (Templates_09.html) بدون
    // أي ربط خالص — أضفنا الربط + دالة _exportAttendanceTable نفسها تحت.
    var btnExport = document.getElementById("att-btn-export");
    if (btnExport) btnExport.addEventListener("click", _exportAttendanceTable);

    // ── تبويب: سجلات / استيراد / سجل الاستيراد ──
    var attImportLoaded = false;
    var attLogLoaded = false;
    document
      .querySelectorAll("#att-mode-tabs .att-mode-btn")
      .forEach(function (tab) {
        tab.addEventListener("click", function () {
          document
            .querySelectorAll("#att-mode-tabs .att-mode-btn")
            .forEach(function (t) {
              t.classList.remove("active");
            });
          document
            .querySelectorAll(
              "#att-panel-manual, #att-panel-import, #att-panel-log",
            )
            .forEach(function (p) {
              p.classList.remove("active");
            });
          this.classList.add("active");
          var mode = this.dataset.mode;
          var panel = document.getElementById("att-panel-" + mode);
          if (panel) panel.classList.add("active");

          if (mode === "import" && !attImportLoaded) {
            attImportLoaded = true;
            var container = document.getElementById("att-import-container");
            if (container && typeof renderAttendanceImport === "function") {
              container.innerHTML = renderAttendanceImport();
              if (typeof bindAttendanceImport === "function")
                bindAttendanceImport();
            }
          }

          if (mode === "log" && !attLogLoaded) {
            attLogLoaded = true;
            var logContainer = document.getElementById("att-log-container");
            if (logContainer && typeof renderImportLog === "function") {
              logContainer.innerHTML = renderImportLog();
              if (typeof bindImportLog === "function") bindImportLog();
            }
          }
        });
      });
  }

    });

  function _renderAttendanceTable(records) {
    _attLastRecords = records || [];
    var wrap = document.getElementById("att-table-wrap");
    if (!wrap) return;

    // تحديث KPI cards
    var kpiPresent = 0,
      kpiAbsent = 0,
      kpiLate = 0,
      kpiOvertime = 0;
    if (records && records.length) {
      records.forEach(function (r) {
        if (r.status === "PRESENT") kpiPresent++;
        else if (r.status === "ABSENT") kpiAbsent++;
        else if (r.status === "LATE") kpiLate++;
        if (Number(r.overtime_hours || 0) > 0) kpiOvertime++;
      });
    }
    var kpis = {
      "kpi-present": kpiPresent,
      "kpi-absent": kpiAbsent,
      "kpi-late": kpiLate,
      "kpi-overtime": kpiOvertime,
    };
    Object.keys(kpis).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = kpis[id];
    });

    // تحديث عداد السجلات
    var countEl = document.getElementById("att-records-count");
    if (countEl) {
      countEl.style.display = records && records.length ? "flex" : "none";
      countEl.textContent = (records ? records.length : 0) + " سجل";
    }

    if (!records || !records.length) {
      wrap.innerHTML =
        '<div class="att-empty-state att-empty-large"><i class="ti ti-calendar-off"></i><p>' +
        I18N.t("HR_NO_RECORDS_FOR_PERIOD") +
        "</p></div>";
      return;
    }

    _registerAttendanceColumns();
    ColumnEngine.renderTable("attendance", wrap, records, {});
  }

  // [DEAD-BTN-FIX] دالة تصدير جدول الحضور الحالي (بعد الفلترة) لملف Excel —
  // نفس نمط SheetJS المستخدم في 07_JS_Shipping_Colors_Excel.html /
  // 16_JS_VodafoneCash.html، تحمّل المكتبة ديناميكيًا لو لسه مش محمّلة.
  function _exportAttendanceTable() {
    if (!_attLastRecords || !_attLastRecords.length) {
      NotificationEngine.warning("لا توجد سجلات لتصديرها");
      return;
    }
    function _doExport() {
      var STATUS_LBL = {
        PRESENT: "حاضر",
        ABSENT: "غائب",
        LATE: "متأخر",
        EARLY_LEAVE: "انصراف مبكر",
        OVERTIME: "وقت إضافي",
      };
      var headers = [
        "كود الموظف",
        "اسم الموظف",
        "التاريخ",
        "الحضور",
        "الانصراف",
        "ساعات العمل",
        "الوقت الإضافي",
        "دقائق التأخير",
        "الحالة",
      ];
      var rows = _attLastRecords.map(function (r) {
        return [
          r.employee_number || "",
          r.employee_name || "",
          fmtDate(r.date) || r.date || "",
          fmtTime(r.check_in) || "",
          fmtTime(r.check_out) || "",
          r.work_hours || 0,
          r.overtime_hours || 0,
          r.delay_minutes || 0,
          STATUS_LBL[r.status] || r.status || "",
        ];
      });
      var ws = XLSX.utils.aoa_to_sheet([headers].concat(rows));
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "الحضور");
      XLSX.writeFile(
        wb,
        "attendance_" + new Date().toISOString().slice(0, 10) + ".xlsx",
      );
    }
    if (typeof XLSX !== "undefined") {
      _doExport();
    } else if (typeof _loadSheetJS === "function") {
      _loadSheetJS(_doExport);
    } else {
      NotificationEngine.error("تعذّر تحميل مكتبة التصدير");
    }
  }

  // [UX-FIX] الشاشة كانت تفتح مفلترة على "معلق" بدون أي إشارة بصرية إن فيه
  // فلتر شغال — فكان يظهر للمستخدم وكأن البيانات "مش بتظهر" مع إنها موجودة
  // فعلاً لكنها مش PENDING. دلوقتي: نفتح على "الكل" بشكل افتراضي، ونلوّن
  // الزرار النشط بوضوح، ونعرض عدد الطلبات المعلّقة كـ badge على الزرار.
  function bindLeaveRequests() {
    ensureExtendedData(function () {
      _renderLeaveRequestsTable(_filterLeaveRequestsCache({}));
      _hrUpdateFilterBtn(
        "leave-btn-all",
        "leave-btn-pending",
        _filterLeaveRequestsCache({ status: "PENDING" }).length,
      );
    });
    var btnAll = document.getElementById("leave-btn-all");
    var btnPending = document.getElementById("leave-btn-pending");
    if (btnAll)
      btnAll.addEventListener("click", function () {
        _renderLeaveRequestsTable(_filterLeaveRequestsCache({}));
        btnAll.classList.add("active");
        if (btnPending) btnPending.classList.remove("active");
      });
    if (btnPending)
      btnPending.addEventListener("click", function () {
        _renderLeaveRequestsTable(
          _filterLeaveRequestsCache({ status: "PENDING" }),
        );
        btnPending.classList.add("active");
        if (btnAll) btnAll.classList.remove("active");
      });
    var btnAdd = document.getElementById("leave-btn-add");
    if (btnAdd)
      btnAdd.addEventListener("click", function () {
        _openLeaveRequestDrawer();
      });
  }

  /** [UX-FIX] دالة مشتركة: تفعّل زرار "الكل" بصرياً وتكتب عدد المعلّق على الزرار التاني */
  function _hrUpdateFilterBtn(allBtnId, pendingBtnId, pendingCount) {
    var allBtn = document.getElementById(allBtnId);
    var pendingBtn = document.getElementById(pendingBtnId);
    if (allBtn) allBtn.classList.add("active");
    if (pendingBtn) {
      pendingBtn.classList.remove("active");
      var baseLabel = pendingBtn.dataset.baseLabel || pendingBtn.textContent;
      pendingBtn.dataset.baseLabel = baseLabel;
      pendingBtn.innerHTML =
        baseLabel +
        (pendingCount
          ? ' <span class="hr-filter-badge">' + pendingCount + "</span>"
          : "");
    }
  }

  // [DATA-UNIFY] فلترة محلية من APP.data.leaveRequests (الحزمة الموسعة تجيبها كاملة)
  // بدل نداء getLeaveRequests(opts) لكل تبويب status
  function _filterLeaveRequestsCache(opts) {
    opts = opts || {};
    var rows = APP.data.leaveRequests || [];
    if (opts.status) {
      rows = rows.filter(function (r) {
        return r.status === opts.status;
      });
    }
    return rows;
  }

    opts = _authPayload(opts || {});

      onSuccess: function (result) {
        hideLoading();
        _renderLeaveRequestsTable(result.data);
      },
      onError: function (result) {
        hideLoading();
        NotificationEngine.error(result.message || "خطأ في تحميل البيانات");
      },
    });
  }

  // [UX-FIX] نفس إصلاح شاشة الإجازات — افتراضي "الكل" + تظليل التاب النشط + عداد
  function bindLoanRequests() {
    ensureExtendedData(function () {
      _renderLoanRequestsTable(_filterLoanRequestsCache({}));
      _hrUpdateFilterBtn(
        "loan-btn-all",
        "loan-btn-pending",
        _filterLoanRequestsCache({ status: "PENDING" }).length,
      );
    });
    var btnAll = document.getElementById("loan-btn-all");
    var btnPending = document.getElementById("loan-btn-pending");
    if (btnAll)
      btnAll.addEventListener("click", function () {
        _renderLoanRequestsTable(_filterLoanRequestsCache({}));
        btnAll.classList.add("active");
        if (btnPending) btnPending.classList.remove("active");
      });
    if (btnPending)
      btnPending.addEventListener("click", function () {
        _renderLoanRequestsTable(
          _filterLoanRequestsCache({ status: "PENDING" }),
        );
        btnPending.classList.add("active");
        if (btnAll) btnAll.classList.remove("active");
      });
    var btnAdd = document.getElementById("loan-btn-add");
    if (btnAdd)
      btnAdd.addEventListener("click", function () {
        _openLoanRequestDrawer();
      });
  }

  // [DATA-UNIFY] فلترة محلية من APP.data.loanRequests
  function _filterLoanRequestsCache(opts) {
    opts = opts || {};
    var rows = APP.data.loanRequests || [];
    if (opts.status) {
      rows = rows.filter(function (r) {
        return r.status === opts.status;
      });
    }
    return rows;
  }

  function _loadLoanRequests(opts) {
    opts = _authPayload(opts || {});
    showLoading("جاري تحميل السلف...");
    _gsr("getLoanRequests", opts, {
      label: "HR.getLoanRequests",
      onSuccess: function (result) {
        hideLoading();
        _renderLoanRequestsTable(result.data);
      },
      onError: function (result) {

        NotificationEngine.error(result.message || "خطأ في تحميل البيانات");
      },
    });
  }

  var _loanRequestColumnsRegistered = false;
  function _registerLoanRequestColumns() {
    if (_loanRequestColumnsRegistered) return;
    _loanRequestColumnsRegistered = true;
    var BADGES = {
      PENDING: "badge-warning|معلق",
      APPROVED: "badge-success|معتمد",
      REJECTED: "badge-danger|مرفوض",
      PAID_OFF: "badge-success|مسدد",
    };
    ColumnEngine.register(
      "loan_requests",
      [
        {
          key: "employee_name",
          label: "الموظف",
          type: "text",
          width: 160,
          frozen: "right",
          format: function (v) {
            return "<strong>" + esc(v || "") + "</strong>";
          },
        },
        {
          key: "amount",
          label: "المبلغ",
          type: "currency",
          width: 120,
          format: function (v) {
            return (
              "<span class='sensitive-balance'><strong>" +
              formatMoney(v || 0, { decimals: 0 }) +
              "</strong></span>"
            );
          },
        },
        {
          key: "reason",
          label: "السبب",
          type: "text",
          width: 180,
          format: function (v) {
            return esc(v || "—");
          },
        },
        {
          key: "status",
          label: "الحالة",
          type: "badge",
          width: 110,
          format: function (v) {
            var parts = (BADGES[v] || "badge-default|" + v).split("|");
            return (
              "<span class='badge " + parts[0] + "'>" + parts[1] + "</span>"
            );
          },
        },
        {
          key: "installments",
          label: "الأقساط",
          type: "custom",
          width: 160,
          format: function (v, row) {
            return (
              "<span class='sensitive-balance'>" +
              (row.installments || 0) +
              " شهر × " +
              formatMoney(row.monthly_amount || 0, { decimals: 0 }) +
              "</span>"
            );
          },
        },
        {
          key: "progress",
          label: "التقدم",
          type: "custom",
          width: 200,
          sortable: false,
          format: function (v, row) {
            var remaining = Number(row.remaining_amount || 0);
            var progress =
              row.amount > 0
                ? ((row.amount - remaining) / row.amount) * 100
                : 0;
            return (
              "<div style='background:var(--border);height:6px;border-radius:3px'><div style='width:" +
              progress +
              "%;height:100%;background:var(--success);border-radius:3px'></div></div><small class='sensitive-balance' style='color:var(--text3)'>" +
              (row.paid_installments || 0) +
              "/" +
              (row.installments || 0) +
              " — متبقي: " +
              formatMoney(remaining, { decimals: 0 }) +
              "</small>"
            );
          },
        },
      ],
      {
        title: "طلبات السلف",
        rowKey: "id",
        contextMenuType: "loan_requests", // نفس menuType المُسجَّل سابقًا لـ loan-table-body
      },
    );
  }

  function _registerPayrollPeriodColumns() {
    if (_payrollPeriodColumnsRegistered) return;
    _payrollPeriodColumnsRegistered = true;
    var BADGES = {
      DRAFT: "badge-warning|مسودة",
      APPROVED: "badge-success|معتمد",
      PAID: "badge-success|مصروف",
      CLOSED: "badge-default|مغلق",
    };
    ColumnEngine.register(
      "payroll_periods",
      [
        {
          key: "name",
          label: "الفترة",
          type: "text",
          width: 160,
          frozen: "right",
          format: function (v) {
            return "<strong>" + esc(v || "") + "</strong>";
          },
        },
        {
          key: "start_date",
          label: "التواريخ",
          type: "custom",
          width: 200,
          format: function (v, row) {
            return fmtDate(row.start_date) + " → " + fmtDate(row.end_date);
          },
        },
        {
          key: "status",
          label: "الحالة",
          type: "badge",
          width: 110,
          format: function (v) {
            var parts = (BADGES[v] || "badge-default|" + v).split("|");
            return (
              "<span class='badge " + parts[0] + "'>" + parts[1] + "</span>"
            );
          },
        },
        {
          key: "created_by",
          label: "أنشئ بواسطة",
          type: "text",
          width: 140,
          format: function (v) {
            return esc(v || "—");
          },
        },
        {
          key: "approved_at",
          label: "تاريخ الاعتماد",
          type: "custom",
          width: 140,
          format: function (v, row) {
            return row.approved_by ? fmtDate(row.approved_at) : "—";
          },
        },
      ],
      {
        title: "فترات الرواتب",
        rowKey: "id",
        contextMenuType: "payroll_periods", // نفس menuType المُسجَّل سابقًا لـ payroll-periods-body

  function _renderPayrollPeriods(periods) {
    var wrap = document.getElementById("payroll-periods-wrap");
    if (!wrap) return;
    if (!periods || !periods.length) {
      wrap.innerHTML =
        '<div class="empty-state"><div class="empty-icon"></div><p>' +
        I18N.t("HR_NO_PAYROLL_PERIODS") +
        "</p></div>";
      return;
    }
    _registerPayrollPeriodColumns();
    ColumnEngine.renderTable("payroll_periods", wrap, periods, {});

  function bindPayslip() {
    ensureExtendedData(function () {
      _bindPayslipInner();
    });
  }

  function _bindPayslipInner() {
    var empSelect = document.getElementById("payslip-emp-select");
    var periodSelect = document.getElementById("payslip-period-select");

    if (empSelect) {
      var empOptions =
        '<option value="">' + I18N.t("HR_CHOOSE_EMPLOYEE") + "</option>";
      (APP.data.employees || []).forEach(function (e) {
        if (e.status === "ACTIVE")
          empOptions +=
            '<option value="' +
            e.id +
            '">' +
            esc(e.full_name) +
            " (" +
            esc(e.employee_number || "") +
            ")</option>";
      });
      empSelect.innerHTML = empOptions;
    }
    if (periodSelect) {
      var periodOptions =
        '<option value="">' + I18N.t("HR_CHOOSE_PERIOD") + "</option>";
      (APP.data.payrollPeriods || []).forEach(function (p) {
        periodOptions +=
          '<option value="' + p.id + '">' + esc(p.name || "") + "</option>";
      });
      periodSelect.innerHTML = periodOptions;
    }

    if (window.AppSelect) {
      AppSelect.upgrade("payslip-emp-select", {
        icon: "ti-user",
        searchable: true,
      });
      AppSelect.upgrade("payslip-period-select", { icon: "ti-calendar" });
    }

    document
      .getElementById("payslip-btn-load")
      .addEventListener("click", function () {
        var empId = empSelect ? empSelect.value : "";
        var periodId = periodSelect ? periodSelect.value : "";
        if (!empId || !periodId) {
          NotificationEngine.error("اختر الموظف والفترة");
          return;
        }
        showLoading("جاري تحميل كشف الراتب...");
        _gsr("getPayslip", [periodId, empId].concat(_authArgs()), {
          label: "HR.getPayslip",
          onSuccess: function (result) {
            hideLoading();
            _renderPayslip(result.data);
          },
          onError: function (result) {
            hideLoading();
            NotificationEngine.error(result.message || "خطأ في تحميل البيانات");
          },
        });
      });
  }

      (data.social_insurance || 0) +
      (data.income_tax || 0) +

    var html =
      '<div class="payslip">' +
      '<div style="text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid var(--primary)">' +
      "<h2>' + I18N.t('HR_PAYSLIP') + '</h2>" +
      '<p style="font-size:18px;font-weight:700;color:var(--primary)">' +
      esc(data.period_name || "") +
      "</p>" +
      "<p>" +
      esc(data.employee.full_name || "") +
      ' | <span class="mono">' +
      esc(data.employee_number || "") +
      "</span></p>" +
      "</div>" +
      '<div style="margin-bottom:16px">' +
      '<h4 style="color:var(--success);margin-bottom:8px">' +
      I18N.t("HR_EARNINGS") +
      "</h4>" +
      '<div class="payslip-line"><span>' +
      I18N.t("HR_BASIC_SALARY") +
      '</span><span class="sensitive-balance">' +
      formatMoney(data.basic_salary || 0, { decimals: 0 }) +
      "</span></div>" +
      '<div class="payslip-line"><span>' +
      I18N.t("HR_ALLOWANCES") +
      '</span><span class="sensitive-balance text-success">+' +
      formatMoney(data.total_allowances || 0, { decimals: 0 }) +
      "</span></div>" +
      '<div class="payslip-line"><span>' +
      I18N.t("HR_OVERTIME_WORK") +
      '</span><span class="sensitive-balance text-success">+' +
      formatMoney(data.overtime_amount || 0, { decimals: 0 }) +
      "</span></div>" +
      '<div class="payslip-total" style="color:var(--success)"><strong>' +
      I18N.t("HR_TOTAL_EARNINGS") +
      '</strong><strong class="sensitive-balance">' +
      formatMoney(totalEarnings, { decimals: 0 }) +
      "</strong></div>" +
      "</div>" +
      '<div style="margin-bottom:16px">' +
      '<h4 style="color:var(--danger);margin-bottom:8px">' +
      I18N.t("HR_DEDUCTIONS_2") +
      "</h4>" +
      '<div class="payslip-line"><span>' +
      I18N.t("HR_DEDUCTIONS") +
      '</span><span class="sensitive-balance text-danger">-' +
      formatMoney(data.total_deductions || 0, { decimals: 0 }) +
      "</span></div>" +
      '<div class="payslip-line"><span>' +
      I18N.t("HR_SOCIAL_INSURANCE") +
      '</span><span class="sensitive-balance text-danger">-' +
      formatMoney(data.social_insurance || 0, { decimals: 0 }) +
      "</span></div>" +
      '<div class="payslip-line"><span>' +
      I18N.t("HR_INCOME_TAX") +
      '</span><span class="sensitive-balance text-danger">-' +
      formatMoney(data.income_tax || 0, { decimals: 0 }) +
      "</span></div>" +
      '<div class="payslip-line"><span>' +
      I18N.t("HR_LOAN_DEDUCTION") +

      "</span></div>" +
      '<div class="payslip-total" style="color:var(--danger)"><strong>' +

      '<div style="font-size:14px;opacity:0.9;margin-bottom:4px">' +

      }) +

  function _printPayslip() {
    var content = document.getElementById("payslip-results").innerHTML;
    var w = window.open("", "_blank");
    w.document.write(
      '<html dir="rtl"><head><title>' +
        I18N.t("HR_PAYSLIP") +
        "</title><style>body{font-family:system-ui;margin:40px}.payslip-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.payslip-total{display:flex;justify-content:space-between;padding:12px 0;border-top:2px solid #000;margin-top:8px;font-weight:700}.text-success{color:#10b981}.text-danger{color:#ef4444}</style></head><body>" +
        content.replace(/<button[^>]*>.*?<\/button>/g, "") +
        "</body></html>",
    );
    w.document.close();
    setTimeout(function () {
      w.print();
    }, 300);
  }

      (type && type.is_paid === "FALSE" ? " selected" : "") +
      ">" +
      I18N.t("HR_NO_UNPAID") +
      "</option>" +
      "</select></div>" +
      "</div>" +
      "</div>" +

    openHRDrawer({
      title: isEdit ? "تعديل نوع إجازة" : "نوع إجازة جديد",
      subtitle: isEdit ? "تعديل إعدادات نوع الإجازة" : "تعريف نوع إجازة جديد",
      icon: "ti-calendar-event",
      color: "purple",
      width: 860,
      body: body,
    });

    document.getElementById("lt-d-save").addEventListener("click", function () {
      var fn = isEdit ? "updateLeaveType" : "addLeaveType";
      SaveEngine.run({
        screen: "HR.LeaveType",
        entity: "leave_type",
        recordId: editId || null,
        buttonId: "lt-d-save",
        rules: [
          { field: "lt-d-code", required: true, label: "الكود" },
