  function _atiWizardBar(active) {
    var steps = [
      { num: 1, label: "اختيار الجهاز والملف" },
      { num: 2, label: "ربط الأعمدة" },
      { num: 3, label: "التحقق من البيانات" },
      { num: 4, label: "النتائج" },
    ];
    var html = '<div class="ati-wizard" id="ati-wizard-bar">';
    steps.forEach(function (s, i) {
      var cls = s.num < active ? "done" : s.num === active ? "active" : "";
      html +=
        '<div class="ati-step ' +
        cls +
        '">' +
        '<div class="ati-step-num">' +
        (s.num < active
          ? '<i class="ti ti-check" style="font-size:13px"></i>'
          : s.num) +
        "</div>" +
        '<span class="ati-step-label">' +
        s.label +
        "</span>" +
        "</div>";
      if (i < steps.length - 1) html += '<div class="ati-step-line"></div>';
    });
    return html + "</div>";
  }

  /** اختيار نوع الجهاز */
  function _atiSelectDevice(el) {
    document
      .querySelectorAll(".ati-device-card, .ati-dcard")
      .forEach(function (c) {
        c.classList.remove("selected");
      });
    el.classList.add("selected");
    ATI.deviceType = el.dataset.device;
    // تطبيق القالب الافتراضي للجهاز إذا لم يكن هناك ملف محدد بعد
    if (!ATI.file) {
      ATI.mapping = Object.assign({}, ATI.DEFAULT_MAPS[ATI.deviceType] || {});
    }
    _atiCheckNextReady();
  }

  /** عند سحب الملف */
  function _atiDragOver(e) {
    e.preventDefault();
    document.getElementById("ati-drop-zone").classList.add("drag-over");
  }
  function _atiDragLeave(e) {
    document.getElementById("ati-drop-zone").classList.remove("drag-over");
  }
  function _atiDrop(e) {
    e.preventDefault();
    document.getElementById("ati-drop-zone").classList.remove("drag-over");
    var file = e.dataTransfer.files[0];
    if (file) _atiProcessFile(file);
  }

  /** عند اختيار ملف من input */
  function _atiFileChosen(input) {
    if (input.files && input.files[0]) _atiProcessFile(input.files[0]);
  }

  /** معالجة الملف المختار */
  function _atiProcessFile(file) {
    var ext = file.name.split(".").pop().toLowerCase();
    var allowed = ["csv", "xlsx", "xls", "txt"];
    if (allowed.indexOf(ext) === -1) {
      NotificationEngine.error("صيغة الملف غير مدعومة. يقبل فقط: " + allowed.join(", "));
      return;
    }
    ATI.file = file;
    ATI.fileType = ext;

    // عرض معلومات الملف
    var info = document.getElementById("ati-file-info");
    document.getElementById("ati-file-name").textContent = file.name;
    document.getElementById("ati-file-meta").textContent =
      "الحجم: " + _fmtFileSize(file.size) + " · النوع: " + ext.toUpperCase();
    if (info) info.style.display = "flex";
    document.getElementById("ati-drop-zone").style.display = "none";

    _atiCheckNextReady();
    NotificationEngine.success("تم اختيار الملف بنجاح");
  }

  function _atiClearFile() {
    ATI.file = null;
    ATI.fileType = null;
    ATI.rawRows = [];
    ATI.rawHeaders = [];
    var info = document.getElementById("ati-file-info");
    if (info) info.style.display = "none";
    document.getElementById("ati-drop-zone").style.display = "";
    document.getElementById("ati-file-input").value = "";
    _atiCheckNextReady();
  }

  function _atiCheckNextReady() {
    var btn = document.getElementById("ati-btn-next1");
    if (btn) btn.disabled = !(ATI.file && ATI.deviceType);
  }

  /** قراءة محتوى الملف حسب نوعه */
  function _atiReadFile(callback) {
    var ext = ATI.fileType;
    var reader = new FileReader();

    if (ext === "csv" || ext === "txt") {
      reader.onload = function (e) {
        var text = e.target.result;
        var rows = _parseCSVText(text);
        callback(null, rows);
      };
      reader.onerror = function () {
        callback("خطأ في قراءة الملف");
      };
      reader.readAsText(ATI.file, "UTF-8");
    } else if (ext === "xlsx" || ext === "xls") {
      reader.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, { type: "array" });
          var ws = wb.Sheets[wb.SheetNames[0]];
          var json = XLSX.utils.sheet_to_json(ws, {
            header: 1,
            raw: false,
            dateNF: "YYYY-MM-DD",
          });
          callback(null, json);
        } catch (err) {
          callback("خطأ في قراءة ملف Excel: " + err.message);
        }
      };
      reader.onerror = function () {
        callback("خطأ في قراءة الملف");
      };
      reader.readAsArrayBuffer(ATI.file);
    } else {
      callback("صيغة غير مدعومة");
    }
  }

  /** تحليل CSV إلى مصفوفة مصفوفات */
  function _parseCSVText(text) {
    // دعم فواصل متعددة: comma, semicolon, tab, pipe
    var lines = text.split(/\r?\n/).filter(function (l) {
      return l.trim();
    });
    if (!lines.length) return [];
    var delim = ",";
    var sample = lines[0];
    if (sample.indexOf("\t") > -1) delim = "\t";
    else if (sample.indexOf(";") > -1) delim = ";";
    else if (sample.indexOf("|") > -1) delim = "|";

    return lines.map(function (line) {
      // CSV parsing مع دعم القيم المحاطة بـ quotes
      var result = [];
      var cur = "";
      var inQ = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line[i];
        if (ch === '"') {
          inQ = !inQ;
        } else if (ch === delim && !inQ) {
          result.push(cur.trim());
          cur = "";
        } else {
          cur += ch;
        }
      }
      result.push(cur.trim());
      return result;
    });
  }

  function _atiGoStep2() {

    _atiReadFile(function (err, rows) {
      hideLoading();
      if (err) {
        NotificationEngine.error(err);
        return;
      }
      if (!rows || rows.length < 2) {
        NotificationEngine.error("الملف فارغ أو لا يحتوي بيانات كافية");
        return;
      }
      ATI.rawHeaders = rows[0];
      ATI.rawRows = rows.slice(1).filter(function (r) {
        return r.some(function (c) {
          return String(c).trim();
        });
      });

      // تطبيق القالب المناسب
      if (ATI.deviceType && !Object.keys(ATI.mapping).length) {
        ATI.mapping = Object.assign({}, ATI.DEFAULT_MAPS[ATI.deviceType] || {});
      }

      _atiSetStep(2);
      _atiRenderMappingPanel();
    });
  }

  function _atiRenderMappingPanel() {
    var headers = ATI.rawHeaders;
    var sample = ATI.rawRows.slice(0, 3);

    var colOptions = '<option value="">— تجاهل —</option>';
    headers.forEach(function (h, i) {
      colOptions +=
        '<option value="' + i + '">' + (h || "عمود " + (i + 1)) + "</option>";
    });

    var rows = ATI.FIELDS.map(function (f) {
      var cur = ATI.mapping[f.key] || "";
      // عرض أمثلة من البيانات
      var preview = "";
      if (cur !== "") {
        preview = sample
          .map(function (r) {
            return r[parseInt(cur)] || "";
          })
          .filter(Boolean)
          .slice(0, 2)
          .join(" / ");
      }
      return (
        "<tr>" +
        "<td><strong>" +
        f.label +
        (f.required ? ' <span style="color:var(--danger)">*</span>' : "") +
        "</strong></td>" +
        "<td>" +
        "<select onchange=\"_atiMapField('" +
        f.key +
        "',this.value)\">" +
        colOptions.replace(
          'value="' + cur + '"',
          'value="' + cur + '" selected',
        ) +
        "</select>" +
        (preview
          ? '<span class="ati-col-preview" id="ati-prev-' +
            f.key +
            '">' +
            preview +
            "</span>"
          : '<span class="ati-col-preview" id="ati-prev-' +
            f.key +
            '" style="display:none"></span>') +
        "</td>" +
        "</tr>"
      );
    }).join("");

    var html =
      '<h3 style="font-size:15px;font-weight:700;margin:0 0 8px">الخطوة 2: ربط أعمدة الملف بحقول النظام</h3>' +
      '<p style="font-size:13px;color:var(--text3);margin:0 0 20px">حدد أي عمود في ملفك يقابل كل حقل في النظام. الحقول المطلوبة مُعلَّمة بـ <span style="color:var(--danger)">*</span></p>' +
      // إحصائيات الملف
      '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">' +
      '<div style="padding:10px 16px;background:var(--accent-soft);border-radius:10px;font-size:13px"><strong style="color:var(--primary)" id="ati-count-rows">' +
      ATI.rawRows.length +
      '</strong> <span style="color:var(--text3)">سطر بيانات</span></div>' +
      '<div style="padding:10px 16px;background:var(--surface2);border-radius:10px;font-size:13px"><strong style="color:var(--text2)">' +
      headers.length +
      "</strong> <span style='color:var(--text3)'>عمود</span></div>" +
      '<div style="padding:10px 16px;background:var(--surface2);border-radius:10px;font-size:13px"><strong style="color:var(--text2)">' +
      ATI.fileType.toUpperCase() +
      "</strong> <span style='color:var(--text3)'>صيغة الملف</span></div>" +
      "</div>" +
      // جدول الربط
      '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:20px">' +
      '<table class="ati-map-table"><thead><tr><th>حقل النظام</th><th>عمود الملف</th></tr></thead>' +
      "<tbody>" +
      rows +
      "</tbody></table>" +
      "</div>" +
      // حفظ القالب
      '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px">' +
      '<div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px"><i class="ti ti-template" style="margin-left:6px"></i>حفظ قالب الربط</div>' +
      '<div style="display:flex;gap:10px;align-items:center">' +
      '<input type="text" id="ati-template-name" class="input" placeholder="اسم القالب (مثل: ZKTeco مصنع أ)" style="flex:1">' +
      '<button class="btn btn-ghost" onclick="_atiSaveTemplate()"><i class="ti ti-device-floppy"></i> حفظ</button>' +
      "</div>" +
      "</div>" +
      // معاينة البيانات
      '<div style="margin-bottom:20px">' +
      '<div style="font-size:12px;font-weight:700;color:var(--text3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px">معاينة أول 5 صفوف</div>' +
      _atiPreviewTable(sample.slice(0, 5), headers) +
      "</div>" +
      // أزرار التنقل
      '<div style="display:flex;justify-content:space-between;margin-top:8px">' +
      '<button class="btn btn-ghost" onclick="_atiSetStep(1)"><i class="ti ti-arrow-right"></i> السابق</button>' +
      '<button class="btn btn-primary" onclick="_atiGoStep3()"><i class="ti ti-arrow-left"></i> التالي: التحقق من البيانات</button>' +
      "</div>";

    document.getElementById("ati-mapping-content").innerHTML = html;
  }

  function _atiMapField(fieldKey, colIndex) {
    ATI.mapping[fieldKey] = colIndex;
    // تحديث المعاينة
    var preview = "";
    if (colIndex !== "") {
      preview = ATI.rawRows
        .slice(0, 2)
        .map(function (r) {
          return r[parseInt(colIndex)] || "";
        })
        .filter(Boolean)
        .join(" / ");
    }
    var el = document.getElementById("ati-prev-" + fieldKey);
    if (el) {
      el.textContent = preview;
      el.style.display = preview ? "" : "none";
    }
  }

  function _atiPreviewTable(rows, headers) {
    if (!rows || !rows.length)
      return '<p style="color:var(--text3);font-size:13px">لا توجد بيانات للمعاينة</p>';
    var th = headers
      .map(function (h, i) {
        return "<th>" + (h || "عمود " + (i + 1)) + "</th>";
      })
      .join("");
    var trs = rows
      .map(function (r) {
        return (
          "<tr>" +
          r
            .map(function (c) {
              return "<td>" + esc(String(c || "")) + "</td>";
            })
            .join("") +
          "</tr>"
        );
      })
      .join("");
    return (
      '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:10px">' +
      '<table class="ati-log-table"><thead><tr>' +
      th +
      "</tr></thead><tbody>" +
      trs +
      "</tbody></table></div>"
    );
  }

  // ─────────────────────────────────────────────────────────────────────
  // §ATI-VALID  — التحقق من البيانات
  // ─────────────────────────────────────────────────────────────────────

  function _atiGoStep3() {
    // التحقق من وجود الحقول الإلزامية
    var missing = ATI.FIELDS.filter(function (f) {
      return (
        f.required &&
        (ATI.mapping[f.key] === "" ||
          ATI.mapping[f.key] === undefined ||
          ATI.mapping[f.key] === null)
      );
    });
    if (missing.length) {
      NotificationEngine.error("يجب ربط الحقول الإلزامية: " +
        missing
          .map(function (f) {
            return f.label;
          })
          .join("، "));
      return;
    }

    showLoading("جاري التحقق من البيانات...");
    _atiSetStep(3);

    // تحويل الصفوف الخام إلى كائنات
    var mapped = ATI.rawRows.map(function (row, idx) {
      var obj = { _rowNum: idx + 2 };
      ATI.FIELDS.forEach(function (f) {
        var col = ATI.mapping[f.key];
        obj[f.key] =
          col !== "" && col !== undefined && col !== null
            ? String(row[parseInt(col)] || "").trim()
            : "";
      });
      return obj;
    });

    // التحقق من الصحة
    var employees = APP.data.employees || [];
    var empIndex = {};
    employees.forEach(function (e) {
      empIndex[String(e.employee_number || "").trim()] = e;
      empIndex[String(e.id).trim()] = e;
    });

    // بناء فهرس البصمات
    employees.forEach(function (e) {
      if (e.badge_number)
        empIndex["badge_" + String(e.badge_number).trim()] = e;
    });

    var validRows = [];
    var invalidRows = [];
    var seenKeys = {};

    mapped.forEach(function (row) {
      var errors = [];

      // 1. التحقق من رقم الموظف
      var emp =
        empIndex[row.employee_number] || empIndex["badge_" + row.badge_number];
      if (!emp) {
        if (!row.employee_number && !row.badge_number) {
          errors.push({
            type: "missing",
            msg: "رقم الموظف أو رقم البصمة مطلوب",
          });
        } else {
          errors.push({
            type: "notfound",
            msg:
              "الموظف غير موجود: " + (row.employee_number || row.badge_number),
          });
        }
      } else {
        row._employee = emp;
        row.employee_id = emp.id;
        row.resolved_name = emp.full_name;
      }

      // 2. التحقق من التاريخ
      if (!row.date) {
        errors.push({ type: "missing", msg: "التاريخ مطلوب" });
      } else {
        var d = _parseDate(row.date);
        if (!d) {
          errors.push({ type: "invalid", msg: "تاريخ غير صحيح: " + row.date });
        } else {
          row.date = _formatDateISO(d);
        }
      }

      // 3. التحقق من الأوقات
      if (row.check_in) {
        var t = _parseTime(row.check_in);
        if (!t)
          errors.push({
            type: "invalid",
            msg: "وقت الدخول غير صحيح: " + row.check_in,
          });
        else row.check_in = t;
      }
      if (row.check_out) {
        var t2 = _parseTime(row.check_out);
        if (!t2)
          errors.push({
            type: "invalid",
            msg: "وقت الخروج غير صحيح: " + row.check_out,
          });
        else row.check_out = t2;
      }

      // 4. اكتشاف التكرارات
      if (emp && row.date) {
        var key = (emp ? emp.id : row.employee_number) + "_" + row.date;
        if (seenKeys[key]) {
          errors.push({
            type: "dup",
            msg:
              "سجل مكرر للموظف " +
              (row.resolved_name || row.employee_number) +
              " بتاريخ " +
              row.date,
          });
        }
        seenKeys[key] = true;
      }

      // حساب ساعات العمل إذا توفرت الأوقات
      if (
        row.check_in &&
        row.check_out &&
        !errors.find(function (e) {
          return e.type === "invalid";
        })
      ) {
        row.work_hours = _calcWorkHours(row.check_in, row.check_out);
      }

      if (errors.length) {
        row._errors = errors;
        invalidRows.push(row);
      } else {
        validRows.push(row);
      }
    });

    ATI.validRows = validRows;
    ATI.invalidRows = invalidRows;

    hideLoading();
    _atiRenderValidationPanel();
  }

  function _atiRenderValidationPanel() {
    var total = ATI.validRows.length + ATI.invalidRows.length;
    var dups = ATI.invalidRows.filter(function (r) {
      return r._errors.some(function (e) {
        return e.type === "dup";
      });
    }).length;
    var notfound = ATI.invalidRows.filter(function (r) {
      return r._errors.some(function (e) {
        return e.type === "notfound";
      });
    }).length;
    var invalid = ATI.invalidRows.filter(function (r) {
      return r._errors.some(function (e) {
        return e.type === "invalid";
      });
    }).length;
    var missing = ATI.invalidRows.filter(function (r) {
      return r._errors.some(function (e) {
        return e.type === "missing";
      });
    }).length;

    var errList = ATI.invalidRows
      .slice(0, 100)
      .map(function (row) {
        return row._errors
          .map(function (err) {
            var typeLabel =
              {
                dup: "مكرر",
                missing: "ناقص",
                invalid: "خاطئ",
                notfound: "غير موجود",
              }[err.type] || err.type;
            return (
              '<div class="ati-err-item type-' +
              err.type +
              '">' +
              '<div class="ei-row">سطر ' +
              row._rowNum +
              "</div>" +
              '<div class="ei-msg">' +
              esc(err.msg) +
              "</div>" +
              '<div class="ei-type">' +
              typeLabel +
              "</div>" +
              "</div>"
            );
          })
          .join("");
      })
      .join("");

    var html =
      '<h3 style="font-size:15px;font-weight:700;margin:0 0 16px">الخطوة 3: نتائج التحقق من البيانات</h3>' +
      '<div class="ati-val-summary">' +
      '<div class="ati-val-card info"><span class="val-num">' +
      total +
      "</span><span class='val-label'>إجمالي السجلات</span></div>" +
      '<div class="ati-val-card ok"><span class="val-num">' +
      ATI.validRows.length +
      "</span><span class='val-label'>سجلات صحيحة </span></div>" +
      '<div class="ati-val-card err"><span class="val-num">' +
      ATI.invalidRows.length +
      "</span><span class='val-label'>سجلات بأخطاء</span></div>" +
      '<div class="ati-val-card warn"><span class="val-num">' +
      dups +
      "</span><span class='val-label'>مكررة</span></div>" +
      "</div>" +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">' +
      (notfound
        ? '<div style="padding:8px 14px;background:#fee2e2;border-radius:8px;font-size:12px;font-weight:600;color:#991b1b"> ' +
          notfound +
          " موظف غير موجود في النظام</div>"
        : "") +
      (invalid
        ? '<div style="padding:8px 14px;background:#ede9fe;border-radius:8px;font-size:12px;font-weight:600;color:#5b21b6"> ' +
          invalid +
          " بيانات غير صحيحة</div>"
        : "") +
      (missing
        ? '<div style="padding:8px 14px;background:#fef3c7;border-radius:8px;font-size:12px;font-weight:600;color:#92400e"> ' +
          missing +
          " بيانات ناقصة</div>"
        : "") +
      "</div>" +
      (ATI.invalidRows.length
        ? '<div style="margin-bottom:20px">' +
          '<div style="font-size:12px;font-weight:700;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px">تفاصيل الأخطاء</div>' +
          '<div class="ati-err-list">' +
          (errList ||
            '<div class="ati-err-item"><div class="ei-msg" style="color:var(--text3)">لا توجد أخطاء</div></div>') +
          "</div>" +
          (ATI.invalidRows.length > 100
            ? '<p style="font-size:12px;color:var(--text3);margin-top:8px">يُعرض أول 100 خطأ فقط</p>'
            : "") +
          "</div>"
        : '<div style="padding:16px;background:#d1fae5;border-radius:12px;margin-bottom:20px;color:#065f46;font-weight:600;font-size:13px"><i class="ti ti-check" style="margin-left:8px"></i>جميع البيانات صحيحة! يمكنك المتابعة</div>') +
      // خيار استيراد الصحيحة فقط
      (ATI.invalidRows.length && ATI.validRows.length
        ? '<div style="padding:14px 18px;background:var(--accent-soft);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;display:flex;align-items:center;gap:12px">' +
          '<input type="checkbox" id="ati-skip-errors" checked style="width:18px;height:18px;cursor:pointer">' +
          '<label for="ati-skip-errors" style="font-size:13px;font-weight:600;cursor:pointer">استيراد السجلات الصحيحة فقط (' +
          ATI.validRows.length +
          " سجل) وتجاهل الأخطاء</label>" +
          "</div>"
        : "") +
      '<div style="display:flex;justify-content:space-between;margin-top:8px">' +
      '<button class="btn btn-ghost" onclick="_atiSetStep(2)"><i class="ti ti-arrow-right"></i> السابق</button>' +
      '<div style="display:flex;gap:10px">' +
      (ATI.validRows.length && canDo("importAttendance")
        ? '<button class="btn btn-primary" id="ati-btn-process" onclick="_atiProcess()">' +
          '<i class="ti ti-database-import"></i> استيراد ' +
          ATI.validRows.length +
          " سجل</button>"
        : '<div style="padding:10px 16px;background:var(--surface2);border-radius:8px;color:var(--text3);font-size:13px">لا يوجد سجلات صالحة للاستيراد</div>') +
      "</div>" +
      "</div>";

    document.getElementById("ati-validation-content").innerHTML = html;
  }

  // ─────────────────────────────────────────────────────────────────────
  // §ATI-PROCESS  — المعالجة والحفظ
  // ─────────────────────────────────────────────────────────────────────

  function _atiProcess() {
    var skipErrors = document.getElementById("ati-skip-errors");
    var toImport =
      skipErrors && skipErrors.checked ? ATI.validRows : ATI.validRows;

    if (!toImport.length) {
      NotificationEngine.error("لا توجد سجلات للاستيراد");
      return;
    }

    var btn = document.getElementById("ati-btn-process");
    if (btn) btn.disabled = true;
    ATI.processing = true;

    // تجهيز البيانات للإرسال
    var payload = toImport.map(function (row) {
      return {
        employee_id: row.employee_id,
        employee_number: row.employee_number,
        date: row.date,
        check_in: row.check_in || "",
        check_out: row.check_out || "",
        work_hours: row.work_hours || 0,
        movement_type: row.movement_type || "PUNCH",
        device_name: row.device_name || ATI.deviceType || "",
        badge_number: row.badge_number || "",
        source: "import",
        device_type: ATI.deviceType || "generic",
      };
    });

    var meta = {
      file_name: ATI.file ? ATI.file.name : "",
      device_type: ATI.deviceType || "generic",
      total_in_file: ATI.rawRows.length,
      valid_count: ATI.validRows.length,
      rejected_count: ATI.invalidRows.length,
      rejected_details: ATI.invalidRows.slice(0, 200).map(function (r) {
        return { row: r._rowNum, errors: r._errors };
      }),
    };

    // عرض شاشة التقدم
    _atiSetStep(4);
    document.getElementById("ati-result-content").innerHTML =
      '<div style="text-align:center;padding:40px 20px">' +
      '<div class="spinner" style="margin:0 auto 16px"></div>' +
      '<h3 style="font-size:16px;font-weight:700;color:var(--text);margin:0 0 8px">جاري الاستيراد...</h3>' +
      '<p style="color:var(--text3);font-size:13px">يتم معالجة ' +
      payload.length +
      " سجل، يرجى الانتظار</p>" +
      '<div class="ati-progress-wrap" style="max-width:300px;margin:16px auto"><div class="ati-progress-fill" id="ati-prog" style="width:0%"></div></div>' +
      '<div id="ati-prog-label" style="font-size:12px;color:var(--text3)">0 / ' +
      payload.length +
      "</div>" +
      "</div>";

    // محاكاة تقدم (مع الاستدعاء الفعلي للـ backend)
    var prog = 0;
    var progInt = setInterval(function () {
      prog = Math.min(prog + Math.random() * 8, 85);
      var el = document.getElementById("ati-prog");
      if (el) el.style.width = prog + "%";
    }, 300);

    _gsr("importAttendanceBatch", [_authPayload({ records: payload, meta: meta })], {
      label: "ATI.importAttendanceBatch",
      onSuccess: function (res) {
        clearInterval(progInt);
        var el = document.getElementById("ati-prog");
        if (el) el.style.width = "100%";
        ATI.processing = false;

        setTimeout(function () {
          ATI.importSessionId = res.session_id;
          _atiRenderResult(res);
        }, 400);
      },
      onError: function (res) {
        clearInterval(progInt);
        ATI.processing = false;
        NotificationEngine.error((res && res.message) || "خطأ في الاستيراد");
        var btn2 = document.getElementById("ati-btn-process");
        if (btn2) btn2.disabled = false;
      },
    });
  }

      '<div style="display:flex;flex-direction:column;gap:10px">' +

      _atiReportLink(

  function _atiLoadTemplates() {
    try {

        localStorage.getItem("ati_mapping_templates") || "[]",

      _atiRenderTemplates();
    } catch (e) {
      ATI.templates = [];

  function _atiSaveTemplate() {
    var name = (document.getElementById("ati-template-name") || {}).value;
    if (!name || !name.trim()) {
      NotificationEngine.error("أدخل اسم القالب أولاً");
      return;
    }
    var tmpl = {
      id: Date.now(),
      name: name.trim(),
      device: ATI.deviceType || "generic",
      mapping: Object.assign({}, ATI.mapping),
    };
    ATI.templates = ATI.templates.filter(function (t) {
      return t.name !== tmpl.name;
    });
    ATI.templates.unshift(tmpl);
    try {
      localStorage.setItem(
        "ati_mapping_templates",
        JSON.stringify(ATI.templates.slice(0, 20)),
      );
    } catch (e) {}
    NotificationEngine.success("تم حفظ القالب: " + tmpl.name);
    document.getElementById("ati-template-name").value = "";
    _atiRenderTemplates();
  }

  function _atiRenderTemplates() {
    var el = document.getElementById("ati-templates-section");
    var list = document.getElementById("ati-template-list");
    if (!el || !list) return;
    if (!ATI.templates.length) {
      el.style.display = "none";
      return;
    }
    el.style.display = "";
    list.innerHTML = ATI.templates
      .map(function (t) {
        return (
          '<div class="ati-template-item">' +
          '<i class="ti ti-template" style="color:var(--primary)"></i>' +
          '<div style="flex:1"><div class="ti-name">' +
          esc(t.name) +

          (t.device || "") +

          '<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="_atiApplyTemplate(' +
          t.id +

          '<button class="btn-icon" onclick="_atiDeleteTemplate(' +
          t.id +
          ')" style="color:var(--danger)"><i class="ti ti-trash"></i></button>' +
          "</div>"

  }

  function _atiApplyTemplate(id) {
    var tmpl = ATI.templates.find(function (t) {
      return t.id === id;
    });
    if (!tmpl) return;
    ATI.mapping = Object.assign({}, tmpl.mapping);
    // تحديد الجهاز
    if (tmpl.device) {
      var card = document.querySelector('[data-device="' + tmpl.device + '"]');
      if (card) _atiSelectDevice(card);
    }
    NotificationEngine.success("تم تطبيق القالب: " + tmpl.name);
  }

  function _atiDeleteTemplate(id) {
    ATI.templates = ATI.templates.filter(function (t) {
      return t.id !== id;
    });
    try {
      localStorage.setItem(
        "ati_mapping_templates",
        JSON.stringify(ATI.templates),
      );
    } catch (e) {}
    _atiRenderTemplates();
  }

  /** تحليل التاريخ بصيغ متعددة */
  function _parseDate(str) {
    if (!str) return null;
    str = String(str).trim();
    // صيغ شائعة: YYYY-MM-DD, DD/MM/YYYY, MM/DD/YYYY, DD-MM-YYYY, YYYYMMDD
    var patterns = [
      {
        re: /^(\d{4})-(\d{2})-(\d{2})$/,
        fn: function (m) {
          return new Date(m[1], m[2] - 1, m[3]);
        },
      },
      {
        re: /^(\d{2})\/(\d{2})\/(\d{4})$/,
        fn: function (m) {
          return new Date(m[3], m[2] - 1, m[1]);
        },
      },
      {
        re: /^(\d{2})-(\d{2})-(\d{4})$/,
        fn: function (m) {
          return new Date(m[3], m[2] - 1, m[1]);
        },
      },
      {
        re: /^(\d{8})$/,
        fn: function (m) {
          return new Date(
            m[1].substr(0, 4),
            m[1].substr(4, 2) - 1,
            m[1].substr(6, 2),
          );
        },
      },
    ];
    for (var i = 0; i < patterns.length; i++) {
      var match = str.match(patterns[i].re);
      if (match) {
        var d = patterns[i].fn(match);
        if (d && !isNaN(d.getTime())) return d;
      }
    }
    // محاولة أخيرة
    var d2 = new Date(str);
    return isNaN(d2.getTime()) ? null : d2;
  }

  function _formatDateISO(d) {
    return (
      d.getFullYear() +
      "-" +
      String(d.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(d.getDate()).padStart(2, "0")
    );
  }

  /** تحليل الوقت بصيغ متعددة */
  function _parseTime(str) {
    if (!str) return "";
    str = String(str).trim();
    // HH:MM:SS أو HH:MM
    var m1 = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s*(AM|PM))?$/i);
    if (m1) {
      var h = parseInt(m1[1]);
      var min = m1[2];
      var ampm = m1[4];
      if (ampm) {
        if (ampm.toUpperCase() === "PM" && h < 12) h += 12;
        if (ampm.toUpperCase() === "AM" && h === 12) h = 0;
      }
      return String(h).padStart(2, "0") + ":" + min;
    }
    // HHMM
    var m2 = str.match(/^(\d{4})$/);
    if (m2) return m2[1].substr(0, 2) + ":" + m2[1].substr(2, 2);
    return null;
  }

  function _calcWorkHours(inTime, outTime) {
    if (!inTime || !outTime) return 0;
    var tp = function (t) {
      var p = t.split(":");
      return parseInt(p[0]) * 60 + parseInt(p[1] || 0);
    };
    var diff = tp(outTime) - tp(inTime);
    if (diff < 0) diff += 24 * 60; // انتقل منتصف الليل
    return Math.round((diff / 60) * 100) / 100;
  }
