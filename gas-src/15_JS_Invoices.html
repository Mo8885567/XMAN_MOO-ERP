  // ─────────────────────────────────────────────────────────────
  // §SALES-DASH  لوحة تحكم المبيعات
  // ─────────────────────────────────────────────────────────────
  function bindSalesDashboard() {
    ensureExtendedData(function () {
      var _set = function (id, val, sensitive) {
        var el = document.getElementById(id);
        if (el) {
          el.textContent = val;
          if (sensitive) el.classList.add("sensitive-balance");
        }
      };
      var invoices = APP.data.saleInvoices || APP.data.sale_invoices || [];
      var returns_ = APP.data.saleReturns || APP.data.sale_returns || [];
      var customers = APP.data.customers || [];
      var today = (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().slice(0, 10));

      var totalSales = invoices.reduce(function (s, i) {
        return s + parseFloat(i.total || i.grand_total || 0);
      }, 0);
      var todayInv = invoices.filter(function (i) {
        return (i.date || i.invoice_date || "").slice(0, 10) === today;
      });

      _set("sld-stat-invoices", invoices.length);
      _set(
        "sld-stat-total",
        formatMoney(totalSales, { withSymbol: false }),
        true,
      );
      _set("sld-stat-customers", customers.length);
      _set("sld-stat-returns", returns_.length);
      _set("sld-stat-today", todayInv.length);
      _set("sld-stat-catalog", "—");

      // Recent invoices table
      var tbody = document.getElementById("sld-recent-invoices");
      if (tbody) {
        var recent = invoices.slice(-6).reverse();
        tbody.innerHTML = !recent.length
          ? '<tr><td colspan="4" style="text-align:center;padding:16px;color:var(--text3)">لا توجد فواتير</td></tr>'
          : recent
              .map(function (inv) {
                var total = parseFloat(inv.total || inv.grand_total || 0);
                return (
                  "<tr><td style='font-weight:600;color:var(--primary)'>" +
                  esc(inv.ref || inv.invoice_no || inv.id || "") +
                  "</td>" +
                  "<td>" +
                  esc(inv.customer_name || inv.customer || "") +
                  "</td>" +
                  "<td style='text-align:center;font-weight:700' class='sensitive-balance'>" +
                  formatMoney(total, { withSymbol: false }) +
                  "</td>" +
                  "<td style='color:var(--text3);font-size:12px'>" +
                  (inv.date || inv.invoice_date || "").slice(0, 10) +
                  "</td></tr>"
                );
              })
              .join("");
      }

      // Top customers
      var custDiv = document.getElementById("sld-top-customers");
      if (custDiv) {
        var custMap = {};
        invoices.forEach(function (inv) {
          var name = inv.customer_name || inv.customer || "غير محدد";
          custMap[name] =
            (custMap[name] || 0) +
            parseFloat(inv.total || inv.grand_total || 0);
        });
        var sorted = Object.keys(custMap)
          .sort(function (a, b) {
            return custMap[b] - custMap[a];
          })
          .slice(0, 5);
        custDiv.innerHTML = !sorted.length
          ? '<p style="color:var(--text3)">لا توجد بيانات</p>'
          : sorted
              .map(function (name, i) {
                return (
                  '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">' +
                  '<span style="display:flex;align-items:center;gap:8px"><b style="color:var(--text3);font-size:11px">' +
                  (i + 1) +
                  "</b>" +
                  esc(name) +
                  "</span>" +
                  '<b class="sensitive-balance" style="color:var(--success)">' +
                  formatMoney(custMap[name]) +
                  "</b></div>"
                );
              })
              .join("");
      }
    });
  }

  // ─────────────────────────────────────────────────────────────
  // §INV-KB  [ERP-REDESIGN] تنقّل واختصارات لوحة المفاتيح
  // ─────────────────────────────────────────────────────────────
  // Enter بين حقول نفس الصف (زي Tab)، وEnter في آخر حقل بآخر صف
  // بيضيف صف جديد تلقائيًا (بيسهّل الإدخال بقارئ الباركود بدون فأرة).
  // Ctrl+S = حفظ، Esc = إلغاء، Alt+A = إضافة صنف. استخدام Event
  // Delegation على مستوى الـ overlay بدل ربط كل خلية على حدة.
  function _bindInvoiceKeyboardNav(prefix, modalId) {
    var overlay = document.getElementById(modalId);
    if (!overlay) return;
    var fieldOrder = ["item", "color", "qty", "price"];

    overlay.addEventListener("keydown", function (e) {
      var t = e.target;
      var isLineField =
        t &&
        t.tagName === "INPUT" &&
        fieldOrder.some(function (f) {
          return t.classList.contains(prefix + "-line-" + f);
        });

      if (isLineField && e.key === "Enter") {
        e.preventDefault();
        var row = t.closest("tr");
        var curField = fieldOrder.find(function (f) {
          return t.classList.contains(prefix + "-line-" + f);
        });
        var nextField = fieldOrder[fieldOrder.indexOf(curField) + 1];
        if (nextField) {
          var nextInput = row.querySelector(
            "." + prefix + "-line-" + nextField,
          );
          if (nextInput) {
            nextInput.focus();
            nextInput.select && nextInput.select();
            return;
          }
        }
        // آخر حقل في الصف: لو ده آخر صف في الجدول، ضيف صف جديد وركّز عليه
        var tbody = document.getElementById(prefix + "-lines-body");
        var isLastRow = row === tbody.lastElementChild;
        if (isLastRow) {
          if (prefix === "sinv") _addSaleInvLine();
          else _addPurchInvLine();
          var newRow = tbody.lastElementChild;
          var firstInput =
            newRow && newRow.querySelector("." + prefix + "-line-item");
          if (firstInput) firstInput.focus();
        } else {
          var nextRow = row.nextElementSibling;
          var nextRowFirst =
            nextRow && nextRow.querySelector("." + prefix + "-line-item");
          if (nextRowFirst) nextRowFirst.focus();
        }
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        if (prefix === "sinv") saveSaleInvoice();
        else savePurchaseInvoice();
        return;
      }
      if (e.key === "Escape") {
        closeModal(modalId);
        return;
      }
      if (e.altKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        if (prefix === "sinv") _addSaleInvLine();
        else _addPurchInvLine();
      }
    });
  }

  // §INV-F  بناء بنود الفاتورة من الإذن

  function _buildInvoiceLinesFromPermit(permitId, txType) {
    if (!permitId) return [];
    var txs = APP.data.transactions || [];
    return txs
      .filter(function (tx) {
        return (
          tx.type === txType &&
          (tx.permit_id === permitId || tx.id === permitId)
        );
      })
      .map(function (tx) {
        var item =
          (APP.data.items || []).find(function (i) {
            return i.id === tx.item_id;
          }) || {};
        return {
          _tx: tx,
          item_id: tx.item_id,
          item_name: item.name || tx.item_id,
          color: tx.color || "—",
          qty: Number(tx.quantity || 0),
          unit_price: Number(item.selling_price || item.cost_price || 0),
        };
      });
  }

  // ─────────────────────────────────────────────────────────────
  // §INV-I  حساب الإجماليات
  // ─────────────────────────────────────────────────────────────
  function _bindInvoiceTotalsCalc(prefix) {
    _calcInvoiceTotals(prefix);
  }

  // [UX-01-FIX-2026-07] دالة مشتركة واحدة لحساب خصم البند — كانت مكررة
  // بين _calcInvoiceTotals (العرض) و_collectInvoiceData (الحفظ)، وأي
  // تعديل مستقبلي (قاعدة تقريب، سقف أقصى) كان لازم يتطبق في المكانين
  // يدويًا؛ نسيان أحدهما كان يخلق فرق بين الرقم المعروض والمحفوظ.
  function _calcLineDiscountAmount(gross, lineDiscVal, lineDiscType) {
    var lineDiscAmount =
      lineDiscVal > 0
        ? lineDiscType === "percent"
          ? gross * (lineDiscVal / 100)
          : lineDiscVal
        : 0;
    return Math.min(lineDiscAmount, gross);
  }

  function _calcInvoiceTotals(prefix) {
    var tbody = document.getElementById(prefix + "-lines-body");
    if (!tbody) return;

    var subtotal = 0;
    var rows = tbody.querySelectorAll("tr");
    rows.forEach(function (row, i) {
      var qtyEl = row.querySelector("." + prefix + "-line-qty");
      var priceEl = row.querySelector("." + prefix + "-line-price");
      if (!qtyEl || !priceEl) return;
      var qty = Number(qtyEl.value || 0);
      var price = Number(priceEl.value || 0);
      var gross = qty * price;
      // [ERP-REDESIGN] خصم على مستوى الصنف (عمود "الخصم" في الشاشة الجديدة)
      var discEl = row.querySelector("." + prefix + "-line-disc");
      var discTypeEl = row.querySelector("." + prefix + "-line-disc-type");
      var lineDiscVal = discEl ? Number(discEl.value || 0) : 0;
      var lineDiscType = discTypeEl ? discTypeEl.value : "fixed";
      var lineDiscAmount = _calcLineDiscountAmount(
        gross,
        lineDiscVal,
        lineDiscType,
      );
      var total = gross - lineDiscAmount;
      subtotal += total;
      // تحديث إجمالي الصف
      var idx = qtyEl.dataset.idx;
      var totalEl = document.getElementById(prefix + "-line-total-" + idx);
      if (totalEl) totalEl.textContent = total.toFixed(2);
    });

    var discVal = Number(
      (document.getElementById(prefix + "-discount-val") || {}).value || 0,
    );
    var discType =
      (document.getElementById(prefix + "-discount-type") || {}).value ||
      "percent";
    var vatPct = Number(
      (document.getElementById(prefix + "-vat") || {}).value || 0,
    );

    var discAmount =
      discType === "percent" ? subtotal * (discVal / 100) : discVal;
    discAmount = Math.min(discAmount, subtotal);
    var afterDisc = subtotal - discAmount;
    var vatAmount = afterDisc * (vatPct / 100);
    var netTotal = afterDisc + vatAmount;

    var _setText = function (id, val) {
      var el = document.getElementById(id);
      if (el) el.textContent = val;
    };
    var paidNow = Number(
      (document.getElementById(prefix + "-paid-now") || {}).value || 0,
    );
    var remaining = netTotal - paidNow;

    _setText(prefix + "-subtotal", NumberEngine.currency(subtotal));
    _setText(prefix + "-discount-display", NumberEngine.currency(discAmount));
    _setText(prefix + "-after-discount", NumberEngine.currency(afterDisc));
    _setText(prefix + "-vat-display", NumberEngine.currency(vatAmount));
    _setText(prefix + "-nettotal", NumberEngine.currency(netTotal));
    _setText(prefix + "-items-count", rows.length + " صنف");
    _setText(prefix + "-paid-display", NumberEngine.currency(paidNow));
    _setText(prefix + "-remaining", NumberEngine.currency(remaining));

    // [ERP-REDESIGN] تغذية شريط الإجماليات الثابت أسفل الشاشة (لو موجود)
    _setText(prefix + "-sf-count", rows.length);
    _setText(prefix + "-sf-subtotal", NumberEngine.currency(subtotal));
    _setText(prefix + "-sf-vat", NumberEngine.currency(vatAmount));
    _setText(prefix + "-sf-nettotal", NumberEngine.currency(netTotal));
  }

  // ─────────────────────────────────────────────────────────────
  // §INV-J  جمع بيانات الفاتورة من الـ Modal
  // ─────────────────────────────────────────────────────────────
  // [AUDIT-FIX-2026-08-08 §RISK-2b] معرّف Idempotency لكل محاولة حفظ —
  // يُولَّد مرة واحدة لكل نموذج مفتوح (prefix) ويُعاد إرساله لو حصل
  // Retry تلقائي أو Double-click، فالسيرفر يرفض التكرار بدل إنشاء فاتورتين.
  // يُمسح بعد نجاح الحفظ (_clearInvoiceClientRequestId) عشان الفاتورة
  // التالية تاخد معرّف جديد.
  var _invoiceClientRequestIds = {};
  function _getInvoiceClientRequestId(prefix) {
    if (!_invoiceClientRequestIds[prefix]) {
      _invoiceClientRequestIds[prefix] =
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2, 10);
    }
    return _invoiceClientRequestIds[prefix];
  }
  function _clearInvoiceClientRequestId(prefix) {
    delete _invoiceClientRequestIds[prefix];
  }

  function _collectInvoiceData(prefix) {
    var tbody = document.getElementById(prefix + "-lines-body");
    var lines = [];
    if (tbody) {
      tbody.querySelectorAll("tr").forEach(function (row) {
        var itemEl = row.querySelector("." + prefix + "-line-item");
        var colorEl = row.querySelector("." + prefix + "-line-color");
        var qtyEl = row.querySelector("." + prefix + "-line-qty");
        var priceEl = row.querySelector("." + prefix + "-line-price");
        // [ERP-REDESIGN] حقول إضافية من شاشة إنشاء الفاتورة الجديدة
        // (29_JS_InvoiceWorkspace.html) — اختيارية، تُقرأ فقط لو موجودة
        var discEl = row.querySelector("." + prefix + "-line-disc");
        var discTypeEl = row.querySelector("." + prefix + "-line-disc-type");
        var whEl = row.querySelector("." + prefix + "-line-warehouse");
        var descEl = row.querySelector("." + prefix + "-line-desc");
        if (!itemEl) return;
        var qty = Number((qtyEl || {}).value || 0);
        var price = Number((priceEl || {}).value || 0);
        if (!itemEl.value.trim() && qty === 0) return;
        var gross = qty * price;
        var lineDiscVal = discEl ? Number(discEl.value || 0) : 0;
        var lineDiscType = discTypeEl ? discTypeEl.value : "fixed";
        var lineDiscAmount = _calcLineDiscountAmount(
          gross,
          lineDiscVal,
          lineDiscType,
        );
        lines.push({
          item_id: itemEl.dataset.itemId || "",
          item_name: itemEl.value.trim(),
          color: colorEl ? colorEl.value.trim() : "",
          qty: qty,
          unit_price: price,
          discount_value: lineDiscVal,
          discount_type: lineDiscType,
          discount_amount: lineDiscAmount,
          warehouse: whEl ? whEl.value : "",
          description: descEl ? descEl.value.trim() : "",
          total: gross - lineDiscAmount,
        });
      });
    }

    var paymentMethod = "";
    var payRadios = document.querySelectorAll(
      'input[name="' + prefix + '-payment"]',
    );
    payRadios.forEach(function (r) {
      if (r.checked) paymentMethod = r.value;
    });

    var discVal = Number(
      (document.getElementById(prefix + "-discount-val") || {}).value || 0,
    );
    var discType =
      (document.getElementById(prefix + "-discount-type") || {}).value ||
      "percent";
    var vatPct = Number(
      (document.getElementById(prefix + "-vat") || {}).value || 0,
    );

    var subtotal = lines.reduce(function (s, l) {
      return s + l.total;
    }, 0);
    var discAmount =
      discType === "percent" ? subtotal * (discVal / 100) : discVal;
    discAmount = Math.min(discAmount, subtotal);
    var afterDisc = subtotal - discAmount;
    var vatAmount = afterDisc * (vatPct / 100);
    var netTotal = afterDisc + vatAmount;

    return {
      party: (
        (document.getElementById(prefix + "-party") || {}).value || ""
      ).trim(),
      date: (
        (document.getElementById(prefix + "-date") || {}).value || ""
      ).trim(),
      permit_id: (
        (document.getElementById(prefix + "-permit") || {}).value || ""
      ).trim(),
      due_date: (
        (document.getElementById(prefix + "-due-date") || {}).value || ""
      ).trim(),
      notes: (
        (document.getElementById(prefix + "-notes") || {}).value || ""
      ).trim(),
      payment_status: paymentMethod,
      discount_value: discVal,
      discount_type: discType,
      discount_amount: discAmount,
      vat_percent: vatPct,
      vat_amount: vatAmount,
      subtotal: subtotal,
      net_total: netTotal,
      lines: lines,
      // [AUDIT-FIX-2026-08-08 §RISK-2b]
      client_request_id: _getInvoiceClientRequestId(prefix),
    };
  }

  // ─────────────────────────────────────────────────────────────
  // §INV-K  حفظ فاتورة بيع
  // ─────────────────────────────────────────────────────────────
  function saveSaleInvoice() {
    // [SAVE-ENGINE] تم نقل هذه الشاشة بالكامل لمحرك الحفظ الموحّد
    // (00b_JS_SaveEngine.html) — لا تعيد كتابة منطق حفظ يدوي هنا.
    SaveEngine.run({
      screen: "SaleInvoice",
      entity: "sale_invoice",
      buttonId: "sinv-save-btn",
      rules: [
        { field: "sinv-party", required: true, label: "اسم العميل" },
        { field: "sinv-date", required: true, label: "تاريخ الفاتورة" },
        {
          test: function () {
            return _collectInvoiceData("sinv").lines.length > 0;
          },
          message: "أضف بنوداً للفاتورة",
        },
      ],
      collect: function () {
        var data = _collectInvoiceData("sinv");
        // ── إضافة بيانات الشحن (المرحلة 3) ──
        var shipCoEl = document.getElementById("sinv-shipping-co");
        var shipCostEl = document.getElementById("sinv-shipping-cost");
        var shipOnEl = document.getElementById("sinv-shipping-on");
        if (shipCoEl && shipCoEl.value) {
          data.shipping_company_id = shipCoEl.value;
          data.shipping_cost = Number((shipCostEl || {}).value || 0);
          data.shipping_cost_on = (shipOnEl || {}).value || "company";
        }
        return data;
      },
      fn: "addSaleInvoice",
      params: function (data) {
        return [data, SESSION.token];
      },
      successMessage: "تم حفظ فاتورة البيع بنجاح",
      // [UNIFY-NOTIF] مثال توضيحي مطلوب في المواصفة: "عملية بيع جديدة"
      // — يظهر في مركز الإشعارات وقابل للضغط للانتقال لصفحة فواتير البيع
      notifyPage: "sale-invoices",
      notifyPerm: "viewSaleInvoices",
      onSuccess: function (res) {
        // [AUDIT-FIX-2026-08-08 §RISK-2b] فاتورة اتحفظت بنجاح — امسح
        // معرّف الطلب عشان الفاتورة الجديدة (لو المستخدم فتح نموذج تاني)
        // تاخد معرّف مختلف تماماً.
        _clearInvoiceClientRequestId("sinv");
        if (!APP.data.saleInvoices) APP.data.saleInvoices = [];
        APP.data.saleInvoices.push(res.data);
        if (
          res.data &&
          res.data.stock_movements &&
          res.data.stock_movements.length
        ) {
          if (!APP.data.transactions) APP.data.transactions = [];
          APP.data.transactions = APP.data.transactions.concat(
            res.data.stock_movements,
          );
        }
        // [BALANCE-COLUMN-FIX] فاتورة البيع بتغيّر رصيد العميل فعليًا في
        // السيرفر، لكن نسخة APP.data.customers المحلية متعرفش بالتغيير ده
        // (مفيش تحديث محلي للرصيد هنا) — فيفضل عمود "الرصيد" في جدول
        // العملاء يعرض القيمة القديمة لحد ما المستخدم يعمل ريفريش كامل من
        // التوب بار. نعيد تحميل العملاء صامتًا في الخلفية عشان الرصيد
        // يظهر صحيح فورًا من غير ما ننتظر ريفريش كامل.
        if (typeof _loadCustomers === "function") _loadCustomers();
        // [WF-EXEC-2026] المرحلة 3 — تشغيل Workflows المرتبطة بحدث "فاتورة
        // جديدة" + فحص "رصيد منخفض" (تجاوز/اقتراب حد الائتمان) لو مفعّلة.
        if (
          typeof WA_WORKFLOW_ENGINE !== "undefined" &&
          res.data &&
          res.data.party
        ) {
          var _wfCustomer = (APP.data.customers || []).find(function (c) {
            return String(c.id) === String(res.data.party);
          });
          var _wfEventData = {
            customer_id: res.data.party,
            customer_name: (_wfCustomer && _wfCustomer.name) || "",
            phone: (_wfCustomer && (_wfCustomer.phone || _wfCustomer.mobile)) || "",
            invoice_id: res.data.id,
            invoice_number: res.data.invoice_number || res.data.id,
            invoice_total: res.data.net_total || res.data.total || 0,
          };
          WA_WORKFLOW_ENGINE.trigger("new_invoice", _wfEventData);

          var _wfLimit = Number((_wfCustomer && _wfCustomer.credit_limit) || 0);
          // [ملحوظة] _loadCustomers() فوق بيحدّث APP.data.customers بشكل غير
          // متزامن (async) — رصيد _wfCustomer هنا لسه قديم (قبل الفاتورة
          // دي)، فبنضيف قيمة الفاتورة الحالية كتقريب لأقرب رصيد فعلي.
          var _wfBalance =
            Number((_wfCustomer && _wfCustomer.balance) || 0) +
            Number(_wfEventData.invoice_total || 0);
          if (_wfLimit > 0 && _wfBalance >= _wfLimit * 0.9) {
            WA_WORKFLOW_ENGINE.trigger(
              "low_balance",
              Object.assign({}, _wfEventData, {
                balance: _wfBalance,
                credit_limit: _wfLimit,
              }),
            );
          }
        }
        // [ERP-REDESIGN] الشاشة أصبحت صفحة كاملة (29_JS_InvoiceWorkspace.html)
        // بدل مودال — التوجيه بعد الحفظ يعتمد على الزر المستخدم
        // (حفظ وجديد / حفظ وطباعة / حفظ وإغلاق)
        if (typeof _iwAfterSave === "function") {
          _iwAfterSave("sinv", IW_DOC_CFG.sinv, res.data && res.data.id);
        } else {
          renderPage(APP.currentPage);
        }
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // §INV-L  حفظ فاتورة شراء
  // ─────────────────────────────────────────────────────────────
  function savePurchaseInvoice() {
    var data = _collectInvoiceData("pinv");
    // [PO-INVOICE-LINK] لو الفاتورة اتفتحت من زر "تحويل لفاتورة" في شاشة
    // أمر الشراء (22_JS_PurchaseOrders.html)، APP._iwPrefillPoId بيبقى
    // متسجّل — نبعته مع الفاتورة عشان يتحدّث أمر الشراء المصدر بعد الحفظ.
    if (APP._iwPrefillPoId) {
      data.po_id = APP._iwPrefillPoId;
      APP._iwPrefillPoId = null;
    }
    if (!data.party) {
      NotificationEngine.error("أدخل اسم المورد");
      return;
    }
    if (!data.date) {
      NotificationEngine.error("أدخل تاريخ الفاتورة");
      return;
    }
    if (!data.lines.length) {
      NotificationEngine.error("أضف بنوداً للفاتورة");
      return;
    }

    // [SAVE-ENGINE] موحّد عبر 00b_JS_SaveEngine.html
    SaveEngine.run({
      screen: "PurchaseInvoice",
      entity: "purchase_invoice",
      buttonId: "pinv-save-btn",
      data: data,
      fn: "addPurchaseInvoice",
      params: function (d) {
        return [d, SESSION.token];
      },
      successMessage: "تم حفظ فاتورة الشراء بنجاح",
      onSuccess: function (res) {
        // [AUDIT-FIX-2026-08-08 §RISK-2b]
        _clearInvoiceClientRequestId("pinv");
        if (!APP.data.purchaseInvoices) APP.data.purchaseInvoices = [];
        APP.data.purchaseInvoices.push(res.data);
        if (
          res.data &&
          res.data.stock_movements &&
          res.data.stock_movements.length
        ) {
          if (!APP.data.transactions) APP.data.transactions = [];
          APP.data.transactions = APP.data.transactions.concat(
            res.data.stock_movements,
          );
        }
        // [BALANCE-COLUMN-FIX] نفس إصلاح فاتورة البيع — فاتورة الشراء بتغيّر
        // رصيد المورد فعليًا بالسيرفر، فنعيد تحميل الموردين صامتًا عشان
        // عمود الرصيد يعرض القيمة الصحيحة فورًا بدل ما ينتظر ريفريش كامل.
        if (typeof _loadSuppliers === "function") _loadSuppliers();
        if (typeof _iwAfterSave === "function") {
          _iwAfterSave("pinv", IW_DOC_CFG.pinv, res.data && res.data.id);
        } else {
          renderPage(APP.currentPage);
        }
      },
    });
  }

        ? '<div style="font-size:12px;color:#374151"> ' +
          esc(compPhone) +

      "</div></div>" +

      '<div style="background:#F9FAFB;border-radius:8px;padding:12px">' +

  function deleteSaleInvoiceConfirm(id) {
    confirmDelete(
      "حذف/إلغاء فاتورة البيع",
      "هل تريد حذف فاتورة البيع رقم " + id + "؟",
      function () {
        // [INVSET-CANCEL-REASON] سبب الإلغاء يُطلب هنا في الواجهة كتسهيل،
        // لكن الفحص الحقيقي والملزم يتم في الـ Backend (deleteSaleInvoice)
        // بناءً على إعداد require_cancel_reason — لو الإعداد مفعّل والسبب
        // فاضي، الـ Backend هيرفض العملية حتى لو تم تجاوز هذه النافذة.
        var reason = window.prompt(
          "سبب الإلغاء/الحذف (اتركه فارغًا إذا لم يكن مطلوبًا):",
          "",
        );
        if (reason === null) return; // المستخدم ضغط إلغاء على نافذة السبب
        DL.Invoices.deleteSaleInvoice(id, {
          onSuccess: function (res) {
            NotificationEngine.success("تم الحذف");
            APP.data.saleInvoices = (APP.data.saleInvoices || []).filter(
              function (i) {
                return i.id !== id;
              },
            );
            // [PERF-FIX-INV] تحديث UI بدون fade بعد الحذف المحلي
            APP._fromSilentRefresh = true;
            renderPage(APP.currentPage);
            APP._fromSilentRefresh = false;
          },
          onError: function (res) {
            NotificationEngine.error((res && res.message) || "خطأ");
          },
        }, reason);
      },
    );
  }

  function _buildModal(
    id,
    title,
    color,
    bodyHtml,
    footerHtml,
    maxWidth,
    extraClass,
  ) {
    var div = document.createElement("div");
    div.innerHTML =
      '<div class="modal-overlay" id="' +
      id +
      '" onclick="if(event.target===this)closeModal(\'' +
      id +
      "')\">" +
      '<div class="modal-box' +
      (extraClass ? " " + extraClass : "") +
      '"' +
      (maxWidth ? ' style="max-width:' + maxWidth + 'px"' : "") +
      ">" +
      '<div class="modal-header">' +
      '<div class="modal-header-left">' +
      '<div class="modal-icon" style="background:' +
      color +
      "22;color:" +
      color +
      '"><i class="ti ti-file-invoice"></i></div>' +
      "<div><h2>" +
      esc(title) +
      "</h2></div>" +
      "</div>" +
      '<button class="modal-close" onclick="closeModal(\'' +
      id +
      '\')"><i class="ti ti-x"></i></button>' +
      "</div>" +
      '<div class="modal-body">' +
      bodyHtml +
      "</div>" +
      '<div class="modal-actions">' +
      footerHtml +
      "</div>" +
      "</div></div>";
    return div.firstChild;
  }

  // ─────────────────────────────────────────────────────────────
  // §RET-E  صف بند المرتجع
  // ─────────────────────────────────────────────────────────────
  function _renderReturnLineRow(line, idx, prefix) {
    var items = APP.data.items || [];
    var colors = APP.data.colors || [];
    var itemOpts = items
      .map(function (it) {
        var sel =
          line.item_id === it.id || line.item_name === it.name
            ? " selected"
            : "";
        return (
          '<option value="' +
          esc(it.id) +
          '"' +
          sel +
          ">" +
          esc(it.name) +
          "</option>"
        );
      })
      .join("");
    var colorOpts =
      '<option value="">—</option>' +
      colors
        .map(function (c) {
          var sel = (line.color || "") === c.name ? " selected" : "";
          return (
            '<option value="' +
            esc(c.name) +
            '"' +
            sel +
            ">" +
            esc(c.name) +
            "</option>"
          );
        })
        .join("");
    var qty = line.qty || line.quantity || 1;
    var price = line.unit_price || line.price || 0;
    return (
      '<tr class="' +
      prefix +
      '-line-row">' +
      '<td><select class="input input-sm ' +
      prefix +
      '-item-sel" onchange="_calcReturnLine(this)">' +
      '<option value="">-- اختر صنف --</option>' +
      itemOpts +
      "</select></td>" +
      '<td><select class="input input-sm ' +
      prefix +
      '-color-sel">' +
      colorOpts +
      "</select></td>" +
      '<td><input type="number" class="input input-sm ' +
      prefix +
      '-qty" value="' +
      qty +
      '" min="1" style="width:70px;text-align:center" onchange="_calcReturnLine(this)"></td>' +
      '<td><input type="number" class="input input-sm ' +
      prefix +
      '-price" value="' +
      price +
      '" min="0" step="0.01" style="width:90px" onchange="_calcReturnLine(this)"></td>' +
      '<td class="' +
      prefix +
      '-line-total" style="font-weight:600">' +
      Number(qty * price).toFixed(0) +
      "</td>" +
      '<td><button class="btn btn-outline btn-xs" onclick="this.closest(\'tr\').remove()"><i class="ti ti-trash" style="font-size:12px"></i></button></td>' +
      "</tr>"
    );
  }

  // [FIX] _calcReturnLine كانت مستدعاة من onchange في صفوف مرتجع البيع/الشراء
  // (_renderReturnLineRow) لكنها لم تكن موجودة أصلاً — تسبب ذلك في ReferenceError
  // عند تغيير الصنف/الكمية/السعر، ولم يكن سعر الصنف يُملأ تلقائيًا ولا إجمالي
  // الصف يتحدّث. تم تنفيذها هنا لتعمل مع صفوف مرتجع البيع (sret) والشراء (pret).
  function _calcReturnLine(el) {
    var row = el.closest("tr");
    if (!row) return;
    var prefix = /(^|\s)(sret|pret)-line-row(\s|$)/.test(row.className)
      ? row.className.indexOf("sret-line-row") !== -1
        ? "sret"
        : "pret"
      : null;
    if (!prefix) return;

    var itemSel = row.querySelector("." + prefix + "-item-sel");
    var qtyEl = row.querySelector("." + prefix + "-qty");
    var priceEl = row.querySelector("." + prefix + "-price");
    var totalEl = row.querySelector("." + prefix + "-line-total");

    // لو المستخدم غيّر الصنف: نملأ السعر تلقائيًا من بيانات الصنف
    // (فقط لو حقل السعر فاضي أو صفر، حتى لا نطغى على سعر أدخله المستخدم يدويًا)
    if (
      el === itemSel &&
      priceEl &&
      (!priceEl.value || Number(priceEl.value) === 0)
    ) {
      var itemId = itemSel.value;
      var item = (APP.data.items || []).find(function (it) {
        return it.id === itemId;
      });
      if (item) {
        var defaultPrice =
          item.unit_price || item.price || item.sale_price || 0;
        if (defaultPrice) priceEl.value = defaultPrice;
      }
    }

    var qty = Number((qtyEl && qtyEl.value) || 0);
    var price = Number((priceEl && priceEl.value) || 0);
    if (totalEl) totalEl.textContent = Number(qty * price).toFixed(0);
  }

  function _addReturnLine(prefix) {
    var tbody = document.getElementById(prefix + "-lines-body");
    if (!tbody) return;
    var idx = tbody.querySelectorAll("tr").length;
    tbody.insertAdjacentHTML(
      "beforeend",
      _renderReturnLineRow({}, idx, prefix),
    );
  }

  // ─────────────────────────────────────────────────────────────
  // §RET-F  جمع بيانات المرتجع وإرسالها
  // ─────────────────────────────────────────────────────────────
  function _collectReturnLines(prefix) {
    var lines = [];
    document
      .querySelectorAll("." + prefix + "-line-row")
      .forEach(function (row) {
        var itemSel = row.querySelector("." + prefix + "-item-sel");
        var colorSel = row.querySelector("." + prefix + "-color-sel");
        var qtyInput = row.querySelector("." + prefix + "-qty");
        var priceInput = row.querySelector("." + prefix + "-price");
        var itemId = itemSel ? itemSel.value : "";
        var qty = Number(qtyInput ? qtyInput.value : 0);
        if (!itemId || qty <= 0) return;
        var item = (APP.data.items || []).find(function (i) {
          return i.id === itemId;
        });
        lines.push({
          item_id: itemId,
          item_name: item ? item.name : itemId,
          color: colorSel ? colorSel.value : "",
          qty: qty,
          quantity: qty,
          unit_price: Number(priceInput ? priceInput.value : 0),
          total: qty * Number(priceInput ? priceInput.value : 0),
        });
      });
    return lines;
  }

  function saveSaleReturn() {
    var party = (document.getElementById("sret-party") || {}).value || "";
    var date = (document.getElementById("sret-date") || {}).value || "";
    var origInv = (document.getElementById("sret-orig-inv") || {}).value || "";
    var reason = (document.getElementById("sret-reason") || {}).value || "";
    var warehouse =
      (document.getElementById("sret-warehouse") || {}).value || "";
    var notes = (document.getElementById("sret-notes") || {}).value || "";
    var discVal = Number(
      // [BUG-FIX 2026-07-04] كان يقرأ id="sret-disc-val" وهو غير موجود؛
      // العنصر الفعلي المُولَّد من _renderInvoiceTotalsSection هو
      // "sret-discount-val" — فكان الخصم دائمًا صفرًا مهما أدخل المستخدم
      (document.getElementById("sret-discount-val") || {}).value || 0,
    );
    var discType =
      // كان يقرأ radio باسم "sret-disc-type" غير موجود أصلاً؛ العنصر
      // الفعلي select#sret-discount-type (راجع _renderInvoiceTotalsSection)
      (document.getElementById("sret-discount-type") || {}).value || "fixed";
    var vatPct = Number((document.getElementById("sret-vat") || {}).value || 0);

    var lines = _collectReturnLines("sret");
    if (!lines.length) {
      NotificationEngine.error("أضف بند واحد على الأقل");
      return;
    }
    if (!party.trim()) {
      NotificationEngine.error("أدخل اسم العميل");
      return;
    }

    var subtotal = lines.reduce(function (s, l) {
      return s + (l.total || 0);
    }, 0);

    NotificationEngine.loading("جاري الحفظ...");
    callServer(
      "addSaleReturn",
      {
        party: party,
        date: date,
        original_invoice_id: origInv,
        reason: reason,
        warehouse: warehouse,
        notes: notes,
        subtotal: subtotal,
        discount_value: discVal,
        discount_type: discType,
        vat_percent: vatPct,
        lines: lines,
      },
      function (res) {
        if (res && res.success) {
          finishLoadingToast("تم حفظ مرتجع البيع بنجاح ", "success");
          // [AUDIT-FIX-RETURNS-JOURNAL-2026-08-08] callServer هنا خام (مش
          // عبر SaveEngine.run)، فمحتاج نتعامل مع journal_warning يدويًا —
          // نفس الحقل اللي SaveEngine بيتعرف عليه تلقائيًا في شاشات تانية.
          if (res.journal_warning) {
            NotificationEngine.warning(res.journal_warning);
          }
          closeModal("sret-modal");
          APP.data.saleReturns = APP.data.saleReturns || [];
          APP.data.saleReturns.push({
            id: res.data.id,
            party: party,
            date: date,
            original_invoice_id: origInv,
            reason: reason,
            net_total: res.data.net_total,
            lines_json: lines,
          });
          renderPage("sale-returns");
        } else {
          finishLoadingToast((res && res.message) || "خطأ في الحفظ", "error");
        }
      },
    );
  }

  /**
   * _onSinvShippingCoChange — يُحدَّث عند تغيير شركة الشحن في فاتورة البيع
   * يُجري حساباً تلقائياً للتكلفة ويُعبّئ الحقل
   */
  function _onSinvShippingCoChange(prefix) {
    // [BUG-FIX 2026-07-04] الدالة كانت مربوطة بـ "sinv" فقط، ودالة قراءة
    // الإجمالي كانت بتدوّر على id="sinv-net-total" وهو غير موجود أصلاً
    // (الـ id الحقيقي المُولَّد من _renderInvoiceTotalsSection هو
    // "<prefix>-nettotal" بدون شرطة) — فكانت invoiceTotal = 0 دائمًا،
    // وبالتالي حساب الشحن كنسبة % من قيمة الفاتورة كان يرجع صفر دومًا.
    // اتصلحت هنا + اتعمّمت الدالة لتقبل أي بادئة مستند (تُستخدم الآن من
    // شاشة إنشاء الفاتورة الجديدة كاملة الصفحة — 29_JS_InvoiceWorkspace.html).
    prefix = prefix || "sinv";
    var coEl = document.getElementById(prefix + "-shipping-co");
    var costEl = document.getElementById(prefix + "-shipping-cost");
    var hint = document.getElementById(prefix + "-ship-cost-hint");
    if (!coEl || !coEl.value) {
      if (costEl) costEl.value = "";
      if (hint) hint.textContent = "";
      return;
    }
    var companyId = coEl.value;
    // اقرأ إجمالي الفاتورة من الحقل الحالي
    var netEl = document.getElementById(prefix + "-nettotal");
    var invoiceTotal = netEl
      ? Number(netEl.textContent.replace(/[^0-9.]/g, "") || 0)
      : 0;

    if (hint) hint.textContent = "⏳ جاري الحساب...";
    _gsr(
      "calcShippingCost",
      [companyId, invoiceTotal, null, null, null],
      {
        label: "INV.calcShippingCost",
        onSuccess: function (res) {
          if (costEl) costEl.value = res.cost.toFixed(2);
          if (hint) {
            var methodLabels = {
              fixed: "مبلغ ثابت",
              by_weight: "حسب الوزن",
