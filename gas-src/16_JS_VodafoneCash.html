<script>
  // ════════════════════════════════════════════════════════════════
  // 16_JS_VodafoneCash.html
  // مركز عمليات المحافظ الإلكترونية — منطق الربط (bind) + الحالة
  // الـ render functions (renderVodafoneCash + _vfcRender*) موجودة
  // في Templates.html طبقاً لاتفاقية المشروع.
  // ════════════════════════════════════════════════════════════════

  var VC_STATE = {
    lines: [],
    stats: null,
    insights: null,
    alerts: [],
    liveTx: [],
    providerFilter: "",
    filters: { search: "", status: "", branch: "", employee: "" },
    detailLineId: null,
    detailCache: {},
    loaded: false,
  };

  var _vcPollTimer = null;
  var _vcPollCounter = 0;
  var _vcFilteredMode = false;
  var _vcKnownTxIds = {};

  // ── [VC-CACHE] كاش بيانات المحافظ في sessionStorage (5 دقائق) ────
  var _vcCacheKey = "wms_vc_cache_v1";
  var _vcCacheTTL = 300000; // 5 دقائق

  function _vcSaveCache(data) {
    try {
      sessionStorage.setItem(
        _vcCacheKey,
        JSON.stringify({ data: data, ts: Date.now() }),
      );
    } catch (e) {}
  }

  function _vcLoadCache() {
    try {
      var raw = sessionStorage.getItem(_vcCacheKey);
      if (!raw) return null;
      var c = JSON.parse(raw);
      if (Date.now() - c.ts > _vcCacheTTL) return null;
      return c.data;
    } catch (e) {
      return null;
    }
  }

  function _vcApplyCache(res) {
    if (res.stats && res.stats.success) {
      VC_STATE.stats = res.stats;
      var grid = document.getElementById("vc-kpi-grid");
      if (grid) {
        grid.innerHTML = _vfcRenderKpis(res.stats);
        grid.style.opacity = "1";
      }
      var tabsEl = document.getElementById("vc-provider-tabs");
      if (tabsEl)
        tabsEl.innerHTML = _vfcRenderProviderTabs(
          VC_STATE.providerFilter,
          res.stats.providerUsage,
        );
      var chartWeek = document.getElementById("vc-chart-week");
      if (chartWeek) {
        chartWeek.innerHTML =
          res.stats.weekSeries && res.stats.weekSeries.length
            ? _vfcSvgBarChart(
                res.stats.weekSeries.map(function (s) {
                  return {
                    label: s.date.slice(5),
                    a: s.deposit,
                    b: s.withdraw,
                  };
                }),
                {
                  width: 560,
                  height: 170,
                  colorA: "#10B981",
                  colorB: "#EF4444",
                },
              )
            : '<div class="vc-empty-mini">لا توجد بيانات بعد</div>';
      }
      var chartProv = document.getElementById("vc-chart-providers");
      if (chartProv) {
        var slices = (res.stats.providerUsage || [])
          .filter(function (p) {
            return p.linesCount > 0;
          })
          .map(function (p) {
            return { label: p.name, value: p.linesCount, color: p.color };
          });
        chartProv.innerHTML = slices.length
          ? _vfcSvgDonut(slices, { size: 150 }) +
            '<div class="vc-donut-legend">' +
            slices
              .map(function (s) {
                return (
                  '<div class="vc-legend-item"><span class="vc-legend-dot" style="background:' +
                  s.color +
                  '"></span>' +
                  esc(s.label) +
                  " (" +
                  s.value +
                  ")</div>"
                );
              })
              .join("") +
            "</div>"
          : '<div class="vc-empty-mini">لا توجد بيانات</div>';
      }
      var topLines = document.getElementById("vc-top-lines");
      if (topLines)
        topLines.innerHTML = _vfcRenderTopList(
          res.stats.topLines,
          "txCount",
          function (i) {
            return i.customer_name + " (" + i.vf_number + ")";
          },
        );
      var topEmp = document.getElementById("vc-top-employees");
      if (topEmp)
        topEmp.innerHTML = _vfcRenderTopList(
          res.stats.topEmployees,
          "count",
          function (i) {
            return i.user;
          },
        );
    }
    if (res.lines && res.lines.success) {
      VC_STATE.lines = res.lines.lines;
      VC_STATE.loaded = true;
      _vcPopulateBranchEmployeeFilters(res.lines.lines);
      _vcRenderTable();
    }
    if (res.alerts && res.alerts.success) {
      VC_STATE.alerts = res.alerts.alerts;
      var alertEl = document.getElementById("vc-alerts-wrap");
      if (alertEl) alertEl.innerHTML = _vfcRenderAlerts(res.alerts.alerts);
      var cnt = document.getElementById("vc-alerts-count");
      if (cnt) cnt.textContent = res.alerts.alerts.length;
    }
    if (res.insights && res.insights.success) {
      VC_STATE.insights = res.insights;
      var insEl = document.getElementById("vc-insights-wrap");
      if (insEl) insEl.innerHTML = _vfcRenderInsights(res.insights);
    }
  }

  // [VC-PRELOAD] يُستدعى بعد اللوجين لتحميل بيانات المحافظ في الخلفية
  var _vcPreloading = false;
  function _vcPreload() {
    if (_vcPreloading || VC_STATE.loaded) return;
    var cached = _vcLoadCache();
    if (cached) {
      VC_STATE._cachedData = cached;
      return;
    }
    _vcPreloading = true;
    _gsr(
      "getVodafoneCashAllData",
      [
        {
          provider: "",
          filters: { status: "", branch: "", employee: "", search: "" },
        },
      ],
      {
        label: "getVodafoneCashAllData:preload",
        rawResponse: true,
        onSuccess: function (r) {
          _vcPreloading = false;
          var res = r && r.data;
          if (res && res.success) {
            VC_STATE._cachedData = res;
            _vcSaveCache(res);
          }
        },
        onError: function () {
          _vcPreloading = false;
        },
      },
    );
  }

  // ── نقطة الدخول — يستدعيها الراوتر في 01_JS_Core_Auth ──────────
  function bindVodafoneCash() {
    _vcKnownTxIds = {};
    _vcFilteredMode = false;
    VC_STATE.providerFilter = "";
    VC_STATE.filters = { search: "", status: "", branch: "", employee: "" };

    // [VC-CACHE] لو في بيانات محملة مسبقاً (preload أو كاش) → اعرضها فوراً
    var preloaded = VC_STATE._cachedData || _vcLoadCache();
    if (preloaded) {
      VC_STATE._cachedData = null;
      _vcApplyCache(preloaded);
      _vcSetLoading(false);
      // تحديث صامت في الخلفية لضمان حداثة البيانات
      setTimeout(function () {
        _vcLoadAll(true);
      }, 800);
    } else {
      _vcLoadAll();
    }
    _vcBindToolbar();
    _vcStartPolling();
  }

  var _vcLoading = false;

  function _vcSetLoading(on) {
    _vcLoading = on;
    var tabs = document.getElementById("vc-provider-tabs");
    if (tabs) tabs.style.opacity = on ? "0.6" : "1";
    var grid = document.getElementById("vc-kpi-grid");
    if (grid) grid.style.opacity = on ? "0.5" : "1";
    var tbody = document.getElementById("vc-lines-table-wrap");
    if (tbody) {
      if (on) {
        tbody.innerHTML =
          '<div class="vc-empty-mini"><div class="spinner" style="margin:auto"></div></div>';
      } else {
        // [FIX-VC-SPINNER] لو الـ spinner موجود بعد إيقاف التحميل — نوضح حالة فارغة بدل ما يفضل
        // هذا يُصلح البق: لما res.success=false كان الـ spinner يفضل للأبد في الجدول
        var spinnerRow = tbody.querySelector(".vc-empty-mini .spinner");
        if (spinnerRow) {
          tbody.innerHTML =
            '<div class="vc-empty-mini" style="color:var(--text3);padding:20px">' +
            '<i class="ti ti-inbox" style="font-size:20px;display:block;text-align:center;margin-bottom:6px"></i>' +
            '<div style="text-align:center;font-size:12px">لا توجد بيانات</div>' +
            "</div>";
        }
      }
    }
  }

  // silent=true → تحديث خلفي بدون أي loading state أو وميض
  function _vcLoadAll(silent) {
    if (_vcLoading) return;
    if (!silent) _vcSetLoading(true);
    _gsr(
      "getVodafoneCashAllData",
      [
        {
          provider: VC_STATE.providerFilter,
          filters: {
            status: VC_STATE.filters.status,
            branch: VC_STATE.filters.branch,
            employee: VC_STATE.filters.employee,
            search: VC_STATE.filters.search,
          },
        },
      ],
      {
        label: "getVodafoneCashAllData",
        rawResponse: true,
        onSuccess: function (r) {
          var res = r && r.data;
          if (!silent) _vcSetLoading(false);
          _vcLoading = false;
          // [FIX-VC-SILENT-FAIL] بدل الصمت — نوضح خطأ للمستخدم غير الصامت
          if (!res || !res.success) {
            if (!silent && typeof showToast === "function") {
              NotificationEngine.error((res && res.message) || "تعذر تحميل البيانات");
            }
            return;
          }
          // Stats
          if (res.stats && res.stats.success) {
            VC_STATE.stats = res.stats;
            var grid = document.getElementById("vc-kpi-grid");
            if (grid) {
              grid.innerHTML = _vfcRenderKpis(res.stats);
              grid.style.opacity = "1";
            }
            var tabsEl = document.getElementById("vc-provider-tabs");
            if (tabsEl)
              tabsEl.innerHTML = _vfcRenderProviderTabs(
                VC_STATE.providerFilter,
                res.stats.providerUsage,
              );
            var chartWeek = document.getElementById("vc-chart-week");
            if (chartWeek) {
              chartWeek.innerHTML =
                res.stats.weekSeries && res.stats.weekSeries.length
                  ? _vfcSvgBarChart(
                      res.stats.weekSeries.map(function (s) {
                        return {
                          label: s.date.slice(5),
                          a: s.deposit,
                          b: s.withdraw,
                        };
                      }),
                      {
                        width: 560,
                        height: 170,
                        colorA: "#10B981",
                        colorB: "#EF4444",
                      },
                    )
                  : '<div class="vc-empty-mini">لا توجد بيانات بعد</div>';
            }
            var chartProv = document.getElementById("vc-chart-providers");
            if (chartProv) {
              var slices = (res.stats.providerUsage || [])
                .filter(function (p) {
                  return p.linesCount > 0;
                })
                .map(function (p) {
                  return { label: p.name, value: p.linesCount, color: p.color };
                });
              chartProv.innerHTML = slices.length
                ? _vfcSvgDonut(slices, { size: 150 }) +
                  '<div class="vc-donut-legend">' +
                  slices
                    .map(function (s) {
                      return (
                        '<div class="vc-legend-item"><span class="vc-legend-dot" style="background:' +
                        s.color +
                        '"></span>' +
                        esc(s.label) +
                        " (" +
                        s.value +
                        ")</div>"
                      );
                    })
                    .join("") +
                  "</div>"
                : '<div class="vc-empty-mini">لا توجد بيانات</div>';
            }
            var topLines = document.getElementById("vc-top-lines");
            if (topLines)
              topLines.innerHTML = _vfcRenderTopList(
                res.stats.topLines,
                "txCount",
                function (i) {
                  return i.customer_name + " (" + i.vf_number + ")";
                },
              );
            var topEmp = document.getElementById("vc-top-employees");
            if (topEmp)
              topEmp.innerHTML = _vfcRenderTopList(
                res.stats.topEmployees,
                "count",
                function (i) {
                  return i.user;
                },
              );
          }
          // Lines
          if (res.lines && res.lines.success) {
            VC_STATE.lines = res.lines.lines;
            VC_STATE.loaded = true;
            _vcPopulateBranchEmployeeFilters(res.lines.lines);
            _vcRenderTable();
          }
          // Alerts
          if (res.alerts && res.alerts.success) {
            VC_STATE.alerts = res.alerts.alerts;
            var alertEl = document.getElementById("vc-alerts-wrap");
            if (alertEl)
              alertEl.innerHTML = _vfcRenderAlerts(res.alerts.alerts);
            var cnt = document.getElementById("vc-alerts-count");
            if (cnt) cnt.textContent = res.alerts.alerts.length;
          }
          // Insights
          if (res.insights && res.insights.success) {
            VC_STATE.insights = res.insights;
            var insEl = document.getElementById("vc-insights-wrap");
            if (insEl) insEl.innerHTML = _vfcRenderInsights(res.insights);
          }
          // [VC-CACHE] احفظ الـ response كاملاً لو الفلاتر افتراضية
          if (
            !VC_STATE.providerFilter &&
            !VC_STATE.filters.status &&
            !VC_STATE.filters.branch &&
            !VC_STATE.filters.employee &&
            !VC_STATE.filters.search
          ) {
            _vcSaveCache(res);
          }
        },
        onError: function () {
          if (!silent) {
            _vcSetLoading(false);
            NotificationEngine.error("تعذر تحميل البيانات، حاول مرة أخرى");
          }
          _vcLoading = false;
        },
      },
    );
    if (!_vcFilteredMode) _vcLoadLiveFeed();
  }

  function _vcLoadStats() {
    _gsr("getVodafoneCashDashboardStats", [VC_STATE.providerFilter], {
      label: "getVodafoneCashDashboardStats",
      onSuccess: function (r) {
        var res = r.data;
        if (!res) return;
        VC_STATE.stats = res;
        var grid = document.getElementById("vc-kpi-grid");
        if (grid) grid.innerHTML = _vfcRenderKpis(res);
        var tabsEl = document.getElementById("vc-provider-tabs");
        if (tabsEl)
          tabsEl.innerHTML = _vfcRenderProviderTabs(
            VC_STATE.providerFilter,
            res.providerUsage,
          );
        var chartWeek = document.getElementById("vc-chart-week");
        if (chartWeek) {
          chartWeek.innerHTML =
            res.weekSeries && res.weekSeries.length
              ? _vfcSvgBarChart(
                  res.weekSeries.map(function (s) {
                    return {
                      label: s.date.slice(5),
                      a: s.deposit,
                      b: s.withdraw,
                    };
                  }),
                  {
                    width: 560,
                    height: 170,
                    colorA: "#10B981",
                    colorB: "#EF4444",
                  },
                )
              : '<div class="vc-empty-mini">لا توجد بيانات بعد</div>';
        }
        var chartProv = document.getElementById("vc-chart-providers");
        if (chartProv) {
          var slices = (res.providerUsage || [])
            .filter(function (p) {
              return p.linesCount > 0;
            })
            .map(function (p) {
              return { label: p.name, value: p.linesCount, color: p.color };
            });
          chartProv.innerHTML = slices.length
            ? _vfcSvgDonut(slices, { size: 150 }) +
              '<div class="vc-donut-legend">' +
              slices
                .map(function (s) {
                  return (
                    '<div class="vc-legend-item"><span class="vc-legend-dot" style="background:' +
                    s.color +
                    '"></span>' +
                    esc(s.label) +
                    " (" +
                    s.value +
                    ")</div>"
                  );
                })
                .join("") +
              "</div>"
            : '<div class="vc-empty-mini">لا توجد بيانات بعد</div>';
        }
        var topLines = document.getElementById("vc-top-lines");
        if (topLines)
          topLines.innerHTML = _vfcRenderTopList(
            res.topLines,
            "txCount",
            function (i) {
              return i.name + " (" + i.vf_number + ")";
            },
          );
        var topEmp = document.getElementById("vc-top-employees");
        if (topEmp)
          topEmp.innerHTML = _vfcRenderTopList(
            res.topEmployees,
            "count",
            function (i) {
              return i.user;
            },
          );
      },
      onError: function (r) {
        console.warn("[VC] stats refresh failed:", r && r.message);
      },
    });
  }

  function _vcLoadInsights() {
    _gsr("getVodafoneCashInsights", [VC_STATE.providerFilter], {
      label: "getVodafoneCashInsights",
      onSuccess: function (r) {
        var res = r.data;
        if (!res) return;
        VC_STATE.insights = res;
        var el = document.getElementById("vc-insights-wrap");
        if (el) el.innerHTML = _vfcRenderInsights(res);
      },
      onError: function (r) {
        console.warn("[VC] insights load failed:", r && r.message);
      },
    });
  }

  function _vcLoadAlerts() {
    _gsr("getVodafoneCashAlerts", [VC_STATE.providerFilter], {
      label: "getVodafoneCashAlerts",
      onSuccess: function (r) {
        var res = r.data;
        if (!res) return;
        VC_STATE.alerts = res.alerts;
        var el = document.getElementById("vc-alerts-wrap");
        if (el) el.innerHTML = _vfcRenderAlerts(res.alerts);
        var count = document.getElementById("vc-alerts-count");
        if (count) count.textContent = res.alerts.length;
      },
      onError: function (r) {
        console.warn("[VC] alerts load failed:", r && r.message);
      },
    });
  }

  function _vcLoadLines() {
    _gsr(
      "getVodafoneCashLines",
      [
        {
          provider: VC_STATE.providerFilter,
          status: VC_STATE.filters.status,
          branch: VC_STATE.filters.branch,
          employee: VC_STATE.filters.employee,
          search: VC_STATE.filters.search,
        },
      ],
      {
        label: "getVodafoneCashLines",
        rawResponse: true,
        onSuccess: function (r) {
          var res = r && r.data;
          if (res && res.success) {
            VC_STATE.lines = res.lines;
            VC_STATE.loaded = true;
            _vcPopulateBranchEmployeeFilters(res.lines);
            _vcRenderTable();
          } else if (res) {
            NotificationEngine.error(res.message);
          }
        },
        onError: function () {
          NotificationEngine.error("تعذر تحميل بيانات الخطوط");
        },
      },
    );
  }

  function _vcPopulateBranchEmployeeFilters(lines) {
    var branches = [],
      employees = [];
    lines.forEach(function (l) {
      if (l.branch && branches.indexOf(l.branch) === -1)
        branches.push(l.branch);
      if (l.employee && employees.indexOf(l.employee) === -1)
        employees.push(l.employee);
    });
    var bSel = document.getElementById("vc-filter-branch");
    if (bSel && bSel.options.length <= 1) {
      branches.forEach(function (b) {
        var o = document.createElement("option");
        o.value = b;
        o.textContent = b;
        bSel.appendChild(o);
      });
    }
    var eSel = document.getElementById("vc-filter-employee");
    if (eSel && eSel.options.length <= 1) {
      employees.forEach(function (e) {
        var o = document.createElement("option");
        o.value = e;
        o.textContent = e;
        eSel.appendChild(o);
      });
    }
  }

  function _vcLoadLiveFeed() {
    _gsr("getVodafoneCashTransactions", [{ limit: 20 }], {
      label: "getVodafoneCashTransactions",
      onSuccess: function (r) {
        var res = r.data;
        if (res) _vcMergeLiveFeed(res.transactions);
      },
      onError: function () {
        /* Live feed polling — silent on error */
      },
    });
  }

  function _vcMergeLiveFeed(txs) {
    var el = document.getElementById("vc-live-feed");
    if (!el) return;
    var isFirstLoad = Object.keys(_vcKnownTxIds).length === 0;
    var html = "";
    txs.forEach(function (t) {
      var isNew = !isFirstLoad && !_vcKnownTxIds[t.id];
      _vcKnownTxIds[t.id] = true;
      html += _vfcRenderLiveFeedItem(t, isNew);
    });
    el.innerHTML = html || _vfcRenderLiveFeed([]);
    VC_STATE.liveTx = txs;
  }

  // ── جدول الخطوط عبر ColumnEngine ──────────────────────────────
  // [COLUMN-ENGINE] الفلترة (بحث/حالة/فرع/موظف) تحصل Server-side بالفعل
  // في _vcLoadLines (getVodafoneCashLines) قبل ما توصل هنا — نفس نمط
  // Catalog_Stock (فلتر خارجي يضيّق المصفوفة، والمحرك بيعرضها بس).
  var _vfcLinesColumnsRegistered = false;

  function _vfcRegisterLineColumns() {
    if (_vfcLinesColumnsRegistered) return;
    _vfcLinesColumnsRegistered = true;
    ColumnEngine.register(
      "vfc_lines",
      [
        {
          key: "customer_name",
          label: "الخط",
          type: "text",
          width: 170,
          frozen: "right",
          format: function (v, row) {
            return (
              '<div class="vc-line-cell"><b>' +
              esc(v || "") +
              "</b><span>" +
              esc(row.vf_number || "") +
              "</span></div>"
            );
          },
        },
        {
          key: "provider",
          label: "الشركة",
          type: "text",
          width: 100,
          format: function (v) {
            var meta = VFC_PROVIDER_META[v] || VFC_PROVIDER_META.vodafone;
            return (
              '<span class="vc-provider-pill" style="--pc:' +
              meta.color +
              '">' +
              (meta.logo
                ? '<img class="vc-pill-logo" src="' + meta.logo + '" alt=""/>'
                : "") +
              meta.short +
              "</span>"
            );
          },
        },
        {
          key: "branch",
          label: "الفرع / الموظف",
          type: "text",
          width: 150,
          format: function (v, row) {
            return (
              '<div class="vc-meta-cell"><span>' +
              esc(v || "—") +
              "</span><span>" +
              esc(row.employee || "—") +
              "</span></div>"
            );
          },
        },
        {
          key: "balance",
          label: "الرصيد",
          type: "number",
          width: 110,
          format: function (v) {
            return '<b class="sensitive-balance">' + _vfcFmtMoney(v) + "</b>";
          },
        },
        {
          key: "dailyRemaining",
          label: "الحد اليومي",
          type: "text",
          width: 140,
          sortable: false,
          format: function (v, row) {
            return _vfcLimitBar(
              row.dailyPct,
              row.dailyRemaining,
              row.dailyLimit,
              "#2563EB",
            );
          },
        },
        {
          key: "monthlyRemaining",
          label: "الحد الشهري",
          type: "text",
          width: 140,
          sortable: false,
          format: function (v, row) {
            return _vfcLimitBar(
              row.monthlyPct,
              row.monthlyRemaining,
              row.monthlyLimit,
              "#7C3AED",
            );
          },
        },
        {
          key: "txCount",
          label: "العمليات",
          type: "number",
          width: 90,
          align: "center",
        },
        {
          key: "totalDeposit",
          label: "الإيداع / السحب",
          type: "text",
          width: 140,
          sortable: false,
          format: function (v, row) {
            return (
              '<div class="vc-inout sensitive-balance"><span class="in">+' +
              _vfcFmtMoney(row.totalDeposit) +
              '</span><span class="out">-' +
              _vfcFmtMoney(row.totalWithdraw) +
              "</span></div>"
            );
          },
        },
        {
          key: "totalCommission",
          label: "العمولات",
          type: "number",
          width: 100,
          format: function (v) {
            return (
              '<span class="sensitive-balance">' + _vfcFmtMoney(v) + "</span>"
            );
          },
        },
        {
          key: "lastTxDate",

  function _vcDebounce(fn, wait) {
    var t;
    return function () {
      var args = arguments,
        ctx = this;
      clearTimeout(t);
      t = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  // ── Polling حي — يوقف نفسه عند مغادرة الصفحة ────────────────────
  function _vcStartPolling() {
    if (_vcPollTimer) clearInterval(_vcPollTimer);
    _vcPollCounter = 0;
    _vcPollTimer = setInterval(function () {
      if (!APP.currentUser || !SESSION.token || APP.currentPage !== "vodafone_cash") {
        clearInterval(_vcPollTimer);
        _vcPollTimer = null;
        return;
      }
      _vcLoadLiveFeed();
      _vcPollCounter++;
      if (_vcPollCounter % 2 === 0) {
        _vcLoading = false;
        _vcLoadAll(true); // silent — تحديث خلفي بدون وميض
      }
      if (VC_STATE.detailLineId && _vcPollCounter % 2 === 0) {
        _vcLoadDetail(VC_STATE.detailLineId, true);
      }
    }, 15000);
  }

  // ── إضافة خط جديد ─────────────────────────────────────────────
  // ── Custom Provider Dropdown (بالـ Logo) ─────────────────────
  // يبني custom dropdown بدل <select> العادي ويعمل hidden input بنفس الـ id
  // fieldId   : id المستخدم لقراءة القيمة (hidden input)
  // activeKey : مفتاح الشركة المحدد مسبقاً (أو "" لأول عنصر)
  function _vfcProviderDropdown(fieldId, activeKey) {
    var keys = Object.keys(VFC_PROVIDER_META);
    if (!activeKey || !VFC_PROVIDER_META[activeKey]) activeKey = keys[0];
    var activeM = VFC_PROVIDER_META[activeKey];
    var dropId = "vfcdrop-" + fieldId;

    var optionsHtml = keys
      .map(function (k) {
        var m = VFC_PROVIDER_META[k];
        return (
          '<div class="vfcd-option' +
          (k === activeKey ? " vfcd-active" : "") +
          '" data-key="' +
          k +
          '">' +
          '<img src="' +
          m.logo +
          '" class="vfcd-logo" alt=""/>' +
          '<span class="vfcd-name">' +
          esc(m.name) +
          "</span>" +
          '<span class="vfcd-dot" style="background:' +
          m.color +
          '"></span>' +
          "</div>"
        );
      })
      .join("");

    return (
      '<input type="hidden" id="' +
      fieldId +
      '" value="' +
      activeKey +
      '"/>' +
      '<div class="vfcd-wrap" id="' +
      dropId +
      '">' +
      '<div class="vfcd-trigger">' +
      '<img src="' +
      activeM.logo +
      '" class="vfcd-logo" alt=""/>' +
      '<span class="vfcd-name">' +
      esc(activeM.name) +
      "</span>" +
      '<span class="vfcd-dot" style="background:' +
      activeM.color +
      '"></span>' +
      '<i class="ti ti-chevron-down vfcd-arrow"></i>' +
      "</div>" +
      '<div class="vfcd-menu">' +
      optionsHtml +
      "</div>" +
      "</div>"
    );
  }

  // init event delegation للـ custom dropdowns بعد إدراجهم في DOM
  function _vfcInitDropdowns() {
    document.querySelectorAll(".vfcd-wrap").forEach(function (wrap) {
      var trigger = wrap.querySelector(".vfcd-trigger");
      var menu = wrap.querySelector(".vfcd-menu");
      var arrow = wrap.querySelector(".vfcd-arrow");
      var fieldId = wrap.id.replace("vfcdrop-", "");
      var hidden = document.getElementById(fieldId);
      if (!trigger || !menu || !hidden) return;

      trigger.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = menu.classList.toggle("vfcd-open");
        arrow.style.transform = open ? "rotate(180deg)" : "";
        if (open) {
          // close other open dropdowns
          document
            .querySelectorAll(".vfcd-menu.vfcd-open")
            .forEach(function (m) {
              if (m !== menu) {
                m.classList.remove("vfcd-open");
              }
            });
        }
      });

      menu.addEventListener("click", function (e) {
        var opt = e.target.closest(".vfcd-option");
        if (!opt) return;
        var key = opt.getAttribute("data-key");
        var m = VFC_PROVIDER_META[key];
        if (!m) return;

        // update hidden value
        hidden.value = key;

        // update trigger display
        trigger.querySelector(".vfcd-logo").src = m.logo;
        trigger.querySelector(".vfcd-name").textContent = m.name;
        trigger.querySelector(".vfcd-dot").style.background = m.color;

        // mark active
        menu.querySelectorAll(".vfcd-option").forEach(function (o) {
          o.classList.toggle("vfcd-active", o.getAttribute("data-key") === key);
        });

        menu.classList.remove("vfcd-open");
        arrow.style.transform = "";
      });
    });

    // close on outside click
    document.addEventListener("click", function () {
      document.querySelectorAll(".vfcd-menu.vfcd-open").forEach(function (m) {
        m.classList.remove("vfcd-open");
        var w = m.closest(".vfcd-wrap");
        if (w) {
          var a = w.querySelector(".vfcd-arrow");
          if (a) a.style.transform = "";
        }
      });
    });
  }

    setTimeout(function () {
      _vfcInitDropdowns();

      // ── تحديث الحدود تلقائياً لما يغير الشركة ──────────────────
      var VFC_DEFAULTS = {
        vodafone: { daily: 60000, monthly: 200000 },
        orange: { daily: 60000, monthly: 200000 },
        etisalat: { daily: 60000, monthly: 200000 },
        we: { daily: 60000, monthly: 200000 },
        instapay: { daily: 120000, monthly: 400000 },
      };
      var providerHidden = document.getElementById("vc-f-provider");
      var dailyInput = document.getElementById("vc-f-daily");
      var monthlyInput = document.getElementById("vc-f-monthly");
      var hintDaily = document.getElementById("vc-hint-daily");
      var hintMonthly = document.getElementById("vc-hint-monthly");

      // ── تنسيق الأرقام بفواصل ─────────────────────────────────────
      function _numFmt(val) {
        var n = parseFloat(String(val).replace(/,/g, "")) || 0;
        return n === 0
          ? "0"
          : n.toLocaleString("en-US", {
              minimumFractionDigits: 0,
              maximumFractionDigits: 0,
            });
      }
      function _numVal(el) {
        return parseFloat(String(el.value).replace(/,/g, "")) || 0;
      }
      function _bindCurrencyInput(el) {
        if (!el) return;
        el.value = _numFmt(el.value);
        el.addEventListener("focus", function () {
          var raw = _numVal(this);
          this.value = raw === 0 ? "" : String(raw);
        });
        el.addEventListener("blur", function () {
          this.value = _numFmt(this.value);
        });
        el.addEventListener("input", function () {
          // منع أي حرف غير رقم أو نقطة
          this.value = this.value.replace(/[^0-9.]/g, "");
        });
      }
      // ربط كل حقول العملة
      [
        document.getElementById("vc-f-opening"),
        dailyInput,
        monthlyInput,
        document.getElementById("vc-f-threshold"),
      ].forEach(_bindCurrencyInput);

      function _applyProviderDefaults(key) {
        var def = VFC_DEFAULTS[key] || VFC_DEFAULTS.vodafone;
        dailyInput.value = _numFmt(def.daily);
        monthlyInput.value = _numFmt(def.monthly);
        if (hintDaily)
          hintDaily.textContent =
            "افتراضي: " + formatMoney(def.daily, { decimals: 0 });
        if (hintMonthly)
          hintMonthly.textContent =
            "افتراضي: " + formatMoney(def.monthly, { decimals: 0 });
      }

      // تطبيق القيم الافتراضية فور فتح الفورم
      if (providerHidden)
        _applyProviderDefaults(providerHidden.value || "vodafone");

      // متابعة تغيير الشركة عبر الـ custom dropdown
      var providerWrap = document.querySelector(
        "#vfcdrop-vc-f-provider .vfcd-menu",
      );
      if (providerWrap) {
        providerWrap.addEventListener("click", function (e) {
          var opt = e.target.closest(".vfcd-option");
          if (opt) _applyProviderDefaults(opt.getAttribute("data-key"));
        });
      }

      var saveBtn = document.getElementById("vc-line-save");
      if (!saveBtn) return;
      saveBtn.addEventListener("click", function () {
        var name = document.getElementById("vc-f-name").value.trim();
        var number = document.getElementById("vc-f-number").value.trim();
        if (!name) {
          NotificationEngine.error("اسم صاحب الخط مطلوب");
          return;
        }
        if (!VF.isValidEgyptPhone(number)) {
          NotificationEngine.error("رقم الهاتف غير صالح");
          return;
        }

        var payload = _authPayload({
          provider: document.getElementById("vc-f-provider").value,
          customer_name: name,
          vf_number: number,
          branch: document.getElementById("vc-f-branch").value.trim(),
          employee: document.getElementById("vc-f-employee").value.trim(),
          opening_balance: _numVal(document.getElementById("vc-f-opening")),
          daily_limit: _numVal(document.getElementById("vc-f-daily")),
          monthly_limit: _numVal(document.getElementById("vc-f-monthly")),
          low_balance_threshold: _numVal(
            document.getElementById("vc-f-threshold"),
          ),
          notes: document.getElementById("vc-f-notes").value.trim(),
        });

        // [SAVE-ENGINE] soft-save موحّد عبر SaveButtonController (00b_JS_SaveEngine.html)
        var _sbc = SaveButtonController.attachEl(saveBtn);
        _sbc.setSaving();
        NotificationEngine.loading("جاري إضافة الخط...");
        _gsr("addVodafoneCashLine", [payload], {
          label: "addVodafoneCashLine",
          onSuccess: function (res) {
            _acCloseAll();
            finishLoadingToast(res.message, "success");
            _vcLoadAll();
          },
          onError: function (res) {
            _sbc.restore();
            finishLoadingToast("خطأ: " + res.message, "error");
          },
        });
      });
    }, 0);
  }

  function openACDrawer(opts) {
    // لو الـ body فيه sd-footer-inline نفصله ونحطه في opts.footer
    var body = opts.body || "";
    var footerMatch = body.match(
      /<div class="sd-footer-inline">([\s\S]*?)<\/div>\s*$/,
    );
    if (footerMatch) {
      opts.footer = footerMatch[1];
      opts.body = body.replace(
        /<div class="sd-footer-inline">[\s\S]*?<\/div>\s*$/,
        "",
      );
    }
    openStyledDrawer(opts);
  }

  // ── تسجيل عملية (إيداع/سحب/شحن/تحويل) ───────────────────────────
  function openVCTxForm(lineId, presetType) {
    var cache = VC_STATE.detailCache[lineId];
    var line = cache
      ? cache.line
      : VC_STATE.lines.find(function (l) {
          return l.id === lineId;
        });
    if (!line) {
      NotificationEngine.error("تعذر العثور على هذا الخط");
      return;
    }

    var body =
      '<input type="hidden" id="vc-tx-line-id" value="' +
      lineId +
      '"/>' +
      _acFieldRow([
        '<div class="form-group"><label>نوع العملية</label><select id="vc-tx-type">' +
          ["deposit", "withdraw", "transfer_in", "transfer_out", "recharge"]
            .map(function (t) {
              return (
                '<option value="' +
                t +
                '"' +
                (t === presetType ? " selected" : "") +
                ">" +
                _vfcTypeLabel(t) +
                "</option>"
              );
            })
            .join("") +
          "</select></div>",
        '<div class="form-group"><label>المبلغ *</label><input type="number" id="vc-tx-amount" placeholder="0.00"/></div>',
      ]) +
      _acFieldRow([
        '<div class="form-group"><label>العمولة</label><input type="number" id="vc-tx-commission" value="0"/></div>',
        '<div class="form-group"><label>الحالة</label><select id="vc-tx-status"><option value="success">ناجحة</option><option value="pending">معلّقة</option><option value="failed">فاشلة</option></select></div>',
      ]) +
      _acFieldRow([
        '<div class="form-group"><label>رقم العملية المرجعي</label><input type="text" id="vc-tx-ref"/></div>',
        '<div class="form-group"><label>الطرف الآخر</label><input type="text" id="vc-tx-counterparty"/></div>',
      ]) +
      '<div class="form-group"><label>التاريخ</label><input type="datetime-local" id="vc-tx-date" value="' +
      new Date().toISOString().slice(0, 16) +
      '"/></div>' +
      '<div class="form-group"><label>ملاحظات</label><textarea id="vc-tx-notes" rows="2"></textarea></div>' +
      _acFooter("vc-tx-save", "تسجيل العملية");

    openACDrawer({
      title: "تسجيل عملية",
      subtitle: esc(line.customer_name) + " — " + esc(line.vf_number),
      icon: "ti-receipt-2",
      color: "teal",
      width: 860,
      body: body,
    });

    setTimeout(function () {
      var saveBtn = document.getElementById("vc-tx-save");
      if (!saveBtn) return;
      saveBtn.addEventListener("click", function () {
        var amount = parseFloat(document.getElementById("vc-tx-amount").value);
        if (!amount || amount <= 0) {
          NotificationEngine.error("من فضلك أدخل مبلغاً صحيحاً أكبر من صفر");
          return;
        }

        var payload = _authPayload({
          line_id: lineId,
          type: document.getElementById("vc-tx-type").value,
          amount: amount,
          commission:
            parseFloat(document.getElementById("vc-tx-commission").value) || 0,
          status: document.getElementById("vc-tx-status").value,
          date: document.getElementById("vc-tx-date").value,
          ref_number: document.getElementById("vc-tx-ref").value.trim(),
          counterparty: document
            .getElementById("vc-tx-counterparty")
            .value.trim(),
          notes: document.getElementById("vc-tx-notes").value.trim(),
        });

        // [SAVE-ENGINE] soft-save موحّد
        var _sbc = SaveButtonController.attachEl(saveBtn);
        _sbc.setSaving();
        NotificationEngine.loading("جاري حفظ الحركة...");
        _gsr("addVodafoneCashTransaction", [payload], {
          label: "addVodafoneCashTransaction",
          onSuccess: function (res) {
            finishLoadingToast(res.message, "success");
            _acCloseAll();
            _vcLoadAll();
            if (VC_STATE.detailLineId === lineId) _vcLoadDetail(lineId, true);
          },
          onError: function (res) {
            _sbc.restore();
            finishLoadingToast("خطأ: " + res.message, "error");
          },
        });
      });
    }, 0);
  }

  // ── إيقاف / تشغيل خط ──────────────────────────────────────────
  function toggleVCLineStatus(id, newStatus) {
    var line =
      VC_STATE.lines.find(function (l) {
        return l.id === id;
      }) || (VC_STATE.detailCache[id] ? VC_STATE.detailCache[id].line : null);
    var isSuspend = newStatus === "suspended";
    showConfirm({
      title: isSuspend ? "إيقاف الخط" : "تشغيل الخط",
      message: isSuspend
        ? "هل تريد إيقاف الخط " +
          (line ? esc(line.vf_number) : "") +
          "؟ لن يمكن تسجيل عمليات عليه بعد الإيقاف."
        : "هل تريد إعادة تشغيل هذا الخط؟",
      confirmText: isSuspend ? "إيقاف" : "تشغيل",
      confirmClass: isSuspend ? "btn-danger" : "btn-success",
      icon: isSuspend ? "ti-player-stop" : "ti-player-play",
      onConfirm: function (unfreezeUI) {
        _gsr("setVodafoneCashLineStatus", [id, newStatus, _authPayload({})], {
          label: "setVodafoneCashLineStatus",
          onSuccess: function (r) {
            if (typeof unfreezeUI === "function") unfreezeUI();
            NotificationEngine.success(r.message);
            _vcLoadAll();
            if (VC_STATE.detailLineId === id) _vcLoadDetail(id, true);
          },
          onError: function (r) {
            if (typeof unfreezeUI === "function") unfreezeUI();
            NotificationEngine.error(r.message);
          },
        });
      },
    });
  }

        });

        // [ENGINE-UNIFY-FIX] كان هنا تنفيذ يدوي مكرر لنفس اللي SaveEngine.run

        // الموحد فعليًا رغم إن التعليق القديم كان بيقول "soft-save موحّد".
        // التحقق اليدوي فوق (اسم الخط/رقم الهاتف) اتسيب زي ما هو لأنه
        // منطق عمل خاص بالشاشة، مش جزء من التكرار.
        SaveEngine.run({
          screen: "VodafoneCash",
          entity: "vodafoneCashLine",

            _vcLoadAll();
            if (VC_STATE.detailLineId === lineId) _vcLoadDetail(lineId, true);
          },
          onError: function () {},
        });
      });
    }, 0);
  }

  // ── تصدير Excel — كل الخطوط ───────────────────────────────────
  function exportVCAllExcel() {
    if (typeof XLSX === "undefined") {
      NotificationEngine.error("مكتبة تصدير Excel غير محمّلة");
      return;
    }
    if (!VC_STATE.lines.length) {
      NotificationEngine.warning("لا توجد بيانات لتصديرها");
      return;
    }
    var rows = [
      [
        "اسم صاحب الخط",
        "رقم الخط",
        "الشركة",
        "الفرع",
        "الموظف",
        "الحالة",
        "الرصيد الحالي",
        "الحد اليومي",
        "الحد الشهري",
        "إجمالي الإيداع",
        "إجمالي السحب",
        "العمولات",
        "عدد العمليات",
        "آخر عملية",
      ],
    ];
    VC_STATE.lines.forEach(function (l) {
      rows.push([
        l.customer_name,
        l.vf_number,
        l.providerName,
        l.branch,
        l.employee,
        l.statusMeta ? l.statusMeta.label : l.status,
        l.balance,
        l.dailyLimit,
        l.monthlyLimit,
        l.totalDeposit,
        l.totalWithdraw,
        l.totalCommission,
        l.txCount,
        l.lastTxDate ? _vfcFmtDateTime(l.lastTxDate) : "",
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "المحافظ الإلكترونية");
    XLSX.writeFile(
      wb,
      "المحافظ_الإلكترونية_" + new Date().toISOString().slice(0, 10) + ".xlsx",
    );
    NotificationEngine.success(" تم تصدير البيانات بنجاح");
  }
