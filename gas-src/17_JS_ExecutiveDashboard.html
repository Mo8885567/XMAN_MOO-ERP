  // ═══════════════════════════════════════════════════════════════════════════
  // 17_JS_ExecutiveDashboard.html — لوحة القيادة التنفيذية (Executive ERP Dashboard)
  // ─────────────────────────────────────────────────────────────────────────
  // إعادة تصميم كاملة لـ renderDashboard() (انظر Templates.html) لتعطي نظرة
  // شاملة على كل موديولات النظام (مالية، مخازن، مبيعات، مشتريات، إنتاج، HR،
  // فودافون كاش) + نشاط مباشر + رسوم بيانية + تنبيهات + ملخص مخازن/فروع +
  // اختصارات سريعة + رؤى تلقائية (Smart Insights) + تخصيص (طي/إخفاء/ترتيب).
  //
  // ملاحظات مهمة (لازم تتقرأ قبل أي تعديل مستقبلي):
  // 1) القسمين CRM والتقويم/المهام غير موجودين في النظام كموديولات حقيقية
  //    (لا شيتات ولا Backend) — اتعمل لهم Widgets "قريباً" Placeholder فقط
  //    بناءً على طلب محمد، لحد ما يُبنى الموديول الحقيقي.
  // 2) "أفضل مندوب مبيعات" غير موجود كحقل فعلي في الفواتير (مفيش sales_rep) —
  //    استُبدل بـ "الأنشط في إصدار الفواتير" (created_by) حتى لا يتم proxy
  //    لمفهوم غير موجود فعلاً في الداتا.
  // 3) "الذمم المدينة/الدائنة" مُقدّرة من صافي الفواتير غير المدفوعة بالكامل
  //    (net_total) وليست من حساب أستاذ حقيقي per-party — لذلك مُعلَّم
  //    "(تقديري)" في الواجهة. لو حابب دقة محاسبية كاملة محتاجين getPartyLedger.
  // 4) "ملخص الفروع" — النظام مبني على مفهوم "المخازن" (Warehouses) لا "الفروع"
  //    الفعلية، فاستُخدمت المخازن كوحدة التقسيم الفعلية المتاحة في الداتا.
  // 5) إعادة الترتيب بسهم أعلى/أسفل (وليس Drag & Drop) لضمان موثوقية 100%
  //    على كل المتصفحات/الأجهزة بدون مكتبات خارجية.
  // [DRAG-REORDER] اتضاف لاحقًا سحب مباشر (HTML5 Drag & Drop, بدون أي
  //    مكتبة خارجية) بنفس فلسفة الموثوقية: الكارت "مقفول" افتراضيًا، ودبل
  //    كليك على هيدره بس بيفتح وضع السحب لمدة محدودة (أو لحد ما تسحبه/تدبل
  //    كليك تاني). الأسهم فضلت زي ما هي كخيار بديل مضمون 100% على الموبايل
  //    واللمس (Drag & Drop غير موثوق على الشاشات اللمسية). انظر §1B تحت.
  // ═══════════════════════════════════════════════════════════════════════════

  // صلاحية لازمة لإظهار Widget معيّن (لو غير موجودة الصلاحية بتُستبعد بالكامل)
  var XD_WIDGET_PERM_GATE = {
    hr: "viewEmployees",
    vodafone: "viewVodafoneCash",
    finance: "viewCashBoxes",
  };

  function _xdLayoutKey() {
    return (
      "xd_dash_layout_" +
      XD_LAYOUT_VERSION +
      "_" +
      ((APP.currentUser && APP.currentUser.username) || "guest")
    );
  }

  function _xdLoadLayout() {
    var def = { order: XD_DEFAULT_ORDER.slice(), hidden: [], collapsed: [] };
    try {
      var raw = localStorage.getItem(_xdLayoutKey());
      if (!raw) return def;
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.order)) return def;
      // ضمان وجود أي Widget جديد ضيف بعدين في التحديثات القادمة
      XD_DEFAULT_ORDER.forEach(function (id) {
        if (parsed.order.indexOf(id) === -1) parsed.order.push(id);
      });
      parsed.hidden = Array.isArray(parsed.hidden) ? parsed.hidden : [];
      parsed.collapsed = Array.isArray(parsed.collapsed)
        ? parsed.collapsed
        : [];
      return parsed;
    } catch (e) {
      return def;
    }
  }

  function _xdSaveLayout(state) {
    try {
      localStorage.setItem(_xdLayoutKey(), JSON.stringify(state));
    } catch (e) {}
  }

  function xdToggleCollapse(id) {
    var st = _xdLoadLayout();
    var idx = st.collapsed.indexOf(id);
    if (idx === -1) st.collapsed.push(id);
    else st.collapsed.splice(idx, 1);
    _xdSaveLayout(st);
    xdRefreshWidget(id);
  }

  function xdHideWidget(id) {
    var st = _xdLoadLayout();
    if (st.hidden.indexOf(id) === -1) st.hidden.push(id);
    _xdSaveLayout(st);
    // أنيميشن ثم إزالة من الـ DOM مباشرة بدون full rerender
    var el = document.getElementById("xd-widget-" + id);
    if (el) {
      el.style.transition = "opacity 0.2s ease, transform 0.2s ease";
      el.style.opacity = "0";
      el.style.transform = "scale(0.95)";
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 220);
    } else {
      xdRerenderAll();
    }
    NotificationEngine.info("تم إخفاء الويدجت — تقدر ترجّعه من «تخصيص اللوحة»");
  }

  function xdShowWidget(id) {
    var st = _xdLoadLayout();
    var idx = st.hidden.indexOf(id);
    if (idx !== -1) st.hidden.splice(idx, 1);
    _xdSaveLayout(st);
    xdRerenderAll();
  }

  /** تُستخدم من داخل لوحة "تخصيص اللوحة" — تُظهر الويدجت وتحذف صفه من القائمة فوراً */
  function xdShowWidgetFromPanel(id) {
    xdShowWidget(id);
    var row = document.querySelector('.xd-manage-row[data-id="' + id + '"]');
    if (row) row.remove();
  }

  function xdMoveWidget(id, dir) {
    var st = _xdLoadLayout();
    var i = st.order.indexOf(id);
    if (i === -1) return;

    // نحسب القائمة الفعلية المرئية (بدون المخفية)
    var visible = st.order.filter(function (wid) {
      return st.hidden.indexOf(wid) === -1;
    });
    var vi = visible.indexOf(id);
    var vj = vi + dir;
    if (vj < 0 || vj >= visible.length) return;

    var swapId = visible[vj];

    // ── تبديل في الـ order array ──────────────────────────────
    var oi = st.order.indexOf(id);
    var oj = st.order.indexOf(swapId);
    var tmp = st.order[oi];
    st.order[oi] = st.order[oj];
    st.order[oj] = tmp;
    _xdSaveLayout(st);

    // ── تبديل في الـ DOM مباشرة (بدون full rerender) ──────────
    var grid = document.querySelector(".xd-widgets-grid");
    if (!grid) {
      xdRerenderAll();
      return;
    }

    var elA = document.getElementById("xd-widget-" + id);
    var elB = document.getElementById("xd-widget-" + swapId);
    if (!elA || !elB) {
      xdRerenderAll();
      return;
    }

    // نعمل fade خفيف على الاتنين ثم نبدّل
    var FADE = 120;
    elA.style.transition =
      "opacity " + FADE + "ms ease, transform " + FADE + "ms ease";
    elB.style.transition =
      "opacity " + FADE + "ms ease, transform " + FADE + "ms ease";
    elA.style.opacity = "0.4";
    elB.style.opacity = "0.4";
    elA.style.transform = dir < 0 ? "translateY(-4px)" : "translateY(4px)";
    elB.style.transform = dir < 0 ? "translateY(4px)" : "translateY(-4px)";

    setTimeout(function () {
      // نبدّل مواضع الـ elements في الـ DOM
      var refB = elB.nextSibling;
      if (refB === elA) {
        // elA جاي بعد elB مباشرة
        grid.insertBefore(elA, elB);
      } else {
        var refA = elA.nextSibling;
        grid.insertBefore(elA, refB);
        grid.insertBefore(elB, refA);
      }

      // restore
      elA.style.transition =
        "opacity " + FADE + "ms ease, transform " + FADE + "ms ease";
      elB.style.transition =
        "opacity " + FADE + "ms ease, transform " + FADE + "ms ease";
      elA.style.opacity = "1";
      elB.style.opacity = "1";
      elA.style.transform = "";
      elB.style.transform = "";

      setTimeout(function () {
        elA.style.transition = "";
        elB.style.transition = "";
      }, FADE);
    }, FADE);
  }

  function xdResetLayout() {
    try {
      localStorage.removeItem(_xdLayoutKey());
    } catch (e) {}
    xdRerenderAll();
    NotificationEngine.success(" تم استرجاع الترتيب الافتراضي للوحة");
  }

  // ─────────────────────────────────────────────────────────────
  // §1B  [DRAG-REORDER] سحب مباشر لإعادة ترتيب الويدجتس (دبل كليك ثم سحب)
  // ─────────────────────────────────────────────────────────────
  // فكرة التفعيل: الكارت "مقفول" ومش قابل للسحب افتراضيًا (عشان ميحصلش
  // سحب عرضي وانت بتستخدم اللوحة عادي). دبل كليك على هيدر الكارت بيفتح
  // وضع السحب (draggable=true + شكل بصري مميز) لمدة 6 ثوانٍ أو لحد ما
  // تسحبه فعليًا أو تدبل كليك تاني عليه (toggle). الكود مبني بالكامل على
  // HTML5 Drag & Drop الأصلي في المتصفح — بدون أي مكتبة خارجية، وبدون
  // أي تعديل في xdMoveWidget/_xdSaveLayout الحالية (نفس آلية الحفظ).
  //
  // مربوطة بـ Event Delegation على document مرة واحدة بس (مش على كل
  // كارت لوحده)، فبتفضل شغالة حتى بعد أي إعادة رسم كامل للوحة
  // (xdRerenderAll بيستبدل الـ innerHTML بالكامل).

  var _xdDragEl = null; // العنصر اللي بيتسحب دلوقتي
  var _xdArmTimer = null; // مؤقّت إلغاء وضع السحب تلقائيًا
  var _xdDragHintShown = false; // نعرض تلميح الاستخدام مرة واحدة فقط للجلسة

  function _xdArmDrag(el) {
    if (_xdArmTimer) {
      clearTimeout(_xdArmTimer);
      _xdArmTimer = null;
    }
    var wasArmed = el.classList.contains("xd-widget-armed");
    // إلغاء تسليح أي كارت تاني كان مفعّل قبل كده
    document.querySelectorAll(".xd-widget-armed").forEach(function (prev) {
      prev.classList.remove("xd-widget-armed");
      prev.removeAttribute("draggable");
    });
    if (wasArmed) return; // دبل كليك تاني على نفس الكارت = إلغاء وضع السحب

    el.classList.add("xd-widget-armed");
    el.setAttribute("draggable", "true");

    if (!_xdDragHintShown) {
      NotificationEngine.info(" الكارت جاهز للسحب — امسكه من أي مكان واسحبه لترتيبه زي ما تحب");
      _xdDragHintShown = true;
    }

    // إلغاء تلقائي لوضع السحب لو المستخدم مسحبش خلال 6 ثوانٍ
    _xdArmTimer = setTimeout(function () {
      el.classList.remove("xd-widget-armed");
      el.removeAttribute("draggable");
      _xdArmTimer = null;
    }, 6000);
  }

  /** تُقرأ ترتيب الكروت الفعلي من الـ DOM بعد السحب وتُحفظ في localStorage */
  function _xdPersistDomOrder() {
    var grid = document.querySelector(".xd-widgets-grid");
    if (!grid) return;
    var domIds = Array.prototype.map.call(
      grid.querySelectorAll(".xd-widget[data-wid]"),
      function (el) {
        return el.getAttribute("data-wid");
      },
    );
    if (!domIds.length) return;
    var st = _xdLoadLayout();
    // نحافظ على أي Widget مخفي في مكانه النسبي (آخر القائمة) بدل ما يضيع
    var hiddenIds = st.order.filter(function (id) {
      return st.hidden.indexOf(id) !== -1 && domIds.indexOf(id) === -1;
    });
    st.order = domIds.concat(hiddenIds);
    _xdSaveLayout(st);
  }

  /** تهيئة مستمعي السحب — تُستدعى مرة واحدة فقط طول عمر الصفحة (Event Delegation) */
  function _xdInitDragDrop() {
    if (window._xdDragDropInited) return;
    window._xdDragDropInited = true;

    document.addEventListener("dblclick", function (e) {
      var head = e.target.closest(".xd-widget-head");
      if (!head) return;
      if (e.target.closest(".xd-widget-actions")) return; // مش لو دبل كليك على أزرار الطي/الإخفاء
      var card = head.closest(".xd-widget");
      if (!card) return;
      e.preventDefault();
      _xdArmDrag(card);
    });

    document.addEventListener("dragstart", function (e) {
      var card = e.target.closest(".xd-widget");
      if (!card || card.getAttribute("draggable") !== "true") return;
      if (_xdArmTimer) {
        clearTimeout(_xdArmTimer);
        _xdArmTimer = null;
      }
      _xdDragEl = card;
      card.classList.add("xd-widget-dragging");
      try {
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", card.getAttribute("data-wid"));
      } catch (err) {}
    });

    document.addEventListener("dragover", function (e) {
      if (!_xdDragEl) return;
      var grid = e.target.closest(".xd-widgets-grid");
      if (!grid) return;
      e.preventDefault();
      var target = e.target.closest(".xd-widget");
      if (!target || target === _xdDragEl) return;
      var rect = target.getBoundingClientRect();
      var before = e.clientY - rect.top < rect.height / 2;
      if (before) {
        grid.insertBefore(_xdDragEl, target);
      } else {
        grid.insertBefore(_xdDragEl, target.nextSibling);
      }
    });

    document.addEventListener("drop", function (e) {
      if (!_xdDragEl) return;
      if (e.target.closest(".xd-widgets-grid")) e.preventDefault();
    });

    document.addEventListener("dragend", function (e) {
      if (!_xdDragEl) return;
      _xdDragEl.classList.remove("xd-widget-dragging");
      _xdDragEl.classList.remove("xd-widget-armed");
      _xdDragEl.removeAttribute("draggable");
      _xdDragEl = null;
      _xdPersistDomOrder();
      NotificationEngine.success(" تم حفظ الترتيب الجديد للوحة");
    });
  }

  // حقن أنماط وضع السحب — نفس أسلوب حقن أنماط xd-manage الموجود تحت
  (function () {
    var s = document.createElement("style");
    s.id = "xd-dragdrop-styles";
    s.textContent = `
  .xd-widget-head { cursor: default; }
  .xd-widget-armed {
    cursor: grab;
    outline: 2px dashed var(--accent);
    outline-offset: 3px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12) !important;
    animation: xdArmPulse 1.1s ease-in-out infinite;
  }
  .xd-widget-armed .xd-widget-head { cursor: grab; }
  .xd-widget-armed:active,
  .xd-widget-dragging { cursor: grabbing; }
  @keyframes xdArmPulse {
    0%, 100% { outline-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    50% { outline-color: var(--accent); }
  }
  .xd-widget-dragging {
    opacity: 0.45;
    transform: scale(0.98);
  }
  .xd-widgets-grid { transition: none; }
`;
    document.head.appendChild(s);
  })();

  /** إعادة رسم كل لوحة التحكم (للتغييرات الكبيرة: إخفاء/إظهار/ترتيب) */
  function xdRerenderAll() {
    var c =
      document.getElementById("page-content") ||
      document.getElementById("content");
    if (!c) return;
    if (APP.currentPage !== "dashboard") return;
    // [FIX-2026-08-08-SCROLL-JUMP] الكونتينر اللي فعليًا عليه overflow-y:auto
    // هو ".content" (أب #page-content)، مش #page-content نفسه — استبدال
    // innerHTML بتاعه كان بيفقد مكان السكرول القديم فيرجع المستخدم لأعلى
    // الشاشة كل مرة. بنحفظ مكان السكرول قبل الاستبدال ونرجّعه فوراً بعده.
    var scrollContainer = document.querySelector(".content");
    var _savedScroll = scrollContainer ? scrollContainer.scrollTop : 0;
    c.innerHTML = renderDashboard();
    // [FIX-2026-08-08-SCROLL-JUMP] bindDashboard(true) — علامة إن الاستدعاء
    // ده re-render داخلي (مش أول فتح حقيقي للصفحة)، عشان initExecutiveDashboard
    // ميعملش subscribe تاني على ensureExtendedData/ensureLevelData (شوف
    // التعليق التفصيلي هناك).
    bindDashboard(true);
    if (scrollContainer) scrollContainer.scrollTop = _savedScroll;
  }

  // [FIX-2026-08-08-SCROLL-JUMP] initExecutiveDashboard() بتستدعي
  // xdRefreshWidget() لعدد من الويدجتس (finance/hr من ensureExtendedData،
  // وsales/insights/purchases/production/warehouses من ensureLevelData)
  // في نفس اللحظة تقريباً بعد وصول البيانات. أي ويدجت من دول عنصره مش
  // موجود في الـ DOM (مطوي/مخفي بترتيب المستخدم..إلخ) كان بيسبب استدعاء
  // منفصل لـ xdRerenderAll() لكل واحد منهم — يعني ممكن تحصل 3-4 عمليات
  // إعادة رسم كاملة متتالية لنفس اللوحة خلال أجزاء من الثانية، وكل واحدة
  // بتحس إنها "قفزة" بصرية حتى مع حفظ السكرول. الحل: تجميع كل طلبات
  // إعادة الرسم الكاملة اللي تحصل في نفس الـ tick في عملية واحدة بس.
  var _xdFullRerenderScheduled = false;
  function _xdScheduleFullRerender() {
    if (_xdFullRerenderScheduled) return;
    _xdFullRerenderScheduled = true;
    Promise.resolve().then(function () {
      _xdFullRerenderScheduled = false;
      xdRerenderAll();
    });
  }

  /** إعادة رسم Widget واحد فقط (أخف من إعادة رسم كل اللوحة — تُستخدم في الطي) */
  function xdRefreshWidget(id) {
    var el = document.getElementById("xd-widget-" + id);
    if (!el) {
      _xdScheduleFullRerender();
      return;
    }
    var html = xdRenderWidgetById(id);
    if (!html) return;
    var tmp = document.createElement("div");
    tmp.innerHTML = html;
    var newEl = tmp.firstElementChild;
    if (newEl) el.replaceWith(newEl);
  }

  // [إصلاح P2] كانت _xdMoney تفرض "ج.م" يدويًا بتجاهل تام لتفضيل currency
  // المخزَّن فعليًا — نفس مشكلة _fmtMoney القديمة في FixedAssets. الآن
  // تُفوِّض لـ formatMoney() المركزية (00_JS_DataLayer.html) مع الحفاظ على
  // نفس شكل العرض القديم (بدون كسور عشرية) حتى لا يتأثر أي مكان يستخدمها.
  function _xdMoney(v) {
    return formatMoney(v, { decimals: 0 });
  }

  function _xdNum(v) {
    return Number(v || 0).toLocaleString("en-US", {
      minimumFractionDigits: 0,
      maximumFractionDigits: 0,
    });
  }

  function _xdTodayStr() {
    return (typeof DateEngine !== "undefined" ? DateEngine.forPicker(new Date()) : new Date().toISOString().slice(0, 10));
  }

  function _xdTopKey(map) {
    var best = null,
      bv = -Infinity;
    Object.keys(map).forEach(function (k) {
      if (!k || k === "undefined" || k === "null") return;
      if (map[k] > bv) {
        bv = map[k];
        best = k;
      }
    });
    return best ? { name: best, value: bv } : null;
  }

  function _xdSkeleton(rows) {
    var html = "";
    for (var i = 0; i < rows; i++) {
      html += '<div class="xd-skel-row"></div>';
    }
    return html;
  }

  function _xdFmtDateTime(ts) {
    try {
      var d = new Date(ts);
      if (isNaN(d)) return "—";
      var now = new Date();
      var diffMin = Math.round((now - d) / 60000);
      if (diffMin < 1) return "الآن";
      if (diffMin < 60) return "منذ " + diffMin + " د";
      var diffH = Math.round(diffMin / 60);
      if (diffH < 24) return "منذ " + diffH + " س";
      // [DATE-UNIFY 2026-07-22] كان يعرض تاريخ مطلق بصيغة ar-EG ثابتة
      // (يوم + اسم شهر مختصر) بغض النظر عن تفضيل date_format — بدّلناه
      // لاستخدام fmtDate() المركزية عشان يحترم التفضيل مثل باقي النظام.
      return typeof fmtDate === "function" ? fmtDate(d) : "—";
    } catch (e) {
      return "—";
    }
  }

  // [إصلاح P2] باراميتر sensitive اختياري: مرّر true للمؤشرات المالية
  // الحساسة (أرصدة/إيرادات) عشان تستفيد من تفضيل hide_balances تلقائيًا —
  // نفس نمط class="sensitive-balance" المُستخدم في Templates.html.

  // ─────────────────────────────────────────────────────────────
  // §3  حساب المؤشرات (KPIs) من APP.data — كل الحسابات Sync وسريعة
  // ─────────────────────────────────────────────────────────────

  function xdComputeFinance() {
    var d = APP.data;
    // [PERF-FINANCE-LIGHT-2026-08-08] extReady بيستنى cashBoxes (من
    // Core) و saleInvoicesLight/purchaseInvoicesLight (من الحزمة
    // الخفيفة الجديدة) مع بعض — قبل كده كان بيستنى cashBoxes بس فكانت
    // الكروت المعتمدة على الفواتير (إيرادات/ذمم) تفضل صفر حتى لو
    // extReady بقى true.
    var extReady =
      d.cashBoxes !== undefined && d.saleInvoicesLight !== undefined;
    var todayStr = _xdTodayStr();

    // [PERF-FINANCE-LIGHT-2026-08-08] لو الفواتير الكاملة اتحمّلت
    // فعلاً (المستخدم فتح شاشة الفواتير في نفس الجلسة) نستخدمها
    // كأولوية — أدق (فيها كل الحالات المحدّثة لحظياً)، وإلا نرجع
    // للملخّص الخفيف اللي بيتحمّل مع باقي الداشبورد.
    var saleInv = d.saleInvoices || d.saleInvoicesLight || [];
    var purchInv = d.purchaseInvoices || d.purchaseInvoicesLight || [];

    var revenueToday = saleInv
      .filter(function (i) {
        return (
          i.status !== "cancelled" && String(i.date).slice(0, 10) === todayStr
        );
      })
      .reduce(function (s, i) {
        return s + Number(i.net_total || 0);
      }, 0);

    var expensesToday = (d.expenses || [])
      .filter(function (e) {
        return (
          e.status !== "cancelled" && String(e.date).slice(0, 10) === todayStr
        );
      })
      .reduce(function (s, e) {
        return s + Number(e.amount || 0);
      }, 0);

    var cashBalance = (d.cashBoxes || []).reduce(function (s, c) {
      return s + Number(c.current_balance || 0);
    }, 0);
    var bankBalance = (d.bankAccounts || []).reduce(function (s, b) {
      return s + Number(b.current_balance || 0);
    }, 0);

    var receivables = saleInv
      .filter(function (i) {
        return i.status !== "cancelled" && i.payment_status !== "paid";
      })
      .reduce(function (s, i) {
        return s + Number(i.net_total || 0);
      }, 0);
    var payables = purchInv
      .filter(function (i) {
        return i.status !== "cancelled" && i.payment_status !== "paid";
      })
      .reduce(function (s, i) {
        return s + Number(i.net_total || 0);
      }, 0);

    return {
      extReady: extReady,
      revenueToday: revenueToday,
      expensesToday: expensesToday,
      netToday: revenueToday - expensesToday,
      cashBalance: cashBalance,
      bankBalance: bankBalance,
      receivables: receivables,
      payables: payables,
    };
  }

  function xdComputeInventory() {
    var d = APP.data;
    var totalValue = 0;
    (d.items || []).forEach(function (item) {
      var cost = Number(item.cost_price || 0);
      var qty = (d.stock || [])
        .filter(function (s) {
          return s.item_id === item.id;
        })
        .reduce(function (s, x) {
          return s + Number(x.quantity || 0);
        }, 0);
      totalValue += qty * cost;
    });
    var todayStr = _xdTodayStr();
    var todayTx = (d.transactions || []).filter(function (t) {
      return String(t.date).slice(0, 10) === todayStr;
    }).length;
    var transfersToday = (d.transactions || []).filter(function (t) {
      return t.type === "TRANSFER" && String(t.date).slice(0, 10) === todayStr;
    }).length;
    return {
      totalValue: totalValue,
      alerts: typeof alertCount === "function" ? alertCount() : 0,
      itemsCount: (d.items || []).length,
      todayTx: todayTx,
      transfersToday: transfersToday,
    };
  }

  function xdComputeSales() {
    var d = APP.data;
    var todayStr = _xdTodayStr();
    // [PERF-FINANCE-LIGHT-2026-08-08] نفس مبدأ xdComputeFinance: نستخدم
    // الفواتير الكاملة لو محمّلة فعلاً (من زيارة شاشة الفواتير)، وإلا
    // نرجع للملخّص الخفيف اللي بيتحمّل مع الداشبورد. الملخّص الخفيف
    // فيه party/net_total/date/status فبيكفي لـ todaySales/invoicesCount/
    // bestCustomer، لكن مفيهوش lines_json ولا created_by، فـ bestItem/
    // topUser بيفضلوا محتاجين الفواتير الكاملة تحديداً (isFullData).
    var isFullData = !!d.saleInvoices;
    var invoices = (d.saleInvoices || d.saleInvoicesLight || []).filter(
      function (i) {
        return i.status !== "cancelled";
      },
    );
    var todaySales = invoices
      .filter(function (i) {
        return String(i.date).slice(0, 10) === todayStr;
      })
      .reduce(function (s, i) {
        return s + Number(i.net_total || 0);
      }, 0);

    var byCustomer = {},
      byItem = {},
      byUser = {};
    invoices.forEach(function (inv) {
      byCustomer[inv.party] =
        (byCustomer[inv.party] || 0) + Number(inv.net_total || 0);
      if (isFullData) {
        byUser[inv.created_by] = (byUser[inv.created_by] || 0) + 1;
        (Array.isArray(inv.lines_json) ? inv.lines_json : []).forEach(
          function (l) {
            var key = l.item_name || l.item_id || "—";
            byItem[key] =
              (byItem[key] || 0) + Number(l.qty || l.quantity || 0);
          },
        );
      }
    });

    return {
      todaySales: todaySales,
      invoicesCount: invoices.length,
      bestCustomer: _xdTopKey(byCustomer),
      bestItem: isFullData ? _xdTopKey(byItem) : null,
      topUser: isFullData ? _xdTopKey(byUser) : null,
    };
  }

  function xdComputePurchases() {
    var d = APP.data;
    var todayStr = _xdTodayStr();
    var invoices = (d.purchaseInvoices || []).filter(function (i) {
      return i.status !== "cancelled";
    });
    var todayPurchases = invoices
      .filter(function (i) {
        return String(i.date).slice(0, 10) === todayStr;
      })
      .reduce(function (s, i) {
        return s + Number(i.net_total || 0);
      }, 0);
    var unpaidCount = invoices.filter(function (i) {
      return i.payment_status !== "paid";
    }).length;
    var bySupplier = {};
    invoices.forEach(function (inv) {
      bySupplier[inv.party] =
        (bySupplier[inv.party] || 0) + Number(inv.net_total || 0);
    });
    return {
      todayPurchases: todayPurchases,
      invoicesCount: invoices.length,
      unpaidCount: unpaidCount,
      bestSupplier: _xdTopKey(bySupplier),
    };
  }

  function xdComputeProduction() {
    var d = APP.data;
    var pos = d.productionOrders || [];
    var inProgress = pos.filter(function (o) {
      return o.status === "pending" || o.status === "in_progress";
    }).length;
    var completed = pos.filter(function (o) {
      return (
        o.status === "completed" || o.status === "closed" || o.status === "done"
      );
    }).length;
    var total = pos.length;
    var pct = total ? Math.round((completed / total) * 100) : 0;
    return {
      inProgress: inProgress,
      completed: completed,
      pct: pct,
      total: total,
    };
  }

  function xdComputeHR() {
    var d = APP.data;
    if (d.employees === undefined) return null;
    var active = (d.employees || []).filter(function (e) {
      return e.status === "ACTIVE";
    });
    var todayStr = _xdTodayStr();
    var todayAtt = (d.attendance || []).filter(function (a) {
      return a.date === todayStr;
    });
    var present = todayAtt.filter(function (a) {
      return a.status === "PRESENT" || a.status === "LATE";
    }).length;
    var absent = Math.max(active.length - present, 0);
    var onLeave = (d.employees || []).filter(function (e) {
      return e.status === "ON_LEAVE";
    }).length;
    var thisMonth = todayStr.slice(0, 7);
    var newHires = (d.employees || []).filter(function (e) {
      return String(e.hire_date || "").slice(0, 7) === thisMonth;
    }).length;
    return {
      present: present,
      absent: absent,
      onLeave: onLeave,
      newHires: newHires,
      activeCount: active.length,
    };
  }

  function xdComputeWarehouses() {
    var d = APP.data;
    return (d.warehouses || []).map(function (w) {
      var rows = (d.stock || []).filter(function (s) {
        return s.warehouse === w.id || s.warehouse === w.name;
      });
      var qty = rows.reduce(function (s, r) {
        return s + Number(r.quantity || 0);
      }, 0);
      var value = 0;
      rows.forEach(function (r) {
        var item = (d.items || []).find(function (i) {
          return i.id === r.item_id;
        });
        if (item)
          value += Number(r.quantity || 0) * Number(item.cost_price || 0);
      });
      return { id: w.id, name: w.name, qty: qty, value: value };
    });
  }

  /** رؤى تلقائية مبنية على بيانات حقيقية فقط */
  function xdComputeInsights() {
    var d = APP.data;
    var insights = [];
    var now = new Date();

    // 1) مبيعات هذا الأسبوع مقابل الأسبوع السابق
    var msDay = 86400000;
    var weekStart = new Date(now.getTime() - 6 * msDay);
    var prevWeekStart = new Date(now.getTime() - 13 * msDay);
    var prevWeekEnd = new Date(now.getTime() - 7 * msDay);
    var thisWeekSum = 0,
      prevWeekSum = 0;
    (d.saleInvoices || []).forEach(function (inv) {
      if (inv.status === "cancelled") return;
      var dt = new Date(inv.date);
      if (isNaN(dt)) return;
      var v = Number(inv.net_total || 0);
      if (dt >= weekStart) thisWeekSum += v;
      else if (dt >= prevWeekStart && dt <= prevWeekEnd) prevWeekSum += v;
    });
    if (prevWeekSum > 0) {
      var pct = Math.round(((thisWeekSum - prevWeekSum) / prevWeekSum) * 100);
      insights.push({
        icon: pct >= 0 ? "ti-trending-up" : "ti-trending-down",
        color: pct >= 0 ? "var(--success)" : "var(--danger)",
        text:
          "المبيعات هذا الأسبوع " +
          (pct >= 0 ? "أعلى" : "أقل") +
          " من الأسبوع السابق بنسبة " +
          Math.abs(pct) +
          "%",
      });
    } else if (thisWeekSum > 0) {
      insights.push({
        icon: "ti-trending-up",
        color: "var(--success)",
        text:
          "تم تسجيل مبيعات بقيمة " + _xdMoney(thisWeekSum) + " خلال آخر 7 أيام",
      });
    }

    // 2) أفضل عميل
    var sales = xdComputeSales();
    if (sales.bestCustomer) {
      insights.push({
        icon: "ti-crown",
        color: "var(--warning)",
        text:
          "أفضل عميل (إجمالي التعامل): " +
          sales.bestCustomer.name +
          " — " +
          _xdMoney(sales.bestCustomer.value),
      });
    }
    if (sales.bestItem) {
      insights.push({
        icon: "ti-star",
        color: "var(--accent)",
        text:
          "الأعلى مبيعاً بالكمية: " +
          sales.bestItem.name +
          " (" +
          _xdNum(sales.bestItem.value) +
          " وحدة)",
      });
    }

    // 3) المخزن الذي يحتاج متابعة (أكثر مخزن فيه تنبيهات نقص نسبةً لعدد أصنافه)
    var whs = xdComputeWarehouses();
    if (whs.length) {
      var lowest = whs.slice().sort(function (a, b) {
        return a.value - b.value;
      })[0];
      if (lowest && lowest.value >= 0) {
        insights.push({
          icon: "ti-building-warehouse",
          color: "var(--orange)",
          text:
            "مخزن «" +
            (lowest.name || lowest.id) +
            "» — أقل قيمة مخزون حالياً (" +
            _xdMoney(lowest.value) +
            ")",
        });
      }
    }

    // 4) أعلى موظف إنتاجية (من تنفيذ مراحل الإنتاج لو الموديول موجود وفيه بيانات)
    if (Array.isArray(d.productionStages)) {
      var byEmp = {};
      (d.productionStages || []).forEach(function (st) {
        (st.executions || []).forEach(function (ex) {
          byEmp[ex.employee_id] =
            (byEmp[ex.employee_id] || 0) + Number(ex.qty || 0);
        });
      });
      var topEmpId = _xdTopKey(byEmp);
      if (topEmpId) {
        var empObj = (d.employees || []).find(function (e) {
          return e.id === topEmpId.name;
        });
        insights.push({
          icon: "ti-medal",
          color: "var(--purple)",
          text:
            "أعلى إنتاجية بالقطعة: " +
            (empObj ? empObj.full_name : topEmpId.name) +
            " — " +
            _xdNum(topEmpId.value) +
            " وحدة منفّذة",
        });
      }
    }

    // 5) تنبيه مخزون منخفض
    var inv = xdComputeInventory();
    if (inv.alerts > 0) {
      insights.push({
        icon: "ti-alert-triangle",
        color: "var(--danger)",
        text:
          inv.alerts +
          " صنف/لون وصل للحد الأدنى أو نفد من المخزون — يحتاج تحرّك فوري",
      });
    }

    if (!insights.length) {
      insights.push({
        icon: "ti-info-circle",
        color: "var(--text3)",
        text: "لا توجد رؤى كافية حالياً — البيانات لسه قليلة",
      });
    }
    return insights;
  }

  // ─────────────────────────────────────────────────────────────
  // §4  النشاط المباشر — مبني من أحدث السجلات الفعلية في APP.data
  // (بدون أي نداء سيرفر إضافي — كل البيانات أصلاً محمَّلة)
  // ─────────────────────────────────────────────────────────────

  function _xdBuildActivityFeed(limit) {
    var d = APP.data;
    var events = [];

    function push(ts, user, icon, bg, color, title, desc) {
      if (!ts) return;
      var t = new Date(ts).getTime();
      if (!t || isNaN(t)) return;
      events.push({
        ts: t,
        user: user,
        icon: icon,
        bg: bg,
        color: color,
        title: title,
        desc: desc,
      });
    }

    (d.saleInvoices || []).forEach(function (i) {
      push(
        i.created_at,
        i.created_by,
        "ti-file-invoice",
        "var(--success-soft)",
        "var(--success)",
        "فاتورة بيع جديدة",
        esc(i.party || "—") + " — " + _xdMoney(i.net_total),
      );
    });
    (d.purchaseInvoices || []).forEach(function (i) {
      push(
        i.created_at,
        i.created_by,
        "ti-shopping-cart",
        "var(--accent-soft)",
        "var(--accent)",
        "فاتورة شراء جديدة",
        esc(i.party || "—") + " — " + _xdMoney(i.net_total),
      );
    });
    (d.receiptVouchers || []).forEach(function (v) {
      push(
        v.created_at,
        v.created_by,
        "ti-cash",
        "var(--success-soft)",
        "var(--success)",
        "سند قبض",
        "من: " + esc(v.from_party || "—") + " — " + _xdMoney(v.amount),
      );
    });
    (d.paymentVouchers || []).forEach(function (v) {
      push(
        v.created_at,
        v.created_by,
        "ti-cash-banknote",
        "var(--danger-soft)",
        "var(--danger)",
        "سند صرف",
        "إلى: " + esc(v.to_party || "—") + " — " + _xdMoney(v.amount),
      );
    });
    (d.expenses || []).forEach(function (e) {
      push(
        e.created_at,
        e.created_by,
        "ti-receipt",
        "var(--danger-soft)",
        "var(--danger)",
        "مصروف جديد",
        _xdMoney(e.amount),
      );
    });
    (d.productionOrders || []).forEach(function (o) {
      push(
        o.created_at || o.date,
        o.user || o.created_by,
        "ti-building-factory-2",
        "var(--warning-soft)",
        "var(--warning)",
        "أمر إنتاج",
        "الكمية: " + _xdNum(o.quantity),
      );
    });
    (d.transactions || []).slice(-40).forEach(function (t) {
      var TYPE_LABEL = {
        IN: "حركة وارد",
        OUT: "حركة صادر",
        TRANSFER: "تحويل مخزني",
        DISPATCH: "صرف مصنع",
        FACTORY_RETURN: "مرتجع مصنع",
        FG_IN: "استلام منتج تام",
      };
      push(
        t.date,
        t.user,
        "ti-arrows-exchange",
        "var(--purple-soft)",
        "var(--purple)",
        TYPE_LABEL[t.type] || "حركة مخزون",
        "كمية: " + _xdNum(t.quantity),
      );
    });
    (d.customers || []).forEach(function (c) {
      push(
        c.created_at,
        "",
        "ti-user-plus",
        "var(--teal-soft)",
        "var(--teal)",
        "عميل جديد",
        esc(c.name || ""),
      );
    });
    (d.suppliers || []).forEach(function (s) {
      push(
        s.created_at,
        "",
        "ti-building-store",
        "var(--orange-soft)",
        "var(--orange)",
        "مورد جديد",
        esc(s.name || ""),
      );
    });
    (d.items || []).forEach(function (it) {
      push(
        it.created_at,
        "",
        "ti-box",
        "var(--accent-soft)",
        "var(--accent)",
        "إضافة صنف",
        esc(it.name || ""),
      );
    });

    events.sort(function (a, b) {
      return b.ts - a.ts;
    });
    return events.slice(0, limit || 15);
  }

  // ─────────────────────────────────────────────────────────────
  // §5  الرسوم البيانية — مبيعات/مشتريات آخر 7 أيام + حركة المخزون (موجودة مسبقاً)
  // ─────────────────────────────────────────────────────────────

  function _xdLast7Days() {
    var days = [];
    var now = new Date();
    for (var i = 6; i >= 0; i--) {
      var d = new Date(now);
      d.setDate(d.getDate() - i);
      days.push({
        date: d.toISOString().split("T")[0],
        // [ENGINE-UNIFY] كانت نسخة مكرّرة بنفس منطق DateEngine.weekdayName
        // بالضبط (نفس locale ونفس fallback) — استبدلناها بالمحرك الموحّد.
        label:
          typeof DateEngine !== "undefined"
            ? DateEngine.weekdayName(d)
            : d.toLocaleDateString("ar-EG-u-nu-latn", { weekday: "short" }),
      });
    }
    return days;
  }

  function xdRenderSalesPurchaseChart() {
    var days = _xdLast7Days();
    var d = APP.data;
    days.forEach(function (day) {
      day.sales = (d.saleInvoices || [])
        .filter(function (i) {
          return (
            i.status !== "cancelled" && String(i.date).slice(0, 10) === day.date
          );
        })
        .reduce(function (s, i) {
          return s + Number(i.net_total || 0);
        }, 0);
      day.purchases = (d.purchaseInvoices || [])
        .filter(function (i) {
          return (
            i.status !== "cancelled" && String(i.date).slice(0, 10) === day.date
          );
        })
        .reduce(function (s, i) {
          return s + Number(i.net_total || 0);
        }, 0);
    });
    var maxVal = Math.max.apply(
      null,
      days
        .map(function (d2) {
          return Math.max(d2.sales, d2.purchases);
        })
        .concat([1]),
    );
    var CHART_H = 140;
    var bars = days
      .map(function (d2) {
        function col(val, color) {
          var h =
            maxVal > 0
              ? Math.max((val / maxVal) * CHART_H, val > 0 ? 4 : 0)
              : 0;
          return (
            '<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:' +
            CHART_H +
            'px">' +
            (val > 0
              ? '<div style="font-size:8px;color:' +
                color +
                ';font-weight:700;margin-bottom:2px">' +
                Math.round(val / 1000) +
                (val >= 1000 ? "k" : "") +
                "</div>"
              : "") +
            '<div style="width:12px;border-radius:4px 4px 0 0;background:' +
            color +
            ";height:" +
            h +
            'px;transition:height .4s ease"></div>' +
            "</div>"
          );
        }
        return (
          '<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0">' +
          '<div style="display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center">' +
          col(d2.sales, "#2563eb") +
          col(d2.purchases, "#f97316") +
          "</div>" +
          '<div style="font-size:10px;color:var(--text2);margin-top:6px;text-align:center;white-space:nowrap">' +
          d2.label +
          "</div></div>"
        );
      })
      .join("");

    return (
      '<div class="card xd-chart-card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
      '<div style="font-weight:700;font-size:14px">المبيعات مقابل المشتريات — آخر 7 أيام</div>' +
      '<div style="display:flex;gap:12px;font-size:11px;color:var(--text2)">' +
      '<span style="display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:3px;background:#2563eb;display:inline-block"></span> مبيعات</span>' +
      '<span style="display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:3px;background:#f97316;display:inline-block"></span> مشتريات</span>' +
      "</div></div>" +
      '<div style="display:flex;align-items:flex-end;gap:4px;padding:0 4px">' +
      bars +
      "</div></div>"
    );
  }

    var body =

  function _xdVfcSvgBar(series) {
    if (!series || !series.length) return "";
    var maxVal = 0;
    series.forEach(function (s) {
      if (s.deposit + s.withdraw > maxVal) maxVal = s.deposit + s.withdraw;
    });
    if (!maxVal) return "";
    var W = 280,
      H = 56,
      n = series.length,
      bw = Math.floor(W / n) - 3;
    var bars = "";
    series.forEach(function (s, i) {
      var x = i * (W / n) + 1;
      var dh = Math.round((s.deposit / maxVal) * H);
      var wh = Math.round((s.withdraw / maxVal) * H);
      bars +=
        '<rect x="' +
        x +
        '" y="' +
        (H - dh) +
        '" width="' +
        bw +
        '" height="' +
        dh +
        '" fill="#10B981" opacity="0.8" rx="2"/>';
      bars +=
        '<rect x="' +
        (x + bw / 2) +
        '" y="' +
        (H - wh) +
        '" width="' +
        bw / 2 +
        '" height="' +
        wh +
        '" fill="#EF4444" opacity="0.7" rx="2"/>';
    });
    return (
      '<svg viewBox="0 0 ' +
      W +
      " " +
      H +
      '" style="width:100%;height:56px;display:block">' +
      bars +
      "</svg>"
    );
  }

  /**
   * تُستدعى من bindDashboard() — تهيئة الويدجتس اللي تحتاج بيانات إضافية (Lazy)
   * @param {boolean} [isReRender] [FIX-2026-08-08-SCROLL-JUMP] true لو
   * الاستدعاء ده جايّ من xdRerenderAll()/xdRefreshWidget() (إعادة رسم داخلية
   * لنفس زيارة الداشبورد)، مش أول فتح حقيقي للصفحة. كان بيتم تجاهل الفرق
   * ده قبل كده، فكل مرة نعيد فيها رسم اللوحة (حتى لو السبب كان وصول بيانات
   * قسم واحد بس) كانت الدالة دي بتعيد تسجيل subscriptions جديدة على
   * ensureExtendedData/ensureLevelData من الصفر. لو البيانات كانت خلاص
   * وصلت، الـ subscription الجديد ده بينفّذ الـ callback بتاعه فورًا
   * (بشكل متزامن)، واللي بينده تاني على xdRefreshWidget لكل الويدجتس —
   * فلو عنصر واحد لسه مش موجود في الـ DOM لحظة التنفيذ ده، بيتسبب في
   * xdRerenderAll() إضافية (وبالتالي "قفزة" سكرول واحدة زيادة) رغم إن
   * البيانات نفسها كانت خلاص جاهزة من الأول. الحل: subscriptions القسم
   * (1) و(3) بتتسجّل مرة واحدة بس لكل زيارة حقيقية للوحة.
   */
  function initExecutiveDashboard(isReRender) {
    // 0) [DRAG-REORDER] تهيئة مستمعي السحب المباشر — Idempotent (مرة واحدة بس)
    _xdInitDragDrop();

    if (isReRender) return;

    // 1) المحاسبة والموارد البشرية — تحميل البيانات الموسّعة لو لسه مش محمّلة
    if (typeof ensureExtendedData === "function") {
      ensureExtendedData(function () {
        if (APP.currentPage === "dashboard") {
          xdRefreshWidget("finance");
          xdRefreshWidget("hr");
        }
      });
    }
    // 2) فودافون كاش — نداء مستقل خفيف (Lazy)
    setTimeout(xdLoadVodafoneWidget, 150);

    // 3) [AUTO-REFRESH-ON-FULL-LOAD] الويدجتس اللي بتتحسب من بيانات مؤجّلة
    // (فواتير مبيعات/عملاء — مطلوبة لـ "أفضل عميل"/"الأكثر مبيعاً" في
    // insights، وكذلك sales) بترسم أول مرة بس بالبيانات المتاحة وقت
    // فتح اللوحة، فلو المستوى الخلفي (BACKGROUND/level 3) لسه مكملش
    // تحميله، الويدجتس دي تفضل واقفة على "–" أو 0 لحد ما المستخدم يدوس
    // "تحديث البيانات" يدويًا. بننده هنا على ensureLevelData (موجودة
    // فعلاً في 01_JS_Core_Auth.html) عشان نعيد رسم الويدجتس دي تلقائيًا
    // بمجرد ما البيانات الكاملة توصل فعلاً، من غير أي تدخل من المستخدم.
    if (typeof ensureLevelData === "function") {
      ensureLevelData(function () {
        if (APP.currentPage !== "dashboard") return;
        xdRefreshWidget("sales");
        xdRefreshWidget("insights");
        // [FIX-2026-08-08] "المشتريات" و"الإنتاج" و"المخازن" كانت بتترسم
        // مرة واحدة بس عند أول فتح للوحة، ببيانات APP.data زي ما هي في
        // تلك اللحظة (غالبًا لسه فاضية، لأن purchaseInvoices/productionOrders
        // مستوى ON_DEMAND مش محمّلة إلا بعد ensureLevelData). عكس sales/
        // insights، الويدجتس التلاتة دي مكنش عندها أي استدعاء xdRefreshWidget
        // بعد وصول البيانات الفعلية، فكانت تفضل عالقة على صفر/فاضي للأبد
        // حتى لو البيانات وصلت بنجاح في الخلفية. بإضافتها هنا بيتم رسمها
        // تلقائيًا تاني بمجرد اكتمال تحميل المستوى المطلوب.
        xdRefreshWidget("purchases");
        xdRefreshWidget("production");
        xdRefreshWidget("warehouses");
      });
    }
  }

  .xd-tip-bar i {
    color: var(--accent);
    font-size: 15px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* القسم */
  .xd-manage-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .xd-manage-section-title {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .xd-manage-section-title i {
    font-size: 13px;
    color: var(--accent);
  }

  /* القائمة */
  .xd-manage-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .xd-manage-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }

  /* السطر */
  .xd-manage-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    transition:
      background 0.15s,
      border-color 0.15s;
  }
  .xd-manage-row:hover {
    background: var(--surface2);
    border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
  }

  /* الأيقونة الملونة */
  .xd-manage-badge {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  /* معلومات الـ widget */
  .xd-manage-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .xd-manage-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .xd-manage-status {
    font-size: 11px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .xd-status-visible {
    color: var(--success);
  }
  .xd-status-hidden {
    color: var(--text3);
  }
  .xd-status-collapsed {
    color: var(--warning);
  }

  /* أزرار التحكم */
  .xd-manage-btns {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .xd-icon-btn-sm {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition:
      background 0.15s,
      color 0.15s,
      border-color 0.15s;
  }
  .xd-icon-btn-sm:hover:not(:disabled) {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .xd-icon-btn-sm:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .xd-btn-hide:hover:not(:disabled) {
    background: var(--danger);
    border-color: var(--danger);
  }

  /* زر الإظهار */
  .xd-manage-show-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border-radius: 7px;
    border: 1.5px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-arabic);
    transition:
      background 0.15s,
      color 0.15s;
    white-space: nowrap;
  }
  .xd-manage-show-btn:hover {
    background: var(--accent);
    color: #fff;
  }

  /* حالة فارغة */
  .xd-empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 20px;
    color: var(--text3);
    font-size: 13px;
  }
  .xd-empty-state i {
    font-size: 24px;
    color: var(--success);
  }

  /* زر الريست */
  .xd-reset-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 10px;
    border-radius: 9px;
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--text3);
    font-size: 13px;
    font-family: var(--font-arabic);
    cursor: pointer;
    transition:
      color 0.15s,
      border-color 0.15s,
      background 0.15s;
    margin-top: 4px;
  }
  .xd-reset-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
    background: color-mix(in srgb, var(--danger) 6%, transparent);
  }

  /* dark mode */
  [data-theme="dark"] .xd-manage-section {
    background: var(--surface2);
  }
  [data-theme="dark"] .xd-manage-row {
    background: var(--surface);
  }
  [data-theme="dark"] .xd-manage-row:hover {
    background: var(--surface3);
  }

  /* ══════════════════════════════════════════════════════════
     xd-vodafone — كارت المحافظ الإلكترونية المطوّر
     ══════════════════════════════════════════════════════════ */

  /* صف KPIs الرئيسية */
  .xd-vfc-kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  @media (max-width: 600px) {
    .xd-vfc-kpi-row { grid-template-columns: repeat(2, 1fr); }
  }

  /* البطاقة الصغيرة */
  .xd-vfc-mini {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 11px;
    min-width: 0;
  }
  .xd-vfc-mini-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .xd-vfc-mini-body { min-width: 0; flex: 1; }
  .xd-vfc-mini-val {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .xd-vfc-mini-lbl {
    font-size: 10.5px;
    color: var(--text3);
    margin-top: 2px;
    white-space: nowrap;
  }
  .xd-vfc-mini-sub { font-size: 10px; opacity: 0.8; }

  /* الصف الأوسط: IO + Chart */
  .xd-vfc-mid-row {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  @media (max-width: 600px) {
    .xd-vfc-mid-row { grid-template-columns: 1fr; }
  }
  .xd-vfc-io-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .xd-vfc-io-col .xd-vfc-mini { padding: 8px 10px; }
  .xd-vfc-chart-col {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    min-height: 90px;
  }
  .xd-vfc-chart-label {
    font-size: 10.5px;
    color: var(--text3);
    margin-bottom: 6px;
  }

  /* الصف السفلي: Providers + Top Lines */
  .xd-vfc-bot-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  @media (max-width: 600px) {
    .xd-vfc-bot-row { grid-template-columns: 1fr; }
  }
  .xd-vfc-prov-col,
  .xd-vfc-top-col {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .xd-vfc-sec-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .xd-vfc-sec-title i { color: #00C896; font-size: 13px; }

  /* توزيع الشركات */
  .xd-vfc-prov {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    font-size: 11.5px;
    border-bottom: 1px solid var(--border);
  }
  .xd-vfc-prov:last-child { border-bottom: none; }
  .xd-vfc-prov-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .xd-vfc-prov-name { flex: 1; color: var(--text2); font-weight: 600; }
  .xd-vfc-prov-count { color: var(--text3); font-size: 10.5px; }
  .xd-vfc-prov-bal { color: var(--text); font-weight: 700; font-size: 11.5px; margin-right: auto; }

  /* أكثر الخطوط استخداماً */
  .xd-vfc-top-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
  }
  .xd-vfc-top-row:last-child { border-bottom: none; }
  .xd-vfc-top-rank {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #00C89620;
    color: #00C896;
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .xd-vfc-top-name { flex: 1; color: var(--text2); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xd-vfc-top-cnt { color: var(--text3); font-size: 10.5px; white-space: nowrap; }

  /* Footer زر الانتقال */
  .xd-vfc-footer {
    text-align: center;
    padding-top: 4px;
  }
  .xd-vfc-link-btn {
    background: none;
    border: 1px solid #00C896;
    color: #00C896;
    border-radius: 8px;
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .xd-vfc-link-btn:hover {
    background: #00C89615;
  }
