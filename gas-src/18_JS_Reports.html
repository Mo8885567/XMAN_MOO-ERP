  // § 1b. REPORT UX HELPERS — صلاحيات لكل تقرير + مفضلة + الأكثر
  // استخدامًا + آخر التقارير المفتوحة + البحث الداخلي (لكل Report Center)
  // ─────────────────────────────────────────────────────────────────

  /** هل عند المستخدم صلاحية عرض تقرير معيّن؟ requiredPerms اختياري على
   * مستوى التقرير نفسه (بالإضافة لصلاحيات المجموعة العامة). لو التقرير
   * من غير requiredPerms بيتحقق بس من صلاحية المجموعة. */
  function _canSeeReport(report) {
    var perms = report.requiredPerms || [];
    if (!perms.length) return true;
    return perms.some(function (p) {
      return typeof canDo === "function" ? canDo(p) : false;
    });
  }

  function _reportsUxKey(kind) {
    var u = APP.currentUser
      ? APP.currentUser.username || APP.currentUser.email || "user"
      : "guest";
    return "wms_reports_" + kind + "_" + u;
  }

  function _readJson(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      var v = raw ? JSON.parse(raw) : fallback;
      return v || fallback;
    } catch (e) {
      return fallback;
    }
  }
  function _writeJson(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
  }

  function getFavoriteReports() {
    return _readJson(_reportsUxKey("fav"), []);
  }
  window.isFavoriteReport = function (groupId, reportId) {
    return getFavoriteReports().indexOf(groupId + "/" + reportId) !== -1;
  };
  window.toggleFavoriteReport = function (ev, groupId, reportId) {
    if (ev) {
      ev.stopPropagation();
      ev.preventDefault();
    }
    var key = groupId + "/" + reportId;
    var arr = getFavoriteReports();
    var idx = arr.indexOf(key);
    if (idx === -1) {
      arr.push(key);
    } else {
      arr.splice(idx, 1);
    }
    _writeJson(_reportsUxKey("fav"), arr);
    _renderGroupHubInPlace(groupId);
  };

  /** يسجّل فتح تقرير: بيزوّد عداد "الأكثر استخدامًا" وبيحدّث "آخر
   * التقارير المفتوحة" (أحدث 8 عناصر، الأحدث الأول). */
  function _recordReportOpen(groupId, reportId) {
    var key = groupId + "/" + reportId;
    // الأكثر استخدامًا
    var counts = _readJson(_reportsUxKey("count"), {});
    counts[key] = (counts[key] || 0) + 1;
    _writeJson(_reportsUxKey("count"), counts);
    // آخر التقارير المفتوحة
    var recent = _readJson(_reportsUxKey("recent"), []);
    recent = recent.filter(function (k) {
      return k !== key;
    });
    recent.unshift(key);
    recent = recent.slice(0, 8);
    _writeJson(_reportsUxKey("recent"), recent);
  }

  function _findReportByKey(key) {
    var parts = key.split("/");
    var group = REPORT_GROUPS.find(function (g) {
      return g.id === parts[0];
    });
    if (!group) return null;
    var rep = group.reports.find(function (r) {
      return r.id === parts[1];
    });
    if (!rep) return null;
    return { group: group, report: rep };
  }

  /** يرجّع أكتر N تقارير استخدامًا (اختياريًا مقصورة على مجموعة واحدة) */
  function _mostUsedReports(groupId, limit) {
    var counts = _readJson(_reportsUxKey("count"), {});
    return Object.keys(counts)
      .filter(function (k) {
        return !groupId || k.indexOf(groupId + "/") === 0;
      })
      .sort(function (a, b) {
        return counts[b] - counts[a];
      })
      .slice(0, limit || 4)
      .map(_findReportByKey)
      .filter(Boolean);
  }

  function _recentReportsList(groupId, limit) {
    var recent = _readJson(_reportsUxKey("recent"), []);
    return recent
      .filter(function (k) {
        return !groupId || k.indexOf(groupId + "/") === 0;
      })
      .slice(0, limit || 4)
      .map(_findReportByKey)
      .filter(Boolean);
  }

  function _favoriteReportsList(groupId, limit) {
    return getFavoriteReports()
      .filter(function (k) {
        return !groupId || k.indexOf(groupId + "/") === 0;
      })
      .slice(0, limit || 8)
      .map(_findReportByKey)
      .filter(Boolean);
  }

  /** كارت مصغّر (chip) بيتستخدم في صفوف "المفضلة/الأكثر استخدامًا/آخر
   * التقارير" فوق شبكة الـ Report Center. */
  function _reportChip(group, rep) {
    return (
      "<button onclick=\"_openGroupReport('" +
      group.id +
      "','" +
      rep.id +
      '\')" style="display:flex;align-items:center;gap:8px;background:var(--bg2,#F8FAFC);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;font-family:inherit;white-space:nowrap">' +
      '<i class="ti ' +
      rep.icon +
      '" style="font-size:16px;color:' +
      group.color +
      '"></i><span style="font-size:12px;font-weight:600;color:var(--text1)">' +
      rep.label +
      "</span></button>"
    );
  }

  function _reportChipRow(title, icon, items) {
    if (!items.length) return "";
    var html =
      '<div style="margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:6px"><i class="ti ' +
      icon +
      '" style="font-size:14px"></i>' +
      title +
      '</div><div style="display:flex;gap:8px;flex-wrap:wrap">';
    items.forEach(function (it) {
      html += _reportChip(it.group, it.report);
    });
    html += "</div></div>";
    return html;

  /** إعادة رسم شاشة المجموعة في مكانها (بعد تعديل مفضلة مثلاً) بدون
   * إغلاق تقرير مفتوح لو مفيش. */
  function _renderGroupHubInPlace(groupId) {
    var container = document.getElementById("rpt-hub-" + groupId);
    if (container) container.innerHTML = _renderGroupHubGrid(groupId);
  }

  /** فلترة كروت التقارير حسب نص البحث — شغالة على الـ DOM مباشرة بدون
   * إعادة رسم كامل عشان تبقى سريعة أثناء الكتابة. */
  window._filterGroupReports = function (groupId, query) {
    var grid = document.getElementById("rpt-grid-" + groupId);
    if (!grid) return;
    var q = (query || "").trim().toLowerCase();
    var cards = grid.querySelectorAll("[data-report-id]");
    var visibleCount = 0;
    cards.forEach(function (card) {
      var hay = (card.getAttribute("data-search") || "").toLowerCase();
      var match = !q || hay.indexOf(q) !== -1;
      card.style.display = match ? "" : "none";
      if (match) visibleCount++;
    });
    var empty = document.getElementById("rpt-grid-empty-" + groupId);
    if (empty) empty.style.display = visibleCount === 0 ? "" : "none";
  };

  // ─────────────────────────────────────────────────────────────────
  // § 2. REPORTS HUB PAGE — الصفحة الرئيسية للتقارير
  // ─────────────────────────────────────────────────────────────────
  function renderReportsHub() {

      I18N.t("PAGE_REPORTS_HUB") +

      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px">';
    REPORT_GROUPS.forEach(function (group) {
      var requiredPerms = group.requiredPerms || [];
      var hasAccess =
        requiredPerms.length === 0 ||
        requiredPerms.some(function (p) {
          // [FIX] كان بيتحقق من perms[p] مباشرة، وده بيتجاهل استثناء
          // الأدمن الموجود في canDo() (لو الدور admin يرجع true دايمًا حتى
          // لو الصلاحية مش متسجّلة في الـ backend). ده اللي كان بيخلي
          // أقسام زي "تقارير المبيعات/العملاء/الموردين/الموارد البشرية"
          // تختفي من مركز التقارير مع إنها ظاهرة وشغالة في السايدبار.

      if (!hasAccess) return;
      html +=
        '<div class="card" style="padding:20px;cursor:pointer;transition:box-shadow 0.15s" onclick="navigate(\'' +
        group.id +
        "_hub')\" onmouseover=\"this.style.boxShadow='0 4px 20px rgba(0,0,0,0.08)'\" onmouseout=\"this.style.boxShadow=''\">";
      html +=
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">';
      html +=
        '<div style="background:' +
        group.bgColor +
        ';width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center">';
      html +=
        '<i class="ti ' +
        group.icon +
        '" style="font-size:22px;color:' +

      html +=
        '<div><div style="font-weight:700;font-size:15px">' +

      html +=

      html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';

  // ─────────────────────────────────────────────────────────────────
  // § 3. GROUP HUB PAGES — صفحة مجموعة تقارير
  // ─────────────────────────────────────────────────────────────────
  // [REPORTS-STANDALONE] فتح تقرير معيّن من جوه شاشة المجموعة (زي "تقارير
  // المحاسبة") بيتم محليًا (تبديل innerHTML لحاوية الشاشة) من غير ما يعمل
  // navigate() كامل يغيّر السايد بار أو الـ breadcrumb. بالتالي أي تقرير
  // في التقارير بيفتح "من جوه" شاشة المجموعة بتاعته زي ما هو مطلوب، مش
  // كصفحة مستقلة في السايد بار.
  function _renderGroupHub(groupId) {
    return (
      '<div id="rpt-hub-' +
      groupId +
      '">' +
      _renderGroupHubGrid(groupId) +
      "</div>"
    );

  function _renderGroupHubGrid(groupId) {

    // [PER-REPORT-PERMS] فلترة على مستوى التقرير نفسه (مش بس المجموعة)
    // — أي تقرير عليه requiredPerms والمستخدم مش مصرّح له بيها متعرضش
    // Card ليه خالص جوه مركز التقرير.
    var visibleReports = group.reports.filter(_canSeeReport);
    var html =
      '<div class="page-header"><div style="display:flex;align-items:center;gap:12px">';
    html +=
      '<div style="background:' +
      group.bgColor +
      ';width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center">';
    html +=
      '<i class="ti ' +
      group.icon +
      '" style="font-size:22px;color:' +
      group.color +
      '"></i></div>';
    html +=
      '<div><h1 style="margin:0;font-size:20px;font-weight:800">' +
      group.title +
      "</h1>";
    html +=
      '<button onclick="navigate(\'reports_hub\')" style="margin-top:4px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--text3);padding:0;display:flex;align-items:center;gap:4px"><i class="ti ti-arrow-right" style="font-size:12px"></i> ' +
      I18N.t("PAGE_REPORTS_HUB") +

    html +=

      '<i class="ti ti-search" style="position:absolute;top:50%;transform:translateY(-50%);right:12px;color:var(--text3);font-size:16px"></i>' +

      html +=

        (isFav ? "ti-star-filled" : "ti-star") +

    return html;

  /** يبني شريط تنقّل موحّد (رجوع لمركز القسم + رجوع للوحة التقارير
   * الرئيسية + السابق/التالي) وبيتحقن بعد أي .page-header في أي تقرير —
   * شغال بغض النظر عن أي دالة header التقرير بيستخدمها داخليًا (سواء
   * _reportHeader المخصصة للتقارير أو _renderPageHeader العامة اللي
   * بتستخدمها تقارير الشحن)، عشان يبقى التنقل موحّد فعليًا في كل مكان. */
  function _reportNavBar(groupId, reportId) {
    var group = REPORT_GROUPS.find(function (g) {
      return g.id === groupId;
    });
    if (!group) return "";
    var visible = group.reports.filter(_canSeeReport);
    var idx = -1;
    visible.forEach(function (r, i) {
      if (r.id === reportId) idx = i;
    });

    var linkStyle =
      "background:none;border:none;cursor:pointer;font-size:12px;color:var(--text3);padding:0;display:flex;align-items:center;gap:4px;font-family:inherit";
    var html =
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 12px;flex-wrap:wrap">';
    html +=
      "<button onclick=\"_reportBackNav('" +
      groupId +
      '\')" style="' +
      linkStyle +
      '"><i class="ti ti-arrow-right" style="font-size:12px"></i> رجوع لـ ' +
      group.title +
      "</button>";
    html +=
      '<button onclick="navigate(\'reports_hub\')" style="' +
      linkStyle +
      '"><i class="ti ti-layout-dashboard" style="font-size:12px"></i> ' +
      I18N.t("RPT_MAIN_DASHBOARD") +
      "</button>";
    html += "</div>";

    if (idx !== -1 && visible.length > 1) {
      var prev = visible[idx > 0 ? idx - 1 : visible.length - 1];
      var next = visible[idx < visible.length - 1 ? idx + 1 : 0];
      var btnStyle =
        "background:var(--bg2,#F8FAFC);border:1px solid var(--border);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--text1);display:flex;align-items:center;gap:6px;max-width:46%;overflow:hidden";
      html +=
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px">' +
        "<button onclick=\"_openGroupReport('" +
        groupId +
        "','" +
        prev.id +
        '\')" style="' +
        btnStyle +
        '"><i class="ti ti-chevron-right" style="font-size:13px;flex-shrink:0"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">السابق: ' +
        prev.label +
        "</span></button>" +
        '<span style="font-size:11px;color:var(--text3);white-space:nowrap">' +
        (idx + 1) +
        " / " +
        visible.length +
        "</span>" +
        "<button onclick=\"_openGroupReport('" +
        groupId +
        "','" +
        next.id +
        '\')" style="' +
        btnStyle +
        '"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">التالي: ' +
        next.label +
        '</span><i class="ti ti-chevron-left" style="font-size:13px;flex-shrink:0"></i></button>' +
        "</div>";
    }
    return html;
  }

  /** يفتح تقرير معيّن محليًا جوه حاوية شاشة المجموعة (بدون navigate) */
  window._openGroupReport = function (groupId, reportId) {
    var container = document.getElementById("rpt-hub-" + groupId);
    if (!container) return;
    var group = REPORT_GROUPS.find(function (g) {
      return g.id === groupId;
    });
    var rep =
      group &&
      group.reports.find(function (r) {
        return r.id === reportId;
      });
    var fn =
      rep && typeof window[rep.fn] === "function" ? window[rep.fn] : null;
    if (!fn) return;
    try {
      container.innerHTML = fn();
      // [SIDEBAR-CLEANUP] بعض التقارير (زي general-ledger/trial-balance/
      // income-statement/balance-sheet/cash-flow-statement/account-statement)
      // جايه من نمط render+bind القديم، فلازم bindFn يتنفّذ بعد ما الـ
      // innerHTML يتحط في الصفحة وإلا الأزرار والفلاتر جواها تفضل ميتة.
      if (rep.bindFn && typeof window[rep.bindFn] === "function") {
        setTimeout(function () {
          try {
            window[rep.bindFn]();
          } catch (e2) {
            console.error("[Reports] خطأ في ربط أحداث تقرير " + reportId, e2);
            if (typeof showToast === "function") {
              NotificationEngine.warning(" بعض عناصر التقرير قد لا تعمل بشكل صحيح");
            }
          }
        }, 0);
      }
    } catch (e) {
      console.error("[Reports] خطأ في عرض تقرير " + reportId, e);
      container.innerHTML =
        '<div class="card" style="text-align:center;color:var(--danger);padding:24px">' +
        I18N.t("MSG_REPORT_DISPLAY_FAILED_REFRESH") +
        "</div>";
      return;
    }
    // [REPORT-UX] تسجيل الفتحة (للأكثر استخدامًا وآخر التقارير)
    _recordReportOpen(groupId, reportId);
    // [REPORT-PREV-NEXT] إدراج شريط "السابق / التالي" فوق محتوى
    // التقرير مباشرة بعد الـ header — بيشتغل مع كل التقارير من غير ما
    // نلمس كل دالة render على حدة (كلها بتنتج header بكلاس page-header).
    try {
      var navBarHtml = _reportNavBar(groupId, reportId);
      if (navBarHtml) {
        var headerEl = container.querySelector(".page-header");
        if (headerEl) headerEl.insertAdjacentHTML("afterend", navBarHtml);
        else container.insertAdjacentHTML("afterbegin", navBarHtml);
      }
    } catch (e3) {
      console.error("[Reports] خطأ في شريط التنقل بين التقارير", e3);
    }
    // [BREADCRUMB-4-LEVEL] نضيف مستوى رابع باسم التقرير المفتوح فوق
    // مسار الـ breadcrumb العادي بتاع الـ Hub (الرئيسية > التقارير >
    // تقارير <القسم> > <اسم التقرير>)، من غير ما نعمل navigate كامل.
    if (typeof renderPageTrail === "function" && rep) {
      renderPageTrail(groupId + "_hub", {
        label: rep.label,
        backAction: "_closeGroupReport('" + groupId + "')",
      });
    }
  };

  /** يرجّع شاشة المجموعة لشبكة التقارير (بدون navigate) */
  window._closeGroupReport = function (groupId) {
    var container = document.getElementById("rpt-hub-" + groupId);
    if (container) container.innerHTML = _renderGroupHubGrid(groupId);
    // [BREADCRUMB-4-LEVEL] نرجّع الـ breadcrumb لمستوى الـ Hub العادي
    // (بدون اسم التقرير) بعد الرجوع لشبكة البطاقات.
    if (typeof renderPageTrail === "function") {
      renderPageTrail(groupId + "_hub");
    }
  };

  /** زرار الرجوع الموجود جوه كل تقرير (_reportHeader) — لو التقرير متفتح
   * محليًا جوه شاشة مجموعة (rpt-hub-<id> موجودة في الصفحة) يرجّع للشبكة
   * محليًا، غير كده (تقرير مفتوح مستقل، أو جوه تاب تاني زي البنوك) يعمل
   * navigate عادي لصفحة المجموعة. */
  window._reportBackNav = function (groupId) {
    var container = document.getElementById("rpt-hub-" + groupId);
    if (container) {
      _closeGroupReport(groupId);
    } else {
      navigate(groupId + "_hub");
    }
  };

  // ─────────────────────────────────────────────────────────────────
  // § 4. REPORT HELPERS — أدوات مشتركة بين جميع التقارير
  // ─────────────────────────────────────────────────────────────────

  function _fmtNum(n, decimals) {
    if (n === undefined || n === null || isNaN(n)) return "—";
    return NumberEngine.decimal(Number(n), decimals || 0);
  }

  // [إصلاح P2 — فصل تنسيق المبالغ عن الكميات] _fmtNum تبقى مخصّصة للكميات فقط.
  // أي قيمة مالية (مبلغ/رصيد/إجمالي) تمر عبر formatMoney() المركزية لاحترام
  // تفضيل العملة الفعلي للمستخدم، بدل رمز "ج" الثابت المفروض يدويًا سابقًا.
  function _fmtMoneyReport(n, decimals) {
    if (n === undefined || n === null || isNaN(n)) return "—";
    if (typeof formatMoney === "function")
      return formatMoney(n, {
        decimals: decimals === undefined ? 2 : decimals,
      });
    // fallback آمن لو formatMoney مش متاحة لأي سبب (عدم تحميل 00_JS_DataLayer.html)
    return NumberEngine.currency(Number(n));
  }

  // تصدير الجدول إلى Excel
  // [REPORT-ENGINE-BRIDGE] بيمرّ دلوقتي عبر ReportEngine.exportExcel بدل
  // نداء ExportUtil مباشرة، عشان يستفيد من تسجيل AuditEngine الموحّد
  // (نفس ما بيحصل لأي شاشة تانية بتستخدم ReportEngine). data هنا أصلاً
  // مصفوفة صفوف (array-of-arrays)، فبنبني columns بمفاتيح رقمية (index)
  // تطابق نفس القيم في _rows2D بدون أي تغيير في شكل الملف الناتج.
  function _exportTableToExcel(data, headers, filename) {
    if (typeof ReportEngine !== "undefined") {
      var columns = (headers || []).map(function (h, i) {
        return { key: i, label: h };
      });
      ReportEngine.exportExcel(data, columns, filename, "تقرير");
      return;
    }
    if (window.ExportUtil) {
      ExportUtil.toExcel(data, headers, filename, "تقرير");
      return;
    }
    if (!window.XLSX) {
      showToast && NotificationEngine.error("مكتبة Excel غير محملة");
      return;
    }
    var ws = XLSX.utils.aoa_to_sheet([headers].concat(data));
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "تقرير");
    XLSX.writeFile(wb, (filename || "report") + ".xlsx");
  }

  /** CSV للتقارير — يستدعي دالة التصدير بعد تحويل البيانات */
  window._exportReportCSV = function (fnName) {
    try {
      var fn = window[fnName.replace(/\(\)/, "")];
      if (!fn) {
        showToast && NotificationEngine.error("دالة التصدير غير موجودة");
        return;
      }
      // intercept _exportTableToExcel temporarily
      var origExcel = window._exportTableToExcel;
      window._exportTableToExcel = function (data, headers, filename) {
        window._exportTableToExcel = origExcel;
        if (typeof ReportEngine !== "undefined") {
          var columns = (headers || []).map(function (h, i) {
            return { key: i, label: h };
          });
          ReportEngine.exportCSV(data, columns, filename);
          return;
        }
        ExportUtil
          ? ExportUtil.toCSV(data, headers, filename)
          : showToast && NotificationEngine.error("ExportUtil غير محملة");
      };
      fn();
    } catch (e) {
      showToast && NotificationEngine.error("خطأ: " + e.message);
    }
  };

  /** طباعة للتقارير */
  window._printReport = function (fnName) {
    try {
      var fn = window[fnName.replace(/\(\)/, "")];
      if (!fn) {
        showToast && NotificationEngine.error("دالة التصدير غير موجودة");
        return;
      }
      var origExcel = window._exportTableToExcel;
      window._exportTableToExcel = function (data, headers, filename) {
        window._exportTableToExcel = origExcel;
        ExportUtil
          ? ExportUtil.toPrint(data, headers, filename)
          : showToast && NotificationEngine.error("ExportUtil غير محملة");
      };
      fn();
    } catch (e) {
      showToast && NotificationEngine.error("خطأ: " + e.message);
    }
  };

  function _getMonthStart() {
    var now = new Date();
    return (
      now.getFullYear() +
      "-" +
      String(now.getMonth() + 1).padStart(2, "0") +
      "-01"
    );
  }
  function _getTodayStr() {
    var now = new Date();
    return (
      now.getFullYear() +
      "-" +
      String(now.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(now.getDate()).padStart(2, "0")
    );
  }

  window._loadSalesSummary = function () {
    var id = "sales_summary_report";
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = _loadingSpinner();
    var from =
      (document.getElementById("sales_from") || {}).value || _getMonthStart();
    var to =
      (document.getElementById("sales_to") || {}).value || _getTodayStr();

    // [REPORTS-P1] بدل getSaleInvoices الكامل + فلترة يدوية بالتاريخ في
    // المتصفح، الفلترة بالفترة بتتم دلوقتي في السيرفر عبر ReportQuery
    // (Code_47_ReportDataLayer.gs) — الشبكة بتنقل بس فواتير الفترة
    // المطلوبة مش كل تاريخ المبيعات.
    ReportQuery.fetch(
      "sale_invoices",
      { dateFrom: from, dateTo: to },
      { page: 1, pageSize: 5000, sortBy: "date", sortDir: "asc" },
      function (res) {
        var invoices = res.data || [];

        var totalSales = 0,
          totalReturns = 0,
          totalNet = 0;
        var byMonth = {};

        invoices.forEach(function (inv) {
          var total = parseFloat(inv.total || 0);
          var isReturn = inv.type === "RETURN" || inv.is_return;
          if (isReturn) {
            totalReturns += total;
          } else {
            totalSales += total;
          }
          var month = (inv.date || "").substring(0, 7);
          if (!byMonth[month])
            byMonth[month] = { sales: 0, returns: 0, count: 0 };
          if (isReturn) byMonth[month].returns += total;
          else {
            byMonth[month].sales += total;
            byMonth[month].count++;
          }
        });

        totalNet = totalSales - totalReturns;
        window._salesSummaryData = invoices;

        var monthRows = Object.keys(byMonth)
          .sort()
          .reverse()
          .map(function (m) {
            var d = byMonth[m];
            return (
              "<tr><td>" +
              m +
              "</td><td>" +
              d.count +
              '</td><td style="color:#059669;font-weight:600">' +
              _fmtMoneyReport(d.sales, 2) +
              '</td><td style="color:#DC2626">' +
              _fmtMoneyReport(d.returns, 2) +
              '</td><td style="font-weight:700">' +
              _fmtMoneyReport(d.sales - d.returns, 2) +
              "</td></tr>"
            );
          })
          .join("");

        el.innerHTML =
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;margin-top:16px">' +
          _statCard(
            "إجمالي المبيعات",
            formatMoney(totalSales, { decimals: 2 }),
            "ti-cash",
            "#059669",
            "#D1FAE5",
          ) +
          _statCard(
            "إجمالي المرتجعات",
            formatMoney(totalReturns, { decimals: 2 }),
            "ti-arrow-back-up",
            "#DC2626",
            "#FEE2E2",
          ) +
          _statCard(
            "صافي المبيعات",
            formatMoney(totalNet, { decimals: 2 }),
            "ti-chart-line",
            "#2563EB",
            "#DBEAFE",
          ) +
          _statCard(
            "عدد الفواتير",
            invoices.filter(function (i) {
              return !i.is_return;
            }).length,
            "ti-file-invoice",
            "#7C3AED",
            "#EDE9FE",
          ) +
          "</div>" +
          '<div class="card" style="overflow:auto">' +
          '<div style="font-weight:700;margin-bottom:12px">' +
          I18N.t("RPT_SUMMARY_BY_MONTH") +
          "</div>" +
          '<table style="width:100%;border-collapse:collapse">' +
          '<thead><tr style="background:var(--surface2);border-bottom:1px solid var(--border)">' +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("LBL_MONTH") +
          "</th>" +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("LBL_INVOICES_COUNT") +
          "</th>" +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("MENU_SALES") +
          "</th>" +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("LBL_RETURNS") +
          "</th>" +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("HR_NET") +
          "</th>" +
          "</tr></thead><tbody>" +
          (monthRows ||
            '<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--text3)">' +
              I18N.t("HR_NO_DATA_FOR_PERIOD") +
              "</td></tr>") +
          "</tbody></table></div>";
      },
      function (err) {
        el.innerHTML = _emptyState("حدث خطأ في جلب البيانات");
        console.error("[Reports] خطأ في الاتصال بالخادم:", err);
      },
    );
  };

  function renderSalesByItemReport() {

      _reportHeader(

    setTimeout(function () {
      _gsr("getSaleInvoices", [APP.currentUser ? APP.currentUser.username : null, SESSION ? SESSION.token : null], {
        label: "getSaleInvoices",
        onSuccess: function (res) {
          var el = document.getElementById(id);
          if (!el) return;
          if (!res || !res.success) {
            el.innerHTML = _emptyState("حدث خطأ");
            return;
          }

          var byItem = {};
          (res.data || []).forEach(function (inv) {
            if (inv.is_return) return;
            var lines = inv.lines_json || inv.lines || [];
            lines.forEach(function (line) {
              var name = line.item_name || line.item_id || "غير معروف";
              if (!byItem[name]) byItem[name] = { qty: 0, val: 0 };
              byItem[name].qty += parseFloat(line.quantity || 0);
              byItem[name].val += parseFloat(
                line.total || line.quantity * line.price || 0,
              );
            });
          });

          var sorted = Object.keys(byItem)
            .map(function (k) {
              return { name: k, qty: byItem[k].qty, val: byItem[k].val };
            })
            .sort(function (a, b) {
              return b.val - a.val;
            });

          if (!sorted.length) {
            el.innerHTML = _emptyState("لا توجد بيانات مبيعات");
            return;
          }

          var maxVal = sorted[0].val;
          var rows = sorted.map(function (item, i) {
            return {
              _key: i,
              rank: i + 1,
              name: item.name,
              qty: item.qty,
              val: item.val,
              pct: maxVal > 0 ? (item.val / maxVal) * 100 : 0,
            };
          });

          el.innerHTML = '<div id="' + id + '_table"></div>';

          ColumnEngine.register(
            id,
            [
              { key: "rank", label: "#", type: "number", width: 50 },
              { key: "name", label: I18N.t("COL_ITEM"), type: "text" },
              {
                key: "qty",
                label: I18N.t("RPT_QTY_SOLD"),
                type: "number",
                align: "left",
                format: function (v) {
                  return _fmtNum(v);
                },
              },
              {
                key: "val",
                label: I18N.t("HR_VALUE"),
                type: "number",
                align: "left",
                format: function (v) {
                  return (
                    '<span style="font-weight:700;color:#059669">' +
                    _fmtMoneyReport(v, 2) +
                    "</span>"
                  );
                },
              },
              {
                key: "pct",
                label: I18N.t("LBL_PERCENTAGE"),
                type: "number",
                format: function (v) {
                  return (
                    '<div style="width:120px;background:#eee;border-radius:20px;height:6px"><div style="background:#059669;width:' +
                    v +
                    '%;height:100%;border-radius:20px"></div></div>'
                  );
                },
              },
            ],
            { rowKey: "_key", title: "المبيعات حسب الصنف" },
          );
          ColumnEngine.renderTable(
            id,
            document.getElementById(id + "_table"),
            rows,
          );
        },
        onError: function (err) {
          console.error("[Reports] خطأ في الاتصال بالخادم:", err);
          var _errEl = document.querySelector(".report-loading-active");
          if (_errEl)
            _errEl.innerHTML =

              I18N.t("MSG_SERVER_CONN_FAILED") +
              "</div>";
        },
      });
    }, 100);

    return html;

  function _renderAgingReport(
    partyType,
    groupId,
    groupTitle,
    color,
    bgColor,
    icon,
    title,
  ) {
    var id = "aging_report_" + partyType;
    var html =
      _reportHeader(title, icon, color, bgColor, groupId, groupTitle, "") +
      '<div id="' +
      id +
      '">' +
      _loadingSpinner() +
      "</div>";

    setTimeout(function () {
      _gsr("getAgingReport", [APP.currentUser ? APP.currentUser.username : null, partyType], {
        label: "getAgingReport",
        onSuccess: function (res) {
          var el = document.getElementById(id);
          if (!el) return;
          if (!res || !res.success) {
            el.innerHTML = _emptyState("حدث خطأ في جلب البيانات");
            return;
          }

          var data = (res.data || []).filter(function (r) {
            return r.total > 0;
          });

          if (!data.length) {
            el.innerHTML = _emptyState("لا توجد ذمم مستحقة", "ti-mood-happy");
            return;
          }

          var totals = {
            current: 0,
            d30: 0,
            d60: 0,
            d90: 0,
            over90: 0,
            total: 0,
          };
          data.forEach(function (r) {
            totals.current += r.buckets.current || 0;
            totals.d30 += r.buckets.days30 || 0;
            totals.d60 += r.buckets.days60 || 0;
            totals.d90 += r.buckets.days90 || 0;
            totals.over90 += r.buckets.over90 || 0;
            totals.total += r.total;
          });

          var rows = data.map(function (r, i) {
            var waBtn = "";
            if (
              partyType === "customer" &&
              r.phone &&
              typeof canDo === "function" &&
              canDo("sendWhatsapp") &&
              typeof WA_CONFIG !== "undefined" &&
              WA_CONFIG.isEnabled()
            ) {
              var ctxJson = JSON.stringify({
                category: "payment_reminder",
                customer_name: r.name,
                phone: r.phone,
                customer_id: r.id,
                source_type: "payment_reminder",
                source_id: r.id,
                context_data: {
                  customer_name: r.name,
                  balance_due: _fmtMoneyReport(r.total, 2),

                'onclick="WA_MODAL.open(' +

                I18N.t("RPT_SEND_PAYMENT_REMINDER_WA") +
                '">' +
                '<i class="ti ti-brand-whatsapp"></i></button>';
            }
            return {
              _key: r.id || i,
              name: r.name,
              phone: r.phone || "—",
              current: r.buckets.current || 0,
              d30: r.buckets.days30 || 0,
              d60: r.buckets.days60 || 0,
              d90: r.buckets.days90 || 0,
              over90: r.buckets.over90 || 0,

            _statCard(

            _statCard(

              "#059669",

            _statCard(
              "31-60 يوم",
              _fmtMoneyReport(totals.d30, 2),

              "#D97706",
              "#FEF3C7",

              key: "d30",
              label: I18N.t("RPT_AGE_31_60"),
              type: "number",
              align: "left",

            },

              label: I18N.t("RPT_AGE_61_90"),
              type: "number",
              align: "left",
              format: function (v) {
                return _fmtMoneyReport(v, 2);
              },
            },
            {
              key: "d90",
              label: I18N.t("RPT_AGE_91_120"),
              type: "number",
              align: "left",
              format: function (v) {
                return _fmtMoneyReport(v, 2);
              },
            },
            {
              key: "over90",
              label: I18N.t("RPT_AGE_120_PLUS"),
              type: "number",
              align: "left",
              format: function (v) {

              label: I18N.t("LBL_TOTAL"),

  function renderFactoryEfficiencyReport() {
    var id = "factory_eff_report";
    var html =
      _reportHeader(
        "كفاءة المصنع",
        "ti-chart-line",
        "#92400E",
        "#FEF3C7",
        "production",
        "تقارير الإنتاج",
      ) +
      '<div id="' +
      id +
      '">' +
      _loadingSpinner() +
      "</div>";

    setTimeout(function () {
      // [DATA-LOADING-ENGINE] productionOrders مسجّلة Level 2 (ON_DEMAND) في
      // Code_53_DataRegistryEngine.js — بنجيبها بمفردها بدل getAllData() الثقيلة
      DL.Core.getAllDataByLevel([2], {
        label: "getAllDataByLevel(2)-factoryEfficiency",
        onSuccess: function (res) {
          var el = document.getElementById(id);
          if (!el) return;

          var orders = [];
          if (res && res.productionOrders) {
            orders = res.productionOrders;
          } else if (res && res.data && res.data.productionOrders) {
            orders = res.data.productionOrders;
          }

          if (!orders.length) {
            el.innerHTML = _emptyState(
              "لا توجد بيانات إنتاج كافية لحساب الكفاءة",
              "ti-building-factory-2",
            );
            return;
          }

          var completed = orders.filter(function (o) {
            return o.status === "مكتمل" || o.status === "completed";
          });
          var inProgress = orders.filter(function (o) {
            return (
              o.status === "جارٍ" ||
              o.status === "in_progress" ||
              o.status === "قيد التنفيذ"
            );
          });
          var pending = orders.filter(function (o) {
            return o.status === "معلق" || o.status === "pending";
          });

          var completedPct = orders.length
            ? NumberEngine.decimal((completed.length / orders.length) * 100, 1)
            : 0;

          var statusRows = [
            {
              label: "مكتمل",
              count: completed.length,
              color: "#059669",
              bg: "#D1FAE5",
            },
            {
              label: "قيد التنفيذ",
              count: inProgress.length,
              color: "#D97706",
              bg: "#FEF3C7",
            },
            {
              label: "معلق",
              count: pending.length,
              color: "#6B7280",
              bg: "#F3F4F6",
            },
            {
              label: "الإجمالي",
              count: orders.length,
              color: "#0E7490",
              bg: "#CFFAFE",
            },
          ];

          el.innerHTML =
            '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px">' +
            statusRows
              .map(function (s) {
                return _statCard(
                  s.label,
                  s.count,
                  "ti-building-factory-2",
                  s.color,
                  s.bg,
                );
              })
              .join("") +
            "</div>" +
            '<div class="card">' +
            '<div style="font-weight:700;margin-bottom:12px">' +
            I18N.t("LBL_COMPLETION_RATE") +
            "</div>" +
            '<div style="background:#eee;border-radius:20px;height:16px;overflow:hidden">' +
            '<div style="background:#059669;width:' +
            completedPct +
            '%;height:100%;border-radius:20px;display:flex;align-items:center;justify-content:flex-end;padding-left:8px">' +
            '<span style="color:#fff;font-size:11px;font-weight:700">' +
            completedPct +
            "%</span></div></div>" +
            '<p style="margin:8px 0 0;font-size:13px;color:var(--text3)">' +
            completed.length +
            " من أصل " +
            orders.length +
            " أمر إنتاج مكتمل</p>" +
            "</div>";
        },
        onError: function (err) {
          console.error("[Reports] خطأ في الاتصال بالخادم:", err);
          var _errEl = document.querySelector(".report-loading-active");
          if (_errEl)
            _errEl.innerHTML =

              I18N.t("MSG_SERVER_CONN_FAILED") +
              "</div>";
        },
      });
    }, 100);

    return html;
  }

  window._loadAttendanceReport = function () {
    var id = "attendance_report_main";
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = _loadingSpinner();
    var from =
      (document.getElementById("att_from") || {}).value || _getMonthStart();
    var to = (document.getElementById("att_to") || {}).value || _getTodayStr();

    _gsr("getAttendance", [{ from: from, to: to }], {
      label: "getAttendance",
      onSuccess: function (res) {
        if (!res || !res.success) {
          el.innerHTML = _emptyState("حدث خطأ في جلب بيانات الحضور");
          return;
        }

        var records = (res.data || []).filter(function (r) {
          if (!r.date) return true;
          return r.date >= from && r.date <= to;
        });

        var present = records.filter(function (r) {
          return r.status === "حاضر" || r.status === "present";
        });
        var absent = records.filter(function (r) {
          return r.status === "غائب" || r.status === "absent";
        });
        var late = records.filter(function (r) {
          return r.status === "متأخر" || r.status === "late";
        });

        window._attendanceData = records;

        var byEmp = {};
        records.forEach(function (r) {
          var name = r.employee_name || r.employee_id || "غير معروف";
          if (!byEmp[name]) byEmp[name] = { present: 0, absent: 0, late: 0 };
          if (r.status === "حاضر" || r.status === "present")
            byEmp[name].present++;
          else if (r.status === "غائب" || r.status === "absent")
            byEmp[name].absent++;
          else if (r.status === "متأخر" || r.status === "late")
            byEmp[name].late++;
        });

        var rows = Object.keys(byEmp)
          .map(function (name) {
            var d = byEmp[name];
            var total = d.present + d.absent + d.late;
            var pct = total > 0 ? NumberEngine.decimal((d.present / total) * 100, 1) : 0;
            return (
              "<tr>" +
              '<td style="font-weight:600">' +
              name +
              "</td>" +
              '<td style="color:#059669">' +
              d.present +
              "</td>" +
              '<td style="color:#DC2626">' +
              d.absent +
              "</td>" +
              '<td style="color:#D97706">' +
              d.late +
              "</td>" +
              "<td>" +
              pct +
              "%</td>" +
              "</tr>"
            );
          })
          .join("");

        el.innerHTML =
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;margin-top:16px">' +
          _statCard(
            "إجمالي السجلات",
            records.length,
            "ti-list",
            "#BE185D",
            "#FCE7F3",
          ) +
          _statCard("حاضر", present.length, "ti-check", "#059669", "#D1FAE5") +
          _statCard("غائب", absent.length, "ti-x", "#DC2626", "#FEE2E2") +
          _statCard(
            "متأخر",
            late.length,
            "ti-clock-exclamation",
            "#D97706",
            "#FEF3C7",
          ) +
          "</div>" +
          '<div class="card" style="overflow:auto"><table style="width:100%;border-collapse:collapse">' +
          '<thead><tr style="background:var(--surface2);border-bottom:1px solid var(--border)">' +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("HR_EMPLOYEE") +
          "</th>" +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("HR_PRESENT") +
          "</th>" +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("HR_ABSENT") +
          "</th>" +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("HR_LATE") +
          "</th>" +
          '<th style="padding:10px 12px;text-align:right;font-size:13px">' +
          I18N.t("HR_ATTENDANCE_RATE") +
          "</th>" +
          "</tr></thead><tbody>" +
          (rows ||
            '<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--text3)">' +
              I18N.t("MSG_NO_RECORDS_FOR_SELECTED_PERIOD") +
              "</td></tr>") +
          "</tbody></table></div>";
      },
      onError: function (err) {
        console.error("[Reports] خطأ في الاتصال بالخادم:", err);
        var _errEl = document.querySelector(".report-loading-active");
        if (_errEl)
          _errEl.innerHTML =
            '<div style="color:#DC2626;padding:20px;text-align:center"><i class="ti ti-wifi-off" style="font-size:24px;display:block;margin-bottom:8px"></i>' +
            I18N.t("MSG_SERVER_CONN_FAILED") +
            "</div>";
      },
    });

  window._loadCashFlow = function () {
    var id = "cash_flow_report";
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = _loadingSpinner();
    var from =
      (document.getElementById("cf_from") || {}).value || _getMonthStart();
    var to = (document.getElementById("cf_to") || {}).value || _getTodayStr();

    _gsr("getJournalEntries", [{ from: from, to: to }], {
      label: "getJournalEntries",
      onSuccess: function (res) {
        if (!res || !res.success) {
          el.innerHTML = _emptyState("حدث خطأ في جلب البيانات");
          return;
        }

        var entries = (res.data || []).filter(function (e) {
          return e.posted && e.date >= from && e.date <= to;
        });

        var totalDebit = 0,
          totalCredit = 0;
        var byDate = {};
        entries.forEach(function (e) {
          var d = parseFloat(e.debit || 0);
          var c = parseFloat(e.credit || 0);
          totalDebit += d;
          totalCredit += c;
          var month = (e.date || "").substring(0, 7);
          if (!byDate[month]) byDate[month] = { debit: 0, credit: 0, count: 0 };
          byDate[month].debit += d;
          byDate[month].credit += c;
          byDate[month].count++;
        });

        window._cashFlowData = entries;

        var monthRows = Object.keys(byDate)
          .sort()
          .reverse()
          .map(function (m) {
            var d = byDate[m];
            return (
              "<tr>" +
              "<td>" +
              m +
              "</td>" +
              "<td>" +
              d.count +
              "</td>" +
              '<td style="color:#059669">' +
              _fmtMoneyReport(d.debit, 2) +
              "</td>" +
              '<td style="color:#DC2626">' +
              _fmtMoneyReport(d.credit, 2) +
              "</td>" +
              '<td style="font-weight:700">' +
              _fmtMoneyReport(d.debit - d.credit, 2) +
              "</td>" +
              "</tr>"
            );
          })

  // ── تقرير الشيكات ─────────────────────────────────────────────
  function renderChequesReport() {
    var id = "cheques_report_body";
    var html =
      _reportHeader(
        "تقرير الشيكات",
        "ti-file-dollar",
        "#15803D",
        "#DCFCE7",
        "banking",
        "تقارير البنوك",
        "",
      ) +
      '<div id="' +
      id +
      '">' +
      _loadingSpinner() +
      "</div>";

    setTimeout(function () {
      _gsr("getCheques", undefined, {
        label: "getCheques",
        onSuccess: function (res) {
          var el = document.getElementById(id);
          if (!el) return;
          if (!res || !res.success) {
            el.innerHTML = _emptyState("حدث خطأ في جلب البيانات");
            return;
          }
          var cheques = res.data || [];
          var todayStr = _getTodayStr();
          var soonStr = new Date(Date.now() + 7 * 86400000)
            .toISOString()
            .split("T")[0];

          var byStatus = {};
          var overdue = [];
          var dueSoon = [];
          var totalIncoming = 0,
            totalOutgoing = 0;

          cheques.forEach(function (c) {
            var st = c.status || "PENDING";
            byStatus[st] = (byStatus[st] || 0) + 1;
            var amt = parseFloat(c.amount || 0);
            if (c.type === "INCOMING") totalIncoming += amt;
            else totalOutgoing += amt;
            if (st === "PENDING" && c.due_date) {
              if (c.due_date < todayStr) overdue.push(c);
              else if (c.due_date <= soonStr) dueSoon.push(c);
            }
          });

          var statusLabels = {
            PENDING: "تحت التحصيل",
            COLLECTED: "محصّل",
            BOUNCED: "مرتد",
            CANCELLED: "ملغي",
            REPLACED: "مستبدل",
          };
          var statusCards = Object.keys(statusLabels)
            .map(function (s) {
              return _statCard(
                statusLabels[s],
                byStatus[s] || 0,
                "ti-file-dollar",
                s === "BOUNCED"
                  ? "#DC2626"
                  : s === "COLLECTED"
                    ? "#059669"
                    : "#0F766E",
                s === "BOUNCED"
                  ? "#FEE2E2"
                  : s === "COLLECTED"
                    ? "#D1FAE5"
                    : "#CCFBF1",
              );
            })
            .join("");

          var chequeCols = [
            {
              key: "cheque_number",
              label: I18N.t("ACC_CHEQUE_NUMBER"),
              type: "text",
            },
            {
              key: "type",
              label: I18N.t("LBL_TYPE"),
              type: "text",
              format: function (v) {
                return v === "INCOMING" ? "وارد" : "صادر";
              },
            },
            { key: "party_name", label: I18N.t("ACC_PARTY"), type: "text" },
            {
              key: "due_date",
              label: I18N.t("LBL_DUE_DATE"),
              type: "text",
              format: function (v) {
                return _fmtDate(v);
              },
            },
            {
              key: "amount",
              label: I18N.t("HR_AMOUNT"),
              type: "number",
              align: "left",
              format: function (v) {
                return _fmtMoneyReport(v, 0);
              },
            },
            {
              key: "bank_account_name",
              label: I18N.t("ACC_BANK_ACCOUNT"),
              type: "text",
            },
          ];

          function _renderChequeListTable(screenId, list, emptyMsg, title) {
            var container = document.getElementById(screenId + "_table");
            if (!container) return;
            if (!list.length) {
              container.innerHTML = _emptyState(emptyMsg);
              return;
            }
            var rows = list.map(function (c, i) {
              return {
                _key: c.cheque_number || i,
                cheque_number: c.cheque_number || "",
                type: c.type,
                party_name: c.party_name || "",
                due_date: c.due_date,
                amount: c.amount,
                bank_account_name: c.bank_account_name || "",
              };
            });
            ColumnEngine.register(screenId, chequeCols, {
              rowKey: "_key",
              title: title,
              hideSearch: true,
            });
            ColumnEngine.renderTable(screenId, container, rows);
          }

          el.innerHTML =
            '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;margin-top:16px">' +
            statusCards +
            "</div>" +
            '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px">' +
            _statCard(
              "إجمالي الشيكات الواردة",
              _fmtMoneyReport(totalIncoming, 0),
              "ti-arrow-down",
              "#059669",
              "#D1FAE5",
            ) +
            _statCard(
              "إجمالي الشيكات الصادرة",
              _fmtMoneyReport(totalOutgoing, 0),
              "ti-arrow-up",
              "#DC2626",
              "#FEE2E2",
            ) +
            "</div>" +
            '<h3 style="font-size:14px;font-weight:700;margin:0 0 10px;color:#DC2626"><i class="ti ti-alert-triangle"></i> شيكات متأخرة عن الاستحقاق (' +
            overdue.length +
            ")</h3>" +
            '<div id="cheques_overdue_table"></div>' +
            '<h3 style="font-size:14px;font-weight:700;margin:20px 0 10px;color:#B45309"><i class="ti ti-clock"></i> مستحقة خلال 7 أيام (' +
            dueSoon.length +
            ")</h3>" +
            '<div id="cheques_due_soon_table"></div>';

          _renderChequeListTable(
            "cheques_overdue",
            overdue,
            "لا توجد شيكات متأخرة",
            "شيكات متأخرة عن الاستحقاق",
          );
          _renderChequeListTable(
            "cheques_due_soon",
            dueSoon,
            "لا توجد شيكات مستحقة قريباً",
            "شيكات مستحقة خلال 7 أيام",
          );
        },
        onError: function (err) {
          console.error("[Reports] خطأ في الاتصال بالخادم:", err);
          var el = document.getElementById(id);
          if (el)
            el.innerHTML =
              '<div style="color:#DC2626;padding:20px;text-align:center"><i class="ti ti-wifi-off" style="font-size:24px;display:block;margin-bottom:8px"></i>' +
              I18N.t("MSG_SERVER_CONN_FAILED") +
              "</div>";
        },
      });
    }, 100);

    return html;
  }

  window._loadTransfersReport = function () {
    var id = "transfers_report_body";
    var el = document.getElementById(id);
    if (!el) return;
    var from =
      (document.getElementById("tr_from") || {}).value || _getMonthStart();
    var to = (document.getElementById("tr_to") || {}).value || _getTodayStr();
    el.innerHTML = _loadingSpinner();

    _gsr("getTransferVouchers", [{}], {
      label: "getTransferVouchers",
      onSuccess: function (res) {
        if (!res || !res.success) {
          el.innerHTML = _emptyState("حدث خطأ في جلب البيانات");
          return;
        }
        var all = (res.data || []).filter(function (t) {
          var d = t.approved_at || t.date || "";
          return (d.split("T")[0] || d) >= from && (d.split("T")[0] || d) <= to;
        });
        window._transfersReportData = all;

        var approved = all.filter(function (t) {
          return t.status === "APPROVED";
        });
        var totalAmount = 0,
          totalFees = 0;
        approved.forEach(function (t) {
          totalAmount += parseFloat(t.amount || 0);
          totalFees += parseFloat(t.fee_amount || 0);

        var rows = all
          .map(function (t) {
            var statusLabel =
              t.status === "APPROVED"
                ? '<span style="color:#059669;font-weight:600">' +
                  I18N.t("STATUS_APPROVED") +
                  "</span>"
                : t.status === "DRAFT"
                  ? '<span style="color:#B45309;font-weight:600">' +
                    I18N.t("STATUS_DRAFT") +
                    "</span>"
                  : t.status;
            return (
              "<tr>" +
              "<td>" +
              (t.voucher_number || t.id) +
              "</td><td>" +
              _fmtDate(t.date) +
              "</td><td>" +
              (t.from_name || "") +
              " ← " +
              (t.to_name || "") +
              "</td><td>" +
              _fmtMoneyReport(t.amount, 0) +
              "</td><td>" +
              (parseFloat(t.fee_amount || 0)
                ? _fmtMoneyReport(t.fee_amount, 0)
                : "—") +
              "</td><td>" +
              (t.bank_reference || "—") +
              "</td><td>" +
              statusLabel +
              "</td></tr>"
            );
          })
          .join("");

        el.innerHTML =
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px;margin-top:16px">' +
          _statCard(
            "عدد التحويلات المعتمدة",
            approved.length,
            "ti-transfer",
            "#15803D",
            "#DCFCE7",
          ) +
          _statCard(
            "إجمالي المبالغ المحوّلة",
            _fmtMoneyReport(totalAmount, 0),
            "ti-cash",
            "#0F766E",
            "#CCFBF1",
          ) +
          _statCard(
            "إجمالي العمولات",
            _fmtMoneyReport(totalFees, 0),
            "ti-receipt",
            "#B45309",
            "#FEF3C7",
          ) +
          "</div>" +
          '<div class="card" style="overflow:auto"><table style="width:100%;border-collapse:collapse">' +

  /** المشتريات حسب الصنف — تجميع بنود فواتير الشراء لكل صنف */
  function renderPurchaseByItemReport() {
    var id = "purchase_by_item_report";
    var html =
      _reportHeader(
        "المشتريات حسب الصنف",
        "ti-package",
        "#B45309",
        "#FEF3C7",
        "purchases",
        "تقارير المشتريات",
        "",
      ) +
      '<div id="' +
      id +
      '">' +
      _loadingSpinner() +
      "</div>";

    setTimeout(function () {
      _gsr("getPurchaseInvoices", undefined, {
        label: "getPurchaseInvoices",
        onSuccess: function (res) {
          var el = document.getElementById(id);
          if (!el) return;
          if (!res || !res.success) {
            el.innerHTML = _emptyState("حدث خطأ");
            return;
          }

          var byItem = {};
          (res.data || []).forEach(function (inv) {
            if (inv.is_return) return;
            var lines = inv.lines_json || inv.lines || [];
            lines.forEach(function (line) {
              var name = line.item_name || line.item_id || "غير معروف";
              if (!byItem[name]) byItem[name] = { qty: 0, val: 0 };
              byItem[name].qty += parseFloat(line.quantity || 0);
              byItem[name].val += parseFloat(
                line.total || line.quantity * line.price || 0,
              );
            });
          });

          var sorted = Object.keys(byItem)
            .map(function (k) {
              return { name: k, qty: byItem[k].qty, val: byItem[k].val };
            })
            .sort(function (a, b) {
              return b.val - a.val;
            });

          if (!sorted.length) {
            el.innerHTML = _emptyState("لا توجد بيانات مشتريات");
            return;
          }

          var maxVal = sorted[0].val;
          var rows = sorted.map(function (item, i) {
            return {
              _key: i,
              rank: i + 1,
              name: item.name,
              qty: item.qty,
              val: item.val,
              pct: maxVal > 0 ? (item.val / maxVal) * 100 : 0,
            };
          });

          el.innerHTML = '<div id="' + id + '_table"></div>';

          ColumnEngine.register(
            id,
            [
              { key: "rank", label: "#", type: "number", width: 50 },
              { key: "name", label: I18N.t("COL_ITEM"), type: "text" },
              {
                key: "qty",
                label: I18N.t("RPT_QTY_PURCHASED"),
                type: "number",
                align: "left",
                format: function (v) {
                  return _fmtNum(v);
                },
              },
              {
                key: "val",
                label: I18N.t("HR_VALUE"),
                type: "number",
                align: "left",
                format: function (v) {
                  return (
                    '<span style="font-weight:700;color:#B45309">' +
                    _fmtMoneyReport(v, 2) +
                    "</span>"
                  );
                },
              },
              {
                key: "pct",
                label: I18N.t("LBL_PERCENTAGE"),
                type: "number",
                format: function (v) {
                  return (
                    '<div style="width:120px;background:#eee;border-radius:20px;height:6px"><div style="background:#B45309;width:' +
                    v +
                    '%;height:100%;border-radius:20px"></div></div>'
                  );
                },
              },
            ],
            { rowKey: "_key", title: "المشتريات حسب الصنف" },
          );
          ColumnEngine.renderTable(
            id,
            document.getElementById(id + "_table"),
            rows,
          );
        },
        onError: function (err) {
          console.error("[Reports] خطأ في الاتصال بالخادم:", err);
          var _errEl = document.querySelector(".report-loading-active");
          if (_errEl)
            _errEl.innerHTML =
              '<div style="color:#DC2626;padding:20px;text-align:center"><i class="ti ti-wifi-off" style="font-size:24px;display:block;margin-bottom:8px"></i>' +
              I18N.t("MSG_SERVER_CONN_FAILED") +
              "</div>";
        },
      });
    }, 100);

    return html;
  }

              {
                key: "date",
                label: I18N.t("LBL_DATE"),

                format: function (v) {
                  return _fmtDate(v);
                },
              },
              { key: "supplier", label: I18N.t("LBL_SUPPLIER"), type: "text" },
              {
                key: "status",
                label: I18N.t("LBL_STATUS"),
                type: "text",
                format: function (v) {
                  return (
                    '<span style="background:#FEF3C7;color:#B45309;padding:2px 8px;border-radius:20px;font-size:12px">' +
                    (v || "—") +
                    "</span>"
                  );

              },
              {
                key: "expected_date",
                label: I18N.t("LBL_EXPECTED_DATE"),
                type: "text",
                format: function (v) {
                  return _fmtDate(v);
                },
              },
              {
                key: "net_total",
                label: I18N.t("LBL_TOTAL"),
                type: "number",
                format: function (v) {
                  return (
                    '<span style="font-weight:700">' +
                    _fmtMoneyReport(v, 2) +
                    "</span>"

                },

    var id = "depreciation_report";
    var html =
      _reportHeader(
        "تقرير الإهلاك",
        "ti-trending-down",
        "#92400E",
        "#FEF3C7",
        "assets",
        "تقارير الأصول",
        "",
      ) +
      '<div id="' +
      id +
      '">' +
      _loadingSpinner() +
      "</div>";

    setTimeout(function () {
      _fetchFixedAssetsForReport(
        function (assets) {
          var el = document.getElementById(id);
          if (!el) return;

          // إهلاك سنوي تقديري بطريقة القسط الثابت (Straight-Line)
          var withDep = assets.map(function (a) {
            var cost = parseFloat(a.purchase_cost || 0);
            var salvage = parseFloat(a.salvage_value || 0);
            var years = parseFloat(a.useful_life_years || 0) || 1;
            var annual = (cost - salvage) / years;
            return {
              raw: a,
              annual: annual > 0 ? annual : 0,
            };
          });

          var totalAnnual = 0,
            totalAccum = 0;
          withDep.forEach(function (w) {
            totalAnnual += w.annual;
            totalAccum += parseFloat(w.raw.accumulated_depreciation || 0);
          });

          if (!withDep.length) {
            el.innerHTML = _emptyState("لا توجد أصول لحساب الإهلاك عليها");
            return;
          }

          var rows = withDep.map(function (w, i) {
            var a = w.raw;
            return {
              _key: a.id || i,
              name: a.name,
              method: a.depreciation_method || "قسط ثابت",
              years: a.useful_life_years || "—",
              annual: w.annual,
              accumulated_depreciation: a.accumulated_depreciation,
              book_value: a.book_value,

            '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px">' +
            _statCard(
              "إجمالي الإهلاك السنوي التقديري",
              _fmtMoneyReport(totalAnnual, 2),
              "ti-trending-down",
              "#B91C1C",
              "#FEE2E2",
            ) +
            _statCard(
              "إجمالي الإهلاك المتراكم",
              _fmtMoneyReport(totalAccum, 2),
              "ti-history",
              "#92400E",
              "#FEF3C7",
            ) +
            "</div>" +
            '<div style="font-size:12px;color:var(--text3);margin-bottom:10px">' +
            I18N.t("FA_DEPRECIATION_METHOD_HINT") +
            '</div><div id="' +
            id +
            '_table"></div>';

          ColumnEngine.register(
            id,
            [
              { key: "name", label: I18N.t("FA_ASSET_NAME"), type: "text" },
              {
                key: "method",
                label: I18N.t("FA_DEPRECIATION_METHOD"),
                type: "text",
              },
              {
                key: "years",
                label: I18N.t("FA_USEFUL_LIFE_YEARS"),
                type: "text",
              },
              {
                key: "annual",
                label: I18N.t("FA_ANNUAL_DEPRECIATION"),
                type: "number",
                align: "left",
                format: function (v) {
                  return (
                    '<span style="color:#B91C1C">' +
                    _fmtMoneyReport(v, 2) +
                    "</span>"
                  );
                },
              },
              {
                key: "accumulated_depreciation",
                label: I18N.t("FA_ACCUMULATED_DEPRECIATION"),
                type: "number",
                align: "left",
                format: function (v) {
                  return _fmtMoneyReport(v, 2);
                },
              },
              {
                key: "book_value",
                label: I18N.t("FA_BOOK_VALUE"),
                type: "number",
                align: "left",
                format: function (v) {
                  return (
                    '<span style="font-weight:700;color:#92400E">' +
                    _fmtMoneyReport(v, 2) +
                    "</span>"
                  );
                },
              },
            ],
            { rowKey: "_key", title: "تقرير الإهلاك" },
          );
          ColumnEngine.renderTable(
            id,
            document.getElementById(id + "_table"),
            rows,

        },
        function () {
          var el = document.getElementById(id);
          if (el) el.innerHTML = _emptyState("حدث خطأ في جلب البيانات");
        },

    }, 100);

  /** مساعد مشترك: يجمع ضريبة القيمة المضافة من فواتير البيع أو الشراء حسب الشهر */
  function _buildVatMonthlyBreakdown(invoices) {
    var byMonth = {};
    var total = 0,
      totalBase = 0;
    (invoices || []).forEach(function (inv) {
      if (inv.is_return) return;
      var vat = parseFloat(inv.vat_amount || 0);
      var base = parseFloat(inv.subtotal || inv.net_total || 0);
      var d = inv.date ? new Date(inv.date) : null;
      var key =
        d && !isNaN(d)
          ? d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
          : "غير محدد";
      if (!byMonth[key]) byMonth[key] = { vat: 0, base: 0, count: 0 };
      byMonth[key].vat += vat;
      byMonth[key].base += base;
      byMonth[key].count++;
      total += vat;
      totalBase += base;
    });
    return { byMonth: byMonth, total: total, totalBase: totalBase };
  }

    var months = Object.keys(summary.byMonth).sort();
    if (!months.length) return _emptyState("لا توجد بيانات كافية");

    var rows = months
      .map(function (m) {
        var d = summary.byMonth[m];
        return (
          "<tr>" +
          '<td style="font-weight:600">' +
          m +
          "</td>" +
          "<td>" +
          d.count +
          "</td>" +
          "<td>" +
          _fmtMoneyReport(d.base, 2) +
          "</td>" +
          '<td style="font-weight:700;color:' +
          color +
          '">' +
          _fmtMoneyReport(d.vat, 2) +
          "</td>" +
          "</tr>"

      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px">' +
      _statCard(
        totalLabel,
        _fmtMoneyReport(summary.total, 2),

        "إجمالي الوعاء الضريبي",

      "</th>" +

      var salesRes = null,
        purchaseRes = null;

        if (salesRes === null || purchaseRes === null) return;

  // patch renderPage() لو موجودة
  (function _patchRenderPage() {
    if (typeof renderPage === "undefined") {
      setTimeout(_patchRenderPage, 300);
      return;
    }
    var _originalRenderPage = renderPage;
    renderPage = function (page) {
      if (_REPORT_PAGE_RENDER_MAP[page]) {
        var mainEl = document.getElementById("page-content");
        if (mainEl) {
          APP.currentPage = page;
          document.querySelectorAll(".nav-item").forEach(function (el) {
            el.classList.toggle("active", el.dataset.page === page);
          });
          document.querySelectorAll(".nav-sub-item").forEach(function (el) {
            el.classList.toggle("active", el.dataset.page === page);
          });
          if (typeof updateTopBarTitle === "function") {
            updateTopBarTitle(
              (typeof ERP_PAGE_MAP !== "undefined" &&
                ERP_PAGE_MAP[page] &&
                ERP_PAGE_MAP[page].title) ||
                "",
            );
          }
          mainEl.innerHTML = _REPORT_PAGE_RENDER_MAP[page]();
          // [FIX] كان ناقص ده، فده اللي كان بيخلي الـ breadcrumb
          // (page-trail) يفضل واقف على آخر صفحة كانت مفتوحة قبل دخول التقارير
          if (typeof renderPageTrail === "function") renderPageTrail(page);
        }
        return;
      }
      return _originalRenderPage(page);
    };
  })();

  // ── 1. نظرة عامة على الشحن ────────────────────────────────────────────────
  function renderShippingOverviewReport() {
    var ships = _getShipData();
    var total = ships.length;

    // تجميع حسب الحالة
    var byStatus = {};
    ships.forEach(function (s) {
      var st = s.status || "غير محدد";
      byStatus[st] = (byStatus[st] || 0) + 1;
    });

    // تجميع حسب الشهر
    var byMonth = {};
    ships.forEach(function (s) {
      if (!s.date) return;
      var m = s.date.slice(0, 7); // YYYY-MM
      byMonth[m] = (byMonth[m] || 0) + 1;
    });
    var months = Object.keys(byMonth).sort().slice(-6);

    var totalCost = ships.reduce(function (acc, s) {
      return acc + Number(s.shipping_cost || 0);
    }, 0);

    var delivered = byStatus["تم التسليم"] || 0;
    var deliveryRate = total ? Math.round((delivered / total) * 100) : 0;

    var html = _renderPageHeader(
      "نظرة عامة على الشحن",
      "إحصائيات الشحنات حسب الحالة والفترة",
      { bgIcon: "ti-truck", bgColor: "#FEF2E0", iconColor: "#9A3412" },
      // [REPORTS-UNIFY] توحيد زرار التصدير مع باقي التقارير (كان
      // زرار CSV مبسّط لوحده هنا بس، مختلف عن كل التقارير التانية).
      _exportBtn("تصدير", "_exportShippingOverview()"),
    );

    // بطاقات إحصائية
    html +=
      '<div class="stat-grid" style="margin-bottom:20px">' +
      statCard(
        iconBadge("ti-truck", "#FEF2E0", "#9A3412"),
        "إجمالي الشحنات",
        total,
        "شحنة",
        "",
      ) +
      statCard(
        iconBadge("ti-circle-check", "#ECFDF5", "#10b981"),
        "تم التسليم",
        delivered,
        "شحنة",
        "var(--success-soft)",
      ) +
      statCard(
        iconBadge("ti-percent", "#EEF2FF", "#4338CA"),
        "معدل التسليم",
        deliveryRate + "%",
        "",
        "#EEF2FF",
      ) +
      statCard(
        iconBadge("ti-currency-pound", "#FEF2E0", "#9A3412"),
        "إجمالي تكاليف الشحن",
        fmtNum(totalCost),
        "EGP",
        "",
      ) +
      "</div>";

    // جدول الحالات
    html +=
      '<div class="card" style="margin-bottom:20px"><h4 style="margin-bottom:12px">' +
      I18N.t("SHIP_BY_STATUS") +
      "</h4>";
    html +=
      '<div class="table-wrap"><table><thead><tr><th>' +
      I18N.t("LBL_STATUS") +
      "</th><th>" +
      I18N.t("LBL_COUNT") +
      "</th><th>" +
      I18N.t("LBL_PERCENTAGE") +
      "</th></tr></thead><tbody>";
    Object.keys(byStatus)
      .sort()
      .forEach(function (st) {
        var cnt = byStatus[st];
        var pct = total ? Math.round((cnt / total) * 100) : 0;
        html +=
          "<tr><td><b>" +
          esc(st) +
          "</b></td><td>" +
          cnt +
          "</td><td>" +
          '<div style="display:flex;align-items:center;gap:8px">' +
          '<div style="flex:1;background:var(--border);border-radius:4px;height:6px">' +
          '<div style="width:' +
          pct +
          '%;height:6px;background:var(--primary);border-radius:4px"></div></div>' +
          '<span style="font-size:12px;color:var(--text3)">' +
          pct +
          "%</span></div></td></tr>";
      });
    html += "</tbody></table></div></div>";

    // جدول الشهور الأخيرة
    if (months.length) {
      html +=
        '<div class="card"><h4 style="margin-bottom:12px">' +
        I18N.t("DASH_LAST_6_MONTHS") +

        "</th></tr></thead><tbody>";
      months.forEach(function (m) {
        html += "<tr><td>" + esc(m) + "</td><td>" + byMonth[m] + "</td></tr>";
      });
      html += "</tbody></table></div></div>";
    }

    return html;

  function renderShippingByCompanyReport() {
    var ships = _getShipData();
    var companies = APP.data.shippingCompanies || [];

    // تجميع حسب company_id أو company
    var byCompany = {};
    ships.forEach(function (s) {
      var coId = s.company_id || "";
      var co = coId
        ? companies.find(function (c) {
            return c.id === coId;
          })

      var key = co ? co.name : s.company || "غير محدد";
      if (!byCompany[key]) byCompany[key] = { count: 0, cost: 0, delivered: 0 };

      if (s.status === "تم التسليم") byCompany[key].delivered++;
    });

  function renderShippingDeliveryRateReport() {
    var ships = _getShipData();
    var total = ships.length;
    var delivered = ships.filter(function (s) {
      return s.status === "تم التسليم";
    }).length;
    var returned = ships.filter(function (s) {
      return s.status === "مرتجع";
    }).length;
    var inProgress = ships.filter(function (s) {
      return (
        ["في الطريق", "جاهز للشحن", "بانتظار الشحن"].indexOf(s.status) !== -1
      );
    }).length;
    var other = total - delivered - returned - inProgress;

    var delivRate = total ? Math.round((delivered / total) * 100) : 0;
    var returnRate = total ? Math.round((returned / total) * 100) : 0;

    // تحليل التأخير: الشحنات اللي فاتت expected_date بدون تسليم
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var late = ships.filter(function (s) {
      if (!s.expected_date || s.status === "تم التسليم" || s.status === "مرتجع")
        return false;
      var exp = new Date(s.expected_date);
      exp.setHours(0, 0, 0, 0);
      return exp < today;
    });

    var html = _renderPageHeader(
      "نسبة نجاح التسليم",
      "معدل التسليم في الموعد والمرتجعات",
      { bgIcon: "ti-circle-check", bgColor: "#ECFDF5", iconColor: "#065F46" },
      // [REPORTS-UNIFY] كان بدون زرار تصدير — دلوقتي موحّد.
      _exportBtn("تصدير", "_exportShippingDeliveryRate()"),
    );

    html +=
      '<div class="stat-grid" style="margin-bottom:20px">' +
      statCard(
        iconBadge("ti-truck", "#FEF2E0", "#9A3412"),
        "إجمالي الشحنات",
        total,
        "شحنة",
        "",
      ) +
      statCard(
        iconBadge("ti-circle-check", "#ECFDF5", "#10b981"),
        "تم التسليم",
        delivered,
        "(" + delivRate + "%)",
        "var(--success-soft)",
      ) +
      statCard(
        iconBadge("ti-arrow-back-up", "#FEE2E2", "#B91C1C"),
        "مرتجع",
        returned,
        "(" + returnRate + "%)",
        "var(--danger-soft)",
      ) +
      statCard(
        iconBadge("ti-clock-exclamation", "#FEF9C3", "#854D0E"),
        "متأخرة حالياً",
        late.length,
        "شحنة",
        "#FEF9C3",
      ) +
      "</div>";

    if (late.length > 0) {
      html +=
        '<div class="card" style="margin-bottom:20px;border-color:var(--warning)">';
      html +=
        '<h4 style="margin-bottom:12px;color:var(--warning)"><i class="ti ti-alert-triangle"></i> ' +
        I18N.t("SHIP_OVERDUE_DELIVERY") +
        "</h4>";
      html +=
        '<div class="table-wrap"><table><thead><tr><th>' +
        I18N.t("SHIP_NUMBER") +
        "</th><th>" +
        I18N.t("LBL_CUSTOMER") +
        "</th><th>" +
        I18N.t("SHIP_EXPECTED_DELIVERY") +
        "</th><th>" +
        I18N.t("LBL_STATUS") +
        "</th><th>" +
        I18N.t("SHIP_DRIVER") +
        "</th></tr></thead><tbody>";
      late.forEach(function (s) {
        html +=
          '<tr style="background:var(--warning-soft)">' +
          '<td><span class="mono" style="font-size:11px;color:var(--accent)">' +
          esc(s.id || "") +
          "</span></td>" +
          "<td><b>" +
          esc(s.customer || "—") +
          "</b></td>" +
          '<td style="color:var(--danger)">' +
          (s.expected_date ? fmtDate(s.expected_date) : "—") +
          "</td>" +
          "<td>" +
          shipStatusBadge(s.status || "") +
          "</td>" +
          "<td>" +
          esc(s.driver || "—") +
          "</td>" +
          "</tr>";
      });
      html += "</tbody></table></div></div>";
    }

    // ملخص الحالات
    html +=
      '<div class="card"><h4 style="margin-bottom:12px">' +
      I18N.t("SHIP_DISTRIBUTION") +
      "</h4>";
    html +=
      '<div class="table-wrap"><table><thead><tr><th>' +
      I18N.t("LBL_DESCRIPTION_STATEMENT") +
      "</th><th>" +
      I18N.t("LBL_COUNT") +
      "</th><th>" +
      I18N.t("LBL_PERCENTAGE") +
      "</th></tr></thead><tbody>";
    [
      { label: "تم التسليم", count: delivered, color: "var(--success)" },
      { label: "قيد التنفيذ", count: inProgress, color: "var(--primary)" },
      { label: "مرتجع", count: returned, color: "var(--danger)" },
      { label: "أخرى", count: other, color: "var(--text3)" },
    ].forEach(function (row) {
      var pct = total ? Math.round((row.count / total) * 100) : 0;
      html +=
        '<tr><td style="color:' +
        row.color +
        ';font-weight:600">' +
        esc(row.label) +
        "</td>" +
        "<td>" +
        row.count +
        "</td>" +
        '<td><div style="display:flex;align-items:center;gap:8px">' +
        '<div style="flex:1;background:var(--border);border-radius:4px;height:6px">' +
        '<div style="width:' +
        pct +
        "%;height:6px;background:" +
        row.color +
        ';border-radius:4px"></div></div>' +
        '<span style="font-size:12px;color:var(--text3)">' +
        pct +
        "%</span></div></td></tr>";
    });
    html += "</tbody></table></div></div>";
    return html;
  }

  window._exportShippingDeliveryRate = function () {
    var ships = _getShipData();
    var total = ships.length;
    var delivered = ships.filter(function (s) {
      return s.status === "تم التسليم";
    }).length;
    var returned = ships.filter(function (s) {
      return s.status === "مرتجع";
    }).length;
    var inProgress = ships.filter(function (s) {
      return (
        ["في الطريق", "جاهز للشحن", "بانتظار الشحن"].indexOf(s.status) !== -1
      );
    }).length;
    var other = total - delivered - returned - inProgress;
    var data = [
      { label: "تم التسليم", count: delivered },
      { label: "قيد التنفيذ", count: inProgress },
      { label: "مرتجع", count: returned },
      { label: "أخرى", count: other },
    ].map(function (row) {
      var pct = total ? Math.round((row.count / total) * 100) : 0;
      return [row.label, row.count, pct + "%"];
    });
    _exportTableToExcel(
      data,
      ["البيان", "العدد", "النسبة"],
      "نسبة_نجاح_التسليم",
    );
  };
</script>
