  // §WF-2  محرك تشغيل الـ Workflow
  // ─────────────────────────────────────────────────────────────
  var WA_WORKFLOW_ENGINE = (function () {
    /**
     * trigger — يُستدعى عند حدث معين في النظام
     * @param {string} triggerType — نوع الحدث (new_invoice, order_shipped...)
     * @param {object} data — بيانات الحدث (customerId, invoiceId...)
     */
    function trigger(triggerType, data) {
      if (!canDo("useWhatsappAutoReply")) return;

      // [WF-EXEC-2026] كانت APP.data.waWorkflows تُملأ فقط عند فتح شاشة إدارة
      // الـ Workflows (WA_WF_UI) — يعني أي trigger() بيتنادى قبل ما المستخدم
      // يفتح الشاشة دي ولا مرة كان بيلاقي دايمًا [] ومفيش تنفيذ إطلاقاً.
      // نضمن هنا تحميلها مرة واحدة (وتخزينها مؤقتًا) قبل أي تنفيذ فعلي.
      if (APP.data && APP.data.waWorkflows) {
        _runTrigger(triggerType, data);
        return;
      }
      _gsr("getWAWorkflows", [APP.currentUser.username, SESSION.token], {
        label: "WA.getWAWorkflows(lazy)",
        onSuccess: function (result) {
          APP.data.waWorkflows = (result && result.data) || [];
          _runTrigger(triggerType, data);
        },
        onError: function () {
          APP.data.waWorkflows = APP.data.waWorkflows || [];
        },
      });
    }

    function _runTrigger(triggerType, data) {
      // جلب الـ Workflows الفعّالة لهذا الـ trigger
      var workflows = _getActiveWorkflowsByTrigger(triggerType);
      if (!workflows || workflows.length === 0) return;

      workflows.forEach(function (wf) {
        _executeWorkflow(wf, data);
      });
    }

    function _getActiveWorkflowsByTrigger(triggerType) {
      // من APP.data.waWorkflows لو محمّلة
      var all = APP.data && APP.data.waWorkflows ? APP.data.waWorkflows : [];
      return all.filter(function (wf) {
        return (
          wf.is_active === true &&
          String(wf.trigger_type) === String(triggerType)
        );
      });
    }

    function _executeWorkflow(workflow, data) {
      var actions = [];
      try {
        actions = JSON.parse(workflow.actions || "[]");
      } catch (e) {
        return;
      }

      var phone = _resolvePhone(data);
      if (!phone) return; // لا يوجد رقم هاتف → لا نرسل

      actions.forEach(function (action) {
        _executeAction(action, data, phone, workflow);
      });
    }

    function _resolvePhone(data) {
      if (!data) return null;
      if (data.phone) return WA_PHONE.normalize(data.phone);
      if (data.customer_phone) return WA_PHONE.normalize(data.customer_phone);
      // البحث في Parties
      if (data.customer_id && APP.data && APP.data.parties) {
        var party = APP.data.parties.find(function (p) {
          return String(p.id) === String(data.customer_id);
        });
        if (party) return WA_PHONE.normalize(party.phone || party.mobile || "");
      }
      return null;
    }

    function _findConversationByPhone(phone, cb) {
      if (!phone) return cb(null);
      _gsr(
        "getWAConversations",
        [APP.currentUser.username, { search: phone, limit: 1 }, SESSION.token],
        {
          label: "WA.getWAConversations(workflow-lookup)",
          onSuccess: function (result) {
            var list = (result && result.data) || [];
            cb(list.length ? list[0] : null);
          },
          onError: function () {
            cb(null);
          },
        },
      );
    }

    function _executeAction(action, data, phone, workflow) {
      var message = "";

      switch (action.type) {
        case "send_text":
          message = _resolvePlaceholders(action.content || "", data);
          break;
        case "send_template":
          var tpl = WA_TPL.find(action.template_code);
          if (tpl) message = WA_TPL.resolve(tpl.body, data);
          break;
        case "send_statement":
          // فتح modal إرسال كشف الحساب
          if (typeof WA_MODAL !== "undefined") {
            WA_MODAL.open({
              phone: phone,
              templateCode: "account_statement",
              customerId: data.customer_id,
            });
          }
          return;
        case "send_catalog":
          if (typeof sendCatalogShareLink === "function") {
            sendCatalogShareLink(
              data.customer_name,
              window.location.origin + "/catalog",
              data.customer_id,
            );
          }
          return;
        case "notify_internal":
          var msg = _resolvePlaceholders(
            action.content || "تنبيه workflow: " + workflow.name,
            data,
          );
          if (typeof NS !== "undefined" && NS.push) {
            NS.push({ type: "info", message: msg });
          }
          return;
        case "assign_agent":
        case "add_tag":
          // [WF-EXEC-2026] الإجراءان دول بيعدّلوا محادثة CommHub (assigned_to
          // / labels)، فمحتاجين conversation_id فعلي — لو العميل ماعندوش
          // محادثة واتساب موجودة بالفعل (لسه مبعتش رسالة) بنتجاهل بهدوء بدل
          // ما نعمل محادثة وهمية بس عشان تاج/تعيين.
          _findConversationByPhone(phone, function (conv) {
            if (!conv) return;
            var fields =
              action.type === "assign_agent"
                ? { assigned_to: action.agent || "" }
                : {
                    labels: (
                      (conv.labels ? conv.labels + "," : "") +
                      (action.tag || "")
                    )
                      .split(",")
                      .filter(Boolean)
                      .filter(function (v, i, arr) {
                        return arr.indexOf(v) === i;
                      })
                      .join(","),
                  };
            _gsr(
              "updateCommHubConversation",
              [APP.currentUser.username, conv.conversation_id, fields, SESSION.token],
              { label: "WA.updateCommHubConversation(workflow)" },
            );
          });
          return;
        case "send_invoice_pdf":
        case "send_payment_link":
          // [WF-EXEC-2026] مفيش مولّد PDF فواتير أو روابط دفع فعلي في النظام
          // حاليًا (راجع ملاحظات المرحلة 3) — بدل ما الإجراء يختفي بصمت،
          // نحوّله لتنبيه داخلي للموظف المسؤول بدل تنفيذ وهمي.
          if (typeof NS !== "undefined" && NS.push) {
            NS.push({
              type: "warning",
              message:
                "Workflow «" +
                workflow.name +
                "»: إجراء «" +
                (action.type === "send_invoice_pdf"
                  ? "إرسال فاتورة PDF"
                  : "إرسال رابط الدفع") +
                "» غير مفعّل بعد — يحتاج إرسال يدوي للعميل " +
                (data.customer_name || phone),
            });
          }
          return;
        default:
          return;
      }

      if (!message) return;

      // إرسال عبر WA_PROVIDER
      WA_PROVIDER.send(phone, message, {
        source_type: "workflow",
        source_id: workflow.id,
        customer_id: data.customer_id || "",
        customer_name: data.customer_name || "",
        template_name: action.template_code || workflow.name,
      });
    }

    function _resolvePlaceholders(text, data) {
      var d = data || {};
      return text
        .replace(/{customer_name}/g, d.customer_name || "العميل")
        .replace(
          /{amount}/g,
          d.amount ? formatMoney(d.amount, { decimals: 0 }) : "",
        )
        .replace(/{invoice_id}/g, d.invoice_id || d.id || "")
        .replace(/{order_id}/g, d.order_id || d.id || "")
        .replace(/{date}/g, d.date || fmtDate(new Date()))
        .replace(/{due_date}/g, d.due_date || "")
        .replace(
          /{balance}/g,
          d.balance ? formatMoney(d.balance, { decimals: 0 }) : "",
        )
        .replace(
          /{company_name}/g,
          (APP.companySettings && APP.companySettings.company_name) || "",
        );
    }

    return { trigger: trigger };
  })();

  // ─────────────────────────────────────────────────────────────
  // §WF-3  شاشة إدارة الـ Workflows
  // ─────────────────────────────────────────────────────────────
  function renderWhatsappWorkflowsPage() {
    if (!canDo("manageWhatsappWorkflows")) {
      return (
        '<div style="padding:40px;text-align:center;color:var(--text3)">' +
        '<i class="ti ti-lock" style="font-size:40px;display:block;margin-bottom:12px"></i>' +
        "<p>ليس لديك صلاحية إدارة الأتمتة</p></div>"
      );
    }

    var workflows =
      APP.data && APP.data.waWorkflows ? APP.data.waWorkflows : [];

    return (
      '<div class="wa-workflows-page">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">' +
      "<div>" +
      '<h3 style="margin:0;font-size:16px;font-weight:700">أتمتة واتساب (Workflows)</h3>' +
      '<p style="margin:4px 0 0;font-size:12px;color:var(--text3)">أنشئ قواعد إرسال تلقائي مرتبطة بأحداث النظام</p>' +
      "</div>" +
      '<button class="btn-primary" onclick="WA_WF_UI.newWorkflow()" style="gap:6px;display:flex;align-items:center">' +
      '<i class="ti ti-plus"></i> Workflow جديد' +
      "</button>" +
      "</div>" +
      // قائمة الـ Workflows
      '<div id="wa-workflows-list">' +
      (workflows.length === 0
        ? _renderEmptyWorkflows()
        : workflows.map(_renderWorkflowCard).join("")) +
      "</div>" +
      "</div>"
    );
  }

  function _renderEmptyWorkflows() {
    return (
      '<div style="text-align:center;padding:40px 20px;color:var(--text3)">' +
      '<i class="ti ti-settings-automation" style="font-size:48px;display:block;margin-bottom:16px;opacity:0.3"></i>' +
      '<p style="font-size:14px;font-weight:600;margin:0 0 8px">لا توجد Workflows بعد</p>' +
      '<p style="font-size:13px;margin:0 0 20px">أنشئ أول Workflow لأتمتة رسائل واتساب</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:500px;margin:0 auto">' +
      _quickTemplates()
        .map(function (t) {
          return (
            '<button class="wa-workflow-quick-btn" onclick="WA_WF_UI.newWorkflowFromTemplate(\'' +
            t.id +
            "')\">" +
            '<i class="ti ' +
            t.icon +
            '"></i> ' +
            t.label +
            "</button>"
          );
        })
        .join("") +
      "</div>" +
      "</div>"
    );
  }

  function _quickTemplates() {
    return [
      { id: "welcome", label: "رسالة ترحيب", icon: "ti-hand-finger" },
      { id: "invoice", label: "إرسال فاتورة", icon: "ti-file-invoice" },
      { id: "payment_due", label: "تذكير بالسداد", icon: "ti-cash" },
      { id: "shipped", label: "إشعار شحن", icon: "ti-truck" },
      { id: "delivered", label: "إشعار استلام", icon: "ti-package-import" },
    ];
  }

  function _renderWorkflowCard(wf) {
    var triggerTypes = WA_WORKFLOW_TYPES.triggers;
    var trigger = triggerTypes.find(function (t) {
      return t.id === wf.trigger_type;
    }) || { label: wf.trigger_type, icon: "ti-bolt" };

    var actions = [];
    try {
      actions = JSON.parse(wf.actions || "[]");
    } catch (e) {}

    return (
      '<div class="wa-workflow-card ' +
      (wf.is_active ? "active" : "inactive") +
      '">' +
      '<div class="wa-workflow-card-header">' +
      '<div style="display:flex;align-items:center;gap:10px">' +
      '<div class="wa-workflow-icon ' +
      (wf.is_active ? "" : "inactive") +
      '">' +
      '<i class="ti ' +
      trigger.icon +
      '"></i>' +
      "</div>" +
      "<div>" +
      '<div style="font-weight:700;font-size:14px">' +
      esc(wf.name || "") +
      "</div>" +
      '<div style="font-size:12px;color:var(--text3)">عند: ' +
      trigger.label +
      "</div>" +
      "</div>" +
      "</div>" +
      '<div style="display:flex;align-items:center;gap:8px">' +
      '<label class="toggle-switch" title="' +
      (wf.is_active ? "تعطيل" : "تفعيل") +
      '">' +
      '<input type="checkbox" ' +
      (wf.is_active ? "checked" : "") +
      " onchange=\"WA_WF_UI.toggleWorkflow('" +
      esc(wf.id) +
      "', this.checked)\">" +
      '<span class="toggle-slider"></span></label>' +
      (wf.trigger_type === "manual"
        ? "<button onclick=\"WA_WF_UI.runManual('" +
          esc(wf.id) +
          '\')" class="wa-center-action-btn" title="تشغيل الآن على عميل معيّن"><i class="ti ti-player-play"></i></button>'
        : "") +
      "<button onclick=\"WA_WF_UI.editWorkflow('" +
      esc(wf.id) +
      '\')" class="wa-center-action-btn" title="تعديل"><i class="ti ti-edit"></i></button>' +
      "<button onclick=\"WA_WF_UI.deleteWorkflow('" +
      esc(wf.id) +
      '\')" class="wa-center-action-btn wa-center-danger-btn" title="حذف"><i class="ti ti-trash"></i></button>' +
      "</div>" +
      "</div>" +
      '<div class="wa-workflow-actions-list">' +
      actions
        .map(function (a) {
          var actionType = WA_WORKFLOW_TYPES.actions.find(function (t) {
            return t.id === a.type;
          }) || { label: a.type, icon: "ti-bolt" };
          return (
            '<span class="wa-action-chip"><i class="ti ' +
            actionType.icon +
            '"></i> ' +
            actionType.label +
            "</span>"
          );
        })
        .join("") +
      "</div>" +
      (wf.last_run
        ? '<div style="font-size:11px;color:var(--text3);padding:0 14px 10px">آخر تشغيل: ' +
          fmtDateTime(wf.last_run) +
          "</div>"
        : "") +
      "</div>"
    );
  }

  // ─────────────────────────────────────────────────────────────
  // §WF-4  واجهة مستخدم الـ Workflows
  // ─────────────────────────────────────────────────────────────
  var WA_WF_UI = (function () {
    var _editingId = null;

    function newWorkflow() {
      _openEditor(null);
    }

    function newWorkflowFromTemplate(templateId) {
      var templates = {
        welcome: {
          name: "رسالة ترحيب للعملاء الجدد",
          trigger_type: "manual",
          actions: JSON.stringify([
            {
              type: "send_text",
              content:
                "أهلاً وسهلاً {customer_name}! \nيسعدنا انضمامك لعائلة {company_name}.\nنحن هنا دائماً لخدمتك.",
            },
          ]),
        },
        invoice: {
          name: "إرسال فاتورة تلقائياً",
          trigger_type: "new_invoice",
          actions: JSON.stringify([
            { type: "send_template", template_code: "invoice_created" },
          ]),
        },
        payment_due: {
          name: "تذكير بسداد المستحقات",
          trigger_type: "invoice_overdue",
          actions: JSON.stringify([
            {
              type: "send_text",
              content:
                "تذكير: يوجد مستحقات بقيمة {balance} متأخرة على حسابك.\nيرجى السداد في أقرب وقت. ",
            },
          ]),
        },
        shipped: {
          name: "إشعار شحن الطلب",
          trigger_type: "order_shipped",
          actions: JSON.stringify([
            {
              type: "send_text",
              content:
                "طلبك رقم {order_id} في الطريق إليك! \nموعد التسليم المتوقع: {due_date}",
            },
          ]),
        },
        delivered: {
          name: "تأكيد استلام الطلب",
          trigger_type: "order_delivered",
          actions: JSON.stringify([
            {
              type: "send_text",
              content:
                "شكراً {customer_name}! \nتم استلام طلبك بنجاح.\nنتمنى أن تكون راضياً عن خدمتنا.",
            },
          ]),
        },
      };

      var tpl = templates[templateId];
      if (tpl) _openEditor(null, tpl);
    }

    function editWorkflow(id) {
      var workflows =
        APP.data && APP.data.waWorkflows ? APP.data.waWorkflows : [];
      var wf = workflows.find(function (w) {
        return String(w.id) === String(id);
      });
      if (wf) _openEditor(id, wf);
    }

    function _openEditor(id, prefill) {
      _editingId = id;
      var pf = prefill || {};
      var triggerOptions = WA_WORKFLOW_TYPES.triggers
        .map(function (t) {
          return (
            '<option value="' +
            t.id +
            '" ' +
            (pf.trigger_type === t.id ? "selected" : "") +
            ">" +
            t.label +
            "</option>"
          );
        })
        .join("");

      var actions = [];
      try {
        actions = JSON.parse(pf.actions || "[]");
      } catch (e) {}

      var html =
        '<div style="padding:4px 0">' +
        '<div class="form-group">' +
        '<label class="form-label">اسم الـ Workflow</label>' +
        '<input type="text" id="wf-name" class="form-input" value="' +
        esc(pf.name || "") +
        '" placeholder="مثال: تذكير بالسداد">' +
        "</div>" +
        '<div class="form-group">' +
        '<label class="form-label">حدث التشغيل (Trigger)</label>' +
        '<select id="wf-trigger" class="form-input"><option value="">اختر...</option>' +
        triggerOptions +
        "</select>" +
        "</div>" +
        '<div class="form-group">' +
        '<label class="form-label">الإجراءات (Actions)</label>' +
        '<div id="wf-actions-list">' +
        (actions.length > 0
          ? actions
              .map(function (a, idx) {
                return _renderActionRow(a, idx);
              })
              .join("")
          : '<div style="color:var(--text3);font-size:13px;padding:8px 0">لا توجد إجراءات. أضف إجراءً من الزر أدناه.</div>') +
        "</div>" +
        '<button onclick="WA_WF_UI.addAction()" class="btn-secondary" style="margin-top:8px;gap:6px;display:flex;align-items:center">' +
        '<i class="ti ti-plus"></i> إضافة إجراء' +
        "</button>" +
        "</div>" +
        '<div class="form-group">' +
        '<label class="form-label">الحالة</label>' +
        '<label class="toggle-switch"><input type="checkbox" id="wf-active" ' +
        (pf.is_active !== false ? "checked" : "") +
        '><span class="toggle-slider"></span></label>' +
        "</div>" +
        '<div style="display:flex;gap:10px;margin-top:16px">' +
        '<button class="btn-primary" onclick="WA_WF_UI.saveWorkflow()" style="flex:1">حفظ الـ Workflow</button>' +
        '<button class="btn-secondary" onclick="closeDrawer()">إلغاء</button>' +
        "</div>" +
        "</div>";

      openStyledDrawer({
        title: id ? "تعديل Workflow" : "Workflow جديد",
        icon: "ti-settings-automation",
        color: "#6366f1",
        width: "560px",
        content: html,
      });
    }

    function _renderActionRow(action, idx) {
      var actionOptions = WA_WORKFLOW_TYPES.actions
        .map(function (a) {
          return (
            '<option value="' +
            a.id +
            '" ' +
            (action.type === a.id ? "selected" : "") +
            ">" +
            a.label +
            "</option>"
          );
        })
        .join("");

      return (
        '<div class="wa-action-row" id="wf-action-' +
        idx +
        '">' +
        '<select class="form-input" style="width:160px;flex-shrink:0" onchange="WA_WF_UI.onActionTypeChange(' +
        idx +
        ', this.value)">' +
        '<option value="">اختر إجراء...</option>' +
        actionOptions +
        "</select>" +
        '<input type="text" class="form-input" style="flex:1" placeholder="محتوى الرسالة أو كود القالب" ' +
        'value="' +
        esc(action.content || action.template_code || "") +
        '" ' +
        'id="wf-action-content-' +
        idx +
        '">' +
        '<button onclick="WA_WF_UI.removeAction(' +
        idx +
        ')" class="wa-center-action-btn wa-center-danger-btn">' +
        '<i class="ti ti-x"></i></button>' +
        "</div>"
      );
    }

    function addAction() {
      var list = document.getElementById("wf-actions-list");
      if (!list) return;
      var idx = list.children.length;
      list.insertAdjacentHTML("beforeend", _renderActionRow({}, idx));
    }

    function removeAction(idx) {
      var el = document.getElementById("wf-action-" + idx);
      if (el) el.remove();
    }

    function onActionTypeChange(idx, type) {
      var contentInput = document.getElementById("wf-action-content-" + idx);
      if (!contentInput) return;
      var actionDef = WA_WORKFLOW_TYPES.actions.find(function (a) {
        return a.id === type;
      });
      if (actionDef && actionDef.requiresTemplate) {
        contentInput.placeholder = "كود القالب (مثال: invoice_created)";
      } else {
        contentInput.placeholder =
          "نص الرسالة — يمكن استخدام {customer_name} {amount} إلخ";
      }
    }

    function saveWorkflow() {
      var name = document.getElementById("wf-name");
      var trigger = document.getElementById("wf-trigger");
      var active = document.getElementById("wf-active");

      if (!name || !name.value.trim())
        return NotificationEngine.error("اسم الـ Workflow مطلوب");
      if (!trigger || !trigger.value)
        return NotificationEngine.error("يجب اختيار حدث التشغيل");

      // تجميع الإجراءات
      var actions = [];
      var rows = document.querySelectorAll(".wa-action-row");
      rows.forEach(function (row, idx) {
        var typeSelect = row.querySelector("select");
        var contentInput = document.getElementById("wf-action-content-" + idx);
        if (typeSelect && typeSelect.value) {
          var a = { type: typeSelect.value };
          if (contentInput && contentInput.value.trim()) {
            var actionDef = WA_WORKFLOW_TYPES.actions.find(function (x) {
              return x.id === a.type;
            });
            if (actionDef && actionDef.requiresTemplate) {
              a.template_code = contentInput.value.trim();
            } else {
              a.content = contentInput.value.trim();
            }
          }
          actions.push(a);
        }
      });

      var wfData = {
        id: _editingId || "WF_" + Date.now(),
        name: name.value.trim(),
        trigger_type: trigger.value,
        actions: JSON.stringify(actions),
        is_active: active ? active.checked : true,
        created_by: APP.currentUser.username,
      };

      // حفظ في Backend
      _gsr(
        "saveWAWorkflow",
        [APP.currentUser.username, wfData, SESSION.token],
        {
          onSuccess: function () {
            NotificationEngine.success("تم حفظ الـ Workflow");
            closeDrawer();
            // تحديث القائمة
            if (!APP.data.waWorkflows) APP.data.waWorkflows = [];
            var idx = APP.data.waWorkflows.findIndex(function (w) {
              return String(w.id) === String(wfData.id);
            });
            if (idx >= 0) APP.data.waWorkflows[idx] = wfData;
            else APP.data.waWorkflows.push(wfData);
            // إعادة render الشاشة
            var listEl = document.getElementById("wa-workflows-list");
            if (listEl) {
              var wfs = APP.data.waWorkflows || [];
              listEl.innerHTML =
                wfs.length === 0
                  ? _renderEmptyWorkflows()
                  : wfs.map(_renderWorkflowCard).join("");
            }
          },
          onError: function () {
            NotificationEngine.error("فشل الحفظ");
          },
        },
      );
    }

    function toggleWorkflow(id, active) {
      var workflows =
        APP.data && APP.data.waWorkflows ? APP.data.waWorkflows : [];
      var wf = workflows.find(function (w) {
        return String(w.id) === String(id);
      });
      if (!wf) return;
      wf.is_active = active;
      _gsr("saveWAWorkflow", [APP.currentUser.username, wf, SESSION.token], {
        onSuccess: function () {
          NotificationEngine.success(active ? "تم تفعيل الـ Workflow" : "تم تعطيل الـ Workflow");
        },
      });
    }

    function deleteWorkflow(id) {
      confirmDelete(
        "حذف Workflow",
        "هل تريد حذف هذا الـ Workflow؟",
        function () {
          _gsr(
            "deleteWAWorkflow",
            [id, APP.currentUser.username, SESSION.token],
            {
              label: "WA.deleteWAWorkflow",
              onSuccess: function () {
                if (APP.data && APP.data.waWorkflows) {
                  APP.data.waWorkflows = APP.data.waWorkflows.filter(
                    function (w) {
                      return String(w.id) !== String(id);
                    },
                  );
                }
                var listEl = document.getElementById("wa-workflows-list");
                if (listEl) {
                  var wfs = APP.data.waWorkflows || [];
                  listEl.innerHTML =
                    wfs.length === 0
                      ? _renderEmptyWorkflows()
                      : wfs.map(_renderWorkflowCard).join("");
                }
                NotificationEngine.success("تم حذف الـ Workflow");
              },
              onError: function (result) {
                NotificationEngine.error(result.message || "فشل حذف الـ Workflow");
              },
            },
          );
        },
      );
    }

    // [WF-EXEC-2026] تشغيل يدوي لـ Workflow نوعه "manual" على عميل معيّن.
    // بيدوّر على العميل بالاسم أو الهاتف من APP.data.customers، ولو مش لاقي
    // ولا واحد مطابق بيقبل الإدخال كرقم هاتف مباشر.
    function runManual(id) {
      var q = prompt("اسم العميل أو رقم الهاتف اللي هتشغّل عليه الـ Workflow:");
      if (!q) return;
      q = q.trim();
      var customer = (APP.data.customers || []).find(function (c) {
        return (
          c.name === q ||
          c.phone === q ||
          c.mobile === q ||
          String(c.id) === q
        );
      });
      var phone = customer
        ? customer.phone || customer.mobile || ""
        : q.replace(/[^0-9+]/g, "").length >= 8
          ? q
          : "";
      if (!phone) {
        NotificationEngine.error(
          "محتاج رقم هاتف صحيح — اكتب الرقم مباشرة أو اسم عميل مسجّل برقم هاتف",
        );
        return;
      }
      WA_WORKFLOW_ENGINE.trigger("manual", {
        customer_id: customer ? customer.id : "",
        customer_name: customer ? customer.name : q,
        phone: phone,
      });
      NotificationEngine.success("جاري التشغيل...");
    }

    return {
      newWorkflow: newWorkflow,
      newWorkflowFromTemplate: newWorkflowFromTemplate,
      editWorkflow: editWorkflow,
      saveWorkflow: saveWorkflow,
      toggleWorkflow: toggleWorkflow,
      deleteWorkflow: deleteWorkflow,
      runManual: runManual,
      addAction: addAction,
      removeAction: removeAction,
      onActionTypeChange: onActionTypeChange,
    };
  })();

  function bindWhatsappWorkflowsPage() {
    // [FIX-AUDIT-2026] كانت قائمة الـ Workflows تعتمد فقط على APP.data.waWorkflows
    // في الذاكرة، فتختفي بمجرد تحديث الصفحة. الآن نجلبها من الباك اند عند فتح
    // الدرج مباشرة.
    var listEl = document.getElementById("wa-workflows-list");
    if (listEl) {
      listEl.innerHTML =
        '<p style="color:var(--text3);text-align:center;padding:20px">' +
        I18N.t("MSG_LOADING_ELLIPSIS") +
        "</p>";
    }
    _gsr("getWAWorkflows", [APP.currentUser.username, SESSION.token], {
      label: "WA.getWAWorkflows",
      onSuccess: function (result) {
        APP.data.waWorkflows = result.data || [];
        var el = document.getElementById("wa-workflows-list");
        if (el) {
          var wfs = APP.data.waWorkflows;
          el.innerHTML =
            wfs.length === 0
              ? _renderEmptyWorkflows()
              : wfs.map(_renderWorkflowCard).join("");
        }
      },
      onError: function (result) {
        if (listEl)
          listEl.innerHTML =
            '<p style="color:var(--danger);text-align:center;padding:20px">' +
            (result.message || "فشل تحميل قواعد الأتمتة") +
            "</p>";
      },
    });
  }
</script>
