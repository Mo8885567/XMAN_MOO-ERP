<script>
  // ════════════════════════════════════════════════════════════════════════
  //  20_JS_ContextMenu.html — [CTX-ENGINE-REBUILD 2026-07-16]
  //  محرك موحّد واحد لقوائم السياق (كليك يمين) على مستوى النظام بالكامل.
  //
  // ملاحظة تاريخية مهمة: هذا الملف كان يحتوي فعليًا على نسخة طبق الأصل
  //  من Code_20_Sales.js (نفس كل الدوال حرفيًا: getSaleInvoices,
  //  addSaleInvoice, getCustomers... إلخ) — محتوى سيرفر-سايد اتحط غلط في
  //  ملف بالاسم ده، وبدون أي وسم إحاطة سكريبت حوله، يعني كان بيتقرا من
  //  القرص في كل تحميل صفحة (lazyScriptFiles) لكن بيترجع فاضي تمامًا (لأن
  //  آلية التحميل بتستخرج محتوى وسم السكريبت فقط عبر Regex) — أي إهدار
  //  كامل بدون أي فايدة. المحتوى الحقيقي محفوظ فعلاً وسليم في
  //  Code_20_Sales.js (تم التأكد بالمقارنة الحرفية الكاملة، صفر فروق)
  //  فمفيش أي داتا أو منطق اتفقد بحذفه من هنا.
  //
  // تحذير لأي تعديل مستقبلي على هذا الملف: ممنوع كتابة النص الحرفي
  //  لوسم فتح/قفل السكريبت جوه أي تعليق بالملف ده — لأن دالة الاستخراج في
  //  Code_12_Core.js بتستخدم Regex غير-جشع (non-greedy) بيوقف عند أول
  //  تطابق قفل يلاقيه، حتى لو جوه تعليق نصي، فبيقطع الملف الفعلي منتصف
  //  الطريق (زي بالظبط الغلطة اللي كسرت الملف ده قبل كده). لو محتاج تتكلم
  //  عن الوسم في تعليق، استخدم عبارة "وسم السكريبت" بدل كتابته حرفيًا.
  //
  //  الأخطر: window.CTX نفسه — الكائن اللي عشرات الشاشات بتنادي عليه فعليًا
  //  (CTX.register(...)) عبر النمط الموحّد:
  //      if (window.CTX) CTX.register(container, "menuType");
  //  — كان غير معرَّف في المشروع كله. الاستدعاء موحّد بالفعل من زمان
  //  (وده حاجة كويسة)، لكن المحرك نفسه ضاع في مكان ما أثناء إعادة الهيكلة
  //  ومحدش لاحظ لأن الـ guard (if (window.CTX)) بيرجع بصمت من غير أي
  //  Error — يعني كل قوائم كليك يمين (تعديل/حذف/...) في كل الشاشات اللي
  //  فيها [CTX-REFACTOR] كانت مش شغالة خالص.
  //
  //  هذا الملف الآن هو التعريف الحقيقي الوحيد للمحرك + كل تعريفات القوائم
  //  (CTX_DEFINITIONS) لكل الشاشات اللي بتعتمد عليه. بُنيت التعريفات من
  //  خلال فحص كل نقطة CTX.register / contextMenuType في المشروع، ومطابقة
  //  الأزرار المتوقعة بدوال التعديل/الحذف/... الفعلية الموجودة أصلاً بكل
  //  شاشة (كتير منها كان جاهز فعلاً بنمط window.ctx_* في الحسابات والموارد
  //  البشرية والإنتاج والفواتير وسجل الواتساب — كأنها كانت بتستنى المحرك).
  // ════════════════════════════════════════════════════════════════════════

  // ── الأنماط (CSS) — نفس لغة تصميم ce-colctx-menu في 34_JS_ColumnEngine.html
  //    (نفس الـ CSS variables ونفس التفاصيل البصرية) عشان قائمة الصفوف
  //    وقائمة رأس العمود يبقوا متسقين شكليًا تمامًا. حقن مرة واحدة فقط. ──
  (function () {
    if (document.getElementById("ctx-engine-css")) return;
    var css = [
      ".ctx-menu{position:fixed;z-index:9999;background:var(--surface);",
      "border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);",
      "padding:6px;min-width:210px;max-height:80vh;overflow:auto;font-size:12.5px}",
      ".ctx-item{display:flex;align-items:center;gap:8px;padding:8px 10px;",
      "border-radius:8px;cursor:pointer;color:var(--text)}",
      ".ctx-item:hover{background:var(--surface2)}",
      ".ctx-item i{font-size:15px;width:16px;text-align:center;color:var(--text3)}",
      ".ctx-item.danger i,.ctx-item.danger span{color:var(--danger-dark,#dc2626)}",
      ".ctx-item.danger:hover{background:var(--danger-soft,#fef2f2)}",
      ".ctx-item.disabled{opacity:.4;pointer-events:none}",
      ".ctx-sep{height:1px;background:var(--border);margin:5px 2px}",
      ".ctx-sub{padding:6px 10px;font-size:11px;color:var(--text3);font-weight:700}",
    ].join("");
    var s = document.createElement("style");
    s.id = "ctx-engine-css";
    s.textContent = css;
    document.head.appendChild(s);
  })();

  // ── [CTX-GLOBAL-BLOCK] منع قائمة المتصفح الافتراضية في كل صفحات
  //    النظام (وليس بس داخل الجداول المسجّلة عبر CTX.register) — طلب
  //    صريح: "لا يسمح بظهور قائمة المتصفح داخل النظام" بشكل كامل.
  //    الاستثناء الوحيد: حقول الكتابة (input/textarea/contenteditable)
  //    عشان المستخدم يقدر يستخدم قص/نسخ/لصق والتدقيق الإملائي الأصلي
  //    من غير ما تتأثر تجربة الكتابة العادية.
  (function () {
    if (window.__CTX_GLOBAL_BLOCK__) return;
    window.__CTX_GLOBAL_BLOCK__ = true;
    var EDITABLE_SELECTOR =
      "input, textarea, select, [contenteditable=''], " +
      "[contenteditable='true'], .ql-editor, [data-allow-native-menu]";
    document.addEventListener(
      "contextmenu",
      function (e) {
        var el = e.target;
        var isEditable =
          el && el.closest && el.closest(EDITABLE_SELECTOR);
        if (isEditable) return; // سيب القائمة الأصلية شغالة جوه حقول الكتابة
        e.preventDefault();
      },
      false,
    );
  })();

  // ── المحرك (Engine) ───────────────────────────────────────────────────
  var CTX = (function () {
    var _definitions = {}; // menuType -> Array<item|sep>
    var _menuEl = null;
    var LONG_PRESS_MS = 550; // دعم الموبايل: ضغط مطوّل بدل كليك يمين

    function _closeOnce(e) {
      if (e.target && e.target.closest && e.target.closest(".ctx-menu")) return;
      close();
    }

    function close() {
      if (_menuEl) {
        _menuEl.remove();
        _menuEl = null;
      }
      document.removeEventListener("click", _closeOnce);
      document.removeEventListener("contextmenu", _closeOnce);
    }

    // بيحوّل أي data-* موجودة على عنصر الصف لكائن JS (camelCase)، ودايمًا
    // بيضمن وجود id. لو الشاشة محتاجة بيانات إضافية (زي partyType) مش
    // موجودة كـ data-attribute، تقدر تمرر extractor خاص بيها في register().
    function _defaultExtract(rowEl) {
      var data = {};
      var attrs = rowEl.attributes;
      for (var i = 0; i < attrs.length; i++) {
        var name = attrs[i].name;
        if (name.indexOf("data-") !== 0) continue;
        var key = name.slice(5).replace(/-([a-z0-9])/g, function (_, c) {
          return c.toUpperCase();
        });
        data[key] = attrs[i].value;
      }
      if (!data.id) data.id = rowEl.getAttribute("data-id") || "";
      return data;
    }

    function open(menuType, rowData, x, y) {
      close();
      var defs = _definitions[menuType];
      if (!defs || !defs.length) return;

      var visible = [];
      var html = "";
      defs.forEach(function (def) {
        if (def.sep) {
          if (visible.length) html += '<div class="ctx-sep"></div>';
          return;
        }
        if (typeof def.showIf === "function" && !def.showIf(rowData)) return;
        // [CTX-PERM] دعم موحّد لفلترة العنصر حسب صلاحية المستخدم — أي
        // تعريف عنصر يقدر يضيف perm: "keyName" (نفس مفاتيح canDo()
        // المستخدمة في باقي النظام) بدل ما يكتب showIf يدوي في كل مرة.
        // العنصر يتخفي تلقائيًا لو المستخدم مالوش الصلاحية دي.
        if (
          def.perm &&
          typeof canDo === "function" &&
          !canDo(def.perm)
        )
          return;
        var label =
          typeof def.label === "function" ? def.label(rowData) : def.label;
        visible.push(def);
        html +=
          '<div class="ctx-item' +
          (def.danger ? " danger" : "") +
          '" data-idx="' +
          (visible.length - 1) +
          '"><i class="ti ' +
          def.icon +
          '"></i><span>' +
          label +
          "</span></div>";
      });
      if (!visible.length) return;

      var menu = document.createElement("div");
      menu.className = "ctx-menu";
      menu.innerHTML = html;
      document.body.appendChild(menu);

      // منع خروج القائمة برة حدود الشاشة (نفس منطق ColumnEngine بالظبط)
      var mw = menu.offsetWidth,
        mh = menu.offsetHeight;
      var left = Math.min(x, window.innerWidth - mw - 8);
      var top = Math.min(y, window.innerHeight - mh - 8);
      menu.style.left = Math.max(8, left) + "px";
      menu.style.top = Math.max(8, top) + "px";

      menu.querySelectorAll(".ctx-item").forEach(function (el) {
        el.addEventListener("click", function () {
          var idx = Number(el.getAttribute("data-idx"));
          var def = visible[idx];
          close();
          if (!def || typeof def.handler !== "function") return;
          try {
            def.handler(rowData.id, rowData);
          } catch (err) {
            console.error("[CTX] handler error:", menuType, err);
            // [FIX-SILENT-CTX] قبل كده المستخدم كان بيدوس على إجراء (تعديل/حذف/
            // أي أمر من القائمة) وبيتقفل القائمة من غير أي رد فعل لو الدالة
            // فشلت — يبان وكأن الضغطة "ماحصلتش" بلا أي تفسير. دلوقتي بنعرض
            // توست خطأ عام لو نظام الإشعارات متاح.
            if (typeof showToast === "function") {
              NotificationEngine.error(" تعذّر تنفيذ هذا الإجراء");
            }
          }
        });
      });

      _menuEl = menu;
      setTimeout(function () {
        document.addEventListener("click", _closeOnce);
      }, 0);
    }

    // container: العنصر الحاوي للصفوف (tbody / div الجدول)
    // menuType: مفتاح CTX_DEFINITIONS
    // extractor(rowEl) اختياري: بيرجع كائن البيانات الخاص بالصف (لو محتاج
    //   حقول إضافية مش موجودة كـ data-attribute عادي — زي party_categories)
    function register(container, menuType, extractor) {
      if (!container || container._ctxBound) return;
      container._ctxBound = true;

      function findRow(target) {
        var el = target.closest ? target.closest("[data-id]") : null;
        return el && container.contains(el) ? el : null;
      }

      container.addEventListener("contextmenu", function (e) {
        var rowEl = findRow(e.target);
        if (!rowEl) return;
        e.preventDefault();
        var rowData = extractor
          ? extractor(rowEl) || {}
          : _defaultExtract(rowEl);
        if (!rowData.id) rowData.id = rowEl.getAttribute("data-id") || "";
        open(menuType, rowData, e.clientX, e.clientY);
      });

      // ضغط مطوّل على الموبايل (مفيش كليك يمين على تاتش) — نفس تجربة
      // كليك يمين، بيفتح نفس القائمة عند إحداثيات نقطة اللمس.
      var pressTimer = null,
        pressRow = null,
        moved = false;
      container.addEventListener(
        "touchstart",
        function (e) {
          var rowEl = findRow(e.target);
          if (!rowEl) return;
          pressRow = rowEl;
          moved = false;
          var touch = e.touches[0];
          pressTimer = setTimeout(function () {
            if (moved || !pressRow) return;
            var rowData = extractor
              ? extractor(pressRow) || {}
              : _defaultExtract(pressRow);
            if (!rowData.id)
              rowData.id = pressRow.getAttribute("data-id") || "";
            if (navigator.vibrate) navigator.vibrate(15);
            open(menuType, rowData, touch.clientX, touch.clientY);
          }, LONG_PRESS_MS);
        },
        { passive: true },
      );
      container.addEventListener(
        "touchmove",
        function () {
          moved = true;
        },
        { passive: true },
      );
      ["touchend", "touchcancel"].forEach(function (evt) {
        container.addEventListener(evt, function () {
          if (pressTimer) clearTimeout(pressTimer);
          pressTimer = null;
          pressRow = null;
        });
      });
    }

    function define(menuType, items) {
      _definitions[menuType] = items;
    }

    return {
      register: register,
      define: define,
      open: open,
      close: close,
      DEFINITIONS: _definitions,
    };
  })();
  window.CTX = CTX;
  window.CTX_DEFINITIONS = CTX.DEFINITIONS; // للتوافق مع تعليقات قديمة بتشاور لـ CTX_DEFINITIONS.xxx

  // ── تعريفات القوائم (CTX_DEFINITIONS) ──────────────────────────────────
  // كل تعريف هنا اتبنى من فحص فعلي للدوال الموجودة بالفعل بكل شاشة (زرار
  // تعديل/حذف قديم كان بينادي عليها قبل [CTX-REFACTOR])، مش دوال مخترعة.
  // اللي كانت أصلاً معرَّفة بنمط window.ctx_* (المحاسبة/HR/الإنتاج/
  // الفواتير/سجل الواتساب) بيتنادى عليها مباشرة بالاسم. الباقي بينادي
  // على الدالة الأصلية للشاشة مباشرة (أو Wrapper بسيط هنا لو الدالة
  // الأصلية محتاجة باراميتر إضافي زي الاسم أو index بدل id).

  (function () {
    function h(name) {
      // مرجع آمن لدالة global بالاسم (تتقيّم وقت الاستدعاء الفعلي مش وقت
      // التعريف، عشان نضمن إن كل ملفات الموديولات اتحملت فعلاً)
      return function (id, row) {
        if (typeof window[name] === "function") window[name](id, row);
        else console.warn("[CTX] missing handler:", name);
      };
    }

    // ═══ المحاسبة ═══
    CTX.define("chart_of_accounts", [
      { icon: "ti-edit", label: "تعديل الحساب", handler: h("ctx_editAccount") },
      {
        icon: "ti-trash",
        label: "حذف الحساب",
        danger: true,
        handler: h("ctx_deleteAccount"),
      },
    ]);

    CTX.define("cash_boxes", [
      {
        icon: "ti-edit",
        label: "تعديل الخزينة",
        handler: h("ctx_editCashBox"),
      },
      { sep: true },
      {
        icon: "ti-arrow-down-circle",
        label: "سند قبض",
        handler: h("ctx_cashBoxReceipt"),
      },
      {
        icon: "ti-arrow-up-circle",
        label: "سند صرف",
        handler: h("ctx_cashBoxPayment"),
      },
      {
        icon: "ti-transfer",
        label: "تحويل رصيد",
        handler: h("ctx_cashBoxTransfer"),
      },
      { sep: true },
      {
        icon: "ti-report-money",
        label: "كشف حركة",
        handler: h("ctx_cashBoxStatement"),
      },
      {
        icon: "ti-printer",
        label: "طباعة كشف الحركة",
        handler: h("ctx_printCashBoxStatement"),
      },
      { sep: true },
      {
        icon: "ti-trash",
        label: "حذف الخزينة",
        danger: true,
        handler: h("ctx_deleteCashBox"),
      },
    ]);

    CTX.define("size_groups", [
      {
        icon: "ti-edit",
        label: "تعديل المجموعة",
        handler: function (id) {
          if (typeof openSizeGroupModal === "function")
            openSizeGroupModal(id);
        },
      },
      {
        icon: "ti-trash",
        label: "حذف المجموعة",
        danger: true,
        handler: function (id, row) {
          if (typeof deleteSizeGroupConfirm !== "function") return;
          var grp =
            (row && row.name) ||
            ((window.APP && APP.data && APP.data.sizeGroups) || []).find(
              function (g) {
                return String(g.id) === String(id);
              },
            );
          deleteSizeGroupConfirm(id, typeof grp === "object" ? grp.name : grp);
        },
      },
    ]);

    CTX.define("bank_accounts", [
      {
        icon: "ti-edit",
        label: "تعديل الحساب البنكي",
        handler: h("ctx_editBankAccount"),
      },
      {
        icon: "ti-trash",
        label: "حذف الحساب البنكي",
        danger: true,
        handler: h("ctx_deleteBankAccount"),
      },
    ]);

    CTX.define("journal", [
      { icon: "ti-eye", label: "عرض القيد", handler: h("ctx_viewJournal") },
      {
        // [FEATURE-JE-MANUAL-ENTRY] تعديل مسموح فقط لقيد لسه DRAFT (لم
        // يُرحَّل) — قيد معتمد/ملغي أداته الصحيحة "عكس القيد" لا التعديل.
        icon: "ti-edit",
        label: "تعديل القيد",
        showIf: function (row) {
          var e = (APP.data.journalEntries || []).find(function (x) {
            return String(x.id) === String(row && row.id);
          });
          return !!e && e.status === "DRAFT";
        },
        handler: h("ctx_editJournal"),
      },
      {
        icon: "ti-link",
        label: "عرض المستند المرتبط",
        handler: h("ctx_viewLinkedDoc"),
      },
      {
        icon: "ti-printer",
        label: "طباعة القيد",
        handler: h("ctx_printJournal"),
      },
      {
        icon: "ti-file-type-pdf",
        label: "تصدير PDF",
        handler: h("ctx_exportJournalPdf"),
      },
      {
        icon: "ti-copy",
        label: "نسخ رقم المرجع",
        handler: h("ctx_copyJournalRef"),
      },
      { sep: true },
      {
        icon: "ti-arrow-back-up",
        label: "عكس القيد",
        handler: h("ctx_reverseJournal"),
      },
      {
        icon: "ti-trash",
        label: "حذف القيد",
        danger: true,
        handler: h("ctx_deleteJournal"),
      },
    ]);

    CTX.define("receipt_vouchers", [
      {
        icon: "ti-edit",
        label: "تعديل السند",
        handler: h("ctx_editReceiptVoucher"),
      },
      {
        icon: "ti-printer",
        label: "طباعة السند",
        handler: h("ctx_printReceiptVoucher"),
      },
      {
        icon: "ti-ban",
        label: "إلغاء السند",
        handler: h("ctx_cancelReceiptVoucher"),
      },
      {
        icon: "ti-trash",
        label: "حذف السند",
        danger: true,
        handler: h("ctx_deleteReceiptVoucher"),
      },
    ]);

    CTX.define("payment_vouchers", [
      {
        icon: "ti-edit",
        label: "تعديل السند",
        handler: h("ctx_editPaymentVoucher"),
      },
      {
        icon: "ti-printer",
        label: "طباعة السند",
        handler: h("ctx_printPaymentVoucher"),
      },
      {
        icon: "ti-ban",
        label: "إلغاء السند",
        handler: h("ctx_cancelPaymentVoucher"),
      },
      {

        label: "حذف السند",
        danger: true,
        handler: h("ctx_deletePaymentVoucher"),
      },
    ]);

    CTX.define("expenses", [
      {
        icon: "ti-edit",
        label: "تعديل المصروف",
        handler: h("ctx_editExpense"),
      },
      {
        icon: "ti-printer",
        label: "طباعة المصروف",
        handler: h("ctx_printExpense"),
      },
      {
        icon: "ti-trash",
        label: "حذف المصروف",
        danger: true,
        handler: h("ctx_deleteExpense"),
      },
    ]);

    CTX.define("transfer_vouchers", [
      {
        icon: "ti-edit",
        label: "تعديل سند التحويل",
        handler: h("ctx_editTransferVoucher"),
      },
      {

        label: "حذف سند التحويل",

        handler: h("ctx_deleteTransferVoucher"),

    ]);

    // ═══ الموارد البشرية ═══
    CTX.define("departments", [

      {

    CTX.define("salary_components", [
      {
        icon: "ti-edit",
        label: "تعديل بند الراتب",
        handler: h("ctx_editSalaryComponent"),
      },
      {

      },

    CTX.define("job_titles", [
      {
        icon: "ti-edit",
        label: "تعديل المسمى الوظيفي",
        handler: h("ctx_editJobTitle"),
      },

    // [CTX-MOVE-2026-07-27] الأربع أزرار (سجل التعديلات / طباعة باركود-QR /
    // نسخ الصنف / أرشفة) كانت "Quick Actions" جوه شاشة إضافة/تعديل الصنف
    // نفسها — اتنقلوا هنا لقائمة كليك يمين (right-click) على صف الصنف في
    // الجدول بناءً على طلب المستخدم. لسه نفس السلوك القديم (توست "قيد
    // التطوير") لحد ما تتنفذ فعليًا، ما عدا تسمية الأرشفة اللي بتتغيّر
    // حسب حالة الصنف الفعلية (لازم نجيبها من APP.data.items لأن صف
    // الجدول مفيهوش غير data-id).
    function _ctxFindItem(id) {
      var items = (window.APP && APP.data && APP.data.items) || [];
      for (var i = 0; i < items.length; i++) {
        if (String(items[i].id) === String(id)) return items[i];
      }
      return null;
    }
    function _ctxItemTodo() {
      if (typeof NotificationEngine !== "undefined") {
        NotificationEngine.info(
          "هذه الميزة قيد التطوير — ستتوفر في مرحلة لاحقة من خطة إعادة بناء شاشة الصنف",
        );
      }
    }

    // (ColumnEngine.register)، و"_key" مركّبة بصيغة "item_id|color" —
    // بما إن الاستخراج الافتراضي (_defaultExtract) بيرجّع rowData.id
    // = نفس الـ data-id (يعني الـ "_key" الكاملة)، بنفكّها هنا بدل ما
    // نحتاج extractor مخصص، بنفس أسلوب زر تعديل/حذف الموجود في عمود
    // _actions (openOpeningStockModal/deleteOpeningStockConfirm).
    function _osSplitKey(compositeId) {
      var s = String(compositeId || "");
      var i = s.indexOf("|");
      if (i === -1) return { item_id: s, color: "" };
      return { item_id: s.slice(0, i), color: s.slice(i + 1) };
    }
