<script>
  // ═══════════════════════════════════════════════════════════════════
  // 52_JS_LoadingEngine.html — محرك فتح الشاشات الموحّد (Screen Loader)
  // ═══════════════════════════════════════════════════════════════════
  // [DATA-LOADING-ENGINE / المرحلة 3 + المرحلة 14] الفجوة اللي هذا الملف
  // بيسدّها:
  //
  //   كل قطعة من الخطة موجودة بالفعل ومنفصلة:
  //     - Code_53_DataRegistryEngine.gs  → getAllDataByLevel(levels) (P2: تصنيف 4 مستويات)
  //     - 31_JS_DataLayer.html           → _gsr() + DataModule (timeout/dedupe/retry يدوي لكل شاشة)
  //     - 50_JS_TabEngine.html           → Lazy Tabs
  //     - 51_JS_ImageEngine.html         → Placeholder→Thumbnail→Original
  //     - 55_JS_AttachmentEngine.html    → Lazy Attachments
  //     - 34_JS_ColumnEngine.html        → Virtual Rendering للجداول
  //     - 56_JS_PerfHarness.html         → قياس الأداء
  //
  //   لكن لا يوجد ملف واحد يفرض *تسلسل فتح الشاشة* المطلوب في المرحلة 3:
  //     1) رسم الواجهة  2) Skeleton  3) تحميل Critical فقط (المستوى 1)
  //     4) تفعيل الشاشة للمستخدم  5) تحميل باقي المستويات (2/3/4) بالخلفية
  //   ولا "Loading Engine موحّد" (المرحلة 14) يدير Skeleton + Progress +
  //   Retry + Timeout بشكل واحد قابل لإعادة الاستخدام في أي شاشة جديدة —
  //   كل شاشة حاليًا تكتب هذا المنطق يدويًا (أو لا تكتبه أصلاً) بدل ما
  //   تستدعي نقطة دخول واحدة.
  //
  //   الحل: ScreenLoader — غلاف رقيق فوق الأدوات الموجودة (لا يستبدل أيًا
  //   منها) يفرض التسلسل الصحيح ويوفر Skeleton/Progress/Retry/Timeout
  //   جاهزين بدون ما أي شاشة تعيد كتابتهم.
  //
  // ── الاستخدام (شاشة جديدة أو ترحيل شاشة قديمة) ──
  //   ScreenLoader.open({
  //     screenId: 'items-screen',
  //     container: document.getElementById('items-screen'), // لرسم الـ Skeleton فوقه
  //     skeleton: 'table',              // 'table' | 'form' | 'cards' | دالة مخصصة
  //     timeout: 15000,                 // اختياري (افتراضي 20 ثانية)
  //     critical: function (done) {
  //       // المستوى 1 فقط — نفس فلسفة DATA_LEVEL.CRITICAL في Code_53
  //       _gsr('getAllDataByLevel', [[1]], {
  //         timeout: 15000,
  //         onSuccess: function (r) { done(null, r.data); },
  //         onError:   function (r) { done(r); }
  //       });
  //     },
  //     onReady: function (criticalData) {
  //       renderItemsTable(criticalData);      // الشاشة تصبح قابلة للاستخدام هنا
  //     },
  //     background: [
  //       { name: 'onDemandRefs', run: function (done) {
  //           _gsr('getAllDataByLevel', [[2, 4]], { onSuccess: function (r) { done(null, r.data); } });
  //         }, onDone: function (data) { cacheDropdownSources(data); } },
  //       { name: 'stats', run: function (done) {
  //           _gsr('getItemsUsageStats', null, { onSuccess: function (r) { done(null, r.data); } });
  //         }, onDone: function (data) { renderStatsWidgets(data); } }
  //     ]
  //   });
  //
  //   أي شاشة لسه بتحمّل كل حاجة دفعة واحدة (getAllData كامل وقت الفتح)
  //   تُعتبر خطأ تصميميًا حسب التعليمات — الترحيل التدريجي: لف نفس
  //   المكالمات الحالية داخل critical/background بدون تغيير Business Logic.
  // ═══════════════════════════════════════════════════════════════════

  var ScreenLoader = (function () {
    "use strict";

    var DEFAULT_TIMEOUT = 20000;
    var _active = {}; // screenId -> { timeoutId, aborted }

    // ── §1  حقن CSS مرة واحدة فقط (نفس نمط ImageEngine/AppSelect) ──
    (function _injectCSS() {
      if (document.getElementById("sl-base-style")) return;
      var s = document.createElement("style");
      s.id = "sl-base-style";
      s.textContent = [
        ".sl-skel{position:relative;overflow:hidden;background:var(--surface1,#eef1f7);",
        "border-radius:var(--radius-sm,10px);}",
        ".sl-skel::after{content:'';position:absolute;inset:0;",
        "background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);",
        "transform:translateX(-100%);animation:sl-shimmer 1.2s infinite;}",
        "@keyframes sl-shimmer{100%{transform:translateX(100%);}}",
        ".sl-skel-row{height:16px;margin:8px 0;width:100%;}",
        ".sl-skel-row.short{width:40%;}",
        ".sl-skel-table .sl-skel-row{height:38px;margin:4px 0;}",
        ".sl-skel-card{height:110px;border-radius:var(--radius,14px);margin-bottom:10px;}",
        ".sl-progress-wrap{position:sticky;top:0;z-index:5;height:3px;background:transparent;}",
        ".sl-progress-bar{height:100%;width:30%;border-radius:2px;",
        "background:var(--primary,#3b6fe0);animation:sl-indeterminate 1.1s ease-in-out infinite;}",
        "@keyframes sl-indeterminate{0%{margin-inline-start:-30%;}100%{margin-inline-start:100%;}}",
        ".sl-error-box{padding:16px;text-align:center;color:var(--danger,#d64545);font-size:var(--text-sm,13px);}",
        ".sl-error-box button{margin-inline-start:8px;cursor:pointer;border:1px solid var(--border,#dde4f2);",
        "background:var(--surface,#fff);border-radius:var(--radius-xs,6px);padding:4px 10px;}",
      ].join("");
      document.head.appendChild(s);
    })();

    // ── §2  مولّدات Skeleton الجاهزة (مربوطة بالـ tokens الموجودة) ──
    function _skeletonHtml(kind) {
      if (typeof kind === "function") return kind();
      if (kind === "form") {
        return (
          '<div class="sl-skel sl-skel-row" style="width:60%"></div>' +
          '<div class="sl-skel sl-skel-row"></div>'.repeat
            ? Array(4).fill('<div class="sl-skel sl-skel-row"></div>').join("")
            : ""
        );
      }
      if (kind === "cards") {
        return Array(3)
          .fill('<div class="sl-skel sl-skel-card"></div>')
          .join("");
      }
      // 'table' (الافتراضي) — أقرب حالة استخدام فعلية في الشاشات الحالية
      var rows = Array(8).fill('<div class="sl-skel sl-skel-row sl-skel-table"></div>').join("");
      return '<div class="sl-skel-table">' + rows + "</div>";
    }

    function _renderSkeleton(container, kind) {
      if (!container) return;
      container.setAttribute("data-sl-skeleton", "1");
      container.innerHTML = _skeletonHtml(kind || "table");
    }

    function _renderProgress(container) {
      if (!container) return null;
      var wrap = document.createElement("div");
      wrap.className = "sl-progress-wrap";
      wrap.innerHTML = '<div class="sl-progress-bar"></div>';
      container.parentNode && container.parentNode.insertBefore(wrap, container);
      return wrap;
    }

    function _renderError(container, message, onRetry) {
      if (!container) return;
      var retryBtn = onRetry
        ? '<button type="button" data-sl-retry>إعادة المحاولة</button>'
        : "";
      container.innerHTML =
        '<div class="sl-error-box">' + (message || "تعذّر تحميل البيانات") + retryBtn + "</div>";
      if (onRetry) {
        var btn = container.querySelector("[data-sl-retry]");
        if (btn) btn.onclick = onRetry;
      }
    }

    // ── §3  فتح شاشة بالتسلسل الصحيح (المرحلة 3) ──
    function open(cfg) {
      cfg = cfg || {};
      var screenId = cfg.screenId || "screen-" + Date.now();
      var container = cfg.container || null;
      var timeoutMs = cfg.timeout || DEFAULT_TIMEOUT;

      // إغلاق أي جلسة سابقة لنفس الشاشة (إعادة فتح) لمنع تراكم Timers
      close(screenId);
      var state = { timeoutId: null, aborted: false, progressEl: null };
      _active[screenId] = state;

      // 1) رسم الواجهة يفترض أن الشاشة استدعت هذا بعد إنشاء الـ DOM بالفعل
      // 2) Skeleton فورًا (بدون انتظار أي نداء شبكة)
      _renderSkeleton(container, cfg.skeleton);
      state.progressEl = _renderProgress(container);

      if (typeof PerfHarness !== "undefined" && PerfHarness.mark) {
        PerfHarness.mark(screenId + "_open_start");
      }

      function teardownProgress() {
        if (state.progressEl && state.progressEl.parentNode) {
          state.progressEl.parentNode.removeChild(state.progressEl);
        }
        state.progressEl = null;
      }

      function runCritical(isRetry) {
        if (!isRetry) {
          _renderSkeleton(container, cfg.skeleton); // حالة إعادة فتح نفس الشاشة
        }
        state.timeoutId = setTimeout(function () {
          if (state.aborted) return;
          teardownProgress();
          _renderError(container, "استغرق التحميل وقتًا أطول من المتوقع.", function () {
            runCritical(true);
          });
        }, timeoutMs);

        // 3) تحميل المستوى الحرج فقط
        if (typeof cfg.critical !== "function") {
          console.error("[ScreenLoader] critical() مطلوبة لـ " + screenId);
          return;
        }
        cfg.critical(function (err, data) {
          if (state.aborted) return;
          clearTimeout(state.timeoutId);
          if (err) {
            teardownProgress();
            _renderError(
              container,
              (err && err.message) || "تعذّر تحميل بيانات الشاشة.",
              function () { runCritical(true); }
            );
            return;
          }
          teardownProgress();
          if (container) container.removeAttribute("data-sl-skeleton");

          if (typeof PerfHarness !== "undefined" && PerfHarness.mark) {
            PerfHarness.mark(screenId + "_ready");
          }

          // 4) الشاشة جاهزة للاستخدام الآن — Business Logic الفعلي للشاشة
          if (typeof cfg.onReady === "function") cfg.onReady(data);

          // 5) تحميل بقية المستويات في الخلفية دون حجب الواجهة
          _runBackground(screenId, cfg.background);
        });
      }

      runCritical(false);
      return { screenId: screenId, close: function () { close(screenId); } };
    }

    // ── §4  تحميل خلفي متسلسل بدون حجب — المستوى 2/3/4 (المرحلة 3 خطوة 5) ──
    // كل مهمة مستقلة: فشل واحدة لا يوقف البقية (نفس فلسفة عزل الأخطاء
    // حقلاً-حقلاً في _buildDataBundleFiltered بالسيرفر).
    function _runBackground(screenId, tasks) {
      if (!tasks || !tasks.length) return;
      tasks.forEach(function (task) {
        if (typeof task.run !== "function") return;
        try {
          task.run(function (err, data) {
            if (_active[screenId] && _active[screenId].aborted) return;
            if (err) {
              console.warn("[ScreenLoader] فشلت مهمة خلفية (" + (task.name || "?") + "):", err);
              return;
            }
            if (typeof task.onDone === "function") task.onDone(data);
          });
        } catch (e) {
          console.warn("[ScreenLoader] استثناء في مهمة خلفية (" + (task.name || "?") + "):", e);
        }
      });
    }

    // ── §5  إغلاق نظيف عند مغادرة الشاشة — يمنع Timers/تحديثات معلّقة ──
    function close(screenId) {
      var state = _active[screenId];
      if (!state) return;
      state.aborted = true;
      if (state.timeoutId) clearTimeout(state.timeoutId);
      if (state.progressEl && state.progressEl.parentNode) {
        state.progressEl.parentNode.removeChild(state.progressEl);
      }
      delete _active[screenId];
    }

    return {
      open: open,
      close: close,
      renderSkeleton: _renderSkeleton, // للاستخدام المباشر لو شاشة محتاجة Skeleton بس بدون تسلسل كامل
    };
  })();
</script>
