<script>
  // ═══════════════════════════════════════════════════════════════════
  // 57_JS_InventorySettings.html — شاشة إعدادات المخزون العامة
  // ═══════════════════════════════════════════════════════════════════
  // [INV-SETTINGS-2026-08-07] Phase 2: هيكل الـ15 تاب فقط (عناوين + تنقل
  // + تحميل/حفظ فعلي للـ backend عبر Code_56_InventorySettingsEngine.js).
  // محتوى كل تاب (الحقول الفعلية) هيتم تعبئته تاب بتاب في Phase 3 —
  // دلوقتي كل تاب فيه Placeholder "قريبًا" بس عشان نتأكد من الشكل
  // والتنقل الأول قبل ما نستثمر وقت في بناء كل الحقول.
  //
  // نفس نمط تابات فورم الصنف (03_JS_Dashboard_Items.html) في الـ CSS
  // classes، لكن التبديل هنا عبر TabEngine الموحّد (50_JS_TabEngine)
  // بدل منطق يدوي، لأن كل التابات هنا static (تحميل واحد للداتا كلها
  // مع فتح الشاشة، مفيش لكل تاب loader منفصل).
  // ═══════════════════════════════════════════════════════════════════

  // ── تعريف الأقسام الـ15 (مفتاح، عنوان، أيقونة) — مصدر واحد لبناء
  // أزرار التابات ولوحاتها، عشان إضافة قسم جديد مستقبلاً = سطر واحد هنا
  var INV_SETTINGS_SECTIONS = [
    { key: "general", label: "عام", icon: "ti-adjustments" },
    { key: "item_defaults", label: "خصائص المخزون", icon: "ti-list-details" },
    { key: "units_measure", label: "وحدات القياس", icon: "ti-ruler-2" },
    { key: "units_guide", label: "دليل الوحدات", icon: "ti-book" },
    { key: "receipt_permits", label: "إذون الإضافة", icon: "ti-square-rounded-plus" },
    { key: "issue_permits", label: "إذون الصرف", icon: "ti-square-rounded-minus" },
    { key: "price_formulas", label: "معادلة الأسعار", icon: "ti-calculator" },
    { key: "non_homogeneous_units", label: "الوحدات الغير متجانسة", icon: "ti-transform" },
    { key: "item_formulas", label: "معادلة الأصناف", icon: "ti-math-function" },
    { key: "valuation", label: "سياسة تقييم المخزون", icon: "ti-scale" },
    { key: "costing", label: "سياسة التكلفة", icon: "ti-coin" },
    { key: "reservation", label: "سياسة الحجز", icon: "ti-lock" },
    { key: "stocktake", label: "سياسة الجرد", icon: "ti-clipboard-check" },
    { key: "transfer", label: "سياسة التحويل بين المخازن", icon: "ti-transfer" },
    { key: "returns", label: "سياسة المرتجعات", icon: "ti-corner-up-left" },
    { key: "reorder", label: "الحد الأدنى والأقصى", icon: "ti-alert-triangle" },
    { key: "units", label: "سياسة الوحدات", icon: "ti-ruler-2" },
    { key: "barcode", label: "سياسة الباركود", icon: "ti-barcode" },
    { key: "numbering", label: "سياسة الترقيم", icon: "ti-list-numbers" },
    { key: "user_perms", label: "صلاحيات المستخدمين", icon: "ti-shield-lock" },
    { key: "accounting", label: "الربط المحاسبي", icon: "ti-report-money" },
    { key: "notifications", label: "الإشعارات", icon: "ti-bell" },
    { key: "log", label: "سجل التغييرات", icon: "ti-history" },
  ];

  var _invSetTabsCtrl = null; // مرجع TabEngine instance الحالي
  var _invSetCurrentData = null; // آخر نسخة إعدادات محمّلة من السيرفر
  var _invSetLogLoaded = false; // هل تاب السجل اتحمّل قبل كده (lazy)

  // ═══════════════════════════════════════════════════════════════
  // [PHASE-3] Field Builders — دوال موحّدة لبناء كل نوع حقل، عشان كل
  // الـ15 قسم يستخدموا نفس الشكل بالظبط ومفيش تكرار HTML. كل حقل
  // بياخد data-inv-key="<مفتاح من INVENTORY_SETTINGS_DEFAULTS>" عشان
  // _invSetApplyToUI/_invSetGatherFromUI يقدروا يلاقوه تلقائيًا بدون
  // سويتش/if يدوي لكل حقل.
  // ═══════════════════════════════════════════════════════════════

  function _invRow(labelText, controlHtml, hint) {
    return (
      '<div class="invset-field-row">' +
      '<div class="invset-field-label">' +
      "<label>" +
      labelText +
      "</label>" +
      (hint ? '<span class="invset-field-hint">' + hint + "</span>" : "") +
      "</div>" +
      '<div class="invset-field-control">' +
      controlHtml +
      "</div>" +
      "</div>"
    );
  }

  function _invToggle(key) {
    return (
      '<label class="invset-switch">' +
      '<input type="checkbox" data-inv-key="' +
      key +
      '" data-inv-type="bool">' +
      '<span class="invset-switch-track"><span class="invset-switch-thumb"></span></span>' +
      "</label>"
    );
  }

  function _invNumber(key, opts) {
    opts = opts || {};
    return (
      '<input class="input invset-input-sm" type="number" data-inv-key="' +
      key +
      '" data-inv-type="number"' +
      (opts.min !== undefined ? ' min="' + opts.min + '"' : "") +
      (opts.max !== undefined ? ' max="' + opts.max + '"' : "") +
      (opts.step !== undefined ? ' step="' + opts.step + '"' : "") +
      ">"
    );
  }

  function _invText(key, opts) {
    opts = opts || {};
    return (
      '<input class="input invset-input-sm" type="text" data-inv-key="' +
      key +
      '" data-inv-type="text"' +
      (opts.placeholder ? ' placeholder="' + opts.placeholder + '"' : "") +
      ">"
    );
  }

  function _invSelect(key, options) {
    var opts = options
      .map(function (o) {
        return '<option value="' + o.v + '">' + o.label + "</option>";
      })
      .join("");
    return (
      '<select class="input" data-inv-key="' + key + '" data-inv-type="text">' + opts + "</select>"
    );
  }

  // ── محتوى كل تاب (دوال منفصلة لسهولة القراءة/الصيانة) ──────────

  function _invPanelGeneral() {
    return (
      '<div class="invset-section-title">تفعيل ميزات المخزون</div>' +
      '<div class="invset-info-note"><i class="ti ti-info-circle" aria-hidden="true"></i> إعداد "السماح بالمخزون السالب" مكانه شاشة الإعدادات العامة ← تاب "العمليات"، مش هنا.</div>' +
      _invRow("منع بيع صنف غير متوفر", _invToggle("block_sale_if_unavailable")) +
      _invRow("السماح بالحجز قبل التوفر", _invToggle("allow_reserve_before_available")) +
      _invRow("تفعيل تتبع الكميات", _invToggle("enable_qty_tracking")) +
      _invRow("تفعيل تتبع القيمة", _invToggle("enable_value_tracking")) +
      _invRow("تفعيل تعدد المخازن", _invToggle("enable_multi_warehouse")) +
      _invRow("تفعيل مواقع التخزين داخل المخزن (Bins)", _invToggle("enable_bins")) +
      _invRow("تفعيل الدفعات (Batches)", _invToggle("enable_batches")) +
      _invRow("تفعيل الأرقام التسلسلية (Serial Numbers)", _invToggle("enable_serial_numbers")) +
      _invRow("تفعيل تواريخ الصلاحية", _invToggle("enable_expiry_dates")) +
      _invRow("تفعيل الوحدات المتعددة", _invToggle("enable_multi_units")) +
      _invRow("تفعيل الأصناف المركبة", _invToggle("enable_bundle_items")) +
      _invRow("تفعيل الأصناف الخدمية", _invToggle("enable_service_items")) +
      _invRow("تفعيل الأصناف غير المخزنية", _invToggle("enable_non_stock_items")) +
      '<div class="invset-section-heading"><i class="ti ti-adjustments"></i><h3>عام</h3></div>' +
      _invRow(
        "كيفية إحتساب كمية البونص في الفاتورة",
        _invSelect("bonus_qty_calc_method", [
          { v: "smallest_unit", label: "بالوحدة الصغرى" },
          { v: "invoice_unit", label: "بوحدة الفاتورة" },
        ]),
      ) +
      _invRow(
        "كيفية تكرار الباركود عند طباعة الباركود",
        _invSelect("barcode_print_repeat_mode", [
          { v: "once", label: "مرة واحدة" },
          { v: "per_qty", label: "بعدد الكمية" },
          { v: "custom", label: "عدد مخصص" },
        ]),
      ) +
      '<div class="invset-section-heading"><i class="ti ti-barcode"></i><h3>أصناف برقم تسلسلي</h3></div>' +
      _invRow(
        "يجب إدخال إسم العميل أو المورد في الفواتير التي تحتوي على أصناف برقم تسلسلي",
        _invToggle("serial_require_party_name"),
      ) +
      _invRow("أثناء البيع يتاح للمستخدم الاختيار من الأرقام التسلسلية المتاحة", _invToggle("serial_allow_manual_pick_on_sale")) +
      _invRow(
        "في حالة عدم التحقق من صحة إستخدام الرقم التسلسلي",
        _invSelect("serial_invalid_use_action", [
          { v: "block", label: "منع إتمام العملية" },
          { v: "warn_password", label: "قبول التعامل بعد كتابة رقم سري" },
          { v: "allow", label: "السماح بدون تنبيه" },
        ]),
      ) +
      _invRow("الرقم السري لتنفيذ العملية", _invText("serial_override_password", { placeholder: "*****" })) +
      '<div class="invset-section-heading"><i class="ti ti-calendar-due"></i><h3>مخزون بتاريخ صلاحية</h3></div>' +
      _invRow(
        "في حالة الشراء .. إذا كان الصنف لصلاحية تشفيلية غير مسجل لدينا، ما الذي تود فعله؟",
        _invSelect("expiry_unknown_batch_on_purchase", [
          { v: "create_auto", label: "إنشاء رقم لصنفية بالبيانات المدخلة" },
          { v: "block", label: "منع الشراء" },
          { v: "ask", label: "سؤال المستخدم في كل مرة" },
        ]),
      ) +
      _invRow(
        "سياسة الإدخال في حالة الإستلام؟",
        _invSelect("expiry_receive_policy", [
          { v: "always_ask_date", label: "دعني أختار التاريخ دائمًا" },
          { v: "nearest_expiry", label: "أقرب تاريخ صلاحية" },
        ]),
      ) +
      _invRow(
        "سياسة الإدخال في حالة الصرف؟",
        _invSelect("expiry_issue_policy", [
          { v: "fefo", label: "البيع من التواريخ الأقدم أولاً" },
          { v: "manual", label: "اختيار يدوي" },
        ]),
      ) +
      _invRow("أقل مدة صلاحية يمكن قبولها", _invNumber("expiry_min_accept_days", { min: 0 }) + " يوم") +
      _invRow("منع التعديل على رقم التشغيلة أثناء عملية الشراء؟", _invToggle("expiry_block_batch_edit_on_purchase")) +
      _invRow(
        "عند إضافة صنف عن طريق QR Barcode وكان تاريخ صلاحيته غير مسجل لدينا، ما الذي تود فعله؟",
        _invSelect("expiry_qr_unknown_action", [
          { v: "open_expiry_screen", label: "فتح شاشة إضافة تاريخ صلاحية" },
          { v: "ignore", label: "تجاهل" },
        ]),
      )
    );
  }

  function _invPanelItemDefaults() {
    return (
      '<div class="invset-section-title">يتم ملأ صفحة إضافة صنف بهذه الخصائص لتسهيل عملية الإدخال عليكم</div>' +
      _invRow(
        "طريقة تقييم المخزون",
        _invSelect("item_default_valuation_method", [
          { v: "fifo", label: "الوارد أولاً صادر أولاً" },
          { v: "lifo", label: "الوارد أخيرًا صادر أولاً" },
          { v: "average", label: "متوسط مرجّح" },
        ]),
      ) +
      _invRow(
        "طريقة كتابة الكود",
        _invSelect("item_code_generation_method", [
          { v: "auto_increment", label: "زيادة الكود بطريقة تلقائية" },
          { v: "manual", label: "إدخال يدوي" },
        ]),
      ) +
      _invRow(
        "نوع المخزون الافتراضي",
        _invSelect("item_default_inventory_type", [
          { v: "stock", label: "مخزون" },
          { v: "service", label: "خدمي" },
          { v: "non_stock", label: "غير مخزني" },
        ]),
      ) +
      _invRow("وحدة القياس الافتراضية", _invText("item_default_unit", { placeholder: "قطعة" })) +
      _invRow("الحد الأدنى لكمية الصنف", _invNumber("item_default_min_qty", { min: 0 })) +
      _invRow("الحد الأقصى لكمية الصنف", _invNumber("item_default_max_qty", { min: 0 })) +
      _invRow("فترة الركود", _invNumber("item_stagnation_period_days", { min: 0 }) + " يوم") +
      _invRow("التنبيه قبل انتهاء تاريخ الصلاحية بـ", _invNumber("item_expiry_alert_days", { min: 0 }) + " يوم") +
      '<div class="invset-section-heading"><i class="ti ti-receipt-tax"></i><h3>الضرائب</h3></div>' +
      _invRow(
        "كيفية تعامل الأصناف مع الضريبة",
        _invSelect("item_tax_handling", [
          { v: "no", label: "لا" },
          { v: "sales_only", label: "المبيعات فقط" },
          { v: "purchases_only", label: "المشتريات فقط" },
          { v: "both", label: "المبيعات والمشتريات" },
        ]),
      ) +
      _invRow(
        "نسبة الضريبة",
        _invNumber("item_tax_rate_sales", { min: 0, max: 100 }) + " المبيعات &nbsp; " + _invNumber("item_tax_rate_purchases", { min: 0, max: 100 }) + " المشتريات",
      ) +
      _invRow("سعر الصنف يشمل الضريبة", _invToggle("item_price_includes_tax")) +
      _invRow(
        "كيفية تعامل الأصناف مع ضريبة الخصم",
        _invSelect("item_discount_tax_handling", [
          { v: "as_invoice", label: "كما بالفاتورة" },
          { v: "fixed", label: "نسبة ثابتة" },
          { v: "none", label: "بدون" },
        ]),
      ) +
      _invRow("حساب ضريبة الخصم", _invText("item_discount_tax_account")) +
      _invRow("نسبة ضريبة الخصم", _invNumber("item_discount_tax_rate", { min: 0, max: 100 }))
    );
  }

  // ── تاب: وحدات القياس (اسم + عدد الوحدات) ───────────────────────────
  function _invPanelUnitsMeasure() {
    return (
      '<div class="invset-section-title">هي عبارة عن علاقة بين الوحدات الصغرى والكبرى مثلة بعدد القطع لكل وحدة مثال (الكرتونة = 12 قطعة أو العلبة تحتوي على 2 شريط)</div>' +
      '<div class="cset-table-wrap">' +
      '<table class="invset-num-table" id="invset-units-table">' +
      "<thead><tr><th>الاسم</th><th>عدد الوحدات</th><th></th></tr></thead>" +
      '<tbody id="invset-units-list"></tbody>' +
      "</table></div>" +
      '<button type="button" class="btn btn-outline-primary" id="invset-add-unit-btn" style="margin-top:10px">' +
      '<i class="ti ti-plus"></i> جديد</button>'
    );
  }

  function _invUnitRowHtml(u, i) {
    u = u || {};
    return (
      '<tr data-unit-row data-unit-index="' +
      i +
      '">' +
      '<td><input class="input invset-input-sm" data-unit-field="name" value="' + (u.name || "") + '"></td>' +
      '<td><input class="input invset-input-sm" type="number" min="1" data-unit-field="count" value="' +
      (u.count != null ? u.count : 1) +
      '"></td>' +
      '<td><button type="button" class="btn btn-sm btn-outline-danger" data-remove-unit><i class="ti ti-trash"></i></button></td>' +
      "</tr>"
    );
  }

  function _invRenderUnitsList(units) {
    var container = document.getElementById("invset-units-list");
    if (!container) return;
    container.innerHTML = (units || []).map(_invUnitRowHtml).join("");
    container.querySelectorAll("[data-remove-unit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        btn.closest("[data-unit-row]").remove();
      });
    });
  }

  function _invGatherUnits() {
    var container = document.getElementById("invset-units-list");
    if (!container) return [];
    var out = [];
    container.querySelectorAll("[data-unit-row]").forEach(function (row) {
      var get = function (f) {
        var el = row.querySelector('[data-unit-field="' + f + '"]');
        return el ? el.value : "";
      };
      var name = (get("name") || "").trim();
      if (!name) return;
      out.push({ name: name, count: Number(get("count") || 1) });
    });
    return out;
  }

  // ── تاب: دليل الوحدات (Placeholder — قائمة مرجعية فقط، لسه محتاجة تفاصيل) ──
  function _invPanelUnitsGuide() {
    return (
      '<div class="invset-panel-placeholder">' +
      '<i class="ti ti-book" style="font-size:32px;opacity:.35"></i>' +
      "<p>دليل الوحدات — قائمة مرجعية بكل وحدات القياس المتاحة في النظام (قطعة، كرتونة، شريط...) تُستخدم عند تعريف وحدات القياس بالأعلى. " +
      "لسه محتاجين تفاصيل الشاشة دي عندك عشان نبنيها بالكامل.</p>" +
      "</div>"
    );
  }

  // ── تابين: إذون الإضافة / إذون الصرف (نفس الشكل بالظبط، بادئة مختلفة) ──
  function _invWarehousePermitPanel(prefix) {
    return (
      '<div class="invset-header-actions" style="justify-content:flex-end;margin-bottom:14px">' +
      '<select class="input invset-input-sm" id="invset-' + prefix + '-branch-filter"><option value="">الفرع الرئيسي</option></select>' +
      '<select class="input invset-input-sm" id="invset-' + prefix + '-status-filter">' +
      '<option value="active" selected>نشط</option><option value="all">الكل</option><option value="inactive">غير نشط</option>' +
      "</select>" +
      '<button type="button" class="btn btn-primary" id="invset-add-' + prefix + '-btn">جديد</button>' +
      "</div>" +
      '<div class="cset-table-wrap">' +
      '<table class="invset-num-table" id="invset-' + prefix + '-table">' +
      "<thead><tr><th>الاسم</th><th>قيد محاسبي</th><th>نشط</th><th></th></tr></thead>" +
      '<tbody id="invset-' + prefix + '-list"></tbody>' +
      "</table></div>"
    );
  }

  function _invPanelReceiptPermits() {
    return _invWarehousePermitPanel("receipt");
  }

  function _invPanelIssuePermits() {
    return _invWarehousePermitPanel("issue");
  }

  function _invPermitRowHtml(prefix, p, i) {
    p = p || {};
    return (
      '<tr data-' + prefix + '-row data-' + prefix + '-index="' +
      i +
      '">' +
      '<td><input class="input invset-input-sm" data-' + prefix + '-field="name" value="' + (p.name || "") + '"></td>' +
      '<td><input class="input invset-input-sm" data-' + prefix + '-field="ledger_account" value="' + (p.ledger_account || "") + '"></td>' +
      '<td style="text-align:center"><label class="invset-switch"><input type="checkbox" data-' + prefix + '-field="active"' +
      (p.active === false ? "" : " checked") +
      '><span class="invset-switch-track"><span class="invset-switch-thumb"></span></span></label></td>' +
      '<td><button type="button" class="btn btn-sm btn-outline-danger" data-remove-' + prefix + '><i class="ti ti-trash"></i></button></td>' +
      "</tr>"
    );
  }

  function _invRenderPermitsList(prefix, rows) {
    var container = document.getElementById("invset-" + prefix + "-list");
    if (!container) return;
    container.innerHTML = (rows || []).map(function (p, i) { return _invPermitRowHtml(prefix, p, i); }).join("");
    container.querySelectorAll("[data-remove-" + prefix + "]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        btn.closest("[data-" + prefix + "-row]").remove();
      });
    });
  }

  function _invGatherPermits(prefix) {
    var container = document.getElementById("invset-" + prefix + "-list");
    if (!container) return [];
    var out = [];
    container.querySelectorAll("[data-" + prefix + "-row]").forEach(function (row) {
      var get = function (f) {
        var el = row.querySelector('[data-' + prefix + '-field="' + f + '"]');
        return el ? el.value : "";
      };
      var name = (get("name") || "").trim();
      if (!name) return;
      out.push({
        name: name,
        ledger_account: get("ledger_account") || "",
        active: !!row.querySelector('[data-' + prefix + '-field="active"]').checked,
      });
    });
    return out;
  }

  // ── تاب: معادلة الأسعار ──────────────────────────────────────────
  function _invPanelPriceFormulas() {
    return (
      '<div class="invset-section-title">تستخدم معادلة الأسعار لوضع سعر جديد للأصناف بناء على عدة معطيات</div>' +
      '<div class="invset-header-actions" style="justify-content:flex-end;margin-bottom:14px">' +
      '<select class="input invset-input-sm" id="invset-price-formula-status-filter">' +

  function _invGatherPriceFormulas() {
    var container = document.getElementById("invset-price-formulas-list");
    if (!container) return [];
    var out = [];
    container.querySelectorAll("[data-formula-row]").forEach(function (row) {
      var nameEl = row.querySelector('[data-formula-field="name"]');
      var name = nameEl ? nameEl.value.trim() : "";
      if (!name) return;
      out.push({ name: name, active: !!row.querySelector('[data-formula-field="active"]').checked });
    });

  // ── تطبيق القيم المحمّلة على كل حقول الـ DOM (data-inv-key) ──────
  function _invSetApplyToUI(data) {
    if (!data) return;
    var root = document.getElementById("invset-panels");
    if (!root) return;
    root.querySelectorAll("[data-inv-key]").forEach(function (el) {
      var key = el.dataset.invKey;
      if (!(key in data)) return;
      if (el.dataset.invType === "bool") {
        el.checked = !!data[key];
      } else {
        el.value = data[key] == null ? "" : data[key];
      }
    });
    // جدول الترقيم (كائن متداخل — معاملة خاصة)
    var numbering = data.numbering || {};
    root.querySelectorAll("[data-numbering-doc]").forEach(function (tr) {
      var docKey = tr.dataset.numberingDoc;
      var cfg = numbering[docKey] || {};
      var prefixEl = tr.querySelector('[data-num-field="prefix"]');
      var suffixEl = tr.querySelector('[data-num-field="suffix"]');
      var digitsEl = tr.querySelector('[data-num-field="digits"]');
      if (prefixEl) prefixEl.value = cfg.prefix || "";
      if (suffixEl) suffixEl.value = cfg.suffix || "";
      if (digitsEl) digitsEl.value = cfg.digits != null ? cfg.digits : 5;
    });
    _invRenderUnitsList(data.measurement_units || []);
    _invRenderPermitsList("receipt", data.receipt_permits || []);
    _invRenderPermitsList("issue", data.issue_permits || []);
    _invRenderPriceFormulasList(data.price_formulas || []);
  }

  // ── تجميع القيم الحالية من كل حقول الـ DOM لصياغة payload الحفظ ──
  function _invSetGatherFromUI() {
    var root = document.getElementById("invset-panels");
    var out = {};
    if (!root) return out;
    root.querySelectorAll("[data-inv-key]").forEach(function (el) {
      var key = el.dataset.invKey;
      if (el.dataset.invType === "bool") {
        out[key] = !!el.checked;
      } else if (el.dataset.invType === "number") {
        out[key] = Number(el.value || 0);
      } else {
        out[key] = el.value || "";
      }
    });
    var numbering = {};
    root.querySelectorAll("[data-numbering-doc]").forEach(function (tr) {
      var docKey = tr.dataset.numberingDoc;
      var prefixEl = tr.querySelector('[data-num-field="prefix"]');
      var suffixEl = tr.querySelector('[data-num-field="suffix"]');
      var digitsEl = tr.querySelector('[data-num-field="digits"]');
      numbering[docKey] = {
        prefix: prefixEl ? prefixEl.value || "" : "",
        suffix: suffixEl ? suffixEl.value || "" : "",
        digits: digitsEl ? Number(digitsEl.value || 5) : 5,
      };
    });
    out.numbering = numbering;
    out.measurement_units = _invGatherUnits();
    out.receipt_permits = _invGatherPermits("receipt");
    out.issue_permits = _invGatherPermits("issue");
    out.price_formulas = _invGatherPriceFormulas();
    return out;
  }

  // ── تاب السجل (Lazy — يتحمّل أول ما التاب يتفتح، مش مع باقي الإعدادات) ──
  function _invSetLoadLogIfNeeded() {
    if (_invSetLogLoaded) return;
    var listEl = document.getElementById("invset-log-list");
    if (!listEl) return;
    _invSetLogLoaded = true;
    _gsr("getAuditLog", [50, { table: "InventorySettings" }], {
      label: "InventorySettings.auditLog",
      onSuccess: function (res) {
        var rows = (res && res.success && res.data) || [];
        if (!rows.length) {
          listEl.innerHTML =
            '<div class="invset-panel-placeholder"><p>لا يوجد تغييرات مسجّلة بعد</p></div>';
          return;
        }
        listEl.innerHTML =
          '<table class="invset-num-table"><thead><tr>' +
          "<th>التاريخ</th><th>المستخدم</th><th>التفاصيل</th>" +
          "</tr></thead><tbody>" +
          rows
            .map(function (r) {
              return (
                "<tr><td>" +
                (r.timestamp || "") +
                "</td><td>" +
                (r.user || "") +
                "</td><td>" +
                (r.details || "") +
                "</td></tr>"
              );
            })
            .join("") +
          "</tbody></table>";
      },
      onError: function () {
        _invSetLogLoaded = false; // يسمح بمحاولة تانية لو فشل
        listEl.innerHTML =
          '<div class="invset-panel-placeholder"><p>تعذّر تحميل السجل</p></div>';
      },
    });
  }

  function _invSetLoad() {
    _gsr("getInventorySettings", [APP.currentUser.username, SESSION ? SESSION.token : null], {
      label: "InventorySettings.get",
      onSuccess: function (res) {
        if (res && res.success) {
          _invSetCurrentData = res.data;
          _invSetApplyToUI(_invSetCurrentData);
        }
      },
      onError: function () {
        if (typeof showToast === "function") {
          showToast("تعذّر تحميل إعدادات المخزون", "error");
        }
      },
    });
  }

  function _invSetSave() {
    var gathered = _invSetGatherFromUI();
    var payload = {
      callerUser: APP.currentUser.username,
      settings: gathered,
    };
    _gsr("saveInventorySettings", [payload, SESSION ? SESSION.token : null], {
      label: "InventorySettings.save",
      onSuccess: function (res) {
        if (res && res.success) {
          _invSetCurrentData = res.data;
          _invSetApplyToUI(_invSetCurrentData);
          if (typeof showToast === "function") {
            showToast("تم حفظ إعدادات المخزون", "success");
          }
        } else {
          if (typeof showToast === "function") {
            showToast((res && res.message) || "فشل الحفظ", "error");
          }
        }
      },
      onError: function () {
        if (typeof showToast === "function") {
          showToast("خطأ في الاتصال أثناء الحفظ", "error");
        }
      },
    });
  }

  function _invSetResetToDefault() {
    showConfirm({
      title: "استرجاع الإعدادات الافتراضية",
      message: "هل تريد استرجاع كل إعدادات المخزون للقيم الافتراضية؟",
      confirmText: "استرجاع",
      confirmClass: "btn-danger",
      onConfirm: function () {
        _gsr(
          "resetInventorySettings",
          [{ callerUser: APP.currentUser.username }, SESSION ? SESSION.token : null],
          {
            label: "InventorySettings.reset",
            onSuccess: function (res) {
              if (res && res.success) {
                _invSetCurrentData = res.data;
                _invSetApplyToUI(_invSetCurrentData);
                if (typeof showToast === "function") {
                  showToast("تم استرجاع الإعدادات الافتراضية", "success");
                }
              } else {
                if (typeof showToast === "function") {
                  showToast((res && res.message) || "فشل الاسترجاع", "error");
                }
              }
            },
            onError: function () {
              if (typeof showToast === "function") {
                showToast("خطأ في الاتصال", "error");
              }
            },
          },
        );
      },
    });
  }
</script>
