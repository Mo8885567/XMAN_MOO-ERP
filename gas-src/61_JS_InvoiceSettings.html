    );
  }

  function _isetRenderTypesList(types) {
    var container = document.getElementById("iset-types-list");
    if (!container) return;
    container.innerHTML = (types || [])
      .map(function (t, i) {
        return (
          '<div class="invset-field-row" data-itype-row data-itype-index="' +
          i +
          '">' +
          '<div class="invset-field-label" style="flex:1;display:flex;align-items:center;gap:8px">' +
          '<input class="input invset-input-sm" data-itype-field="key" placeholder="key" value="' +
          (t.key || "") +
          '" style="width:130px">' +
          '<input class="input invset-input-sm" data-itype-field="label" placeholder="الاسم المعروض" value="' +
          (t.label || "") +
          '" style="width:170px">' +
          '<label class="invset-switch"><input type="checkbox" data-itype-field="enabled" ' +
          (t.enabled !== false ? "checked" : "") +
          '><span class="invset-switch-track"><span class="invset-switch-thumb"></span></span></label>' +
          "</div>" +
          '<button type="button" class="btn btn-sm btn-outline-danger" data-remove-itype>' +
          '<i class="ti ti-trash"></i></button>' +
          "</div>"
        );
      })
      .join("");
    container.querySelectorAll("[data-remove-itype]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        btn.closest("[data-itype-row]").remove();
      });
    });
  }

  function _isetGatherTypes() {
    var container = document.getElementById("iset-types-list");
    if (!container) return [];
    var out = [];
    container.querySelectorAll("[data-itype-row]").forEach(function (row) {
      var keyEl = row.querySelector('[data-itype-field="key"]');
      var labelEl = row.querySelector('[data-itype-field="label"]');
      var enabledEl = row.querySelector('[data-itype-field="enabled"]');
      var key = keyEl ? keyEl.value.trim() : "";
      if (!key) return;
      out.push({ key: key, label: (labelEl ? labelEl.value.trim() : "") || key, enabled: enabledEl ? !!enabledEl.checked : true });
    });
    return out;
  }

  function _isetRenderPricePriority(order) {
    var el = document.getElementById("iset-price-priority-list");
    if (!el) return;
    var labels = _isetRenderPriceLabels();
    el.innerHTML = (order || [])
      .map(function (k) {
        return '<li data-priority-key="' + k + '" style="padding:6px 0;cursor:grab">↕ ' + (labels[k] || k) + "</li>";
      })
      .join("");
    // ترتيب بسيط بالسحب غير متاح هنا (خارج نطاق آمن)؛ الترتيب يتغيّر عبر
    // الأزرار ▲▼ التالية لضمان توافق بدون مكتبة Drag&Drop خارجية
    el.querySelectorAll("li").forEach(function (li, idx) {
      li.innerHTML +=
        ' <button type="button" class="btn btn-sm" data-move="up" style="margin-inline-start:10px">▲</button>' +
        '<button type="button" class="btn btn-sm" data-move="down">▼</button>';
    });
    el.querySelectorAll('[data-move="up"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var li = btn.closest("li");
        var prev = li.previousElementSibling;
        if (prev) el.insertBefore(li, prev);
      });
    });
    el.querySelectorAll('[data-move="down"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var li = btn.closest("li");
        var next = li.nextElementSibling;
        if (next) el.insertBefore(next, li);
      });
    });
  }

  function _isetGatherPricePriority() {
    var el = document.getElementById("iset-price-priority-list");
    if (!el) return [];
    return Array.prototype.map.call(el.querySelectorAll("li"), function (li) {
      return li.dataset.priorityKey;

  function bindInvoiceSettings() {
    if (_isetTabsCtrl && _isetTabsCtrl.destroy) _isetTabsCtrl.destroy();
    _isetTabsCtrl = TabEngine.init({
      scope: document.getElementById("iset-tabs").parentElement,
      tabSelector: ".invset-tab",
      panelPrefix: "iset-panel-",
      activeClass: "active",
    });

    var saveBtn = document.getElementById("iset-save-btn");
    var resetBtn = document.getElementById("iset-reset-btn");
    if (saveBtn) saveBtn.addEventListener("click", _isetSave);
    if (resetBtn) resetBtn.addEventListener("click", _isetResetToDefault);

    var addTypeBtn = document.getElementById("iset-add-type-btn");
    if (addTypeBtn) {
      addTypeBtn.addEventListener("click", function () {
        var current = _isetGatherTypes();
        current.push({ key: "", label: "", enabled: true });
        _isetRenderTypesList(current);
      });
    }
    var addPmBtn = document.getElementById("iset-add-pm-btn");
    if (addPmBtn) {
      addPmBtn.addEventListener("click", function () {
        var current = _isetGatherPm();
        current.push({ key: "", label: "", account_key: "", enabled: true });
        _isetRenderPmList(current);
      });
    }
    var addTplBtn = document.getElementById("iset-add-template-btn");
    if (addTplBtn) {
      addTplBtn.addEventListener("click", function () {
        var current = _isetGatherTemplates();
        current.push({ key: "", label: "" });
        _isetRenderTemplatesList(current);
      });
    }

    _isetLogLoaded = false;
    var logTabBtn = document.querySelector('#iset-tabs .invset-tab[data-tab="log"]');
    if (logTabBtn) logTabBtn.addEventListener("click", _isetLoadLogIfNeeded);

    _isetLoad();
  }

  function _isetApplyToUI(data) {
    if (!data) return;
    var root = document.getElementById("iset-panels");
    if (!root) return;
    root.querySelectorAll("[data-iset-key]").forEach(function (el) {
      var key = el.dataset.isetKey;
      if (!(key in data)) return;
      if (el.dataset.isetType === "bool") {
        el.checked = !!data[key];
      } else {
        el.value = data[key] == null ? "" : String(data[key]);
      }
    });
    _isetRenderTypesList(data.invoice_types || []);
    _isetRenderPricePriority(data.price_priority || []);
    _isetRenderPmList(data.payment_methods || []);
    _isetRenderTemplatesList(data.print_templates || []);
  }

  function _isetGatherFromUI() {
    var root = document.getElementById("iset-panels");
    var out = {};
    if (!root) return out;
    root.querySelectorAll("[data-iset-key]").forEach(function (el) {
      var key = el.dataset.isetKey;
      if (el.dataset.isetType === "bool") {
        out[key] = !!el.checked;
      } else if (el.dataset.isetType === "number") {
        out[key] = Number(el.value || 0);
      } else if (key === "prices_include_tax") {
        out[key] = el.value === "true";
      } else {
        out[key] = el.value || "";
      }
    });
    out.invoice_types = _isetGatherTypes();
    out.price_priority = _isetGatherPricePriority();
    out.payment_methods = _isetGatherPm();
    out.print_templates = _isetGatherTemplates();
    return out;
  }

  function _isetLoadLogIfNeeded() {
    if (_isetLogLoaded) return;
    var listEl = document.getElementById("iset-log-list");
    if (!listEl) return;
    _isetLogLoaded = true;
    _gsr("getAuditLog", [50, { table: "InvoiceSettings" }], {
      label: "InvoiceSettings.auditLog",
      onSuccess: function (res) {
        var rows = (res && res.success && res.data) || [];
        if (!rows.length) {
          listEl.innerHTML = '<div class="invset-panel-placeholder"><p>لا يوجد تغييرات مسجّلة بعد</p></div>';
          return;
        }
        listEl.innerHTML =
          '<table class="invset-num-table"><thead><tr><th>التاريخ</th><th>المستخدم</th><th>التفاصيل</th></tr></thead><tbody>' +
          rows
            .map(function (r) {
              return "<tr><td>" + (r.timestamp || "") + "</td><td>" + (r.user || "") + "</td><td>" + (r.details || "") + "</td></tr>";
            })
            .join("") +
          "</tbody></table>";
      },
      onError: function () {
        _isetLogLoaded = false;
        listEl.innerHTML = '<div class="invset-panel-placeholder"><p>تعذّر تحميل السجل</p></div>';
      },
    });
  }

  function _isetLoad() {
    _gsr("getInvoiceSettings", [APP.currentUser.username, SESSION ? SESSION.token : null], {
      label: "InvoiceSettings.get",
      onSuccess: function (res) {
        if (res && res.success) {
          _isetCurrentData = res.data;
          _isetApplyToUI(_isetCurrentData);
        }
      },
      onError: function () {
        if (typeof showToast === "function") showToast("تعذّر تحميل إعدادات الفواتير", "error");
      },
    });
  }

  function _isetSave() {
    var payload = { callerUser: APP.currentUser.username, settings: _isetGatherFromUI() };
    _gsr("saveInvoiceSettings", [payload, SESSION ? SESSION.token : null], {
      label: "InvoiceSettings.save",
      onSuccess: function (res) {
        if (res && res.success) {
          _isetCurrentData = res.data;
          _isetApplyToUI(_isetCurrentData);
          if (typeof showToast === "function") showToast("تم حفظ إعدادات الفواتير", "success");
        } else if (typeof showToast === "function") {
          showToast((res && res.message) || "فشل الحفظ", "error");
        }
      },
      onError: function () {
        if (typeof showToast === "function") showToast("خطأ في الاتصال أثناء الحفظ", "error");
      },
    });
  }

  function _isetResetToDefault() {
    showConfirm({
      title: "استرجاع الإعدادات الافتراضية",
      message: "هل تريد استرجاع كل إعدادات الفواتير للقيم الافتراضية؟",
      confirmText: "استرجاع",
      confirmClass: "btn-danger",
      onConfirm: function () {
        _gsr("resetInvoiceSettings", [{ callerUser: APP.currentUser.username }, SESSION ? SESSION.token : null], {
          label: "InvoiceSettings.reset",
          onSuccess: function (res) {
            if (res && res.success) {
              _isetCurrentData = res.data;
              _isetApplyToUI(_isetCurrentData);
              if (typeof showToast === "function") showToast("تم استرجاع الإعدادات الافتراضية", "success");
            } else if (typeof showToast === "function") {
              showToast((res && res.message) || "فشل الاسترجاع", "error");
            }
          },
          onError: function () {
            if (typeof showToast === "function") showToast("خطأ في الاتصال", "error");
          },
        });
      },
    });
  }
</script>
