<script>
  // ════════════════════════════════════════════════════════════════
  // Core_UIManagers.html — [REFACTOR-P7] نُقلت من 02_JS_UI_Shell.html
  // (نقل نصي بحت لدوال Toast/Modal/Drawer/Dropdown/Sidebar المتناثرة،
  // صفر تغيير في المنطق أو أسماء الدوال — كل الاستدعاءات القديمة
  // فضلت تعمل زي ما هي لأن كل ملفات Index.html بتتحمّل في Global
  // Scope واحد). راجع تقرير Architecture Audit 2026-07-03 — المرحلة 7.
  // ════════════════════════════════════════════════════════════════

  // ════════════════════════════════════════════════════════════════
  // [ARCH-AUDIT-2026-07-17] initSearchableIdPanel — توحيد منطق فتح/غلق
  // الـ Searchable Dropdown (كلاسات os-id-*) اللي كان مكرر Byte-Identical
  // في 3 أماكن: 05_JS_Production.html (bindPOItemDropdown +
  // bindPOItemDropdownEdit) و06_JS_Catalog_Stock.html (bindItemDropdown).
  // صفر تغيير في السلوك — نفس الكلاسات، نفس التوقيت (50ms focus delay).
  // ════════════════════════════════════════════════════════════════
  function initSearchableIdPanel(trigger, panel, searchEl) {
    function openPanel() {
      panel.classList.add("os-id-open");
      trigger.classList.add("os-id-active");
      if (searchEl)
        setTimeout(function () {
          searchEl.focus();
        }, 50);
    }
    function closePanel() {
      panel.classList.remove("os-id-open");
      trigger.classList.remove("os-id-active");
    }
    return { openPanel: openPanel, closePanel: closePanel };
  }

  function toggleNotifDropdown() {
    var dd = document.getElementById("notif-dropdown");
    var bd = document.getElementById("notif-backdrop");
    if (!dd) return;
    var isOpen = dd.classList.contains("open");
    if (isOpen) {
      closeNotifDropdown();
    } else {
      dd.classList.add("open");
      if (bd) bd.classList.add("show");
      _renderNotifList();
    }
  }

  function closeNotifDropdown() {
    var dd = document.getElementById("notif-dropdown");
    var bd = document.getElementById("notif-backdrop");
    if (dd) dd.classList.remove("open");
    if (bd) bd.classList.remove("show");
  }

  function _closeAllDropdowns() {
    document.querySelectorAll(".nav-grp-toggle").forEach(function (t) {
      var gId = t.id.replace("-toggle", "");
      var m = document.getElementById(gId + "-menu");
      if (m) m.classList.remove("open");
      t.classList.remove("open", "has-active");
    });
    document
      .querySelectorAll(".nav-item.active, .nav-sub-item.active")
      .forEach(function (x) {
        x.classList.remove("active");
      });
  }

  function openSidebar() {
    var sb = document.getElementById("main-sidebar");
    var bd = document.getElementById("sidebar-backdrop");
    var btn = document.getElementById("sidebar-toggle");
    if (sb) sb.classList.add("open");
    if (bd) bd.classList.add("visible");
    if (btn) btn.classList.add("is-open"); // ← hamburger → X + يتحرك مع السايدبار
    document.body.style.overflow = "hidden";
  }

  function closeSidebar() {
    var sb = document.getElementById("main-sidebar");
    var bd = document.getElementById("sidebar-backdrop");
    var btn = document.getElementById("sidebar-toggle");
    if (sb) sb.classList.remove("open");
    if (bd) bd.classList.remove("visible");
    if (btn) btn.classList.remove("is-open"); // ← X → hamburger
    document.body.style.overflow = "";
  }

  // ════════════════════════════════════════════════════════════════
  // [SIDEBAR-COLLAPSE] طي/فتح السايدبار (نمط ERP احترافي — ديسكتوب)
  // - الحالة بتتحفظ في localStorage وترجع تلقائياً بعد أي تحديث/لوجين.
  // - شغالة بس فوق 860px (Desktop). تحت كده السايدبار بيرجع لنظام
  //   الـ Drawer الأصلي زي ما هو من غير أي تغيير في منطقه.
  // - صفر تعديل على دوال أو منطق التنقل الحالي — تعتمد بالكامل على
  //   متغير الـ CSS ‎--sidebar-w‎ اللي أصلاً بيتحكم في المحتوى/الشريط
  //   العلوي/الـ Drawers، فكل حاجة بتتوسّع تلقائياً بنفس الحركة.
  // ════════════════════════════════════════════════════════════════
  var SIDEBAR_COLLAPSE_KEY = "moo_sidebar_collapsed";

  function _isSidebarDesktopViewport() {
    return window.innerWidth > 860;
  }

  function _getSidebarCollapsedPref() {
    try {
      return localStorage.getItem(SIDEBAR_COLLAPSE_KEY) === "1";
    } catch (e) {
      return false;
    }
  }

  function _setSidebarCollapsedPref(collapsed) {
    try {
      localStorage.setItem(SIDEBAR_COLLAPSE_KEY, collapsed ? "1" : "0");
    } catch (e) {}
  }

  // بيطبّق الحالة على الـ DOM فعليًا. save=false يُستخدم وقت المزامنة
  // مع تغيير حجم الشاشة عشان منكتبش نفس القيمة في localStorage تاني.
  function applySidebarCollapsed(collapsed, save) {
    var sb = document.getElementById("main-sidebar");
    var layout = document.querySelector(".app-layout");
    var btn = document.getElementById("sidebar-collapse-btn");
    if (!sb) return;

    if (collapsed) {
      sb.classList.add("collapsed");
      if (layout) layout.classList.add("sidebar-collapsed");
      // نضبط المتغير على documentElement مش بس .app-layout، عشان أي
      // عنصر بيتحط على document.body مباشرة (Drawers/Modals اللي بتحسب
      // مساحتها بناءً على --sidebar-w) يتوسّع هو كمان تلقائيًا ومنسيبش
      // مساحة بيضاء فاضية بين السايدبار المطوي وبين هذه العناصر.
      if (_isSidebarDesktopViewport()) {
        document.documentElement.style.setProperty("--sidebar-w", "68px");
      }
    } else {
      sb.classList.remove("collapsed");
      if (layout) layout.classList.remove("sidebar-collapsed");
      document.documentElement.style.removeProperty("--sidebar-w");
    }
    if (btn) {
      btn.classList.toggle("is-collapsed", collapsed);
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      btn.title = collapsed
        ? I18N.t("UI_SIDEBAR_OPEN")
        : I18N.t("UI_SIDEBAR_COLLAPSE");
      btn.setAttribute(
        "aria-label",
        collapsed ? I18N.t("UI_SIDEBAR_OPEN") : I18N.t("UI_SIDEBAR_COLLAPSE"),
      );
    }
    if (save !== false) _setSidebarCollapsedPref(collapsed);
  }

  function toggleSidebarCollapse() {
    if (!_isSidebarDesktopViewport()) return; // على الموبايل مفيش طي — Drawer بس
    var sb = document.getElementById("main-sidebar");
    var isCollapsed = !!(sb && sb.classList.contains("collapsed"));
    applySidebarCollapsed(!isCollapsed);
  }

  // بيتنادى مرة واحدة بعد أول renderLayout() — يرجّع آخر حالة محفوظة
  function _initSidebarCollapseState() {
    var wantsCollapsed = _getSidebarCollapsedPref();
    if (wantsCollapsed && _isSidebarDesktopViewport()) {
      applySidebarCollapsed(true, false);
    }
  }

  // بيزامن حالة الطي مع تغيير حجم الشاشة (Desktop ⇄ Mobile) عشان
  // العرض المطوي (68px) ميتسربش لنظام الـ Drawer على الموبايل
  function _syncSidebarCollapseWithViewport() {
    var sb = document.getElementById("main-sidebar");
    if (!sb) return;
    if (_isSidebarDesktopViewport()) {
      if (_getSidebarCollapsedPref()) applySidebarCollapsed(true, false);
    } else {
      // على الموبايل لازم نشيل كلاس collapsed ونمسح المتغير --sidebar-w
      // المضبوط يدويًا (من غير ما نلمس التفضيل المحفوظ) عشان الـ Drawer
      // يرجع يستخدم القيمة الأصلية اللي بتحددها الـ media query بتاعته
      sb.classList.remove("collapsed");
      var layout = document.querySelector(".app-layout");
      if (layout) layout.classList.remove("sidebar-collapsed");
      document.documentElement.style.removeProperty("--sidebar-w");
    }
  }

  // [NO-TOAST-OVER-MODAL-2026-07-28] حل جذري: أي modal/drawer مفتوح
  // (openStyledDrawer أو openModal القديم) بيخلي #ai-fab بـ display:none،
  // وده كان يخلي _positionBubble تحسب مكان الأيقونة كـ (0,0) (لأن
  // getBoundingClientRect بيرجّع أصفار لعنصر display:none)، فالتوست
  // كان بيظهر في أعلى يسار الشاشة فوق المودال نفسه — رغم إن z-index
  // بابل التوست (99995) مصمم أصلاً "يبقى فوق أي overlay أو modal".
  // الحل الجذري مش تصحيح مكان الظهور، لكن منع الظهور فوق أي مودال/دروار
  // خالص: أي توست بيتطلب وقت ما فيه مودال/دروار مفتوح بيتأجل لحد ما
  // يقفل (_flushDeferredToasts بتتنادى من closeStyledDrawer/closeModal)،
  // فمفيش أي رسالة أو إشعار يظهر فوق أي شاشة منسدلة إطلاقًا.
  var _deferredToastQueue = [];
  function _isModalOrDrawerOpen() {
    return !!(
      document.getElementById("edit-drawer") ||
      document.getElementById("drawer-backdrop") ||
      document.getElementById("modal-overlay") ||
      document.querySelector(".modal-overlay")
    );
  }
  function _flushDeferredToasts() {
    if (!_deferredToastQueue.length) return;
    if (_isModalOrDrawerOpen()) return; // لسه فيه مودال/دروار تاني مفتوح
    var pending = _deferredToastQueue;
    _deferredToastQueue = [];
    pending.forEach(function (it) {
      _enqueueToast(it.msg, it.type, it.duration, it.urgent, it.entryId);
    });
  }

  function _enqueueToast(msg, type, duration, urgent, entryId) {
    type = type || "info";
    // [NO-TOAST-OVER-MODAL-2026-07-28] فيه مودال/دروار مفتوح دلوقتي —
    // أجّل الرسالة لحد ما يقفل بدل ما تظهر فوقه. رسائل "loading" بس
    // مُستبعدة من التأجيل لأنها مرتبطة بعملية شغالة فعليًا (زي رفع صورة
    // داخل نفس المودال) ومفيش قيمة من تأجيلها لحد ما يقفل المودال.
    if (type !== "loading" && _isModalOrDrawerOpen()) {
      _deferredToastQueue.push({
        msg: msg,
        type: type,
        duration: duration,
        urgent: urgent,
        entryId: entryId,
      });
      return;
    }
    // مدة الإشعار: افتراضي 5000ms، الحد الأقصى 8000ms
    var _DEFAULT_DURATIONS = {
      error: 6000,
      warning: 5000,
      success: 4500,
      info: 5000,
    };
    // [TOAST-LOADING-2026-07] loading = ثابت بدون مؤقّت (بيقفل فقط عبر
    // finishLoadingToast عند انتهاء العملية فعليًا) — لا يخضع لسقف 8000ms.
    duration =
      type === "loading"
        ? Infinity
        : Math.min(duration || _DEFAULT_DURATIONS[type] || 5000, 8000);
    var now = Date.now();

    // [TOAST-LOADING-2026-07] رسائل التحميل لا تدخل في منطق dedup/merge
    // العادي (المبني على مؤقّتات ثابتة) — هي مؤقتة بطبيعتها ولازم يكون
    // فيه واحدة بس شغّالة في نفس اللحظة. لو فيه loading toast معروض
    // حاليًا أو مُجدوَل بالفعل، حدّث نصه في مكانه بدل ما تضيف نسخة تانية
    // تقف في الطابور وتأخّر ظهور رسالة النتيجة.
    if (type === "loading") {
      if (_activeToastType === "loading") {
        var bubbleNow = _ensureBubble();
        var textEl = bubbleNow.querySelector(".fab-bubble-text");
        if (textEl) textEl.textContent = msg;
        return;
      }
      var queuedLoading = _toastQueue.find(function (it) {
        return it.type === "loading";
      });
      if (queuedLoading) {
        queuedLoading.msg = msg;
        return;
      }
    }

    // لو urgent (خطأ حرج) — امسح كل ما هو أقل أولوية وضعه أولاً
    if (urgent) {
      _toastQueue = _toastQueue.filter(function (it) {
        return _TOAST_PRIORITY[it.type] >= _TOAST_PRIORITY.error;
      });
    }

    // ① منع التكرار: لو نفس الرسالة (نفس النص + النوع) ظهرت/مُجدولة
    //    خلال _DEDUP_WINDOW_MS الأخيرة — لا نُسقطها بصمت (كان ده الخطأ:
    // لو مسحت صنفين ورا بعض بنص رسالة عام زي "تم حذف الصنف "، الرسالة
    //    التانية كانت بتتجاهل تمامًا من غير أي أثر، فحاسس إن العملية
    //    التانية "ماظهرتش"). دلوقتي بدل الإسقاط الصامت، بنزوّد عداد ونعرض
    //    نفس الرسالة تانية بعلامة (×N) — يفرّق بين "نداء مكرر بالغلط"
    //    (اللي المستخدم مش هيلاحظ فرق) و"فعل شرعي اتكرر" (هيشوف ×2 كدليل).
    var dupInQueue = _toastQueue.find(function (it) {
      return it.msg === msg && it.type === type;
    });
    if (dupInQueue) {
      dupInQueue.count = (dupInQueue.count || 1) + 1;
      dupInQueue.msg = _mergeToastMsg(dupInQueue, msg);
      if (entryId) dupInQueue.entryId = entryId; // خُد أحدث ربط بالإشعار
      _sortToastQueue();
      return;
    }
    if (
      _lastShownToast &&
      _lastShownToast.msg === msg &&
      _lastShownToast.type === type &&
      now - _lastShownToast.at < _DEDUP_WINDOW_MS
    ) {
      // [BUGFIX-SILENT-DUP] كان بيرجع من غير ما يعمل حاجة (الرسالة التانية
      // بتضيع نهائيًا). دلوقتي بنعرض توست جديد بعلامة العدد التراكمي بدل
      // الإسقاط الكامل، عشان كل عملية حقيقية تاخد أثر مرئي.
      _lastShownToast.count = (_lastShownToast.count || 1) + 1;
      _toastQueue.push({
        msg: _mergeToastMsg(_lastShownToast, msg),
        type: type,
        duration: duration,
        groupKey: null,
        count: _lastShownToast.count,
        enqueuedAt: now,
        entryId: entryId,
      });
      _sortToastQueue();
      _bumpUnreadBadge();
      _processToastQueue();
      return;
    }

    // ② دمج الإشعارات المتشابهة من نفس "العائلة" (نفس الـ groupKey)
    var groupKey = _toastGroupKey(msg, type);
    if (groupKey) {
      var sameGroup = _toastQueue.find(function (it) {
        return it.groupKey === groupKey;
      });
      if (sameGroup) {
        sameGroup.count = (sameGroup.count || 1) + 1;
        sameGroup.msg = _mergeToastMsg(sameGroup, msg);
        if (entryId) sameGroup.entryId = entryId;
        _sortToastQueue();
        return;
      }
    }

    _toastQueue.push({
      msg: msg,
      type: type,
      duration: duration,
      groupKey: groupKey,
      count: 1,
      enqueuedAt: now,
      entryId: entryId,
    });

    _sortToastQueue();
    _bumpUnreadBadge();
    _processToastQueue();
  }

  function _sortToastQueue() {
    _toastQueue = _toastQueue
      .map(function (it, idx) {
        it._idx = idx;
        return it;
      })
      .sort(function (a, b) {
        var pa = _TOAST_PRIORITY[a.type] || 0;
        var pb = _TOAST_PRIORITY[b.type] || 0;
        if (pa !== pb) return pb - pa; // الأعلى أولوية أولاً
        return a._idx - b._idx; // ثبات الترتيب
      });
  }

  function _toastGroupKey(msg, type) {
    if (type === "info" || type === "success") {
      // مثال: " تم حفظ الصنف" + " تم حفظ الصنف" → نفس المجموعة
      return type + "::" + msg.replace(/[\d٠-٩]+/g, "#");
    }
    return null; // الأخطاء/التحذيرات لا تُدمج — كل واحدة مهمة
  }

  function _mergeToastMsg(item, newMsg) {
    var base = newMsg.replace(/\s*\(×\d+\)\s*$/, "");
    return base + " (×" + item.count + ")";
  }

  function _processToastQueue() {
    if (_toastBusy || _toastQueue.length === 0) return;
    _toastBusy = true;
    var item = _toastQueue.shift();
    _lastShownToast = { msg: item.msg, type: item.type, count: item.count || 1, at: Date.now() };
    _showToastImmediate(item.msg, item.type, item.duration, function () {
      _toastBusy = false;
      _consumeUnreadBadge();
      // فاصل قصير 150ms بين الرسايل يريح العين
      setTimeout(_processToastQueue, 150);
    }, item.entryId);
  }

  function _setAIFabAboveToast(active) {
    // مُعطَّل: الـ fab لا يتحرك — الـ bubble وحده يظهر/يختفي
  }

  function _toastFallbackMsgs() {
    return {
      error: I18N.t("UI_TOAST_ERROR_FALLBACK"),
      warning: I18N.t("UI_TOAST_WARNING_FALLBACK"),
      success: I18N.t("UI_TOAST_SUCCESS_FALLBACK"),
      info: I18N.t("UI_TOAST_INFO_FALLBACK"),
    };
  }

  function showToast(msg, type, duration, urgent, entryId) {
    type = type || "info";
    // [FIX] أي استدعاء لـ showToast برسالة فاضية/undefined (زي e.message
    // اللي بيرجع فاضي أحيانًا من google.script.run، أو r.message مفقودة من
    // رد الباك إند) كان بيطلّع فقاعة فاضية بصوت بس من غير نص — فحسّها
    // المستخدم "صوت من غير رسالة". دلوقتي أي رسالة فاضية بتاخد نص افتراضي
    // واضح حسب نوعها، فمفيش أي حالة الفقاعة تظهر فاضية.
    if (!msg || !String(msg).trim()) {
      msg = _toastFallbackMsgs()[type] || _toastFallbackMsgs().info;
    }
    // §AS — تشغيل صوت حسب نوع الإشعار
    if (typeof AS !== "undefined") {
      try {
        AS._onToastType(type || "info", msg);
      } catch (e) {}
    }
    // [NOTIF-TOAST-LINK] entryId (لو موصول من NotificationEngine) بيربط
    // الفقاعة دي بسجل موحّد في Notification Center — الضغط عليها بينقل
    // المستخدم لمكان الحدث بدل ما تكون مجرد رسالة عابرة.
    _enqueueToast(msg, type, duration, urgent, entryId);
  }

  // [TOAST-LOADING-2026-07] finishLoadingToast — الاستخدام المتوقع:
  //   showToast("جاري الحفظ...", "loading");
  //   callServer(..., function (res) {
  //     finishLoadingToast(res.success ? "تم الحفظ بنجاح" : res.message,
  //                         res.success ? "success" : "error");
  //   });
  // بتقفل إشعار التحميل النشط فورًا (بدل ما تستنى مؤقّت ثابت زي أي إشعار
  // عادي) وبعدها تعرض رسالة النتيجة كإشعار طبيعي بالطابور — عشان
  // "جاري الحفظ..." يفضل ظاهر بالظبط لحد ما العملية تخلّص فعليًا، مش
  // لحد ما مؤقّت وهمي يخلّص.
  function finishLoadingToast(msg, type) {
    // لو فيه loading toast لسه في الطابور ماظهرش بعد (نادر لكن ممكن لو
    // العملية خلصت بسرعة قبل ما الطابور يوصله)، امسحه بدل ما نستنى دوره
    if (_toastQueue.length) {
      _toastQueue = _toastQueue.filter(function (it) {
        return it.type !== "loading";
      });
    }
    if (_activeToastType === "loading" && typeof _activeToastDismiss === "function") {
      _activeToastDismiss();
    }
    if (msg) showToast(msg, type);
  }

  // إغلاق إشعار التحميل بدون عرض رسالة نتيجة بعده (مثلاً لو المستخدم لغى العملية)
  function dismissLoadingToast() {
    finishLoadingToast(null);
  }

  // [SESSION-END-CLEAR-TOASTS] تقفل أي فقاعة توست ظاهرة دلوقتي فورًا،
  // ومسح أي رسايل تانية مستنية في الطابور — بتتنادى قبل إنهاء الجلسة
  // (تسجيل الخروج / انتهاء الجلسة تلقائيًا) عشان مفيش رسالة قديمة تفضل
  // معلّقة على الشاشة بعد ما المستخدم يطلع بره النظام.
  function dismissAllToasts() {
    _toastQueue = [];
    if (typeof _activeToastDismiss === "function") {
      _activeToastDismiss();
    }
    var bubble = document.getElementById("ai-fab-bubble") || null;
    if (!bubble && typeof _ensureBubble === "function") {
      // ماتنشئش bubble جديدة لو مفيش أي حاجة ظاهرة أصلاً
      bubble = null;
    }
    if (bubble) {
      bubble.style.animation = "none";
      bubble.style.display = "none";
    }
    _activeToastType = null;
    _activeToastDismiss = null;
  }

  function _showToastImmediate(msg, type, duration, onDone, entryId) {
    type = type || "info";
    // مدة الإشعار: افتراضي حسب النوع، الحد الأقصى 8000ms
    var _DEFAULT_DURATIONS = {
      error: 6000,
      warning: 5000,
      success: 4500,
      info: 5000,

  function openDrawer(html, widthPx) {
    closeDrawer(true); // فوري بدون animation لو فيه قديم
    // [FIX-MOBILE] إغلاق السايدبار قبل فتح الـ Drawer على موبايل
    if (window.innerWidth <= 860) closeSidebar();

    // إخفاء زرار المساعد الذكي
    var fab = document.getElementById("ai-fab");
    if (fab) fab.style.display = "none";

    // Backdrop
    var bg = document.createElement("div");
    bg.className = "drawer-backdrop";
    bg.id = "drawer-backdrop";
    bg.onclick = closeDrawer;
    document.body.appendChild(bg);

    // Drawer panel
    var drawer = document.createElement("div");
    drawer.className = "edit-drawer";
    drawer.id = "edit-drawer";
    if (widthPx === "full") {
      // [FULL-WIDTH] الدرج ياخد الشاشة كاملة، والمساحة الداخلية تملأ كل ما تبقى بعد السايدبار
      drawer.style.cssText = "width:100vw";
    } else if (widthPx) {
      // [FIX-MOBILE] inline style بـ CSS variable عشان media queries تقدر تغلب على الموبايل
      drawer.style.cssText =
        "--sd-width:" +
        widthPx +
        "px; width:min(calc(var(--sidebar-w) + " +
        widthPx +
        "px), 100vw)";
    }

    // نلف المحتوى في edit-drawer-inner عشان يبدأ بعد الـ sidebar
    var inner = document.createElement("div");
    inner.className = "edit-drawer-inner";
    // [FIX-MOBILE] بدل inline max-width نستخدم CSS variable عشان media queries تشتغل
    if (widthPx === "full") {
      inner.style.cssText = "max-width:none";
    } else if (widthPx)
      inner.style.cssText =
        "--sd-inner-max:" +
        widthPx +
        "px; max-width:var(--sd-inner-max," +
        widthPx +
        "px)";

    // [PERF] الـ drawer يظهر فوراً مع spinner خفيف
    // والمحتوى يتحشى في الـ frame التاني عشان الـ animation تبدأ فوراً
    inner.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;' +
      'padding:48px 0;height:100%;opacity:.4">' +
      '<i class="ti ti-loader-2" style="font-size:28px;animation:spin 0.8s linear infinite"></i>' +
      "</div>";
    inner.setAttribute("data-pending-html", "1");

    drawer.appendChild(inner);
    // نضيف للـ DOM أولاً عشان الـ animation تبدأ
    document.body.appendChild(drawer);

    // في الـ frame التاني نحشو المحتوى الحقيقي
    requestAnimationFrame(function () {
      inner.removeAttribute("data-pending-html");
      inner.innerHTML = html;
      // حماية تلقائية لأي حقل هاتف/كود/SKU/Barcode داخل هذا الدرج
      autoProtectTextNumberInputs(inner);
      // [SELECTION-ENGINE] openDrawer نظام عام تاني بيتصدّى له عدد كبير
      // من الشاشات (openItemModal، openWarehouseModal، openUserModal...)
      // بجانب openStyledDrawer — لازم يستفيد من نفس التوحيد.
      initCustomSelects(inner);
    });

    // ESC to close
    drawer._escHandler = function (e) {
      if (e.key === "Escape") closeDrawer();
    };
    document.addEventListener("keydown", drawer._escHandler);
  }

  function renderModalBox(opts) {
    opts = opts || {};
    var headerClass =
      "modal-header" + (opts.color ? " header-accent " + opts.color : "");
    var iconClass = "modal-icon" + (opts.iconClass ? " " + opts.iconClass : "");
    var closeFn = opts.closeFn || "closeModal()";

    var html = '<div class="modal-box">';
    html += '<div class="' + headerClass + '">';
    html += '<div class="modal-header-left">';
    if (opts.icon) {
      html +=
        '<div class="' +
        iconClass +
        '"' +
        (opts.iconStyle ? ' style="' + opts.iconStyle + '"' : "") +
        '><i class="ti ' +
        opts.icon +
        '"></i></div>';
    }
    html += "<div><h2>" + (opts.title || "") + "</h2>";
    if (opts.subtitle) {
      html += '<div class="modal-header-sub">' + opts.subtitle + "</div>";
    }
    html += "</div></div>";
    html +=
      '<button class="modal-close" onclick="' +
      closeFn +
      '"><i class="ti ti-x"></i></button>';
    html += "</div>";
    html += '<div class="modal-body">' + (opts.body || "") + "</div>";
    if (opts.footer) {
      html += '<div class="modal-actions">' + opts.footer + "</div>";
    }
    html += "</div>";
    return html;
  }

  function closeDrawer(immediate) {
    var drawer = document.getElementById("edit-drawer");
    var bg = document.getElementById("drawer-backdrop");
    if (!drawer && !bg) return;

    // إعادة ظهور زرار المساعد الذكي
    var fab = document.getElementById("ai-fab");
    if (fab) fab.style.display = "";

    // [FIX-BACKDROP-BLOCK] أوقف pointer-events فوراً عشان الـ backdrop
    // ميبلوكش الكليكات أثناء animation الإغلاق
    if (bg) bg.style.pointerEvents = "none";

    if (immediate) {
      if (drawer) drawer.remove();
      if (bg) bg.remove();
      // [NO-TOAST-OVER-MODAL-2026-07-28]
      if (typeof _flushDeferredToasts === "function") _flushDeferredToasts();
      return;
    }

    // Animate out — match 0.18s optimized animation
    if (drawer) {
      if (drawer._escHandler)
        document.removeEventListener("keydown", drawer._escHandler);
      drawer.classList.add("drawer-closing");
      setTimeout(function () {
        if (drawer && drawer.parentNode) drawer.remove();
        // [NO-TOAST-OVER-MODAL-2026-07-28]
        if (typeof _flushDeferredToasts === "function") _flushDeferredToasts();
      }, 200);
    }
    if (bg) {
      bg.style.transition = "opacity .18s ease";
      bg.style.opacity = "0";
      setTimeout(function () {
        if (bg && bg.parentNode) bg.remove();
      }, 190);
    }
  }
</script>
