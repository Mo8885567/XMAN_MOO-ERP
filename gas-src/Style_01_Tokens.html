    /* Colors */
    --bg: #eef2fb;

    /* Brand */

    /* Semantic */

    --success-soft: #ecfdf5;
    --success-dark: #059669;
    --warning: #f59e0b;

    /* Extra */

    --purple-soft: #f5f3ff;
    --orange: #f97316;
    --orange-soft: #fff7ed;
    --teal: #14b8a6;
    --teal-soft: #f0fdfa;

    /* ═══ Alias Tokens (Phase 2 — إصلاح متغيرات مُستخدَمة بدون تعريف) ═══
       هذه المتغيرات كانت تُستخدم في الكود (Style.html + ملفات الوحدات)
       دون أي تعريف فعلي، فكانت القاعدة تُسقَط بالكامل دون أي تأثير
       مرئي ظاهر دون فحص دقيق. رُبطت هنا بالتوكِن الأصلي المطابق دلاليًا
       حفاظًا على Single Source of Truth وبدون تعديل القيمة نفسها. */
    --bg1: var(
      --surface
    ); /* لوحات/صفحات واتساب (.wa-center-page وغيرها) — 9 مواضع */
    --bg2: var(--surface2); /* hover/badge backgrounds — 41 موضع */
    --bg3: var(--surface3); /* hover أزرار الفلتر بواتساب — 2 موضع */
    --surface1: var(--surface); /* بطاقات Skeleton Loader — 4 مواضع */
    --text1: var(--text); /* نص أساسي بمكوّنات متعددة — 85 موضع */
    --text-muted: var(
      --text3
    ); /* نص ثانوي خافت (labels/icons) — متوافق مع fallback الحالي */
    --hover: var(--surface2); /* متوافق مع نمط hover المعتمد بباقي النظام */
    --error: var(--danger); /* متوافق مع fallback الحالي var(--error,#ef4444) */
    --primary-soft: var(
      --accent-soft
    ); /* بطاقات/صفوف مُحدَّدة (cs-wh-card, pm-matrix, user-perm-row) — 19 موضع */

    /* Shadows */
    --shadow-xs: 0 1px 2px rgba(14, 21, 37, 0.05);
    --shadow-sm:
      0 1px 3px rgba(14, 21, 37, 0.07), 0 1px 2px rgba(14, 21, 37, 0.05);
    --shadow:
      0 4px 16px rgba(14, 21, 37, 0.08), 0 1px 4px rgba(14, 21, 37, 0.04);
    --shadow-md:
      0 8px 24px rgba(14, 21, 37, 0.1), 0 2px 8px rgba(14, 21, 37, 0.05);
    --shadow-lg:
      0 16px 48px rgba(14, 21, 37, 0.12), 0 4px 16px rgba(14, 21, 37, 0.06);
    --shadow-xl:
      0 24px 64px rgba(14, 21, 37, 0.15), 0 8px 24px rgba(14, 21, 37, 0.08);

    /* Border Radius */
    --radius-xs: 6px;
    --radius-xs-alt: 8px; /* يغطي استخدامات 8px (50+ موضع) — لا متغيّر مقابل قبل ذلك */

    --radius-md: 12px; /* يغطي استخدامات 12px (37+ موضع) */

    --radius-lg: 20px;
    --radius-xl: 28px;
    --radius-pill: 9999px; /* يغطي استخدامات 99px/999px (شارات/أزرار دائرية) */

    /* Layout */
    --sidebar-w: 300px;

    /* Transitions */
    --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);

    /* ── [FORM-UNIFY-P1] Form Control Tokens (2026-07-05) ──

       الأسماء البديلة .form-control/.form-input/.form-select).
       راجع Style_04_Components.html § FORM CONTROLS. */
    --input-height: 42px;
    --input-padding-y: 11px;
    --input-padding-x: 14px;
    --input-radius: var(--radius-sm);
    --input-border-width: 1.5px;
    --input-font-size: 14.5px;
    --input-focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.12);
    --input-focus-ring-dark: 0 0 0 3px rgba(37, 99, 235, 0.22);

    /* Fonts */
    --font-arabic: "IBM Plex Sans Arabic", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
    /* Aliases مستخدمة في الكود الحالي بدون تعريف سابق (إصلاح Phase 2) */
    --font: var(--font-arabic);
    --font-main: var(--font-arabic);

    /* ═══ Spacing Scale (Phase 2 — Design Tokens) ═══ */
    /* كل خطوة = 4px — Single Source of Truth لكل padding/margin بالنظام */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;

    /* ═══ Typography Scale (Phase 2 — Design Tokens) ═══ */
    /* مبنية على القيم الفعلية الأكثر استخدامًا في المشروع (تحليل Phase 1) */
    --text-2xs: 10px;
    --text-xs: 11px;
    --text-sm: 12px;
    --text-base: 13px;
    --text-md: 14px;
    --text-lg: 16px;
    --text-xl: 18px;

    --text-3xl: 24px;
    --text-4xl: 28px;
    --text-5xl: 32px;
    --text-6xl: 36px;

    /* ═══ Font Weight Tokens (Phase 2) ═══ */
    --weight-regular: 400;
    --weight-medium: 500;
    --weight-semibold: 600;
    --weight-bold: 700;
    --weight-extrabold: 800;
    --weight-black: 900;

    /* ═══ Line Height Tokens (Phase 2) ═══ */
    --leading-none: 1;

    --leading-snug: 1.4;
    --leading-normal: 1.5;
    --leading-relaxed: 1.6;

    --content-pad: 28px;
    --modal-pad: 28px;
    --form-cols: 2;

  /* ── [إصلاح P2] إخفاء الأرصدة/الأسعار الحساسة (User Preferences) ──
     أي عنصر عايز يستفيد من تفضيل hide_balances/hide_prices يضيف الكلاس
     المناسب عليه (sensitive-balance / sensitive-price)، والقيمة تتحوّل
     تلقائيًا لعلامات ***** بدل الاختفاء الكامل (أفضل لتجربة المستخدم،
     يوضح إن فيه قيمة مخفية وليست فارغة أو خطأ). */
  [data-hide-balances] .sensitive-balance {
    color: transparent !important;
    position: relative;
  }
  [data-hide-balances] .sensitive-balance::after {
    content: "•••••";
    position: absolute;
    inset: 0;
    color: var(--text3);
    letter-spacing: 2px;
  }
  [data-hide-prices] .sensitive-price {
    color: transparent !important;
    position: relative;
  }
  [data-hide-prices] .sensitive-price::after {
    content: "•••••";
    position: absolute;
    inset: 0;
    color: var(--text3);
    letter-spacing: 2px;
  }
