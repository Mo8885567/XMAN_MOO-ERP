<style>
  /* ═══════════════════════════════════════════════════════════════
   Style_05_Login.html — جزء من Style.html الأصلي (تقسيم آلي نصي بحت، 2026-07-04)
   راجع Architecture Audit 2026-07-03، المرحلة 5 — تقسيم بحسب الحجم
   لا تقسيم دلالي بحت (الملف الأصلي كان منظّم بالفعل بترقيم أقسام
   داخلي، فالتقسيم هنا اتبع نفس الترتيب الأصلي حرفيًا بدون أي تغيير
   أو إعادة ترتيب لتفادي أي كسر في cascade/specificity الخاص بـ CSS).
   يُحمَّل بالترتيب عبر <style> في Index.html مع باقي أجزاء Style.
   ═══════════════════════════════════════════════════════════════ */

  /* ═══════════════════════════════════════════════════════════
     PAGES
  ═══════════════════════════════════════════════════════════ */
  /* ===== 22. LOGIN PAGE — Split-screen + Slideshow ===== */
  /* إخفاء المساعد الذكي كلياً عند عرض صفحة تسجيل الدخول */
  body:has(.login-page) #ai-float-root,
  body:has(.login-page) #ai-fab,
  body:has(.login-page) #ai-panel {
    display: none !important;
    pointer-events: none !important;
  }

  @keyframes loginBtnGlow {
    0%,
    100% {
      opacity: 0;
    }
    50% {
      opacity: 0.55;
    }
  }
  @keyframes loginErrIn {
    from {
      opacity: 0;
      transform: translateY(-6px) scale(0.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
  @keyframes loginSrvPulse {
    0%,
    100% {
      opacity: 1;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
    }
    50% {
      opacity: 0.85;
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0);
    }
  }
  @keyframes loginRipple {
    to {
      transform: scale(1);
      opacity: 0;
    }
  }
  @keyframes formIn {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes slideProgress {
    from {
      width: 0%;
    }
    to {
      width: 100%;
    }
  }

  .login-page {
    min-height: 100vh;
    min-height: 100dvh; /* dynamic viewport height for mobile */
    display: flex;
    background: #080f20;
    overflow: hidden;
  }

  /* ───────────────── يمين: لوحة العرض المتحرك (Slideshow) ─────────────────
      [LOGIN-SWAP] عكس مكان اللوحتين بالطلب: بدل ما تفضل شمال زي ما كانت،
     دلوقتي بتتحط يمين عن طريق flex order (من غير أي تعديل على ترتيب الـ
     HTML نفسه في renderLogin) — الأسهل والأضمن، ومتوافقة تمامًا مع RTL. */
  .show-panel {
    order: 1;
    position: relative;
    flex: 0 0 50%;
    max-width: 50%;
    background: linear-gradient(160deg, #0a1428 0%, #070d1c 55%, #050a16 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-left: 1px solid rgba(255, 255, 255, 0.1);
  }
  .show-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(148, 189, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 189, 255, 0.035) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(
      circle at 50% 40%,
      #000 0%,
      transparent 72%
    );
    mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 72%);
    pointer-events: none;
  }

  .show-brand {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 40px 48px 0;
  }
  .show-brand .mk-icon,
  .form-mobile-brand .mk-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .show-brand .mk-icon svg,
  .form-mobile-brand .mk-icon svg {
    width: 100%;
    height: 100%;
  }
  .show-brand .mk-text,
  .form-mobile-brand .mk-text {
    font-family: var(--font-mono, monospace);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.4px;
    color: #e2e8f4;
  }
  .show-brand .mk-text b,
  .form-mobile-brand .mk-text b {
    color: var(--palette-blue-accent);
  }

  .show-stage {
    position: relative;
    z-index: 2;
    flex: 1;
    padding: 10px 0;
  }
  .slide {
    position: absolute;
    inset: 0;
    padding: 0 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 0;
    transform: translateY(16px);
    transition:
      opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
      transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .slide-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 26px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .slide-eyebrow {
    font-family: var(--font-mono, monospace);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--palette-slate-500);
    margin-bottom: 10px;
  }
  .slide-title {
    font-size: 27px;
    font-weight: 800;
    color: var(--palette-slate-50);
    letter-spacing: -0.4px;
    margin-bottom: 12px;
    max-width: 420px;
  }
  .slide-desc {
    font-size: 14px;
    color: #7c8caa;
    line-height: 1.85;
    max-width: 380px;
  }

  .slide-strip {
    display: flex;
    gap: 10px;
    margin-top: 26px;
  }
  .slide-chip {
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 11.5px;
    color: var(--palette-slate-400);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .slide-chip svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  .show-nav {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 48px 40px;
  }
  .show-dot {
    position: relative;
    width: 30px;
    height: 4px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.12);
    border: none;
    cursor: pointer;
    overflow: hidden;
    padding: 0;
  }
  .show-dot .fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), #38bdf8);
    border-radius: 99px;
  }
  .show-dot.done .fill {
    width: 100%;
  }
  .show-dot.current .fill {
    animation: slideProgress 5s linear forwards;
  }

  .show-foot {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 48px 32px;
    font-size: 11px;
    color: #3d4f6a;
  }
  .show-foot-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    flex-shrink: 0;
  }

  /* ───────────────── شمال: فورم تسجيل الدخول (بعد العكس) ───────────────── */
  .form-panel {
    order: 2;
    flex: 0 0 50%;
    max-width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    position: relative;
    min-width: 0;
  }
  .form-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(
        circle at 30% 25%,
        rgba(37, 99, 235, 0.1),
        transparent 55%
      ),
      radial-gradient(
        circle at 75% 80%,
        rgba(14, 165, 233, 0.06),
        transparent 50%
      );
    pointer-events: none;
  }

  .login-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .login-box {
    position: relative;
    width: 100%;
    box-sizing: border-box;
    animation: formIn 0.55s cubic-bezier(0.34, 1.3, 0.64, 1);
    overflow: hidden;
  }
  .login-box::before {
    content: none;
  }
  .login-box::after {
    content: none;
  }

  .form-mobile-brand {
    display: none;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 30px;
  }

  .login-greeting {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--palette-blue-accent);
    letter-spacing: 0.3px;
    margin-bottom: 8px;
    min-height: 16px;
  }
  .form-title {
    font-size: 25px;
    font-weight: 800;
    color: var(--palette-slate-50);
    margin-bottom: 7px;
    letter-spacing: -0.3px;
  }
  .form-desc {
    font-size: 13px;
    color: var(--palette-slate-500);
    margin-bottom: 30px;
    line-height: 1.7;
  }

  .login-field {
    margin-bottom: 17px;
  }
  .login-field label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #7a8ba8;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
    transition: color 0.2s;
  }
  .login-field label i {
    font-size: 14px;
  }
  /* [PERF-FIX-LOGIN-ICONS] أيقونات SVG مضمّنة بدل فونط Tabler المؤجل —
     شوف التعليق في Templates_01.html (renderLogin) لتفاصيل السبب.
     .login-ico هنا بديل .login-field label i (مقاس متطابق: 14px). */
  .login-field label i.login-ico svg,
  .login-field label i.login-ico {
    width: 14px;
    height: 14px;
    display: inline-flex;
    flex-shrink: 0;
  }
  .login-field label i.login-ico svg {
    display: block;
  }
  .login-field.focused label {
    color: var(--palette-blue-accent);
  }
  .login-input-wrap {
    position: relative;
  }
  .login-field input {
    width: 100%;
    padding: 13.5px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid rgba(255, 255, 255, 0.09);
    border-radius: 11px;
    color: var(--palette-slate-100);
    font-size: 14px;
    transition:
      background var(--transition),
      color var(--transition),
      opacity var(--transition),
      border-color var(--transition);
    font-family: var(--font-arabic);
    box-sizing: border-box;
  }
  .login-field input.has-toggle {
    padding-left: 46px;
  }
  /* إخفاء أيقونة العين الافتراضية في المتصفح */
  #l-pass::-ms-reveal,
  #l-pass::-ms-clear,
  #l-pass::-webkit-contacts-auto-fill-button,
  #l-pass::-webkit-credentials-auto-fill-button {
    display: none !important;
    visibility: hidden;
    pointer-events: none;
  }
  .login-field input:focus {
    outline: none;
    border-color: rgba(37, 99, 235, 0.65);
    background: rgba(37, 99, 235, 0.07);
    box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.13);
  }
  .login-field input::placeholder {
    color: #3d4f6a;
  }

  .login-eye-btn {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--palette-slate-500);
    padding: 4px;
    display: flex;
    align-items: center;
    transition: color 0.2s;
  }
  .login-eye-btn:hover {
    color: #94b4dc;
  }
  .login-eye-btn i {
    font-size: 18px;
    display: inline-flex;
  }
  /* [PERF-FIX-LOGIN-ICONS] تبديل عرض SVG العين المفتوحة/المغلقة بناءً على
     كلاس eye-state-open/eye-state-closed (مُعدَّل عمدًا عشان ما يصطدمش مع
     .ti-eye:before / .ti-eye-off:before بتوع فونط Tabler المؤجل — شوف
     التعليق في 02_JS_UI_Shell.html). */
  .login-eye-btn i svg {
    width: 18px;
    height: 18px;
    display: none;
  }
  .login-eye-btn i.eye-state-open svg.icon-eye,
  .login-eye-btn i.eye-state-closed svg.icon-eye-off {
    display: block;
  }

  .login-remember-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
  }
  .login-forgot-link {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary, #2563eb);
    cursor: pointer;
    white-space: nowrap;
    transition:
      color 0.15s,
      opacity 0.15s;
  }
  .login-forgot-link:hover {
    color: var(--palette-blue-400, #60a5fa);
    text-decoration: underline;
  }
  .login-forgot-link:disabled {
    opacity: 0.5;
    cursor: default;
    text-decoration: none;
  }

  /* ═══════════════════ [FORGOT-PW-1] نافذة استعادة كلمة المرور ═══════════════════ */
  .fp-overlay {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(4, 8, 18, 0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    animation: fpFadeIn 0.2s ease;
  }
  @keyframes fpFadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  .fp-box {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: #0d1526;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 30px 28px 28px;
    box-sizing: border-box;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: formIn 0.35s cubic-bezier(0.34, 1.3, 0.64, 1);
  }
  .fp-close {
    position: absolute;
    top: 16px;
    inset-inline-end: 16px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: var(--palette-slate-500);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    transition:
      background 0.15s,
      color 0.15s;
  }
  .fp-close:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--palette-slate-100);
  }
  .fp-icon-wrap {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: rgba(37, 99, 235, 0.14);
    color: var(--palette-blue-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    font-size: 21px;
  }
  .fp-icon-wrap.fp-icon-success {
    background: rgba(16, 185, 129, 0.14);
    color: #10b981;
  }
  .fp-title {
    font-size: 19px;
    font-weight: 800;
    color: var(--palette-slate-50);
    margin-bottom: 6px;
    letter-spacing: -0.2px;
  }
  .fp-subtitle {
    font-size: 12.5px;
    color: var(--palette-slate-500);
    line-height: 1.7;
    margin-bottom: 22px;
  }
  .fp-subtitle b {
    color: var(--palette-slate-100);
    font-weight: 700;
  }
  .fp-otp-input {
    text-align: center;
    letter-spacing: 10px;
    font-size: 20px;
    font-weight: 700;
    font-family: var(--font-arabic);
  }
  .fp-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .fp-actions .btn-login {
    flex: 1;
  }
  .fp-btn-secondary {
    flex: 0 0 auto;
    padding: 0 18px;
    border-radius: 12px;
    border: 1.5px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.03);
    color: var(--palette-slate-300);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition:
      background 0.15s,
      color 0.15s;
  }
  .fp-btn-secondary:hover {
    background: rgba(255, 255, 255, 0.07);
    color: var(--palette-slate-100);
  }
  .fp-resend-row {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: var(--palette-slate-500);
  }
  .fp-resend-link {
    background: none;
    border: none;
    padding: 0;
    color: var(--primary, #2563eb);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }
  .fp-resend-link:disabled {
    color: var(--palette-slate-500);
    cursor: default;
  }
  .fp-resend-link:hover:not(:disabled) {
    text-decoration: underline;
  }
  .fp-error {
    display: none;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: #fca5a5;
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 12px;
    line-height: 1.6;
    margin-top: 14px;
    animation: loginErrIn 0.22s ease;
  }
  .fp-success-box {
    text-align: center;
    padding: 6px 0 2px;
  }
  .fp-success-box .fp-icon-wrap {
    margin: 0 auto 18px;
  }
  .fp-pw-hint {
    font-size: 11px;
    color: var(--palette-slate-500);
    margin-top: -10px;
    margin-bottom: 17px;
    line-height: 1.6;
  }

  /* ===== [SEC-FP-STRENGTH] مؤشر قوة كلمة المرور — خطوة 3 نسيت كلمة المرور ===== */
  .fp-strength-wrap {
    margin: -6px 0 16px;
  }
  .fp-strength-toprow {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
  }
  .fp-strength-toprow span:first-child {
    font-size: 11.5px;
    color: var(--palette-slate-500);
  }
  .fp-strength-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--palette-slate-500);
  }
  .fp-strength-track {
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .fp-strength-bar {
    height: 100%;
    width: 0%;
    background: #ef4444;
    border-radius: 4px;
    transition:
      width 0.25s ease,
      background 0.25s ease;
  }
  .fp-reqs {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .fp-reqs li {
    font-size: 11px;
    color: var(--palette-slate-500);
    transition: color 0.15s ease;
  }
  .fp-reqs li.ok {
    color: #4ade80;
  }
  .fp-reqs li.bad {
    color: #fca5a5;
  }

  /* ===== [SEC-LOGIN-CAPTCHA] تحدي بشري بسيط بعد محاولات فاشلة متكررة ===== */
  .login-captcha-box {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
    animation: loginErrIn 0.22s ease;
  }
  .login-captcha-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .login-captcha-q {
    font-family: var(--font-mono, monospace);
    font-size: 15px;
    font-weight: 700;
    color: var(--palette-slate-50);
    white-space: nowrap;
  }
  .login-captcha-row input {
    width: 70px;
    text-align: center;
  }
  .login-captcha-ok {
    color: #4ade80;
    font-size: 13px;
  }
  @media (max-width: 480px) {
    .fp-box {
      padding: 26px 20px 22px;
    }
  }
  .login-rem-lbl {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .login-chk {
    display: none;
  }
  .login-chk-box {
    width: 17px;
    height: 17px;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      background 0.2s,
      color 0.2s,
      opacity 0.2s,
      border-color 0.2s;
    flex-shrink: 0;
  }
  .login-chk:checked + .login-chk-box {
    background: var(--primary);
