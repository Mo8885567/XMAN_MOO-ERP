  // MOO.ERP Logo — المصدر الوحيد لتصميم الشعار (نسخة العميل)
  //  تُستخدم في: شاشة اللوجين (renderLogin)، بانر الداشبورد،
  //  السايدبار (_renderSidebarBrand في 08_JS_Users_Branding.html).
  // نفس تصميم getMooLogoSVG() في Code.js تمامًا — أي تعديل
  //  في الشكل لازم يتكرر في الاتنين مع بعض.
  // ─────────────────────────────────────────────────────────────
  function mooLogoSVG(px, opts) {
    px = px || 40;
    opts = opts || {};
    var withBg = opts.bg !== false; // افتراضيًا: true
    var mono = !!opts.mono;
    var c1 = mono ? "#fff" : "#2563EB";
    var c2 = mono ? "#fff" : "#10B981";
    var bg = withBg
      ? '<rect width="100" height="100" rx="18" fill="#0F172A"/>'
      : "";
    return (
      '<svg width="' +
      px +
      '" height="' +
      px +
      '" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      bg +
      '<path d="M24 76 L24 22 L50 50" fill="none" stroke="' +
      c1 +
      '" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M50 50 L76 22 L76 76" fill="none" stroke="' +
      c2 +
      '" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>' +
      "</svg>"
    );
  }

  //  MOO.ERP الافتراضي (mooLogoSVG) بغض النظر عن وجود شعار مخصص
  //  مرفوع من الشركة (company_settings.logo_url) — رغم إن السايدبار
  //  (_renderSidebarBrand في 08_JS_Users_Branding.html) بيفضّل الشعار
  //  المخصص لو موجود. النتيجة كانت شعارين مختلفين لنفس النظام: واحد
  //  في شاشة الدخول وواحد جوه بعد اللوجين. الدالة دي بتوحّد المصدر:
  //  لو فيه logo_url في بيانات prefetch (متاحة حتى قبل تسجيل الدخول)
  //  تُستخدم، وإلا fallback لنفس mooLogoSVG الافتراضي.
  // ─────────────────────────────────────────────────────────────
  function _loginLogoIconHtml(px) {
    var s = (window.APP && APP.companySettings) || {};
    var rawUrl = s.logo_url || "";
    var logoUrl =
      typeof _fixDriveUrl === "function" ? _fixDriveUrl(rawUrl) : rawUrl;
    // [FIX-LOGIN-LOGO-2] الشعار الافتراضي (لو مفيش logo_url مخصص) لازم يتطابق
    // بصرياً 100% مع شعار السايدبار — نفس استدعاء mooLogoSVG(px) الافتراضي
    // (خلفية كحلي داكنة + حروف M بالتدرج الأزرق/الأخضر)، بدل النسخة
    // المسطحة الأحادية اللون (bg:false, mono:true) اللي كانت مختلفة شكلاً.
    var svgLogo = mooLogoSVG(px);
    if (!logoUrl) return svgLogo;
    return (
      '<img src="' +
      logoUrl +
      '" alt="" style="width:' +
      px +
      "px;height:" +
      px +
      'px;object-fit:contain;border-radius:6px" onerror="this.outerHTML=' +
      "'" +
      svgLogo.replace(/'/g, "&#39;") +
      "'" +
      '">'
    );
  }

  function _getCssColor(name, code) {
    var trimmed = (name || "").trim();
    var fromName =
      CSS_COLOR_MAP[trimmed] || CSS_COLOR_MAP[trimmed.toLowerCase()] || null;
    if (fromName) return fromName;
    if (code) {
      var c = code.trim();
      if (c.startsWith("#")) return c;
      var CSS_NAMED = {
        red: 1,
        blue: 1,
        green: 1,
        black: 1,
        white: 1,
        yellow: 1,
        orange: 1,
        pink: 1,
        purple: 1,
        brown: 1,
        gray: 1,
        grey: 1,
        navy: 1,
        teal: 1,
        cyan: 1,
        gold: 1,
        silver: 1,
        maroon: 1,
        olive: 1,
        lime: 1,
        aqua: 1,
        coral: 1,
        salmon: 1,
        indigo: 1,
        violet: 1,
        magenta: 1,
        turquoise: 1,
        beige: 1,
        ivory: 1,
      };
      if (CSS_NAMED[c.toLowerCase()]) return c;
    }
    return null;
  }

  function showImageModal(url, title) {
    if (typeof openModal !== "function") return;
    openModal(
      '<div class="modal-box" style="width:620px;max-width:93vw;background:transparent;box-shadow:none;padding:0;overflow:visible">' +

        '<button onclick="closeModal()" style="position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;' +
        "background:rgba(0,0,0,0.65);border:2px solid rgba(255,255,255,0.3);color:#fff;font-size:18px;cursor:pointer;z-index:10;" +
        'display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.5);backdrop-filter:blur(4px);transition:background .2s" ' +
        "onmouseover=\"this.style.background='rgba(220,38,38,0.85)'\" onmouseout=\"this.style.background='rgba(0,0,0,0.65)'\"></button>" +
        '<img src="' +
        (url || "") +
        '" style="width:100%;height:100%;object-fit:contain;display:block" ' +
        "onerror=\"this.alt='تعذّر تحميل الصورة'\">" +
        "</div>" +
        (title
          ? '<div style="text-align:center;margin-top:10px;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5)">' +
            title +
            "</div>"
          : "") +
        "</div>",
    );
    var overlay = document.getElementById("modal-overlay");
    if (overlay) overlay.style.background = "rgba(0,0,0,0.88)";
  }
  window.showImageModal = showImageModal;

  function _renderLoginSlide(s, idx) {
    var chipsHtml = s.chips
      .map(function (c) {
        return (
          '<span class="slide-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
          c.icon +
          "</svg>" +
          I18N.t(c.label) +
          "</span>"
        );
      })
      .join("");
    return (
      '<div class="slide' +
      (idx === 0 ? " active" : "") +
      '" data-slide="' +
      idx +
      '">' +
      '<div class="slide-icon" style="background:' +
      s.bg +
      ";border-color:" +
      s.border +
      '">' +
      '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="' +
      s.color +
      '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      s.icon +
      "</svg>" +
      "</div>" +
      '<div class="slide-eyebrow">' +
      I18N.t(s.eyebrow) +
      "</div>" +
      '<h2 class="slide-title">' +
      I18N.t(s.title) +
      "</h2>" +
      '<p class="slide-desc">' +
      I18N.t(s.desc) +
      "</p>" +
      '<div class="slide-strip">' +
      chipsHtml +
      "</div>" +
      "</div>"
    );
  }

  // ══════════════════════════════════════════════════════════
  function renderAccessDenied(message, permissionName) {

  /**
   * _renderLicenseBanner — البانر الصغير اللي بيظهر فوق فورم اللوجين
   * لو فيه تنبيه اقتراب/انتهاء صلاحية. مصدر البيانات هو الـ Hub
   * (window.__PREFETCH__.license، محقون من doGet — راجع Code_12c_
   * WebEntry.js و_getLicenseStatusCacheOnly في Code_41_UpdateManagement.js)
   * — مفيش أي حساب أيام أو تاريخ محلي هنا، بس عرض للحقول الجاهزة.
   * بيرجع "" (بدون أي عنصر) في الحالة العادية (NORMAL) عشان ميظهرش
   * أي حاجة مزعجة لمستخدم بعيد عن الانتهاء.
   */
  function _renderLicenseBanner() {
    var lic = (window.__PREFETCH__ && window.__PREFETCH__.license) || null;
    if (!lic || !lic.message) return "";
    if (lic.warningLevel === "NORMAL" && lic.status !== "EXPIRED") return "";

    var levelClass =
      {
        INFO: "lic-info",
        WARNING: "lic-warning",
        HIGH: "lic-high",
        CRITICAL: "lic-critical",
      }[lic.warningLevel] || "lic-warning";

    var iconMap = { INFO: "ℹ️", WARNING: "⚠️", HIGH: "⚠️", CRITICAL: "⛔" };
    var icon = iconMap[lic.warningLevel] || "⚠️";

    var metaParts = [];
    if (lic.expiresAt) {
      try {
        metaParts.push(
          "تاريخ الانتهاء: " + new Date(lic.expiresAt).toLocaleDateString("ar-EG"),
        );
      } catch (e) {}
    }
    if (typeof lic.daysRemaining === "number" && lic.daysRemaining > 0) {
      metaParts.push("الأيام المتبقية: " + lic.daysRemaining);
    }

    return (
      '<div class="license-banner ' +
      levelClass +
      '" role="status" data-testid="license-banner">' +
      '<span class="lic-icon">' +
      icon +
      "</span>" +
      '<div class="lic-body">' +
      '<div class="lic-title">' +
      esc(lic.message) +
      "</div>" +
      (metaParts.length
        ? '<div class="lic-meta">' + esc(metaParts.join(" · ")) + "</div>"
        : "") +
      "</div>" +
      "</div>"
    );
  }
