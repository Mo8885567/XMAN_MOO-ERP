  function renderReports() {
    var d = APP.data;

    // ── حساب إحصائيات الحركات ──
    var txTypes = {
      IN: 0,
      OUT: 0,
      TRANSFER: 0,
      DISPATCH: 0,
      FG_IN: 0,
      FACTORY_RETURN: 0,
    };
    d.transactions.forEach(function (t) {
      if (txTypes[t.type] !== undefined) txTypes[t.type]++;
    });
    var totalIn = d.transactions
      .filter(function (t) {
        return t.type === "IN";
      })
      .reduce(function (a, t) {
        return a + Number(t.quantity || 0);
      }, 0);
    var totalOut = d.transactions
      .filter(function (t) {
        return t.type === "OUT";
      })
      .reduce(function (a, t) {
        return a + Number(t.quantity || 0);
      }, 0);

    // ── إجمالي قيمة المخزون ──
    var totalValue = 0;
    d.items.forEach(function (item) {
      var qty = d.stock
        .filter(function (s) {
          return s.item_id === item.id;
        })
        .reduce(function (a, s) {
          return a + Number(s.quantity || 0);
        }, 0);
      totalValue += qty * Number(item.selling_price || item.cost_price || 0);
    });

    // ── توزيع حالة المخزون ──
    var statusCount = { normal: 0, low: 0, out: 0 };
    d.items.forEach(function (item) {
      var qty = d.stock
        .filter(function (s) {
          return s.item_id === item.id;
        })
        .reduce(function (a, s) {
          return a + Number(s.quantity || 0);
        }, 0);
      var minQ = Number(item.min_qty || 0);
      if (qty <= 0) statusCount.out++;
      else if (minQ > 0 && qty <= minQ) statusCount.low++;
      else statusCount.normal++;
    });

    // ── رسم donut chart بـ SVG ──
    function buildDonut(normal, low, out) {
      var total = normal + low + out || 1;
      var r = 54,
        cx = 70,
        cy = 70;
      var circ = 2 * Math.PI * r;
      function slice(val, offset, color) {
        var dash = (val / total) * circ;
        var gap = circ - dash;
        return (
          '<circle cx="' +
          cx +
          '" cy="' +
          cy +
          '" r="' +
          r +
          '" fill="none" stroke="' +
          color +
          '" stroke-width="18"' +
          ' stroke-dasharray="' +
          dash.toFixed(0) +
          " " +
          gap.toFixed(0) +
          '"' +
          ' stroke-dashoffset="' +
          (-offset).toFixed(0) +
          '"' +
          ' transform="rotate(-90 ' +
          cx +
          " " +
          cy +
          ')" />'
        );
      }
      var o1 = 0,
        o2 = (normal / total) * circ,
        o3 = o2 + (low / total) * circ;
      return (
        '<svg width="140" height="140" viewBox="0 0 140 140">' +
        slice(normal, o1, "var(--success)") +
        slice(low, o2, "var(--warning)") +
        slice(out, o3, "var(--danger)") +
        '<text x="70" y="75" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text1)">' +
        total +
        "</text>" +
        "</svg>"
      );
    }

    // ── تقسيم الحركات ──
    var txList = [
      {
        label: "وارد",
        count: txTypes.IN,
        color: "var(--success)",
        icon: "<i class='ti ti-arrow-bar-down'      style='color:#10b981' aria-hidden='true'></i>",
      },
      {
        label: "صادر",
        count: txTypes.OUT,
        color: "var(--danger)",
        icon: "<i class='ti ti-arrow-bar-up'        style='color:#ef4444' aria-hidden='true'></i>",
      },
      {
        label: "تحويل",
        count: txTypes.TRANSFER,
        color: "var(--purple)",
        icon: "<i class='ti ti-arrows-exchange'     style='color:#8b5cf6' aria-hidden='true'></i>",
      },
      {
        label: "صرف مصنع",
        count: txTypes.DISPATCH,
        color: "var(--warning)",
        icon: "<i class='ti ti-building-factory-2'  style='color:#f59e0b' aria-hidden='true'></i>",
      },
      {
        label: "استلام تام",
        count: txTypes.FG_IN,
        color: "var(--teal)",
        icon: "<i class='ti ti-circle-check'        style='color:#14b8a6' aria-hidden='true'></i>",
      },
      {
        label: "مرتجع مصنع",
        count: txTypes.FACTORY_RETURN,
        color: "#f97316",
        icon: "<i class='ti ti-rotate-clockwise-2'  style='color:#f97316' aria-hidden='true'></i>",
      },
    ];
    var maxTx =
      Math.max.apply(
        null,
        txList.map(function (x) {
          return x.count;
        }),
      ) || 1;
    var txBars = txList
      .map(function (tx) {
        var pct = Math.round((tx.count / maxTx) * 100);
        return (
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' +
          '<div style="width:80px;text-align:right;font-size:13px;color:var(--text2);white-space:nowrap">' +
          tx.icon +
          " " +
          tx.label +
          "</div>" +
          '<div style="flex:1;background:var(--surface2);border-radius:20px;height:10px;overflow:hidden">' +
          '<div style="height:100%;width:' +
          pct +
          "%;background:" +
          tx.color +
          ';border-radius:20px;transition:width .6s ease"></div></div>' +
          '<div style="width:28px;text-align:left;font-weight:700;font-size:13px;color:var(--text1)">' +
          tx.count +
          "</div></div>"
        );
      })
      .join("");

    // ── أعلى الأصناف قيمة ──
    var itemValues = d.items
      .map(function (item) {
        var qty = d.stock
          .filter(function (s) {
            return s.item_id === item.id;
          })
          .reduce(function (a, s) {
            return a + Number(s.quantity || 0);
          }, 0);
        var val = qty * Number(item.selling_price || item.cost_price || 0);
        return { id: item.id, name: item.name, val: val };
      })
      .filter(function (x) {
        return x.val > 0;
      })
      .sort(function (a, b) {
        return b.val - a.val;
      })
      .slice(0, 6);
    var maxVal = itemValues.length ? itemValues[0].val : 1;
    var valueBars =
      itemValues
        .map(function (x) {
          var pct = Math.round((x.val / maxVal) * 100);
          var valStr =
            x.val >= 1000
              ? (x.val / 1000).toFixed(1).replace(/\.0$/, "") + "k"
              : x.val.toFixed(0);
          return (
            '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">' +

    // جديد: تقرير الأصناف الراكدة (30 يوم)
    // ══════════════════════════════════════════════════════
    var DORMANT_DAYS = 30;
    var now = Date.now();
    var cutoff = now - DORMANT_DAYS * 24 * 60 * 60 * 1000;

    // آخر حركة صادرة لكل صنف
    var lastMovement = {};
    d.transactions.forEach(function (t) {
      if (t.type !== "OUT" && t.type !== "DISPATCH") return;
      var id = String(t.item_id || "");
      if (!id) return;
      var txDate = t.date ? new Date(t.date).getTime() : 0;
      if (!lastMovement[id] || txDate > lastMovement[id]) {
        lastMovement[id] = txDate;
      }
    });

    // الأصناف الراكدة: عندها رصيد > 0 وآخر حركة قبل 30 يوم (أو مالهاش حركة خالص)
    var dormantItems = d.items
      .filter(function (item) {
        var qty = d.stock
          .filter(function (s) {
            return s.item_id === item.id;
          })
          .reduce(function (a, s) {
            return a + Number(s.quantity || 0);
          }, 0);
        if (qty <= 0) return false; // مخزونه فاضي — مش مشكلة
        var last = lastMovement[item.id] || 0;
        return last < cutoff; // مالوش حركة من أكتر من 30 يوم
      })
      .map(function (item) {
        var qty = d.stock
          .filter(function (s) {
            return s.item_id === item.id;
          })
          .reduce(function (a, s) {
            return a + Number(s.quantity || 0);
          }, 0);
        var last = lastMovement[item.id] || 0;
        var daysSince =
          last > 0 ? Math.floor((now - last) / (24 * 60 * 60 * 1000)) : null;
        var stockVal = qty * Number(item.selling_price || item.cost_price || 0);
        return {
          item: item,
          qty: qty,
          daysSince: daysSince,
          stockVal: stockVal,
        };
      })
      .sort(function (a, b) {
        // ترتيب: الأعلى قيمة أولاً
        return b.stockVal - a.stockVal;
      });

    var dormantTotalVal = dormantItems.reduce(function (a, x) {
      return a + x.stockVal;

    var dormantRows =
      dormantItems.length === 0

    var dormantSection = `

  // ═══════════════════════════════════════════════════════════════
  //  renderAlerts — شاشة التنبيهات الموحّدة v4.2

  // ═══════════════════════════════════════════════════════════════
  function renderAlerts() {
    // ── بيانات التنبيهات من المصدر الموحّد ──────────────────────
    var allNotifs = _buildNotifications();

    // ── إحصائيات ────────────────────────────────────────────────

      // بطاقة: نافد
      '<div style="background:var(--danger-soft);border:1.5px solid #ef444433;border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;justify-content:space-between">' +

      '<div style="font-size:34px;font-weight:800;color:var(--danger);line-height:1">' +
      dangerCnt +
      "</div>" +
      '<div style="font-size:11px;color:var(--text3);margin-top:3px">صنف</div></div>' +
      '<div style="font-size:26px"></div></div>' +
      // بطاقة: منخفض

      '<div style="font-size:34px;font-weight:800;color:var(--warning);line-height:1">' +
      warnCnt +
      "</div>" +
      '<div style="font-size:11px;color:var(--text3);margin-top:3px">صنف</div></div>' +
      '<div style="font-size:26px"></div></div>' +
      // بطاقة: إجمالي
      '<div style="background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;justify-content:space-between">' +

    // ── شريط الفلترة والأكشن ────────────────────────────────────
    var toolbarHtml =
      '<div class="notif-page-header">' +
      '<div class="notif-page-tabs">' +
      '<button class="notif-page-tab active" id="ntab-all" onclick="notifPageFilter(\'all\')">الكل ' +

    // ── قائمة الإشعارات ─────────────────────────────────────────
    var listHtml = '<div class="notif-full-list" id="notif-page-list">';
    if (!allNotifs.length) {
      listHtml +=
        '<div class="notif-full-empty">' +
        '<span class="empty-icon"></span>' +
        '<p style="font-weight:700;color:var(--text)">لا توجد تنبيهات</p>' +
        '<p style="margin-top:4px">المخزون في وضع جيد وكل شيء على ما يرام</p>' +
        "</div>";
    } else {
      allNotifs.forEach(function (n) {
        var isUnread = n.source === "engine" ? !n.read : readIds.indexOf(n.id) === -1;
        var pageLabel =
          { alerts: "مخزون", production: "إنتاج", shipping: "شحن" }[n.page] ||
          n.page;
        var pageBadgeBg =
          {
            alerts: "var(--danger-soft)",
            production: "var(--accent-soft)",
            shipping: "var(--accent-soft)",
          }[n.page] || "var(--surface2)";
        var pageBadgeColor =
          {
            alerts: "var(--danger)",
            production: "var(--accent)",
            shipping: "var(--accent)",
          }[n.page] || "var(--text2)";

        listHtml +=
          '<div class="notif-full-item ' +
          (isUnread ? "unread " : "") +
          "type-" +
          n.type +
          '" data-notif-id="' +
          n.id +
          '" data-page="' +
          n.page +
          '" data-source="' +
          (n.source === "engine" ? "engine" : "computed") +
          '" onclick="notifPageItemClick(this)">' +
          (isUnread ? '<div class="notif-full-unread-strip"></div>' : "") +
          '<div class="notif-full-icon" style="background:' +
          n.iconBg +
          '">' +
          n.icon +
          "</div>" +
          '<div class="notif-full-body">' +
          '<div class="notif-full-title">' +
          n.title +
          "</div>" +
          '<div class="notif-full-desc">' +
          n.desc +
          "</div>" +
          '<div class="notif-full-meta">' +
          '<span class="notif-full-badge ' +
          (isUnread ? "unread-badge" : "read-badge") +
          '">' +
          (isUnread ? "● غير مقروء" : " مقروء") +
          "</span>" +
          '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;background:' +
          pageBadgeBg +
          ";color:" +
          pageBadgeColor +
          '">' +
          pageLabel +
          "</span>" +
          "</div></div>" +
          '<div class="notif-full-item-actions">' +
          (isUnread
            ? '<button class="notif-full-item-btn" title="تحديد كمقروء" onclick="event.stopPropagation();notifPageMarkOneRead(\'' +
              n.id +
              "')\"></button>"
            : "") +
          "</div>" +
          "</div>";
      });
    }
    listHtml += "</div>";

    return (
      '<div class="page-header"><div>' +
      '<h1 style="display:flex;align-items:center;gap:10px">' +
      iconBadge("ti-bell", "var(--danger-soft)", "var(--danger)") +
      "<span>التنبيهات</span></h1>" +
      "<p>مركز التنبيهات الموحّد — مخزون منخفض، إنتاج معلق، شحنات</p>" +
      "</div></div>" +
      statsHtml +
      '<div class="card" style="padding:20px">' +
      toolbarHtml +
      listHtml +
      "</div>"
    );
  }

      '<button class="users-tab active" data-tab="users" ' +
      'style="padding:10px 22px;font-size:13px;font-weight:600;border:none;background:transparent;cursor:pointer;' +
      'color:var(--accent);border-bottom:2.5px solid var(--accent);margin-bottom:-2.5px;transition:all .15s;border-radius:0">' +
      "<i class='ti ti-users' style='font-size:14px'></i> المستخدمون" +
      (totalUsers
        ? ' <span style="background:var(--accent);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;margin-right:4px">' +
          totalUsers +
          "</span>"
        : "") +
      "</button>" +
      (canViewLog
        ? '<button class="users-tab" data-tab="audit" ' +
          'style="padding:10px 22px;font-size:13px;font-weight:600;border:none;background:transparent;cursor:pointer;' +
          'color:var(--text2);border-bottom:2.5px solid transparent;margin-bottom:-2.5px;transition:all .15s;border-radius:0">' +
          "<i class='ti ti-history' style='font-size:14px'></i> سجل العمليات" +
          "</button>"
        : "") +
      (canDo("manageRoles")
        ? '<button class="users-tab" data-tab="permissions" ' +
          'style="padding:10px 22px;font-size:13px;font-weight:600;border:none;background:transparent;cursor:pointer;' +
          'color:var(--text2);border-bottom:2.5px solid transparent;margin-bottom:-2.5px;transition:all .15s;border-radius:0">' +
          "<i class='ti ti-shield-check' style='font-size:14px'></i> إدارة الصلاحيات" +
          "</button>"
        : "") +
      (canDo("manageRoles")
        ? '<button class="users-tab" data-tab="storage" ' +
          'style="padding:10px 22px;font-size:13px;font-weight:600;border:none;background:transparent;cursor:pointer;' +
          'color:var(--text2);border-bottom:2.5px solid transparent;margin-bottom:-2.5px;transition:all .15s;border-radius:0">' +
          "<i class='ti ti-database' style='font-size:14px'></i> مساحة التخزين" +
          "</button>"
        : "") +
      "</div>" +
      // ── محتوى التبويبات ────────────────────────────────────
      '<div id="users-tab-users" class="users-tab-pane">' +
      usersTabContent +
      "</div>" +
      '<div id="users-tab-audit" class="users-tab-pane" style="display:none">' +
      auditTabContent +
      "</div>" +
      (canDo("manageRoles")
        ? '<div id="users-tab-permissions" class="users-tab-pane" style="display:none">' +
          renderPermissionsPage() +
          "</div>"
        : "") +
      (canDo("manageRoles")
        ? '<div id="users-tab-storage" class="users-tab-pane" style="display:none">' +
          '<div id="storage-stats-content">' +
          '<div style="text-align:center;padding:40px;color:var(--text2)">' +
          "<i class='ti ti-loader-2' style='font-size:22px'></i> جاري تحميل إحصائيات المساحة..." +
          "</div></div></div>"

  }

  // ═══════════════════════════════════════════════════════════════
  // [COLUMN-ENGINE] تعريف أعمدة جدول المستخدمين + عرضه — Metadata
  // بدل جدول ثابت (raw <table>)، متوافق مع تخصيص الأعمدة والتصدير
  // والطباعة والـ View Presets تلقائيًا.
  // ═══════════════════════════════════════════════════════════════
  function _registerUsersColumns() {
    var roleColors = {
      admin: "badge-danger",
      supervisor: "badge-warning",
      operator: "badge-blue",
      viewer: "badge-purple",
    };
    ColumnEngine.register(
      "users",
      [
        {
          key: "full_name",
          label: "المستخدم",
          type: "custom",
          width: 240,
          frozen: "right",
          format: function (v, u) {
            var avatarLetter = u.full_name
              ? u.full_name[0]
              : u.username
                ? u.username[0].toUpperCase()
                : "م";
            var avatarColor = _userAvatarColor(u.username || "");
            return (
              '<div style="display:flex;align-items:center;gap:10px">' +
              '<div style="width:34px;height:34px;border-radius:50%;background:' +
              avatarColor +
              ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0">' +
              esc(avatarLetter) +
              "</div>" +
              '<div style="text-align:right"><div style="font-weight:600;color:var(--text)">' +
              esc(u.full_name || "") +
              "</div>" +
              '<div style="font-size:11px;color:var(--text3);font-family:var(--font-mono)">' +
              esc(u.username || "") +
              "</div></div></div>"
            );
          },
        },
        {
          key: "username",
          label: "اسم الدخول",
          type: "text",
          category: "حقول إضافية",
          defaultVisible: false, // معروض بالفعل تحت الاسم — Smart Column
          format: function (v) {
            return "<span class='mono'>" + esc(v || "") + "</span>";
          },
        },
        {
          key: "role",
          label: "الصلاحية",
          type: "badge",
          width: 130,
          format: function (v) {
            return (
              "<span class='badge " +
              (roleColors[v] || "badge-blue") +
              "'>" +
              roleLabel(v || "") +
              "</span>"
            );
          },
        },
        { key: "email", label: "البريد الإلكتروني", type: "text", width: 200 },
        {
          key: "active",
          label: "الحالة",
          type: "badge",
          width: 100,
          format: function (v) {
            var isActive = v === true || String(v).toUpperCase() === "TRUE";
            return isActive
              ? '<span class="badge badge-success" style="font-size:11px">نشط</span>'
              : '<span class="badge badge-danger" style="font-size:11px">موقوف</span>';
          },
        },
        {
          key: "last_login",
          label: "آخر دخول",
          type: "date",
          width: 130,
          format: function (v) {
            return v
              ? '<span style="color:var(--text3);font-size:12px">' +
                  esc(fmtDate(v)) +
                  "</span>"
              : "—";
          },
        },
        // [COLUMN-ENGINE-FULL-FIELDS] حقول موجودة فعليًا في بيانات المستخدم
        // (Code_12h_UsersCRUD.gs → getUsers/addUser/updateUser) لكنها لم
        // تكن ظاهرة كأعمدة اختيارية — كلمة المرور وسجل كلمات المرور
        // (password/password_history) استُبعدا عمدًا لأسباب أمنية ولا
        // يظهران في أي واجهة أصلاً.
        {
          key: "forcePasswordChange",
          label: "بانتظار تغيير كلمة المرور",
          category: "حقول إضافية",
          defaultVisible: false,
          format: function (v) {
            return v
              ? '<span class="badge badge-warning" style="font-size:11px">نعم</span>'
              : '<span class="badge" style="font-size:11px">لا</span>';
          },
        },
        {
          key: "password_changed_at",
          label: "تاريخ آخر تغيير لكلمة المرور",
          type: "date",
          category: "حقول إضافية",
          defaultVisible: false,
        },
        {
          key: "is_primary_admin",
          label: "المدير الرئيسي للنظام",
          category: "حقول إضافية",
          defaultVisible: false,
          format: function (v) {
            return v
              ? '<span class="badge badge-danger" style="font-size:11px">نعم</span>'
              : "—";
          },
        },
      ],
      {
        title: "قائمة المستخدمين",
        rowKey: "username",
        contextMenuType: "users",
      },
    );
  }

  function _renderUsersTable(users) {
    var wrap = document.getElementById("users-table-wrap");
    if (!wrap) return;
    if (!users || !users.length) {
      wrap.innerHTML =
        '<div class="empty-state"><div class="empty-icon"></div><p>لا يوجد مستخدمون</p></div>';
      return;
    }
    _registerUsersColumns();
    ColumnEngine.renderTable("users", wrap, users, {});
  }

      // إلى تاريخ
      '<input type="date" class="input" id="audit-date-to" ' +
      'style="flex:1;min-width:0;border-radius:8px;height:36px;font-size:12px;border:1.5px solid var(--border);background:var(--surface2);padding:0 8px" ' +
      "onfocus=\"this.style.borderColor='var(--accent)'\" onblur=\"this.style.borderColor='var(--border)'\">" +
      // أزرار
      '<button class="btn btn-primary btn-sm" onclick="applyAuditFilters()" style="white-space:nowrap;height:36px;border-radius:8px;padding:0 14px;font-size:12px;flex-shrink:0"> تطبيق</button>' +
      '<button class="btn btn-secondary btn-sm" onclick="resetAuditFilters()" style="white-space:nowrap;height:36px;border-radius:8px;padding:0 12px;font-size:12px;flex-shrink:0">↩</button>' +
      "</div></div>" +
      // ── جدول السجل ──────────────────────────────────────────
      '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">' +
      '<div style="font-weight:600;color:var(--text);font-size:14px"> سجل العمليات</div>' +
      '<div style="display:flex;gap:6px">' +
      '<button class="btn btn-secondary btn-sm" onclick="loadAuditLog()" id="audit-refresh-btn"><span style="display:inline-flex;align-items:center;gap:5px"><i class="ti ti-refresh" style="font-size:15px" aria-hidden="true"></i> تحديث</span></button>' +
      '<button class="btn btn-secondary btn-sm" onclick="exportAuditLogData()" title="تصدير CSV"> تصدير</button>' +
      (canDo("createBackup")
        ? '<button class="btn btn-ghost btn-sm" onclick="openBackupPanel()" style="color:var(--warning)"> باكاب</button>'
        : "") +
      "</div></div>" +
      '<div id="audit-log-content">' +
      '<div class="loading-overlay" style="min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px">' +
      '<div class="spinner"></div><p style="color:var(--text3)">جاري تحميل السجل...</p>' +
      "</div></div>" +
      "</div>"
    );
  }

  // ── helper: بطاقة إحصاء صغيرة ───────────────────────────────
  function _userStatCard(icon, label, value, color) {
    return (
      '<div style="background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px 18px;' +
      "display:flex;align-items:center;gap:12px;border-top:3px solid " +
      color +
      '">' +
      '<div style="width:42px;height:42px;border-radius:12px;background:' +
      color +
      '22;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">' +
      icon +
      "</div>" +
      "<div>" +
      '<div style="font-size:22px;font-weight:800;color:' +
      color +
      '" id="ustat-' +
      label.replace(/[^a-zA-Z]/g, "") +
      '">' +
      value +
      "</div>" +
      '<div style="font-size:11px;color:var(--text3);font-weight:500">' +
      label +
      "</div>" +
      "</div></div>"
    );
  }

  // ── helper: لون الأفاتار بناءً على اسم المستخدم ──────────────

  function renderProduction() {
    var d = APP.data;
    var orders = d.productionOrders || [];

    var total = orders.length;
    var done = orders.filter(function (o) {
      return o.status === "done";
    }).length;
    var inprog = orders.filter(function (o) {
      return o.status === "inprogress";
    }).length;

    // ── Filter Bar (فلتر الحالة فقط — البحث بقى مدمج في شريط أدوات المحرك) ──
    var filterHtml =
      '<div class="card" style="margin-bottom:16px;padding:12px 16px">' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<select class="input" id="po-filter" style="width:auto;min-width:160px">' +
      '<option value="">كل الحالات</option>' +
      '<option value="pending">معلق</option>' +
      '<option value="inprogress">قيد التصنيع</option>' +
      '<option value="done">مكتمل</option>' +
      '<option value="cancelled">ملغي</option>' +
      "</select>" +
      "</div></div>";

    // [COLUMN-ENGINE] جدول أوامر الإنتاج انتقل لمحرك الأعمدة الديناميكي —
    // راجع _poRegisterColumns / _renderProductionOrdersTableCE في
    // 05_JS_Production.html. فلتر الحالة بيعيد رسم الجدول بالبيانات
    // المفلترة فقط، والبحث النصي بقى مدمج جوه شريط أدوات المحرك.
    var tableHtml = '<div class="card"><div id="po-ce-container"></div></div>';

    return (
      // ── Page Header ──────────────────────────────────────────
      '<div class="page-header">' +
      "<div>" +
      '<h1 style="display:flex;align-items:center;gap:10px"><span style="display:inline-flex;align-items:center;justify-content:center;background:#FEF3C7;border-radius:10px;padding:8px;flex-shrink:0"><i class="ti ti-building-factory-2" style="font-size:22px;color:#92400E" aria-hidden="true"></i></span><span>أوامر الإنتاج</span></h1>' +
      "<p>إدارة وتتبع أوامر التصنيع</p>" +
      "</div>" +
      '<div class="header-actions">' +
      (canDo("addProductionOrder")
        ? '<button class="btn btn-primary" id="btn-add-po">+ أمر إنتاج جديد</button>'
        : "") +
      "</div>" +
      "</div>" +
      // ── Stat Cards ───────────────────────────────────────────
      '<div class="stats-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px">' +
      statCard(
        iconBadge("ti-settings", "var(--warning-soft)", "var(--warning)"),
        "قيد التصنيع",
        inprog,
        "أمر",
        "#f59e0b",
      ) +
      statCard(
        iconBadge("ti-clipboard-list", "var(--accent-soft)", "var(--primary)"),
        "إجمالي الأوامر",
        total,
        "أمر",
        "var(--accent)",
      ) +
      statCard(
        iconBadge("ti-circle-check", "var(--success-soft)", "var(--success)"),
        "مكتملة",
        done,
        "أمر",
        "#22c55e",
      ) +
      "</div>" +
      filterHtml +
      tableHtml
    );
  }
</script>
