      '<div><div style="font-size:10px;color:var(--text3);margin-bottom:2px">إجمالي القطع</div><div id="cs-sum-cut" style="font-size:20px;font-weight:800;color:var(--accent);line-height:1.1">0</div></div></div>' +
      '<div style="display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid rgba(5,150,105,.25);border-radius:10px;padding:12px 14px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;background:#ECFDF5;border-radius:9px;flex-shrink:0"><i class="ti ti-checkbox" style="font-size:17px;color:#059669"></i></span>' +
      '<div><div style="font-size:10px;color:var(--text3);margin-bottom:2px">الكمية المطلوبة</div><div id="cs-sum-target" style="font-size:20px;font-weight:800;color:var(--success);line-height:1.1">—</div></div></div>' +
      "</div></div>" +
      // ④ المتراج الفعلي
      '<div style="background:var(--surface2);border-radius:14px;padding:20px;border:1px solid var(--border);margin-top:14px">' +
      '<div style="font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px">④ المتراج الفعلي</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">' +
      '<div style="display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#F0FDF4;border-radius:7px;flex-shrink:0"><i class="ti ti-leaf" style="font-size:13px;color:#16A34A"></i></span>' +
      '<div style="flex:1;min-width:0"><div style="font-size:10px;font-weight:700;color:var(--text3);margin-bottom:3px">متراج جلد (م)</div>' +
      '<input class="input cs-meter-input" id="cs-m-leather" type="number" min="0" step="0.01" value="0" style="width:100%;padding:4px 8px;font-size:12px;font-weight:600;border-radius:6px"></div></div>' +
      '<div style="display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#EFF6FF;border-radius:7px;flex-shrink:0"><i class="ti ti-layers-subtract" style="font-size:13px;color:#2563EB"></i></span>' +
      '<div style="flex:1;min-width:0"><div style="font-size:10px;font-weight:700;color:var(--text3);margin-bottom:3px">متراج بطانة (م)</div>' +
      '<input class="input cs-meter-input" id="cs-m-lining" type="number" min="0" step="0.01" value="0" style="width:100%;padding:4px 8px;font-size:12px;font-weight:600;border-radius:6px"></div></div>' +
      '<div style="display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#F5F3FF;border-radius:7px;flex-shrink:0"><i class="ti ti-stack-2" style="font-size:13px;color:#6D28D9"></i></span>' +
      '<div style="flex:1;min-width:0"><div style="font-size:10px;font-weight:700;color:var(--text3);margin-bottom:3px">متراج تطعيم (م)</div>' +
      '<input class="input cs-meter-input" id="cs-m-interlining" type="number" min="0" step="0.01" value="0" style="width:100%;padding:4px 8px;font-size:12px;font-weight:600;border-radius:6px"></div></div>' +
      '<div style="display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px">' +
      '<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#FFF7ED;border-radius:7px;flex-shrink:0"><i class="ti ti-arrow-autofit-width" style="font-size:13px;color:#C2410C"></i></span>' +
      '<div style="flex:1;min-width:0"><div style="font-size:10px;font-weight:700;color:var(--text3);margin-bottom:3px">متراج كم (م)</div>' +
      '<input class="input cs-meter-input" id="cs-m-sleeve" type="number" min="0" step="0.01" value="0" style="width:100%;padding:4px 8px;font-size:12px;font-weight:600;border-radius:6px"></div></div>' +
      "</div>" +
      '<div style="margin-top:12px;padding:11px 14px;background:rgba(37,99,235,.06);border-radius:9px;border:1.5px solid rgba(37,99,235,.15);display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text2)">' +
      '<i class="ti ti-sum" aria-hidden="true"></i> إجمالي المتراج: <b id="cs-meters-total" style="color:var(--accent);font-size:15px">0.00 م</b>' +
      "</div></div>" +
      // ⑤ ملاحظات وحفظ
      '<div style="background:var(--surface2);border-radius:14px;padding:20px;border:1px solid var(--border);margin-top:14px">' +
      '<div style="font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px">⑤ ملاحظات وحفظ</div>' +
      '<div style="margin-bottom:14px">' +
      '<label style="font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:6px"><i class="ti ti-note" style="font-size:12px;margin-left:3px"></i> ملاحظات القص</label>' +
      '<textarea class="input" id="cs-notes" rows="3" placeholder="أي ملاحظات إضافية على القص..." style="width:100%;resize:none;font-family:var(--font-main);height:80px"></textarea>' +
      "</div>" +
      '<button class="btn btn-primary" id="cs-save-btn" style="width:100%;padding:14px;font-size:15px;font-weight:700;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px">' +
      '<i class="ti ti-device-floppy" style="font-size:18px"></i> حفظ بيان القص' +
      "</button></div>" +
      "</div>" + // end cs-content
      "</div>" // end flex col
    );
  }
  function renderProductionReports() {
    var d = APP.data;
    var orders = d.productionOrders || [];
    var txAll = d.transactions || [];
    var items = d.items || [];

    // ══════════════════════════════════════════════
    // §1  إحصائيات عامة
    // ══════════════════════════════════════════════
    var total = orders.length;
    var done = orders.filter(function (o) {
      return o.status === "done";
    }).length;
    var inprog = orders.filter(function (o) {
      return o.status === "inprogress";
    }).length;
    var pending = orders.filter(function (o) {
      return o.status === "pending";
    }).length;
    var cancelled = orders.filter(function (o) {
      return o.status === "cancelled";
    }).length;

    // ══════════════════════════════════════════════
    // §2  فهرس الحركات حسب ref (= poId)
    // ══════════════════════════════════════════════
    var txByPO = {}; // { poId: { dispatch:[], return:[], fgIn:[] } }
    txAll.forEach(function (t) {
      var ref = String(t.ref || "").trim();
      if (!ref) return;
      if (!txByPO[ref]) txByPO[ref] = { dispatch: [], ret: [], fgIn: [] };
      if (t.type === "DISPATCH") txByPO[ref].dispatch.push(t);
      if (t.type === "FACTORY_RETURN") txByPO[ref].ret.push(t);
      if (t.type === "FG_IN") txByPO[ref].fgIn.push(t);
    });

    // ══════════════════════════════════════════════
    // §3  بناء تقرير تفصيلي لكل أمر إنتاج
    // ══════════════════════════════════════════════
    var poReports = orders
      .filter(function (o) {
        return o.status !== "cancelled";
      })
      .map(function (po) {
        var poTx = txByPO[po.id] || { dispatch: [], ret: [], fgIn: [] };

        // ── الخامات المصروفة (DISPATCH) ──
        var dispatchedItems = {};
        poTx.dispatch.forEach(function (t) {
          var key = String(t.item_id) + "||" + String(t.color || "");
          if (!dispatchedItems[key]) {
            dispatchedItems[key] = {
              item_id: t.item_id,
              color: t.color || "",
              qty: 0,
              name: "",
            };
            var it = items.find(function (x) {
              return String(x.id) === String(t.item_id);
            });
            if (it) dispatchedItems[key].name = it.name;
          }
          dispatchedItems[key].qty += Number(t.quantity || 0);
        });

        // ── المرتجعات (FACTORY_RETURN) ──
        var returnedItems = {};
        poTx.ret.forEach(function (t) {
          var key = String(t.item_id) + "||" + String(t.color || "");
          if (!returnedItems[key]) returnedItems[key] = 0;
          returnedItems[key] += Number(t.quantity || 0);
        });

        // ── الاستهلاك الفعلي = صرف - مرتجع ──
        var netConsumption = [];
        Object.keys(dispatchedItems).forEach(function (key) {
          var d = dispatchedItems[key];
          var ret = returnedItems[key] || 0;
          var net = d.qty - ret;
          netConsumption.push({
            item_id: d.item_id,
            name: d.name,
            color: d.color,
            dispatched: d.qty,
            returned: ret,
            net: net,
          });
        });

        // ── بيان القص من notes ──
        var cuttingData = null;
        try {
          var notesStr = String(po.notes || "").trim();
          if (notesStr.startsWith("{")) cuttingData = JSON.parse(notesStr);
        } catch (e) {}

        var fabricUsed = Number(po.fabric_meters || 0);
        var liningUsed = Number(po.lining_meters || 0);
        var plannedQty = Number(po.quantity || 0);

        // من بيان القص
        var actualFabric = 0;
        var totalPieces = 0;
        var wastePercent = 0;
        if (cuttingData) {
          actualFabric = Number(
            cuttingData.fabric_meters || cuttingData.total_meters || 0,
          );
          totalPieces = Number(cuttingData.total_pieces || plannedQty);
          if (actualFabric > 0 && totalPieces > 0) {
            // الهالك = (قماش مُنفَّذ - قماش مُنتج بالنسبة للقطع) / الكل
            var theoreticalFabric = (actualFabric / totalPieces) * totalPieces;
            // نسبة الهالك = (المستخدم - المتوقع أن ينتج) / المستخدم
            // بما أن النسبة تُحسب من بيانات القص ذاتها
            wastePercent = cuttingData.waste_percent
              ? Number(cuttingData.waste_percent)
              : actualFabric > 0 && po.fabric_meters > 0
                ? Math.max(
                    0,
                    ((actualFabric - po.fabric_meters) / actualFabric) * 100,
                  )
                : 0;
          }
        }

        // ── المنتج التام المستلم ──
        var fgQty = poTx.fgIn.reduce(function (a, t) {
          return a + Number(t.quantity || 0);
        }, 0);

        // ── تكلفة الوحدة ──
        // مجموع تكلفة الخامات المستهلكة فعلياً ÷ الكمية المستلمة
        var rawMaterialCost = 0;
        netConsumption.forEach(function (nc) {
          var it = items.find(function (x) {
            return String(x.id) === String(nc.item_id);
          });
          if (it) rawMaterialCost += nc.net * Number(it.cost_price || 0);
        });
        var unitCost = fgQty > 0 ? rawMaterialCost / fgQty : 0;

        return {
          po: po,
          netConsumption: netConsumption,
          cuttingData: cuttingData,
          fabricUsed: fabricUsed,
          actualFabric: actualFabric,
          liningUsed: liningUsed,
          wastePercent: wastePercent,
          plannedQty: plannedQty,
          fgQty: fgQty,
          rawMaterialCost: rawMaterialCost,
          unitCost: unitCost,
          dispatchCount: poTx.dispatch.length,
          retCount: poTx.ret.length,
        };
      });

    // ══════════════════════════════════════════════
    // §4  ملخص إجمالي
    // ══════════════════════════════════════════════
    var totalFgQty = poReports.reduce(function (a, r) {
      return a + r.fgQty;
    }, 0);
    var totalRawCost = poReports.reduce(function (a, r) {
      return a + r.rawMaterialCost;
    }, 0);
    var avgWaste = poReports.filter(function (r) {
      return r.wastePercent > 0;
    });
    var avgWastePct = avgWaste.length
      ? avgWaste.reduce(function (a, r) {
          return a + r.wastePercent;
        }, 0) / avgWaste.length
      : 0;

    // ══════════════════════════════════════════════
    // §5  HTML
    // ══════════════════════════════════════════════

    // جدول الأوامر التفصيلي
    var poRows = poReports
      .map(function (r, i) {
        var po = r.po;
        var productItem = items.find(function (x) {
          return String(x.id) === String(po.product_id);
        });
        var productName = productItem ? productItem.name : po.product_id || "—";

        var statusMeta = {
          done: {
            label: "مكتمل",
            color: "var(--success)",
            bg: "var(--success-soft)",
          },
          inprogress: {
            label: "جاري",
            color: "var(--warning)",
            bg: "var(--warning-soft)",
          },
          pending: {
            label: "معلق",
            color: "var(--text3)",
            bg: "var(--surface2)",
          },
        };
        var sm = statusMeta[po.status] || statusMeta.pending;

        var unitCostStr =
          r.unitCost > 0
            ? "ج " + r.unitCost.toFixed(0)
            : '<span style="color:var(--text3)">—</span>';

        var wasteBadge =
          r.wastePercent > 0
            ? '<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:' +
              (r.wastePercent > 15
                ? "var(--danger-soft);color:var(--danger)"
                : r.wastePercent > 8
                  ? "var(--warning-soft);color:var(--warning)"
                  : "var(--success-soft);color:var(--success)") +
              '">' +
              NumberEngine.decimal(r.wastePercent, 1) +
              "%</span>"
            : '<span style="color:var(--text3);font-size:12px">—</span>';

        var fgBadge =
          r.fgQty > 0
            ? '<b style="color:var(--success)">' + r.fgQty + "</b>"
            : '<span style="color:var(--text3)">—</span>';

        // صفوف الاستهلاك المطوية
        var consumptionRows = r.netConsumption
          .map(function (nc) {
            var netStyle =
              nc.net > 0 ? "color:var(--text1)" : "color:var(--danger)";
            return (
              '<tr style="background:var(--surface2);font-size:12px">' +
              '<td style="padding:6px 12px 6px 24px;color:var(--text3)">↳</td>' +
              '<td style="padding:6px 12px" colspan="2">' +
              '<span style="font-size:11px;color:var(--text2)">' +
              esc(nc.name || nc.item_id) +
              "</span>" +
              (nc.color
                ? ' <span style="font-size:10px;color:var(--text3)">(' +
                  esc(nc.color) +
                  ")</span>"
                : "") +
              "</td>" +
              '<td style="padding:6px 12px;text-align:center;font-size:12px">' +
              '<span title="صرف"> ' +
              nc.dispatched +
              "</span>" +
              (nc.returned > 0
                ? ' <span title="مرتجع" style="color:var(--success)">↩ ' +
                  nc.returned +
                  "</span>"
                : "") +
              "</td>" +
              '<td style="padding:6px 12px;text-align:center;font-weight:700;' +
              netStyle +
              '">' +
              nc.net +
              "</td>" +
              '<td colspan="3"></td>' +
              "</tr>"
            );
          })
          .join("");

        var toggleId = "po-det-" + i;

        return (
          '<tr style="border-bottom:1px solid var(--border);cursor:pointer" onclick="document.getElementById(\'' +
          toggleId +
          "').style.display=document.getElementById('" +
          toggleId +
          "').style.display==='none'?'contents':' none'\">" +
          '<td style="padding:10px 14px;font-family:var(--font-mono);font-size:12px;color:var(--accent)">' +
          esc(po.id) +
          "</td>" +
          '<td style="padding:10px 14px">' +
          '<div style="font-weight:600;font-size:13px">' +
          esc(productName) +
          "</div>" +
          (po.patron_number
            ? '<div style="font-size:11px;color:var(--text3)">باترون: ' +
              esc(po.patron_number) +
              "</div>"
            : "") +
          "</td>" +
          '<td style="padding:10px 14px;text-align:center">' +
          '<span style="font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;background:' +
          sm.bg +
          ";color:" +
          sm.color +
          '">' +
          sm.label +
          "</span>" +
          "</td>" +
          '<td style="padding:10px 14px;text-align:center">' +
          r.plannedQty +
          "</td>" +
          '<td style="padding:10px 14px;text-align:center">' +
          fgBadge +
          "</td>" +
          '<td style="padding:10px 14px;text-align:center">' +
          wasteBadge +
          "</td>" +
          '<td style="padding:10px 14px;text-align:center;font-weight:700;color:var(--warning)">' +
          unitCostStr +
          "</td>" +
          '<td style="padding:10px 14px;text-align:center;font-size:11px;color:var(--text3)">' +
          (r.dispatchCount ? "" + r.dispatchCount : "") +
          (r.retCount ? " ↩" + r.retCount : "") +
          "</td>" +
          "</tr>" +
          (r.netConsumption.length
            ? '<tr id="' +
              toggleId +
              '" style="display:none"><td colspan="8" style="padding:0"><table style="width:100%;border-collapse:collapse">' +
              consumptionRows +
              "</table></td></tr>"
            : "")
        );
      })
      .join("");

    return `
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:24px"></span>
        <div>
          <h1 style="font-size:22px;margin:0">تقارير الإنتاج</h1>
          <p style="margin:2px 0 0;color:var(--text3);font-size:13px">تحليل شامل لدورة الإنتاج — من الخامات حتى تكلفة الوحدة</p>
        </div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="renderPage('production_reports')"><span style="display:inline-flex;align-items:center;gap:5px"><i class="ti ti-refresh" style="font-size:15px" aria-hidden="true"></i> تحديث</span></button>
    </div>

    <!-- إحصائيات الأوامر -->
    <div class="stat-grid" style="margin-bottom:20px">
      ${statCard(iconBadge("ti-building-factory-2", "var(--accent-soft)", "var(--primary)"), "إجمالي الأوامر", total, "أمر", "var(--accent-soft)")}
      ${statCard(iconBadge("ti-circle-check", "var(--success-soft)", "var(--success)"), "مكتملة", done, "أمر", "var(--success-soft)")}
      ${statCard("▶️", "قيد التنفيذ", inprog, "أمر", "var(--warning-soft)")}
      ${statCard("⏳", "معلقة", pending, "أمر", "var(--surface2)")}
      ${statCard(iconBadge("ti-package", "var(--teal-soft)", "var(--teal)"), "إجمالي المنتج", totalFgQty, "قطعة", "var(--teal-soft,var(--accent-soft))")}
    </div>

    <!-- ملخص التكلفة والهالك -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px">

      <div class="card" style="text-align:center;padding:20px">
        <div style="font-size:13px;color:var(--text3);margin-bottom:6px"> إجمالي تكلفة الخامات</div>
        <div style="font-size:28px;font-weight:800;color:var(--warning)">
          ${formatMoney(totalRawCost, { decimals: 0 })}
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">لجميع أوامر الإنتاج</div>
      </div>

      <div class="card" style="text-align:center;padding:20px">
        <div style="font-size:13px;color:var(--text3);margin-bottom:6px"> متوسط نسبة الهالك</div>
        <div style="font-size:28px;font-weight:800;color:${avgWastePct > 15 ? "var(--danger)" : avgWastePct > 8 ? "var(--warning)" : "var(--success)"}">
          ${NumberEngine.decimal(avgWastePct, 1)}%
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">
          ${avgWastePct > 15 ? " نسبة عالية — راجع عملية القص" : avgWastePct > 8 ? "متوسط — يمكن تحسينه" : " نسبة جيدة"}
        </div>
      </div>

      <div class="card" style="text-align:center;padding:20px">
        <div style="font-size:13px;color:var(--text3);margin-bottom:6px"> متوسط تكلفة الوحدة</div>
        <div style="font-size:28px;font-weight:800;color:var(--accent)">
          ج ${totalFgQty > 0 ? (totalRawCost / totalFgQty).toFixed(0) : "—"}
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">تكلفة الخامات فقط / قطعة</div>
      </div>

    </div>

    <!-- جدول تفصيل الأوامر -->
    <div class="card">
      <div style="font-weight:700;font-size:15px;margin-bottom:16px;display:flex;align-items:center;gap:8px">
        <span></span> تفصيل أوامر الإنتاج
        <span style="font-size:12px;font-weight:400;color:var(--text3)">— اضغط على أي صف لعرض تفاصيل الاستهلاك</span>
      </div>

      ${
        poReports.length === 0
          ? '<div class="empty-state"><p>لا توجد أوامر إنتاج</p></div>'
          : `<div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="background:var(--surface2);font-size:12px;color:var(--text3)">

              "</span>" +
              (s.tracking_url
                ? ' <a href="' +
                  esc(s.tracking_url) +
                  '" target="_blank" title="تتبع الشحنة" style="color:var(--primary);font-size:11px"><i class="ti ti-external-link"></i></a>'
                : "")
            : '<span style="color:var(--text3);font-size:11px">—</span>') +
          "</td>" +
          "<td>" +
          shipStatusBadge(s.status || "معلق") +
          "</td>" +
          "</tr>"
        );
      })
      .join("");

    var tableHtml =
      '<div class="card"><div class="table-wrap"><table id="ship-table">' +
      "<thead><tr>" +
      "<th>رقم الشحنة</th><th>إذن الصادر</th><th>العميل</th><th>السائق</th>" +
      "<th>تاريخ الشحن</th><th>موعد التسليم</th><th>الأصناف</th>" +
      "<th>التتبع</th><th>الحالة</th>" +
      '</tr></thead><tbody id="ship-tbody">' +
      (rows ||
        '<tr><td colspan="9" class="empty-state"><div class="empty-icon"></div><p>لا توجد شحنات مسجلة بعد</p></td></tr>') +
      "</tbody></table></div></div>";

    return (
      '<div class="page-header">' +
      "<div><h1 style='display:flex;align-items:center;gap:10px'>" +
      iconBadge("ti-truck", "var(--orange-soft)", "var(--orange)") +
      "<span>إدارة الشحن والتسليم</span></h1><p>تتبع شحنات المبيعات وإيصالات التسليم</p></div>" +
      '<div class="header-actions">' +
      '<button class="btn btn-primary" id="btn-new-shipment">+ شحنة جديدة</button>' +
      "</div></div>" +
      statsHtml +
      filterHtml +
      tableHtml
    );
  }

</script>
