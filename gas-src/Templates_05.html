<script>
  // ═══════════════════════════════════════════════════════════════
  // Templates_05.html — جزء من Templates.html الأصلي (تقسيم آلي نصي بحت، 2026-07-04)
  // النطاق: renderReportUsersTable → renderPermissionsPage (Reports/Users/Permissions)
  // راجع Architecture Audit 2026-07-03، المرحلة 5 — تقسيم بحسب الحجم،
  // على حدود دوال كاملة فقط (لا قطع لأي دالة في نص). تحقق برمجيًا:
  // التركيب النهائي لكل الأجزاء الـ10 مطابق 100% لمحتوى Templates.html
  // القديم حرفيًا (نفس الترتيب، بدون فقد أو تكرار).
  // يُحمَّل بالترتيب عبر <script> في Index.html مع باقي الأجزاء.
  // ═══════════════════════════════════════════════════════════════
  function renderReportUsersTable(users) {
    var tableEl = document.getElementById("weekly-report-table");
    if (!tableEl) return;

    // تحديث العداد
    var countEl = document.getElementById("wr-count");
    if (countEl) {
      var active = (users || []).filter(function (u) {
        return u.active;
      }).length;
      countEl.textContent =
        (users || []).length +
        " مستخدم" +
        (active > 0 ? " — " + active + " مفعّل" : "");
    }

    if (!users || users.length === 0) {
      tableEl.innerHTML =
        '<div style="padding:48px 20px;text-align:center">' +
        '<div style="width:64px;height:64px;background:linear-gradient(135deg,#2b9fd6,#1a73a7);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px"></div>' +
        '<div style="font-weight:700;font-size:15px;margin-bottom:6px">' +
        I18N.t("TG_NO_SUBSCRIBERS_YET") +
        "</div>" +
        '<div style="font-size:13px;color:var(--text3)">' +
        I18N.t("TG_CLICK_ADD_USER_FIRST_SUB") +
        "</div>" +
        "</div>";
      return;
    }

    var TYPES_LABELS = {
      all: "الكل",
      "summary,alerts": "ملخص + تنبيهات",
      transactions: "حركات فقط",
      alerts: "تنبيهات فقط",
      "summary,stock,transactions": "ملخص + مخزون + حركات",
    };

    var TYPES_COLORS = {
      all: "#2563eb",
      "summary,alerts": "#f59e0b",
      transactions: "#10b981",
      alerts: "#ef4444",
      "summary,stock,transactions": "#8b5cf6",
    };

    var cards = users
      .map(function (u) {
        var isActive =
          u.active === true || String(u.active).toUpperCase() === "TRUE";
        var lastSent = u.last_sent ? fmtDate(u.last_sent) : null;
        var typesLabel =
          TYPES_LABELS[u.report_types] || u.report_types || "الكل";
        var typeColor = TYPES_COLORS[u.report_types] || "#2563eb";
        var initials = (u.full_name || u.username || "?").charAt(0);

        return (
          '<div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;transition:.18s" ' +
          "onmouseover=\"this.style.background='var(--surface2)'\" onmouseout=\"this.style.background=''\">" +
          // Avatar
          '<div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2b9fd6,#1a73a7);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0">' +
          esc(initials) +
          "</div>" +
          // Info
          '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:700;font-size:14px;margin-bottom:3px">' +
          esc(u.full_name || u.username) +
          "</div>" +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">' +
          '<span style="font-size:12px;color:var(--text3);font-family:var(--font-mono)" dir="ltr">Chat ID: ' +
          esc(u.phone || "—") +
          "</span>" +
          '<span style="width:3px;height:3px;border-radius:50%;background:var(--border);display:inline-block"></span>' +
          '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;color:#fff;background:' +
          typeColor +
          '">' +
          esc(typesLabel) +
          "</span>" +
          (lastSent
            ? '<span style="font-size:11px;color:var(--text3)">آخر إرسال: ' +
              esc(lastSent) +
              "</span>"
            : "") +
          "</div>" +
          '<div style="display:flex;align-items:center;gap:6px">' +
          '<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="#2b9fd6"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.17 13.67l-2.938-.916c-.638-.203-.651-.638.136-.943l11.57-4.461c.537-.194 1.006.131.956.871z"/></svg>' +
          '<span style="font-size:11px;color:var(--text3)">Bot Token: </span>' +
          '<span style="font-size:11px;font-family:var(--font-mono);color:var(--text2);direction:ltr;unicode-bidi:embed">' +
          esc(_maskSecretDisplay(u.apikey)) +
          "</span>" +
          "</div>" +
          "</div>" +
          // Status toggle
          '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">' +
          (isActive
            ? '<span style="font-size:11px;font-weight:700;color:#10b981;background:#ecfdf5;padding:3px 10px;border-radius:20px;border:1px solid #a7f3d0">' +
              I18N.t("LBL_ENABLED") +
              "</span>"
            : '<span style="font-size:11px;font-weight:700;color:#94a3b8;background:var(--surface2);padding:3px 10px;border-radius:20px;border:1px solid var(--border)">' +
              I18N.t("STATUS_STOPPED") +
              "</span>") +
          // Actions
          "<button onclick=\"editReportUser('" +
          esc(u.username) +
          "')\" " +
          'style="width:30px;height:30px;background:var(--accent-soft);border:none;border-radius:8px;cursor:pointer;color:var(--accent);display:flex;align-items:center;justify-content:center" title="' +
          I18N.t("BTN_EDIT") +
          '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
          "</button>" +
          "<button onclick=\"testReportUser('" +
          esc(u.username) +
          "')\" " +
          'style="width:30px;height:30px;background:var(--success-soft);border:none;border-radius:8px;cursor:pointer;color:var(--success);display:flex;align-items:center;justify-content:center" title="' +
          I18N.t("LBL_TRIAL_DEMO") +
          '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>' +
          "</button>" +
          "<button onclick=\"deleteReportUser('" +
          esc(u.username) +
          "')\" " +
          'style="width:30px;height:30px;background:var(--danger-soft);border:none;border-radius:8px;cursor:pointer;color:var(--danger);display:flex;align-items:center;justify-content:center" title="' +
          I18N.t("BTN_DELETE") +
          '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
          "</button>" +
          "</div></div>"
        );
      })
      .join("");

    tableEl.innerHTML = "<div>" + cards + "</div>";
  }

  // ── renderAuditLog
  function renderAuditLog() {
    if (!canDo("viewAuditLog")) {
      return (
        '<div class="card">' +
        '<div class="empty-state" style="padding:60px">' +
        '<div class="empty-icon" style="font-size:60px"></div>' +
        "<p>' + I18N.t('ERR_ACCESS_OPS_LOG') + '</p>" +
        "</div></div>"
      );
    }
    // إعادة التوجيه لصفحة المستخدمين مباشرة (تبويب السجل)
    setTimeout(function () {
      navigate("users");
      setTimeout(function () {
        switchUsersTab("audit");
      }, 200);
    }, 0);
    return (
      '<div style="padding:40px;text-align:center;color:var(--text3)">' +
      I18N.t("MSG_REDIRECTING_AUDIT_LOG") +
      "</div>"
    );
  }

  // ── renderAIAssistant
  function renderAIAssistant() {
    return (
      '<div class="page-header"><div>' +
      "<h2>' + I18N.t('AI_ASSISTANT_ICON') + '</h2>" +
      '<p class="page-subtitle">' +
      I18N.t("AI_ASSISTANT_FLOATING_DESC") +
      "</p>" +
      "</div></div>" +
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;' +
      'padding:60px;gap:20px;text-align:center">' +
      '<div style="font-size:72px;animation:ai-float 3s ease-in-out infinite"></div>' +
      '<div style="font-size:18px;font-weight:700;color:var(--text)">' +
      I18N.t("AI_FLOATING_ASSISTANT") +
      "</div>" +
      '<p style="color:var(--text3);max-width:360px">المساعد الذكي متاح الآن كزر عائم في أسفل الشاشة. ' +
      "يمكنك استخدامه من أي صفحة في النظام!</p>" +
      '<button class="btn btn-primary" onclick="toggleAIChat()" style="gap:8px">' +
      " افتح المساعد الآن</button>" +
      "</div>"
    );
  }
</script>

<template id="tpl-upload-modal">
  <div class="modal-overlay" onclick="closeUploadModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-left">
          <div class="modal-icon">
            <i class="ti ti-upload" style="font-size: 20px"></i>
          </div>
          <div>
            <h2>' + I18N.t('LBL_UPLOAD_DOCUMENT_OR_IMAGE') + '</h2>
            <div class="modal-header-sub">
              ' + I18N.t('LBL_UPLOAD_IMAGE_OR_PDF') + '
            </div>
          </div>
        </div>
        <button class="modal-close" onclick="closeUploadModal()">
          <i class="ti ti-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <label class="upload-area" id="uploadArea">
          <input
            type="file"
            id="fileInput"
            accept="image/*,application/pdf"
            capture="environment"
            onchange="previewFile(this)"
            hidden
          />
          <span id="uploadIcon"><i class="ti ti-point"></i></span>
          <span id="uploadText"
            >' + I18N.t('LBL_CLICK_TO_CHOOSE_IMAGE_FILE') + '</span
          >
          <img
            id="previewImg"
            style="
              display: none;
              max-width: 100%;
              border-radius: 8px;
              margin-top: 10px;
            "
          />
        </label>

        <input
          type="text"
          id="fileNote"
          placeholder="' + I18N.t('LBL_PH_NOTE_OPTIONAL') + '"
          class="input-field"
        />

        <div id="uploadProgress" style="display: none">
          <div class="spinner"></div>
          جاري الرفع...
        </div>
      </div>
      <div class="modal-actions">
        <button onclick="submitUpload()" class="btn-primary">
          <i class="ti ti-upload"></i> رفع
        </button>
        <button onclick="closeUploadModal()" class="btn-secondary">
          ' + I18N.t('BTN_CANCEL') + '
        </button>
      </div>
    </div>
  </div>
</template>

<script>
  function renderCodeGuide() {
    var warehouses = APP.data.warehouses || [];
    var groups = APP.data.groups || [];
    var items = APP.data.items || [];

    // ── إحصائيات سريعة ──────────────────────────────────────────
    var totalGroups = groups.length;
    var totalItems = items.length;

    var statsHtml =
      '<div class="cg2-stats-row">' +
      '<div class="cg2-stat">' +
      '<div class="cg2-stat-icon cg2-blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div>' +
      '<div><div class="cg2-stat-num">' +
      warehouses.length +
      '</div><div class="cg2-stat-lbl">' +
      I18N.t("LBL_TOTAL_WAREHOUSES") +
      "</div></div>" +
      "</div>" +
      '<div class="cg2-stat">' +
      '<div class="cg2-stat-icon cg2-green"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>' +
      '<div><div class="cg2-stat-num">' +
      totalGroups +
      '</div><div class="cg2-stat-lbl">' +
      I18N.t("LBL_TOTAL_GROUPS") +
      "</div></div>" +
      "</div>" +
      '<div class="cg2-stat">' +
      '<div class="cg2-stat-icon cg2-amber"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>' +
      '<div><div class="cg2-stat-num">' +
      totalItems +
      '</div><div class="cg2-stat-lbl">' +
      I18N.t("LBL_TOTAL_ITEMS") +
      "</div></div>" +
      "</div>" +
      "</div>";

    // ── شريط البحث والفلاتر ─────────────────────────────────────
    var filterBtns =
      '<button class="cg2-fbtn cg2-active" id="cg-btn-all" onclick="cgFilter(\'all\')">' +
      I18N.t("LBL_ALL") +
      "</button>" +
      warehouses
        .map(function (wh) {
          return (
            '<button class="cg2-fbtn" id="cg-btn-' +
            esc(wh.id) +
            '" onclick="cgFilter(\'' +
            esc(wh.id) +
            "')\">" +
            esc(wh.name) +
            "</button>"
          );
        })
        .join("");

    var toolbarHtml =
      '<div class="cg2-toolbar">' +
      '<div class="cg2-search-wrap">' +
      '<span class="cg2-search-icon"></span>' +
      '<input class="cg2-search" id="cg-search" type="text" placeholder="' +
      I18N.t("LBL_PH_SEARCH_CODE_NAME") +
      '" oninput="cgDoSearch()">' +
      "</div>" +
      '<div class="cg2-filter-btns">' +
      filterBtns +
      "</div>" +
      "</div>";

    // ── بناء بلوكات المخازن ─────────────────────────────────────
    var whBlocksHtml = warehouses
      .map(function (wh) {
        var whGroups = groups.filter(function (g) {
          return g.warehouse_id === wh.id || g.warehouse_id === wh.name;
        });
        var whItemCount = items.filter(function (it) {
          return whGroups.some(function (g) {
            return g.id === it.group || g.name === it.group;
          });
        }).length;

        var groupsHtml = whGroups
          .map(function (g) {
            var groupItems = items.filter(function (it) {
              return it.group === g.id || it.group === g.name;
            });

            var rowsHtml = groupItems
              .map(function (it) {
                return (
                  '<tr class="cg2-item-row" data-search="' +
                  esc(
                    (
                      it.id +
                      " " +
                      it.name +
                      " " +
                      (it.description || "")
                    ).toLowerCase(),
                  ) +
                  '">' +
                  '<td><span class="cg2-item-code">' +
                  esc(it.code || it.id) +
                  "</span></td>" +
                  '<td class="cg2-item-name">' +
                  esc(it.name) +
                  "</td>" +
                  '<td class="cg2-item-desc">' +
                  esc(it.description || "—") +
                  "</td>" +
                  '<td><span class="cg2-unit-badge">' +
                  esc(it.unit || "—") +
                  "</span></td>" +
                  "</tr>"
                );
              })
              .join("");

            return (
              '<div class="cg2-group-block">' +
              '<div class="cg2-group-header">' +
              '<span class="cg2-group-prefix">' +
              esc(g.prefix || g.id) +
              "</span>" +
              '<span class="cg2-group-name">' +
              esc(g.name) +
              "</span>" +
              '<span class="cg2-group-count">' +
              groupItems.length +
              " صنف</span>" +
              "</div>" +
              (rowsHtml
                ? '<table class="cg2-table">' +
                  "<thead><tr>" +
                  "<th>" +
                  I18N.t("LBL_ITEM_CODE") +
                  "</th><th>" +
                  I18N.t("LBL_NAME") +
                  "</th><th>" +
                  I18N.t("LBL_DESCRIPTION") +
                  "</th><th>" +
                  I18N.t("LBL_UNIT") +
                  "</th>" +
                  "</tr></thead><tbody>" +
                  rowsHtml +
                  "</tbody></table>"
                : '<div class="cg2-empty-group">' +
                  I18N.t("MSG_NO_ITEMS_IN_GROUP") +
                  "</div>") +
              "</div>"
            );
          })
          .join("");

        return (
          '<div class="cg2-wh-block" data-wh="' +
          esc(wh.id) +
          '">' +
          '<div class="cg2-wh-header">' +
          '<span class="cg2-wh-code">' +
          esc(wh.code || wh.id) +
          "</span>" +
          '<span class="cg2-wh-name">' +
          esc(wh.name) +
          "</span>" +
          '<span class="cg2-wh-meta">كود المخزن: ' +
          esc(wh.code || wh.id) +
          " — " +
          whGroups.length +
          " مجموعة — " +
          whItemCount +
          " صنف</span>" +
          "</div>" +
          (whGroups.length > 0
            ? groupsHtml
            : '<div class="cg2-empty-group" style="border:0.5px solid var(--border);border-radius:var(--radius);padding:14px">' +
              I18N.t("MSG_NO_GROUPS_FOR_WAREHOUSE") +
              "</div>") +
          "</div>"
        );
      })
      .join("");

    // ── CSS موجود في Style.html (لا حاجة لإضافته هنا) ──────────

    // ── header badge ───────────────────────────────────────────
    var headerBadge =
      '<span style="font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--primary);padding:4px 12px;border-radius:20px;border:1px solid rgba(37,99,235,.15);white-space:nowrap">' +
      warehouses.length +
      " مخازن · " +
      totalGroups +
      " مجموعات · " +
      totalItems +
      " صنف" +
      "</span>";

    return (
      '<div class="page-enter">' +
      '<div class="page-header" style="align-items:flex-start;gap:12px;flex-wrap:wrap">' +
      "<div>" +
      '<h1 style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
      iconBadge("ti-book", "var(--accent-soft)", "var(--primary)") +
      "<span>" +
      I18N.t("PAGE_CODE_GUIDE") +
      "</span></h1>" +
      "<p>" +
      I18N.t("LBL_COMPREHENSIVE_REFERENCE_LIVE_DATA") +
      "</p>" +
      "</div>" +
      headerBadge +
      '<div class="header-actions">' +
      '<button class="btn btn-secondary" id="cg-pdf-btn" onclick="cgExportPDF()"><i class="ti ti-file-type-pdf" aria-hidden="true"></i> ' +
      I18N.t("LBL_EXPORT_PDF") +
      "</button>" +
      "</div>" +
      "</div>" +
      statsHtml +
      toolbarHtml +
      '<div id="cg-container">' +
      whBlocksHtml +
      "</div>" +
      "</div>"
    );
  }
  // ============================================================
  // تعريف الألوان — Color Definitions Page
  // ============================================================

  // ── صفحة إدارة الألوان العامة ──────────────────────────────
  function renderColorDefinitions() {
    var colors = APP.data.colors || [];
    var items = APP.data.items || [];

    var coloredItemsCount = items.filter(function (it) {
      return getItemColors(it.id).length > 0;
    }).length;

    var statsHtml =
      '<div class="cd-stats-row">' +
      '<div class="cd-stat-box"><div class="cd-stat-icon">' +
      iconBadge("ti-palette", "var(--purple-soft)", "var(--purple)") +
      '</div><div><div class="cd-stat-val">' +
      colors.length +
      '</div><div class="cd-stat-lbl">' +
      I18N.t("LBL_TOTAL_COLORS") +
      "</div></div></div>" +
      '<div class="cd-stat-box"><div class="cd-stat-icon">' +
      iconBadge("ti-package", "var(--accent-soft)", "var(--teal)") +
      '</div><div><div class="cd-stat-val">' +
      coloredItemsCount +
      '</div><div class="cd-stat-lbl">' +
      I18N.t("LBL_ITEM_WITH_COLORS") +
      "</div></div></div>" +
      '<div class="cd-stat-box"><div class="cd-stat-icon">' +
      iconBadge("ti-file-text", "var(--accent-soft)", "var(--primary)") +
      '</div><div><div class="cd-stat-val">' +
      items.length +
      '</div><div class="cd-stat-lbl">' +
      I18N.t("LBL_TOTAL_ITEMS") +
      "</div></div></div>" +
      "</div>";

    // ── الجدول [COLUMN-ENGINE] — أعمدة ديناميكية بالكامل (Metadata-Driven)
    // راجع _colorsRegisterColumns/_renderColorsTableCE في
    // 07_JS_Shipping_Colors_Excel.html. البحث الآن عبر مربع البحث
    // المدمج في التولبار الخاص بـ ColumnEngine بدل #cd-search اليدوي.
    var tableHtml =
      '<div class="card" style="padding:0;overflow:hidden">' +
      '<div id="color-defs-ce-container"></div></div>';

    return (
      '<div class="page-enter">' +
      '<div class="page-header">' +

  var _sizePageTab = "sizes";

  function _sizeGroupCardHtml(grp) {
    var sizesById = {};
    (APP.data.sizes || []).forEach(function (s) {
      sizesById[String(s.id)] = s;
    });
    var ids = String(grp.size_ids || "")
      .split(",")
      .map(function (s) {
        return s.trim();
      })
      .filter(Boolean);
    var chips = ids
      .map(function (id) {
        var s = sizesById[id];
        return s
          ? '<span class="mono" style="font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:8px">' +
              esc(s.code) +
              "</span>"
          : "";
      })
      .join(" ");
    return (
      '<div class="card" data-id="' +
      esc(grp.id) +
      '" style="padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer" onclick="openSizeGroupModal(' +
      JSON.stringify(grp.id) +
      ')">' +
      '<div style="display:flex;align-items:center;justify-content:space-between">' +
      '<div style="font-weight:700;font-size:14.5px">' +
      esc(grp.name) +
      "</div>" +
      '<button class="btn btn-outline btn-sm" title="حذف" onclick="event.stopPropagation();deleteSizeGroupConfirm(' +
      JSON.stringify(grp.id) +
      ',' +
      JSON.stringify(grp.name) +
      ')"><i class="ti ti-trash"></i></button>' +
      "</div>" +
      (grp.notes
        ? '<div style="font-size:12px;color:var(--text3)">' + esc(grp.notes) + "</div>"
        : "") +
      '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
      (chips || '<span style="font-size:12px;color:var(--text3)">لا توجد مقاسات</span>') +
      "</div>" +
      "</div>"
    );
  }

        }, 0);
        var hasStock = stockTotal > 0;
        var wh_ids = stockRows
          .filter(function (s) {

          })

          esc(String(it.id)) +
          '">' +
          '<button class="bcp-qty-btn bcp-qty-plus" data-id="' +
          esc(String(it.id)) +
          '"><i class="ti ti-plus" style="font-size:10px"></i></button>' +
