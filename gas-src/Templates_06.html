<script>
  // ═══════════════════════════════════════════════════════════════
  // Templates_06.html — جزء من Templates.html الأصلي (تقسيم آلي نصي بحت، 2026-07-04)
  // النطاق: renderRoleModal → renderShippingCompanies (Roles + Shipping Companies)
  // راجع Architecture Audit 2026-07-03، المرحلة 5 — تقسيم بحسب الحجم،
  // على حدود دوال كاملة فقط (لا قطع لأي دالة في نص). تحقق برمجيًا:
  // التركيب النهائي لكل الأجزاء الـ10 مطابق 100% لمحتوى Templates.html
  // القديم حرفيًا (نفس الترتيب، بدون فقد أو تكرار).
  // يُحمَّل بالترتيب عبر <script> في Index.html مع باقي الأجزاء.
  // ═══════════════════════════════════════════════════════════════
  function renderRoleModal(role, allPerms) {
    role = role || {};
    allPerms = allPerms || [];

    var isNew = !role.id;
    var isBuiltin = role.is_builtin;
    var rolePerms = role.permissions || [];
    var roleColor = role.color || "#6b7280";

    // ── glow class from color ──
    function _glowClass(hex) {
      if (!hex) return "glow-gray";
      var h = hex.toLowerCase();
      if (h === "#ef4444" || h === "#dc2626" || h === "#f87171")
        return "glow-red";
      if (h === "#2563eb" || h === "#3b82f6" || h === "#1d4ed8")
        return "glow-blue";
      if (h === "#f59e0b" || h === "#d97706" || h === "#fbbf24")
        return "glow-amber";
      if (h === "#10b981" || h === "#059669" || h === "#34d399")
        return "glow-green";
      return "glow-gray";
    }

    // ── تجميع الصلاحيات في فئات ──
    var cats = {};
    allPerms.forEach(function (p) {
      if (!cats[p.cat]) cats[p.cat] = { label: p.catLabel, perms: [] };
      cats[p.cat].perms.push(p);
    });
    var catKeys = Object.keys(cats);

    // ── أيقونات الفئات ──
    var CAT_ICONS = {
      items: { icon: "ti-package", bg: "#eff6ff", color: "#2563eb" },
      groups: { icon: "ti-folders", bg: "#f5f3ff", color: "#7c3aed" },
      warehouses: {
        icon: "ti-building-warehouse",
        bg: "#ecfdf5",
        color: "#059669",
      },
      stock: { icon: "ti-chart-bar", bg: "#fff7ed", color: "#d97706" },
      transactions: {
        icon: "ti-arrows-exchange",
        bg: "#fdf4ff",
        color: "#9333ea",
      },
      production: {
        icon: "ti-building-factory-2",
        bg: "#fefce8",
        color: "#ca8a04",
      },
      shipping: { icon: "ti-truck-delivery", bg: "#f0f9ff", color: "#0369a1" },
      users: { icon: "ti-users", bg: "#fff1f2", color: "#e11d48" },
      reports: { icon: "ti-report-analytics", bg: "#f0fdf4", color: "#15803d" },
      system: { icon: "ti-settings", bg: "#f8fafc", color: "#475569" },
      customers: { icon: "ti-user-circle", bg: "#fef3c7", color: "#b45309" },
    };

    // ── حساب نسبة الصلاحيات ──
    var totalPerms = allPerms.length;
    var activePerms = rolePerms.length;
    var pct = totalPerms > 0 ? Math.round((activePerms / totalPerms) * 100) : 0;

    // ── بناء صفوف الصلاحيات ──
    var permsHtml = catKeys
      .map(function (catKey) {
        var cat = cats[catKey];
        var meta = CAT_ICONS[catKey] || {
          icon: "ti-folder",
          bg: "#f1f5f9",
          color: "#64748b",
        };
        var rows = cat.perms
          .map(function (p) {
            var checked = rolePerms.indexOf(p.key) !== -1;
            var clickAttr = isBuiltin
              ? ""
              : "onclick=\"_roleTogglePerm(this,'" + p.key + "')\"";
            return (
              '<div class="perm-row-pro' +
              (isBuiltin ? " builtin" : "") +
              '" data-perm-key="' +
              p.key +
              '">' +
              '<span class="perm-row-label" ' +
              clickAttr +
              ">" +
              esc(p.label) +
              "</span>" +
              '<div class="perm-checkbox-custom' +
              (checked ? " checked" : "") +
              (isBuiltin ? " disabled" : "") +
              '" data-key="' +
              p.key +
              '"' +
              (isBuiltin
                ? ""
                : " onclick=\"_roleTogglePerm(this,'" + p.key + "')\"") +
              "></div>" +
              "</div>"
            );
          })
          .join("");

        return (
          '<div class="perm-cat-header">' +
          '<span class="cat-icon" style="background:' +
          meta.bg +
          '">' +
          '<i class="ti ' +
          meta.icon +
          '" style="font-size:13px;color:' +
          meta.color +
          '" aria-hidden="true"></i>' +
          "</span>" +
          esc(cat.label) +
          "</div>" +
          rows
        );
      })
      .join("");

    // ── عنوان المودال ──
    var roleIconClass = isNew
      ? "ti-shield-plus"
      : isBuiltin
        ? "ti-eye"
        : "ti-shield-check";
    var headerTitle = isNew ? "دور جديد" : esc(role.label || role.name || "");
    var headerSub = isNew
      ? "تخصيص الصلاحيات يدوياً"
      : esc(role.name || "") +
        " — " +
        (isBuiltin ? "دور ثابت في النظام" : "دور مخصص");

    return (
      // ── Header ──────────────────────────────────────────────
      '<div class="modal-header">' +
      '<div class="modal-header-left">' +
      '<div class="role-modal-header-icon ' +
      _glowClass(roleColor) +
      '" style="background:' +
      roleColor +
      '1a">' +
      '<i class="ti ' +
      roleIconClass +
      '" style="font-size:22px;color:' +
      roleColor +
      '" aria-hidden="true"></i>' +
      "</div>" +
      "<div>" +
      '<div style="font-size:16px;font-weight:800;color:var(--text)">' +
      headerTitle +
      "</div>" +
      '<div class="modal-header-sub">' +
      headerSub +
      "</div>" +
      "</div>" +
      (isBuiltin
        ? '<span class="badge-builtin-pro"><i class="ti ti-lock" style="font-size:11px"></i> ثابت</span>'
        : "") +
      "</div>" +
      '<button class="modal-close" onclick="closeDrawer()" aria-label="إغلاق"><i class="ti ti-x"></i></button>' +
      "</div>" +
      // ── Body ─────────────────────────────────────────────────
      '<div class="modal-body">' +
      // الحقول
      '<div class="role-modal-fields">' +
      // اسم الدور
      "<div>" +
      '<div class="role-modal-field-label">' +
      '<i class="ti ti-tag" style="font-size:13px;color:var(--accent)"></i>' +
      'اسم الدور <span style="font-size:10px;color:var(--text3);font-weight:400">(بدون مسافات)</span>' +
      "</div>" +
      '<input id="role-name" class="form-input" placeholder="مثال: store_manager"' +
      " style=\"direction:ltr;text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px\"" +
      ' value="' +
      esc(role.name || "") +
      '"' +
      (isBuiltin ? " readonly" : "") +
      ">" +
      "</div>" +
      // اللون
      '<div class="role-modal-color-wrap">' +
      '<div class="role-modal-field-label" style="justify-content:center">اللون</div>' +
      '<div class="role-modal-color-btn" id="role-color-swatch" style="background:' +
      roleColor +
      '" title="اختر لون الدور">' +
      '<input type="color" id="role-color" value="' +
      roleColor +
      '"' +
      (isBuiltin
        ? " disabled"
        : " onchange=\"document.getElementById('role-color-swatch').style.background=this.value\"") +
      ">" +
      "</div>" +
      "</div>" +
      "</div>" +
      // الاسم العربي
      '<div style="margin-bottom:16px">' +
      '<div class="role-modal-field-label">' +
      '<i class="ti ti-language" style="font-size:13px;color:var(--accent)"></i>' +
      "الاسم الظاهر بالعربي" +
      "</div>" +
      '<input id="role-label" class="form-input" placeholder="مثال: مدير المخزن"' +
      ' value="' +
      esc(role.label || "") +
      '"' +
      (isBuiltin ? " readonly" : "") +
      ">" +
      "</div>" +
      // شريط التقدم
      '<div class="role-perm-progress-wrap">' +
      '<div class="role-perm-progress-icon">' +
      '<i class="ti ti-shield-check" style="font-size:18px;color:var(--accent)" aria-hidden="true"></i>' +
      "</div>" +
      '<div class="role-perm-progress-info">' +
      '<div class="role-perm-progress-label">' +
      "<span>الصلاحيات الممنوحة</span>" +
      '<span class="perm-count-badge" id="role-perm-badge">' +
      activePerms +
      " من " +
      totalPerms +
      "</span>" +
      "</div>" +
      '<div class="role-perm-progress-bar">' +
      '<div class="role-perm-progress-fill" id="role-perm-bar" style="width:' +
      pct +
      '%"></div>' +
      "</div>" +
      "</div>" +
      "</div>" +
      // أزرار تحديد الكل
      (isBuiltin
        ? ""
        : '<div class="perm-quick-btns">' +
          '<button onclick="_roleCheckAll(true)" class="perm-quick-btn">' +
          '<i class="ti ti-checkbox" style="font-size:14px" aria-hidden="true"></i> تحديد الكل' +
          "</button>" +
          '<button onclick="_roleCheckAll(false)" class="perm-quick-btn">' +
          '<i class="ti ti-square" style="font-size:14px" aria-hidden="true"></i> إلغاء الكل' +
          "</button>" +
          "</div>") +
      // قائمة الصلاحيات
      '<div class="perm-list-wrap" id="role-perm-list">' +
      permsHtml +
      "</div>" +
      '<input type="hidden" id="role-id" value="' +
      esc(role.id || "") +
      '">' +
      "</div>" +
      // ── Footer ───────────────────────────────────────────────
      '<div class="modal-actions">' +
      (isBuiltin
        ? '<button onclick="closeDrawer()" class="btn btn-outline" style="flex:1;justify-content:center">' +
          '<i class="ti ti-x" style="font-size:15px"></i> إغلاق' +
          "</button>"
        : '<button onclick="closeDrawer()" class="btn btn-outline">' +
          '<i class="ti ti-x" style="font-size:15px"></i> إلغاء' +
          "</button>" +
          '<button onclick="saveRoleFromModal()" class="btn btn-primary">' +
          '<i class="ti ti-device-floppy" style="font-size:15px"></i> حفظ الدور' +
          "</button>") +
      "</div>"
    );
  }

  // ── مساعد: toggle صلاحية مع تحديث الشريط ──

  // ============================================================
  // مودال Override صلاحيات مستخدم (تصميم محترف v2)
  // ============================================================
  function renderUserOverrideModal(user, allPerms, overrides, rolePerms) {
    overrides = overrides || { extra: [], denied: [] };
    rolePerms = rolePerms || [];
    var extra = overrides.extra || [];
    var denied = overrides.denied || [];

    // ── تجميع الصلاحيات في فئات ──
    var cats = {};
    allPerms.forEach(function (p) {
      if (!cats[p.cat]) cats[p.cat] = { label: p.catLabel, perms: [] };
      cats[p.cat].perms.push(p);
    });
    var catKeys = Object.keys(cats);

    // ── بناء صفوف الصلاحيات ──
    var permsHtml = catKeys
      .map(function (catKey) {
        var cat = cats[catKey];
        var rows = cat.perms
          .map(function (p) {
            var hasRole = rolePerms.indexOf(p.key) !== -1;
            var isExtra = extra.indexOf(p.key) !== -1;
            var isDenied = denied.indexOf(p.key) !== -1;
            var cbGranted = hasRole || isExtra;

            var rowState = isDenied
              ? " state-denied"
              : isExtra
                ? " state-extra"
                : hasRole
                  ? " state-role"
                  : "";
            var statusIcon = isDenied
              ? '<span class="perm-status-icon"></span>'
              : isExtra
                ? '<span class="perm-status-icon" style="color:var(--primary)"><span style="display:inline-flex;align-items:center;gap:5px"><i class="ti ti-plus" style="font-size:15px" aria-hidden="true"></i></span></span>'
                : hasRole
                  ? '<span class="perm-status-icon" style="color:var(--success)"></span>'
                  : "";
            var cbClass =
              "perm-checkbox-custom" +
              (cbGranted ? " checked" : "") +
              (hasRole ? " disabled" : "");

            return (
              '<div class="perm-row-pro' +
              rowState +
              '" data-perm-key="' +
              p.key +
              '">' +
              '<span class="perm-row-label">' +
              esc(p.label) +
              statusIcon +
              "</span>" +
              // Grant checkbox
              '<div class="' +
              cbClass +
              '" data-key="' +
              p.key +
              '"' +
              (hasRole
                ? ' title="من الدور — ثابت"'
                : " onclick=\"_ovToggleGrant(this,'" + p.key + "')\"") +
              "></div>" +
              // Deny toggle
              '<label class="perm-deny-label" title="حجب هذه الصلاحية">' +
              '<input type="checkbox" class="ov-deny-cb" data-key="' +
              p.key +
              '"' +
              (isDenied ? " checked" : "") +
              " onchange=\"_ovToggleDeny(this,'" +
              p.key +
              "')\">" +
              "حجب" +
              "</label>" +
              "</div>"
            );
          })
          .join("");

        return (
          '<div class="perm-cat-header">' +
          '<span class="cat-icon" style="background:#eff6ff">' +
          '<i class="ti ti-folder" style="font-size:13px;color:#2563eb" aria-hidden="true"></i>' +
          "</span>" +
          esc(cat.label) +
          "</div>" +
          rows
        );
      })
      .join("");

    return (
      // ── Header ──
      '<div class="modal-header">' +
      '<div class="modal-header-left">' +
      '<div class="ov-user-avatar" style="width:34px;height:34px;font-size:14px;background:' +
      _pmAvatarColor(user.username) +
      '">' +
      (String(user.username || "?")[0] || "?").toUpperCase() +
      "</div>" +
      '<div class="d">' +
      '<div style="font-size:16px;font-weight:800;color:var(--text)"> Override الصلاحيات</div>' +
      '<div class="modal-header-sub">' +
      esc(user.full_name || user.username) +
      " · @" +
      esc(user.username) +
      "</div>" +
      "</div>" +
      "</div>" +
      '<div class="modal-close" onclick="closeModal()" title="إغلاق"></div>' +
      "</div>" +
      // ── Legend ──
      '<div class="perm-legend" style="margin-bottom:12px">' +
      '<div class="perm-legend-item"><div class="perm-legend-dot" style="background:var(--success)"></div><span>من الدور (ثابت)</span></div>' +
      '<div class="perm-legend-item"><div class="perm-legend-dot" style="background:var(--primary)"></div><span>إضافة فردية</span></div>' +
      '<div class="perm-legend-item"><div class="perm-legend-dot" style="background:var(--danger)"></div><span>محجوبة</span></div>' +
      "</div>" +
      // ── قائمة الصلاحيات ──
      '<div class="perm-list-wrap">' +
      permsHtml +
      "</div>" +
      // ── Footer ──
      '<div class="modal-footer-pro">' +
      '<button onclick="saveUserOverrideFromModal()" class="btn btn-primary"> حفظ الصلاحيات</button>' +
      '<button onclick="closeDrawer()" class="btn" style="background:var(--surface2);color:var(--text2)">إلغاء</button>' +
      "</div>" +
      '<input type="hidden" id="ov-username" value="' +
      esc(user.username) +
      '">' +
      '<input type="hidden" id="ov-role-perms" value=\'' +
      JSON.stringify(rolePerms) +
      "'>"
    );
  }

  // ── مساعدات Override ──

  /**
   * renderSystemSettings — شاشة إعدادات النظام الشاملة
   * تُعرض في #page-content عبر renderPage('system_settings')
   */
  function renderSystemSettings() {
    var s = APP.companySettings || {};

    // ── Preview Live ──
    var logoSrc = s.logo_url || "";
    var logoHtml = logoSrc
      ? '<img src="' +
        esc(logoSrc) +
        '" alt="لوجو الشركة" onerror="this.style.display=\'none\'">'
      : '<span class="logo-placeholder"></span>';

    var previewLogoHtml = logoSrc
      ? '<img src="' + esc(logoSrc) + '" alt="لوجو">'
      : '<span class="preview-logo-placeholder"></span>';

    var primaryColor = s.primary_color || "#2563eb";

    return (
      '<div class="page-header">' +
      "<div>" +
      "<h2 style='display:flex;align-items:center;gap:10px'>" +
      iconBadge("ti-settings", "var(--surface2)", "var(--text2)") +
      "<span>إعدادات النظام</span></h2>" +
      '<p class="page-subtitle">بيانات الشركة، الهوية البصرية، وإعدادات التشغيل</p>' +
      "</div>" +
      '<div class="header-actions">' +
      '<button class="btn btn-secondary" onclick="loadAllData(function(){ renderPage(\'system_settings\'); })"> تحديث</button>' +
      "</div>" +
      "</div>" +
      // ── Preview Card العلوية ──
      '<div class="company-preview-card" id="settings-preview-card" style="--preview-primary:' +
      esc(primaryColor) +
      ";--preview-secondary:" +
      _darkenHex(primaryColor) +
      '">' +
      '<div class="preview-logo-wrap" id="preview-logo-wrap">' +
      previewLogoHtml +
      "</div>" +
      '<div class="preview-info">' +
      '<div class="preview-company-name" id="preview-company-name">' +
      esc(s.company_name || "اسم الشركة") +
      "</div>" +
      '<div class="preview-tagline" id="preview-tagline">' +
      esc(s.tagline || "Enterprise Resource Planning") +
      "</div>" +
      '<div class="preview-meta">' +
      (s.phone
        ? '<div class="preview-meta-item"> <span id="preview-phone">' +
          esc(s.phone) +
          "</span></div>"
        : '<div class="preview-meta-item" id="preview-phone-wrap" style="display:none"> <span id="preview-phone"></span></div>') +
      (s.email
        ? '<div class="preview-meta-item"> <span id="preview-email">' +
          esc(s.email) +
          "</span></div>"
        : '<div class="preview-meta-item" id="preview-email-wrap" style="display:none"> <span id="preview-email"></span></div>') +
      (s.address
        ? '<div class="preview-meta-item"> <span id="preview-address">' +
          esc(s.address) +
          "</span></div>"
        : '<div class="preview-meta-item" id="preview-address-wrap" style="display:none"> <span id="preview-address"></span></div>') +
      "</div>" +
      "</div>" +
      "</div>" +
      // ── Layout رئيسي ──
      '<div class="settings-layout">' +
      // ── Sidebar التنقل ──
      '<div class="settings-nav">' +
      '<div class="settings-nav-title">أقسام الإعدادات</div>' +
      _settingsNavItem(
        "company",
        '<i class="ti ti-building" style="font-size:16px;color:#2563eb"></i>',
        "بيانات الشركة",
        true,
      ) +
      _settingsNavItem(
        "branding",
        '<i class="ti ti-palette" style="font-size:16px;color:#9D174D"></i>',
        "الهوية البصرية",
      ) +
      _settingsNavItem(
        "operations",
        '<i class="ti ti-settings" style="font-size:16px;color:#374151"></i>',
        "إعدادات التشغيل",
      ) +
      (canDo("manageRoles")
        ? _settingsNavItem(
            "security",
            '<i class="ti ti-shield-lock" style="font-size:16px;color:#B91C1C"></i>',
            "تنبيهات الأمان",
          )
        : "") +
      _settingsNavItem(
        "system",
        '<i class="ti ti-device-desktop" style="font-size:16px;color:#374151"></i>',
        "معلومات النظام",
      ) +
      _settingsNavItem(
        "ai_voice",
        '<i class="ti ti-microphone" style="font-size:16px;color:#7C3AED"></i>',
        "صوت المساعد الذكي",
      ) +
      _settingsNavItem(
        "audio",
        '<i class="ti ti-volume" style="font-size:16px;color:#0891b2"></i>',
        "أصوات النظام",
      ) +
      _settingsNavItem(
        "whatsapp",
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.556 4.12 1.523 5.847L0 24l6.332-1.494A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.793 9.793 0 01-5.023-1.378l-.36-.213-3.727.879.936-3.606-.235-.37A9.793 9.793 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>',
        "إعدادات واتساب",
      ) +
      (canDo("createBackup")
        ? _settingsNavItem(
            "backup",
            '<i class="ti ti-device-floppy" style="font-size:16px;color:#0369A1"></i>',
            "النسخ الاحتياطي",
          )
        : "") +
      (canDo("deleteItem")
        ? _settingsNavItem(
            "danger",
            '<i class="ti ti-alert-triangle" style="font-size:16px;color:#ef4444"></i>',
            "منطقة الخطر",
          )
        : "") +

  /**
   * تحويل hex إلى نسخة أغمق بنسبة 15%
   * مثال: #2563eb → #1d4ed8
   */
  function _darkenHex(hex) {
    try {
      hex = hex.replace("#", "");
      if (hex.length === 3)
        hex = hex
          .split("")
          .map(function (c) {
            return c + c;
          })
          .join("");
      var r = Math.max(0, parseInt(hex.slice(0, 2), 16) - 20);
      var g = Math.max(0, parseInt(hex.slice(2, 4), 16) - 20);
      var b = Math.max(0, parseInt(hex.slice(4, 6), 16) - 20);
      return (
        "#" +
        [r, g, b]
          .map(function (x) {
            return x.toString(16).padStart(2, "0");
          })
          .join("")
      );
    } catch (e) {
      return "#1d4ed8";
    }
  }
