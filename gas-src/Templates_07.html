      '<span class="sensitive-balance" style="font-size:14px;font-weight:700;color:' +
      balanceColor +
      '">' +
      (typeof formatMoney === "function"
        ? formatMoney(balance, { decimals: 0 })
        : NumberEngine.currency(balance)) +
      "</span></div>" +
      "</div>" +
      (s.address
        ? '<div style="margin-bottom:12px;padding:10px;background:var(--surface2);border-radius:8px"><span style="font-size:11px;color:var(--text3);font-weight:600">العنوان</span><br><span style="font-size:13px">' +
          esc(s.address) +
          "</span></div>"
        : "") +
      (s.notes
        ? '<div style="margin-bottom:12px;padding:10px;background:var(--surface2);border-radius:8px"><span style="font-size:11px;color:var(--text3);font-weight:600">ملاحظات</span><br><span style="font-size:13px">' +
          esc(s.notes) +
          "</span></div>"
        : "") +
      '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap">' +
      '<button class="btn" onclick="closeDrawer()">إغلاق</button>' +
      (s.phone
        ? '<a class="btn btn-outline" href="https://wa.me/' +
          esc(String(s.phone).replace(/[^0-9]/g, "")) +
          '" target="_blank" style="display:flex;align-items:center;gap:6px;color:#16a34a;border-color:#16a34a"><i class="ti ti-brand-whatsapp" style="font-size:14px"></i>واتساب</a>'
        : "") +
      '<button class="btn btn-outline" onclick="closeDrawer();openPartyMovements(\'' +
      esc(s.id) +
      '\', \'supplier\')" style="display:flex;align-items:center;gap:6px"><i class="ti ti-history" style="font-size:14px;color:#9A3412"></i>كشف الحركات</button>' +
      withPermission(
        '<button class="btn btn-primary" onclick="closeDrawer();editSupplier(\'' +
          esc(s.id) +
          "')\"> تعديل</button>",
        "updateSupplier",
      ) +
      "</div></div></div>"
    );
  }

  // ─────────────────────────────────────────────────────────────
  // §renderPartyMovements — Analytics Dashboard v3 للعميل / المورد
  // ─────────────────────────────────────────────────────────────
  /**
   * renderPartyMovements(partyId, partyType, data)
   *   partyId   — معرّف الطرف
   *   partyType — "customer" | "supplier"
   *   data      — { party, movements, stats } من السيرفر
   *
   *   v3: لوحة تحليلات احترافية — Hero + KPIs + Charts + Top Items + Timeline
   */
  function renderPartyMovements(partyId, partyType, data) {
    var isCustomer = partyType !== "supplier";
    var party = data.party || {};
    var movements = data.movements || [];
    var stats = data.stats || {};
    var tc = stats.typeCounts || {};
    var totalTx = stats.total || 0;

    function itemInfo(item_id, txObj) {
      if (txObj && txObj._item_code) {
        return { code: txObj._item_code, name: txObj._item_name || "" };
      }
      var obj = (APP.data.items || []).find(function (i) {
        return i.id === item_id;
      });
      if (!obj) return { code: item_id || "\u2014", name: "" };
      return { code: obj.code || obj.id, name: obj.name || "" };
    }

    // فلترة TRANSFER — تحويلات المخازن لا علاقة لها بالعميل/المورد
    movements = movements.filter(function (tx) {
      return tx.type !== "TRANSFER";
    });
    // إعادة حساب الإجماليات بعد الفلترة
    totalTx = movements.length;
    // إعادة بناء typeCounts بدون TRANSFER
    tc = {};
    movements.forEach(function (tx) {
      tc[tx.type] = (tc[tx.type] || 0) + 1;
    });
    stats.total = totalTx;
    stats.typeCounts = tc;

    var typeMap = {
      IN: {
        label: "\u0648\u0627\u0631\u062f",
        icon: "ti-arrow-bar-down",
        color: "success",
        hex: "#10B981",
        bg: "#ECFDF5",
        dotClass: "in",
      },
      OUT: {
        label: "\u0635\u0627\u062f\u0631",
        icon: "ti-arrow-bar-up",
        color: "danger",
        hex: "#EF4444",
        bg: "#FEF2F2",
        dotClass: "out",
      },
      DISPATCH: {
        label: "\u0635\u0631\u0641 \u0645\u0635\u0646\u0639",
        icon: "ti-building-factory-2",
        color: "warning",
        hex: "#D97706",
        bg: "#FFFBEB",
        dotClass: "other",
      },
      FG_IN: {
        label: "\u0627\u0633\u062a\u0644\u0627\u0645 \u062a\u0627\u0645",
        icon: "ti-circle-check",
        color: "teal",
        hex: "#0D9488",
        bg: "#F0FDFA",
        dotClass: "in",
      },
      FACTORY_RETURN: {
        label: "\u0645\u0631\u062a\u062c\u0639 \u0645\u0635\u0646\u0639",
        icon: "ti-rotate-clockwise-2",
        color: "orange",
        hex: "#EA580C",
        bg: "#FFF7ED",
        dotClass: "other",
      },
    };

    function txBadge(type) {
      var t = typeMap[type] || {
        label: type || "\u2014",
        icon: "ti-activity",
        color: "primary",
      };
      return (
        "<span class=\'tx-badge tx-badge-" +
        t.color +
        "\' style=\'display:inline-flex;align-items:center;gap:4px\'><i class=\'ti " +
        t.icon +
        "\' style=\'font-size:12px\'></i>" +
        esc(t.label) +
        "</span>"
      );
    }

    // Hero
    var partyInitial = (party.name || (isCustomer ? "\u0639" : "\u0645"))[0];
    var heroColor = isCustomer ? "#2563EB" : "#9A3412";
    var lastDateStr = stats.lastDate ? fmtDate(stats.lastDate) : "\u2014";
    var firstDateStr = stats.firstDate ? fmtDate(stats.firstDate) : "\u2014";

    var heroHtml =
      "<div class=\'pa-hero\' style=\'background:linear-gradient(135deg," +
      heroColor +
      " 0%," +
      (isCustomer ? "#1d4ed8" : "#7C2D12") +
      " 100%)\'>" +
      "<div class=\'pa-hero-avatar\'>" +
      esc(partyInitial) +
      "</div>" +
      "<div style=\'flex:1;min-width:0\'><div class=\'pa-hero-name\'>" +
      esc(party.name || "\u2014") +
      "</div>" +
      "<div class=\'pa-hero-meta\'>" +
      (party.phone
        ? "<span><i class=\'ti ti-phone\'></i>" + esc(party.phone) + "</span>"
        : "") +
      (party.email
        ? "<span><i class=\'ti ti-mail\'></i>" + esc(party.email) + "</span>"
        : "") +
      (party.address
        ? "<span><i class=\'ti ti-map-pin\'></i>" +
          esc(party.address) +
          "</span>"
        : "") +
      "<span><i class=\'ti ti-calendar-event\'></i>\u0623\u0648\u0644 \u062d\u0631\u0643\u0629: " +
      firstDateStr +
      "</span>" +
      "<span><i class=\'ti ti-clock\'></i>\u0622\u062e\u0631 \u062d\u0631\u0643\u0629: " +
      lastDateStr +
      "</span>" +
      "</div></div>" +
      "<div class=\'pa-hero-actions\'>" +
      "<button class=\'pa-hero-btn\' onclick=\'exportPartyMovements()\'><i class=\'ti ti-download\'></i>\u062a\u0635\u062f\u064a\u0631 CSV</button>" +
      // [BANKING-INTEGRATION — المرحلة 11] رابط سريع لشيكات هذا العميل/المورد
      // من موديول البنوك (APP.data.cheques، مرتبطة بـ party_id/party_type) —
      // بدون أي نداء سيرفر إضافي، ونفس صلاحية شاشة الشيكات نفسها.
      (typeof canDo === "function" && canDo("viewCheques")
        ? "<button class=\'pa-hero-btn\' onclick=\'openPartyCheques(\"" +
          String(party.id || "").replace(/"/g, "\'") +
          '","' +
          (isCustomer ? "CUSTOMER" : "SUPPLIER") +
          '","' +
          (party.name || "").replace(/"/g, "\'") +
          "\")\'><i class=\'ti ti-receipt-2\'></i>\u0634\u064a\u0643\u0627\u062a \u0647\u0630\u0627 \u0627\u0644\u0637\u0631\u0641</button>"
        : "") +
      (isCustomer &&
      typeof WA_CONFIG !== "undefined" &&
      WA_CONFIG.isEnabled() &&
      typeof canDo === "function" &&
      canDo("sendWhatsapp")
        ? "<button class=\'pa-hero-btn\' style=\'background:rgba(37,211,102,.22);color:#fff\' onclick=\'WA_MODAL.open({" +
          'category:"statement_message",customer_name:"' +
          (party.name || "").replace(/"/g, "\'") +
          '",phone:"' +
          (party.phone || "").replace(/"/g, "\'") +
          '",customer_id:"' +
          (party.id || "").replace(/"/g, "\'") +
          '",source_type:"statement",source_id:"' +
          (party.id || "").replace(/"/g, "\'") +
          '",context_data:{customer_name:"' +
          (party.name || "").replace(/"/g, "\'") +
          "\"}})\'>\u0648\u0627\u062a\u0633\u0627\u0628</button>"
        : "") +
      "<button class=\'pa-hero-btn\' onclick=\'typeof closeModal===\"function\" ? closeModal() : null\'><i class=\'ti ti-x\'></i></button>" +
      "</div></div>";

    // KPI — labels مخصصة حسب نوع الطرف
    var inQty = 0,
      outQty = 0,
      returnQty = 0;
    movements.forEach(function (tx) {
      var q = Number(tx.quantity || 0);
      if (tx.type === "IN" || tx.type === "FG_IN") inQty += q;
      else if (tx.type === "OUT" || tx.type === "DISPATCH") outQty += q;
      else if (tx.type === "FACTORY_RETURN") returnQty += q;
    });
    // المورد: وارد=استلام بضاعة | صادر=مرتجع مورد
    // العميل: صادر=بيع | وارد=مرتجع عميل
    var inLabel = isCustomer
      ? "\u0645\u0631\u062a\u062c\u0639 \u0639\u0645\u064a\u0644"
      : "\u0627\u0633\u062a\u0644\u0627\u0645 \u0645\u0648\u0631\u062f";
    var outLabel = isCustomer
      ? "\u0645\u0628\u064a\u0639\u0627\u062a"
      : "\u0645\u0631\u062a\u062c\u0639 \u0645\u0648\u0631\u062f";
    var inIcon = isCustomer ? "ti-arrow-back-up" : "ti-arrow-bar-down";
    var outIcon = isCustomer ? "ti-shopping-cart" : "ti-arrow-back-up";
    function kpiCard(cls, icon, label, value, sub) {
      return (
        "<div class=\'pa-kpi-card " +
        cls +
        "\'><div class=\'pa-kpi-icon\'><i class=\'ti " +
        icon +
        "\'></i></div><div class=\'pa-kpi-label\'>" +
        label +
        "</div><div class=\'pa-kpi-value\'>" +
        value +
        "</div><div class=\'pa-kpi-sub\'>" +
        sub +
        "</div></div>"
      );
    }
    var kpiHtml =
      "<div class=\'pa-kpi-grid\'>" +
      kpiCard(
        "total",
        "ti-history",
        "\u0625\u062c\u0645\u0627\u0644\u064a \u0627\u0644\u062d\u0631\u0643\u0627\u062a",
        totalTx,
        (stats.warehouseCount || 0) +
          " \u0645\u062e\u0632\u0646 \u0645\u062a\u0639\u0627\u0645\u0644",
      ) +
      kpiCard(
        "in",
        inIcon,
        inLabel,
        (tc.IN || 0) + (tc.FG_IN ? "+" + tc.FG_IN : ""),
        inQty.toLocaleString("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        }) + " \u0648\u062d\u062f\u0629",
      ) +
      kpiCard(
        "out",
        outIcon,
        outLabel,
        (tc.OUT || 0) + (tc.DISPATCH ? "+" + tc.DISPATCH : ""),
        outQty.toLocaleString("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        }) + " \u0648\u062d\u062f\u0629",
      ) +
      kpiCard(
        "trans",
        "ti-rotate-clockwise-2",
        "\u0645\u0631\u062a\u062c\u0639 \u0645\u0635\u0646\u0639",
        tc.FACTORY_RETURN || 0,
        returnQty.toLocaleString("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        }) + " \u0648\u062d\u062f\u0629",
      ) +
      "</div>";

    // Bar Chart
    var monthBuckets = {};
    movements.forEach(function (tx) {
      if (!tx.date) return;
      var d = new Date(tx.date);
      var key =
        d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      if (!monthBuckets[key]) monthBuckets[key] = { in: 0, out: 0 };
      if (tx.type === "IN" || tx.type === "FG_IN")
        monthBuckets[key].in += Number(tx.quantity || 0);
      else if (tx.type === "OUT" || tx.type === "DISPATCH")
        monthBuckets[key].out += Number(tx.quantity || 0);
    });
    var monthKeys = Object.keys(monthBuckets).sort().slice(-8);
    var maxVal = 1;
    monthKeys.forEach(function (k) {
      var t = monthBuckets[k].in + monthBuckets[k].out;
      if (t > maxVal) maxVal = t;
    });

    var chartHtml = "";
    if (monthKeys.length > 0) {
      var arabicMonths = [
        "\u064a\u0646\u0627\u064a\u0631",
        "\u0641\u0628\u0631\u0627\u064a\u0631",
        "\u0645\u0627\u0631\u0633",
        "\u0623\u0628\u0631\u064a\u0644",
        "\u0645\u0627\u064a\u0648",
        "\u064a\u0648\u0646\u064a\u0648",
        "\u064a\u0648\u0644\u064a\u0648",
        "\u0623\u063a\u0633\u0637\u0633",
        "\u0633\u0628\u062a\u0645\u0628\u0631",
        "\u0623\u0643\u062a\u0648\u0628\u0631",
        "\u0646\u0648\u0641\u0645\u0628\u0631",
        "\u062f\u064a\u0633\u0645\u0628\u0631",
      ];
      var svgW = 560,
        svgH = 130,
        padL = 8,
        padR = 8,
        padT = 8,
        padB = 28;
      var n = monthKeys.length;
      var barW = Math.max(6, Math.floor((svgW - padL - padR) / (n * 3)));
      var groupW = barW * 2 + 3;
      var groupGap = Math.floor(
        (svgW - padL - padR - n * groupW) / Math.max(n - 1, 1),
      );
      var chartAreaH = svgH - padT - padB;
      var bars = "",
        xLabels = "",
        gridLines = "";
      for (var gi = 1; gi <= 4; gi++) {
        var gy = padT + chartAreaH - (chartAreaH * gi) / 4;
        gridLines +=
          "<line x1=\'8\' y1=\'" +
          gy +
          "\' x2=\'552\' y2=\'" +
          gy +
          "\' stroke=\'var(--border)\' stroke-width=\'1\' stroke-dasharray=\'4,4\'/>";
      }
      monthKeys.forEach(function (k, i) {
        var d = monthBuckets[k];
        var inH = Math.max(2, (d.in / maxVal) * chartAreaH);
        var outH = Math.max(2, (d.out / maxVal) * chartAreaH);
        var x = padL + i * (groupW + groupGap);
        bars +=
          "<rect x=\'" +
          x +
          "\' y=\'" +
          (padT + chartAreaH - inH) +
          "\' width=\'" +
          barW +
          "\' height=\'" +
          inH +
          "\' rx=\'3\' fill=\'#10B981\' opacity=\'.85\'></rect>";
        bars +=
          "<rect x=\'" +
          (x + barW + 2) +
          "\' y=\'" +
          (padT + chartAreaH - outH) +
          "\' width=\'" +
          barW +
          "\' height=\'" +
          outH +
          "\' rx=\'3\' fill=\'#EF4444\' opacity=\'.85\'></rect>";
        var parts = k.split("-");
        var mLabel = arabicMonths[parseInt(parts[1], 10) - 1] || parts[1];
        xLabels +=
          "<text x=\'" +
          (x + groupW / 2) +
          "\' y=\'" +
          (svgH - 6) +
          "\' text-anchor=\'middle\' font-size=\'9\' fill=\'var(--text3)\' font-family=\'IBM Plex Sans Arabic,sans-serif\'>" +
          mLabel +
          "</text>";
      });
      chartHtml =
        "<div class=\'pa-chart-card\'>" +
        "<div class=\'pa-chart-title\'><i class=\'ti ti-chart-bar\' style=\'color:var(--accent)\'></i>\u0646\u0634\u0627\u0637 \u0627\u0644\u062d\u0631\u0643\u0627\u062a \u0627\u0644\u0634\u0647\u0631\u064a</div>" +
        "<div class=\'pa-chart-sub\'>\u0645\u0642\u0627\u0631\u0646\u0629 \u0627\u0644\u0643\u0645\u064a\u0627\u062a \u0627\u0644\u0648\u0627\u0631\u062f\u0629 \u0648\u0627\u0644\u0635\u0627\u062f\u0631\u0629 \u0634\u0647\u0631\u064a\u0627\u064b</div>" +
        "<div class=\'pa-chart-wrap\'><svg class=\'pa-chart-svg\' viewBox=\'0 0 560 130\' xmlns=\'http://www.w3.org/2000/svg\'>" +
        gridLines +
        bars +
        xLabels +
        "</svg></div>" +
        "<div class=\'pa-chart-legend\'>" +
        "<div class=\'pa-chart-legend-item\'><div class=\'pa-chart-legend-dot\' style=\'background:#10B981\'></div>\u0648\u0627\u0631\u062f / \u0627\u0633\u062a\u0644\u0627\u0645</div>" +
        "<div class=\'pa-chart-legend-item\'><div class=\'pa-chart-legend-dot\' style=\'background:#EF4444\'></div>\u0635\u0627\u062f\u0631 / \u0635\u0631\u0641</div>" +
        "</div></div>";
    } else {
      // [CONSISTENCY] نفس رسالة اللا-بيانات المستخدمة في كارت "أكثر
      // الأصناف حركة" و"توزيع المخازن" — قبل كده الكارت كان يختفي تمامًا
      // بدون أي تفسير لو الطرف لسه مفيهوش حركات (عميل/مورد جديد).
      chartHtml =
        "<div class=\'pa-chart-card\'>" +
        "<div class=\'pa-chart-title\'><i class=\'ti ti-chart-bar\' style=\'color:var(--accent)\'></i>\u0646\u0634\u0627\u0637 \u0627\u0644\u062d\u0631\u0643\u0627\u062a \u0627\u0644\u0634\u0647\u0631\u064a</div>" +
        "<div style=\'text-align:center;padding:24px;color:var(--text3);font-size:12px\'>\u0644\u0627 \u062a\u0648\u062c\u062f \u062d\u0631\u0643\u0627\u062a \u0645\u0633\u062c\u0644\u0629 \u0628\u0639\u062f</div>" +
        "</div>";
    }

    // Top Items
    var itemAgg = {};
    movements.forEach(function (tx) {
      var inf = itemInfo(tx.item_id, tx);
      var k = inf.code;
      if (!itemAgg[k]) itemAgg[k] = { code: inf.code, name: inf.name, qty: 0 };
      itemAgg[k].qty += Number(tx.quantity || 0);
    });
    var topItems = Object.keys(itemAgg)
      .map(function (k) {
        return itemAgg[k];
      })
      .sort(function (a, b) {
        return b.qty - a.qty;
      })
      .slice(0, 7);
    var maxItemQty = topItems.length ? topItems[0].qty : 1;
    var rankClasses = ["gold", "silver", "bronze"];
    var itemsHtml =
      "<div class=\'pa-items-card\'><div class=\'pa-section-title\'><i class=\'ti ti-package\'></i>\u0623\u0643\u062b\u0631 \u0627\u0644\u0623\u0635\u0646\u0627\u0641 \u062d\u0631\u0643\u0629</div>";
    if (topItems.length) {
      topItems.forEach(function (item, idx) {
        var pct = Math.round((item.qty / maxItemQty) * 100);
        itemsHtml +=
          "<div class=\'pa-item-row\'><div class=\'pa-item-rank " +
          (rankClasses[idx] || "") +
          "\'>" +
          (idx + 1) +
          "</div><span class=\'pa-item-code\'>" +
          esc(item.code) +
          "</span><span class=\'pa-item-name\' title=\'" +
          esc(item.name) +
          "\'>" +
          esc(item.name || "\u2014") +
          "</span><div class=\'pa-item-bar-wrap\'><div class=\'pa-item-bar-fill\' style=\'width:" +
          pct +
          "%\'></div></div><span class=\'pa-item-qty\'>" +
          item.qty.toLocaleString("en-US", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0,
          }) +
          "</span></div>";
      });
    } else {
      itemsHtml +=
        "<div style=\'text-align:center;padding:20px;color:var(--text3);font-size:12px\'>\u0644\u0627 \u062a\u0648\u062c\u062f \u0623\u0635\u0646\u0627\u0641</div>";
    }
    itemsHtml += "</div>";

    // Warehouse
    var whAgg = {};
    movements.forEach(function (tx) {
      [tx.from_warehouse, tx.to_warehouse].forEach(function (w) {
        if (w) whAgg[w] = (whAgg[w] || 0) + 1;
      });
    });
    var whList = Object.keys(whAgg)
      .map(function (k) {
        return { name: k, count: whAgg[k] };
      })
      .sort(function (a, b) {
        return b.count - a.count;
      })
      .slice(0, 6);
    var maxWhCount = whList.length ? whList[0].count : 1;
    var whHtml =
      "<div class=\'pa-items-card\'><div class=\'pa-section-title\'><i class=\'ti ti-building-warehouse\'></i>\u062a\u0648\u0632\u064a\u0639 \u0627\u0644\u0645\u062e\u0627\u0632\u0646</div>";
    whList.forEach(function (wh) {
      var pct = Math.round((wh.count / maxWhCount) * 100);
      var pctTotal = totalTx ? Math.round((wh.count / totalTx) * 100) : 0;
      whHtml +=
        "<div class=\'pa-wh-row\'><div class=\'pa-wh-icon\'><i class=\'ti ti-building-warehouse\'></i></div><span class=\'pa-wh-name\'>" +
        esc(wh.name) +
        "</span><div class=\'pa-wh-bar-wrap\'><div class=\'pa-wh-bar-fill\' style=\'width:" +
        pct +
        "%\'></div></div><span class=\'pa-wh-pct\'>" +
        pctTotal +
        "%</span></div>";
    });
    if (!whList.length)
      whHtml +=
        "<div style=\'text-align:center;padding:20px;color:var(--text3);font-size:12px\'>\u0644\u0627 \u062a\u0648\u062c\u062f \u0628\u064a\u0627\u0646\u0627\u062a</div>";
    whHtml += "</div>";

    // Donut
    var typeColors = {
      IN: "#10B981",
      OUT: "#EF4444",
      DISPATCH: "#D97706",
      FG_IN: "#0D9488",
      FACTORY_RETURN: "#EA580C",
    };
    // labels مخصصة حسب العميل/المورد
    var typeNames = isCustomer
      ? {
          IN: "\u0645\u0631\u062a\u062c\u0639 \u0639\u0645\u064a\u0644",
          OUT: "\u0645\u0628\u064a\u0639\u0627\u062a",
          DISPATCH: "\u0635\u0631\u0641 \u0645\u0635\u0646\u0639",
          FG_IN: "\u0627\u0633\u062a\u0644\u0627\u0645 \u062a\u0627\u0645",
          FACTORY_RETURN:
            "\u0645\u0631\u062a\u062c\u0639 \u0645\u0635\u0646\u0639",
        }
      : {
          IN: "\u0627\u0633\u062a\u0644\u0627\u0645 \u0645\u0648\u0631\u062f",
          OUT: "\u0645\u0631\u062a\u062c\u0639 \u0645\u0648\u0631\u062f",
          DISPATCH: "\u0635\u0631\u0641 \u0645\u0635\u0646\u0639",
          FG_IN: "\u0627\u0633\u062a\u0644\u0627\u0645 \u062a\u0627\u0645",
          FACTORY_RETURN:
            "\u0645\u0631\u062a\u062c\u0639 \u0645\u0635\u0646\u0639",
        };
    var activeTypes = Object.keys(tc).filter(function (t) {
      return tc[t] > 0;
    });
    var donutR = 38,
      donutCx = 45,
      donutCy = 45,
      donutStroke = 12;
    var donutCirc = 2 * Math.PI * donutR;
    var donutPaths = "",
      legendRows = "",
      cumulative = 0;
    activeTypes.forEach(function (t) {
      var frac = totalTx ? tc[t] / totalTx : 0;
      var dash = frac * donutCirc;
      var offset = donutCirc - cumulative * donutCirc;
      var col = typeColors[t] || "#94a3b8";
      donutPaths +=
        "<circle cx=\'" +
        donutCx +
        "\' cy=\'" +
        donutCy +
        "\' r=\'" +
        donutR +
        "\' fill=\'none\' stroke=\'" +
        col +
        "\' stroke-width=\'" +
        donutStroke +
        "\' stroke-dasharray=\'" +
        dash +
        " " +
        (donutCirc - dash) +
        "\' stroke-dashoffset=\'" +
        offset +
        "\' transform=\'rotate(-90 " +
        donutCx +
        " " +
        donutCy +
        ")\'></circle>";
      cumulative += frac;
      legendRows +=
        "<div class=\'pa-donut-leg-row\'><div class=\'pa-donut-leg-dot\' style=\'background:" +
        col +
        "\'></div><span class=\'pa-donut-leg-label\'>" +
        (typeNames[t] || t) +
        "</span><span class=\'pa-donut-leg-val\'>" +
        tc[t] +
        "</span><span class=\'pa-donut-leg-pct\'>(" +
        Math.round(frac * 100) +
        "%)</span></div>";
    });
    var donutHtml =
      "<div class=\'pa-items-card\'><div class=\'pa-section-title\'><i class=\'ti ti-chart-donut-3\'></i>\u062a\u0648\u0632\u064a\u0639 \u0623\u0646\u0648\u0627\u0639 \u0627\u0644\u062d\u0631\u0643\u0627\u062a</div><div class=\'pa-donut-wrap\'><svg width=\'90\' height=\'90\' viewBox=\'0 0 90 90\' style=\'flex-shrink:0\'><circle cx=\'45\' cy=\'45\' r=\'38\' fill=\'none\' stroke=\'var(--surface2)\' stroke-width=\'12\'></circle>" +
      donutPaths +
      "<text x=\'45\' y=\'49\' text-anchor=\'middle\' font-size=\'13\' font-weight=\'800\' fill=\'var(--text1)\' font-family=\'IBM Plex Sans Arabic,sans-serif\'>" +
      totalTx +
      "</text><text x=\'45\' y=\'60\' text-anchor=\'middle\' font-size=\'7\' fill=\'var(--text3)\' font-family=\'IBM Plex Sans Arabic,sans-serif\'>\u062d\u0631\u0643\u0629</text></svg><div class=\'pa-donut-legend\'>" +
      legendRows +
      "</div></div></div>";

    // Tabs
    var tabsHtml =
      "<div class=\'pa-tabs\'>" +
      "<button class=\'pa-tab active\' id=\'pa-tab-overview\' onclick=\'_paSwitch(\"overview\")\'><i class=\'ti ti-chart-bar\'></i>\u0644\u0648\u062d\u0629 \u0627\u0644\u062a\u062d\u0644\u064a\u0644\u0627\u062a</button>" +
      "<button class=\'pa-tab\' id=\'pa-tab-table\' onclick=\'_paSwitch(\"table\")\'><i class=\'ti ti-table\'></i>\u062c\u062f\u0648\u0644 \u0627\u0644\u062d\u0631\u0643\u0627\u062a<span style=\'background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px;font-size:10px;margin-right:4px\'>" +
      totalTx +
      "</span></button>" +
      "</div>";

    // Table panel
    var existingTypes2 = activeTypes;
    var typeFilterBtns =
      "<button class=\'pm-type-btn active\' data-pmfilter=\'\'  onclick=\'_pmFilter(this)\'>\u0627\u0644\u0643\u0644 <span style=\'opacity:.6;font-weight:400\'>(" +
      totalTx +
      ")</span></button>" +
      existingTypes2
        .map(function (t) {
          var info = typeMap[t] || { label: t };
          return (
            "<button class=\'pm-type-btn\' data-pmfilter=\'" +
            esc(t) +
            "\' onclick=\'_pmFilter(this)\'>" +
            esc(info.label) +
            " <span style=\'opacity:.6;font-weight:400\'>(" +
            (tc[t] || 0) +
            ")</span></button>"
          );
        })
        .join("");

    function buildRows(txGroups) {
      if (!txGroups.length) return "";
      return txGroups
        .map(function (grp) {
          var first = grp.items[0];
          var isMulti = grp.items.length > 1;
          var dateObj = first.date ? new Date(first.date) : null;
          var dateStr = dateObj ? fmtDate(dateObj) : "\u2014";
          var timeStr = dateObj ? fmtTime(dateObj) : "\u2014";
          var totalQty = grp.items.reduce(function (s, t) {
            return s + Number(t.quantity || 0);
          }, 0);
          var refCell = grp.isPermit
            ? "<div style=\'display:flex;flex-direction:column;gap:1px\'><span class=\'mono\' style=\'color:var(--success);font-weight:700;font-size:13px\'>" +
              esc(grp.key) +
              "</span>" +
              (isMulti
                ? "<span style=\'color:var(--accent);font-size:10px;font-weight:600\'>" +
                  grp.items.length +
                  " \u0623\u0635\u0646\u0627\u0641</span>"
                : "<span class=\'mono\' style=\'color:var(--text3);font-size:10px\'>" +
                  esc(first.id || "") +
                  "</span>") +
              "</div>"
            : "<span class=\'mono\' style=\'color:var(--text3);font-size:11px\'>" +
              esc(first.id || "\u2014") +
              "</span>";
          var _seenCodes = {},
            _codes = [];
          grp.items.forEach(function (t) {
            var inf = itemInfo(t.item_id, t);
            if (!_seenCodes[inf.code]) {
              _seenCodes[inf.code] = true;
              _codes.push({ code: inf.code, name: inf.name });
            }
          });
          var itemsCell =
            "<div style=\'display:flex;flex-wrap:wrap;gap:4px\'>" +
            _codes
              .map(function (c) {
                return (
                  "<span title=\'" +
                  esc(c.name) +
                  "\' style=\'display:inline-block;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:700;font-family:var(--font-mono);white-space:nowrap\'>" +
                  esc(c.code) +
                  "</span>"
                );
              })
              .join("") +
            "</div>";
          var wh =
            first.type === "IN" ||
            first.type === "FG_IN" ||
            first.type === "FACTORY_RETURN"
              ? first.to_warehouse || "\u2014"
              : first.type === "OUT" || first.type === "DISPATCH"
                ? first.from_warehouse || "\u2014"
                : (first.from_warehouse || "\u2014") +
                  (first.to_warehouse ? " \u2190 " + first.to_warehouse : "");
          var safeKey = esc(grp.key).replace(/[^a-zA-Z0-9]/g, "_");
          var expandBtn = isMulti
            ? "<button id=\'pm-expand-btn-" +
              safeKey +
              "\' class=\'btn btn-xs\' style=\'background:var(--bg2);border:1px solid var(--border);color:var(--text2);width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px\' onclick=\"_pmToggleExpand(\'" +
              esc(grp.key) +
              "')\"><i class=\'ti ti-chevron-down\' style=\'font-size:13px\'></i></button>"
            : "";
          var notesHtml = first.notes
            ? "<span style=\'font-size:11px;color:var(--text3);margin-top:2px;display:block\'>" +
              esc(first.notes) +
              "</span>"
            : "";
          var mainRow =
            "<tr data-pmkey=\'" +
            esc(grp.key) +
            "\' data-pmtype=\'" +
            esc(first.type || "") +
            "\' data-pmsearch=\'" +
            esc(
              (
                (grp.key || "") +
                " " +
                (first.id || "") +
                " " +
                _codes
                  .map(function (c) {
                    return c.code + " " + c.name;
                  })
                  .join(" ") +
                " " +
                (first.notes || "") +
                " " +
                (first.user || "")
              ).toLowerCase(),
            ) +
            "\'>" +
            "<td>" +
            refCell +
            "</td><td style=\'font-size:13px;font-weight:600;color:var(--text1)\'>" +
            dateStr +
            "</td><td style=\'font-size:12px;color:var(--text3);font-family:var(--font-mono)\'>" +
            timeStr +
            "</td><td>" +
            txBadge(first.type) +
            "</td><td>" +
            itemsCell +
            "</td>" +
            "<td style=\'text-align:center\'><span style=\'font-weight:800;font-size:15px;background:var(--surface2);border-radius:8px;padding:2px 10px;display:inline-block;font-family:var(--font-mono)\'>" +
            totalQty +
            "</span></td>" +
            "<td><span style=\'font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px\'><i class=\'ti ti-building-warehouse\' style=\'font-size:12px;color:var(--text3)\'></i>" +
            esc(wh) +
            "</span>" +
            notesHtml +
            "</td>" +
            "<td>" +
            esc(first.user || "\u2014") +
            "</td><td style=\'text-align:center\'>" +
            expandBtn +
            "</td></tr>";
          var expandRow = "";
          if (isMulti) {
            var innerRows = grp.items
              .map(function (t) {
                var inf = itemInfo(t.item_id, t);
                return (
                  "<tr style=\'background:var(--surface2)\'><td style=\'padding:8px 12px\'><span class=\'mono\' style=\'font-size:11px;color:var(--text3)\'>" +
                  esc(t.id || "") +
                  "</span></td><td style=\'padding:8px 12px\' colspan=\'2\'><span class=\'mono\' style=\'font-weight:700;font-size:13px;color:var(--text1)\'>" +
                  esc(inf.code) +
                  "</span>" +
                  (inf.name
                    ? "<span style=\'font-size:11px;color:var(--text3);display:block\'>" +
                      esc(inf.name) +
                      "</span>"
                    : "") +
                  "</td><td style=\'padding:8px 12px\'>" +
                  txBadge(t.type) +
                  "</td><td style=\'padding:8px 12px;font-weight:700;font-family:var(--font-mono)\'>" +
                  Number(t.quantity || 0) +
                  "</td><td style=\'padding:8px 12px;font-size:12px;color:var(--text3)\'>" +
                  esc(t.color || "\u2014") +
                  "</td><td style=\'padding:8px 12px\' colspan=\'3\'>" +
                  esc(t.notes || "") +
                  "</td></tr>"
                );
              })
              .join("");
            expandRow =
              "<tr id=\'pm-expand-" +
              safeKey +
              "\' class=\'pm-expand-row\' style=\'display:none\'><td colspan=\'9\'><div class=\'pm-expand-inner\'><table style=\'width:100%;border-collapse:collapse\'><thead><tr style=\'background:var(--bg2)\'><th style=\'padding:6px 12px;font-size:11px;color:var(--text3);font-weight:700\'>\u0627\u0644\u0645\u0639\u0631\u0651\u0641</th><th style=\'padding:6px 12px;font-size:11px;color:var(--text3);font-weight:700\' colspan=\'2\'>\u0627\u0644\u0635\u0646\u0641</th><th style=\'padding:6px 12px;font-size:11px;color:var(--text3);font-weight:700\'>\u0627\u0644\u0646\u0648\u0639</th><th style=\'padding:6px 12px;font-size:11px;color:var(--text3);font-weight:700\'>\u0627\u0644\u0643\u0645\u064a\u0629</th><th style=\'padding:6px 12px;font-size:11px;color:var(--text3);font-weight:700\'>\u0627\u0644\u0644\u0648\u0646</th><th style=\'padding:6px 12px;font-size:11px;color:var(--text3);font-weight:700\' colspan=\'3\'>\u0627\u0644\u0645\u0644\u0627\u062d\u0638\u0627\u062a</th></tr></thead><tbody>" +
              innerRows +
              "</tbody></table></div></td></tr>";
          }
          return mainRow + expandRow;
        })
        .join("");
    }

    // group movements
    var groups = [],
      permitMap2 = {};
    movements.forEach(function (tx) {
      var _txRef = tx.ref == null ? "" : String(tx.ref);
      var key = _txRef.trim() ? _txRef.trim() : null;
      if (key) {
        if (permitMap2.hasOwnProperty(key)) {
          groups[permitMap2[key]].items.push(tx);
        } else {
          permitMap2[key] = groups.length;
          groups.push({ key: key, isPermit: true, items: [tx] });
        }
      } else {
        groups.push({ key: tx.id, isPermit: false, items: [tx] });
      }
    });

    var rowsHtml = buildRows(groups);

    var waTimelineHtml =
      isCustomer && typeof renderCustomerWaTimelineCard === "function"
        ? renderCustomerWaTimelineCard(partyId)
        : "";

    var overviewPanel =
      "<div id=\'pa-panel-overview\'>" +
      kpiHtml +
      chartHtml +
      "<div class=\'pa-two-col\'>" +
      donutHtml +
      whHtml +
      "</div>" +
      itemsHtml +
      waTimelineHtml +
      "</div>";
    var tablePanel =
      "<div id=\'pa-panel-table\' style=\'display:none\'><div class=\'card\' style=\'padding:0;overflow:hidden\'>" +
      "<div class=\'pm-filter-bar\'><div class=\'pm-search-wrap\'><i class=\'ti ti-search pm-search-icon\'></i><input class=\'input\' id=\'pm-search-input\' placeholder=\'\u0628\u062d\u062b \u0628\u0631\u0642\u0645 \u0627\u0644\u0633\u0646\u062f\u060c \u0643\u0648\u062f \u0627\u0644\u0635\u0646\u0641\u060c \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645\u060c \u0627\u0644\u0645\u0644\u0627\u062d\u0638\u0627\u062a...\' oninput=\'_pmSearch(this.value)\'></div>" +
      "<div class=\'pm-type-filters\'>" +
      typeFilterBtns +
      "</div>" +
      "<span id=\'pm-count-badge\' style=\'font-size:12px;color:var(--text3);background:var(--bg);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap\'>" +
      totalTx +
      " \u062d\u0631\u0643\u0629</span></div>" +
      "<div class=\'pm-table-wrap\'><table><thead><tr>" +
      "<th style=\'width:150px\'>\u0631\u0642\u0645 \u0627\u0644\u0633\u0646\u062f</th><th style=\'width:100px\'>\u0627\u0644\u062a\u0627\u0631\u064a\u062e</th><th style=\'width:70px\'>\u0627\u0644\u0648\u0642\u062a</th><th style=\'width:110px\'>\u0627\u0644\u0646\u0648\u0639</th><th>\u0627\u0644\u0623\u0635\u0646\u0627\u0641</th><th style=\'width:80px;text-align:center\'>\u0627\u0644\u0643\u0645\u064a\u0629</th><th style=\'width:150px\'>\u0627\u0644\u0645\u062e\u0632\u0646 / \u0627\u0644\u0645\u0644\u0627\u062d\u0638\u0627\u062a</th><th style=\'width:110px\'>\u0628\u0648\u0627\u0633\u0637\u0629</th><th style=\'width:50px;text-align:center\'></th>" +
      "</tr></thead><tbody id=\'pm-tbody\'>" +
      (rowsHtml ||
        "<tr><td colspan=\'9\' class=\'pm-empty\'><div class=\'pm-empty-icon\'>\ud83d\udccb</div><p>\u0644\u0627 \u062a\u0648\u062c\u062f \u062d\u0631\u0643\u0627\u062a \u0645\u0633\u062c\u0644\u0629 \u0644\u0647\u0630\u0627 \u0627\u0644\u0637\u0631\u0641</p></td></tr>") +
      "</tbody></table></div>" +
      "<div style=\'padding:10px 16px;border-top:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between\'><span style=\'font-size:12px;color:var(--text3)\'>\u0625\u062c\u0645\u0627\u0644\u064a " +
      totalTx +
      " \u062d\u0631\u0643\u0629 \u0645\u062e\u0632\u0646\u064a\u0629</span>" +
      (stats.firstDate
        ? "<span style=\'font-size:12px;color:var(--text3)\'>\u0645\u0646 " +
          fmtDate(stats.firstDate) +
          " \u062d\u062a\u0649 " +
          fmtDate(stats.lastDate) +
          "</span>"
        : "") +
      "</div></div></div>";

    return (
      "<div style=\'width:100%\'>" +
      heroHtml +
      tabsHtml +
      overviewPanel +
      tablePanel +
      "</div>"
    );
  }
</script>
