  // على حدود دوال كاملة فقط (لا قطع لأي دالة في نص). تحقق برمجيًا:
  // التركيب النهائي لكل الأجزاء الـ10 مطابق 100% لمحتوى Templates.html
  // القديم حرفيًا (نفس الترتيب، بدون فقد أو تكرار).
  // يُحمَّل بالترتيب عبر <script> في Index.html مع باقي الأجزاء.
  // ═══════════════════════════════════════════════════════════════
  function _paSwitch(panel) {
    var ovEl = document.getElementById("pa-panel-overview");
    var tbEl = document.getElementById("pa-panel-table");
    var t1 = document.getElementById("pa-tab-overview");
    var t2 = document.getElementById("pa-tab-table");
    if (!ovEl || !tbEl) return;
    if (panel === "overview") {
      ovEl.style.display = "";
      tbEl.style.display = "none";
      if (t1) t1.classList.add("active");
      if (t2) t2.classList.remove("active");
    } else {
      ovEl.style.display = "none";
      tbEl.style.display = "";
      if (t1) t1.classList.remove("active");
      if (t2) t2.classList.add("active");
    }
  }

  // ─────────────────────────────────────────────────────────────
  // renderPartyMovementsPage — صفحة كشف حركات العملاء والموردين
  // نسخة v2 — تصميم full-screen بـ sidebar للقوائم
  // ─────────────────────────────────────────────────────────────
  function renderPartyMovementsPage() {
    var canSeeCustomers = canDo("viewCustomers");
    var canSeeSuppliers = canDo("viewSuppliers");
    var defaultType =
      window._pmpCurrentType || (canSeeSuppliers ? "supplier" : "customer");

    return (
      '<div class="pmp-shell">' +
      // ══════════════════════════════════════
      // SIDEBAR — قائمة الأطراف
      // ══════════════════════════════════════
      '<div class="pmp-sidebar">' +
      // ── عنوان الشاشة ──
      '<div class="pmp-sidebar-head">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">' +
      '<div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#1d4ed8);display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
      '<i class="ti ti-address-book" style="color:#fff;font-size:17px"></i></div>' +
      '<div><div style="font-size:14px;font-weight:800;color:var(--text1)">كشف الحركات</div>' +
      '<div style="font-size:11px;color:var(--text3)">العملاء والموردين</div></div>' +
      "</div>" +
      // ── تبويب النوع ──
      '<div class="pmp-type-tabs">' +
      (canSeeSuppliers
        ? '<button id="pmp-type-supplier" class="pmp-type-tab' +
          (defaultType === "supplier" ? " active supplier" : "") +
          '" onclick="pmpSetType(\'supplier\')">' +
          '<i class="ti ti-building-factory-2"></i><span>الموردين</span>' +
          '<span id="pmp-sup-count" class="pmp-tab-count"></span></button>'
        : "") +
      (canSeeCustomers
        ? '<button id="pmp-type-customer" class="pmp-type-tab' +
          (defaultType === "customer" ? " active customer" : "") +
          '" onclick="pmpSetType(\'customer\')">' +
          '<i class="ti ti-users"></i><span>العملاء</span>' +
          '<span id="pmp-cus-count" class="pmp-tab-count"></span></button>'
        : "") +
      "</div>" +
      // ── بحث ──
      '<div class="pmp-side-search-wrap">' +
      '<i class="ti ti-search pmp-side-search-icon"></i>' +
      '<input id="pmp-side-search" class="input pmp-side-search-input" placeholder="بحث بالاسم..." oninput="_pmpSideSearch(this.value)">' +
      "</div>" +
      "</div>" + // end sidebar-head
      // ── قائمة الأطراف ──
      '<div class="pmp-party-list" id="pmp-party-list">' +
      '<div class="pmp-list-empty">' +
      _loadingInline() +
      "</div>" +
      "</div>" +
      "</div>" + // end sidebar
      // ══════════════════════════════════════
      // MAIN — منطقة عرض الكشف
      // ══════════════════════════════════════

      '<div id="pmp-result" class="pmp-result-area">' +
      // حالة الترحيب الأولية
      '<div class="pmp-welcome">' +
      '<div class="pmp-welcome-icon">' +
      '<i class="ti ti-address-book" style="font-size:40px;color:var(--accent);opacity:.35"></i>' +
      "</div>" +
      '<div class="pmp-welcome-title">اختر عميلاً أو مورداً</div>' +
      '<div class="pmp-welcome-sub">اختر من القائمة على اليمين لعرض كشف حركاته المخزنية</div>' +
      "</div>" +

      "</div>" + // end main
      "</div>" // end shell

  // Event delegation عالمي لأزرار واتساب في جداول الفواتير
  (function _setupWaInvDelegation() {
    if (document._waInvDelegationSet) return;
    document._waInvDelegationSet = true;
    document.addEventListener("click", function (e) {
      var btn = e.target.closest(".wa-inv-btn");
      if (!btn) return;
      e.stopPropagation();
      var party = btn.getAttribute("data-wa-party") || "";
      var phone = btn.getAttribute("data-wa-phone") || "";
      var invId = btn.getAttribute("data-wa-inv-id") || "";
      var invDate = btn.getAttribute("data-wa-inv-date") || "";
      var invTot = btn.getAttribute("data-wa-inv-total") || "";
      if (typeof WA_MODAL !== "undefined") {
        WA_MODAL.open({
          category: "invoice_message",
          customer_name: party,
          phone: phone,
          customer_id: party,
          source_type: "invoice",
          source_id: invId,
          context_data: {
            customer_name: party,
            invoice_number: invId,
            invoice_date: invDate,
            invoice_total: invTot,
          },
        });
      }
    });
  })();

      "</div>" +
      '<div class="pmp-party-list" id="pmp-party-list">' +

      "</div>" +
      "</div>" +
      // MAIN
      '<div class="pmp-main">' +
      '<div id="pmp-result" class="pmp-result-area">' +
      '<div class="pmp-welcome">' +
      '<div class="pmp-welcome-icon">' +
      '<i class="ti ti-building-factory-2" style="font-size:40px;color:#7C3AED;opacity:.35"></i>' +
      "</div>" +
      '<div class="pmp-welcome-title">اختر مورداً</div>' +
      '<div class="pmp-welcome-sub">اختر من القائمة على اليمين لعرض كشف حركاته المخزنية</div>' +
      "</div>" +
      "</div>" +

      "</div>"
    );
  }

  // [DEDUP] نسخة مكررة — الدالة الحقيقية في 10_JS_Settings_Search_Parties.html

  // ══════════════════════════════════════════════════════
  // ERP v5: Accounting + HR render functions
  // ══════════════════════════════════════════════════════
  // ╔═════════════════════════════════════════════════════════════════╗

  // ================================================================
  // مساعدات مشتركة
  // ================================================================

  function _renderPageHeader(title, subtitle, icon, actions) {
    var html = '<div class="page-header">';
    html += '<div><h1 style="display:flex;align-items:center;gap:10px">';
    if (icon) html += iconBadge(icon.bgIcon, icon.bgColor, icon.iconColor);
    html += "<span>" + title + "</span></h1>";
    if (subtitle) html += '<p style="margin-top:4px">' + subtitle + "</p>";
    html += "</div>";
    if (actions) html += '<div class="header-actions">' + actions + "</div>";
    html += "</div>";
    return html;
  }

  // ================================================================
  // §R-ACCOUNTING  Accounting Module — موديول المحاسبة
  // ================================================================

  // ── Accounting Dashboard ──
  // ── Accounting Dashboard — Phase 3 (Dashboard Framework Work Center) ──
  // [PHASE-3] أول قسم يتطبق عليه DashboardWidgets (26_JS_DashboardFramework.html)
  // كمرجع (reference implementation) لباقي الأقسام في المراحل الجاية.
  // البيانات المعروضة كلها بتتحسب هنا مباشرة من APP.data (بعد ensureExtendedData
  // اللي بيتنفذ قبل استدعاء الدالة دي من الـ dispatcher في 01_JS_Core_Auth.html)
  // بدل تقسيمها بين render/bind — أبسط ومفيهاش أي داتا مبدئية وهمية.
  function renderAccountingDashboard() {
    var W = DashboardWidgets;
    var d = APP.data || {};
    var accs = d.chartOfAccounts || [];
    var boxes = d.cashBoxes || [];
    var banks = d.bankAccounts || [];
    var cheques = d.cheques || [];
    var fixedAssets = d.fixedAssets || [];
    var jents = (d.journalEntries || []).filter(function (e) {
      return !e.deleted_at;
    });

    var totalCash = boxes.reduce(function (s, b) {
      return (
        s +
        (parseFloat(
          b.current_balance != null ? b.current_balance : b.opening_balance,
        ) || 0)
      );
    }, 0);
    var totalBank = banks.reduce(function (s, b) {
      return (
        s +
        (parseFloat(
          b.current_balance != null ? b.current_balance : b.opening_balance,
        ) || 0)
      );
    }, 0);
    var pendingCheques = cheques.filter(function (c) {
      return c.status === "PENDING";
    });
    var fixedAssetsBookValue = fixedAssets.reduce(function (s, a) {
      return s + (parseFloat(a.book_value) || 0);
    }, 0);
    var pending = jents.filter(function (e) {
      return e.status === "DRAFT" || e.status === "مسودة";
    });

    // ── قيود هذا الشهر مقابل الشهر السابق (لحساب الاتجاه) ──
    var now = new Date();
    var thisMonthKey = now.getFullYear() + "-" + now.getMonth();
    var lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    var lastMonthKey =
      lastMonthDate.getFullYear() + "-" + lastMonthDate.getMonth();
    var thisMonthCount = 0,
      lastMonthCount = 0;
    jents.forEach(function (e) {
      var dt = e.date ? new Date(e.date) : null;
      if (!dt || isNaN(dt)) return;
      var key = dt.getFullYear() + "-" + dt.getMonth();
      if (key === thisMonthKey) thisMonthCount++;
      else if (key === lastMonthKey) lastMonthCount++;
    });
    var trend = null;
    if (lastMonthCount > 0) {
      var pct = Math.round(
        ((thisMonthCount - lastMonthCount) / lastMonthCount) * 100,
      );
      trend = {
        dir: pct >= 0 ? "up" : "down",
        value: Math.abs(pct) + "%",
        label: "عن الشهر السابق",
      };
    }

    var html = W.header({
      title: "المحاسبة",
      subtitle: "نظرة عامة على النظام المحاسبي — مركز عمل القسم",
      icon: {
        bgIcon: "ti-calculator",
        bgColor: "var(--accent-soft)",
        iconColor: "var(--primary)",
      },
      lastUpdated: fmtTime(new Date()),
      onRefresh: "refreshAccountingDashboard()",
      onHelp: "showAccountingDashboardHelp()",
      onSettings: "navigate('user-preferences')",
    });

    // ── 1) KPI Cards ──
    html += W.kpiGrid([
      W.kpiCard({
        icon: {
          tiClass: "ti-chart-bar",
          bg: "var(--accent-soft)",
          color: "var(--primary)",
        },
        label: "عدد الحسابات",
        value: accs.length,
        unit: "حساب",
      }),
      W.kpiCard({
        icon: {
          tiClass: "ti-cash",
          bg: "var(--success-soft)",
          color: "var(--success-dark)",
        },
        label: "رصيد الخزائن",
        value: formatMoney(totalCash, { decimals: 0, withSymbol: false }),
        unit: "EGP",
      }),
      W.kpiCard({
        icon: {
          tiClass: "ti-building-bank",
          bg: "var(--warning-soft)",
          color: "var(--warning)",
        },
        label: "رصيد البنوك",
        value: formatMoney(totalBank, { decimals: 0, withSymbol: false }),
        unit: "EGP",
      }),
      W.kpiCard({
        icon: {
          tiClass: "ti-wallet",
          bg: "var(--success-soft)",
          color: "var(--success-dark)",
        },
        label: "عدد الخزائن والحسابات البنكية",
        value: boxes.length + banks.length,
        unit: "حساب",
        onClick: "navigate('cash-boxes')",
      }),
      W.kpiCard({
        icon: {
          tiClass: "ti-clock-hour-4",
          bg: "var(--warning-soft)",
          color: "var(--warning)",
        },
        label: "شيكات تحت التحصيل",
        value: pendingCheques.length,
        unit: "شيك",
        onClick: "navigate('banking-transactions')",
      }),
      W.kpiCard({
        icon: {
          tiClass: "ti-building-factory",
          bg: "var(--accent-soft)",
          color: "#B45309",
        },
        label: "عدد الأصول الثابتة",
        value: fixedAssets.length,
        unit: "أصل",
        onClick: "navigate('fixed-assets')",
      }),
      W.kpiCard({
        icon: {
          tiClass: "ti-report-money",
          bg: "var(--accent-soft)",
          color: "#B45309",
        },
        label: "صافي القيمة الدفترية للأصول",
        value: formatMoney(fixedAssetsBookValue, {
          decimals: 0,
          withSymbol: false,
        }),
        unit: "EGP",
        onClick: "navigate('fixed-assets')",
      }),
      W.kpiCard({
        icon: {
          tiClass: "ti-file-invoice",
          bg: "var(--danger-soft)",
          color: "var(--danger)",
        },
        label: "قيود معلقة",
        value: pending.length,
        unit: "مسودة",
      }),
      W.kpiCard({
        icon: {
          tiClass: "ti-notebook",
          bg: "var(--accent-soft)",
          color: "var(--primary)",
        },
        label: "قيود هذا الشهر",
        value: thisMonthCount,
        unit: "قيد",
        trend: trend,
      }),
    ]);

    // ── 2) Charts ──
    html += '<div class="card-grid two-col" style="margin-top:8px">';
    html += W.chartWidget({
      title: "توزيع الحسابات حسب النوع",
      icon: "ti-chart-pie",
      type: "pie",
      data: _accTypeDistribution(accs),
    });
    html += W.chartWidget({
      title: "القيود خلال آخر 6 أشهر",
      icon: "ti-chart-bar",
      type: "bar",
      data: _accMonthlyEntryCounts(jents, 6),
    });
    html += "</div>";

    // ── 3) Quick Actions ──
    html += W.quickActionsWidget({
      title: "إجراءات سريعة",
      scope: "accounting",
      actions: [
        {
          id: "je_new",
          label: "قيد يومية جديد",
          icon: "ti-notebook",
          bg: "var(--accent-soft)",
          color: "var(--primary)",
          page: "journal-entries",
        },
        {
          id: "coa",
          label: "دليل الحسابات",
          icon: "ti-list-tree",
          bg: "var(--accent-soft)",
          color: "var(--accent)",
          page: "chart-of-accounts",
        },
        {
          id: "tb",
          label: "ميزان المراجعة",
          icon: "ti-scale",
          bg: "var(--warning-soft)",
          color: "var(--warning)",
          page: "trial-balance",
        },
        {
          id: "gl",
          label: "الأستاذ العام",
          icon: "ti-book-2",
          bg: "var(--success-soft)",
          color: "var(--success-dark)",
          page: "general-ledger",
        },
        {
          id: "rv",
          label: "سند قبض",
          icon: "ti-receipt",
          bg: "var(--success-soft)",
          color: "var(--success-dark)",
          page: "receipt-vouchers",
        },
        {
          id: "pv",
          label: "سند صرف",
          icon: "ti-receipt-2",
          bg: "var(--danger-soft)",
          color: "var(--danger)",
          page: "payment-vouchers",
        },
        {
          id: "bs",
          label: "الميزانية",
          icon: "ti-report-money",
          bg: "var(--accent-soft)",
          color: "var(--primary)",
          page: "balance-sheet",
        },
        {
          id: "is",
          label: "قائمة الدخل",
          icon: "ti-report-analytics",
          bg: "var(--accent-soft)",
          color: "var(--primary)",
          page: "income-statement",
        },
      ],
    });

    // ── 4) Search داخل القسم ──
    html += W.searchWidget({
      id: "ad-search",
      placeholder: "بحث سريع في الحسابات...",
      onSearchFn: "accDashboardSearch",
    });

    // ── 5) Recent Activity + Pending Tasks + Notifications ──
    html += '<div class="card-grid two-col" style="margin-top:8px">';
    html += W.activityWidget({
      title: "آخر القيود",
      icon: "ti-file-invoice",
      items: jents
        .slice(-6)
        .reverse()
        .map(function (e) {
          return {
            icon: "ti-notebook",
            iconColor: "var(--primary)",
            title: e.description || e.ref || "قيد يومية",
            subtitle:
              e.status === "DRAFT" || e.status === "مسودة" ? "مسودة" : "مرحّل",
            time: _fmtDate(e.date),
            onClick: "navigate('journal-entries')",
          };
        }),
      emptyMessage: "لا توجد قيود بعد",
    });
    html += W.notificationWidget({
      title: "تنبيهات المحاسبة",
      icon: "ti-bell",
      items: _accDashboardNotifications(),
      emptyMessage: "لا توجد تنبيهات محاسبية حالياً",
    });
    html += "</div>";

    html += W.tasksWidget({
      title: "قيود تحتاج مراجعة",
      icon: "ti-list-check",
      badge: pending.length || null,

  /** توزيع الحسابات حسب النوع — بيانات جاهزة لـ pieChart */
  function _accTypeDistribution(accs) {
    var typeLabels = {
      ASSET: "الأصول",
      LIABILITY: "الخصوم",
      EQUITY: "حقوق الملكية",
      REVENUE: "الإيرادات",
      EXPENSE: "المصروفات",
    };
    var typeColors = {
      ASSET: "#3B82F6",
      LIABILITY: "#8B5CF6",
      EQUITY: "#14B8A6",
      REVENUE: "#22C55E",
      EXPENSE: "#EF4444",
    };
    var counts = { ASSET: 0, LIABILITY: 0, EQUITY: 0, REVENUE: 0, EXPENSE: 0 };
    accs.forEach(function (a) {
      if (counts[a.type] !== undefined) counts[a.type]++;
    });
    return Object.keys(counts)
      .filter(function (t) {
        return counts[t] > 0;
      })
      .map(function (t) {
        return { label: typeLabels[t], value: counts[t], color: typeColors[t] };
      });
  }

  /** عدد القيود لكل شهر خلال آخر N شهر — بيانات جاهزة لـ barChart */
  function _accMonthlyEntryCounts(jents, months) {
    var now = new Date();
    var buckets = [];
    for (var i = months - 1; i >= 0; i--) {
      var dt = new Date(now.getFullYear(), now.getMonth() - i, 1);
      buckets.push({
        key: dt.getFullYear() + "-" + dt.getMonth(),
        label:
          typeof DateEngine !== "undefined"
            ? DateEngine.monthShort(dt)
            : dt.toLocaleDateString("ar-EG", { month: "short" }),
        value: 0,
      });
    }
    jents.forEach(function (e) {
      var dt = e.date ? new Date(e.date) : null;
      if (!dt || isNaN(dt)) return;
      var key = dt.getFullYear() + "-" + dt.getMonth();
      var b = buckets.find(function (x) {
        return x.key === key;
      });
      if (b) b.value++;
    });
    return buckets.map(function (b) {
      return { label: b.label, value: b.value, color: "var(--primary)" };
    });
  }

  function _custTopParties(parties, invoices, n) {
    var totals = {};
    invoices.forEach(function (i) {
      var key = i.party_id || i.party || "غير محدد";
      totals[key] = (totals[key] || 0) + (parseFloat(i.net_total) || 0);
    });
    var names = {};
    parties.forEach(function (c) {
      names[c.id] = c.name;
    });
    var colors = [
      "#2563EB",
      "#0EA5E9",
      "#22C55E",
      "#F59E0B",
      "#8B5CF6",
      "#EF4444",
    ];
    return Object.keys(totals)
      .map(function (k) {
        return { key: k, label: names[k] || k, value: totals[k] };
      })
      .sort(function (a, b) {
        return b.value - a.value;
      })
      .slice(0, n)
      .map(function (r, idx) {
        return {
          label: r.label,
          value: Math.round(r.value),
          color: colors[idx % colors.length],
        };
      });
  }

  function _adminRoleDistribution(users) {
    var counts = {};
    var colors = [
      "#5B21B6",
      "#2563EB",
      "#0EA5E9",
      "#22C55E",
      "#F59E0B",
      "#EF4444",
    ];
    users.forEach(function (u) {
      var role = u.role || "غير محدد";
      counts[role] = (counts[role] || 0) + 1;
    });
    return Object.keys(counts).map(function (r, idx) {
      return { label: r, value: counts[r], color: colors[idx % colors.length] };
    });
  }

  function _adminDailyActivity(auditLog, days) {
    var buckets = [];
    var now = new Date();
    for (var i = days - 1; i >= 0; i--) {
      var dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      buckets.push({
        key: dt.toDateString(),
        label:
          typeof DateEngine !== "undefined"
            ? DateEngine.weekdayName(dt)
            : dt.toLocaleDateString("ar-EG", { weekday: "short" }),
        value: 0,
      });
    }
    (auditLog || []).forEach(function (l) {
      if (!l.timestamp) return;
      var dt = new Date(l.timestamp);
      if (isNaN(dt)) return;
      var key = dt.toDateString();
      var b = buckets.find(function (x) {
        return x.key === key;
      });
      if (b) b.value++;
    });
    return buckets.map(function (b) {
      return { label: b.label, value: b.value, color: "var(--primary)" };
    });
  }

  function _adminDashboardNotifications() {
    if (typeof _buildNotifications !== "function") return [];
    var adminPages = { users: 1, system_settings: 1, audit_log: 1 };
    return _buildNotifications()
      .filter(function (n) {
        return adminPages[n.page];
      })
      .slice(0, 6)
      .map(function (n) {
        return {
          icon: n.type === "danger" ? "ti-alert-triangle" : "ti-bell",
          iconColor: n.type === "danger" ? "var(--danger)" : "var(--warning)",
          title: n.title,
          subtitle: n.desc,
          onClick: "navigate('" + n.page + "')",
        };
      });
  }

    );
    html += "</div>";

    // ── حالة الحسابات البنكية + شيكات مستحقة قريباً + آخر التحويلات ──
    html += '<div class="card" style="margin-top:24px">';
    html +=
      '<h4 style="margin-bottom:12px;display:flex;align-items:center;gap:8px"><i class="ti ti-building-bank" style="color:var(--success-dark)"></i> حالة الحسابات البنكية</h4>';
    html += '<div id="bd-accounts-table">' + _loadingInline() + "</div>";
    html += "</div>";

    html += '<div class="card-grid two-col" style="margin-top:16px">';
    html += '<div class="card">';
    html +=
      '<h4 style="margin-bottom:12px;display:flex;align-items:center;gap:8px"><i class="ti ti-clock" style="color:var(--warning)"></i> شيكات مستحقة قريباً</h4>';
    html += '<div id="bd-due-cheques">' + _loadingInline() + "</div>";
    html += "</div>";
    html += '<div class="card">';
    html +=
      '<h4 style="margin-bottom:12px;display:flex;align-items:center;gap:8px"><i class="ti ti-transfer" style="color:var(--success-dark)"></i> آخر التحويلات البنكية</h4>';
    html += '<div id="bd-recent-transfers">' + _loadingInline() + "</div>";
    html += "</div>";
    html += "</div>";

    return html;
  }
</script>
