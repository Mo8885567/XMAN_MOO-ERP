<script>
  // ═══════════════════════════════════════════════════════════════
  // Templates_09.html — جزء من Templates.html الأصلي (تقسيم آلي نصي بحت، 2026-07-04)
  // النطاق: renderChartOfAccounts → renderSaleInvoices (Accounting الأساسية + Sale Invoices)
  // راجع Architecture Audit 2026-07-03، المرحلة 5 — تقسيم بحسب الحجم،
  // على حدود دوال كاملة فقط (لا قطع لأي دالة في نص). تحقق برمجيًا:
  // التركيب النهائي لكل الأجزاء الـ10 مطابق 100% لمحتوى Templates.html
  // القديم حرفيًا (نفس الترتيب، بدون فقد أو تكرار).
  // يُحمَّل بالترتيب عبر <script> في Index.html مع باقي الأجزاء.
  // ═══════════════════════════════════════════════════════════════
  function renderChartOfAccounts() {
    var html = _renderPageHeader(
      "دليل الحسابات",
      "شجرة الحسابات — الأصول، الخصوم، حقوق الملكية، الإيرادات، المصروفات",
      {
        bgIcon: "ti-chart-bar",
        bgColor: "var(--accent-soft)",
        iconColor: "var(--accent)",
      },
      canDo("addChartAccount")
        ? '<button class="btn btn-primary" id="coa-btn-add"><i class="ti ti-plus"></i> ' +
            I18N.t("ACC_NEW_ACCOUNT") +
            "</button>"
        : "",
    );

    // شرائط إحصائية — تعمل كفلتر بالنوع بدل الـ Select
    html += '<div class="coa-chips" id="coa-chips">';
    COA_TYPE_ORDER.forEach(function (t) {
      var meta = t === "ALL" ? null : COA_TYPE_COLORS[t];
      html +=
        '<div class="coa-chip' +
        (t === "ALL" ? " coa-chip-active" : "") +
        '" data-type="' +
        t +
        '">' +
        '<span class="coa-chip-label">' +
        (t === "ALL" ? "كل الحسابات" : meta.label) +
        "</span>" +
        '<span class="coa-chip-count" id="coa-chip-count-' +
        t +
        '"' +
        (meta ? ' style="color:' + meta.color + '"' : "") +
        ">0</span>" +
        "</div>";
    });
    html += "</div>";

    html += '<div class="card">';
    html += '<div class="coa-toolbar">';
    html +=
      '<div class="coa-search-wrap"><i class="ti ti-search"></i><input type="text" id="coa-search" placeholder="' +
      I18N.t("ACC_PH_SEARCH_CODE_ACCOUNT") +
      '" class="search-input"></div>';
    html += "</div>";

    html += '<div id="coa-tree-container"></div>';
    html += "</div>";

    return html;
  }

  // ── Cash Boxes — الخزائن ──
  function renderCashBoxes() {
    var html = _renderPageHeader(
      "الخزائن",
      "إدارة الخزائن والأرصدة النقدية",
      {
        bgIcon: "ti-cash",
        bgColor: "var(--success-soft)",
        iconColor: "var(--success-dark)",
      },
      canDo("addCashBox")
        ? '<button class="btn btn-primary" id="cb-btn-add"><i class="ti ti-plus"></i> ' +
            I18N.t("ACC_NEW_CASHBOX") +
            "</button>"
        : "",
    );

    html += '<div class="card">';
    html += '<div class="table-wrap">';
    html +=
      '<table class="table"><thead><tr><th>' +
      I18N.t("LBL_CODE") +
      "</th><th>" +
      I18N.t("LBL_NAME") +
      "</th><th>" +
      I18N.t("HR_BRANCH") +
      "</th><th>" +
      I18N.t("HR_CURRENCY") +
      '</th><th style="text-align:center">' +
      I18N.t("PAGE_STOCK") +
      "</th><th>" +
      I18N.t("LBL_RESPONSIBLE") +
      "</th></tr></thead>";
    html +=
      '<tbody id="cb-table-body"><tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text3)">' +
      I18N.t("MSG_LOADING_ELLIPSIS") +
      "</td></tr></tbody>";
    html += "</table></div></div>";

    return html;
  }

  // ── Banks — البنوك (Banking Module Phase 1) ──

    var html = _renderPageHeader(

      "إدارة بيانات البنوك المتعامل معها",

        bgIcon: "ti-building",
        bgColor: "var(--info-soft)",
        iconColor: "var(--info)",

      canDo("addBank")

      '<table class="table"><thead><tr><th>' +
      I18N.t("ACC_BANK") +

      I18N.t("LBL_COUNTRY") +
      "</th><th>" +
      I18N.t("LBL_CITY") +
      "</th><th>" +

      "</th><th>" +

      "</th><th>" +

      "</th><th>" +

      "</th></tr></thead>";
    html +=
      '<tbody id="bk-table-body"><tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text3)">' +

  }

  // ── Cheque Books — دفاتر الشيكات (Banking Module Phase 2) ──
  function renderChequeBooks() {
    var html = _renderPageHeader(
      "دفاتر الشيكات",
      "إدارة دفاتر الشيكات لكل حساب بنكي",
      {
        bgIcon: "ti-file-invoice",
        bgColor: "var(--warning-soft)",
        iconColor: "var(--warning)",
      },
      canDo("addChequeBook")
        ? '<button class="btn btn-primary" id="chb-btn-add"><i class="ti ti-plus"></i> ' +
            I18N.t("ACC_NEW_CHEQUEBOOK") +
            "</button>"
        : "",

    html += '<div class="card">';
    html += '<div class="table-wrap">';
    html +=
      '<table class="table"><thead><tr><th>' +
      I18N.t("LBL_CODE") +
      "</th><th>" +
      I18N.t("ACC_BANK_ACCOUNT") +
      "</th><th>" +
      I18N.t("ACC_ISSUE_DATE") +
      "</th><th>" +
      I18N.t("LBL_RANGE") +
      "</th><th>" +
      I18N.t("LBL_TOTAL") +
      "</th><th>" +
      I18N.t("LBL_USER") +
      "</th><th>" +
      I18N.t("LBL_REMAINING") +
      "</th><th>" +
      I18N.t("LBL_STATUS") +
      "</th></tr></thead>";
    html +=
      '<tbody id="chb-table-body"><tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text3)">' +
      I18N.t("MSG_LOADING_ELLIPSIS") +
      "</td></tr></tbody>";
    html += "</table></div></div>";

    return html;
  }

  // ── Cheques — الشيكات (Banking Module Phase 3) ──
  // [CHQ-WORKFLOW] — إعادة تصميم الشاشة كـ Interactive Workflow Dashboard
  // (واجهة/تجربة استخدام فقط — بدون أي تغيير في منطق أو API الشيكات).
  // كل البيانات المعروضة هنا مأخوذة من نفس APP.data.cheques الجاهزة أصلاً
  // (تُحمَّل عبر ensureExtendedData داخل bindCheques كما كانت بالضبط).
  var CHQ_WORKFLOW_STAGES = [
    {
      key: "PENDING",
      label: "بانتظار التحصيل/الصرف",
      icon: "ti-clock",
      color: "var(--warning)",
      soft: "var(--warning-soft)",
    },
    {
      key: "COLLECTED",
      label: "تم التحصيل/الصرف",
      icon: "ti-circle-check",
      color: "var(--success-dark)",
      soft: "var(--success-soft)",
    },
    {
      key: "BOUNCED",
      label: "مرتد",
      icon: "ti-alert-triangle",
      color: "var(--danger)",
      soft: "var(--danger-soft)",
    },
    {
      key: "REPLACED",
      label: "مستبدل بشيك آخر",
      icon: "ti-replace",
      color: "var(--teal)",
      soft: "var(--teal-soft)",
    },
    {
      key: "CANCELLED",
      label: "ملغي",
      icon: "ti-ban",
      color: "var(--text3)",
      soft: "var(--surface3)",
    },
    // ── [CHQ-WORKFLOW-V2 — Phase 2] حالات العُقد الجديدة — إضافي فقط،
    // بتُستخدم أساساً عشان Timeline widget (آخر العمليات) يلاقي أيقونة/لون
    // مناسب لأي شيك بقى في حالة جديدة (بدل ما يرجع لأيقونة افتراضية).
    // الرسمة الفعلية (Flow Diagram) بتُبنى من CHQ_FLOW_LANES تحت، مش من هنا.
    {
      key: "RECEIVED",
      label: "تم الاستلام",
      icon: "ti-inbox-in",
      color: "var(--info)",
      soft: "var(--info-soft)",
    },
    {
      key: "DEPOSITED_FOR_COLLECTION",
      label: "إيداع للتحصيل",
      icon: "ti-building-bank",
      color: "var(--accent)",
      soft: "var(--accent-soft)",
    },
    {
      key: "ENDORSED",
      label: "مظهّر لطرف آخر",
      icon: "ti-signature",
      color: "var(--purple)",
      soft: "var(--purple-soft)",
    },
    {
      key: "RETURNED",
      label: "مرتجع",
      icon: "ti-arrow-back-up",
      color: "var(--warning)",
      soft: "var(--warning-soft)",
    },
    {
      key: "RETURNED_TO_OWNER",
      label: "تم رده لمالكه",
      icon: "ti-corner-down-left",
      color: "var(--text3)",
      soft: "var(--surface3)",
    },
    {
      key: "CASHED",
      label: "تم الصرف",
      icon: "ti-cash-banknote",
      color: "var(--success-dark)",
      soft: "var(--success-soft)",
    },
    {
      key: "DRAFTED",
      label: "محرَّر",
      icon: "ti-file-invoice",
      color: "var(--warning)",
      soft: "var(--warning-soft)",
    },
    {
      key: "PAID",
      label: "تم الصرف",
      icon: "ti-cash-banknote",
      color: "var(--success-dark)",
      soft: "var(--success-soft)",
    },
    {
      key: "RETURNED_OUT",
      label: "مرتجع",
      icon: "ti-arrow-back-up",
      color: "var(--warning)",
      soft: "var(--warning-soft)",
    },
  ];

  // ═══════════════════════════════════════════════════════════════
  // [CHQ-WORKFLOW-V2 — Phase 2] تعريف "رسمة التدفق" (Flow Diagram) بفرعين
  // (الأوراق الواردة / الصادرة) — مبنية حرفياً على نفس عُقد الـ state
  // machine الموجودة في الـ backend (CHEQUE_INCOMING_WORKFLOW_TRANSITIONS /
  // CHEQUE_OUTGOING_WORKFLOW_TRANSITIONS في Code_Banking.gs). أي عقدة هنا
  // لازم يكون ليها مقابل فعلي في transitions الـ backend — مفيش عُقد
  // بصرية وهمية.
  // كل عقدة: { key, label, icon, col, row, terminal, legacyKeys }
  //   - col/row: إحداثيات في CSS grid (RTL — col 1 = أقصى الشمال/النهاية،
  //     أعلى رقم col = البداية/أقصى اليمين، متوافق مع اتجاه القراءة).
  //   - legacyKeys: حالات قديمة (PENDING) بتتحسب ضمن نفس عدّاد العقدة دي
  //     ولما تتفلتر بيها، بدون أي تغيير في الـ backend (نفس فلسفة
  //     "PENDING = نقطة دخول قديمة" الموثقة في ملف التقدم).
  //   - terminal: حالة نهائية (مفيش خروج منها) — تتلوّن بحدود أوضح.
  // ═══════════════════════════════════════════════════════════════
  var CHQ_FLOW_LANES = {
    INCOMING: {
      title: "الأوراق الواردة",
      icon: "ti-arrow-bar-to-left",
      color: "var(--info)",
      cols: 4,
      rows: 3,
      nodes: [
        {
          key: "RECEIVED",
          legacyKeys: ["PENDING"],
          label: "تم الاستلام",
          icon: "ti-inbox-in",
          col: 1,
          row: 2,
        },
        {
          key: "ENDORSED",
          label: "مظهّر لطرف آخر",
          icon: "ti-signature",
          col: 2,
          row: 1,
        },
        {
          key: "DEPOSITED_FOR_COLLECTION",
          label: "إيداع للتحصيل",
          icon: "ti-building-bank",
          col: 2,
          row: 3,
        },
        {
          key: "RETURNED",
          label: "إرتجاع ورقة مالية",
          icon: "ti-arrow-back-up",
          col: 3,
          row: 2,
        },
        {
          key: "RETURNED_TO_OWNER",
          label: "تم رده لمالكه",
          icon: "ti-corner-down-left",
          col: 4,
          row: 1,
          terminal: true,
        },
        {
          key: "CASHED",
          label: "تم الصرف",
          icon: "ti-cash-banknote",
          col: 4,
          row: 3,
          terminal: true,
        },
      ],
      edges: [
        ["RECEIVED", "DEPOSITED_FOR_COLLECTION"],
        ["RECEIVED", "ENDORSED"],
        ["DEPOSITED_FOR_COLLECTION", "CASHED"],
        ["DEPOSITED_FOR_COLLECTION", "RETURNED"],
        ["ENDORSED", "RETURNED"],
        ["RETURNED", "RETURNED_TO_OWNER"],
      ],
      // حالات استثنائية/قديمة — بتظهر كـ chips جنب الرسمة مش كعُقد فيها
      // (البنك بيرتد الشيك أو بيتلغي من أي نقطة تقريباً، مش تدفق خطي؛
      // REPLACED هنا كمان — بتحصل من عقدة RETURNED لكن مش عرضها كعقدة
      // رئيسية زي التصميم المرجعي).
      extraStatuses: ["BOUNCED", "CANCELLED", "COLLECTED", "REPLACED"],
    },
    OUTGOING: {
      title: "الأوراق الصادرة",
      icon: "ti-arrow-bar-to-right",
      color: "var(--purple)",
      cols: 3,
      rows: 2,
      nodes: [
        {
          key: "DRAFTED",
          legacyKeys: ["PENDING"],
          label: "محرَّر",
          icon: "ti-file-invoice",
          col: 1,
          row: 2,
        },
        {
          key: "PAID",
          label: "تم الصرف",
          icon: "ti-cash-banknote",
          col: 2,
          row: 1,
          terminal: true,
        },
        {
          key: "RETURNED_OUT",
          label: "مرتجع",
          icon: "ti-arrow-back-up",
          col: 2,
          row: 2,
        },
      ],
      edges: [
        ["DRAFTED", "PAID"],
        ["DRAFTED", "RETURNED_OUT"],
        ["RETURNED_OUT", "DRAFTED"], // إعادة تحرير — عكس اتجاه التدفق (خط متقطع)
      ],
      extraStatuses: ["BOUNCED", "CANCELLED", "COLLECTED", "REPLACED"],
    },
  };

  /** يبني HTML رسمة تدفق واحدة (لين) — واردة أو صادرة — شبكة CSS Grid
   * للعُقد + طبقة SVG فوقها للخطوط الموصّلة (بترسم فعلياً بعد الإدراج
   * في الـ DOM عبر _bindChqFlowLane في 11_JS_Accounting.html، لأن حساب
   * إحداثيات الخطوط محتاج getBoundingClientRect بعد ما العناصر تتعرض). */
  function _renderChqFlowLane(laneKey, lane) {
    var html =
      '<div class="chq-flow-lane" data-lane="' +
      laneKey +
      '">' +
      '<div class="chq-flow-lane-title" style="color:' +
      lane.color +
      '"><i class="ti ' +
      lane.icon +
      '"></i> ' +
      lane.title +
      "</div>";

    html +=
      '<div class="chq-flow-lane-body" id="chq-flow-body-' +
      laneKey +
      '" style="grid-template-columns:repeat(' +
      lane.cols +
      ",1fr);grid-template-rows:repeat(" +
      lane.rows +
      ',auto)">';

    html +=
      '<svg class="chq-flow-svg" id="chq-flow-svg-' + laneKey + '"></svg>';

    lane.nodes.forEach(function (n) {
      html +=
        '<div class="chq-flow-node' +
        (n.terminal ? " chq-flow-node-terminal" : "") +
        '" data-lane="' +
        laneKey +
        '" data-node="' +
        n.key +
        '" id="chq-flow-node-' +
        laneKey +
        "-" +
        n.key +
        '" style="grid-column:' +
        n.col +
        ";grid-row:" +
        n.row +
        '">' +
        '<div class="chq-flow-node-icon"><i class="ti ' +
        n.icon +
        '"></i></div>' +
        '<div class="chq-flow-node-count" id="chq-flow-count-' +
        laneKey +
        "-" +
        n.key +
        '">0</div>' +
        '<div class="chq-flow-node-label">' +
        n.label +
        "</div>" +
        "</div>";
    });

    html += "</div>"; // .chq-flow-lane-body

    // ── chips الحالات الاستثنائية (مرتد/ملغي/تحصيل قديم) ──
    html += '<div class="chq-flow-extra-row">';
    lane.extraStatuses.forEach(function (statusKey) {
      var meta =
        CHQ_WORKFLOW_STAGES.find(function (s) {
          return s.key === statusKey;
        }) || {};
      html +=
        '<div class="chq-flow-extra-chip" data-lane="' +
        laneKey +
        '" data-status="' +
        statusKey +
        '" id="chq-flow-extra-' +
        laneKey +
        "-" +
        statusKey +
        '">' +
        '<i class="ti ' +
        (meta.icon || "ti-point") +
        '" style="color:' +
        (meta.color || "var(--text3)") +
        '"></i> ' +
        (meta.label || statusKey) +
        ' <b id="chq-flow-extra-count-' +
        laneKey +
        "-" +
        statusKey +
        '">0</b>' +
        "</div>";
    });
    html += "</div>";

    html += "</div>"; // .chq-flow-lane
    return html;
  }

  function _renderChqFlowLanesHTML() {
    var html = '<div class="chq-flow-lanes">';
    // ملحوظة تجريبية: الحاوية دي بتتصرف كـ LTR فعليًا رغم إن الصفحة عربي
    // (مفيش direction:rtl فعّال عليها) — يعني أول عنصر في الـ DOM بيظهر
    // على الشمال. عشان "الأوراق الواردة" تفضل شمال و"الأوراق الصادرة"
    // يمين (زي التصميم المرجعي)، لازم الواردة تترسم أولاً.
    html += _renderChqFlowLane("INCOMING", CHQ_FLOW_LANES.INCOMING);
    html += _renderChqFlowLane("OUTGOING", CHQ_FLOW_LANES.OUTGOING);
    html += "</div>";
    return html;
  }

  function renderCheques() {
    var html = _renderPageHeader(
      "الشيكات",
      "إدارة الشيكات الواردة والصادرة",
      {
        bgIcon: "ti-receipt-2",
        bgColor: "var(--danger-soft)",
        iconColor: "var(--danger)",
      },
      canDo("addCheque")
        ? '<button class="btn btn-primary" id="chq-btn-add"><i class="ti ti-plus"></i> ' +
            I18N.t("ACC_NEW_CHEQUE") +
            "</button>"
        : "",
    );

    // ── CSS خاص بالـ Workflow (مضمّن هنا فقط — بنفس أسلوب شاشات أخرى
    // بالنظام مثل renderLoginScreen — بدون أي ملف جديد) ──
    html +=
      "<style>" +
      // ── [CHQ-WORKFLOW-V2 — Phase 2] رسمة التدفق المتفرعة (لينين) ──
      ".chq-flow-lanes{display:flex;flex-direction:row;gap:14px;align-items:stretch;flex-wrap:wrap}" +
      ".chq-flow-lane{flex:1 1 0;min-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px}" +
      ".chq-flow-lane-title{font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:13px}" +
      ".chq-flow-lane-body{position:relative;display:grid;gap:16px 10px;padding:6px 0}" +
      ".chq-flow-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}" +
      ".chq-flow-node{position:relative;z-index:1;background:transparent;border:none;box-shadow:none;" +
      "padding:2px;cursor:pointer;transition:transform .15s ease;text-align:center;" +
      "display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}" +
      ".chq-flow-node:hover{transform:translateY(-2px)}" +
      ".chq-flow-node:hover .chq-flow-node-icon{box-shadow:0 0 0 3px var(--accent-soft)}" +
      ".chq-flow-node.chq-flow-node-active .chq-flow-node-icon{background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}" +
      ".chq-flow-node-terminal .chq-flow-node-icon{border:1px dashed var(--border)}" +
      ".chq-flow-node-icon{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;" +
      "font-size:17px;background:var(--surface2);color:var(--text2)}" +
      ".chq-flow-node-count{position:absolute;top:-5px;left:-5px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;" +
      "background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}" +
      ".chq-flow-node-count.chq-flow-count-zero{display:none}" +

  // القائمة الجانبية) + تقارير البنوك (كانت في مركز التقارير) في شاشة
  // واحدة بنظام Tabs. كل تاب بيستخدم نفس render/bind functions الأصلية
  // من غير أي تكرار في المنطق أو استدعاءات السيرفر.

  var _BANKING_TABS = [
    {
      id: "overview",

    {
      id: "cheques",

      icon: "ti-receipt-2",

      render: function () {

      },
      bind: function () {
        bindCheques();
      },
    },
    // [TRANSFERS-STANDALONE] تاب "سندات التحويل" اتشال من هنا — بقت شاشة
    // مستقلة في السايد بار (صفحة "transfer-vouchers" في 01_JS_Core_Auth.html
    // بترندر renderTransferVouchers/bindTransferVouchers مباشرة، من غير
    // ما تتضمّن جوه شاشة "التعاملات البنكية" الموحّدة).
    {
      id: "reconciliation",
      label: "المطابقة البنكية",

    // [REPORTS-UNIFIED] تاب "التقارير" اتشال من هنا — التقارير بقت
    // معتمدة بالكامل على مجموعة "تقارير البنوك" الرسمية في مركز
    // التقارير بالسايد بار (نفس الدوال: renderBankAccountStatementReport/
    // renderChequesReport/renderTransfersReport/renderBankReconciliationReport
    // — بدون أي تكرار أو داتا مختلفة). _renderBankingReportsTab و
    // _bindBankingReportsTab فضلوا موجودين تحت (مش متشالين) عشان أي كود
    // قديم بيرجع عليهم بالغلط ميكسرش، لكن مبقاش ليهم تاب ظاهر هنا.
  ];

  function _bankingVisibleTabs() {
    return _BANKING_TABS.filter(function (t) {
      return !t.perm || canDo(t.perm);
    });
  }

  function renderBankingTransactions() {
    var visible = _bankingVisibleTabs();
    if (
      !visible.some(function (t) {
        return t.id === _bankingUIState.tab;
      })
    ) {
      _bankingUIState.tab = visible.length ? visible[0].id : "overview";
    }
    var active = _bankingUIState.tab;

    var html = _renderPageHeader(
      "التعاملات البنكية",
      "كل شاشات البنوك: الحسابات، الشيكات، التحويلات، المطابقة، والتقارير في مكان واحد",
      {
        bgIcon: "ti-building-bank",
        bgColor: "var(--success-soft)",
        iconColor: "var(--success-dark)",
      },
    );

    html += '<div class="ati-mode-tabs" id="bt-tabs" style="flex-wrap:wrap">';
    visible.forEach(function (t) {
      html +=
        '<button class="ati-mode-tab' +
        (t.id === active ? " active" : "") +
        '" data-bt-tab="' +
        t.id +
        '" style="flex:0 1 auto" onclick="_btSwitchTab(\'' +
        t.id +
        "')\">" +
        '<i class="ti ' +
        t.icon +
        '"></i><span class="tab-label">' +
        t.label +
        "</span></button>";
    });
    html += "</div>";

    html += '<div id="bt-tab-content">' + _btRenderTab(active) + "</div>";
    return html;
  }

  function _btRenderTab(tabId) {
    var tab = _BANKING_TABS.filter(function (t) {
      return t.id === tabId;
    })[0];
    if (!tab) return "";
    try {
      return tab.render();
    } catch (e) {
      console.error("[BankingTransactions] خطأ في عرض تاب " + tabId, e);
      return (
        '<div class="card" style="text-align:center;color:var(--danger);padding:24px">' +
        I18N.t("MSG_SECTION_DISPLAY_FAILED") +
        "</div>"
      );
    }
  }

  function bindBankingTransactions() {
    var tab = _BANKING_TABS.filter(function (t) {
      return t.id === _bankingUIState.tab;
    })[0];
    if (!tab) return;
    try {
      tab.bind();
    } catch (e) {
      console.error("[BankingTransactions] خطأ في bind تاب " + tab.id, e);
      if (typeof showToast === "function") {
        NotificationEngine.warning(" بعض عناصر هذا القسم قد لا تعمل بشكل صحيح");
      }
    }
  }

  /** تبديل التاب بدون إعادة تحميل الصفحة كلها */
  window._btSwitchTab = function (tabId) {
    _bankingUIState.tab = tabId;
    document.querySelectorAll("#bt-tabs .ati-mode-tab").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-bt-tab") === tabId);
    });
    var c = document.getElementById("bt-tab-content");
    if (!c) return;
    c.innerHTML = _btRenderTab(tabId);
    bindBankingTransactions();
  };

      id: "bank_account_statement",
      label: "كشف حساب بنكي",
      fn: "renderBankAccountStatementReport",

  function _renderBankingReportsTab() {
    var sub = _bankingUIState.reportSub || "bank_account_statement";
    if (
      !_BANKING_REPORT_TABS.some(function (s) {
        return s.id === sub;
      })
    ) {
      sub = "bank_account_statement";
    }
    var html =
      '<div class="ati-mode-tabs" id="bt-report-tabs" style="margin-bottom:16px">';
    _BANKING_REPORT_TABS.forEach(function (s) {

        '<button class="ati-mode-tab' +
        (s.id === sub ? " active" : "") +
        '" data-bt-report-tab="' +
        s.id +
        '" style="flex:0 1 auto" onclick="_btSwitchReportTab(\'' +
        s.id +
        '\')"><span class="tab-label">' +
        s.label +
        "</span></button>";
    });
    html +=
      '</div><div id="bt-report-content">' + _btRenderReport(sub) + "</div>";
    return html;
  }

  function _btRenderReport(reportId) {
    var def = _BANKING_REPORT_TABS.filter(function (s) {
      return s.id === reportId;
    })[0];
    if (!def || typeof window[def.fn] !== "function") return "";
    try {
      return window[def.fn]();
    } catch (e) {
      console.error("[BankingTransactions] خطأ في عرض تقرير " + reportId, e);
      return (
        '<div class="card" style="text-align:center;color:var(--danger);padding:24px">' +
        I18N.t("MSG_REPORT_DISPLAY_FAILED") +
        "</div>"
      );
    }
  }

  }

  // §renderSaleInvoices — فواتير البيع
  // ─────────────────────────────────────────────────────────────
  function renderSaleInvoices() {
    var invoices = (APP.data.saleInvoices || []).slice().reverse();
    var pendingTx = _getPendingOutTransactions(); // أذونات صادر لم تُفوتَر بعد

    var totalInvoiced = invoices.length;
    var totalPending = pendingTx.length;
    var totalAmount = invoices.reduce(function (s, inv) {
      return s + Number(inv.net_total || 0);
    }, 0);
    var unpaidCount = invoices.filter(function (inv) {
      return inv.payment_status === "آجل";
    }).length;

    var statsHtml =
      '<div class="stat-grid" style="margin-bottom:20px">' +
      statCard(
        iconBadge("ti-file-invoice", "var(--accent-soft)", "var(--primary)"),
        "إجمالي الفواتير",
        totalInvoiced,
        "فاتورة",
        "var(--accent-soft)",
      ) +
      statCard(
        iconBadge("ti-clock", "var(--warning-soft)", "var(--warning)"),
        "في انتظار الفوترة",
        totalPending,
        "إذن",
        "var(--warning-soft)",
      ) +
      statCard(
        iconBadge("ti-currency-pound", "var(--success-soft)", "var(--success)"),
        "إجمالي المبيعات",
        formatMoney(totalAmount, { decimals: 0, withSymbol: false }),
        "ج.م",
        "var(--success-soft)",
      ) +
      statCard(
        iconBadge("ti-alert-circle", "var(--danger-soft)", "var(--danger)"),
        "آجل غير محصّل",
        unpaidCount,
        "فاتورة",
        "var(--danger-soft)",
      ) +
      "</div>";

    // ── جدول الأذونات المعلّقة ──────────────────────────────────
    var pendingRows = pendingTx
      .map(function (tx) {
        var item =
          (APP.data.items || []).find(function (i) {
            return i.id === tx.item_id;
          }) || {};
        var d = tx.date ? fmtDate(tx.date) : "—";
        return (
          "<tr>" +
          '<td><span class="mono" style="font-size:11px;color:var(--accent)">' +
          esc(tx.permit_id || tx.id || "") +
          "</span></td>" +
          "<td>" +
          d +
          "</td>" +
          "<td>" +
          esc(tx.party || "—") +
          "</td>" +
          "<td>" +
          esc(item.name || tx.item_id || "—") +
          "</td>" +
          '<td style="text-align:center">' +
          esc(String(tx.quantity || 0)) +
          "</td>" +
          "<td>" +
          esc(tx.from_warehouse || "—") +
          "</td>" +
          "<td>" +
          esc(tx.user || "—") +
          "</td>" +
          "<td>" +
          withPermission(
            '<button class="btn btn-primary btn-xs" onclick="openCreateSaleInvoiceModal(\'' +
              esc(tx.permit_id || tx.id) +
              '\')" style="white-space:nowrap">' +
              '<i class="ti ti-file-plus" style="font-size:12px"></i> ' +
              I18N.t("DASH_CREATE_INVOICE") +
              "</button>",
            "addSaleInvoice",
          ) +
          "</td>" +
          "</tr>"
        );
      })
      .join("");

    var pendingSection =
      totalPending > 0
        ? '<div class="card" style="margin-bottom:20px;border:2px solid #FCD34D">' +
          '<div style="padding:14px 16px;border-bottom:1px solid var(--border);background:#FEFCE8;display:flex;align-items:center;gap:10px">' +
          iconBadge("ti-clock", "var(--warning-soft)", "var(--warning)") +
          '<div><b style="color:#92400E">' +
          I18N.t("DASH_ISSUE_VOUCHERS_PENDING_INVOICE") +
          "</b>" +
          '<span style="margin-right:10px;font-size:12px;color:var(--text3)">' +
          totalPending +
          " إذن</span></div></div>" +
          '<div class="table-wrap" style="margin:0"><table>' +
          "<thead><tr><th>" +
          I18N.t("PH_PERMIT_NUMBER") +
          "</th><th>" +
          I18N.t("LBL_DATE") +
          "</th><th>" +
          I18N.t("LBL_CUSTOMER") +
          "</th><th>" +
          I18N.t("COL_ITEM") +
          '</th><th style="text-align:center">' +
          I18N.t("COL_QTY") +
          "</th><th>" +
          I18N.t("LBL_WAREHOUSE") +
          "</th><th>" +
          I18N.t("LBL_BY") +
          "</th><th>" +
          I18N.t("LBL_ACTION") +
          "</th></tr></thead>" +
          "<tbody>" +
          (pendingRows ||
            '<tr><td colspan="8" class="empty-state">' +
              I18N.t("DASH_NO_PENDING_VOUCHERS") +
              "</td></tr>") +
          "</tbody>" +
          "</table></div></div>"
        : "";

    // ── جدول الفواتير المُصدرة ────────────────────────────────
    // [COLUMN-ENGINE] الجدول الثابت (Hardcoded <table>) انتقل بالكامل
    // إلى ColumnEngine (راجع 34_JS_ColumnEngine.html و
    // _sinvRenderTable/_sinvRegisterColumns في 15_JS_Invoices.html).
    // الأعمدة الآن Metadata قابلة للتخصيص (إظهار/إخفاء/ترتيب/تثبيت)
    // بدل كودها هنا، وعمود الشحن انتقل إلى column.format.
    var tableSection =
      '<div class="card" style="padding:0;overflow:hidden">' +
      '<div style="padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<div style="display:flex;gap:6px;align-items:center">' +
      '<div style="display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px">' +
      '<button class="sinv-filter-btn active" data-status="" style="border:none;background:var(--accent);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">' +
      I18N.t("LBL_ALL") +
      "</button>" +
      '<button class="sinv-filter-btn" data-status="كاش" style="border:none;background:transparent;color:var(--text2);padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">' +
      I18N.t("LBL_CASH") +
      "</button>" +
      '<button class="sinv-filter-btn" data-status="آجل" style="border:none;background:transparent;color:var(--text2);padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">' +
      I18N.t("LBL_PAYMENT_DEFERRED") +
      "</button>" +
      "</div>" +
      '<span style="font-size:12px;color:var(--text3);background:var(--bg);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-weight:600">' +
      totalInvoiced +
      " فاتورة</span>" +
      "</div></div>" +
      '<div id="sinv-ce-container" style="padding:12px"></div></div>';

    return (
      '<div class="page-header">' +
      '<div style="display:flex;align-items:center;gap:12px">' +
      iconBadge("ti-file-invoice", "var(--accent-soft)", "var(--primary)") +
      '<div><h1 style="font-size:22px;margin:0">' +
      I18N.t("PAGE_SALE_INVOICES") +
      "</h1>" +
      '<p style="margin:2px 0 0;color:var(--text3);font-size:13px">' +
      totalInvoiced +
      " فاتورة — " +
      totalPending +
      " إذن في الانتظار</p>" +
      "</div></div>" +
      '<div style="display:flex;gap:8px">' +
      withPermission(
        '<button class="btn btn-primary" id="sinv-new-btn"><i class="ti ti-plus" style="font-size:14px"></i> ' +
          I18N.t("DASH_NEW_INVOICE") +
          "</button>",
        "addSaleInvoice",
      ) +
      "</div></div>" +
      statsHtml +
      pendingSection +
      tableSection
    );
  }

  // ─────────────────────────────────────────────────────────────
  // §renderPurchaseInvoices — فواتير الشراء
  // ─────────────────────────────────────────────────────────────
</script>
