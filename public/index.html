    // [FIX-BACKDROP-BLOCK] أوقف pointer-events فوراً عشان الـ backdrop
    // ميبلوكش الكليكات أثناء animation الإغلاق
    if (bg) bg.style.pointerEvents = "none";

    if (immediate) {
      if (drawer) drawer.remove();
      if (bg) bg.remove();
      // [NO-TOAST-OVER-MODAL-2026-07-28]
      if (typeof _flushDeferredToasts === "function") _flushDeferredToasts();
      return;
    }

    // Animate out — match 0.18s optimized animation
    if (drawer) {
      if (drawer._escHandler)
        document.removeEventListener("keydown", drawer._escHandler);
      drawer.classList.add("drawer-closing");
      setTimeout(function () {
        if (drawer && drawer.parentNode) drawer.remove();
        // [NO-TOAST-OVER-MODAL-2026-07-28]
        if (typeof _flushDeferredToasts === "function") _flushDeferredToasts();
      }, 200);
    }
    if (bg) {
      bg.style.transition = "opacity .18s ease";
      bg.style.opacity = "0";
      setTimeout(function () {
        if (bg && bg.parentNode) bg.remove();
      }, 190);
    }
  }
</script>


    <!-- [SESSION-LIFECYCLE-P1] محرك إدارة دورة حياة الجلسة — خروج منظّم -->
    <script>
  // ════════════════════════════════════════════════════════════════
  // 48_JS_SessionLifecycleEngine.html — [SESSION-LIFECYCLE-P1]
  //
  // الهدف: بدل ما تنتهي الجلسة فجأة (قطع مباشر لشاشة اللوجين فوق أي حاجة
  // كانت مفتوحة)، بيحصل "خروج منظّم" (Graceful Shutdown):
  //   1) تحذير للمستخدم قبل انتهاء الجلسة بدقيقة (البنية موجودة أصلاً في
  //      02_JS_UI_Shell.html — SESSION._showIdleWarning) + خيار صريح
  //      "تسجيل الخروج الآن" بجانب "متابعة الجلسة".
  //   2) لو محدش استجاب → SessionLifecycle.beginGracefulShutdown() تفحص:
  //      - عمليات حرجة جارية (حفظ / رفع / تنزيل / تصدير تقرير) عن طريق
  //        سجل بسيط (registerBusyOp/unregisterBusyOp) — تستنى شوية أو
  //        تلغي، وتمنع بدء عمليات جديدة بعد بدء الإنهاء.
  //      - عناصر واجهة مفتوحة (Modal/Drawer/Dropdown/Context Menu/
  //        Date-Picker/Notif) وتقفلها بالترتيب الصحيح.
  //      - شاشة فيها تعديلات غير محفوظة (Dirty State) → تُحفظ كمسودة في
  //        localStorage قبل القفل، مش هتتفقد.
  //   3) بعد التنظيف الكامل: تنظيف الجلسة (Token) + عرض شاشة "انتهت
  //      جلستك" مصممة (مش نص Toast يظهر فجأة فوق شاشة اللوجين) توضح
  //      وجود مسودة محفوظة لو فيه.
  //   4) بعد تسجيل الدخول تاني: استعادة نفس الصفحة/السجل/الفلاتر لو
  //      لسه صالحة (SessionLifecycle.restoreAfterLogin — تتنادى من
  //      02_JS_UI_Shell.html بعد نجاح اللوجين).
  //
  // ملاحظة معمارية: الملف ده بيتحمّل بعد Core_UIManagers (فمعاه
  // closeDrawer/closeStyledDrawer/_closeAllDropdowns/closeNotifDropdown)
  // وبعد 02_JS_UI_Shell (فمعاه SESSION/_handleSessionExpired/APP).
  // ════════════════════════════════════════════════════════════════

  var SL_DRAFT_KEY = "wms_session_draft_v1";
  var SL_UI_STATE_KEY = "wms_session_uistate_v1";

  var SessionLifecycle = (function () {
    var _busyOps = {}; // id -> label
    var _busySeq = 0;
    var _shuttingDown = false;

    // ── §1 سجل العمليات الجارية (Save/Upload/Download/Report/Sync) ──
    // أي كود عنده عملية حرجة (رفع ملف، تنزيل، توليد تقرير، مزامنة درايف)
    // ينادي SessionLifecycle.registerBusyOp("upload:item-image") ويحتفظ
    // بالـ id الراجع، وينادي unregisterBusyOp(id) لما تخلص. SaveEngine
    // (32_JS_SaveEngine.html) مربوطة بالفعل بهذا السجل لعمليات الحفظ.
    function registerBusyOp(label) {
      var id = "op" + ++_busySeq;
      _busyOps[id] = { label: label, startedAt: Date.now() };
      return id;
    }
    function unregisterBusyOp(id) {
      delete _busyOps[id];
    }
    function hasBusyOps() {
      return Object.keys(_busyOps).length > 0;
    }
    function listBusyOps() {
      return Object.keys(_busyOps).map(function (k) {
        return _busyOps[k].label;
      });
    }
    function isShuttingDown() {
      return _shuttingDown;
    }

    // ── §2 فحص حالة الواجهة قبل الإغلاق ──────────────────────────
    function _isOpen(sel) {
      try {
        return !!document.querySelector(sel);
      } catch (e) {
        return false;
      }
    }

    function scanUIState() {
      return {
        modal: _isOpen("#modal-root .modal, .modal-overlay .modal"),
        drawer: _isOpen("#edit-drawer"),
        dropdown: _isOpen(".os-id-open, .nav-grp-toggle.open"),
        notifDropdown: _isOpen("#notif-dropdown.open"),
        contextMenu: _isOpen(".ctx-menu"),
        datePicker: _isOpen(
          ".flatpickr-calendar.open, .date-picker-panel.open",
        ),
        colorPicker: _isOpen(".color-picker-panel.open"),
        printPreview: _isOpen("#print-preview-overlay, .print-preview-modal"),
        sidebarOpenMobile: _isOpen("#main-sidebar.open"),
      };
    }

    function anyUIOpen(state) {
      state = state || scanUIState();
      for (var k in state) {
        if (state[k]) return true;
      }
      return false;
    }

    // ── §3 حفظ حالة "غير محفوظة" كمسودة قبل القفل ────────────────
    // بيعتمد على window._sdCloseGuard (نفس الـ Hook الموجود أصلاً في
    // Core_UIManagers.html لشاشات الـ Drawer) كإشارة على وجود تعديلات
    // غير محفوظة. لو الشاشة مسجّلة Guard، بنعتبرها Dirty ونحفظ لقطة
    // بسيطة (الصفحة الحالية + عنوان الـ URL/hash + أي عناصر فورم ظاهرة)
    // بدل ما نفقد عمل المستخدم بصمت.
    function _snapshotOpenForm() {
      var drawer = document.getElementById("edit-drawer");
      if (!drawer) return null;
      var fields = {};
      drawer.querySelectorAll("input,textarea,select").forEach(function (el) {
        if (!el.id) return;
        if (el.type === "password") return;
        fields[el.id] =
          el.type === "checkbox" || el.type === "radio"
            ? el.checked
            : el.value;
      });
      return {
        page: APP.currentPage,
        fields: fields,
        savedAt: Date.now(),
      };
    }

    function saveDraftIfDirty() {
      var isDirty = typeof window._sdCloseGuard === "function";
      if (!isDirty) return false;
      var snap = _snapshotOpenForm();
      if (!snap) return false;
      try {
        localStorage.setItem(SL_DRAFT_KEY, JSON.stringify(snap));
      } catch (e) {
        return false;
      }
      return true;
    }

    function hasSavedDraft() {
      try {
        return !!localStorage.getItem(SL_DRAFT_KEY);
      } catch (e) {
        return false;
      }
    }

    function _consumeDraft() {
      try {
        var raw = localStorage.getItem(SL_DRAFT_KEY);
        localStorage.removeItem(SL_DRAFT_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    // ── §4 حفظ/استعادة حالة الشاشة العامة (صفحة + فلاتر + تمرير) ──
    function _saveUIState() {
      try {
        var contentEl = document.querySelector(".content");
        var state = {
          page: APP.currentPage,
          scrollTop: contentEl ? contentEl.scrollTop : 0,
          search:
            (document.getElementById("global-search-input") || {}).value ||
            "",
        };
        localStorage.setItem(SL_UI_STATE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function _consumeUIState() {
      try {
        var raw = localStorage.getItem(SL_UI_STATE_KEY);
        localStorage.removeItem(SL_UI_STATE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    // ── §4b [FIX-LOGIN-MULTI-RENDER] معاينة الصفحة المحفوظة بدون
    // استهلاكها — بتُستخدم قبل أول render بعد اللوجين (02_JS_UI_Shell.html
    // _afterLoginSuccess) عشان الرسم الأول يبدأ على الصفحة الصحيحة من
    // غير ما المستخدم يشوف الداشبورد لحظة وبعدين يُقفش لصفحته الحقيقية.
    function peekInitialPage() {
      try {
        var raw = localStorage.getItem(SL_UI_STATE_KEY);
        if (!raw) return null;
        var st = JSON.parse(raw);
        return st && st.page && st.page !== "dashboard" ? st.page : null;
      } catch (e) {
        return null;
      }
    }

    // ── §5 تنظيف الواجهة بالترتيب المطلوب ─────────────────────────
    function gracefulUICleanup() {
      // 1) Dropdowns
      if (typeof _closeAllDropdowns === "function") _closeAllDropdowns();
      document.querySelectorAll(".os-id-open").forEach(function (p) {
        p.classList.remove("os-id-open");
      });
      // 2) Tooltips
      document
        .querySelectorAll("[data-tooltip-open], .tooltip.show")
        .forEach(function (t) {
          t.classList.remove("show");
          t.removeAttribute("data-tooltip-open");
        });
      // 3) Context Menus
      document.querySelectorAll(".ctx-menu").forEach(function (m) {
        m.remove();
      });
      // 4) Popovers
      document.querySelectorAll(".popover.open, .popover.show").forEach(
        function (p) {
          p.classList.remove("open", "show");
        },
      );
      // 5) Date/Color Pickers
      document
        .querySelectorAll(
          ".flatpickr-calendar.open, .date-picker-panel.open, .color-picker-panel.open",
        )
        .forEach(function (p) {
          p.classList.remove("open");
        });
      // 6) Notif dropdown
      if (typeof closeNotifDropdown === "function") closeNotifDropdown();
      // 7) Drawers (بعد حفظ حالتها كمسودة لو محتاجة)
      if (document.getElementById("edit-drawer")) {
        saveDraftIfDirty();
        if (typeof closeDrawer === "function") closeDrawer(true);
      }
      // 8) Modals
      if (typeof closeModal === "function") {
        try {
          closeModal();
        } catch (e) {}
      }
      // 9) Notifications المؤقتة (Toasts)
      document
        .querySelectorAll(".toast, #__session-warning")
        .forEach(function (t) {
          t.remove();
        });
      // 10) شاشات المعاينة/الطباعة
      document
        .querySelectorAll("#print-preview-overlay, .print-preview-modal")
        .forEach(function (p) {
          p.remove();
        });
      // Mobile sidebar
      if (typeof closeSidebar === "function") closeSidebar();
    }

    // ── §6 خروج منظّم كامل (Graceful Shutdown) ────────────────────
    // reason: "timeout" | "expired" | "manual"
    function beginGracefulShutdown(reason, opts) {
      if (_shuttingDown) return;
      _shuttingDown = true;
      opts = opts || {};

      // امنع أي عملية جديدة من البدء أثناء الإنهاء
      APP._sessionEnding = true;

      _saveUIState();
      var draftSaved = saveDraftIfDirty();

      var MAX_WAIT_MS = 4000;
      var POLL_MS = 200;
      var waited = 0;

      function finalize() {
        gracefulUICleanup();
        _shuttingDown = false;
        APP._sessionEnding = false;
        _finishSessionEnd(reason, draftSaved);
      }

      (function waitForBusyOps() {
        if (!hasBusyOps() || waited >= MAX_WAIT_MS) {
          finalize();
          return;
        }
        waited += POLL_MS;
        setTimeout(waitForBusyOps, POLL_MS);
      })();
    }

    // ── §7 إنهاء الجلسة فعليًا + عرض شاشة "انتهت جلستك" ──────────
    function _finishSessionEnd(reason, draftSaved) {
      var token = SESSION.token;
      var username = APP.currentUser ? APP.currentUser.username : null;

      // إيقاف كل المؤقتات/الـ Polling الخلفية
      if (typeof _stopIdleWatcher === "function") _stopIdleWatcher();
      if (typeof _stopSessionCountdown === "function") _stopSessionCountdown();
      if (typeof _clearAllPollTimers === "function") _clearAllPollTimers();

      if (token) {
        try {
          DL.Users.logout(token, username, {
            onSuccess: function () {},
            onError: function () {},
          });
        } catch (e) {}
      }

      if (typeof _clearSession === "function") _clearSession();
      APP.currentUser = null;
      APP.currentPage = "dashboard";
      try {
        _preloadDone = false;
      } catch (e) {}
      APP.extLoaded = false;
      APP.extLoading = false;
      try {
        sessionStorage.clear();
      } catch (e) {}

      var fabRoot = document.getElementById("ai-float-root");
      if (fabRoot) fabRoot.remove();

      _renderSessionEndScreen(reason, draftSaved);
    }

    function _renderSessionEndScreen(reason, draftSaved) {
      var root = document.getElementById("root");
      if (!root) return;
      root.innerHTML = renderLogin();
      bindLogin();

      var titles = {
        timeout: "انتهت جلستك بسبب عدم النشاط، سجّل الدخول مرة أخرى",
        expired: "انتهت صلاحية الجلسة، سجّل الدخول مرة أخرى",
        manual: "تم تسجيل الخروج",
      };
      var msg = titles[reason] || titles.expired;
      if (draftSaved) {
        msg += " — تم حفظ تعديلاتك غير المحفوظة كمسودة وستُستعاد تلقائيًا.";
      }

      // [FIX-2026-08-05] بدل popup منبثق فوق شاشة اللوجين، بقت رسالة
      // نصية عادية في نفس مكان أخطاء تسجيل الدخول (فوق زرار "دخول").
      // ملحوظة: ما بننادي showLoginErr() من هنا لأنها معرّفة جوه IIFE
      // خاص بـ 02_JS_UI_Shell.html ومش متعرّضة على window، فالتعديل
      // بيتم مباشرة على العنصر نفسه (#login-err) بنفس الخصائص.
      var errEl = document.getElementById("login-err");
      if (errEl) {
        errEl.style.display = "block";
        errEl.setAttribute("role", "alert");
        errEl.setAttribute("aria-live", "assertive");
        errEl.textContent = msg;
      }
    }

    // ── §8 استعادة العمل بعد تسجيل الدخول من جديد ─────────────────
    // تتنادى من 02_JS_UI_Shell.html بعد نجاح اللوجين مباشرة (بعد ما
    // APP.currentUser يتحدد وبعد أول renderPage).
    function restoreAfterLogin() {
      var uiState = _consumeUIState();
      var draft = _consumeDraft();

      // [FIX-LOGIN-MULTI-RENDER] الصفحة نفسها بقت بتتحدد قبل أول render
      // في الأصل (عبر peekInitialPage() اللي بتتنادى من _afterLoginSuccess
      // قبل render())، فمفيش داعي لـ renderPage() تانية هنا — كانت هي
      // بالذات سبب "القفشة" من الداشبورد لصفحة تانية بعد ما المستخدم
      // يكون شايف الداشبورد لحظة، وده اللي كان بيقفل أي قائمة سايد بار
      // مفتوحة ويصفّر التمرير. هنا بس بنستعيد التمرير والبحث — تفاصيل
      // مش مرتبطة بالرسم نفسه، والصفحة أصلاً معروضة صحيحة من الأول.
      if (uiState && uiState.scrollTop) {
        setTimeout(function () {
          var contentEl = document.querySelector(".content");
          if (contentEl) contentEl.scrollTop = uiState.scrollTop;
          var searchEl = document.getElementById("global-search-input");
          if (searchEl && uiState.search) searchEl.value = uiState.search;
        }, 150);
      }

      if (draft && draft.fields) {
        showToast(
          "📝 تم استعادة مسودة العمل غير المحفوظ من الجلسة السابقة",
          "info",
        );
        // استعادة القيم فقط لو نفس الشاشة اتفتحت لاحقًا (يدويًا) بنفس
        // الحقول — بنخزّنها مؤقتًا على APP عشان أي شاشة تقدر تقرأها
        // وتُطبّقها بنفسها لو حابة (best-effort، بدون افتراض بنية موحّدة
        // لكل شاشات النظام).
        APP._restoredDraft = draft;
      }
    }

    return {
      registerBusyOp: registerBusyOp,
      unregisterBusyOp: unregisterBusyOp,
      hasBusyOps: hasBusyOps,
      listBusyOps: listBusyOps,
      isShuttingDown: isShuttingDown,
      scanUIState: scanUIState,
      anyUIOpen: anyUIOpen,
      saveDraftIfDirty: saveDraftIfDirty,
      hasSavedDraft: hasSavedDraft,
      gracefulUICleanup: gracefulUICleanup,
      beginGracefulShutdown: beginGracefulShutdown,
      restoreAfterLogin: restoreAfterLogin,
      peekInitialPage: peekInitialPage,
    };
  })();
</script>


    <!-- [FORGOT-PW-1] استعادة كلمة المرور الذاتية من شاشة اللوجين -->
    <script>
  // ═══════════════════════════════════════════════════════════════════
  // 39_JS_ForgotPassword.html — [FORGOT-PW-1] استعادة كلمة المرور ذاتيًا
  //
  // واجهة أمامية لمسار استعادة كلمة المرور من شاشة اللوجين مباشرة، بدون
  // تدخّل المدير. يعتمد على DL.Core.requestPasswordReset /
  // verifyPasswordResetOtp / resetPasswordWithToken (31_JS_DataLayer.html)
  // والدوال المقابلة في Code_32_ForgotPassword.gs.
  //
  // 3 خطوات + شاشة نجاح، كلها داخل overlay واحد (fp-overlay) يُبنى
  // ديناميكيًا في الـ DOM ويُزال بالكامل عند الإغلاق — لا يعتمد على أي
  // عنصر من هيكل الداشبورد (الشاشة دي بتظهر فقط قبل تسجيل الدخول).
  // ═══════════════════════════════════════════════════════════════════

  var _FP = {
    username: "",
    resetToken: "",
    resendEnds: 0,
    resendTimer: null,
  };

  // ── الربط الأولي: يُستدعى من bindLogin() في 02_JS_UI_Shell.html ──────
  function bindForgotPasswordLink() {
    var link = document.getElementById("btn-forgot-password");
    if (!link || link.dataset.fpBound) return;
    link.dataset.fpBound = "1";
    link.addEventListener("click", function () {
      _fpOpen();
    });
  }

  // ── فتح/إغلاق الـ Overlay ────────────────────────────────────────────
  function _fpOpen() {
    if (document.getElementById("fp-overlay")) return;
    var overlay = document.createElement("div");
    overlay.className = "fp-overlay";
    overlay.id = "fp-overlay";
    overlay.innerHTML =
      '<div class="fp-box" id="fp-box">' +
      '<button type="button" class="fp-close" id="fp-close" title="' +
      esc(I18N.t("FP_BTN_CANCEL")) +
      '"><i class="ti ti-x"></i></button>' +
      '<div id="fp-step-content"></div>' +
      "</div>";
    document.body.appendChild(overlay);

    overlay.addEventListener("mousedown", function (e) {
      if (e.target === overlay) _fpClose();
    });
    document.getElementById("fp-close").addEventListener("click", _fpClose);
    document.addEventListener("keydown", _fpEscHandler);

    // تعبئة اسم المستخدم تلقائيًا لو كان متكتوب بالفعل في شاشة اللوجين
    var loginUserVal = (document.getElementById("l-user") || {}).value || "";
    _fpRenderStep1(loginUserVal.trim());
  }

  function _fpEscHandler(e) {
    if (e.key === "Escape") _fpClose();
  }

  function _fpClose() {
    var overlay = document.getElementById("fp-overlay");
    if (overlay) overlay.remove();
    document.removeEventListener("keydown", _fpEscHandler);
    if (_FP.resendTimer) {
      clearInterval(_FP.resendTimer);
      _FP.resendTimer = null;
    }
    _FP = { username: "", resetToken: "", resendEnds: 0, resendTimer: null };
  }

  // ── أدوات مشتركة ─────────────────────────────────────────────────────
  function _fpBtnHTML(text, loading) {
    if (loading) {
      return (
        '<span style="display:inline-flex;align-items:center;gap:8px">' +
        '<span style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;animation:spin 0.6s linear infinite;display:inline-block"></span>' +
        esc(I18N.t("FP_LOADING")) +
        "</span>"
      );
    }
    return "<span>" + esc(text) + "</span>";
  }

  function _fpEnsureShakeStyle() {
    if (document.getElementById("__shake-style")) return;
    var ss = document.createElement("style");
    ss.id = "__shake-style";
    ss.textContent =
      "@keyframes __shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}";
    document.head.appendChild(ss);
  }

  function _fpShowError(msg) {
    var box = document.getElementById("fp-error-box");
    if (!box) return;
    box.textContent = msg;
    box.style.display = "block";
    _fpEnsureShakeStyle();
    var card = document.getElementById("fp-box");
    if (card) {
      card.style.animation = "none";
      // reflow قبل إعادة تشغيل الأنيميشن
      void card.offsetWidth;
      card.style.animation = "__shake 0.5s ease";
    }
  }

  function _fpClearError() {
    var box = document.getElementById("fp-error-box");
    if (box) {
      box.style.display = "none";
      box.textContent = "";
    }
  }

  // ─────────────────────────────────────────────────────────────
  // الخطوة 1 — إدخال اسم المستخدم
  // ─────────────────────────────────────────────────────────────
  function _fpRenderStep1(prefill) {
    var html =
      '<div class="fp-icon-wrap"><i class="ti ti-key"></i></div>' +
      '<div class="fp-title">' +
      esc(I18N.t("FP_TITLE_STEP1")) +
      "</div>" +
      '<div class="fp-subtitle">' +
      esc(I18N.t("FP_SUBTITLE_STEP1")) +
      "</div>" +
      '<div class="login-field" id="fp-fld-user">' +
      '<label for="fp-user"><i class="ti ti-user" aria-hidden="true"></i> ' +
      esc(I18N.t("FP_USERNAME_LABEL")) +
      "</label>" +
      '<div class="login-input-wrap">' +
      '<input id="fp-user" type="text" placeholder="' +
      esc(I18N.t("FP_USERNAME_PLACEHOLDER")) +
      '" autocomplete="username" value="' +
      esc(prefill || "") +
      '">' +
      "</div></div>" +
      '<div id="fp-error-box" class="fp-error"></div>' +
      '<div class="fp-actions">' +
      '<button type="button" class="fp-btn-secondary" id="fp-cancel-1">' +
      esc(I18N.t("FP_BTN_CANCEL")) +
      "</button>" +
      '<button type="button" class="btn-login" id="fp-submit-1">' +
      _fpBtnHTML(I18N.t("FP_BTN_SEND_CODE")) +
      "</button>" +
      "</div>";

    document.getElementById("fp-step-content").innerHTML = html;

    var userInput = document.getElementById("fp-user");
    var submitBtn = document.getElementById("fp-submit-1");
    document.getElementById("fp-cancel-1").addEventListener("click", _fpClose);
    submitBtn.addEventListener("click", _fpSubmitStep1);
    userInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") _fpSubmitStep1();
    });
    userInput.focus();
  }

  function _fpSubmitStep1() {
    _fpClearError();
    var userInput = document.getElementById("fp-user");
    var submitBtn = document.getElementById("fp-submit-1");
    var uname = (userInput.value || "").trim();
    if (!uname) {
      _fpShowError(I18N.t("SHELL_MSG_FILL_ALL_FIELDS"));
      return;
    }
    submitBtn.disabled = true;
    userInput.disabled = true;
    submitBtn.innerHTML = _fpBtnHTML("", true);

    DL.Core.requestPasswordReset(uname, {
      onSuccess: function (res) {
        _FP.username = uname;
        _fpRenderStep2();
      },
      onError: function (res) {
        submitBtn.disabled = false;
        userInput.disabled = false;
        submitBtn.innerHTML = _fpBtnHTML(I18N.t("FP_BTN_SEND_CODE"));
        _fpShowError((res && res.message) || I18N.t("FP_ERR_GENERIC"));
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // الخطوة 2 — إدخال كود التحقق
  // ─────────────────────────────────────────────────────────────
  function _fpRenderStep2() {
    var html =
      '<div class="fp-icon-wrap"><i class="ti ti-mail-opened"></i></div>' +
      '<div class="fp-title">' +
      esc(I18N.t("FP_TITLE_STEP2")) +
      "</div>" +
      '<div class="fp-subtitle">' +
      esc(I18N.t("FP_SUBTITLE_STEP2")) +
      "</div>" +
      '<div class="login-field" id="fp-fld-otp">' +
      '<label for="fp-otp"><i class="ti ti-shield-lock" aria-hidden="true"></i> ' +
      esc(I18N.t("FP_OTP_LABEL")) +
      "</label>" +
      '<div class="login-input-wrap">' +
      '<input id="fp-otp" class="fp-otp-input" type="text" inputmode="numeric" ' +
      'pattern="[0-9]*" maxlength="6" placeholder="' +
      esc(I18N.t("FP_OTP_PLACEHOLDER")) +
      '" autocomplete="one-time-code">' +
      "</div></div>" +
      '<div id="fp-error-box" class="fp-error"></div>' +
      '<div class="fp-actions">' +
      '<button type="button" class="fp-btn-secondary" id="fp-back-2">' +
      esc(I18N.t("FP_BTN_BACK")) +
      "</button>" +
      '<button type="button" class="btn-login" id="fp-submit-2">' +
      _fpBtnHTML(I18N.t("FP_BTN_VERIFY_CODE")) +
      "</button>" +
      "</div>" +
      '<div class="fp-resend-row">' +
      '<button type="button" class="fp-resend-link" id="fp-resend" disabled></button>' +
      "</div>";

    document.getElementById("fp-step-content").innerHTML = html;

    var otpInput = document.getElementById("fp-otp");
    var submitBtn = document.getElementById("fp-submit-2");
    document.getElementById("fp-back-2").addEventListener("click", function () {
      _fpRenderStep1(_FP.username);
    });
    submitBtn.addEventListener("click", _fpSubmitStep2);
    otpInput.addEventListener("input", function () {
      otpInput.value = otpInput.value.replace(/\D/g, "").slice(0, 6);
    });
    otpInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") _fpSubmitStep2();
    });
    document
      .getElementById("fp-resend")
      .addEventListener("click", _fpResendCode);
    otpInput.focus();

    _fpStartResendCountdown(60);
  }

  function _fpStartResendCountdown(seconds) {
    var resendBtn = document.getElementById("fp-resend");
    if (!resendBtn) return;
    if (_FP.resendTimer) clearInterval(_FP.resendTimer);
    _FP.resendEnds = Date.now() + seconds * 1000;
    resendBtn.disabled = true;

    function tick() {
      var btn = document.getElementById("fp-resend");
      if (!btn) {
        clearInterval(_FP.resendTimer);
        return;
      }
      var remaining = Math.ceil((_FP.resendEnds - Date.now()) / 1000);
      if (remaining <= 0) {
        clearInterval(_FP.resendTimer);
        _FP.resendTimer = null;
        btn.disabled = false;
        btn.textContent = I18N.t("FP_RESEND_CODE");
      } else {
        btn.textContent = I18N.t("FP_RESEND_WAIT", { s: remaining });
      }
    }
    tick();
    _FP.resendTimer = setInterval(tick, 1000);
  }

  function _fpResendCode() {
    var resendBtn = document.getElementById("fp-resend");
    if (!resendBtn || resendBtn.disabled) return;
    _fpClearError();
    resendBtn.disabled = true;
    DL.Core.requestPasswordReset(_FP.username, {
      onSuccess: function () {
        var otpInput = document.getElementById("fp-otp");
        if (otpInput) otpInput.value = "";
        _fpStartResendCountdown(60);
      },
      onError: function (res) {
        _fpShowError((res && res.message) || I18N.t("FP_ERR_GENERIC"));
        _fpStartResendCountdown(60);
      },
    });
  }

  function _fpSubmitStep2() {

    var submitBtn = document.getElementById("fp-submit-2");
    var otp = (otpInput.value || "").trim();

      return;
    }
    submitBtn.disabled = true;
    otpInput.disabled = true;
    submitBtn.innerHTML = _fpBtnHTML("", true);

    DL.Core.verifyPasswordResetOtp(_FP.username, otp, {
      onSuccess: function (res) {
        _FP.resetToken = (res && res.data && res.data.resetToken) || "";
        _fpRenderStep3();
      },
      onError: function (res) {
        submitBtn.disabled = false;
        otpInput.disabled = false;
        submitBtn.innerHTML = _fpBtnHTML(I18N.t("FP_BTN_VERIFY_CODE"));
        _fpShowError((res && res.message) || I18N.t("FP_ERR_GENERIC"));
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // الخطوة 3 — كلمة مرور جديدة
  // ─────────────────────────────────────────────────────────────
  function _fpRenderStep3() {

      '<div class="fp-icon-wrap"><i class="ti ti-lock-check"></i></div>' +

      '<div class="login-field" id="fp-fld-pw1">' +

      esc(I18N.t("FP_NEW_PASSWORD_LABEL")) +

      '<div class="login-input-wrap">' +

      esc(I18N.t("FP_NEW_PASSWORD_PLACEHOLDER")) +
      '" autocomplete="new-password">' +
      '<button type="button" class="login-eye-btn" id="fp-pw1-toggle">' +
      '<i class="ti ti-eye" id="fp-pw1-eye-icon" aria-hidden="true"></i>' +
      "</button>" +
      "</div></div>" +
      '<div class="login-field" id="fp-fld-pw2">' +
      '<label for="fp-pw2"><i class="ti ti-lock-check" aria-hidden="true"></i> ' +
      esc(I18N.t("FP_CONFIRM_PASSWORD_LABEL")) +
      "</label>" +
      '<div class="login-input-wrap">' +
      '<input id="fp-pw2" class="has-toggle" type="password" placeholder="' +
      esc(I18N.t("FP_CONFIRM_PASSWORD_PLACEHOLDER")) +
      '" autocomplete="new-password">' +
      '<button type="button" class="login-eye-btn" id="fp-pw2-toggle">' +
      '<i class="ti ti-eye" id="fp-pw2-eye-icon" aria-hidden="true"></i>' +
      "</button>" +
      "</div></div>" +
      // ── [SEC-FP-STRENGTH] مؤشر قوة كلمة المرور الحي — نفس منطق
      // شاشة التغيير الإجباري (_showForcePasswordChangeScreen في
      // 02_JS_UI_Shell.html) بس بشكل مطابق لتصميم فورم نسيت الباسورد.
      '<div class="fp-strength-wrap">' +
      '<div class="fp-strength-toprow">' +
      "<span>" +
      esc(I18N.t("FP_STRENGTH_LABEL")) +
      "</span>" +
      '<span class="fp-strength-label" id="fp-strength-label">—</span>' +
      "</div>" +
      '<div class="fp-strength-track"><div class="fp-strength-bar" id="fp-strength-bar"></div></div>' +
      '<ul class="fp-reqs" id="fp-reqs">' +
      '<li data-req="len">○ ' +
      esc(I18N.t("FP_REQ_LEN")) +
      "</li>" +
      '<li data-req="upper">○ ' +
      esc(I18N.t("FP_REQ_UPPER")) +
      "</li>" +
      '<li data-req="lower">○ ' +
      esc(I18N.t("FP_REQ_LOWER")) +
      "</li>" +
      '<li data-req="num">○ ' +
      esc(I18N.t("FP_REQ_NUM")) +
      "</li>" +

      esc(I18N.t("FP_REQ_SPECIAL")) +
      "</li>" +
      '<li data-req="match">○ ' +
      esc(I18N.t("FP_REQ_MATCH")) +
      "</li>" +
      "</ul>" +
      "</div>" +
      '<div id="fp-error-box" class="fp-error"></div>' +
      '<div class="fp-actions">' +
      '<button type="button" class="btn-login" id="fp-submit-3" style="flex:1;width:100%">' +
      _fpBtnHTML(I18N.t("FP_BTN_RESET")) +
      "</button>" +
      "</div>";

    document.getElementById("fp-step-content").innerHTML = html;

    _fpBindEyeToggle("fp-pw1");
    _fpBindEyeToggle("fp-pw2");

    var pw1 = document.getElementById("fp-pw1");
    var pw2 = document.getElementById("fp-pw2");
    var submitBtn = document.getElementById("fp-submit-3");
    submitBtn.addEventListener("click", _fpSubmitStep3);
    pw2.addEventListener("keydown", function (e) {
      if (e.key === "Enter") _fpSubmitStep3();
    });

    // ── [SEC-FP-STRENGTH] تحديث حي لمؤشر القوة + القائمة ─────────
    // ملحوظة: هذا التحقق تجميلي/UX فقط — التحقق الحقيقي والملزم يظل
    // في الباك اند عبر _validatePasswordStrength (نفس القواعد بالضبط،
    // PASSWORD_POLICY في Code_12_Core.gs)، فلا يوجد أي اعتماد أمني هنا.
    _fpBindStrengthMeter(pw1, pw2, submitBtn);

    document.getElementById("fp-pw1").focus();
  }

  function _fpBindStrengthMeter(pw1, pw2, submitBtn) {
    var bar = document.getElementById("fp-strength-bar");
    var label = document.getElementById("fp-strength-label");
    var reqsBox = document.getElementById("fp-reqs");

    var REQ_LABELS_KEYS = {
      len: "FP_REQ_LEN",
      upper: "FP_REQ_UPPER",
      lower: "FP_REQ_LOWER",
      num: "FP_REQ_NUM",
      special: "FP_REQ_SPECIAL",
    };

    // [PW-UNIFY] منطق الشروط موحّد الآن في VF.checkPasswordRequirements
    // (VF_JS_Validation.html) — لا تكرار محلي هنا.
    function _update() {
      var np = pw1.value || "";
      var cp = pw2.value || "";
      var state = VF.checkPasswordRequirements(np, cp);
      var passCount = state.passCount;

      Object.keys(REQ_LABELS_KEYS).forEach(function (key) {
        var li = reqsBox.querySelector('[data-req="' + key + '"]');
        if (!li) return;
        var ok = state[key];
        li.classList.toggle("ok", ok);
        li.classList.toggle("bad", false);
        li.textContent = (ok ? " " : "○ ") + I18N.t(REQ_LABELS_KEYS[key]);
      });

      var matchLi = reqsBox.querySelector('[data-req="match"]');
      if (matchLi) {
        if (cp.length > 0 && state.match) {
          matchLi.className = "ok";
          matchLi.textContent = " " + I18N.t("FP_REQ_MATCH");
        } else if (cp.length > 0) {
          matchLi.className = "bad";
          matchLi.textContent = " " + I18N.t("FP_REQ_MISMATCH");
        } else {
          matchLi.className = "";
          matchLi.textContent = "○ " + I18N.t("FP_REQ_MATCH");
        }
      }

      // [PW-UNIFY] pct/color/label بيجوا دلوقتي من VF.passwordStrengthMeta
      // (نفس مصدر 02_JS_UI_Shell.html و08_JS_Users_Branding.html) بدل
      // حساب محلي منفصل — كانت هذه آخر نسخة متبقية من التكرار الثلاثي.
      var meta = VF.passwordStrengthMeta(passCount, np.length);
      bar.style.width = meta.pct + "%";
      bar.style.background = meta.color;
      label.textContent = meta.label;
      label.style.color = meta.color;

      var allOk = state.allOk;
      submitBtn.disabled = !allOk;
      submitBtn.style.opacity = allOk ? "1" : "0.55";
      submitBtn.style.cursor = allOk ? "pointer" : "not-allowed";
    }

    pw1.addEventListener("input", _update);
    pw2.addEventListener("input", _update);
    _update();
  }

  function _fpBindEyeToggle(inputId) {
    var btn = document.getElementById(inputId + "-toggle");
    var input = document.getElementById(inputId);
    var icon = document.getElementById(inputId + "-eye-icon");
    if (!btn || !input || !icon) return;
    btn.addEventListener("click", function () {
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("ti-eye");
        icon.classList.add("ti-eye-off");
      } else {
        input.type = "password";
        icon.classList.remove("ti-eye-off");
        icon.classList.add("ti-eye");
      }
      input.focus();
    });
  }

  function _fpSubmitStep3() {
    _fpClearError();
    var pw1 = document.getElementById("fp-pw1");
    var pw2 = document.getElementById("fp-pw2");
    var submitBtn = document.getElementById("fp-submit-3");
    var p1 = pw1.value || "";
    var p2 = pw2.value || "";
    if (!p1 || !p2) {
      _fpShowError(I18N.t("SHELL_MSG_FILL_ALL_FIELDS"));
      return;
    }
    if (p1 !== p2) {
      _fpShowError(I18N.t("FP_ERR_PASSWORD_MISMATCH"));
      return;
    }
    submitBtn.disabled = true;
    pw1.disabled = true;
    pw2.disabled = true;
    submitBtn.innerHTML = _fpBtnHTML("", true);

    DL.Core.resetPasswordWithToken(_FP.username, _FP.resetToken, p1, p2, {
      onSuccess: function () {
        _fpRenderSuccess();
      },
      onError: function (res) {
        submitBtn.disabled = false;
        pw1.disabled = false;
        pw2.disabled = false;
        submitBtn.innerHTML = _fpBtnHTML(I18N.t("FP_BTN_RESET"));
        _fpShowError((res && res.message) || I18N.t("FP_ERR_GENERIC"));
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // شاشة النجاح
  // ─────────────────────────────────────────────────────────────
  function _fpRenderSuccess() {
    var fpUsername = _FP.username;
    var html =
      '<div class="fp-success-box">' +
      '<div class="fp-icon-wrap fp-icon-success"><i class="ti ti-circle-check"></i></div>' +
      '<div class="fp-title">' +
      esc(I18N.t("FP_STEP_SUCCESS_TITLE")) +
      "</div>" +
      '<div class="fp-subtitle">' +
      esc(I18N.t("FP_STEP_SUCCESS_DESC")) +
      "</div>" +
      '<div class="fp-actions">' +
      '<button type="button" class="btn-login" id="fp-back-to-login" style="flex:1;width:100%">' +
      _fpBtnHTML(I18N.t("FP_BTN_BACK_TO_LOGIN")) +
      "</button>" +
      "</div>" +
      "</div>";

    document.getElementById("fp-step-content").innerHTML = html;
    document
      .getElementById("fp-back-to-login")
      .addEventListener("click", function () {
        _fpClose();
        // تعبئة اسم المستخدم في شاشة اللوجين تلقائيًا وتركيز حقل الباسورد
        var loginUser = document.getElementById("l-user");
        var loginPass = document.getElementById("l-pass");
        if (loginUser) loginUser.value = fpUsername;
        if (loginPass) loginPass.focus();
      });
  }
</script>
