    <!-- [DATA-LAYER] طبقة البيانات الموحدة — يجب أن تُحمَّل قبل أي موديول آخر -->
    <!-- يحتوي على: _gsr() wrapper + DL Repositories + DataModule state manager -->
    <script>
  // ══════════════════════════════════════════════════════════════════════════
  // 00_JS_DataLayer.html — طبقة البيانات الموحدة لـ MOO.ERP
  // ──────────────────────────────────────────────────────────────────────────
  //
  // الهدف: توحيد 100% من استدعاءات الـ Backend عبر نقطة دخول واحدة بدل
  //        الاستدعاء المباشر لـ google.script.run في كل ملف على حدة.
  //
  // المحتوى:
  //   §DL-1  _gsr()  — Google Script Run Wrapper (نقطة الدخول الوحيدة)
  //   §DL-2  عقد الـ Response الموحد (DL_Result)
  //   §DL-3  DataModule — مدير حالة التحميل لكل شاشة
  //   §DL-4  Repository API — دوال مُختصَرة لكل موديول
  //   §DL-5  قواعد المطوّر (Developer Rules) — ممنوع كسرها
  //
  // ══════════════════════════════════════════════════════════════════════════

  // ─────────────────────────────────────────────────────────────
  // §DL-0  SHARED SYSTEM CONSTANTS — ثوابت موحّدة على مستوى النظام كله
  //
  // [SYSTEM-UNIFY] أي شاشة في أي موديول (HR / محاسبة / مخازن / فواتير) تحتاج
  // "طرق الدفع" أو "أسلوب استحقاق الراتب" يجب أن تستخدم هذه الثوابت بدل ما
  // تكتب القيم يدوياً (zero-duplication). القيم متوافقة مع القيم المستخدمة
  // فعلياً في سندات القبض/الصرف بالمحاسبة (CASH / BANK) لمنع التعارض.
  // ─────────────────────────────────────────────────────────────

  /** طرق الدفع الموحّدة — تُستخدم في: الموظفين، السندات، المصروفات، الرواتب */
  var PAYMENT_METHODS = [
    { value: "CASH", label: "نقدي", icon: "ti-cash" },
    { value: "BANK", label: "تحويل بنكي", icon: "ti-building-bank" },
    { value: "VISA", label: "فيزا", icon: "ti-credit-card" },
    { value: "WALLET", label: "محفظة إلكترونية", icon: "ti-wallet" },
  ];

  // ─────────────────────────────────────────────────────────────
  // §DL-0b  [إصلاح P2] formatMoney — دالة تنسيق مبالغ موحّدة على مستوى النظام
  //
  // قبل هذا التعديل: كل موديول كان له نسخته الخاصة (_fmtMoney في
  // 23_JS_PostingConfig_FixedAssets.html، توليك.toLocaleString() مباشر في
  // 02_JS_UI_Shell.html وغيرها...) — وكلها كانت تتجاهل تفضيل "currency"
  // المخزَّن فعليًا في شاشة التفضيلات (Dead Setting رغم وجوده في الواجهة).
  //
  // القاعدة الجديدة: أي مبلغ يُعرض للمستخدم في أي شاشة يمر عبر formatMoney()
  // بدل توليد كود تنسيق محلي جديد لكل شاشة (zero-duplication، نفس فلسفة
  // PAYMENT_METHODS أعلاه بالضبط).
  // ─────────────────────────────────────────────────────────────

  /** رموز العملات المدعومة — يُضاف عليها عند دعم عملة جديدة فقط هنا */
  var CURRENCY_SYMBOLS = {
    EGP: "ج.م",
    USD: "$",
    EUR: "€",
    SAR: "ر.س",
    AED: "د.إ",
  };

  /**
   * formatMoney(amount, opts)
   * opts.withSymbol  : افتراضي true — يضيف رمز العملة الحالية
   * opts.decimals    : افتراضي 2
   * opts.currencyOverride : لتجاوز عملة المستخدم الافتراضية عند الحاجة
   *                         (مثال: فاتورة مسجَّلة أصلاً بعملة مختلفة)
   */
  function formatMoney(amount, opts) {
    opts = opts || {};
    var decimals = opts.decimals !== undefined ? opts.decimals : 2;
    var n = Number(amount || 0);
    var formatted = n.toLocaleString("en-US", {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals,
    });
    if (opts.withSymbol === false) return formatted;
    var currency =
      opts.currencyOverride ||
      (typeof PreferenceService !== "undefined"

          // الجلسة سليمة فعلاً — كانت استجابة عابرة، نتجاهلها من غير تسجيل خروج
          if (typeof showToast === "function") {
            showToast(
              "تعذّر تنفيذ العملية (" + fnName + ") — حاول مرة أخرى",
              "warning",
            );
          }
        } else {
          _handleSessionExpired("invalid");
        }
      })
      .withFailureHandler(function () {
        _sessionConfirmInFlight = false;
        _handleSessionExpired("invalid");
      })
      .refreshSession(token);

  function _dlResult(success, data, message, source) {

      message: message || "",
      source: source || "",
    };

  // ─────────────────────────────────────────────────────────────
  // §DL-2  DataModule — مدير حالة التحميل لكل شاشة
  //
  // يُوفّر نمطًا موحدًا لإدارة حالات:
  //   idle → loading → success | empty | error
  //   وأيضاً: refreshing (تحديث خلفي بدون مسح الشاشة)
  //
  // الاستخدام:
  //   var mod = DataModule.create({
  //     containerId: "my-container",    // العنصر الذي تُعرض فيه الحالات
  //     emptyText: "لا توجد بيانات",   // اختياري
  //     onRender: function(data) { ... } // يُستدعى عند النجاح
  //   });
  //   mod.startLoading();
  //   _gsr("getFn", null, {
  //     onSuccess: function(r) { mod.applyResult(r); },
  //     onError:   function(r) { mod.applyError(r.message); }
  //   });
  // ─────────────────────────────────────────────────────────────
  var DataModule = (function () {
    function create(opts) {
      opts = opts || {};
      var _containerId = opts.containerId || "";
      var _emptyText = opts.emptyText || "لا توجد بيانات";
      var _onRender = opts.onRender || function () {};
      var _loading = false;

      function _getEl() {
        return _containerId ? document.getElementById(_containerId) : null;
      }

      function startLoading(label) {
        if (_loading) return;
        _loading = true;
        var el = _getEl();
        if (el) el.innerHTML = _loadingBlock(label);
      }

      function stopLoading() {
        _loading = false;
      }

      function isLoading() {
        return _loading;
      }

      function applyResult(dlResult) {
        _loading = false;
        if (!dlResult.success) {
          applyError(dlResult.message);
          return;
        }
        var data = dlResult.data;
        // Empty check — يدعم arrays وobjects
        var isEmpty = false;
        if (Array.isArray(data)) {
          isEmpty = data.length === 0;
        } else if (data === null || data === undefined) {
          isEmpty = true;
        }
        if (isEmpty) {
          applyEmpty();
          return;
        }
        try {
          _onRender(data);
        } catch (e) {
          console.error("[DataModule] onRender error:", e);
          applyError("خطأ في عرض البيانات: " + e.message);
        }
      }

      function applyEmpty(msg) {
        _loading = false;
        var el = _getEl();
        if (el) {
          el.innerHTML =
            '<div class="dl-empty-state" style="display:flex;flex-direction:column;align-items:center;' +
            'justify-content:center;padding:40px;gap:10px;color:var(--text3);text-align:center;">' +
            '<i class="ti ti-inbox" style="font-size:28px;opacity:0.4"></i>' +
            '<span style="font-size:13px">' +
            (msg || _emptyText) +
            "</span>" +
            "</div>";
        }
      }

      function applyError(msg, onRetry) {
        _loading = false;
        var el = _getEl();
        if (el) {
          var retryId = "dl-retry-" + Date.now();
          el.innerHTML =
            '<div class="dl-error-state" style="display:flex;flex-direction:column;align-items:center;' +
            'justify-content:center;padding:32px;gap:10px;color:var(--danger,#e11d48);text-align:center;">' +
            '<i class="ti ti-alert-circle" style="font-size:24px"></i>' +
            '<span style="font-size:13px;color:var(--text2)">' +
            (msg || "حدث خطأ غير متوقع") +
            "</span>" +
            (onRetry
              ? '<button id="' +
                retryId +
                '" class="btn btn-sm" style="margin-top:6px">إعادة المحاولة</button>'
              : "") +
            "</div>";
          if (onRetry) {
            var btn = document.getElementById(retryId);
            if (btn) btn.onclick = onRetry;
          }
        }
      }

      return {
        startLoading: startLoading,
        stopLoading: stopLoading,
        isLoading: isLoading,
        applyResult: applyResult,
        applyEmpty: applyEmpty,
        applyError: applyError,
      };
    }

    return { create: create };
  })();

  // ══════════════════════════════════════════════════════════════
  // 🗂️ ExportUtil — أداة التصدير المركزية (CSV / Excel / Print)
  // ══════════════════════════════════════════════════════════════
  window.ExportUtil = {
    /** تصدير CSV */
    toCSV: function (data, headers, filename) {
      var bom = "\uFEFF";
      var rows = [headers.join(",")];
      data.forEach(function (row) {
        rows.push(
          row
            .map(function (cell) {
              var v = cell === null || cell === undefined ? "" : String(cell);
              if (
                v.indexOf(",") > -1 ||
                v.indexOf('"') > -1 ||
                v.indexOf("\n") > -1
              ) {
                v = '"' + v.replace(/"/g, '\"\"') + '"';
              }
              return v;
            })
            .join(","),
        );
      });
      var blob = new Blob([bom + rows.join("\n")], {
        type: "text/csv;charset=utf-8;",
      });
      ExportUtil._download(blob, (filename || "export") + ".csv");
      typeof showToast === "function" && showToast("تم تصدير CSV ✓", "success");
    },

    /** تصدير Excel (XLSX) */
    toExcel: function (data, headers, filename, sheetName) {
      if (!window.XLSX) {
        typeof showToast === "function" &&
          showToast("مكتبة Excel غير محملة", "error");
        return;
      }
      var ws = XLSX.utils.aoa_to_sheet([headers].concat(data));
      var colWidths = headers.map(function (h, i) {
        var max = h.length;
        data.forEach(function (row) {
          var cell =
            row[i] !== null && row[i] !== undefined ? String(row[i]) : "";
          if (cell.length > max) max = cell.length;
        });
        return { wch: Math.min(max + 2, 40) };
      });
      ws["!cols"] = colWidths;
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName || "بيانات");
      XLSX.writeFile(wb, (filename || "export") + ".xlsx");
      typeof showToast === "function" &&
        showToast("تم تصدير Excel ✓", "success");
    },

    /** طباعة / PDF */
    toPrint: function (data, headers, title, subtitle) {
      // [SEC-FIX] دالة escape محلية للنافذة المنبثقة — تحمي من XSS في document.write
      function _esc(v) {
        return String(v == null ? "" : v)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      var rows = data
        .map(function (row) {
          return (
            "<tr>" +
            row
              .map(function (cell) {
                return "<td>" + _esc(cell) + "</td>";
              })
              .join("") +
            "</tr>"
          );
        })
        .join("");
      var heads = headers
        .map(function (h) {
          return "<th>" + _esc(h) + "</th>";
        })
        .join("");
      var safeTitle = _esc(title || "تقرير");
      var safeSubtitle = subtitle ? _esc(subtitle) : "";
      var html = [
        "<!DOCTYPE html><html dir='rtl' lang='ar'>",
        "<head><meta charset='UTF-8'>",
        "<title>" + safeTitle + "</title>",
        "<style>",
        "  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:12px;margin:20px;color:#1e293b;direction:rtl}",
        "  h1{font-size:18px;margin:0 0 4px;color:#0f172a}",
        "  p.sub{color:#64748b;font-size:11px;margin:0 0 16px}",
        "  table{width:100%;border-collapse:collapse;margin-top:8px}",
        "  th{background:#1e40af;color:#fff;padding:8px 10px;text-align:right;font-size:11px}",
        "  td{padding:6px 10px;border-bottom:1px solid #e2e8f0;font-size:11px}",
        "  tr:nth-child(even) td{background:#f8fafc}",
        "  .footer{margin-top:16px;font-size:10px;color:#94a3b8;text-align:center}",
        "  @media print{button{display:none!important}}",
        "</style></head><body>",
        "<h1>" + safeTitle + "</h1>",
        safeSubtitle ? "<p class='sub'>" + safeSubtitle + "</p>" : "",
        "<table><thead><tr>" +
          heads +
          "</tr></thead><tbody>" +
          rows +
          "</tbody></table>",
        "<div class='footer'>تاريخ الطباعة: " +
          new Date().toLocaleString("en-US") +
          " — MOO.ERP</div>",
        "<button onclick='window.print()' style='margin-top:14px;padding:8px 20px;background:#1e40af;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px'>🖨️ طباعة</button>",
        "</body></html>",
      ].join("");
      var w = window.open("", "_blank");
      if (!w) {
        typeof showToast === "function" &&
          showToast("فعّل النوافذ المنبثقة", "warning");
        return;
      }
      w.document.write(html);
      w.document.close();
      w.focus();
      // [AUDIO-EXPAND] لا يوجد showToast نجاح لعملية الطباعة، فنشغّل الصوت مباشرة
      if (typeof AS !== "undefined") {
        try {
          AS.print();
        } catch (e) {}
      }
      setTimeout(function () {
        w.print();
      }, 600);
    },

    _download: function (blob, filename) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    },

    /**
     * ينشئ زر تصدير Dropdown (Excel / CSV / طباعة)
     * @param {Object} opts
     *   opts.getData    — function() ترجع { headers:[], rows:[[]] }
     *   opts.filename   — اسم الملف بدون امتداد
     *   opts.title      — عنوان طباعة
     *   opts.subtitle   — تفاصيل طباعة
     *   opts.label      — نص الزر (default: "تصدير")
     *   opts.btnClass   — CSS classes إضافية للزر
     */
    createDropdown: function (opts) {
      var uid = "xdd" + Math.random().toString(36).slice(2, 7);
      var label = opts.label || "تصدير";
      var wrapper = document.createElement("div");
      wrapper.style.cssText = "position:relative;display:inline-block";
      wrapper.innerHTML =
        '<button id="' +
        uid +
        '" class="btn btn-outline btn-sm ' +
        (opts.btnClass || "") +
        '" ' +
        'style="display:flex;align-items:center;gap:6px">' +
        '  <i class="ti ti-download" style="font-size:14px"></i>' +
        label +
        '  <i class="ti ti-chevron-down" style="font-size:11px;margin-right:2px"></i>' +
        "</button>" +
        '<div id="' +
        uid +
        '-menu" style="display:none;position:absolute;top:calc(100% + 4px);' +
        "left:0;min-width:168px;background:var(--surface);border:1px solid var(--border);" +
        'border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:9999;overflow:hidden;padding:4px 0">' +
        '  <button data-fmt="excel" class="_xdd-item">' +
        '    <i class="ti ti-file-spreadsheet" style="color:#10b981"></i> Excel (.xlsx)</button>' +
        '  <button data-fmt="csv" class="_xdd-item">' +
        '    <i class="ti ti-file-text" style="color:#3b82f6"></i> CSV (.csv)</button>' +
        '  <div style="height:1px;background:var(--border);margin:3px 10px"></div>' +
        '  <button data-fmt="print" class="_xdd-item">' +
        '    <i class="ti ti-printer" style="color:#8b5cf6"></i> طباعة / PDF</button>' +
        "</div>";

      var itemStyle =
        "width:100%;text-align:right;padding:9px 14px;background:none;border:none;" +
        "cursor:pointer;font-size:13px;color:var(--text1);display:flex;align-items:center;gap:8px;";
      wrapper.querySelectorAll("._xdd-item").forEach(function (b) {
        b.style.cssText = itemStyle;
        b.addEventListener("mouseenter", function () {
          b.style.background = "var(--surface2)";
        });
        b.addEventListener("mouseleave", function () {
          b.style.background = "none";
        });
      });

      var btn = wrapper.querySelector("#" + uid);
      var menu = wrapper.querySelector("#" + uid + "-menu");

      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var isOpen = menu.style.display === "block";
        document.querySelectorAll("[data-xdd-open]").forEach(function (m) {
          m.style.display = "none";
          m.removeAttribute("data-xdd-open");
        });
        if (!isOpen) {
          menu.style.display = "block";
          menu.setAttribute("data-xdd-open", "1");
        }
      });

      menu.addEventListener("click", function (e) {
        var b = e.target.closest("[data-fmt]");
        if (!b) return;
        menu.style.display = "none";
        menu.removeAttribute("data-xdd-open");
        var fmt = b.dataset.fmt;
        try {
          var d = opts.getData();
          if (!d || !d.rows || !d.rows.length) {
            typeof showToast === "function" &&
              showToast("لا توجد بيانات للتصدير", "warning");
            return;
          }
          if (fmt === "excel")
            ExportUtil.toExcel(
              d.rows,
              d.headers,
              opts.filename,
              opts.sheetName,
            );
          else if (fmt === "csv")
            ExportUtil.toCSV(d.rows, d.headers, opts.filename);
          else if (fmt === "print")
            ExportUtil.toPrint(d.rows, d.headers, opts.title, opts.subtitle);
        } catch (err) {
          typeof showToast === "function" &&
            showToast("خطأ في التصدير: " + err.message, "error");
        }
      });

      document.addEventListener("click", function () {
        if (menu.style.display === "block") {
          menu.style.display = "none";
          menu.removeAttribute("data-xdd-open");
        }
      });

      return wrapper;
    },
  };
</script>

<!--
══════════════════════════════════════════════════════════════
 📋  DEVELOPER RULES — قواعد المطوّر (لا يجوز كسرها)
══════════════════════════════════════════════════════════════

RULE 1 — ممنوع استدعاء google.script.run مباشرة من أي شاشة
   ✅ صح:  _gsr("getFn", params, { onSuccess:..., onError:... })
   ✅ صح:  DL.Accounting.getJournalEntries({}, { onSuccess:..., onError:... })
   ❌ غلط: google.script.run.withSuccessHandler(...).getFn(params)

RULE 2 — كل استدعاء backend لازم يكون فيه onError
   ✅ صح:  _gsr("fn", p, { onSuccess: fn, onError: fn })
   ❌ غلط: _gsr("fn", p, { onSuccess: fn })  ← بيطلع console.warn تلقائي
                                                لكن الـ UI ممكن يفضل loading

RULE 3 — ممنوع parsing أو mapping داخل الـ UI/Template
   ✅ صح:  الـ parsing في onSuccess callback (في ملف الموديول)
   ❌ غلط: innerHTML داخل withSuccessHandler مباشرة مع منطق معقد

RULE 4 — كل شاشة بيانات لازم تعرض loading / error / empty
   ✅ استخدم DataModule.create({ containerId, onRender })
   أو اعمل حالات واضحة يدوياً (startLoading / stopLoading / showError)

RULE 5 — أي endpoint جديد يُضاف في Repository المناسب أولاً
   ثم يُستدعى من الشاشة عبر DL.ModuleName.method()

RULE 6 — ممنوع res.success=false يُترك بدون UI feedback
   لازم: showToast(msg, "error")  أو  applyError(msg)

══════════════════════════════════════════════════════════════
-->
 <script>
  // ══════════════════════════════════════════════════════════════════════════
  // 00b_JS_SaveEngine.html — محرك الحفظ الموحّد لكل شاشات MOO.ERP
  // ──────────────────────────────────────────────────────────────────────────
  // الهدف: كل عملية Create / Update / Duplicate / Import / Save Settings
  //        في أي موديول (مبيعات، مشتريات، مخازن، محاسبة، بنوك، HR، CRM،
  //        إعدادات، تقارير، مستخدمين، صلاحيات، Dashboard) تمر من هنا فقط.
  //
  // لا يوجد أي شاشة لها منطق حفظ خاص بها بعد اليوم — راجع §SE-9 "قواعد المطوّر"
  // في آخر الملف.
  //
  // [DL-UNIFY] هذا المحرك لا يستدعي google.script.run مباشرة إطلاقًا — الاستدعاء
  // الفعلي يمر عبر _gsr() المُعرَّفة في 00_JS_DataLayer.html (نفس نقطة الدخول
  // الموحّدة المستخدمة في كل قراءات/كتابات النظام). قبل هذا التوحيد كان عندنا
  // طبقتين متوازيتين بنفس الفلسفة (SaveEngine لواجهة الحفظ + DataLayer لطلبات
  // الباك-إند) بدون أي تكامل بينهما — الآن SaveEngine طبقة UI فقط (validation +
  // spinner + toast + dirty-tracking) فوق _gsr، ومفيش أي منطق retry/timeout
  // مكرر. يجب تحميل 31_JS_DataLayer.html قبل هذا الملف مباشرة في Index.html.
  //
  // المحتوى:
  //   §SE-1  الثوابت الموحّدة (حالات + نصوص)
  //   §SE-2  Logger            — تسجيل كل عملية حفظ
  //   §SE-3  ValidationService — تحقق موحّد + تظليل الحقول
  //   §SE-4  LoadingService    — طبقة الحفظ الناعمة (Soft Save)
  //   §SE-5  NotificationService — واجهة موحّدة فوق showToast الموجودة
  //   §SE-6  SaveButtonController — إدارة حالة الزر (spinner / disable / dirty)
  //   §SE-7  DirtyTracker      — كشف التغييرات (Dirty State)
  //   §SE-8  SaveEngine.run()  — المنسّق الرئيسي لكامل الـ workflow (فوق _gsr)
  //   §SE-9  قواعد المطوّر (لا يجوز كسرها)
  // ══════════════════════════════════════════════════════════════════════════

  // ─────────────────────────────────────────────────────────────
  // §SE-1  SAVE_STATES + رسائل موحّدة — ممنوع اختراع نصوص جديدة في أي شاشة
  // ─────────────────────────────────────────────────────────────
  var SAVE_STATES = {
    IDLE: "idle",
    VALIDATING: "validating",
    SAVING: "saving",
    SUCCESS: "success",
    FAILED: "failed",
    RETRY: "retry",
    CANCELLED: "cancelled",
    TIMEOUT: "timeout",
  };

  /** النصوص الموحّدة — يُمنع أي شاشة تكتب "جاري التحديث/المعالجة/الإرسال..." بدلها */
  var SAVE_MESSAGES = {
    SAVING: "⏳ جاري الحفظ...",
    UPDATING: "جار التحديث...", // ← [SOFT-SAVE] مرحلة ما بعد النجاح أثناء تحديث الشاشة/المزامنة
    SAVED: " تم الحفظ بنجاح",
    FAILED: " فشل الحفظ",
    RETRYING: " إعادة المحاولة...",
    VALIDATION_FAILED: " برجاء مراجعة البيانات المدخلة",
    CONNECTION_LOST: " انقطع الاتصال بالخادم",
    TIMEOUT: "⌛ استغرقت العملية وقتاً طويلاً، حاول مرة أخرى",
    NOTHING_TO_SAVE: "لا يوجد تغييرات لحفظها",
  };

  // ─────────────────────────────────────────────────────────────
  // §SE-2  Logger — سجل مركزي لكل عمليات الحفظ في النظام
  // يُخزَّن في الذاكرة (آخر 200 عملية) + console، ويمكن ربطه بالـ backend
  // لاحقاً عبر SaveEngineConfig.remoteLog
  // ─────────────────────────────────────────────────────────────
  var SaveLogger = (function () {
    var _buffer = [];
    var MAX = 200;

    function _push(entry) {
      _buffer.push(entry);
      if (_buffer.length > MAX) _buffer.shift();
      var tag = "[SaveEngine:" + entry.phase + "]";
      if (entry.phase === "error") console.error(tag, entry);
      else console.log(tag, entry);
    }

    return {
      start: function (ctx) {
        ctx._startedAt = Date.now();
        _push({
          phase: "start",
          entity: ctx.entity,
          screen: ctx.screen,
          recordId: ctx.recordId || null,
          user: (typeof SESSION !== "undefined" && SESSION.user) || null,
          at: new Date().toISOString(),
        });
      },
      end: function (ctx, success, message) {
        var duration = Date.now() - (ctx._startedAt || Date.now());
        _push({
          phase: success ? "end" : "error",
          entity: ctx.entity,
          screen: ctx.screen,
          recordId: ctx.recordId || null,
          success: success,
          message: message || "",
          durationMs: duration,
          retries: ctx._retries || 0,
          at: new Date().toISOString(),
        });
        return duration;
      },
      retry: function (ctx, attempt) {
        ctx._retries = attempt;
        _push({
          phase: "retry",
          entity: ctx.entity,
          screen: ctx.screen,
          attempt: attempt,
          at: new Date().toISOString(),
        });
      },
      dump: function () {
        return _buffer.slice();
      },
    };
  })();

  // ─────────────────────────────────────────────────────────────
  // §SE-3  ValidationService — تحقق موحّد
  //
  // rules: [{ field: "sinv-party", label: "اسم العميل", required: true },
  //         { field: "sinv-date",  label: "تاريخ الفاتورة", required: true },
  //         { test: function(){ return lines.length>0; }, message: "أضف بنوداً" }]
  // ─────────────────────────────────────────────────────────────
  var ValidationService = {
    /**
     * @returns {{valid:boolean, firstInvalidEl:?HTMLElement, message:?string}}
     */
    validate: function (rules) {
      rules = rules || [];
      this.clearHighlights(rules);
      for (var i = 0; i < rules.length; i++) {
        var r = rules[i];
        var ok;
        var el = r.field ? document.getElementById(r.field) : null;

        if (typeof r.test === "function") {
          ok = !!r.test();
        } else if (el) {
          var val = (el.value || "").toString().trim();
          ok = r.required ? val.length > 0 : true;
          if (ok && r.pattern) ok = r.pattern.test(val);
          if (ok && typeof r.validate === "function") ok = !!r.validate(val);
        } else {
          ok = true; // الحقل غير موجود في الصفحة الحالية — تجاهل
        }

        if (!ok) {
          var msg = r.message || "برجاء إدخال " + (r.label || "بيانات صحيحة");
          if (el) {
            el.classList.add("field-invalid");
            el.style.outline = "2px solid #ef4444";
            el.style.outlineOffset = "1px";
          }
          return { valid: false, firstInvalidEl: el, message: msg };
        }
      }
      return { valid: true, firstInvalidEl: null, message: null };
    },

    clearHighlights: function (rules) {
      (rules || []).forEach(function (r) {
        if (!r.field) return;
        var el = document.getElementById(r.field);
        if (el) {
          el.classList.remove("field-invalid");
          el.style.outline = "";
          el.style.outlineOffset = "";
        }
      });
    },

    focusFirstInvalid: function (el) {
      if (!el) return;
      try {
        el.focus();
        el.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (e) {}
    },
  };

  // ─────────────────────────────────────────────────────────────
  // §SE-4  LoadingService — Soft Save طبقة موحّدة
  //
  // لا تُجمّد الصفحة أبداً (لا overlay كامل الشاشة يمنع scroll) — تستخدم
  // محرك التحميل الموحّد الوحيد على مستوى السيستم: showSaveAnim/_closeSaveAnim
  // (معرّف في 01_JS_Core_Auth.html §F). _freezeUI/_unfreezeUI (02_JS_UI_Shell)
  // بقيا alias فوق نفس المحرك، فمفيش نظامين متوازيين تاني.
  // ─────────────────────────────────────────────────────────────
  var LoadingService = {
    show: function (message) {
      if (typeof showSaveAnim === "function") {
        showSaveAnim({ title: message || SAVE_MESSAGES.SAVING });
      } else if (typeof _freezeUI === "function") {
        _freezeUI(message || SAVE_MESSAGES.SAVING);
      } else if (typeof showLoading === "function") {
        showLoading(message || SAVE_MESSAGES.SAVING);
      }
      // ملاحظة: عمداً لا يوجد أي pointer-events:none على body — المستخدم
      // يقدر يكمل Scroll وقراءة باقي الشاشة أثناء الحفظ (Soft Save).
    },
    hide: function () {
      if (typeof _closeSaveAnim === "function") _closeSaveAnim(false);
      else if (typeof _unfreezeUI === "function") _unfreezeUI();
      else if (typeof hideLoading === "function") hideLoading();
    },
    // [SOFT-SAVE] مرحلة 2: يحوّل نفس الفقاعة من "جار الحفظ" لـ "جار التحديث"
    // بدون إغلاق/فتح جديد — تُستخدم بعد نجاح الحفظ مباشرة وأثناء تنفيذ
    // onSuccess/refresh (تحديث الكاش المحلي وإعادة رسم الشاشة).
    update: function (message) {
      if (typeof _saveAnimUpdating === "function") {
        _saveAnimUpdating(message || SAVE_MESSAGES.UPDATING);
      }
      // لو مفيش bubble متاحة (fallback _freezeUI/showLoading) سيبها كما هي؛
      // هتتقفل عادي في hide() الأخيرة بدون رسالة وسيطة.
    },
    // [SE-BUBBLE-FIX] success/fail: تكمّل نفس الفقاعة لحالة نجاح/فشل
    // بدل ما تتقفل (hide) وبعدين يظهر توست منفصل بعد فجوة زمنية فاضية.
    // نفس أسلوب showSaveAnim(...).done()/.fail() المستخدم في شاشة الأصناف.
    success: function (message, opts) {
      if (typeof _saveAnimSuccess === "function") {
        _saveAnimSuccess(message || SAVE_MESSAGES.SAVED);
        // [UNIFY-NOTIF] حتى مع فقاعة "الحفظ الناعم" (نظام مختلف بصريًا عن
        // توست الـ FAB)، لو الشاشة مررت page/perm نسجّل الحدث في
        // NotificationEngine كمان عشان يظهر في مركز الإشعارات (الجرس)
        // ويكون قابل للفتح لاحقًا — حتى لو مش هو مصدر الفقاعة المعروضة دلوقتي.
        if (opts && opts.page && typeof NotificationEngine !== "undefined") {
          NotificationEngine.save(
            message || SAVE_MESSAGES.SAVED,
            Object.assign({ silent: true }, opts),
          );
        }
      } else {
        this.hide();
        NotificationService.success(message, opts);
      }
    },
    fail: function (message) {
      if (typeof _saveAnimFail === "function") {
        _saveAnimFail(message || SAVE_MESSAGES.FAILED);
      } else {
        this.hide();
        NotificationService.error(message);
      }
    },
  };

  // ─────────────────────────────────────────────────────────────
  // §SE-5  NotificationService — واجهة موحّدة فوق showToast
  // نفس الأسلوب في كل الشاشات: نجاح / تحذير / خطأ / معلومة
  // ─────────────────────────────────────────────────────────────
  var NotificationService = {
    success: function (msg, opts) {
      this._emit(msg || SAVE_MESSAGES.SAVED, "success", opts);
    },
    warning: function (msg, opts) {
      this._emit(msg, "warning", opts);
    },
    error: function (msg, opts) {
      this._emit(msg || SAVE_MESSAGES.FAILED, "error", opts);
    },
    info: function (msg, opts) {
      this._emit(msg, "info", opts);
    },
    _emit: function (msg, type, opts) {
      // [UNIFY-NOTIF] NotificationEngine هو المستوى الأول الآن — نفس سلسلة
      // fallback القديمة (showToast ثم console.log) فضلت زي ما هي لو
      // NotificationEngine مش محمّل بعد (ترتيب تحميل الملفات).
      if (typeof NotificationEngine !== "undefined") NotificationEngine[type](msg, opts);
      else if (typeof showToast === "function") showToast(msg, type);
      else console.log("[Notify:" + type + "] " + msg);
    },
  };

  // ─────────────────────────────────────────────────────────────
  // §SE-6  SaveButtonController — سلوك زر الحفظ موحّد في كل الشاشات
  //
  // usage:
  //   var ctrl = SaveButtonController.attach("sinv-save-btn");
  //   ctrl.setSaving();     // spinner + disable + منع double-click
  //   ctrl.restore();       // إعادة الحالة الأصلية (نجاح أو فشل)
  // ─────────────────────────────────────────────────────────────
  var SaveButtonController = {
    attach: function (buttonId) {
      return this._build(document.getElementById(buttonId));
    },

    /** نفس attach لكن بتاخد عنصر DOM جاهز بدل الـ id — لشاشات فيها الزر متغيّر محلي (var saveBtn = ...) */
    attachEl: function (btnEl) {
      return this._build(btnEl);
    },

    _build: function (btn) {
      var originalHtml = btn ? btn.innerHTML : "";
      var busy = false;

      return {
        isBusy: function () {
          return busy;
        },
        setSaving: function (label) {
          if (!btn || busy) return false; // يمنع الـ double-click فعلياً
          busy = true;
          originalHtml = btn.innerHTML;
          btn.disabled = true;
          btn.setAttribute("aria-busy", "true");
          btn.innerHTML =
            '<i class="ti ti-loader-2" style="animation:spin 0.8s linear infinite"></i> ' +
            "<span>" +
            (label || SAVE_MESSAGES.SAVING) +
            "</span>";
          return true;
        },
        restore: function () {
          if (!btn) {
            busy = false;
            return;
          }
          btn.disabled = false;
          btn.removeAttribute("aria-busy");
          btn.innerHTML = originalHtml;
          busy = false;
        },
        disableIfClean: function (isDirty) {
          // زرار الحفظ يتعطّل تلقائياً لو مفيش تغييرات (Dirty State)
          if (btn) btn.disabled = !isDirty;
        },
      };
    },
  };

  // ─────────────────────────────────────────────────────────────
  // §SE-7  DirtyTracker — كشف التغييرات + تحذير عند الخروج بدون حفظ
  //
  // usage:
  //   var dt = DirtyTracker.create("sinv-form-wrapper", saveBtnCtrl);
  //   ... عند أي تعديل ...    dt.markDirty();
  //   بعد نجاح الحفظ ...      dt.markClean();
  // ─────────────────────────────────────────────────────────────
  var DirtyTracker = {
    _anyDirty: false,

    create: function (containerSelectorOrId, buttonCtrl) {
      var self = this;
      var dirty = false;
      var container = containerSelectorOrId
        ? document.getElementById(containerSelectorOrId) ||
          document.querySelector(containerSelectorOrId)
        : null;

      function mark(state) {
        dirty = state;
        self._anyDirty = state;
        if (buttonCtrl) buttonCtrl.disableIfClean(dirty);
      }

      if (container) {
        container.addEventListener("input", function () {
          mark(true);
        });
        container.addEventListener("change", function () {
          mark(true);
        });
      }

      return {
        isDirty: function () {
          return dirty;
        },
        markDirty: function () {
          mark(true);
        },
        markClean: function () {
          mark(false);
        },
      };
    },
  };

  // تحذير موحّد عند مغادرة الصفحة ولسه فيه تعديلات لم تُحفظ
  window.addEventListener("beforeunload", function (e) {
    if (DirtyTracker._anyDirty) {
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  });

  // ─────────────────────────────────────────────────────────────
  // §SE-8  SaveEngine.run() — المنسّق الرئيسي (النقطة الوحيدة للحفظ)
  //
  // usage:
  //   SaveEngine.run({
  //     screen:   "SaleInvoice",          // اسم الشاشة (للـ logging)
  //     entity:   "sale_invoice",         // اسم الكيان
  //     recordId: null,                   // موجود لو تعديل
  //     buttonId: "sinv-save-btn",        // اختياري
  //     rules:    [ {field:"sinv-party", required:true, label:"اسم العميل"} ],
  //     dirtyTracker: dt,                 // اختياري — DirtyTracker instance
  //     collect:  function(){ return _collectInvoiceData("sinv"); },
  //     fn:       "addSaleInvoice",       // اسم دالة الـ backend
  //     params:   function(data){ return [data, SESSION.token]; },
  //     timeout:  25000,
  //     retries:  0,                      // عدد محاولات إعادة الإرسال التلقائية عند فشل الاتصال
  //     successMessage: "تم حفظ فاتورة البيع بنجاح",
  //     onSuccess: function(res, data){ ... },   // منطق العمل بعد النجاح
  //     onError:   function(res){ ... },         // اختياري — منطق إضافي عند الفشل
  //     closeDialogId: null,              // اختياري — يُغلق تلقائياً عند النجاح
  //     refresh:   function(){ renderPage(APP.currentPage); } // تحديث البيانات المتأثرة فقط
  //   });
  // ─────────────────────────────────────────────────────────────
  var SaveEngine = {
    run: function (cfg) {
      cfg = cfg || {};
      var ctx = {
        screen: cfg.screen || "UnknownScreen",
        entity: cfg.entity || "unknown",
        recordId: cfg.recordId || null,
        state: SAVE_STATES.IDLE,
        _retries: 0,
      };

      var btnCtrl = cfg.buttonId
        ? SaveButtonController.attach(cfg.buttonId)
        : null;

      // 1) منع الحفظ لو الزرار مشغول فعلاً (منع الضغط المزدوج)
      if (btnCtrl && btnCtrl.isBusy()) return;

      // 2) لو فيه Dirty Tracker ومفيش أي تغيير حقيقي → لا داعي لطلب سيرفر
      if (
        cfg.dirtyTracker &&
        cfg.dirtyTracker.isDirty &&
        !cfg.dirtyTracker.isDirty() &&
        !cfg.forceSave
      ) {
        NotificationService.info(SAVE_MESSAGES.NOTHING_TO_SAVE);
        return;
      }

      // 3) التحقق (Validation)
      ctx.state = SAVE_STATES.VALIDATING;
      if (cfg.rules && cfg.rules.length) {
        var result = ValidationService.validate(cfg.rules);
        if (!result.valid) {
          ctx.state = SAVE_STATES.FAILED;
          NotificationService.error(
            result.message || SAVE_MESSAGES.VALIDATION_FAILED,
          );
          ValidationService.focusFirstInvalid(result.firstInvalidEl);
          return;
        }
      }

      // 4) تجميع البيانات
      var data;
      try {
        data = typeof cfg.collect === "function" ? cfg.collect() : cfg.data;
      } catch (e) {
        NotificationService.error("خطأ في تجهيز البيانات: " + e.message);
        return;
      }

      // 5) قفل الزر + منع الضغط المزدوج + عرض السبينر
      if (btnCtrl) btnCtrl.setSaving(cfg.savingLabel);

      // 5-ب) [SOFT-SAVE] إغلاق الشاشة (Drawer/Modal) فورًا — قبل استدعاء
      // السيرفر أصلاً — نفس أسلوب "الحفظ الناعم" المستخدم بالفعل في شاشات
      // الأصناف/المجموعات/المخازن (closeModal()/closeStyledDrawer() قبل
      // _gsr مباشرة). التحقق (rules) عدّى فعلاً في الخطوة 3، فمفيش داعي
      // نستنى رد السيرفر عشان نقفل — لو فشل الحفظ هيظهر Toast بالخطأ
      // برضه ولسه المستخدم يقدر يعيد المحاولة من زر "إضافة/تعديل" تاني.
      // الطريقة المفضّلة: تمرير closeFn (دالة إغلاق الشاشة الفعلية).
      // للتوافق مع كود قديم فيه closeDialogId، بنقفلها هنا بنفس التوقيت.
      if (typeof cfg.closeFn === "function") {
        try {
          cfg.closeFn();
        } catch (e) {
          console.warn("SaveEngine: فشل استدعاء closeFn:", e.message || e);
        }
      } else if (cfg.closeDialogId) {
        var _dlg0 = document.getElementById(cfg.closeDialogId);
        if (_dlg0 && typeof closeDrawer === "function")
          closeDrawer(cfg.closeDialogId);
        else if (_dlg0) _dlg0.style.display = "none";
      }

      // 6) عرض طبقة الحفظ الناعمة (لا تجمّد الشاشة) — مرحلة 1: "جار الحفظ"
      LoadingService.show(cfg.savingLabel || SAVE_MESSAGES.SAVING);

      // [SESSION-LIFECYCLE] تسجيل عملية حفظ جارية — يستخدمها محرك دورة
      // حياة الجلسة (SessionLifecycle) عشان يستنى العمليات الحرجة قبل ما
      // ينفّذ إنهاء جلسة منظّم بدل ما يقطعها فجأة.
      var _slOpId =
        typeof SessionLifecycle !== "undefined"
          ? SessionLifecycle.registerBusyOp("save:" + ctx.screen)
          : null;

      ctx.state = SAVE_STATES.SAVING;
      SaveLogger.start(ctx);

      var maxRetries = cfg.retries || 0;
      var timeoutMs = cfg.timeout != null ? cfg.timeout : 25000;

      function finish(success, res) {
        if (_slOpId && typeof SessionLifecycle !== "undefined")
          SessionLifecycle.unregisterBusyOp(_slOpId);
        if (btnCtrl) btnCtrl.restore();

        if (success) {
          ctx.state = SAVE_STATES.SUCCESS;
          SaveLogger.end(ctx, true, "OK");
          if (cfg.dirtyTracker && cfg.dirtyTracker.markClean)
            cfg.dirtyTracker.markClean();

          // [SOFT-SAVE] مرحلة 2: "جار الحفظ..." نجحت — نحوّل نفس الفقاعة
          // لـ "جار التحديث..." أثناء تنفيذ onSuccess/refresh (تحديث الكاش
          // المحلي وإعادة رسم الشاشة) بدل ما الفقاعة تختفي فجأة بلا تفسير.
          // الشاشة نفسها اتقفلت بالفعل قبل نداء السيرفر (خطوة 5-ب فوق).
          LoadingService.update(cfg.updatingLabel || SAVE_MESSAGES.UPDATING);

          // [DL-UNIFY] journal_warning (لو موجودة يومًا) قد تصل الآن إما على
          // مستوى الاستجابة الأصلية (نادر) أو داخل res.data بعد تطبيع _gsr
          var journalWarning =
            (res && res.journal_warning) ||
            (res && res.data && res.data.journal_warning);

          if (typeof cfg.onSuccess === "function") cfg.onSuccess(res, data);

          // توافق قديم: closeDialogId — نادرًا هيلاقي حاجة يقفلها هنا لأن
          // الإغلاق الفعلي بقى بيحصل بدري (خطوة 5-ب) قبل نداء السيرفر أصلاً.
          if (cfg.closeDialogId) {
            var dlg = document.getElementById(cfg.closeDialogId);
            if (dlg && typeof closeDrawer === "function")
              closeDrawer(cfg.closeDialogId);
            else if (dlg) dlg.style.display = "none";
          }

          if (typeof cfg.refresh === "function") cfg.refresh();

          // مرحلة 3: [SE-BUBBLE-FIX] بدل قفل الفقاعة ثم إظهار توست منفصل
          // بعد فجوة زمنية فاضية — نكمّل نفس الفقاعة لحالة "تم الحفظ "
          // (نفس أسلوب شاشة الأصناف: showSaveAnim(...).done(msg)) وهي
          // بتتقفل نفسها بعد ثانيتين. الاستثناء الوحيد: journal_warning،
          // حالة نادرة بتحتاج توست تحذير منفصل يفضل ظاهر بعد قفل الفقاعة.
          if (journalWarning) {
            LoadingService.hide();
            NotificationService.warning(journalWarning);
          } else {
            // [UNIFY-NOTIF] لو الشاشة حددت notifyPage (صفحة الوجهة) —
            // بيتسجّل الحدث في مركز الإشعارات الموحّد بصلاحية notifyPerm
            // الاختيارية، فيبقى قابل للفتح لاحقًا من الجرس/تبويب المساعد
            LoadingService.success(
              cfg.successMessage || SAVE_MESSAGES.SAVED,
              cfg.notifyPage ? { page: cfg.notifyPage, perm: cfg.notifyPerm || null } : null,
            );
          }
        } else {
          ctx.state = SAVE_STATES.FAILED;
          var message = (res && res.message) || SAVE_MESSAGES.FAILED;
          SaveLogger.end(ctx, false, message);
          // [SE-BUBBLE-FIX] نفس المنطق: نكمّل الفقاعة لحالة " فشل" بدل
          // قفلها وإظهار توست خطأ منفصل بعد فجوة فاضية.
          LoadingService.fail(message);
          if (typeof cfg.onError === "function") cfg.onError(res, data);
          // ملاحظة: الشاشة كانت اتقفلت بالفعل قبل الإرسال (Soft Save) — لو
          // الشاشة محتاجة تفتح تاني عند الفشل، تقدر تعمل كده جوه onError.
        }
      }

      // [DL-UNIFY] SaveEngine لم يعد يعمل google.script.run مباشرة — بيمر
      // إلزاميًا عبر _gsr() (00_JS_DataLayer.html)، نفس نقطة الدخول الموحّدة
      // المستخدمة في كل قراءات/كتابات النظام. كده الـ retry/timeout/تطبيع
      // الاستجابة/معالجة انتهاء الجلسة كلها منطق واحد مش نسختين متوازيتين.
      function attempt(attemptNo) {
        var params =
          typeof cfg.params === "function"
            ? cfg.params(data)
            : cfg.params || [data];

        if (typeof _gsr !== "function") {
          finish(false, {
            message:
              "طبقة DataLayer (_gsr) غير متاحة — تأكد من تحميل 00_JS_DataLayer.html",
          });
          return;
        }

        _gsr(cfg.fn, params, {
          timeout: timeoutMs,
          label: cfg.screen || cfg.fn,
          rawResponse: cfg.rawResponse,
          onSuccess: function (result) {
            finish(true, result);
          },
          onError: function (result) {
            // جلسة غير صالحة/منتهية: _gsr نفسها بالفعل نادت _handleSessionExpired
            // — هنا فقط نُنهي الـ workflow المحلي (spinner/logger) بدون أي retry.
            if (
              typeof _isSessionErrorResponse === "function" &&
              _isSessionErrorResponse(result)
            ) {
              finish(false, result);
              return;
            }

            var msg = (result && result.message) || "";
            var isTransient =
              msg.indexOf("انتهت المهلة") !== -1 ||
              msg.indexOf("خطأ في الاتصال") !== -1;

            if (
              attemptNo < maxRetries &&
              (isTransient || cfg.retryOnLogicalFailure)
            ) {
              SaveLogger.retry(ctx, attemptNo + 1);
              NotificationService.info(SAVE_MESSAGES.RETRYING);
              attempt(attemptNo + 1);
            } else {
              if (isTransient) ctx.state = SAVE_STATES.TIMEOUT;
              finish(false, result);
            }
          },
        });
      }

      attempt(0);

      // إتاحة الإلغاء (Cancellation) لو الشاشة محتاجة توقف الانتظار
      return {
        cancel: function () {
          ctx.state = SAVE_STATES.CANCELLED;
          LoadingService.hide();
          if (btnCtrl) btnCtrl.restore();
          SaveLogger.end(ctx, false, "Cancelled by user");
        },
      };
    },
  };
</script>

<!--
══════════════════════════════════════════════════════════════
   §SE-9 DEVELOPER RULES — قواعد محرك الحفظ (لا يجوز كسرها)
══════════════════════════════════════════════════════════════

RULE 1 — ممنوع أي شاشة تعمل save workflow يدوي (spinner يدوي + google.script.run مباشر)
    صح: SaveEngine.run({ screen, entity, fn:"addX", collect, rules, ... })
    غلط: btn.disabled=true; google.script.run.withSuccessHandler(...).addX(...)

RULE 2 — كل نصوص الحالة تُؤخذ من SAVE_MESSAGES فقط
    SAVE_MESSAGES.SAVING ("⏳ جاري الحفظ...")
    ممنوع اختراع "جاري التحديث..." أو "Processing..." أو "برجاء الانتظار..."
   (استثناء وحيد: عملية مختلفة فعلاً عن الحفظ، مثال: "جاري الطباعة...")

RULE 3 — كل تحقق (Validation) قبل الحفظ يمر عبر ValidationService / rules[]
   لا تحقق مبعثر بـ if/else متفرق داخل دالة الحفظ نفسها.

RULE 4 — أي رسالة نجاح/خطأ تمر عبر NotificationService (والتي تستخدم showToast
   الموجودة فعلاً) — لا console.log فقط ولا innerHTML يدوي لعرض رسالة.

RULE 5 — الحفظ لازم يكون Soft Save دايماً: ممنوع أي overlay يمنع scroll
   أو pointer-events:none على <body> بالكامل أثناء الحفظ.

RULE 6 — أي زرار حفظ لازم يُدار عبر SaveButtonController (spinner موحّد،
   منع الضغط المزدوج تلقائي، استرجاع تلقائي للحالة الأصلية).

RULE 7 — أي شاشة فيها تعديل حي (فورم كبير) يجب أن تستخدم DirtyTracker
   بحيث زر الحفظ يكون معطّل تلقائياً لو مفيش تغيير فعلي.

RULE 8 — عند الفشل، البيانات المدخلة من المستخدم لا تُمسح أبداً — تبقى في
   الفورم بالكامل ليعيد المحاولة مباشرة (SaveEngine لا يفرّغ أي input).

RULE 9 — أي endpoint جديد للحفظ (Create/Update/Duplicate/Import/Settings)
   يُستدعى حصرياً عبر SaveEngine.run({ fn: "اسم دالة الباك-إند", ... })
   ولا يُستدعى مباشرة عبر google.script.run في أي ملف شاشة.

RULE 10 — [DL-UNIFY] ممنوع أي منطق retry/timeout/تطبيع استجابة يُكتب من جديد
   داخل أي شاشة أو داخل SaveEngine نفسه — كل ده مسؤولية _gsr() فقط
   (00_JS_DataLayer.html). SaveEngine طبقة UI فوق _gsr، مش بديل عنها.
   لو شاشة قديمة بتستخدم DL.Module.function() مباشرة (بدل SaveEngine.run)
   واللي بالفعل بتمر عبر _gsr، فده مقبول ولا يحتاج ترحيل إجباري لـ SaveEngine —
   المهم إنها ما تستخدمش google.script.run مباشرة، مش إنها بالضبط SaveEngine.run.

══════════════════════════════════════════════════════════════
-->

    // لكن المستويات 2/3/4 (اللي أغلب الشاشات فعليًا محتاجاها —

    // "كل شاشة بتبدأ من الصفر بعد Refresh" المذكور في المشكلة.
    // الحل: نفس مبدأ SWR بتاع مستوى 1 لكن للمستويات 2/3/4: نخزّن آخر

    // لسه Fresh (< STALE_MS) نعتبر المستوى "محمّل" فورًا (Instant Render،
    // بدون أي نداء شبكة) ثم نعمل مراجعة خلفية صامتة (revalidate) تحدّث
    // البيانات والكاش من غير ما توقف أو تعيد رسم أي حاجة قسرًا.
    // ─────────────────────────────────────────────────────────────
    var LS_PREFIX = "wms_ude_lvl_";
    var STALE_MS = 10 * 60 * 1000; // 10 دقائق: بعدها لسه بنعرض الكاش فورًا لكن بنراجع خلفيًا دايمًا

    function _owner() {
      return (typeof APP !== "undefined" && APP.currentUser && APP.currentUser.username) || "";
    }
    function _ownerMatches(saved) {
      try {
        var currentOwner = localStorage.getItem("wms_cache_owner") || "";
        return !!currentOwner && saved && saved.owner === currentOwner;
      } catch (e) {
        return false;
      }
    }
    function _lsSave(level, data) {
      try {
        localStorage.setItem(
          LS_PREFIX + level,
          JSON.stringify({ data: data, ts: Date.now(), owner: _owner() }),
        );
      } catch (e) {
        // القرص ممتلئ أو localStorage معطّل — نتجاهل بأمان، الكاش في
        // الذاكرة (APP.data + _loadedLevels) لسه شغّال طول الجلسة الحالية
      }
    }
    function _lsLoad(level) {
      try {
        var raw = localStorage.getItem(LS_PREFIX + level);
        if (!raw) return null;
        var saved = JSON.parse(raw);
        if (!saved || !_ownerMatches(saved)) return null;
        return saved;
      } catch (e) {
        return null;
      }
    }
    /** يحاول عرض نسخة محلية فورية لمستوى معيّن قبل أي نداء شبكة. */
    function _hydrateLevel(level) {
      if (_loadedLevels[level]) return true;
      var saved = _lsLoad(level);
      if (!saved || !saved.data) return false;
      if (APP && APP.data) Object.assign(APP.data, saved.data);
      _loadedLevels[level] = true;
      return true;
    }

    // خريطة اختيارية: صفحة → المستويات اللي فعليًا محتاجاها (تحسين أداء
    // اختياري بحت — صفحة غير مذكورة هنا تاخد الافتراضي [2, 3] تلقائيًا،
    // فمفيش أي شاشة ممكن "تتنسى" وتفضل عالقة بلا تعريف زي القديم).
    var PAGE_LEVELS = {
      dashboard: [],
      shortcuts: [],
      catalog: [2],
      items: [2],
      groups: [2],
      stock: [2],
      current_stock: [2],
      stocktake: [2],
      tx_in: [2],
      tx_out: [2],
      transfer: [2],
      tx_transfer: [2],
      transactions: [2],
    };
    var DEFAULT_LEVELS = [2, 3];

    function _levelsKey(levels) {
      return levels.slice().sort().join(",");
    }

    function _haveAllLevels(levels) {
      for (var i = 0; i < levels.length; i++) {
        if (!_loadedLevels[levels[i]]) return false;
      }
      return true;
    }

    function levelsForPage(page) {
      return PAGE_LEVELS.hasOwnProperty(page)
        ? PAGE_LEVELS[page]
        : DEFAULT_LEVELS;
    }

    // [SESSION-SAFE] بديل صريح عن الوصول المباشر لـ SESSION.token —
    // أي انتظار لازم يكون بانتظار حقيقي (retry بفاصل زمني قصير)، مش
    // استثناء غير متوقَّع يوقف السلسلة كلها بصمت (كان هذا نفسه السبب
    // الجذري اللي اكتشفناه سابقًا في DL.Core.getAllDataByLevel).
    function _authReady() {
      return !!(
        typeof SESSION !== "undefined" &&
        SESSION &&
        SESSION.token &&
        APP &&
        APP.currentUser
      );
    }

    // ---------- تنفيذ النداء الفعلي ----------
    function _fetchLevels(levels, attempt) {
      var key = _levelsKey(levels);
      if (_inFlight[key]) return; // Dedup: نداء لنفس المستويات شغال بالفعل
      if (!_authReady()) {
        // لسه مفيش جلسة/مستخدم — نعيد المحاولة بعد وقت قصير بدل ما
        // نرمي استثناء أو نلغي الطلب. هذا الفحص هنا (نقطة مركزية
        // واحدة) بيغلق باب فئة كاملة من الأخطاء الصامتة (نداء بيتنفذ
        // قبل ما SESSION/APP.currentUser يكونوا جاهزين).
        setTimeout(function () {
          _fetchLevels(levels, attempt);
        }, 200);
        return;
      }
      _inFlight[key] = true;
      DL.Core.getAllDataByLevel(levels, {
        label: "UDE.fetch(" + key + ")" + (attempt ? ".retry" : ""),
        // [TIMEOUT-BUMP-2026-08-08] كانت 30 ثانية — قليلة على نداء
        // getAllDataByLevel([2,3]) في بيئة /dev البطيئة (Cold Start +
        // بدون تحسينات نسخة /exec)، فكانت بتفشل بصمت وتدخل في retry
        // من غير داعي رغم إن النداء نفسه كان لسه شغال وهيرجع لو استنينا
        // شوية زيادة. مفيش تغيير في منطق الـ retry نفسه (لسه بيحصل
        // مرة واحدة تلقائيًا لو فعلاً فشل بعد المهلة الجديدة).
        timeout: 60000,
        onSuccess: function (result) {
          delete _inFlight[key];
          if (result && result.data && APP.data) {
            Object.assign(APP.data, result.data);
          }
          levels.forEach(function (lvl) {
            _loadedLevels[lvl] = true;
            // [PERF-UDE-LS-CACHE-2026-08-12] خزّن نسخة محلية لكل مستوى
            // على حدة (مش الحزمة كاملة) عشان Refresh القادم يقدر يعرض
            // فورًا حتى لو كان طلب سابق جاب مستويات مختلفة مع بعض.
            if (result && result.data) _lsSave(lvl, result.data);
          });
          _resolveSubscribers();
        },
        onError: function () {
          delete _inFlight[key];
          if (!attempt) {
            // محاولة واحدة إضافية تلقائية قبل ما نُبلّغ المشتركين
            // بالفشل — يغطي أعطال الشبكة العابرة اللي شفناها في
            // الكونسول (NetworkError مؤقت) من غير ما نزعج المستخدم.
            setTimeout(function () {
              _fetchLevels(levels, true);
            }, 1500);
            return;
          }
          _failSubscribers(levels);
        },
      });
    }

    function _resolveSubscribers() {
      var remaining = [];
      _subscribers.forEach(function (sub) {
        if (_haveAllLevels(sub.levels)) {
          try {
            sub.onReady();
          } catch (e) {
            console.error("[UDE] subscriber onReady error:", e);
          }
        } else {
          remaining.push(sub);
        }
      });
      _subscribers = remaining;
    }

    function _failSubscribers(failedLevels) {
      var failedKey = _levelsKey(failedLevels);
      var remaining = [];
      _subscribers.forEach(function (sub) {
        var subKey = _levelsKey(sub.levels);
        // نبلّغ بالفشل بس المشتركين اللي طلبهم يعتمد فعليًا على
        // المستويات اللي فشلت (مش كل حد مستني أي حاجة)
        var overlaps = sub.levels.some(function (l) {
          return failedLevels.indexOf(l) !== -1;
        });
        if (overlaps && !_haveAllLevels(sub.levels)) {
          if (typeof sub.onError === "function") {
            try {
              sub.onError();
            } catch (e) {}
          }
        } else if (!_haveAllLevels(sub.levels)) {
          remaining.push(sub);
        }
      });
      _subscribers = remaining;
    }

    // ---------- الواجهة العامة ----------
    /**
     * ensure(levels, { onReady, onError }) — تضمن وصول البيانات قبل
     * تنفيذ onReady. لو وصلت بالفعل، تُنفَّذ onReady() فورًا (مسار
     * متزامن، بدون أي تأخير مصطنع). لو لأ، تسجّل اشتراكًا حقيقيًا
     * يفضل قائمًا لحد نجاح أو فشل صريح — لا يوجد "انتهاء مهلة" يُسقط
     * الاشتراك من غير رد.
     */
    function ensure(levels, opts) {
      opts = opts || {};
      if (!levels || !levels.length) {
        if (typeof opts.onReady === "function") opts.onReady();
        return;
      }
      // [PERF-UDE-LS-CACHE-2026-08-12] قبل أي نداء شبكة: جرّب تعرض أي
      // مستوى مطلوب من نسخته المحلية المحفوظة (لو موجودة وبتاعة نفس
      // اليوزر) — هنا بالظبط بيحصل "Instant Render" بعد Refresh بدل
      // انتظار الشبكة، حتى لو الطلب الأصلي جه من نداء مختلف عن اللي
      // خزّن الكاش.
      levels.forEach(_hydrateLevel);
      if (_haveAllLevels(levels)) {
        if (typeof opts.onReady === "function") opts.onReady();
        // مراجعة خلفية صامتة (Stale-While-Revalidate) — بس لو فيه نسخة
        // فعليًا قديمة نسبيًا أو مفيش أي طلب شغال أصلاً لنفس المستويات
        _revalidateIfStale(levels);
        return;
      }
      _subscribers.push({
        levels: levels,
        onReady: opts.onReady || function () {},
        onError: opts.onError,
      });
      var missing = levels.filter(function (l) {
        return !_loadedLevels[l];
      });
      _fetchLevels(missing, false);
    }

    /** يعيد جلب مستوى في الخلفية بصمت لو نسخته المحلية أقدم من STALE_MS
     *  — لا يغيّر أي حالة "جاهز" ولا يوقف أي شاشة، فقط يحدّث البيانات
     *  والكاش المحلي لما يوصل الرد. */
    function _revalidateIfStale(levels) {
      var needsRevalidate = levels.some(function (l) {
        var saved = _lsLoad(l);
        return !saved || Date.now() - saved.ts > STALE_MS;
      });
      if (!needsRevalidate) return;
      var key = _levelsKey(levels);
      if (_inFlight[key]) return;
      if (!_authReady()) return;
      _inFlight[key] = true;
      DL.Core.getAllDataByLevel(levels, {
        label: "UDE.revalidate(" + key + ")",
        timeout: 60000,
        onSuccess: function (result) {
          delete _inFlight[key];
          if (result && result.data && APP.data) {
            Object.assign(APP.data, result.data);
          }
          levels.forEach(function (lvl) {
            _loadedLevels[lvl] = true;
            if (result && result.data) _lsSave(lvl, result.data);
          });
          _resolveSubscribers();
        },
        onError: function () {
          delete _inFlight[key];
          // فشل صامت — البيانات المعروضة (من الكاش) لسه صحيحة وقديمة
          // بس، مش فاضية؛ هنحاول تاني في المرة الجاية اللي المستخدم
          // يفتح فيها نفس الشاشة
        },
      });
    }

    /** ensurePage(page, opts) — نفس ensure لكن بمنطق "الصفحة" مباشرة. */
    function ensurePage(page, opts) {
      ensure(levelsForPage(page), opts);
    }

    /**
     * warmup() — تُستدعى مرة واحدة بعد نجاح تسجيل الدخول (أو استعادة
     * جلسة قديمة). بتجهّز مستوى ON_DEMAND (2) فورًا لأنه المستوى اللي
     * معظم الشاشات هتحتاجه أول ما تُفتح، ثم BACKGROUND (3) وREFERENCE
     * (4) في وقت فراغ المتصفح — نفس الترتيب المنطقي القديم، لكن بدون
     * أي setTimeout بتوقيت ثابت مخمَّن؛ الاعتماد فقط على requestIdleCallback
     * (أو fallback بسيط لو مش مدعوم).
     */
    var _warmedUp = false;
    function warmup() {
      if (_warmedUp) return;
      _warmedUp = true;
      // [PERF-UDE-LS-CACHE-2026-08-12] حاول تعرض النسخ المحلية فورًا؛
      // أي مستوى اتحمّل من localStorage بيتراجع خلفيًا لو قديم بدل ما
      // يتطلب من الصفر — أي مستوى لسه مفيش له نسخة محلية بيتطلب عادي.
      [2, 3, 4].forEach(_hydrateLevel);
      _revalidateIfStale([2]);
      var missing2 = _loadedLevels[2] ? [] : [2];
      if (missing2.length) _fetchLevels(missing2, false);
      var ric =
        (typeof requestIdleCallback === "function" && requestIdleCallback) ||
        function (fn) {
          setTimeout(fn, 60);
        };
      ric(function () {
        if (_loadedLevels[3]) _revalidateIfStale([3]);
        else _fetchLevels([3], false);
      });
      ric(function () {
        if (_loadedLevels[4]) _revalidateIfStale([4]);
        else _fetchLevels([4], false);
      });
    }

    /** حالة تشخيصية — تُستخدم في شاشة "دليل الأكواد"/الدعم الفني فقط */
    function debugState() {
      return {
        loadedLevels: Object.assign({}, _loadedLevels),
        inFlight: Object.keys(_inFlight),
        pendingSubscribers: _subscribers.length,
      };
    }

    return {
      ensure: ensure,
      ensurePage: ensurePage,
      levelsForPage: levelsForPage,
      warmup: warmup,
      haveAllLevels: _haveAllLevels,
      debugState: debugState,
    };
  })();
</script>


    <!-- [I18N] محرك تعدد اللغات على الفرونت-إند — يجب أن يُحمَّل قبل أي شاشة تستخدم I18N.t() -->
    <!-- يعتمد على _gsr() من 31_JS_DataLayer (مُحمَّل بالأعلى مباشرة) -->
    <script>

  // 38_JS_i18n_Client.html — محرك الترجمة على الفرونت-إند (MOO.ERP i18n)
  //
  // يعتمد على _gsr() الموجودة في 31_JS_DataLayer.html — لا يستدعي
  // google.script.run مباشرة (يلتزم بـ RULE 1 الموثّقة هناك).
  //
  // الاستخدام في أي شاشة:
  //   1) HTML:  <button data-i18n="BTN_SAVE"></button>
  //             <input data-i18n-placeholder="LBL_SEARCH_PLACEHOLDER">
  //             <span data-i18n-title="MSG_TOOLTIP_X">
  //   2) JS:    I18N.t('MSG_SAVE_SUCCESS')   → يرجع النص المترجم كـ string
  //             I18N.t('MSG_X', {name: y})   → استبدال {{name}} داخل النص
  //
  // أي شاشة جديدة تُبنى لاحقًا وتستخدم data-i18n أو I18N.t() تلقائيًا
  // تدعم تعدد اللغات بدون أي كود إضافي — هذا هو المطلوب في
  // "المرحلة الثانية عشرة: قابلية التوسع" من خطة العمل.
  // ═══════════════════════════════════════════════════════════════════

  var I18N = (function () {
    var _lang = "ar";
    var _dir = "rtl";
    var _dict = {};
    var _availableLanguages = [];
    var _legacyTextMap = {};
    var _autoTextCache = {};
    var _autoTextQueue = {};
    var _autoTextTimer = null;
    var AUTO_TEXT_STORAGE_KEY = "moo_erp_i18n_auto_en";
    var _forced = false;
    var _ready = false;
    var _readyCallbacks = [];
    var _changeListeners = []; // تُستدعى بعد كل تحميل/تبديل لغة (لإعادة بناء قوائم Key→Label الثابتة، مثل ERP_ROLES)
    var STORAGE_KEY = "moo_erp_lang"; // كاش محلي فقط لتفادي "ومضة" اتجاه خاطئ قبل استجابة السيرفر
    // [I18N-RESILIENCE-2026-08-05] كاش القاموس الكامل (مش بس lang/dir) —
    // يُستخدم كـ fallback حقيقي لو نداء getI18nBootstrap فشل مرتين على
    // التوالي، بدل ما تظهر الشاشة كلها بمفاتيح ⟦بين قوسين⟧.

    var _observer = null;

    // Keep locale decisions in one place.  Rendering modules must use these
    // helpers instead of hard-coding ar-EG/en-US in reports or grids.

    }

    /** يترجم مفتاحًا؛ يرجع المفتاح نفسه بين قوسين لو غير موجود (يسهّل رصد النواقص أثناء التطوير) */
    function t(key, vars) {
      var text = _dict[key];
      if (text === undefined) {
        console.warn("[I18N] مفتاح ترجمة مفقود:", key);
        return "⟦" + key + "⟧";

      root.querySelectorAll("[data-i18n]").forEach(function (el) {

        el.innerHTML = t(el.getAttribute("data-i18n-html"));
      });
      root.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
        el.setAttribute(
          "placeholder",
          t(el.getAttribute("data-i18n-placeholder")),
        );
      });
      root.querySelectorAll("[data-i18n-title]").forEach(function (el) {
        el.setAttribute("title", t(el.getAttribute("data-i18n-title")));
      });
      root.querySelectorAll("[data-i18n-value]").forEach(function (el) {
        el.setAttribute("value", t(el.getAttribute("data-i18n-value")));
      });
      root.querySelectorAll("[data-i18n-aria-label]").forEach(function (el) {

          "aria-label",
          t(el.getAttribute("data-i18n-aria-label")),

    /**
     * Transitional coverage for legacy renderers. Only exact text matches

     * user-entered values, database identifiers and arbitrary Arabic content
     * untouched while existing common labels become English immediately.
     */
    function _applyLegacyText(root) {
      if (!_legacyTextMap || !Object.keys(_legacyTextMap).length || !root)
        return;

        acceptNode: function (node) {

          .querySelectorAll("[title],[placeholder],[aria-label]")
          .forEach(function (el) {
            ["title", "placeholder", "aria-label"].forEach(function (attr) {
              var value = el.getAttribute(attr);
              if (_legacyTextMap[value] !== undefined)

            });
          });

    }

    function _loadAutoTextCache() {
      try {
        _autoTextCache = JSON.parse(
          localStorage.getItem(AUTO_TEXT_STORAGE_KEY) || "{}",
        );
      } catch (e) {
        _autoTextCache = {};
      }
    }

    function _saveAutoTextCache() {
      try {
        localStorage.setItem(
          AUTO_TEXT_STORAGE_KEY,
          JSON.stringify(_autoTextCache),
        );
      } catch (e) {}
    }

    function _queueUncataloguedLegacyText(root) {
      if (_lang !== "en" || !root || !APP || !APP.currentUser) return;
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function (node) {

      });
