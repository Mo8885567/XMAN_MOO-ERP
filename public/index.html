  // تُستدعَ من أي شاشة أبداً (كود ميت).
  //
  // الحل هنا لا يحذف أي وظيفة ولا يغيّر Business Logic: النتيجة النهائية في
  // _prefetch.data تصل بنفس الشكل بالضبط (نفس المفاتيح) التي تعتمد عليها كل
  // الشاشات الحالية عبر APP.data — الفرق الوحيد أن التحميل يصير تدريجياً:
  //   • REFERENCE (4) تُجلب أولاً في وقت فراغ المتصفح (idle) لأنها خفيفة
  //     ونادراً ما تتغيّر.
  //   • ON_DEMAND (2) + BACKGROUND (3) تُجلب بعدها في idle تالٍ، بدون حجب
  //     رسم لوحة التحكم أو تفاعل المستخدم.
  // fallback: لو getAllDataByLevel فشلت لأي سبب، نرجع لنفس السلوك القديم
  // (getAllData الكاملة) حفاظاً على الاستقرار.
  var _ric =
    (typeof requestIdleCallback === "function" && requestIdleCallback) ||
    function (fn) {
      setTimeout(fn, 60);
    };

  function _startPrefetch() {
    if (_prefetch.done || _prefetch.loading) return;
    _prefetch.loading = true;

    function _finishPrefetch(mergedData, isFull) {
      _prefetch.loading = false;
      mergedData._prefetch_full = !!isFull;
      _prefetch.done = true;
      _prefetch.data = mergedData;
      if (typeof _prefetch._onReady === "function") {
        var cb = _prefetch._onReady;
        _prefetch._onReady = null;
        cb(mergedData);
      }
      if (mergedData._prefetch_full) _drainFullWaiters();
    }

    // مسار احتياطي قديم (getAllData الكاملة) — يُستخدم فقط لو التحميل
    // التدريجي بالمستويات فشل، عشان لا ننكسر أبداً
    function _prefetchFullLegacyFallback() {
      DL.Core.getAllData({
        label: "Auth.prefetch.full.fallback",
        onSuccess: function (result) {
          _finishPrefetch(result.data, true);
        },
        onError: function () {
          if (_prefetch.data) {
            _finishPrefetch(_prefetch.data, false);
          } else {
            _prefetch.loading = false;
            _prefetch.done = false;
          }
        },
      });
    }

    // [PERF-EAGER-ONDEMAND-2026-08-02] المرحلة 2-أ: ON_DEMAND فورًا،
    // بدون انتظار أي requestIdleCallback. هذا المستوى بالتحديد (أصناف/
    // مخزون/مجموعات/مخازن/عملاء/موردين/حسابات...) هو اللي كل شاشات
    // النظام تقريبًا بتفتح عليه (شوف PAGE_REQUIRED_FIELDS فوق)، فتأجيله
    // خلف REFERENCE في سلسلة idle-then-idle كان يفتح فجوة زمنية حقيقية:
    // لو المستخدم فتح شاشة "الأصناف" بسرعة بعد اللوجين (خصوصًا لو
    // المتصفح مشغول برسم الداشبورد ولسه مادّاش وقت فراغ لأول idle
    // callback)، الشاشة تقف على Skeleton "جاري تحميل البيانات..." رغم
    // إن الطلب أصلاً ما كانش بدأ لسه. الحل: نطلب ON_DEMAND فورًا (موازي
    // مع REFERENCE بالأسفل، مش بعده)، ونسيب REFERENCE/BACKGROUND بس
    // (الأقل إلحاحًا) على idle. الشكل النهائي لـ _prefetch.data
    // و_prefetch_full === true فضل زي ما هو بالظبط — الفرق الوحيد توقيت
    // الوصول.
    function _prefetchOnDemandEager() {
      DL.Core.getAllDataByLevel([2], {
        label: "Auth.prefetch.onDemand",
        onSuccess: function (result) {
          Object.assign(_prefetch.data, result.data);
          _finishPrefetch(_prefetch.data, false);
          // ⚠️ [SAFE] عمداً بلا _drainFullWaiters() هنا: أي شاشة منتظرة
          // فعليًا عبر ensureLevelData (مش عبر PAGE_REQUIRED_FIELDS)
          // محتاجة full (2+3) بمنطقها الأصلي، فمفيش داعي نفكّها ناقصة.
          // شاشات PAGE_REQUIRED_FIELDS (زي "items") بترسم من غير ما
          // تسجّل نفسها كـ waiter من الأساس — شوف renderPage() فوق:
          // بتتأكد من _pageDataReady(page) قبل ما تنادي ensureLevelData
          // خالص، فأي صفحة حقولها وصلت فعلاً (زي دلوقتي) بترسم فورًا.
          _prefetchBackgroundIdle();
        },
        onError: function () {
          // فشل مسار المستويات بالكامل → ارجع للمسار القديم المضمون
          _prefetchFullLegacyFallback();
        },
      });
    }

    // المرحلة 2-ب: REFERENCE فقط، أثناء وقت فراغ المتصفح (لا يحجب أي
    // شيء) — خفيفة ونادرًا ما تتغيّر، فمفيش داعي تتنافس مع ON_DEMAND
    // على الأولوية. تعمل بالتوازي مع _prefetchOnDemandEager() مش بعدها.
    function _prefetchReferenceIdle() {
      _ric(function () {
        DL.Core.getAllDataByLevel([4], {
          label: "Auth.prefetch.reference",
          onSuccess: function (result) {
            Object.assign(_prefetch.data, result.data);
          },
          onError: function () {
            // best-effort — ON_DEMAND هو المسار الحرج ومعاه fallback
            // الخاص بيه؛ فشل REFERENCE وحدها لا يوقف أي شاشة.
          },
        });
      });
    }

    // المرحلة 2-ج: BACKGROUND بس، في idle منفصل بعد ON_DEMAND — حسابات/HR
    // اللي محتاجة صلاحيات ونادراً ما تُفتح فور اللوجين مباشرة.
    function _prefetchBackgroundIdle() {
      _ric(function () {
        DL.Core.getAllDataByLevel([3], {
          label: "Auth.prefetch.background",
          onSuccess: function (result) {
            Object.assign(_prefetch.data, result.data);
            _prefetch.data._prefetch_full = true; // كل المستويات وصلت الآن
            _drainFullWaiters();
          },
          onError: function () {
            // لا نوقف الداشبورد لأجل هذا — البيانات الناقصة ستُطلب per-screen
            // لاحقاً (on-demand) بنفس آلية getAllDataByLevel عند الحاجة الفعلية
            // [PHASE-3] لكن أي صفحة كانت مستنية عبر ensureLevelData لازم
            // تتفك (تكمل بالبيانات المتاحة) بدل ما تفضل معلّقة على Skeleton
            _prefetch.data._prefetch_full = true;
            _drainFullWaiters();
          },
        });
      });
    }

    // المرحلة 1: جيب البيانات الخفيفة سريعاً (Critical) — كما كانت بالضبط
    // [RETRY-LIGHT-2026-08-07] النداء الخفيف أحيانًا بيفشل بسبب تزامن/تايمنج
    // مع لحظة اللوجين نفسها (رد فاضٍ من google.script.run) — قبل كده كنا
    // بنقفز على طول لـ _prefetchFullLegacyFallback (تحميل كل البيانات
    // كاملة، أتقل بكتير) حتى لو كانت المشكلة عابرة وهتنجح من أول محاولة
    // تانية. دلوقتي بنعيد نفس النداء الخفيف مرة واحدة بسرعة الأول، وبس لو
    // فشلت تاني (فشل حقيقي/متكرر) ننتقل للـ fallback الكامل زي ما كان.
    function _fetchPrefetchLight(isRetry) {
      DL.Core.getAllDataLight({
        label: isRetry ? "Auth.prefetch.light.retry" : "Auth.prefetch.light",
        onSuccess: function (result) {
          _prefetch.data = result.data;
          // [PERF-EAGER-ONDEMAND-2026-08-02] الاثنان بالتوازي: ON_DEMAND
          // فورًا (حرجة لمعظم الشاشات) + REFERENCE في idle (خفيفة، أقل
          // إلحاحًا) — بدل ما ON_DEMAND تستنى دورها بعد REFERENCE.
          _prefetchOnDemandEager();
          _prefetchReferenceIdle();
        },
        onError: function () {
          if (!isRetry) {
            _fetchPrefetchLight(true);
          } else {
            _prefetchFullLegacyFallback();
          }
        },
      });
    }
    _fetchPrefetchLight(false);
  }

  // ─────────────────────────────────────────────────────────────
  // §E-CACHE  نظام الكاش المقسّم v4.2
  //
  // الفكرة: بيانات ثابتة (items, warehouses, groups, colors) TTL = 10 دقيقة
  //          بيانات متغيرة (transactions, stock, productionOrders) TTL = 90 ثانية
  //
  // فائدة: بعد حفظ صنف جديد نحدّث items محلياً فوراً بدون round-trip كامل
  //         (Optimistic Update) ثم نزامن في الخلفية
  // ─────────────────────────────────────────────────────────────
  var _cache = { data: null, ts: 0, fetching: false };

  // TTL منفصل لكل نوع بيانات (بالميلي ثانية)
  var CACHE_TTL_STATIC = 600000; // 10 دقائق — items, warehouses, groups, colors
  var CACHE_TTL_DYNAMIC = 90000; // 90 ثانية  — transactions, stock, productionOrders
  var CACHE_TTL = CACHE_TTL_DYNAMIC; // للتوافق مع الكود القديم

  // [PERF-FIX-CACHE-WIPE] كاش wms_cache_static/dynamic بقى يفضل موجود في
  // localStorage بعد الـ logout (بدل ما يتمسح — شوف render() فوق) عشان
  // اليوزر يرجع يلاقي بياناته فورًا في اللوجين الجاي. لازم إذن نضمن إن
  // اليوزر التاني (لو الجهاز مشترك) ميشوفش ولو لحظة بيانات مش بتاعته قبل
  // ما silent refresh تجيب بياناته هو. الحل: كل مرة نحفظ كاش، نسجّل اسم
  // صاحبه في مفتاح منفصل خفيف (wms_cache_owner)، وأي قراءة للكاش لازم
  // تتأكد إن صاحبه هو نفس المستخدم الحالي قبل ما تُستخدَم.
  function _cacheOwnerMatches() {
    try {
      var owner = localStorage.getItem("wms_cache_owner") || "";
      var current =
        (APP.currentUser && APP.currentUser.username) || "";
      // لو مفيش owner متسجّل (كاش قديم من قبل الفيكس ده) نعتبره غير موثوق
      // ونرفضه بحذر بدل ما نفترض إنه بتاع اليوزر الحالي.
      return !!current && owner === current;
    } catch (e) {
      return false;
    }
  }

  function _setCacheOwner() {
    try {
      var current = (APP.currentUser && APP.currentUser.username) || "";
      if (current) localStorage.setItem("wms_cache_owner", current);
    } catch (e) {}
  }

  /**
   * _saveCache — يحفظ البيانات مع timestamp مقسّم
   * static_ts: وقت آخر تحديث للبيانات الثابتة
   * dynamic_ts: وقت آخر تحديث للبيانات المتغيرة
   */
  function _saveCache(data) {
    var now = Date.now();
    _cache.data = data;
    _cache.ts = now;
    // نحفظ timestamps منفصلة
    // ✅ FIX: دائماً حدّث static_ts عند حفظ بيانات كاملة جديدة من السيرفر
    // السبب: || now كانت تُبقي الـ static cache القديم صالحاً لـ 10 دقائق
    // مما يمنع ظهور openingStock الجديدة بعد الحفظ
    _cache.static_ts = now;
    _cache.dynamic_ts = now;
    try {
      // نقسّم الكاش في sessionStorage لتقليل حجم JSON.parse عند القراءة
      var staticPart = {
        items: data.items,
        warehouses: data.warehouses,
        groups: data.groups,
        colors: data.colors,
        sizes: data.sizes || [],
        // [FIX-2026-07-28] sizeGroups كانت ناقصة من كاش sessionStorage —
        // فبعد أول تحميل، أي إعادة بناء لـ APP.data من الكاش (_loadCache)
        // كانت بتمسح مجموعات المقاسات وترجّعها فاضية حتى لو السيرفر
        // بيرجّعها صح، وده سبب اختفائها في شاشة "تعريف المقاسات".
        sizeGroups: data.sizeGroups || [],
        users: data.users,
        companySettings: data.companySettings,
        roles: data.roles,
        permissions: data.permissions,
        userOverrides: data.userOverrides,
        // ✅ FIX: حفظ العملاء والموردين في الكاش
        customers: data.customers || [],
        suppliers: data.suppliers || [],
        // ✅ [PERF-CAT-BUNDLE] حفظ تصنيفات العملاء/الموردين في الكاش أيضاً
        customerCategories: data.customerCategories || [],
        supplierCategories: data.supplierCategories || [],
        chartOfAccounts: data.chartOfAccounts || [],
        // [DLE-P0-FIX] كانت ناقصة هنا برضو (نفس فئة بج sizeGroups) —
        // فلو حصل ريفريش للصفحة خلال مدة صلاحية الكاش الثابت (10 دقايق)،
        // الفواتير والمرتجعات كانت بتضيع من APP.data بعد إعادة البناء من
        // sessionStorage حتى بعد فيكس _parseData، لأنها ماكانتش بتتحفظ في
        // الكاش أصلاً من البداية.
        saleInvoices: data.saleInvoices || [],
        purchaseInvoices: data.purchaseInvoices || [],
        saleReturns: data.saleReturns || [],
        purchaseReturns: data.purchaseReturns || [],
        ts: _cache.static_ts,
      };
      var dynamicPart = {
        transactions: data.transactions,
        stock: data.stock,
        productionOrders: data.productionOrders,
        openingStock: data.openingStock,
        shipments: data.shipments,
        ts: now,
      };
      localStorage.setItem("wms_cache_static", JSON.stringify(staticPart));
      localStorage.setItem("wms_cache_dynamic", JSON.stringify(dynamicPart));
      _setCacheOwner();
    } catch (e) {
      // 🐛 [FIX-QUOTA] كانت الأخطاء هنا بتتبلع بصمت (catch فاضي) — لو
      // localStorage امتلأ (QuotaExceededError، شائع جداً مع نظام بيانات
      // بالحجم ده) كان الحفظ بيفشل بصمت في كل مرة، فـ _loadCache دايماً
      // ترجع null والنظام يعمل "full reload" زي الأول تمامًا حتى بعد
      // إصلاح التخزين — من غير أي رسالة تدل على السبب. دلوقتي: نسجّل
      // تحذير واضح في الـ console، ونجرب مرة واحدة كمان بعد ما نمسح أي
      // كاش قديم متراكم (خصوصاً wms_ext_cache_v1 اللي ممكن يكون كبير)
      // عشان نفسح مساحة قبل ما نستسلم.
      console.warn("_saveCache: فشل حفظ الكاش في localStorage:", e && e.message);
      try {
        localStorage.removeItem("wms_ext_cache_v1");
        localStorage.setItem("wms_cache_static", JSON.stringify(staticPart));
        localStorage.setItem("wms_cache_dynamic", JSON.stringify(dynamicPart));
        _setCacheOwner();
      } catch (e2) {
        console.warn(
          "_saveCache: فشل الحفظ حتى بعد تفريغ مساحة — الكاش المحلي معطّل هذه الجلسة:",
          e2 && e2.message,
        );
      }
    }
  }

  /**
   * _saveCacheOptimistic — يحدّث البيانات الثابتة فقط في الكاش (بعد Optimistic Update)
   * يستخدمها reloadAfterMutation بعد تعديل item/group/warehouse/color
   */
  function _saveCacheOptimistic(partialData) {
    if (!_cache.data) return;
    var now = Date.now();
    // ادمج التحديثات في _cache.data
    Object.keys(partialData).forEach(function (key) {
      _cache.data[key] = partialData[key];
    });
    _cache.static_ts = now;
    _cache.ts = now;
    // أعد كتابة الكاش كاملاً
    _saveCache(_cache.data);
  }

  function _loadCache() {
    // أسرع مسار: الكاش في الذاكرة وصالح
    if (_cache.data && Date.now() - _cache.dynamic_ts < CACHE_TTL_DYNAMIC) {
      return _cache.data;
    }
    // محاولة القراءة المقسّمة من sessionStorage
    try {
      var staticRaw = localStorage.getItem("wms_cache_static");
      var dynamicRaw = localStorage.getItem("wms_cache_dynamic");
      if (!staticRaw || !dynamicRaw) {
        // fallback للكاش القديم
        var raw = localStorage.getItem("wms_cache");
        if (!raw) return null;
        var c = JSON.parse(raw);
        if (Date.now() - c.ts < CACHE_TTL_DYNAMIC) {
          _cache = {
            data: c.data,
            ts: c.ts,
            static_ts: c.ts,
            dynamic_ts: c.ts,
            fetching: false,
          };
          return c.data;
        }
        return null;
      }
      var staticC = JSON.parse(staticRaw);
      var dynamicC = JSON.parse(dynamicRaw);
      var now = Date.now();

      // ⚡ [FIX-RELOAD-UX] كانت البيانات الديناميكية بمجرد انتهاء صلاحيتها
      // (90 ثانية) بتخلي الدالة ترجع null بالكامل — يعني حتى الأصناف/المخازن/
      // المجموعات (اللي نادراً ما تتغيّر) كانت بتترمى، والمستخدم يشوف شاشة
      // "جاري تحميل البيانات..." الكاملة من الصفر كل ما يرجع للنظام بعد
      // دقيقة ونص بس. بدل الرمي الكامل: نرجّع الكاش المتاح فورًا (ولو
      // الديناميكي قديم شوية) عشان الشاشة تظهر فورًا، ونسيب _silentRefresh()
      // (اللي بيتنادى فعلاً فورًا بعد الرجوع من هنا في loadAllData) يجيب
      // النسخة الحقيقية في الخلفية من غير ما يعطّل المستخدم. لسه فيه حد
      // أقصى (MAX_STALE_DYNAMIC) عشان منعرضش بيانات قديمة جداً (لو التاب
      // فضل مقفول ساعات) من غير أي مؤشر تحديث.
      var MAX_STALE_DYNAMIC = 3600000; // ساعة — حد أقصى لعرض بيانات ديناميكية قديمة قبل التحديث الصامت
      if (now - dynamicC.ts > MAX_STALE_DYNAMIC) return null;

      // البيانات الثابتة انتهت — سنرجع الكاش لكن نشغّل silent refresh
      var staticStale = now - staticC.ts > CACHE_TTL_STATIC;

      var merged = {
        items: staticC.items || [],
        warehouses: staticC.warehouses || [],
        groups: staticC.groups || [],
        colors: staticC.colors || [],
        sizes: staticC.sizes || [],
        // [FIX-2026-07-28] راجع نفس الفيكس فوق في _saveCache
        sizeGroups: staticC.sizeGroups || [],
        users: staticC.users || [],
        companySettings: staticC.companySettings || {},
        roles: staticC.roles || [],
        permissions: staticC.permissions || [],
        userOverrides: staticC.userOverrides || {},
        // ✅ FIX: استعادة العملاء والموردين من الكاش
        customers: staticC.customers || [],
        suppliers: staticC.suppliers || [],
        // ✅ [PERF-CAT-BUNDLE] استعادة تصنيفات العملاء/الموردين من الكاش
        customerCategories: staticC.customerCategories || [],
        supplierCategories: staticC.supplierCategories || [],
        chartOfAccounts: staticC.chartOfAccounts || [],
        // [DLE-P0-FIX] راجع نفس الفيكس فوق في _saveCache
        saleInvoices: staticC.saleInvoices || [],
        purchaseInvoices: staticC.purchaseInvoices || [],
        saleReturns: staticC.saleReturns || [],
        purchaseReturns: staticC.purchaseReturns || [],
        transactions: dynamicC.transactions || [],
        stock: dynamicC.stock || [],
        productionOrders: dynamicC.productionOrders || [],
        openingStock: dynamicC.openingStock || [],
        shipments: dynamicC.shipments || [],
      };
      // ✅ [FIX-EXT] أعد دمج بيانات المحاسبة/HR المحمّلة مسبقاً في APP.data
      // عشان لو الـ dynamic cache انتهى وأُعيد بناء الـ merged من الـ sessionStorage
      // تفضل بيانات الخزينة والمحاسبة موجودة بدل ما يروح في الـ re-merge
      if (APP.data && APP.extLoaded) {
        EXT_FIELDS.forEach(function (f) {
          if (APP.data[f] !== undefined) {
            merged[f] = APP.data[f];
          }
        });
      }
      _cache = {
        data: merged,
        ts: dynamicC.ts,
        static_ts: staticC.ts,
        dynamic_ts: dynamicC.ts,
        fetching: false,
        _staticStale: staticStale,
      };
      return merged;
    } catch (e) {}
    return null;
  }

  var _permI18nPatchRegistered = false;
  /** يعيد حساب label/catLabel لكل صلاحيات APP.data.permissions أول ما
   *  قاموس الترجمة يوصل (لو _parseData اشتغل قبل ما I18N يخلص تحميل).
   *  بيتسجّل مرة واحدة بس عبر I18N.onReady. */
  function _patchPermissionLabelsWhenI18nReady() {
    if (_permI18nPatchRegistered) return;
    if (typeof I18N === "undefined" || !I18N.onReady) return;
    _permI18nPatchRegistered = true;
    I18N.onReady(function () {
      var list = (APP.data && APP.data.permissions) || [];
      list.forEach(function (p) {
        if (!p.label && p.labelKey) p.label = I18N.t(p.labelKey) || p.key;
        if (!p.catLabel && p.catLabelKey)
          p.catLabel = I18N.t(p.catLabelKey) || p.cat;
      });
      if (typeof render === "function") render();
    });
  }

  // ليها تحويل خاص (items/stock/transactions/openingStock/permissions)

  // الشكل اللي بيتقرا بيه كل حقل عشان ميضيعش تاني.
  // ─────────────────────────────────────────────────────────────
  var DATA_FIELD_REGISTRY = [
    // مستوى 1 — حرج
    { key: "warehouses", tier: "critical", default: "array" },
    { key: "groups", tier: "critical", default: "array" },
    { key: "colors", tier: "critical", default: "array" },
    { key: "sizes", tier: "critical", default: "array" },
    { key: "sizeGroups", tier: "critical", default: "array" },

    { key: "suppliers", tier: "onDemand", default: "array" },
    { key: "customerCategories", tier: "onDemand", default: "array" },
    { key: "supplierCategories", tier: "onDemand", default: "array" },
    { key: "chartOfAccounts", tier: "onDemand", default: "array" },

  /** ينسخ كل حقول DATA_FIELD_REGISTRY من d إلى target، بقيمة افتراضية آمنة */
  function _dleApplyRegistry(target, d) {
    DATA_FIELD_REGISTRY.forEach(function (f) {
      target[f.key] = d[f.key] || (f.default === "object" ? {} : []);
    });
  }

  function _parseData(d) {
    _patchPermissionLabelsWhenI18nReady();
    var items = (d.items || []).map(function (it) {
      it.id = it.id != null ? String(it.id) : "";
      if (!it.colors_json && it.calor) {
        it.colors_json = it.calor;
      }
      return it;
    });
    var stock = (d.stock || []).map(function (s) {
      s.item_id = s.item_id != null ? String(s.item_id) : "";
      return s;
    });
    var transactions = (d.transactions || []).map(function (t) {
      t.item_id = t.item_id != null ? String(t.item_id) : "";
      return t;
    });
    var openingStock = (d.openingStock || []).map(function (o) {
      o.item_id = o.item_id != null ? String(o.item_id) : "";
      return o;
    });
    var out = {
      items: items,
      stock: stock,
      transactions: transactions,
      openingStock: openingStock,
      // ✅ [FIX] ALL_PERMISSIONS في السيرفر (Code_18_Permissions.js) بيحتوي
      // labelKey/catLabelKey (مفاتيح ترجمة) بس — مفيش أي label/catLabel نصي
      // مباشر. كل شاشات الصلاحيات (مودال الدور، مصفوفة الصلاحيات،
      // Override المستخدمين في Templates_06.html/08_JS_Users_Branding.html/
      // 10_JS_Settings_Search_Parties.html) بتقرا p.label و p.catLabel
      // مباشرة (esc(p.label)، cats[p.cat]={label:p.catLabel})، فكانت
      // بترجع undefined دايمًا → نص فاضي في كل صف وكل عنوان فئة. الحل
      // المركزي هنا: نحسب label/catLabel مرة واحدة وقت تحميل البيانات
      // (بدل تعديل كل ملفات العرض)، مع fallback آمن لو الترجمة ناقصة.
      permissions: (d.permissions || []).map(function (p) {
        // ✅ [FIX-2] لو I18N لسه بيحمّل القاموس (سباق بين bootstrap
        // البيانات و bootstrap الترجمة وقت فتح التطبيق)، I18N.t() كان
        // بيرجع دايمًا "مفقود" ويطبع تحذير في الـ console لكل مفتاح صلاحية
        // (حتى لو المفتاح موجود فعلاً في القاموس، بس لسه ما وصلش). الحل:
        // لو مش جاهز، نسيب label/catLabel فاضيين مؤقتًا من غير ما ننادي
        // I18N.t() خالص، وبعدين _patchPermissionLabelsWhenI18nReady()
        // (تحت) بتعيد حسابهم أوتوماتيك أول ما القاموس يوصل.
        var i18nReady =
          typeof I18N !== "undefined" &&
          I18N.t &&
          (typeof I18N.isReady !== "function" || I18N.isReady());
        var _t = i18nReady
          ? I18N.t
          : function () {
              return "";
            };
        return Object.assign({}, p, {
          label: p.label || (p.labelKey && i18nReady ? _t(p.labelKey) : "") || p.key,
          catLabel:
            p.catLabel ||
            (p.catLabelKey && i18nReady ? _t(p.catLabelKey) : "") ||
            p.cat,
        });
      }),
    };
    // [DLE-P0] باقي الحقول (بدون تحويل خاص) بتتنسخ تلقائياً من السجل
    // المركزي فوق بدل ما تتكتب يدوياً واحد واحد هنا.
    _dleApplyRegistry(out, d);
    return out;
  }
  function _showRefreshBar(visible) {
    var bar = document.getElementById("refresh-bar");

    }
  }

  // ---------- Data Loading v4.2 ----------

  /** مساعد مشترك لتطبيق البيانات الجديدة على APP + PM_STATE */
  function _applyFreshData(fresh) {
    // ✅ [FIX-EXT] احتفظ ببيانات المحاسبة/HR المحمّلة مسبقاً من getAllDataExtended
    // لأن getAllData() لا تتضمّنها — بدون هذا الحفظ يتمسح cashBoxes/journalEntries
    // بعد كل silentRefresh ويظهر المستخدم شاشة فاضية لما يرجع للخزينة
    //
    // [FIX-EXT-V2] التحقق من extLoaded كان يفشل لو silentRefresh انتهى قبل
    // getAllDataExtended — دلوقتي نحتفظ بالحقل طالما هو array (موجود فعلاً)
    // بغض النظر عن قيمة extLoaded
    EXT_FIELDS.forEach(function (f) {
      if (APP.data && Array.isArray(APP.data[f])) {
        fresh[f] = APP.data[f];
      }
    });
    // احتفظ بـ flag السيرفر
    if (APP.data && APP.data._extLoadedFromServer) {
      fresh._extLoadedFromServer = true;
    }
    APP.data = fresh;
    APP.companySettings = fresh.companySettings || APP.companySettings || {};
    // [PERF-LAZY-LOAD] دوال من ملفات مؤجلة (08_JS_Users_Branding /
    // 03_JS_Dashboard_Items) — بتتحمل غالبًا خلال ثواني من فتح الصفحة،
    // بس بنحرس النداء احتياطًا لأي تايمنج نادر.
    if (typeof _applyCompanyBranding === "function") _applyCompanyBranding();
    if (typeof _syncColorsFromData === "function") _syncColorsFromData();
    if (
      fresh.roles &&
      fresh.roles.length &&
      typeof PM_STATE !== "undefined"
    ) {
      // [FIX-2026-08-08] PM_STATE معرّفة جوه 08_JS_Users_Branding.html
      // (ملف lazy بيتحمّل عبر getLazyAppBundle) — لو الحزمة المؤجلة فشلت/
      // عملت timeout (زي ما بيحصل لما الباك إند يكون بطيء/عالق) كانت
      // _applyFreshData بتكسر بـ "PM_STATE is not defined" وتوقف كل تحميل
      // البيانات. نفس الحراسة مستخدمة فعلاً في 02_JS_UI_Shell.html.
      PM_STATE.roles = fresh.roles;
      PM_STATE.permissions = fresh.permissions || [];
      PM_STATE.userOverrides = fresh.userOverrides || {};
      PM_STATE.users = fresh.users || [];
      PM_STATE.loaded = true;
      _syncRolePermissions();
    }
  }

  // تحديث صامت في الخلفية بعد عرض الكاش
  // [PERF-FIX-SR] نسخة محسّنة: تتحقق من تغيّر البيانات قبل إعادة الرسم
  function _dataFingerprint(data) {
    if (!data) return "";
    try {
      var tx = data.transactions || [];
      var items = data.items || [];
      var stock = data.stock || [];
      var lastTx = tx.length
        ? String(tx[tx.length - 1].id) + "|" + tx[tx.length - 1].date
        : "";
      return [tx.length, items.length, stock.length, lastTx].join(":");
    } catch (e) {
      return "";
    }
  }

  function _silentRefresh() {
    if (_cache.fetching) return;
    _cache.fetching = true;
    _showRefreshBar(true);
    var _fpBefore = _dataFingerprint(APP.data);
    DL.Core.getAllData({
      label: "Auth.silentRefresh",
      onSuccess: function (result) {
        _showRefreshBar(false);
        _cache.fetching = false;
        var d = result.data;
        if (!d || typeof d !== "object") return;
        var fresh = _parseData(d);
        _saveCache(fresh);
        _applyFreshData(fresh);

        // [PERF-FIX-SR] مقارنة البصمة: لو البيانات لم تتغير → لا نعيد الرسم
        var _fpAfter = _dataFingerprint(fresh);
        var _dataChanged = _fpBefore !== _fpAfter;

        // حفظ scroll positions قبل الـ re-render
        var pageEl = document.querySelector(".content");
        var alertsEl = document.querySelector(".alerts-grid");
        var pageScroll = pageEl ? pageEl.scrollTop : 0;
        var alertsScroll = alertsEl ? alertsEl.scrollTop : 0;

        // ✅ لو المستخدم بيكتب في form، متعملش re-render عشان متمسحش المدخلات
        var activeEl = document.activeElement;
        var userTyping =
          activeEl &&
          (activeEl.tagName === "INPUT" ||
            activeEl.tagName === "TEXTAREA" ||
            activeEl.tagName === "SELECT" ||
            activeEl.isContentEditable);

        updateAlertBadge();
        updateNotifBell();

        // [PERF-FIX-SR] أعد الرسم فقط لو البيانات تغيّرت فعلاً والمستخدم مش بيكتب
        // [LOGIN-STABLE] وكمان لو فات 5 ثواني على اللوجين عشان الشاشة تتستقر
        var _sinceLogin = Date.now() - (APP._loginTime || 0);
        // 🎨 [FIX] شاشة "المجموعات" (عرض شجري) عندها حالة UI محلية غنية
        // (توسيع/طي، سحب وإفلات، تمرير داخلي) وبصمة البيانات (_dataFingerprint)
        // مبنية على transactions/items/stock بس — يعني أي حركة/صنف يتغيّر في
        // أي مكان تاني بالنظام كان بيفجّر إعادة بناء كاملة للشجرة (فتش + رسم
        // من الصفر) رغم إن بيانات المجموعات نفسها مالهاش دعوة، فيحس المستخدم
        // إن الشاشة "بترفرش" باستمرار وبيفقد مكان التمرير/التوسيع. بنستثنيها
        // من إعادة الرسم الصامتة؛ أي تعديل فعلي على المجموعات (إضافة/حذف/تعديل)
        // بيحصله رسم فوري من مكانه هو نفسه (مش محتاج الريفريش الصامت أصلاً).
        var _silentRefreshSkipPages = { groups: true };
        if (
          _dataChanged &&
          !userTyping &&
          _sinceLogin > 5000 &&
          !_silentRefreshSkipPages[APP.currentPage]
        ) {
          APP._fromSilentRefresh = true;
          renderPage(APP.currentPage);
          APP._fromSilentRefresh = false;
          // استعادة scroll positions بعد الـ re-render
          setTimeout(function () {
            var pageElNew = document.querySelector(".content");
            var alertsElNew = document.querySelector(".alerts-grid");
            if (pageElNew) pageElNew.scrollTop = pageScroll;
            if (alertsElNew) alertsElNew.scrollTop = alertsScroll;
          }, 0);
        }
      },
      onError: function () {
        _cache.fetching = false;
        _showRefreshBar(false);
      },
    });
  }

  function loadAllData(cb, forceRefresh) {
    if (!forceRefresh) {
      // [PERF-FIX-CACHE-WIPE] كاش البيانات بقى ممكن يفضل من يوزر سابق على
      // نفس الجهاز (شوف render() و_cacheOwnerMatches فوق) — لازم نتأكد إنه
      // بتاع اليوزر الحالي قبل ما نستخدمه، وإلا نتجاهله ونعمل نداء سيرفر
      // طبيعي (نفس سلوك "مفيش كاش" القديم بالظبط، بدون أي تسريب بيانات).
      var cached = _cacheOwnerMatches() ? _loadCache() : null;
      if (cached) {
        _applyFreshData(cached);
        if (typeof cb === "function") cb();
        else if (cb !== null) renderPage(APP.currentPage);
        updateAlertBadge();
        updateNotifBell();
        // لو البيانات الثابتة قديمة أيضاً → silent refresh كامل
        _silentRefresh();
        return;
      }
    }

    APP.loading = true;
    // لا نعرض spinner في page-content — الـ app-loading-overlay شغّال فوق كل شيء
    // var c = document.getElementById("page-content"); -- removed

    DL.Core.getAllData({
      label: "Auth.loadAllData",
      onSuccess: function (result) {
        APP.loading = false;
        var d = result.data;
        if (!d || typeof d !== "object") {

          if (typeof _hideAppLoader === "function") _hideAppLoader();
          return;
        }
        var fresh = _parseData(d);
        fresh._loaded = true;
        _saveCache(fresh);
        _applyFreshData(fresh);
        if (typeof _hideAppLoader === "function") _hideAppLoader();
        if (typeof APP._onDataLoaded === "function") {
          var _hook = APP._onDataLoaded;
          APP._onDataLoaded = null;
          _hook();
        }
        if (typeof cb === "function") cb();
        // [LOGIN-STABLE] لو cb=null (silent background load) — لا نعيد الرسم
        else if (cb !== null) renderPage(APP.currentPage);
        updateAlertBadge();
        updateNotifBell();
      },
      onError: function (result) {
        APP.loading = false;
        if (typeof _hideAppLoader === "function") _hideAppLoader();
        showToast(I18N.t("MSG_LOAD_ERROR") + ": " + result.message, "error");
        console.error("loadAllData error:", result.message);
      },
    });
  }

  function _saveExtCache(data) {
    try {

        EXT_CACHE_KEY,

      // [FIX-EXT-FLAG] الكاش = بيانات حقيقية سبق تحميلها من السيرفر

      (mb || 6) +

      "background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);" +
      "background-size:200% 100%;animation:csShimmer 1.4s ease-in-out infinite'></div>"
    );
  }

  /** يولّد صف جدول skeleton */
  function _skelTableRow(cols) {
    var cells = "";
    for (var i = 0; i < (cols || 5); i++) {
      var w = i === 0 ? "60%" : i === cols - 1 ? "40%" : "80%";
      cells += "<td style='padding:12px 10px'>" + _skelBar(w, 13, 0) + "</td>";
    }
    return (
      "<tr style='border-bottom:1px solid var(--border)'>" + cells + "</tr>"
    );

  function _skelStatCard() {

      "<div style='background:var(--surface2);border-radius:12px;padding:20px;flex:1;min-width:160px'>" +
      _skelBar("40px", 40, 8) +

  /**
   * _skelLoadingBanner() — شريط رسالة "جار تحميل البيانات" بيتحط أعلى

   * النظام فعليًا بيحمّل بيانات دلوقتي، مش شاشة عالقة أو فاضية.
   */
  function _skelLoadingBanner() {
    var msg =
      typeof I18N !== "undefined"
        ? I18N.t("MSG_LOADING_DATA_ELLIPSIS")

  /**
   * _renderAccHrSkeleton(page) — يرسم Skeleton مناسب لكل نوع شاشة

  function _renderAccHrSkeleton(page) {
    // تحديد نوع الشاشة

    var rows = "";

    // ── Page Header skeleton ──
    var headerSkel =

      "<div style='width:48px;height:48px;border-radius:12px;flex-shrink:0;" +

    if (isDash) {

        "<div style='display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap'>" +
        _skelStatCard() +
        _skelStatCard() +
        _skelStatCard() +
        _skelStatCard() +
        "</div>" +
        "<div style='background:var(--surface1);border:1px solid var(--border);border-radius:12px;padding:20px'>" +
        _skelBar("30%", 14, 16) +
        "<table style='width:100%;border-collapse:collapse'><tbody>" +

        "</tbody></table>" +

        "</div>"

    // Table / Form pages
    return (
      "<div style='padding:24px 0'>" +
      _skelLoadingBanner() +
      headerSkel +
      "<div style='background:var(--surface1);border:1px solid var(--border);border-radius:12px;overflow:hidden'>" +
      // Toolbar skeleton
      "<div style='padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center'>" +
      "<div style='flex:1;max-width:260px'>" +
      _skelBar("100%", 34, 0) +
      "</div>" +
      "<div style='width:100px'>" +
      _skelBar("100%", 34, 0) +
      "</div>" +
      "</div>" +
      // Table skeleton
      "<div style='overflow-x:auto'>" +
      "<table style='width:100%;border-collapse:collapse'>" +
      "<thead><tr style='background:var(--surface2);border-bottom:2px solid var(--border)'>" +
      (function () {
        var ths = "";
        for (var i = 0; i < colCount; i++) {
          ths +=
            "<th style='padding:12px 10px;text-align:right'>" +
            _skelBar(i === 0 ? "70%" : "50%", 12, 0) +

        return ths;
      })() +
      "</tr></thead>" +
      "<tbody>" +
      rows +
      "</tbody>" +
      "</table>" +
      "</div>" +
      "</div>" +

  /**
   * ensureExtendedData — يضمن إن بيانات المحاسبة/HR موجودة في APP.data
   * قبل ما الشاشة تعرضها، بدون ما يكرر نداء السيرفر لو كانت محمّلة فعلاً.
   * @param {Function} cb يُستدعى لما البيانات تكون جاهزة
   * @param {boolean} [forceRefresh] لو true يتجاهل الكاش ويجيب نسخة جديدة
   */
  // ─────────────────────────────────────────────────────────────
  // [DATA-UNIFY-2] نقطة الاتصال الوحيدة بالسيرفر لجلب الحزمة الموسعة
  //
  // قبل كده كان فيه 4 نسخ منفصلة بتنادي google.script.run.getAllDataExtended
  // مباشرة (هنا x3 + نسخة رابعة في 11_JS_Accounting.html)، كل نسخة بمنطق
  // cache/retry خاص بيها — وده كان سبب ظهور شاشات "جاري التحميل" عالقة لما
  // نسختين يشتغلوا في نفس الوقت من غير ما يعرفوا ببعض.
  //
  // دلوقتي: نداء واحد فعلي (_gsr → DL.Core.getAllDataExtended)، وكل الدوال
  // التالية (ensureExtendedData / refreshExtendedData / _preloadAllAfterLogin /
  // _silentPrefetchExtended) بقت مجرد "واجهات" حوالين نفس الطابور المشترك
  // _extCallbacks + علم APP.extLoading المشترك.
  // ─────────────────────────────────────────────────────────────
  function _fetchExtendedDataFromServer(_isRetry) {
    APP.extLoading = true;
    // ✅ [PERF-SPLIT] كانت DL.Core.getAllDataExtended نداء واحد بيخلي الباك-إند
    // يقرأ 24 قسم بالتتابع جوه تنفيذ Apps Script واحد، وده كان بياخد وقت
    // كافي إنه يضرب مهلة الـ 30 ثانية (خصوصًا على /dev deployment) ويظهر
    // "[DL] Core.getAllDataExtended → انتهت المهلة" في الكونسول.
    // [PERF-SPLIT-2026-07-28] وبعد التقسيم الأول (Core/Lazy) كان Lazy لوحدها
    // لسه بتقرا 14 قسم بالتتابع (محاسبة + HR مع بعض) وفضلت تضرب المهلة مع
    // نمو البيانات. الحل الجذري: Lazy اتقسمت هي كمان لدومينين (محاسبة/HR)
    // كل واحد بنداء مستقل، وبننادي التلاتة (Core + Lazy-Acc + Lazy-HR)
    // بالتوازي هنا بدل نداءين، فالزمن الكلي = أبطأ نداء من التلاتة (نص
    // عدد الأقسام تقريبًا لكل نداء) مش مجموعهم — من غير أي تغيير في أي
    // مكان تاني (كل الشاشات لسه بتنادي ensureExtendedData بنفس الشكل).
    var _mergedExtData = {};
    var _coreDone = false,
      _lazyAccDone = false,
      _lazyHrDone = false,
      _lazyFinDone = false,
      _hadExtError = false,
      _extErrorResult = null;

    // ✅ [FIX-2026-08-08] مهلة أمان: لو نداء واحد من الأربعة اتعلّق (تايم
    // أوت شبكة، تجميد التاب في الخلفية، أو استثناء جوه onSuccess نفسه
    // منع نداء الكولباك) كانت كل الشاشة المعتمدة على ensureExtendedData
    // (كروت المحاسبة في الداشبورد التنفيذي وغيرها) بتفضل عالقة على حالة
    // التحميل للأبد، لأن _checkAllDone بينتظر الأربعة مع بعض بدون أي حد
    // أقصى للوقت. دلوقتي لو نداء اتأخر أكتر من 25 ثانية بنعتبره "فشل"
    // ونكمل بالباقي بدل التعليق الدائم.
    var _safetyTimer = setTimeout(function () {
      var stuck = [];
      if (!_coreDone) {
        stuck.push("core");
        _coreDone = true;
      }
      if (!_lazyAccDone) {
        stuck.push("lazyAcc");
        _lazyAccDone = true;
      }
      if (!_lazyHrDone) {
        stuck.push("lazyHr");
        _lazyHrDone = true;
      }
      if (!_lazyFinDone) {
        stuck.push("lazyFin");
        _lazyFinDone = true;
      }
      if (stuck.length) {
        if (typeof console !== "undefined" && console.warn) {
          console.warn(
            "[ensureExtendedData] نداء(نداءات) اتعلّقت بدون رد:",
            stuck,
          );
        }
        _hadExtError = true;
        _checkAllDone();
      }
    }, 35000); // [FIX-2026-08-08] لازم يفضل أكبر من أطول timeout فردي (30000) وإلا هيقفل قبل ما نداء الـ core ياخد فرصته كاملة

    function _checkAllDone() {
      if (!_coreDone || !_lazyAccDone || !_lazyHrDone || !_lazyFinDone) return;
      clearTimeout(_safetyTimer);
      APP.extLoading = false;

      if (_hadExtError) {
        if (!_isRetry) {
          // [FIX] أول فشل (كاش سيرفر تالف أو خطأ مؤقت) — حاول مرة واحدة إضافية
          // بنسخة fresh قبل ما نسيب الشاشات فاضية للمستخدم
          _fetchExtendedDataFromServer(true);
          return;
        }
        // ✅ [FIX-2026-08-08] حتى لو فشل نداء أو أكتر بعد إعادة المحاولة،
        // نطبّق اللي نجح فعلاً بدل ما نسيب كل الكروت فاضية — أفضل من
        // "لا شيء" خالص، والمستخدم لسه بيشوف رسالة الخطأ عشان يعرف إن
        // في بيانات ناقصة ويقدر يضغط تحديث لاحقًا.
        APP.extLoaded = Object.keys(_mergedExtData).length > 0;
        if (APP.extLoaded) {
          _applyExtData(_mergedExtData);
        }
        showToast(
          (_extErrorResult && _extErrorResult.message) ||
            I18N.t("AUTH_MSG_LOAD_EXTENDED_ERROR"),
          "error",
        );
        var cbsErr = _extCallbacks.slice();
        _extCallbacks = [];
        cbsErr.forEach(function (fn) {
          fn();
        });
        return;
      }

      _applyExtData(_mergedExtData);
      _saveExtCache(_mergedExtData);
      APP.extLoaded = true;
      var cbs = _extCallbacks.slice();
      _extCallbacks = [];
      cbs.forEach(function (fn) {
        fn();
      });
    }

    DL.Core.getAllDataExtendedCore(
      APP.currentUser ? APP.currentUser.username : null,
      SESSION ? SESSION.token : null,
      {
        // [FIX-2026-08-08] كانت 20000 — بعد إضافة نداء getFinanceSummaryLight
        // الرابع المتوازي بقى في ضغط أكبر على قراءة نفس الـ Spreadsheet في
        // نفس اللحظة، فنداء core (الأهم لأنه مصدر cashBoxes) بقى بياخد وقت
        // أطول من 20 ثانية أحيانًا ويتحسب "عالق" غلط. رفعناها لـ 30000 زي
        // باقي التلاتة نداءات التانية بالظبط.
        timeout: 30000,
        onSuccess: function (result) {
          Object.assign(_mergedExtData, result.data || {});
          _coreDone = true;
          _checkAllDone();
        },
        onError: function (result) {
          _hadExtError = true;
          _extErrorResult = _extErrorResult || result;
          _coreDone = true;
          _checkAllDone();
        },
      },
    );

    DL.Core.getAccountingExtendedLazy(
      APP.currentUser ? APP.currentUser.username : null,
      SESSION ? SESSION.token : null,
      {
        timeout: 30000,
        onSuccess: function (result) {
          Object.assign(_mergedExtData, result.data || {});
          _lazyAccDone = true;
          _checkAllDone();
        },
        onError: function (result) {
          _hadExtError = true;
          _extErrorResult = _extErrorResult || result;
          _lazyAccDone = true;
          _checkAllDone();
        },
      },
    );

    DL.Core.getHRExtendedLazy(
      APP.currentUser ? APP.currentUser.username : null,
      SESSION ? SESSION.token : null,
      {
        timeout: 30000,
        onSuccess: function (result) {
          Object.assign(_mergedExtData, result.data || {});
          _lazyHrDone = true;
          _checkAllDone();
        },
        onError: function (result) {
          _hadExtError = true;
          _extErrorResult = _extErrorResult || result;
          _lazyHrDone = true;
          _checkAllDone();
        },
      },
    );

    // ✅ [PERF-FINANCE-LIGHT-2026-08-08] ملخّص خفيف لفواتير البيع/الشراء
    // (بدون lines_json) بالتوازي مع التلاتة اللي فوق — عشان كروت
    // "إيرادات/مبيعات اليوم" و"ذمم مدينة/دائنة" في الداشبورد التنفيذي
    // تلاقي بيانات حقيقية بدل ما تفضل صفر دايماً (كانت معتمدة على
    // saleInvoices/purchaseInvoices الكاملة اللي ON_DEMAND ومش بتتحمّل
    // إلا لما المستخدم يفتح شاشة الفواتير نفسها).
    DL.Core.getFinanceSummaryLight(
      APP.currentUser ? APP.currentUser.username : null,
      SESSION ? SESSION.token : null,
      {
        timeout: 20000,
        onSuccess: function (result) {
          Object.assign(_mergedExtData, result.data || {});
          _lazyFinDone = true;
          _checkAllDone();
        },
        onError: function (result) {
          _hadExtError = true;
          _extErrorResult = _extErrorResult || result;
          _lazyFinDone = true;
          _checkAllDone();
        },
      },
    );
  }

  /**
   * ensureExtendedData — يضمن إن بيانات المحاسبة/HR موجودة في APP.data
   * قبل ما الشاشة تعرضها، بدون ما يكرر نداء السيرفر لو كانت محمّلة فعلاً،
   * ولو في طلب شغال بالفعل (من أي مصدر: prefetch/silent/مرئي) بينضم لنفس الطابور.
   * @param {Function} cb يُستدعى لما البيانات تكون جاهزة
   * @param {boolean} [forceRefresh] لو true يتجاهل الكاش ويجيب نسخة جديدة
   */
  function ensureExtendedData(cb, forceRefresh, _isRetry) {
    cb = cb || function () {};

    // ✅ [FIX-EXT] لو extLoaded=true لكن البيانات اتمسحت بسبب silentRefresh
    // نكتشف ذلك بفحص حقل أساسي — لو فاضي نجبر re-fetch بدل ما نعرض شاشة فارغة
    if (APP.extLoaded && !forceRefresh) {
      // [FIX-EXT-INTACT] الفلاق _extLoadedFromServer وحده كافي للتحقق —
      // فحص محتوى المصفوفات كان بيسبب re-fetch غلط لمستخدمين جدد عندهم
      // بيانات فاضية بشكل طبيعي (مثلاً: مفيش قيود محاسبية بعد).
      var extDataIntact = APP.data && APP.data._extLoadedFromServer === true;
      if (!extDataIntact) {
        // البيانات الموسعة اتمسحت أو جت فاضية — أعد التحميل
        APP.extLoaded = false;
        try {
          localStorage.removeItem(EXT_CACHE_KEY);
        } catch (e) {}
      }
    }

    if (APP.extLoaded && !forceRefresh) {
      cb();
      return;
    }

    if (!forceRefresh) {
      var cached = _loadExtCache();
      if (cached) {
        _applyExtData(cached);
        APP.extLoaded = true;
        cb();
        return;
      }
    }

    // لو في طلب شغال فعلاً (سواء silent prefetch أو طلب مرئي أو preload)
    // اكتفِ بالانتظار عليه بدل تكرار النداء — طابور واحد مشترك للجميع
    if (APP.extLoading) {
      _extCallbacks.push(cb);
      if (typeof showFABMessage === "function") {
        showFABMessage("⏳ جاري تحضير البيانات...", 3000);
      }
      return;
    }

    _extCallbacks.push(cb);
    // [SKELETON] الـ skeleton screen في محتوى الصفحة يكفي كـ visual feedback
    _fetchExtendedDataFromServer(_isRetry);
  }

  /** يُستخدم لزر "تحديث" اليدوي في شاشات المحاسبة/HR، وأيضاً لأي إعادة تحميل
   * إجبارية للحزمة الموسعة (زي `_reloadCashBoxesFromServer` سابقاً في المحاسبة) */
  function refreshExtendedData(cb) {
    try {
      localStorage.removeItem(EXT_CACHE_KEY);
    } catch (e) {}
    APP.extLoaded = false;
    ensureExtendedData(cb, true);
  }

  // ─────────────────────────────────────────────────────────────
  // §E-SILENT-EXT  Background Prefetch للبيانات الموسعة (HR + محاسبة)
  //
  // ─────────────────────────────────────────────────────────────
  // §PRELOAD-ALL  تحميل كل البيانات بعد تسجيل الدخول مباشرةً
  //
  // الهدف: ضمان إن 100% من البيانات (أساسية + موسعة) تكون محملة
  // في الكاش قبل ما المستخدم يفتح أي شاشة — بدون spinner مزعج.
  // يُستدعى من 02_JS_UI_Shell بعد اللوجين مباشرة.
  // ─────────────────────────────────────────────────────────────
  var _preloadDone = false;

  // [DATA-LOADING-ENGINE / المرحلة 2+3] هذه الدالة كانت بتحمّل الحزمة
  // الموسعة كاملة (محاسبة + HR — 19 حقل، EXT_FIELDS فوق) لكل مستخدم فور
  // تسجيل الدخول، حتى لو مادخلش أي شاشة محاسبة/HR طول الجلسة — ده بالتعريف
  // بيانات "المستوى الثاني: On Demand" وكانت بتتحمّل وقت "المستوى الأول:
  // Critical". كل الشاشات اللي محتاجة الحزمة الموسعة (11_JS_Accounting،
  // 12_JS_HR، 27_JS_Manufacturing، 15_JS_Invoices، 07_JS_Shipping...) بتنادي
  // ensureExtendedData() بنفسها أول ما تُفتح، وensureExtendedData أصلاً بتتعامل
  // مع حالة "طلب شغال بالفعل" أو "متخزّن في sessionStorage" فمفيش تكرار —
  // فمفيش داعي لتحميلها مسبقًا لـ 100% من المستخدمين. الفرق الوحيد دلوقتي:
  // أول فتح لشاشة موسعة في الجلسة بيستنى نداء ensureExtendedData العادي
  // (نفس النداء اللي كان بيحصل هنا) بدل ما يلاقيه جاهز من قبل — مفيش أي
  // تغيير في Business Logic أو في العقد بين الشاشة والداتا.
  function _preloadAllAfterLogin() {
    if (_preloadDone) return;
    _preloadDone = true;

    // ── المستوى 1 (Critical) فقط: البيانات الأساسية ──
    // لو لسه مطلوبة (نادراً — عادة بتكون اتحمّلت وقت اللوجين نفسه) اطلبها
    // بدون ما ننتظرها هنا أو نجرّ معاها الحزمة الموسعة.
    var basicReady = APP.data && APP.data._loaded;
    if (!basicReady && !APP.loading) {
      loadAllData(null, true);
    }

    // [REBUILD-2026-08-07 / UDE] بدل موجات setTimeout بتوقيتات ثابتة
    // مخمَّنة (4s/9s/14s/19s) اللي كانت بتحاول تحزر معاد "خلوّ" الشبكة،
    // UDE.warmup() بتجيب مستوى ON_DEMAND (2) فورًا ثم BACKGROUND (3)
    // وREFERENCE (4) في وقت فراغ المتصفح الفعلي (requestIdleCallback) —
    // مش وقت متخيَّل. أي شاشة يفتحها المستخدم قبل ما warmup() يخلص
    // هتضمن بياناتها بنفسها عبر UDE.ensurePage() في renderPage()، فمفيش
    // أي احتمال "شاشة فاضية للأبد" حتى لو حصل تزاحم فعلي في الشبكة.
    UDE.warmup();

    // [EXT-PRELOAD] الحزمة الموسعة (محاسبة/HR/تصنيع/فواتير/شحن —
    // ensureExtendedData/EXT_FIELDS) نظام منفصل عن مستويات UDE
    // (2/3/4)، فلسه محتاج نداءه الخاص. بنسيبه في idle تاني بعد warmup()
    // بدل رقم ثواني مخمَّن، عشان ميتزاحمش مع مستوى ON_DEMAND الحرج.
    (
      (typeof requestIdleCallback === "function" && requestIdleCallback) ||
      function (fn) {
        setTimeout(fn, 2500);
      }
    )(function () {
      _silentPrefetchExtended();
    });

    // [VC-PRELOAD] المحافظ الإلكترونية والحضور — تأثيرهم أخف بكتير من
    // بيانات الشاشات الأساسية، فبنسيبهم خلفية متأخرة بسيطة زي ما كانوا.
    setTimeout(function () {
      if (typeof _vcPreload === "function") _vcPreload();
    }, 6000);
    setTimeout(function () {
      if (typeof _attPreload === "function") _attPreload();
    }, 8000);
  }

  // يُستدعى بعد تسجيل الدخول بثانيتين في الخلفية بدون أي UI/Freeze
  // الهدف: لما المستخدم يفتح أي شاشة HR/محاسبة يلاقي الكاش جاهز
  // لو فشل: يفشل صامتاً — ensureExtendedData ستكمل طبيعي لو احتاج
  // [DATA-UNIFY-2] بقت مجرد نداء صامت لـ ensureExtendedData بدل نسخة
  // مستقلة من منطق الجلب — نفس الطابور، نفس علم extLoading.
  // ─────────────────────────────────────────────────────────────
  function _silentPrefetchExtended() {
    if (APP.extLoaded || APP.extLoading) return;
    ensureExtendedData(function () {});
  }

  // ─────────────────────────────────────────────────────────────
  // 💾  نظام أنيميشن الحفظ الاحترافي — Save Animation System
  // ─────────────────────────────────────────────────────────────
  var _saveAnim = { el: null, timer: null, hideTimer: null };

  // [FIX-UI] showSaveAnim — يستخدم نفس الـ bubble بدون صندوق ثانٍ
  function showSaveAnim(options) {
    options = options || {};
    var title = options.title || "جاري الحفظ...";
    var emoji = options.emoji || "💾";

    _closeSaveAnim(true);

    // أظهر حالة التحميل في الـ bubble مباشرة
    var bubble = _ensureBubble();
    if (_aiFabToastTimer) {
      clearTimeout(_aiFabToastTimer);
      _aiFabToastTimer = null;
    }
    if (_fabMsgTimer) {
      clearTimeout(_fabMsgTimer);
      _fabMsgTimer = null;
    }
    if (_saveAnim.hideTimer) {
      clearTimeout(_saveAnim.hideTimer);
      _saveAnim.hideTimer = null;
    }
    var seq = ++_aiFabToastSeq;
    _saveAnim._bubbleSeq = seq;

    bubble.style.animation = "none";
    bubble.style.display = "none";
    bubble.offsetHeight;
    bubble.setAttribute("data-type", "info");
    bubble.setAttribute("data-freeze", "save");
    bubble.innerHTML =
      '<span class="fab-bubble-stem"></span>' +
      '<span style="display:inline-flex;align-items:center;gap:8px;direction:rtl">' +
      '<span style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(37,99,235,0.25);border-top-color:#2563eb;animation:__spin 0.7s linear infinite;flex-shrink:0;display:inline-block"></span>' +
      '<span style="font-size:13px;font-weight:600">' +
      emoji +
      " " +
      title +
      "</span>" +
      "</span>";

    bubble.style.visibility = "hidden";
    bubble.style.display = "block";
    bubble.offsetHeight;
    _positionBubble(bubble);
    bubble.style.visibility = "";
    bubble.style.animation =
      "fabBubbleIn 0.38s cubic-bezier(0.34,1.4,0.64,1) forwards";

    _saveAnim.el = bubble; // نشير للـ bubble بدل overlay منفصل

    return {
      done: function (msg) {
        _saveAnimSuccess(msg);
      },
      fail: function (msg) {
        _saveAnimFail(msg);
      },
    };

  // [FIX-UI] _saveAnimSuccess — يغير الـ bubble لرسالة نجاح ناعمة
  function _saveAnimSuccess(msg) {
    if (!msg) {
      _closeSaveAnim(true);
      return;
    }
    var bubble = document.getElementById("ai-fab-bubble");
    if (!bubble) return;

    if (_saveAnim.timer) {
      clearTimeout(_saveAnim.timer);
      _saveAnim.timer = null;
    }

    // نُبقي data-freeze="success" حتى يتعرف عليه _closeSaveAnim
    bubble.setAttribute("data-type", "success");
    bubble.setAttribute("data-freeze", "success");
    bubble.innerHTML =
      '<span class="fab-bubble-stem"></span>' +
      '<span class="fab-bubble-icon">✅</span>' +
      '<span class="fab-bubble-text">' +

      "</span>";

    bubble.style.animation = "none";
    bubble.offsetHeight;
    bubble.style.animation = "fabBubbleSuccess 0.35s ease forwards";

    _saveAnim.timer = setTimeout(function () {
      _closeSaveAnim(false);

  // [FIX-UI] _saveAnimFail — bubble خطأ
  function _saveAnimFail(msg) {
    var bubble = document.getElementById("ai-fab-bubble");
    if (!bubble) return;

    if (_saveAnim.timer) {
      clearTimeout(_saveAnim.timer);
      _saveAnim.timer = null;
    }

    bubble.setAttribute("data-type", "error");
    bubble.setAttribute("data-freeze", "success"); // نفس المفتاح حتى يُغلقه _closeSaveAnim
    bubble.innerHTML =
      '<span class="fab-bubble-stem"></span>' +

      "</span>";

    bubble.style.animation = "none";
    bubble.offsetHeight;

  // [FIX-UI] _closeSaveAnim — يخفي الـ bubble
  function _closeSaveAnim(immediate) {
    if (_saveAnim.timer) clearTimeout(_saveAnim.timer);
    _saveAnim.timer = null;
    if (_saveAnim.hideTimer) clearTimeout(_saveAnim.hideTimer);
    _saveAnim.hideTimer = null;
    _saveAnim.el = null;

    var bubble = document.getElementById("ai-fab-bubble");
    if (!bubble) return;
    var freeze = bubble.getAttribute("data-freeze");
    if (freeze !== "save" && freeze !== "success") return;
    bubble.removeAttribute("data-freeze");

    if (immediate) {
      bubble.style.display = "none";
      return;
    }
    bubble.style.animation =
      "fabBubbleOut 0.28s cubic-bezier(0.55,0,1,0.8) forwards";
    // [FIX-UI] نسجّل التايمر ده حتى لو ظهرت رسالة (Toast) جديدة بعده مباشرة
    // نقدر نلغيه قبل ما يقفل الـ bubble الجديد بالغلط (كان بيقفل رسائل الخطأ
    // اللي بتيجي فورًا بعد unfreeze() قبل ما المستخدم يقدر يقراها).
    _saveAnim.hideTimer = setTimeout(function () {
      bubble.style.display = "none";
      _saveAnim.hideTimer = null;
    }, 300);
  }

  // [UX] _saveAnimUpdating — يحوّل نفس الـ bubble لحالة "جار التحديث"
  // (سبينر + نص) بدون قفل/إعادة فتح — استخدامها بعد رسالة نجاح الحفظ
  // مباشرة، أثناء مزامنة البيانات الحقيقية مع السيرفر في الخلفية، حتى
  // يفهم المستخدم إن فيه عملية شغّالة فعلاً ولا تختفي الرسالة فجأة بلا تفسير.
  function _saveAnimUpdating(msg) {
    var bubble = _ensureBubble();

    // ✅ نلغي أي تايمر إغلاق معلّق من رسالة النجاح اللي قبلها
    if (_saveAnim.timer) {
      clearTimeout(_saveAnim.timer);
      _saveAnim.timer = null;
    }

    bubble.setAttribute("data-type", "info");
    bubble.setAttribute("data-freeze", "save"); // نفس مفتاح showSaveAnim حتى يتعرف عليه _closeSaveAnim
    bubble.innerHTML =
      '<span class="fab-bubble-stem"></span>' +
      '<span style="display:inline-flex;align-items:center;gap:8px;direction:rtl">' +
      '<span style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(37,99,235,0.25);border-top-color:#2563eb;animation:__spin 0.7s linear infinite;flex-shrink:0;display:inline-block"></span>' +
      '<span style="font-size:13px;font-weight:600">🔄 ' +
      (msg || "جار التحديث...") +
      "</span>" +
      "</span>";

    // لو الـ bubble كانت مقفولة بالفعل (مش حالة شائعة) — أظهرها بمكانها الصحيح
    if (!bubble.style.display || bubble.style.display === "none") {
      bubble.style.animation = "none";
      bubble.style.visibility = "hidden";
      bubble.style.display = "block";
      bubble.offsetHeight;
      _positionBubble(bubble);
      bubble.style.visibility = "";
      bubble.style.animation =
        "fabBubbleIn 0.3s cubic-bezier(0.34,1.4,0.64,1) forwards";
    }
    _saveAnim.el = bubble;
  }

  // ─────────────────────────────────────────────────────────────
  // 🚀  reloadAfterMutation v4.2 — Optimistic Update
  //
  // بدلاً من مسح الكاش وجلب كل البيانات من الباكيند بعد كل عملية:
  //   1. نحدّث APP.data محلياً فوراً (Optimistic Update)
  //   2. نعرض الـ UI المحدّث بدون انتظار
  //   3. في الخلفية نجلب getAllData() لمزامنة الحقيقة مع الباكيند
  //
  // @param {Function|null}  cb           - callback بعد تحديث UI
  // @param {Function|null}  unfreeze     - تحرير الـ freeze بعد الانتهاء
  // @param {Object|null}    animOptions  - خيارات أنيميشن الحفظ
  // @param {Object|null}    optimisticPatch - { collection, record, op: 'add'|'update'|'remove', idField }
  //   collection: اسم المصفوفة في APP.data (مثلاً "items", "groups")
  //   record: الكائن الجديد/المعدّل
  //   op: العملية ('add', 'update', 'remove')
  //   idField: اسم حقل الـ id (افتراضي 'id')
  // ─────────────────────────────────────────────────────────────
  function reloadAfterMutation(cb, unfreeze, animOptions, optimisticPatch) {
    // [SOFT-SAVE / SE-BUBBLE-FIX] لو الشاشة بتستخدم SaveEngine.run بالفعل
    // (اللي بيدير فقاعة "جار الحفظ → جار التحديث → تم الحفظ" لوحده)، تمرير
    // animOptions === false هنا يمنع reloadAfterMutation من فتح/تصفير نفس
    // الفقاعة مرة ثانية (كان بيقفلها فجأة ويعيد فتحها بنص افتراضي، وبعدين
    // SaveEngine.LoadingService.hide() كان بيقفلها هي كمان فورًا — فكان
    // المستخدم بيشوف الرسالة "بتختفي" ثم رسالة النجاح "بتظهر" بعد فجوة
    // فاضية بدل انتقال سلس). في الوضع الصامت: نعمل فقط الـ optimistic
    // patch + إعادة الرسم + المزامنة الخلفية، من غير أي فقاعة هنا إطلاقًا.
    var silent = animOptions === false;
    var anim = silent
      ? { done: function () {}, fail: function () {} }
      : showSaveAnim(animOptions);

    // ── Optimistic Update: حدّث الكاش المحلي فوراً ──────────────
    if (optimisticPatch && _cache.data) {
      try {
        var col = optimisticPatch.collection;
        var rec = optimisticPatch.record;
        var op = optimisticPatch.op || "update";
        var idField = optimisticPatch.idField || "id";
        var arr = _cache.data[col] || [];

        if (op === "add") {
          _cache.data[col] = arr.concat([rec]);
        } else if (op === "update") {
          _cache.data[col] = arr.map(function (item) {
            return String(item[idField]) === String(rec[idField]) ? rec : item;
          });
        } else if (op === "remove") {
          _cache.data[col] = arr.filter(function (item) {
            return String(item[idField]) !== String(rec[idField]);
          });
        }

        APP.data = _cache.data;
        // حدّث الكاش الثابت (لأن البيانات الثابتة هي الأكثر تعديلاً)
        _cache.static_ts = Date.now();
        _saveCacheOptimistic({});
      } catch (patchErr) {
        console.warn("optimisticPatch error:", patchErr);
      }
    }

    // ── تحديث UI فوري من الكاش المحلّي ──────────────────────────
    // [PERF-FIX-1] تحديث الـ UI فوراً بدون setTimeout — الـ optimisticPatch
    // حدّث APP.data بالفعل، فلا يوجد سبب للانتظار 800ms قبل رسم الشاشة.
    // نُبقي على requestAnimationFrame بدلاً من setTimeout لضمان رسم نظيف
    if (!silent) {
      var _animMsg =
        animOptions && animOptions.successMsg != null
          ? animOptions.successMsg
          : "تم الحفظ بنجاح ✓";
      if (_animMsg) {
        anim.done(_animMsg);
      } else {
        _closeSaveAnim(true);
      }
    }
    (window.requestAnimationFrame || setTimeout)(function () {
      if (cb) cb();
      else renderPage(APP.currentPage);
      updateAlertBadge();
      if (unfreeze) unfreeze();
    });

    // ── مزامنة خلفية مع الباكيند ─────────────────────────────────
    // [PERF-FIX-2] نبدأ المزامنة مبكراً (300ms بدلاً من 1200ms)
    // الـ UI اتحدّث فعلاً من الـ Optimistic Update، وبقدر نبدأ السيرفر call بسرعة
    // بدون أثر على UX — أسرع تحديث للبيانات الحقيقية
    setTimeout(function () {
      if (_cache.fetching) return;
      _cache.fetching = true;
      // ✅ [FIX] شيلنا استدعاء _saveAnimUpdating() هنا:
      // بما إن addGroup/updateGroup (وكل عمليات الحفظ التانية) بتستدعي
      // _invalidateServerCache() عقب كل نجاح، فأي getAllData() جاي فورًا
      // بعدها هيكون Cache MISS مضمون، وهيضطر يقرا كل الشيتات من جديد —
      // ده بياخد وقت أطول بكتير من الـ Optimistic Update اللي ظهر فورًا
      // في الجدول. فكان المستخدم بيشوف السطر الجديد ظاهر، ومع ذلك رسالة
      // "جار التحديث..." لسه شغالة لثواني كمان — بتوهم إن فيه حاجة عالقة
      // مع إن الحفظ خلص فعليًا. المزامنة الخلفية دلوقتي صامتة بالكامل؛
      // هتفشل أو تنجح من غير ما تفضل معلّقة رسالة على الشاشة.
      DL.Core.getAllData({
        label: "Auth.backgroundSync",
        onSuccess: function (result) {
          _cache.fetching = false;
          _closeSaveAnim(false); // ✅ يقفل بهدوء بعد اكتمال التحديث الحقيقي
          var d = result.data;
          if (!d || typeof d !== "object") return;
          try {
            var fresh = _parseData(d);
            _saveCache(fresh);
            _applyFreshData(fresh);
            // لا تعمل re-render لصفحات الوارد/الصادر/التحويل
            // عشان متمسحش الفورم لو المستخدم شغّال عليه
            var _noRerender = ["tx_in", "tx_out", "tx_transfer"];
            // [PERF-FIX-BGS] تحقق من إن المستخدم مش بيكتب في أي حقل قبل الـ re-render
            var _bgActiveEl = document.activeElement;
            var _bgUserTyping =
              _bgActiveEl &&
              (_bgActiveEl.tagName === "INPUT" ||
                _bgActiveEl.tagName === "TEXTAREA" ||
                _bgActiveEl.tagName === "SELECT" ||
                _bgActiveEl.isContentEditable);
            if (_noRerender.indexOf(APP.currentPage) === -1 && !_bgUserTyping) {
              // [PERF-FIX-BGS] وسّم كـ silent refresh عشان يتجنب الـ fade flicker
              APP._fromSilentRefresh = true;
              renderPage(APP.currentPage);
              APP._fromSilentRefresh = false;
            }
            updateAlertBadge();
            updateNotifBell();
          } catch (e) {
            console.warn("Background sync error:", e);
          }
        },
        onError: function (result) {
          _cache.fetching = false;
          _closeSaveAnim(true); // ✅ يقفل فوراً — الحفظ الأصلي نجح، دي مجرد مزامنة خلفية فشلت
          console.warn("Background sync failed:", result.message);
          // عند الفشل: أعد مسح الكاش ليُجبر المستخدم على refresh حقيقي
          _cache.data = null;
          _cache.ts = 0;
        },
      });
    }, 300); // [PERF-FIX-2] 300ms بدلاً من 1200ms
  }

  // ─────────────────────────────────────────────────────────────
  // reloadAfterMutationFull — للحالات التي نحتاج فيها تحديثاً كاملاً
  // (مثل: استيراد Excel، تعديل الرصيد الافتتاحي، backup)
  // ─────────────────────────────────────────────────────────────
  function reloadAfterMutationFull(cb, unfreeze, animOptions) {
    _cache.data = null;
    _cache.ts = 0;
    try {
      localStorage.removeItem("wms_cache");
      localStorage.removeItem("wms_cache_static");
      localStorage.removeItem("wms_cache_dynamic");
    } catch (e) {}

    var anim = showSaveAnim(animOptions);

    DL.Core.getAllDataFresh({
      label: "Auth.reloadAfterMutationFull",
      onSuccess: function (result) {
        var d = result.data;
        if (!d || typeof d !== "object") {
          anim.fail("البيانات المستلمة غير صحيحة");
          if (unfreeze) setTimeout(unfreeze, 1700);
          return;
        }
        try {
          var fresh = _parseData(d);
          _saveCache(fresh);
          _applyFreshData(fresh);
        } catch (parseErr) {
          anim.fail("خطأ في معالجة البيانات");
          if (unfreeze) setTimeout(unfreeze, 1700);
          return;
        }
        anim.done(
          (animOptions && animOptions.successMsg) || "تم الحفظ بنجاح ✓",
        );
        // [PERF-FIX-3] لا حاجة لـ 1200ms إضافية — البيانات وصلت بالفعل من السيرفر
        // نعرض الـ UI فوراً بعد رسم الـ animation frame
        (window.requestAnimationFrame || setTimeout)(function () {
          if (cb) cb();
          else renderPage(APP.currentPage);
          updateAlertBadge();
          if (unfreeze) unfreeze();
        });
      },
      onError: function (result) {
        anim.fail("خطأ: " + (result.message || "حاول مرة أخرى"));
        setTimeout(function () {
          if (unfreeze) unfreeze();
          loadAllData();
        }, 1700);
      },
    });
  }

  // دمج مجموعات التنقل مع النظام الحالي
  function _initERPNavGroups() {
    if (typeof NAV_GROUPS !== "undefined") {
      var existingGroups = {};
      var existingPages = {};
      NAV_GROUPS.forEach(function (g) {
        existingGroups[g.group] = true;
        (g.items || []).forEach(function (it) {
          existingPages[it.page] = true;
        });
      });

      // إدراج مجموعات المحاسبة وHR بعد Dashboard
      var dashboardIdx = NAV_GROUPS.findIndex(function (g) {
        return (
          g.items &&
          g.items.some(function (i) {
            return i.page === "dashboard";
          })
        );
      });

      ERP_NAV_GROUPS.forEach(function (group, i) {
        var filteredItems = (group.items || []).filter(function (it) {
          return !existingPages[it.page];
        });
        if (!filteredItems.length) return;

        // ⚠️ [FIX] لو القسم موجود مسبقًا في NAV_GROUPS (مثل "الموارد البشرية"
        // المضاف يدويًا في 02_JS_UI_Shell.html)، كان الكود القديم يتجاهل
        // القسم بالكامل ولا يضيف عناصره الجديدة (مثل "مراحل الإنتاج") إطلاقًا،
        // فتختفي الصفحة بصمت من السايد بار رغم أنها مسجّلة وتعمل فعليًا.
        // الحل: لو القسم موجود، ندمج العناصر الناقصة داخله بدل تجاهله بالكامل.
        if (existingGroups[group.group]) {
          var existingGroupObj = NAV_GROUPS.filter(function (g) {
            return g.group === group.group;
          })[0];
          if (existingGroupObj) {
            existingGroupObj.items = (existingGroupObj.items || []).concat(
              filteredItems,
            );
            filteredItems.forEach(function (it) {
              existingPages[it.page] = true;
            });
          }
          return;
        }

  // ─────────────────────────────────────────────────────────────
  // 🛡️  شبكة أمان عامة للأخطاء — GLOBAL ERROR SAFETY NET
  //
  // الهدف: أي خطأ غير متوقع في أي مكان في السيستم (استثناء JS لم
  // يُعالَج، أو Promise مرفوض من غير .catch) لازم يظهر للمستخدم
  // برسالة واضحة بدل ما يفضل صامت (أو صوت بس من غير رسالة تشرح السبب).
  // ده مش بديل عن معالجة الأخطاء الصحيحة في كل شاشة (SaveEngine/
  // withFailureHandler) — ده خط دفاع أخير بس لأي حاجة فلتت منهم.
  // ─────────────────────────────────────────────────────────────
  (function () {
    var _lastGlobalErrAt = 0;
    function _notifyGlobalError(message) {
      // منع إغراق المستخدم بعشرات الرسايل لو نفس الخطأ بيتكرر كل فريم
      var now = Date.now();
      if (now - _lastGlobalErrAt < 1200) return;
      _lastGlobalErrAt = now;
      if (typeof showToast === "function") {
        showToast(
          I18N.t("SHELL_MSG_ERROR_ICON_PREFIX") + " " + message,
          "error",
        );
      }
      if (typeof _unfreezeUI === "function") {
        try {
          _unfreezeUI();
        } catch (e) {}
      }
    }

    window.addEventListener("error", function (e) {
      var msg = (e && (e.message || (e.error && e.error.message))) || "";
      _notifyGlobalError(msg || I18N.t("SHELL_ERR_UNEXPECTED_PAGE"));
    });

    window.addEventListener("unhandledrejection", function (e) {
      var reason = e && e.reason;
      var msg =
        (reason && (reason.message || String(reason))) ||
        I18N.t("SHELL_ERR_UNEXPECTED_REQUEST");
      _notifyGlobalError(msg);
    });
  })();

  // ─────────────────────────────────────────────────────────────
  // 🔊  صوت زر تسجيل الدخول — مستقل عن AudioService (21_JS_AudioService.html)
  //
  // السبب: AudioService بيتحمّل Lazy (بعد نجاح الدخول ضمن حزمة الشاشة
  // الكاملة)، يعني هيكون undefined وقت أول ضغطة فعلية على "دخول" في
  // صفحة اللوجين نفسها. عشان الصوت يشتغل من أول محاولة دخول بدون ما
  // ننتظر تحميل الحزمة الكاملة، الدالة دي مستقلة بالكامل (Web Audio API
  // مباشرة، بدون أي اعتماد خارجي) وبتستخدم نفس نغمة "system.login"
  // الموجودة في AudioService (392→523→659→784Hz، sine صاعد هادي) عشان
  // يفضل الإحساس الصوتي متسق مع باقي النظام بعد الدخول.
  // ─────────────────────────────────────────────────────────────
  var _loginAudioCtx = null;
  function _playLoginChime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!_loginAudioCtx) _loginAudioCtx = new Ctx();
      var ctx = _loginAudioCtx;
      if (ctx.state === "suspended" && typeof ctx.resume === "function") {
        ctx.resume();
      }
      var notes = [
        { f: 392, t: 0, d: 0.1, v: 0.16 },
        { f: 523, t: 0.09, d: 0.1, v: 0.18 },
        { f: 659, t: 0.18, d: 0.1, v: 0.2 },
        { f: 784, t: 0.27, d: 0.18, v: 0.22 },
      ];
      notes.forEach(function (n) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = n.f;
        var startAt = ctx.currentTime + n.t;
        var endAt = startAt + n.d;
        gain.gain.setValueAtTime(0, startAt);
        gain.gain.linearRampToValueAtTime(n.v, startAt + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, endAt);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startAt);
        osc.stop(endAt + 0.02);
      });
    } catch (eAudio) {
      /* الصوت اختياري بالكامل — أي فشل فيه (مثلاً متصفح مش داعم) ميوقفش تسجيل الدخول */
    }
  }

  // ---------- Auth ----------

  function bindLogin() {
    // ⛔ [FIX-CONSOLE-NOISE] اتشال استدعاء _startPrefetch() اللي كان هنا:
    // render() بيمسح SESSION.token دايمًا قبل ما ينده bindLogin() في حالة
    // عدم وجود مستخدم مسجّل دخول، فالاستدعاء ده كان بيفشل 100% من المرات
    // بـ "session required" ومكانش بيعمل حاجة غير إنه يملا الـ console
    // بتحذيرات (Auth.prefetch.light / Auth.prefetch.full). البيانات
    // بتتحمّل عادي وبسرعة بعد نجاح تسجيل الدخول فعليًا (عبر
    // _preloadAllAfterLogin()).

    var btn = document.getElementById("btn-login");
    var pass = document.getElementById("l-pass");
    var user = document.getElementById("l-user");
    btn.addEventListener("click", doLogin);

    // [FIX-VERSION-DYNAMIC] رقم الإصدار بيتجاب دايمًا لايف من ابب سكريبت
    // (ping()) مش من القيمة المحقونة وقت الـ build الثابت — عشان يفضل
    // مطابق لحظيًا لآخر تحديث فعلي على السيرفر حتى لو حد نسي يعمل rebuild
    // لنسخة Vercel بعد ما غيّر APP_VERSION. القيمة المحقونة وقت البناء
    // (لو موجودة) بتفضل تظهر فورًا كـ placeholder سريع لحد ما رد ping()
    // يوصل ويستبدلها بالرقم الحقيقي — مفيش شاشة فاضية أو تأخير محسوس.
    var verEl = document.querySelector(".login-ver");
    if (verEl && typeof _gsr === "function") {
      _gsr("ping", [], {
        onSuccess: function (res) {
          var v = res && res.data && res.data.version;
          if (v) verEl.textContent = "v" + v;
        },
        onError: function () {}, // صامت — مجرد تحسين تجميلي، مش حرج
      });
    }

    // ✅ ربط زر "نسيت كلمة المرور؟" بشاشة الاستعادة (39_JS_ForgotPassword.html)
    if (typeof bindForgotPasswordLink === "function") bindForgotPasswordLink();
    pass.addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });
    user.addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });

    // ── تأثير التركيز على الحقول (يلوّن الـ label عند الكتابة) ──
    [
      ["fld-user", "l-user"],
      ["fld-pass", "l-pass"],
    ].forEach(function (pair) {
      var fieldEl = document.getElementById(pair[0]);
      var inputEl = document.getElementById(pair[1]);
      if (!fieldEl || !inputEl) return;
      inputEl.addEventListener("focus", function () {
        fieldEl.classList.add("focused");
      });
      inputEl.addEventListener("blur", function () {
        fieldEl.classList.remove("focused");
      });
    });

    // ── إظهار/إخفاء كلمة المرور ──────────────────────────────
    var eyeBtn = document.getElementById("l-pass-toggle");
    if (eyeBtn) {
      eyeBtn.addEventListener("click", function () {
        var icon = document.getElementById("l-pass-eye-icon");
        if (pass.type === "password") {
          pass.type = "text";
          if (icon) {
            icon.classList.remove("eye-state-open");
            icon.classList.add("eye-state-closed");
          }
        } else {
          pass.type = "password";
          if (icon) {
            icon.classList.remove("eye-state-closed");
            icon.classList.add("eye-state-open");
          }
        }
        pass.focus();
      });
    }

    // ── تأثير Ripple عند الضغط على زر الدخول ─────────────────
    btn.addEventListener("click", function (e) {
      var rect = btn.getBoundingClientRect();
      var size = 220;
      var r = document.createElement("span");
      r.className = "login-ripple";
      r.style.width = size + "px";
      r.style.height = size + "px";
      r.style.left = e.clientX - rect.left - size / 2 + "px";
      r.style.top = e.clientY - rect.top - size / 2 + "px";

        r.remove();
      }, 600);

    _setLoginGreeting();
    _initLoginSlideshow();

  // ── رسالة ترحيب حسب وقت اليوم ───────────────────────────────

  // ── HTML الداخلي لزر الدخول (مستخدَم لإعادة الزر لحالته الطبيعية) ──
  function _loginBtnHTML(text, locked) {

      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>' +

  // ── العرض المتحرك (Slideshow) لموديولات النظام — شاشة الدخول ──
  // ينقل تلقائياً كل 5 ثوانٍ بين الشرائح، مع إمكانية الانتقال اليدوي
  // بالضغط على إحدى النقاط (dots). يتوقف تلقائياً لو الـ stage اتشال
  // من الصفحة (تسجيل دخول ناجح / إعادة render).
  var _loginSlideTimer = null;
  function _initLoginSlideshow() {
    var stage = document.getElementById("show-stage");
    var nav = document.getElementById("show-nav");
    if (!stage || !nav) return;

    var slides = Array.prototype.slice.call(stage.querySelectorAll(".slide"));
    var dots = Array.prototype.slice.call(nav.querySelectorAll(".show-dot"));
    var total = slides.length;
    if (!total) return;

    var current = slides.findIndex(function (s) {
      return s.classList.contains("active");
    });
    if (current < 0) current = 0;

    if (_loginSlideTimer) {
      clearTimeout(_loginSlideTimer);
      _loginSlideTimer = null;
    }

    function goTo(i) {
      if (!document.body.contains(stage)) return; // الصفحة اتغيّرت
      slides[current].classList.remove("active");
      if (dots[current]) {
        dots[current].classList.remove("current");
        dots[current].classList.add("done");
      }
      current = i;
      dots.forEach(function (d, idx) {
        d.classList.remove("current");
        if (idx < current) d.classList.add("done");
        else d.classList.remove("done");
      });
      slides[current].classList.add("active");
      if (dots[current]) dots[current].classList.add("current");
      restart();
    }

    function next() {
      goTo((current + 1) % total);
    }

    function restart() {
      clearTimeout(_loginSlideTimer);
      // ✅ توقّف تلقائي لو شاشة الدخول اتشالت (دخول ناجح/تغيير صفحة)
      _loginSlideTimer = setTimeout(function () {
        if (!document.body.contains(stage)) return;
        next();
      }, 5000);
    }

    dots.forEach(function (d, idx) {
      d.addEventListener("click", function () {
        goTo(idx);
      });
    });

    restart();
  }

  // ─────────────────────────────────────────────────────────────

  var SESSION = {

  function _initSession(loginResponse) {
