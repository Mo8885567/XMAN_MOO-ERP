    try {
      // [FIX-MULTITAB-LOGOUT] localStorage بدل sessionStorage: التوكن بقى
      // مشترك بين كل تابات نفس المتصفح بدل ما كل تاب يعمل جلسة منفصلة —
      // ده كان بيسبب تسجيل خروج تلقائي لأي تاب قديم بمجرد ما عدد التابات
      // المفتوحة (كل واحد جلسة مستقلة) يتخطى SESSION_CONFIG.MAX_SESSIONS_PER_USER.
      localStorage.setItem("wms_session_token", SESSION.token);
      localStorage.setItem("wms_session_expires", String(SESSION.expiresAt));
      localStorage.setItem("wms_session_idle_min", String(SESSION.idleTimeout));
    } catch (e) {}
    _startIdleWatcher();
    _startSessionCountdown();
  }

  function _restoreSession() {
    try {
      var token = localStorage.getItem("wms_session_token");
      var expires = parseInt(
        localStorage.getItem("wms_session_expires") || "0",
      );
      var idle = parseInt(localStorage.getItem("wms_session_idle_min") || "60");
      if (token && expires && Date.now() < expires) {
        SESSION.token = token;
        SESSION.expiresAt = expires;
        SESSION.idleTimeout = idle;
        return true;
      }
    } catch (e) {}
    return false;
  }

  // ─────────────────────────────────────────────────────────────
  // [SESSION-POLL-FIX] الحل الجذري لتكرار أخطاء "جلسة غير صالحة" في
  // الكونسول بعد انتهاء/بطلان الجلسة:
  //
  // المشكلة: النظام فيه أكتر من مؤقت خلفي مستقل (إشعارات، فيدباك التحديثات
  // UM.refreshFeed، فودافون كاش، واتساب...) كل واحد بيعمل setInterval خاص
  // بيه ويفضل شغال حتى بعد ما _handleSessionExpired تعمل تسجيل خروج نظيف
  // وترجّع شاشة الدخول — لأن _clearSession كانت بتوقف بس مؤقت الخمول
  // ومؤقت العد التنازلي، وتسيب باقي المؤقتات الخلفية شغالة، فكل واحد فيهم
  // يفضل يضرب السيرفر كل بضع ثوانٍ/دقائق ويطلع نفس خطأ الجلسة من جديد —
  // تكرار لا نهائي في الكونسول لحد ما المستخدم يعمل refresh يدوي للصفحة.
  //
  // الحل: أي مؤقت polling خلفي (مش مؤقتات الواجهة قصيرة العمر زي العد
  // التنازلي لقفل تسجيل الدخول) لازم يتسجل هنا عبر _registerPollTimer
  // بدل ما يُستخدَم setInterval مباشرة. _clearSession (اللي بتتنادى من
  // تسجيل الخروج اليدوي وكمان من _handleSessionExpired) بقت توقفهم كلهم
  // دفعة واحدة تلقائيًا.
  // ─────────────────────────────────────────────────────────────
  APP._activePollTimers = APP._activePollTimers || [];
  function _registerPollTimer(id) {
    APP._activePollTimers.push(id);
    return id;
  }
  function _clearAllPollTimers() {
    (APP._activePollTimers || []).forEach(function (id) {
      try {
        clearInterval(id);
      } catch (e) {}
    });
    APP._activePollTimers = [];
    // إعادة تعيين علامة "بدأ التشغيل" الخاصة بمؤقت مركز الإشعارات
    // (UM.checkOnLogin) عشان يُعاد تشغيله بشكل صحيح بعد أي دخول تالٍ
    if (typeof UM !== "undefined" && UM) UM._feedTimerStarted = false;
  }

  function _clearSession() {
    SESSION.token = null;
    SESSION.expiresAt = null;
    SESSION._warningShown = false;
    _stopIdleWatcher();
    _stopSessionCountdown();
    _clearAllPollTimers();
    var _banner = document.getElementById("__session-warning");
    if (_banner) _banner.remove();
    try {
      localStorage.removeItem("wms_session_token");
      localStorage.removeItem("wms_session_expires");
      localStorage.removeItem("wms_session_idle_min");
    } catch (e) {}
  }

  // ─────────────────────────────────────────────────────────────
  // [FIX-MULTITAB-LOGOUT] مزامنة تسجيل الخروج بين تابات نفس المتصفح.
  // بما إن توكن الجلسة بقى في localStorage (مشترك)، أي تاب يعمل تسجيل
  // خروج (أو ينتهي جلسته) يمسح المفتاح، فبتوصل event "storage" لكل
  // التابات التانية المفتوحة على نفس الأصل فورًا — فبنسجّل خروج التاب ده
  // كمان محليًا (من غير ما نبعت طلب logout تاني للسيرفر، لأنه اتبعت
  // بالفعل من التاب اللي عمل الخروج الأصلي).
  // ─────────────────────────────────────────────────────────────
  window.addEventListener("storage", function (e) {
    if (e.key !== "wms_session_token") return;
    if (e.newValue || !APP.currentUser) return; // لسه فيه توكن، أو التاب ده أصلاً مش مسجّل دخول
    _clearSession();
    APP.currentUser = null;
    APP.currentPage = "dashboard";
    try {
      _preloadDone = false;
    } catch (err) {}
    APP.extLoaded = false;
    APP.extLoading = false;
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML = renderLogin();
      bindLogin();
    }
    setTimeout(function () {
      var errEl = document.getElementById("login-err");
      if (errEl) {
        errEl.style.display = "block";
        errEl.style.background = "var(--warning-soft,#fef3c7)";
        errEl.style.color = "var(--warning-dark,#92400e)";
        errEl.textContent = "🔒 تم تسجيل الخروج من تاب آخر لنفس الحساب";
      }
    }, 100);
  });

  // ── Idle Watcher ──────────────────────────────────────────
  var _idleLastActivity = Date.now();
  var _idleDebounceTimer = null; // v4.2: Debounce لتقليل العبء

  function _resetIdleTimer() {
    // Debounce: نحدّث فقط كل 300ms بدل كل حدث
    if (_idleDebounceTimer) return;
    _idleDebounceTimer = setTimeout(function () {
      _idleDebounceTimer = null;
      _idleLastActivity = Date.now();
      SESSION._warningShown = false;
      var banner = document.getElementById("__session-warning");
      if (banner) banner.remove();
    }, 300);
  }

  function _startIdleWatcher() {
    _stopIdleWatcher();
    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(
      function (ev) {
        document.addEventListener(ev, _resetIdleTimer, { passive: true });
      },
    );
    SESSION._idleTimer = setInterval(function () {
      if (!SESSION.token || !APP.currentUser) return;
      var idleSec = (Date.now() - _idleLastActivity) / 1000;
      var idleLimit = SESSION.idleTimeout * 60;
      var warnAt = idleLimit - SESSION.WARN_BEFORE_MIN * 60;
      if (idleSec >= idleLimit) {
        _handleSessionExpired("timeout");
      } else if (idleSec >= warnAt && !SESSION._warningShown) {
        SESSION._warningShown = true;
        _showIdleWarning(Math.ceil((idleLimit - idleSec) / 60));
      }
    }, 30000);
  }

  function _stopIdleWatcher() {
    if (SESSION._idleTimer) {
      clearInterval(SESSION._idleTimer);
      SESSION._idleTimer = null;
    }
    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(
      function (ev) {
        document.removeEventListener(ev, _resetIdleTimer);
      },
    );
  }

  function _startSessionCountdown() {
    _stopSessionCountdown();
    SESSION._countdownTimer = setInterval(function () {
      if (!SESSION.token || !APP.currentUser) return;
      var remaining = SESSION.expiresAt - Date.now();
      if (remaining <= 0) {
        _handleSessionExpired("expired");
        return;
      }
      if (remaining < 10 * 60 * 1000 && !SESSION._warningShown) {
        SESSION._warningShown = true;
        _showIdleWarning(Math.ceil(remaining / 60000));
      }
    }, 60000);
  }

  function _stopSessionCountdown() {
    if (SESSION._countdownTimer) {
      clearInterval(SESSION._countdownTimer);
      SESSION._countdownTimer = null;
    }
  }

  // ── Session Warning Banner ─────────────────────────────────
  function _showIdleWarning(remainingMinutes) {
    var existing = document.getElementById("__session-warning");
    if (existing) existing.remove();

    if (!document.getElementById("__session-banner-style")) {
      var st = document.createElement("style");
      st.id = "__session-banner-style";
      st.textContent =
        "@keyframes __bannerSlide{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}";
      document.head.appendChild(st);
    }

    var countdownId = "__sc-" + Date.now();
    var banner = document.createElement("div");
    banner.id = "__session-warning";
    banner.style.cssText =
      "position:fixed;top:0;left:0;right:0;z-index:999999;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--font-arabic,sans-serif);direction:rtl;box-shadow:0 4px 20px rgba(0,0,0,0.25);animation:__bannerSlide 0.4s cubic-bezier(0.34,1.4,0.64,1) forwards";
    banner.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;flex:1">' +
      '<span style="font-size:20px">⏰</span>' +
      "<div>" +
      '<div style="font-size:13px;font-weight:800">تنبيه: ستنتهي جلستك قريباً</div>' +
      '<div style="font-size:12px;opacity:0.9">ستنتهي الجلسة بعد <strong id="' +
      countdownId +
      '">' +
      remainingMinutes +
      "</strong> دقيقة بسبب عدم النشاط</div>" +
      "</div>" +
      "</div>" +
      '<div style="display:flex;gap:8px;flex-shrink:0">' +
      '<button onclick="_extendSession()" style="background:rgba(255,255,255,0.2);color:#fff;border:1.5px solid rgba(255,255,255,0.5);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-arabic,sans-serif)">🔄 متابعة الجلسة</button>' +
      // [SESSION-LIFECYCLE-P1] خيار صريح لتسجيل الخروج فورًا بدل ما يستنى
      // المستخدم انتهاء العدّاد — بينفّذ نفس مسار الخروج المنظّم (تنظيف
      // واجهة + حفظ مسودة لو فيه تعديلات) بدل قطع مفاجئ.
      '<button onclick="typeof SessionLifecycle !== \'undefined\' ? SessionLifecycle.beginGracefulShutdown(\'manual\') : _handleSessionExpired(\'manual\')" style="background:rgba(0,0,0,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.35);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-arabic,sans-serif)">🚪 تسجيل الخروج الآن</button>' +
      '<button onclick="document.getElementById(\'__session-warning\').remove();SESSION._warningShown=false" style="background:transparent;color:rgba(255,255,255,0.7);border:none;padding:6px;font-size:16px;cursor:pointer">✕</button>' +
      "</div>";
    document.body.appendChild(banner);

    var cd = remainingMinutes;
    var cdTimer = setInterval(function () {
      cd--;
      var el = document.getElementById(countdownId);
      if (el) el.textContent = cd;
      if (cd <= 0) clearInterval(cdTimer);
    }, 60000);
  }

  function _extendSession() {
    if (!SESSION.token) return;
    DL.Users.refreshSession(SESSION.token, {
      label: "Shell.extendSession",
      onSuccess: function (result) {
        var res = result.data;
        if (res && res.valid) {
          _resetIdleTimer();
          var banner = document.getElementById("__session-warning");
          if (banner) {
            banner.style.background = "linear-gradient(135deg,#10b981,#059669)";
            var title = banner.querySelector("div div div:first-child");
            if (title) title.textContent = "✅ تم تمديد الجلسة بنجاح";
            setTimeout(function () {
              if (banner.parentNode) banner.remove();
            }, 2000);
          }
          showToast(I18N.t("SHELL_MSG_SESSION_EXTEND_SUCCESS"), "success");
        } else {
          _handleSessionExpired("expired");
        }
      },
      onError: function () {
        showToast(I18N.t("SHELL_MSG_SESSION_EXTEND_FAIL"), "warning");
      },
    });
  }

  // ─────────────────────────────────────────────────────────────
  // §SEC-A2  [SESSION-FIX] كشف مركزي لأخطاء الجلسة القادمة من السيرفر
  //
  // المشكلة: 281+ نقطة استدعاء في الباك إند كانت ترفض الطلب برسالة "جلسة غير
  // صالحة" (عبر _checkPermission وغيرها)، لكن الواجهة كانت تعرض الرسالة كـ
  // toast عادي في مكان الشاشة فقط (NotificationService.error / showToast)
  // بدون أي ربط بدورة حياة الجلسة الفعلية — فيظهر الخطأ في أي مكان بدون أي
  // تفسير أو إجراء تالٍ، والمستخدم يفضل عالق على نفس الشاشة المعطوبة.
  // بينما _handleSessionExpired (اللي بيعمل logout نظيف + يرجّع شاشة الدخول
  // مع رسالة واضحة) كان موصول فقط بمؤقت الخمول الجانب-عميل، مش بردود
  // السيرفر الفعلية.
  //
  // الحل: أي دالة backend ترفض بسبب جلسة الآن ترجع code:"SESSION_INVALID"
  // (راجع errResponse في Code_12_Core.gs). هذه الدالة تفحص الـ code أولاً
  // (الاعتماد الأساسي)، مع fallback لمطابقة نص الرسالة للدوال القديمة التي
  // لم تُحدَّث بعد. تُستدعى من _gsr (31_JS_DataLayer.html) و SaveEngine
  // (32_JS_SaveEngine.html) في نقطة واحدة موحّدة.
  // ─────────────────────────────────────────────────────────────
  function _isSessionErrorResponse(raw) {
    if (!raw || typeof raw !== "object") return false;
    if (raw.code === "SESSION_INVALID") return true;
    var msg = String(raw.message || "");
    // [SESSION-FIX-2] شيلنا "خطأ في التحقق من الهوية" من الـ pattern عمداً:
    // الرسالة دي بتطلع لما يوزرنيم مُستنتَج (من دالة سيرفر عندها باج، أو
    // من بيانات مُرسَلة غلط) مايطابقش صاحب التوكن الفعلي — الجلسة/التوكن
    // نفسه لسه سليم 100%. تسجيل خروج المستخدم في الحالة دي كان بيبان
    // "بيخرجني من النظام لما تحصل أي مشكلة"، رغم إن جلسته أصلاً سليمة.
    // الحالات الحقيقية لجلسة منتهية/باطلة كلها بترجع code:"SESSION_INVALID"
    // أعلى، فمتغطّاش بردو من غير الـ regex ده.
    return /جلسة غير صالحة|جلستك انتهت|جلسة.*منتهية/.test(msg);
  }

  // [SESSION-LIFECYCLE-P1] بدل ما تقفل الجلسة فورًا وتقطع أي شاشة/مودال/
  // درور مفتوح، بتنادي أولاً محرك الخروج المنظّم (48_JS_SessionLifecycleEngine.html)
  // اللي بيفحص العمليات الجارية وعناصر الواجهة المفتوحة، يقفلها بالترتيب،
  // يحفظ أي تعديلات غير محفوظة كمسودة، وبعدين هو نفسه بينادي منطق إنهاء
  // الجلسة الفعلي. لو المحرك مش متحمّل لأي سبب (تحميل جزئي/خطأ)، نرجع
  // لنفس السلوك القديم المباشر كـ fallback.
  function _handleSessionExpired(reason) {
    if (
      typeof SessionLifecycle !== "undefined" &&
      !SessionLifecycle.isShuttingDown()
    ) {
      SessionLifecycle.beginGracefulShutdown(reason);
      return;
    }
    if (typeof SessionLifecycle !== "undefined") return; // إنهاء شغّال بالفعل

    var token = SESSION.token;
    var username = APP.currentUser ? APP.currentUser.username : null;
    _clearSession();
    if (token) {
      try {
        DL.Users.logout(token, username, {
          onSuccess: function () {},
          onError: function () {},
        });
      } catch (e) {}
    }
    APP.currentUser = null;
    APP.currentPage = "dashboard";
    // [PRELOAD-RESET] إعادة تعيين علامة الـ preload عند اللوج اوت
    try {
      _preloadDone = false;
    } catch (e) {}
    APP.extLoaded = false;
    APP.extLoading = false;
    try {
      sessionStorage.clear();
    } catch (e) {}
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML = renderLogin();
      bindLogin();
    }
    var msgs = {
      timeout: "⏰ انتهت جلستك بسبب عدم النشاط — يرجى تسجيل الدخول مجدداً",
      expired: "🔒 انتهت صلاحية الجلسة — يرجى تسجيل الدخول مجدداً",
      invalid: "⛔ جلستك غير صالحة أو انتهت — يرجى تسجيل الدخول مجدداً",
    };
    setTimeout(function () {
      var errEl = document.getElementById("login-err");
      if (errEl) {
        errEl.style.display = "block";
        errEl.style.background = "var(--warning-soft,#fef3c7)";
        errEl.style.color = "var(--warning-dark,#92400e)";
        errEl.textContent = msgs[reason] || msgs.expired;
      }
    }, 100);
  }

  // ─────────────────────────────────────────────────────────────
  // §SEC-B  Rate Limit UI v4.2 — عداد الحظر (مُزامَن مع Backend)
  //
  // التغييرات عن v4.1:
  //  [1] _startLockCountdown تقبل lockedUntil (timestamp مطلق)
  //      بدل seconds نسبية — يضمن استمرار العداد بعد Refresh
  //  [2] _showAttemptsWarning — شريط تحذير المحاولات المتبقية
  //  [3] _handleLoginResponse — معالج موحَّد لردود البنكند
  //  [4] حُذفت _handleRateLimitError (كانت تُشغّل عداداً جديداً
  //      من الصفر بدل استئناف الوقت المتبقي الحقيقي)
  // ─────────────────────────────────────────────────────────────

  var _loginLockTimer = null;
  var _loginLockEnds = null; // timestamp مطلق (ms) مُزامَن مع Backend

  // ─────────────────────────────────────────────────────────────
  // [SEC-LOGIN-CAPTCHA] تحدي بشري بسيط (كابتشا رياضية داخلية) —
  // طبقة احتكاك إضافية أمام السكربتات الآلية، تظهر بعد محاولتين
  // فاشلتين (remainingAttempts <= 3 من أصل MAX_ATTEMPTS=5).
  // ⚠️ هذه ليست بديلاً عن الحماية الحقيقية — الحماية الفعلية تظل
  // بالكامل في الباك اند (_checkRateLimit / _recordFailedAttempt في
  // Code_12_Core.gs)؛ هذه فقط تُبطئ محاولات السكربتات الآلية البسيطة
  // من الفرونت قبل ما تتحرك أصلاً، ومفيش أي تحقق منها في السيرفر.
  // ─────────────────────────────────────────────────────────────
  var _loginCaptchaRequired = false;
  var _loginCaptchaAnswer = null;

  function _renderLoginCaptcha() {
    var existing = document.getElementById("__login-captcha");
    if (existing) existing.remove();

    var a = 1 + Math.floor(Math.random() * 9);
    var b = 1 + Math.floor(Math.random() * 9);
    _loginCaptchaAnswer = a + b;
    _loginCaptchaRequired = true;

    var box = document.createElement("div");
    box.id = "__login-captcha";
    box.className = "login-captcha-box";
    box.innerHTML =
      '<div class="login-captcha-row">' +
      '<span class="login-captcha-q">' +
      a +
      " + " +
      b +
      " = ؟</span>" +
      '<input type="text" inputmode="numeric" maxlength="3" id="__captcha-input" class="input" placeholder="' +
      esc(I18N.t("SHELL_CAPTCHA_PLACEHOLDER")) +
      '">' +
      '<span id="__captcha-ok" style="display:none" class="login-captcha-ok">✔</span>' +
      "</div>" +
      '<div style="font-size:10.5px;color:var(--palette-slate-500,#94a3b8);margin-top:6px">' +
      esc(I18N.t("SHELL_CAPTCHA_HINT")) +
      "</div>";

    var errEl = document.getElementById("login-err");
    if (errEl && errEl.parentNode)
      errEl.parentNode.insertBefore(box, errEl.nextSibling);

    var input = document.getElementById("__captcha-input");
    var okMark = document.getElementById("__captcha-ok");
    input.addEventListener("input", function () {
      if (parseInt(input.value, 10) === _loginCaptchaAnswer) {
        _loginCaptchaRequired = false;
        okMark.style.display = "inline";
        input.disabled = true;
        input.style.borderColor = "#22c55e";
      } else {
        okMark.style.display = "none";
      }
    });
  }

  function _removeLoginCaptcha() {
    _loginCaptchaRequired = false;
    _loginCaptchaAnswer = null;
    var box = document.getElementById("__login-captcha");
    if (box) box.remove();
  }

  /**
   * _startLockCountdown — يبدأ عداد الحظر المرئي (v4.2)
   *
   * @param {number} lockedUntil — timestamp مطلق (ms) من Backend
   *
   * ⚠️ الفرق عن v4.1: كانت تأخذ "seconds" وتحسب النهاية في الفرونت.
   * الآن تأخذ timestamp مطلقاً من البنكند مباشرة، فعند Refresh
   * يُعاد نفس الـ lockedUntil من البنكند والعداد يستأنف بدقة.
   */
  function _startLockCountdown(lockedUntil) {
    _loginLockEnds = lockedUntil;
    var remaining = Math.ceil((lockedUntil - Date.now()) / 1000);
    if (remaining <= 0) {
      _removeLockBanner();
      _enableLoginForm();
      return;
    }
    _renderLockBanner(remaining);
    if (_loginLockTimer) clearInterval(_loginLockTimer);
    _loginLockTimer = setInterval(function () {
      var rem = Math.ceil((_loginLockEnds - Date.now()) / 1000);
      if (rem <= 0) {
        clearInterval(_loginLockTimer);
        _loginLockTimer = null;
        _loginLockEnds = null;
        _removeLockBanner();
        _enableLoginForm();
        return;
      }
      _updateLockBanner(rem);
    }, 1000);
    _disableLoginForm();
  }

  /**
   * _showAttemptsWarning — شريط تحذير المحاولات المتبقية (جديد v4.2)
   * يظهر أسفل رسالة الخطأ بلون برتقالي قبل الوصول للقفل
   */
  function _showAttemptsWarning(remaining) {
    var existing = document.getElementById("__attempts-warn");
    if (existing) existing.remove();
    if (remaining === 1) return; // مش هنحذر — سيُغلق الحساب في المحاولة الجاية مباشرة
    var text = "";
    if (remaining === 2) text = "⚠️ تبقَّت محاولتان قبل إغلاق الحساب";
    else text = "⚠️ تبقَّت " + remaining + " محاولات قبل إغلاق الحساب";
    var warn = document.createElement("div");
    warn.id = "__attempts-warn";
    warn.style.cssText =
      "background:var(--warning-soft,#fef3c7);border:1.5px solid var(--warning,#f59e0b);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13px;font-weight:600;color:var(--warning-dark,#92400e);direction:rtl;text-align:center;animation:__fadeIn 0.3s ease";
    warn.textContent = text;
    var errEl = document.getElementById("login-err");
    if (errEl && errEl.parentNode)
      errEl.parentNode.insertBefore(warn, errEl.nextSibling);

    // [SEC-LOGIN-CAPTCHA] بعد محاولتين فاشلتين (باقي 3 من 5) — فعّل
    // التحدي البشري كطبقة احتكاك إضافية قبل القفل الكامل من الباك اند
    if (remaining <= 3) _renderLoginCaptcha();
  }

  function _fmtCountdown(s) {
    var m = Math.floor(s / 60),
      sc = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (sc < 10 ? "0" : "") + sc;
  }

  function _renderLockBanner(seconds) {
    var existing = document.getElementById("__lock-banner");
    if (existing) existing.remove();
    if (!document.getElementById("__lock-style")) {
      var st = document.createElement("style");
      st.id = "__lock-style";
      st.textContent =
        "@keyframes __fadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}";
      document.head.appendChild(st);
    }
    var banner = document.createElement("div");
    banner.id = "__lock-banner";
    banner.style.cssText =
      "background:var(--danger-soft,#fee2e2);border:2px solid var(--danger,#ef4444);border-radius:12px;padding:16px 20px;margin:12px 0;direction:rtl;text-align:center;animation:__fadeIn 0.3s ease forwards";
    banner.innerHTML =
      '<div style="font-size:28px;margin-bottom:8px">🔒</div>' +
      '<div style="font-size:14px;font-weight:800;color:var(--danger,#ef4444);margin-bottom:6px">تم تأمين الحساب مؤقتاً</div>' +
      '<div style="font-size:12px;color:var(--text2,#475569);margin-bottom:12px">بسبب محاولات دخول متكررة — يمكنك المحاولة مجدداً بعد:</div>' +
      '<div id="__lock-countdown" style="font-size:36px;font-weight:900;font-family:var(--font-mono,monospace);color:var(--danger,#ef4444);letter-spacing:4px;background:var(--surface,#fff);border-radius:8px;padding:8px 20px;display:inline-block;border:2px solid var(--danger,#ef4444)">' +
      _fmtCountdown(seconds) +
      "</div>" +
      '<div style="font-size:11px;color:var(--text3,#94a3b8);margin-top:10px">🛡️ هذا الإجراء يحمي حسابك من الاختراق</div>' +
      '<div style="font-size:10px;color:var(--text3,#94a3b8);margin-top:4px">القفل يُطبَّق من الخادم — لا يمكن تجاوزه بإعادة تحميل الصفحة</div>';
    var errEl = document.getElementById("login-err");
    if (errEl && errEl.parentNode)
      errEl.parentNode.insertBefore(banner, errEl.nextSibling);
  }

  function _updateLockBanner(remaining) {
    var el = document.getElementById("__lock-countdown");
    if (el) el.textContent = _fmtCountdown(remaining);
  }
  function _removeLockBanner() {
    var b = document.getElementById("__lock-banner");
    if (b) b.remove();
    var w = document.getElementById("__attempts-warn");
    if (w) w.remove();
  }
  function _disableLoginForm() {
    var btn = document.getElementById("btn-login"),
      u = document.getElementById("l-user"),
      p = document.getElementById("l-pass");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = _loginBtnHTML(
        I18N.t("SHELL_MSG_ACCOUNT_LOCKED_SHORT"),
        true,
      );
    }
    if (u) u.disabled = true;
    if (p) p.disabled = true;
  }
  function _enableLoginForm() {
    var btn = document.getElementById("btn-login"),
      u = document.getElementById("l-user"),
      p = document.getElementById("l-pass");
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = _loginBtnHTML(I18N.t("SHELL_BTN_LOGIN"));
    }
    if (u) {
      u.disabled = false;
      u.value = "";
    }
    if (p) {
      p.disabled = false;
      p.value = "";
    }
    var err = document.getElementById("login-err");
    if (err) err.style.display = "none";
    _removeLoginCaptcha();
    showToast(I18N.t("SHELL_MSG_LOGIN_RETRY_ALLOWED"), "success");
  }

  // ─────────────────────────────────────────────────────────────
  // §G  Auth UI — doLogin · doLogout (نسخ مُحسَّنة)
  // ─────────────────────────────────────────────────────────────

  function doLogin() {
    // ── حراسة Frontend (ليست الأساسية — Backend هو الحارس) ───
    if (_loginLockEnds && Date.now() < _loginLockEnds) {
      showToast(I18N.t("SHELL_MSG_ACCOUNT_LOCKED_WAIT"), "error");
      return;
    }
    // [SEC-LOGIN-CAPTCHA] لازم يحل التحدي البشري الأول لو ظاهر
    if (_loginCaptchaRequired) {
      showToast(I18N.t("SHELL_CAPTCHA_REQUIRED"), "error");
      var capInp = document.getElementById("__captcha-input");
      if (capInp) capInp.focus();
      return;
    }
    var u = document.getElementById("l-user").value.trim();
    var p = document.getElementById("l-pass").value;
    var btn = document.getElementById("btn-login");
    var uInp = document.getElementById("l-user");
    var pInp = document.getElementById("l-pass");
    if (!u || !p) {
      showLoginErr(I18N.t("SHELL_MSG_FILL_ALL_FIELDS"));
      return;
    }

    // ── تذكّر اسم المستخدم لو العلامة مفعّلة ─────────────────
    _loginSaveRemember(u);

    btn.disabled = true;
    uInp.disabled = true;
    pInp.disabled = true;
    btn.innerHTML =
      '<span style="display:inline-flex;align-items:center;gap:8px">' +
      '<span style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;animation:spin 0.6s linear infinite;display:inline-block"></span>' +
      I18N.t("SHELL_MSG_LOGGING_IN") +
      "</span>";

    // ✅ double-rAF: يضمن أن المتصفح يرسم الـ Spinner قبل إرسال الطلب
    // الـ rAF الأول يدخل الـ frame الحالي، والثاني ينتظر بعد انتهاء الرسم
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        // [DATA-UNIFY] loginWithData بترجع success:false في حالات عمل عادية
        // (كلمة مرور خطأ / حساب مقفول) مش خطأ اتصال — فالمعالج ده بيستقبل
        // النتيجتين (عن طريق rawResponse:true في الـ Data Layer) ويميّز بينهم
        // داخلياً؛ onError الحقيقي بيتفعّل بس لو مفيش رد خالص من السيرفر.
        function _handleLoginResult(result) {
          var res = result.data;
          if (res === null || res === undefined) {
            btn.disabled = false;
            uInp.disabled = false;
            pInp.disabled = false;
            btn.innerHTML = _loginBtnHTML(I18N.t("SHELL_BTN_LOGIN"));
            showLoginErr(
              I18N.t("SHELL_MSG_CONNECTION_ERROR_PREFIX") +
                " " +
                result.message,
            );
            return;
          }
          {
            btn.disabled = false;
            uInp.disabled = false;
            pInp.disabled = false;
            btn.innerHTML = _loginBtnHTML(I18N.t("SHELL_BTN_LOGIN"));

            // ── ✅ دخول ناجح ─────────────────────────────────────
            if (res && res.success) {
              _loginLockTimer && clearInterval(_loginLockTimer);
              _loginLockEnds = null;
              _removeLockBanner();
              _removeLoginCaptcha();
              _initSession(res);
              APP.currentUser = res.user;

              // ✅ [FORCE-PW-1] إجبار تغيير كلمة المرور عند أول دخول (أو
              // بعد إعادة تعيينها من المدير) — لا يُسمح بالمتابعة لأي
              // شاشة أخرى قبل إتمام التغيير بنجاح عبر changeForcedPassword().
              // ⚠️ هذا الفحص لازم يجي قبل تعيين effectivePermissions، لأن
              // loginWithData بترجع effectivePermissions:[] فاضية في حالة
              // التغيير الإلزامي (تخطّت تحميل الصلاحيات عمداً) — لو عيّناها
              // هنا هتفضل [] عالقة على APP.currentUser حتى بعد نجاح التغيير
              // وتمنع canDo() من الرجوع لـ ROLE_PERMISSIONS الافتراضية.
              if (res.user && res.user.forcePasswordChange) {
                _showForcePasswordChangeScreen(res, p);
                return;
              }

              // الصلاحيات جاهزة مع الـ response (loginWithData دمجهم)
              if (res.effectivePermissions) {
                APP.currentUser.effectivePermissions = res.effectivePermissions;
                APP.currentUser.allRoles = res.allRoles || [];
              }

              // [AUDIO-LOGIN] صوت نجاح الدخول — لو AudioService الكامل وصل
              // فعلاً (حالة نادرة إنه كان محمّل من قبل)، استخدمه واحترم
              // إعدادات المستخدم (كتم/مستوى الصوت)؛ غير كده استخدم النغمة
              // المستقلة المضمونة (_playLoginChime) اللي متعرفهاش إعدادات
              // كتم — تجربة أول دخول أهم من احترام إعداد لسه ما اتحمّلش أصلاً.
              try {
                if (window.AS && typeof AS.loginSuccess === "function") {
                  AS.loginSuccess();
                } else {
                  _playLoginChime();
                }
              } catch (eAudio) {
                /* الصوت اختياري — أي خطأ فيه ميوقفش تسجيل الدخول */
              }

              _afterLoginSuccess(res);
              return;
            }

            // ── 🔒 حساب محظور — يُستخدم lockedUntil من Backend ──
            if (res && res.locked) {
              showLoginErr(
                res.message || I18N.t("SHELL_MSG_ACCOUNT_LOCKED_TEMP"),
              );
              var lockedUntil =
                res.lockedUntil ||
                Date.now() + (res.remainingSeconds || 15 * 60) * 1000;
              _startLockCountdown(lockedUntil);
              return;
            }

            // ── ❌ كلمة مرور خاطئة ───────────────────────────────
            var msg = (res && res.message) || "بيانات خاطئة";
            showLoginErr(msg);

            // عداد المحاولات المتبقية
            if (
              res &&
              typeof res.remainingAttempts === "number" &&
              res.remainingAttempts > 0
            ) {
              _showAttemptsWarning(res.remainingAttempts);
            }

            // هزّ النموذج
            var card = document.getElementById("login-box");
            if (card) {
              if (!document.getElementById("__shake-style")) {
                var ss = document.createElement("style");
                ss.id = "__shake-style";
                ss.textContent =
                  "@keyframes __shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}";
                document.head.appendChild(ss);
              }
              card.style.animation = "__shake 0.5s ease";
              card.addEventListener(
                "animationend",
                function () {
                  card.style.animation = "";
                },
                { once: true },
              );
            }
          }
        }

        // [PERF-LOGIN-INSTANT] بنستخدم loginLite بدل loginWithData —
        // بتتأكد بس من بيانات المستخدم وترجّع الصلاحيات، من غير ما
        // تستنى تحميل أي بيانات عمل. الداشبورد يفتح فورًا (render() بعد
        // شوية سطور تحت)، وبيانات العمل تتحمّل في الخلفية عبر
        // _afterLoginSuccess -> loadAllData().
        DL.Core.loginLite(u, p, {
          onSuccess: _handleLoginResult,
          onError: _handleLoginResult,
        });
      }); // end inner rAF
    }); // end outer rAF
  }

  /**
   * ✅ [FORCE-PW-1] كل ما كان يحدث بعد نجاح الدخول مباشرة (تحميل بيانات،
   * صلاحيات، رسم الصفحة...) — استُخرج في دالة مستقلة حتى يُعاد استخدامها
   * في مسارين: (أ) دخول ناجح عادي، (ب) بعد نجاح تغيير كلمة المرور
   * الإلزامي (حيث لا تتوفر عادةً res.data لأن loginWithData تخطّت تحميل
   * البيانات في هذه الحالة — فتُستكمل هنا عبر loadAllData العادية).
   */
  function _afterLoginSuccess(res) {
    // §AS — صوت تسجيل الدخول الناجح
    if (typeof AS !== "undefined") {
      try {
        AS.loginSuccess();
      } catch (e) {}
    }
    // ── [FIX-LOGIN-MULTI-RENDER] تحديد صفحة البداية *قبل* أي render ──
    // المشكلة القديمة: 4 مصادر مختلفة كانت كل واحدة منها بتنادي render()
    // أو renderPage() بنفسها لما بياناتها توصل (render() نفسها، تفضيل
    // default_page، البيانات الحقيقية لما توصل، وSessionLifecycle.
    // restoreAfterLogin) — يعني المستخدم كان بيشوف الداشبورد يترسم،
    // بعدين يترسم تاني بالبيانات الحقيقية، بعدين "يُقفش" لصفحته
    // الأخيرة قبل انتهاء الجلسة — كل ده في ثواني معدودة بعد اللوجين،
    // وكل قفشة بتقفل أي قائمة سايد بار مفتوحة وتصفّر التمرير. الحل:
    // نحدد الصفحة الصحيحة مرة واحدة هنا (أولوية: آخر صفحة كان فيها
    // المستخدم فعليًا > تفضيله الافتراضي > dashboard)، والرسم الفعلي
    // بعد كده بيحصل مرة واحدة على الصفحة الصحيحة من الأول.
    // [FORCE-DASHBOARD-ON-LOGIN] بطلب المستخدم: النظام دايمًا يفتح على
    // الداشبورد الرئيسية بعد اللوجين، بدون رجوع لآخر صفحة كان فيها قبل
    // انتهاء الجلسة.
    var _loginPageDecided = false;
    // ── [PRELOAD-ALL] تحميل كل البيانات بعد اللوجين مباشرة ──
    // يضمن إن 100% من الشاشات تلاقي بياناتها جاهزة في الكاش
    // [PERF-LOGIN-INSTANT] ملحوظة: النداء اتنقل لتحت (بعد ما APP.data
    // تتحمّل فعليًا) بدل ما ينادى هنا فورًا — لأن نداءه هنا وAPP.data
    // لسه فاضية كان بيخلّي _preloadAllAfterLogin نفسها تعمل نداء تاني
    // لـ getAllData() الثقيلة (forceRefresh) بالتوازي مع تحميلنا
    // الخفيف تحت، وده كان يسبب تعليق طويل على "جاري تحضير البيانات".
    // ── [USER-PREFS] تحميل تفضيلات المستخدم بعد اللوجين ──
    // [PREFS-WIRING] default_page: أول ما التفضيلات توصل (لوكال أو من
    // السيرفر)، لو فيها صفحة افتراضية مختلفة عن "dashboard" وكان المستخدم
    // لسه واقف على الداشبورد (يعني ما زحلقش بنفسه لصفحة تانية أثناء
    // التحميل)، نوديه لصفحته المفضّلة تلقائيًا.
    // ── [USER-PREFS] تحميل تفضيلات المستخدم بعد اللوجين ──
    // [PREFS-WIRING] default_page: أول ما التفضيلات توصل (لوكال أو من
    // السيرفر)، لو فيها صفحة افتراضية مختلفة عن "dashboard" وكان المستخدم
    // لسه واقف على الداشبورد (يعني ما زحلقش بنفسه لصفحة تانية أثناء
    // التحميل)، نوديه لصفحته المفضّلة تلقائيًا.
    if (typeof PreferenceService !== "undefined") {
      PreferenceService.load(function (prefs) {
        try {
          var dp = prefs && prefs.default_page;
          if (dp && dp !== "dashboard" && APP.currentPage === "dashboard") {
            APP.currentPage = dp;
            // [FIX-LOGIN-MULTI-RENDER] لو الرسم الأول لسه ما حصلش (نادر —
            // بس احتياط لو الكولباك ده اترجع أسرع من المتوقع)، بس نحدد
            // الصفحة وبس؛ الرسم الفعلي هيحصل بيها تلقائيًا من مصدره
            // الطبيعي تحت. لو الرسم الأول خلص فعلاً، دي تصحيح متأخر نادر
            // فبنعمل renderPage وحيدة تكميلية بدل ما نتجاهل التفضيل.
            if (_loginPageDecided && typeof renderPage === "function") {
              renderPage(dp);
            }
          }
        } catch (e) {}
      });
    }
    // ── [I18N] تحميل قاموس اللغة بعد اللوجين مباشرة (Lazy Loading لقاموس
    // لغة واحدة فقط — راجع 32_JS_i18n_Client.html) ثم تطبيقه على أي عناصر
    // data-i18n موجودة بالفعل في الـ DOM (مثل شاشة اللوجين نفسها لو كانت
    // مبنية بـ data-i18n قبل النجاح) —
    if (
      typeof I18N !== "undefined" &&
      APP.currentUser &&
      APP.currentUser.username
    ) {
      I18N.bootstrap(APP.currentUser.username, SESSION ? SESSION.token : null);
    }
    // [PERF-HR-DASH] إحصائيات لوحة HR
    if (typeof _silentPrefetchHRDash === "function") {
      setTimeout(_silentPrefetchHRDash, 2000);
    }
    render();
    _loginPageDecided = true;
    // ── [UPDATE-MGMT-MODULE] فحص "What's New" + البانر العلوي بعد اللوجين ──
    // مؤجَّل شوية عشان الواجهة الأساسية (renderLayout/render) تفضل هي
    // الأولوية أولاً، ومتوقف على وجود 41_JS_UpdateManagement (ملف مؤجل).
    setTimeout(function () {
      if (typeof UM !== "undefined" && UM.checkOnLogin) UM.checkOnLogin();
    }, 1200);
    // ── تهيئة المساعد الذكي بعد تسجيل الدخول ──
    // [PERF-LAZY-LOAD] initFloatingAI معرّفة في 09_JS_AIAssistant.html
    // (ملف مؤجل) — بنحرس النداء لو لسه ما اتحملش.
    setTimeout(function () {
      if (typeof initFloatingAI === "function") initFloatingAI();
    }, 600);
    // ── رسالة ترحيب من أيقون المساعد ──
    setTimeout(function () {
      var userName =
        APP.currentUser && APP.currentUser.full_name
          ? APP.currentUser.full_name.split(" ")[0]
          : "";
      var lowItems =
        APP.data && APP.data.items
          ? APP.data.items.filter(function (it) {
              var qty = 0;
              (APP.data.stock || []).forEach(function (s) {
                if (String(s.item_id) === String(it.id))
                  qty += Number(s.quantity || 0);
              });
              return Number(it.min_qty || 0) > 0 && qty <= Number(it.min_qty);
            }).length
          : 0;
      var msg =
        lowItems > 0
          ? "⚠️ " + lowItems + " أصناف تحت الحد الأدنى\nاضغط عليّ للتفاصيل!"
          : "👋 أهلاً" +
            (userName ? " " + userName : "") +
            "!\nأنا هنا لو احتجت شيء 🤖";
      showFABMessage(msg, 4000);
    }, 2000);

    // ── [LOGIN-STABLE] render واحد بس بعد اللوجين ──────────
    // نطبق أفضل البيانات المتاحة (res.data أو prefetch) ثم renderPage
    // مرة واحدة فقط — لا rerenders من loadAllData أو _light callbacks.

    var _bestData = null;

    // الأولوية: res.data (كاملة مع الـ response) > prefetch
    if (res.data && res.data.success !== false) {
      _bestData = _parseData(res.data);
    } else if (_prefetch.done && _prefetch.data) {
      _bestData = _parseData(_prefetch.data);
    }

    if (_bestData) {
      _saveCache(_bestData);
      APP.data = _bestData;
      APP.data._loaded = true;
      APP.companySettings =
        _bestData.companySettings || APP.companySettings || {};
      // [PERF-LAZY-LOAD] دوال من ملفات مؤجلة — بنحرس النداء (النظام
      // بينتظر جاهزية الحزمة المؤجلة قبل renderPage أصلاً، فالمفروض
      // دايمًا تكون جاهزة هنا، بس الحراسة هنا احتياط إضافي).
      if (typeof _applyCompanyBranding === "function") _applyCompanyBranding();
      if (typeof _syncColorsFromData === "function") _syncColorsFromData();

  // ✅ [FIX-LOGOUT-DUP-CONFIRM] الخطوات الفعلية لإنهاء الجلسة — اتفصلت هنا
  // عشان تتنادى مباشرة من أماكن اختار فيها المستخدم "تسجيل الخروج" بشكل
  // صريح ولا محتاجة تأكيد إضافي (زي رابط "تسجيل الخروج بدلاً من ذلك" في
  // شاشة إجبار تغيير كلمة المرور) — قبل كده كانت بتنادي doLogout() اللي
  // بتفتح modal "هل تريد تسجيل الخروج؟" فوق شاشة كانت أصلاً بتعرض
  // شاشة الدخول (لأن #root كان لسه شاشة اللوجين القديمة تحت الـ overlay)،
  // فيبان وكأن نافذة التأكيد ظهرت "بعد" الخروج مش قبله.
  function _performLogout() {
    var token = SESSION.token;
    var username = APP.currentUser ? APP.currentUser.username : null;
    if (token) {
      DL.Users.logout(token, username, {
        onSuccess: function () {},
        onError: function () {},
      });
    }
    // ── أغلق أي شاشة منسدلة (drawer) وأي قائمة منسدلة من الشمال قبل إنهاء الجلسة ──
    if (typeof closeDrawer === "function") closeDrawer(true);
    if (typeof _closeAllDropdowns === "function") _closeAllDropdowns();
    _clearSession();
    APP.currentUser = null;
    // ── [USER-PREFS] مسح الكاش عند تسجيل الخروج ──
    if (typeof PreferenceService !== "undefined") PreferenceService.clear();
    APP.currentPage = "dashboard";
    try {
      sessionStorage.clear();
    } catch (e) {}
    // ── إزالة المساعد الذكي عند الخروج (لإعادة تهيئته بشكل سليم عند الدخول التالي) ──
    var fabRoot = document.getElementById("ai-float-root");
    if (fabRoot) fabRoot.remove();
    // §AS — صوت تسجيل الخروج
    if (typeof AS !== "undefined") {
      try {
        AS.logout();
      } catch (e) {}
    }
    render();
  }

    showConfirm({

      iconColor: "#475569",
      title: I18N.t("SHELL_MSG_LOGOUT_TITLE"),
      message: I18N.t("SHELL_MSG_LOGOUT_CONFIRM"),
      confirmText: I18N.t("SHELL_BTN_LOGOUT"),
      confirmClass: "btn-danger",
      onConfirm: function (unfreeze) {
        unfreeze();
        _performLogout();
      },
    });
  }

  // ── Dismissed Alerts Helpers ──
  function _getDismissedAlerts() {
    try {
      return JSON.parse(localStorage.getItem("dismissedAlerts") || "[]");
    } catch (e) {
      return [];
    }
  }
  function _dismissAlert(key) {
    var list = _getDismissedAlerts();
    if (list.indexOf(key) === -1) list.push(key);
    localStorage.setItem("dismissedAlerts", JSON.stringify(list));
  }
  function _alertKey(item, colorName) {
    return item.id + "__" + (colorName || "__nocolor__");
  }

  function alertCount() {
    // ✅ [FIX-LAZY-LAYOUT] دفاع إضافي: لو اتنادت قبل ما 03_JS_Dashboard_Items
    // (اللي فيها getItemColors) تتحمّل، رجّع صفر بدل ما ترمي ReferenceError.
    if (typeof getItemColors !== "function") return 0;
    var dismissed = _getDismissedAlerts();
    var count = 0;
    APP.data.items.forEach(function (item) {
      var itemMinQ = Number(item.min_qty || 0);
      var colors = getItemColors(item.id);
      if (colors.length > 0) {
        colors.forEach(function (c) {
          var colorMinQ = Number(c.min_qty || 0);
          if (colorMinQ <= 0) colorMinQ = itemMinQ;
          if (colorMinQ <= 0) return;
          var colorQty = getColorQty(item.id, c.name);
          if (
            colorQty < colorMinQ &&
            dismissed.indexOf(_alertKey(item, c.name)) === -1
          )
            count++;
        });
      } else {
        if (itemMinQ <= 0) return;
        var currentQty = APP.data.stock
          .filter(function (s) {
            return s.item_id === item.id;
          })
          .reduce(function (a, s) {
            return a + Number(s.quantity || 0);
          }, 0);
        var totalQty = currentQty + getOpeningQty(item.id);
        if (
          totalQty < itemMinQ &&
          dismissed.indexOf(_alertKey(item, null)) === -1
        )
          count++;
      }
    });
    return count;
  }
  // ── تحديث عداد التنبيهات في الشريط الجانبي ──
  function updateAlertBadge() {
    // ✅ v4.2: المصدر الموحّد — غير المقروء فقط يظهر في الـ badge
    // لو الكل مقروء → الـ badge يختفي تماماً (السلوك المتوقع)
    var notifs = _buildNotifications();
    var readIds = _getReadIds();
    var count = notifs.filter(function (n) {
      return n.source === "engine" ? !n.read : readIds.indexOf(n.id) === -1;
    }).length;
    var navItem = document.querySelector('.nav-item[data-page="alerts"]');
    if (!navItem) return;
    var old = navItem.querySelector(".nav-badge");
    if (old) old.remove();
    if (count > 0) {
      var badge = document.createElement("span");
      badge.className = "nav-badge";
      badge.textContent = count > 99 ? "99+" : count;
      navItem.appendChild(badge);
    }
  }
  function dismissAlert(key) {
    _dismissAlert(key);
    // أخفي البطاقة بأنيميشن
    var card = document.querySelector('[data-alert-key="' + key + '"]');
    if (card) {
      card.style.opacity = "0";
      card.style.transform = "translateX(20px)";
      card.style.transition = "opacity .3s,transform .3s";
      setTimeout(function () {
        card.remove();
        // حدّث الـ badges والإحصائيات
        updateAlertBadge();
        _refreshAlertStats();
      }, 300);
    }
  }

  function _refreshAlertStats() {

  /** فلتر التبويبات في صفحة التنبيهات */
  function notifPageFilter(tab) {
    // تحديث أزرار التبويب
    ["all", "unread", "stock", "other"].forEach(function (t) {
      var btn = document.getElementById("ntab-" + t);
      if (btn) btn.classList.toggle("active", t === tab);
    });

    var items = document.querySelectorAll(".notif-full-item");
    var readIds = _getReadIds();

    items.forEach(function (el) {
      var nid = el.getAttribute("data-notif-id");
      var page = el.getAttribute("data-page");
      var isEngine = el.getAttribute("data-source") === "engine";
      var isUnread = isEngine
        ? el.classList.contains("unread")
        : readIds.indexOf(nid) === -1;
      var isStock = page === "alerts";

      var show = false;
      if (tab === "all") show = true;
      if (tab === "unread") show = isUnread;
      if (tab === "stock") show = isStock;
      if (tab === "other") show = !isStock;

      el.style.display = show ? "" : "none";
    });

    // عرض حالة فارغة لو لا يوجد نتائج
    var list = document.getElementById("notif-page-list");
    if (list) {
      var visible = Array.from(items).filter(function (el) {
        return el.style.display !== "none";
      });
      var existing = list.querySelector(".notif-full-empty");
      if (!visible.length && !existing) {
        var empty = document.createElement("div");
        empty.className = "notif-full-empty _filter-empty";
        empty.innerHTML =
          '<span class="empty-icon">✅</span><p style="font-weight:700;color:var(--text)">لا توجد تنبيهات في هذا التصنيف</p>';
        list.appendChild(empty);
      } else if (visible.length) {
        var fe = list.querySelector("._filter-empty");
        if (fe) fe.remove();
      }
    }
  }

  /** عند الضغط على إشعار في الصفحة الكاملة */
  function notifPageItemClick(el) {
    var nid = el.getAttribute("data-notif-id");
    var page = el.getAttribute("data-page");
    var isEngine = el.getAttribute("data-source") === "engine";
    if (!nid) return;

    // [UNIFY-NOTIF] بند من NotificationEngine — نفس نقطة الفتح الموحّدة
    // اللي بيستخدمها التوست والجرس بالظبط (mark read + navigate + صلاحية)
    if (isEngine) {
      if (typeof NotificationEngine !== "undefined") {
        NotificationEngine.openEntry(nid);
      }
      renderPage("alerts"); // إعادة رسم الصفحة عشان الحالة تتحدّث فورًا
      return;
    }

    // سجّل كمقروء
    var ids = _getReadIds();
    if (ids.indexOf(nid) === -1) {
      ids.push(nid);
      _saveReadIds(ids);
    }

    // تحديث مظهر العنصر فوراً
    el.classList.remove("unread");
    var strip = el.querySelector(".notif-full-unread-strip");
    if (strip) strip.remove();
    var ubadge = el.querySelector(".unread-badge");
    if (ubadge) {
      ubadge.classList.remove("unread-badge");
      ubadge.classList.add("read-badge");
      ubadge.textContent = "✓ مقروء";
    }
    var markBtn = el.querySelector(".notif-full-item-btn");
    if (markBtn) markBtn.remove();

    // تحديث الـ bell
    updateNotifBell();
    updateAlertBadge();

    // انتقل للصفحة المرتبطة
    if (page && page !== "alerts") navigate(page);
  }

  /** تحديد إشعار واحد كمقروء من زر ✓ */
  function notifPageMarkOneRead(nid) {
    var el = document.querySelector(
      '.notif-full-item[data-notif-id="' + nid + '"]',
    );
    var isEngine = el && el.getAttribute("data-source") === "engine";
    if (isEngine) {
      // [UNIFY-NOTIF] هنا فقط "تحديد كمقروء" بدون تنقّل — بنستخدم
      // markRead مباشرة (مش openEntry اللي بينقل الصفحة كمان)
      if (typeof NotificationEngine !== "undefined") {
        NotificationEngine.markRead(nid);
      }
    } else {
      var ids = _getReadIds();
      if (ids.indexOf(nid) === -1) {
        ids.push(nid);
        _saveReadIds(ids);
      }
    }
    // تحديث UI بدون إعادة رسم كاملة
    if (el) {
      el.classList.remove("unread");
      var strip = el.querySelector(".notif-full-unread-strip");
      if (strip) strip.remove();
      var ubadge = el.querySelector(".unread-badge");
      if (ubadge) {
        ubadge.classList.remove("unread-badge");
        ubadge.classList.add("read-badge");
        ubadge.textContent = "✓ مقروء";
      }
      var markBtn = el.querySelector(".notif-full-item-btn");
      if (markBtn) markBtn.remove();
    }
    updateNotifBell();
    updateAlertBadge();
    // تحديث شريط الأكشن (زر "تحديد الكل كمقروء")
    var actBar = document.querySelector(".notif-actions-bar");
    if (actBar) {
      var _rIds1 = _getReadIds();
      var remaining = _buildNotifications().filter(function (n) {
        return n.source === "engine" ? !n.read : _rIds1.indexOf(n.id) === -1;
      }).length;
      if (!remaining) {
        var btn = actBar.querySelector("button");

    // تحديث badge التبويبات
    var unreadTab = document.getElementById("ntab-unread");
    if (unreadTab) {
      var _rIds2 = _getReadIds();
      var remaining2 = _buildNotifications().filter(function (n) {
        return n.source === "engine" ? !n.read : _rIds2.indexOf(n.id) === -1;
      }).length;
      var badge = unreadTab.querySelector(".tab-badge");
      if (remaining2 > 0) {
        if (badge) badge.textContent = remaining2;
        else
          unreadTab.innerHTML =
            "غير مقروء <span class='tab-badge'>" + remaining2 + "</span>";
      } else {
        if (badge) badge.remove();
      }
    }
  }

  /** تحديد الكل كمقروء من صفحة التنبيهات */
  function notifPageMarkAllRead() {

    var ids = notifs
      .filter(function (n) {
